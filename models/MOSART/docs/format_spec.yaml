model:
  name: "MOSART"
  full_name: "MOSART-WM (mosartwmpy)"
  version: "0.7.0"
  domain: "river_routing_water_management"
  binary_path: "KISSPATH_PYTHON_ENV/bin/python"
  package: "mosartwmpy"
  repository: "https://github.com/IMMM-SFA/mosartwmpy"
  interface: "BMI (Basic Model Interface)"

inputs:
  forcing:
    - name: "QOVER"
      unit: "mm/s"
      description: "Surface runoff flux"
      valid_range: [0.0, 100.0]
    - name: "QDRAI"
      unit: "mm/s"
      description: "Subsurface drainage flux"
      valid_range: [0.0, 50.0]

  grid_domain:
    - name: "ID"
      unit: "-"
      description: "Unique cell identifier"
    - name: "dnID"
      unit: "-"
      description: "Downstream cell ID (-1 for outlet)"
    - name: "fdir"
      unit: "-"
      description: "D8 flow direction code"
    - name: "area"
      unit: "m2"
      description: "Local drainage area"
      valid_range: [0.0, 1.0e12]
    - name: "hslp"
      unit: "m/m"
      description: "Hillslope slope"
      valid_range: [0.0, 1.0]
    - name: "nh"
      unit: "s/m^(1/3)"
      description: "Hillslope Manning's n"
      valid_range: [0.01, 0.5]
    - name: "tslp"
      unit: "m/m"
      description: "Subnetwork slope"
      valid_range: [0.0, 1.0]
    - name: "twid"
      unit: "m"
      description: "Subnetwork bankfull width"
      valid_range: [0.0, 5000.0]
    - name: "nt"
      unit: "s/m^(1/3)"
      description: "Subnetwork Manning's n"
      valid_range: [0.01, 0.5]
    - name: "rlen"
      unit: "m"
      description: "Main channel length"
      valid_range: [0.0, 1.0e7]
    - name: "rslp"
      unit: "m/m"
      description: "Main channel slope"
      valid_range: [0.0, 1.0]
    - name: "rwid"
      unit: "m"
      description: "Main channel bankfull width"
      valid_range: [0.0, 50000.0]
    - name: "rdep"
      unit: "m"
      description: "Main channel bankfull depth"
      valid_range: [0.0, 100.0]
    - name: "nr"
      unit: "s/m^(1/3)"
      description: "Main channel Manning's n"
      valid_range: [0.01, 0.5]

  demand:
    - name: "totalDemand"
      unit: "m3/s"
      description: "Grid cell water demand rate"
      valid_range: [0.0, 10000.0]

  reservoirs:
    - name: "CAP_MCM"
      unit: "million m3"
      description: "Reservoir storage capacity"
      valid_range: [0.0, 200000.0]
    - name: "AREA_SKM"
      unit: "km2"
      description: "Reservoir surface area"
      valid_range: [0.0, 100000.0]

  parameters:
    critical:
      - name: "simulation.timestep"
        valid_range: [1, 86400]
        default: 10800
        description: "Main timestep in seconds (3 hours default)"
      - name: "simulation.subcycles"
        valid_range: [1, 100]
        default: 3
        description: "Subcycles per timestep"
      - name: "simulation.routing_iterations"
        valid_range: [1, 100]
        default: 5
        description: "Routing iterations per subcycle"
      - name: "simulation.output_resolution"
        valid_range: [3600, 2592000]
        default: 86400
        description: "Output averaging window in seconds (daily default)"
      - name: "water_management.enabled"
        valid_range: [false, true]
        default: true
        description: "Toggle reservoir/demand system"

outputs:
  primary:
    - name: "channel_outflow"
      unit: "m3/s"
      description: "Main channel outflow from grid cell"
      valid_range: [0.0, 100000.0]
    - name: "STORAGE_LIQ"
      unit: "m3"
      description: "Total routing storage"
      valid_range: [0.0, 1.0e12]
    - name: "RIVER_DISCHARGE_OVER_LAND_LIQ"
      unit: "m3/s"
      description: "River discharge"
      valid_range: [0.0, 100000.0]
    - name: "QSUR_LIQ"
      unit: "m3/s"
      description: "Hillslope surface runoff"
      valid_range: [0.0, 100000.0]
    - name: "QSUB_LIQ"
      unit: "m3/s"
      description: "Hillslope subsurface runoff"
      valid_range: [0.0, 100000.0]
    - name: "WRM_STORAGE"
      unit: "m3"
      description: "Water stored in reservoir"
      valid_range: [0.0, 1.0e12]
    - name: "WRM_SUPPLY"
      unit: "m3/s"
      description: "Supply delivered to grid cell"
      valid_range: [0.0, 100000.0]
    - name: "WRM_DEMAND"
      unit: "m3/s"
      description: "Demand requested by grid cell"
      valid_range: [0.0, 100000.0]
    - name: "WRM_DEFICIT"
      unit: "m3"
      description: "Cumulative unmet demand"
      valid_range: [0.0, 1.0e12]

known_issues:
  - "Runoff unit confusion: input mm/s, internal m/s and m3/s"
  - "Reservoir capacity in million m3 (CAP_MCM), not m3"
  - "Reservoir area in km2 (AREA_SKM), not m2"
  - "Timestep stability: too few subcycles causes CFL violation"
  - "Requires numpy<2.0 due to numba compatibility"
  - "Grid lat/lon must match exactly between grid, runoff, and demand files"
