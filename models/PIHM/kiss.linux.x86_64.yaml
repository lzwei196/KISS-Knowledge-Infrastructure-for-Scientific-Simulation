kiss_manifest_version: 1
model: PIHM
binary_type: ELF
verified: unverified
install_dir: MM-PIHM
acquire:
  strategy: build
  repo: https://github.com/PSUmodeling/MM-PIHM.git
  ref: 18422d0b016af52ccc59d027c9ba995551a36a06
  commands:
  - make cvode
  - make pihm
  produces: pihm
python_deps:
- numpy
- pandas
- netCDF4
system_deps:
- gcc
- g++
- git
- cmake
- make
- gfortran
reference_case: pihm --version
notes: 'LINUX x86_64 port of the macos recipe (kiss.macos.arm64.yaml): same source
  pin and product path; binary_type/system_deps adapted. Not yet verified on Linux.
  Same official main commit as prior Mac build; independent baseline lacked executable
  declaration. Native CVODE and pihm must be rebuilt and independently verified before
  observed status.'
agent_hint: Build bundled CVODE first then the official pihm target. Exact product
  <workspace>/binaries/MM-PIHM/pihm. Do not clone into workspace root or merely record
  a different discovery path. Verify native Mach-O startup and KI imports; no simulations
  or input acquisition.
