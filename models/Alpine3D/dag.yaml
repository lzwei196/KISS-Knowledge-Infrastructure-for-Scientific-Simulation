    richter2021_alpine3d_instability:
      short_citation: "Richter et al. 2021"
      doi: "10.1017/jog.2021.61"
      note: "Regional snow-instability modeling; SWE/HS most sensitive to precipitation; scaling precip to laser-scan depth cut HS error 37% to 17%; ~1 degC TA bias secondary."
    lehning2006_alpine3d_model:
