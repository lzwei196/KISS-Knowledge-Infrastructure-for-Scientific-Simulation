    - LD_LIBRARY_PATH
  remedy:
    action: Unset LD_LIBRARY_PATH before running Julia, or use a clean shell
    tool_to_run: ''
    manual_steps:
    - unset LD_LIBRARY_PATH
    - julia -e 'using Wflow'
    - If that works, add 'unset LD_LIBRARY_PATH' to the wflow wrapper script
    prevention: run_wflow.py should sanitize LD_LIBRARY_PATH before calling Julia.
  severity: fatal
  cross_references:
  - dt_w021
