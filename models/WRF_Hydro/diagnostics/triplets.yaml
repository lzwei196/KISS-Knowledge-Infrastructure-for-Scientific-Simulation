# ============================================================================
# Diagnostic Triplets -- WRF-Hydro v5.2.0 Standalone (NoahMP)
# ============================================================================
# 45 triplets covering 8 failure domains.
# 4 verified from Chaohe basin testing (dt_001, dt_002, dt_003, dt_005).
# 10 derived from domain expertise and common failure patterns.
# 6 verified from Bengbu basin testing (dt_v005-dt_v009, dt_015).
# 5 added from Bengbu 0.25deg comparison (dt_v010-dt_v014).
# 3 from arid basin cascade (dt_v036-dt_v038).
# 3 from physics options audit (dt_v039-dt_v041).
#
# Failure domains:
#   - parameter_format      : config files malformed or values out of range
#   - path_resolution       : files not found, wrong directory structure
#   - compilation           : model build failures
#   - silent_error          : no error shown, but output is scientifically wrong
#   - unit_conversion       : wrong units applied to physical quantities
#   - runtime               : model crashes during execution
#   - dependency_mismatch   : cross-component inconsistency
# ============================================================================

triplets:

  # ---- VERIFIED BUGS FROM CHAOHE TESTING ----

  - id: dt_001
    stage: "s4_fulldom"
    failure_domain: "parameter_format"
    symptom:
      description: "WRF-Hydro crashes at startup during routing initialization with 'Apparent error in network topology'. The error occurs when reading the Fulldom_hires.nc FLOWDIRECTION grid."
      error_pattern: "Apparent error in network topology"
      detection_method: "log_match"
    diagnosis:
      root_cause: "Boundary cells in Fulldom_hires.nc have non-zero FLOWDIRECTION values pointing outside the grid domain."
      explanation: >
        WhiteboxTools D8 pointer assigns flow directions to all cells including
        boundary cells. When these boundary cells have flow directions pointing
        outside the grid (e.g., a cell on the eastern edge pointing east), WRF-Hydro's
        routing module attempts to follow the flow path to a cell index that does not
        exist, triggering a topology check failure. The fix is to set all boundary
        cells (row 0, row ny-1, col 0, col nx-1) to FLOWDIRECTION=0 after the
        D8 computation. The build_fulldom_hires.py tool now handles this.
      affected_components:
        - "Fulldom_hires.nc FLOWDIRECTION"
        - "WRF-Hydro routing module (module_HYDRO_routing.F)"
    remedy:
      action: "Set FLOWDIRECTION=0 for all boundary cells in Fulldom_hires.nc"
      tool_to_run: "build_fulldom_hires"
      manual_steps:
        - "Open Fulldom_hires.nc with netCDF4 in write mode"
        - "fdir = ds['FLOWDIRECTION'][:]; fdir[0,:]=0; fdir[-1,:]=0; fdir[:,0]=0; fdir[:,-1]=0"
        - "ds['FLOWDIRECTION'][:] = fdir; ds.close()"
      prevention: "build_fulldom_hires.py automatically zeros boundary flow directions"
    severity: "fatal"
    cross_references: ["dt_010"]

  - id: dt_002
    stage: "s7_spatial_metadata"
    failure_domain: "parameter_format"
    symptom:
      description: "WRF-Hydro crashes at startup with 'Unable to get x resolution in LAND spatial metadata file'. The error occurs when reading GEOGRID_LDASOUT_Spatial_Metadata.nc."
      error_pattern: "Unable to get x resolution in LAND spatial metadata file"
      detection_method: "log_match"
    diagnosis:
      root_cause: "The x and/or y coordinate variables in GEOGRID_LDASOUT_Spatial_Metadata.nc are missing the 'resolution' attribute."
      explanation: >
        WRF-Hydro reads the grid spacing from the 'resolution' attribute of the x
        and y coordinate variables in the spatial metadata file. Standard netCDF
        conventions do not require this attribute, so many NetCDF creation tools omit
        it. The attribute must be a floating-point number equal to the LSM grid spacing
        (dx) in metres. Similarly, Fulldom_hires.nc x/y variables need 'resolution'
        equal to the routing grid spacing (dxrt). This is a WRF-Hydro-specific
        requirement not documented in standard CF conventions.
      affected_components:
        - "GEOGRID_LDASOUT_Spatial_Metadata.nc x and y variables"
        - "Fulldom_hires.nc x and y variables"
        - "WRF-Hydro module_RT_data.F (metadata reader)"
    remedy:
      action: "Add 'resolution' attribute to x and y coordinate variables in both files"
      tool_to_run: ""
      manual_steps:
        - "import netCDF4 as nc"
        - "ds = nc.Dataset('GEOGRID_LDASOUT_Spatial_Metadata.nc', 'a')"
        - "ds['x'].resolution = float(dx)  # e.g., 1000.0"
        - "ds['y'].resolution = float(dx)"
        - "ds.close()"
        - "Repeat for Fulldom_hires.nc with dxrt (e.g., 250.0)"
      prevention: "Always add 'resolution' attribute when creating x/y coordinate variables. Add to build_groundwater.py and build_fulldom_hires.py post-creation step."
    severity: "fatal"
    cross_references: ["dt_003"]

  - id: dt_003
    stage: "s4_fulldom"
    failure_domain: "parameter_format"
    symptom:
      description: "WRF-Hydro crashes at startup with 'Unable to find x coordinate in FullDom file'. Occurs when reading Fulldom_hires.nc."
      error_pattern: "Unable to find x coordinate in FullDom file"
      detection_method: "log_match"
    diagnosis:
      root_cause: "Fulldom_hires.nc is missing the x and/or y coordinate variables entirely, or the variables exist but lack the 'resolution' attribute that WRF-Hydro uses to locate them."
      explanation: >
        WRF-Hydro searches for 1D coordinate variables named 'x' and 'y' in
        Fulldom_hires.nc. These must be 1D arrays with dimension sizes matching the
        routing grid (nx_rt and ny_rt). If the file was created with only 2D
        LATITUDE/LONGITUDE variables (common in many GIS tools) but no 1D x/y
        projected coordinate arrays, WRF-Hydro cannot determine the routing grid
        geometry. The build_fulldom_hires.py tool creates these variables correctly.
      affected_components:
        - "Fulldom_hires.nc x and y coordinate variables"
        - "WRF-Hydro module_RT_data.F (Fulldom reader)"
    remedy:
      action: "Ensure Fulldom_hires.nc has 1D x(x) and y(y) coordinate variables with 'resolution' attribute"
      tool_to_run: "build_fulldom_hires"
      manual_steps:
        - "Rebuild Fulldom_hires.nc using build_fulldom_hires.py which creates x/y variables"
        - "Or manually add: x(x) = projected x-coordinates of cell centres, y(y) = projected y-coordinates"
        - "Add resolution attribute: ds['x'].resolution = dxrt; ds['y'].resolution = dyrt"
      prevention: "Always use build_fulldom_hires.py which creates proper 1D coordinate variables"
    severity: "fatal"
    cross_references: ["dt_002"]

  - id: dt_005
    stage: "s8_forcing"
    failure_domain: "path_resolution"
    symptom:
      description: "WRF-Hydro runs past the available forcing period and reports 'no forcing data found' or exits with missing input. Occurs when KHOUR extends beyond the last LDASIN file."
      error_pattern: "no forcing data found"
      detection_method: "log_match"
    diagnosis:
      root_cause: "The simulation end date in namelist.hrldas (KHOUR) extends beyond the last available LDASIN_DOMAIN1 file in the FORCING/ directory."
      explanation: >
        LDASIN files follow the naming convention YYYYMMDDHH.LDASIN_DOMAIN1. WRF-Hydro
        reads them sequentially at each FORCING_TIMESTEP. If the simulation tries to
        read a timestep for which no file exists (e.g., the end date is 2001-01-08 but
        the last file is 2001010723.LDASIN_DOMAIN1), the model either crashes or
        continues with zero forcing. This commonly happens when end_date in
        namelist.hrldas is set to the last day of forcing (inclusive), but KHOUR
        computation includes that full last day, requiring 00:00 of end_date+1.
      affected_components:
        - "FORCING/ directory LDASIN files"
        - "namelist.hrldas KHOUR"
        - "WRF-Hydro hrldas_drv_HYDRO.F (forcing reader)"
    remedy:
      action: "Ensure LDASIN files cover the full simulation period including hour 0 of end_date+1, or reduce KHOUR to match available forcing"
      tool_to_run: ""
      manual_steps:
        - "Count LDASIN files: ls FORCING/*.LDASIN_DOMAIN1 | wc -l"
        - "Compare with expected: (end_date - start_date + 1) * 24"
        - "If fewer files than expected, reduce end_date or generate more forcing"
        - "Check: the last LDASIN file timestamp should be >= simulation end time - 1 hour"
      prevention: "generate_namelists.py checks FORCING file count against KHOUR"
    severity: "fatal"
    cross_references: ["dt_011"]

  # ---- DOMAIN EXPERTISE TRIPLETS ----

  - id: dt_004
    stage: "s10_execution"
    failure_domain: "runtime"
    symptom:
      description: "WRF-Hydro crashes when writing CHRTOUT_GRID output files with 'Unable to place x floating point attributes' in the error log."
      error_pattern: "Unable to place x floating point attributes"
      detection_method: "log_match"
    diagnosis:
      root_cause: "The LCC projection produces x/y coordinate values larger than what NetCDF-4 single-precision float can represent precisely, causing attribute write failure."
      explanation: >
        When the projection origin is far from the basin (e.g., stand_lon is very
        different from basin longitude), the projected coordinates can exceed 1e7
        metres. CHRTOUT_GRID files attempt to write these as single-precision float
        attributes, which lose precision. This is a known WRF-Hydro limitation for
        domains far from the projection centre.
      affected_components:
        - "hydro.namelist CHRTOUT_GRID setting"
        - "WRF-Hydro io_netcdf.F"
    remedy:
      action: "Set CHRTOUT_GRID = 0 in hydro.namelist, or centre the projection closer to the basin"
      tool_to_run: ""
      manual_steps:
        - "Edit hydro.namelist: set CHRTOUT_GRID = 0"
        - "Or: re-run define_lambert_domain.py with --stand_lon closer to the basin centre"
      prevention: "define_lambert_domain.py defaults stand_lon to basin centre longitude, minimising coordinate magnitudes"
    severity: "fatal"
    cross_references: []

  - id: dt_006
    stage: "s0_config"
    failure_domain: "compilation"
    symptom:
      description: "WRF-Hydro compilation fails with 'undefined reference to nf90_open', 'undefined reference to nf90_create', and similar NetCDF Fortran binding errors."
      error_pattern: "undefined reference to nf90_"
      detection_method: "log_match"
    diagnosis:
      root_cause: "NETCDF_LIB environment variable points to /usr/lib/ instead of /usr/lib/x86_64-linux-gnu/ where libnetcdff.so actually resides on Ubuntu/Debian."
      explanation: >
        WRF-Hydro's configure script uses NETCDF_LIB to find the NetCDF Fortran library
        (libnetcdff.so). On Ubuntu/Debian systems, multiarch places libraries in
        /usr/lib/x86_64-linux-gnu/ rather than /usr/lib/. Setting NETCDF_LIB to the
        wrong path causes the linker to fail silently on -lnetcdff, producing unresolved
        symbol errors for all NetCDF Fortran API calls.
      affected_components:
        - "WRF-Hydro compile script (configure, Makefile)"
        - "System NetCDF installation"
    remedy:
      action: "Set NETCDF_LIB=/usr/lib/x86_64-linux-gnu/ before compiling"
      tool_to_run: ""
      manual_steps:
        - "export NETCDF_LIB=/usr/lib/x86_64-linux-gnu/"
        - "Verify: ls $NETCDF_LIB/libnetcdff.so (should exist)"
        - "Re-run configure and compile"
      prevention: "Document the correct NETCDF_LIB path in installation instructions"
    severity: "fatal"
    cross_references: []

  - id: dt_007
    stage: "s1_domain"
    failure_domain: "silent_error"
    symptom:
      description: "Basin boundary appears slightly shifted (~0.1-0.3%) relative to expected position. Forcing data and domain grid have subtle spatial misalignment. No error messages."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "LCC projection was built using WGS84 ellipsoid (semi-major 6378137 m) instead of the WRF sphere (R=6370000 m)."
      explanation: >
        WRF-Hydro internally uses a perfect sphere with radius 6370000 m for all
        Lambert Conformal projections. If domain construction tools use the standard
        WGS84 ellipsoid (which pyproj defaults to), all projected coordinates differ by
        approximately (6378137 - 6370000) / 6370000 = 0.128%. For a 100 km domain this
        means ~128 m offset — enough to shift grid cells and cause forcing/domain
        misalignment. The error is silent: the model runs and produces output, but
        spatial fields are subtly wrong.
      affected_components:
        - "define_lambert_domain.py projection string"
        - "All downstream tools that use the projection"
    remedy:
      action: "Always use +R=6370000 in PROJ.4 strings, never +ellps=WGS84"
      tool_to_run: "define_lambert_domain"
      manual_steps:
        - "Verify: proj4 string in domain_def.json contains '+R=6370000'"
        - "If it contains '+ellps=WGS84' or '+datum=WGS84', regenerate domain"
      prevention: "define_lambert_domain.py hardcodes WRF_EARTH_RADIUS = 6370000.0 and uses +R= in proj4 string"
    severity: "silent"
    cross_references: []

  - id: dt_008
    stage: "s2_geo_em"
    failure_domain: "silent_error"
    symptom:
      description: "WRF-Hydro runs but all cells behave as water. No runoff, no ET, no soil processes. LANDMASK appears to be all zeros despite land cells being present in the DEM."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "MMINLU global attribute in geo_em.d01.nc is not set to 'USGS'. WRF-Hydro uses MMINLU to select the land use classification scheme. If it is anything other than 'USGS' (e.g., 'MODIFIED_IGBP_MODIS_NOAH'), the ISWATER, ISICE, ISURBAN indices do not match the LU_INDEX values, causing misclassification."
      explanation: >
        With USGS classification, ISWATER=16, ISICE=24, ISURBAN=1. With MODIS,
        ISWATER=17, ISICE=15, ISURBAN=13. If geo_em has USGS LU_INDEX values (e.g.,
        class 7 = Grassland in USGS) but MMINLU says MODIS, WRF-Hydro interprets
        class 7 as 'Open Shrubland' (MODIS) and more critically, cells with LU_INDEX=16
        (Water in USGS) are NOT recognized as water, while all other cells may have
        wrong vegetation parameters. The UMD->USGS crosswalk in build_geo_em.py
        produces USGS values, so MMINLU must be "USGS".
      affected_components:
        - "geo_em.d01.nc MMINLU global attribute"
        - "geo_em.d01.nc LU_INDEX, LANDUSEF variables"
        - "WRF-Hydro Noah-MP vegetation parameter lookup"
    remedy:
      action: "Ensure MMINLU = 'USGS' in geo_em.d01.nc"
      tool_to_run: "build_geo_em"
      manual_steps:
        - "ncdump -h geo_em.d01.nc | grep MMINLU"
        - "If not 'USGS': ds = nc.Dataset('geo_em.d01.nc', 'a'); ds.MMINLU = 'USGS'; ds.close()"
        - "Also verify: ISWATER=16, ISICE=24, ISURBAN=1"
      prevention: "build_geo_em.py hardcodes MMINLU='USGS' and the UMD->USGS crosswalk table"
    severity: "silent"
    cross_references: []

  - id: dt_009
    stage: "s2_geo_em"
    failure_domain: "silent_error"
    symptom:
      description: "NaN values appear in soil temperature output (TSLB). Model may continue running but soil energy balance is corrupted. Affects high-elevation or edge cells."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "SOILTEMP variable in geo_em.d01.nc contains 0 K values for some land cells. These propagate as NaN when used as denominator or in exponential functions during soil temperature initialization."
      explanation: >
        SOILTEMP represents annual mean deep soil temperature in Kelvin. A value of 0 K
        is physically impossible and is typically used as a nodata marker for water cells.
        If a land cell erroneously gets SOILTEMP=0 K (due to incomplete data coverage
        or a masking error), the wrfinput construction interpolates between TSK=290 K
        and TMN=0 K, producing unrealistically cold soil temperatures. Noah-MP then
        encounters numerical instability in the soil energy balance. build_wrfinput.py
        replaces SOILTEMP < 200 K with TSK_DEFAULT=290 K as a safeguard.
      affected_components:
        - "geo_em.d01.nc SOILTEMP variable"
        - "wrfinput_d01.nc TMN and TSLB variables"
        - "Noah-MP soil energy balance"
    remedy:
      action: "Replace SOILTEMP=0K with a reasonable default (e.g., 280-290 K) for all land cells"
      tool_to_run: ""
      manual_steps:
        - "ds = nc.Dataset('geo_em.d01.nc', 'a')"
        - "st = ds['SOILTEMP'][0]; lm = ds['LANDMASK'][0]"
        - "bad = (st < 200) & (lm > 0.5)"
        - "st[bad] = 280.0  # reasonable default"
        - "ds['SOILTEMP'][0] = st; ds.close()"
      prevention: "build_geo_em.py computes SOILTEMP from elevation and latitude; build_wrfinput.py clamps TMN > 200 K"
    severity: "silent"
    cross_references: []

  - id: dt_010
    stage: "s4_fulldom"
    failure_domain: "silent_error"
    symptom:
      description: "Channel routing produces physically impossible flow patterns. Water flows uphill or in wrong directions. Discharge at outlet is near zero or negative. No error messages from WRF-Hydro."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "D8 flow direction encoding from WhiteboxTools was not converted to ArcGIS/WRF-Hydro encoding. The two systems assign different numeric codes to the same compass directions."
      explanation: >
        WhiteboxTools D8: 1=E, 2=NE, 4=N, 8=NW, 16=W, 32=SW, 64=S, 128=SE.
        WRF-Hydro (ArcGIS): 1=E, 2=SE, 4=S, 8=SW, 16=W, 32=NW, 64=N, 128=NE.
        Without conversion, a cell coded as 2 (NE in WBT) is interpreted as SE by
        WRF-Hydro. This silently reverses the N/S component of flow for all cells,
        producing completely wrong routing results. The model does NOT validate flow
        direction values — any integer is accepted.
      affected_components:
        - "Fulldom_hires.nc FLOWDIRECTION"
        - "WhiteboxTools d8_pointer output"
        - "WRF-Hydro routing module"
    remedy:
      action: "Apply the WBT-to-ArcGIS conversion table when building Fulldom_hires.nc"
      tool_to_run: "build_fulldom_hires"
      manual_steps:
        - "Use the WBT_TO_ARCGIS lookup table: {0:0, 1:1, 2:128, 4:64, 8:32, 16:16, 32:8, 64:4, 128:2}"
        - "Apply: fdir_arc[fdir_wbt == wbt_val] = arc_val for each entry"
      prevention: "build_fulldom_hires.py automatically applies the conversion"
    severity: "silent"
    cross_references: ["dt_001"]

  - id: dt_011
    stage: "s8_forcing"
    failure_domain: "unit_conversion"
    symptom:
      description: "Precipitation is ~10,800x too high. Runoff immediately saturates, soil moisture maxes out on first timestep. River discharge is orders of magnitude too large. Model may crash with numerical overflow."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "RAINRATE in LDASIN files is in mm/3hr instead of mm/s. The VIC forcing precipitation column (mm per 3-hour period) was written directly to LDASIN without dividing by 10800 seconds."
      explanation: >
        WRF-Hydro expects RAINRATE in mm/s (= kg/m^2/s). VIC forcing provides
        precipitation as accumulated amount per 3-hour interval (mm/3hr). If the raw
        VIC value (e.g., 3.0 mm/3hr) is written as 3.0 mm/s to LDASIN, that equals
        10800 mm/hr or 259,200 mm/day — equivalent to extreme rainfall every second.
        The model may still run for a few timesteps before numerical instability
        crashes it, or it may complete with completely unrealistic output.
      affected_components:
        - "convert_forcing_to_ldasin.py RAINRATE conversion"
        - "LDASIN RAINRATE variable"
    remedy:
      action: "Divide VIC precipitation by source_timestep_seconds (10800 for 3-hourly) to get mm/s"
      tool_to_run: "convert_forcing_to_ldasin"
      manual_steps:
        - "Verify: RAINRATE in first LDASIN file should be < 0.01 mm/s for normal conditions"
        - "If RAINRATE > 0.1 mm/s everywhere, the division was likely missing"
        - "Fix: RAINRATE = precip_mm3hr / 10800.0"
      prevention: "convert_forcing_to_ldasin.py uses precip_mm3hr_to_mmps() which divides by 10800"
    severity: "silent"
    cross_references: ["dt_012"]

  - id: dt_012
    stage: "s8_forcing"
    failure_domain: "unit_conversion"
    symptom:
      description: "Evapotranspiration is wildly wrong (too high or too low). Soil moisture evolution is unrealistic. Sensible/latent heat partitioning is wrong. No error messages."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Vapor pressure (kPa) from VIC forcing was passed directly as Q2D (specific humidity, kg/kg) in LDASIN files without conversion."
      explanation: >
        VIC forcing column 5 is vapor pressure in kPa (typical values: 0.5-3.0 kPa).
        WRF-Hydro expects Q2D as specific humidity in kg/kg (typical values: 0.002-0.020).
        The conversion requires: q = 0.622 * e_Pa / (Psfc_Pa - 0.378 * e_Pa), where
        e_Pa = VP_kPa * 1000. Passing kPa values directly as kg/kg gives specific
        humidity ~100-1000x too high, which Noah-MP interprets as near-saturated
        atmosphere, suppressing evapotranspiration and distorting the entire energy
        balance.
      affected_components:
        - "convert_forcing_to_ldasin.py Q2D conversion"
        - "LDASIN Q2D variable"
        - "Noah-MP surface energy balance"
    remedy:
      action: "Convert VP (kPa) to specific humidity (kg/kg) using the formula: q = 0.622 * e / (p - 0.378 * e)"
      tool_to_run: "convert_forcing_to_ldasin"
      manual_steps:
        - "Verify: Q2D in first LDASIN file should be 0.001-0.025 kg/kg"
        - "If Q2D > 0.1, vapor pressure was not converted"
        - "Fix: e_Pa = vp_kPa * 1000; q = 0.622 * e_Pa / (psfc_Pa - 0.378 * e_Pa)"
      prevention: "convert_forcing_to_ldasin.py uses vapor_pressure_to_specific_humidity() function"
    severity: "silent"
    cross_references: ["dt_011"]

  - id: dt_013
    stage: "s10_execution"
    failure_domain: "runtime"
    symptom:
      description: "WRF-Hydro crashes during routing with segmentation fault or CFL-related numerical instability. May produce NaN in streamflow before crashing."
      error_pattern: "SIGSEGV|Segmentation fault|NaN"
      detection_method: "log_match"
    diagnosis:
      root_cause: "DTRT_CH and/or DTRT_TER (routing timestep in seconds) are too large relative to the routing grid spacing DXRT, violating the CFL condition."
      explanation: >
        The diffusive wave routing scheme requires that the Courant number
        C = v * dt / dx < 1, where v is the wave velocity, dt is the routing timestep,
        and dx is the routing grid spacing. For DXRT=250m, DTRT=10s gives C ~0.04
        for typical velocities (1 m/s), which is safe. If DXRT is decreased to 100m
        but DTRT remains at 10s, C ~0.1 (still safe). However, if DTRT is set to
        300s with DXRT=250m, high-velocity channels can exceed C=1, causing numerical
        blowup. As a rule of thumb: DTRT (seconds) < DXRT (metres).
      affected_components:
        - "hydro.namelist DTRT_CH and DTRT_TER"
        - "hydro.namelist DXRT"
        - "WRF-Hydro routing module"
    remedy:
      action: "Reduce DTRT_CH and DTRT_TER to satisfy CFL: DTRT < DXRT (in seconds vs metres)"
      tool_to_run: ""
      manual_steps:
        - "Check: DXRT and DTRT_CH in hydro.namelist"
        - "Ensure DTRT_CH <= DXRT/10 for safety (e.g., DXRT=250, DTRT=10)"
        - "Reduce DTRT_CH and DTRT_TER if crash occurs"
      prevention: "generate_namelists.py sets DTRT_CH=10, DTRT_TER=10 which is safe for DXRT >= 100m"
    severity: "fatal"
    cross_references: ["dt_014"]

  - id: dt_014
    stage: "s10_execution"
    failure_domain: "dependency_mismatch"
    symptom:
      description: "WRF-Hydro runs to completion but channel discharge is zero everywhere. LDASOUT shows non-zero runoff but CHRTOUT streamflow = 0. No error messages."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "AGGFACTRT in hydro.namelist does not match the actual ratio between Fulldom_hires.nc dimensions and wrfinput_d01.nc dimensions."
      explanation: >
        AGGFACTRT tells WRF-Hydro how many routing cells fit in each LSM cell.
        If Fulldom was built with AGGFACTRT=4 (routing grid 4x finer), but
        hydro.namelist has AGGFACTRT=1, the model reads only 1/16th of the routing
        grid, leaving most of the channel network empty. The routing module processes
        an incorrect sub-grid and produces zero or near-zero discharge at the outlet.
        Similarly, if AGGFACTRT in the namelist is larger than the actual ratio,
        the model reads beyond the Fulldom array bounds and may crash or produce
        garbage values.
      affected_components:
        - "hydro.namelist AGGFACTRT"
        - "Fulldom_hires.nc dimensions"
        - "wrfinput_d01.nc dimensions"
    remedy:
      action: "Set AGGFACTRT = Fulldom_x_dim / wrfinput_x_dim"
      tool_to_run: "generate_namelists"
      manual_steps:
        - "Check: ncdump -h Fulldom_hires.nc | grep 'x =' for routing x dimension"
        - "Check: ncdump -h wrfinput_d01.nc | grep 'west_east =' for LSM x dimension"
        - "Compute: AGGFACTRT = routing_x / lsm_x (should be integer)"
        - "Update hydro.namelist: AGGFACTRT = <computed value>"
      prevention: "generate_namelists.py auto-detects AGGFACTRT from Fulldom and wrfinput dimensions"
    severity: "silent"
    cross_references: ["dt_013"]

  # ---- ADDED 2026-03-20 FROM SESSION FINDINGS ----

  - id: dt_015
    stage: "s9_namelists"
    failure_domain: "parameter_format"
    symptom:
      description: "WRF-Hydro runs to completion but produces no LDASOUT_DOMAIN1, GWOUT_DOMAIN1, or RESTART files. The simulation appears to succeed ('The model finished successfully') but the output directory contains only CHRTOUT files or nothing."
      error_pattern: "no LDASOUT|no GWOUT|output directory empty"
      detection_method: "missing_output"
    diagnosis:
      root_cause: "RESTART_FREQUENCY_HOURS is set to 0 in namelist.hrldas. WRF-Hydro interprets 0 as 'never write diagnostic/restart output'."
      explanation: >
        RESTART_FREQUENCY_HOURS controls how often WRF-Hydro writes LDASOUT and GWOUT
        diagnostic output files, not just restart files. When set to 0 (the default in
        some namelist templates), NO output files are written — the model runs, computes
        everything, but discards all diagnostic output. Set to -9999 to write at every
        OUTPUT_TIMESTEP, or to a positive integer (e.g., 1 for hourly, 24 for daily)
        for periodic output. This is a completely silent error — the model logs success.
      affected_components:
        - "namelist.hrldas RESTART_FREQUENCY_HOURS"
        - "LDASOUT_DOMAIN1 files"
        - "GWOUT_DOMAIN1 files"
        - "RESTART files"
    remedy:
      action: "Set RESTART_FREQUENCY_HOURS = -9999 (write at every output step) or a positive integer matching desired output interval"
      tool_to_run: "generate_namelists"
      manual_steps:
        - "Edit namelist.hrldas: set RESTART_FREQUENCY_HOURS = -9999"
        - "Re-run the simulation"
        - "Verify: ls *.LDASOUT_DOMAIN1 should show one file per output timestep"
      prevention: "generate_namelists.py defaults RESTART_FREQUENCY_HOURS to -9999"
    severity: "silent"
    cross_references: []
    verified: "2026-03-19"

  # ===========================================================================
  # VERIFIED ERRORS (Bengbu testing 2026-03-20)
