template_version: "3.5"

identity:
  model_id: "PRMS"
  scientific_reference_version: "PRMS-IV (Markstrom et al. 2015, USGS TM 6-B7), as implemented in USGS Fortran PRMS 5.1.0"
  implementation:
    id: "prms-hpc-510"
    version: "5.1.0 (2020-05-01)"
    provenance: "Fortran 90 process modules + C MMF framework; USGS PRMS 5.1.0 from github.com/nhm-usgs/prms."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "CC0-1.0"
  repo_url: "https://github.com/nhm-usgs/prms"

boundary:
  scope_in:
    - "Precipitation distribution and rain/snow partitioning by HRU"
    - "Temperature distribution across HRUs (station-based or pre-gridded)"
    - "Solar radiation estimation (degree-day or cloud-cover)"
    - "Potential evapotranspiration (Jensen-Haise default; Hamon, Hargreaves-Samani, Penman-Monteith, Priestley-Taylor, pan options)"
    - "Canopy interception of rain and snow"
    - "Energy-balance snowpack accumulation and melt"
    - "Variable-source-area surface runoff and infiltration"
    - "Soil-zone moisture accounting (ET, recharge, interflow)"
    - "Conceptual linear-reservoir groundwater storage and baseflow"
    - "Channel/streamflow routing (simple summation, pass-through, or Muskingum)"
    - "Optional cascading flow routing between HRUs"
    - "Optional surface depression storage"
  scope_out:
    - "Physically-based 3-D saturated groundwater flow (handled by MODFLOW under GSFLOW coupling; PRMS groundwater is a conceptual linear reservoir)"
    - "Sub-daily processes (model operates on a fixed daily timestep)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Distributed-parameter water-budget model on Hydrologic Response Units (HRUs) with a channel-segment network. Mass-balance (water) closure is tracked per process module. The snowpack uses an energy-balance formulation internally, but the overall model is not a closed surface energy budget. Internal computation is in US customary units (inches, feet, acres, degrees Fahrenheit, Langleys, cfs)."

inputs:
  forcing:
    - category: "forcing"
      name: "tmax"
      unit: "degrees Fahrenheit"
      source_kind: "forcing"
      model_input_format: "PRMS data file column (station mode) or tmax.cbh per-HRU file (climate_hru mode)"
      notes: "Internally Fahrenheit; rain/snow partition keys off tmax against tmax_allsnow/tmax_allrain."
    - category: "forcing"
      name: "tmin"
      unit: "degrees Fahrenheit"
      source_kind: "forcing"
      model_input_format: "PRMS data file column or tmin.cbh per-HRU file"
    - category: "forcing"
      name: "precip"
      unit: "inches/day"
      source_kind: "forcing"
      model_input_format: "PRMS data file column or precip.cbh per-HRU file"
    - category: "forcing"
      name: "solar radiation"
      unit: "Langleys/day"
      source_kind: "forcing"
      model_input_format: "PRMS data file / CBH (only when supplied as input rather than estimated by ddsolrad/ccsolrad)"
    - category: "forcing"
      name: "humidity"
      unit: "percent (0-100)"
      source_kind: "forcing"
      model_input_format: "PRMS data file column"
      notes: "Required only by potet_pt and potet_pm."
    - category: "forcing"
      name: "wind speed"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "PRMS data file column"
      notes: "Required only by potet_pt and potet_pm."
    - category: "forcing"
      name: "pan evaporation"
      unit: "inches/day"
      source_kind: "forcing"
      model_input_format: "PRMS data file column"
      notes: "Required only by potet_pan."
    - category: "forcing"
      name: "observed runoff"
      unit: "cfs (runoff_units=0)"
      source_kind: "forcing"
      model_input_format: "PRMS data file 'runoff' column; read by obs module"
      notes: "Observed streamflow used for routing reference and calibration comparison, not a model driver of the water budget."
  parameters:
    - category: "parameters"
      name: "hru_area"
      unit: "acres"
      source_kind: "dataset_lookup"
      model_input_format: "parameter file, dim nhru"
    - category: "parameters"
      name: "hru_elev"
      unit: "feet or meters (per elev_units)"
      source_kind: "dataset_lookup"
      model_input_format: "parameter file, dim nhru"
    - category: "parameters"
      name: "hru_lat"
      unit: "degrees"
      source_kind: "dataset_lookup"
      model_input_format: "parameter file, dim nhru"
    - category: "parameters"
      name: "cov_type / covden_sum / covden_win"
      unit: "categorical / fraction"
      source_kind: "dataset_lookup"
      model_input_format: "parameter file, dim nhru"
      notes: "Vegetation cover type and seasonal canopy density driving interception."
    - category: "parameters"
      name: "hru_percent_imperv"
      unit: "fraction"
      source_kind: "dataset_lookup"
      model_input_format: "parameter file, dim nhru"
    - category: "parameters"
      name: "soil_type"
      unit: "categorical (1=sand,2=loam,3=clay)"
      source_kind: "dataset_lookup"
      model_input_format: "parameter file, dim nhru"
    - category: "parameters"
      name: "soil_moist_max"
      unit: "inches"
      source_kind: "calibrated"
      model_input_format: "parameter file, dim nhru"
      notes: "Maximum soil-zone water-holding capacity; dominant water-balance partition parameter."
    - category: "parameters"
      name: "soil_rechr_max"
      unit: "inches"
      source_kind: "calibrated"
      model_input_format: "parameter file, dim nhru"
    - category: "parameters"
      name: "smidx_coef / smidx_exp"
      unit: "fraction / (1/inch)"
      source_kind: "calibrated"
      model_input_format: "parameter file (srunoff_smidx)"
      notes: "Coefficient and exponent of the variable-source-area SMIDX surface-runoff scheme."
    - category: "parameters"
      name: "carea_max"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "parameter file"
      notes: "Maximum contributing area for surface runoff (srunoff CAREA / SMIDX)."
    - category: "parameters"
      name: "slowcoef_lin / slowcoef_sq / fastcoef_lin"
      unit: "fraction/day"
      source_kind: "calibrated"
      model_input_format: "parameter file (soilzone)"
      notes: "Linear and nonlinear slow/fast interflow routing coefficients; slowcoef_sq is the nonlinear (squared-storage) slow-interflow term, a MEDIUM-sensitivity lever on interflow (influence block)."
    - category: "parameters"
      name: "soil2gw_max"
      unit: "inches"
      source_kind: "calibrated"
      model_input_format: "parameter file (soilzone), dim nhru"
      notes: "Maximum soil-water excess routed from the capillary reservoir to groundwater; HIGH-sensitivity lever on interflow and baseflow (influence block)."
    - category: "parameters"
      name: "pref_flow_den"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "parameter file (soilzone), dim nhru"
      notes: "Preferential-flow reservoir fraction of the soil zone; HIGH-sensitivity lever on interflow (influence block). PRMS default 0 replicates classic no-preferential-flow behavior."
    - category: "parameters"
      name: "ssr2gw_rate"
      unit: "fraction/day"
      source_kind: "calibrated"
      model_input_format: "parameter file, dim nssr"
      notes: "Gravity-reservoir to groundwater transfer rate."
    - category: "parameters"
      name: "gwflow_coef"
      unit: "fraction/day"
      source_kind: "calibrated"
      model_input_format: "parameter file, dim ngw"
      notes: "Linear groundwater-reservoir baseflow recession coefficient."
    - category: "parameters"
      name: "tmax_allsnow / tmax_allrain"
      unit: "degrees Fahrenheit"
      source_kind: "calibrated"
      model_input_format: "parameter file"
      notes: "Temperature thresholds bounding the rain/snow partition (defaults 32F / 38F)."
    - category: "parameters"
      name: "jh_coef / jh_coef_hru"
      unit: "1/degF / degF"
      source_kind: "calibrated"
      model_input_format: "parameter file (potet_jh)"
      notes: "Jensen-Haise potential-ET coefficients (defaults 0.014 / 13.0)."
    - category: "parameters"
      name: "dday_intcp / dday_slope / radmax"
      unit: "various"
      source_kind: "calibrated"
      model_input_format: "parameter file (ddsolrad)"
      notes: "Degree-day shortwave radiation intercept/slope and max radiation fraction."
    - category: "parameters"
      name: "rad_trncf / cecn_coef / freeh2o_cap"
      unit: "fraction / cal·cm-2·degC-1·day-1 / fraction"
      source_kind: "calibrated"
      model_input_format: "parameter file (snowcomp)"
      notes: "Canopy radiation transmission, convection-condensation energy coefficient, and snowpack free-water holding capacity."
    - category: "parameters"
      name: "snarea_curve"
      unit: "fraction (ndeplval = 11 values)"
      source_kind: "dataset_lookup"
      model_input_format: "parameter file; required by snowcomp"
      notes: "Snow-depletion curve relating snow-covered area to water equivalent."
  initial_conditions:
    - category: "initial_conditions"
      name: "soil_moist_init_frac"
      unit: "fraction of soil_moist_max"
      source_kind: "user_provided"
      model_input_format: "parameter file"
    - category: "initial_conditions"
      name: "soil_rechr_init_frac"
      unit: "fraction of soil_rechr_max"
      source_kind: "user_provided"
      model_input_format: "parameter file"
    - category: "initial_conditions"
      name: "ssstor_init"
      unit: "inches"
      source_kind: "user_provided"
      model_input_format: "parameter file (subsurface reservoir)"
    - category: "initial_conditions"
      name: "gwstor_init"
      unit: "inches"
      source_kind: "user_provided"
      model_input_format: "parameter file (groundwater reservoir, 0-10 in)"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "start_time / end_time"
      unit: "array of 6 long integers [year, month, day, hour, min, sec]"
      source_kind: "user_provided"
      model_input_format: "control file, type code 1"
      notes: "Must be type-code-1 longs; otherwise PRMS silently falls back to a default 2000-2001 period."
    - category: "boundary_conditions"
      name: "temp_module / precip_module / solrad_module / et_module / srunoff_module / strmflow_module / transp_module"
      unit: "module selector"
      source_kind: "user_provided"
      model_input_format: "control file (string)"
      notes: "Swappable process-module choices (e.g., potet_jh vs potet_pm; srunoff_smidx vs srunoff_carea; muskingum vs strmflow). Selected variant must match available forcing."
    - category: "boundary_conditions"
      name: "elev_units / temp_units / precip_units / runoff_units"
      unit: "unit-system switch"
      source_kind: "user_provided"
      model_input_format: "control file"
      notes: "Declare the unit system of inputs (0=feet/F/inches/cfs defaults). Mismatch silently corrupts results."
    - category: "boundary_conditions"
      name: "initial_deltat"
      unit: "hours"
      source_kind: "user_provided"
      model_input_format: "control file"
      notes: "Must be 24.0 for the daily model."
    - category: "boundary_conditions"
      name: "prms_warmup"
      unit: "years"
      source_kind: "user_provided"
      model_input_format: "control file"
      notes: "Warmup years excluded from statistics."

processes:
  modules:
    - name: "basin"
      role: "driver"
      brief: "Reads HRU geometry (area, elevation, slope), computes Active_hrus / Hru_route_order / Basin_area_inv, and holds internal unit constants (INCH2MM, FEET2METERS, CFS2CMS_CONV) used for area-weighting throughout."
    - name: "climateflow"
      role: "integrator"
      brief: "Central SAVE-scope state container (PRMS_CLIMATEVARS + PRMS_FLOWVARS): temperatures, precip partition, PET, soil/groundwater storages, and streamflow state shared by name across all process modules."
    - name: "soltab"
      role: "process_solver"
      brief: "Precomputes potential/horizontal solar-radiation tables by HRU slope/aspect/latitude; consumed by the solrad and PET modules."
    - name: "temp_distribution"
      role: "driver"
      brief: "Distributes tmax/tmin across HRUs via lapse rate, inverse distance, or pre-gridded CBH (temp_1sta/temp_laps/temp_dist2/ide_dist/xyz_dist/climate_hru)."
    - name: "precip_distribution"
      role: "driver"
      brief: "Distributes precipitation by HRU and partitions rain vs snow using tmax_allsnow/tmax_allrain (precip_1sta/precip_laps/precip_dist2/climate_hru)."
    - name: "solrad"
      role: "process_solver"
      brief: "Estimates shortwave radiation by degree-day (ddsolrad) or cloud-cover (ccsolrad) method, feeding Swrad."
    - name: "potet"
      role: "process_solver"
      brief: "Computes potential evapotranspiration; default Jensen-Haise (potet_jh) with options Hamon/Hargreaves-Samani/Priestley-Taylor/Penman-Monteith/pan."
    - name: "transp"
      role: "process_solver"
      brief: "Determines the transpiration on/off period by temperature index (transp_tindex) or frost date (transp_frost)."
    - name: "intcp"
      role: "process_solver"
      brief: "Canopy interception of rain and snow, interception evaporation, and net throughfall by cover type and season."
    - name: "snowcomp"
      role: "process_solver"
      brief: "Energy-balance snowpack: accumulation, albedo aging, density/settling, melt, and sublimation; emits Pkwater_equiv, snowmelt, and snow-covered area via snarea_curve."
    - name: "srunoff"
      role: "process_solver"
      brief: "Variable-source-area surface runoff and infiltration (SMIDX or CAREA), impervious storage, and optional depression storage."
    - name: "soilzone"
      role: "process_solver"
      brief: "Soil-zone water balance: capillary/gravity/preferential reservoirs, actual ET, slow/fast interflow, and recharge to groundwater (ssr2gw)."
    - name: "gwflow"
      role: "process_solver"
      brief: "Linear groundwater reservoir: Gwres_stor with gwflow_coef-driven baseflow, optional gwsink, and inflow from the soil zone."
    - name: "strmflow"
      role: "process_solver"
      brief: "Channel routing of combined surface + interflow + baseflow to basin_cfs / seg_outflow; variants strmflow, strmflow_in_out, muskingum, muskingum_lake."
    - name: "cascade"
      role: "optional_module"
      brief: "Optional topographic routing of overland and subsurface flow between HRUs."
      applicability: "when cascading flow enabled"
    - name: "basin_sum"
      role: "integrator"
      brief: "Area-weights HRU fluxes/storages into basin totals and monthly/yearly/total accumulators; computes water-balance summary outputs."
    - name: "call_modules"
      role: "driver"
      brief: "MMF master dispatcher: invokes each module in fixed decl/init/run/clean order and selects temp/precip/solrad/et/srunoff/strmflow variants from control flags."
  internal_edges:
    - from: "temp_distribution"
      to: "precip_distribution"
      kind: "writes_state"
      brief: "HRU temperatures (Tmaxf/Tminf) drive the rain/snow partition threshold."
    - from: "precip_distribution"
      to: "intcp"
      kind: "produces_output"
      brief: "Per-HRU gross rain/snow throughfall feeds canopy interception."
    - from: "soltab"
      to: "solrad"
      kind: "produces_output"
      brief: "Potential solar-radiation tables consumed by the degree-day/cloud-cover solver."
    - from: "solrad"
      to: "potet"
      kind: "writes_state"
      brief: "Swrad drives Jensen-Haise (and other radiation-based) PET."
    - from: "solrad"
      to: "snowcomp"
      kind: "writes_state"
      brief: "Shortwave radiation drives snowpack energy balance."
    - from: "potet"
      to: "intcp"
      kind: "writes_state"
      brief: "PET limits interception evaporation."
    - from: "intcp"
      to: "snowcomp"
      kind: "produces_output"
      brief: "Net snow throughfall enters the snowpack."
    - from: "transp"
      to: "soilzone"
      kind: "writes_state"
      brief: "Transpiration-period flag gates soil-zone transpiration."
    - from: "snowcomp"
      to: "srunoff"
      kind: "produces_output"
      brief: "Snowmelt plus net rain become available water for runoff/infiltration."
    - from: "snowcomp"
      to: "soilzone"
      kind: "writes_state"
      brief: "Snow-covered fraction (Pkwater_equiv / Snowcov_area) modulates soil actual ET."
    - from: "potet"
      to: "soilzone"
      kind: "writes_state"
      brief: "Remaining PET after interception/snow drives soil-zone actual ET."
    - from: "srunoff"
      to: "soilzone"
      kind: "produces_output"
      brief: "Infiltration enters the soil-zone capillary reservoir."
    - from: "srunoff"
      to: "strmflow"
      kind: "produces_output"
      brief: "Hortonian/Dunnian surface runoff contributes to channel inflow."
    - from: "soilzone"
      to: "gwflow"
      kind: "produces_output"
      brief: "Recharge / gravity-reservoir drainage (ssr2gw) feeds the groundwater reservoir."
    - from: "soilzone"
      to: "strmflow"
      kind: "produces_output"
      brief: "Slow/fast interflow contributes to channel inflow."
    - from: "soilzone"
      to: "cascade"
      kind: "produces_output"
      brief: "Optional cascading subsurface flow routed between HRUs."
    - from: "gwflow"
      to: "strmflow"
      kind: "produces_output"
      brief: "Baseflow from the groundwater reservoir contributes to channel inflow."
    - from: "strmflow"
      to: "basin_sum"
      kind: "produces_output"
      brief: "Routed streamflow and storages aggregated into basin totals and accumulators."
    - from: "basin_sum"
      to: "Outputs"
      kind: "produces_output"
      brief: "Writes daily/monthly/yearly water-balance and streamflow outputs (prms.out, CSV, NetCDF)."
    - from: "Inputs"
      to: "temp_distribution"
      kind: "consumes_input"
      brief: "tmax/tmin forcing distributed onto HRUs."
    - from: "Inputs"
      to: "precip_distribution"
      kind: "consumes_input"
      brief: "Precipitation forcing distributed onto HRUs."
    - from: "basin"
      to: "basin_sum"
      kind: "reads_state"
      brief: "Active_hrus / Hru_route_order / Basin_area_inv used for area-weighted basin aggregation (and by every process module)."
    - from: "snowcomp"
      to: "snowcomp"
      kind: "reads_state"
      brief: "Albedo-aging trackers (Salb/Slst/Scrv) persist via SAVE and feed back into next-day albedo (self-coupling)."
    - from: "call_modules"
      to: "basin"
      kind: "invokes"
      brief: "Driver invokes modules in fixed decl/init/run/clean order, beginning with basin."

states:
  variables:
    - name: "Pkwater_equiv"
      unit: "inches"
      role: "prognostic"
    - name: "Pk_depth"
      unit: "inches"
      role: "diagnostic"
    - name: "Pk_den"
      unit: "g/cm3"
      role: "diagnostic"
    - name: "Freeh2o"
      unit: "inches"
      role: "prognostic"
    - name: "Pk_def"
      unit: "cal/cm2"
      role: "prognostic"
    - name: "Albedo"
      unit: "decimal"
      role: "diagnostic"
    - name: "Snowcov_area"
      unit: "decimal"
      role: "diagnostic"
    - name: "Imperv_stor"
      unit: "inches"
      role: "prognostic"
    - name: "Soil_moist"
      unit: "inches"
      role: "prognostic"
    - name: "Soil_rechr"
      unit: "inches"
      role: "prognostic"
    - name: "Ssres_stor"
      unit: "inches"
      role: "prognostic"
    - name: "Slow_stor"
      unit: "inches"
      role: "prognostic"
    - name: "Gwres_stor"
      unit: "inches"
      role: "prognostic"
    - name: "Dprst_vol_open"
      unit: "acre-inches"
      role: "prognostic"
    - name: "Dprst_vol_clos"
      unit: "acre-inches"
      role: "prognostic"
    - name: "Lake_vol"
      unit: "acre-feet"
      role: "prognostic"
    - name: "Seg_outflow"
      unit: "cfs"
      role: "prognostic"
    - name: "Infil"
      unit: "inches"
      role: "diagnostic"
    - name: "Sroff"
      unit: "inches"
      role: "diagnostic"
    - name: "Hru_actet"
      unit: "inches"
      role: "diagnostic"
    - name: "Potet"
      unit: "inches"
      role: "diagnostic"
    - name: "Swrad"
      unit: "Langleys/day"
      role: "diagnostic"
    - name: "Prmx"
      unit: "decimal"
      role: "diagnostic"
    - name: "Basin_soil_moist"
      unit: "inches"
      role: "diagnostic"
    - name: "Basin_actet"
      unit: "inches"
      role: "diagnostic"
    - name: "Basin_cfs"
      unit: "cfs"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "basin_cfs"
    validation_rank: 2
    unit: "cfs"
    description: "Total basin streamflow at the outlet in cubic feet per second"
    emitted_in: "prms.out / CSV summary"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Compare against gauged discharge at the basin outlet in matching units (cfs); m3/s observations must be converted (runoff_units)."
            - "Use a water-year start and discard warmup; snow-affected basins need an antecedent snowpack spinup."
      detrending_options: ["none"]
  - var: "basin_stflow_out"
    validation_rank: 3
    unit: "inches"
    description: "Total basin streamflow expressed as a basin-average depth"
    emitted_in: "prms.out / CSV summary"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Basin-area-weighted depth; compare against runoff depth derived from gauged discharge divided by drainage area."
      detrending_options: ["none"]
  - var: "seg_outflow"
    validation_rank: 4
    unit: "cfs"
    description: "Per-segment channel outflow from Muskingum / routing"
    emitted_in: "nsegment CSV / NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Match the segment to the gauge location; routing variant (muskingum vs simple summation) affects timing."
      detrending_options: ["none"]
  - var: "basin_actet"
    validation_rank: 1
    unit: "inches"
    description: "Basin-average actual evapotranspiration"
    emitted_in: "prms.out / CSV summary"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Comparison against remote-sensing or eddy-covariance ET requires unit conversion and scale matching to the HRU/basin aggregate."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Per-HRU actet can be compared against gridded ET only after HRU-to-grid mapping."
      detrending_options: ["none"]
  - var: "basin_pweqv"
    validation_rank: 5
    unit: "inches"
    description: "Basin-average snowpack water equivalent (SWE)"
    emitted_in: "prms.out / CSV summary"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "timing_accuracy", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Compare against SNOTEL/observed SWE; snowpack is poorly constrained without observed SWE."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
