safety:
  hazards:
    - id: "permeability_unit_darcy_vs_m2"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_001"
      description: "Permeability supplied in Darcy or cm^2 instead of m^2 (1 Darcy = 9.869e-13 m^2) makes flow ~1e12x too high; domain floods instantly."
      severity: "silent"
    - id: "pressure_unit_MPa_vs_Pa"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_002"
      description: "Pressure/BC values in MPa or bar instead of Pa; field ~1e6x off and stress/displacement wrong."
      severity: "silent"
    - id: "viscosity_unit_cP_vs_Pas"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_003"
      description: "Viscosity in centipoise instead of Pa*s (1 cP = 1e-3 Pa*s); Darcy velocity 1000x off."
      severity: "silent"
    - id: "density_unit_gcm3_vs_kgm3"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_004"
      description: "Density in g/cm^3 instead of kg/m^3 (factor 1000); gravity/buoyancy term wrong."
      severity: "silent"
    - id: "modulus_unit_GPa_vs_Pa"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_005"
      description: "Young's modulus / Lame parameters in GPa instead of Pa (factor 1e9); displacement explodes."
      severity: "silent"
    - id: "porosity_percent_vs_fraction"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_006"
      description: "Porosity as percentage (e.g. 13) instead of fraction (0.13); ~100x pore-volume / mass-balance error, porosity may exceed 1."
      severity: "silent"
    - id: "thermal_conductivity_cgs_vs_si"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_010"
      description: "Thermal conductivity in cal/(cm*s*C) instead of W/(m*K) (factor ~418.68); heat transfer rate wrong."
      severity: "silent"
    - id: "aperture_unit_mm_vs_m"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_012"
      description: "Fracture aperture in mm instead of m; transmissivity scales with aperture^3, so ~1e9x too high and flow short-circuits."
      severity: "silent"
    - id: "time_unit_hours_days_vs_seconds"
      kind: "control_semantic"
      triplet: "dt_007"
      description: "Time step / schedule in hours or days instead of seconds; TimeManager expects seconds, so results silently cover the wrong period."
      severity: "silent"
    - id: "non_unitary_time_scaling"
      kind: "control_semantic"
      triplet: "dt_011"
      description: "pp.Units(s != 1) raises NotImplementedError at prepare_simulation; non-unitary time scaling is unsupported."
      severity: "fatal"
    - id: "biot_coefficient_out_of_range"
      kind: "coefficient_runtime_silent_fallback"
      triplet: "dt_009"
      description: "Biot coefficient outside (0,1] yields negative effective stress and immediate Newton divergence."
      severity: "fatal"
    - id: "newton_divergence_nan"
      kind: "numerical_instability"
      triplet: "dt_013"
      description: "Newton diverges from an ill-conditioned system (large dt, extreme property contrast, poor ICs, singular BCs); NaN in the solution vector crashes the run."
      severity: "fatal"
    - id: "degenerate_fracture_geometry"
      kind: "control_semantic"
      triplet: "dt_014"
      description: "Degenerate fracture geometry (zero-area polygon, collinear points, self-intersecting edges) crashes or hangs Gmsh."
      severity: "fatal"
    - id: "fracture_outside_domain"
      kind: "control_semantic"
      triplet: "dt_018"
      description: "Fractures extending outside the domain cause Gmsh meshing failure or missing/incorrect fracture subdomains."
      severity: "fatal"
    - id: "singular_matrix_pure_neumann"
      kind: "control_semantic"
      triplet: "dt_015"
      description: "Pure Neumann BCs for pressure leave the system defined up to a constant; linear solver fails with a singular matrix. Needs >=1 Dirichlet BC per primary variable."
      severity: "fatal"
    - id: "bc_type_dirichlet_neumann_swapped"
      kind: "control_semantic"
      triplet: "dt_017"
      description: "Dirichlet/Neumann BC types swapped so a pressure value is read as a flux (and vice versa); wrong flow direction/magnitude with no error raised."
      severity: "silent"
    - id: "cell_size_domain_scale_mismatch"
      kind: "numerical_instability"
      triplet: "dt_008"
      description: "cell_size not matched to domain scale (e.g., 0.1 m cells in a 100 km domain); mesh under/over-resolved or out of memory."
      severity: "degraded"
    - id: "unregistered_export_variable"
      kind: "parser_semantic"
      triplet: "dt_016"
      description: "Secondary variables (flux, stress, aperture) not registered in data_to_export() are missing from VTU output, yielding empty parsed columns / KeyError."
      severity: "degraded"
  validation_limits:
    - "Energy balance is structurally not stand-alone: temperature results are only valid inside coupled poromechanical/THM runs that supply a flow field."
    - "No native land-surface, watershed, or climate forcing; coupling to such models is external (array/file exchange), not an internal model capability."
    - "PorePy is a numerical simulation framework, not a pre-calibrated predictive model; absolute field-prediction skill depends entirely on user-supplied geometry and parameters."
    - "Time integration is implicit-Euler-derived; sub-step transient features below the chosen dt are not resolved."
  warnings:
    - "Newton convergence is governed by ABSOLUTE increment/residual tolerances only by default (model default 1e-10); relative tolerances default to infinity (disabled) unless explicitly set."
    - "At least one Dirichlet BC per primary variable is required (mechanics must additionally prevent rigid-body motion) or the linear system is singular."
    - "Contact-mechanics conditioning depends on the penalty constant c_num = 1/characteristic_displacement; a poor characteristic_displacement degrades fracture-contact convergence."
    - "Physical parameter bounds: porosity 0<phi<=1, Biot 0<alpha<=1, natural-rock permeability 1e-22 to 1e-10 m^2, fluid viscosity 1e-4 to 1e-1 Pa*s."
  assumptions:
    - statement: "Mixed-dimensional point/column model: matrix, fracture, and intersection subdomains are coupled through codimension-one mortar interfaces; fracture permeability follows the cubic law in aperture."
      scope: "All fractured-domain runs"
      source: "Keilegavlen et al. 2021 (doi:10.1007/s10596-020-10002-5); porepy.models.constitutive_laws (CubicLawPermeability, DimensionReduction)"
      status: "adopted"
    - statement: "Local thermal equilibrium is assumed: solid and fluid temperatures are constant within each cell, so a single temperature field represents both phases."
      scope: "Energy balance / THM runs"
      source: "porepy.models.energy_balance documentation"
      status: "adopted"
    - statement: "Internally all quantities are SI and time scaling must remain s == 1; user inputs in other units are converted via pp.Units/convert_units before solving."
      scope: "All runs"
      source: "porepy.models.units (NotImplementedError on s != 1); porepy.models.material_constants convert_units()"
      status: "adopted"
    - statement: "Fracture contact enforces non-penetration of opposing surfaces with Coulomb friction; tangential sliding obeys a friction-coefficient bound."
      scope: "ContactMechanics / poromechanical runs with fractures"
      source: "porepy.models.momentum_balance / contact_mechanics documentation"
      status: "adopted"
    - statement: "Model-source granite/water material defaults (e.g., solid specific_heat_capacity 720.7, thermal_conductivity 3.1, thermal_expansion 9.66e-6) are authoritative over divergent wrapper defaults."
      scope: "Default material parameterization"
      source: "porepy.applications.material_values.solid_values.granite / fluid_values.water"
      status: "adopted"
