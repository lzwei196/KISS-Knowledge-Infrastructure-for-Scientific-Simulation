- id: EPIC_025
  failure_domain: validation_contract
  severity: critical
  silent: true
  symptom: 'A clean EPIC run (HUSC at harvest 1.0-1.07, PHU site-derived, FTN full in

    every year, forcing from the CMFD 3-hourly store, water balance closing)

    nevertheless scores r = 0.21, NSE = -8.45, KGE = 0.06 against an annual

    yield series, and the self-improve loop fires a diagnose on r < 0.5.

    The tell: resolved_obs says granularity = ''grid'' / geometry = ''0.5deg grid

    cell'' / dataset_id = ''gdhy_v1_2_v1_3'', but the run reports

    obs_shape = ''point_time_series''.

    '
  diagnosis: "Comparison-contract misbinding, not a model defect. GDHY / SPAM / FAOSTAT /\nstatistical-yearbook\
    \ yields are AREA AVERAGES. dag.yaml offers YLDG both\n'point_time_series' and 'regional_aggregate_time_series'\
    \ but carries no rule\nfor choosing, SKILL.md had no obs-binding section, and\nki_tools_common.crop_obs.get_observed_yield_series()\
    \ returns a bare\n{year: kg/ha} dict with no granularity or convention metadata -- so the\ncaller\
    \ has nothing to bind on and defaults to the point shape. That promotes\nraw inter-annual r/NSE/KGE\
    \ to the headline, which the dag's own aggregate\ncaveat forbids. Two structural reasons the raw metrics\
    \ cannot be met:\n  (1) technology trend -- Changchun GDHY maize rises +0.163 t/ha/yr\n      (2.66%/yr;\
    \ 1997-2006 mean 5.25 -> 2007-2016 mean 6.97 t/ha) from\n      cultivar turnover and input intensification,\
    \ which a fixed-management\n      EPIC run cannot contain (sim slope +0.003, slope_ratio 0.02);\n\
    \  (2) variance damping -- a 0.5deg cell mean averages hundreds of fields, so\n      detrended sd\
    \ is 0.55 t/ha (obs) vs 1.07 t/ha (sim), and NSE/KGE charge\n      that scale mismatch to the model.\n\
    Remove the trend and the weather signal is present: detrended r = 0.38,\nfirst-difference r = 0.59.\n\
    A second, independent silent gap rides along: EPIC .ACY YLDG is DRY MATTER,\nthe moisture basis GDHY\
    \ reports on was never ESTABLISHED or cited anywhere in\nthis KI, and SKILL.md's unit table documented\
    \ only the kg/ha -> t/ha step.\n(The run assumed a market basis; that assumption is undocumented and\
    \ is\nexactly what this triplet forbids.) Applying (or omitting) the\n/(1 - 0.155) conversion moves\
    \ the dag's DETERMINING metric from PBIAS\n+26.8% to +50.1% with no rule written down anywhere.\n"
  remedy: "Before scoring ANY yield obs, resolve the shape from the dag:\n\n  python tools/resolve_obs_shape.py\
    \ --var YLDG --granularity grid \\\n      --geometry \"0.5deg grid cell\" --dataset-id gdhy_v1_2_v1_3\
    \ --n-steps 20\n\nAny gridded / regional / national / census-anchored product binds to\nobs_shape\
    \ = 'regional_aggregate_time_series', comparison_mode =\n'aggregate_trend_comparison', determining_metric\
    \ = 'pbias', detrending =\n'linear_residual'. The VERDICT is the dag's determining_metric ALONE\n\
    (pbias); r_detr / r_firstdiff / slope_ratio are diagnostic pattern evidence,\nNOT a second verdict,\
    \ and raw r / NSE / KGE are marked non-verdict. Reserve\n'point_time_series' for station, experiment-plot\
    \ or single-field records.\nOn moisture: EPIC's dry-matter basis is a model fact, but the OBS basis\
    \ must\nbe ESTABLISHED from that product's own documentation and cited -- the KI does\nnot assume\
    \ GDHY/FAOSTAT/SPAM/yearbook conventions. Convert the sim\n(yield_market = yield_dry / (1 - w), w\
    \ recorded with its source) only once\nthe obs is established to be market-basis; report PBIAS on\
    \ both bases either\nway.\nDo NOT respond to this symptom by tuning PPOP, PHU or the cultivar --\n\
    PHU is already site-derived (EPIC_021), the kill row is already fixed\n(EPIC_024), and EPIC_022 forbids\
    \ moving PPOP to chase PBIAS.\n"
  discovered_during: gdhy_jilin_maize_1997_2016_selfimprove_retry1
  tags:
  - obs_shape
  - regional_aggregate
  - detrend
  - technology_trend
  - GDHY
  - moisture_basis
  - validation_contract
  - silent
- id: EPIC_026
  failure_domain: tooling
  severity: high
  silent: false
  symptom: "`python3 quick_validate.py --rerun` -- the path SKILL.md advertises as\n\"Quick validation\
    \ (fastest path -- use this for KI testing)\" -- dies\nimmediately with:\n  ERROR: [Errno 2] No such\
    \ file or directory:\n  'KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect_multi_agent/_work_v2/EPIC/epic_workspace/epic1102-official_release.exe'\n\
    and emits {\"ki_usable\": false}. Without --rerun it instead reports\n\"Missing umstead_0.ANN\" /\
    \ \"Missing umstead_0.ACY\", because the default\nworkspace points at the same vanished directory.\n"
  diagnosis: 'quick_validate.py hard-coded DEFAULT_BINARY and DEFAULT_WORKSPACE to the

    transient dissection scratch tree `_work_v2/EPIC/epic_workspace`. SKILL.md

    already documents that (a) that tree "is a transient dissection scratch dir

    and no longer exists" and (b) the binary must be resolved through

    `tools/_common.resolve_binary()` (which walks $EPIC_BINARY -> models/EPIC/bin

    -> models/EPIC/source/repo -> the legacy scratch path). preflight_check.py

    and tools/run_epic.py already used the resolver; quick_validate.py was the

    one caller that bypassed it, so `preflight_check.py` reported PASS on the

    very binary quick_validate could not find -- an inconsistency that makes

    the failure look like a broken install rather than a stale constant.

    '
  remedy: "quick_validate.py now imports `resolve_binary` from tools/_common and picks\nthe workspace\
    \ from WORKSPACE_CANDIDATES (KI runs/umstead_quick_validate ->\nmodels/EPIC/outputs -> models/EPIC/source/repo\
    \ -> legacy scratch), choosing\nthe first that actually holds umstead_0.ANN. `--rerun` always writes\
    \ into\nthe KI-local runs/ dir so the shipped reference outputs under\nmodels/EPIC/outputs/ are never\
    \ overwritten. Verified 2026-07-29:\n  python3 quick_validate.py --rerun\n  -> PASS  15 yr, P=1129.1\
    \ ET=578.4 Q_sfc=59.0 mm/yr, yield 5.23 t/ha\nNEVER hard-code the binary or workspace in a new tool\
    \ -- call\n_common.resolve_binary().\n"
  discovered_during: gdhy_maize_changchun_2026_07_29
  tags:
  - quick_validate
  - binary_path
  - _work_v2
  - stale_path
  - resolve_binary
  - developer_example
- id: EPIC_027
  failure_domain: tooling
  severity: high
  silent: true
  symptom: 'Every `.ACY` produced through quickstart.py carries PPOP = 10.000 in every

    year at every site, even though SKILL.md ("Plant population (OPV5) is a site

    decision, not a default") and triplet EPIC_022 both instruct the agent to

    pass a SOURCED plant density. No error is raised; the run simply simulates

    100,000 plants/ha -- above every published NE-China spring-maize density

    treatment (30,000 / 52,500 / 75,000 / 97,500 plants ha-1, optimum ~76,000).

    '
  diagnosis: '`build_opc_file.build()` DOES take `ppop=` (OPV5), but `quickstart.py` --

    the entry point SKILL.md says to "use instead of driving the nine stage

    tools by hand" -- never accepted or forwarded it. The documented

    requirement was therefore unsatisfiable from the recommended path: the only

    way to honour it was to abandon quickstart and drive the stage tools

    manually, which SKILL.md advises against. Classic protocol/tool mismatch:

    the doc mandates a decision the tool gives you no way to express, so the

    site-blind legacy value wins silently in every run.

    '
  remedy: 'quickstart.py now takes `ppop=` (Python) / `--ppop` (CLI) and forwards it to

    build_opc(); omitting it keeps the documented 10.0 default, and passing it

    prints a line naming it a SOURCED override. This is parameter SOURCING, and

    EPIC_022 still stands: do NOT move PPOP to chase PBIAS. Because no gridded

    or survey plant-density product for a specific cell-year exists on this

    server, a `--ppop` run must be reported as a labelled SENSITIVITY, never as

    the scored verdict, until a source pins the value.

    '
  discovered_during: gdhy_maize_changchun_2026_07_29
  tags:
  - quickstart
  - PPOP
  - OPV5
  - protocol_gap
  - silent
  - umstead_legacy
- id: EPIC_028
  failure_domain: validation_contract
  severity: high
  silent: true
  symptom: 'Follow-up to EPIC_025, which left ONE item open: "the OBS basis must be

    ESTABLISHED from that product''s own documentation and cited -- the KI does

    not assume GDHY/FAOSTAT/SPAM/yearbook conventions." While it stayed open,

    every run was free to re-decide it, and the dag''s DETERMINING metric moved

    from PBIAS +26.8% to +50.1% on that unrecorded choice alone.

    '
  diagnosis: 'The GDHY NetCDF files carry NO metadata whatsoever -- verified 2026-07-29:

    the per-year `yield_<YYYY>.nc4` have empty global attributes and a single

    unlabelled variable named `var` (only lat/lon carry units). So the basis is

    genuinely unreadable from the data, and an agent with no registry to consult

    will always fall back to a guess.

    '
  remedy: "The basis is now ESTABLISHED and registered as DATA in\ntools/resolve_obs_shape.py (`OBS_MOISTURE_BASIS`,\
    \ reachable via\n`lookup_obs_moisture_basis(dataset_id, crop)` and surfaced in every\nresolve() as\
    \ `.moisture_basis.obs_native` / `.conversion`):\n  * GDHY grid yields are estimated from a satellite\
    \ crop-specific vegetation\n    index calibrated to FAO-REPORTED COUNTRY YIELD STATISTICS\n    (Iizumi\
    \ & Sakai 2020, Sci Data 7:97, doi:10.1038/s41597-020-0433-7),\n    so GDHY inherits FAOSTAT's reporting\
    \ basis;\n  * FAO crop-production definitions: cereals are reported as \"clean, dry\n    weight of\
    \ grains with 12-14 percent moisture in the form usually\n    marketed\"; rice is reported as PADDY;\n\
    \  * => GDHY / FAOSTAT / SPAM cereals are MARKET moisture, w = 0.14 for maize\n    in China (top of\
    \ FAO's 12-14% band; China GB 1353 trade ceiling),\n    w_range 0.12-0.14 as the sensitivity.\nThe\
    \ w = 0.155 constant the KI carried before is the US grain-trade\nconvention, NOT FAO's -- demoted\
    \ to a sensitivity. Scoring EPIC's DRY-MATTER\nYLDG straight against a raw GDHY value is a basis MISMATCH,\
    \ not a \"dry\nbasis\" comparison; convert one side (either gives an identical PBIAS) and\nreport\
    \ both numbers. A product with no registry row still returns\nestablished=false -- establish it, cite\
    \ it, and ADD THE ROW rather than\ndeciding again in the next run.\n"
  discovered_during: gdhy_maize_changchun_2026_07_29
  tags:
  - moisture_basis
  - GDHY
  - FAOSTAT
  - SPAM
  - registry
  - validation_contract
  - silent
  - EPIC_025_followup
- id: EPIC_029
  failure_domain: forcing
  severity: critical
  silent: true
  symptom: "A `--source nasa_power` run (the global / fast forcing path) dies in\nconvert_forcing_to_epic.build\
    \ with the CMFD-specific message of triplet\nEPIC_023:\n  \"nasa_power forcing has a ZERO diurnal\
    \ temperature range on 1827/1827\n   days (temp_max_c == temp_min_c) ... point $CMFD_PATH at the 3-HOURLY\n\
    \   archive\"\nat a site that has nothing to do with CMFD. The same fetch succeeds when\nconvert_forcing_to_epic._load_daily_window\
    \ is called directly.\n"
  diagnosis: "The per-year forcing memo, not the loader. `_load_year_cached()` built its\nJSON payload\
    \ with\n\n    if k == \"dates\" or not isinstance(v, (list, tuple)): continue\n\nbut ki_tools_common.load_forcing\
    \ returns NUMPY ARRAYS for nasa_power and\nmswx (the local CMFD fallback returns lists, which is why\
    \ CMFD sites never\nsaw this). Every variable therefore failed the isinstance test, the cached\nyear\
    \ held ONLY \"dates\", and build() fell through to its `_pick(...,\ndefault=...)` constants: TMX =\
    \ TMN = 0 degC, precip = 0 mm, srad = 18\nMJ/m2/d. The zero diurnal range is what trips EPIC_023's\
    \ guard -- with a\nslightly different default set EPIC would have run happily on fabricated\nweather.\
    \ Caching is ON by default (cache_dir defaults to\n<workspace>/.forcing_cache), so this killed the\
    \ entire NASA POWER path\nfrom the moment the memo was added.\n"
  remedy: "`_as_float_list()` now normalises ANY 1-D numeric sequence (list, tuple,\nnumpy or masked array)\
    \ before the memo is written, and build() refuses to\nsubstitute defaults for the load-bearing variables:\n\
    \n    missing = [k for k in (\"temp_max_c\",\"temp_min_c\",\"precip_mm\")\n               if _pick(data,\
    \ k, default=None) is None]\n    if missing: raise ValueError(...)\n\nA memo written before this fix\
    \ is STALE and carries only `dates` --\ndelete <workspace>/.forcing_cache (or $EPIC_FORCING_CACHE)\
    \ once. Verified\n2026-08-10 at 45.25N 9.75E: cached 1984-1988 now reload with\nTmax=17.1C Tmin=8.2C\
    \ prcp=2.41mm/d srad=12.6MJ/m2/d.\nGENERAL RULE for any KI memo: never gate serialisation on\n`isinstance(v,\
    \ list)` -- the loaders return numpy.\n"
  discovered_during: gdhy_maize_povalley_2026_08_10
  tags:
  - forcing
  - nasa_power
  - cache
  - numpy
  - silent
  - defaults
- id: EPIC_030
  failure_domain: forcing
  severity: major
  silent: false
  symptom: "A NASA POWER run that starts before 1984 dies with an opaque\n  \"Forcing validation FAILED:\
    \ SRAD mean nan MJ/m2/d out of range\"\nwhile Tmax/Tmin/precip for the same years look perfectly normal.\n"
  diagnosis: 'NASA POWER''s solar record (ALLSKY_SFC_SW_DWN, CERES/SRB) begins

    1984-01-01; its MERRA-2 temperature and precipitation begin 1981-01-01.

    A 1981-1983 request therefore returns real T/P and an ALL-NaN radiation

    column (verified at 45.25N 9.75E: NaN fraction 1.0 for 1981/1983, 0.0 for

    1984 and later). The NaNs then poison the W/m2-vs-MJ magnitude test

    (`nan > 60` is False, so no conversion is applied) and only surface in the

    range check, which cannot say why.

    '
  remedy: 'convert_forcing_to_epic.build now counts non-finite radiation days and

    raises naming the record start when source == "nasa_power" and

    year1 < 1984. Start NASA POWER runs at 1984, or take radiation from

    another source. GDHY covers 1981-2016, so a NASA-POWER-forced GDHY

    comparison is a 1984-2016 window (minus spin-up).

    '
  discovered_during: gdhy_maize_povalley_2026_08_10
  tags:
  - forcing
  - nasa_power
  - radiation
  - record_start
  - '1984'
- id: EPIC_031
  failure_domain: site_preparation
  severity: high
  silent: true
  symptom: "Every non-China quickstart run prints\n  \"elevation: 100 m, slope: 0.0100 m/m (1.00%)\"\n\
    no matter where on Earth it is, and the .SIT carries those numbers.\n"
  diagnosis: 'quickstart._lookup_terrain tried the China DEM 90m, then the CMFD

    elevation grid (China only), then returned the hard-coded placeholder

    (100 m, 1%). Both sources are China-only, so OUTSIDE China the placeholder

    was the only possible outcome -- a fabricated site geometry that changes

    EPIC''s PET (barometric pressure is derived from elevation) and its

    curve-number runoff / MUSLE erosion (slope). The curated GLOBAL primary

    DEM (MERIT DEM v1.0.2, 3 arcsec, KISSPATH_DATA/MERIT_DEM, 5x5 degree tiles

    named by their lower-left corner) was on the server the whole time, and

    ki_tools_common.terrain.get_terrain is China-only too, so there was no

    global fallback to import.

    '
  remedy: '_lookup_terrain now falls back to the MERIT tile

    (`_merit_tile(lat, lon)` -> n45e005_dem.tif style) via

    `_elev_slope_from_raster`. Verified 2026-08-10: Po Valley 45.25N 9.75E

    54 m, Iowa 41.25N -93.25E 256 m, S.Africa Highveld -28.25 27.25 1509 m.

    SLOPE is the gradient of a least-squares PLANE over an ~1 km window (the

    scale of the <=100 ha HLU EPIC simulates), not a two-cell central

    difference: at 45.25N 9.75E the point sits on an Adda river-terrace scarp

    where the 180 m difference reads 7.3% for a field on the flat Po plain.

    The China branch keeps its central difference so the Changchun reference

    run stays reproducible.

    '
  discovered_during: gdhy_maize_povalley_2026_08_10
  tags:
  - site
  - SIT
  - elevation
  - slope
  - DEM
  - MERIT
  - global
  - silent
- id: EPIC_032
  failure_domain: management_schedule
  severity: critical
  silent: true
  symptom: "A run configured with `--irrigation auto` produces IRGA = 0.000 mm in\nevery .ACY year and\
    \ a yield byte-identical to the dryland run, and the\n.OUT MANAGEMENT DATA block still says \"DRYLAND\
    \ AGRICULTURE\".\nEPICCONT.DAT row 2 is also visibly corrupted afterwards:\n  before  \"   0    1\
    \   0   0   0    1   0   0   0   0   2 ...\"\n  after   \"   0    1   0   0   0    1   0   0     2\
    \ 0   2 ...    0    0    0\"\n"
  diagnosis: "SUPERSEDES item (3) of EPIC_019, which had the file right but the\nconclusion wrong. EPICCONT.DAT\
    \ does NOT hold the irrigation flag at all --\nsweeping every one of its row-2 integers leaves the\
    \ .OUT echo at \"DRYLAND\nAGRICULTURE\" (verified 2026-08-10, 21 runs of the binary). EPIC's\nirrigation\
    \ switch is TWO fields in TWO other files:\n  * IRR = the FIRST integer of the flag line at the end\
    \ of <run>.SIT.\n    Method codes read off the .OUT echo by sweeping the field:\n      0 DRYLAND /\
    \ 1 SPRINKLER / 2 FURROW / 3 IRRIGATION WITH FERT ADDED /\n      4 AUTOMATIC (BIG GUN FROM LAGOON)\
    \ / 5 DRIP.\n  * OPV3 on the PLANTING row of <run>.OPC = the automatic-irrigation\n    trigger (plant\
    \ water-stress factor). With IRR in 1/2/3/5 and OPV3 = 0\n    the .OUT reads \"USER SPECIFIED IRRIGATION\"\
    \ and EPIC waits for\n    scheduled irrigation operations a rainfed-built .OPC does not contain,\n\
    \    so IRGA stays 0.000 -- silently still dryland.\nconfigure_irrigation.py wrote a 5-char-wide integer\
    \ into EPICCONT row 2:\nwrong file, and the wrong field width, so it also shifted every flag after\n\
    position 7 and appended three spurious columns. docs/format_spec.yaml\ncompounded this by prescribing\
    \ \"use configure_irrigation.py which computes\nthe column index\" as the fix for a mis-placed IRR\
    \ flag.\n"
  remedy: "configure_irrigation.py now sets .SIT IRR (preserving the I4 grid) AND the\n.OPC OPV3 trigger\
    \ (through edit_opc.set_auto_trigger -- do not\nre-implement the fixed-width row writer), and no longer\
    \ touches\nEPICCONT.DAT. Modes: dryland/sprinkler/furrow/fertigation/lagoon/drip,\nplus the back-compatible\
    \ aliases auto -> sprinkler, auto_deficit ->\nfurrow, scheduled -> furrow with trigger 0. quickstart\
    \ forwards\n`--irrigation-trigger` (default 0.85). It must run AFTER build_opc, which\nrewrites the\
    \ .OPC from the template.\nVerified at 45.25N 9.75E (Po Valley maize, NASA POWER 1984-1988):\n  dryland\
    \  IRGA 0.0 mm, WS 25-35 stress days, YLDG 7.70 t/ha dry (1984)\n  furrow   IRGA 200-400 mm/yr, WS\
    \ 1.0, YLDG 10.25 t/ha dry (1984), ET\n           468 -> 590 mm/yr.\nNOTE on EPIC_019 remedy (1):\
    \ \"irrigation cannot help\" is a MONSOON-site\nstatement (WS = 0 there). Check the .ACY WS column\
    \ before repeating it --\nat a Mediterranean/continental site WS is large and irrigation moves the\n\
    yield a lot.\n"
  discovered_during: gdhy_maize_povalley_2026_08_10
  tags:
  - irrigation
  - IRR
  - SIT
  - OPV3
  - OPC
  - EPICCONT
  - silent
  - supersedes_EPIC_019
