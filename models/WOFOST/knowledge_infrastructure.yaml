  - id: "export_output_csv"
    name: "Export Output to CSV"
    description: "Export WOFOST simulation output to analysis-ready CSV with lat/lon identifiers for gridded runs"
    stage: "s7_output_parsing"
    script_path: "tools/s7_output_parsing/export_output_csv.py"
    language: "python"
    inputs:
