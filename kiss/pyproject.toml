[project]
name = "kiss-ki"
version = "0.6.57"
description = "Installer and agent handoff for KISS Knowledge Infrastructure packages"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "Pillow>=10.4",
    "certifi>=2024.2.2",
    "truststore>=0.10.4; python_version >= '3.10'",
    "numpy>=2.0,<3",
    "netCDF4>=1.7,<2",
    "scipy>=1.13,<2",
    "spotpy>=1.6.7,<2",
    "pymoo>=0.6.2,<0.7",
]
license = { text = "MIT" }

[project.scripts]
kiss = "kiss_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kiss_cli"]

[tool.setuptools.package-data]
kiss_cli = ["web/*.html", "web/*.svg", "web/*.js", "web/guides/*.html", "web/guides/*.pdf"]
