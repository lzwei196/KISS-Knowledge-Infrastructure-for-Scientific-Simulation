- id: dt_snowpack_uninitialized_imelt_20261003
  symptom: An unchanged city model sometimes has NaN final storage/runoff continuity after GIS construction,
    while a clean-process rerun is finite. Some impervious subareas produce no runoff.
  diagnosis: SWMM 5.2.4 allocates TSnowpack with malloc; snow_initSnowpack does not initialize imelt.
    snow_plowSnow resets imelt only for positive-area surfaces, while snow_getSnowMelt reads it for every
    surface. NaN in a zero-area PLOWABLE surface enters the weighted impervious precipitation through
    0*NaN. The swmmanywhere empty template gives this surface zero area.; The real installed engine reproduces
    NaN final storage when only freshly allocated snowpack memory is filled with NaN before engine initialization.
    Removing the unused template restores finite runoff continuity for every subcatchment under the same
    allocator condition. The regression-only allocator shim is not installed in production.; ['dt_022',
    'dt_swmmanywhere_imperv_overshoot']; EPA 5.2.4 explicitly handles Manning n=0 and clamps imperviousness
    above 100. Those prior proposed mechanisms do not explain this case. Zero infiltration and depression
    storage are retained.
  remedy: run_city_swmm removes only the exact swmmanywhere empty snowpack template, only when there is
    no temperature forcing, climate adjustment, initial snow, or hotstart. Real snow configurations are
    preserved. Check finalized runoff AND routing continuity; missing or non-finite components fail the
    run. For real snow simulations, this engine initialization defect requires an engine fix rather than
    deleting the snow physics.
- id: dt_empty_timeseries_export_20261003
  symptom: extract_results reports success but requested node/link/subcatchment CSVs are absent or contain
    only headers.
  diagnosis: An unused import from nonexistent pyswmm.lib forced report fallback even with pyswmm installed.
    The binary branch also used strings instead of attribute enums and never wrote node data rows. Summary
    parsing reset at the blank line after its heading and mistook the Type field for a number.
  remedy: Use pyswmm.Output with toolkit attribute enums, align all requested series by report time, and
    write complete CSVs only after checking IDs, coverage and finite values. Fail instead of substituting
    an RPT summary for requested time series. Parse native report summary columns when no element IDs
    are requested, labeling the link full-depth ratio explicitly.; Real official example output matches
    every exported CSV value across two nodes, two links and two subcatchments; invalid IDs, non-finite/incomplete
    series and empty reports fail.
