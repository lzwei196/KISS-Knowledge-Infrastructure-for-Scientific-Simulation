      doi: "10.1029/2020MS002263"
      note: "Eddy-permitting viscosity ensemble (NEMO, cross-family proxy): horizontal viscosity controls spurious numerical diapycnal mixing / water-mass drift in z/ALE models."

safety:
  hazards:
    - id: "air_temp_kelvin_not_degC"
      kind: "weather_file_semantic"
      description: "Air-temperature forcing supplied in Kelvin; model reads ~290 K as 290 degC, exploding SST and energy within a few timesteps. (dt_001)"
      severity: "fatal"
      triplet: "dt_001"
    - id: "potential_vs_conservative_temp_eos_mismatch"
      kind: "control_semantic"
      description: "Temperature type (potential vs conservative) mismatched to EQUATION_OF_STATE; slow accumulating ~0.1-0.2 degC/decade drift invisible in short runs. (dt_002, dt_017)"
      severity: "silent"
      triplet: "dt_002"
    - id: "practical_vs_absolute_salinity_eos_mismatch"
      kind: "control_semantic"
      description: "Salinity type (practical PSU vs absolute g/kg) mismatched to EOS; ~0.17 PSU global bias degrading density, MLD and overturning. (dt_003, dt_017)"
      severity: "silent"
      triplet: "dt_003"
    - id: "topography_elevation_sign"
      kind: "soil_semantic"
      description: "Bathymetry given as elevation (positive-up) instead of depth (positive-down); all ocean cells masked, init aborts with 'all points are land'. (dt_005)"
      severity: "fatal"
      triplet: "dt_005"
    - id: "wind_stress_cgs_units"
      kind: "weather_file_semantic"
      description: "Wind stress in dyn/cm^2 (CGS) instead of Pa; currents ~10x too weak, low KE, shallow MLD. (dt_007)"
      severity: "degraded"
      triplet: "dt_007"
    - id: "heat_flux_sign_reversed"
      kind: "weather_file_semantic"
      description: "Surface heat-flux sign reversed (positive-up vs into-ocean); SST drifts the wrong direction, inverted seasonal cycle. (dt_008)"
      severity: "fatal_or_silent"
      triplet: "dt_008"
    - id: "precip_mm_per_day_not_kgm2s"
      kind: "weather_file_semantic"
      description: "Precipitation passed in mm/day without conversion; freshwater flux ~430000x too large, SSS collapses within months. (dt_009)"
      severity: "fatal_or_silent"
      triplet: "dt_009"
    - id: "evap_sign_or_unit_error"
      kind: "weather_file_semantic"
      description: "Evaporation positive-signed or unconverted; net surface freshwater flux adds salt, steady salinity rise. (dt_011)"
      severity: "silent"
      triplet: "dt_011"
    - id: "longwave_downwelling_used_as_net"
      kind: "weather_file_semantic"
      description: "Downwelling LW supplied where net LW expected; ~350 W/m^2 extra heating, persistent 2-5 degC SST warm bias. (dt_019)"
      severity: "silent"
      triplet: "dt_019"
    - id: "ic_pressure_dbar_not_pa"
      kind: "initial_condition_semantic"
      description: "Initial-condition pressure in dbar instead of Pa for external EOS prep; density at depth wrong by factor 10000, wrong deep water masses. (dt_010)"
      severity: "silent"
      triplet: "dt_010"
    - id: "layer_thickness_kgm2_under_boussinesq"
      kind: "initial_condition_semantic"
      description: "Initial layer thickness in kg/m^2 under default Boussinesq mode (expects meters); thicknesses blow up and ALE regridding oscillates. (dt_020)"
      severity: "degraded"
      triplet: "dt_020"
    - id: "dt_in_hours_not_seconds"
      kind: "control_semantic"
      description: "Baroclinic timestep DT specified in hours/minutes instead of seconds; immediate CFL violation, negative thickness, crash at first step. (dt_014)"
      severity: "fatal"
      triplet: "dt_014"
    - id: "dtbt_too_large_for_grid"
      kind: "numerical_instability"
      description: "Barotropic DTBT exceeds barotropic CFL (dx/sqrt(g*H_max)); negative thickness / velocity truncation after a few steps. (dt_015)"
      severity: "fatal"
      triplet: "dt_015"
    - id: "domain_decomposition_indivisible"
      kind: "control_semantic"
      description: "Global grid dims not divisible by MPI process count, or over-masked land PEs; domain-decomposition error at startup. (dt_016)"
      severity: "fatal"
      triplet: "dt_016"
    - id: "diag_table_name_mismatch"
      kind: "parser_semantic"
      description: "diag_table field name does not match a registered diagnostic; MOM6 silently ignores it and writes zeros/missing output. (dt_018)"
      severity: "silent"
      triplet: "dt_018"
    - id: "negative_layer_thickness_blowup"
      kind: "numerical_instability"
      description: "CFL/barotropic instability produces negative layer thickness; ocean.stats energy grows exponentially and velocity truncation counts rise. (consequence of dt_014/dt_015)"
      severity: "fatal"
  validation_limits:
    - "Hydrostatic primitive equations: cannot resolve non-hydrostatic / convective-scale dynamics."
    - "Regional domains require externally prescribed open-boundary data per segment; without it the interior is unconstrained."
    - "Sea-ice and atmospheric dynamics are out of scope (coupled components / prescribed forcing only)."
    - "Requires an orthogonal horizontal grid (spherical, tripole, regional, or cubed-sphere)."
  warnings:
    - "Model aborts if the RESTART/ directory is absent."
    - "DT has no default and aborts if missing; DT_THERM defaults to DT."
    - "Remapped diagnostics are for interpretation only and do not affect the native calculation."
    - "Some MOM_input parameters are mandatory; MOM_parameter_doc.all enumerates all settings."
    - "Stability monitoring: CFL<0.5 safe, <0.8 acceptable, >1.0 unstable; truncation count should stay 0 and ocean.stats energy stable or decreasing."
  assumptions:
    - statement: "The ocean is solved hydrostatically on an Arakawa C-grid with a generalized ALE vertical coordinate; vertical velocity is diagnosed."
      scope: "whole-model geometry and dynamics"
      source: "MOM6 Governing Equations and Discrete Grids docs (mom6.readthedocs.io)"
      status: "adopted"
    - statement: "Boussinesq mode (div.v=0, layer thickness in meters) is the default configuration; non-Boussinesq (kg/m^2) is optional."
      scope: "mass/volume closure and thickness units"
      source: "MOM6 Governing Equations docs; MOM_verticalGrid RHO_0 default behaviour"
      status: "adopted"
    - statement: "Required temperature/salinity types are dictated by EQUATION_OF_STATE (TEOS-10 = conservative T + absolute S; Wright/UNESCO = potential T + practical S); inconsistency produces accumulating density bias."
      scope: "thermodynamic inputs and density closure"
      source: "MOM_EOS module behaviour and MOM6 equation-of-state docs"
      status: "adopted"
    - statement: "Hardcoded physical-constant defaults are RHO_0=1035 kg/m^3, G_EARTH=9.80 m/s^2, C_P=3991.868 J/kg/K unless overridden in MOM_input."
      scope: "Boussinesq scaling, pressure-gradient and heat-budget calculations"
      source: "MOM_verticalGrid.F90 / MOM.F90 get_param defaults"
      status: "adopted"
