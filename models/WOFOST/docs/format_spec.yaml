- id: dt_022
  symptom: Several points give exactly the same yield, or a point keeps old weather after its CSV was
    rebuilt. No error.
  diagnosis: 'pcse CSVWeatherDataProvider keeps a pickle cache keyed on the CSV file''s BASENAME only
    and reuses it when the cache is newer than the CSV. Weather files with the same name in different
    folders (weather_pcse.csv per cell) can all load the first cell''s weather.; Seen in tools/calib_run.py
    development: all 15 cells returned one yield. The real-case runner escaped only because it rebuilt
    each CSV just before use.

    ; [''CSVWeatherDataProvider'', ''run_wofost_simulation'']'
  remedy: Give every point its own weather file name, e.g. weather_pcse_<lat>_<lon>.csv.; build_pcse_weather_from_source;
    ['Pass --output weather_pcse_<lat>_<lon>.csv (both run scripts do).', 'When in doubt load with CSVWeatherDataProvider(path,
    force_reload=True).']; Never reuse a weather file name for two points.
  severity: silent
- id: dt_023
  symptom: build_pcse_weather_from_source exits with code 2 and "REFUSED, nothing written".
  diagnosis: 'The source cannot give a complete daily record for the point and period: a missing or non-finite
    value, a time axis that is not one row per day, a period not fully covered (NASA POWER daily starts
    1981 and answers HTTP 422 before that; CMFD is China only), or an impossible value (negative rain
    / radiation / wind, humidity or pressure <= 0, TMIN > TMAX).; The tool makes no values up. A gap filled
    by hand hides a source problem and moves the yield without a trace. Known limit: the shared NASA POWER
    loader itself turns a missing rain value into 0 and a missing Tmin/Tmax into Tmean before the tool
    sees them; the tool cannot catch those.

    ; [''s3_weather_prep'']'
  remedy: 'Read the message (it names the variable and the first bad day), then pick another source or
    period. Do not patch the file by hand.; build_pcse_weather_from_source; [''Outside China: --source
    mswx (local) or nasa_power. Before 1981: mswx (from 1979) or cmfd.'', ''nasa_power needs the network;
    a fetch error is also reported as REFUSED. Retry once, then say the source did not answer.'']; Check
    <output>.summary.json after every build.'
  severity: fatal
