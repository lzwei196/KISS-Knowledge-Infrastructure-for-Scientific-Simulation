kiss_manifest_version: 1
model: Pywr
binary_type: Python
verified: observed
install_dir: Pywr

acquire:
  strategy: pip
  package: pywr
  produces: pywr

python_deps: [pywr]

reference_case: >-
  python -c "import pywr; print(pywr.__name__, 'importable')"

notes: >-
  OBSERVED 2026-08-18: `kiss init Pywr` installed pywr 1.31.1 into a clean venv
  and the KI's own preflight_check.py passed with no hand-written recipe. The
  package name was resolved from the KI directory name and confirmed by import,
  not assumed from a PyPI name match.
