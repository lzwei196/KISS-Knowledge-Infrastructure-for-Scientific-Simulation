entries:
- id: err_001
  timestamp: '2026-03-19T22:00:00Z'
  recorded_by: claude
  run_context:
    basin: chaohe
    model: WRF-Hydro
    run_name: chaohe_wrf_test
  stage: s4_fulldom
  failure_domain: parameter_format
  symptom:
    description: Boundary cells in Fulldom_hires.nc have non-zero FLOWDIRECTION values pointing outside the grid, causing
      WRF-Hydro to crash with 'Apparent error in network topology' during routing initialization
    error_pattern: Apparent error in network topology
    detection_method: log_match
  diagnosis:
    root_cause: WhiteboxTools D8 pointer assigns flow directions to all cells including boundary cells, but WRF-Hydro requires
      boundary cells to have FLOWDIRECTION=0
    explanation: When boundary cells have flow directions pointing outside the grid (e.g., a cell on the eastern edge pointing
      east), the routing module follows the flow path to a nonexistent cell index, triggering a topology check failure. The
      fix is to set all boundary cells to FLOWDIRECTION=0 after D8 computation.
    affected_components:
    - Fulldom_hires.nc
    - module_HYDRO_routing.F
  resolution:
    action: Set FLOWDIRECTION=0 for all boundary cells (row 0, row ny-1, col 0, col nx-1) in Fulldom_hires.nc after WhiteboxTools
      processing
    files_changed:
    - tools/s4_fulldom/build_fulldom_hires.py
    prevention: build_fulldom_hires.py automatically zeros boundary flow directions
  severity: fatal
  promoted: true
  promoted_as: dt_001
- id: err_002
  timestamp: '2026-03-19T22:00:00Z'
  recorded_by: claude
  run_context:
    basin: chaohe
    model: WRF-Hydro
    run_name: chaohe_wrf_test
  stage: s7_spatial_metadata
  failure_domain: parameter_format
  symptom:
    description: WRF-Hydro crashes at startup with 'Unable to get x resolution in LAND spatial metadata file' when reading
      GEOGRID_LDASOUT_Spatial_Metadata.nc
    error_pattern: Unable to get x resolution in LAND spatial metadata file
    detection_method: log_match
  diagnosis:
    root_cause: The x and/or y coordinate variables in GEOGRID_LDASOUT_Spatial_Metadata.nc are missing the 'resolution' attribute
      that WRF-Hydro requires
    explanation: WRF-Hydro reads grid spacing from the 'resolution' attribute of x and y coordinate variables. Standard NetCDF
      conventions do not require this attribute, so many tools omit it. The attribute must be a float equal to the grid spacing
      in metres. This is a WRF-Hydro-specific requirement not documented in CF conventions.
    affected_components:
    - GEOGRID_LDASOUT_Spatial_Metadata.nc
    - module_RT_data.F
  resolution:
    action: Add 'resolution' attribute to x and y coordinate variables in Spatial_Metadata.nc and Fulldom_hires.nc
    files_changed:
    - tools/s6_groundwater/build_groundwater.py
    prevention: Always add resolution attribute when creating x/y coordinate variables in NetCDF files for WRF-Hydro
  severity: fatal
  promoted: true
  promoted_as: dt_002
- id: err_003
  timestamp: '2026-03-19T22:00:00Z'
  recorded_by: claude
  run_context:
    basin: chaohe
    model: WRF-Hydro
    run_name: chaohe_wrf_test
  stage: s4_fulldom
  failure_domain: parameter_format
  symptom:
    description: WRF-Hydro crashes at startup with 'Unable to find x coordinate in FullDom file' when reading Fulldom_hires.nc
    error_pattern: Unable to find x coordinate in FullDom file
    detection_method: log_match
  diagnosis:
    root_cause: Fulldom_hires.nc is missing the x and/or y 1D coordinate variables, or the variables exist but lack the 'resolution'
      attribute
    explanation: WRF-Hydro searches for 1D coordinate variables named 'x' and 'y' in Fulldom_hires.nc with a 'resolution'
      attribute. If the file was created with only 2D LATITUDE/LONGITUDE but no 1D projected coordinate arrays, WRF-Hydro
      cannot determine the routing grid geometry.
    affected_components:
    - Fulldom_hires.nc
    - module_RT_data.F
  resolution:
    action: Ensure Fulldom_hires.nc has 1D x(x) and y(y) coordinate variables with 'resolution' attribute set to routing grid
      spacing
    files_changed:
    - tools/s4_fulldom/build_fulldom_hires.py
    prevention: build_fulldom_hires.py creates proper 1D coordinate variables with resolution attribute
  severity: fatal
  promoted: true
  promoted_as: dt_003
- id: err_004
  timestamp: '2026-03-19T22:00:00Z'
  recorded_by: claude
  run_context:
    basin: chaohe
    model: WRF-Hydro
    run_name: chaohe_wrf_test
  stage: s8_forcing
  failure_domain: path_resolution
  symptom:
    description: WRF-Hydro reports 'no forcing data found' when simulation period extends beyond the last available LDASIN_DOMAIN1
      file in the FORCING/ directory
    error_pattern: no forcing data found
    detection_method: log_match
  diagnosis:
    root_cause: The simulation end date (KHOUR) extends beyond the last available LDASIN_DOMAIN1 file timestamp
    explanation: LDASIN files follow YYYYMMDDHH.LDASIN_DOMAIN1 naming. WRF-Hydro reads them sequentially. If KHOUR requires
      timesteps past the last file, the model crashes. This commonly happens when KHOUR includes the full last day but the
      last LDASIN file is at 23:00 of end_date rather than 00:00 of end_date+1.
    affected_components:
    - FORCING/ directory
    - namelist.hrldas KHOUR
    - hrldas_drv_HYDRO.F
  resolution:
    action: Ensure LDASIN files cover the full simulation period, or reduce KHOUR to match available forcing
    files_changed: []
    prevention: generate_namelists.py checks FORCING file count against KHOUR
  severity: fatal
  promoted: true
  promoted_as: dt_005
