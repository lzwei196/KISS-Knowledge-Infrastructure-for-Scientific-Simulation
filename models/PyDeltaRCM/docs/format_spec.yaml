model:
  name: "PyDeltaRCM"
  version: "2.2.0"
  domain: "Geomorphology / Delta Evolution / Sediment Transport"
  binary_path: "/home/server/knowledge-dissection-toolkit/auto_dissect/_work/PyDeltaRCM/venv/bin/python"
  binary_type: "python_package"
  cli_command: "pyDeltaRCM --config <config.yml>"
  python_api: "pyDeltaRCM.DeltaModel"

inputs:
  config_format: "YAML"
  forcing:
    - name: "u0"
      unit: "m/s"
      description: "Reference inlet velocity"
      valid_range: [0.1, 5.0]
      default: 1.0
    - name: "h0"
      unit: "m"
      description: "Reference inlet depth"
      valid_range: [0.5, 20.0]
      default: 5.0
    - name: "C0_percent"
      unit: "%"
      description: "Sediment concentration as percentage"
      valid_range: [0.01, 1.0]
      default: 0.1
    - name: "f_bedload"
      unit: "fraction"
      description: "Fraction of sediment as bedload"
      valid_range: [0.0, 1.0]
      default: 0.5
    - name: "SLR"
      unit: "m/s"
      description: "Sea level rise rate in model time"
      valid_range: [0.0, 1.0e-6]
      default: 0.0
    - name: "subsidence_rate"
      unit: "m/s"
      description: "Maximum subsidence rate in model time"
      valid_range: [0.0, 1.0e-6]
      default: 2.0e-9
  parameters:
    critical:
      - name: "Length"
        unit: "m"
        valid_range: [500, 100000]
        default: 5000
        description: "Domain length (parallel to inlet)"
      - name: "Width"
        unit: "m"
        valid_range: [500, 200000]
        default: 10000
        description: "Domain width (perpendicular to inlet)"
      - name: "dx"
        unit: "m"
        valid_range: [5, 500]
        default: 50
        description: "Cell face length (grid resolution)"
      - name: "N0_meters"
        unit: "m"
        valid_range: [50, 5000]
        default: 250
        description: "Inlet channel width"
      - name: "S0"
        unit: "dimensionless"
        valid_range: [0.00001, 0.01]
        default: 0.00015
        description: "Characteristic topset slope"
      - name: "Np_water"
        unit: "count"
        valid_range: [100, 50000]
        default: 2000
        description: "Number of water parcels per timestep"
      - name: "Np_sed"
        unit: "count"
        valid_range: [100, 50000]
        default: 2000
        description: "Number of sediment parcels per timestep"
      - name: "itermax"
        unit: "count"
        valid_range: [1, 20]
        default: 3
        description: "Water routing iterations per timestep"
    stability:
      - name: "gamma"
        unit: "dimensionless"
        formula: "g * S0 * dx / u0^2"
        valid_range: [0.0, 0.1]
        description: "Water routing weight coefficient; >0.1 causes instability"

outputs:
  format: "NetCDF4"
  filename_pattern: "pyDeltaRCM_output.nc"
  dimensions:
    - name: "seconds"
      description: "Model time in seconds (unlimited)"
    - name: "x"
      unit: "m"
      description: "Grid x-coordinates (Length/dx cells)"
    - name: "y"
      unit: "m"
      description: "Grid y-coordinates (Width/dx cells)"
  primary:
    - name: "eta"
      unit: "m"
      dimensions: ["seconds", "x", "y"]
      valid_range: [-50.0, 50.0]
      description: "Bed elevation"
    - name: "depth"
      unit: "m"
      dimensions: ["seconds", "x", "y"]
      valid_range: [0.0, 50.0]
      description: "Water depth"
    - name: "stage"
      unit: "m"
      dimensions: ["seconds", "x", "y"]
      valid_range: [-50.0, 50.0]
      description: "Water surface elevation"
    - name: "velocity"
      unit: "m/s"
      dimensions: ["seconds", "x", "y"]
      valid_range: [0.0, 10.0]
      description: "Flow velocity magnitude"
    - name: "discharge"
      unit: "m2/s"
      dimensions: ["seconds", "x", "y"]
      valid_range: [0.0, 1000.0]
      description: "Water discharge magnitude"
    - name: "sedflux"
      unit: "m3/s"
      dimensions: ["seconds", "x", "y"]
      valid_range: [0.0, 100.0]
      description: "Sediment flux"
    - name: "sandfrac"
      unit: "fraction"
      dimensions: ["seconds", "x", "y"]
      valid_range: [0.0, 1.0]
      description: "Sand fraction"

known_issues:
  - "gamma > 0.1 causes numerical instability — reduce dx, reduce S0, or increase u0"
  - "SLR and subsidence_rate are in m/s of MODEL time, not real time — must convert via intermittency factor"
  - "C0_percent is in %, not fraction — common mistake causes 100x sediment error"
  - "f_bedload must be fraction 0-1, not percentage — crash if >1"
  - "save_dt is in seconds of model time, not days"
