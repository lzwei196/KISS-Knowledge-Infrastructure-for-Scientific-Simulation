safety:
  hazards:
    - id: "grid_header_mismatch"
      kind: "soil_semantic"
      description: "Inconsistent ESRI ASCII headers (ncols/nrows/corner/cellsize) across morphological grids crash mHM at startup ('Number of rows/columns do not match'); even 0.0001 differences are fatal."
      severity: "fatal"
    - id: "resolution_not_integer_multiple"
      kind: "control_semantic"
      description: "L1 or L11 resolution not an exact integer multiple of L0 triggers a fatal 'Resolution mismatch' at startup."
      severity: "fatal"
    - id: "coord_sys_flag_zeroes_discharge"
      kind: "control_semantic"
      description: "iFlag_cordinate_sys=0 on a geographic lat/lon grid computes cell area as cellsize^2 m^2, collapsing accumulated/routed discharge to near-zero while gridded states remain non-zero."
      severity: "silent"
    - id: "missing_forcing"
      kind: "weather_file_semantic"
      description: "Forcing NetCDF with wrong path, wrong variable name (must be pre/tavg/pet), or time range not covering the evaluation period crashes 'No meteorological data found'."
      severity: "fatal"
    - id: "precip_subdaily_not_aggregated"
      kind: "weather_file_semantic"
      description: "Sub-daily precipitation fed as daily without aggregation biases discharge 8x-240x; mHM cannot detect the unit/aggregation error."
      severity: "silent"
    - id: "temperature_in_kelvin"
      kind: "weather_file_semantic"
      description: "Temperature left in Kelvin (not converted to degC) silently breaks snow thresholds, degree-day melt, and PET."
      severity: "silent"
    - id: "fdir_wrong_d8_convention"
      kind: "control_semantic"
      description: "fdir.asc in a non-ArcGIS D8 convention (e.g. WhiteboxTools 0-7) breaks the routing network silently, zeroing routed discharge while the model still runs."
      severity: "silent"
    - id: "soil_classdef_column_order"
      kind: "soil_semantic"
      description: "Wrong column order in soil_classdefinition.txt (e.g. clay/sand swapped) makes pedotransfer functions produce wrong Ksat/porosity everywhere; the model runs without error."
      severity: "silent"
    - id: "soil_geology_id_undefined_nodata"
      kind: "soil_semantic"
      description: "Soil/geology IDs in grids absent from the classdefinition, or -9999 NODATA leaking into valid cells, propagate NaN into output fields."
      severity: "degraded"
    - id: "single_class_geology_zero_baseflow"
      kind: "soil_semantic"
      description: "A single-class or malformed geology grid/classdefinition silently zeroes baseflow despite a wet climate."
      severity: "silent"
    - id: "gauge_id_not_in_grid"
      kind: "control_semantic"
      description: "A Gauge_id in mhm.nml with no matching cell in idgauges.asc, or a gauge ID landing on a NODATA (-9999) cell, crashes mHM at startup with 'Gauge ID not found in grid'."
      severity: "fatal"
    - id: "parameter_out_of_bounds"
      kind: "coefficient_runtime_silent_fallback"
      description: "A value in mhm_parameter.nml outside its [lower, upper] bounds crashes 'Parameter out of range'."
      severity: "fatal"
    - id: "pet_method_forcing_mismatch"
      kind: "control_semantic"
      description: "processCase(5)=1 (Hargreaves-Samani) with only tavg (no tmin/tmax) makes mHM silently reuse tavg, biasing PET and aET."
      severity: "silent"
    - id: "interflow_factor_at_lower_bound"
      kind: "coefficient_runtime_silent_fallback"
      description: "interflowStorageCapacityFactor pinned at its lower bound routes all water to groundwater, silently zeroing interflow even in steep terrain."
      severity: "silent"
    - id: "routing_resolution_timing_shift"
      kind: "control_semantic"
      description: "resolution_Routing not matching the actual L11 cellsize miscomputes Muskingum travel time, shifting peak timing by 1-3 days."
      severity: "silent"
    - id: "cold_start_soil_moisture_default"
      kind: "initial_condition_semantic"
      description: "Without a restart file, every soil horizon is initialized to 0.5 x field capacity (hardcoded), biasing early-period results until the spin-up dissipates the assumption."
      severity: "degraded"
  validation_limits:
    - "Default MPR parameters are calibrated for German (Mosel) basins and transfer poorly to dissimilar climates without recalibration or climate-zone presets."
    - "MPR transfer requires calibration and target basins to share identical L0 physiographic data sources/classification schemes; mismatched sources silently invalidate the transfer functions."
    - "Daily-to-hourly timestep cannot resolve sub-hourly flash-flood dynamics."
    - "No native 3-D groundwater, water-quality, or reservoir-operation processes."
    - "Ground-albedo-neutrons output is developer-flagged 'work in progress, do not use for research'."
  warnings:
    - "Multi-basin calibration with an objective function not normalized by area/timesteps biases toward the largest basin."
    - "Aspect computed in the wrong CRS row-orientation flips N/S and corrupts aspect-driven PET correction."
    - "A gauge whose L0 cell maps to an L11 cell with no upstream drainage yields all-zero gauge discharge despite a valid routed field."
  assumptions:
    - statement: "mHM closes a water mass balance per L1 cell over a three-level (L0/L1/L11) grid hierarchy; there is no surface energy-balance closure (ET is the selected PET method's demand-side flux)."
      scope: "all water-balance fluxes and storages"
      source: "mHM user manual (mhm.pages.ufz.de) and mo_mhm / mo_soil_moisture module structure"
      status: "adopted"
    - statement: "Default global parameters in mhm_parameter.nml were calibrated on German basins and are assumed transferable to other catchments via MPR transfer functions."
      scope: "MPR global parameters / ungauged-basin transfer"
      source: "mHM getting-started docs (mhm.pages.ufz.de/.../getstarted.html); Samaniego et al. 2010 (DOI 10.1029/2008WR007327)"
      status: "tentative"
    - statement: "Without a restart file the model cold-starts soil moisture at half field capacity and other storages at fixed internal constants, so early simulation results carry a spin-up assumption."
      scope: "initial conditions / early-period output"
      source: "mo_mhm.f90 cold-start initialization and mo_mhm_constants.f90 InitStateFluxes constants"
      status: "adopted"
    - statement: "The river-temperature and cosmic-ray-neutron modules are optional diagnostics (processCase 10/11), off by default and not part of the core water-balance closure."
      scope: "optional process modules"
      source: "mo_neutrons / mo_mrm_riv_temp_class module behavior and mhm_outputs.nml WORK-IN-PROGRESS flag"
      status: "adopted"
