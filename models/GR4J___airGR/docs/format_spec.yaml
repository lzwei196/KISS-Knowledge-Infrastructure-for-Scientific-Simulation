# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: GR4J___airGR
  language: fortran
  implementation:
    id: airgr-gr4j
    version: airGR 1.7.8
    provenance: Fortran 90 water-balance core (frun_GR4J.f90) wrapped by the R package airGR (INRAE /
      HYCAR, Antony).
  scientific_reference_version: GR4J (Perrin, Michel & Andreassian 2003, J. Hydrology 279:275-289)
inputs:
  forcing:
  - name: Precip
    unit: mm/day
    category: forcing
    source_kind: forcing
    model_input_format: catchment-average daily precipitation total (sum of any sub-daily values), aligned
      1:1 with DatesR
    notes: Must be >= 0 with no NA (NA triggers a stop() at input creation). Sub-daily forcing must be
      SUMMED to daily, not averaged.
  - name: PotEvap
    unit: mm/day
    category: forcing
    source_kind: forcing
    model_input_format: daily catchment-average potential evapotranspiration, aligned 1:1 with DatesR
    notes: Either observed/pre-computed or derived from the Oudin formula (PE = GE*(T+5)/100/28.5 for
      T >= -5 degC, GE = extraterrestrial radiation from Julian day + latitude). Must be >= 0, no NA.
  - name: DatesR
    unit: POSIXt
    category: forcing
    source_kind: forcing
    model_input_format: continuous daily date vector (no gaps, no duplicates), same length as Precip and
      PotEvap
  parameters:
  - name: X1 — production store capacity
    unit: mm
    category: parameter
    source_kind: calibrated
    model_input_format: scalar real; typical 100-1200 mm; calibrated in log space
    notes: Maximum capacity of the production (soil-moisture) store.
  - name: X2 — inter-catchment exchange coefficient
    unit: mm/day
    category: parameter
    source_kind: calibrated
    model_input_format: scalar real; typical -5 to 3 mm/day; can be negative (catchment loses water to
      groundwater); calibrated in sinh space
    notes: Groundwater exchange term; sign sets water gain vs loss.
  - name: X3 — routing store capacity
    unit: mm
    category: parameter
    source_kind: calibrated
    model_input_format: scalar real; typical 20-300 mm; calibrated in log space
    notes: Maximum (one-day-ahead) capacity of the nonlinear routing store.
  - name: X4 — unit hydrograph time constant
    unit: day
    category: parameter
    source_kind: calibrated
    model_input_format: scalar real; typical 1.1-2.9 d; calibrated via linear rescaling; hard physical
      floor 0.5 d
    notes: Time base of UH1 (length X4) and UH2 (length 2*X4).
  initial_conditions:
  - name: Production store initial level
    unit: mm
    category: initial_condition
    source_kind: default
    model_input_format: fraction of X1 (default 0.30 * X1) or supplied state vector index 1
    notes: Stores typically start far from equilibrium; >= 1 year warm-up advised (2-3 yr for arid catchments).
  - name: Routing store initial level
    unit: mm
    category: initial_condition
    source_kind: default
    model_input_format: fraction of X3 (default 0.50 * X3) or supplied state vector index 2
  - name: UH1 / UH2 initial ordinate storages
    unit: mm
    category: initial_condition
    source_kind: default
    model_input_format: default all-zero; or supplied at state-vector offsets 7+K (UH1) and 7+NH+K (UH2)
  boundary_conditions:
  - name: Warm-up period selection
    unit: timesteps (days)
    category: boundary_condition
    source_kind: user_provided
    model_input_format: warm-up index window preceding the run period; >= 1 year recommended
    notes: Control choice that sets how far stores are spun up before the scored run window.
  - name: Optional CemaNeige snow coupling
    unit: switch
    category: boundary_condition
    source_kind: user_provided
    model_input_format: selection of RunModel_CemaNeigeGR4J in place of RunModel_GR4J; adds TempMean,
      HypsoData, CTG, Kf
    notes: Upstream snow module; off by default. When on, the run is no longer pure GR4J.
outputs:
  primary:
  - name: Qsim
    unit: mm/day
    description: Simulated total catchment discharge at the outlet, QR (routing branch) + QD (direct branch).
    validation_rank: 1
    emitted_in: OutputsModel$Qsim (MISC index 18)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Observed gauge discharge must be converted to mm/day over catchment area (m3/s -> mm/day = *86.4/area_km2)
          before comparison; unit mismatch silently destroys NSE.
        - Warm-up period (>= 1 yr) must be excluded from the scored window; first 6-12 months are transient.
        - NSE is insensitive to bias/variability — pair with KGE to expose bias (beta) and variability
          (alpha) errors.
      detrending_options:
      - none
  - name: AE
    unit: mm/day
    description: Actual evapotranspiration (catchment water loss to the atmosphere) drawn from the production
      store.
    validation_rank: 2
    emitted_in: OutputsModel$AE (MISC index 6)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Conceptual store-draw AE, not an energy-balance ET; comparison to satellite/flux ET products
          is structurally approximate.
      detrending_options:
      - none
  - name: Prod
    unit: mm
    description: Production (soil-moisture) store level.
    validation_rank: 3
    emitted_in: OutputsModel$Prod (MISC index 3)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Conceptual store in mm, not a physical soil-moisture depth; at most pattern/anomaly comparison
          to soil-moisture indices, not absolute magnitude.
        - 'magnitude_accuracy deliberately omitted: the conceptual store level is not a measurable depth,
          so only temporal/anomaly pattern is comparable (intentional single-family deviation from the
          time_series_comparison default).'
      detrending_options:
      - first_difference
  - name: AExch
    unit: mm/day
    description: Total actual inter-catchment groundwater exchange (open-boundary source/sink).
    validation_rank: 4
    emitted_in: OutputsModel$AExch (MISC index 15)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Rarely directly observed; chiefly a water-balance closure diagnostic. Persistent large magnitude
          can mask forcing errors.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: PE values extremely high (>50 mm/day). All precipitation evaporates. Qsim near zero.
  diagnosis: Temperature in Kelvin instead of Celsius when computing PE_Oudin; PE_Oudin expects temperature
    in degrees Celsius. CMFD and ERA5 provide temperature in Kelvin. If 273.15 is not subtracted, PE_Oudin
    computes with T=293 instead of T=20, yielding PE ~300 mm/day instead of ~5 mm/day. The production
    stor
  remedy: Subtract 273.15 from temperature before calling PE_Oudin; convert_forcing_to_gr4j; ['Check mean
    temperature in forcing CSV — should be -10 to +35 degC', 'If mean temperature > 200, values are in
    Kelvin — subtract 273.15']; convert_forcing_to_gr4j auto-detects and converts if mean > 200
  severity: silent
- id: dt_002
  symptom: Mean precipitation < 0.01 mm/day. Model produces near-zero runoff despite wet climate.
  diagnosis: 'Precipitation in m/day instead of mm/day — 1000x too small; GR4J expects precipitation in
    mm/day. If precipitation is provided in m/day (e.g., from some reanalysis products), values are 1000x
    too small. A normal rainy day of 10 mm appears as 0.01 m, and the production store barely fills.

    ; [''convert'
  remedy: Multiply precipitation by 1000 to convert m/day to mm/day; convert_forcing_to_gr4j; ['Check
    max daily precipitation — should be 1-200 mm/day for most climates', 'If max precip < 0.5, values
    are likely in m/day — multiply by 1000']; validate_outputs() checks for mean precip < 0.01
  severity: silent
- id: dt_003
  symptom: Total annual precipitation about 1/8 of expected. Runoff much too low.
  diagnosis: Sub-daily precipitation averaged instead of summed to daily; When aggregating 3-hourly CMFD
    precipitation to daily, the 8 timesteps per day must be SUMMED, not averaged. Averaging gives 1/8
    of the correct daily total. For example, a day with 8 x 2.5 mm/3hr = 20 mm/day total, but averaging
    gives only
  remedy: Use sum() instead of mean() when aggregating sub-daily precipitation; convert_forcing_to_gr4j;
    ['Check annual precipitation total — should match climate atlas values', 'If annual P is ~1/8 of expected,
    sub-daily values were averaged not summed']; convert_forcing_to_gr4j always uses .sum() for precip
  severity: silent
- id: dt_004
  symptom: NSE = -infinity or very large negative. Calibration fails to converge.
  diagnosis: Observed discharge in m3/s or l/s not converted to mm/day; GR4J outputs discharge in mm/day.
    Observed discharge for calibration must also be in mm/day. If Qobs is provided in m3/s (typical gauge
    unit), the values are orders of magnitude larger than simulated Qsim, giving NSE approaching -infinity.
    C
  remedy: 'Convert observed discharge to mm/day using catchment area; convert_forcing_to_gr4j; [''Check
    if Qobs values are in same range as Qsim (typically 0-20 mm/d)'', ''If Qobs values are 100-10000,
    they are likely in m3/s or l/s'', ''Apply: Qmm = Q_m3s * 86.4 / area_km2'']; convert_forcing_to_gr4j
    auto-converts '
  severity: silent
- id: dt_005
  symptom: Qobs values 1000x larger than Qsim. Calibration produces extreme parameter values.
  diagnosis: 'Observed discharge in l/s not converted to mm/day; Similar to dt_004 but with l/s unit.
    l/s values are 1000x larger than m3/s. Conversion: Qmm = Q_ls * 0.0864 / area_km2.

    ; [''convert_forcing_to_gr4j'']'
  remedy: 'Convert l/s to mm/day: Qmm = Q_ls / 1000 * 86.4 / area_km2; convert_forcing_to_gr4j; [''Check
    Qobs column header for unit hint (Qls, Q_ls, etc.)'', ''Divide by 1000 to get m3/s, then apply m3/s-to-mm/day
    conversion'']; Column naming convention (Q_ls) triggers auto-conversion'
  severity: silent
- id: dt_006
  symptom: First 6-12 months of simulation have unrealistic discharge pattern. Sharp transient at start.
  diagnosis: No warmup period or warmup too short; GR4J has two stores and 60 unit hydrograph states.
    Default initialization sets production store to 30% of X1 and routing store to 50% of X3. These may
    be far from equilibrium. Without a warmup period (at least 1 year), the first months show unrealistic
    transient
  remedy: Ensure at least 1 year of warmup before the run period; run_gr4j; ['Set IndPeriod_WarmUp to
    cover at least 365 days before IndPeriod_Run', 'Or use NULL for IndPeriod_WarmUp to let airGR auto-select
    1 year', 'For arid catchments, consider 2-3 years of warmup']; run_gr4j defaults to warmup_years=1
  severity: semi_silent
- id: dt_007
  symptom: PE values extremely high (>100 mm/day). Production store empty. Very low runoff.
  diagnosis: 'PE in mm/month instead of mm/day; Some PE datasets (e.g., CRU, MODIS) provide monthly PE
    totals. If these are used directly as daily values, PE is ~30x too high. A monthly PE of 150 mm becomes
    150 mm/day instead of ~5 mm/day.

    ; [''convert_forcing_to_gr4j'']'
  remedy: 'Divide monthly PE by number of days in month; convert_forcing_to_gr4j; [''Check PE range: daily
    PE should be 0-15 mm/day for most climates'', ''If PE > 50 mm/day, values may be monthly totals''];
    validate_outputs() warns if max PE > 30 mm/d'
  severity: silent
- id: dt_008
  symptom: 'R error: stop() with message about NA values in Precip or PotEvap.'
  diagnosis: 'Missing values (NA) in precipitation or PE time series; airGR does not allow any NA values
    in Precip or PotEvap. Even a single NA causes an error. This often happens at the edges of reanalysis
    coverage or during data merging when dates don''t align perfectly.

    ; [''CreateInputsModel'']'
  remedy: 'Gap-fill NA values before creating InputsModel; convert_forcing_to_gr4j; [''Find NA values:
    which(is.na(Precip)) in R'', ''Fill with interpolation, zero (for precip), or nearest value'', ''Or
    truncate time series to remove leading/trailing NAs'']; convert_forcing_to_gr4j fills NAs with interpolation'
  severity: error
- id: dt_009
  symptom: 'R error: IndPeriod_Run should be of type integer.'
  diagnosis: 'Run period indices are numeric (double) instead of integer; R''s seq() function creates
    numeric vectors by default. airGR requires integer vectors for IndPeriod_Run and IndPeriod_WarmUp.
    This is a common R gotcha.

    ; [''CreateRunOptions'']'
  remedy: 'Wrap with as.integer(): Ind_Run <- as.integer(seq(start, end)); run_gr4j; [''Use seq.int()
    instead of seq() for integer sequences'', ''Or wrap: Ind_Run <- as.integer(Ind_Run)'']; run_gr4j R
    script uses as.integer() by default'
  severity: error
- id: dt_010
  symptom: Calibrated X1 at upper bound (>1500 mm). Model absorbs all rain.
  diagnosis: Search range too narrow, or precipitation systematically too high; If X1 hits the upper bound
    of the calibration search range, it means the model needs an unrealistically large production store
    to match observations. This usually indicates precipitation is too high (wrong unit or wrong catchment
    ave
  remedy: Check precipitation values and unit conversions first; convert_forcing_to_gr4j; ['Compare forcing
    annual precip with climate atlas values', 'If precip is correct, widen CalibOptions search range for
    X1']; validate_outputs() checks for boundary-hitting parameters
  severity: semi_silent
- id: dt_011
  symptom: 'Warning: Param[4] (X4: unit hydrograph time constant [d]) < 0.50. X4 set to 0.50.'
  diagnosis: X4 below minimum threshold of 0.5 days; X4 controls the unit hydrograph time base. Values
    below 0.5 days are physically meaningless for a daily model (response faster than timestep). airGR
    clips X4 to 0.5 with a warning. This usually means the catchment responds very fast, which may indicate
    the cat
  remedy: Accept the clipping if catchment is small/fast-responding; run_gr4j; ['If catchment is very
    small (<10 km2), consider hourly GR4H model instead', 'Otherwise, check if parameters are reasonable'];
    Calibration transform ensures X4 >= 0.5
  severity: warning
- id: dt_012
  symptom: X2 is large negative (-5 to -10). Model loses water to deep groundwater.
  diagnosis: 'Catchment has significant groundwater loss (karst, fractured rock); X2 represents inter-catchment
    groundwater exchange. Negative X2 means the catchment exports water underground. This is physically
    real in karst areas but may also indicate poor forcing data (precipitation too high, causing model
    to '
  remedy: Verify forcing data quality first; if correct, negative X2 is valid; convert_forcing_to_gr4j;
    ['Check if catchment is in karst geology', 'Compare long-term mean P vs mean(AE + Q) — difference
    = exchange', 'If P is correct and geology supports GW loss, accept negative X2']; Document known GW
    loss for
  severity: informational
- id: dt_013
  symptom: 'R error: could not find function RunModel_GR4J. Package not loaded.'
  diagnosis: 'airGR package not installed or not loaded; The R script must call library(airGR) before
    using any airGR functions. If airGR is not installed, R cannot find RunModel_GR4J.

    ; [''run_gr4j'']'
  remedy: 'Install airGR: install.packages(''airGR''); run_gr4j; ["In R: install.packages(''airGR'')",
    ''Verify: library(airGR); ?RunModel_GR4J'']; run_gr4j R script includes library(airGR)'
  severity: error
- id: dt_014
  symptom: Simulated discharge Qsim contains -999.999 values.
  diagnosis: 'Fortran output array not properly populated; The Fortran code initializes output arrays
    to -999.999 (done in R side). If certain outputs are not requested or if the model encounters numerical
    issues, some cells may retain the initialization value.

    ; [''RunModel_GR4J'', ''frun_GR4J.f90'']'
  remedy: Check Outputs_Sim setting in RunOptions; use 'all' for complete output; run_gr4j; ["Set Outputs_Sim
    = 'all' in CreateRunOptions", 'Check if the issue is only in the warmup period (which is normal)'];
    run_gr4j uses Outputs_Sim='all' by default
  severity: warning
- id: dt_015
  symptom: PBIAS > 50%. Model systematically over- or under-estimates flow.
  diagnosis: 'Systematic bias in forcing data or discharge conversion; Large PBIAS indicates a systematic
    mismatch between simulated and observed volumes. Positive PBIAS = overestimation (too much rain or
    too little PE). Negative PBIAS = underestimation (too little rain or too much PE).

    ; [''convert_forcing_to_gr4'
  remedy: 'Check water balance: annual P, PE, Qobs should be consistent; parse_gr4j_output; [''Compute
    annual P - PE: should roughly equal annual Q'', ''If P - PE << Q, precipitation is too low'', ''If
    P - PE >> Q, precipitation is too high or PE too low'']; validate_outputs() warns if PBIAS > 50%'
  severity: semi_silent
- id: dt_016
  symptom: Good NSE but poor KGE. Model captures dynamics but has bias/variability issues.
  diagnosis: NSE is insensitive to bias and variability errors; NSE focuses on the sum of squared errors,
    which is dominated by peak flows. KGE separately evaluates correlation (r), variability ratio (alpha),
    and bias ratio (beta). A model can have good NSE but poor alpha (wrong variability) or beta (volume
    bias
  remedy: 'Examine KGE components: r, alpha, beta separately; parse_gr4j_output; [''If alpha < 0.8: model
    underestimates variability (peaks too low)'', ''If beta < 0.8: model underestimates volume (systematic
    low bias)'', ''Consider calibrating with KGE instead of NSE'']; Always report both NSE and KGE'
  severity: informational
- id: dt_017
  symptom: Discharge conversion factor off by 1e6. Qobs_mm values impossibly large or small.
  diagnosis: 'Catchment area in m2 instead of km2 in conversion formula; The discharge conversion formula
    Qmm = Q_m3s * 86.4 / area_km2 expects area in km2. If area is provided in m2 (e.g., 1.21e11 for Bengbu
    instead of 121330), the conversion factor is off by 1e6, giving Qmm values ~1e-6 of correct.

    ; [''convert_'
  remedy: 'Ensure catchment area is in km2; convert_catchment_params; [''Check area value: should be 1-1,000,000
    km2'', ''If area > 1e6, it may be in m2 — divide by 1e6'']; convert_catchment_params warns if area
    < 1 or > 100,000 km2'
  severity: silent
- id: dt_018
  symptom: Calibration does not improve from initial screening. 'No progress achieved' message.
  diagnosis: 'Objective function flat near optimum, or data quality issue; Calibration_Michel''s steepest
    descent finds no improvement from the grid screening result. This can happen when: (1) observed data
    has too many NAs, (2) the criterion landscape is flat (e.g., very noisy observations), or (3) the
    grid scree'
  remedy: Check data quality; try different criterion; increase grid resolution; run_gr4j; ['Check fraction
    of NA in Qobs (should be < 50%)', 'Try KGE instead of NSE, or vice versa', 'Provide custom StartParamList
    with broader coverage']; Ensure sufficient non-NA observations (> 365 days)
  severity: warning
