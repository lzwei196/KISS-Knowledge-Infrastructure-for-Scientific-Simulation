outputs:
  - var: "DVS"
    validation_rank: 4
    unit: "-"
    description: "Crop development stage (0=emergence, 1=anthesis, 2=maturity)"
    emitted_in: "daily _saved_output (OUTPUT_VARS)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["DVS itself is rarely observed; comparison is usually via derived phenology dates (DOE/DOA/DOM) below"]
      detrending_options: ["none"]
  - var: "DOA"
    validation_rank: 5
    unit: "date"
    description: "Day of anthesis (summary)"
    emitted_in: "_saved_summary_output (SUMMARY_OUTPUT_VARS)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["timing_accuracy", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Best compared as DOY bias against observed heading/anthesis dates; weather quality dominates skill"]
      detrending_options: ["none"]
  - var: "DOM"
    validation_rank: 6
    unit: "date"
    description: "Day of maturity (summary)"
    emitted_in: "_saved_summary_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["timing_accuracy", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Sensitive to TSUM2 and to whether the campaign max_duration truncated the run before DVS=2"]
      detrending_options: ["none"]
  - var: "LAI"
    validation_rank: 2
    unit: "m2 m-2"
    description: "Leaf area index"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Compare to ground LAI campaigns or satellite-retrieved LAI at the point; rise/peak/decline shape is the primary signal"]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Requires running the point model on a grid; satellite LAI products have their own retrieval errors"]
      detrending_options: ["none"]
  - var: "LAIMAX"
    validation_rank: 7
    unit: "m2 m-2"
    description: "Maximum LAI over the season (summary)"
    emitted_in: "_saved_summary_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["LAIMAX > 15 indicates SLATB error rather than skill"]
      detrending_options: ["none"]
  - var: "TAGP"
    validation_rank: 8
    unit: "kg ha-1"
    description: "Total above-ground dry-matter production"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Best compared at sampled harvest dates within the season; daily values rarely observed"]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Field-level end-of-season biomass weighings"]
      detrending_options: ["none"]
  - var: "TWSO"
    validation_rank: 1
    unit: "kg ha-1"
    description: "Total weight of storage organs (harvestable yield)"
    emitted_in: "daily _saved_output and _saved_summary_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Field-trial yields under known management are the cleanest comparison; PP vs WLP choice changes the expected magnitude by 2-5x"]
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["National / regional yield aggregates carry a technology trend that a weather-only WOFOST run cannot reproduce; compare detrended residuals or decadal means, not raw inter-annual r"]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Requires gridded ensemble runs; SPAM-style yield maps have their own disaggregation uncertainty"]
      detrending_options: ["none", "first_difference", "linear_residual", "decadal_mean"]
  - var: "TWLV"
    validation_rank: 9
    unit: "kg ha-1"
    description: "Total weight of leaves"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Usually destructive sampling at intervals"]
      detrending_options: ["none"]
  - var: "TWST"
    validation_rank: 10
    unit: "kg ha-1"
    description: "Total weight of stems"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "TWRT"
    validation_rank: 11
    unit: "kg ha-1"
    description: "Total weight of roots"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Root biomass is hard to observe; comparisons are typically scarce and noisy"]
      detrending_options: ["none"]
  - var: "TRA"
    validation_rank: 12
    unit: "cm day-1"
    description: "Daily actual crop transpiration"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Compare to eddy-covariance latent-heat partitioning or sap-flow; canopy energy balance is not closed"]
      detrending_options: ["none"]
  - var: "CTRAT"
    validation_rank: 13
    unit: "cm"
    description: "Cumulative crop transpiration over the season"
    emitted_in: "_saved_summary_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "SM"
    validation_rank: 3
    unit: "cm3 cm-3"
    description: "Volumetric root-zone soil moisture"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats: ["Single-bucket / two-bucket layering cannot resolve depth-specific probes; compare to a depth-integrated average over RD"]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "temporal_pattern_match"]
          determining_metric: "r"
          caveats: ["Satellite root-zone soil moisture (e.g., SMAP L4) has its own retrieval / DA depth conventions"]
      detrending_options: ["none"]
  - var: "RD"
    validation_rank: 14
    unit: "cm"
    description: "Rooting depth"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "timing_accuracy"]
          determining_metric: "pbias"
          caveats: ["Rooting depth is rarely observed continuously; one or two profile observations per season is typical"]
      detrending_options: ["none"]
  - var: "WWLOW"
    validation_rank: 15
    unit: "cm"
    description: "Total profile water (root-zone + subsoil)"
    emitted_in: "daily _saved_output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]

influence:
  _caveat: "WOFOST quantitative SA studies (Wang 2013, Gilardelli 2018, Li 2023) systematically vary CROP and SOIL parameters under FIXED weather, so radiation/temperature/precipitation drivers and the PP-vs-WLP structural switch never appear in their EFAST/Morris rankings even though they are mechanistically dominant (and qualitatively confirmed by de Wit 2019). HIGH grade is retained for these forcing/structural edges (IRRAD->TAGP/TWSO, TMIN/TMAX->DOA/TWSO, RAIN->TWSO, production_level->TWSO) on mechanistic+qualitative-literature grounds; basis remains literature_qualitative."
  edges:
    - from: "TSUM1 (thermal sum emergence to anthesis)"
      to: "DOA / DVS"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["wang2013_wofost_efast", "ceglar2019_wofost_wheat_phenology", "li2023_wofost_efast_spring_wheat"]
    - from: "TSUM2 (thermal sum anthesis to maturity)"
      to: "DOM"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["wang2013_wofost_efast", "ceglar2019_wofost_wheat_phenology", "li2023_wofost_efast_spring_wheat"]
    - from: "TSUM1"
      to: "TWSO"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["wang2013_wofost_efast", "gilardelli2018_wofost_climate_sensitivity", "li2023_wofost_efast_spring_wheat"]
    - from: "SLATB (specific leaf area vs DVS)"
      to: "LAI"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["wang2013_wofost_efast", "li2023_wofost_efast_spring_wheat"]
    - from: "SLATB"
