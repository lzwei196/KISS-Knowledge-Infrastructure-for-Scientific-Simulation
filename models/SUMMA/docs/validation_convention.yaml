  gharari2024:
    doi: 10.5194/hess-28-5331-2024
    title: "A large-sample modelling approach towards integrating streamflow and evaporation data for a distributed hydrological model"
    venue: "Hydrol. Earth Syst. Sci."
    year: 2024
