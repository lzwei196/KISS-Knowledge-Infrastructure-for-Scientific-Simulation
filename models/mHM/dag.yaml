template_version: "3.5"

identity:
  model_id: "mHM"
  scientific_reference_version: "mHM (mesoscale Hydrologic Model) v5.13 lineage with Multiscale Parameter Regionalization (MPR); Samaniego, Kumar & Attinger 2010 WRR methodology"
  implementation:
    id: "mhm-v5131"
    version: "5.13.1"
    provenance: "Fortran 2008; UFZ (Helmholtz Centre for Environmental Research) mHM, depends on the FORCES/CHS Fortran library and NetCDF-Fortran."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "LGPL"
  license_reason: "docs name LGPL but the exact version (2.1 vs 3.0) and -or-later clause are not established by any consulted stream; LICENSE file returned 404 at read time"
  repo_url: "https://git.ufz.de/mhm/mhm"

boundary:
  scope_in:
    - "Distributed mesoscale catchment water balance across a basin"
    - "Canopy interception"
    - "Snow accumulation and melt (degree-day)"
    - "Multi-horizon soil moisture dynamics"
    - "Infiltration and direct (sealed/saturation-excess) runoff"
    - "Potential and actual evapotranspiration"
    - "Fast/slow interflow and percolation"
    - "Geology-dependent baseflow"
    - "River routing on the L11 network via mRM (processCase 8)"
    - "Multiscale Parameter Regionalization (MPR) from physiographic predictors"
    - "Optional cosmic-ray neutron diagnostic and river-temperature routing"
  scope_out:
    - "Full 3-D groundwater dynamics"
    - "Water-quality / biogeochemistry"
    - "Crop-yield processes"
    - "Reservoir/water-management operations"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Water mass-balance closure over a three-level grid hierarchy: L0 (fine physiographic predictors), L1 (hydrological water balance per cell), L11 (river routing). L1/L11 resolutions must be exact integer multiples of L0. ET is a demand-side flux from the selected PET method, not a closed surface energy budget; there is no energy-balance closure."

inputs:
  forcing:
    - category: "meteorology"
      name: "precipitation"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "NetCDF (time, lat, lon), CF conventions, variable 'pre', DOUBLE, one file per year, daily (hourly supported)"
      notes: "Valid model range ~0-500 mm/day; mHM is sensitive to sub-daily-vs-daily aggregation errors (mm/3hr fed as daily underestimates ~8x)."
    - category: "meteorology"
      name: "mean air temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "NetCDF variable 'tavg', daily/hourly, DOUBLE"
      notes: "Model expects Celsius (-60 to 60 degC); Kelvin forcing breaks snow thresholds, degree-day melt, and PET silently."
    - category: "meteorology"
      name: "potential evapotranspiration"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "NetCDF variable 'pet', daily/hourly"
      notes: "Consumed directly when processCase(5)=0; otherwise PET is computed internally from tmin/tmax (Hargreaves-Samani), net radiation (Priestley-Taylor), or radiation+vapor pressure+wind (Penman-Monteith)."
    - category: "meteorology"
      name: "minimum/maximum air temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "NetCDF, daily"
      notes: "Required when processCase(5)=1 (Hargreaves-Samani); if absent mHM silently substitutes tavg, biasing PET."
    - category: "meteorology"
      name: "net radiation"
      unit: "W m-2"
      source_kind: "forcing"
      model_input_format: "NetCDF, daily"
      notes: "Used by radiation-based PET (Priestley-Taylor / Penman-Monteith)."
    - category: "meteorology"
      name: "absolute vapor pressure"
      unit: "Pa"
      source_kind: "forcing"
      model_input_format: "NetCDF, daily"
      notes: "Used by Penman-Monteith PET (processCase(5)=3)."
    - category: "meteorology"
      name: "wind speed"
      unit: "m s-1"
      source_kind: "forcing"
      model_input_format: "NetCDF, daily"
      notes: "Used by Penman-Monteith PET (processCase(5)=3)."
  parameters:
    - category: "regionalization"
      name: "MPR global transfer-function parameters (gammas)"
      unit: "various"
      source_kind: "calibrated"
      model_input_format: "mhm_parameter.nml (~50-70 global parameters; per parameter: lower, upper, value, FLAG, SCALING)"
      notes: "Transfer-function coefficients mapping L0 physiographic properties (sand%, clay%, bulk density, slope, LAI, geology) to effective L1 parameters (Ksat, porosity, recession k0/k1/k2/kp, degree-day factors, root fractions). Encode process, not location; calibrate once, transfer to ungauged basins. Defaults calibrated on German (Mosel) basins."
    - category: "soil"
      name: "soil texture / hydraulic lookup"
      unit: "CLAY %, SAND %, BD g cm-3, horizon depths UD/LD mm"
      source_kind: "dataset_lookup"
      model_input_format: "soil_class.asc (ESRI ASCII grid) + soil_classdefinition.txt (columns MU_GLOBAL HORIZON UD LD CLAY SAND BD; column order load-bearing)"
      notes: "Feeds pedotransfer functions for Ksat/porosity; wrong column order silently corrupts soil hydraulics everywhere."
    - category: "geology"
      name: "geology class / baseflow recession lookup"
      unit: "dimensionless class + GeoParam recession"
      source_kind: "dataset_lookup"
      model_input_format: "geology_class.asc + geology_classdefinition.txt (GeoParam ClassUnit Karstic Description)"
      notes: "Karstic flag drives baseflow recession behaviour."
    - category: "vegetation"
      name: "land cover / monthly LAI lookup"
      unit: "LAI m2 m-2"
      source_kind: "dataset_lookup"
      model_input_format: "lc_YYYY.asc + lai_classdefinition.txt (ID LAND-USE Jan..Dec); land cover reduced to forest / impervious(sealed) / pervious"
      notes: "Monthly LAI per class drives interception and PET correction."
    - category: "terrain"
      name: "DEM, slope, aspect, flow direction, flow accumulation"
      unit: "m / degrees / D8 code / count"
      source_kind: "dataset_lookup"
      model_input_format: "ESRI ASCII grids (dem.asc, slope.asc, aspect.asc, fdir.asc, facc.asc); all grids share identical header; fdir uses ArcGIS D8 codes (1,2,4,8,16,32,64,128)"
      notes: "L0 physiographic predictors; DEM/slope/aspect feed MPR and PET-aspect correction, fdir/facc build the L11 routing network."
  initial_conditions:
    - category: "soil"
      name: "initial soil moisture (cold start)"
      unit: "mm"
      source_kind: "default"
      model_input_format: "internal cold-start default (0.5 x field capacity per horizon) unless a restart file is supplied"
      notes: "Hardcoded warm-start assumption affecting early-period results when no restart state is provided."
    - category: "storages"
      name: "initial interception/snow/unsaturated/saturated storages"
      unit: "mm"
      source_kind: "default"
      model_input_format: "internal cold-start magic constants (e.g. unsat/sat storage init) or NetCDF restart file"
      notes: "Cold-start initial state/flux constants are fixed in code, not exposed in the namelist."
  boundary_conditions:
    - category: "grid_configuration"
      name: "coordinate system flag (iFlag_cordinate_sys)"
      unit: "0=projected meters | 1=geographic degrees"
      source_kind: "user_provided"
      model_input_format: "mhm.nml"
      notes: "Must match the grid CRS; =0 on a lat/lon grid computes cell area as cellsize^2 m^2 and collapses routed discharge to ~zero."
    - category: "grid_configuration"
      name: "L0/L1/L11 resolutions (resolution_Hydrology, resolution_Routing)"
      unit: "m or degrees"
      source_kind: "user_provided"
      model_input_format: "mhm.nml"
      notes: "L1 and L11 must be exact integer multiples of L0; resolution_Routing must match the actual L11 cellsize or routing peak timing shifts."
    - category: "process_switch"
      name: "PET method (processCase(5))"
      unit: "0=input | 1=Hargreaves-Samani | 2=Priestley-Taylor | 3=Penman-Monteith"
      source_kind: "user_provided"
      model_input_format: "mhm.nml"
    - category: "process_switch"
      name: "routing activation (processCase(8))"
      unit: "0=off | 1=mRM Muskingum | 2=adaptive-timestep celerity"
      source_kind: "user_provided"
      model_input_format: "mhm.nml"
    - category: "process_switch"
      name: "neutron module (processCase(10))"
      unit: "0=off | 1=Desilets N0 | 2=COSMIC"
      source_kind: "user_provided"
      model_input_format: "mhm.nml"
      notes: "Diagnostic cosmic-ray neutron output; the ground-albedo-neutrons output path is flagged work-in-progress by the developers."
    - category: "simulation_period"
      name: "warming/evaluation periods and time stepping"
      unit: "dates"
      source_kind: "user_provided"
      model_input_format: "mhm.nml (warming_Days, eval_Per, timestep)"
    - category: "evaluation"
      name: "gauge location grid + observed discharge"
      unit: "m3 s-1"
      source_kind: "user_provided"
      model_input_format: "idgauges.asc (gauge ID at gauge cell) + per-gauge text file (YYYY MM DD Q); gauge ID must match evaluation_gauges in mhm.nml"
      notes: "Observed discharge drives objective-function evaluation; gauge must land on a valid in-domain L11 cell with upstream drainage."

processes:
  modules:
    - name: "MPR"
      role: "allocator"
      brief: "Multiscale Parameter Regionalization (mo_multi_param_reg / mo_mpr_eval): transfers L0 physiographic predictors via pedotransfer/regionalization transfer functions into effective L1 parameters (Ksat, porosity, recession k0/k1/k2/kp, degree-day factors, root fractions, interception max). Runs once before the timestep loop (or per parameter update during calibration)."
    - name: "MeteoHandler"
      role: "driver"
      brief: "mo_meteo_handler: ingests and temporally disaggregates forcing and applies aspect/LAI/dynamic PET correction, delivering per-timestep L1_pet_calc, L1_temp_calc, L1_prec_calc."
    - name: "PET"
      role: "process_solver"
      brief: "mo_pet / mo_mpr_pet: potential ET via input-PET correction, Hargreaves-Samani, Priestley-Taylor, or Penman-Monteith (processCase(5))."
    - name: "CanopyInterception"
      role: "process_solver"
      brief: "mo_canopy_interc: maximum interception storage, throughfall, and canopy evaporation (process 1)."
    - name: "SnowAccumMelt"
      role: "process_solver"
      brief: "mo_snow_accum_melt: degree-day snow accumulation and melt; partitions precipitation into rain/snow at a temperature threshold (process 2)."
    - name: "SoilMoisture"
      role: "process_solver"
      brief: "mo_soil_moisture: multi-horizon Brooks-Corey-like soil water with Feddes/Jarvis ET reduction, infiltration, and sealed-surface evaporation (process 3)."
    - name: "Runoff"
      role: "process_solver"
      brief: "mo_runoff: unsaturated-zone fast/slow interflow, percolation and karst loss, saturated-zone baseflow, and L1 total-runoff aggregation (processes 4/6/7)."
    - name: "Neutrons"
      role: "optional_module"
      applicability: "processCase(10)>0; diagnostic only"
      brief: "mo_neutrons: cosmic-ray ground-albedo neutron count from soil moisture via Desilets N0 or COSMIC."
    - name: "mHM core driver loop"
      role: "integrator"
      brief: "mo_mhm subroutine mHM: per-cell OpenMP loop sequencing all vertical processes in process-matrix order and updating all L1 states each timestep."
    - name: "mRM Routing"
      role: "process_solver"
      applicability: "processCase(8)>0"
      brief: "mo_mrm_routing: lateral river routing on the L11 network — Muskingum (case 1) or adaptive-timestep celerity routing (case 2) — producing L11_Qmod discharge."
    - name: "mRM NetStartup"
      role: "driver"
      brief: "mo_mrm_net_startup / mo_mrm_init: builds the routing network (from/to nodes, routing permutation, reach geometry, Muskingum coefficients) from L0 flow direction/accumulation."
    - name: "RiverTemp"
      role: "optional_module"
      applicability: "processCase(11)>0"
      brief: "mo_mrm_riv_temp_class: optional river-temperature routing coupled to routed discharge and radiation forcing."
    - name: "BFI"
      role: "optional_module"
      brief: "mo_mhm_bfi: baseflow-index accumulation/diagnostic per domain for calibration against observed BFI."
  internal_edges:
    - from: "Inputs"
      to: "MPR"
      kind: "consumes_input"
      brief: "MPR reads L0 physiographic predictors (DEM, soil, geology, land cover) to build effective L1 parameters."
    - from: "MPR"
      to: "mHM core driver loop"
      kind: "writes_state"
      brief: "Regionalized effective parameters (k0,k1,k2,kp, degree-day, soil_moist_FC/sat, root fractions, interception max) supplied as intent(inout) arrays to the vertical processes."
    - from: "MeteoHandler"
      to: "PET"
      kind: "invokes"
      brief: "Applies aspect/LAI/dynamic PET correction before delivering pet_calc."
    - from: "MeteoHandler"
      to: "mHM core driver loop"
      kind: "writes_state"
      brief: "Writes L1_pet_calc/L1_temp_calc/L1_prec_calc consumed by the per-cell process loop each timestep."
    - from: "mHM core driver loop"
      to: "CanopyInterception"
      kind: "invokes"
      brief: "canopy_interc(pet_calc, interc_max, prec_calc) -> interception store, throughfall, canopy aET."
    - from: "CanopyInterception"
      to: "SnowAccumMelt"
      kind: "produces_output"
      brief: "Throughfall feeds snow accumulation/melt as surface-reaching precipitation."
    - from: "mHM core driver loop"
      to: "SnowAccumMelt"
      kind: "invokes"
      brief: "snow_accum_melt(degree-day, temp_calc, temp_thresh, throughfall) -> snowpack, melt, effective precipitation."
    - from: "SnowAccumMelt"
      to: "SoilMoisture"
      kind: "produces_output"
      brief: "Effective precipitation (rain + melt) is the water input to the soil column."
    - from: "PET"
      to: "SoilMoisture"
      kind: "produces_output"
      brief: "Corrected PET drives the ET-reduction (Feddes/Jarvis) and actual-ET demand in the soil column."
    - from: "mHM core driver loop"
      to: "SoilMoisture"
      kind: "invokes"
      brief: "soil_moisture(processCase, pet_calc, soil_moist_sat/FC/exponen, frac_roots) -> infiltration, soilMoisture, soil aET, sealed aET."
    - from: "SoilMoisture"
      to: "Runoff"
      kind: "produces_output"
      brief: "Infiltration / deep-percolation flux feeds the unsaturated-zone runoff generation."
    - from: "mHM core driver loop"
      to: "Runoff"
      kind: "invokes"
      brief: "runoff_unsat_zone, runoff_sat_zone and L1_total_runoff produce fast/slow interflow, percolation, baseflow and total runoff."
    - from: "Runoff"
      to: "L1_unsatSTW"
      kind: "writes_state"
      brief: "Updates unsaturated-zone storage using recession coefficients scaled by the per-timestep c2TSTu factor (c2TSTu/k0, /k1, /kp)."
    - from: "Runoff"
      to: "L1_satSTW"
      kind: "writes_state"
      brief: "Updates saturated-zone (groundwater) storage; baseflow recession governed by geology-class GeoParam (k2)."
    - from: "SoilMoisture"
      to: "Neutrons"
      kind: "reads_state"
      brief: "DesiletsN0/COSMIC read soilMoisture(k,1:nHorizons-1) plus interception and snowpack to compute the neutron count."
    - from: "mHM core driver loop"
      to: "Neutrons"
      kind: "invokes"
      brief: "Conditional on processCase(10): DesiletsN0 (=1) or COSMIC (=2)."
    - from: "Runoff"
      to: "mRM Routing"
      kind: "produces_output"
      brief: "L1_total_runoff is mapped L1->L11 (via L1_L11_ID) and routed as lateral inflow."
    - from: "mRM NetStartup"
      to: "mRM Routing"
      kind: "writes_state"
      brief: "Builds netPerm, from/to nodes, L11 reach length/slope and Muskingum C1/C2 coefficients consumed by L11 routing."
    - from: "mHM core driver loop"
      to: "mRM Routing"
      kind: "invokes"
      brief: "Per-timestep routing call produces L11_Qmod / L11_qOUT / L11_qTIN / L11_qTR."
    - from: "MeteoHandler"
      to: "RiverTemp"
      kind: "consumes_input"
      brief: "Radiation and annual-temperature forcing supply optional river-temperature routing."
    - from: "mRM Routing"
      to: "BFI"
      kind: "reads_state"
      brief: "Baseflow/total-runoff accumulation (BFI sums) for the baseflow-index diagnostic."
    - from: "mRM Routing"
      to: "Outputs"
      kind: "produces_output"
      brief: "Routed discharge mRM_runoff (m3/s) written at gauges."
    - from: "mHM core driver loop"
      to: "Outputs"
      kind: "produces_output"
      brief: "L1 fluxes/states (interception, soil moisture, PET, aET, total runoff, QD, QIf, QIs, QB, recharge) written to NetCDF."

states:
  variables:
    - name: "L1_inter"
      unit: "mm"
      role: "prognostic"
    - name: "L1_snowPack"
      unit: "mm"
      role: "prognostic"
    - name: "L1_sealSTW"
      unit: "mm"
      role: "prognostic"
    - name: "L1_soilMoist"
      unit: "mm"
      role: "prognostic"
    - name: "L1_unsatSTW"
      unit: "mm"
      role: "prognostic"
    - name: "L1_satSTW"
      unit: "mm"
      role: "prognostic"
    - name: "L1_pet_calc"
      unit: "mm/timestep"
      role: "diagnostic"
    - name: "L1_temp_calc"
      unit: "degC"
      role: "diagnostic"
    - name: "L1_prec_calc"
      unit: "mm/timestep"
      role: "diagnostic"
    - name: "L1_neutrons"
      unit: "cph"
      role: "diagnostic"
    - name: "L11_Qmod"
      unit: "m3 s-1"
      role: "prognostic"
    - name: "L11_qOUT"
      unit: "m3 s-1"
      role: "prognostic"
    - name: "L11_qTIN"
      unit: "m3 s-1"
      role: "prognostic"
    - name: "L11_qTR"
      unit: "m3 s-1"
      role: "prognostic"
    - name: "L11_K"
      unit: "d"
      role: "diagnostic"
    - name: "L11_xi"
      unit: "1"
      role: "diagnostic"
    - name: "L11_C1"
      unit: "1"
      role: "diagnostic"
    - name: "L11_C2"
      unit: "1"
      role: "diagnostic"
    - name: "L11_celerity"
      unit: "m/s"
      role: "diagnostic"
    - name: "riv_temp_pcs"
      unit: "degC"
      role: "prognostic"
    - name: "BFI_qBF_sum"
      unit: "mm"
      role: "accumulator"
    - name: "BFI_qT_sum"
      unit: "mm"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "mRM_runoff (routed discharge)"
    validation_rank: 1
    unit: "m3 s-1"
    description: "Routed streamflow discharge on the L11 routing network, extracted at gauge cells."
    emitted_in: "mRM_Fluxes_States.nc (and daily_discharge.out at gauges)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "Gauge must map to an L11 cell with correct upstream drainage; a mis-snapped gauge yields all-zero discharge despite a valid routed field."
            - "Routing-resolution mismatch can shift peak timing by 1-3 days independent of water-balance skill."
      detrending_options:
        - "none"
  - var: "aET (actual evapotranspiration)"
    validation_rank: 3
    unit: "mm/timestep"
    description: "Actual evapotranspiration summed over canopy, soil layers, and sealed-surface evaporation."
    emitted_in: "mHM_Fluxes_States.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "PET-method/forcing mismatch (e.g. Hargreaves selected with only tavg) systematically biases aET."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Spatial AET pattern is dominated by PET-correction/aspect and vegetation parameters, not by discharge-only calibration."
      detrending_options:
        - "none"
  - var: "SM (soil moisture)"
    validation_rank: 4
    unit: "mm or mm/mm (per layer / mean)"
    description: "Multi-horizon soil water content (volumetric or depth) per L1 cell."
    emitted_in: "mHM_Fluxes_States.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
          determining_metric: "r"
          caveats:
            - "Absolute magnitude depends on soil-depth configuration; anomaly/index comparison is often more meaningful than absolute mm."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Satellite SM products sense a shallow surface layer; compare against the corresponding model horizon."
      detrending_options:
        - "first_difference"
        - "linear_residual"
  - var: "total_runoff (Q)"
    validation_rank: 2
    unit: "mm/timestep"
    description: "Total runoff (direct + fast interflow + slow interflow + baseflow) generated per L1 cell before routing."
    emitted_in: "mHM_Fluxes_States.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "csi"
          caveats:
            - "Per-cell generated runoff is pre-routing; do not compare directly to gauge hydrographs."
      detrending_options:
        - "none"
  - var: "baseflow (QB)"
    validation_rank: 5
    unit: "mm/timestep"
    description: "Saturated-zone baseflow generated per cell, governed by geology-class recession (GeoParam)."
    emitted_in: "mHM_Fluxes_States.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Best assessed via baseflow-index (BFI) separation of observed discharge; single-geology-class domains silently zero baseflow."
      detrending_options:
        - "none"
  - var: "recharge"
    validation_rank: 6
    unit: "mm/timestep"
    description: "Groundwater recharge (deep percolation to the saturated zone) per cell."
    emitted_in: "mHM_Fluxes_States.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Rarely directly observed; usually inferred and weakly constrained."
      detrending_options:
        - "none"

influence:
  _caveat: "Available mHM sensitivity literature (Cuntz 2015, Demirel 2018) varies soil/PET/routing parameters under fixed meteorological forcing, so precipitation and temperature forcing — though mechanistically dominant for discharge — cannot be graded HIGH from this literature and are intentionally omitted as sensitivity edges."
  edges:
    - from: "infiltration shape / soil-saturation parameters"
      to: "routed discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations:
        - "cuntz2015_mhm_sequential_screening"
        - "samaniego2010_mhm_mpr"
    - from: "recession (interflow/baseflow) parameters (k1/k2/kp)"
      to: "routed discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations:
        - "cuntz2015_mhm_sequential_screening"
        - "kumar2013_mhm_parameterization"
    - from: "routing parameters (Muskingum)"
      to: "routed discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations:
        - "cuntz2015_mhm_sequential_screening"
