# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: WRF
  language: fortran
  implementation:
    id: wrf-arw-471
    version: 4.7.1
    provenance: Fortran 90/2003 with C utilities; NCAR/UCAR community WRF-ARW release 4.7.1 (github.com/wrf-model/WRF);
      MPI + OpenMP parallel; NetCDF I/O.
  scientific_reference_version: 'Advanced Research WRF (ARW) dynamical core, v4.x lineage; governing equations
    per the ARW Technical Note (NCAR TN series): fully compressible nonhydrostatic Euler equations in
    flux form on a terrain-following hybrid hydrostatic-pressure (eta) mass coordinate, Arakawa C-grid'
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/WRF/source/repo/_build_real/main/wrf
    type: ELF
pipeline:
  stages:
  - s0_domain_configuration
  - s1_geographical_data
  - s2_meteorological_forcing
  - s4_vertical_interpolation
  - s5_namelist_assembly
  - s6_model_execution
  - s7_output_extraction
tools:
  count: 4
  files:
  - tools/convert_forcing_to_wrf.py
  - tools/convert_soil_to_wrf.py
  - tools/parse_wrfout.py
  - tools/run_wrf.py
inputs:
  forcing:
  - name: Global reanalysis/forecast lateral boundary fields (3-D temperature, u/v wind, geopotential
      height, relative humidity, surface and mean-sea-level pressure)
    unit: K, m s-1, m, %, Pa
  - name: Skin/sea-surface temperature, soil moisture and temperature, land-sea mask, 2-m fields
    unit: K, m3 m-3, 0/1
  parameters:
  - name: Terrain elevation, dominant land-use category, dominant soil category (top/bottom), slope category
    unit: m, category index
  - name: Monthly green-vegetation fraction, monthly surface albedo, maximum snow albedo, leaf area index,
      deep soil temperature
    unit: fraction, K
  - name: Land-surface, vegetation, soil, and radiation lookup tables
    unit: scheme-specific
  - name: Scheme tuning coefficients (e.g. Kain-Fritsch entrainment/downdraft multipliers, CAPE consumption
      time, Noah saturated-soil-water multiplier, PBL momentum-diffusivity profile exponent, radiation
      scattering tuning)
    unit: dimensionless / scheme-specific
  initial_conditions:
  - name: Initial 3-D wind, perturbation potential temperature, geopotential, pressure, dry-air column
      mass, water-vapor mixing ratio
    unit: m s-1, K, m2 s-2, Pa, kg kg-1
  - name: Initial soil temperature and volumetric soil moisture by layer
    unit: K, m3 m-3
  boundary_conditions:
  - name: Domain dimensions, nesting, projection, and vertical levels
    unit: grid units, m
  - name: Run length, start/end times, integration timestep, boundary-update and history intervals
    unit: s, min
  - name: Physics parameterization choices (microphysics, LW/SW radiation, surface layer, land-surface
      model, PBL, cumulus)
    unit: scheme index
  - name: Dynamical-core and numerics switches (RK order, diffusion, advection order, hybrid coordinate,
      damping)
    unit: option index
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - T2
  - RAINC+RAINNC
  - U10/V10
  - PSFC
  - T
  - SWDOWN
  - TSLB
  - SMOIS
  other: []
validation:
