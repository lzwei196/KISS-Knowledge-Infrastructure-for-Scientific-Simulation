schema_version: 1
model_id: DSSAT
domain: crop
generated_by: "Step-B validation convention agent (GPT-5 Codex)"
generated_at: 2026-08-14

# DSSAT validation conventions are keyed by dag_variable per the Step-B campaign
# instruction. Numeric bands are cited only to fetched full texts. The main crop
# convention is normalized RMSE/percent error: Jamieson introduced 10/20/30%
# crop-simulation quality tiers; Chisanga 2021 and Kumar 2024 reproduce those
# tiers in DSSAT-CERES-Maize evaluations. Spatial CSI, runoff/drainage PBIAS,
# leaching, N fixation, and trace-gas event skill remain unresolved where no
# fetched paper gave a numeric pass band.

