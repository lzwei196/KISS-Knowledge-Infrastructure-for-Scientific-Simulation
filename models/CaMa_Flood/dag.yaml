template_version: "3.5"

identity:
  model_id: "CaMa_Flood"
  scientific_reference_version: "CaMa-Flood v4.20 (local-inertial river hydrodynamics; Yamazaki et al. 2011 floodplain parameterization + Yamazaki et al. 2013 local-inertial flow equation)"
  implementation:
    id: "cama-flood-v420"
    version: "v4.20"
    provenance: "Fortran 90 (OpenMP/MPI parallel); stand-alone MAIN_cmf driver of CaMa-Flood v4.20 from Global Hydrodynamics Lab, University of Tokyo."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "Apache-2.0"
  repo_url: "https://github.com/global-hydrodynamics/CaMa-Flood_v4"

boundary:
  scope_in:
    - "River channel discharge and flow velocity"
    - "River channel water depth and water-surface elevation"
    - "Floodplain inundation depth, area, and fraction"
    - "River + floodplain water storage routing over a macro-scale river network"
    - "Backwater effects via local-inertial momentum"
    - "Channel bifurcation / multiple-downstream flow pathways (optional)"
    - "Reservoir/dam operation and levee/embankment effects (optional sub-models)"
  scope_out:
    - "Lateral runoff generation (consumed as external forcing, not computed)"
    - "Local high-resolution flood modeling (delegated to downstream models such as SFINCS)"
    - "Land-surface / soil / vegetation hydrology"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Water storage (river + floodplain) is the only prognostic state; water level, flooded area, and inundation depth are diagnosed from storage via sub-grid floodplain topography. Mass is conserved by a water balance of upstream inflow, downstream outflow, and runoff forcing. The outer time step (default 86400 s) is sub-divided internally by CFL-limited adaptive sub-stepping. There is no energy budget; the local-inertial momentum equation is a simplified shallow-water (not full energy) closure. Spatial discretization is the 15-arcmin (~0.25 deg) unit-catchment river network in the HydroCraft regional binding, cut from the global MERIT-Hydro-based glb_15min map; the model itself supports 15/6/5/3/1-arcmin maps with diagnostic downscaling to ~90 m."

inputs:
  forcing:
    - category: "forcing"
      name: "lateral surface runoff"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "gridded (time, lat, lon) binary or NetCDF on the source model grid; latitude must be North-to-South (descending)"
      notes: "Primary external driver. Model converts mm/day to m3/s internally using per-cell catchment area via the input matrix; runoff MUST NOT be pre-converted to m3/s. Interpolated to river-network cells by the input matrix (CMF_FORCING)."
    - category: "forcing"
      name: "sub-surface runoff (baseflow)"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "gridded (time, lat, lon), optional second runoff field"
      notes: "Consumed only when LROSPLIT is enabled; otherwise total runoff is treated as a single field. Routed to river/groundwater reservoir depending on LGDWDLY."
    - category: "forcing"
      name: "potential water evaporation"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "gridded (time, lat, lon)"
      notes: "Optional open-water evaporation forcing, active only when LWEVAP is set; extracts water from open-water/floodplain storage."
  parameters:
    - category: "parameters"
      name: "PMANRIV (river channel Manning's n)"
      unit: "s m^-1/3"
      source_kind: "calibrated"
      model_input_format: "namelist scalar (&NPARAM); spatial field rivman.bin (CRIVMAN) overrides where provided"
      notes: "Default 0.03 hardcoded in cmf_ctrl_nmlist_mod before namelist override. Primary calibration lever; higher n slows flow, increases peak attenuation and lag."
    - category: "parameters"
      name: "PMANFLD (floodplain Manning's n)"
      unit: "s m^-1/3"
      source_kind: "default"
      model_input_format: "namelist scalar (&NPARAM)"
      notes: "Default 0.10, hardcoded scalar used directly in the floodplain local-inertial momentum equation; not spatially distributed."
    - category: "parameters"
      name: "river network topology (next-downstream cell)"
      unit: "cell index"
      source_kind: "dataset_lookup"
      model_input_format: "nextxy.bin (CNEXTXY)"
      notes: "Upstream-downstream flow-direction map defining routing; derived from MERIT-Hydro-based map."
    - category: "parameters"
      name: "unit-catchment area"
      unit: "m2"
      source_kind: "dataset_lookup"
      model_input_format: "ctmare.bin (CGRAREA)"
    - category: "parameters"
      name: "cell elevation"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "elevtn.bin (CELEVTN)"
    - category: "parameters"
      name: "distance to downstream cell"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "nxtdst.bin (CNXTDST)"
      notes: "Sets the slope length term in the local-inertial momentum equation and bounds the CFL adaptive time step."
    - category: "parameters"
      name: "river channel length"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "rivlen.bin (CRIVLEN)"
    - category: "parameters"
      name: "sub-grid floodplain height profile"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "fldhgt.bin (CFLDHGT), discretized into NLFP elevation sub-layers"
      notes: "Sub-grid topographic profile used to diagnose flooded depth/area/fraction from storage (Yamazaki 2011)."
    - category: "parameters"
      name: "river channel width"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "rivwth_gwdlr.bin (CRIVWTH)"
      notes: "Set as empirical power law of climatological mean discharge Q (W = WC*Q^WP, WC=2.50, WP=0.60, WMIN=5.0 m) during map preparation."
    - category: "parameters"
      name: "river channel bank height / depth"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "rivhgt.bin (CRIVHGT)"
      notes: "Set as empirical power law of climatological mean discharge Q (H = HC*Q^HP, HC=0.10, HP=0.50, HMIN=1.0 m)."
    - category: "parameters"
      name: "PCADP (CFL adaptive time-step coefficient)"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "namelist scalar (&NPARAM)"
      notes: "Default 0.7; DT_MIN = PCADP*dist/sqrt(g*depth) sets inner sub-step from minimum CFL across all cells."
    - category: "parameters"
      name: "PDSTMTH (river-mouth downstream distance)"
      unit: "m"
      source_kind: "default"
      model_input_format: "namelist scalar (&NPARAM)"
      notes: "Default 10000 m; assumed downstream distance at river-mouth cells, controlling mouth slope and mouth-cell CFL."
  initial_conditions:
    - category: "initial_conditions"
      name: "river channel storage"
      unit: "m3"
      source_kind: "user_provided"
      model_input_format: "restart file (CRESTSTO) or zero start"
      notes: "Carried between time steps. Empty initial storage makes first-year results unreliable; 1-2 spin-up iterations of the first year recommended."
    - category: "initial_conditions"
      name: "floodplain storage"
      unit: "m3"
      source_kind: "user_provided"
      model_input_format: "restart file (CRESTSTO) or zero start"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "downstream sea-level / ocean boundary"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "optional boundary time series at river-mouth cells (&NBOUND)"
      notes: "Sets tidal/sea-surface elevation at outlets when enabled; otherwise a default fixed sea level is assumed."
    - category: "boundary_conditions"
      name: "flow-solver selection (LADPSTP / LKINE / LSLPMIX / LFLDOUT / LPTHOUT)"
      unit: "switch"
      source_kind: "user_provided"
      model_input_format: "namelist logical switches (&NRUNVER)"
      notes: "Structural switches selecting local-inertial (default) vs kinematic-wave vs slope-mixed routing, enabling floodplain outflow, and enabling bifurcation pathways."
    - category: "boundary_conditions"
      name: "optional sub-model activation (LDAMOUT / LLEVEE / LGDWDLY / LROSPLIT / LWEVAP)"
      unit: "switch"
      source_kind: "user_provided"
      model_input_format: "namelist logical switches (&NRUNVER)"
      notes: "Enable reservoir operation, levee scheme, groundwater delay, runoff split, and open-water evaporation respectively; all off by default."
    - category: "boundary_conditions"
      name: "outer time step DT and I/O frequency"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "namelist (&NDIMTIME): DT, IFRQ_INP, IFRQ_OUT"
      notes: "Default DT=86400 s; DT must be a multiple of 60 (model counts time in minutes), enforced with STOP 9 in CMF_CONFIG_CHECK."

processes:
  modules:
    - name: "CMF_DRV_CONTROL"
      role: "driver"
      brief: "Reads namelist, allocates state, sets up maps and forcing, computes NSTEPS, finalizes (CMF_DRV_INPUT/INIT/END)."
    - name: "CMF_DRV_ADVANCE"
      role: "driver"
      brief: "Outer time-step loop: set next time, optional sea-level boundary, call physics, write averaged output + restart, update time."
    - name: "CMF_CTRL_FORCING"
      role: "driver"
      brief: "Reads runoff forcing (binary/NetCDF) and interpolates the source grid to CaMa river-network cells via the input matrix, producing D2RUNOFF (and D2ROFSUB if LROSPLIT)."
    - name: "CMF_PHYSICS_ADVANCE"
      role: "integrator"
      brief: "Per outer step orchestrates FLDSTG then the adaptive sub-step sequence OUTFLW -> (DAMOUT) -> INFLOW -> PTHOUT -> STONXT -> FLDSTG -> water-balance -> DIAG; manages adaptive DT and budget monitoring."
    - name: "CALC_ADPSTP"
      role: "integrator"
      brief: "CFL-based adaptive time-step selector: DT_MIN = PCADP*dist/sqrt(g*depth), min-reduced over all cells, sets the number of inner sub-steps."
    - name: "CMF_CALC_OUTFLW"
      role: "process_solver"
      brief: "Default local-inertial (Bates et al. 2010) river + floodplain discharge solver; semi-implicit momentum equation with Manning friction; writes river/floodplain outflow and velocity."
    - name: "CMF_OPT_OUTFLW"
      role: "optional_module"
      applicability: "when LKINE / LSLPMIX / LOUTINS set"
      brief: "Alternative kinematic-wave and slope-mixed local-inertial/kinematic discharge solvers plus instantaneous-discharge diagnostic; replaces the default local-inertial solver."
    - name: "CMF_CALC_INFLOW"
      role: "allocator"
      brief: "Aggregates upstream outflow into per-cell inflow and rescales outflow by D2RATE = stored_water/total_outflow to enforce non-negative storage (water-budget limiter), coupling neighbor states under reverse flow."
    - name: "CMF_CALC_PTHOUT"
      role: "optional_module"
      applicability: "when LPTHOUT set (incompatible with LKINE)"
      brief: "Bifurcation / flood-path channel flow over multiple pathway levels using the local-inertial equation."
    - name: "CMF_CALC_STONXT"
      role: "integrator"
      brief: "FTCS storage update: advances river/floodplain storage by (inflow - outflow + pathway flow)*DT, adds runoff split by flooded fraction, optional evaporation extraction; computes total outflow and global budget terms."
    - name: "CMF_CALC_FLDSTG_DEF"
      role: "process_solver"
      brief: "Default flood-stage solver (Yamazaki 2011): partitions total storage into river depth + floodplain depth/fraction/area over NLFP sub-grid levels; mutates prognostic river/floodplain storage and writes stage diagnostics."
    - name: "CMF_OPT_FLDSTG_ES"
      role: "optional_module"
      applicability: "when LSTG_ES set"
      brief: "Vector-processor-optimized branchless flood-stage solver; same physics as the default stage solver, restructured loop."
    - name: "CALC_GDWDLY"
      role: "optional_module"
      applicability: "when LGDWDLY and LROSPLIT set"
      brief: "Linear-reservoir groundwater delay of sub-surface runoff; when off, sub-surface runoff is returned directly (D2GDWRTN set equal to D2ROFSUB)."
    - name: "CMF_CTRL_DAMOUT"
      role: "optional_module"
      applicability: "when LDAMOUT set (under development)"
      brief: "Reservoir/dam operation: updates reservoir storage and inflow and applies outflow operating rules; runs before bifurcation to preserve the water budget."
    - name: "CMF_CTRL_LEVEE"
      role: "optional_module"
      applicability: "when LLEVEE set"
      brief: "Levee scheme: protected-side storage and modified flood-stage / pathway flow; replaces the default flood-stage solver when active."
    - name: "CMF_CALC_DIAG"
      role: "process_solver"
      brief: "Diagnostic accumulation: running max/sum and time-mean over the output interval; produces the *_AVG and *_MAX output fields."
    - name: "CMF_CTRL_RESTART"
      role: "driver"
      brief: "Writes/reads restart (storage) files for warm starts; controlled by LRESTART/LSTOONLY."
  internal_edges:
    - from: "CMF_DRV_CONTROL"
      to: "CMF_CTRL_FORCING"
      kind: "invokes"
      brief: "CMF_DRV_INPUT/INIT sets up the runoff forcing reader and input matrix before the time loop (cmf_drv_control_mod depends on cmf_ctrl_forcing_mod)."
    - from: "CMF_DRV_ADVANCE"
      to: "CMF_CTRL_FORCING"
      kind: "invokes"
      brief: "Outer time-step loop reads the runoff forcing for the current input interval each step."
    - from: "CMF_DRV_ADVANCE"
      to: "CMF_PHYSICS_ADVANCE"
      kind: "invokes"
      brief: "The advance loop calls the physics integrator each outer step (cmf_drv_advance_mod depends on cmf_ctrl_physics_mod)."
    - from: "CMF_DRV_ADVANCE"
      to: "CMF_CTRL_RESTART"
      kind: "invokes"
      brief: "Advance loop writes the restart (storage) file at the configured restart frequency."
    - from: "lateral surface runoff"
      to: "CMF_CTRL_FORCING"
      kind: "consumes_input"
      brief: "Reads gridded runoff forcing for the current input interval."
    - from: "CMF_CTRL_FORCING"
      to: "D2RUNOFF"
      kind: "writes_state"
      brief: "Interpolated runoff written to the input array (also D2ROFSUB if LROSPLIT)."
    - from: "D2RUNOFF"
      to: "CMF_CALC_STONXT"
      kind: "reads_state"
      brief: "Runoff added to river/floodplain storage, split by flooded fraction."
    - from: "CMF_PHYSICS_ADVANCE"
      to: "CMF_CALC_FLDSTG_DEF"
      kind: "invokes"
      brief: "Stage solve called at the start of each step and after each storage update."
    - from: "CMF_CALC_FLDSTG_DEF"
      to: "P2RIVSTO"
      kind: "writes_state"
      brief: "Re-partitions total storage into river storage (mutates prognostic state)."
    - from: "CMF_CALC_FLDSTG_DEF"
      to: "P2FLDSTO"
      kind: "writes_state"
      brief: "Re-partitions remaining storage into floodplain storage."
    - from: "CMF_CALC_FLDSTG_DEF"
      to: "D2RIVDPH"
      kind: "writes_state"
      brief: "Writes river-depth diagnostic from storage."
    - from: "CMF_CALC_FLDSTG_DEF"
      to: "D2FLDDPH"
      kind: "writes_state"
      brief: "Writes floodplain depth/fraction/area diagnostics."
    - from: "D2RIVDPH"
      to: "CMF_CALC_OUTFLW"
      kind: "reads_state"
      brief: "Surface elevation = bed elevation + river depth drives the local-inertial slope term."
    - from: "D2FLDDPH"
      to: "CMF_CALC_OUTFLW"
      kind: "reads_state"
      brief: "Floodplain depth used to subtract above-channel area in floodplain flow."
    - from: "CMF_PHYSICS_ADVANCE"
      to: "CMF_CALC_OUTFLW"
      kind: "invokes"
      brief: "Default discharge solver per sub-step (unless an optional solver is selected)."
    - from: "CMF_CALC_OUTFLW"
      to: "D2RIVOUT"
      kind: "writes_state"
      brief: "River discharge for the current sub-step."
    - from: "CMF_CALC_OUTFLW"
      to: "D2FLDOUT"
      kind: "writes_state"
      brief: "Floodplain discharge for the current sub-step (when LFLDOUT)."
    - from: "D2RIVOUT_PRE"
      to: "CMF_CALC_OUTFLW"
      kind: "reads_state"
      brief: "Previous-step outflow term of the semi-implicit local-inertial momentum equation."
    - from: "CMF_CALC_OUTFLW"
      to: "CMF_CALC_INFLOW"
      kind: "invokes"
      brief: "Inflow aggregation and storage-limited outflow rescaling follow the discharge solve."
    - from: "CMF_CALC_INFLOW"
      to: "D2RIVOUT"
      kind: "writes_state"
      brief: "Rescales outflow by D2RATE to prevent negative storage."
    - from: "CMF_CTRL_DAMOUT"
      to: "P2DAMSTO"
      kind: "writes_state"
      brief: "Reservoir operation updates dam storage before bifurcation (LDAMOUT)."
    - from: "CMF_PHYSICS_ADVANCE"
      to: "CMF_CALC_PTHOUT"
      kind: "invokes"
      brief: "Bifurcation flow when LPTHOUT (levee variant if LLEVEE)."
    - from: "CMF_CALC_PTHOUT"
      to: "D1PTHFLW"
      kind: "writes_state"
      brief: "Per-pathway per-level bifurcation flow (local inertial)."
    - from: "CMF_CALC_OUTFLW"
      to: "CMF_CALC_STONXT"
      kind: "invokes"
      brief: "Storage update consumes river/floodplain/pathway outflow and inflow."
    - from: "D2RIVOUT"
      to: "CMF_CALC_STONXT"
      kind: "reads_state"
      brief: "Outflow*DT removed from river storage in the FTCS update."
    - from: "CMF_CALC_STONXT"
      to: "P2RIVSTO"
      kind: "writes_state"
      brief: "Advances river storage to the next time step."
    - from: "CMF_CALC_STONXT"
      to: "P2FLDSTO"
      kind: "writes_state"
      brief: "Advances floodplain storage including runoff and evaporation."
    - from: "CMF_CALC_STONXT"
      to: "D2OUTFLW"
      kind: "produces_output"
      brief: "Total outflow diagnostic = river + floodplain + bifurcation outflow."
    - from: "D2RIVDPH"
      to: "CALC_ADPSTP"
      kind: "reads_state"
      brief: "River depth bounds the CFL stability time step."
    - from: "CALC_ADPSTP"
      to: "CMF_PHYSICS_ADVANCE"
      kind: "invokes"
      brief: "Sets the inner sub-step DT from the minimum CFL across all cells (mutates the shared time step)."
    - from: "CMF_CALC_STONXT"
      to: "CMF_CALC_DIAG"
      kind: "invokes"
      brief: "Running max/mean accumulate diagnostics each sub-step / output interval."
    - from: "CMF_CALC_DIAG"
      to: "Outputs"
      kind: "produces_output"
      brief: "Averaged and max fields written to bin/NetCDF at the output frequency."
    - from: "P2RIVSTO"
      to: "CMF_CTRL_RESTART"
      kind: "produces_output"
      brief: "Storage state written to restart file for warm starts."

states:
  variables:
    - name: "P2RIVSTO (river channel storage)"
      unit: "m3"
      role: "prognostic"
    - name: "P2FLDSTO (floodplain storage)"
      unit: "m3"
      role: "prognostic"
    - name: "P2GDWSTO (groundwater reservoir storage)"
      unit: "m3"
      role: "prognostic"
    - name: "P2DAMSTO (reservoir storage)"
      unit: "m3"
      role: "prognostic"
    - name: "P2LEVSTO (protected-side levee storage)"
      unit: "m3"
      role: "prognostic"
    - name: "D2RIVOUT_PRE (previous-step river outflow)"
      unit: "m3/s"
      role: "prognostic"
    - name: "D2FLDOUT_PRE (previous-step floodplain outflow)"
      unit: "m3/s"
      role: "prognostic"
    - name: "D2RIVDPH_PRE (previous-step river depth)"
      unit: "m"
      role: "prognostic"
    - name: "D2FLDSTO_PRE (previous-step floodplain storage)"
      unit: "m3"
      role: "prognostic"
    - name: "D1PTHFLW_PRE (previous-step bifurcation flow)"
      unit: "m3/s"
      role: "prognostic"
    - name: "D2RIVDPH (river water depth)"
      unit: "m"
      role: "diagnostic"
    - name: "D2FLDDPH (floodplain depth)"
      unit: "m"
      role: "diagnostic"
    - name: "D2SFCELV (water-surface elevation)"
      unit: "m"
      role: "diagnostic"
    - name: "D2FLDFRC (flooded fraction)"
      unit: "m2/m2"
      role: "diagnostic"
    - name: "D2FLDARE (flooded area)"
      unit: "m2"
      role: "diagnostic"
    - name: "D2RIVVEL (flow velocity)"
      unit: "m/s"
      role: "diagnostic"
    - name: "D2RIVOUT (river discharge)"
      unit: "m3/s"
      role: "diagnostic"
    - name: "D2FLDOUT (floodplain discharge)"
      unit: "m3/s"
      role: "diagnostic"
    - name: "D2RUNOFF (interpolated input surface runoff)"
      unit: "m3/s"
      role: "diagnostic"
    - name: "D1PTHFLW (bifurcation / flood-path channel flow)"
      unit: "m3/s"
      role: "diagnostic"
    - name: "D2OUTFLW (total outflow = river + floodplain + bifurcation)"
      unit: "m3/s"
      role: "diagnostic"
    - name: "D2OUTFLW_MAX / D2STORGE_MAX / D2RIVDPH_MAX (daily maxima)"
      unit: "m3/s, m3, m"
      role: "accumulator"
    - name: "*_AVG output-interval means"
      unit: "various"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "outflw"
    validation_rank: 1
    unit: "m3/s"
    description: "Total main-river-network discharge (river outflow + floodplain outflow + bifurcation outflow); primary validation variable."
    emitted_in: "o_outflw{YYYY}.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Gauge must be allocated to the correct unit-catchment on the coarse river network; mis-allocation produces wrong drainage area and discharge."
            - "First simulated year unreliable from empty initial storage; exclude spin-up period."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single-instant peak/flood-stage comparison sensitive to channel-parameter uncertainty at the gauge cell."]
      detrending_options: ["none"]
  - var: "rivout"
    validation_rank: 2
    unit: "m3/s"
    description: "River channel outflow (in-channel discharge component)."
    emitted_in: "o_rivout{YYYY}.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["In overbank conditions in-channel rivout under-represents total flow; compare total outflw against gauge discharge instead."]
      detrending_options: ["none"]
  - var: "rivdph"
    validation_rank: 4
    unit: "m"
    description: "River channel water depth."
    emitted_in: "o_rivdph{YYYY}.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Depth is diagnosed from storage via channel-geometry power laws; absolute depth carries channel-depth parameter uncertainty."]
      detrending_options: ["none"]
  - var: "sfcelv"
    validation_rank: 3
    unit: "m"
    description: "Water-surface elevation (bed elevation + river depth)."
    emitted_in: "o_sfcelv{YYYY}.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Comparable to satellite-altimetry / gauge stage; absolute datum depends on the DEM bed elevation."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Along-river water-surface profile comparison against altimetry virtual stations."]
      detrending_options: ["none"]
  - var: "flddph"
    validation_rank: 5
    unit: "m"
    description: "Floodplain flood-water inundation depth above floodplain ground."
    emitted_in: "o_flddph{YYYY}.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Sub-grid diagnostic; meaningful at native resolution only after diagnostic downscaling to fine grid."]
      detrending_options: ["none"]
  - var: "fldfrc"
    validation_rank: 6
    unit: "-"
