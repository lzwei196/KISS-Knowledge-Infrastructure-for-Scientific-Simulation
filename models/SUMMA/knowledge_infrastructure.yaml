# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: SUMMA
  language: fortran
  implementation:
    id: summa-ncar
    version: FILE_MANAGER_V3.0.0-era build (NCAR/CH-Earth summa)
    provenance: Fortran 90; NCAR RAL / CH-Earth open-source SUMMA, NetCDF I/O, reuses Noah-MP land-surface
      parameter tables.
  scientific_reference_version: SUMMA (Clark et al. 2015 WRR concept+implementation; SUMMA_FILE_MANAGER_V3.0.0
    configuration era)
  binary:
    path: KISSPATH_BINARIES/summa/bin/summa.exe
    type: ELF
pipeline:
  stages:
  - s1_domain_setup_skill
  - s2_forcing_prep_skill
  - s3_decisions_skill
  - s4_parameters_skill
  - s5_initial_conditions_skill
  - s6_execution_skill
  - s7_physics_comparison_skill
  - s8_routing_skill
tools:
  count: 19
  files:
  - tools/calib_run.py
  - tools/s1_domain_setup/create_gru_hru.py
  - tools/s1_domain_setup/create_local_attributes.py
  - tools/s2_forcing_prep/build_summa_forcing_from_reanalysis.py
  - tools/s2_forcing_prep/convert_vic_forcing_to_summa.py
  - tools/s3_decisions/configure_decisions.py
  - tools/s4_parameters/set_trial_parameters.py
  - tools/s5_initial_conditions/create_initial_conditions.py
  - tools/s6_execution/create_file_manager.py
  - tools/s6_execution/parse_summa_output.py
  - tools/s6_execution/run_summa.py
  - tools/s6_execution/run_summa_twophase.py
  - tools/s6_execution/validate_file_manager.py
  - tools/s7_physics_comparison/compare_physics.py
  - tools/s7_physics_comparison/compare_spatial_field.py
  - tools/s7_physics_comparison/plot_summa_results.py
  - tools/s8_routing/build_river_network.py
  - tools/s8_routing/run_mizuroute.py
  - tools/s8_routing/summa_to_mizuroute.py
inputs:
  forcing:
  - name: pptrate
    unit: kg m-2 s-1
  - name: airtemp
    unit: K
  - name: SWRadAtm
    unit: W m-2
  - name: LWRadAtm
    unit: W m-2
  - name: windspd
    unit: m s-1
  - name: airpres
    unit: Pa
  - name: spechum
    unit: g g-1
  parameters:
  - name: k_soil (saturated hydraulic conductivity)
    unit: m s-1
  - name: theta_sat (porosity / saturated water content)
    unit: '-'
  - name: theta_res (residual water content)
    unit: '-'
  - name: vGn_alpha (van Genuchten alpha)
    unit: m-1
  - name: vGn_n (van Genuchten n shape)
    unit: '-'
  - name: critSoilWilting (wilting point)
    unit: '-'
  - name: critSoilTranspire (transpiration threshold)
    unit: '-'
  - name: fieldCapacity
    unit: '-'
  - name: heightCanopyTop (canopy height)
    unit: m
  - name: rootingDepth (root zone depth)
    unit: m
  - name: qSurfScale (surface runoff scaling)
    unit: '-'
  - name: aquiferScaleFactor (aquifer response time)
    unit: m
  - name: tempCritRain (rain/snow threshold)
    unit: K
  - name: frozenPrecipMultip (snow undercatch correction)
    unit: '-'
  - name: vegTypeIndex / soilTypeIndex / slopeTypeIndex
    unit: '-'
  - name: HRU geometry (HRUarea, elevation, tan_slope, contourLength, mHeight, downHRUindex)
    unit: mixed (m2, m, m/m, m)
  initial_conditions:
  - name: mLayerTemp (initial soil/snow layer temperature)
    unit: K
  - name: mLayerVolFracLiq / mLayerVolFracIce (initial layer moisture)
    unit: '-'
  - name: mLayerMatricHead (initial soil matric head)
    unit: m
  - name: scalarSWE / nSnow (initial snow water equivalent / snow layer count)
    unit: kg m-2 / -
  - name: canopy state (scalarCanopyLiq, scalarCanopyIce)
    unit: kg m-2
  - name: scalarAquiferStorage (initial aquifer storage)
    unit: m
  - name: nSoil / soil layer discretization
    unit: '-'
  - name: dt_init (initial time sub-step length)
    unit: s
  boundary_conditions:
  - name: model decisions (~35 physics-option categories)
    unit: '-'
  - name: bcUpprTdyn / bcUpprSoiH (upper temperature/soil-head boundary)
    unit: '-'
  - name: bcLowrTdyn / bcLowrSoiH (lower temperature/soil-head boundary)
    unit: '-'
  - name: simStartTime / simEndTime / data_step
    unit: datetime / s
  - name: output control (variables, frequency, statistics)
    unit: '-'
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - scalarTotalRunoff
  - scalarTotalET
  - scalarSWE
  - scalarSnowDepth
  - mLayerVolFracLiq
  - scalarNetRadiation
  - scalarLatHeatTotal
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.969, KGE=0.831, R=0.997, 7 scorecard(s)'
  metrics:
    best_nse: 0.9692
    best_kge: 0.8308
    best_r: 0.997
summary:
  total_tools: 19
  total_stage_docs: 8
  total_diagnostic_triplets: 34
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
