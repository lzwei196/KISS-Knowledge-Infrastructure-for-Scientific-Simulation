template_version: "3.5"

identity:
  model_id: "TOPMODEL"
  scientific_reference_version: "TOPMODEL (Beven & Kirkby 1979; Beven et al. 1995 formulation, TMOD95.02 lineage)"
  implementation:
    id: "topmodel-noaa-owp-bmi"
    version: "NOAA-OWP topmodel (2021 BMI release)"
    provenance: "C; NOAA-OWP BMI port (2021) of Fred Ogden's 2009 C translation of the Beven (1995) TMOD95.02 TOPMODEL Fortran reference, distributed at github.com/NOAA-OWP/topmodel."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c"
  license: "NOASSERTION"
  repo_url: "https://github.com/NOAA-OWP/topmodel"

boundary:
  scope_in:
    - "rainfall-runoff transformation at hillslope / small catchment scale"
    - "variable saturated contributing area dynamics driven by topography (TWI similarity)"
    - "saturation-excess overland flow"
    - "exponential subsurface (baseflow) drainage on shallow soils over an impeding layer"
    - "root-zone-deficit-limited actual evapotranspiration"
    - "unsaturated zone vertical recharge to the saturated store"
    - "optional Green-Ampt infiltration-excess overland flow (infex=1)"
    - "linear constant-celerity channel routing via time-area / time-delay histogram"
  scope_out:
    - "snowpack accumulation and snowmelt (no snow module)"
    - "internal PET calculation (PET must be supplied as forcing)"
    - "crop / vegetation phenology"
    - "water quality, sediment, nutrients"
    - "deep regional groundwater (assumes shallow water table approximately parallel to surface)"
    - "fully 2-D distributed routing (model is semi-distributed via TWI classes)"
    - "sub-hourly dynamics within a single timestep"
  spatial: "0-D point"
  temporal: "hourly"
  closure: "mass-balance"
  notes: "The model is semi-distributed via a topographic-wetness-index (TWI = ln(a/tanB)) histogram within a single lumped subcatchment, NOT a 2-D grid. Mass-balance closure is verified at finalize as bal = sbar + sump - sumae - sumq + sumrz - sumuz and should be near zero. The model has no energy-balance closure: PET enters as an external forcing and actual ET is a demand-side reduction based on the root-zone deficit. Internal units are strictly metres and hours; per-step indexing of the rain/PE arrays requires the inputs.dat header dt to be 1.0."

inputs:
  forcing:
    - category: "atmospheric"
      name: "rainfall (rain)"
      unit: "m/hr"
      source_kind: "forcing"
      model_input_format: "inputs.dat column 1, per-timestep depth"
      notes: "Internally treated as a per-step depth in metres; the 'h-1' BMI label is a misnomer when dt != 1 h, and the model is structurally only safe for dt = 1.0 in the inputs.dat header."
    - category: "atmospheric"
      name: "potential evapotranspiration (pe)"
      unit: "m/hr"
      source_kind: "forcing"
      model_input_format: "inputs.dat column 2, per-timestep depth"
      notes: "TOPMODEL does NOT compute PET internally; it must be supplied (e.g., from Hargreaves or Penman-Monteith)."
    - category: "hydrologic"
      name: "observed discharge (Qobs)"
      unit: "m/hr"
      source_kind: "forcing"
      model_input_format: "inputs.dat column 3, per-timestep depth; optional, used only for diagnostic NSE and hyd.out comparison"
      notes: "Read by inputs() in standalone mode; not a BMI input variable. Used by results() to compute internal NSE and to write the observed column of hyd.out."
  parameters:
    - category: "subsurface"
      name: "szm"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "params.dat field 1"
      notes: "Exponential transmissivity-decay parameter; controls baseflow recession shape. szm > 0 is required (zero -> division by zero in qb = szq*exp(-sbar/szm))."
    - category: "subsurface"
      name: "t0 (ln T0)"
      unit: "ln(m/hr)"
      source_kind: "calibrated"
      model_input_format: "params.dat field 2"
      notes: "Input is the natural log of saturated surface transmissivity, NOT linear T0. The binary computes szq = exp(t0 + log(dt) - tl); supplying linear T0 silently mis-scales baseflow."
    - category: "subsurface"
      name: "td"
      unit: "hr"
      source_kind: "calibrated"
      model_input_format: "params.dat field 3"
      notes: "Unsaturated-zone time delay per unit local saturation deficit."
    - category: "routing"
      name: "chv"
      unit: "m/hr"
      source_kind: "calibrated"
      model_input_format: "params.dat field 4"
      notes: "Main-channel routing velocity used in the time-delay histogram."
    - category: "routing"
      name: "rv"
      unit: "m/hr"
      source_kind: "calibrated"
      model_input_format: "params.dat field 5"
      notes: "Internal (overland) routing velocity used in the time-delay histogram."
    - category: "root_zone"
      name: "srmax"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "params.dat field 6"
      notes: "Maximum root-zone storage deficit; cap on ET supply and root-zone water available for percolation."
    - category: "infiltration_excess"
      name: "xk0"
      unit: "m/hr"
      source_kind: "calibrated"
      model_input_format: "params.dat field 10"
      notes: "Surface saturated hydraulic conductivity for the Green-Ampt option; consumed only when infex=1."
    - category: "infiltration_excess"
      name: "hf"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "params.dat field 11"
      notes: "Green-Ampt wetting-front suction; consumed only when infex=1."
    - category: "infiltration_excess"
      name: "dth"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "params.dat field 12"
      notes: "Green-Ampt water-content change at the wetting front; consumed only when infex=1."
    - category: "topography"
      name: "TWI histogram (lnaotb, dist_area_lnaotb)"
      unit: "ln(m), -"
      source_kind: "dataset_lookup"
      model_input_format: "subcat.dat — 10-30 (ln(a/tanB), area-fraction) pairs ordered high to low TWI"
      notes: "Derived from a depressionless DEM. Must be ordered HIGH to LOW TWI; the code does not check ordering and silently produces wrong qof if reversed. Area fractions must sum to ~1.0 (water-balance error otherwise)."
    - category: "topography"
      name: "channel network (cum_dist_area, dist_from_outlet)"
      unit: "-, m"
      source_kind: "dataset_lookup"
      model_input_format: "subcat.dat — (cum_dist_area, dist_from_outlet[m]) pairs"
      notes: "Combined with chv and rv to build the time-delay histogram. Channel distances must be in metres, not km."
    - category: "subcatchment"
      name: "subcatchment area"
      unit: "m^2"
      source_kind: "dataset_lookup"
      model_input_format: "subcat.dat header / external scaling"
      notes: "Used to convert per-step depth fluxes to volumetric discharge."
  initial_conditions:
    - category: "subsurface"
      name: "Q0"
      unit: "m/hr"
      source_kind: "user_provided"
      model_input_format: "params.dat field 7"
      notes: "Initial subsurface flow; init_water_balance computes sbar = -szm*log(Q0/szq). Q0 = 0 produces -inf and silently propagates as NaN."
    - category: "root_zone"
      name: "sr0"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "params.dat field 8"
      notes: "Initial root-zone deficit; must satisfy sr0 <= srmax (otherwise initial water-balance error)."
  boundary_conditions:
    - category: "process_switch"
      name: "infex (infiltration-excess flag)"
      unit: "flag (0/1)"
      source_kind: "user_provided"
      model_input_format: "params.dat field 9"
      notes: "Structural switch enabling the Green-Ampt infiltration-excess path; default 0 (off)."
    - category: "execution_mode"
      name: "stand_alone flag"
      unit: "flag (0/1)"
      source_kind: "user_provided"
      model_input_format: "topmod.run line 1"
      notes: "Structural switch: 1 = standalone driver (reads inputs.dat, writes topmod.out/hyd.out); 0 = BMI framework coupling (rain/PE injected by caller)."
    - category: "outlet"
      name: "catchment outlet"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "implicit — single subcatchment with one outlet defined by the channel-distance table"
      notes: "TOPMODEL assumes a single outlet per subcatchment; basin boundary delineated externally from the DEM."
    - category: "timestep"
      name: "dt (timestep length)"
      unit: "hr"
      source_kind: "user_provided"
      model_input_format: "inputs.dat header line, second value"
      notes: "Internally the code uses dt as an integer array index; the C binary is structurally safe only at dt = 1.0. Sub-hourly or daily dt values silently mis-index the rain/PE arrays and can read past the buffer."

processes:
  modules:
    - name: "Inputs"
      role: "driver"
      brief: "Reads nstep, dt and per-step (rain, pe, Qobs) triples from inputs.dat; allocates rain/pe/Qobs/Q/contrib_area arrays of size nstep+1 (1-based Fortran-style indexing)."
    - name: "Tread"
      role: "driver"
      brief: "Reads subcat.dat: TWI histogram (dist_area_lnaotb, lnaotb), channel network (cum_dist_area, dist_from_outlet); computes tl = areal integral of ln(a/tanB)."
    - name: "ChannelRouting_Init"
      role: "process_solver"
      brief: "convert_dist_to_histords + calc_time_delay_histogram: converts channel distances to a per-step time-delay histogram using chv (main channel velocity) and rv (internal routing velocity); produces num_delay and num_time_delay_histo_ords."
    - name: "WaterBalance_Init"
      role: "process_solver"
      brief: "init_water_balance: computes szq = exp(t0 + log(dt) - tl); initializes sbar = -szm*log(Q0/szq); seeds deficit_root_zone[ia]=sr0, stor_unsat_zone[ia]=0."
    - name: "Discharge_Init"
      role: "process_solver"
      brief: "init_discharge_array: pre-fills the Q[] routing buffer over the delay+histogram window with Q0-scaled cumulative-histogram weights, so routed discharge has a non-zero initial baseflow."
    - name: "InfiltrationExcess"
      role: "optional_module"
      brief: "expinf: Green-Ampt with exponential ksat decline (Beven 1984), gated by infex=1; Newton-Raphson with 20-iteration cap. On non-convergence the binary calls exit(-9). Splits p into infiltration (df) and excess (rex); rex bypasses the subsurface and goes directly to qof."
      applicability: "infex=1 only"
    - name: "RootZone"
      role: "process_solver"
      brief: "Per-TWI-class root-zone block: subtracts p from deficit_root_zone[ia], spills excess into stor_unsat_zone[ia], evaporates ea = ep*(1 - deficit_root_zone/srmax) capped by srmax - deficit_root_zone."
    - name: "UnsaturatedZone"
      role: "process_solver"
      brief: "Per-TWI-class UZ drainage: uz = stor_unsat_zone[ia] / (deficit_local[ia] * td * dt); accumulates quz = sum(uz*acf); clamps stor_unsat_zone to 1e-7 to suppress denormals."
    - name: "SaturatedZone"
      role: "process_solver"
      brief: "Baseflow step: qb = szq * exp(-sbar/szm); sbar += (-quz + qb). Explicit Euler integration of mean catchment saturation deficit; sbar uses the start-of-step value for contributing-area calculations."
    - name: "SaturationOverlandFlow"
      role: "process_solver"
      brief: "Per-TWI-class qof: identifies saturated TWI bands where stor_unsat_zone > deficit_local, interpolates partial-band saturation, accumulates contrib_area and qof."
    - name: "TopographicIndex"
      role: "process_solver"
      brief: "TWI = ln(a/tanB) similarity assumption: cells with equal TWI respond identically; local saturation deficit is deficit_local[i] = sbar + szm*(tl - lnaotb[i])."
    - name: "ChannelRouting_Step"
      role: "integrator"
      brief: "Distributes Qout = qb + qof into Q[it + num_delay + ir - 1] += Qout*time_delay_histogram[ir]; this is the linear constant-celerity time-delay routing that produces simulated discharge at the outlet."
    - name: "WaterBalance_Diagnostics"
      role: "integrator"
      brief: "water_balance: at finalize computes bal += sbar + sump - sumae - sumq + sumrz - sumuz; should be near zero if mass-conservative."
    - name: "Results"
      role: "driver"
      brief: "results: at finalize writes hyd.out (it, Qobs[it], Q[it]) per step and computes NSE = 1 - vare/varq as an internal diagnostic (standalone-only)."
  internal_edges:
    - from: "Inputs"
      to: "RootZone"
      kind: "consumes_input"
      brief: "rain[it] is consumed as p in topmod and reduces the root-zone deficit."
    - from: "Inputs"
      to: "RootZone"
      kind: "consumes_input"
      brief: "pe[it] is consumed as ep and scales ea = ep*(1 - deficit_root_zone/srmax)."
    - from: "Tread"
      to: "TopographicIndex"
      kind: "produces_output"
      brief: "lnaotb[ia], dist_area_lnaotb[ia], and tl from tread parameterize the TWI similarity mapping consumed every step inside topmod's TWI loop."
    - from: "Tread"
      to: "WaterBalance_Init"
      kind: "produces_output"
      brief: "tl is required by init_water_balance to compute szq = exp(t0 + log(dt) - tl)."
    - from: "Tread"
      to: "ChannelRouting_Init"
      kind: "produces_output"
      brief: "Channel-distance and cumulative-area pairs feed convert_dist_to_histords / calc_time_delay_histogram."
    - from: "ChannelRouting_Init"
      to: "Discharge_Init"
      kind: "produces_output"
      brief: "calc_time_delay_histogram produces num_delay and time_delay_histogram[], required by init_discharge_array to seed Q[]."
    - from: "ChannelRouting_Init"
      to: "ChannelRouting_Step"
      kind: "produces_output"
      brief: "time_delay_histogram[ir] and num_delay/num_time_delay_histo_ords drive the routing index math in topmod."
    - from: "WaterBalance_Init"
      to: "SaturatedZone"
      kind: "produces_output"
      brief: "init_water_balance produces szq and initial sbar used by qb = szq*exp(-sbar/szm)."
    - from: "WaterBalance_Init"
      to: "RootZone"
      kind: "produces_output"
      brief: "init_water_balance seeds deficit_root_zone[ia]=sr0 for each TWI class."
    - from: "Discharge_Init"
      to: "ChannelRouting_Step"
      kind: "writes_state"
      brief: "init_discharge_array pre-fills Q[] over the delay+histogram window with Q0*area scaled by cumulative-histogram weights."
    - from: "InfiltrationExcess"
      to: "RootZone"
      kind: "writes_state"
      brief: "expinf splits p into infiltration (df) and excess (rex); only df is passed to the root-zone, rex bypasses subsurface and goes straight to qof."
    - from: "TopographicIndex"
      to: "SaturatedZone"
      kind: "produces_output"
      brief: "deficit_local[i] = sbar + szm*(tl - lnaotb[i]) — the TWI distribution maps the mean deficit sbar to local deficits."
    - from: "RootZone"
      to: "UnsaturatedZone"
      kind: "writes_state"
      brief: "When deficit_root_zone[ia] becomes negative (saturated), excess flows into stor_unsat_zone[ia]."
    - from: "UnsaturatedZone"
      to: "SaturatedZone"
      kind: "writes_state"
      brief: "quz (sum of uz*acf across TWI classes) recharges the saturated zone: sbar -= quz."
    - from: "TopographicIndex"
      to: "SaturationOverlandFlow"
      kind: "reads_state"
      brief: "Qof per-class loop reads ex[ia] = stor_unsat_zone[ia] - deficit_local[ia] to identify saturated bands."
    - from: "SaturationOverlandFlow"
      to: "ChannelRouting_Step"
      kind: "produces_output"
      brief: "qof is added to Qout = qb + qof and routed through the time-delay histogram."
    - from: "SaturatedZone"
      to: "ChannelRouting_Step"
      kind: "produces_output"
      brief: "qb is added to Qout = qb + qof and routed through the time-delay histogram."
    - from: "ChannelRouting_Step"
      to: "Outputs"
      kind: "produces_output"
      brief: "Q[it] (accumulated routed discharge) is the per-step simulated discharge written to hyd.out as column 3."
    - from: "Inputs"
      to: "Outputs"
      kind: "produces_output"
      brief: "Qobs[it] is echoed to hyd.out as column 2 and used by results() to compute the internal NSE."
    - from: "Inputs"
      to: "WaterBalance_Diagnostics"
      kind: "writes_state"
      brief: "rain[it] accumulates into sump."
    - from: "RootZone"
      to: "WaterBalance_Diagnostics"
      kind: "writes_state"
      brief: "ea*acf accumulates into sumae; deficit_root_zone area-weighted into sumrz."
    - from: "UnsaturatedZone"
      to: "WaterBalance_Diagnostics"
      kind: "writes_state"
      brief: "stor_unsat_zone[ia] area-weighted into sumuz at end of each topmod step."
    - from: "ChannelRouting_Step"
      to: "WaterBalance_Diagnostics"
      kind: "writes_state"
      brief: "Q[it] accumulates into sumq for the finalize-time mass-balance residual."

states:
  variables:
    - name: "sbar"
      unit: "m"
      role: "prognostic"
    - name: "deficit_local[ia]"
      unit: "m"
      role: "diagnostic"
    - name: "deficit_root_zone[ia]"
      unit: "m"
      role: "prognostic"
    - name: "stor_unsat_zone[ia]"
      unit: "m"
      role: "prognostic"
    - name: "Q[it]"
      unit: "m/step"
      role: "prognostic"
    - name: "contrib_area[it]"
      unit: "-"
      role: "diagnostic"
    - name: "qb"
      unit: "m/step"
      role: "diagnostic"
    - name: "qof"
      unit: "m/step"
      role: "diagnostic"
    - name: "quz"
      unit: "m/step"
      role: "diagnostic"
    - name: "Qout"
      unit: "m/step"
      role: "diagnostic"
    - name: "p"
      unit: "m/step"
      role: "diagnostic"
    - name: "ep"
      unit: "m/step"
      role: "diagnostic"
    - name: "szq"
      unit: "m/step"
      role: "diagnostic"
    - name: "tl"
      unit: "-"
      role: "diagnostic"
    - name: "num_delay"
      unit: "steps"
      role: "diagnostic"
    - name: "num_time_delay_histo_ords"
      unit: "-"
      role: "diagnostic"
    - name: "time_delay_histogram[ir]"
      unit: "-"
      role: "diagnostic"
    - name: "sump"
      unit: "m"
      role: "accumulator"
    - name: "sumae"
      unit: "m"
      role: "accumulator"
    - name: "sumq"
      unit: "m"
      role: "accumulator"
    - name: "sumrz"
      unit: "m"
      role: "accumulator"
    - name: "sumuz"
      unit: "m"
      role: "accumulator"
    - name: "bal"
      unit: "m"
      role: "accumulator"
    - name: "max_contrib_area"
      unit: "-"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "Q (simulated discharge)"
    validation_rank: 1
    unit: "m/hr (per-step depth; convert to m^3/s via Q_m3s = Q_mhr * basin_area_m^2 / 3600)"
    description: "Per-timestep routed discharge at the catchment outlet (qb + qof routed through the time-delay histogram)."
    emitted_in: "hyd.out (column 3) and topmod.out (column 4 'Q[it]')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Observed Q must be reduced to the same units (m/hr per-step depth) as the simulated series."
            - "Single-outlet hydrograph; the model is lumped per subcatchment and cannot resolve internal spatial pattern."
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families:
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Only relevant for threshold-based flood-event detection; classification depends on the chosen threshold and dataset definition."
      detrending_options:
        - "none"
        - "first_difference"
  - var: "qb (baseflow)"
    validation_rank: 3
    unit: "m/hr (per-step depth)"
    description: "Per-step subsurface baseflow contribution to the outlet; qb = szq*exp(-sbar/szm)."
    emitted_in: "topmod.out column 'qb'"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Direct observation of baseflow is rare; usually inferred via hydrograph separation from observed Q."
      detrending_options:
        - "none"
  - var: "qof (saturation/Hortonian overland flow)"
    unit: "m/hr (per-step depth)"
    description: "Per-step saturated-area + (optional) infiltration-excess overland flow contribution."
    emitted_in: "topmod.out column 'qof'"
    observability:
      comparable_obs_shapes: []
      detrending_options:
        - "none"
  - var: "sbar (mean saturation deficit)"
    validation_rank: 4
    unit: "m"
    description: "Catchment-mean soil-moisture saturation deficit; central prognostic state."
    emitted_in: "topmod.out column 'sbar'"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Best compared against piezometer water-table-depth observations via TOPMODEL's local-deficit mapping; absolute sbar carries calibration scaling."
      detrending_options:
        - "none"
  - var: "contrib_area (saturated contributing-area fraction)"
    validation_rank: 5
    unit: "-"
    description: "Fraction of subcatchment area predicted to be saturated and producing saturation-excess runoff at each step."
    emitted_in: "topmod.out internal field; max_contrib_area summarized at end-of-run"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "csi"
          caveats:
            - "Comparison is to the FRACTION not to specific saturated locations; TOPMODEL's similarity assumption groups cells by TWI, not absolute position."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "At-a-point saturated/unsaturated flag time series."
      detrending_options:
        - "none"
  - var: "ea (actual evapotranspiration)"
    validation_rank: 2
    unit: "m/hr (per-step depth)"
    description: "Area-weighted actual ET = ep*(1 - deficit_root_zone/srmax), capped by available root-zone water."
    emitted_in: "topmod.out via 'ep' column and accumulated into sumae"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Spatially-uniform PET assumption; no canopy energy-balance closure."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families:
            - "trend_match"
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Aggregate ET datasets carry remote-sensing retrieval biases independent of the model."
      detrending_options:
        - "none"
        - "linear_residual"
  - var: "bal (water-balance residual)"
    unit: "m"
    description: "Closure diagnostic at finalize: bal = sbar + sump - sumae - sumq + sumrz - sumuz."
    emitted_in: "topmod.out trailing summary (BAL)"
    observability:
      comparable_obs_shapes: []
      detrending_options:
        - "none"

influence:
  _caveat: "Published TOPMODEL sensitivity-analysis studies (Beven & Binley 1992, Freer 1996, Franchini 1996, Blazkova 2002, Xu 2011) vary model PARAMETERS under fixed rainfall/PE forcing, so atmospheric forcings (rain, pe) cannot earn a HIGH sensitivity_grade from that literature even though they are mechanistically first-order drivers of Q and ea respectively. Forcing edges are recorded at MEDIUM with basis: mechanistic_inference."
  edges:
    - from: "szm (m, transmissivity-decay)"
      to: "Q (simulated discharge)"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "beven1992_glue_topmodel"
        - "freer1996_glue_topmodel_ringelbach"
