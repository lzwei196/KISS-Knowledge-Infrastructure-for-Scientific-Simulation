# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: MONICA
  language: c++
  implementation:
    id: monica-zalf
    version: 3.6.56
    provenance: C++17; ZALF (zalf-rpm/monica) standalone monica-run binary wrapping the core soil-plant
      C/N/water modules; thin Python orchestration binding.
  scientific_reference_version: MONICA 3.6.x (ZALF; MOdel of Nitrogen and Carbon dynamics in Agro-ecosystems;
    Nendel et al. 2011, Ecological Modelling)
inputs:
  forcing:
  - name: tavg
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: 'climate.csv column (semicolon-separated, 2 header rows: names + units)'
  - name: tmin
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column
  - name: tmax
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column
  - name: globrad
    unit: MJ m-2 d-1
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column
    notes: Drives photosynthesis directly; the model reads the value as-is, so non-MJ units (J cm-2, W
      m-2) silently inflate yield. netRadiation = globrad*(1-albedo).
  - name: wind
    unit: m s-1
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column
    notes: Enters FAO Penman-Monteith ET0; a hardcoded minimum windspeed of 0.5 m/s is enforced internally.
  - name: precip
    unit: mm d-1
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column
  - name: relhumid
    unit: '% (0-100)'
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column
    notes: Passed to the moisture module as relhumid/100; if absent the orchestrator substitutes a -1.0
      sentinel the module must interpret.
  - name: sunhours
    unit: h
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column (optional)
    notes: Used when globrad is unavailable.
  - name: vappd
    unit: kPa
    category: forcing
    source_kind: forcing
    model_input_format: climate.csv column (optional)
  - name: atmospheric CO2 concentration
    unit: ppm
    category: forcing
    source_kind: forcing
    model_input_format: supplied per-day in the climate/env map
    notes: Drives photosynthesis; when not supplied it is generated from a hardcoded per-RCP logistic+seasonal-sine
      fit (default RCP8.5).
  - name: atmospheric O3 concentration
    unit: ppb
    category: forcing
    source_kind: forcing
    model_input_format: supplied per-day in the env map (optional; drives O3-impact module)
  parameters:
  - name: crop species parameters
    unit: '-'
    category: parameters
    source_kind: dataset_lookup
    model_input_format: species include-from-file JSON (merged with cultivar at runtime)
    notes: Includes pc_MaxAssimilationRate (15-60 µmol m-2 s-1), pc_StageTemperatureSum[] (degC d), base/heat-stress
      phase temperature sums, specificLeafArea, assimilate-partitioning fractions, N-concentration thresholds.
  - name: crop cultivar parameters
    unit: '-'
    category: parameters
    source_kind: dataset_lookup
    model_input_format: cultivar include-from-file JSON
    notes: Cultivar-specific traits (e.g. vernalisation requirement, LT50 frost tolerance, rooting depth
      0.5-2.0 m) merged over the species defaults.
  - name: residue parameters (residueParams)
    unit: '-'
    category: parameters
    source_kind: dataset_lookup
    model_input_format: crop JSON
  - name: Kc factor per development stage
    unit: '-'
    category: parameters
    source_kind: calibrated
    model_input_format: crop JSON
    notes: Crop coefficient relating actual crop ET to reference ET0; range ~0.3-1.3.
  - name: soil hydraulic parameters (field capacity, wilting point, saturation)
    unit: m3 m-3
    category: parameters
    source_kind: derived
    model_input_format: derived by pedotransfer functions from texture, OM and bulk density, per layer
    notes: Field capacity 0.10-0.45, wilting point 0.04-0.20.
  - name: soil texture (sand/clay fractions or KA5 class)
    unit: fraction 0-1
    category: parameters
    source_kind: dataset_lookup
    model_input_format: SoilProfileParameters[] layer entry in site.json
    notes: Drives PTF-derived hydraulics; expected as fractions, not percent.
  - name: soil bulk density (SoilRawDensity)
    unit: kg m-3
    category: parameters
    source_kind: dataset_lookup
    model_input_format: SoilProfileParameters[] layer entry
    notes: Plausible range 500-2000 kg m-3.
  - name: soil organic carbon (initial SOC per layer)
    unit: '% (mass)'
    category: parameters
    source_kind: dataset_lookup
    model_input_format: SoilProfileParameters[] layer entry; SOC = SOM × 0.58
  - name: soil pH per layer
    unit: '-'
    category: parameters
    source_kind: dataset_lookup
    model_input_format: SoilProfileParameters[] layer entry
  - name: layer thickness
    unit: m
    category: parameters
    source_kind: user_provided
    model_input_format: SoilProfileParameters[] layer entry
    notes: 20 layers × 0.1 m to 2 m; supplied in metres.
  - name: ps_MicrobialUtilizationEfficiency
    unit: '-'
    category: parameters
    source_kind: calibrated
    model_input_format: soil organic parameters
    notes: Default 0.5, range 0.3-0.7.
  - name: snowRetainedWaterToSnowRatio
    unit: '-'
    category: parameters
    source_kind: calibrated
    model_input_format: soil/snow parameters
    notes: Range 0.0-0.5.
  - name: site latitude
    unit: decimal degrees
    category: parameters
    source_kind: user_provided
    model_input_format: site.json (required)
  - name: site slope / elevation (HeightNN)
    unit: m/m, m
    category: parameters
    source_kind: user_provided
    model_input_format: site.json (defaults 0)
  - name: albedo
    unit: '-'
    category: parameters
    source_kind: default
    model_input_format: environment parameter
    notes: Applied inline as netRadiation = globrad*(1 - albedo).
  initial_conditions:
  - name: initial soil water content per layer
    unit: m3 m-3
    category: initial_conditions
    source_kind: user_provided
    model_input_format: site/soil JSON state at simulation start
  - name: initial soil mineral N (NO3, NH4) per layer
    unit: kg N m-3
    category: initial_conditions
    source_kind: user_provided
    model_input_format: site/soil JSON state at start
  - name: initial soil organic matter pools per layer
    unit: kg C / kg N m-3
    category: initial_conditions
    source_kind: derived
    model_input_format: initialised from SOC and OM partitioning at start
  - name: initial soil temperature per layer
    unit: degC
    category: initial_conditions
    source_kind: user_provided
    model_input_format: soil temperature initialisation
  boundary_conditions:
  - name: groundwater depth / table
    unit: m
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: measured series or annual sinusoid (min/max/month) in site/env JSON
    notes: Lower boundary; negative computed sinusoidal depths are clamped to a hardcoded 20.0 m (effectively
      no groundwater).
  - name: atmospheric N deposition (NDeposition)
    unit: kg N ha-1 yr-1
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: site.json (default 30)
  - name: sowing workstep
    unit: date
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: crop.json cropRotation[] Sowing (with is-winter-crop flag)
  - name: mineral fertilisation workstep
    unit: kg N ha-1
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: crop.json cropRotation[] MineralFertilization; N partitioning from fert-params
  - name: organic fertilisation workstep
    unit: kg FM ha-1
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: crop.json cropRotation[] OrganicFertilization
  - name: irrigation workstep
    unit: mm
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: crop.json cropRotation[] Irrigation; or automatic via AutoIrrigationParams
  - name: tillage workstep
    unit: m (depth)
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: crop.json cropRotation[] Tillage
  - name: harvest workstep
    unit: date / trigger
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: crop.json cropRotation[] AutomaticHarvest
  - name: model option switches
    unit: boolean / mode
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: sim.json (NitrogenResponseOn, WaterDeficitResponseOn, UseAutomaticIrrigation,
      UseNMinMineralFertilisingMethod, UseSecondaryYields, EmergenceFloodingControlOn, EmergenceMoistureControlOn)
    notes: Structural switches selecting which stress responses and management automations are active.
outputs:
  primary:
  - name: Yield
    unit: kg DM ha-1
    description: Harvested crop marketable dry-matter yield.
    validation_rank: 1
    emitted_in: MONICA output CSV (crop/harvest events)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Point/plot trial yields compare directly; convert DM to fresh weight where obs are fresh.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-season plot yield.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/provincial yield aggregates carry a technology trend a weather-driven point model cannot
          reproduce; detrend before comparing. Point simulation must be representative-aggregated to the
          region first.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: LAI
    unit: m2 m-2
    description: Crop canopy leaf area index.
    validation_rank: 2
    emitted_in: MONICA output CSV (daily/crop events)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Compare against destructive or remote-sensed LAI at the plot; peak timing is informative for
          phenology.
      detrending_options:
      - none
  - name: Stage
    unit: 0-7
    description: Crop phenological development stage.
    validation_rank: 5
    emitted_in: MONICA output CSV (daily)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Compare stage-transition DOY (emergence, flowering, maturity) against phenological observations.
          Only stage-transition timing is compared; magnitude of the 0-7 index itself is not a meaningful
          target.
      detrending_options:
      - none
  - name: Act_ET
    unit: mm
    description: Actual evapotranspiration from the soil-plant column water balance.
    validation_rank: 3
    emitted_in: MONICA output CSV (daily)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare against eddy-covariance / lysimeter ET at the column location.
      detrending_options:
      - none
  - name: Mois
    unit: m3 m-3
    description: Volumetric soil moisture per layer.
    validation_rank: 6
    emitted_in: MONICA output CSV (daily, per layer 1-20)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Match the observed sensor depth to the corresponding model layer.
      detrending_options:
      - none
  - name: NLeach
    unit: kg N ha-1
    description: Soil nitrate leaching below the root zone / lower boundary of the soil column.
    validation_rank: 7
    emitted_in: MONICA output CSV (daily/yearly)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Compare against lysimeter/suction-cup leachate fluxes; cumulative annual loads are more robust
          than daily.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Seasonal/annual cumulative leaching.
      detrending_options:
      - none
  - name: N2O
    unit: kg N ha-1
    description: Soil nitrous oxide emissions from nitrification/denitrification.
    validation_rank: 8
    emitted_in: MONICA output CSV (daily)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Chamber flux measurements are episodic and noisy; cumulative seasonal flux comparison is more
          defensible than daily matching.
      detrending_options:
      - none
  - name: SOC
    unit: '% (kg C kg-1)'
    description: Soil organic carbon per layer.
    validation_rank: 4
    emitted_in: MONICA output CSV (per layer 1-6)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        - trend_match
        determining_metric: pbias
        caveats:
        - SOC change is slow; long-term-experiment decadal change is the meaningful signal.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Match measured horizon to the corresponding model SOC layer.
      detrending_options:
      - none
      - decadal_mean
  - name: SumNUp
    unit: kg N ha-1
    description: Cumulative crop nitrogen uptake.
    validation_rank: 9
    emitted_in: MONICA output CSV (crop/harvest events)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Compare against measured crop N offtake at harvest.
      detrending_options:
      - none
  - name: GPP
    unit: kg C ha-1
    description: Crop canopy gross primary production.
    validation_rank: 10
    emitted_in: MONICA output CSV (daily)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare against eddy-covariance partitioned GPP at flux towers.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_01
  symptom: 'Yield is 10–100× too high (e.g., 500,000 kg ha⁻¹ instead of 5,000). Crop LAI grows to extreme
    values. All biomass pools inflated.

    '
  diagnosis: 'Global radiation (globrad) was supplied in J cm⁻² or W m⁻² instead of MJ m⁻² d⁻¹. MONICA
    reads the value as-is, resulting in 100× or ~12× over-estimation of available photosynthetically active
    radiation.

    '
  remedy: 'Convert globrad before writing climate.csv: - J cm⁻² → MJ m⁻² d⁻¹: divide by 100 - W m⁻² →
    MJ m⁻² d⁻¹: multiply by 0.0864 Alternatively, use header-to-acd-names in sim.json: "globrad": ["globrad",
    "/", 100]

    '
  severity: silent
- id: dt_02
  symptom: 'ET0 is always 0 or near 0. Crops show severe water stress even with adequate precipitation.
    Transpiration deficit (TraDef) stuck at 1.0.

    '
  diagnosis: 'Relative humidity was provided as a fraction [0–1] instead of percentage [0–100]. The Penman-Monteith
    ET calculation receives near-zero humidity values, leading to incorrect vapour pressure deficit computation.

    '
  remedy: 'Ensure relhumid is in percent (0–100). If source data is fraction, multiply by 100. Use --relhumid-unit
    fraction flag in the converter tool.

    '
  severity: silent
- id: dt_03
  symptom: 'Unrealistic actual evapotranspiration values (ET > 20 mm d⁻¹ regularly). Soil dries out much
    faster than expected.

    '
  diagnosis: 'Wind speed was provided in km h⁻¹ instead of m s⁻¹. Wind speed enters the Penman-Monteith
    equation directly; a 3.6× overestimate amplifies the aerodynamic term of ET.

    '
  remedy: 'Convert wind speed: km h⁻¹ ÷ 3.6 = m s⁻¹. Use --wind-unit km_h flag in the converter tool.

    '
  severity: silent
- id: dt_04
  symptom: 'Precipitation totals are 1000× too high. Massive waterlogging and surface runoff. Crop dies
    from oxygen stress.

    '
  diagnosis: 'Precipitation was provided in m d⁻¹ instead of mm d⁻¹. ERA5 natively reports total precipitation
    in metres.

    '
  remedy: 'Convert m to mm: multiply by 1000. Use --precip-unit m flag in the converter tool.

    '
  severity: silent
- id: dt_05
  symptom: 'Negative volumetric soil moisture. Model may crash or produce physically impossible soil water
    content values.

    '
  diagnosis: 'Soil layer thickness was provided in cm instead of m. A layer specified as "30" (meaning
    30 cm) is interpreted as 30 m, causing the water balance to become nonsensical.

    '
  remedy: 'Ensure Thickness is in metres: [0.1, "m"] for 10 cm layers. If source data is in cm, divide
    by 100.

    '
  severity: fatal
- id: dt_06
  symptom: 'Soil water dynamics are wrong. Field capacity and wilting point computed by pedotransfer functions
    are incorrect.

    '
  diagnosis: 'Bulk density (SoilRawDensity) was provided in g cm⁻³ instead of kg m⁻³. A value of 1.4 (g
    cm⁻³) is interpreted as 1.4 kg m⁻³ (essentially zero density), corrupting porosity calculations.

    '
  remedy: 'Convert g cm⁻³ to kg m⁻³: multiply by 1000. Value should be in range [500, 2000] kg m⁻³.

    '
  severity: silent
- id: dt_07
  symptom: 'SOC decomposition rates are extreme. Either too fast (SOC in g/kg interpreted as %) or unmeasurably
    slow (SOC as fraction interpreted as %).

    '
  diagnosis: 'SoilOrganicCarbon was provided in g kg⁻¹ instead of %. A value of 15 g kg⁻¹ = 1.5% is read
    as 15%.

    '
  remedy: 'Convert g kg⁻¹ to %: divide by 10. Typical agricultural SOC: 0.5–4%.

    '
  severity: silent
- id: dt_08
  symptom: 'Sand/clay fractions appear as 40–80 in the JSON (as percentages) but MONICA expects fractions.
    Pedotransfer functions produce wrong field capacity and wilting point.

    '
  diagnosis: 'Sand and Clay were provided as percentages (0–100) where fractions (0–1) are expected, or
    vice versa depending on configuration.

    '
  remedy: 'When using Sand/Clay directly (not KA5TextureClass), provide as fractions [0–1]. Divide percentages
    by 100.

    '
  severity: silent
- id: dt_09
  symptom: 'Nitrogen surplus is 5× higher than expected. Soil NO₃ accumulates to extreme levels. N leaching
    far exceeds observations.

    '
  diagnosis: 'Mineral fertiliser amount was specified in kg product ha⁻¹ instead of kg N ha⁻¹. For example,
    200 kg Ammonium Nitrate ha⁻¹ contains only ~68 kg N ha⁻¹ (34% N).

    '
  remedy: 'Specify fertiliser amount as kg N ha⁻¹. The N partitioning (NH4/NO3/Carbamid fractions) is
    defined in the fertiliser parameter file, not the amount field.

    '
  severity: silent
- id: dt_10
  symptom: 'Background N leaching is very high even without fertilisation. Soil mineral N accumulates
    unrealistically between crop seasons.

    '
  diagnosis: 'NDeposition was specified as a daily rate (kg N ha⁻¹ d⁻¹) instead of annual (kg N ha⁻¹ yr⁻¹).
    A value of 30 kg N ha⁻¹ d⁻¹ would deposit 10,950 kg N ha⁻¹ yr⁻¹.

    '
  remedy: 'NDeposition must be annual: [30, "kg N ha-1 y-1"]. Typical range: 5–50 kg N ha⁻¹ yr⁻¹.

    '
  severity: silent
- id: dt_11
  symptom: 'MONICA starts but produces zero output. No crop growth, no soil processes. Output file contains
    only headers.

    '
  diagnosis: 'The MONICA_PARAMETERS environment variable is not set or points to a wrong directory. All
    "include-from-file" references fail silently, resulting in default (zero) parameters.

    '
  remedy: 'Set MONICA_PARAMETERS to the monica-parameters repository root: export MONICA_PARAMETERS=/path/to/monica-parameters
    Verify: ls $MONICA_PARAMETERS/crops/ should list crop JSON files.

    '
  severity: silent
- id: dt_12
  symptom: 'JSON parse error on startup. MONICA refuses to run with a cryptic error message about unexpected
    token.

    '
  diagnosis: 'The JSON configuration file has a syntax error. Most commonly: a trailing comma after the
    last element in an array or object. JSON does not allow trailing commas (unlike JavaScript).

    '
  remedy: 'Validate JSON with a linter (python -m json.tool sim.json). Remove trailing commas. Check for
    missing brackets.

    '
  severity: fatal
- id: dt_13
  symptom: 'Segmentation fault immediately on startup. No output produced.

    '
  diagnosis: 'The mas_cpp_misc symlink is missing or broken. MONICA''s shared libraries (date, helpers,
    climate-file-io) cannot be found, leading to uninitialised function pointers.

    '
  remedy: 'Create the symlink: ln -sf ../mas-infrastructure/src mas_cpp_misc Rebuild: cd _cmake_release
    && cmake .. && make -j$(nproc)

    '
  severity: fatal
- id: dt_14
  symptom: '"No climate data available" error. Simulation period is empty despite climate.csv having data.

    '
  diagnosis: 'Date format mismatch between climate.csv and sim.json configuration. Climate.csv uses DE-date
    (DD.MM.YYYY) but sim.json maps it as iso-date (YYYY-MM-DD), or vice versa.

    '
  remedy: 'Match the header-to-acd-names mapping in sim.json to the actual column names in climate.csv.
    Use "DE-date": "de-date" for German dates or "iso-date": "iso-date" for ISO dates.

    '
  severity: fatal
- id: dt_15
  symptom: 'Crop never reaches harvest. AutomaticHarvest never triggers. Simulation runs to end date without
    producing yield.

    '
  diagnosis: 'The latest-date for AutomaticHarvest is set too early (before the crop reaches maturity),
    OR the crop cultivar''s StageTemperatureSum is too large for the available growing degree days at
    this location.

    '
  remedy: 'Extend the latest-date to well past expected maturity. Check that the cultivar is appropriate
    for the climate zone. Compare TempSum accumulation in daily output against StageTemperatureSum requirements.

    '
  severity: degraded
- id: dt_16
  symptom: 'Winter crop planted in spring shows extremely late development and low yield. Spring crop
    planted in autumn dies.

    '
  diagnosis: 'The is-winter-crop flag does not match the actual sowing season. Winter crops require vernalisation
    (cold period); sowing them in spring means they never satisfy vernalisation requirements.

    '
  remedy: 'Set is-winter-crop correctly. Match sowing date to crop type: winter crops in Sep–Nov, spring
    crops in Mar–May.

    '
  severity: degraded
- id: dt_17
  symptom: 'Water balance does not close. Annual ET + recharge + runoff differs significantly from precipitation
    + irrigation.

    '
  diagnosis: 'Likely a soil parameter error (wrong bulk density or field capacity) causing incorrect storage
    change calculations, or the soil column depth is insufficient (< 2m) leading to truncated percolation.

    '
  remedy: 'Check soil parameters, especially bulk density units (kg m⁻³). Ensure soil column extends to
    2 m (20 layers × 0.1 m). Compare simulated vs measured soil moisture profiles.

    '
  severity: degraded
- id: dt_18
  symptom: "MONICA crashes immediately with: \"terminate called after throwing an instance of 'std::out_of_range'\n\
    \ what():  vector::_M_range_check: __n (which is 0) >= this->size() (which is 0)\"\nBinary exits with\
    \ returncode -6 (SIGABRT). No output file created.\n"
  diagnosis: convert_soil_to_monica.py places SoilProfileParameters at the JSON root level, but MONICA
    requires it nested inside SiteParameters. The soil layers vector is empty from MONICA's perspective,
    causing an out-of-bounds access on the first simulation step. This is a bug in the KI tool's JSON
    output stru
  remedy: "After running convert_soil_to_monica.py, move SoilProfileParameters inside SiteParameters using:\n\
    \  python3 -c \"\n  import json\n  with open('site.json') as f: d = json.load(f)\n  template = <load\
    \ original working site.json>\n  template['SiteParameters']['SoilProfileParameters'] = d['SoilProfileParameter"
