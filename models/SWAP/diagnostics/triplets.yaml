# ============================================================================
# SWAP Diagnostic Triplets
# ============================================================================
# 17 diagnostic triplets covering 6 failure domains.
# Generated during SWAP v4.2.0 knowledge dissection for HydroCraft platform.
# ============================================================================

# --- Unit Conversion (HIGHEST PRIORITY — Silent Errors) ---

- id: dt_001
  stage: s1_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Extreme evapotranspiration, soil dries to wilting point immediately. ET values 100+ mm/d."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Radiation input in W/m² instead of kJ/m²/d — radiation approximately 200× too low or too high depending on direction"
    explanation: >
      SWAP expects solar radiation in kJ/m²/d in the .met file. CMFD and MSWX provide
      radiation in W/m² (instantaneous). The correct conversion is W/m² × 86400/1000 = kJ/m²/d.
      If W/m² values (0-400) are passed directly, SWAP interprets them as kJ/m²/d, which is
      far too low (typical range is 2000-30000 kJ/m²/d). Internally SWAP multiplies by 1000
      to get J/m²/d, giving values only 0-400000 J/m²/d instead of 2-30 MJ/m²/d.
    affected_components: [convert_forcing_to_swap, readmeteo.f90]
  remedy:
    action: "Multiply W/m² by 86.4 (= 86400/1000) to get kJ/m²/d"
    tool_to_run: convert_forcing_to_swap
    manual_steps:
      - "Check max Rad in .met file — should be 5000-35000 kJ/m²/d for mid-latitudes"
      - "If max Rad < 500, values are likely in W/m² — multiply by 86.4"
      - "If max Rad > 100000, values may be in J/m²/d — divide by 1000"
    prevention: "validate_outputs() in convert_forcing_to_swap checks Rad range"
  severity: silent
  cross_references: [dt_002, dt_003]

- id: dt_002
  stage: s1_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Extreme evaporation, no soil moisture left. ET dominated by soil evaporation."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Humidity column contains relative humidity (0-1 or 0-100) instead of vapor pressure (kPa)"
    explanation: >
      SWAP .met Hum column expects actual vapor pressure in kPa (typically 0.3-5 kPa).
      If relative humidity fraction (0-1) is used, SWAP interprets 0.7 as 0.7 kPa,
      far below actual (~1.5 kPa), creating a huge vapor pressure deficit that drives
      extreme evaporation. If RH percentage (0-100) is used, values of 70 are
      interpreted as 70 kPa, which exceeds saturation, producing numerical issues.
    affected_components: [convert_forcing_to_swap, penmon.f90]
  remedy:
    action: "Convert specific humidity to vapor pressure: e = q * P / (0.622 + 0.378*q)"
    tool_to_run: convert_forcing_to_swap
    manual_steps:
      - "Check Hum values in .met file — should be 0.1-7 kPa for most climates"
      - "If all Hum < 1.0 and > 0, likely relative humidity fraction — convert"
      - "If all Hum 30-100, likely RH percentage — convert via Magnus formula"
    prevention: "validate_outputs() checks for Hum < 0.01 or Hum > 10"
  severity: silent
  cross_references: [dt_001]

- id: dt_003
  stage: s1_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Soil always waterlogged, continuous runoff, groundwater at surface."
    error_pattern: "overflow"
    detection_method: value_comparison
  diagnosis:
    root_cause: "MSWX 3-hourly rainfall passed as daily without aggregation — 8× too much rain per record"
    explanation: >
      MSWX provides precipitation in mm/3hr. There are 8 records per day.
      SWAP expects mm/day in the .met Rain column. If each 3-hourly value
      is written as a daily record, the model receives 8 separate days of
      rainfall for each actual day, causing 8× too much precipitation.
    affected_components: [convert_forcing_to_swap]
  remedy:
    action: "Sum all 8 three-hourly MSWX precipitation values to get daily total"
    tool_to_run: convert_forcing_to_swap
    manual_steps:
      - "Check mean annual rainfall — should match climate normals for the site"
      - "If annual total is 8× expected, MSWX records not aggregated"
    prevention: "convert_forcing_to_swap sums sub-daily records before writing"
  severity: silent
  cross_references: [dt_001, dt_002]

- id: dt_004
  stage: s1_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Temperature sum for crop development never reached. Crops never emerge or mature."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Temperature in Kelvin instead of Celsius — values ~293 instead of ~20"
    explanation: >
      SWAP expects temperature in °C. CMFD/MSWX provide temperature in K.
      If not converted, Tmin/Tmax of ~280-300 K cause crop temperature sums to
      accumulate at extreme rates (or SWAP crashes). The Penman-Monteith calculation
      also uses temperature, producing wildly wrong ET.
    affected_components: [convert_forcing_to_swap, readmeteo.f90]
  remedy:
    action: "Subtract 273.15 from temperature values"
    tool_to_run: convert_forcing_to_swap
    manual_steps:
      - "Check Tmin/Tmax in .met file — should be -50..50°C"
      - "If values are 230-320, they are in Kelvin — subtract 273.15"
    prevention: "validate_outputs() checks temperature range"
  severity: fatal
  cross_references: []

# --- Parameter Format Errors ---

- id: dt_005
  stage: s2_soil_parameters
  failure_domain: parameter_format
  symptom:
    description: "All water drains instantly, no retention. Soil moisture drops to residual immediately."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Ksat in m/s instead of cm/d — value thousands of times too high"
    explanation: >
      SWAP KSATFIT and KSATEXM expect saturated hydraulic conductivity in cm/day.
      If values from databases in m/s (e.g., 1e-5 m/s) are entered without conversion,
      they are interpreted as 1e-5 cm/d, which is far too low. Conversely, if m/d is
      used directly (e.g., 1.0 m/d), it is interpreted as 1.0 cm/d — 100× too low.
    affected_components: [convert_soil_to_swap, readswap.f90]
  remedy:
    action: "Convert to cm/d: m/s × 8640000, m/d × 100, cm/hr × 24"
    tool_to_run: convert_soil_to_swap
    manual_steps:
      - "Check KSATFIT values — sand: 100-1000 cm/d, clay: 0.1-10 cm/d"
      - "If all KSATFIT < 0.001, values likely in m/s — multiply by 8.64e6"
    prevention: "validate_outputs() checks Ksat against texture-typical ranges"
  severity: silent
  cross_references: [dt_006]

- id: dt_006
  stage: s2_soil_parameters
  failure_domain: parameter_format
  symptom:
    description: "SWAP crashes or produces NaN. Error in soil hydraulic calculations."
    error_pattern: "NaN"
    detection_method: error_log
  diagnosis:
    root_cause: "ORES >= OSAT — residual water content exceeds or equals saturated content"
    explanation: >
      The van Genuchten water retention function requires ORES < OSAT strictly.
      If parameters are entered in wrong order or from different sources with
      inconsistent values, ORES >= OSAT causes division by zero in the
      retention curve calculation.
    affected_components: [convert_soil_to_swap, WC_K_models_04_11.f90]
  remedy:
    action: "Verify ORES < OSAT for every soil layer; typical: ORES=0.01-0.10, OSAT=0.35-0.55"
    tool_to_run: convert_soil_to_swap
    manual_steps:
      - "Check MvG parameter table in .swp file"
      - "Ensure column order matches: ORES OSAT ALFA NPAR KSATFIT LEXP ALFAW H_ENPR KSATEXM BDENS"
    prevention: "convert_soil_to_swap validates ORES < OSAT before writing"
  severity: fatal
  cross_references: [dt_005]

- id: dt_007
  stage: s2_soil_parameters
  failure_domain: parameter_format
  symptom:
    description: "Bulk density out of range warning or physically impossible soil properties."
    error_pattern: "BDENS"
    detection_method: error_log
  diagnosis:
    root_cause: "Bulk density in g/cm³ instead of mg/cm³ (= kg/m³)"
    explanation: >
      SWAP BDENS range is 100-10000 mg/cm³ (equivalent to kg/m³). Common soil
      bulk density is 1200-1600 kg/m³. If entered as g/cm³ (1.2-1.6), SWAP
      clips to minimum 100, producing wrong heat capacity calculations.
    affected_components: [convert_soil_to_swap]
  remedy:
    action: "If values in g/cm³, multiply by 1000 to get mg/cm³"
    tool_to_run: convert_soil_to_swap
    manual_steps:
      - "Check BDENS values — should be 1000-1800 for most soils"
      - "If BDENS < 10, values are in g/cm³ — multiply by 1000"
    prevention: "validate_outputs() checks BDENS range"
  severity: silent
  cross_references: []

# --- Path / File Errors ---

- id: dt_008
  stage: s4_execution
  failure_domain: path_resolution
  symptom:
    description: "SWAP crashes with file-not-found error on Linux. Works on Windows."
    error_pattern: "forrtl: severe (29): file not found"
    detection_method: error_log
  diagnosis:
    root_cause: "Uppercase characters in filenames or paths — Linux is case-sensitive"
    explanation: >
      SWAP on Windows is case-insensitive, so '283.MET' matches '283.met'.
      On Linux, filenames must match exactly. The .swp file may reference
      'METFIL' with different casing than the actual file on disk.
    affected_components: [run_swap, readswap.f90]
  remedy:
    action: "Rename all files and references to lowercase"
    tool_to_run: run_swap
    manual_steps:
      - "Run: ls -la *.* | grep -E '[A-Z]' to find uppercase files"
      - "Rename: for f in *; do mv \"$f\" \"$(echo $f | tr 'A-Z' 'a-z')\"; done"
      - "Update all filename references in .swp to lowercase"
    prevention: "run_swap preflight checks for case mismatches"
  severity: fatal
  cross_references: []

- id: dt_009
  stage: s4_execution
  failure_domain: path_resolution
  symptom:
    description: "SWAP cannot find swap.swp file. Immediate crash on startup."
    error_pattern: "cannot open swap.swp"
    detection_method: error_log
  diagnosis:
    root_cause: "SWAP not run from the correct working directory"
    explanation: >
      SWAP always reads 'swap.swp' from the current working directory (CWD).
      It does not accept command-line arguments for the config file path.
      If run from the wrong directory, it cannot find the input file.
    affected_components: [run_swap]
  remedy:
    action: "cd to the directory containing swap.swp before running the binary"
    tool_to_run: run_swap
    manual_steps:
      - "cd /path/to/case/directory/"
      - "ls swap.swp  # verify file exists"
      - "/path/to/swap  # run from case directory"
    prevention: "run_swap wrapper handles cd automatically"
  severity: fatal
  cross_references: [dt_008]

# --- Runtime Errors ---

- id: dt_010
  stage: s4_execution
  failure_domain: runtime
  symptom:
    description: "SWAP takes extremely long or appears to hang. Timestep becomes tiny."
    error_pattern: ""
    detection_method: timeout
  diagnosis:
    root_cause: "Convergence failure in Richards' equation solver — DTMAX too large for soil type"
    explanation: >
      For clay soils with steep retention curves (low NPAR), the Richards'
      equation solver requires small timesteps. If DTMAX is too large (e.g., 0.1d),
      the solver backtracks repeatedly, reducing dt to DTMIN and iterating slowly.
    affected_components: [soilwater.f90, headcalc.f90]
  remedy:
    action: "Reduce DTMAX to 0.01 or 0.005 for clay soils"
    tool_to_run: null
    manual_steps:
      - "In .swp: set DTMAX = 0.01"
      - "Increase MAXIT to 50 if needed"
      - "For extreme cases: DTMAX = 0.001"
    prevention: "Set DTMAX based on soil texture: sand=0.04, loam=0.02, clay=0.01"
  severity: degraded
  cross_references: [dt_011]

- id: dt_011
  stage: s4_execution
  failure_domain: runtime
  symptom:
    description: "Oscillating groundwater level, water table jumps between high and low values."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "GWLCONV convergence criterion too loose"
    explanation: >
      GWLCONV specifies the maximum allowed GWL change between timesteps (cm).
      Default 100 cm is very loose. For cases with shallow water tables or
      drainage, this allows the water table to jump unrealistically between steps.
    affected_components: [calcgwl.f90, soilwater.f90]
  remedy:
    action: "Reduce GWLCONV to 1-10 cm"
    tool_to_run: null
    manual_steps:
      - "In .swp: set GWLCONV = 10.0 (or 1.0 for high precision)"
      - "May need to also reduce DTMAX"
    prevention: "Use GWLCONV = 10.0 as standard for all new cases"
  severity: degraded
  cross_references: [dt_010]

- id: dt_012
  stage: s4_execution
  failure_domain: runtime
  symptom:
    description: "Fortran read error: 'list-directed I/O syntax error' during input parsing."
    error_pattern: "forrtl: severe (59)"
    detection_method: error_log
  diagnosis:
    root_cause: "Wrong format in .met or .swp file — mismatched columns or delimiters"
    explanation: >
      SWAP uses Fortran list-directed read (READ *,) for .met files. This expects
      comma-separated or space-separated values with consistent column count.
      Extra columns, missing values, or tab characters can cause parse failures.
    affected_components: [readmeteo.f90, readswap.f90]
  remedy:
    action: "Verify .met file format: comma-delimited, consistent column count per row"
    tool_to_run: null
    manual_steps:
      - "Check .met file: head -15 file.met"
      - "Verify 12 columns per data row"
      - "Remove any tab characters: sed -i 's/\\t/,/g' file.met"
      - "Ensure no blank lines between data rows"
    prevention: "convert_forcing_to_swap writes consistent CSV format"
  severity: fatal
  cross_references: []

# --- Dependency / Configuration Mismatch ---

- id: dt_013
  stage: s0_configuration
  failure_domain: dependency_mismatch
  symptom:
    description: "Crop growth produces zero biomass. DVS never advances."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "CROPSTART date is after the actual growing season, or TSTART is after CROPSTART"
    explanation: >
      If CROPSTART is set to May 1 but the simulation starts June 1, the first
      crop emergence is missed. With CROPTYPE=2 (WOFOST), DVS advancement depends
      on thermal time accumulation starting from CROPSTART. Missing early-season
      warmth means the crop never matures.
    affected_components: [cropgrowth.f90, readswap.f90]
  remedy:
    action: "Ensure TSTART <= CROPSTART and CROPSTART matches local growing season"
    tool_to_run: null
    manual_steps:
      - "Check crop table in .swp: CROPSTART CROPEND CROPFIL CROPTYPE"
      - "Verify simulation period covers entire crop cycle"
    prevention: "Configuration validation checks date consistency"
  severity: silent
  cross_references: [dt_014]

- id: dt_014
  stage: s0_configuration
  failure_domain: dependency_mismatch
  symptom:
    description: "Overlapping crop errors or unexpected bare soil periods."
    error_pattern: "crop rotation"
    detection_method: error_log
  diagnosis:
    root_cause: "Crop rotation dates overlap or have gaps not intended"
    explanation: >
      SWAP processes crops sequentially. If CROPEND of crop N overlaps CROPSTART
      of crop N+1, behavior is undefined. Between crops (gap periods), soil is
      treated as bare — this may be intentional (fallow) or a configuration error.
    affected_components: [readswap.f90, cropgrowth.f90]
  remedy:
    action: "Ensure no overlap and intentional gaps between crops"
    tool_to_run: null
    manual_steps:
      - "Sort crop table by CROPSTART"
      - "Verify CROPEND(N) < CROPSTART(N+1) for all N"
    prevention: "Configuration validation checks crop date ordering"
  severity: degraded
  cross_references: [dt_013]

# --- Silent Errors (model runs, wrong results) ---

- id: dt_015
  stage: s2_soil_parameters
  failure_domain: silent_error
  symptom:
    description: "Profile discretization mismatch — NCOMP × HCOMP ≠ HSUBLAY."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Inconsistent profile discretization table"
    explanation: >
      SWAP requires NCOMP × HCOMP = HSUBLAY for each sub-layer. If this
      constraint is violated, the total profile depth will be wrong, and
      compartment boundaries won't align with layer boundaries. SWAP may
      not check this rigorously and produce subtly wrong results.
    affected_components: [calcgrid.f90, readswap.f90]
  remedy:
    action: "Recalculate NCOMP = HSUBLAY / HCOMP for each sub-layer"
    tool_to_run: null
    manual_steps:
      - "For each row: verify NCOMP × HCOMP = HSUBLAY"
      - "Verify total depth = sum of all HSUBLAY values"
    prevention: "Configuration validation checks arithmetic consistency"
  severity: silent
  cross_references: []

- id: dt_016
  stage: s1_met_forcing
  failure_domain: silent_error
  symptom:
    description: "Wind-adjusted ET is wrong. Penman-Monteith produces unrealistic aerodynamic term."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "ALTW (wind measurement height) set incorrectly — default is 10m but data may be at 2m"
    explanation: >
      The Penman-Monteith equation adjusts wind speed from measurement height
      (ALTW) to standard heights using log-profile equations. If ALTW=10m but
      wind data is actually measured at 2m, the model under-adjusts the wind
      speed, producing lower aerodynamic resistance and different ET.
    affected_components: [penmon.f90]
  remedy:
    action: "Set ALTW to actual wind measurement height of the forcing dataset"
    tool_to_run: null
    manual_steps:
      - "CMFD: ALTW = 10.0 (10m reference height)"
      - "MSWX: ALTW = 10.0 (10m reference height)"
      - "Local station: check metadata for anemometer height"
    prevention: "Document ALTW for each forcing source in configuration"
  severity: silent
  cross_references: [dt_001, dt_002]

- id: dt_017
  stage: s2_soil_parameters
  failure_domain: silent_error
  symptom:
    description: "Solute concentration vastly different from expected. Mass balance appears correct but values wrong."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Solute concentration in mg/L instead of mg/cm³ — 1000× difference"
    explanation: >
      SWAP expects solute concentrations in mg/cm³ (= mg/mL = g/L).
      Literature and field data typically report mg/L (= mg/dm³ = μg/cm³).
      1 mg/L = 0.001 mg/cm³. Entering mg/L values directly gives 1000×
      too high concentrations.
    affected_components: [solute.f90, readswap.f90]
  remedy:
    action: "Divide mg/L values by 1000 to get mg/cm³"
    tool_to_run: null
    manual_steps:
      - "Check CPRE, CDRAIN, CIRRS values in .swp"
      - "If values > 1.0, likely in mg/L — divide by 1000"
      - "Typical CPRE for rainfall: 0.001-0.01 mg/cm³"
    prevention: "Configuration validation checks concentration ranges"
  severity: silent
  cross_references: []

# --- Added 2026-08-11 from the US-Ne1 real-case run (all VERIFIED on disk) ---

- id: dt_018
  stage: s4_execution
  failure_domain: tooling
  symptom:
    description: "run_swap.py reports '[FAIL] SWAP exited with code 100' even though stdout says 'Swap normal completion!', swap.ok is written and result.blc/.inc/.vap are complete."
    error_pattern: "SWAP exited with code 100"
    detection_method: exit_code
  diagnosis:
    root_cause: "SWAP 4.2.0's main program ends with `Call Exit(100)` — exit code 100 IS normal completion, not an error."
    explanation: >
      src/swap_main.f90 (line ~72) ends with `Call Exit(100)` after writing
      'Swap normal completion!'. Any wrapper that tests `returncode != 0`
      declares every successful run a failure and skips output validation.
      Verified 2026-08-11 on tests/cases/1.hupselbrook.
    affected_components: [swap_main.f90, tools/run_swap.py]
  remedy:
    action: "Treat rc==100 + ('normal completion' on stdout OR a *.ok file) as success."
    tool_to_run: "tools/run_swap.py (swap_run_succeeded(); fixed 2026-08-11)"
    manual_steps:
      - "Never gate SWAP success on rc==0; check swap.ok / <project>.ok instead"
    prevention: "run_swap.swap_run_succeeded() encodes this"
  severity: fatal
  cross_references: []

- id: dt_019
  stage: s5_output_parsing
  failure_domain: file_format
  symptom:
    description: "Parsed .inc CSV is numerically garbage (fields shifted one column, values carrying trailing commas); parse_vap raises UnicodeDecodeError 0xba; water_balance.csv is never written."
    error_pattern: "UnicodeDecodeError: 'utf-8' codec can't decode byte 0xba"
    detection_method: value_comparison
  diagnosis:
    root_cause: "SWAP .inc/.vap are COMMA-separated (blank-padded) and written in latin-1; the .blc labels are 'Gross Rainfall'/'Plant Transpiration' in a two-column INPUT|OUTPUT table, not 'Rain + snow :' key-value lines."
    explanation: >
      Splitting .inc/.vap data rows on whitespace shifts every field by one.
      The .vap units header contains 'ºC' (0xBA) so a UTF-8 open crashes.
      parse_blc's pre-2026-08-11 patterns ("Water balance components",
      "Rain + snow :") appear nowhere in SWAP 4.2.0 output, so it silently
      returned [] for every run.
    affected_components: [tools/parse_swap_output.py, swapoutput.f90]
  remedy:
    action: "Split .inc/.vap on ',', open SWAP output with encoding='latin-1', parse .blc as the two-column table."
    tool_to_run: "tools/parse_swap_output.py (fixed 2026-08-11)"
    manual_steps:
      - "Sanity check: water_balance.csv must have one row per balance period"
      - "Check balance_deviation_cm ~ 0 for every period"
    prevention: "parse_swap_output writes water_balance.csv + soil_profiles.csv"
  severity: silent
  cross_references: [dt_017]

- id: dt_020
  stage: s1_met_forcing
  failure_domain: silent_error
  symptom:
    description: ".met file written from CMFD is all-NaN, or the MSWX run prints 'MSWX reader not yet implemented, falling back to synthetic' and the .met contains FABRICATED weather — output validation passes either way."
    error_pattern: "falling back to synthetic"
    detection_method: value_comparison
  diagnosis:
    root_cause: "convert_forcing_to_swap.py had a hand-rolled NetCDF reader that never assigned what it read into its result dict, and an MSWX path that silently substituted generate_synthetic_met()."
    explanation: >
      All-NaN columns pass every np.nanmax() range check, so the run proceeds
      on empty forcing. SKILL.md already mandates ki_tools_common.load_forcing;
      the tool now calls it for cmfd / mswx / nasa_power / gswp3 and FAILS on
      any NaN column. 'synthetic' is an explicit, loudly-warned choice.
    affected_components: [tools/convert_forcing_to_swap.py]
  remedy:
    action: "Use --source nasa_power|mswx|cmfd|gswp3; never accept a synthetic fallback in a scored run."
    tool_to_run: "tools/convert_forcing_to_swap.py (fixed 2026-08-11)"
    manual_steps:
      - "Check July Rad ~ 20000-30000 kJ/m2/d and Hum ~ 1-3 kPa in the .met"
    prevention: "validate_outputs() now errors on any NaN in rad/tmin/tmax/hum/wind/rain"
  severity: fatal
  cross_references: [dt_001, dt_002, dt_004]

- id: dt_021
  stage: s2_soil_parameters
  failure_domain: silent_error
  symptom:
    description: "convert_soil_to_swap.py prints 'WARNING: No texture data, defaulting to loam' for EVERY site even when --hwsd points at a valid hwsd.bil."
    error_pattern: "No texture data, defaulting to"
    detection_method: value_comparison
  diagnosis:
    root_cause: "read_hwsd_at_point() read MU_GLOBAL and then `return None` — the HWSD attribute join was never implemented, so --hwsd had no effect on the MvG parameters."
    explanation: >
      ki_tools_common.soil_utils.lookup_hwsd() already joins hwsd.bil to
      HWSD_DATA and returns topsoil AND subsoil sand/silt/clay plus bulk
      density. At US-Ne1 (41.1651, -96.4766) it resolves MU 4730 =
      loam over clay_loam, BD 1.37 g/cm3 — the old default gave loam/loam
      and Ksat 17.5 instead of 4.4 cm/d for the subsoil.
    affected_components: [tools/convert_soil_to_swap.py]
  remedy:
    action: "Delegate to ki_tools_common.soil_utils.lookup_hwsd; pass BDENS in mg/cm3 (g/cm3 x 1000)."
    tool_to_run: "tools/convert_soil_to_swap.py (fixed 2026-08-11)"
    manual_steps:
      - "Confirm the [INFO] HWSD topsoil/subsoil lines appear in the log"
    prevention: "A 'defaulting to loam' warning now means HWSD genuinely had no data"
  severity: silent
  cross_references: [dt_011]

- id: dt_022
  stage: s3_config_assembly
  failure_domain: file_format
  symptom:
    description: "SWAP aborts in rdinit_/rddata_ with 'Inconsistent variable type' pointing at the first row of the crop rotation (or any other) table."
    error_pattern: "Inconsistent variable type"
    detection_method: model_error
  diagnosis:
    root_cause: "The table's COLUMN-NAME line was deleted (or reordered) when the table body was replaced — SWAP's ttutil rddata reads tables by their header names."
    explanation: >
      A `^\s*CROPSTART...` regex matches the newline ENDING the previous line,
      so a line-index computed from it points one line too early and eats the
      header. Use `^[ \t]*` when locating a table header.
    affected_components: [tools/assemble_swap_config.py, rddata.for]
  remedy:
    action: "Keep the header line; only replace rows between it and '* End of table'."
    tool_to_run: "tools/assemble_swap_config.py (added 2026-08-11)"
    manual_steps:
      - "Compare the assembled .swp table block against the base file"
    prevention: "assemble_swap_config.check_config() re-validates crop dates, MvG ranges and file-name case"
  severity: fatal
  cross_references: [dt_006, dt_013]

- id: dt_023
  stage: s3_config_assembly
  failure_domain: parameterization
  symptom:
    description: "Irrigated site: SWAP applies 500-850 mm/yr of scheduled irrigation and simulated ET is ~50% above eddy-covariance ET."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "SCHEDULE=1 with the shipped Hupselbrook maizes.crp defaults (TCS=1, TREL=0.95) irrigates whenever Tact/Tpot drops below 0.95 — near-zero water stress all season."
    explanation: >
      Verified 2026-08-11 at FLUXNET US-Ne1 (irrigated maize, Mead NE):
      uncalibrated daily ET vs LE_F_MDS gave r=0.76, PBIAS +48%; against the
      energy-balance-corrected LE_CORR, PBIAS +17.6%, KGE 0.36 — i.e. ~30 of
      the 48 points are the FLUXNET closure gap, the rest is over-irrigation.
      Real US-Ne1 pivot application is ~200-300 mm/yr.
    affected_components: [maizes.crp, irrigation.f90]
  remedy:
    action: "For a real irrigated field prefer prescribed events (SWIRFIX=1) from the site record; if scheduling, relax TREL (~0.7-0.8) or use TCS=2/TCS=4 with a site depletion threshold."
    tool_to_run: "tools/assemble_swap_config.py --irrigation DATE,DEPTH,CONC,TYPE"
    manual_steps:
      - "Compare annual irrigation_cm in parsed/water_balance.csv against the site record"
    prevention: "Report annual irrigation totals alongside ET"
  severity: calibration
  cross_references: [dt_008]
