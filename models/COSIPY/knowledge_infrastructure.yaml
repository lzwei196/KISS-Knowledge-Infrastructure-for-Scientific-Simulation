# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: COSIPY
  language: python
  implementation:
    id: cosipy-202
    version: v2.0.2
    provenance: Python (numba-accelerated); cryotools/COSIPY, GPL-3.0; per-grid-cell 1D column with netCDF
      I/O and Dask parallelism.
  scientific_reference_version: COSIPY v1.3 (Sauter, Arndt & Schneider 2020, GMD) science spec, as realized
    by the v2.0.2 codebase
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/COSIPY/venv/bin/python
    type: work_dir
pipeline:
  stages:
  - s0_configuration
  - s1_static_file
  - s2_forcing_conversion
  - s3_parameter_config
  - s4_execution
  - s5_output_analysis
  - s6_validation
tools:
  count: 5
  files:
  - tools/_netcdf_shim/sitecustomize.py
  - tools/convert_forcing.py
  - tools/convert_static.py
  - tools/parse_output.py
  - tools/run_cosipy.py
inputs:
  forcing:
  - name: T2
    unit: K
  - name: RH2
    unit: '% (0-100)'
  - name: U2
    unit: m s^-1
  - name: G
    unit: W m^-2
  - name: PRES
    unit: hPa
  - name: RRR
    unit: mm per timestep
  - name: N
    unit: fraction (0-1)
  - name: LWin
    unit: W m^-2
  - name: SNOWFALL
    unit: m snow height per timestep
  parameters:
  - name: albedo_fresh_snow / albedo_firn / albedo_ice
    unit: '-'
  - name: albedo decay timescales
    unit: days
  - name: roughness lengths (fresh snow / firn / ice)
    unit: m (mm in config)
  - name: snow/rain transfer temperature threshold and spread
    unit: K
  - name: densification coefficients (Boone / Vionnet / empirical)
    unit: various
  - name: fresh-snow density coefficients
    unit: kg m^-3
  - name: Bintanja shortwave extinction coefficients (snow 17.1, ice 2.5)
    unit: m^-1
  - name: thermal conductivity / heat-equation stability factor
    unit: various
  - name: turbulent Prandtl number
    unit: '-'
  - name: remesh density/temperature thresholds
    unit: kg m^-3 / K
  - name: measurement height z
    unit: m
  initial_conditions:
  - name: initial_snowheight_constant
    unit: m
  - name: initial_glacier_height
    unit: m
  - name: initial_top_density_snowpack / initial_bottom_density_snowpack
    unit: kg m^-3
  - name: temperature_bottom
    unit: K
  - name: initial_surface_temperature
    unit: K
  - name: restart column state
    unit: various
  boundary_conditions:
  - name: MASK (glacier mask)
    unit: boolean (0/1)
  - name: HGT (elevation/DEM)
    unit: m
  - name: SLOPE / ASPECT
    unit: degrees
  - name: albedo_method
    unit: switch
  - name: stability_correction
    unit: switch
  - name: densification_method
    unit: switch
  - name: sfc_temperature_method
    unit: switch
  - name: remesh_method
    unit: switch
  - name: dt (time step)
    unit: s
  - name: WRF dimension flag
    unit: switch
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - MB
  - surfMB
  - SNOWHEIGHT
  - TS
  - ALBEDO
  - Q
  - H
  - LE
  - layer profiles (T, RHO, theta_i, theta_w, porosity)
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.898, KGE=0.829, R=0.952, 2 scorecard(s)'
  metrics:
    best_nse: 0.8981
    best_kge: 0.829
    best_r: 0.952
summary:
  total_tools: 5
  total_stage_docs: 7
  total_diagnostic_triplets: 23
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
