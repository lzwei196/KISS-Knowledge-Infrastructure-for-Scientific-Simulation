  remedy: 'Change to the simulation workspace directory before running mf6.; write_and_run_simulation;
    [''cd workspace && mf6'', ''Or use FloPy: sim.run_simulation()'', "Or specify: sim.run_simulation(exe_name=''/path/to/mf6'')",
