# =============================================================================
# CRHM calibration contract — TARGET CASE
#
#   case_id      OBS:hydat
#   site         Dore River near McBride, Cariboo Mountains, BC, Canada —
#                53.309 N, -120.249 W. Deck basin_area 406.52 km2 (Copernicus
#                GLO-30 delineation) vs the published HYDAT gross drainage
#                area 409 km2 (-0.6%); 3 equal-area elevation HRUs
#                (Alpine 2294 / Forest 1912 / Valley 1430 m).
#   gauge / obs  HYDAT 08KA001 (Canada National Water Data Archive), daily
#                discharge in m3/s, staged read-only at
#                KISSPATH_OUTPUTS/crhm_08ka001_dore/obs_08KA001.csv
#                (complete 2005-01-01..2015-12-31, 4017 days, no gaps).
#   quantity     discharge — dag var `basinflow_s`, obs_shape
#                point_time_series, determining_metric NSE
#   provenance   real_case CRHM_20260629T124938Z (model-dir run_and_score.py):
#                9-member (obs_elev x ClimChng_precip) grid over the validated
#                Canoe-08NC004-derived 13-module mountain deck; best member
#                obs_elev=2100 / ClimChng_precip=1.45 scores FULL 2006-2015
#                NSE 0.7086 (cal 2006-2010 NSE 0.7000, val 2011-2015 NSE
#                0.7116, PBIAS -6.48%, KGE 0.8039, r 0.8452, n=3652).
#
# THIS IS NOT the Yingluoxia streamflow case, NOT the Hulunbuir SWE case and
# NOT any of SKILL.md's other showcased HYDAT basins. The target case is fixed
# by case_id OBS:hydat + provenance CRHM_20260629T124938Z + prior metric
# nse 0.7086, all of which resolve to the Dore River 08KA001 run whose deck,
# forcing and obs are staged under outputs/crhm_08ka001_dore/.
#
# -----------------------------------------------------------------------------
# COMMISSIONED 2026-08-14 (live, this KI, the real CRHM binary at
# KISSPATH_BINARIES/crhmcode/crhmcode/build/crhm):
#
#  * SCORING REPRODUCES THE VALIDATED RUN. The default vector below IS the
#    validated best grid member; tools/calib_run.py at the default vector
#    returns FULL 2006-2015 NSE 0.7086264879690831 / KGE 0.8039 / PBIAS -6.48%
#    on n=3652 paired days (cal NSE 0.69996, val NSE 0.71157) — identical to
#    re-scoring the staged out_oe2100_p145.txt, and the injected deck's CRHM
#    run is bit-identical to the staged validated output.
#
#  * INJECTION IS LIVE. A clearly-perturbed vector (all 26 parameters moved)
#    takes the FULL NSE from 0.70863 to 0.14531 with applied == requested on
#    every one of the 26 keys. Single-parameter moves at otherwise-default
#    values span NSE 0.1063 (runKstorage 40) / 0.3221 (ClimChng_precip 2.0) /
#    0.3679 (obs_elev 1430) / 0.3965 (Kstorage 4) up to 0.7382 (Lag 12) —
#    the injected values reach the SCORED run, not merely a file.
#
#  * RANGE-BOUND READ-BACK: all 52 bounds (26 params x lo/hi) apply EXACTLY
#    (applied == requested, rel_tol 1e-9) in the generated .prj, each with a
#    FINITE nse/kge/pbias — no bound clamps, so the kit's Morris screen cannot
#    fail closed on a corner eval. The runner additionally validates every
#    written value against the deck's own declared `<lo to hi>` window before
#    writing (CRHM hard-errors rather than clamps; an out-of-window request
#    exits nonzero with no metrics — verified live with gwLag=20000).
#    One corner (soil_rechr_max=340) is reachable only through a
#    constraint-feasible vector (soil_moist_max>=340): with soil_moist_max at
#    its default 250, CRHM ITSELF hard-errors ("rechr_max cannot be greater
#    than soil_moist_max in hru = 1") and the runner fails the eval closed —
#    exactly what the first entry under `constraints` encodes.
#
#  * KDT_CALIB_SPLIT is honoured: "calibration" scores 2006-2010 (n=1826,
#    NSE 0.69996 at default), "holdout" scores 2011-2015 (n=1826, NSE 0.71157),
#    unset scores the FULL 2006-2015 record (n=3652) — the exact window the
#    prior validated metric was computed on.
#
#  * FAIL-CLOSED verified, each exiting nonzero with NO metrics file written
#    (a pre-existing stale --out is deleted first): unknown parameter name;
#    non-finite parameter value; unrecognised KDT_CALIB_SPLIT; a value outside
#    the deck's declared window; a tampered obs series (+0.1 m3/s on one 2012
#    day — caught by the file sha256 AND, with the sha deliberately re-pinned,
#    by the declared holdout mean); an obs file whose name does not carry
#    station id 08KA001; a swapped/edited template deck (sha256 pin, and
#    independently the hru_elev/basin_area/gwwhereto identity assert); and a
#    simulation truncated mid-record (run-health coverage check).
#
#  * SITE-SPECIFIC STRUCTURE FACTS measured during commissioning (each a
#    max|Δ daily basinflow| against the default run):
#      - The GROUNDWATER group is LIVE here, unlike the Yingluoxia case:
#        gw_K x10 -> 5.6 m3/s, gwKstorage/5 -> 0.73, gwLag/20 -> 0.55,
#        small gw_max recipe -> 0.35, soil_gw_K -> 9.4. This deck's
#        `gwwhereto = 3 3 0` cascades HRU1/2 groundwater into HRU3 before the
#        basingw exit, and the gw store's capacity/level feeds back into the
#        scored surface/subsurface chain — do not carry the Yingluoxia
#        "gw inert" note to this site.
#      - ALL pbsm blowing-snow levers are INERT at this site: fetch (0.0),
#        distrib flattened (0.0), inhibit_bs everywhere (0.0) — hourly NASA
#        POWER winds at this forested Cariboo basin never reach transport
#        threshold. pbsm_fetch is retained UNPRUNED for the dag's MEDIUM
#        wind_speed edge (literature is a prior, never a pruning oracle) and
#        the kit's Morris screen will demote it at ~2 s per probe.
#      - Albedo_snow is a MAJOR melt-energy lever (0.85 -> 0.75 moves daily
#        basinflow by up to 33 m3/s); tmax_allsnow (38), runKstorage (36),
#        Lag (22), lower_ssr_K (22) are the other dominant levers.
#      - ebsm delay_melt and Shared Ht are minor/inert and are NOT in the pool.
# =============================================================================
template_version: "calib-0.1"
model_id: CRHM

identity:
  domain: hydrology
  binding: >
    CRHM (Cold Regions Hydrological Model) 4.7_16 CLI, 13-module validated
    cold-region mountain chain: basin > global > obs > calcsun > intcp > pbsm >
    albedo > ebsm > netall > crack > evap > Soil > Netroute, 3 HRUs, hourly,
    2005-01-01..2015-12-31 (2005 spin-up, never scored).
  case_id: "OBS:hydat"
  site: >
    Dore River near McBride, Cariboo Mountains, BC, Canada (53.309 N,
    -120.249 W) — clean nival snowmelt basin, single June freshet ~45 m3/s,
    sustained winter baseflow ~2 m3/s, runoff ~1110 mm/yr; deck basin_area
    406.52 km2 (-0.6% vs published 409 km2), 3 equal-area elevation HRUs
    (Alpine 2294 m / Forest 1912 m / Valley 1430 m, 135.51 km2 each).
  obs_source: hydat
  obs_id: "HYDAT:08KA001 (Dore River near McBride)"
  obs_file: "KISSPATH_OUTPUTS/crhm_08ka001_dore/obs_08KA001.csv"
  obs_unit: "m3/s"
  forcing: >
    NASA POWER hourly 2005-2015 at the basin centroid, staged once as
    outputs/crhm_08ka001_dore/crhm/dore.obs (sha256-pinned by the runner;
    header t/p/rh/u/Qsi/Qli). The validated run corrects NASA POWER's
    orographic precipitation deficit inside CRHM via ClimChng_precip.
  baseline_run: >
    real_case CRHM_20260629T124938Z — FULL 2006-2015 NSE 0.7086, KGE 0.8039,
    r 0.8452, PBIAS -6.48%, n=3652 (cal 2006-2010 NSE 0.7000, val 2011-2015
    NSE 0.7116) at obs_elev 2100, ClimChng_precip 1.45 over the validated
    Canoe-derived large GW store and light Kstorage recipe.

  # --- OBS CONTRACT ---------------------------------------------------------
  # Every field below is READ and ASSERTED by tools/calib_run.py before any
  # score is computed; a mismatch exits nonzero with NO metrics file, so a
  # changed / corrupted / re-issued series for the SAME station can never be
  # scored silently. The record is COMPLETE (no gaps, no missing sentinel, no
  # NaN, no negatives), so the declared populations are exact calendar windows.
  obs_contract:
    columns: [date, discharge_m3s]
    station_id: "08KA001"            # asserted from the filename of the file opened
    station_name: "Dore River near McBride"
    lat: 53.309
    lon: -120.249
    published_drainage_area_km2: 409.0
    deck_domain_area_km2: 406.52     # asserted inside the pinned template deck
    domain_vs_published_tolerance_pct: 5.0
    unit: "m3/s"
    date_format: "%Y-%m-%d"          # asserted: 0 unparseable dates
    file_sha256: "1f5dc60f435bbafee263827bbe1fd64d0efb1b003f24cf9c97f491f92c64733b"
    record:
      first: "2005-01-01"
      last: "2015-12-31"
      n_rows: 4017
      calendar_gaps: 0
      duplicates: 0
      nan: 0
      negative: 0
    splits:
      calibration:
        window: ["2006-01-01", "2010-12-31"]
        n_valid_days: 1826
        first_valid: "2006-01-01"
        last_valid: "2010-12-31"
        min: 1.2899999618530273
        max: 92.30000305175781
        range: 91.01000308990479
        mean: 12.849978105523109
        missing_dates: []
        series_sha256: "a7f823a7fc05c967d30ed85ace3d61697a3290b3d6b6db9414add4dd791dca3b"
      holdout:
        window: ["2011-01-01", "2015-12-31"]
        n_valid_days: 1826
        first_valid: "2011-01-01"
        last_valid: "2015-12-31"
        min: 1.0299999713897705
        max: 132.0
        range: 130.97000002861023
