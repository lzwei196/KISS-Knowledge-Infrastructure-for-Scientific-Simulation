template_version: "3.5"

identity:
  model_id: "HEC-HMS"
  scientific_reference_version: "HEC-HMS public-domain rainfall-runoff method set (USACE HEC; SCS Curve Number loss, SCS dimensionless Unit Hydrograph transform, Muskingum channel routing, Linear Reservoir baseflow)"
  implementation:
    id: "hec-hms-python-equiv"
    version: "HydroCraft Python equivalent of HEC-HMS 4.x lumped methods"
    provenance: "Python; HydroCraft reimplementation of the public-domain SCS-CN / SCS-UH / Muskingum / Linear-Reservoir algorithms, producing equivalent results for lumped/semi-distributed basins."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "Public-Domain"
  repo_url: "https://www.hec.usace.army.mil/software/hec-hms/"

boundary:
  scope_in:
    - "Precipitation-loss / runoff-volume computation (SCS Curve Number)"
    - "Direct-runoff transform of excess rainfall to a hydrograph (SCS dimensionless Unit Hydrograph)"
    - "Conceptual baseflow generation (Linear Reservoir recession store)"
    - "Hydrologic channel routing between elements (Muskingum)"
    - "Lumped subbasin-to-junction-to-reach-to-outlet network accounting of the water balance"
  scope_out:
    - "Within-subbasin spatial variability (each subbasin is a single lumped unit)"
    - "Gridded physically-based land-surface processes (unlike VIC) and HRU partitioning (unlike SWAT)"
    - "Full hydrodynamic / 2-D unsteady channel flow (handled by HEC-RAS)"
    - "Erosion and sediment transport"
    - "Detailed groundwater-aquifer dynamics beyond the conceptual baseflow store"
    - "Native-HEC-HMS methods not realized in this implementation (Green-Ampt / SMA loss, Clark/Snyder/ModClark transform, Muskingum-Cunge/Modified-Puls/Lag routing, Recession/Constant-Monthly baseflow, snowmelt, energy-budget ET, reservoir routing)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Conceptual watershed water balance over a network of connected hydrologic elements (subbasin, reach, junction). Mass is conserved across the precipitation -> loss -> excess-rainfall -> direct-runoff -> routing chain plus the linear-reservoir baseflow store. The runnable subset operates at the daily (or model) timestep on lumped subbasins; the broader native HEC-HMS catalog (snow, energy-budget ET, SMA, additional routing) is out of scope for this implementation. Spinup (~1 year) is required for the baseflow store and retention state to equilibrate from initial conditions."

inputs:
  forcing:
    - category: "forcing"
      name: "precipitation"
      unit: "mm/day (daily); mm/hr at sub-daily step; mm in event mode"
      source_kind: "forcing"
      model_input_format: "per-timestep precipitation time series at the subbasin"
      notes: "At a sub-daily timestep the per-step depth must equal the daily depth divided by steps-per-day; missing days should be flagged (NaN/interpolated), not zero-filled, to avoid artificial dry spells."
    - category: "forcing"
      name: "temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "per-timestep air-temperature time series"
      notes: "Consumed only when snowmelt or temperature-based PET is active. Must be Celsius; Kelvin-valued inputs produce astronomically high PET."
    - category: "forcing"
      name: "potential_evapotranspiration"
      unit: "mm/day (Priestley-Taylor) or mm/month (Monthly Average)"
      source_kind: "forcing"
      model_input_format: "per-timestep (or per-month) PET time series"
      notes: "Units are method-dependent and must match the selected ET method."
    - category: "forcing"
      name: "solar_radiation"
      unit: "MJ/m^2/day"
      source_kind: "forcing"
      model_input_format: "per-timestep radiation time series"
      notes: "Used by Priestley-Taylor PET when active."
  parameters:
    - category: "parameter"
      name: "Curve Number (CN)"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "scalar per subbasin (derived from hydrologic soil group + land cover)"
      notes: "Controls total runoff volume; valid range 30-100. Sets maximum retention S = 25400/CN - 254 (mm)."
    - category: "parameter"
      name: "Hydrologic Soil Group (A/B/C/D)"
      unit: "categorical"
      source_kind: "dataset_lookup"
      model_input_format: "soil class per subbasin"
      notes: "Infiltration class (A = high infiltration, D = low); feeds CN derivation."
    - category: "parameter"
      name: "initial abstraction ratio (lambda_ia)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "scalar (Ia = lambda_ia * S)"
      notes: "Range 0.05-0.20; 0.20 classic SCS, 0.05 per Woodward et al. 2003. Higher values raise the rainfall threshold below which runoff is zero."
    - category: "parameter"
      name: "time of concentration (Tc)"
      unit: "hr"
      source_kind: "calibrated"
      model_input_format: "scalar per subbasin (e.g., from Kirpich)"
      notes: "Drives the unit-hydrograph time-to-peak Tp = 0.6*Tc + D/2."
    - category: "parameter"
      name: "Muskingum K"
      unit: "hr"
      source_kind: "calibrated"
      model_input_format: "scalar per reach"
      notes: "Routing travel-time / delay; K > 0 required."
    - category: "parameter"
      name: "Muskingum X"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "scalar per reach"
      notes: "Routing attenuation weight; valid range 0.0-0.5 (typically 0-0.3). X > 0.5 yields negative routing coefficients and negative flows."
    - category: "parameter"
      name: "Muskingum Steps"
      unit: "count"
      source_kind: "calibrated"
      model_input_format: "integer per reach"
      notes: "Number of routing subreaches."
    - category: "parameter"
      name: "baseflow recession constant (k_base)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "scalar (0 < k < 1)"
      notes: "Linear-reservoir recession ratio; range 0.5-0.99, near 1.0 = slow recession. It is a dimensionless ratio, NOT a rate constant or conductivity."
    - category: "parameter"
      name: "recharge_fraction"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "scalar"
      notes: "Fraction of loss diverted to the groundwater/baseflow store (calibration parameter); range 0.01-0.20."
    - category: "parameter"
      name: "basin area"
      unit: "km^2"
      source_kind: "dataset_lookup"
      model_input_format: "scalar per subbasin (from DEM + shapefile)"
      notes: "Used in runoff-depth-to-discharge conversion; must be km^2."
    - category: "parameter"
      name: "basin slope / longest-flow-path length"
      unit: "% or m/m ; m or km"
      source_kind: "dataset_lookup"
      model_input_format: "scalars per subbasin (terrain-derived)"
      notes: "Used to estimate Tc / lag."
  initial_conditions:
    - category: "initial_condition"
      name: "initial baseflow (q_base_init)"
      unit: "m^3/s"
      source_kind: "user_provided"
      model_input_format: "scalar"
      notes: "Range 0-1000; seeds the linear-reservoir baseflow store. Requires ~1 year spinup to equilibrate."
    - category: "initial_condition"
      name: "initial soil-moisture / retention state"
      unit: "mm"
      source_kind: "default"
      model_input_format: "implied by CN-derived retention S at simulation start"
      notes: "Needs spinup (~1 year); discard the first year of output."
  boundary_conditions:
    - category: "boundary_condition"
      name: "loss method selection (SCS Curve Number)"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "method switch"
      notes: "This implementation realizes the SCS-CN loss method only."
    - category: "boundary_condition"
      name: "transform method selection (SCS Unit Hydrograph)"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "method switch"
      notes: "This implementation realizes the SCS dimensionless UH transform only."
    - category: "boundary_condition"
      name: "routing method selection (Muskingum)"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "method switch"
      notes: "This implementation realizes Muskingum hydrologic routing only."
    - category: "boundary_condition"
      name: "baseflow method selection (Linear Reservoir)"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "method switch"
      notes: "This implementation realizes the Linear-Reservoir baseflow store only."
    - category: "boundary_condition"
      name: "computational interval D"
      unit: "hr"
      source_kind: "user_provided"
      model_input_format: "control timestep"
      notes: "Should satisfy D <= Tp/5 so the discrete unit hydrograph resolves the peak."
    - category: "boundary_condition"
      name: "simulation period (start/end)"
      unit: "date"
      source_kind: "user_provided"
      model_input_format: "control start/end"
      notes: "Must lie within forcing-data coverage."

processes:
  modules:
    - name: "SCS_CN_Loss"
      role: "process_solver"
      brief: "Partitions precipitation into initial abstraction, retention (loss/infiltration), and excess rainfall via S = 25400/CN - 254 and Ia = lambda_ia*S; loss = P - Q."
      applicability: "always (the only loss method in this implementation)"
    - name: "SCS_UnitHydrograph_Transform"
      role: "process_solver"
      brief: "Convolves per-timestep excess rainfall with the SCS dimensionless unit hydrograph (time-to-peak Tp from Tc and interval D) to produce the direct-runoff hydrograph."
      applicability: "always (the only transform method in this implementation)"
    - name: "LinearReservoir_Baseflow"
      role: "process_solver"
      brief: "Routes recharged water through a linear-reservoir store with dimensionless recession constant k_base to generate baseflow; initialized from q_base_init."
      applicability: "always (the only baseflow method in this implementation)"
    - name: "Runoff_Aggregation"
      role: "allocator"
      brief: "Sums the direct-runoff hydrograph and baseflow into total subbasin outflow and converts runoff depth (mm) to discharge (m^3/s) using basin area."
      applicability: "always"
    - name: "Muskingum_Routing"
      role: "process_solver"
      brief: "Routes inflow through a channel reach via storage weighting O[t+1] = C1*I[t+1] + C2*I[t] + C3*O[t] with coefficients from K, X, and dt."
      applicability: "always (the only channel-routing method in this implementation)"
    - name: "PET_Driver"
      role: "optional_module"
      brief: "Computes potential evapotranspiration from temperature (and radiation for Priestley-Taylor) when a continuous-simulation ET method is active."
      applicability: "when an ET method is enabled (continuous simulation)"
  internal_edges:
    - from: "Inputs"
      to: "SCS_CN_Loss"
      kind: "consumes_input"
      brief: "SCS-CN reads per-timestep precipitation, CN, and lambda_ia."
    - from: "SCS_CN_Loss"
      to: "soil moisture / retention state"
      kind: "writes_state"
      brief: "Updates accumulated retention / soil-moisture state."
    - from: "SCS_CN_Loss"
      to: "SCS_UnitHydrograph_Transform"
      kind: "invokes"
      brief: "Passes per-timestep excess rainfall to the transform."
    - from: "SCS_UnitHydrograph_Transform"
      to: "Runoff_Aggregation"
      kind: "invokes"
      brief: "Direct-runoff hydrograph forwarded for aggregation."
    - from: "SCS_CN_Loss"
      to: "LinearReservoir_Baseflow"
      kind: "invokes"
      brief: "A recharge fraction of the loss feeds the baseflow store."
    - from: "LinearReservoir_Baseflow"
      to: "baseflow store (linear reservoir)"
      kind: "writes_state"
      brief: "Evolves the recession store via k_base."
    - from: "LinearReservoir_Baseflow"
      to: "Runoff_Aggregation"
      kind: "invokes"
      brief: "Baseflow added to the direct-runoff hydrograph."
    - from: "Runoff_Aggregation"
      to: "Muskingum_Routing"
      kind: "invokes"
      brief: "Total subbasin outflow becomes reach inflow for routing."
    - from: "Muskingum_Routing"
      to: "channel routing storage (Muskingum)"
      kind: "writes_state"
      brief: "Updates the weighted inflow/outflow storage state."
    - from: "Muskingum_Routing"
      to: "Outputs"
      kind: "produces_output"
      brief: "Emits routed discharge at the outlet."
    - from: "Runoff_Aggregation"
      to: "Outputs"
      kind: "produces_output"
      brief: "Emits per-subbasin outflow, runoff depth, and loss."
    - from: "PET_Driver"
      to: "soil moisture / retention state"
      kind: "writes_state"
      brief: "ET demand draws down the moisture state in continuous simulation."
    - from: "Inputs"
      to: "PET_Driver"
      kind: "consumes_input"
      brief: "Reads temperature and (for Priestley-Taylor) radiation."

states:
  variables:
    - name: "soil moisture / retention state"
      unit: "mm"
      role: "prognostic"
    - name: "baseflow store (linear reservoir)"
      unit: "m^3/s (or equivalent storage depth)"
      role: "prognostic"
    - name: "channel routing storage (Muskingum)"
      unit: "m^3"
      role: "prognostic"
  provenance: "structural"

outputs:
  - var: "discharge"
    validation_rank: 1
    unit: "m^3/s"
    description: "Simulated routed streamflow at the basin (or subbasin) outlet."
    emitted_in: "simulation output time series (parse_hms_output)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "Discard ~1 year of spinup before scoring; baseflow and retention states need to equilibrate."
            - "Peak timing depends on calibrated lag/Tp; magnitude depends on CN and lambda_ia."
      detrending_options:
        - "none"
  - var: "runoff_depth"
    validation_rank: 2
    unit: "mm"
    description: "Direct-runoff (excess-rainfall) depth per timestep from SCS-CN."
    emitted_in: "simulation output time series (parse_hms_output)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Excess-rainfall depth is rarely observed directly; usually inferred."
      detrending_options:
        - "none"
  - var: "loss"
    validation_rank: 3
    unit: "mm"
    description: "Loss / infiltration per timestep (loss = P - Q)."
    emitted_in: "simulation output time series (parse_hms_output)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Not directly observable; diagnostic of the loss-method partition."
      detrending_options:
        - "none"
  - var: "subbasin_outflow"
    validation_rank: 4
    unit: "m^3/s"
    description: "Per-subbasin outflow (direct runoff + baseflow) available for downstream routing or coupling."
    emitted_in: "simulation output time series (parse_hms_output)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Comparable to gauged inflow at internal junctions when such gauges exist."
      detrending_options:
        - "none"

influence:
  edges: []
  _reason: "no sensitivity literature found (lit_reader.json was null; no quantitative or qualitative SA citations available for this implementation)"
  citation_index: {}

safety:
  hazards:
    - id: "curve_number_failed_lookup_zero_runoff"
      kind: "soil_semantic"
      description: "CN = 0/NaN or below 30 from a failed soil-group lookup makes retention S infinite, giving Q = 0 and a hydrograph flat at baseflow. (dt_103)"
      severity: "silent"
    - id: "initial_abstraction_ratio_volume_bias"
      kind: "coefficient_runtime_silent_fallback"
      description: "Using lambda_ia = 0.20 (classic) instead of 0.05 in humid basins underestimates runoff volume by ~15-30%. (dt_104)"
      severity: "degraded"
    - id: "scs_cn_threshold_suppresses_small_storms"
      kind: "soil_semantic"
      description: "When initial abstraction Ia exceeds most daily storm depths (e.g., CN=65 with lambda_ia=0.2 gives Ia=27.4 mm), small storms produce exactly zero runoff while only large storms generate flow. (dt_113)"
      severity: "silent"
    - id: "uh_interval_too_coarse_clips_peak"
      kind: "numerical_instability"
      description: "Computational interval D > Tp/3 makes the discrete unit-hydrograph convolution miss the peak, underestimating peak discharge (requires D <= Tp/5). (dt_105)"
      severity: "degraded"
    - id: "muskingum_X_violates_stability"
      kind: "numerical_instability"
      description: "Muskingum X > 0.5, or a timestep violating the Courant bound 2KX <= dt <= 2K(1-X), drives routing coefficients C1/C3 negative, producing negative or oscillating routed flow. (dt_106)"
      severity: "fatal_or_silent"
    - id: "baseflow_recession_constant_misinterpreted"
      kind: "coefficient_runtime_silent_fallback"
      description: "Treating the linear-reservoir recession constant (dimensionless 0<k<1) as a rate constant or hydraulic conductivity gives near-zero or instant-decay baseflow with no seasonal pattern. (dt_107)"
      severity: "silent"
    - id: "unrealistic_lag_time_for_basin_size"
      kind: "coefficient_runtime_silent_fallback"
      description: "SCS lag/Tp set for the wrong basin scale compresses or stretches the hydrograph, putting peak timing far too early or late on large basins. (dt_116)"
      severity: "degraded"
  validation_limits:
    - "Lumped per subbasin: cannot resolve within-subbasin spatial variability of rainfall or runoff generation."
    - "Hydrologic (storage/lag) routing only; cannot represent backwater, looped ratings, or dynamic-wave attenuation (use HEC-RAS for those)."
    - "Event-oriented SCS-CN loss without an explicit soil-moisture-accounting store; continuous simulation relies on spinup and is less suited to long-term soil-water dynamics than SMA/Deficit-Constant methods."
    - "This implementation realizes only SCS-CN + SCS-UH + Muskingum + Linear-Reservoir; native HEC-HMS methods outside that subset are not available here."
  warnings:
    - "Discard the first ~1 year of simulation: the baseflow store and retention state must equilibrate from initial conditions before output is meaningful."
    - "Results depend strongly on user parameterization (CN, lambda_ia, Tc/Tp, Muskingum K/X) and forcing quality; calibration is required."
    - "PET-method and ET-method unit expectations differ (Monthly Average expects mm/month, Priestley-Taylor expects mm/day); mismatched units silently corrupt the water balance."
  assumptions:
    - statement: "The runnable engine is a Python reimplementation of the public-domain HEC-HMS algorithms producing equivalent results for lumped/semi-distributed basins, not the native proprietary HEC-HMS binary."
      scope: "identity / implementation binding for this dag"
      source: "HEC-HMS User's Manual and Technical Reference Manual (USACE HEC); HydroCraft SKILL documentation of the equivalent algorithm set"
      status: "adopted"
    - statement: "Water-balance mass closure holds across the precipitation -> loss -> excess -> direct-runoff -> routing chain plus the linear-reservoir baseflow store; no surface energy-balance closure is asserted for the temperature/radiation-based PET paths."
      scope: "boundary.closure interpretation"
      source: "HEC-HMS Technical Reference Manual — Canopy/Surface/Infiltration/Runoff Volume and Baseflow chapters"
      status: "adopted"
    - statement: "Initial abstraction ratio lambda_ia = 0.05 (Woodward et al. 2003) is preferred over the classic 0.20 for humid/semi-humid basins; 0.20 retained only for arid regions."
      scope: "SCS-CN loss parameterization"
      source: "HEC-HMS SCS Curve Number method documentation; Woodward et al. 2003"
      status: "tentative"
