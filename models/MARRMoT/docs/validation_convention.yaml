validation:
- obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.8
      good: 0.6
      satisfactory: 0.5
    pass_band: satisfactory
    cites:
    - moriasi2015
    - moriasi2007
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: 3.0
      good: 10.0
      satisfactory: 15.0
    pass_band: satisfactory
    cites:
    - moriasi2015
  secondary_metrics:
  - metric: kge
    direction: maximize
    status: supportive
    ceiling_reason: KGE is a common alternative headline for discharge; Knoben 2019 shows the no-skill
      mean-flow benchmark is KGE = -0.41 (analogous to NSE = 0), so a positive KGE well above -0.41 is
      the minimum adequacy floor. No tiered KGE pass table in the fetched set, so KGE is retained as supportive,
      not headline.
    cites:
    - knoben2019
  - metric: r2
    direction: maximize
    status: supportive
    ceiling_reason: Moriasi 2015 couples R2 > 0.60 with the NSE/PBIAS satisfactory rating for watershed-scale
      flow; co-reported here as supportive since the dag determines on NSE.
    cites:
    - moriasi2015
  validated_when: NSE >= 0.50 AND |PBIAS| <= 15% (Moriasi 2015 daily/monthly watershed-scale streamflow
    'satisfactory'); very good = NSE > 0.80 & |PBIAS| <= 3%.
  evidence_strength: strong
  confidence: 0.85
  notes: 'Moriasi 2015 abstract: "model performance can be judged ''satisfactory'' for flow simulations
    if ... daily, monthly, or annual R2 > 0.60, NSE > 0.50, and PBIAS <= +/-15% for watershed-scale models",
    and the general PEC (Fig. 3): NSE very good >0.80, good 0.60-0.80, satisfactory 0.50-0.60; monthly-flow
    |PBIAS| very good <=3, good 3-10, satisfactory 10-15. Moriasi 2007 corroborates the streamflow satisfactory
    floor (NSE > 0.50, RSR < 0.70, |PBIAS| < +/-25%). Two peer-reviewed benchmarks => strong. Caveats
    carried from the dag: convert observed m3/s to mm/d with the gauged upstream area, and exclude >=1
    yr spin-up before computing metrics. NSE=0 is the mean-flow no-skill benchmark (Knoben 2019).'
  dag_variable: Q
- obs_shape: point_snapshot
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: 3.0
      good: 10.0
      satisfactory: 15.0
    pass_band: satisfactory
    band_note: band transferred from Moriasi 2015 monthly-flow PBIAS tiers; single-instant streamflow
      is a weak test for a continuous water-balance model (prefer the time-series form).
    cites:
    - moriasi2015
  secondary_metrics: []
  validated_when: '|PBIAS| <= 15% (magnitude-only, transferred from the continuous-flow convention); temporal-skill
    metrics are not evaluable on a single snapshot.'
  evidence_strength: moderate
  confidence: 0.4
  notes: No snapshot-specific streamflow threshold exists in the fetched set; the magnitude band is transferred
    from Moriasi 2015's continuous-flow PBIAS tiers, hence reduced confidence. The dag itself flags this
    shape as weak for a continuous model.
  dag_variable: Q
- obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      satisfactory: null
    pass_band: satisfactory
    band_note: 'no tiered ET NSE pass-convention in the fetched set. FLUXNET benchmark (Ershadi 2014):
      dedicated ET models reach NSEavg 0.42-0.77 (ensemble mean 0.61); a lumped conceptual Ea, bounded
      by the externally supplied Ep, will typically be lower. Contextualize only; never loosen.'
    cites:
    - ershadi2014
  secondary_metrics:
  - metric: rmse
    direction: minimize
    status: supportive
    ceiling_reason: 'FLUXNET multi-site latent-heat RMSD envelope (Ershadi 2014): best individual model
      ~64-66 W/m2, ensemble ~64 W/m2, weakest ~105 W/m2. An achievable-skill envelope for ET flux, not
      a pass line; units are W/m2 (LE) and do not map cleanly to the dag''s mm/d Ea.'
    cites:
    - ershadi2014
  validated_when: UNRESOLVED numeric threshold — MARRMoT Ea is Ep-bounded and only indirectly comparable
    to flux-tower/remote-sensing ET; treat as contextualized (FLUXNET envelope NSEavg ~0.4-0.77) until
    an ET pass-convention is fetched.
  evidence_strength: moderate
  confidence: 0.4
  notes: 'Ershadi 2014 ranks terrestrial-evaporation models against FLUXNET: "the ensemble mean (EM) presents
    the best overall performance with NSEavg = 0.61 ... and RMSDavg = 64 W/m2", PT-JPL and SEBS NSEavg
    0.42-0.5+. This is a benchmark envelope for dedicated ET models, NOT a validated-when line for a conceptual
    rainfall-runoff Ea, so the headline NSE band is null and the block may only contextualize.'
  dag_variable: Ea
- obs_shape: spatial_time_series
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      satisfactory: null
    pass_band: satisfactory
    band_note: 'no ET-specific PBIAS tier in the fetched set; Moriasi''s PBIAS tiers are derived for streamflow,
      not ET, so they are NOT transferred here. Model is lumped (0-D): gridded ET products must be spatially
      averaged to the catchment, losing spatial pattern.'
    cites: []
  secondary_metrics: []
  validated_when: UNRESOLVED — no cited ET PBIAS threshold; a lumped model cannot reproduce the spatial
    pattern of a gridded ET product. Data-gap until an ET magnitude-convention is fetched.
  evidence_strength: weak
  confidence: 0.35
  notes: The dag compares catchment-averaged Ea against a gridded ET product (e.g. MODIS 8-day). No fetched
    paper supplies an ET PBIAS pass tier; band null per the no-fabrication rule. Must not loosen the gate.
  dag_variable: Ea
- obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      satisfactory: null
    pass_band: satisfactory
    band_note: conceptual stores (soil-moisture / fast / slow / snow reservoirs) are numerical constructs,
      not directly measured states; there is no tiered storage NSE pass-convention in the fetched set.
      Comparison to SWE / soil-moisture / TWS obs is pattern-based and needs a store->obs scale/unit mapping.
    cites: []
  secondary_metrics:
  - metric: nse
    direction: maximize
    status: structurally_limited
    ceiling_reason: A lumped conceptual store is not a physical observable; Tong et al. 2021 show that
      assimilating satellite soil-moisture/snow "typically improves the spatial and/or temporal patterns
      of internal state variables and fluxes but does not necessarily improve the efficiency of simulating
      runoff", i.e. internal states are only indirectly identifiable and their absolute-value NSE is data/mapping
      limited, NOT a KI defect. A failing storage NSE therefore routes to acquire_data (better obs / store
      mapping), never fix_ki.
    cites:
    - tong2021
  - metric: r
    direction: maximize
    status: supportive
    ceiling_reason: Pattern correlation (r) is the field's usual skill measure for conceptual internal
      states against satellite soil-moisture/snow (Tong 2021); the dag uses r for TWS-anomaly and soil-moisture
      bindings. No numeric r pass tier in the fetched set.
    cites:
    - tong2021
  validated_when: UNRESOLVED numeric threshold — conceptual stores validated only qualitatively via pattern
    agreement (correlation) against soil-moisture/SWE/TWS obs; a failing absolute-NSE is a data/observability
    ceiling (Tong 2021), routed to acquire_data not fix_ki.
  evidence_strength: weak
  confidence: 0.35
  notes: 'Storage is the weakest-grounded quantity: conceptual stores are not directly measurable (dag
    caveat) and no fetched paper gives a tiered storage NSE/r threshold. Tong 2021 grounds the structural
    ceiling (internal states indirectly identifiable). Bands null; block contextualizes (suppress spurious
    fix_ki on a low store NSE) but never loosens a headline discharge requirement.'
  dag_variable: S
