template_version: "3.5"

identity:
  model_id: "Raven"
  scientific_reference_version: "Raven Hydrological Modelling Framework v4.1 (Craig et al. 2020, Environ. Model. Softw. 129:104728)"
  implementation:
    id: "raven-v41"
    version: "4.1"
    provenance: "C++; University of Waterloo Raven Hydrological Modelling Framework v4.1 (CSHS-CWRA); compiled HydroCraft binary Raven.exe (netCDF output disabled)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "Artistic-2.0"
  repo_url: "https://github.com/CSHS-CWRA/RavenHydroFramework"

boundary:
  scope_in:
    - "Rainfall-runoff transformation from meteorological forcing to discharge (hydrograph)"
    - "Infiltration and surface runoff partitioning"
    - "Evapotranspiration / potential ET (multiple selectable methods)"
    - "Snow accumulation, melt, and snowpack energy/mass state"
    - "Soil water balance, percolation between layers, and baseflow"
    - "Canopy interception and evaporation"
    - "Optional in-catchment and in-channel (subbasin/reservoir) routing"
    - "Glacier and lake/reservoir storage (when configured)"
    - "Emulation of established model structures (GR4J, HBV-EC, HMETS, MOHYSE, SAC-SMA, HYMOD, UBCWM, HYPR) by algorithm selection"
  scope_out:
    - "Coupled 2D/3D flood inundation routing (not implemented; external CaMa-Flood coupling noted but absent)"
    - "Detailed multi-dimensional groundwater aquifer flow (only conceptual baseflow storage unless AQUIFER_PROFILE specified)"
    - "Physically-based land-surface energy/water balance scheme (Raven is conceptual, unlike VIC)"
    - "Water quality / contaminant transport in the base configuration (optional transport module only)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "both"
  notes: "Mass and energy balance are enforced per HRU each timestep via the global numerical solver (ORDERED_SERIES/EULER/ITERATED_HEUN). Daily is the default and validated HydroCraft timestep; sub-daily is supported by the framework. Spatial discretization is semi-distributed: HRUs aggregated into SubBasins. Energy-balance closure is active only for processes that track energy state (e.g. two-layer snow energy balance, cold content); many default configurations use conceptual mass-balance fluxes only."

inputs:
  forcing:
    - category: "forcing"
      name: "PRECIP"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: ".rvt time series; daily total"
      notes: "Raven treats each value as a daily total and performs NO unit conversion. Missing PRECIP is silently filled with zeros."
    - category: "forcing"
      name: "TEMP_MIN"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: ".rvt time series"
    - category: "forcing"
      name: "TEMP_MAX"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: ".rvt time series"
    - category: "forcing"
      name: "TEMP_AVE"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: ".rvt time series; can be generated internally from TEMP_MIN/TEMP_MAX"
    - category: "forcing"
      name: "SW_RADIA"
      unit: "MJ/m2/d"
      source_kind: "forcing"
      model_input_format: ".rvt time series; generated internally from latitude+day if absent"
      notes: "Required by Priestley-Taylor / Penman-Monteith PET; W/m2 values are misread (no conversion)."
    - category: "forcing"
      name: "LW_INCOMING"
      unit: "MJ/m2/d"
      source_kind: "forcing"
      model_input_format: ".rvt time series"
    - category: "forcing"
      name: "WIND_VEL"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: ".rvt time series; optional, generated internally if absent"
    - category: "forcing"
      name: "REL_HUMIDITY"
      unit: "fraction (0-1)"
      source_kind: "forcing"
      model_input_format: ".rvt time series"
    - category: "forcing"
      name: "AIR_PRES"
      unit: "kPa"
      source_kind: "forcing"
      model_input_format: ".rvt time series; required by Penman-Monteith (Pa values misread as kPa)"
    - category: "forcing"
      name: "PET"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: ".rvt time series; only when PET_DATA method selected"
    - category: "forcing"
      name: "observed discharge"
      unit: "m3/s"
      source_kind: "forcing"
      model_input_format: ".rvt :ObservationData HYDROGRAPH block"
      notes: "Optional; required for Diagnostics metrics (NSE/KGE), else Diagnostics reports -9999. Missing marker is -1.2345."
  parameters:
    - category: "parameters"
      name: "Soil class parameters (hydraulic / storage, e.g. HBV_BETA, porosity, max release rate)"
      unit: "various"
      source_kind: "calibrated"
      model_input_format: ".rvp :SoilParameterList / :SoilProfiles"
      notes: "Named template stores (PRODUCT_STORE, FAST_RESERVOIR) are aliases for SOIL[i]; sentinel values (-11111.1 AUTO_COMPUTE, -33333.3 NOT_SPECIFIED, -55555.5 USE_TEMPLATE_VALUE) trigger internal estimation rather than being literal data."
    - category: "parameters"
      name: "Vegetation / land-use class parameters (e.g. AET_COEFF, interception)"
      unit: "various"
      source_kind: "calibrated"
      model_input_format: ".rvp :VegetationParameterList / :LandUseParameterList"
    - category: "parameters"
      name: "Terrain class parameters"
      unit: "various"
      source_kind: "calibrated"
      model_input_format: ".rvp :TerrainClasses"
    - category: "parameters"
      name: "Global / emulation-template parameters (e.g. GR4J X1-X4, MOHYSE_PET_COEFF, melt factors)"
      unit: "various"
      source_kind: "calibrated"
      model_input_format: ".rvp :GlobalParameter and routed Soil/LandUse lists"
      notes: "v4.1 requires correct routing: GR4J X2/X3 as SoilParameterList, X4 as LandUseParameterList, X1 encoded via soil_thickness*porosity, not all as :GlobalParameter."
    - category: "parameters"
      name: "HRU/SubBasin geometry (area, elevation, lat/lon, slope, aspect, class assignments)"
      unit: "km2 / m / deg"
      source_kind: "dataset_lookup"
      model_input_format: ".rvh HRU lines (exactly 13 comma-separated fields)"
      notes: "Sum of HRU areas must equal SubBasin area; class names must match .rvp exactly (case-sensitive)."
  initial_conditions:
    - category: "initial_conditions"
      name: "Initial soil water storage (SOIL[i])"
      unit: "mm"
      source_kind: "user_provided"
      model_input_format: ".rvc; cold-start climate defaults or warm-start from solution.rvc"
      notes: "First 1-2 years should be discarded as spinup."
    - category: "initial_conditions"
      name: "Initial snow water equivalent and snow state (SNOW, SNOW_LIQ, COLD_CONTENT)"
      unit: "mm / energy"
      source_kind: "user_provided"
      model_input_format: ".rvc"
    - category: "initial_conditions"
      name: "Initial canopy / groundwater storage"
      unit: "mm"
      source_kind: "user_provided"
      model_input_format: ".rvc"
    - category: "initial_conditions"
      name: ".rvc file existence (cold start)"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: ".rvc must exist (even if only a comment) in v4.1 or Raven aborts"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "Process algorithm selection (model structure)"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: ".rvi :HydrologicProcesses block (:ProcessType ALGORITHM FROM_STATE TO_STATE)"
      notes: "Determines which emulation structure is realized; ORDERED_SERIES solver applies processes strictly in listed order (order-dependent results)."
    - category: "boundary_conditions"
      name: "PET method selector"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: ".rvi :Evaporation / :OW_Evaporation (PET_OUDIN / PET_HARGREAVES_1985 / PET_PRIESTLEY_TAYLOR / PET_PENMAN_MONTEITH / PET_HAMON / PET_MOHYSE / PET_DATA)"
      notes: "Method choice sets required forcing; unmet requirements cause silent fallback to internal generators."
    - category: "boundary_conditions"
      name: "Solver / numerical method"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: ".rvi :SoilModel / solution method (ORDERED_SERIES, EULER, ITERATED_HEUN)"
    - category: "boundary_conditions"
      name: "Routing method (in-channel and in-catchment)"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: ".rvi :Routing and :CatchmentRoute (ROUTE_NONE / ROUTE_DUMP / diffusive wave etc.)"
      notes: "Channel and in-catchment routing are independent selections; can be disabled to avoid double-counting with external routing."
    - category: "boundary_conditions"
      name: "Simulation control (start/end dates, :TimeStep, output options)"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: ".rvi :StartDate/:EndDate/:TimeStep/:EvaluationMetrics"
      notes: ":TimeStep must match the .rvt :Data interval or forcing is misread."
    - category: "boundary_conditions"
      name: "Reservoir / water management operations (extractions, diversions)"
      unit: "various"
      source_kind: "user_provided"
      model_input_format: ".rvm (optional)"

processes:
  modules:
    - name: "PrecipitationPartitioning"
      role: "process_solver"
      brief: "Partitions ATMOS_PRECIP into rain vs snow and routes to PONDED_WATER / SNOW; snow-incapable templates (GR4J basic, HYMOD, basic SAC-SMA) treat all precip as rain."
    - name: "CanopyInterception"
      role: "process_solver"
      brief: "Intercepts precipitation into CANOPY / CANOPY_SNOW storage before it reaches the ground."
    - name: "SnowBalance"
      role: "process_solver"
      brief: "Snow accumulation, melt, refreeze and (optionally) energy/cold-content evolution. 9 algorithms (SNOBAL_SIMPLE_MELT degree-day, SNOBAL_HBV, SNOBAL_UBCWM, SNOBAL_HMETS, SNOBAL_CEMA_NEIGE, SNOBAL_TWO_LAYER energy balance, SNOBAL_COLD_CONTENT)."
    - name: "Infiltration"
      role: "process_solver"
      brief: "Partitions PONDED_WATER into soil infiltration vs surface runoff. 19 algorithms (INF_RATIONAL, INF_SCS, INF_GREEN_AMPT, INF_VIC, INF_HBV, INF_GR4J, INF_HMETS, INF_PRMS, INF_UBC, INF_TOPMODEL, INF_PDM/HYMOD, INF_XINANXIANG)."
    - name: "Percolation"
      role: "process_solver"
      brief: "Vertical water movement between soil layers SOIL[i]. 12 algorithms (PERC_LINEAR, PERC_POWER_LAW, PERC_SACRAMENTO, PERC_GR4J, PERC_PRMS)."
    - name: "Baseflow"
      role: "process_solver"
      brief: "Slow release from soil stores to SURFACE_WATER. 10 algorithms (BASE_LINEAR, BASE_POWER_LAW, BASE_VIC, BASE_GR4J, BASE_TOPMODEL, BASE_THRESH_POWER, BASE_THRESH_STOR); multiple baseflow lines allowed (one per soil layer)."
    - name: "PotentialEvapotranspiration"
      role: "process_solver"
      brief: "Computes potential ET from forcing. 24 methods (PET_OUDIN, PET_HARGREAVES_1985, PET_PRIESTLEY_TAYLOR, PET_PENMAN_MONTEITH, PET_HAMON, PET_MOHYSE, PET_DATA); forcing requirements vary by method."
    - name: "SoilEvaporation"
      role: "process_solver"
      brief: "Actual evaporation from soil layers to ATMOSPHERE, constrained by PET and soil moisture (e.g. SOILEVAP_HBV: SOIL[0] -> ATMOSPHERE)."
    - name: "GlacierProcesses"
      role: "optional_module"
      brief: "Glacier melt and storage evolution (GLACIER, GLACIER_ICE, GLACIER_CC); active only when glacier HRUs configured."
      applicability: "glacier HRUs only"
    - name: "InCatchmentRouting"
      role: "integrator"
      brief: "Drains HRU SURFACE_WATER into per-subbasin routed flow (aRouted) before channel routing; selected via :CatchmentRoute, independent of channel routing."
    - name: "ChannelRouting"
      role: "integrator"
      brief: "Optional in-channel routing of generated runoff through SubBasins/Reservoirs to the outlet; can be ROUTE_NONE/ROUTE_DUMP to disable. SubBasin::RouteWater and Reservoir::RouteWater update stage and pass inflow downstream."
      applicability: "when :Routing not ROUTE_NONE"
    - name: "MassEnergyBalanceSolver"
      role: "integrator"
      brief: "Global timestep integrator (ORDERED_SERIES/EULER/ITERATED_HEUN) applying each process's rates of change under mass/energy constraints; ORDERED_SERIES mutates the working state vector in listed process order."
    - name: "ConstituentTransport"
      role: "optional_module"
      brief: "Optional advective transport of constituents (CONSTITUENT state) coupled to the routed water; off in base configuration."
      applicability: "transport configuration only"
  internal_edges:
    - from: "Inputs"
      to: "PrecipitationPartitioning"
      kind: "consumes_input"
      brief: "PRECIP forcing drives precipitation partitioning into rain/snow."
    - from: "PrecipitationPartitioning"
      to: "CanopyInterception"
      kind: "invokes"
      brief: "Precipitation reaching the canopy is offered to interception before the remainder partitions to the ground (canopy interception, docs 3.1.1)."
    - from: "CanopyInterception"
      to: "CANOPY"
      kind: "writes_state"
      brief: "Intercepted rainfall accumulates in canopy storage."
    - from: "CanopyInterception"
      to: "CANOPY_SNOW"
      kind: "writes_state"
      brief: "Intercepted snowfall accumulates in canopy-snow storage."
    - from: "CanopyInterception"
      to: "ATMOSPHERE"
      kind: "writes_state"
      brief: "Canopy-intercepted water evaporates back to the atmosphere (canopy evaporation, docs 3.9)."
    - from: "PrecipitationPartitioning"
      to: "SNOW (SWE)"
      kind: "writes_state"
      brief: "Snow fraction accumulates to snowpack."
    - from: "PrecipitationPartitioning"
      to: "PONDED_WATER"
      kind: "writes_state"
      brief: "Rain fraction reaches the surface as ponded water."
    - from: "SnowBalance"
      to: "SNOW (SWE)"
      kind: "reads_state"
      brief: "Reads snowpack state to compute melt/refreeze."
    - from: "SnowBalance"
      to: "PONDED_WATER"
      kind: "writes_state"
      brief: "Snowmelt adds to ponded water available for infiltration."
    - from: "PONDED_WATER"
      to: "Infiltration"
      kind: "reads_state"
      brief: "Infiltration partitions available ponded water."
    - from: "Infiltration"
      to: "SOIL[i]"
      kind: "writes_state"
      brief: "Infiltrated water enters upper soil storage."
    - from: "Infiltration"
      to: "SURFACE_WATER"
      kind: "writes_state"
      brief: "Excess (non-infiltrated) becomes surface runoff."
    - from: "Percolation"
      to: "SOIL[i]"
      kind: "writes_state"
      brief: "Moves water between soil layers (e.g. SOIL[0] -> SOIL[1])."
    - from: "Baseflow"
      to: "SOIL[i]"
      kind: "reads_state"
      brief: "Reads soil store to compute slow release."
    - from: "Baseflow"
      to: "SURFACE_WATER"
      kind: "writes_state"
      brief: "Baseflow discharges from soil stores to surface water."
    - from: "PotentialEvapotranspiration"
      to: "SoilEvaporation"
      kind: "invokes"
      brief: "PET supplies the demand limit for actual soil evaporation."
    - from: "SoilEvaporation"
      to: "SOIL[i]"
      kind: "reads_state"
      brief: "Actual ET drawn from soil moisture, constrained by availability."
    - from: "SoilEvaporation"
      to: "ATMOSPHERE"
      kind: "writes_state"
      brief: "Evaporated water leaves to the atmosphere sink."
    - from: "SURFACE_WATER"
      to: "InCatchmentRouting"
      kind: "reads_state"
      brief: "Generated runoff per HRU is gathered for in-catchment routing."
    - from: "InCatchmentRouting"
      to: "ChannelRouting"
      kind: "invokes"
      brief: "Routed HRU flow feeds channel routing through subbasins."
    - from: "ChannelRouting"
      to: "Outputs"
      kind: "produces_output"
      brief: "Channel routing yields STREAMFLOW at subbasin outlets (Hydrographs.csv)."
    - from: "MassEnergyBalanceSolver"
      to: "Infiltration"
      kind: "invokes"
      brief: "Solver applies each process's rates of change in order under mass/energy constraints (representative of all process modules)."
    - from: "GlacierProcesses"
      to: "PONDED_WATER"
      kind: "writes_state"
      brief: "Glacier melt contributes to surface water input where glacier HRUs exist."

states:
  variables:
    - name: "SOIL[i]"
      unit: "mm"
      role: "prognostic"
    - name: "SNOW (SWE)"
      unit: "mm"
      role: "prognostic"
    - name: "SNOW_LIQ"
      unit: "mm"
      role: "prognostic"
    - name: "SNOW_DEPTH"
      unit: "mm"
      role: "prognostic"
    - name: "COLD_CONTENT"
      unit: "MJ/m2 (energy)"
      role: "prognostic"
    - name: "PONDED_WATER"
      unit: "mm"
      role: "prognostic"
    - name: "SURFACE_WATER"
      unit: "mm"
      role: "prognostic"
    - name: "CANOPY"
      unit: "mm"
      role: "prognostic"
    - name: "CANOPY_SNOW"
      unit: "mm"
      role: "prognostic"
    - name: "GROUNDWATER[i]"
      unit: "mm"
      role: "prognostic"
    - name: "DEPRESSION"
      unit: "mm"
      role: "prognostic"
    - name: "GLACIER / GLACIER_ICE"
      unit: "mm"
      role: "prognostic"
    - name: "GLACIER_CC"
      unit: "mm (cold content)"
      role: "prognostic"
    - name: "LAKE_STORAGE / RESERVOIR_STAGE"
      unit: "mm / m"
      role: "prognostic"
    - name: "ATMOSPHERE"
      unit: "mm"
      role: "accumulator"
    - name: "ATMOS_PRECIP"
      unit: "mm"
      role: "accumulator"
    - name: "CUM_INFIL"
      unit: "mm"
      role: "accumulator"
    - name: "CUM_SNOWMELT"
      unit: "mm"
      role: "accumulator"
    - name: "TOTAL_SWE"
      unit: "mm"
      role: "diagnostic"
    - name: "AET"
      unit: "mm"
      role: "diagnostic"
    - name: "RUNOFF"
      unit: "mm"
      role: "diagnostic"
    - name: "STREAMFLOW"
      unit: "m3/s"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "discharge (STREAMFLOW)"
    validation_rank: 1
    unit: "m3/s"
    description: "Simulated streamflow hydrograph at each gauged SubBasin outlet; observed series co-reported when supplied."
    emitted_in: "Hydrographs.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "Discard first 1-2 years (cold-start spinup)."
            - "Diagnostics report -9999 when no observed discharge is supplied."
            - "Structural choice (template/algorithm) drives 20-50% inter-model differences; compare against observed gauge, not against another model."
      detrending_options:
        - "none"
  - var: "Soil water storage (SOIL[i])"
    validation_rank: 4
    unit: "mm"
    description: "Basin-averaged soil layer water storage; SOIL[0]/SOIL[1] can supply soil moisture to coupled crop/water-quality models."
    emitted_in: "WatershedStorage.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Conceptual storage units (mm) are template-dependent and not always directly comparable to absolute observed soil moisture; compare anomalies/dynamics."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Only meaningful when HRU discretization resolves spatial heterogeneity (elevation bands / land-use HRUs)."
      detrending_options:
        - "none"
        - "linear_residual"
  - var: "Snow water equivalent (SNOW / TOTAL_SWE)"
    validation_rank: 3
    unit: "mm"
    description: "Snowpack water equivalent per HRU/basin."
    emitted_in: "WatershedStorage.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "Snow-incapable templates produce no snowpack; only snow-capable structures (HBV-EC, HMETS, UBC, CemaNeige) are comparable."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Requires elevation-band/distributed HRUs to resolve the snow gradient."
      detrending_options:
        - "none"
  - var: "Actual evapotranspiration (AET)"
    validation_rank: 2
    unit: "mm/d"
    description: "Actual ET flux to the atmosphere; diagnostic accumulator, not an independent mass-balance reservoir."
    emitted_in: "ForcingFunctions.csv / CustomOutput"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "PET-method choice strongly conditions AET; silent fallback to internal generators when required forcing is missing."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Gridded ET products (e.g. remote-sensing) compare at HRU/basin aggregation; conceptual ET is demand-limited, not energy-closed by default."
      detrending_options:
        - "none"
  - var: "Performance diagnostics (NSE, KGE, PBIAS, RMSE)"
    validation_rank: 5
    unit: "dimensionless / m3/s"
    description: "Built-in objective functions computed against observed discharge over the simulation period."
    emitted_in: "Diagnostics.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Reports -9999 if no observed discharge supplied; these are model-internal diagnostics, not an independent observation."
            - "Calibration-vs-validation NSE gap > 0.15 indicates overfitting."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "quickflow / surface-runoff process option"
      to: "streamflow"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "always"
      citations:
        - "mai2022_raven_process_sensitivity_northamerica"
        - "chlumsky2021_raven_blended_model_structure_calibration"
        - "spieler2024_raven_amsi_model_structure_ensemble"
    - from: "infiltration process option"
      to: "streamflow"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "always"
      citations:
        - "mai2022_raven_process_sensitivity_northamerica"
    - from: "potential-melt parameters / POTMELT_HMETS option"
      to: "streamflow"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "snow-influenced catchments"
      citations:
        - "mai2020_raven_xssa_param_structure_sensitivity"
        - "mai2022_raven_process_sensitivity_northamerica"
    - from: "evaporation / PET-correction factor"
      to: "streamflow"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "mai2022_raven_process_sensitivity_northamerica"
        - "mai2020_raven_xssa_param_structure_sensitivity"
    - from: "percolation / topsoil max-release rate"
      to: "streamflow"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
