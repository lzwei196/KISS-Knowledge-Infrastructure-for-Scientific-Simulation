# ============================================================================
# SWAP Knowledge Infrastructure v1.0.0
# ============================================================================
# Soil-Water-Atmosphere-Plant model v4.2.0
# 1D vertical transport of water, solutes, and heat in variably saturated soils
# ============================================================================

package:
  name: "hydrocraft-swap-soil"
  version: "1.0.0"
  description: "Knowledge infrastructure for SWAP vadose zone simulation within HydroCraft"
  target_model: "SWAP 4.2.0"
  domain: "soil hydrology and vadose zone transport"
  authors:
    - "Wageningen University and Research (WUR)"
  license: "LGPL-2.1"
  created: "2026-03-28"

pipeline:
  stages:
    - id: s0_config
      name: "Configuration"
      description: "Site selection, simulation period, forcing source, crop schedule, output options"
      order: 0
      depends_on: []
      skill_document: "docs/s0_configuration_skill.md"
      tools: []
      milestones:
        - id: m0_config_defined
          description: "Site, period, forcing source, and crop schedule defined"
          verification: "All dates within forcing data coverage, crop dates non-overlapping"

    - id: s1_met_forcing
      name: "Meteorological forcing conversion"
      description: "Convert CMFD/MSWX/local forcing to SWAP .met format with unit conversions"
      order: 1
      depends_on: [s0_config]
      skill_document: "docs/s1_met_forcing_skill.md"
      tools: [convert_forcing_to_swap]
      milestones:
        - id: m1_met_created
          description: ".met file exists with correct columns and units"
          verification: "head -1 *.met contains 'Station,DD,MM,YYYY,Rad,Tmin,Tmax,Hum,Wind,Rain'"

    - id: s2_soil_parameters
      name: "Soil parameter conversion"
      description: "Convert HWSD or manual texture to Mualem-van Genuchten parameters"
      order: 2
      depends_on: [s0_config]
      skill_document: "docs/s2_soil_parameters_skill.md"
      tools: [convert_soil_to_swap]
      milestones:
        - id: m2_soil_params
          description: "MvG parameter table with ORES < OSAT for all layers"
          verification: "python -c \"# check ORES < OSAT in output file\""

    - id: s3_config_assembly
      name: "Configuration assembly"
      description: "Assemble .swp, .crp, .dra files from parameters and templates"
      order: 3
      depends_on: [s1_met_forcing, s2_soil_parameters]
      skill_document: "docs/s0_configuration_skill.md"
      tools: []
      milestones:
        - id: m3_swp_assembled
          description: "swap.swp exists with all sections populated"
          verification: "grep -c 'SECTION' swap.swp >= 8"

    - id: s4_execution
      name: "Model execution"
      description: "Run SWAP binary with preflight checks and output validation"
      order: 4
      depends_on: [s3_config_assembly]
      skill_document: "docs/s4_execution_skill.md"
      tools: [run_swap]
      milestones:
        - id: m4_execution_complete
          description: "SWAP exits with code 0, output files created"
          verification: "test -f result.blc && test -s result.blc"

    - id: s5_output_parsing
      name: "Output parsing"
      description: "Extract SWAP results to structured CSV for analysis"
      order: 5
      depends_on: [s4_execution]
      skill_document: "docs/s5_output_parsing_skill.md"
      tools: [parse_swap_output]
      milestones:
        - id: m5_parsed
          description: "Parsed CSV files and summary JSON exist"
          verification: "test -f parsed/summary.json"

    - id: s6_visualization
      name: "Visualization and validation"
      description: "Generate plots and compare against observations"
      order: 6
      depends_on: [s5_output_parsing]
      skill_document: "docs/s6_visualization_skill.md"
      tools: [plot_swap_results]
      milestones:
        - id: m6_figures
          description: "Water balance and timeseries figures generated"
          verification: "ls figures/*.png | wc -l >= 2"

tools:
  - id: convert_forcing_to_swap
    name: "Forcing converter (CMFD/MSWX → SWAP .met)"
    stage: s1_met_forcing
    script_path: "tools/convert_forcing_to_swap.py"
    language: python
    inputs:
      - name: source
        type: string
        required: true
        example: "cmfd"
      - name: forcing_dir
        type: file
        required: true
        example: "KISSPATH_FORCING/Data_forcing_01dy_010deg/"
      - name: lat
        type: number
        required: true
        example: 52.069
      - name: lon
        type: number
        required: true
        example: 6.657
      - name: start
        type: string
        required: true
        example: "2002-01-01"
      - name: end
        type: string
        required: true
        example: "2004-12-31"
      - name: output
        type: string
        required: true
        example: "283.met"
    outputs:
      - name: met_file
        type: file
        description: "SWAP .met meteorological forcing file"
        path_pattern: "*.met"
    preconditions:
      - "Forcing directory exists with NetCDF files for requested period"
      - "Coordinates within forcing grid extent"
    postconditions:
      - "Rad in 0-50000 kJ/m²/d range"
      - "Hum in 0.05-10 kPa range (vapor pressure, NOT relative humidity)"
      - "Tmin < Tmax for all records"
      - "Rain >= 0, Wind >= 0"

  - id: convert_soil_to_swap
    name: "Soil parameter converter (HWSD → MvG)"
    stage: s2_soil_parameters
    script_path: "tools/convert_soil_to_swap.py"
    language: python
    inputs:
      - name: hwsd
        type: file
        required: false
        example: "KISSPATH_STATIC/HWSD_China_Geo.img"
      - name: lat
        type: number
        required: true
      - name: lon
        type: number
        required: true
      - name: texture
        type: string
        required: false
        example: "sandy_loam"
    outputs:
      - name: soil_params
        type: file
        description: "Mualem-van Genuchten parameter table"
        path_pattern: "soil_params.*"
    preconditions:
      - "HWSD raster exists OR texture class specified"
    postconditions:
      - "ORES < OSAT for all layers"
      - "NPAR > 1.001"
      - "KSATFIT > 0"
      - "BDENS in 100-10000 range"

  - id: run_swap
    name: "SWAP execution wrapper"
    stage: s4_execution
    script_path: "tools/run_swap.py"
    language: python
    inputs:
      - name: binary
        type: file
        required: true
        example: "builddir/swap"
      - name: work_dir
        type: file
        required: true
      - name: swp_file
        type: string
        required: false
        example: "swap.swp"
    outputs:
      - name: result_files
        type: file
        description: "SWAP output files (result.blc, result.inc, etc.)"
        path_pattern: "result.*"
    preconditions:
      - "Binary exists and is executable"
      - "swap.swp and all referenced input files exist"
      - "All filenames lowercase (Linux)"
    postconditions:
      - "Exit code 0"
      - "result.blc exists and is non-empty"
      - "No .dwb.csv error files"

  - id: parse_swap_output
    name: "Output parser (SWAP → CSV)"
    stage: s5_output_parsing
    script_path: "tools/parse_swap_output.py"
    language: python
    inputs:
      - name: work_dir
        type: file
        required: true
      - name: outfil
        type: string
        required: false
        example: "result"
    outputs:
      - name: parsed_csvs
        type: file
        description: "Structured CSV files and summary JSON"
        path_pattern: "parsed/*.csv"
    preconditions:
      - "SWAP output files exist in work_dir"
    postconditions:
      - "water_balance.csv or daily_increments.csv exists"
      - "summary.json exists with totals"

  - id: plot_swap_results
    name: "Result visualizer"
    stage: s6_visualization
    script_path: "tools/plot_swap_results.py"
    language: python
    inputs:
      - name: parsed_dir
        type: file
        required: true
      - name: output_dir
        type: file
        required: true
    outputs:
      - name: figures
        type: file
        description: "PNG figures for water balance and timeseries"
        path_pattern: "figures/*.png"
    preconditions:
      - "Parsed CSV files exist"
      - "matplotlib available"
    postconditions:
      - "At least 2 PNG figures generated"

