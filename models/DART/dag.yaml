template_version: "3.5"

identity:
  model_id: "DART"
  scientific_reference_version: "DART Manhattan release — ensemble data-assimilation framework (EAKF / EnKF / QCEFF), Anderson/DAReS lineage"
  implementation:
    id: "dart-manhattan"
    version: "11.24.x (Manhattan release)"
    provenance: "Fortran 90+ with NetCDF I/O; DAReS / NSF NCAR; github.com/NCAR/DART. Model-agnostic assimilation core coupled to a host model_mod."
  ki_class: "hybrid_or_framework"
  is_family_dag: false
  language: "fortran"
  license: "Apache-2.0"
  repo_url: "https://github.com/NCAR/DART"

boundary:
  scope_in:
    - "Combining observations with an ensemble of host-model states to estimate system state (sequential ensemble Bayesian filtering)"
    - "Generating initial conditions for forecasts"
    - "Producing retrospective state estimates (reanalysis)"
    - "Observing System Experiments (OSE) and Observing System Simulation Experiments (OSSE)"
    - "Diagnosing model error and observation impact via observation-space statistics"
  scope_out:
    - "Forward geophysical dynamics — DART does not integrate physics; the host model advances the ensemble between cycles"
    - "Operational forecasting as a primary aim (research-oriented facility)"
    - "Fixing the state-vector geometry, variables, or units — all inherited from the coupled host model_mod"
  spatial: "model-inherited"
  temporal: "cycled-window"
  closure: "none"
  notes: "Spatial geometry and units are inherited from the coupled host model (location modules: oned 1-D idealized, threed_sphere, threed_cartesian); DART's own spatial parameter is the Gaspari-Cohn localization half-width (radians for threed_sphere). Temporal cadence is cycled assimilation windows (observations carry (days, seconds) stamps); the host model advances the ensemble between cycles via async=0 in-binary, async=2 shell, or async=4 parallel-shell. `closure: none` because the prior->posterior step is an ensemble Bayesian (Kalman) update, not a physical mass- or energy-balance closure."

inputs:
  forcing:
    - category: "observations"
      name: "observation sequence (obs_seq)"
      unit: "observation-type dependent (host-model units)"
      source_kind: "forcing"
      model_input_format: "obs_seq ASCII or binary file: header (copies, QC fields, count) + per-obs {location, time (days,seconds), obs type, error variance, value, QC}"
      notes: "Consumed per assimilation window. Error field stores VARIANCE (sigma^2), NOT standard deviation. Missing-value sentinel is exactly -888888.0 (a valid float, never NaN)."
  parameters:
    - category: "localization"
      name: "cutoff"
      unit: "radians (threed_sphere) / host-distance units"
      source_kind: "user_provided"
      model_input_format: "&assim_tools_nml cutoff (real)"
      notes: "Gaspari-Cohn localization half-width; observations beyond 2x cutoff have zero impact. Hardcoded default 0.2."
    - category: "inflation"
      name: "inflation parameters (inf_initial, inf_damping, inf_lower_bound, inf_upper_bound, inf_sd_*)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "&filter_nml inf_* as 2-element [prior, posterior] arrays"
      notes: "Multiplicative covariance inflation magnitude/persistence. Defaults: inf_initial=1.0 (none), inf_damping=1.0 (no damping), inf_upper_bound=1e6 (effectively unbounded), inf_sd_max_change=1.05."
    - category: "ensemble"
      name: "ens_size"
      unit: "count"
      source_kind: "user_provided"
      model_input_format: "&filter_nml ens_size (integer)"
      notes: "Number of ensemble members (20-1000 typical); trades sampling error against cost and keys the sampling-error-correction table. Default 20."
    - category: "ensemble"
      name: "perturbation_amplitude"
      unit: "state units (Gaussian sigma)"
      source_kind: "user_provided"
      model_input_format: "&filter_nml perturbation_amplitude (real)"
      notes: "Stddev of Gaussian perturbation when building an ensemble from a single state (perturb_from_single_instance). Default 0.2; near-machine-epsilon values give zero spread."
    - category: "quality_control"
      name: "outlier_threshold / input_qc_threshold"
      unit: "innovation-stddev multiple / QC value"
      source_kind: "user_provided"
      model_input_format: "&filter_nml outlier_threshold; &quality_control_nml input_qc_threshold"
      notes: "outlier_threshold default -1 (disabled); positive N rejects obs with |obs - prior_mean| > N*sqrt(spread^2 + obs_err^2). input_qc_threshold default 3.0 rejects high incoming QC."
  initial_conditions:
    - category: "state"
      name: "ensemble state files"
      unit: "host-model state units"
      source_kind: "user_provided"
      model_input_format: "NetCDF filter_input*.nc (input_state_file_list, or single_file_in with an ens dimension)"
      notes: "Ensemble of host-model restart states at cycle start; dimensionality and variables set by the host model. ens_size must match the available member count."
    - category: "inflation_state"
      name: "inflation restart fields"
      unit: "dimensionless inflation factor"
      source_kind: "user_provided"
      model_input_format: "prior_inf_mean.nc / prior_inf_sd.nc (and posterior counterparts)"
      notes: "Adaptive inflation mean/sd fields carried across cycles; required when inf_initial_from_restart=.true. Persistence governed by inf_damping."
  boundary_conditions:
    - category: "control"
      name: "model-advance mode (async)"
      unit: "enum {0,2,4}"
      source_kind: "user_provided"
      model_input_format: "&filter_nml async"
      notes: "0 = synchronous in-binary adv_1step (built-in models e.g. Lorenz); 2 = shell command adv_ens_command; 4 = parallel shell launching concurrent advances (external models e.g. WRF, CAM)."
    - category: "method"
      name: "filter algorithm (filter_kind / QCEFF table)"
      unit: "enum / per-quantity table"
      source_kind: "user_provided"
      model_input_format: "algorithm_info QCEFF table; filter_kind codes (EAKF=1, ENKF=2, KERNEL=3, OBS_PARTICLE=4, UNBOUNDED_RHF=8, GAMMA=11, BOUNDED_NORMAL_RHF=101, KDE=102)"
      notes: "EAKF is the default per-obs increment kernel; QCEFF assigns per-quantity distributions/bounds to relax the Gaussian assumption for variables like precipitation and snow depth."
    - category: "method"
      name: "localization function (select_localization)"
      unit: "enum"
      source_kind: "default"
      model_input_format: "&cov_cutoff_nml select_localization"
      notes: "1 = Gaspari-Cohn 5th-order (default, recommended); Boxcar and Ramped Boxcar also available."
    - category: "control"
      name: "stages_to_write"
      unit: "list"
      source_kind: "user_provided"
      model_input_format: "&filter_nml stages_to_write (subset of forecast/preassim/postassim/analysis/output)"
      notes: "Selects which NetCDF state stages are emitted. Default writes only the final 'output' stage; preassim/analysis diagnostics are suppressed unless listed."
    - category: "control"
      name: "assimilate_these_obs_types / evaluate_these_obs_types"
      unit: "list"
      source_kind: "user_provided"
      model_input_format: "&obs_kind_nml"
      notes: "Types in the evaluate-only list get DART_qc=5 (forward operator computed but not assimilated)."

processes:
  modules:
    - name: "filter"
      role: "driver"
      brief: "Main ensemble-DA driver: loops over assimilation windows, advances the model via obs_model, computes forward operators, calls assim_tools to update the state, applies inflation and QC, and writes NetCDF stage output and obs_seq.final."
    - name: "obs_model"
      role: "driver"
      brief: "Advances the host model to the next observation time (synchronous integrate_model in-binary, or asynchronous adv_ens_command external runs) and manages the assimilation window."
    - name: "model_mod_interface"
      role: "driver"
      brief: "Abstract host-model interface (get_state_meta_data, model_interpolate, get_close_obs) implemented by each of the 50+ DART model directories to couple a specific model to the filter."
    - name: "forward_operator"
      role: "process_solver"
      brief: "Computes expected observations H(x) for each ensemble member by interpolating the model state at observation locations via the model_mod interface."
    - name: "assim_tools"
      role: "process_solver"
      brief: "Numerical core: serial observation loop computing obs-space increments and regressing them onto the distributed state with localization, sampling-error correction, and obs-impact masking."
    - name: "obs_increment_kernels"
      role: "process_solver"
      brief: "Per-observation update kernels selected per quantity: deterministic EAKF adjustment, stochastic ENKF, bounded/unbounded rank-histogram, particle, gamma, and KDE filters."
    - name: "localization_cov_cutoff"
      role: "process_solver"
      brief: "Computes the distance-based covariance localization weight (default Gaspari-Cohn 5th-order) that tapers each observation's influence on distant state elements."
    - name: "adaptive_inflate"
      role: "process_solver"
      brief: "Prior/posterior covariance inflation: spatially-varying or single-state adaptive inflation of ensemble spread with damping, bounds, and bounded sd update (flavors 0/2/3/4/5)."
    - name: "quality_control"
      role: "optional_module"
      brief: "Assigns DART_qc flags: incoming-QC rejection, outlier (innovation vs spread+obs-error) test, and forward-operator-failure handling; gates which observations are assimilated."
    - name: "reg_factor"
      role: "optional_module"
      brief: "Group-based regression confidence factor down-weighting sampling-noise-dominated state-obs regressions when num_groups>1."
      applicability: "num_groups>1"
    - name: "sampling_error_correction"
      role: "optional_module"
      brief: "Applies a precomputed, ensemble-size-keyed correction table to the regression coefficient to counter spurious small-ensemble correlations."
    - name: "algorithm_info_qceff"
      role: "allocator"
      brief: "Parses the QCEFF table to assign per-quantity filter_kind, distribution type, and bounds, steering both the obs increment and the probit transforms."
    - name: "probit_transform"
      role: "process_solver"
      brief: "Maps state/obs into probit space (normal, bounded-normal-rank-histogram, gamma, KDE) so the update and inflation operate on transformed, possibly bounded variables."
    - name: "ensemble_manager"
      role: "integrator"
      brief: "Owns the distributed copies(member, state) ensemble matrix plus reserved mean/sd/inflation copies; transposes between state-complete and var-complete layouts across MPI tasks."
    - name: "perfect_model_obs"
      role: "driver"
      brief: "OSSE path: advances a 'true' model state to each obs time, evaluates forward operators, adds Gaussian noise, and writes synthetic obs_seq.out plus the true state."
      applicability: "OSSE / synthetic-obs experiments"
    - name: "obs_diag"
      role: "optional_module"
      brief: "Computes time/region/level-binned observation-space verification statistics (bias = mean innovation, RMSE, totalspread, obs counts) from obs_seq.final."
  internal_edges:
    - from: "obs_model"
      to: "filter"
      kind: "produces_output"
      brief: "advances host model and returns the ensemble state at the current obs-window time"
    - from: "obs_model"
      to: "model_mod_interface"
      kind: "invokes"
      brief: "calls the model advance (integrate_model in-binary or external adv_ens_command)"
    - from: "filter"
      to: "forward_operator"
      kind: "invokes"
      brief: "requests expected-obs H(x) for all members at all obs in the window"
    - from: "forward_operator"
      to: "model_mod_interface"
      kind: "invokes"
      brief: "calls model_interpolate / get_state_meta_data to evaluate the model at obs locations"
    - from: "forward_operator"
      to: "ensemble_manager"
      kind: "reads_state"
      brief: "reads the distributed ensemble copies to interpolate each member to obs space"
    - from: "forward_operator"
      to: "Inputs"
      kind: "consumes_input"
      brief: "reads observation locations and types from the obs_seq sequence"
    - from: "forward_operator"
      to: "quality_control"
      kind: "writes_state"
      brief: "marks DART_qc=FAILED_FOP when a member's forward operator fails"
    - from: "quality_control"
      to: "assim_tools"
      kind: "reads_state"
      brief: "outlier and incoming-QC flags decide whether assim_tools assimilates each obs"
    - from: "filter"
      to: "assim_tools"
      kind: "invokes"
      brief: "calls filter_assim to update the ensemble state with the obs sequence"
    - from: "assim_tools"
      to: "algorithm_info_qceff"
      kind: "reads_state"
      brief: "queries filter_kind, bounds, and distribution per obs quantity"
    - from: "assim_tools"
      to: "probit_transform"
      kind: "invokes"
      brief: "transforms ensemble to probit space before the update and back afterward"
    - from: "assim_tools"
      to: "obs_increment_kernels"
      kind: "invokes"
      brief: "computes the obs-space increment using the selected filter kind"
    - from: "assim_tools"
      to: "localization_cov_cutoff"
      kind: "invokes"
      brief: "obtains the localization taper weight for each state-obs distance"
    - from: "assim_tools"
      to: "reg_factor"
      kind: "invokes"
      brief: "obtains group-regression confidence factor when num_groups>1"
    - from: "assim_tools"
      to: "sampling_error_correction"
      kind: "reads_state"
      brief: "looks up the ensemble-size-keyed correction for the regression coefficient"
    - from: "assim_tools"
      to: "ensemble_manager"
      kind: "writes_state"
      brief: "regresses the obs increment onto the ens_handle copies state rows"
    - from: "assim_tools"
      to: "adaptive_inflate"
      kind: "writes_state"
      brief: "updates the prior/posterior inflation value+sd copies during the obs loop"
    - from: "adaptive_inflate"
      to: "ensemble_manager"
      kind: "reads_state"
      brief: "reads/writes the reserved inflation copies stored in the ensemble matrix"
    - from: "filter"
      to: "adaptive_inflate"
      kind: "invokes"
      brief: "applies prior inflation to spread before assimilation and posterior inflation after"
    - from: "ensemble_manager"
      to: "filter"
      kind: "consumes_input"
      brief: "reads ensemble restart files into the distributed copies matrix at startup"
    - from: "filter"
      to: "Outputs"
      kind: "produces_output"
      brief: "writes forecast/preassim/postassim/analysis/output NetCDF stage files, obs_seq.final, and inflation restarts"
    - from: "perfect_model_obs"
      to: "forward_operator"
      kind: "invokes"
      brief: "evaluates H(x) on the true state to generate synthetic observations (OSSE)"
    - from: "perfect_model_obs"
      to: "Outputs"
      kind: "produces_output"
      brief: "writes synthetic obs_seq.out and the true model state for OSSE experiments"
    - from: "obs_diag"
      to: "Outputs"
      kind: "produces_output"
      brief: "bins obs_seq.final innovations into bias/RMSE/totalspread observation-space diagnostics"

states:
  variables:
    - name: "ensemble copies matrix (ens_handle%copies)"
      unit: "host-model state units"
      role: "prognostic"
    - name: "ensemble mean / spread copies (ENS_MEAN_COPY, ENS_SD_COPY)"
      unit: "host-model state units"
      role: "diagnostic"
    - name: "adaptive inflation field (PRIOR_INF_COPY/SD, POST_INF_COPY/SD)"
      unit: "dimensionless inflation factor"
      role: "prognostic"
    - name: "forward-operator ensemble in obs space (obs_ens_handle%copies)"
      unit: "observation units"
      role: "diagnostic"
    - name: "per-observation quality-control flag (DART_qc)"
      unit: "QC code 0-8"
      role: "diagnostic"
    - name: "observation increment (obs_inc)"
      unit: "observation units"
      role: "diagnostic"
    - name: "regression coefficient (reg_coef)"
      unit: "state-per-obs covariance ratio"
      role: "diagnostic"
    - name: "localization weight (cov_factor)"
      unit: "dimensionless [0,1]"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "analysis ensemble mean (posterior state)"
    validation_rank: 1
    unit: "host-model state units"
    description: "Posterior ensemble-mean estimate in the coupled host model's physical medium (atmosphere, ocean, land, ice, etc.) and state space after assimilation and posterior inflation; the primary analysis product seeding the next cycle."
    emitted_in: "analysis_mean.nc / output_mean.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Verify against withheld (non-assimilated) observations to avoid circularity"
            - "Skip spinup (10-50 cycles) before computing skill metrics"
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Host-model grid; compare against independent reanalysis or gridded obs"
      detrending_options: ["none"]
  - var: "analysis ensemble spread (posterior sd)"
    validation_rank: 2
    unit: "host-model state units"
    description: "Posterior ensemble standard deviation in the coupled host model's physical medium (atmosphere, ocean, land, ice, etc.) and state space (N-1 normalized); for a well-calibrated ensemble it should approximately equal the analysis RMSE (spread-skill consistency)."
    emitted_in: "analysis_sd.nc / output_sd.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Spread-skill diagnostic: compare ensemble sd against RMSE of the ensemble mean versus obs; persistent sd << RMSE indicates filter divergence"
      detrending_options: ["none"]
  - var: "observation-space innovations and QC (obs_seq.final)"
    validation_rank: 3
    unit: "observation units"
    description: "Per-observation diagnostics in the coupled host model's physical observation medium (atmosphere, ocean, land, ice, etc.) and observation space: prior/posterior ensemble-mean expected obs, prior/posterior spread, and DART_qc flag; prior innovations measure forecast skill, posterior measures analysis fit."
    emitted_in: "obs_seq.final"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Filter the -888888.0 sentinel before any statistic (np.nanmean does NOT exclude it)"
            - "A high QC>0 fraction signals forward-operator (QC4), vertical-coordinate (QC8), or too-tight outlier (QC7) problems"
      detrending_options: ["none"]
  - var: "binned observation-space diagnostics (bias, rmse, totalspread)"
    validation_rank: 4
    unit: "observation units"
    description: "Time/region/level-binned observation-space innovation statistics in the coupled host model's physical observation medium (atmosphere, ocean, land, ice, etc.) (bias = mean innovation, RMSE, totalspread, obs counts used/possible) for verification."
    emitted_in: "obs_diag_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "These ARE the verification statistics; the reference 'truth' is the assimilated or withheld observations"
            - "Skip spinup cycles before interpreting; totalspread should track RMSE for a calibrated ensemble"
      detrending_options: ["none"]

influence:
  edges:
    - from: "covariance_inflation"
      to: "filter_divergence"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "small-ensemble / underdispersed regimes"
      citations: ["anderson1999_montecarlo_inflation", "anderson2007_adaptive_inflation"]
    - from: "covariance_inflation"
      to: "ensemble_spread"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["anderson1999_montecarlo_inflation", "anderson2007_adaptive_inflation", "anderson2009_spatiotemporal_inflation"]
    - from: "covariance_inflation"
      to: "analysis_RMSE"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["anderson2007_adaptive_inflation", "anderson2009_spatiotemporal_inflation"]
    - from: "localization_cutoff_radius"
      to: "analysis_RMSE"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["anderson2012_localization_sec"]
    - from: "localization_cutoff_radius"
      to: "spurious_correlations"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["anderson2012_localization_sec"]
    - from: "ensemble_size"
      to: "sampling_error"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      citations: ["anderson2001_eakf", "anderson2012_localization_sec"]
    - from: "ensemble_size"
      to: "analysis_RMSE"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "structural"
      citations: ["anderson2001_eakf"]
    - from: "sampling_error_correction"
      to: "analysis_RMSE"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "structural"
      citations: ["anderson2012_localization_sec"]
    - from: "sampling_error_correction"
      to: "localization_sensitivity"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "structural"
      citations: ["anderson2012_localization_sec"]
    - from: "filter_algorithm_choice"
      to: "analysis_RMSE"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      applicability: "non-Gaussian / nonlinear problems"
      citations: ["anderson2001_eakf", "anderson2009_dart_community"]
    - from: "adaptive_inflation_damping"
      to: "spread_error_consistency"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["anderson2007_adaptive_inflation", "anderson2009_spatiotemporal_inflation"]
  citation_index:
    anderson2001_eakf:
      short_citation: "Anderson 2001"
      doi: "10.1175/1520-0493(2001)129<2884:AEAKFF>2.0.CO;2"
      note: "Introduces the EAKF; analysis error and spread depend strongly on ensemble size and update algorithm."
    anderson1999_montecarlo_inflation:
      short_citation: "Anderson & Anderson 1999"
      doi: "10.1175/1520-0493(1999)127<2741:AMCIOT>2.0.CO;2"
      note: "Foundational Monte Carlo ensemble filter; first proposes covariance inflation against filter divergence."
    anderson2007_adaptive_inflation:
      short_citation: "Anderson 2007"
      doi: "10.1111/j.1600-0870.2006.00216.x"
      note: "Hierarchical Bayesian adaptive inflation; inflation magnitude/damping control analysis RMSE and spread-error consistency."
    anderson2009_spatiotemporal_inflation:
      short_citation: "Anderson 2009 (Tellus A)"
      doi: "10.1111/j.1600-0870.2008.00361.x"
      note: "Spatially/temporally varying adaptive inflation (DART operational scheme); reduces analysis RMSE vs single global inflation."
    anderson2012_localization_sec:
      short_citation: "Anderson 2012"
      doi: "10.1175/MWR-D-11-00013.1"
      note: "Quantifies localization-cutoff and sampling-error-correction effects on assimilation error; analysis error highly sensitive to localization strength."
    anderson2009_dart_community:
      short_citation: "Anderson et al. 2009 (BAMS)"
      doi: "10.1175/2009BAMS2618.1"
      note: "DART system-description paper documenting tunable knobs (filter choice, inflation, localization, ensemble size, obs error)."

safety:
  hazards:
    - id: "obs_error_stddev_not_variance"
      kind: "weather_file_semantic"
      description: "Observation error written as standard deviation instead of variance (sigma^2); DART reads error_var as variance, giving near-zero increments and obs effectively ignored."
      severity: "silent"
    - id: "localization_cutoff_degrees_not_radians"
      kind: "control_semantic"
      description: "threed_sphere localization cutoff given in degrees (or km) instead of radians; co-located obs get zero impact or spurious rejection (cutoff_rad = cutoff_km/6371.0)."
      severity: "silent"
    - id: "pressure_vertical_hpa_not_pa"
      kind: "weather_file_semantic"
      description: "Pressure vertical coordinate (which_vert=2) in hPa instead of Pascals; 500 hPa must be 50000.0 Pa or vertical localization rejects nearby obs."
      severity: "silent"
    - id: "longitude_outside_0_360"
      kind: "weather_file_semantic"
      description: "Longitudes in [-180,180] instead of DART's [0,360]; observations placed at wrong geographic locations (negative lon must be shifted +360)."
      severity: "silent"
    - id: "temperature_celsius_not_kelvin"
      kind: "weather_file_semantic"
      description: "Temperature obs in Celsius while host model_mod expects Kelvin; ~273 K systematic assimilation bias."
      severity: "silent"
    - id: "namelist_syntax_error"
      kind: "control_semantic"
      description: "Fortran namelist syntax error in input.nml (missing & prefix, / terminator, double quotes, non-dotted booleans); program crashes with 'namelist read error', no output."
      severity: "fatal"
    - id: "inf_flavor_scalar_not_array"
      kind: "control_semantic"
      description: "inf_flavor (and other inf_* params) set as a scalar instead of a 2-element [prior, posterior] array; the unset element silently stays at default 0 (no inflation)."
      severity: "silent"
    - id: "stages_to_write_unset"
      kind: "control_semantic"
      description: "stages_to_write not configured in &filter_nml; only the final 'output' stage is written and preassim/analysis diagnostic NetCDF files are silently absent."
      severity: "silent"
    - id: "obs_type_evaluate_not_assimilate"
      kind: "control_semantic"
      description: "Observation type placed in evaluate_these_obs_types but not assimilate_these_obs_types; forward operator is computed (QC=5) but the obs never updates the state."
      severity: "silent"
    - id: "missing_sentinel_not_filtered"
      kind: "parser_semantic"
      description: "DART missing-value sentinel -888888.0 (a valid float, not NaN) left in arrays before statistics; corrupts bias/RMSE (np.nanmean does not exclude it)."
      severity: "silent"
    - id: "obs_seq_format_endianness_mismatch"
      kind: "parser_semantic"
      description: "Binary/ASCII obs_seq mismatch, or a binary file from a different architecture; 'Error reading obs_seq file'. Set read_binary_file_format or prefer ASCII."
      severity: "fatal"
    - id: "filter_divergence_runaway_inflation"
      kind: "numerical_instability"
      description: "Ensemble spread collapses (division-by-zero/NaN) or adaptive inflation grows unbounded (>100) when inf_upper_bound too high and inf_damping=1.0; RMSE diverges and members go NaN."
      severity: "fatal_or_silent"
    - id: "zero_ensemble_spread_init"
      kind: "initial_condition_semantic"
      description: "perturbation_amplitude near machine epsilon, or perturb_from_single_instance=.false. without distinct member files; all members identical, zero covariance, no updates."
      severity: "silent"
    - id: "ens_size_member_count_mismatch"
      kind: "control_semantic"
      description: "ens_size in filter_nml does not match the number of input member files (or members in a single file); filter cannot read the ensemble state."
      severity: "fatal"
    - id: "outlier_threshold_too_tight"
      kind: "control_semantic"
      description: "outlier_threshold too tight rejects all obs (QC=7) when |obs - prior_mean| exceeds threshold*sqrt(spread^2+obs_err^2), especially during spinup."
      severity: "silent"
    - id: "obs_outside_domain_or_unsupported_fop"
      kind: "weather_file_semantic"
      description: "Observation location outside the host-model domain or an obs type not handled by model_interpolate(); forward operator fails (QC=4) or perfect_model_obs crashes."
      severity: "fatal"
  validation_limits:
    - "DART has no intrinsic forward physics; assimilation quality depends entirely on the host model_mod forward operators and the coupled model's dynamics."
    - "Validation documented in this KI is OSSE-only (Lorenz 63 idealized, 3-variable, EAKF, 20 members); no real-basin or coupled-model verification is provided."
    - "Skill depends on ensemble size (20-1000 members) and proper localization/inflation tuning; small ensembles require localization and sampling-error correction."
    - "Traditional EAKF/EnKF assume Gaussian errors; non-Gaussian variables (precipitation, snow depth) require the QCEFF framework."
  warnings:
    - "Spurious long-range sample correlations require covariance localization; observations beyond 2x cutoff have exactly zero impact."
    - "Skip spinup (10-50 cycles) before computing verification metrics."
    - "Ensemble spread should approximately equal RMSE; persistent spread << RMSE indicates filter divergence requiring inflation."
    - "inf_flavor and all inf_* parameters are 2-element [prior, posterior] arrays; setting one value leaves the other at the default."
  assumptions:
    - statement: "DART has no intrinsic geophysical state or forward dynamics; the state-vector contents, variables, units, and time integration are inherited from the coupled host model_mod."
      scope: "whole framework"
      source: "DART docs (guide/introduction-ensemble-da) and assim_model_mod / model_mod interface"
      status: "adopted"
    - statement: "The prior->posterior update is an ensemble Bayesian (Kalman-type) update via EAKF/EnKF/QCEFF, not a physical mass- or energy-balance closure."
      scope: "boundary.closure"
      source: "DART docs (guide/introduction-ensemble-da); assim_tools_mod"
      status: "adopted"
    - statement: "Observation error in obs_seq is interpreted as VARIANCE (sigma^2), not standard deviation."
      scope: "observation inputs"
      source: "DART obs_seq format docs; quality_control_mod and obs_sequence_mod"
      status: "adopted"
    - statement: "Default localization is Gaspari-Cohn (select_localization=1) with cutoff a half-width in radians for threed_sphere; obs beyond 2x cutoff have zero impact."
      scope: "localization"
      source: "assim_tools_mod docs; cov_cutoff_mod"
      status: "adopted"
    - statement: "Reported spatial/temporal grain reflects only DART's localization (radians) and cycled-window conventions; the physical grain is host-model dependent."
      scope: "boundary geometry"
      source: "DART docs overview and filter program documentation"
      status: "adopted"

