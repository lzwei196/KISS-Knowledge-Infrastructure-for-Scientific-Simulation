  moriasi2015:
    doi: 10.13031/trans.58.10715
    title: "Hydrologic and Water Quality Models: Performance Measures and Evaluation Criteria"
    venue: "Transactions of the ASABE"
    year: 2015
    oa: manual
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.13031_trans.58.10715.txt
  kelleher2017:
    doi: 10.5194/hess-21-3325-2017
    title: "Characterizing and reducing equifinality by constraining a distributed catchment model with regional signatures, local observations, and process understanding"
    venue: "Hydrology and Earth System Sciences"
    year: 2017
