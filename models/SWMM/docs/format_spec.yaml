# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: SWMM
  language: c
  implementation:
    id: pyswmm-swmm5
    version: SWMM 5.2.x engine (pyswmm 1.x/2.1 + swmm-toolkit bindings)
    provenance: C; EPA SWMM5 open-source engine (US EPA + CDM-Smith), driven through the pyswmm Python
      API which bundles the compiled engine.
  scientific_reference_version: EPA SWMM 5 (Reference Manual Vol I Hydrology, EPA/600/R-15/162A rev. Jan
    2016; engine line SWMM 5.2.x)
inputs:
  forcing:
  - name: Precipitation (rainfall)
    unit: mm/hr (intensity) or mm/interval (volume), CMS; in/hr or in (CFS)
    category: meteorology
    source_kind: forcing
    model_input_format: '[RAINGAGES] + [TIMESERIES] in INP; FORMAT INTENSITY|VOLUME|CUMULATIVE, held constant
      within a runoff timestep'
    notes: FORMAT (INTENSITY vs VOLUME) must match the data encoding; an interval mismatch scales runoff
      by intervals-per-hour with no warning.
  - name: Air temperature
    unit: deg C/F
    category: meteorology
    source_kind: forcing
    model_input_format: '[TEMPERATURE] daily max-min or continuous series'
    notes: Drives snowmelt partitioning and Hargreaves evaporation.
  - name: Evaporation
    unit: mm/day (SI) or in/day (US)
    category: meteorology
    source_kind: forcing
    model_input_format: '[EVAPORATION] time series (actual; pan x ~0.7) or Hargreaves from temperature'
    notes: SWMM expects actual evaporation; Hargreaves needs a multi-day (7-day running) temperature average.
  - name: Wind speed
    unit: km/hr (SI) or mph (US)
    category: meteorology
    source_kind: forcing
    model_input_format: '[WIND] series'
    notes: Refines snowmelt rate during rain-on-snow.
  parameters:
  - name: Area (A)
    unit: ha (CMS) / acre (CFS)
    category: subcatchment_geometry
    source_kind: user_provided
    model_input_format: '[SUBCATCHMENTS]'
  - name: Characteristic width (W)
    unit: m (CMS) / ft (CFS)
    category: subcatchment_geometry
    source_kind: user_provided
    model_input_format: '[SUBCATCHMENTS]'
    notes: Implied overland flow length L = Area/Width; over-large W (e.g., sqrt(Area) shortcut) artificially
      peaks the hydrograph.
  - name: Slope (S)
    unit: ft/ft (dimensionless)
    category: subcatchment_geometry
    source_kind: user_provided
    model_input_format: '[SUBCATCHMENTS]'
  - name: Percent imperviousness
    unit: '%'
    category: subcatchment_geometry
    source_kind: user_provided
    model_input_format: '[SUBCATCHMENTS]'
  - name: '% Zero-Imperv (impervious area with no depression storage)'
    unit: '%'
    category: subcatchment_geometry
    source_kind: user_provided
    model_input_format: '[SUBAREAS]'
  - name: Manning's n (pervious n_P, impervious n_I)
    unit: dimensionless
    category: surface_roughness
    source_kind: calibrated
    model_input_format: '[SUBAREAS]'
    notes: No range check; a dropped/added zero shifts velocity 10-13x. Typical range [0.005, 0.100].
  - name: Depression storage (pervious S-perv, impervious S-imperv)
    unit: mm (CMS) / in (CFS)
    category: surface_storage
    source_kind: calibrated
    model_input_format: '[SUBAREAS]'
  - name: Infiltration parameters
    unit: rates mm/hr; decay /hr; suction mm
    category: infiltration
    source_kind: calibrated
    model_input_format: '[INFILTRATION]: Horton (MaxRate,MinRate,Decay,DryTime,MaxInfil), Green-Ampt (Suction,Ksat,IMD),
      or SCS CN'
    notes: Column layout MUST match the method in [OPTIONS] INFILTRATION; mismatch silently misreads columns.
  - name: Aquifer parameters (up to 14 per subcatchment)
    unit: mixed
    category: groundwater
    source_kind: calibrated
    model_input_format: '[AQUIFERS]/[GROUNDWATER]'
    notes: Only required when groundwater is modeled.
  - name: Node attributes (invert elev, max depth, surcharge depth, ponded area Aponded)
    unit: m (CMS) / ft (CFS); Aponded m2
    category: network_geometry
    source_kind: user_provided
    model_input_format: '[JUNCTIONS], [STORAGE]'
  - name: Conduit attributes (length, Manning roughness, inlet/outlet offsets, cross-section)
    unit: m (CMS) / ft (CFS)
    category: network_geometry
    source_kind: user_provided
    model_input_format: '[CONDUITS] + [XSECTIONS]'
    notes: Length=0 (coincident nodes) causes division-by-zero/NaN.
  - name: LID layer properties (Surface/Soil/Pavement/Storage/Drain)
    unit: thicknesses mm; porosity/FC/WP fractions; conductivity mm/hr
    category: lid
    source_kind: calibrated
    model_input_format: '[LID_CONTROLS]'
    notes: Soil layer must satisfy Wilting Point < Field Capacity < Porosity; SWMM does not validate this.
  - name: Pollutant buildup/washoff and treatment coefficients
    unit: mixed (mass, mass/volume)
    category: water_quality
    source_kind: calibrated
    model_input_format: '[POLLUTANTS], [BUILDUP], [WASHOFF], [LANDUSES], [TREATMENT]'
  initial_conditions:
  - name: Ponded runoff depth d
    unit: mm
    category: runoff
    source_kind: default
    model_input_format: initialized to 0
  - name: Infiltration sub-states / antecedent dry time
    unit: mixed
    category: infiltration
    source_kind: default
    model_input_format: Horton DryTime / soil moisture storage S
    notes: Most infiltration sub-states (t_p, F_e, Fu, T, P) start at 0; soil moisture storage S is user-supplied.
  - name: Snow pack initial state (w_snow, fw, ati)
    unit: mm water equivalent; deg
    category: snowmelt
    source_kind: user_provided
    model_input_format: '[SNOWPACKS] initial conditions'
  - name: Initial unsaturated moisture theta_u and saturated depth d_L
    unit: fraction; m
    category: groundwater
    source_kind: user_provided
    model_input_format: '[GROUNDWATER] initial values'
  - name: Node initial depth / link initial flow
    unit: m (CMS); m3/s (CMS)
    category: network
    source_kind: user_provided
    model_input_format: '[JUNCTIONS] Init_Depth (usually 0); link initial flow'
  - name: LID initial soil saturation (InitSat)
    unit: '%'
    category: lid
    source_kind: user_provided
    model_input_format: '[LID_USAGE]'
    notes: 30-50% typical for event runs; washes out over continuous simulation.
  boundary_conditions:
  - name: FLOW_UNITS
    unit: enum CFS|GPM|MGD|CMS|LPS|MLD
    category: control_switch
    source_kind: user_provided
    model_input_format: '[OPTIONS]'
    notes: Silently sets the unit system for ALL inputs and outputs; no dimension validation. Single most
      dangerous silent error.
  - name: INFILTRATION method
    unit: enum HORTON|MOD_HORTON|GREEN_AMPT|CURVE_NUMBER
    category: control_switch
    source_kind: user_provided
    model_input_format: '[OPTIONS]'
  - name: ROUTING_MODEL
    unit: enum STEADY|KINWAVE|DYNWAVE
    category: control_switch
    source_kind: user_provided
    model_input_format: '[OPTIONS]'
    notes: Kinematic wave cannot represent adverse slopes, backwater, or surcharging; only dynamic wave
      handles reverse flow.
  - name: ALLOW_PONDING
    unit: enum YES|NO
    category: control_switch
    source_kind: user_provided
    model_input_format: '[OPTIONS]'
    notes: Default NO removes flood water as a mass sink; YES with Aponded>0 conserves it.
  - name: Timesteps (WET_STEP, DRY_STEP, ROUTING_STEP, REPORT_STEP) and VARIABLE_STEP
    unit: s; min for report
    category: control_switch
    source_kind: user_provided
    model_input_format: '[OPTIONS]'
    notes: ROUTING_STEP must satisfy the Courant condition for dynamic wave.
  - name: Outfall stage boundary
    unit: m (CMS) / ft (CFS)
    category: boundary_data
    source_kind: user_provided
    model_input_format: '[OUTFALLS] FREE|NORMAL|FIXED|TIDAL|TIMESERIES (+ [TIMESERIES] for a head series)'
    notes: Time-varying head boundary (e.g., downstream river stage). TIMESERIES name must exist and span
      the simulation period.
  - name: External inflow hydrographs / pollutographs at nodes
    unit: m3/s (CMS); mass/volume
    category: boundary_data
    source_kind: user_provided
    model_input_format: '[INFLOWS]'
    notes: External lateral inflow (e.g., upstream rural runoff coupling).
  - name: Dry-weather sanitary flow
    unit: FLOW_UNITS
    category: boundary_data
    source_kind: user_provided
    model_input_format: '[DWF] + optional [PATTERNS]'
    notes: Required for combined-sewer dry-weather base flow.
  - name: Control rules for pumps and regulators
    unit: n/a
    category: management
    source_kind: user_provided
    model_input_format: '[CONTROLS] IF-THEN-ELSE rules'
outputs:
  primary:
  - name: subcatchment_runoff
    unit: m3/s (CMS) or cfs (US)
    description: Surface runoff flow rate generated by a subcatchment.
    validation_rank: 1
    emitted_in: .out (SubcatchResult RUNOFF) and .rpt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Subcatchment runoff is rarely observed directly; usually compared at a gauged outlet/link rather
          than per-subcatchment.
      detrending_options:
      - none
  - name: node_depth_head
    unit: m (CMS) or ft (US)
    description: Water depth above invert and hydraulic head at a node (junction, storage, outfall).
    validation_rank: 2
    emitted_in: .out (NodeResult DEPTH/HEAD)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: r
        caveats:
        - Compared against pressure-transducer/stage records at instrumented manholes; requires datum
          alignment between model invert and sensor reference.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Peak-stage or high-water-mark comparison at a single node.
      detrending_options:
      - none
  - name: node_flooding
    unit: flow m3/s; volume m3
    description: Surface-water overflow rate and total surface floodwater volume at a drainage-network
      node when capacity is exceeded.
    validation_rank: 3
    emitted_in: .out (NodeResult FLOOD) and .rpt node flooding summary
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Flood volume is mass-balance-sensitive to ALLOW_PONDING; compare only when ponding is configured
          consistently with the observation context.
      - obs_shape: categorical_event
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        determining_metric: csi
        caveats:
        - Flood/no-flood per node against reported flooding locations; threshold-dependent.
      detrending_options:
      - none
  - name: link_flow
    unit: m3/s (CMS) or cfs (US)
    description: Stormwater flow rate through a drainage-network conduit/link; outfall discharge equals
      total inflow at the outfall node.
    validation_rank: 4
    emitted_in: .out (LinkResult FLOW) and .rpt outfall loading summary
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Primary calibration target; compared against flow-gauge records at an outfall or trunk conduit.
      detrending_options:
      - none
  - name: link_depth_velocity
    unit: depth m; velocity m/s; capacity fraction
    description: Stormwater flow depth, velocity, and fraction-of-full capacity in a drainage-network
      conduit.
    validation_rank: 5
    emitted_in: .out (LinkResult DEPTH/velocity)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Velocity rarely directly observed; depth comparable where a sensor exists in the conduit.
      detrending_options:
      - none
  - name: subcatchment_infiltration
    unit: mm/hr
    description: Infiltration rate into pervious soil per subcatchment.
    validation_rank: 6
    emitted_in: .out (SubcatchResult INFILTRATION)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Seldom directly observed; usually inferred from a runoff-coefficient or water-balance closure
          rather than a direct sensor.
      detrending_options:
      - none
  - name: groundwater_outflow
    unit: flow m3/s; table elev m
    description: Groundwater table elevation and lateral groundwater outflow per subcatchment.
    validation_rank: 7
    emitted_in: .out (SubcatchResult / SystemAttribute GW_INFLOW)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Compared against monitoring-well table elevations where aquifer parameters are calibrated; only
          meaningful when groundwater is enabled.
      detrending_options:
      - none
  - name: pollutant_concentration_load
    unit: mass/volume; mass
    description: Pollutant concentration and washoff load at subcatchments, nodes, and links.
    validation_rank: 8
    emitted_in: .out (pollutant per element) and .rpt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Grab-sample / EMC data are sparse and noisy; event-mean concentration comparison is often the
          only defensible match.
      detrending_options:
      - none
  - name: continuity_error
    unit: percent
    description: Surface-runoff water and drainage-network water flow-routing continuity errors; primary
      internal mass-balance/numerical-stability diagnostic.
    validation_rank: 9
    emitted_in: .rpt continuity tables
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Self-diagnostic, not an observation; checked against acceptance thresholds (<5%, <1% for dynamic
          wave), not against field data.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: SWMM simulation completes but the routing continuity error reported in the RPT file exceeds
    5%. Results are numerically unreliable.
  diagnosis: 'The routing timestep is too large for the dynamic wave solver to resolve flow transitions
    in the pipe network.; Dynamic wave routing solves the full Saint-Venant equations using an explicit
    finite difference scheme. The Courant condition requires dt <= dx / sqrt(g * h), where dx is the shortest
    conduit length and h is the maximum depth. When the timestep exceeds this limit, numerical oscillations
    cause mass balance errors. Short conduits, deep flows, or rapidly varying inflows all tighten the
    Courant constraint.

    ; [''[OPTIONS] ROUTING_STEP / WET_STEP'', ''Short conduits in [CONDUITS]'']'
  remedy: 'Reduce ROUTING_STEP and WET_STEP in [OPTIONS]. Start with 15s, then try 10s, then 5s. Each
    reduction approximately halves the continuity error at the cost of doubling runtime.; configure_simulation_options;
    [''Check RPT file for routing continuity error percentage'', ''Identify shortest conduit: sort [CONDUITS]
    by Length ascending'', ''Compute Courant limit: dt_max = min_length / sqrt(9.81 * max_depth)'', ''Set
    ROUTING_STEP and WET_STEP to <= dt_max in [OPTIONS]'', ''Re-run simulation and verify error < 1%''];
    Always check Courant condition against shortest conduit before first run. Use VARIABLE_STEP 0.75 to
    enable adaptive timestep.'
  severity: degraded
- id: dt_002
  symptom: Dynamic wave routing produces oscillating flow directions in some conduits. Link flow alternates
    between positive and negative values every timestep. Continuity error may be very high (>20%). Simulation
    may crash with NaN values.
  diagnosis: 'One or more conduits have adverse slopes (outlet invert higher than inlet invert), causing
    the dynamic wave solver to oscillate between forward and reverse flow.; An adverse slope means water
    must flow uphill. The dynamic wave solver can handle pressurized flow (surcharging), but adverse slopes
    create an unstable equilibrium where the solver alternates between forward gravitational flow and
    reverse pressure-driven flow. Each oscillation adds numerical error. Kinematic wave cannot handle
    adverse slopes at all and simply drops the flow.

    ; [''[CONDUITS] — conduits with adverse slopes'', ''[JUNCTIONS] — invert elevations'']'
  remedy: 'Identify conduits with adverse slopes and correct invert elevations. Use the validate_network_connectivity
    tool to find all adverse slopes.; validate_network_connectivity; [''For each conduit, compute slope:
    (from_invert + in_offset - to_invert - out_offset) / length'', ''Flag conduits with negative slope'',
    ''Adjust junction invert elevations to ensure monotonic decrease toward outfall'', ''If adverse slope
    is intentional (force main), ensure it is a pressurized pipe with correct pump/pressure head'']; Run
    validate_network_connectivity before simulation. Warn on any adverse slopes.'
  severity: fatal
- id: dt_003
  symptom: RPT file shows nodes flooding with non-zero flood volumes, but routing continuity error is
    negative (water leaving the system). No physical flooding is modeled — water simply disappears at
    the flooded nodes.
  diagnosis: 'ALLOW_PONDING is set to NO (default) or Aponded is 0 for flooded junctions. When a node''s
    water depth exceeds max_depth, excess water is removed from the system.; SWMM''s default behavior
    at flooded nodes is to lose the excess water. This is a mass balance sink — water enters the system
    as rainfall but exits through flooding without being tracked. For event simulations this may be acceptable
    (if you only care about the pipe system). For continuous simulations, water loss accumulates over
    time, making discharge results increasingly wrong. Setting ALLOW_PONDING=YES with a ponded area lets
    water accumulate on the surface and re-enter the drainage when capacity becomes available.

    ; [''[OPTIONS] ALLOW_PONDING'', ''[JUNCTIONS] Aponded column'']'
  remedy: 'Set ALLOW_PONDING=YES in [OPTIONS] and set Aponded > 0 for all junctions that may flood. Typical
    ponded area: 500-2000 m2 for urban manholes, 5000-50000 m2 for major intersections.; configure_simulation_options;
    [''Set ALLOW_PONDING YES in [OPTIONS]'', ''For each junction in [JUNCTIONS], set Aponded to estimated
    surface ponding area'', ''For junctions unlikely to flood, Aponded = 0 is acceptable'', ''Re-run simulation
    and verify routing continuity error improves'']; Always set ALLOW_PONDING=YES for continuous simulations.
    Even for event simulations, it improves numerical stability.'
  severity: degraded
- id: dt_004
  symptom: SWMM simulation runs to completion without errors, but flow magnitudes, velocities, or water
    depths are wrong by orders of magnitude. Pipe capacities seem impossibly large or small. No error
    messages in RPT.
  diagnosis: 'FLOW_UNITS setting (CFS vs CMS) does not match the units used for pipe dimensions, subcatchment
    areas, rainfall depths, or invert elevations.; FLOW_UNITS=CMS means ALL dimensions in meters, areas
    in hectares, rainfall in mm, flow in m3/s. FLOW_UNITS=CFS means feet, acres, inches, ft3/s. If FLOW_UNITS=CMS
    but a pipe diameter is entered as 600 (meaning 600mm), SWMM interprets it as 600 meters in diameter
    — an impossibly large pipe. The simulation runs perfectly because SWMM trusts the input numbers. There
    is NO validation, NO warning, NO error. The only symptom is results that don''t make physical sense.

    ; [''[OPTIONS] FLOW_UNITS'', ''[XSECTIONS] Geom1 (pipe dimensions)'', ''[SUBCATCHMENTS] Area, Width'',
    ''[JUNCTIONS] Elevation, Max_Depth'', ''[RAINGAGES] rainfall depth'']'
  remedy: 'Verify every dimensional input matches the FLOW_UNITS convention. Check pipe diameters (m for
    CMS), areas (ha for CMS), elevations (m for CMS), rainfall (mm for CMS).; validate_inp_file; [''Check
    [OPTIONS] FLOW_UNITS'', ''If CMS: verify all pipe Geom1 values are in meters (0.15 - 5.0 typical)'',
    ''If CMS: verify subcatchment areas are in hectares (0.1 - 100 typical)'', ''If CMS: verify junction
    elevations are in meters'', ''If CMS: verify rainfall values are in mm'', ''If CFS: verify pipe Geom1
    in feet, areas in acres, elevations in feet, rainfall in inches'']; Use CMS consistently for HydroCraft
    integration. Always validate dimensional ranges before running.'
  severity: silent
- id: dt_005
  symptom: 'SWMM reports an error at startup: ''ERROR 142: node/link/subcatchment [name] refers to undefined
    object [outlet_name]''. Simulation does not start.'
  diagnosis: 'A subcatchment''s outlet references a junction, outfall, or subcatchment ID that does not
    exist in the model.; Each subcatchment in [SUBCATCHMENTS] has an Outlet column that must match an
    existing node ID (in [JUNCTIONS], [OUTFALLS], [STORAGE], or [DIVIDERS]) or another subcatchment ID.
    If the referenced ID does not exist — due to a typo, missing node definition, or copy-paste error
    — SWMM refuses to start. This is a hard error (SWMM stops), not a silent error.

    ; [''[SUBCATCHMENTS] Outlet column'', ''[JUNCTIONS] or [OUTFALLS] — missing node'']'
  remedy: 'Check the outlet ID referenced in the error message. Either create the missing node or correct
    the outlet reference in [SUBCATCHMENTS].; validate_subcatchments; [''Find the subcatchment referenced
    in the error message'', ''Check its Outlet value in [SUBCATCHMENTS]'', ''Verify the outlet ID exists
    in [JUNCTIONS], [OUTFALLS], [STORAGE], or [DIVIDERS]'', ''If missing: add the node definition, or
    change the outlet to an existing node'', ''If typo: correct the Outlet value'']; Run validate_subcatchments
    and validate_inp_file before every simulation.'
  severity: fatal
- id: dt_006
  symptom: Simulation runs but infiltration behavior is wrong — either excessive infiltration in clay
    soils or no infiltration in sandy soils. Runoff volumes do not match expectations. No error message.
  diagnosis: 'The [INFILTRATION] parameters do not match the infiltration method set in [OPTIONS]. SWMM
    reads different columns depending on the method.; If [OPTIONS] INFILTRATION=HORTON, SWMM reads 5 columns:
    MaxRate, MinRate, Decay, DryTime, MaxInfil. If INFILTRATION=GREEN_AMPT, it reads 3 columns: Suction,
    Ksat, IMD. If INFILTRATION=CURVE_NUMBER, it reads CN, Ksat, DryTime. If the method is HORTON but the
    data was entered for GREEN_AMPT, SWMM interprets Suction (110 mm) as MaxRate (110 mm/hr) — physically
    wrong but SWMM has no way to know. The simulation runs, but infiltration rates are wrong.

    ; [''[OPTIONS] INFILTRATION'', ''[INFILTRATION] parameter columns'']'
  remedy: 'Verify that [INFILTRATION] parameters match the method in [OPTIONS]. Check column meanings
    for the chosen method.; validate_subcatchments; [''Check [OPTIONS] INFILTRATION method'', ''Verify
    [INFILTRATION] has correct number of columns for the method'', ''For HORTON: MaxRate > MinRate (both
    in mm/hr for CMS, in/hr for CFS)'', ''For GREEN_AMPT: Suction in mm (CMS), Ksat in mm/hr (CMS), IMD
    fraction'', ''For CURVE_NUMBER: CN in [25, 98]'']; Use classify_land_use tool which generates infiltration
    params for the specified method.'
  severity: degraded
- id: dt_007
  symptom: 'SWMM crashes during simulation with a division by zero or produces NaN flow values. The RPT
    file may show ''ERROR 141: conduit [name] has zero length'' or the simulation produces NaN/Inf in
    results.'
  diagnosis: 'A conduit has length = 0, which causes division by zero when computing conduit slope, velocity,
    or friction losses.; Conduit hydraulic computations require dividing by length (slope = dz/L, travel
    time = L/v). A zero-length conduit makes these divisions undefined. This typically happens when two
    junction nodes are at the exact same coordinates and a pipe connects them, or when GIS data has degenerate
    line features with zero length.

    ; [''[CONDUITS] Length column'', ''[JUNCTIONS] — nodes at same location'']'
  remedy: 'Find and fix zero-length conduits. Either merge the connected junctions into one, remove the
    conduit, or assign a minimum length (1 meter).; validate_network_connectivity; [''Search [CONDUITS]
    for Length = 0 or Length < 0.1'', ''For each: check if From_Node and To_Node are at the same coordinates'',
    ''Option 1: Merge the two nodes into one (update all references)'', ''Option 2: Set Length to a minimum
    value (1.0 m)'', ''Option 3: Remove the conduit if it is redundant'']; Validate all conduit lengths
    > 0 after network import. Use validate_network_connectivity.'
  severity: fatal
- id: dt_008
  symptom: 'SWMM reports ''ERROR 143: no outfall node defined'' or simulation runs but all nodes flood
    because water has no exit from the system.'
  diagnosis: 'The [OUTFALLS] section is missing or empty. Without an outfall, water entering the drainage
    system has nowhere to exit.; Every SWMM model must have at least one outfall node that serves as the
    boundary where water exits the model domain. Without an outfall, all water that enters (from rainfall
    and external inflows) accumulates in the pipe system, causing every node to flood. SWMM may detect
    this at startup (ERROR 143) or may run but produce meaningless results with 100% flooding.

    ; [''[OUTFALLS] section'', ''Network connectivity'']'
  remedy: 'Add at least one outfall node to the [OUTFALLS] section. Connect it to the downstream end of
    the drainage network via a conduit.; create_drainage_network; [''Identify the downstream end of the
    drainage network (lowest-elevation junction)'', ''Add an outfall node downstream: e.g., OF1 with elevation
    below the lowest junction invert'', ''Add a conduit connecting the lowest junction to the outfall'',
    ''Set outfall type: FREE (default), NORMAL, FIXED, or TIMESERIES'']; Always include at least one outfall
    when defining the network.'
  severity: fatal
- id: dt_009
  symptom: SWMM simulation runs successfully but runoff volumes are wrong by a factor equal to the number
    of intervals per hour. For 5-minute data, runoff is 12x too high (FORMAT=INTENSITY with VOLUME data)
    or 12x too low (FORMAT=VOLUME with INTENSITY data). No error message.
  diagnosis: 'The RAINGAGE FORMAT field (INTENSITY or VOLUME) does not match how the rainfall data values
    are encoded.; If data records depth per interval (e.g., 2.5 mm fell in this 5 minutes) and FORMAT=INTENSITY,
    SWMM treats 2.5 as a rate of 2.5 mm/hr. The actual rate was 2.5 mm / (5/60 hr) = 30 mm/hr. So SWMM
    uses 2.5 instead of 30, underestimating by 12x. Conversely, if data is intensity (30 mm/hr) but FORMAT=VOLUME,
    SWMM treats 30 as 30 mm in 5 minutes = 360 mm/hr rate, overestimating by 12x. This error produces
    NO warning because both INTENSITY and VOLUME are valid interpretations — only the user knows which
    one the data actually represents.

    ; [''[RAINGAGES] FORMAT field'', ''[TIMESERIES] — rainfall data values'']'
  remedy: 'Verify the data convention by checking the original data source documentation. Most automated
    gauges record VOLUME (depth per interval). Most gridded model forcing provides INTENSITY (rate).;
    validate_rainfall_input; [''Check the raw data source documentation for format convention'', "Look
    at a heavy rainfall event: if 5-min value is 2-5, it''s likely VOLUME (mm/5min); if 30-60, it''s likely
    INTENSITY (mm/hr)", ''Compute total event depth both ways and compare with known storm totals'', ''Update
    [RAINGAGES] FORMAT to match actual data convention'']; Always verify FORMAT matches data convention.
    Use validate_rainfall_input tool. Include a comment in the INP file noting the data convention.'
  severity: silent
- id: dt_010
  symptom: VIC runoff is successfully converted to SWMM inflow, but the flow magnitude is wrong by 3-5
    orders of magnitude. Either flooding occurs immediately at all boundary nodes, or external inflow
    is negligible compared to direct rainfall. No error message.
  diagnosis: 'The unit conversion from VIC runoff (mm/day per grid cell) to SWMM flow (m3/s) has a missing
    or wrong conversion factor.; The correct conversion is Q(m3/s) = runoff(mm/day) * area(m2) / 86400000.
    Three common errors: (1) Forgetting /1000 to convert mm to m — flow is 1000x too large. (2) Forgetting
    /86400 to convert day to seconds — flow is 86400x too large. (3) Using area in km2 instead of m2 —
    flow is 1,000,000x too small. Any of these produces flow values that are physically implausible but
    SWMM accepts them without complaint.

    ; [''convert_vic_runoff_to_swmm_inflow tool'', ''[INFLOWS] time series values'']'
  remedy: 'Validate the conversion by computing the expected flow independently. For a 0.25-degree cell
    at 30N with 5 mm/day runoff: Q = 5 * 6.25e8 / 86400000 = 36.2 m3/s. Compare with the tool output.;
    validate_coupling_water_balance; [''Compute cell area in m2: for lat/lon grid, area = dlon * dlat
    * cos(lat) * (111320)^2'', ''Pick a day with known VIC runoff (e.g., 5 mm/day)'', ''Expected Q = 5
    * area_m2 / 86400000'', ''Compare with the value in the SWMM inflow time series'', ''If mismatch,
    check the conversion formula in the script'']; Always use convert_vic_runoff_to_swmm_inflow tool (which
    has validated conversion). Never hand-code the conversion.'
  severity: silent
- id: dt_011
  symptom: LID controls appear to have no soil water retention. Bioretention cells produce runoff immediately
    without storing water in the soil layer. Or soil never drains — stays permanently saturated.
  diagnosis: 'LID soil layer parameters violate the physical constraint: Wilting Point < Field Capacity
    < Porosity.; Available water capacity = Field Capacity - Wilting Point. If WP >= FC, there is no available
    water — the soil cannot retain any water between drainage and permanent wilting. If FC >= Porosity,
    the soil is always at or above field capacity — it never drains. SWMM does not validate these relationships.
    The model runs, but the soil layer behaves as either a sieve (no retention) or a sponge (no drainage),
    depending on which constraint is violated.

    ; [''[LID_CONTROLS] Soil layer parameters'']'
  remedy: 'Verify soil parameters satisfy WP < FC < Porosity. Typical values: WP=0.10, FC=0.20, Porosity=0.50.;
    validate_lid_params; [''For each LID control with a Soil layer, check: Wilting_Point < Field_Capacity
    < Porosity'', ''If WP >= FC: reduce WP or increase FC'', ''If FC >= Porosity: reduce FC or increase
    Porosity'', ''Typical engineered bioretention media: Porosity=0.45-0.55, FC=0.15-0.25, WP=0.05-0.12''];
    Use validate_lid_params tool which checks this constraint automatically.'
  severity: degraded
- id: dt_012
  symptom: Combined sewer model shows zero flow during dry weather periods. Pipes that should carry sanitary
    flow are empty. Overflow frequency at CSO structures is underestimated.
  diagnosis: 'The [DWF] (Dry Weather Flow) section is missing or empty for a combined sewer system model.;
    Combined sewers carry both stormwater and sanitary wastewater. During dry weather, only sanitary flow
    exists. If [DWF] is not defined, SWMM assumes zero base flow in all pipes. This underestimates total
    flow volume, underestimates CSO frequency (combined sewer overflow occurs when sanitary + storm flow
    exceeds capacity), and misrepresents pipe utilization during dry periods.

    ; [''[DWF] section'', ''[JUNCTIONS] — nodes receiving sanitary inflow'']'
  remedy: 'Add [DWF] entries for junctions receiving sanitary flow. Specify average dry weather flow rate
    and optional time patterns (hourly, daily, monthly variation).; ; [''Estimate average sanitary flow
    per junction from population served and per-capita wastewater generation (200-400 L/person/day typical)'',
    ''Add [DWF] section with entries: Node FLOW <average_flow> <pattern>'', ''Add [PATTERNS] for hourly/daily
    variation if needed'', ''Verify total DWF matches known treatment plant dry-weather inflow'']; For
    combined sewer models, always define DWF. For separate storm sewer models, DWF is not needed.'
  severity: degraded
- id: dt_013
  symptom: SWMM fails to parse the INP file with cryptic errors about unexpected characters, wrong format,
    or file structure. Errors may reference specific line numbers but the lines look correct when viewed
    in a text editor.
  diagnosis: 'The INP file contains non-ASCII characters, BOM (Byte Order Mark), tabs mixed with spaces,
    or encoding that the SWMM C engine cannot parse.; The SWMM C engine expects plain ASCII text. UTF-8
    BOM (3 bytes at file start: EF BB BF) is invisible in most editors but causes SWMM to misinterpret
    the first line. Non-ASCII characters in comments (Chinese, accented characters) may cause parse failures.
    Some editors insert tab characters that SWMM interprets differently from spaces, misaligning column
    parsing.

    ; [''INP file encoding'', ''Text editor settings'']'
  remedy: 'Re-encode the INP file as plain ASCII without BOM. Replace tabs with spaces. Remove non-ASCII
    characters from comments.; ; [''Check for BOM: hexdump -C model.inp | head -1 (look for ef bb bf)'',
    "Remove BOM: sed -i ''1s/^\\xEF\\xBB\\xBF//'' model.inp", "Replace tabs: sed -i ''s/\\t/  /g'' model.inp",
    ''Remove non-ASCII: iconv -f utf-8 -t ascii//TRANSLIT model.inp > model_clean.inp'']; Use the assemble_inp_file
    tool which writes clean ASCII. If editing manually, use a text editor configured for ASCII encoding
    without BOM.'
  severity: fatal
- id: dt_014
  symptom: Simulated velocities are unreasonably fast or slow. Flow reaches the outfall much faster or
    slower than expected. Peak flow timing is off but magnitude may be reasonable.
  diagnosis: 'Manning''s roughness coefficient (n) is wrong — too low (smooth, fast) or too high (rough,
    slow) for the pipe material and condition.; Manning''s equation relates flow velocity to slope, hydraulic
    radius, and roughness: V = (1/n) * R^(2/3) * S^(1/2). Velocity is inversely proportional to n. If
    n=0.001 instead of 0.013 (a common typo — missing a zero), velocity is 13x too fast and flow arrives
    at the outfall much too early. If n=0.13 instead of 0.013, velocity is 10x too slow. SWMM accepts
    any positive n value without range checking.

    ; [''[CONDUITS] Roughness column'']'
  remedy: 'Verify Manning''s n values against standard tables for the pipe material. Typical range for
    pipes: 0.009-0.025.; validate_network_connectivity; ["Review all Manning''s n values in [CONDUITS]",
    ''Flag values outside [0.008, 0.060] for pipes and [0.015, 0.100] for channels'', ''Cross-reference
    with pipe material: PVC=0.010, concrete=0.013, corrugated metal=0.024'', ''Correct any obvious typos
    (0.13, 0.0013, etc.)'']; Use material-based roughness lookup in import_network_from_gis tool.'
  severity: degraded
- id: dt_015
  symptom: CaMa-Flood boundary condition is applied to SWMM outfall, but backwater effects occur at the
    wrong river stage. Urban flooding is triggered too early (datum offset too low) or too late (offset
    too high). No error message.
  diagnosis: 'The elevation datum used in SWMM does not match CaMa-Flood''s global MSL datum. The datum_offset_m
    parameter is missing, wrong, or has wrong sign.; CaMa-Flood reports water surface elevation (sfcelv)
    in meters above mean sea level. SWMM may use a local datum (arbitrary benchmark, project datum, or
    MSL). If the SWMM datum is 5 meters above MSL, then CaMa sfcelv=10m should be entered as SWMM stage=5m.
    Without this offset, SWMM sees the river at 10m which is 5m higher than reality, causing premature
    backwater flooding. The model runs perfectly — the results are just shifted vertically.

    ; [''convert_cama_stage_to_outfall_bc tool — datum_offset_m parameter'', ''[OUTFALLS] boundary condition
    time series'']'
  remedy: Determine the correct datum offset by comparing the DEM elevation at the outfall with the SWMM
    outfall invert elevation.; convert_cama_stage_to_outfall_bc; ['Get CaMa-Flood DEM elevation at the
    outfall grid cell', 'Get SWMM outfall invert elevation from [OUTFALLS]', 'datum_offset = CaMa_DEM_elev
    - SWMM_outfall_elev (approximately)', 'Verify by comparing CaMa dry-weather stage with known low-water
    conditions', 'Re-run with corrected datum_offset_m']; Document the vertical datum used in SWMM model.
    Always verify datum_offset against independent measurements (survey, DEM, tidal gauges).
  severity: silent
- id: dt_016
  symptom: Runoff hydrograph is too peaked and too fast — time to peak is much shorter than expected.
    Total volume may be correct but the hydrograph shape is wrong. No error message.
  diagnosis: 'Subcatchment width is too large, causing overland flow to reach the outlet too quickly.;
    SWMM models subcatchment runoff using the nonlinear reservoir equation with Manning''s equation for
    overland flow. The characteristic width determines the overland flow path length (L = Area / Width).
    A larger width means a shorter flow path, which means faster concentration time. Width = sqrt(Area)
    is a common but incorrect shortcut that overestimates width for most subcatchment shapes. Width should
    be Area / longest_flow_path. For a 1-hectare rectangular lot (100m x 100m) draining along the long
    axis, Width = 10000/100 = 100m, not sqrt(10000) = 100m (coincidentally equal for squares, but wrong
    for rectangles and irregular shapes).

    ; [''[SUBCATCHMENTS] Width column'']'
  remedy: Recompute width as Area / longest_overland_flow_path for each subcatchment.; compute_subcatchment_params;
    ['For each subcatchment, estimate the longest flow path from the hydraulically most remote point to
    the outlet', 'Width = Area / longest_flow_path', 'For irregular shapes, the longest flow path is NOT
    the diagonal — it follows the actual drainage direction', 'Update [SUBCATCHMENTS] Width column'];
    Always use compute_subcatchment_params which computes width from DEM flow paths, not geometric shortcuts.
  severity: silent
- id: dt_017
  symptom: Multiple conduits alternate between free-surface and pressurized flow every few timesteps.
    Continuity error gradually increases. Simulation may become progressively slower due to adaptive timestep
    reduction.
  diagnosis: 'The transition between open-channel flow and pressurized (surcharged) flow is numerically
    unstable, especially when many conduits are near capacity simultaneously.; Dynamic wave routing handles
    both free-surface and pressurized flow, but the transition between them involves a discontinuity in
    the governing equations (from Saint-Venant to pressurized pipe flow). When flow oscillates near the
    transition point, the solver switches formulations every timestep, introducing numerical noise. This
    is especially common during the rising limb of large storms when many pipes fill nearly simultaneously.

    ; [''[CONDUITS] — conduits near capacity'', ''[OPTIONS] ROUTING_STEP'']'
  remedy: Reduce routing timestep or enable VARIABLE_STEP to allow adaptive timestep control. Consider
    increasing pipe sizes if persistent surcharging indicates an undersized system.; configure_simulation_options;
    ['Reduce ROUTING_STEP to 5-10 seconds', 'Add VARIABLE_STEP 0.75 to [OPTIONS] for adaptive timestep',
    'Check RPT surcharging summary — if many conduits are surcharged for >50% of wet-weather time, the
    system may be undersized', 'Consider using FORCE_MAIN_EQUATION H-W or D-W for pressurized segments'];
    Use VARIABLE_STEP for all dynamic wave simulations. Size pipes to avoid persistent surcharging.
  severity: degraded
- id: dt_018
  symptom: pyswmm throws an ImportError, AttributeError, or crashes with a segmentation fault when running
    the simulation. The INP file is valid and works in other SWMM interfaces.
  diagnosis: 'The installed pyswmm version bundles a SWMM engine version that is incompatible with the
    INP file format or the Python API calls being made.; Different pyswmm versions bundle different SWMM
    C engine versions: pyswmm 0.x bundled SWMM 5.1.x, pyswmm 1.x bundles SWMM 5.2.x. The SWMM 5.2 INP
    format has minor differences from 5.1 (new sections, changed defaults). Also, the pyswmm Python API
    changed significantly between 0.x and 1.x (class names, method signatures). Using pyswmm 0.x code
    with pyswmm 1.x installed (or vice versa) causes AttributeError or different behavior.

    ; [''pyswmm package version'', ''swmm-toolkit version'']'
  remedy: 'Check pyswmm version and ensure compatibility. For SWMM 5.2 INP files, use pyswmm >= 1.0.;
    ; ["python -c ''import pyswmm; print(pyswmm.__version__)''", ''For pyswmm 1.x: from pyswmm import
    Simulation (no Output class changes)'', ''For pyswmm 0.x: upgrade with pip install --upgrade pyswmm'',
    ''Ensure swmm-toolkit version matches: pip install swmm-toolkit==0.15.* for pyswmm 1.x'']; Pin pyswmm
    version in requirements.txt: pyswmm>=1.0,<2.0'
  severity: fatal
- id: dt_019
  symptom: SWMM warns or silently clips LID area. Reported LID performance (volume captured, runoff reduced)
    is lower than expected for the specified LID area. Or the remaining non-LID subcatchment area becomes
    negative.
  diagnosis: 'The total LID area assigned to a subcatchment (Number * Area across all LID types) exceeds
    the subcatchment''s total area.; In [LID_USAGE], each entry specifies Number (replicate units) * Area
    (per unit). If a subcatchment has 10,000 m2 and two LID assignments of 4,000 m2 and 7,000 m2 (total
    11,000 m2), the LID area exceeds the subcatchment. SWMM may issue a warning and clip the excess, but
    this is version-dependent. Some versions silently reduce the LID area. The result is that LID performance
    is lower than designed because less area is actually used.

    ; [''[LID_USAGE] — area assignments'', ''[SUBCATCHMENTS] — total area'']'
  remedy: 'Verify total LID area per subcatchment does not exceed subcatchment area. Reduce LID Number
    or Area if needed.; validate_lid_params; [''For each subcatchment, sum (Number * Area) across all
    LID_USAGE entries'', ''Compare with subcatchment total area from [SUBCATCHMENTS]'', ''If LID_total
    > subcatchment_area: reduce Number or Area'', ''Also check that from_imperv percentages sum to <=
    100%'']; Use validate_lid_params tool which checks this constraint automatically.'
  severity: fatal
- id: dt_020
  symptom: 'SWMM crashes at startup with ''ERROR: undefined time series [name]'' or runs but uses a constant
    boundary condition instead of the time-varying series. Outfall stage does not change during the simulation.'
  diagnosis: 'An outfall with type TIMESERIES references a time series name that is not defined in the
    [TIMESERIES] section, or the time series does not cover the simulation period.; When an outfall has
    Type=TIMESERIES, SWMM looks up the referenced time series name in [TIMESERIES]. If the name does not
    exist (typo, missing definition), SWMM reports a fatal error. If the time series exists but does not
    cover the full simulation period, SWMM uses the last known value for the remainder — which may be
    zero or an early-period value, causing wrong boundary conditions for the uncovered period.

    ; [''[OUTFALLS] — TIMESERIES type with data reference'', ''[TIMESERIES] — time series definitions'']'
  remedy: 'Verify the time series name in [OUTFALLS] matches exactly (case-sensitive) a name in [TIMESERIES].
    Verify the time series covers the simulation period.; validate_inp_file; [''Find the outfall with
    Type=TIMESERIES in [OUTFALLS]'', ''Get the Data field (time series name)'', ''Search [TIMESERIES]
    for that exact name (case-sensitive)'', ''If missing: add the time series definition or fix the name'',
    ''Verify time series covers simulation period: first entry <= START_DATE, last entry >= END_DATE''];
    Run validate_inp_file which checks all TIMESERIES references.'
  severity: fatal
- id: dt_021
  symptom: After SWMM simulation completes successfully via pyswmm, accessing Simulation.routing_error
    or Simulation.runoff_error raises AttributeError. The simulation itself ran fine — only post-processing
    of continuity errors fails.
  diagnosis: 'pyswmm v2.1.0 removed the .routing_error and .runoff_error attributes from the Simulation
    object. These were available in pyswmm 1.x but silently dropped in the v2 API refactor.; In pyswmm
    1.x, Simulation objects exposed .routing_error and .runoff_error as float attributes after the simulation
    finished. pyswmm 2.x removed these attributes without a deprecation warning. The continuity error
    information is still available — it is written to the .rpt (report) file that SWMM generates alongside
    the .out binary output. The fix is to parse the .rpt file instead of relying on the Python API attributes.

    ; [''pyswmm Simulation object API'', ''Post-simulation continuity error checking'']'
  remedy: 'Parse the .rpt file for continuity errors instead of accessing Simulation attributes. Use check_continuity_errors.py
    or manually grep the RPT file for ''Continuity Error''.; check_continuity_errors; [''Run simulation
    normally — it completes successfully'', ''Open the .rpt file (same name as .inp but with .rpt extension)'',
    "Search for ''Runoff Quantity Continuity'' and ''Flow Routing Continuity'' sections", ''Extract the
    percentage error from the last line of each section'', "Alternatively: use regex on RPT: r''Continuity
    Error.*?([\\d.]+)\\s*%''"]; Do not rely on pyswmm Simulation object attributes for error reporting.
    Always parse the .rpt file, which is stable across pyswmm versions.'
  severity: degraded
- id: dt_022_swmmanywhere_offline_and_continuity_obs
  symptom: 'swmmanywhere model build aborts in prepare_data.download_buildings_bbox with OSError ''AWS
    Error NETWORK_CONNECTION during HeadObject ... overturemaps-us-west-2 ... curlCode: 28 Timeout'' (or
    OSMNX/Overpass timeout); no INP produced, all metrics null. Or: obs_source/variable is continuity_error
    and the comparison is the model''s own mass-balance residual.'
  diagnosis: 'swmmanywhere''s data acquisition (Overture Maps S3, STAC catalog, OSMNX/Overpass, elevation)
    is entirely internet-bound and cannot run on the offline KDT server; no cached city geodata exists
    to substitute. Separately, continuity_error is a dag-declared self-diagnostic (dag.yaml: ''Self-diagnostic,
    not an observation''), so scoring it is a degenerate self-comparison.'
  remedy: Do not auto-build via swmmanywhere offline and do not validate continuity_error. Use a self-contained
    offline SWMM model (e.g. swmmanywhere/defs/bellinge_small.inp via pyswmm) AND a genuine field observable
    per the dag — link_flow at a gauged outfall/trunk, node_depth_head at an instrumented manhole, or
    node_flooding events — for a basin where both the model and the observation exist on disk. If swmmanywhere
    auto-build is required, the server needs network egress to Overture Maps/Overpass (requires_data).
- id: dt_022
  symptom: swmmanywhere-built SWMM runs to completion but Runoff Quantity Continuity Error in the .rpt
    is 'nan' (continuity_has_nan=true), while Flow Routing Continuity is finite; flooring DEM-flat %Slope
    did not fix it.
  diagnosis: swmmanywhere's swmm_conversion.yml writes [SUBAREAS] Manning's n=0 for all subcatchments.
    Overland alpha = 1.49*W*sqrt(S)/(A*n) = x/0 = +inf for every positive-slope cell, which SWMM propagates
    to NaN ponded depth -> NaN runoff continuity. Slope is NOT the governing zero; n is.
  remedy: Floor [SUBAREAS] N-Imperv and N-Perv to a small positive value (0.01) after the swmmanywhere
    rebuild (run_city_swmm._floor_subarea_manning), in addition to the %Slope floor. Re-read .rpt continuity
    after swmm_end.
- id: dt_swmmanywhere_imperv_overshoot
  symptom: swmmanywhere-built SWMM model runs but Runoff-Quantity Continuity Error in the .rpt is 'nan'
    with 'Final Storage = nan', while Total Precipitation/Surface Runoff/Infiltration/Evaporation are
    all finite and Flow Routing continuity is finite. n and %Slope floors did not fix it.
  diagnosis: swmmanywhere's derive_rc emits [SUBCATCHMENTS] %Imperv slightly over 100 (float ULP, e.g.
    100.00000000000003). %Imperv>100 gives a negative pervious subarea area (Area*(100-%Imperv)/100<0);
    SWMM's overland nonlinear reservoir raises a negative ponded depth to the 5/3 power -> NaN ponded
    depth -> NaN Final Storage -> NaN model-wide runoff continuity. SWMM does not validate/clamp %Imperv.
  remedy: Clamp [SUBCATCHMENTS] %Imperv (0-based column 4) into [0,100] in place before running, alongside
    the existing %Slope and Manning-n floors (run_city_swmm._clamp_subcatchment_imperv). Then both continuity
    terms are finite and scorable.
- id: dt_023
  symptom: SWMM rain made from VIC forcing files (the former convert_vic_forcing_to_swmm tool) has values
    of about 20 to 30 in every step in summer, never a dry step, and negative values in winter. The run
    ends without an error and the runoff volume is far too large.
  diagnosis: 'The tool read column 0 of the VIC forcing file as rain. In this server''s VIC forcing files
    column 0 is air temperature (rain is column 1), so the SWMM rain series was air temperature.; The
    KI made its input out of another model''s input files. The tool''s docstring, docs/s3_rainfall_forcing_skill.md
    (column 4) and docs/model_couplings.yaml (column 5) gave three different column numbers and none was
    checked against a real file. A rain series that is never zero and follows the daily temperature cycle
    is the mark of this fault.

    ; [''tools/s3_rainfall_forcing/convert_vic_forcing_to_swmm.py (removed 2026-10-02)'', ''[TIMESERIES]
    rainfall values'']'
  remedy: Build the rain straight from the data source with tools/s3_rainfall_forcing/build_rain_timeseries_from_source.py
    (--source cmfd|mswx|nasa_power). Never build SWMM rain from VIC forcing files or from any other model's
    input files. The removed tool is kept outside the KI at models/SWMM/_removed_vic_input_tools_20261002/
    and must not be brought back.; build_rain_timeseries_from_source; ['Run build_rain_timeseries_from_source
    for the gage point and period', 'Compare total_mm in the summary file with a known total for the place
    and month', 'Check that most steps of the series are dry (rows are written only for steps with rain)'];
    A model KI builds its input from the data source with its own tool, through ki_tools_common.load_forcing.
    Results of another model (VIC runoff as inflow) are a coupling and stay in tools/s7_model_coupling.
  severity: silent
- id: dt_024
  symptom: A 3-hourly (CMFD / MSWX) or hourly (NASA POWER) rain series is in the model, the run ends without
    an error, but 'Total Precipitation' in the .rpt is a small part of the series total (1/36 for 3-hourly
    data, 1/12 for hourly data).
  diagnosis: 'The [RAINGAGES] INTERVAL is not the data step. The swmmanywhere city model ships a 5-minute
    design-storm gage (INTERVAL 00:05); with that INTERVAL kept, SWMM holds each rain value for 5 minutes
    instead of 3 hours.; For a rain gage SWMM applies each value for one INTERVAL from its time stamp
    and reads the rest of the gap to the next row as no rain. With FORMAT INTENSITY and a 3-hourly series,
    INTERVAL 0:05 keeps 5/180 of the depth. The same loss happens with FORMAT VOLUME, because the depth
    is then taken as falling in 5 minutes, which also gives a 36 times too high peak rate.

    ; [''[RAINGAGES] INTERVAL'', ''tools/run_city_swmm.py --rain_interval'']'
  remedy: Use the INTERVAL and FORMAT that build_rain_timeseries_from_source printed (3:00 for cmfd /
    mswx, 1:00 for nasa_power; also in <output>.summary.json). For the city model pass them to run_city_swmm.py
    with --rain_dat --rain_interval --rain_format; do not edit the .inp by hand.; run_city_swmm; ['Read
    raingage_interval and raingage_format from the rain summary file', 'Run run_city_swmm.py with --rain_dat,
    --rain_interval, --rain_format', 'Check rain_applied_ok in its result (rain depth in the .rpt equals
    the depth in the .dat within 1 %)']; run_city_swmm.py refuses a series whose rows are closer together
    than --rain_interval and reports rain_applied_ok after the run.
  severity: silent
- id: dt_025
  symptom: An agent that needs real rain for a place with no gauge finds no tool that reads CMFD, MSWX
    or NASA POWER. SKILL.md said to call load_daily_forcing and then convert_vic_forcing_to_swmm, which
    fails ('Directory not found' / no forcing file for the cell) because that tool only read VIC forcing
    files and cannot take the loader's output.
  diagnosis: 'The KI had no tool that reads a gridded forcing source. The only non-gauge path went through
    VIC forcing files, and the documented loader call returned daily data, which is too coarse for SWMM
    (a day total hides the storm peak).; Without a direct tool the agent either runs the VIC forcing preparation
