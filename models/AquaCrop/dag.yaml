outputs:
  - var: "DryYield"
    validation_rank: 1
    unit: "t/ha"
    description: "Final dry above-ground grain (or harvestable organ) yield per growing season."
    emitted_in: "final_stats DataFrame (column 'Dry yield')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Field-trial yield assumes co-located weather, soil, and management; mismatch in any input invalidates the comparison."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats:
            - "Multi-year point yields carry a small technology trend even at one site; consider detrending if comparing decades."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "National/sub-national yield aggregates (e.g., FAOSTAT) are dominated by a technology trend a weather-only model cannot reproduce; raw NSE/r against the inter-annual series is scientifically inappropriate. Use detrended residuals or decadal-mean PBIAS."
            - "AquaCrop-OSPy does not model N limitation, so aggregates from fertilizer-limited regions will be biased high unless WP* and CCx are calibrated down."
      detrending_options: ["none", "linear_residual", "decadal_mean"]
  - var: "FreshYield"
    validation_rank: 2
    unit: "t/ha"
    description: "Crop fresh-weight yield = DryYield / (YldWC/100); reflects harvest moisture content."
    emitted_in: "final_stats DataFrame (column 'Fresh yield')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Comparable only when the obs reports fresh-weight at the same moisture basis as the model's YldWC parameter."
      detrending_options: ["none"]
  - var: "biomass"
    validation_rank: 3
    unit: "t/ha"
    description: "Cumulative above-ground dry biomass over the growing season."
    emitted_in: "crop_growth DataFrame (daily; final value also in final_stats)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats:
            - "Destructive biomass samples are sparse; compare to interpolated obs only if intermediate values are documented."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
      detrending_options: ["none"]
  - var: "canopy_cover"
    validation_rank: 5
    unit: "fraction"
    description: "Daily green canopy cover from CGC expansion through CCx plateau and CDC decline."
    emitted_in: "crop_growth DataFrame (column 'canopy_cover')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Remote-sensing fAPAR / NDVI proxies for CC require a sensor-to-CC mapping; raw NDVI is not directly comparable."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Point model cannot match within-pixel spatial variability; compare to pixel-aggregated CC only."
      detrending_options: ["none"]
  - var: "Tr"
    validation_rank: 6
    unit: "mm/day"
    description: "Actual daily crop transpiration after water, aeration, temperature, and CO2 stress."
    emitted_in: "water_flux DataFrame (column 'Tr')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Sap-flow and lysimeter Tr observations have non-trivial measurement uncertainty; magnitude-accuracy thresholds should reflect this."
      detrending_options: ["none"]
  - var: "Es"
    validation_rank: 7
    unit: "mm/day"
    description: "Actual daily soil evaporation from the FAO two-stage scheme."
    emitted_in: "water_flux DataFrame (column 'Es')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Direct Es measurements are rare; ET-partitioning obs typically yield Es as a residual with high uncertainty."
      detrending_options: ["none"]
  - var: "ET_actual"
    validation_rank: 4
    unit: "mm/day"
    description: "Actual evapotranspiration = Es + Tr (derived sum of soil evaporation and crop transpiration)."
    emitted_in: "water_flux DataFrame (Es + Tr columns)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Eddy-covariance ET often has energy-balance closure issues; flux footprint may not match the point model footprint."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Remote-sensing ET products (e.g., MOD16, GLEAM) carry algorithm-specific biases; treat as a soft constraint."
      detrending_options: ["none"]
  - var: "Wr"
    validation_rank: 8
    unit: "mm"
    description: "Total water in the root zone, integrated over current rooting depth."
    emitted_in: "water_flux DataFrame (column 'Wr')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "In-situ root-zone soil moisture from sensor stacks must be vertically integrated over the same depth as model z_root."
      detrending_options: ["none"]
  - var: "th_per_compartment"
    validation_rank: 9
    unit: "m^3/m^3"
    description: "Volumetric water content per soil compartment (th1..thN) over the simulated profile."
    emitted_in: "water_storage DataFrame (columns th1..thN)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Sensor depth must align with compartment midpoint; calibration of sensor-to-volumetric mapping is non-trivial."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Satellite surface soil moisture (e.g., SMAP) corresponds only to the topmost compartment, not the integrated profile."
      detrending_options: ["none"]
  - var: "Runoff"
    validation_rank: 10
    unit: "mm/day"
    description: "Surface runoff partitioned by SCS curve-number method, modified by FieldMngt options."
    emitted_in: "water_flux DataFrame (column 'Runoff')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "event_detection"]
          determining_metric: "csi"
          caveats:
            - "Field plot runoff measurements are needed; basin-scale gauges integrate signals AquaCrop does not simulate."
      detrending_options: ["none"]
  - var: "DeepPerc"
    validation_rank: 11
    unit: "mm/day"
    description: "Deep percolation below the soil profile from tau-based drainage."
    emitted_in: "water_flux DataFrame (column 'DeepPerc')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Lysimeter drainage is the most direct comparison; basin-scale groundwater recharge mixes contributions from outside the modeled point."
      detrending_options: ["none"]
  - var: "z_root"
    validation_rank: 12
    unit: "m"
    description: "Current effective crop rooting depth in the soil profile."
    emitted_in: "crop_growth DataFrame (column 'z_root')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "timing_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Destructive root-depth measurements are sparse; compare to envelope traces, not daily values."
      detrending_options: ["none"]
  - var: "harvest_index"
    validation_rank: 13
    unit: "fraction"
    description: "Reference crop harvest index build-up over the yield-formation window (no stress)."
    emitted_in: "crop_growth DataFrame (column 'harvest_index')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
      detrending_options: ["none"]
  - var: "harvest_index_adj"
    validation_rank: 14
    unit: "fraction"
    description: "Stress-adjusted harvest index actually used for yield (pollination heat/cold, pre- and post-anthesis water stress)."
    emitted_in: "crop_growth DataFrame (column 'harvest_index_adj')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
      detrending_options: ["none"]
  - var: "gdd_cum"
    validation_rank: 15
    unit: "deg C-day"
    description: "Cumulative growing degree days from planting."
    emitted_in: "crop_growth DataFrame (column 'gdd_cum')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["timing_accuracy", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Derived from weather; comparison is meaningful only as a consistency check on Tbase/Tupp."
      detrending_options: ["none"]

influence:
  _caveat: "AquaCrop SA literature (vanuytrecht2014, xing2017, wang2018, silvestro2017, akbari2024) almost exclusively varies crop/soil parameters under fixed weather and irrigation regimes. Boundary forcings (precipitation, ET0) and management levers (irrigation depth/timing) are mechanistically dominant for yield but cannot be graded HIGH from this literature; they remain MEDIUM by convention until paper-quantitative weather/management SA on AquaCrop emerges."
  edges:
    - from: "CCx (maximum canopy cover)"
      to: "DryYield"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations:
        - "vanuytrecht2014_aquacrop_gsa"
        - "xing2017_aquacrop_efast_wheat"
        - "wang2018_aquacrop_efast_meteorology"
        - "akbari2024_aquacrop_silage_maize"
