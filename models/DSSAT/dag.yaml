      doi: "10.11975/j.issn.1002-6819.2015.14.020"
      note: "Global SA of DSSAT-CERES-Wheat cultivar/ecotype parameters using Morris screening and EFAST variance-based; phenology dominated by P1D, P1, P2, VEFF and yield by G2, G1, P1D."
