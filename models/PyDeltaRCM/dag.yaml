safety:
  hazards:
    - id: "C0_percent_fraction_vs_percent"
      kind: "control_semantic"
      description: "C0_percent authored as a fraction (e.g. 0.001) instead of percent (0.1); internally C0 = C0_percent/100 makes sediment supply ~100x too low and no delta forms. (dt_001)"
      severity: "silent"
    - id: "SLR_unit_mmyr_vs_mps"
      kind: "control_semantic"
      description: "SLR given in mm/yr instead of m/s of model time; a few mm/yr passed as m/s floods the basin instantly, while a correct O(1e-9) value looks like zero change. (dt_002)"
      severity: "silent"
    - id: "subsidence_unit_or_time_mismatch"
      kind: "control_semantic"
      description: "start_subsidence in years not seconds, or subsidence_rate in mm/yr not m/s; subsidence then starts immediately/never or has absurd magnitude. (dt_003)"
      severity: "silent"
    - id: "save_dt_seconds_vs_days"
      kind: "control_semantic"
      description: "save_dt is in seconds of model time, not days; a user wanting daily output who sets save_dt=1 gets per-second frames (millions of timesteps of output), while save_dt=86400 is correct for daily. (dt_004)"
      severity: "silent"
    - id: "spatial_dims_non_meters"
      kind: "control_semantic"
      description: "Length/Width in km or dx in cm instead of meters; domain becomes tiny or enormous, causing MemoryError or an instant finish. (dt_005)"
      severity: "fatal_or_silent"
    - id: "gamma_stability_exceeded"
      kind: "numerical_instability"
      description: "gamma = g*S0*dx/u0^2 > 0.1 makes routing weights over-sensitive, producing free-surface oscillation, NaNs, and crashes; reduce dx or S0, or raise u0. (dt_006)"
      severity: "fatal_or_silent"
    - id: "Np_water_too_low"
      kind: "numerical_instability"
      description: "Np_water too low for the grid leaves unvisited cells, producing a checkerboard/noisy free surface (>= wet_cells/10 recommended). (dt_007)"
      severity: "degraded"
    - id: "dx_geometry_invalid"
      kind: "control_semantic"
      description: "dx >= Length/Width or dx <= 0 raises ValueError at init; keep 0 < dx < Length and dx < Width. (dt_008)"
      severity: "fatal"
    - id: "inlet_underresolved"
      kind: "control_semantic"
      description: "N0_meters/dx < 3 under-resolves the inlet (also silently floored to 3 cells / capped at W//4), distorting inlet geometry vs requested. (dt_009)"
      severity: "silent"
    - id: "yaml_key_misspelled_or_wrong_type"
      kind: "parser_semantic"
      description: "Misspelled or wrong-case YAML key (e.g. 'length' vs 'Length') is silently ignored; a quoted numeric raises a TypeError at config load. (dt_010, dt_011)"
      severity: "fatal_or_silent"
    - id: "f_bedload_extremes"
      kind: "control_semantic"
      description: "f_bedload set to 0 or 1 makes the delta all-mud or all-sand; natural deltas are 0.2-0.7. (dt_012)"
      severity: "silent"
    - id: "routing_over_channelization"
      kind: "control_semantic"
      description: "theta_water or coeff_theta_sand set too high over-concentrates flow into the deepest path, yielding a single narrow channel with no bifurcation/distributary network; lower theta_water toward 0.5 or raise Np_water. (dt_014)"
      severity: "silent"
    - id: "no_save_grids_empty_output"
      kind: "control_semantic"
      description: "With no save_<var>_grids flag enabled, the model runs but writes a coordinates-only NetCDF with no usable data variables. (dt_015)"
      severity: "silent"
    - id: "silent_inlet_geometry_override"
      kind: "initial_condition_semantic"
      description: "init_tools silently caps realized inlet length L0 at L//4 and inlet width N0 at [3, W//4], so the realized inlet geometry can differ from the requested L0_meters/N0_meters."
      severity: "silent"
  validation_limits:
    - "Reduced-complexity, rule-based hydrodynamics — not a momentum/shallow-water solver; absolute velocities, stage, and discharge are statistical proxies, not physically resolved fields."
    - "Single bankfull discharge with collapsed hydrograph; cannot resolve flood-event variability, sub-bankfull flow, or sub-daily processes."
    - "Single inlet channel into an idealized rectangular basin; no native multi-distributary inlets, tides, waves, or longshore transport."
    - "Stochastic parcel realization: a single run is one draw; ensembles/fixed seeds are needed for reproducible or statistically meaningful comparison."
  warnings:
    - "Velocity is hard-capped at u_max = 2*u0 by the flow limiter; peak velocities are intentionally not resolved."
    - "Per-step deposition/erosion is capped at 1/4 of local cell water volume, limiting per-timestep bed change."
    - "Reproducible custom code must use the model's get_random_uniform (numba RNG), not numpy/scipy random generators."
    - "Calling delta.update() after delta.finalize() raises RuntimeError; finalize() must be called once after the update loop."
    - "Changing u0/h0/N0/C0 silently re-derives the timestep dt = dVs/Qs0 and re-initializes the sediment routers; direct attribute mutation that bypasses the property setters leaves stale jitclass router constants."
  assumptions:
    - statement: "The model is point-/event-driven on a single bankfull discharge; the hydrograph is collapsed to one discharge and mapped to real years via an intermittency factor applied at config time."
      scope: "all temporal interpretation of model output"
      source: "pyDeltaRCM Model Time docs (deltarcm.org/pyDeltaRCM/info/modeltime.html)"
      status: adopted
    - statement: "Conservation closure is on sediment volume (Delta_eta = Delta_V/dx^2) with water depth and velocity adjusted by continuity; the free surface is a smoothed statistical reconstruction, not an energy-conserving solution."
      scope: "boundary.closure and stage/velocity outputs"
      source: "pyDeltaRCM Morphodynamics + Hydrodynamics docs (deltarcm.org/pyDeltaRCM/info/morphodynamics.html, info/hydrodynamics.html)"
      status: adopted
    - statement: "Sand is routed as bed-material load with a Meyer-Peter & Muller (1948) capacity q_s_cap = q_s0 (u_loc/u0)^beta; mud is fully suspended load with velocity-threshold deposition/erosion and no transport capacity."
      scope: "sediment-routing modules (SandRouter, MudRouter)"
      source: "pyDeltaRCM Morphodynamics docs (deltarcm.org/pyDeltaRCM/info/morphodynamics.html)"
      status: adopted
    - statement: "The emitted NetCDF 'discharge' variable carries volume-rate units (m3/s, CF channel_water_flowing__volume_rate); the model's internal qw field is per-unit-cell-width discharge (m2/s = sqrt(qx^2+qy^2)). The outputs block describes the emitted m3/s variable; comparisons must use m3/s observations, not the internal m2/s field."
      scope: "outputs.discharge unit interpretation"
      source: "pyDeltaRCM source output_variables schema (save_discharge_grids) and CF standard-name channel_water_flowing__volume_rate"
      status: adopted
    - statement: "Literature sensitivity grades rest on controlled one/few-at-a-time parameter sweeps and Kullback-Leibler metric ranking (Liang 2016), not formal variance-based indices; all influence edges are therefore capped below HIGH."
      scope: "influence block grading"
      source: "Liang et al. 2016 (doi:10.1002/2015JF003653); no Sobol/Morris/EFAST study exists for DeltaRCM"
      status: adopted

medium_evidence:
  - var: "velocity"
    source: "docs/s2_water_routing.md"
    quote: "Route water parcels through the domain using weighted random walks to compute the free water surface, flow velocities, and discharge field for the current timestep."
    note: "Water-routing documentation identifies the velocity output as a water-flow field."
