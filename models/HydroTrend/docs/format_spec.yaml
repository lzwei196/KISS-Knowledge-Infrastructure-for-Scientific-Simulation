  diagnosis: docs/03_input_file_assembly.md requires HYDRO.IN line 3 to end with a slash. HydroTrend uses
    the line 3 path while writing outputs, so a missing trailing slash can redirect files to an unintended
    concatenated path.
  remedy: Edit HYDRO.IN line 3 so the output directory exists, is writable, and ends with '/'. Rerun tools/run_hydrotrend.py
