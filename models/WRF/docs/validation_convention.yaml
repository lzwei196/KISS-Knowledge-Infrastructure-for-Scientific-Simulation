schema_version: 1
model_id: WRF
domain: atmosphere
generated_by: "Step-B validation-convention agent"
generated_at: 2026-08-14

# This convention is keyed by the model's own dag.yaml output names. WRF
# literature mostly uses NWP verification metrics (RMSE, MAE, bias,
# correlation, categorical event scores) rather than hydrologic NSE tiers.
# Null bands mean the fetched literature did not provide a numeric pass
# threshold for that exact dag_variable and obs_shape.

