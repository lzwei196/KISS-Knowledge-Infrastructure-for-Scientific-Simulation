# HexWatershed Diagnostic Triplets
# Each entry: symptom → diagnosis → remedy
# Failure domains: unit_conversion, parameter_format, dependency, algorithm, runtime, silent_error

- id: dt_001
  stage: s3_execution
  failure_domain: algorithm
  symptom:
    description: "Output elevations differ from input DEM values in valley/depression areas"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Depression filling raises cells to pour-point elevation"
    explanation: >
      The Priority-Flood algorithm modifies dElevation_mean by filling local
      depressions. This is intentional — it ensures every cell has a valid
      downslope path. The original DEM is preserved in dElevation_raw.
    affected_components: [compset_depression.cpp, hexagon.dElevation_mean]
  remedy:
    action: "Use dElevation_raw for comparison; dElevation_mean is the corrected surface"
    manual_steps:
      - "Compare dElevation_raw (original) vs dElevation_mean (filled)"
      - "Differences indicate depressions that were filled"
    prevention: "Document this behavior for downstream users of the elevation data"
  severity: silent

- id: dt_002
  stage: s4_output
  failure_domain: unit_conversion
  symptom:
    description: "Drainage area values are unreasonably small (single-digit numbers for large watersheds)"
    detection_method: value_comparison
  diagnosis:
    root_cause: "dAccumulation stores cell COUNT, not drainage area in m²"
    explanation: >
      Flow accumulation in HexWatershed counts the number of upstream cells,
      not the upstream contributing area. A value of 100 means 100 cells drain
      to this point. To get area: multiply by mean cell area (dArea).
    affected_components: [compset_run.cpp, hexagon.dAccumulation]
  remedy:
    action: "Multiply dAccumulation by mean cell area (m²) to get drainage area"
    tool_to_run: output_parser.py --compute-area
    manual_steps:
      - "drainage_area_m2 = dAccumulation * mean_cell_area"
      - "drainage_area_km2 = drainage_area_m2 / 1e6"
    prevention: "Always use --compute-area flag in output_parser.py"
  severity: silent

- id: dt_003
  stage: s4_output
  failure_domain: unit_conversion
  symptom:
    description: "Slope values appear extremely small (0.001-0.1) for mountainous terrain"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Slope is a unitless ratio (rise/run), not degrees or percent"
    explanation: >
      All slope outputs are computed as elevation_difference / horizontal_distance,
      producing a dimensionless ratio. A slope of 0.1 = 10% grade = 5.7 degrees.
      Users expecting degrees will interpret 0.1 as nearly flat, when it's actually
      moderately steep.
    affected_components: [compset_direction.cpp, hexagon.dSlope_between]
  remedy:
    action: "Convert to desired units: degrees = atan(ratio) * 180/pi; percent = ratio * 100"
    manual_steps:
      - "import math"
      - "slope_deg = math.degrees(math.atan(slope_ratio))"
      - "slope_pct = slope_ratio * 100"
    prevention: "Label all slope outputs with 'ratio' suffix; convert only at visualization"
  severity: silent

- id: dt_004
  stage: s2_flowline
  failure_domain: dependency
  symptom:
    description: "Stream burning enabled but flow directions ignore known channels"
    error_pattern: "No error — model runs but streams are not burned in"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Raw flowline shapefiles lack cell-to-stream mapping required by HexWatershed"
    explanation: >
      HexWatershed expects topologically ordered flowlines with cell IDs mapped
      to each stream segment. This preprocessing is done by PyFlowline. Providing
      raw NHDPlus or HydroSHEDS shapefiles directly will cause the stream burning
      to fail silently — the model runs but streams are ignored.
    affected_components: [compset_stream.cpp, sFilename_flowline_topo]
  remedy:
    action: "Preprocess flowlines with PyFlowline before running HexWatershed"
    manual_steps:
      - "pip install pyflowline"
      - "Use pyflowline to generate topological flowline with cell mapping"
      - "Provide the pyflowline output path in basin JSON"
    prevention: "Always use PyFlowline pipeline; never pass raw shapefiles directly"
  severity: fatal

- id: dt_005
  stage: s1_mesh
  failure_domain: parameter_format
  symptom:
    description: "Segfault or garbage topology when running the model"
    error_pattern: "Segmentation fault|std::bad_alloc|invalid neighbor"
    detection_method: log_match
  diagnosis:
    root_cause: "sMesh_type in config does not match the structure of the mesh JSON"
    explanation: >
      Each mesh type (hexagon, square, mpas, etc.) has a different JSON structure
      and parser. If the config says 'mpas' but the mesh was generated as 'hexagon',
      the parser will misinterpret cell connectivity, causing crashes or silent
      topology errors.
    affected_components: [domain_read.cpp, parameter.h.sMesh_type]
  remedy:
    action: "Ensure sMesh_type matches the actual mesh JSON format"
    manual_steps:
      - "Check mesh JSON header for mesh type"
      - "Match sMesh_type parameter to the mesh generator used"
    prevention: "Record mesh type during mesh generation; validate before execution"
  severity: fatal

- id: dt_006
  stage: s1_mesh
  failure_domain: unit_conversion
  symptom:
    description: "All distances and areas are nonsensical (very large or very small)"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Mesh coordinates are in projected CRS (meters) instead of geographic degrees"
    explanation: >
      HexWatershed converts geographic coordinates (degrees) to 3D Cartesian
      for distance calculations. If coordinates are already in meters (e.g., UTM),
      the model interprets them as degrees — longitude 500000 degrees is meaningless.
      All distances, areas, and slopes will be wildly wrong.
    affected_components: [conversion.cpp, hexagon.dLongitude_center_degree]
  remedy:
    action: "Reproject DEM and mesh to EPSG:4326 (geographic CRS)"
    manual_steps:
      - "gdalwarp -t_srs EPSG:4326 input_projected.tif output_gcs.tif"
      - "Regenerate mesh from the reprojected DEM"
    prevention: "Always verify CRS before mesh generation: gdalinfo dem.tif | grep AUTHORITY"
  severity: fatal

- id: dt_007
  stage: s0_config
  failure_domain: parameter_format
  symptom:
    description: "Stream network is either too dense (every cell is a stream) or too sparse (no streams)"
    detection_method: value_comparison
  diagnosis:
    root_cause: "dAccumulation_threshold has dual interpretation: ratio (<1) vs absolute (>=1)"
    explanation: >
      If dAccumulation_threshold < 1.0, it's treated as a ratio of the maximum
      accumulation (0.01 = top 1%). If >= 1.0, it's an absolute cell count.
      Setting threshold to 100 means "cells with 100+ upstream cells", while
      0.001 means "top 0.1% of drainage area". Accidentally using the wrong
      interpretation produces wildly different stream networks.
    affected_components: [compset_run.cpp, parameter.dAccumulation_threshold]
  remedy:
    action: "Check if your intended threshold is a ratio or absolute count"
    manual_steps:
      - "For ratio: use 0.001 to 0.1 (typical: 0.01)"
      - "For absolute: use integer >= 1 (e.g., 100, 1000)"
      - "Verify by counting stream cells in output"
    prevention: "Document threshold interpretation in config file comments"
  severity: degraded

- id: dt_008
  stage: s0_config
  failure_domain: parameter_format
  symptom:
    description: "Model runs successfully but produces no watershed output files"
    detection_method: value_comparison
  diagnosis:
    root_cause: "lCellID_outlet in basin JSON does not match any cell in the mesh"
    explanation: >
      The outlet cell ID must exactly correspond to a cell in the mesh JSON.
      If no cell has that ID, the watershed is silently skipped — no error
      message, no output file. This is the most common cause of 'successful
      run with no results'.
    affected_components: [domain_read.cpp, basin.lCellID_outlet]
  remedy:
    action: "Verify outlet cell ID exists in mesh; use flowline_converter with --mesh-json"
    tool_to_run: flowline_converter.py --mesh-json mesh.json
    manual_steps:
      - "python3 -c \"import json; ids={c['lCellID'] for c in json.load(open('mesh.json'))['aCells']}; print(42567 in ids)\""
      - "If False, use flowline_converter.py to find nearest cell"
    prevention: "Always auto-detect outlet cell from coordinates + mesh"
  severity: silent

- id: dt_009
  stage: s0_config
  failure_domain: parameter_format
  symptom:
    description: "No VTK file generated for 3D visualization"
    detection_method: value_comparison
  diagnosis:
    root_cause: "iFlag_vtk defaults to 0; must be explicitly set to 1"
    explanation: >
      VTK output is not generated by default. Users expecting 3D visualization
      files will find none unless they explicitly enable the flag.
    affected_components: [compset_export.cpp, parameter.iFlag_vtk]
  remedy:
    action: "Set iFlag_vtk = 1 in configuration JSON"
    manual_steps:
      - "Add \"iFlag_vtk\": 1 to config JSON"
      - "Re-run the model"
    prevention: "Include iFlag_vtk in standard config templates"
  severity: degraded

- id: dt_010
  stage: s0_config
  failure_domain: parameter_format
  symptom:
    description: "Subbasin output missing hillslope columns (left/right/headwater)"
    detection_method: value_comparison
  diagnosis:
    root_cause: "iFlag_hillslope defaults to 0; hillslope analysis requires explicit flag"
    explanation: >
      Hillslope decomposition (left, right, headwater) is computationally expensive
      and disabled by default. Without it, subbasin characteristics lack hillslope
      dimensions, areas, slopes, and elevation profiles.
    affected_components: [compset_run.cpp, parameter.iFlag_hillslope]
  remedy:
    action: "Set iFlag_hillslope = 1 in configuration JSON and re-run"
    manual_steps:
      - "Add \"iFlag_hillslope\": 1 to config JSON"
      - "Re-run the model"
    prevention: "Enable by default for detailed subbasin analysis"
  severity: degraded

- id: dt_011
  stage: s1_mesh
  failure_domain: unit_conversion
  symptom:
    description: "Drainage density is 10^6 times too large or watershed area unrealistically small"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Cell area (dArea) is in km² instead of required m²"
    explanation: >
      HexWatershed expects cell area in square meters. If a GIS tool exports
      area in km², the value is 10^6 times too small. A 5km hex cell should
      have dArea ≈ 21,650,000 m², not 21.65. All area-based metrics (drainage
      density, watershed area) inherit this error.
    affected_components: [hexagon.dArea, watershed.dArea]
  remedy:
    action: "Multiply cell areas by 1e6 to convert km² to m²"
    manual_steps:
      - "Check: a 5km hex should have area ~21.65e6 m²"
      - "If values are ~21.65, they're in km² — multiply by 1e6"
    prevention: "Validate cell areas before running: area should be >> 1000 for any reasonable mesh"
  severity: silent

- id: dt_012
  stage: s1_mesh
  failure_domain: unit_conversion
  symptom:
    description: "All slopes are extremely steep (>10) or extremely flat (<0.0001)"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Neighbor distances (aNeighbor_distance) in wrong units (km or degrees instead of meters)"
    explanation: >
      Slope = elevation_diff / distance. If distance is in km instead of m,
      slopes are 1000x too steep. If distance is in degrees instead of m,
      slopes are ~111,000x too steep. Both produce physically impossible values.
    affected_components: [hexagon.aNeighbor_distance, compset_direction.cpp]
  remedy:
    action: "Ensure aNeighbor_distance values are in meters"
    manual_steps:
      - "Check: for a 5km mesh, neighbor distances should be ~5000 m"
      - "If values are ~5, they're in km — multiply by 1000"
      - "If values are ~0.045, they're in degrees — convert to meters"
    prevention: "Validate neighbor distances during mesh generation"
  severity: silent

- id: dt_013
  stage: s3_execution
  failure_domain: unit_conversion
  symptom:
    description: "Slopes are ~3x too steep compared to reference data"
    detection_method: value_comparison
  diagnosis:
    root_cause: "DEM elevation values are in feet instead of meters"
    explanation: >
      USGS NED and some other DEMs provide elevation in feet. Since
      HexWatershed assumes meters, slopes (Δz/Δd) are inflated by 3.28x.
      Depression filling also behaves incorrectly because fill depths
      are measured in feet but compared as meters.
    affected_components: [hexagon.dElevation_mean, compset_depression.cpp]
  remedy:
    action: "Convert DEM from feet to meters before mesh generation"
    manual_steps:
      - "gdal_calc.py -A input_ft.tif --outfile=output_m.tif --calc='A*0.3048'"
      - "Regenerate mesh with meters-based DEM"
    prevention: "Always verify DEM units: check max/min values against known elevations"
  severity: silent

- id: dt_014
  stage: s0_config
  failure_domain: parameter_format
  symptom:
    description: "Large holes in watershed with valid terrain data missing"
    error_pattern: "Cells with valid elevation treated as nodata"
    detection_method: value_comparison
  diagnosis:
    root_cause: "dMissing_value_dem does not match actual DEM nodata value"
    explanation: >
      If the config sets dMissing_value_dem = -9999.0 but the DEM uses
      -3.4028235e+38 (float minimum) as nodata, no cells will be excluded.
      Conversely, if the DEM uses -9999.0 but config uses -32768, valid
      cells near -9999 elevation will be incorrectly retained.
    affected_components: [domain_read.cpp, parameter.dMissing_value_dem]
  remedy:
    action: "Set dMissing_value_dem to match the exact DEM nodata value"
    manual_steps:
      - "gdalinfo dem.tif | grep NoData"
      - "Set dMissing_value_dem to that exact value"
    prevention: "Auto-detect nodata from DEM metadata in preprocessing"
  severity: fatal

- id: dt_015
  stage: s2_flowline
  failure_domain: unit_conversion
  symptom:
    description: "Stream burning enabled but has no visible effect on flow directions"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Flowline coordinates are in projected CRS, not matching mesh GCS coordinates"
    explanation: >
      Flowlines in UTM (coordinates like 500000, 4000000) will not intersect
      mesh cells in GCS (coordinates like -76.5, 39.2). The burning algorithm
      finds no cell matches and silently skips all flowline segments.
    affected_components: [compset_stream.cpp, flowline coordinates]
  remedy:
    action: "Reproject flowlines to EPSG:4326"
    manual_steps:
      - "ogr2ogr -t_srs EPSG:4326 output.shp input_utm.shp"
      - "Verify: ogrinfo output.shp -al -so | grep AUTHORITY"
    prevention: "Always check CRS of both mesh and flowlines before running"
  severity: fatal

- id: dt_016
  stage: s4_output
  failure_domain: unit_conversion
  symptom:
    description: "Drainage density is ~1,000,000 km/km² (physically impossible)"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Computing density from meters without converting to km"
    explanation: >
      Drainage density = total_stream_length / watershed_area. If length is
      in meters and area is in m², the result is in m/m² = m⁻¹. To get the
      standard km/km² = km⁻¹, convert: (length_m/1000) / (area_m²/1e6).
      Forgetting both conversions gives values 1000x too large.
    affected_components: [output_parser.py, watershed characteristics]
  remedy:
    action: "Convert length to km and area to km² before computing density"
    manual_steps:
      - "density_km_per_km2 = (length_m / 1000) / (area_m2 / 1e6)"
      - "Typical range: 0.5-10 km/km²"
    prevention: "Use output_parser.py which handles unit conversion automatically"
  severity: silent

- id: dt_017
  stage: s3_execution
  failure_domain: algorithm
  symptom:
    description: "Stream network is disconnected with gaps at road crossings or mesh artifacts"
    detection_method: value_comparison
  diagnosis:
    root_cause: "dBreach_threshold = 0 disables the breaching algorithm"
    explanation: >
      The breaching algorithm corrects flow at locations where artificial
      barriers (roads, levees, mesh artifacts) block stream connectivity.
      With threshold = 0, no corrections are applied, and streams become
      disconnected wherever the DEM has local ridges crossing channels.
    affected_components: [compset_stream.cpp, parameter.dBreach_threshold]
  remedy:
    action: "Set dBreach_threshold to 0.05-0.1 meters"
    manual_steps:
      - "Add \"dBreach_threshold\": 0.1 to config JSON"
      - "Re-run the model"
    prevention: "Default breach threshold to 0.1 in config templates"
  severity: degraded

- id: dt_018
  stage: s3_execution
  failure_domain: algorithm
  symptom:
    description: "Flow directions along streams don't match expected topology"
    detection_method: value_comparison
  diagnosis:
    root_cause: "iFlag_stream_burning_topology=1 set without providing topology file"
    explanation: >
      When topology-based stream burning is enabled, the model needs a
      topological flowline file (sFilename_flowline_topo) from PyFlowline.
      Without it, the model silently falls back to elevation-based routing,
      producing different results than expected without any error message.
    affected_components: [compset_stream.cpp, parameter.iFlag_stream_burning_topology]
  remedy:
    action: "Either provide topology file or set iFlag_stream_burning_topology=0"
    manual_steps:
      - "Generate topology file using PyFlowline"
      - "Or set iFlag_stream_burning_topology to 0 for elevation-based routing"
    prevention: "Validate that all referenced files exist before running"
  severity: silent
