template_version: "3.5"

identity:
  model_id: "VELMA"
  scientific_reference_version: "VELMA-inspired lumped daily 4-layer water-balance model (Python re-implementation; conceptually after EPA VELMA 2.0 soil-column hydrology, Stieglitz-family layered drainage)"
  implementation:
    id: "velma-python-4layer"
    version: "run_velma.py velma_4layer (lumped daily reimplementation)"
    provenance: "Python; self-contained lumped daily 4-layer analytic water-balance engine (velma_4layer in run_velma.py); not the EPA Java spatial VELMA."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: ""
  repo_url: ""

boundary:
  scope_in:
    - "Basin-lumped daily streamflow at a single outlet (m3/s)"
    - "Degree-day snow accumulation and melt (snow water equivalent)"
    - "Radiation-driven potential evapotranspiration (Priestley-Taylor / Hargreaves-style)"
    - "Root-weighted actual evapotranspiration with moisture stress"
    - "Four-layer vertical soil-water storage and gravity percolation"
    - "Lateral subsurface (interflow) drainage per layer"
    - "Linear baseflow recession from the deepest layer"
    - "Parallel fast/slow linear-reservoir runoff routing to discharge"
  scope_out:
    - "Spatial / distributed grid routing (this implementation is basin-lumped, not cell-by-cell)"
    - "Vegetation and soil carbon/nitrogen biogeochemistry (no C/N pools, no decomposition, nitrification, denitrification, or N-fixation)"
    - "Solute transport (NO3, NH4, DOC, DON export not simulated)"
    - "Plant growth / Leaf-Stem-Root dynamics"
    - "DEM flat-processing, flow-direction/accumulation, and outlet delineation (no spatial DEM ingestion in this engine)"
    - "Sub-daily processes (daily timestep only)"
  spatial: "0-D point"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-balance closure applies to the basin-lumped water column only (precip = snow/ET + runoff + storage change across the four layers and the two routing reservoirs). There is NO energy-balance closure (PET is a demand-side radiation/temperature approximation) and NO carbon/nitrogen mass balance in this implementation. Saturation back-spill from an overfilled lower layer is returned upward into the surface-excess (interflow) term, which couples percolation to surface runoff and is a known source of water-balance residual if mis-accounted."

inputs:
  forcing:
    - category: "forcing"
      name: "precipitation"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: "forcing JSON field prec_mm_d (basin-average daily series)"
      notes: "Basin-averaged daily precipitation consumed each timestep; partitioned to rain/snow by t_snow threshold."
    - category: "forcing"
      name: "air temperature"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "forcing JSON field temp_K (basin-average daily series)"
      notes: "Expected in Kelvin; model subtracts 273.15 internally. Non-finite values silently replaced with 288 K inside the loop. Passing Celsius collapses PET to 0 and forces all precip to snow."
    - category: "forcing"
      name: "incoming solar radiation"
      unit: "W/m2"
      source_kind: "forcing"
      model_input_format: "forcing JSON field srad_Wm2 (basin-average daily series)"
      notes: "Drives PET via Rn = srad*0.0864/2.45. Expected W/m2 (~100-300 daily mean); MJ/m2/d or kJ/m2/d mis-units produce catastrophic PET errors. Non-finite values silently replaced with 150 W/m2."
  parameters:
    - category: "parameters"
      name: "layer porosity fraction (layer_porosity)"
      unit: "v/v fraction"
      source_kind: "calibrated"
      model_input_format: "params JSON layer_porosity[4]"
      notes: "Per-layer void-space fraction; layer_cap = porosity*LAYER_THICK. Must be <1.0 (percent values inflate capacity 100x)."
    - category: "parameters"
      name: "layer field-capacity fraction (layer_fc_frac)"
      unit: "fraction of layer_cap"
      source_kind: "calibrated"
      model_input_format: "params JSON layer_fc_frac[4]"
    - category: "parameters"
      name: "layer wilting-point fraction (layer_wp_frac)"
      unit: "fraction of layer_cap"
      source_kind: "calibrated"
      model_input_format: "params JSON layer_wp_frac[4]"
    - category: "parameters"
      name: "saturated hydraulic conductivity (layer_ks_mm_d)"
      unit: "mm/d"
      source_kind: "dataset_lookup"
      model_input_format: "params JSON layer_ks_mm_d[4]"
      notes: "Default from Rawls/Clapp-Hornberger texture lookup with depth scaling. mm/h instead of mm/d makes percolation 24x too slow."
    - category: "parameters"
      name: "vertical percolation rate coefficients (perc1-3)"
      unit: "1/d (fraction of above-FC storage)"
      source_kind: "calibrated"
      model_input_format: "params JSON perc1, perc2, perc3"
      notes: "L4 percolation is hardcoded to 0.0; only three percolation coefficients are honored by the engine."
    - category: "parameters"
      name: "lateral flow coefficients (klat1-4)"
      unit: "1/d"
      source_kind: "calibrated"
      model_input_format: "params JSON klat1..klat4"
    - category: "parameters"
      name: "baseflow recession coefficient (k_base)"
      unit: "1/d"
      source_kind: "calibrated"
      model_input_format: "params JSON k_base"
      notes: "Draws L4 down to wilting point (not field capacity); too-low values let L4 grow without bound."
    - category: "parameters"
      name: "fast/slow reservoir recession (k_fast, k_slow)"
      unit: "1/d"
      source_kind: "calibrated"
      model_input_format: "params JSON k_fast, k_slow"
    - category: "parameters"
      name: "PET scale factor (pet_scale)"
      unit: "unitless"
      source_kind: "calibrated"
      model_input_format: "params JSON pet_scale"
      notes: "Linear multiplier on PET; reasonable range [0.3,2.5], typical 0.8-1.5. Hargreaves PET is linearly sensitive to it."
    - category: "parameters"
      name: "degree-day melt factor (ddf)"
      unit: "mm/d/K"
      source_kind: "calibrated"
      model_input_format: "params JSON ddf"
    - category: "parameters"
      name: "basin area"
      unit: "km2"
      source_kind: "user_provided"
      model_input_format: "scalar used in mm/d->m3/s conversion (area*MM_D_KM2_TO_M3_S)"
      notes: "Wrong area unit (ha vs km2) directly biases discharge magnitude."
    - category: "parameters"
      name: "direct-runoff fraction (f_direct)"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "params JSON f_direct"
  initial_conditions:
    - category: "initial_conditions"
      name: "per-layer soil water (sw[4])"
      unit: "mm"
      source_kind: "default"
      model_input_format: "initialized to field capacity fc.copy()"
      notes: "Starting far from equilibrium produces a strong first-year transient; first year (2-3 for L4) discarded as spin-up."
    - category: "initial_conditions"
      name: "snow water equivalent (swe)"
      unit: "mm"
      source_kind: "default"
      model_input_format: "init 0.0"
      notes: "SWE=0 default; mid-winter start in a snow-dominated basin misses the first spring melt peak."
    - category: "initial_conditions"
      name: "fast/slow routing storage (S_fast, S_slow)"
      unit: "mm"
      source_kind: "default"
      model_input_format: "init 0.0"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "snow/rain and melt temperature thresholds (t_snow, t_melt)"
      unit: "K"
      source_kind: "default"
      model_input_format: "params JSON t_snow, t_melt (default 273.15)"
    - category: "boundary_conditions"
      name: "routing split fraction (split)"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "params JSON split (fraction of total runoff to fast reservoir)"
      notes: "split->1.0 starves baseflow and overestimates peaks 2-5x; calibration bound typically [0.2,0.7]."
    - category: "boundary_conditions"
      name: "run mode (simulate vs calibrate)"
      unit: "switch"
      source_kind: "user_provided"
      model_input_format: "CLI mode selector; calibrate mode invokes differential_evolution against observed discharge"
    - category: "boundary_conditions"
      name: "calibration window start / warmup"
      unit: "date / days"
      source_kind: "user_provided"
      model_input_format: "--cal-start and warmup_days (default 365)"
      notes: "Calibration start must exclude the spin-up year or the optimizer overfits the initial transient."
    - category: "boundary_conditions"
      name: "observed discharge (calibrate mode)"
      unit: "m3/s"
      source_kind: "user_provided"
      model_input_format: "aligned observed series Q_obs_m3s for objective/metrics"

processes:
  modules:
    - name: "SnowDegreeDay"
      role: "process_solver"
      brief: "Degree-day snow accumulation (precip as snow when T<t_snow) and melt (ddf*(T-t_melt)); updates swe and yields liquid water_input."
    - name: "PET-Hargreaves"
      role: "process_solver"
      brief: "Radiation-driven Priestley-Taylor/Hargreaves-style PET (mm/d) from temp_K and srad_Wm2; T converted K->C internally; PET forced to 0 below -5 C; scaled by pet_scale."
    - name: "Evapotranspiration"
      role: "process_solver"
      brief: "Root-fraction-weighted actual ET extraction from soil layers with linear FC-WP moisture-stress; mutates sw. ROOT_FRAC[3]=0.05 means L4 also loses water."
    - name: "Infiltration-SatExcess"
      role: "process_solver"
      brief: "Adds water_input minus direct runoff (f_direct) to L1; storage above layer_cap[0] becomes saturation-excess surface runoff."
    - name: "VerticalPercolation"
      role: "process_solver"
      brief: "Gravity drainage of above-FC water L1->L2->L3->L4 (perc1-3; L4 perc hardcoded 0); overfill of a lower layer is spilled back upward as interflow into surface excess."
    - name: "LateralFlow"
      role: "process_solver"
      brief: "Darcy-style lateral subsurface (interflow) drainage from each layer's above-FC storage using klat1-4 coefficients."
    - name: "Baseflow"
      role: "process_solver"
      brief: "Linear recession from L4 above wilting point using k_base; can deplete L4 below field capacity."
    - name: "DualReservoirRouting"
      role: "integrator"
      brief: "Parallel fast/slow linear reservoirs (split, k_fast, k_slow) over total runoff; sums to Q_mm then to m3/s via basin area * MM_D_KM2_TO_M3_S."
    - name: "velma_4layer"
      role: "driver"
      brief: "Main daily time-loop engine ordering snow->PET->ET->infiltration->percolation->lateral->baseflow->routing; holds all prognostic state (sw, swe, S_fast, S_slow)."
    - name: "CalibrationDE"
      role: "optional_module"
      applicability: "calibrate mode only"
      brief: "scipy differential_evolution optimizing 14 parameters against composite objective 0.5*NSE+0.5*KGE-0.002*|PBIAS| (seed=42)."
    - name: "MetricsEvaluator"
      role: "optional_module"
      brief: "Computes NSE/KGE/r/RMSE/PBIAS with warmup exclusion from simulated vs observed discharge; also emits diagnostics, CSV, and figure."
  internal_edges:
    - from: "velma_4layer"
      to: "SnowDegreeDay"
      kind: "invokes"
      brief: "daily loop calls snow step first"
    - from: "velma_4layer"
      to: "PET-Hargreaves"
      kind: "invokes"
      brief: "daily loop computes PET each step"
    - from: "velma_4layer"
      to: "VerticalPercolation"
      kind: "invokes"
      brief: "daily loop runs percolation L1..L3"
    - from: "velma_4layer"
      to: "DualReservoirRouting"
      kind: "invokes"
      brief: "daily loop routes total runoff to discharge"
    - from: "Inputs"
      to: "velma_4layer"
      kind: "consumes_input"
      brief: "prec_mm_d / temp_K / srad_Wm2 forcing and soil/process params loaded into the engine"
    - from: "SnowDegreeDay"
      to: "swe"
      kind: "writes_state"
      brief: "accumulates precip as snow, depletes by melt"
    - from: "SnowDegreeDay"
      to: "Infiltration-SatExcess"
      kind: "invokes"
      brief: "liquid water_input (rain+melt) feeds infiltration"
    - from: "Inputs"
      to: "PET-Hargreaves"
      kind: "consumes_input"
      brief: "Rn = srad*0.0864/2.45 net-radiation term drives PET"
    - from: "PET-Hargreaves"
      to: "Evapotranspiration"
      kind: "invokes"
      brief: "PET (mm/d) sets root-weighted ET demand"
    - from: "Evapotranspiration"
      to: "sw[4]"
      kind: "writes_state"
      brief: "subtracts actual ET from each layer's soil water"
    - from: "Infiltration-SatExcess"
      to: "sw[4]"
      kind: "writes_state"
      brief: "adds water_input to sw[0], clamps to layer_cap[0]"
    - from: "Infiltration-SatExcess"
      to: "DualReservoirRouting"
      kind: "invokes"
      brief: "direct runoff + L1 saturation excess enter total runoff"
    - from: "VerticalPercolation"
      to: "sw[4]"
      kind: "writes_state"
      brief: "moves above-FC water downward between layers"
    - from: "VerticalPercolation"
      to: "Infiltration-SatExcess"
      kind: "invokes"
      brief: "lower-layer overfill returned upward as interflow into surface excess (undocumented coupling)"
    - from: "LateralFlow"
      to: "sw[4]"
      kind: "reads_state"
      brief: "drains above-FC storage from each layer"
    - from: "LateralFlow"
      to: "DualReservoirRouting"
      kind: "invokes"
      brief: "lateral flow added to total runoff"
    - from: "Baseflow"
      to: "sw[4]"
      kind: "writes_state"
      brief: "depletes L4 above wilting point"
    - from: "Baseflow"
      to: "DualReservoirRouting"
      kind: "invokes"
      brief: "baseflow added to total runoff"
    - from: "DualReservoirRouting"
      to: "S_fast"
      kind: "writes_state"
      brief: "split*total_runoff into fast reservoir, released at k_fast"
    - from: "DualReservoirRouting"
      to: "S_slow"
      kind: "writes_state"
      brief: "(1-split)*total_runoff into slow reservoir, released at k_slow"
    - from: "DualReservoirRouting"
      to: "Outputs"
      kind: "produces_output"
      brief: "Q_mm = q_fast+q_slow converted to Q_sim_m3s via basin area * MM_D_KM2_TO_M3_S"
    - from: "velma_4layer"
      to: "MetricsEvaluator"
      kind: "produces_output"
      brief: "Q_sim_m3s plus diagnostics consumed for NSE/KGE/PBIAS and figure"
    - from: "CalibrationDE"
      to: "velma_4layer"
      kind: "invokes"
      brief: "objective runs the full model engine per candidate parameter vector"
    - from: "MetricsEvaluator"
      to: "CalibrationDE"
      kind: "invokes"
      brief: "NSE/KGE/PBIAS feed the composite calibration objective"

states:
  variables:
    - name: "sw[4]"
      unit: "mm"
      role: "prognostic"
    - name: "swe"
      unit: "mm"
      role: "prognostic"
    - name: "S_fast"
      unit: "mm"
      role: "prognostic"
    - name: "S_slow"
      unit: "mm"
      role: "prognostic"
    - name: "layer_cap[4]"
      unit: "mm"
      role: "diagnostic"
    - name: "fc[4]"
      unit: "mm"
      role: "diagnostic"
    - name: "wp[4]"
      unit: "mm"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "Q_sim_m3s"
    validation_rank: 1
    unit: "m3/s"
    description: "Simulated daily discharge at the basin outlet (lumped fast+slow reservoir release scaled by basin area)."
    emitted_in: "simulation CSV / metrics JSON (parse_output_velma)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "First year (2-3 years for deep L4) is spin-up and must be excluded (default warmup 365 d)."
            - "Lumped single-outlet discharge; cannot be compared to interior/distributed gauges."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Single-instant comparison only meaningful for peak/low-flow magnitude checks."
      detrending_options:
        - "none"
  - var: "mean_et_mm_d"
    validation_rank: 3
    unit: "mm/d"
    description: "Diagnostic basin-mean actual evapotranspiration."
    emitted_in: "metrics JSON diagnostics"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "PET is a radiation/temperature approximation, not an energy-balance closure; expect bias against flux-tower ET."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Basin-lumped mean; compare only to basin-aggregated ET products."
      detrending_options:
        - "none"
  - var: "mean_runoff_mm_d"
    validation_rank: 2
    unit: "mm/d"
    description: "Diagnostic basin-mean total runoff (surface + lateral + baseflow before routing)."
    emitted_in: "metrics JSON diagnostics"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Pre-routing runoff depth, not the routed hydrograph."
      detrending_options:
        - "none"
  - var: "final_swe_mm"
    validation_rank: 5
    unit: "mm"
    description: "End-state snow water equivalent."
    emitted_in: "metrics JSON diagnostics"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Basin-lumped SWE; degree-day snow only, no radiation melt."
      detrending_options:
        - "none"
  - var: "final_sw_mm[4]"
    validation_rank: 4
    unit: "mm"
    description: "End-state per-layer soil water storage."
    emitted_in: "metrics JSON diagnostics"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Lumped column storage; only loosely comparable to point soil-moisture probes."
      detrending_options:
        - "none"

influence:
  edges: []
  _reason: "no sensitivity literature found — lit_reader.json is null; no published quantitative SA for this lumped Python VELMA re-implementation was supplied. Triplet-documented parameter sensitivities (pet_scale, split, k_base, klat4, Ksat) are mechanistic/operational, not citation-backed sensitivity indices, so they are intentionally not promoted to influence edges."
  citation_index: {}

safety:
  hazards:
    - id: "temperature_celsius_not_kelvin"
      kind: "weather_file_semantic"
      description: "Air temperature passed in Celsius instead of Kelvin; model subtracts 273.15 internally, driving PET to 0 and forcing all precip to snow with no melt (SWE grows without bound)."
      severity: "silent"
      triplet_ref: "dt_velma_003"
    - id: "srad_unit_confusion"
      kind: "weather_file_semantic"
      description: "Solar radiation not in W/m2 (e.g. MJ/m2/d or kJ/m2/d) misfires Rn=srad*0.0864/2.45, producing PET >50 mm/d (soil desiccated in days) or ~100x too low."
      severity: "silent"
      triplet_ref: "dt_velma_004"
    - id: "ksat_mm_per_hour_not_day"
      kind: "soil_semantic"
      description: "Saturated conductivity left in mm/h instead of mm/d is 24x too low; L1 saturates, hydrograph turns flashy with no baseflow recession."
      severity: "silent"
      triplet_ref: "dt_velma_005"
    - id: "porosity_percent_not_fraction"
      kind: "soil_semantic"
      description: "Porosity/FC/WP given as percent (e.g. 45) instead of fraction (0.45) inflates layer capacity 100x; layers never fill, zero runoff for years."
      severity: "silent"
      triplet_ref: "dt_velma_006"
    - id: "layer_thickness_cm_not_mm"
      kind: "soil_semantic"
      description: "Layer thickness in cm instead of mm makes capacity 10x too small; immediate saturation and ~100% surface runoff from light rain."
      severity: "silent"
      triplet_ref: "dt_velma_024"
    - id: "basin_area_unit_discharge_scale"
      kind: "parser_semantic"
      description: "Wrong basin-area unit (ha vs km2) in the mm/d->m3/s conversion (area*MM_D_KM2_TO_M3_S) directly biases simulated discharge magnitude."
      severity: "silent"
      triplet_ref: "dt_velma_007"
    - id: "spinup_in_calibration_window"
      kind: "control_semantic"
      description: "Calibration window includes the spin-up year; optimizer overfits the initial transient (NSE>0.9 train, NSE<0 validation). Set --cal-start >=1 yr after forcing start."
      severity: "silent"
      triplet_ref: "dt_velma_010"
    - id: "routing_split_too_high"
      kind: "control_semantic"
      description: "Routing split near 1.0 sends nearly all runoff to the fast reservoir; peaks overestimated 2-5x and baseflow near zero."
      severity: "silent"
      triplet_ref: "dt_velma_012"
    - id: "pet_scale_out_of_range"
      kind: "control_semantic"
      description: "pet_scale outside [0.3,2.5] makes annual ET wildly off and breaks water-balance closure; Hargreaves PET is linearly sensitive to it."
      severity: "silent"
      triplet_ref: "dt_velma_013"
    - id: "kbase_klat4_too_low_L4_unbounded"
      kind: "control_semantic"
      description: "k_base/klat4 ~0.001/d let L4 inflow exceed outflow; deep storage grows without bound and baseflow stays negligible (mass-balance non-equilibrium)."
      severity: "silent"
      triplet_ref: "dt_velma_014"
    - id: "soil_water_negative_nan"
      kind: "numerical_instability"
      description: "Simultaneous over-extraction by percolation+lateral+ET in one timestep drives soil water below zero, producing NaN in discharge via sqrt/log; needs a max(SW,0) floor and bounded parameters."
      severity: "fatal"
      triplet_ref: "dt_velma_015"
    - id: "saturated_backflow_mass_residual"
      kind: "numerical_instability"
      description: "Back-spill from a saturated receiving layer is added as interflow while the sending layer was already decremented, leaking water; balance residual grows past 5-10% of precip over time."
      severity: "silent"
      triplet_ref: "dt_velma_016"
    - id: "swe_zero_midwinter_start"
      kind: "initial_condition_semantic"
      description: "SWE initializes to 0; starting mid-winter in a snow-dominated basin yields no snowpack for the first spring melt, suppressing the first melt peak."
      severity: "silent"
      triplet_ref: "dt_velma_022"
    - id: "initial_sw_far_from_equilibrium"
      kind: "initial_condition_semantic"
      description: "Initial soil water far from equilibrium produces a strong artificial wetting/drying transient in the first 1-2 years (2-3 for L4) before dynamic equilibrium."
      severity: "silent"
      triplet_ref: "dt_velma_021"
    - id: "de_calibration_bounds_too_wide"
      kind: "control_semantic"
      description: "Calibration bounds too wide for the 14-dimensional search make differential evolution fail to converge within ~1600 evaluations; narrow bounds with soil/domain priors."
      severity: "degraded"
      triplet_ref: "dt_velma_023"
    - id: "silent_forcing_substitution"
      kind: "weather_file_semantic"
      description: "Non-finite forcing temperature/srad are silently replaced (288 K / 150 W/m2) inside the model loop, and a fully missing srad series is filled with constant 200 W/m2 — masking forcing-load failures while still producing plausible discharge."
      severity: "silent"
  validation_limits:
    - "Basin-lumped (0-D) implementation: cannot resolve spatial/distributed runoff fields, interior gauges, or riparian/BMP placement that the EPA spatial VELMA targets."
    - "No biogeochemistry: this engine cannot produce or be validated against stream N/C export (NO3, NH4, DON, DOC) or vegetation/soil C-N pools."
    - "Daily timestep cannot resolve sub-daily flood peaks or diurnal processes."
    - "Degree-day snow only (no radiation-driven melt); maritime/energy-limited snow regimes are poorly resolved."
    - "PET is a radiation/temperature approximation with empirical magic coefficients; structurally weak where advective or humidity-driven ET dominates."
  warnings:
    - "Discard the first year (2-3 years for the deep L4 layer) as spin-up before computing metrics; default warmup is 365 d."
    - "L4 percolation is hardcoded to 0.0 — the deepest layer drains only via lateral flow and baseflow; any supplied 4th percolation value is ignored."
    - "Baseflow draws L4 down to wilting point (not field capacity), so deep storage can fall below FC; unlike lateral flow which only drains above FC."
    - "ROOT_FRAC[3]=0.05 means L4 loses water to ET despite the documented intent of ET from L1-L3 only."
    - "Saturation back-spill couples percolation to surface runoff (undocumented); track the daily water balance to detect leakage."
  assumptions:
    - statement: "This dag describes the self-contained Python lumped daily 4-layer VELMA-inspired engine (velma_4layer), NOT the EPA Java spatially-distributed VELMA 2.0 with biogeochemistry."
      scope: "whole model identity and scope"
      source: "run_velma.py velma_4layer implementation; EPA VELMA 2.0 User Manual (2014) cited only for conceptual lineage"
      status: "adopted"
    - statement: "The model is a basin-lumped (0-D) point water balance; spatial DEM routing, flow accumulation, and outlet delineation are out of scope for this implementation."
      scope: "spatial geometry / boundary"
      source: "velma_4layer driver structure (single basin-average state vectors, area-scaled discharge)"
      status: "adopted"
    - statement: "Mass-balance closure is for water only; PET is a demand-side radiation/temperature approximation with no surface-energy-balance closure, and no carbon/nitrogen accounting exists."
      scope: "conservation / closure"
      source: "pet_hargreaves and velma_4layer water-only state in run_velma.py"
      status: "adopted"
    - statement: "Snow/rain partitioning and melt use a single degree-day threshold (t_snow/t_melt default 273.15 K, melt = ddf*(T-t_melt)); radiation-driven melt is not implemented."
      scope: "snow process method"
      source: "SnowDegreeDay step in velma_4layer; consistent with EPA VELMA 2.0 note that radiation snowmelt is under development"
