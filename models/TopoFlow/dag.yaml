template_version: "3.5"

identity:
  model_id: "TopoFlow"
  scientific_reference_version: "TopoFlow 3.6 (Peckham et al. 2017, Earth and Space Science, doi:10.1002/2016EA000237; component-based D8 distributed hydrology)"
  implementation:
    id: "topoflow36"
    version: "3.6"
    provenance: "Python (Python 3.7+); Scott D. Peckham (INSTAAR / CSDMS, University of Colorado Boulder); plug-and-play BMI components coupled at runtime via the EMELI framework."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "MIT"
  repo_url: "https://github.com/peckhams/topoflow36"

boundary:
  scope_in:
    - "Spatially-distributed watershed hydrologic response to climatic forcing over a D8 raster"
    - "Channel routing (kinematic / diffusive / dynamic wave) with Manning or Law-of-Wall friction"
    - "Infiltration and runoff partitioning (Green-Ampt, Smith-Parlange, 1-D Richards, Beven)"
    - "Snowmelt (degree-day or energy balance)"
    - "Evapotranspiration (Priestley-Taylor, energy balance, or read-from-file)"
    - "Saturated (subsurface) zone / baseflow via Darcy-layer flow"
    - "Meteorology forcing component (radiation, vapor pressure, atmospheric variables)"
    - "Channel diversions / abstractions; optional glacier/ice component"
  scope_out:
    - "Domain setup (DEM acquisition, D8 derivation, reprojection) performed as a prerequisite outside the model run"
    - "Robust unsaturated-to-saturated zone linkage (a stated model limitation)"
    - "Standard overland-flow representation (currently modeled in a nonstandard way per CSDMS docs)"
  spatial: "distributed-stream"
  temporal: "event"
  closure: "mass-balance"
  notes: "Mass-balance closure is enforced over the basin water budget: the driver assembles a final water mass-balance report from per-component volume accumulators (vol_P/PR/PS/SM/ET/IN/Rg/GW/R). Channel routing additionally carries a momentum treatment whose completeness depends on the wave method (kinematic = friction + gravity only; diffusive adds the free-surface-slope pressure term; dynamic is the full Saint-Venant momentum equation). A surface energy budget is only computed when the energy-balance snowmelt/evaporation components are selected; the default Priestley-Taylor / degree-day paths are demand-side flux calculations, not a closed energy balance. Time-stepping is component-specific; the channel timestep must satisfy CFL (dt <= dx/v_max). The model can also run continuous (multi-season to multi-year) simulations, but the operational case here is event-scale."

inputs:
  forcing:
    - category: "atmospheric"
      name: "precipitation"
      unit: "mm/hr"
      source_kind: "forcing"
      model_input_format: "scalar/Time_Series/Grid_Sequence in the Meteorology .cfg (CSDMS name atmosphere_water__precipitation_leq-volume_flux)"
      notes: "Provided in mm/hr in the .cfg; the model internally divides by 3.6e6 to m/s. Do NOT pre-convert to m/s. The downstream channel components consume an effective rain rate R [m/s] derived from this after infiltration/snow accounting."
    - category: "atmospheric"
      name: "air_temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "scalar/Time_Series/Grid in the Meteorology .cfg"
      notes: "Celsius, not Kelvin. Drives degree-day snowmelt and the ET/energy budget."
    - category: "atmospheric"
      name: "relative_humidity"
      unit: "fraction 0-1"
      source_kind: "forcing"
      model_input_format: "scalar/Time_Series in the Meteorology .cfg"
      notes: "Fraction, not percent. CSDMS docs declare % at the help-page level; the operational model reads 0-1."
    - category: "atmospheric"
      name: "wind_speed"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "scalar/Time_Series in the Meteorology .cfg; measurement height z must match the .cfg z parameter"
    - category: "atmospheric"
      name: "atmospheric_pressure"
      unit: "mbar"
      source_kind: "forcing"
      model_input_format: "scalar/Time_Series in the Meteorology .cfg (1 atm ~= 1013.25 mbar)"
    - category: "atmospheric"
      name: "shortwave_radiation"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "scalar/Time_Series/Grid in the Meteorology .cfg; net shortwave is set to zero between local sunset and sunrise"
  parameters:
    - category: "soil_infiltration"
      name: "saturated_hydraulic_conductivity (Ks)"
      unit: "m/s"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Infiltration .cfg"
      notes: "Range ~1e-7 to 1e-3 m/s. Literature/datasets often supply mm/hr or cm/hr — must be converted to m/s."
    - category: "soil_infiltration"
      name: "initial_hydraulic_conductivity (Ki)"
      unit: "m/s"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Infiltration .cfg"
    - category: "soil_infiltration"
      name: "saturated_water_content (theta_s)"
      unit: "dimensionless 0-1"
      source_kind: "dataset_lookup"
      model_input_format: "Scalar or Grid in the Infiltration .cfg"
      notes: "Fraction 0-1 (~0.30-0.55), not percent."
    - category: "soil_infiltration"
      name: "residual_water_content (theta_r)"
      unit: "dimensionless 0-1"
      source_kind: "dataset_lookup"
      model_input_format: "Scalar or Grid in the Infiltration .cfg (Richards/Brooks-Corey)"
    - category: "soil_infiltration"
      name: "capillary_length_scale (G)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Green-Ampt Infiltration .cfg"
      notes: "Wetting-front suction head, ~0.01-0.5 m. Literature often in cm; convert by /100."
    - category: "soil_infiltration"
      name: "bubbling_pressure_head (psi_b)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Richards Infiltration .cfg"
    - category: "soil_infiltration"
      name: "pore_size_distribution_index (lambda)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Richards/Brooks-Corey Infiltration .cfg"
    - category: "soil_infiltration"
      name: "brooks_corey_c"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Infiltration .cfg"
    - category: "soil_infiltration"
      name: "smith_parlange_gamma"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Smith-Parlange Infiltration .cfg"
    - category: "channel_geometry"
      name: "manning_n"
      unit: "s/m^(1/3)"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Channels .cfg"
      notes: "Channel roughness ~0.01-0.20. Enter n itself, not conveyance 1/n."
    - category: "channel_geometry"
      name: "roughness_height (z0)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Channels .cfg (Law-of-Wall friction alternative to Manning's n)"
    - category: "channel_geometry"
      name: "channel_bed_width (w)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Channels .cfg; must be > 0 everywhere (~0.5-50 m)"
    - category: "channel_geometry"
      name: "bank_angle"
      unit: "degrees"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Channels .cfg (trapezoidal cross-section; 0=vertical, 0<=angle<90)"
    - category: "channel_geometry"
      name: "sinuosity"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Channels .cfg (>= 1.0)"
    - category: "channel_geometry"
      name: "bankfull_depth (d_bankfull)"
      unit: "m"
      source_kind: "default"
      model_input_format: "Scalar or Grid in the Channels .cfg (d_bankfull_type/d_bankfull); when unset the model silently defaults to 10.0 m"
      notes: "MODEL-internal default 10.0 m (channels_base.py); a unit multiplier d_bankfull_factor defaults to 1.0. Controls overbank/flood onset feeding the flood_water_depth (df) state — a too-large default suppresses flooding silently."
    - category: "snowmelt"
      name: "degree_day_coefficient (c0)"
      unit: "mm/day/degC"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Snowmelt-Degree-Day .cfg"
      notes: "Melt factor in meltrate M=(c0/86400)*(T_air-T0)."
    - category: "snowmelt"
      name: "threshold_temperature (T0)"
      unit: "degC"
      source_kind: "calibrated"
      model_input_format: "Scalar in the Snowmelt-Degree-Day .cfg"
    - category: "evaporation"
      name: "priestley_taylor_alpha"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "Scalar in the Evaporation-Priestley-Taylor .cfg (default 1.26)"
    - category: "meteorology_radiation"
      name: "albedo"
      unit: "0-1"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Meteorology .cfg"
    - category: "meteorology_radiation"
      name: "surface_emissivity"
      unit: "0-1"
      source_kind: "calibrated"
      model_input_format: "Scalar or Grid in the Meteorology .cfg"
    - category: "meteorology_radiation"
      name: "dust_attenuation"
      unit: "0-0.3"
      source_kind: "calibrated"
      model_input_format: "Scalar in the Meteorology .cfg"
    - category: "domain_grid"
      name: "DEM"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "RTG binary float32 + .rti header (*_DEM.rtg)"
    - category: "domain_grid"
      name: "D8_flow_codes"
      unit: "codes 0-128"
      source_kind: "derived"
      model_input_format: "RTG binary (*_flow.rtg); steepest-descent flow direction codes"
    - category: "domain_grid"
      name: "slope_grid"
      unit: "m/m"
      source_kind: "derived"
      model_input_format: "RTG binary (*_slope.rtg); must be > 0 everywhere, floor 1e-6 m/m"
    - category: "domain_grid"
      name: "contributing_area_grid"
      unit: "km^2 (or cell count)"
      source_kind: "derived"
      model_input_format: "RTG binary (*_area.rtg)"
  initial_conditions:
    - category: "channel_state"
      name: "initial_flow_depth (d0)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Scalar or Grid in the Channels .cfg"
      notes: "A spatially-uniform positive scalar can produce a very large initial peak and may crash the run."
    - category: "soil_state"
      name: "initial_water_content (theta_i)"
      unit: "dimensionless 0-1"
      source_kind: "user_provided"
      model_input_format: "Scalar or Grid in the Infiltration .cfg; must be < theta_s"
    - category: "snow_state"
      name: "initial_snow_depth / snow_water_equivalent (h_snow / h_swe)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Scalar or Grid in the Snowmelt .cfg"
  boundary_conditions:
    - category: "domain_topology"
      name: "outlet_pixels"
      unit: "row/col index"
      source_kind: "user_provided"
      model_input_format: "Text row/col coordinates (*_outlets.txt); must lie on a flow cell within the D8 domain"
    - category: "component_selection"
      name: "component_provider_map"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "*_providers.txt mapping each component type to a concrete implementation (case-sensitive)"
      notes: "Selects which process method realizes each component (e.g. infil_green_ampt vs infil_richards_1D, snow_degree_day vs snow_energy_balance)."
    - category: "method_switch"
      name: "channel_wave_method"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Selected implicitly from the Channels .cfg extension string (kinematic / diffusive / dynamic)"
      notes: "Structural switch: changes the momentum closure and the active state-variable set (free-surface slope used by diffusive/dynamic; trapezoid Rh skipped under dynamic)."
    - category: "run_control"
      name: "stopping_criteria"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Driver .cfg: Until_model_time (T_stop_model, min), Q_peak_fraction (Qp_fraction), or Until_n_steps (n_steps)"
    - category: "run_control"
      name: "channel_timestep (dt)"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "Scalar in the Channels .cfg; must satisfy CFL (typically 2-6 s for 30 m grids)"
    - category: "output_control"
      name: "save_intervals (save_grid_dt, save_pixels_dt)"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "Scalars in component .cfg; must be smaller than the simulation duration or no data is written"

processes:
  modules:
    - name: "EMELI"
      role: "driver"
      brief: "Coupling framework (Experimental Modeling Environment for Linking and Interoperability); reads the provider file, instantiates components, and sequences initialize/update/finalize, exchanging inter-component fluxes via the Basic Model Interface (BMI). Requires cfunits for automatic unit conversion."
    - name: "topoflow_driver"
      role: "driver"
      brief: "Top-level run driver; monitors outlet Q and Q_peak each step, detects peak / steady-state / falling-limb stop conditions, and assembles the final water mass-balance report from per-component volume accumulators."
    - name: "d8_global"
      role: "process_solver"
      brief: "D8 steepest-descent flow direction, slope (S_bed), and contributing-area derivation over the DEM; supplies routing topology to the channel component."
    - name: "Meteorology"
      role: "process_solver"
      brief: "Reads/derives atmospheric and land-surface variables (P_rain, P_snow, T_air, vapor pressure, net shortwave/longwave radiation, optical air mass) following Dingman (2002) App. E; forcing source for snow, evaporation, infiltration and channels."
    - name: "Snowmelt-DegreeDay"
      role: "process_solver"
      brief: "Degree-day snowmelt M=(c0/86400)*(T_air-T0); produces snowmelt flux SM and snow water equivalent h_swe."
      applicability: "when snow provider = degree_day"
    - name: "Snowmelt-EnergyBalance"
      role: "process_solver"
      brief: "Energy-balance snowmelt alternative producing SM / h_swe from net radiation and temperature."
      applicability: "when snow provider = energy_balance"
    - name: "Evaporation-PriestleyTaylor"
      role: "process_solver"
      brief: "Priestley-Taylor evapotranspiration (alpha default 1.26); produces ET flux removed from the surface/channel water budget."
      applicability: "when evap provider = priestley_taylor"
    - name: "Evaporation-EnergyBalance"
      role: "process_solver"
      brief: "Surface-energy-balance evapotranspiration alternative producing ET flux."
      applicability: "when evap provider = energy_balance"
    - name: "Infiltration-GreenAmpt"
      role: "process_solver"
      brief: "Green-Ampt infiltration; partitions rainfall into surface infiltration flux IN (v0) and recharge Rg to the saturated zone."
      applicability: "when infil provider = green_ampt"
    - name: "Infiltration-SmithParlange"
      role: "process_solver"
      brief: "Smith-Parlange infiltration; produces IN and Rg."
      applicability: "when infil provider = smith_parlange"
    - name: "Infiltration-Richards1D"
      role: "process_solver"
      brief: "1-D Richards-equation infiltration through soil layers (uses pedotransfer soil functions); produces IN and Rg."
      applicability: "when infil provider = richards_1d"
    - name: "SaturatedZone-DarcyLayers"
      role: "process_solver"
      brief: "Saturated-zone / groundwater Darcy-layer flow; evolves the water table and produces baseflow/seepage flux GW into channels."
    - name: "Channels"
      role: "integrator"
      brief: "Core channel routing over the D8 grid; sums inter-component fluxes (P_rain, SM, GW, MR, minus ET, IN) into runoff R, then integrates flow volume and updates Q, u, d, Rh, shear stress and Froude number each timestep. Dispatches velocity to the selected wave closure."
    - name: "Channels-KinematicWave"
      role: "process_solver"
      brief: "Kinematic-wave velocity closure (S=S_bed, friction + gravity momentum only) with Manning or Law-of-Wall friction."
      applicability: "when channel wave method = kinematic"
    - name: "Channels-DiffusiveWave"
      role: "process_solver"
      brief: "Diffusive-wave velocity closure using the free-surface slope while neglecting inertial terms."
      applicability: "when channel wave method = diffusive"
    - name: "Channels-DynamicWave"
      role: "process_solver"
      brief: "Dynamic-wave (full Saint-Venant) velocity closure using free-surface slope and the friction factor."
      applicability: "when channel wave method = dynamic"
    - name: "Diversions"
      role: "optional_module"
      brief: "Fraction-method canals/sinks/sources adjusting channel discharge before the flow-volume update."
      applicability: "when diversions enabled"
    - name: "Ice-Glaciers"
      role: "optional_module"
      brief: "Glacier/ice component (gc2d) supplying glacier melt flux MR to the channel runoff sum."
      applicability: "when ice component enabled"
  internal_edges:
    - from: "Meteorology"
      to: "Channels"
      kind: "produces_output"
      brief: "P_rain (rainfall volume flux) consumed in the channel runoff sum update_R()."
    - from: "Meteorology"
      to: "Snowmelt-DegreeDay"
      kind: "produces_output"
      brief: "P_snow and T_air drive the degree-day meltrate."
    - from: "Meteorology"
      to: "Snowmelt-EnergyBalance"
      kind: "produces_output"
      brief: "Net radiation and T_air drive the energy-balance snowmelt."
      applicability: "when snow provider = energy_balance"
    - from: "Meteorology"
      to: "Evaporation-PriestleyTaylor"
      kind: "produces_output"
      brief: "Net radiation and T_air drive Priestley-Taylor ET."
    - from: "Meteorology"
      to: "Evaporation-EnergyBalance"
      kind: "produces_output"
      brief: "Net radiation and atmospheric variables drive energy-balance ET."
      applicability: "when evap provider = energy_balance"
    - from: "Meteorology"
      to: "Infiltration-GreenAmpt"
      kind: "produces_output"
      brief: "Rainfall flux drives the infiltration surface boundary."
    - from: "Meteorology"
      to: "Infiltration-SmithParlange"
      kind: "produces_output"
      brief: "Rainfall flux drives the Smith-Parlange infiltration surface boundary."
      applicability: "when infil provider = smith_parlange"
    - from: "Meteorology"
      to: "Infiltration-Richards1D"
      kind: "produces_output"
      brief: "Rainfall flux drives the Richards-1D infiltration surface boundary."
      applicability: "when infil provider = richards_1d"
    - from: "Snowmelt-DegreeDay"
      to: "Channels"
      kind: "produces_output"
      brief: "SM (snowmelt flux) added to channel runoff R."
    - from: "Snowmelt-EnergyBalance"
      to: "Channels"
      kind: "produces_output"
      brief: "SM (snowmelt flux) added to channel runoff R."
      applicability: "when snow provider = energy_balance"
    - from: "Evaporation-PriestleyTaylor"
      to: "Channels"
      kind: "produces_output"
      brief: "ET removed from the surface/channel water budget in update_R()."
    - from: "Evaporation-EnergyBalance"
      to: "Channels"
      kind: "produces_output"
      brief: "ET removed from the surface/channel water budget in update_R()."
      applicability: "when evap provider = energy_balance"
    - from: "Infiltration-GreenAmpt"
      to: "Channels"
      kind: "produces_output"
      brief: "IN (infiltration flux) subtracted from runoff R."
    - from: "Infiltration-SmithParlange"
      to: "Channels"
      kind: "produces_output"
      brief: "IN (infiltration flux) subtracted from runoff R."
      applicability: "when infil provider = smith_parlange"
    - from: "Infiltration-Richards1D"
      to: "Channels"
      kind: "produces_output"
      brief: "IN (infiltration flux) subtracted from runoff R."
      applicability: "when infil provider = richards_1d"
    - from: "Infiltration-GreenAmpt"
      to: "SaturatedZone-DarcyLayers"
      kind: "produces_output"
      brief: "Rg recharge flux feeds the saturated zone."
    - from: "Infiltration-SmithParlange"
      to: "SaturatedZone-DarcyLayers"
      kind: "produces_output"
      brief: "Rg recharge flux feeds the saturated zone."
      applicability: "when infil provider = smith_parlange"
    - from: "Infiltration-Richards1D"
      to: "SaturatedZone-DarcyLayers"
      kind: "produces_output"
      brief: "Rg recharge flux feeds the saturated zone."
      applicability: "when infil provider = richards_1d"
    - from: "SaturatedZone-DarcyLayers"
      to: "Channels"
      kind: "produces_output"
      brief: "GW baseflow/seepage flux added to channel runoff R."
    - from: "Ice-Glaciers"
      to: "Channels"
      kind: "produces_output"
      brief: "Glacier melt flux MR added to channel runoff R when enabled."
    - from: "d8_global"
      to: "Channels"
      kind: "produces_output"
      brief: "D8 flow directions, bed slope S_bed and cell area supply routing topology."
    - from: "Channels"
      to: "Channels-KinematicWave"
      kind: "invokes"
      brief: "update_velocity() dispatches to the wave-method velocity closure selected by the CFG extension."
    - from: "Channels-KinematicWave"
      to: "flow_velocity (u)"
      kind: "writes_state"
      brief: "Velocity closure sets u from Rh/slope/friction; Channels reads u back to form next-step Q."
    - from: "Channels"
      to: "Channels-DiffusiveWave"
      kind: "invokes"
      brief: "update_velocity() dispatches to the diffusive-wave velocity closure."
      applicability: "when channel wave method = diffusive"
    - from: "Channels-DiffusiveWave"
      to: "flow_velocity (u)"
      kind: "writes_state"
      brief: "Diffusive-wave closure sets u from free-surface slope/Rh/friction; Channels reads u back for next-step Q."
      applicability: "when channel wave method = diffusive"
    - from: "Channels"
      to: "Channels-DynamicWave"
      kind: "invokes"
      brief: "update_velocity() dispatches to the dynamic-wave velocity closure."
      applicability: "when channel wave method = dynamic"
    - from: "Channels-DynamicWave"
      to: "flow_velocity (u)"
      kind: "writes_state"
      brief: "Dynamic-wave (Saint-Venant) closure sets u from free-surface slope and friction factor; Channels reads u back for next-step Q."
      applicability: "when channel wave method = dynamic"
    - from: "Channels"
      to: "discharge (Q)"
      kind: "writes_state"
      brief: "update_R -> update_channel_discharge -> update_flow_volume -> update_channel_depth chain updates R, Q, channel volume and d."
    - from: "Channels"
      to: "flow_depth (d)"
      kind: "writes_state"
      brief: "update_channel_depth sets the mean flow depth d from channel volume and geometry."
    - from: "Channels"
      to: "channel_cross_section_area (A_wet)"
      kind: "writes_state"
      brief: "update_trapezoid_Rh evolves wetted area A_wet / Rh feeding shear stress and friction."
    - from: "Diversions"
      to: "Channels"
      kind: "invokes"
      brief: "update_diversions() adjusts Q for canals/sinks/sources before the flow-volume update."
    - from: "Channels"
      to: "topoflow_driver"
      kind: "produces_output"
      brief: "Q_outlet and Q_peak read by the driver each step for stop-condition logic."
    - from: "topoflow_driver"
      to: "Outputs"
      kind: "produces_output"
      brief: "Driver writes the final mass-balance report (*_report.txt) from vol_* accumulators across all components."
    - from: "Channels"
      to: "Outputs"
      kind: "produces_output"
      brief: "write_output_files() emits *.nc grid stacks and *_0D-*.txt outlet hydrographs each save interval."
    - from: "EMELI"
      to: "Channels"
      kind: "invokes"
      brief: "Framework sequences component initialize/update/finalize and wires inter-component BMI fluxes per the provider file."

states:
  variables:
    - name: "discharge (Q)"
      unit: "m^3/s"
      role: "prognostic"
    - name: "flow_depth (d)"
      unit: "m"
      role: "prognostic"
    - name: "flow_velocity (u)"
      unit: "m/s"
      role: "diagnostic"
    - name: "channel_water_volume (vol)"
      unit: "m^3"
      role: "prognostic"
    - name: "channel_cross_section_area (A_wet)"
      unit: "m^2"
      role: "prognostic"
    - name: "hydraulic_radius (Rh)"
      unit: "m"
      role: "diagnostic"
    - name: "wetted_perimeter (P_wet)"
      unit: "m"
      role: "diagnostic"
    - name: "free_surface_slope (S_free)"
      unit: "m/m"
      role: "diagnostic"
    - name: "bottom_shear_stress (tau)"
      unit: "Pa"
      role: "diagnostic"
    - name: "shear_speed (u_star)"
      unit: "m/s"
      role: "diagnostic"
    - name: "flood_water_depth (df)"
      unit: "m"
      role: "prognostic"
    - name: "soil_water_content (theta)"
      unit: "dimensionless 0-1"
      role: "prognostic"
    - name: "water_table_elevation (h_table)"
      unit: "m"
      role: "prognostic"
    - name: "snow_water_equivalent (h_swe)"
      unit: "m"
      role: "prognostic"
    - name: "snowpack_depth (h_snow)"
      unit: "m"
      role: "prognostic"
    - name: "outlet_discharge (Q_outlet)"
      unit: "m^3/s"
      role: "diagnostic"
    - name: "peak_discharge (Q_peak)"
      unit: "m^3/s"
      role: "accumulator"
    - name: "peak_time (T_peak)"
      unit: "min"
      role: "accumulator"
    - name: "discharge_volume_integral (vol_Q)"
      unit: "m^3"
      role: "accumulator"
    - name: "runoff_volume_integral (vol_R)"
      unit: "m^3"
      role: "accumulator"
    - name: "mass_balance_accumulators (vol_P/PR/PS/SM/ET/IN/Rg/GW)"
      unit: "m^3"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "outlet_discharge (Q_outlet)"
    validation_rank: 1
    unit: "m^3/s"
    description: "Volume flow rate at the basin outlet pixel (basin_outlet_water_x-section__volume_flow_rate); the simulated hydrograph."
    emitted_in: "*_0D-Q.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Gauged streamflow at the outlet; timing_accuracy especially relevant for snowmelt-driven basins where onset bias (~days) is the dominant error."
            - "Requires the outlet pixel to coincide with the gauge location."
      detrending_options: ["none"]
  - var: "peak_time_of_flow (T_peak)"
    validation_rank: 4
    unit: "min"
    description: "Time of peak outlet discharge (basin_outlet_water_x-section__peak_time_of_volume_flow_rate)."
    emitted_in: "*_report.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["timing_accuracy"]
          determining_metric: "day_bias"
          caveats:
            - "Compare against the observed time-to-peak for the same event."
      detrending_options: ["none"]
  - var: "peak_discharge (Q_peak)"
    validation_rank: 2
    unit: "m^3/s"
    description: "Running maximum basin-outlet channel-water discharge over the simulation."
    emitted_in: "*_report.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Peak magnitude is highly sensitive to precipitation-intensity unit errors and Manning's n."
      detrending_options: ["none"]
  - var: "outlet_depth (d_outlet)"
    validation_rank: 5
    unit: "m"
    description: "Mean flow depth at the basin outlet cross-section."
    emitted_in: "*_0D-d.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Stage records where available; depends on channel geometry assumptions."
      detrending_options: ["none"]
  - var: "outlet_velocity (u_outlet)"
    validation_rank: 6
    unit: "m/s"
    description: "Mean flow velocity at the basin outlet cross-section."
    emitted_in: "*_0D-u.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Rarely directly observed; usually inferred. Strongly controlled by Manning's n (inversion error gives ~100-1000x bias)."
      detrending_options: ["none"]
  - var: "channel_discharge_grids (Q)"
    validation_rank: 3
    unit: "m^3/s"
    description: "Distributed channel volume flow rate over the D8 grid (channel_water_x-section__volume_flow_rate)."
    emitted_in: "*_2D-Q.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Distributed discharge is rarely observed as a field; comparison is typically limited to interior gauges."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "At an interior gauge cell, extract the grid time series at that pixel."
      detrending_options: ["none"]
  - var: "depth_grids (d)"
    validation_rank: 7
    unit: "m"
    description: "Distributed channel/flood water depth over the grid (includes land_surface_water__depth df under the flood option)."
    emitted_in: "*_2D-d.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "event_detection"]
          determining_metric: "csi"
          caveats:
            - "Can be compared against an observed inundation extent/snapshot (flood map) as a categorical wet/dry field."
      detrending_options: ["none"]
  - var: "infiltration_rate_grids (v0 / IN)"
    validation_rank: 8
    unit: "m/s"
    description: "Distributed surface infiltration volume flux (soil_surface_water__infiltration_volume_flux)."
    emitted_in: "*_2D-v0.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Infiltration flux is essentially never observed directly as a field; comparison is diagnostic only."
      detrending_options: ["none"]

influence:
  edges:
    - from: "air_temperature (T_air, meteorological forcing)"
      to: "outlet_discharge (hydrograph timing)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "snowmelt-dominated basins"
      citations: ["schramm2007_topoflow_imnavait", "csdms_topoflow_snowmelt_degreeday"]
    - from: "degree_day_coefficient (c0)"
      to: "snowmelt_rate"
      sensitivity_grade: MEDIUM
      basis: mechanistic_inference
      lever_type: parameter
      applicability: "snow provider = degree_day"
      citations: ["csdms_topoflow_snowmelt_degreeday"]
    - from: "threshold_temperature (T0)"
      to: "snowmelt_rate"
      sensitivity_grade: MEDIUM
      basis: mechanistic_inference
      lever_type: parameter
      applicability: "snow provider = degree_day"
      citations: ["csdms_topoflow_snowmelt_degreeday"]
    - from: "snowmelt_rate (meltwater input)"
      to: "outlet_discharge"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "snowmelt-dominated basins"
      citations: ["schramm2007_topoflow_imnavait"]
    - from: "manning_n (channel friction)"
      to: "flow_velocity"
      sensitivity_grade: MEDIUM
      basis: mechanistic_inference
      lever_type: parameter
      applicability: "always"
      citations: ["csdms_topoflow_channels_kinwave", "peckham2017_topoflow_componentbased"]
    - from: "manning_n (channel friction)"
      to: "outlet_discharge"
      sensitivity_grade: MEDIUM
      basis: mechanistic_inference
      lever_type: parameter
      applicability: "always"
      citations: ["csdms_topoflow_channels_kinwave"]
    - from: "channel_bed_slope (S, D8 slope)"
      to: "flow_velocity"
      sensitivity_grade: MEDIUM
      basis: mechanistic_inference
      lever_type: parameter
      applicability: "always"
      citations: ["csdms_topoflow_channels_kinwave"]
    - from: "channel_geometry (bankfull width, bank angle, sinuosity)"
      to: "outlet_discharge"
      sensitivity_grade: LOW
      basis: mechanistic_inference
      lever_type: parameter
      applicability: "always"
      citations: ["csdms_topoflow_channels_kinwave"]
    - from: "infiltration_parameters (soil hydraulic properties)"
      to: "runoff (water-balance partitioning)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "infiltration-active runoff generation"
      citations: ["schramm2007_topoflow_imnavait", "peckham2017_topoflow_componentbased"]
    - from: "evapotranspiration_inputs (net radiation / Priestley-Taylor inputs)"
      to: "water_balance (ET flux)"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "seasonal water balance"
      citations: ["schramm2007_topoflow_imnavait"]
  citation_index:
    schramm2007_topoflow_imnavait:
      short_citation: "Schramm et al. 2007"
      doi: "10.1029/2006JG000326"
      note: "TopoFlow applied to the Imnavait Creek Arctic watershed; qualitative water-balance sensitivities, snowmelt-timing as dominant control on hydrograph timing (no quantitative SA index)."
    peckham2017_topoflow_componentbased:
      short_citation: "Peckham et al. 2017"
      doi: "10.1002/2016EA000237"
      note: "Authoritative TopoFlow model-description / reproducibility paper; names Manning's n, channel geometry/slope and snowmelt coefficients as the parameters driving discharge and water balance."
    csdms_topoflow_channels_kinwave:
      short_citation: "Peckham / CSDMS (Channels-Kinematic Wave)"
      doi: ""
      note: "CSDMS model-help reference: Q=v*A_w and Manning v=n^-1*Rh^(2/3)*S^(1/2); establishes direction/strength of n, S, geometry -> velocity/discharge (closed-form, not an SA index)."
    csdms_topoflow_snowmelt_degreeday:
      short_citation: "Peckham / CSDMS (Snowmelt-Degree-Day)"
      doi: ""
      note: "CSDMS model-help reference: meltrate M=(c0/86400)*(T_air-T0); establishes c0, T0 and T_air as the controls on snowmelt rate (closed-form, not an SA index)."

safety:
  hazards:
    - id: "precip_mm_per_day_intensity_inflation"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in mm/day instead of mm/hr; rainfall intensity 24x too high, peak Q 10-100x over-flooded. (dt_001)"
      severity: "silent"
    - id: "precip_preconverted_to_ms_double_conversion"
      kind: "weather_file_semantic"
      description: "Precipitation pre-converted to m/s before writing the .cfg; the model's internal /3.6e6 then makes it ~1e-6 too small, near-zero runoff. (dt_002)"
      severity: "silent"
    - id: "ET_mm_per_day_overconsumption"
      kind: "weather_file_semantic"
      description: "Read-file ET supplied in mm/day instead of mm/hr; ET 24x too high consumes all rainfall, negative net precipitation. (dt_012)"
      severity: "silent"
    - id: "air_temp_kelvin_no_snowmelt"
      kind: "weather_file_semantic"
      description: "Air temperature in Kelvin instead of Celsius (~293 degC); snow never melts and ET becomes extreme. (dt_005)"
      severity: "silent"
    - id: "RH_percent_vs_fraction"
      kind: "weather_file_semantic"
      description: "Relative humidity supplied as 0-100 percent instead of a 0-1 fraction; vapor-pressure calculation fails."
      severity: "silent"
    - id: "wind_height_mismatch"
      kind: "weather_file_semantic"
      description: "Wind measurement height does not match the .cfg z parameter (e.g. ERA5 10 m wind with z=2 m); wrong turbulent fluxes and ET. (dt_016)"
      severity: "silent"
    - id: "Ks_mm_per_hr_vs_ms"
      kind: "soil_semantic"
      description: "Saturated conductivity Ks in mm/hr instead of m/s (3.6e6x too high); infiltration error, all-or-nothing runoff. (dt_018)"
      severity: "silent"
    - id: "capillary_length_G_cm_vs_m"
      kind: "soil_semantic"
      description: "Green-Ampt capillary length G in cm instead of m (100x too large); excess infiltration, no surface runoff. (dt_004)"
      severity: "silent"
    - id: "porosity_percent_vs_fraction"
      kind: "soil_semantic"
      description: "Saturated water content theta_s as 0-100 percent instead of 0-1 fraction; moisture overflow / negative storage crash. (dt_010)"
      severity: "fatal_or_silent"
    - id: "theta_i_exceeds_theta_s"
      kind: "initial_condition_semantic"
      description: "Initial water content theta_i >= saturated theta_s; negative storage and numerical instability."
      severity: "fatal"
    - id: "uniform_scalar_initial_depth_spike"
      kind: "initial_condition_semantic"
      description: "Spatially-uniform positive scalar initial flow depth d0 produces an artificial very large initial peak and can crash the run."
      severity: "fatal_or_silent"
    - id: "slope_zero_division"
      kind: "numerical_instability"
      description: "Zero values in the slope grid cause 0/0 in the Manning/kinematic-wave velocity update over flat regions; floor slope at 1e-6 m/m. (dt_003)"
      severity: "fatal"
    - id: "channel_width_zero_division"
      kind: "numerical_instability"
      description: "Zero channel width at some cells (ridgelines/nodata) gives q=Q/w division by zero, Inf velocity, crash; floor width at ~0.1 m. (dt_015)"
      severity: "fatal"
    - id: "channel_dt_violates_CFL"
      kind: "numerical_instability"
      description: "Channel timestep larger than dx/v_max violates CFL; discharge oscillates and can go negative (typically need 2-6 s for 30 m grids). (dt_008)"
      severity: "degraded"
    - id: "manning_n_inverted"
      kind: "control_semantic"
      description: "Manning's n entered as conveyance 1/n; flow velocities 100-1000x off and hydrograph timing wrong. (dt_017)"
      severity: "silent"
    - id: "bank_angle_out_of_range"
      kind: "control_semantic"
      description: "Bank angle outside 0<=angle<90 produces negative top-width and a crash."
      severity: "fatal"
    - id: "stale_D8_codes_misrouting"
      kind: "control_semantic"
      description: "D8 flow codes/slope/area computed from a different (pre-edit) DEM are used silently; water routes uphill / wrong contributing area. (dt_006)"
      severity: "silent"
    - id: "rtg_dimension_mismatch"
      kind: "parser_semantic"
      description: "RTG binary file size does not equal nrows*ncols*4 bytes (mismatch with the .rti header); numpy.reshape reads shifted/scrambled spatial values. (dt_007)"
      severity: "silent"
    - id: "provider_component_name_case"
      kind: "control_semantic"
      description: "Misspelled or wrong-case component name in the provider file; EMELI raises 'component not found' at init (or falls back to defaults). (dt_009)"
      severity: "fatal"
    - id: "outlet_pixel_off_flow_domain"
      kind: "control_semantic"
      description: "Outlet pixel outside the D8 domain or on a ridge/non-flow cell; outlet discharge is always zero or NaN despite interior flow. (dt_014)"
      severity: "silent"
    - id: "save_interval_exceeds_duration"
      kind: "control_semantic"
      description: "save_grid_dt / save_pixels_dt larger than the simulation duration; NetCDF output has zero time steps. (dt_011)"
      severity: "degraded"
  validation_limits:
    - "Overland flow is modeled in a nonstandard way (stated CSDMS limitation); not a robust general overland-flow solver."
    - "Linkage between the unsaturated and saturated zones is not robust (stated limitation)."
    - "Recommended grid cell size ~100 m; grids typically smaller than 1000x1000 cells — very large/fine domains are outside the intended operating regime."
    - "Channel timestep is CFL-bound; the model cannot stably take arbitrarily large channel timesteps."
  warnings:
    - "Wave method is selected implicitly from the Channels .cfg extension string ('kinematic'/'diffusive'/'dynamic'), a silent behavioral switch that changes the active state-variable set (free-surface slope used by diffusive/dynamic; trapezoid Rh skipped under dynamic)."
    - "Net shortwave radiation is forced to zero between local sunset and sunrise."
    - "Pixels in flat areas receive an arbitrary small positive slope as a workaround; interpret routing over flats with care."
    - "The infiltration component writes its surface flux internally as 'v0' while the BMI contract advertises 'IN' — a documented name-mismatch (latent coupling trap) to watch when wiring providers."
  assumptions:
    - statement: "Channel cross-sections are trapezoidal; flow geometry is parameterised by bed width, bank angle and sinuosity."
      scope: "all channel-routing wave methods"
      source: "CSDMS Model_help:TopoFlow-Channels-Kinematic_Wave"
      status: "adopted"
    - statement: "Kinematic-wave routing retains only the friction and gravity momentum terms (S_free defaults to S_bed); the diffusive and dynamic methods add the free-surface-slope and inertial terms respectively."
      scope: "channel momentum closure"
      source: "CSDMS Model_help:TopoFlow-Channels-Kinematic_Wave; Peckham et al. 2017 (doi:10.1002/2016EA000237)"
      status: "adopted"
    - statement: "Meteorology / radiation modeling follows Dingman (2002) Appendix E."
      scope: "Meteorology component radiation and vapor-pressure derivation"
      source: "CSDMS Model_help:TopoFlow-Meteorology"
      status: "adopted"
    - statement: "Basin water budget is mass-balance-closed via per-component volume accumulators; a closed surface energy budget exists only when the energy-balance snow/evaporation components are selected."
      scope: "conservation / closure"
      source: "topoflow_driver mass-balance report and component structure (TopoFlow 3.6 source); CSDMS component docs"
      status: "adopted"

medium_evidence:
  - var: "peak_discharge (Q_peak)"
    source: "dag.yaml"
    quote: "Volume flow rate at the basin outlet pixel (basin_outlet_water_x-section__volume_flow_rate); the simulated hydrograph."
    note: "Q_peak is the running maximum of the outlet Q monitored by the driver, so the medium is basin-outlet channel water."
