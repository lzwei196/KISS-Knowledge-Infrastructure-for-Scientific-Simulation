  remedy: For point/seasonal-snow setups, in constants.toml set initial_snowheight_constant=0.2 and a
    thick ice base (initial_glacier_height ~= 70 m) so the column always retains thin near-surface layers;
    do NOT run with initial_snowheight=0 on a 1x1 point column.
