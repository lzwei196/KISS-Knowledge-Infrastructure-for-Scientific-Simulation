# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: EPIC
  language: fortran
  implementation:
    id: epic-1102
    version: 1102 (official release v2025-05-25)
    provenance: Fortran; USDA / Texas A&M Blackland Research Center EPIC 1102 console binary (epic1102-official_release.exe).
  scientific_reference_version: EPIC 1102 (Environmental Policy Integrated Climate; User's Manual v.1102,
    Doro et al., 2024)
  binary:
    path: KISSPATH_KI_ROOT/EPIC/bin/epic1102-official_release.exe
    type: PE32_wine
pipeline:
  stages: []
tools:
  count: 16
  files:
  - tools/_common.py
  - tools/build_control_files.py
  - tools/build_opc_file.py
  - tools/build_site_file.py
  - tools/build_soil_file.py
  - tools/configure_control.py
  - tools/configure_irrigation.py
  - tools/convert_forcing_to_epic.py
  - tools/edit_opc.py
  - tools/parse_outputs.py
  - tools/quickstart.py
  - tools/resolve_obs_shape.py
  - tools/run_epic.py
  - tools/select_crop.py
  - tools/set_output_types.py
  - tools/tune_parm.py
inputs:
  forcing:
  - name: SRAD (solar radiation)
    unit: MJ m-2 day-1
  - name: TMX (maximum air temperature)
    unit: degC
  - name: TMN (minimum air temperature)
    unit: degC
  - name: PRCP / RFV (precipitation, required)
    unit: mm day-1
  - name: RH / RHD (relative humidity, fraction) or dew point
    unit: fraction 0-1
  - name: WSPD / U10 (wind velocity at 10 m)
    unit: m s-1
  - name: CO2 (atmospheric concentration)
    unit: ppm
  - name: EVI (vegetation index, optional)
    unit: dimensionless
  parameters:
  - name: Latitude / longitude / elevation / aspect / slope / channel geometry / SCS curve number
    unit: deg, m, m/m, dimensionless
  - name: 'Soil profile per layer (up to 10): depth bottom, bulk density, wilting point, field capacity,
      sand/silt/clay, rock fragment, organic C, pH, CEC, Ksat, albedo, hydrologic group, USLE_K'
    unit: mixed (m, t/m3, m3/m3, %, cmol/kg, mm/hr)
  - name: 'Crop parameter database (~58 columns, 150+ crops): harvest index, biomass-energy ratio, leaf-area,
      heat-unit coefficients'
    unit: mixed
  - name: 'Global equation/calibration coefficients (S-curve and 64 general parameters: root growth, N
      mineralization, denitrification, CENTURY rates, Hargreaves coefficients, etc.)'
    unit: mixed
  - name: Fertilizer / tillage-implement / pesticide databases
    unit: mixed
  initial_conditions:
  - name: Initial soil water, nitrate/ammonium, organic C/N pools, residue per layer
    unit: mm, kg/ha
  boundary_conditions:
  - name: 'Operation schedule: plant, fertilize, irrigate, harvest, kill, tillage operations'
    unit: date + equipment/crop/material codes + OPV1..OPV9 operation values
  - name: 'Simulation control: NBYR years, start year/month/day, print code IPD, weather-input mode NGN,
      leap-year flag LPYR'
    unit: integer flags
  - name: PET method selector IET (1=Penman-Monteith, 2=Penman, 3=Priestley-Taylor, 4=Hargreaves, 5=Baier-Robertson)
    unit: method code
  - name: Water-erosion equation selector DRV (0=MUST, 2=USLE, 3=MUSS, 4=MUSL, 6=RUSL, 7=RUS2)
    unit: method code
  - name: Irrigation flag IRR (0=dryland, 1=scheduled, 2=auto-stress, 3=auto-deficit)
    unit: method code
  - name: Output variable / output-file selection (32 file-class toggles)
    unit: print flags
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - YLDG
  - BIOM
  - ET
  - Q
  - MUSS/MUST/USLE (water erosion sediment yield)
  - DN2O / VN2O
  - QNO3 / SNO3 (nitrate loss / soil nitrate)
  - YOC / TOC (soil organic carbon)
  - NPPC
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=-8.455, KGE=0.065, R=0.211, 6 scorecard(s)'
  metrics:
    best_nse: -8.4547
    best_kge: 0.0649
    best_r: 0.2106
summary:
  total_tools: 16
  total_stage_docs: 0
  total_diagnostic_triplets: 32
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
