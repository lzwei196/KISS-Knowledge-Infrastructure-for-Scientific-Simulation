model:
  name: "Ribasim"
  version: "2026.1.0-rc2"
  domain: "water_resources"
  description: "Network-based water resources model for regional surface water management"
  developer: "Deltares"
  binary_path: "KISSPATH_PYTHON_ENV/bin/python"
  core_language: "Julia (SciML ODE solvers)"
  api_language: "Python"

inputs:
  configuration:
    - name: "ribasim.toml"
      format: "TOML"
      description: "Main configuration file with solver, allocation, logging settings"
    - name: "database.gpkg"
      format: "GeoPackage (SQLite + spatial)"
      description: "All node/link/parameter data in spatial database"

  forcing:
    - name: "precipitation"
      unit: "m/s"
      valid_range: [0, 1.0e-5]
      description: "Vertical precipitation flux (NOTE: NOT mm/day)"
    - name: "evaporation"
      unit: "m/s"
      valid_range: [0, 5.0e-6]
      description: "Vertical evaporation flux (NOTE: NOT mm/day)"
    - name: "flow_boundary"
      unit: "m3/s"
      valid_range: [0, 100000]
      description: "External prescribed inflow at FlowBoundary nodes"
    - name: "level_boundary"
      unit: "m"
      valid_range: [-100, 10000]
      description: "External prescribed water level at LevelBoundary nodes"

  parameters:
    critical:
      - name: "basin_profile_area"
        unit: "m2"
        valid_range: [0, 1.0e12]
        description: "Area-level curve for basins; must be monotonically increasing with level"
      - name: "basin_profile_level"
        unit: "m"
        valid_range: [-1000, 10000]
        description: "Level values in area-level curve; must be monotonically increasing"
      - name: "basin_state_level"
        unit: "m"
        valid_range: [-1000, 10000]
        description: "Initial water level for each basin"
      - name: "resistance"
        unit: "s/m2"
        valid_range: [100, 1.0e8]
        description: "LinearResistance flow parameter; too high = no flow (silent error)"
      - name: "manning_n"
        unit: "s*m^(-1/3)"
        valid_range: [0.01, 0.10]
        description: "Manning roughness coefficient"
      - name: "pump_flow_rate"
        unit: "m3/s"
        valid_range: [0, 1000]
        description: "Maximum pump capacity"
      - name: "outlet_flow_rate"
        unit: "m3/s"
        valid_range: [0, 1000]
        description: "Maximum gravity-driven outflow"

    solver:
      - name: "algorithm"
        valid_values: ["QNDF", "FBDF", "Rosenbrock23", "Rodas4P"]
        default: "QNDF"
        description: "ODE solver algorithm"
      - name: "saveat"
        unit: "seconds"
        valid_range: [60, 2678400]
        default: 86400
        description: "Output interval (86400 = daily)"
      - name: "abstol"
        valid_range: [1.0e-10, 1.0e-1]
        default: 1.0e-5
        description: "Absolute solver tolerance"
      - name: "reltol"
        valid_range: [1.0e-10, 1.0e-1]
        default: 1.0e-5
        description: "Relative solver tolerance"
      - name: "depth_threshold"
        unit: "m"
        valid_range: [0.01, 1.0]
        default: 0.1
        description: "Low-storage reduction threshold"

outputs:
  primary:
    - name: "level"
      unit: "m"
      valid_range: [-1000, 50000]
      file: "basin.nc"
      description: "Basin water level over time"
    - name: "storage"
      unit: "m3"
      valid_range: [0, 1.0e12]
      file: "basin.nc"
      description: "Basin water volume over time"
    - name: "inflow_rate"
      unit: "m3/s"
      valid_range: [0, 100000]
      file: "basin.nc"
      description: "Total inflow to each basin"
    - name: "outflow_rate"
      unit: "m3/s"
      valid_range: [0, 100000]
      file: "basin.nc"
      description: "Total outflow from each basin"
    - name: "flow_rate"
      unit: "m3/s"
      valid_range: [-100000, 100000]
      file: "flow.nc"
      description: "Flow on each link per timestep"
    - name: "balance_error"
      unit: "m3/s"
      valid_range: [-0.001, 0.001]
      file: "basin.nc"
      description: "Water balance error (should be near zero)"

  secondary:
    - name: "basin_state.nc"
      description: "Final basin levels for restart"
    - name: "solver_stats.nc"
      description: "Solver performance metrics"
    - name: "subgrid_level.nc"
      description: "Detailed sub-basin water levels"

known_issues:
  - "Precipitation/evaporation must be in m/s, NOT mm/day — 86 million x error if wrong"
  - "Area must be in m2, NOT km2 — basin drains instantly if wrong"
  - "Allocation timestep must be in seconds, NOT days"
  - "Basin profile area-level must be monotonically increasing"
  - "Resistance too high causes silent zero-flow between basins"
  - "PID gains wrong sign causes oscillation/instability"
  - "depth_threshold too high prevents basin from filling"
