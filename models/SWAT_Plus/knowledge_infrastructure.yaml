  - s6_calibration_parameters_skill
  - s7_simulation_config_skill
  - s8_model_execution_skill
  - s9_output_parsing_skill
tools:
  count: 40
  files:
  - tools/calib_run.py
  - tools/s1/build_channel_topology.py
  - tools/s1/define_subbasins.py
  - tools/s1/delineate_watershed.py
  - tools/s10/configure_fertilizer.py
  - tools/s10/configure_nutrient_output.py
  - tools/s10/configure_point_sources.py
  - tools/s10/parse_nutrient_output.py
  - tools/s10/validate_water_quality.py
  - tools/s2/apply_hru_threshold.py
  - tools/s2/create_hru_overlay.py
  - tools/s2/generate_hru_from_global.py
  - tools/s2/write_channel_geometry.py
  - tools/s3/generate_weather_stations.py
  - tools/s3/prepare_weather_files.py
  - tools/s3/validate_weather_data.py
  - tools/s3/vic_forcing_to_swatplus.py
  - tools/s4/build_soils_database.py
  - tools/s4/hwsd_to_swatplus_soil.py
  - tools/s4/validate_soil_properties.py
  - tools/s5/build_management_schedules.py
  - tools/s5/configure_landuse.py
  - tools/s6/apply_calibration.py
  - tools/s6/calibrate_swatplus.py
  - tools/s6/generate_calibration_file.py
  - tools/s6/sensitivity_swatplus.py
