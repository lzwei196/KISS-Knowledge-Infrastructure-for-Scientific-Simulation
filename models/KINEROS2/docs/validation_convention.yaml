validation:
- dag_variable: discharge
  obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.75
      good: 0.65
      satisfactory: 0.5
    pass_band: satisfactory
    band_note: 'Fetched OA papers reproduce Moriasi-style streamflow classes: satisfactory 0.50-0.65, good 0.65-0.75,
      very good 0.75-1.00.'
    cites:
    - leta2023
    - cirilo2020
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: 10.0
      good: 15.0
      satisfactory: 25.0
    pass_band: satisfactory
    band_note: For monthly streamflow/runoff, the reproduced table gives PBIAS < +/-10 very good, +/-10 to +/-15
      good, +/-15 to +/-25 satisfactory.
    cites:
    - leta2023
    - cirilo2020
  - metric: r2
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.8
      good: 0.7
      satisfactory: 0.5
    pass_band: satisfactory
    band_note: The fetched table rates R2 <0.50 unsatisfactory, 0.50-0.70 satisfactory, 0.70-0.80 good, and >0.80
      very good.
    cites:
    - leta2023
  secondary_metrics:
  - metric: rsr
    direction: minimize
    status: supportive
    ceiling_reason: Reproduced Moriasi-style tables commonly co-report RSR for hydrologic model evaluation, but
      the KINEROS2 DAG determining metric is NSE and the cached KINEROS2 benchmarks emphasize NSE/R2.
    cites:
    - leta2023
    - cirilo2020
  - metric: peak_runoff_rate
    direction: maximize
    status: supportive
    ceiling_reason: Goodrich et al. recommend choosing objective functions by application purpose; culvert/bridge
      sizing should focus on peak runoff rates, detention-structure sizing on runoff volume.
    cites:
    - goodrich2012
  - metric: runoff_volume
    direction: maximize
    status: supportive
    ceiling_reason: Goodrich et al. recommend Nash-Sutcliffe efficiency on event runoff volumes and peak runoff
      rates for limited-event K2 hydrology calibration.
    cites:
    - goodrich2012
  validated_when: Event outlet discharge hydrograph (minute steps, one or more storms) is validated when NSE >=
    0.50, |PBIAS| <= 25% and R2 >= 0.50 in absolute units on a shared clock. These bands come from daily/monthly
    streamflow practice (Moriasi-style tables reproduced in leta2023/cirilo2020); KINEROS2-specific practice (goodrich2012)
    judges events by Nash-Sutcliffe on peak runoff rate and runoff volume across several events.
  rule:
    all_of:
    - metric: nse
      op: gte
      value: 0.5
    - metric: pbias
      op: abs_lte
      value: 25.0
    - metric: r2
      op: gte
      value: 0.5
  evidence_strength: strong
  confidence: 0.82
  notes: 'The DAG determining metric (nse) is retained and paired with PBIAS/R2 because the fetched hydrology convention
    papers say model performance is judged using multiple indicators. Leta 2023 reproduces flow/sediment ratings
    with "0.5 < NSE <= 0.65" satisfactory and "PBIAS < +/- 10" very good; Cirilo 2020 likewise lists monthly NSE/PBIAS/RSR
    classes adapted from Moriasi et al. (2007). KINEROS2- specific support comes from Goodrich 2012, which says
    K2 calibration/validation commonly uses Nash-Sutcliffe statistics for peak runoff rate and runoff volume, and
    from Nguyen 2015 and El Harche 2021, which report KINEROS2 discharge/runoff validation with NSE/R2 against observed
    data. Revised 2026-10-06 for the real event engine: the bands are transferred unchanged; the comparison unit
    is now one storm hydrograph at minute steps (not daily flow), so a single-event NSE is weak evidence.'
- dag_variable: infiltration
  obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      very_good: null
      good: null
      satisfactory: null
    pass_band: satisfactory
    band_note: No fetched paper gives a numeric direct-observation validation threshold for KINEROS2 infiltration
      time series; field practice validates its effect through runoff/discharge response.
    cites: []
  secondary_metrics:
  - metric: water_balance_closure
    direction: zero_centered
    status: supportive
    ceiling_reason: KINEROS2/AGWA literature treats infiltration parameters, especially saturated hydraulic conductivity
      and the suction term, as hydrology calibration controls for runoff volume rather than as directly graded observation
      products.
    cites:
    - goodrich2012
  - metric: runoff_response
    direction: maximize
    status: supportive
    ceiling_reason: Goodrich et al. recommend varying multipliers on saturated hydraulic conductivity and infiltration
      suction term to optimize Nash-Sutcliffe efficiency for event runoff volumes.
    cites:
    - goodrich2012
  validated_when: Not directly observed; internal event loss. Judge it through runoff_volume and discharge and the
    engine's event volume balance (< 1 percent error).
  evidence_strength: weak
  confidence: 0.32
  notes: The DAG lists infiltration as a comparable time series, but its caveat says it is rarely directly observed.
    The fetched KINEROS2 validation paper discusses infiltration as a process whose parameters are calibrated against
    event runoff volume and peak runoff rate, not as an output with standalone NSE pass bands. The null band prevents
    the gate from auto-validating or loosening a requirement on this internal flux.
- dag_variable: runoff_volume
  obs_shape: point_snapshot
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: 10.0
      good: 15.0
      satisfactory: 25.0
    pass_band: satisfactory
    band_note: Flow PBIAS classes (<+/-10 very good, +/-10-15 good, +/-15-25 satisfactory) reproduced in leta2023
      for streamflow; transferred to event runoff volume (PBIAS over the set of events).
    cites:
    - leta2023
  secondary_metrics:
  - metric: nse_over_events
    direction: maximize
    status: supportive
    ceiling_reason: Goodrich et al. recommend Nash-Sutcliffe efficiency on event runoff volumes for K2 calibration
      with few events.
    cites:
    - goodrich2012
  validated_when: Event runoff volume is validated when |PBIAS| <= 25% over the evaluated events, computed in m3
    (not depth) when the gauge's nominal area differs from the modelled area.
  evidence_strength: moderate
  confidence: 0.55
  notes: Added 2026-10-06 with the real-engine dag. Band transferred from monthly-flow practice; no fetched paper
    gives an event-volume-specific band.
- dag_variable: peak_discharge
  obs_shape: point_snapshot
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: null
      good: null
      satisfactory: null
    pass_band: satisfactory
    band_note: No fetched paper gives a numeric pass band for event peak discharge error; Goodrich et al. evaluate
      peaks with Nash-Sutcliffe across events.
    cites: []
  secondary_metrics:
  - metric: nse_over_events
    direction: maximize
    status: supportive
    ceiling_reason: Goodrich et al. recommend Nash-Sutcliffe statistics for peak runoff rate (and roughness calibration
      for peaks).
    cites:
    - goodrich2012
  - metric: time_to_peak_error
    direction: zero_centered
    status: supportive
    ceiling_reason: Goodrich et al. list time to peak among the watershed responses to evaluate for the problem
      at hand.
    cites:
    - goodrich2012
  validated_when: 'UNRESOLVED: no cited numeric band; report peak error (%) and time-to-peak error (min) per event,
    never a pass/fail.'
  evidence_strength: weak
  confidence: 0.3
  notes: Added 2026-10-06. Null band on purpose (an uncited threshold is not used).
- dag_variable: sediment_yield
  obs_shape: point_snapshot
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: null
      good: null
      satisfactory: 25.0
    pass_band: satisfactory
    band_note: wako2019 (KINEROS2/SWAT sediment yield study) accepts calibration when PBIAS < +/-25% for sediment;
      no finer classes cited.
    cites:
    - wako2019
  validated_when: Event sediment yield is validated when |PBIAS| <= 25% against measured event sediment (flume samplers
    or pond surveys), in t/ha after converting short tons/acre for ENGLISH runs.
  evidence_strength: moderate
  confidence: 0.45
  notes: Added 2026-10-06 with the real-engine dag (sediment routing is native to KINEROS2; the surrogate had none).
