template_version: "3.5"

identity:
  model_id: "DNDC"
  scientific_reference_version: "DNDCv.CAN 9.6.0 (Canadian branch of DNDC95, Aug-2015 UNH lineage; AAFC Grant & Smith)"
  implementation:
    id: "dndc-can-960"
    version: "9.6.0"
    provenance: "C++ (closed-source UNH/AAFC); Windows PE32 binary DNDC95.exe, no public source; field-scale daily biogeochemistry."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "Non-commercial (UNH/EOS); commercial licensing via Regrow Agriculture"
  repo_url: ""

boundary:
  scope_in:
    - "Crop growth and development (phenology, biomass accumulation, C/N partitioning to grain/leaf/stem/root)"
    - "Soil organic carbon decomposition and turnover (multi-pool: litter sub-pools, humads, humus, biochar)"
    - "Nitrogen cycling (mineralization, nitrification, denitrification, leaching, NH3 volatilization)"
    - "Trace-gas emissions (N2O, NO, N2, CO2, CH4) from soil biogeochemical processes"
    - "Soil water balance (infiltration, ET, drainage, tile drainage, preferential/bypass flow, water table)"
    - "Soil thermal regime (temperature profile, freeze/thaw, frost dynamics, snow cover)"
    - "Manure and organic-amendment decomposition including biosolid carbon pool"
    - "Management effects (tillage incl. inversion, fertilization, irrigation, grazing/cutting on perennials)"
  scope_out:
    - "Spatially distributed / gridded simulation (one site per .dnd; batch runs independent sites)"
    - "Lateral hydrologic routing between fields"
    - "Sub-daily (intra-day) gas-flux dynamics (daily internal time step)"
  spatial: "1-D column"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Maintains annual plant-soil mass budgets for carbon, nitrogen, and water at a single point. 1-D soil column simulated to a fixed 2 m (200 cm) depth in up to 10 layers (DNDCv.CAN 9.6.0; the parent DNDC95 v9.5 guide describes a 0-50 cm profile). ET options include an internal Penman-Monteith path when radiation/wind/humidity are supplied; this is a demand-side flux estimate, not a closed surface energy budget. Anaerobic-balloon scheme partitions each layer into aerobic (nitrification) and anaerobic (denitrification) fractions from predicted Eh."

inputs:
  forcing:
    - {category: forcing, name: "Maximum air temperature (MaxT)", unit: "deg C", source_kind: forcing, model_input_format: "daily climate .txt, one row per Julian day (365/366), no header; column layout set by climate format type", notes: "must be >= MinT; range -60..60"}
    - {category: forcing, name: "Minimum air temperature (MinT)", unit: "deg C", source_kind: forcing, model_input_format: "daily climate .txt column", notes: "range -60..60"}
    - {category: forcing, name: "Precipitation (Prec)", unit: "cm/day", source_kind: forcing, model_input_format: "daily climate .txt column", notes: "centimeters, NOT millimeters; daily total"}
    - {category: forcing, name: "Solar radiation", unit: "MJ/m2/day", source_kind: forcing, model_input_format: "daily climate .txt column (optional by format type)", notes: "daily integral 0-45, not instantaneous flux; enables internal Penman-Monteith ET"}
    - {category: forcing, name: "Wind speed", unit: "m/s", source_kind: forcing, model_input_format: "daily climate .txt column (optional by format type)", notes: "0-50"}
    - {category: forcing, name: "Relative humidity", unit: "% (0-100)", source_kind: forcing, model_input_format: "daily climate .txt column (optional by format type)"}
    - {category: forcing, name: "Atmospheric CO2 concentration", unit: "ppm", source_kind: forcing, model_input_format: "site CO2 setting (default 360) and/or optional MultiYear CO2 file, one ppm value per simulation year", notes: "affects photosynthesis; time-varying atmospheric driver"}
    - {category: forcing, name: "N concentration in rainfall", unit: "mg N/L", source_kind: forcing, model_input_format: "atmospheric-boundary setting (default 0.5)"}
    - {category: forcing, name: "Background atmospheric NH3", unit: "ug N/m3", source_kind: forcing, model_input_format: "atmospheric-boundary setting (default 0.06)", notes: "affects NH3 dry deposition on plants"}
    - {category: forcing, name: "N deposition", unit: "kg N/ha/yr", source_kind: forcing, model_input_format: "atmospheric-boundary setting"}
  parameters:
    - {category: parameter, name: "Soil layer thickness (per layer, up to 10)", unit: "m", source_kind: dataset_lookup, model_input_format: ".spf profile or inline .dnd soil section", notes: "thicknesses must sum to exactly 2.0 m"}
    - {category: parameter, name: "Bulk density (per layer)", unit: "g/cm3", source_kind: dataset_lookup, model_input_format: ".spf / inline soil", notes: "range 0.8-1.8"}
    - {category: parameter, name: "Surface SOC content", unit: "kgC/kg soil", source_kind: dataset_lookup, model_input_format: ".spf / inline soil", notes: "mass fraction not percent; 0.001-0.30 mineral, surface 0.005-0.06 typical"}
    - {category: parameter, name: "Soil texture class ID", unit: "integer 1-12 (DNDC class)", source_kind: dataset_lookup, model_input_format: ".spf / inline soil"}
    - {category: parameter, name: "Soil pH (H2O)", unit: "pH", source_kind: dataset_lookup, model_input_format: ".spf / inline soil", notes: "range 3.0-9.0; gates NH4:NH3 equilibrium and denitrification"}
    - {category: parameter, name: "Field capacity", unit: "WFPS fraction", source_kind: dataset_lookup, model_input_format: ".spf / inline soil", notes: "WFPS = VWC/porosity, not volumetric"}
    - {category: parameter, name: "Wilting point", unit: "WFPS fraction", source_kind: dataset_lookup, model_input_format: ".spf / inline soil"}
    - {category: parameter, name: "Porosity", unit: "v/v fraction", source_kind: dataset_lookup, model_input_format: ".spf / inline soil", notes: "porosity > FC > WP must hold"}
    - {category: parameter, name: "Saturated hydraulic conductivity", unit: "m/hr", source_kind: dataset_lookup, model_input_format: ".spf / inline soil"}
    - {category: parameter, name: "Clay fraction", unit: "0-1", source_kind: dataset_lookup, model_input_format: ".spf / inline soil"}
    - {category: parameter, name: "SOC pool partitioning fractions", unit: "fraction", source_kind: default, model_input_format: ".dnd soil section", notes: "very labile/labile/resistant litter, humads, humus, biochar; must sum to 1.0; default ~97% humus"}
    - {category: parameter, name: "SOC pool C/N ratios (per pool) and bulk C/N", unit: "-", source_kind: default, model_input_format: ".dnd soil section", notes: "bulk default ~10.09"}
    - {category: parameter, name: "Topsoil SOC depth and below-topsoil decrease rate", unit: "m / factor", source_kind: default, model_input_format: ".dnd soil section", notes: "default uniform depth 0.2 m; decrease rate default 2, range 0.5-5"}
    - {category: parameter, name: "Crop physiological coefficients (per crop type, 18+ built-in)", unit: "various", source_kind: default, model_input_format: ".dnd crop section", notes: "biomass fractions (sum 1.0), biomass C/N ratios, thermal degree days to maturity, base/optimum temperature, water demand coeff, max root length/depth, LAI max, frostkill temp, residue fraction"}
    - {category: parameter, name: "N fixation index", unit: "0-1", source_kind: default, model_input_format: ".dnd crop section", notes: "1 for legumes (soybean/alfalfa)"}
    - {category: parameter, name: "Perennial winterkill parameters (CHRMX, CDRMX, cTMX, pDFMX)", unit: "various", source_kind: default, model_input_format: ".dnd crop section", notes: "perennials only"}
    - {category: parameter, name: "Site latitude", unit: "deg N (-90..90)", source_kind: user_provided, model_input_format: ".dnd site section", notes: "drives daylength / solar geometry / phenology"}
    - {category: parameter, name: "Site longitude and elevation", unit: "deg E / m", source_kind: user_provided, model_input_format: ".dnd site section"}
  initial_conditions:
    - {category: initial_condition, name: "Initial NO3 / NH4 at surface", unit: "mg N/kg", source_kind: user_provided, model_input_format: ".dnd soil section", notes: "DNDC auto-defaults from SOC if unset"}
    - {category: initial_condition, name: "Initial soil moisture / WFPS by layer", unit: "fraction", source_kind: user_provided, model_input_format: ".dnd soil section"}
    - {category: initial_condition, name: "Initial soil temperature", unit: "deg C", source_kind: user_provided, model_input_format: ".dnd soil section"}
    - {category: initial_condition, name: "Initial microbial activity index", unit: "0-1", source_kind: default, model_input_format: ".dnd soil section", notes: "default 1.0 (normal non-toxic soil)"}
    - {category: initial_condition, name: "Initial SOC pool stocks / surface litter", unit: "fraction of total SOC / kgC/ha", source_kind: default, model_input_format: ".dnd soil section", notes: "equilibrated by spinup: internal reset-after-10-yr or external Result/Inter/soil_* state files; >=10 yr cropland, 50-100 yr natural"}
  boundary_conditions:
    - {category: boundary_condition, name: "Number of simulated years and start year", unit: "integer", source_kind: user_provided, model_input_format: ".dnd site section", notes: "1-100 yr; time-block years must sum to total"}
    - {category: boundary_condition, name: "Climate format type", unit: "integer 0-8", source_kind: user_provided, model_input_format: ".dnd model switch", notes: "must match actual climate-file column layout; type 4/8 enables Penman-Monteith ET"}
    - {category: boundary_condition, name: "Planting / harvest dates and harvest mode", unit: "calendar date / mode 1|2", source_kind: user_provided, model_input_format: ".dnd crop section", notes: "mode 2 (next year) required for fall-planted winter crops"}
    - {category: boundary_condition, name: "Tillage events", unit: "date, depth cm, mixing efficiency, inversion flag", source_kind: user_provided, model_input_format: ".dnd management section", notes: "none/conventional/reduced/no-till"}
    - {category: boundary_condition, name: "Fertilization events", unit: "kg N/ha per form", source_kind: user_provided, model_input_format: ".dnd management section", notes: "elemental N per form (urea, anhydrous NH3, ammonium bicarbonate, nitrate, ammonium, etc.); mode manual/auto/precision/fertigation; inhibitor efficiency/duration; controlled-release days"}
    - {category: boundary_condition, name: "Manure / organic amendment events", unit: "kgC/ha, kgN/ha", source_kind: user_provided, model_input_format: ".dnd management section", notes: "type dairy/beef/swine/poultry/compost/biosolid; C/N ratio, pH, dry matter %; method/depth"}
    - {category: boundary_condition, name: "Irrigation / controlled drainage", unit: "cm / index 0-1", source_kind: user_provided, model_input_format: ".dnd management section", notes: "event amount or trigger index; furrow/sprinkler/drip; controlled-drainage requires dynamic water table"}
    - {category: boundary_condition, name: "Grazing (perennials)", unit: "heads/ha, hours/day, biomass fractions", source_kind: user_provided, model_input_format: ".dnd management section"}
    - {category: boundary_condition, name: "Tile drainage / water table configuration", unit: "flag, depth m, spacing m, drain coeff 1/day, keDrain", source_kind: user_provided, model_input_format: ".dnd hydrology section", notes: "water-table flag uses REVERSED logic: 0=dynamic WT ON, 1=free drainage"}
    - {category: boundary_condition, name: "Execution switches", unit: "flags", source_kind: user_provided, model_input_format: ".dnd model-switch / batch", notes: "record-daily-results 0/1; reset-soil-after-10-yr internal spinup; read-from-spinup-file; preferential-flow toggle; dynamic layer depth (min 1-2 cm)"}

processes:
  modules:
    - name: "CropGrowth"
      role: process_solver
      brief: "Phenology, biomass accumulation and C/N partitioning to grain/leaf/stem/root, driven by thermal degree days, radiation-use efficiency, and water/N stress; 18+ built-in crop parameterizations including perennials with winterkill. Produces yield, LAI, PGI, N uptake."
    - name: "SoilThermal"
      role: process_solver
      brief: "Soil temperature profile with freeze/thaw, frost dynamics and snow cover; improved winter-spring frozen-soil dynamics underpinning the spring N2O burst (DNDCv.CAN enhancement)."
    - name: "SoilWaterBalance"
      role: process_solver
      brief: "Infiltration, evapotranspiration (Penman-Monteith when radiation/wind/humidity available), drainage, tile drainage, water table and preferential/bypass flow. Drives WFPS, drainage and runoff."
    - name: "Decomposition"
      role: process_solver
      brief: "Multi-pool SOC decomposition (litter sub-pools / humads / humus / biochar) and microbial turnover as a function of soil temperature and moisture; drives CO2 (heterotrophic respiration), SOC change, and N mineralization."
    - name: "NitrificationDenitrification"
      role: process_solver
      brief: "Anaerobic-balloon core: nitrification, denitrification, leaching and pH-sensitive NH4:NH3 equilibrium / NH3 volatilization. Produces N2O, NO, N2, NH3 and NO3 leaching."
    - name: "Fermentation"
      role: optional_module
      brief: "Methanogenesis and methanotrophy under low Eh (flooded/paddy/wetland systems); computes net CH4 flux. Relevant only when water-table-driven anaerobic conditions develop."
    - name: "Management"
      role: driver
      brief: "Injects management/amendment events (tillage incl. inversion, fertilization, manure/biosolid, irrigation, grazing/cutting) as C/N inputs and soil-disturbance events into the soil and crop state on their scheduled dates."
  internal_edges:
    - {from: "Inputs", to: "SoilThermal", kind: consumes_input, brief: "daily MaxT/MinT/radiation/snow drive the soil temperature profile"}
    - {from: "Inputs", to: "SoilWaterBalance", kind: consumes_input, brief: "daily precipitation/radiation/wind/humidity drive infiltration and ET"}
    - {from: "Inputs", to: "CropGrowth", kind: consumes_input, brief: "latitude/radiation/temperature drive daylength, phenology and photosynthesis"}
    - {from: "SoilWaterBalance", to: "CropGrowth", kind: invokes, brief: "soil moisture imposes water stress on biomass growth"}
    - {from: "SoilThermal", to: "Decomposition", kind: invokes, brief: "soil temperature modulates decomposition rate"}
    - {from: "SoilWaterBalance", to: "Decomposition", kind: invokes, brief: "soil moisture/WFPS modulates decomposition rate"}
    - {from: "Decomposition", to: "NitrificationDenitrification", kind: invokes, brief: "N mineralization supplies mineral-N substrate to the N cycle"}
    - {from: "CropGrowth", to: "NitrificationDenitrification", kind: invokes, brief: "root N uptake and residue input modify soil mineral-N and litter pools"}
    - {from: "Management", to: "NitrificationDenitrification", kind: invokes, brief: "fertilizer/manure inputs add mineral and organic N to the soil N cycle"}
    - {from: "Management", to: "Decomposition", kind: invokes, brief: "tillage redistributes residue/SOC; manure/biosolid adds organic C pools"}
    - {from: "SoilWaterBalance", to: "NitrificationDenitrification", kind: invokes, brief: "WFPS sets the anaerobic-balloon fraction controlling denitrification and N2O"}
    - {from: "SoilWaterBalance", to: "Fermentation", kind: invokes, brief: "water table / low-Eh conditions activate methanogenesis"}
    - {from: "CropGrowth", to: "Outputs", kind: produces_output, brief: "grain/biomass yield, LAI, N uptake"}
    - {from: "NitrificationDenitrification", to: "Outputs", kind: produces_output, brief: "N2O, NO, N2, NH3 emissions and NO3 leaching"}
    - {from: "Decomposition", to: "Outputs", kind: produces_output, brief: "CO2 respiration and SOC change"}
    - {from: "Fermentation", to: "Outputs", kind: produces_output, brief: "net CH4 flux"}
    - {from: "SoilWaterBalance", to: "Outputs", kind: produces_output, brief: "water-balance components and water-table depth"}

states:
  variables:
    - {name: "SOC pools (very labile / labile / resistant litter, humads, humus, biochar)", unit: "kgC/ha", role: prognostic}
    - {name: "Soil mineral N (NH4, NO3 by layer)", unit: "kgN/ha", role: prognostic}
    - {name: "Soil nitrite (NO2) and NO/N2O intermediates", unit: "kgN/ha", role: prognostic}
    - {name: "Microbial biomass C", unit: "kgC/ha", role: prognostic}
    - {name: "Soil water content / WFPS by layer", unit: "fraction", role: prognostic}
    - {name: "Water table depth", unit: "m", role: prognostic}
    - {name: "Soil temperature by layer (with freeze/thaw, snow pack)", unit: "deg C", role: prognostic}
    - {name: "Soil redox potential (Eh) / anaerobic fraction", unit: "mV / fraction", role: diagnostic}
    - {name: "Crop biomass pools (grain/leaf/stem/root)", unit: "kgC/ha", role: prognostic}
    - {name: "Plant Growth Index (PGI)", unit: "0-1", role: diagnostic}
    - {name: "Leaf Area Index (LAI)", unit: "m2/m2", role: diagnostic}
    - {name: "Accumulated thermal degree days", unit: "degree-days", role: accumulator}
    - {name: "Surface litter / residue C", unit: "kgC/ha", role: prognostic}
  provenance: "structural"

outputs:
  - var: "crop_grain_yield"
    validation_rank: 2
    unit: "kgC/ha"
    description: "Carbon mass of harvested grain; multiply by ~2.22 (1/0.45) for dry-matter yield"
    emitted_in: "Summary_CropYield"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats: ["Output is carbon mass; convert to dry matter before comparing to measured yield"]
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["National/regional yield aggregates carry a technology trend a weather-driven field model cannot reproduce; compare detrended trends/decadal means, not inter-annual r"]
      detrending_options: ["none", "linear_residual", "decadal_mean"]
  - var: "crop_N_uptake"
    validation_rank: 3
    unit: "kgN/ha"
    description: "Total crop nitrogen uptake over the season"
    emitted_in: "Summary_CropYield"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "N2O_emission"
    validation_rank: 4
    unit: "kgN/ha/yr"
    description: "Soil nitrous oxide emission, reported as N (x44/28=1.571 for kg N2O)"
    emitted_in: "Summary (annual N budget) / Day_SoilN (daily)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Model reproduces cumulative N2O far better than daily peaks; chamber daily peaks are often poorly matched"]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Best compared as cumulative/annual flux rather than instantaneous flux"]
      detrending_options: ["none"]
  - var: "NO_emission"
    validation_rank: 5
    unit: "kgN/ha/yr"
    description: "Soil nitric oxide emission (reported as N)"
    emitted_in: "Summary (annual N budget)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "N2_emission"
    validation_rank: 6
    unit: "kgN/ha/yr"
    description: "Dinitrogen emission from complete denitrification (reported as N)"
    emitted_in: "Summary (annual N budget)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["N2 flux is rarely measured directly; observational constraint is weak"]
      detrending_options: ["none"]
  - var: "NH3_volatilization"
    validation_rank: 7
    unit: "kgN/ha/yr"
    description: "Ammonia volatilization from fertilizer and manure (reported as N)"
    emitted_in: "Summary (annual N budget)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "CO2_soil_respiration"
    validation_rank: 8
    unit: "kgC/ha/yr"
    description: "Soil heterotrophic respiration / CO2 emission"
    emitted_in: "Summary (annual C budget)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Field flux observations mix autotrophic + heterotrophic respiration; DNDC reports heterotrophic"]
      detrending_options: ["none"]
  - var: "CH4_flux"
    validation_rank: 9
    unit: "kgC/ha/yr"
    description: "Net methane flux (production minus oxidation); relevant for rice/wetland systems"
    emitted_in: "Summary (annual C budget)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Meaningful only where water-table-driven anaerobic conditions develop (paddy/wetland)"]
      detrending_options: ["none"]
  - var: "NO3_leaching"
    validation_rank: 10
    unit: "kgN/ha/yr"
    description: "Nitrate leaching below the root zone or to tile drains"
    emitted_in: "Summary (annual N budget)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats: ["Leaching pathway depends on the water-table/tile-drainage configuration"]
      detrending_options: ["none"]
  - var: "SOC_stock_and_change"
    validation_rank: 1
    unit: "kgC/ha (stock), kgC/ha/yr (change)"
    description: "Soil organic carbon stock and inter-annual change / sequestration"
    emitted_in: "Summary_SOC"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "trend_match"]
          determining_metric: "pbias"
          caveats: ["SOC change is a small difference of large stocks; multi-year/decadal change is the meaningful signal and depends strongly on spinup equilibration"]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none", "first_difference"]
  - var: "water_balance_components"
    validation_rank: 11
    unit: "cm/yr"
    description: "Annual water-balance terms (precip, irrigation, evaporation, transpiration, runoff, drainage, tile flow, delta storage)"
    emitted_in: "Summary_WaterBalance"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "soil_temperature_profile"
    validation_rank: 12
    unit: "deg C (by layer)"
    description: "Daily soil temperature by layer (with freeze/thaw, snow)"
    emitted_in: "Day_Climate / Day_SoilWater"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Daily series emitted only when record-daily-results=1"]
      detrending_options: ["none"]
  - var: "soil_water_WFPS_and_water_table"
    validation_rank: 13
    unit: "fraction / m (by layer)"
    description: "Daily water-filled pore space by layer and water-table depth"
    emitted_in: "Day_SoilWater"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "r"
          caveats: ["Daily series emitted only when record-daily-results=1"]
      detrending_options: ["none"]

influence:
  edges:
    - from: "N fertilizer rate"
      to: "N2O_emission"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: management
      applicability: "always"
      citations: ["abdalla2020_dndc_n2o_maizewheat"]
    - from: "N fertilizer rate"
      to: "crop_grain_yield"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: management
      citations: ["abdalla2020_dndc_n2o_maizewheat"]
    - from: "initial soil organic carbon (SOC)"
      to: "N2O_emission"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      citations: ["abdalla2020_dndc_n2o_maizewheat", "abdalla2009_dndc_ireland_n2o"]
    - from: "initial soil organic carbon (SOC)"
      to: "SOC_stock_and_change"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      citations: ["qin2016_dndc_soc_sensitivity"]
