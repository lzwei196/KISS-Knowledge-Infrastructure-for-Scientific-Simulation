safety:
  hazards:
    - id: "smb_units_mm_vs_m_per_yr"
      kind: "weather_file_semantic"
      description: "acab supplied in mm/yr (or water-equivalent) instead of m/yr ice equivalent makes accumulation ~1000x too high, ice grows unbounded."
      severity: "silent"
    - id: "flwa_too_small_zero_velocity"
      kind: "coefficient_runtime_silent_fallback"
      description: "default_flwa set far below range (e.g. 1e-25) makes ice effectively rigid; thick ice with zero velocity."
      severity: "silent"
    - id: "geothermal_sign_convention"
      kind: "coefficient_runtime_silent_fallback"
      description: "Geothermal/bheatflx supplied positive instead of negative inverts the basal heat flux (CISM: negative=upward), corrupting basal temperature."
      severity: "silent"
    - id: "cfl_dt_too_large"
      kind: "numerical_instability"
      description: "dt too large for grid spacing violates the CFL condition dt < dew^2/(2*D_max); temperature/enthalpy blow up to NaN/SIGFPE."
      severity: "fatal"
    - id: "grid_spacing_km_vs_m"
      kind: "control_semantic"
      description: "dew/dns in km instead of meters shrinks the domain 1000x, producing wrong velocity magnitudes."
      severity: "silent"
    - id: "evolution_dycore_incompatible"
      kind: "control_semantic"
      description: "evolution=0 (pseudo-diffusion) with dycore=2 (Glissade) yields unrealistically thin ice; Glissade requires evolution=3 or 4."
      severity: "silent"
    - id: "bmlt_units_m_per_s"
      kind: "weather_file_semantic"
      description: "Basal melt in m/s (SI) instead of m/yr is ~3e7x too large; apply scyr=31536000."
      severity: "silent"
    - id: "output_frequency_exceeds_steps"
      kind: "control_semantic"
      description: "[CF output] frequency exceeding (tend-tstart)/dt writes zero time steps to the netCDF output."
      severity: "silent"
    - id: "temperature_held_to_artm"
      kind: "control_semantic"
      description: "temperature=0 overwrites the ice column with surface artm every step; no thermal evolution. Use temperature=1 for prognostic."
      severity: "silent"
    - id: "topg_sign_convention"
      kind: "initial_condition_semantic"
      description: "topg with wrong sign (positive below sea level) makes land appear submarine, producing false floating ice."
      severity: "silent"
    - id: "velocity_unit_si_vs_m_per_yr"
      kind: "parser_semantic"
      description: "Reading raw restart Fortran arrays (m/s SI) instead of netCDF output (m/yr, scyr-scaled) yields velocities ~3e7x too small."
      severity: "silent"
    - id: "config_section_silently_ignored"
      kind: "control_semantic"
      description: "Misspelled or wrong-case .config section names are silently ignored; the model defaults the affected physics with no error."
      severity: "silent"
    - id: "calving_disabled"
      kind: "control_semantic"
      description: "marine_margin=0 disables calving, so ice extends over open ocean with no mass loss."
      severity: "silent"
    - id: "trilinos_solver_unavailable"
      kind: "control_semantic"
      description: "which_ho_sparse=4 (Trilinos) without a Trilinos-linked build crashes at startup; use which_ho_sparse=3 (Glissade PCG)."
      severity: "fatal"
    - id: "jfnk_diverges_no_preconditioner"
      kind: "numerical_instability"
      description: "which_ho_nonlinear=1 (JFNK) fails to converge without a good preconditioner; Picard (=0) is more robust."
      severity: "fatal"
    - id: "sigma_levels_non_monotonic"
      kind: "control_semantic"
      description: "Custom [sigma] levels not monotonically increasing 0->1 crash CISM at initialization."
      severity: "fatal"
    - id: "input_time_index_out_of_range"
      kind: "control_semantic"
      description: "[CF input] time index (1-based) exceeding the input.nc time dimension crashes on read."
      severity: "fatal"
    - id: "restart_missing_required_fields"
      kind: "initial_condition_semantic"
      description: "Input/restart netCDF missing physics-required variables (e.g. beta for which_ho_babc=5) crashes the read."
      severity: "fatal"
    - id: "grid_dim_mismatch_config_vs_netcdf"
      kind: "control_semantic"
      description: "ewn/nsn in [grid] not matching x1/y1 dimensions in input.nc crashes with a dimension mismatch."
      severity: "fatal"
  validation_limits:
    - "The two internal positive-degree-day (PDD) mass-balance schemes are legacy Glimmer code that has not been extensively tested; CISM2 is intended for CESM-style coupling with externally computed SMB."
    - "The Glide (SIA) dycore runs single-processor only even when compiled in parallel; only Glissade runs in parallel."
    - "Several output fields (resid_u/resid_v, taux/tauy, uflx/vflx, dynbcmask, dthckdtm) are restricted to specific dycores (Glam-only, Glide-only, or Glissade-only)."
    - "SIA dynamics are inappropriate for ice streams, ice shelves, and marine grounding-line problems; higher-order (Glissade) is required there."
    - "Annual (glaciological) timescale: the model does not resolve sub-daily or seasonal hydrological processes."
  warnings:
    - "Internal velocities and fluxes are SI (m/s); netCDF output applies scyr=31536000 (365-day year) to emit m/yr, while restart arrays remain m/s. The unit meaning depends on which file is read."
    - "The dycore option hard-couples to the evolution option (Glissade requires remapping evolution=3/4); these config sections are not orthogonal."
    - "Preferred surface-mass-balance path is externally computed acab/artm via Glint coupling, not the internal PDD schemes."
  assumptions:
    - statement: "CISM solves conservation of mass and energy as closed budgets, with momentum solved diagnostically each step via a stress-balance approximation (SIA in Glide; Blatter-Pattyn/SSA/L1L2/DIVA in Glissade)."
      scope: "All grounded and floating ice in the domain."
      source: "CISM 2.1 documentation, Ch. 3 Conservation Equations and Chs. 4/6 (Glide/Glissade dynamical cores)."
      status: "adopted"
    - statement: "Geothermal/basal heat flux follows the CISM sign convention in which negative values denote upward flux into the ice base."
      scope: "geothermal parameter and bheatflx input field."
      source: "CISM 2.1 documentation Appendix A (bheatflx) and the dt_003 diagnostic in the KI triplets."
      status: "adopted"
    - statement: "acab is interpreted as m/yr ICE equivalent (water-equivalent SMB is converted by rhoi/rhow = 0.917 before use)."
      scope: "Surface mass balance forcing."
      source: "CISM 2.1 documentation Appendix A (acab units 'm/yr ice') and CISM forcing-preparation conventions."
      status: "adopted"
    - statement: "This dag describes CISM 2.1 as the standalone cism_driver forward model; CESM/Glint climate coupling is treated as an external SMB/temperature provider, not an in-scope coupled component."
      scope: "Model boundary and implementation identity."
      source: "CISM 2.1 documentation, Sec. 7.5 Climate Forcing Configuration."
      status: "adopted"
