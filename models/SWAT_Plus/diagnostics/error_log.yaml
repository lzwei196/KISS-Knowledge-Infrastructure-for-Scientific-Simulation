- id: err_006
  timestamp: '2026-03-20T08:00:00Z'
  recorded_by: claude
  run_context:
    basin: chaohe
    model: SWAT+
    run_name: chaohe_swatplus
  stage: s1_watershed_delineation
  failure_domain: parameter_format
  symptom:
    description: Channel threshold=100 cells generates 2,847 subbasins (extreme over-segmentation) causing SWAT+
      to take hours to run or crash. With threshold=5000, only 28 subbasins generated — 12x faster (358s to 29s).
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Stream network threshold too low for basin scale. Default threshold=100 accumulation cells at
      0.25deg (25km) resolution generates tiny sub-watersheds. For 9,000km2 basin at 90m DEM, threshold=5000
      gives proper stream density (1% channel cells, order 3).
    explanation: The channel threshold controls minimum contributing area for stream initiation. Too low creates
      an unrealistically dense channel network that overwhelms SWAT+ routing. Scale threshold with basin area
      and DEM resolution. For 90m DEM, 5000 cells = ~40 km2 minimum contributing area.
    affected_components:
    - generate_hru_from_global.py
    - channels.cha
    - subbasins
  resolution:
    action: Set channel threshold to 5000 for basins >5000km2 at 90m DEM resolution. Scale proportionally
      for different DEM resolutions.
    files_changed:
    - tools/s2/generate_hru_from_global.py
    prevention: generate_hru_from_global.py defaults to threshold=5000
  severity: degraded
  promoted: false
  promoted_as: ''
