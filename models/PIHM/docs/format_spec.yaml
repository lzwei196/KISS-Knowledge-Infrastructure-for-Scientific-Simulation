    depth).
  diagnosis: 'GW is the head ABOVE THE ELEMENT''S AQUIFER BOTTOM: lat_flow.c uses (elem.ws.gw + elem.topo.zmin)
    as the head elevation, and topo.zmin is the MEAN of the three node ZMIN values. So GW is neither a
    datum elevation nor a depth below ground. A second, separate error is using the element''s mean ZMAX
    as t'
  remedy: 'Convert in DEPTH space, then re-datum with the WELL''s own surveyed elevation: sim_depth_to_water
    = elem_zmax - (elem_zmin + GW); sim_level_datum = well_ground_elev - sim_depth_to_water. NSE/r/KGE
    are identical whether scored on depth or on level, but the depth-space route removes the element-averagi'
