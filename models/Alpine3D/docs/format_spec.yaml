# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: Alpine3D
  language: c++
  implementation:
    id: alpine3d-slf
    version: 3.2.0
    provenance: C++ (MPI/OpenMP parallelized); WSL/SLF Alpine3D driver coupling the SNOWPACK 1D column
      engine and the MeteoIO I/O/interpolation library.
  scientific_reference_version: Alpine3D 3.2.0 (SLF release; SNOWPACK 1D snow/soil physics + MeteoIO interpolation
    + EnergyBalance terrain radiation + optional SnowDrift + Runoff)
inputs:
  forcing:
  - name: Air temperature (TA)
    unit: K
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Authored in Kelvin; MeteoIO min_max filter (240-320 K) rejects Celsius values as nodata.
  - name: Relative humidity (RH)
    unit: fraction 0-1
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Fraction, not percent; values >1 are clipped to 1.0 causing permanent saturation.
  - name: Wind speed (VW)
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
  - name: Wind direction (DW)
    unit: degrees (0=N,90=E,180=S,270=W)
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Required for LISTON_WIND spatial interpolation.
  - name: Precipitation (PSUM)
    unit: kg/m2 (mm w.e.)
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Accumulated water-equivalent; accumulation period must equal the step length.
  - name: Incoming shortwave radiation (ISWR)
    unit: W/m2
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Optional; prefer MeteoIO CLEARSKY_SW generator over supplying synthesized values.
  - name: Incoming longwave radiation (ILWR)
    unit: W/m2
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Optional; can be generated by MeteoIO ALLSKY_LW (Unsworth) / CLEARSKY_LW (Dilley).
  - name: Atmospheric pressure (P)
    unit: Pa
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Optional; STD_PRESS lapse used when absent.
  - name: Snow height (HS)
    unit: m
    category: forcing
    source_kind: forcing
    model_input_format: SMET station time series
    notes: Optional; used for validation or with ENFORCE_MEASURED_SNOW_HEIGHTS.
  - name: 3-D / gridded wind fields
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: MeteoIO GRID3D plugin (e.g. ARPS), WINDFIELDS key
    notes: Required only when SnowDrift is enabled (--enable-drift).
  parameters:
  - name: Roughness length (ROUGHNESS_LENGTH)
    unit: m
    category: parameters
    source_kind: calibrated
    model_input_format: '[Snowpack] config key'
    notes: Default 0.002 m; controls Monin-Obukhov turbulent exchange; high sensitivity.
  - name: Height of meteo values (HEIGHT_OF_METEO_VALUES)
    unit: m
    category: parameters
    source_kind: calibrated
    model_input_format: '[Snowpack] config key'
    notes: Default 2.0 m; measurement reference height for turbulent fluxes.
  - name: Geothermal heat flux (GEO_HEAT)
    unit: W/m2
    category: parameters
    source_kind: calibrated
    model_input_format: '[Snowpack] config key'
    notes: Default 0.06 W/m2; basal boundary flux controlling basal melt.
  - name: Rain/snow threshold (THRESH_RAIN)
    unit: K above freezing
    category: parameters
    source_kind: calibrated
    model_input_format: '[SnowpackAdvanced] config key'
    notes: Default ~1.2 K; partitions precipitation phase; high sensitivity.
  - name: Air-temperature lapse rate
    unit: K/m
    category: parameters
    source_kind: calibrated
    model_input_format: '[Interpolations2D] config'
    notes: Typical -0.003 to -0.009 K/m; governs interpolated TA field.
  - name: Precipitation lapse rate
    unit: 1/m
    category: parameters
    source_kind: calibrated
    model_input_format: '[Interpolations2D] config'
    notes: Sets the elevation gradient of interpolated precipitation.
  - name: DEM grid
    unit: m elevation
    category: parameters
    source_kind: dataset_lookup
    model_input_format: ARC ASCII raster
    notes: Defines domain extent, resolution, CRS; shadow-casting cells outside the domain must be retained.
  - name: Land-use / land-cover grid
    unit: categorical (PREVAH 1LLDC codes)
    category: parameters
    source_kind: dataset_lookup
    model_input_format: ARC ASCII raster
    notes: One code per cell; header (ncols,nrows,xllcorner,yllcorner,cellsize) must match the DEM exactly.
  - name: Catchment-definition grid
    unit: powers-of-two membership code
    category: parameters
    source_kind: dataset_lookup
    model_input_format: ARC ASCII raster
    notes: Optional; needed for sub-catchment runoff aggregation.
  - name: Soil/snow layer physical coefficients (in .sno)
    unit: mixed (Rho_S kg/m3, Conduc_S W/m/K, HeatCapac_S J/kg/K, rg/rb mm)
    category: parameters
    source_kind: dataset_lookup
    model_input_format: SMET .sno per-cell file
    notes: Static substrate/snow microstructure coefficients within the initial profile.
  initial_conditions:
  - name: Initial snow/soil stratigraphy (.sno)
    unit: mixed per field
    category: initial_conditions
    source_kind: user_provided
    model_input_format: SMET 1.1 .sno per grid cell (or per land-cover class)
    notes: 'Per-layer Layer_Thick (m), T (K), Vol_Frac_I/W/V/S (sum=1.0), density, grain rg/rb, dd, sp,
      mk; must be dated before simulation start. Recommended cold-start: bare ground on Oct 1, or 3-5
      yr soil-temperature spinup.'
  - name: Canopy initial state
    unit: mixed
    category: initial_conditions
    source_kind: user_provided
    model_input_format: canopy parameters in .sno / land-cover config
    notes: Initial vegetation/canopy energy-mass state (CanopyData).
  boundary_conditions:
  - name: Distributed mode switch (ALPINE3D)
    unit: boolean
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[SnowpackAdvanced] config key'
    notes: Must be TRUE; if FALSE, SNOWPACK runs each cell as an independent point ignoring distributed
      forcing/terrain.
  - name: Coordinate system (COORDSYS / COORDPARAM)
    unit: CRS identifier
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[Input]/[Output] config keys'
    notes: Must match the DEM CRS and use MGRS band-letter notation for UTM; mismatch silently misplaces
      stations.
  - name: Computation step length (CALCULATION_STEP_LENGTH)
    unit: minutes
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[Snowpack] config key'
    notes: Default 15 min; sets the SNOWPACK inner sub-step count only — the outer driver cadence is hardcoded
      at 3600 s.
  - name: Snow-erosion / SnowDrift enable (SNOW_EROSION / --enable-drift)
    unit: switch
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[SnowpackAdvanced] config / build flag'
    notes: Activates wind-driven redistribution and the 3-D wind-field requirement.
  - name: Snow water-transport model (WATERTRANSPORTMODEL_SNOW)
    unit: method selector (BUCKET / RICHARDSEQUATION)
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[SnowpackAdvanced] config key'
    notes: Selects bucket vs Richards-equation percolation.
  - name: Atmospheric stability scheme (ATMOSPHERIC_STABILITY)
    unit: method selector
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[Snowpack] config key'
    notes: Default MO_MICHLMAYR; controls Monin-Obukhov correction; high sensitivity.
  - name: Terrain radiation method (TERRAIN_RADIATION_METHOD)
    unit: method selector (SIMPLE / COMPLEX / HELBIG)
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[EBalance] config key'
    notes: Selects the terrain reflected/emitted radiation algorithm; only active when terrain radiation
      is enabled.
  - name: Precipitation undercatch correction (PSUM undercatch_wmo)
    unit: filter selector
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '[Filters] config key'
    notes: Corrects solid-precipitation gauge undercatch (e.g. Hellmannsh); requires VW present.
outputs:
  primary:
  - name: SWE
    unit: kg/m2
    description: Snow water equivalent per pixel (bulk snowpack mass).
    validation_rank: 1
    emitted_in: Gridded ARC ASCII (YYYYMMDDHHMI_SWE.asc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Point pillow/snow-course obs compare to the containing pixel; sub-pixel terrain and drift create
          representativeness error.
        - Gauge solid-precipitation undercatch can drive strong negative SWE bias unless an undercatch
          correction is enabled.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Against airborne/laser-scan snow-depth-derived SWE maps; wind redistribution dominates the spatial
          pattern.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Requires repeat distributed snapshots; comparison is per-snapshot spatial plus accumulation
          timing.
      detrending_options:
      - none
  - name: HS
    unit: m
    description: Snow depth per pixel.
    validation_rank: 2
    emitted_in: Gridded ARC ASCII (YYYYMMDDHHMI_HS.asc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Snow-on/snow-off timing is informative; representativeness error at the point applies.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Laser-scan / photogrammetry snow-depth maps are the canonical distributed reference.
      detrending_options:
      - none
  - name: TSS
    unit: K
    description: Snow (or bare-surface) skin temperature from the surface energy balance.
    validation_rank: 6
    emitted_in: Gridded ARC ASCII; POI .met time series
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Sensitive to longwave forcing quality; synthesized ILWR can bias nighttime cooling.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Against thermal-IR remote-sensing surface-temperature retrievals.
      detrending_options:
      - none
  - name: MS_SNOWPACK_RUNOFF
    unit: kg/m2
    description: Surface runoff leaving the base of the snowpack (snow/soil interface), per pixel; aggregated
      to sub-catchment sums by Runoff.
    validation_rank: 3
    emitted_in: Gridded ARC ASCII; sub-catchment SMET runoff sums
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Alpine3D produces runoff generation only; channel routing is external (e.g. PREVAH), so direct
          comparison to gauged streamflow conflates the missing routing.
        - Component sums (precip/snowmelt/glacier-melt) are measured at the snow/soil interface and are
          smaller than total column-base runoff.
      detrending_options:
      - none
  - name: MS_SOIL_RUNOFF
    unit: kg/m2
    description: Runoff at the bottom of the soil column, per pixel.
    validation_rank: 7
    emitted_in: Gridded ARC ASCII; sub-catchment SMET runoff sums
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Total column-base runoff; same external-routing caveat as surface runoff.
      detrending_options:
      - none
  - name: RSNO
    unit: kg/m3
    description: Mean snowpack density per pixel.
    validation_rank: 4
    emitted_in: Gridded ARC ASCII
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Bulk density from snow-pit / snow-course density measurements at the pixel.
      detrending_options:
      - none
  - name: POI energy/mass-balance terms (.met)
    unit: mixed (W/m2, kg/m2, K)
    description: 'Full per-timestep SNOWPACK energy and mass balance at Points of Interest: lw_in/out,
      sw_in/out, sensible (qs), latent (ql), ground (qg) fluxes, snow/rain precip, evaporation, sublimation,
      melt, runoff, HS, SWE, density, layer count, surface temperature, stability indices.'
    validation_rank: 5
    emitted_in: POI .met SMET time series; .pro stratigraphy profiles
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Flux-tower / energy-balance-station comparison; closure depends on the active ET and stability
          options.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: 'Model crashes immediately or snow surface temperature approaches absolute zero. Error log
    may show "T_CRAZY_MIN" filter triggered or segfault in energy balance.

    '
  diagnosis: 'Air temperature (TA) provided in Celsius instead of Kelvin. Alpine3D expects all temperatures
    in SMET files to be in Kelvin. A value of 20 (°C) is interpreted as 20 K (-253°C), far below the T_CRAZY_MIN
    threshold (default 210 K).

    ; MeteoIO reads raw values from SMET fields and passes them directly t'
  remedy: 'Add 273.15 to all temperature values before writing SMET files; convert_forcing_to_smet; [''Open
    the SMET file and check TA values: they should be 230–320 range'', ''If values are -40 to +40, they
    are in Celsius — add 273.15'', ''Also check TSS, TSG fields if present'']; In convert_forcing_to_smet.py,
    val'
  severity: silent
- id: dt_002
  symptom: 'Entire domain shows 100% relative humidity. Snowfall occurs every timestep even when observations
    show clear sky. SWE accumulates unrealistically fast.

    '
  diagnosis: 'Relative humidity (RH) provided as percentage (0–100) instead of fraction (0–1). The RH
    min_max filter clips values to max=1.0, so all values above 1 become 1.0 (saturated atmosphere).

    ; With RH=1.0 everywhere, the dewpoint equals air temperature. The precipitation phase algorithm sees
    constant satu'
  remedy: 'Divide RH values by 100 if they are in percent range; convert_forcing_to_smet; [''Check SMET
    file: RH values should be 0.0–1.0'', ''If values are 30–100, divide by 100'']; Add check: if rh_values.max()
    > 1.5, assume percent and divide by 100.

    '
  severity: silent
- id: dt_003
  symptom: 'Wind speeds appear extremely high (>50 m/s regularly). Turbulent fluxes are unrealistically
    large. Snow erosion is excessive. The VW min_max filter may flag many values as nodata.

    '
  diagnosis: 'Wind speed (VW) provided in km/h instead of m/s. A typical wind of 20 km/h is interpreted
    as 20 m/s (72 km/h, near-gale force).

    ; The VW filter range (default 0.2–50 m/s) will pass most km/h values but the physics will compute
    vastly excessive sensible heat flux and snow erosion.

    ; [''convert_forcing'
  remedy: 'Divide wind speed by 3.6 to convert km/h to m/s; convert_forcing_to_smet; [''Check VW values:
    typical mountain values are 0–15 m/s'', ''If values are frequently >20, they may be in km/h'']; Validate:
    assert vw_values.quantile(0.99) < 30, "VW may be in km/h"

    '
  severity: silent
- id: dt_004
  symptom: 'Wind direction values cluster near 0–6.28 instead of 0–360. Liston wind interpolation produces
    incorrect terrain-adjusted wind fields. Wind patterns show no correlation with topography.

    '
  diagnosis: 'Wind direction (DW) provided in radians instead of degrees. Alpine3D expects meteorological
    convention: 0=N, 90=E, 180=S, 270=W.

    ; All DW values in radians (0–2π ≈ 0–6.28) fall in the 0–6.28° range, meaning the model sees nearly
    all wind coming from the North. The Liston wind interpolation algorithm'
  remedy: 'Convert radians to degrees: DW_deg = DW_rad * 180 / π; convert_forcing_to_smet; [''Check DW
    values: should span 0–360'', ''If max(DW) < 7, values are likely in radians'']; Add check: if dw_values.max()
    < 10, assume radians and convert.

    '
  severity: silent
- id: dt_005
  symptom: 'Precipitation is 1000x too high. SWE reaches tens of meters in the first week. Lake and river
    flooding. Model may crash from excessive snow layers.

    '
  diagnosis: 'Precipitation (PSUM) provided in meters instead of mm (kg/m²). 1 mm of rain input as 0.001
    is correct, but 1 mm input as 1.0 m gives 1000x excess.

    ; SMET PSUM field is in kg/m² which equals mm water equivalent. Some reanalysis datasets (e.g., ERA5)
    provide precipitation in meters. The factor-1000 er'
  remedy: 'Multiply by 1000 if precipitation is in meters (m → mm); convert_forcing_to_smet; [''Check
    PSUM values: hourly values should typically be 0–10 mm'', ''If values are 0–0.01, they are likely
    in meters'']; Validate: warn if max(PSUM) < 0.1 over a month (likely in meters).

    '
  severity: silent
- id: dt_006
  symptom: 'Atmospheric pressure ~1000 Pa instead of ~100000 Pa. The STD_PRESS spatial interpolation produces
    incorrect barometric corrections. Turbulent flux calculations are affected.

    '
  diagnosis: 'Pressure (P) provided in hPa (mbar) instead of Pa. Sea-level pressure is ~1013 hPa = 101300
    Pa.

    ; With P=1013 Pa (instead of 101300), the air density computed by the model is ~100x too low, causing
    sensible and latent heat fluxes to be underestimated.

    ; [''convert_forcing_to_smet.py'']'
  remedy: 'Multiply pressure by 100 to convert hPa to Pa; convert_forcing_to_smet; [''Check P values:
    should be 50000–110000 Pa'', ''If values are 500–1100, they are in hPa'']; Add check: if p_values.mean()
    < 2000, assume hPa and multiply by 100.

    '
  severity: silent
- id: dt_007
  symptom: 'Shortwave radiation values are tiny (0–30 instead of 0–1000). Snow never melts in spring.
    Energy balance shows near-zero solar input.

    '
  diagnosis: 'Incoming shortwave radiation (ISWR) in MJ/m²/day instead of W/m². Typical summer daily total
    is ~25 MJ/m²/day = ~290 W/m² average.

    ; With ISWR=25 W/m² (instead of 290), the energy balance receives only 8.6% of the actual solar forcing.
    Snow melt is severely underestimated.

    ; [''convert_forcing_to_sme'
  remedy: 'Convert MJ/m²/day to W/m²: multiply by 1e6/86400 = 11.574; convert_forcing_to_smet; [''Check
    ISWR values: peak summer values should be 800–1200 W/m²'', ''If peak values are 20–35, they are in
    MJ/m²/day'']; Validate: assert iswr_values.max() > 100, "ISWR appears to be in MJ/m²/day"

    '
  severity: silent
- id: dt_008
  symptom: 'Longwave radiation values are tiny (5–30 instead of 150–400). The ILWR generator kicks in
    constantly, overriding measurements. Surface temperature drops unrealistically at night.

    '
  diagnosis: 'Incoming longwave radiation (ILWR) in MJ/m²/day instead of W/m². Typical value is ~300 W/m²
    = ~26 MJ/m²/day.

    ; With ILWR=26 W/m² instead of 300, the atmosphere appears almost transparent to longwave radiation.
    The ALLSKY_LW generator may replace these values if configured, masking the error for ILWR'
  remedy: 'Convert MJ/m²/day to W/m²: multiply by 1e6/86400 = 11.574; convert_forcing_to_smet; [''Check
    ILWR values: should be 150–400 W/m²'', ''If values are 10–35, they are in MJ/m²/day'']; Validate:
    assert ilwr_values.mean() > 100, "ILWR appears to be in MJ/m²/day"

    '
  severity: silent
- id: dt_009
  symptom: 'Initial snow height (HS) is 100x too large. Model initializes with 100+ m of snow. Or HS is
    always near zero despite known snowpack.

    '
  diagnosis: 'Snow height (HS) provided in cm instead of meters. A 1 m snowpack entered as 100 (cm) becomes
    100 m in the model.

    ; HS in SMET is in meters. This field is used both for validation and, when ENFORCE_MEASURED_SNOW_HEIGHTS=TRUE,
    to force the snow depth, making errors catastrophic.

    ; [''convert_forcing_t'
  remedy: 'Divide HS values by 100 to convert cm to m; convert_forcing_to_smet; [''Check HS values: typical
    values are 0–5 m'', ''If values are 0–500, they are in cm'']; Validate: assert hs_values.max() < 20,
    "HS appears to be in cm"

    '
  severity: silent
- id: dt_010
  symptom: 'Soil layers are absurdly thick (50–100 m) or paper thin (0.001 m when expecting 0.5 m). Snow
    layers have wrong thickness. Total column height is unrealistic.

    '
  diagnosis: 'Layer_Thick in .sno file is in wrong units. Alpine3D expects meters. Common errors: cm (÷100),
    mm (÷1000), or feet (×0.3048).

    ; Each layer''s thickness (hl field) in the .sno file must be in meters. The sum of all layer thicknesses
    must equal the total column height. Wrong thickness causes element co'
  remedy: 'Ensure all Layer_Thick values are in meters; generate_sno_files; [''Check .sno file: Layer_Thick
    for soil should be 0.1–2.0 m'', ''Sum of thicknesses should equal total column height'']; Assert:
    0.01 < layer_thick < 10.0 for each layer.

    '
  severity: silent
- id: dt_011
  symptom: 'Grain radius values in .sno file are 1000x too small or too large. Metamorphism model produces
    unrealistic grain growth. Albedo parameterization gives wrong values.

    '
  diagnosis: 'Grain radius (rg) in .sno file must be in mm. Providing µm (÷1000) or m (×1000) produces
    unrealistic snow microstructure.

    ; Typical fresh snow grain radius is 0.1–0.3 mm, old snow 0.5–2.0 mm. Values in µm (100–300) are 1000x
    too large in mm scale, causing the albedo model to predict extremely low al'
  remedy: 'Ensure rg is in mm. Convert µm: ÷1000. Convert m: ×1000; generate_sno_files; [''Check rg values:
    should be 0.1–5.0 mm for snow'', ''If values are 100–5000, they are in µm'']; Assert: 0.05 < rg <
    10.0 for each layer.

    '
  severity: silent
- id: dt_012
  symptom: 'Soil density is 1000x too low (1.8 instead of 1800 kg/m³). Soil thermal conductivity is wrong.
    Soil heat capacity is wrong. Ground temperature evolution is unrealistic.

    '
  diagnosis: 'Soil density (Rho_S) in .sno file provided in g/cm³ instead of kg/m³. Typical mineral soil
    density: 1.5–2.7 g/cm³ = 1500–2700 kg/m³.

    ; With density 1.8 kg/m³ (instead of 1800), the soil has essentially no thermal mass and heats/cools
    instantly with air temperature. Permafrost simulations will show n'
  remedy: 'Multiply soil density by 1000 to convert g/cm³ to kg/m³; generate_sno_files; [''Check Rho_S
    values: should be 1000–2700 kg/m³'', ''If values are 1.0–2.7, they are in g/cm³'']; Assert: rho_s
    > 500 for soil layers.

    '
  severity: silent
- id: dt_013
  symptom: 'Geothermal heat flux is 1000x too high. Soil bottom boundary melts snow from below. Basal
    melt is dominant even in winter.

    '
  diagnosis: 'GEO_HEAT parameter in [Snowpack] section provided in mW/m² instead of W/m². Typical geothermal
    heat flux: 50–100 mW/m² = 0.05–0.1 W/m².

    ; With GEO_HEAT=60 (mW/m² entered as W/m²), the basal heat flux is 1000x the actual value, causing
    rapid melting from below.

    ; [''io.ini [Snowpack] section'']'
  remedy: 'Divide by 1000: GEO_HEAT = 0.06 (not 60); None; [''Check GEO_HEAT value: should be 0.01–0.15
