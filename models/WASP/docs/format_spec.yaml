# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: WASP
  language: fortran/c++ (closed-source EPA Windows binaries)
  implementation:
    id: usepa-wasp-8.5.0
    version: 8.5.0
    provenance: EPA WASP 8.5.0 Windows binaries (waspccli.exe engine, wasptool.exe data API, BMD2_Extract.exe)
      from the official installer wasp-version-8.5.0-install-64-bit-10-25-2025.exe (sha256 2bb410b59ead76d5ba3681f05f61c4b1193a1be8b5393ab7a33f234957b293d4),
      run headless under WINE 9.0 for surface-water (river, lake and reservoir) water quality. The older
      Python tools run_wasp.py/convert_*_to_wasp.py/parse_output_wasp.py are an analytic SURROGATE, not
      this implementation and not described by this dag; their own contract is docs/surrogate/surrogate_wasp_analytic_dag.yaml.
  scientific_reference_version: US EPA WASP 8.5.0 (Water Quality Analysis Simulation Program), Advanced
    Eutrophication model (multi-algae.dll) with the WASP heat module; runtime banner 'Wasp suite version
    8.5.0, Gui develop af12325 dirty, Model master e86fb43'
inputs:
  forcing:
  - name: solar_radiation
    unit: W/m2
    category: forcing
    source_kind: forcing
    model_input_format: time function Solar Radiation - 1 (ISC 4), daily-mean breakpoints, days relative
      to the seed date
    notes: from load_daily_forcing srad_wm2
  - name: air_temperature
    unit: deg C
    category: forcing
    source_kind: forcing
    model_input_format: time function Air Temperature Function 1 (ISC 17)
  - name: dew_point_temperature
    unit: deg C
    category: forcing
    source_kind: derived
    model_input_format: time function Dew Point Function 1 (ISC 29)
    notes: Magnus inverse of specific humidity and surface pressure
  - name: wind_speed
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: time function Wind Speed Function 1 (ISC 21); 10 m wind from the loader
  - name: cloud_cover
    unit: fraction 0-1
    category: forcing
    source_kind: derived
    model_input_format: time function Cloud Cover Function 1 (ISC 25); a 0-1 FRACTION (tenths gives 70
      C water, percent hangs the engine)
    notes: Kasten-Czeplak inverse of shortwave / FAO-56 clear-sky shortwave
  parameters:
  - name: segment_depth
    unit: m
    category: parameters
    source_kind: user_provided
    model_input_format: DMULT with DEXP 0 and INITIALDEPTH under Flow Routing (flow option 7)
  - name: segment_volume
    unit: m3
    category: parameters
    source_kind: derived
    model_input_format: VOLUME = area x depth
  - name: elevation
    unit: m a.s.l.
    category: parameters
    source_kind: dataset_lookup
    model_input_format: constant 57 and segment parameter 24 (DO saturation pressure); needs the 'used'
      flag
  - name: latitude_longitude
    unit: degrees
    category: parameters
    source_kind: user_provided
    model_input_format: constants 2 and 3
  - name: sediment_oxygen_demand
    unit: g O2/m2/d
    category: parameters
    source_kind: calibrated
    model_input_format: segment parameter 32 (temperature-corrected with constant 61)
  - name: cbod_decay_rate
    unit: 1/d at 20 C
    category: parameters
    source_kind: calibrated
    model_input_format: constant 47, one instance per CBOD system
  - name: global_reaeration_rate
    unit: 1/d at 20 C
    category: parameters
    source_kind: calibrated
    model_input_format: constant 55; 0 = engine computes hydraulic/wind reaeration
  - name: ice_switch
    unit: 0/1/2
    category: parameters
    source_kind: user_provided
    model_input_format: constant 501
  initial_conditions:
  - name: initial_concentrations
    unit: system units (mg/L, deg C)
    category: initial_conditions
    source_kind: user_provided
    model_input_format: INITC per system and segment
  boundary_conditions:
  - name: boundary_concentrations_and_flows
    unit: system units; m3/s
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: BOUNDFUNC per system/boundary, NOQFUNC per flow function; in the KI box case flows
      are 1e-4 m3/s and boundaries equal the initial values
outputs:
  primary:
  - name: temperature_timeseries
    unit: deg C
    description: Lake/river surface-water temperature time series per segment (WASP 8.5 heat balance),
      daily mean of the BMD2 variable 'Water Temperature'.
    validation_rank: 4
    emitted_in: <model>.BMD2 'Water Temperature' (deg C) via run_wasp_engine.py --extract; daily means
      by parse_wasp_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Engine output; in the KI lake-box case it is the temperature of a 12 m well-mixed surface layer
          - compare with surface (<= 5 m) samples, not whole-column means.
      detrending_options:
      - none
  - name: do_timeseries
    unit: mg/L
    description: Dissolved-oxygen concentration time series in lake/river surface water per segment (WASP
      8.5), daily mean of the BMD2 variable 'Dissolved Oxygen'.
    validation_rank: 1
    emitted_in: <model>.BMD2 'Dissolved Oxygen' (mg/L) via run_wasp_engine.py --extract; daily means by
      parse_wasp_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - 'The KI box case has no phytoplankton or nutrients configured (no photosynthetic supersaturation,
          no algal respiration) and no stratification: simulated DO stays near saturation (Lake Erie:
          1.03 x). Not configured yet - a scope limit, not an engine fault (dt_wasp_042).'
        - 'Obs: whole GLNPO CTD cruises can have a failed DO sensor (dt_wasp_041). The headline is ALL
          data (do_all, station-day rows); the cruise-QC subset (do_sensor_qc, only proven sensor faults
          left out) is reported next to it, never instead.'
      detrending_options:
      - none
  - name: temperature_profile
    unit: deg C
    description: Vertical lake/reservoir water-column temperature profile vs depth (WASP 8.5 layered segments
      or Lake 1D-vertical flow option).
    validation_rank: 5
    emitted_in: NOT produced by the current KI builder (single well-mixed box); needs a layered deck (surface/subsurface
      segments) or flow option 5 Lake (1D-Vertical)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - No KI tool emits this yet; do not score until a layered deck exists.
      detrending_options:
      - none
  - name: do_profile
    unit: mg/L
    description: Vertical lake/reservoir water-column dissolved-oxygen profile vs depth (WASP 8.5 layered
      segments or Lake 1D-vertical flow option).
    validation_rank: 2
    emitted_in: NOT produced by the current KI builder (single well-mixed box); needs a layered deck or
      flow option 5 Lake (1D-Vertical)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - No KI tool emits this yet; hypolimnetic hypoxia (Lake Erie Central Basin, Aug) needs a bottom
          layer with SOD.
      detrending_options:
      - none
  - name: do_saturation
    unit: mg/L
    description: Dissolved-oxygen saturation concentration in lake/river surface water at the simulated
      water temperature and site pressure.
    validation_rank: 3
    emitted_in: computed by parse_wasp_engine_output.py (APHA 1992 fresh-water equation x standard-atmosphere
      pressure ratio) from the engine's 'Water Temperature'; the engine's own saturation is not written
      to the BMD2 by the KI case
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Diagnostic of the temperature output; the engine's DO in the box case sits ~2.5 % above this
          value on average.
      detrending_options:
      - none
  - name: TSI
    unit: dimensionless
    description: Carlson Trophic State Index for lake/reservoir water from chlorophyll-a, Secchi depth
      and/or total phosphorus.
    validation_rank: 6
    emitted_in: 'NOT produced: the KI case deck has no phytoplankton/phosphorus systems; would be post-processed
      from Advanced Eutrophication chlorophyll and TP output'
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        - ranking_quality
        determining_metric: spearman
        caveats:
        - No KI tool emits this from the real engine; the old value came from the SURROGATE.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - When TSI is tracked across a season.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_wasp_001
  symptom: Surface temperature seasonal cycle shifted upward by ~15-20 C; summer values exceed 40 C
  diagnosis: WQP temperature data in Fahrenheit instead of Celsius; WQP observation records include a
    ResultMeasure/MeasureUnitCode field that may be 'deg F' for some monitoring organizations. The WASP
    analytic model expects temperature in deg C. Feeding Fahrenheit values directly into the sinusoidal
    temperature
  remedy: 'Convert Fahrenheit to Celsius: T_C = (T_F - 32) * 5/9 before fitting the seasonal model; convert_forcing_to_wasp;
    [''Check ResultMeasure/MeasureUnitCode in WQP CSV for temperature records'', ''If values > 50 in a
    temperate lake, units are almost certainly Fahrenheit'', ''Apply conversion: T_C = (T_F - 32'
  severity: silent
- id: dt_wasp_002
  symptom: Temperature values all above 200 C; DO saturation formula returns nonsensical results
  diagnosis: Temperature data in Kelvin instead of Celsius; Some reanalysis or satellite-derived datasets
    report temperature in Kelvin (e.g., 273-303 K for typical lake surface conditions). The Benson-Krause
    DO saturation formula uses absolute temperature internally (TK = T + 273.15), so passing Kelvin values
    ad
  remedy: 'Subtract 273.15 from Kelvin values to convert to Celsius; convert_forcing_to_wasp; [''If all
    temperature values are between 200 and 330, data is likely in Kelvin'', ''Apply conversion: T_C =
    T_K - 273.15'', ''Verify converted values fall in plausible range (0-35 C for most lakes)'']; convert_forcing_to_wa'
  severity: silent
- id: dt_wasp_003
  symptom: Dissolved oxygen observations show values of 60-110 mg/L; calibration produces nonsensical
    DO_offset
  diagnosis: DO data reported as percent saturation instead of mg/L concentration; Some WQP records report
    dissolved oxygen as percent saturation (typically 60-110%) rather than concentration in mg/L (typically
    4-14). The WASP model expects mg/L. At 20 C, 100% saturation equals 9.09 mg/L. Feeding percent saturat
  remedy: 'Convert percent saturation to mg/L: DO_mgL = (DO_pct / 100) * DO_sat(T); convert_forcing_to_wasp;
    [''Check ResultMeasure/MeasureUnitCode for DO records'', "If unit is ''%'' or ''percent'', apply conversion
    using concurrent temperature", ''DO_sat at 20 C = 9.09 mg/L; at 10 C = 11.29 mg/L; at 25 C = 8.26
    mg/'
  severity: silent
- id: dt_wasp_004
  symptom: Dissolved oxygen values are all near zero (0.001-0.015 mg/L) despite the lake not being anoxic
  diagnosis: DO data in ug/L instead of mg/L; Some laboratory analyses report DO in ug/L (micrograms per
    liter). Typical surface water DO of 8000-12000 ug/L divided by 1000 gives the expected 8-12 mg/L.
    If ug/L values are not converted, the model sees 8000-12000 mg/L (caught by the > 20 check) or, if
    the data ha
  remedy: 'Divide ug/L values by 1000 to convert to mg/L; convert_forcing_to_wasp; [''If DO values are
    consistently between 0.001 and 0.020, data may be in ug/L divided by 1e6 instead of 1e3'', ''If DO
    values are between 4000 and 15000, data is in ug/L -- divide by 1000'', ''Verify converted values:
    surface DO shou'
  severity: silent
- id: dt_wasp_005
  symptom: Depth profile plots show observations far deeper than the lake maximum depth
  diagnosis: Depth values in feet instead of meters; WQP ActivityDepthHeightMeasure/MeasureValue may be
    in feet for some monitoring organizations. The WASP profile model expects depth in meters. A 20 m
    deep lake with observations at 30, 50, 60 'ft' (actually 9, 15, 18 m) would appear to have data far
    below the l
  remedy: 'Multiply feet by 0.3048 to convert to meters; convert_forcing_to_wasp; [''Check ActivityDepthHeightMeasure/MeasureUnitCode
    in WQP CSV'', "If unit is ''ft'' or ''feet'', multiply by 0.3048", ''Cross-check against HydroLAKES
    max depth for the lake'']; convert_forcing_to_wasp.py compares observation depths to '
