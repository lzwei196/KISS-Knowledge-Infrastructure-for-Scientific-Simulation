  severity: silent
- id: dt_mf6_014
  symptom: Model computes heads for cells outside the basin boundary. Water budget includes flow through
    cells that should be inactive. Model area is larger than the actual basin.
  diagnosis: IDOMAIN array is all 1s (all cells active). Cells outside the basin boundary are included
