template_version: "3.5"

identity:
  model_id: "Daisy"
  scientific_reference_version: "Daisy 7.1.x — open Soil-Plant-Atmosphere system model (Abrahamsen & Hansen 2000 lineage; University of Copenhagen Agrohydrology group)"
  implementation:
    id: "daisy-cpp"
    version: "7.1.4"
    provenance: "C++; University of Copenhagen Agrohydrology group (Per Abrahamsen, Søren Hansen); 1D mechanistic soil-plant-atmosphere system model."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL"
  repo_url: "https://github.com/daisy-model/daisy"

boundary:
  scope_in:
    - "Soil water transport (Richards equation in 1-D; matrix, secondary and tertiary/macropore preferential-flow domains)"
    - "Surface water balance (snow accumulation/melt, interception, through-fall, infiltration, surface run-off, drainage to pipe drain)"
    - "Soil heat transport (conduction/convection, freeze/thaw with apparent heat capacity)"
    - "Nitrogen dynamics (mineralization-immobilization, nitrification, denitrification, ammonium sorption, nitrate/ammonium plant uptake and leaching)"
    - "Soil organic-matter / carbon turnover (multi-pool: SOM, microbial biomass SMB, added organic matter AOM, dissolved organic matter DOM)"
    - "Crop growth and development (phenology, Farquhar photosynthesis, stomatal conductance, dry-matter partitioning, leaf area index, root density, water/N stress)"
    - "Pesticide / agro-chemical fate (sorption, degradation, transport)"
    - "Field management scenarios (tillage, fertilization, irrigation, sowing, harvest)"
    - "Groundwater coupling as lower boundary"
  scope_out:
    - "Lateral flow / catchment-scale routing (1-D column; external linkage to a distributed catchment model such as MIKE/SHE required)"
    - "Processes outside the bioactive zone (above top-of-canopy or below the historic root zone)"
    - "Sub-hourly processes (largest internal timestep is one hour)"
    - "Built-in parameter calibration / optimization (requires external tools)"
    - "Disease / pest effects on the crop"
  spatial: "1-D column"
  temporal: "hourly"
  closure: "both"
  notes: "Coupled mass balances for water, heat, solute (inorganic N and pesticides), and multi-pool organic C/N; the organic-matter model is an integral part of the nitrogen balance. Largest internal timestep is one hour; minimum driving-data resolution is daily, with hourly forcing utilized when richer SVAT options (PMSW, SSOC) are selected. The energy/surface-temperature balance is engaged through the Bioclimate/SVAT path; with SVAT='None' the canopy and soil surface are held at free-air temperature rather than solving a closed surface energy budget. A distributed multi-column / 2-D water-flow mode exists but the canonical configuration is a single 1-D column."

inputs:
  forcing:
    - category: "forcing"
      name: "GlobRad"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: ".dwf weather-file column (daily mean global radiation)"
      notes: "Daisy expects daily-mean irradiance in W/m^2; supplying daily-total MJ/m^2/d (~12x too small) silently under-lights the crop."
    - category: "forcing"
      name: "AirTemp"
      unit: "dgC"
      source_kind: "forcing"
      model_input_format: ".dwf weather-file column"
      notes: "Degrees Celsius, not Kelvin."
    - category: "forcing"
      name: "Precip"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: ".dwf weather-file column"
      notes: "Daily total; sub-daily (mm/3h, mm/h) values must be aggregated to daily before being written."
    - category: "forcing"
      name: "RefEvap"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: ".dwf weather-file column (optional)"
      notes: "If absent, Daisy falls back to a Makkink reference-ET estimate from radiation and temperature."
    - category: "forcing"
      name: "Wind"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: ".dwf weather-file column (optional)"
      notes: "Required by the PMSW and SSOC SVAT options for the energy balance."
    - category: "forcing"
      name: "RelHum"
      unit: "% (0-100)"
      source_kind: "forcing"
      model_input_format: ".dwf weather-file column (optional)"
      notes: "Percent, not fraction; required by hourly SVAT options."
    - category: "forcing"
      name: "VapPres"
      unit: "Pa"
      source_kind: "forcing"
      model_input_format: ".dwf weather-file column (optional)"
    - category: "forcing"
      name: "Atmospheric N deposition (NH4/NO3 wet/dry)"
      unit: "ppm / kg N/ha/year"
      source_kind: "forcing"
      model_input_format: ".dwf header fields (NH4WetDep, NH4DryDep, NO3WetDep, NO3DryDep)"
      notes: "Deposition enters the chemistry solute pool as an N source term."
  parameters:
    - category: "parameter"
      name: "Soil texture (clay / silt / sand fractions)"
      unit: "fraction 0-1"
      source_kind: "dataset_lookup"
      model_input_format: "Lisp-like .dai horizon definition (USDA3 / FAO3 / ISSS4 texture systems)"
      notes: "Fractions sum to ~1.0 excluding humus; percent (0-100) input causes a sum>1 startup crash."
    - category: "parameter"
      name: "Humus / organic fraction"
      unit: "fraction 0-1"
      source_kind: "dataset_lookup"
      model_input_format: ".dai horizon definition"
      notes: "Typically 0.001-0.10 for mineral soils."
    - category: "parameter"
      name: "Dry bulk density"
      unit: "g/cm^3"
      source_kind: "dataset_lookup"
      model_input_format: ".dai horizon definition"
      notes: "Typical 1.0-2.0 g/cm^3; kg/m^3 input yields impossibly dense soil."
    - category: "parameter"
      name: "C/N ratio"
      unit: "g C / g N"
      source_kind: "dataset_lookup"
      model_input_format: ".dai horizon definition"
    - category: "parameter"
      name: "van Genuchten-Mualem retention parameters (Theta_res, Theta_sat, alpha, n)"
      unit: "dimensionless; alpha in cm^-1"
      source_kind: "calibrated"
      model_input_format: ".dai hydraulic model M_vG (or default texture estimate / Cosby / HYPRES pedotransfer)"
      notes: "alpha expected in cm^-1 (not m^-1)."
    - category: "parameter"
      name: "Saturated hydraulic conductivity K_sat"
      unit: "cm/h"
      source_kind: "calibrated"
      model_input_format: ".dai hydraulic definition"
      notes: "Expected in cm/h; m/s input is ~360000x too high."
    - category: "parameter"
      name: "Crop / vegetation parameters"
      unit: "various"
      source_kind: "dataset_lookup"
      model_input_format: "library .dai files (crop.dai etc.; day-length response, root density, photosynthetic efficiency, dry-matter partitioning)"
      notes: "Crop selected by name; names are case-sensitive and must match the library exactly."
    - category: "parameter"
      name: "Organic-matter pool initialization (input C, root C, end depth)"
      unit: "kg C/ha/y; cm"
      source_kind: "user_provided"
      model_input_format: ".dai column OrganicMatter init block"
  initial_conditions:
    - category: "initial_condition"
      name: "Initial soil water content per layer"
      unit: "cm^3/cm^3 (or pressure h in cm)"
      source_kind: "user_provided"
      model_input_format: ".dai column / checkpoint-*.dai restart state"
      notes: "1-3 year spinup recommended to equilibrate water and N pools."
    - category: "initial_condition"
      name: "Initial soil mineral N pools (NH4, NO3) per layer"
      unit: "kg N/ha"
      source_kind: "user_provided"
      model_input_format: ".dai column / checkpoint restart state"
    - category: "initial_condition"
      name: "Initial soil organic-matter and microbial-biomass pools"
      unit: "kg C/ha; kg N/ha"
      source_kind: "user_provided"
      model_input_format: ".dai column / checkpoint restart state"
  boundary_conditions:
    - category: "boundary_condition"
      name: "Simulation period (start / stop dates)"
      unit: "YYYY MM DD HH"
      source_kind: "user_provided"
      model_input_format: ".dai (time) / (stop) directives; .dwf Begin/End must span this range"
    - category: "boundary_condition"
      name: "Groundwater lower-boundary model"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: ".dai column groundwater object (deep / aquitard / fixed / flux / lysimeter / file)"
    - category: "boundary_condition"
      name: "SVAT / energy-balance option"
      unit: "categorical (None | PMSW | SSOC)"
      source_kind: "user_provided"
      model_input_format: ".dai parameterization selector"
      notes: "PMSW and SSOC require hourly wind/humidity; 'None' holds canopy/surface at free-air temperature."
    - category: "boundary_condition"
      name: "MaxRootingDepth"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: ".dai column definition"
    - category: "boundary_condition"
      name: "Management operations (sow, fertilize, irrigate, plow, seedbed prep, harvest, tillage)"
      unit: "various (kg N/ha mineral; T w.w./ha organic; mm irrigation; cm tillage)"
      source_kind: "user_provided"
      model_input_format: "Lisp-like .dai defaction with chronologically ordered, wait-condition-gated activities"
      notes: "Each crop-stage wait condition should be paired with a date fallback or the run can produce no harvest / hang indefinitely."

processes:
  modules:
    - name: "Daisy/Field/ColumnStandard driver"
      role: "driver"
      brief: "Top-level simulation loop with adaptive timestep; ingests weather and management actions and orchestrates the 1-D soil column via tick_source / tick_move."
    - name: "Manager/Action"
      role: "driver"
      brief: "Management scheduling: sowing, fertilize, irrigate, harvest, tillage, plowing driven by date/crop-stage (BBCH/DS) wait conditions."
    - name: "Bioclimate"
      role: "process_solver"
      brief: "Energy/radiation balance, snow storage, interception, potential and actual evapotranspiration; couples canopy, surface ponding and atmospheric forcing (SVAT options None/PMSW/SSOC)."
    - name: "Vegetation/Crop"
      role: "process_solver"
      brief: "Crop growth: canopy, phenology (development stage DS), dry-matter partitioning, production of leaf/stem/storage-organ/root pools, root system, water/N stress."
    - name: "Photosynthesis (Farquhar)"
      role: "process_solver"
      brief: "Arrhenius-scaled Rubisco kinetics with iterative intercellular-CO2 / stomatal Newton solve producing CO2 assimilation that drives dry-matter increments."
    - name: "OrganicMatter (SMB/SOM/AOM/DOM)"
      role: "process_solver"
      brief: "CENTURY-style multi-pool C/N turnover; microbial biomass (SMB), soil organic matter (SOM), added (AOM) and dissolved (DOM) organic matter; mineralization/immobilization modulated by clay and pH."
    - name: "Abiotic"
      role: "process_solver"
      brief: "Hardcoded temperature (van Veen & Frissel) and water response factors gating decomposition, nitrification and denitrification rates."
    - name: "Chemistry"
      role: "process_solver"
      brief: "Solute (inorganic N species, pesticides) deposition, surface mixing, soil transport and repeated mass-balance closure; covers the nitrogen and pesticide fate cycles."
    - name: "SoilWater"
      role: "process_solver"
      brief: "Richards-equation water content/pressure state across matrix, secondary and tertiary (macropore) domains with root/drain/ice sink terms and mass balance."
    - name: "Hydraulic"
      role: "process_solver"
      brief: "Retention/conductivity models (van Genuchten-Mualem, Cosby, HYPRES, MACRO, Brooks-Corey) supplying K(h) and Theta(h) to SoilWater."
    - name: "SoilHeat"
      role: "process_solver"
      brief: "Soil temperature, heat flux, and freeze/thaw phase change with apparent heat capacity."
    - name: "Movement"
      role: "integrator"
      brief: "Numerical transport engine integrating water, heat and solutes between cells; runs tertiary (macropore) preferential flow first, ahead of all other processes."
    - name: "Groundwater"
      role: "optional_module"
      brief: "Lower-boundary condition (deep, aquitard, fixed, flux, lysimeter, file) feeding bottom pressure/flux to SoilWater."
    - name: "Pesticide fate"
      role: "optional_module"
      brief: "Sorption, degradation and transport of agro-chemicals as additional Chemistry solutes."
      applicability: "when a pesticide/agro-chemical is declared"
    - name: "Snow and frost dynamics"
      role: "process_solver"
      brief: "Snow pack accumulation/melt and soil frost at the surface boundary, coupled to the Bioclimate water/heat balance."
    - name: "Output/Log/Select"
      role: "optional_module"
      brief: "User-declared 'select' objects sample chosen state/flux variables into .dlf log files; the output column set is configuration-driven, not a fixed list."
  internal_edges:
    - from: "Daisy/Field/ColumnStandard driver"
      to: "Inputs"
      kind: "consumes_input"
      brief: "Weather tick supplies radiation/temperature/precipitation forcing each step."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "Movement"
      kind: "invokes"
      brief: "tick_move dispatches each sub-process in fixed order per timestep (tertiary macropore flow runs first)."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "Bioclimate"
      kind: "invokes"
      brief: "tick_move dispatches each sub-process in fixed order per timestep."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "Vegetation/Crop"
      kind: "invokes"
      brief: "tick_move dispatches each sub-process in fixed order per timestep."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "Chemistry"
      kind: "invokes"
      brief: "tick_move dispatches each sub-process in fixed order per timestep."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "OrganicMatter (SMB/SOM/AOM/DOM)"
      kind: "invokes"
      brief: "tick_move dispatches each sub-process in fixed order per timestep."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "SoilWater"
      kind: "invokes"
      brief: "tick_move dispatches each sub-process in fixed order per timestep."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "SoilHeat"
      kind: "invokes"
      brief: "tick_move dispatches each sub-process in fixed order per timestep."
    - from: "Manager/Action"
      to: "Vegetation/Crop"
      kind: "writes_state"
      brief: "Sowing/harvest operations create and terminate the crop; tillage redistributes soil state."
    - from: "Manager/Action"
      to: "Chemistry"
      kind: "writes_state"
      brief: "Mineral and organic fertilizer applications add N to the soil solute / organic-matter pools."
    - from: "Movement"
      to: "SoilWater"
      kind: "writes_state"
      brief: "Tertiary macropore/preferential flow redistributes Theta before all other processes, then integrated matrix fluxes update Theta."
    - from: "Bioclimate"
      to: "SoilWater"
      kind: "writes_state"
      brief: "Evapotranspiration and infiltration set water sink/source terms."
    - from: "Bioclimate"
      to: "Chemistry"
      kind: "produces_output"
      brief: "Atmospheric N deposition passed into the chemistry solute pool."
    - from: "Snow and frost dynamics"
      to: "Bioclimate"
      kind: "writes_state"
      brief: "Snow pack and surface frost modify the surface water/energy balance."
    - from: "Hydraulic"
      to: "SoilWater"
      kind: "produces_output"
      brief: "Retention/conductivity functions supply K(h) and Theta(h)."
    - from: "SoilWater"
      to: "Movement"
      kind: "invokes"
      brief: "Richards integration delegated to the movement engine between tick_before/tick_after."
    - from: "SoilWater"
      to: "SoilHeat"
      kind: "reads_state"
      brief: "Heat solver uses (pre-update) water content for thermal capacity/conductivity."
    - from: "Groundwater"
      to: "SoilWater"
      kind: "writes_state"
      brief: "Lower-boundary pressure/flux set before the water tick."
    - from: "Vegetation/Crop"
      to: "SoilWater"
      kind: "reads_state"
      brief: "Root water uptake reads Theta/h to compute the root sink term."
    - from: "Photosynthesis (Farquhar)"
      to: "Vegetation/Crop"
      kind: "produces_output"
      brief: "Assimilated C drives dry-matter increments (leaf/stem/storage-organ/root)."
    - from: "Vegetation/Crop"
      to: "OrganicMatter (SMB/SOM/AOM/DOM)"
      kind: "writes_state"
      brief: "Senescence and harvest residues returned as added organic matter."
    - from: "Abiotic"
      to: "OrganicMatter (SMB/SOM/AOM/DOM)"
      kind: "produces_output"
      brief: "Temperature/water response factors scale turnover, nitrification and denitrification rates."
    - from: "OrganicMatter (SMB/SOM/AOM/DOM)"
      to: "Chemistry"
      kind: "produces_output"
      brief: "Mineralized N (NH4/NO3) released into the chemistry solute pool; DOM transported as solutes."
    - from: "Chemistry"
      to: "Movement"
      kind: "invokes"
      brief: "Solute (N species, pesticide, DOM) transport delegated to the movement engine."
    - from: "Chemistry"
      to: "SoilWater"
      kind: "reads_state"
      brief: "Solute mass balance closed against water content (re-called several times per step)."
    - from: "Pesticide fate"
      to: "Chemistry"
      kind: "writes_state"
      brief: "Pesticide sorption/degradation adds agro-chemical solute species to the chemistry pool."
    - from: "Daisy/Field/ColumnStandard driver"
      to: "Output/Log/Select"
      kind: "produces_output"
      brief: "Selected state/flux variables sampled into .dlf logs."
    - from: "Vegetation/Crop"
      to: "Outputs"
      kind: "produces_output"
      brief: "Harvest event emits storage-organ (grain) dry matter and N to harvest.dlf."

states:
  variables:
    - name: "Soil water content (Theta) per cell"
      unit: "cm^3/cm^3"
      role: "prognostic"
    - name: "Soil water pressure potential (h) per cell"
      unit: "cm"
      role: "prognostic"
    - name: "Matrix/secondary/tertiary domain water contents"
      unit: "cm^3/cm^3"
      role: "prognostic"
    - name: "Soil temperature (T) per cell"
      unit: "dgC"
      role: "prognostic"
    - name: "Freeze/thaw phase-change state"
      unit: "dimensionless (ice fraction)"
      role: "prognostic"
    - name: "Soil mineral nitrogen pools (NH4, NO3) per cell"
      unit: "kg N/ha (or g/m^2)"
      role: "prognostic"
    - name: "Soil microbial biomass pools (SMB C, SMB N) per cell"
      unit: "g/m^2"
      role: "prognostic"
    - name: "Soil organic matter pools (SOM C/N) per cell"
      unit: "g/m^2"
      role: "prognostic"
    - name: "Added organic matter pools (AOM C/N)"
      unit: "g/m^2"
      role: "prognostic"
    - name: "Dissolved organic matter (DOM C/N)"
      unit: "g/m^2"
      role: "prognostic"
    - name: "Crop development stage (DS)"
      unit: "dimensionless (0=emergence, 1=flowering, 2=ripe)"
      role: "prognostic"
    - name: "Crop dry-matter pools (WLeaf, WStem, WSOrg, WRoot, WDead)"
      unit: "g DM/m^2"
      role: "prognostic"
    - name: "Crop nitrogen content (NCrop)"
      unit: "g N/m^2"
      role: "prognostic"
    - name: "Leaf area index (LAI)"
      unit: "m^2/m^2"
      role: "diagnostic"
    - name: "Root density / root depth"
      unit: "cm; length/volume"
      role: "prognostic"
    - name: "Snow pack and surface frost state"
      unit: "mm water equivalent"
      role: "prognostic"
    - name: "Canopy intercepted water / surface ponding"
      unit: "mm (cm internally)"
      role: "prognostic"
    - name: "Pesticide / solute mass in soil domains"
      unit: "mass per area"
      role: "prognostic"
    - name: "Water/nitrogen stress-day accumulators"
      unit: "d"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "sorg_DM"
    validation_rank: 1
    unit: "Mg DM/ha"
    description: "Harvested storage-organ (grain) dry matter — the primary crop yield output."
    emitted_in: "harvest.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Compare grain yield against sorg_DM only, not total above-ground DM."
            - "Single-site, single-season measured yield."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats:
            - "Multi-season measured yields at one field; exclude 1-3 spinup years."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "National/regional yield aggregates carry a technology trend a weather-driven mechanistic model cannot reproduce; detrend before comparing."
      detrending_options: ["none", "linear_residual", "decadal_mean"]
  - var: "harvest_index"
    validation_rank: 2
    unit: "dimensionless"
    description: "Crop harvest biomass ratio of grain (storage organ) to total above-ground dry matter at harvest."
    emitted_in: "harvest.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Typical cereal range 0.3-0.5."
      detrending_options: ["none"]
  - var: "Harvest_N"
    validation_rank: 3
    unit: "kg N/ha"
    description: "Nitrogen removed in harvested biomass (grain + stem N)."
    emitted_in: "harvest.dlf / field_nitrogen.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Cereal range typically 80-200 kg N/ha."
      detrending_options: ["none"]
  - var: "Leaching"
    validation_rank: 7
    unit: "kg N/ha"
    description: "Soil-profile nitrate-nitrogen leached below the root zone."
    emitted_in: "field_nitrogen.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Strongly dependent on organic-matter pool initialization and spinup; exclude 1-3 spinup years."
            - "Annual leaching <50 kg N/ha well-managed; can exceed 100 on sandy soils."
      detrending_options: ["none"]
  - var: "Denitrification"
    validation_rank: 8
    unit: "kg N/ha"
    description: "Soil mineral nitrogen lost via denitrification."
    emitted_in: "field_nitrogen.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Annual range typically 5-30 kg N/ha; chamber-flux measurements are sparse and noisy."
      detrending_options: ["none"]
  - var: "Evapotranspiration"
    validation_rank: 5
    unit: "mm"
    description: "Actual evapotranspiration (water-balance flux)."
    emitted_in: "field_water.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Eddy-covariance LE comparison requires hourly SVAT (PMSW/SSOC) and hourly forcing."
            - "Annual ET 300-600 mm temperate continental."
      detrending_options: ["none"]
  - var: "Drain / Percolation"
    validation_rank: 9
    unit: "mm"
    description: "Drainage to pipe drain and percolation below the profile."
    emitted_in: "field_water.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Annual drainage typically 50-400 mm; depends on the groundwater lower-boundary choice."
      detrending_options: ["none"]
  - var: "Theta"
    validation_rank: 6
    unit: "m^3/m^3"
    description: "Volumetric soil water content per layer."
    emitted_in: "soil_water.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Compare per-depth against point soil-moisture probes; the .dlf may report layer-integrated depth (mm) vs volumetric (m^3/m^3) depending on the select declaration."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Only in the distributed multi-column configuration."
      detrending_options: ["none"]
  - var: "Soil temperature"
    validation_rank: 10
    unit: "dgC"
    description: "Soil temperature per layer."
    emitted_in: "soil_temperature.dlf (user-selected)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Compare per-depth against buried thermistors."
      detrending_options: ["none"]
  - var: "DS"
    validation_rank: 11
    unit: "dimensionless"
    description: "Crop development stage (phenology; 0=emergence, 1=flowering, 2=ripe)."
    emitted_in: "<crop>.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["timing_accuracy", "event_detection"]
          determining_metric: "csi"
          caveats:
            - "Compare modelled stage-transition DOY (emergence/flowering/maturity) against observed phenological dates."
      detrending_options: ["none"]
  - var: "LAI"
    validation_rank: 4
    unit: "m^2/m^2"
    description: "Crop canopy leaf area index."
    emitted_in: "<crop>.dlf"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Compare against destructive-sampling or remote-sensing LAI; timing of peak matters."
      detrending_options: ["none"]

