    ~10%), but r/NSE/KGE are very poor or negative (e.g. r=-0.083, NSE=-12.47) and the r<0.5 gate retries.
    Obs source is FAOSTAT national aggregate (--obs faostat) while the simulation is a single point.
  diagnosis: Obs scale/location mismatch, not model physics. A single non-representative point (Bengbu
    32.9N/117.4E, humid S. Anhui) has ~4-5x the national interannual variance and can anti-correlate with
    the national series, which is dominated by a technology trend and the production-weighted centroid
    (NE China
  remedy: 'Remap obs to the model''s native point scale: re-run validate_yield_timeseries.py with the
    default --obs gdhy (co-located 0.5deg pixel, GDHY maize 2005-2016 on disk) for the interannual r/NSE/KGE
    gate. Use --obs faostat national only for %bias/nRMSE. FAOSTAT has no sub-national Area, so to compare
    ag'
- id: dt_obs_scale_faostat_national_vs_point
  symptom: DSSAT single-point yield validation reports good mean bias (PBIAS ~+9%) but strongly negative/near-zero
    interannual r and large-negative NSE (e.g. r -0.083, NSE -12.47) against FAOSTAT national yield; r-gate
    (r<0.5) fails or r is nulled, sending the retry loop into an unwinnable retry.
  diagnosis: 'Obs location/scale mismatch: a single non-representative point (humid-monsoon Bengbu 32.9N/117.4E)
    is compared to a national aggregate dominated by a smooth technology/fertilizer trend and the NE-China/Henan
    production centroid. Point interannual variance is ~4-5x national and can anti-correlate. ob'
  remedy: 'Re-run validate_yield_timeseries.py with --obs gdhy (the tool default): GDHY 0.5deg gridded
    maize (1981-2016, on disk at KISSPATH_DATA/Crop_model_dataset/GDHY_v1.2_v1.3/) is co-located and scale-matched
    to the simulated pixel, making r/NSE/KGE defined and meaningful. Use FAOSTAT national as a %bias-'
- id: dt_faostat_regional_aggregate_null_r_is_pass
  symptom: DSSAT multi-year (>=2 yr) yield validation with --obs faostat reports metrics.r/nse/kge = null
    while PBIAS is small (e.g. +8.94%) and trend_sign_agree=true; the orchestrator's r<0.5 gate fires
    and routes the run to diagnosis even though it is a PASS.
  diagnosis: FAOSTAT national series is obs_shape=regional_aggregate_time_series (dag.yaml outputs.HWAM.observability),
    whose ONLY valid metric families are [magnitude_accuracy, trend_match]. validate_yield_timeseries.py
    intentionally nulls nse/kge/r (kept under _raw_invalid_*) because raw interannual correlatio
  remedy: Score the run on PBIAS (magnitude_accuracy) + sim/obs slope sign (trend_match); if PBIAS within
    tolerance and trend_sign_agree=true, it is a PASS — do NOT retry, do NOT switch to GDHY to chase r.
    Only re-run with --obs gdhy at the simulated pixel (GDHY maize 2005-2016 on disk) if the TASK explicitly
