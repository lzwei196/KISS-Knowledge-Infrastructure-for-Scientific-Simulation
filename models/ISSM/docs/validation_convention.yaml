  - dag_variable: Temperature
    obs_shape: point_snapshot
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper reports a numeric PBIAS pass band for borehole or point ice-temperature snapshots."
        cites: []
      - metric: rmse
        direction: minimize
        unit: K
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "OpenAlex/cached-paper search found mechanism and borehole-comparison context, not an RMSE threshold."
        cites: []
    secondary_metrics:
      - metric: pressure_melting_bound
        direction: maximize
        status: supportive
        ceiling_reason: "ISSM thermal equations keep ice temperature below the pressure melting point; basal-temperature studies note very few borehole constraints continent-wide."
        cites: [larour2012_issm, schlegel2022_basal_temperature]
    validated_when: "UNRESOLVED - borehole temperature profile comparison is the appropriate observation shape, but no fetched numeric threshold exists."
    evidence_strength: weak
    confidence: 0.30
    notes: "Schlegel 2022 says ice boreholes can constrain basal thermal state but are very sparse; this supports caution, not a pass band."

  - dag_variable: "grounding-line position (MaskOceanLevelset)"
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: line_position_error
        direction: minimize
        unit: km
        bands: {very_good: 0.5, good: 3.2, satisfactory: 10.0}
        pass_band: satisfactory
        band_note: "Seroussi 2014 reports convergence errors of 0.5 and 3.2 km for sub-element parameterizations; Pattyn 2013 reports reversible grounding lines within hundreds of metres and recommends subgrid/interpolation approaches."
        cites: [seroussi2014_grounding, pattyn2013_mismip3d]
    secondary_metrics:
      - metric: csi
        direction: maximize
        status: supportive
        ceiling_reason: "The dag csi request is a categorical proxy; fetched grounding-line benchmarks use contour/line position, reversibility, and mesh convergence."
        cites: [seroussi2014_grounding, pattyn2013_mismip3d]
      - metric: mesh_resolution_near_grounding_line
        direction: minimize
        status: supportive
        ceiling_reason: "Pattyn 2013 requires grid size below 500 m or subgrid interpolation; Seroussi 2014 suggests refinement below about 2 km for similar high-resolution sub-parameterized results."
        cites: [seroussi2014_grounding, pattyn2013_mismip3d]
    validated_when: "Grounding-line spatial snapshots are validated as contour/line-position errors; pass when line-position error <= 10 km, with <= 3.2 km matching sub-element convergence-error scale."
    evidence_strength: strong
    confidence: 0.80
    notes: "Seroussi 2014 notes differences of more than 80 km without proper sub-element treatment, so a csi-only mask score is not the field convention."

  - dag_variable: "grounding-line position (MaskOceanLevelset)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a PBIAS threshold for grounding-line retreat/advance time series."
        cites: []
      - metric: line_position_error
        direction: minimize
        unit: km
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Spatial convergence bands are not reused as temporal retreat/advance bands without a fetched time-series convention."
        cites: []
    secondary_metrics:
      - metric: reversibility
        direction: maximize
        status: supportive
        ceiling_reason: "Grounding-line benchmarks judge reversibility and transient behavior, but the fetched papers do not define a numeric time-series observation threshold."
        cites: [seroussi2014_grounding, pattyn2013_mismip3d]
    validated_when: "UNRESOLVED - compare retreat/advance histories when transient observations exist, but no automatic numeric gate is cited."
    evidence_strength: weak
    confidence: 0.34
    notes: "Seroussi 2014 says reversibility is necessary but not sufficient for steady-state accuracy; this supports diagnostic use, not a PBIAS pass band."

  - dag_variable: "IceVolume / GroundedArea / TotalSmb"
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 0.42, satisfactory: 0.42}
        pass_band: satisfactory
        band_note: "initMIP-Antarctica reports 100-year control ice-mass-above-flotation drift less than 0.42 percent of initial volume in all cases, highlighting the accuracy required for sea-level projections."
        cites: [seroussi2019_initmip_antarctica]
      - metric: sle_drift
        direction: zero_centered
        unit: mm
        bands: {good: 25.0, satisfactory: 50.0}
        pass_band: satisfactory
        band_note: "initMIP-Greenland ctrl drift is about -20 to +25 mm SLE excluding outliers; ISMIP6 Greenland ctrl_proj drift range is -50 to +15 mm."
        cites: [goelzer2018_initmip_greenland, goelzer2020_ismip6_greenland]
    secondary_metrics:
      - metric: trend_match
        direction: maximize
        status: supportive
        ceiling_reason: "The fetched intercomparison papers emphasize control-run drift and mass/SLE trends rather than raw NSE for aggregate diagnostics."
        cites: [goelzer2018_initmip_greenland, goelzer2020_ismip6_greenland]
    validated_when: "Regional aggregate time series are judged by small signed volume/SLE drift and trend consistency; pass when |PBIAS| <= 0.42 percent and |SLE drift| <= 50 mm over the reported control/projection benchmark horizon."
    evidence_strength: strong
    confidence: 0.70
    notes: "The rule is strongest for IceVolume/GroundedArea mass diagnostics; TotalSmb should still be checked against its forcing/RCM product because the fetched bands are ice-sheet response bands."

  - dag_variable: "IceVolume / GroundedArea / TotalSmb"
    obs_shape: regional_aggregate_snapshot
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {satisfactory: 15.0}
        pass_band: satisfactory
        band_note: "initMIP-Greenland reports modeled ice-sheet area and volume overestimation by up to 15 percent as a common present-day aggregate mismatch."
        cites: [goelzer2018_initmip_greenland]
    secondary_metrics:
      - metric: area_volume_consistency
        direction: maximize
        status: supportive
        ceiling_reason: "Goelzer 2018 compares grounded area and volume against observed diamonds and warns that outlying glaciers/ice caps alter area more than volume."
        cites: [goelzer2018_initmip_greenland]
    validated_when: "Regional aggregate snapshots are compared to observed present-day area/volume; pass band is a weak benchmark envelope of |PBIAS| <= 15 percent."
    evidence_strength: moderate
    confidence: 0.50
    notes: "This is a benchmark envelope, not a formal tier table; keep confidence moderate-low and do not use it to justify poor spatial geometry."

  - dag_variable: "relative sea level (S)"
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "ISSM-SESAW explicitly reports no standard benchmark or model intercomparison experiment for elastic rotating relative sea-level models."
        cites: []
      - metric: rmse
        direction: minimize
        unit: m
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Fetched sea-level-fingerprint papers provide GRACE-derived fields and uncertainty products, but no model pass threshold for spatial RSL fingerprints."
        cites: []
    secondary_metrics:
      - metric: feature_resolution
        direction: minimize
        status: supportive
        ceiling_reason: "ISSM-SESAW validates components by reproducing published results and says its mesh can capture features as small as about 2 km, but this is numerical resolution rather than an observation pass band."
        cites: [adhikari2016_sesaw]
      - metric: uncertainty_map
        direction: minimize
        status: supportive
        ceiling_reason: "GRACE fingerprint data products quantify standard errors for relative-sea-level trends, useful for weighting but not a pass threshold."
        cites: [adhikari2019_fingerprints]
    validated_when: "UNRESOLVED - use GRACE/tide-gauge fingerprint fields and uncertainty maps for comparison, but no automatic numeric validation gate is cited."
    evidence_strength: weak
    confidence: 0.25
    notes: "Adhikari 2016: 'no standard benchmark or model intercomparison experiments' for this model class; csi is retained only because the dag requested it."

