- id: dt_v004
  stage: s3_weather_prep
  failure_domain: unit_conversion
  symptom:
    description: Vapour pressure in the weather file is > 100 kPa or < 0.06 kPa; pcse rejects VAP
    error_pattern: Value.*for meteo variable.*VAP.*outside allowed range
    detection_method: log_match
  diagnosis:
    root_cause: The humidity column was taken as the wrong quantity (specific humidity written as kPa,
      or a vapour pressure converted a second time)
    explanation: 'The shared loader gives specific humidity (shum_kgkg, 0.0005-0.025) and pressure (pres_pa).
      PCSE needs vapour pressure in kPa (0.1-4.2): e = q*p/(0.622+0.378*q), Pa / 1000. Writing q straight
      into VAP gives values far below 0.06; applying the formula to a value that is already a vapour pressure
      gives nonsense.

      '
    affected_components:
    - s3_weather_prep
  remedy:
    action: Build the weather file with build_pcse_weather_from_source; it computes VAP from the source's
      own specific humidity and pressure.
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - 'Check the VAP column: 0.1-4.2 is kPa (right)'
    - If the values are 0.0005-0.025 they are specific humidity in kg/kg
    - 'For your own station table in hPa: set WX_VAP_IS_HPA=1 for create_csv_weather_file'
    prevention: validate_weather_data tool checks the VAP range
  severity: silent
  cross_references: []
  verified: '2026-10-03'
- id: dt_v005
  stage: s3_weather_prep
  failure_domain: unit_conversion
  symptom:
    description: WOFOST produces zero or near-zero yield despite correct temperature and rain. LAI stays
      below 0.2.
    error_pattern: TWSO.*= 0|LAI.*max.*0\.1
    detection_method: value_comparison
  diagnosis:
    root_cause: IRRAD must be in J/m²/d (Joules), not kJ/m²/d. PCSE SKILL.md says kJ but DB stores J.
    explanation: 'The PCSE documentation and SKILL.md state IRRAD is in kJ/m²/d, but the internal DB (pcse.db)
      stores radiation in J/m²/d. Spain example: IRRAD=15,657,000 J/m²/d  = 15.7 MJ/m²/d. If you pass
      15,657 kJ/m²/d (same number), it''s 1000x too low and photosynthesis produces near-zero biomass.
      The crop reaches maturity (DVS=2.0) via temperature accumulation but never builds enough biomass
      for grain fill. THIS IS THE #1 REASON WOFOST PRODUCES ZERO YIELD WITH CUSTOM WEATHER DATA.

      '
    affected_components:
    - s3_weather_prep
    - s6_execution
  remedy:
    action: 'Convert: IRRAD_J = shortwave_W_m2 * 86400 (NOT * 86.4)'
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - 'From a W/m² daily mean: internal IRRAD = SW_mean * 86400 (J/m²/d); CSV column = SW_mean * 86.4 (kJ/m²/d)'
    - 'From MJ/m²/d (DSSAT): IRRAD = SRAD * 1e6 (J/m²/d)'
    - 'Validate: spring day should be 10-25 million J/m²/d (10-25 MJ)'
    - If IRRAD < 100,000, it is likely in kJ — multiply by 1000
    prevention: build_pcse_weather_from_source writes the CSV column in kJ (W/m2 * 86.4) and the provider multiplies by 1000, which gives W/m2 * 86400 J inside the model
  severity: silent
  cross_references:
  - dt_003
  verified: '2026-03-19'
- id: dt_v006
  stage: s3_weather_prep
  failure_domain: unit_conversion
  symptom:
    description: ET0 values unrealistically high (>1.5 cm/d) causing extreme water stress
    error_pattern: ET0.*> 1\.5|E0.*> 2
    detection_method: value_comparison
  diagnosis:
    root_cause: 'ET0 must be in cm/day, not mm/day. Spain DB values: 0.08-0.88 cm/d.'
    explanation: 'PCSE WeatherDataContainer expects E0, ES0, ET0 in cm/day. If computed in mm/day (typical
      output of Penman-Monteith), values are 10x too high. This causes extreme water stress in WLP mode
      — the model thinks the atmosphere demands 10x more water than available, shutting down transpiration.

      '
    affected_components:
    - s3_weather_prep
  remedy:
    action: 'Divide ET0 by 10 if computed in mm/day: ET0_cm = ET0_mm / 10'
    tool_to_run: validate_weather_data
    manual_steps:
    - 'Validate: ET0 should be 0.01-1.5 cm/day for most climates'
    - If ET0 > 2.0, it is likely in mm — divide by 10
    prevention: CSVWeatherDataProvider computes E0/ES0/ET0 itself in cm/day; only a hand-built WeatherDataContainer needs this check
  severity: silent
  cross_references:
  - dt_v005
  verified: '2026-03-19'
- id: dt_016
  stage: s3_weather_prep
  failure_domain: unit_conversion
  symptom:
    description: 'WOFOST yields are low / the crop is chronically water-stressed when weather was supplied
      through a CSVWeatherDataProvider CSV, even though older docs said RAIN is cm/day. No error is raised.

      '
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'The CSV RAIN column was authored in cm. PCSE 6.0 CSVWeatherDataProvider DIVIDES the RAIN
      column by 10 to obtain the model''s internal cm/day (csvweatherdataprovider.py: RAIN -> mm_to_cm,
      i.e. value/10). So a cm-authored column is delivered to the soil water balance 10x too low (100x
      if mm was first divided to cm per the old docs). The crop is drought-stressed, LAI/biomass and yield
      are depressed. Distinct from dt_004, which concerns a directly-built WeatherDataContainer where
      you DO provide cm/day (and passing mm there makes rain 10x too HIGH -> waterlogging).

      '
    explanation: 'The CSVWeatherDataProvider columns are SOURCE units that the provider rescales: IRRAD
      kJ (x1000 -> J), VAP kPa (x10 -> hPa), RAIN mm (/10 -> cm). The docstring of create_csv_weather_file.py
      is the canonical contract ("RAIN: mm/day (provider divides /10 -> cm internally)"). Authoring the
      CSV in cm double-converts.

      '
    affected_components:
    - CSVWeatherDataProvider
    - build_pcse_weather_from_source
    - Classic water balance (pcse.soil.classic_waterbalance)
  remedy:
    action: Author the CSVWeatherDataProvider RAIN column in mm/day; let the provider do the /10 -> cm.
    tool_to_run: validate_weather_data
    manual_steps:
    - Use build_pcse_weather_from_source (RAIN = loader precip_mm, no division).
    - Trust create_csv_weather_file.py docstring as ground truth (RAIN column = mm/day).
    - 'Sanity probe: CSVWeatherDataProvider on a row with RAIN=10.0 yields internal RAIN=1.0 cm/day.'
    - Re-run the simulation after fixing RAIN values.
    prevention: CSV columns are SOURCE units (mm/kJ/kPa); the provider rescales. Do not pre-convert to
      internal cm/J/hPa.
  severity: silent
  cross_references:
  - dt_004
  - dt_003
  verified: '2026-06-06'
- id: dt_009_csv_rain_mm_not_cm
  symptom:
    description: WOFOST yields are low / crop is chronically water-stressed when weather came through
      a CSVWeatherDataProvider CSV, even though SKILL.md says RAIN is cm/day. No error is raised.
  diagnosis:
    root_cause: The CSV RAIN column was authored in cm. PCSE 6.0 CSVWeatherDataProvider divides the RAIN
      column by 10 to get the model's internal cm/day, so a cm-authored column is delivered 10x too low
      (100x if mm was first divided to cm per the old docs). Distinct from dt_004, which concerns a directly-built
