    error_pattern: "EXIT CODE: 9|signal 9|Killed"
    detection_method: exit_code
  diagnosis:
    root_cause: Each MPI process holds a full copy of several routing grid arrays in memory. 8 processes
      with 3.8M routing cells exceeds available system memory (~16 GB needed).
    explanation: WRF-Hydro's domain decomposition for routing keeps full-domain arrays on each rank for
      global communication. With 3.8M cells x 4 bytes x ~20 arrays x 8 ranks, total memory approaches
      16 GB. System OOM killer terminates the process with signal 9. No error message in WRF-Hydro logs.
    affected_components:
    - WRF-Hydro MPI routing
    - System memory
  resolution:
    action: Reduce MPI processes from 8 to 2-4 for large domains, or increase AGGFACTRT from 4 to 8
      (coarser routing grid = fewer cells)
    files_changed: []
    prevention: run_wrfhydro.py auto-detects memory and recommends nproc; document memory limits
  severity: fatal
  promoted: true
  promoted_as: dt_v006
