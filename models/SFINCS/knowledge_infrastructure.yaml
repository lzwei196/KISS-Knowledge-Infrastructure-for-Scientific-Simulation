diagnostic_triplets:
  path: "diagnostics/triplets.yaml"
  count: 28
  validated_from_real_runs: 8
  failure_domains:
    - unit_conversion
    - spatial_error
    - timestep_stability
    - boundary_condition
    - coupling
    - io_path
    - parameter_error
    - file_format
    - temporal_alignment
    - runtime
    - variable_selection
    - config_generation

error_log:
  path: "diagnostics/error_log.yaml"
  count: 12
  promoted: 8
  unpromoted: 4

