kiss_manifest_version: 1
model: Landlab
binary_type: Python
verified: observed
install_dir: Landlab

acquire:
  strategy: pip
  package: landlab
  produces: landlab

python_deps: [landlab]

reference_case: >-
  python -c "import landlab; print(landlab.__name__, 'importable')"

notes: >-
  OBSERVED 2026-08-18: `kiss init Landlab` installed landlab 2.11.0 into a clean venv
  and the KI's own preflight_check.py passed with no hand-written recipe. The
  package name was resolved from the KI directory name and confirmed by import,
  not assumed from a PyPI name match.
