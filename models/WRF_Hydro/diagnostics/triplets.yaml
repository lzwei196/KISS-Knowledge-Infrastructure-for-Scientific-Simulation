  - id: dt_v014
    stage: "s10_execution"
    failure_domain: "dependency_mismatch"
    symptom:
      description: "Cold-start produces 237 mm/d surface runoff on first days — unrealistic spinup artifact from uniform soil moisture/temperature initialization."
      error_pattern: "SFCRNOFF.*[0-9]{3}"
