        direction: maximize
        status: supportive
        ceiling_reason: "Huang 2020 compares simulated and observed stem density by DBH class and judges size structure qualitatively."
        cites: [huang2020]
    validated_when: "UNRESOLVED - compare stems/ha and size-class distributions to inventory, but no cited PBIAS band was fetched."
    evidence_strength: moderate
