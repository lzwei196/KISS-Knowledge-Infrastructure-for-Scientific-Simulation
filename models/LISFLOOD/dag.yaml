safety:
  hazards:
    - id: "precip_unit_silent_1000x"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in m/day or mm/3hr instead of mm/day shifts discharge ~1000x; no error raised (dt_001)."
      severity: "silent"
    - id: "temperature_kelvin_flag_mismatch"
      kind: "weather_file_semantic"
      description: "TemperatureInKelvin flag inconsistent with ta units; snow never forms or never melts via the 273.15 offset (dt_002)."
      severity: "silent"
    - id: "et0_actual_not_potential"
      kind: "weather_file_semantic"
      description: "ET0/EW0/ES0 supplied as actual rather than potential ET; LISFLOOD double-reduces evaporation 30-50% and soil stays too wet (dt_003)."
      severity: "silent"
    - id: "forcing_timestep_dtsec_misalignment"
      kind: "control_semantic"
      description: "Forcing time axis not aligned with DtSec (e.g. daily forcing with 6-hourly DtSec) mis-scales precip or shifts peaks by a timestep (dt_004)."
      severity: "silent"
    - id: "genualpha_per_cm_vs_per_m"
      kind: "soil_semantic"
      description: "Van Genuchten alpha in 1/m instead of 1/cm (100x) shifts the water-retention curve, breaking field capacity / wilting point (dt_005)."
      severity: "silent"
    - id: "soildepth_m_vs_mm"
      kind: "soil_semantic"
      description: "SoilDepth in m or cm instead of mm (1000x) makes the soil saturate instantly or never (dt_007)."
      severity: "silent"
    - id: "ksat_wrong_units"
      kind: "soil_semantic"
      description: "KSat in cm/day or m/s instead of mm/day gives unrealistic infiltration (everything or nothing) (dt_008)."
      severity: "silent"
    - id: "calchanman_as_raw_n"
      kind: "control_semantic"
      description: "CalChanMan set to a raw Manning's n (0.03-0.05) instead of a multiplier (~0.5-2.0) gives near-zero effective roughness and peaks days early (dt_009)."
      severity: "silent"
    - id: "ldd_arcgis_d8_encoding"
      kind: "soil_semantic"
      description: "LDD in ArcGIS D8 encoding (1,2,4,…,128) instead of PCRaster (1-9) crashes at startup or misroutes flow (dt_006)."
      severity: "fatal"
    - id: "stepstart_calendar_mismatch"
      kind: "control_semantic"
      description: "StepStart/StepEnd format inconsistent with CalendarDayStart convention runs the wrong period or crashes parsing time (dt_010)."
      severity: "fatal"
    - id: "lake_reservoir_id_missing_in_table"
      kind: "control_semantic"
      description: "A lake/reservoir map ID with no entry in the Tab* lookup tables yields NaN parameters and a mid-run crash / NaN propagation (dt_013)."
      severity: "fatal"
    - id: "snowmeltcoef_too_high"
      kind: "control_semantic"
      description: "SnowMeltCoef too high (or TempSnow/TempMelt wrong) prevents snow accumulation in cold/mountainous basins (dt_014)."
      severity: "silent"
    - id: "gwloss_exceeds_percolation"
      kind: "control_semantic"
      description: "GwLoss draining the lower zone faster than percolation depletes baseflow to zero in dry periods (dt_015)."
      severity: "silent"
    - id: "b_xinanjiang_near_zero"
      kind: "control_semantic"
      description: "b_Xinanjiang near zero makes saturation fraction ~1, so all rain becomes immediate surface runoff with no recharge (flashy, no-baseflow hydrograph) (dt_016)."
      severity: "silent"
    - id: "netcdf_output_both_off"
      kind: "control_semantic"
      description: "writeNetcdfStack and writeNetcdf both off produces only gauge .tss, no spatial *.nc output (dt_018)."
      severity: "silent"
  validation_limits:
    - "This is the distributed rainfall-runoff / water-balance model; it does not produce 2-D hydrodynamic floodplain inundation depths/extents (LISFLOOD-FP is the separate model for that)."
    - "Discharge skill depends on calibration; several parameters (e.g. percolation, preferential flow) are poorly identifiable and exhibit equifinality."
    - "Snowmelt sensitivity is confined to snow-influenced catchments/seasons; degree-day snow physics is uncalibrated in non-nival basins."
    - "Daily/sub-daily timestep cannot resolve sub-hourly flash-flood channel dynamics; flood-event use requires the sub-daily configuration."
  warnings:
    - "Reporting upstream state/rate variable time series (repStateUpsGauges, repRateUpsGauges) can slow execution dramatically."
    - "Numba JIT compilation can silently fail and fall back to a pure-Python soil loop 10-100x slower (dt_017)."
    - "Cold-start initialisation forces channel sub-stepping NoRoutSteps=1, silently changing routing temporal resolution relative to a warm run."
    - "Channel and soil-layer storage initialisation is non-trivial: storage is highly spatially variable and bounded by channel geometry and soil porosity."
  assumptions:
    - statement: "The dag describes the EC-JRC distributed hydrological LISFLOOD (discharge/water-balance core of EFAS/GloFAS), NOT the Bristol LISFLOOD-FP 2-D hydrodynamic inundation model that shares the name."
      scope: "model identity and the influence/observability blocks"
      source: "Van Der Knijff, Younis & De Roo (2010) IJGIS 24(2):189-212, DOI 10.1080/13658810802549154; EC-JRC lisflood-model documentation"
      status: "adopted"
    - statement: "The soil column is treated as a 3-layer Van Genuchten vertical profile per land-cover fraction, with grid-cell fluxes area-weighted across five aggregated land-cover classes."
      scope: "soil and ET process structure"
      source: "EC-JRC lisflood-model 'Standard LISFLOOD processes - overview' docs; convert_soil_params layer mapping"
      status: "adopted"
    - statement: "Mass-balance (water) closure is the model's conservation law; there is no closed surface energy budget — snow/frost are degree-day/threshold driven and ET is a demand-side potential-ET reduction."
      scope: "closure semantics"
      source: "Burek, Van Der Knijff & De Roo (2013) LISFLOOD Revised User Manual, JRC EUR 26162 EN; waterbalance module (twb residual)"
      status: "adopted"
    - statement: "Default timestep is configuration-dependent (sub-daily for events, daily for water balance); no single canonical DtSec is assumed, though the optional EPIC crop coupling requires DtSec=86400."
      scope: "temporal resolution"
      source: "EC-JRC lisflood-model introduction docs; Lisflood_initial.py DtSec==86400 EPIC constraint"
      status: "adopted"
