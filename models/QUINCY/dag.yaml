      applicability: "full QUINCY; offsetting positive/negative effects yield minimal long-term annual-mean GPP influence"
      citations: ["thum2019_quincy_v10_gmd"]
  _caveat: "All HIGH grades rest on rank/correlation-based importance, not variance-decomposition sensitivity indices: QUINCY has no Sobol/Morris/EFAST study. Grounding is Thum et al. 2019 RPCC (rank-transformed partial correlation over a 1000-sample LHS of 45 parameters; top-group rank treated as the quantitative bar) and Miinalainen et al. 2025 correlation/permutation-importance. Treat HIGH here as 'top-ranked in the available rank/correlation analysis,' not as St>=0.3."
