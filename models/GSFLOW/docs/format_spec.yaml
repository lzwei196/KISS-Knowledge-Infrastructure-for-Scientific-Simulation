# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: GSFLOW
  language: fortran
  implementation:
    id: gsflow-v2
    version: 2.3.1 (gsflow_v2)
    provenance: Fortran 90 + C; USGS public-domain GSFLOW couples PRMS-V surface hydrology with MODFLOW-2005/MODFLOW-NWT
      groundwater flow.
  scientific_reference_version: GSFLOW (USGS TM 6-D1, 2008; PRMS + MODFLOW-2005/MODFLOW-NWT integration),
    2.2.x lineage
inputs:
  forcing:
  - name: precipitation
    unit: in/day (precip_units=0) or mm/day (precip_units=1)
    category: forcing
    source_kind: forcing
    model_input_format: .day (climate_hru, one value per HRU per day) or PRMS .data station file
    notes: Rain/snow/mixed form determined from air temperature unless prescribed; distributed to HRUs
      by the precip_module
  - name: air temperature (tmax and tmin)
    unit: degF (temp_units=0) or degC (temp_units=1)
    category: forcing
    source_kind: forcing
    model_input_format: .day or .data; both tmax and tmin required
    notes: Distributed to HRUs by the temp_module; controls rain/snow partition (~32 degF threshold)
  - name: solar radiation (swrad)
    unit: Langleys/day (cal/cm²/day)
    category: forcing
    source_kind: forcing
    model_input_format: .day or .data (optional)
    notes: If absent, estimated by ddsolrad (degree-day) and distributed via soltab; 1 W/m² = 2.065 Langleys/day
  - name: potential ET (potet)
    unit: in/day
    category: forcing
    source_kind: forcing
    model_input_format: .day (optional)
    notes: Used when et_module=climate_hru prescribes PET instead of computing it
  - name: pan evaporation
    unit: length
    category: forcing
    source_kind: forcing
    model_input_format: .data (optional)
    notes: Used only when the potet_epan ET module is selected
  - name: observed streamflow
    unit: ft³/s (runoff_units=0) or m³/s (runoff_units=1)
    category: forcing
    source_kind: user_provided
    model_input_format: .data station file (optional)
    notes: Observed data for calibration/comparison; not a model driver
  parameters:
  - name: soil_moist_max
    unit: in
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params (nhru)
    notes: Maximum soil-moisture capacity; top calibration parameter; typical 2–20 in
  - name: soil_rechr_max
    unit: in
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params (nhru)
    notes: Max recharge-zone capacity; must be <= soil_moist_max
  - name: ssr2gw_rate
    unit: fraction/day
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params (nssr)
    notes: Gravity-reservoir → groundwater drainage rate (≈Ksat/500, cap ~0.8); drives recharge into MODFLOW
  - name: slowcoef_lin / fastcoef
    unit: 1/day
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params (nhru)
    notes: Linear/nonlinear interflow (slow/preferential-flow) coefficients
  - name: gwflow_coef
    unit: 1/day
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params (PRMS-only groundwater reservoir)
    notes: Groundwater discharge coefficient (PRMS5 mode; superseded by MODFLOW in GSFLOW5)
  - name: smidx_coef / smidx_exp
    unit: dimensionless
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params (nhru)
    notes: srunoff_smidx soil-moisture-index surface-runoff coefficients
  - name: jh_coef
    unit: dimensionless
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params
    notes: Jensen-Haise PET coefficient (potet_jh)
  - name: rain_cbh_adj / snow_cbh_adj / tmax_cbh_adj / tmin_cbh_adj
    unit: factor / degrees
    category: parameters
    source_kind: calibrated
    model_input_format: PRMS .params (nhru × nmonth)
    notes: Per-HRU monthly precipitation and temperature adjustment factors for climate_hru forcing
  - name: hru_area
    unit: acres
    category: parameters
    source_kind: dataset_lookup
    model_input_format: PRMS .params (nhru)
    notes: PRMS internal area unit is acres; km² → acres × 247.105
  - name: hru_elev / hru_slope / hru_aspect / hru_type
    unit: ft or m (elev_units) / fraction / degrees / code
    category: parameters
    source_kind: dataset_lookup
    model_input_format: PRMS .params (nhru)
    notes: HRU geometry from DEM; elevation units must match elev_units and lapse-rate parameters
  - name: soil_type
    unit: code (1=sand,2=loam,3=clay)
    category: parameters
    source_kind: dataset_lookup
    model_input_format: PRMS .params (nhru, dtype int)
    notes: From HWSD/SoilGrids
  - name: cov_type / covden_sum / covden_win
    unit: code / fraction (0–1)
    category: parameters
    source_kind: dataset_lookup
    model_input_format: PRMS .params (nhru)
    notes: Vegetation type and summer/winter cover density from land-cover raster
  - name: hru_percent_imperv / imperv_stor_max
    unit: fraction / in
    category: parameters
    source_kind: dataset_lookup
    model_input_format: PRMS .params (nhru)
    notes: Impervious fraction and impervious storage capacity
  - name: MODFLOW hydraulic conductivity / transmissivity (HK, VKA)
    unit: length/time
    category: parameters
    source_kind: calibrated
    model_input_format: MODFLOW LPF or UPW package
    notes: Saturated-zone aquifer properties; UPW pairs with the NWT solver, LPF with PCG
  - name: streambed / lakebed leakance (SFR, LAK)
    unit: length/time per length
    category: parameters
    source_kind: calibrated
    model_input_format: MODFLOW SFR / LAK packages
    notes: Controls stream/lake–aquifer exchange flux
  initial_conditions:
  - name: initial groundwater heads
    unit: length
    category: initial_conditions
    source_kind: user_provided
    model_input_format: MODFLOW BAS6 (or steady-state first stress period)
    notes: Required for first MODFLOW stress period; critical for transient runs; a steady-state period
      can establish the initial head field
  - name: initial soil moisture / recharge-zone storage
    unit: in
    category: initial_conditions
    source_kind: default
    model_input_format: PRMS control-file initial conditions
    notes: Requires 1–3 yr spinup to equilibrate
  - name: initial snowpack water equivalent
    unit: in
    category: initial_conditions
    source_kind: default
    model_input_format: PRMS control-file initial conditions
    notes: Spinup-sensitive
  - name: initial unsaturated-zone and gravity-reservoir storage
    unit: length
    category: initial_conditions
    source_kind: default
    model_input_format: MODFLOW UZF / GVR coupling state
    notes: Spinup-sensitive coupling storages
  boundary_conditions:
  - name: model_mode
    unit: code
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: control file (GSFLOW5 | PRMS5 | MODFLOW)
    notes: Selects coupled / PRMS-only / MODFLOW-only run
  - name: start_time / end_time
    unit: Y M D H Min S
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: control file (6 int)
    notes: Simulation window
  - name: modflow_time_zero
    unit: date
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: control file
    notes: Must be ≥1 day before start_time in GSFLOW mode (coupling convention)
  - name: climate module selection (temp_module, precip_module, solrad_module, et_module)
    unit: switch
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: control file
    notes: e.g. climate_hru (gridded .day) vs station interpolation (temp_1sta_laps/precip_dist2); ddsolrad
      vs prescribed; potet_jh vs climate_hru. Choice must match presence of matching .day files
  - name: process module selection (srunoff_module, strmflow_module, soilzone_module)
    unit: switch
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: control file
    notes: Surface-runoff, streamflow-routing, and soil-zone module choices
  - name: unit codes (temp_units, precip_units, runoff_units, elev_units)
    unit: integer code
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: control file
    notes: Declare the units of the supplied forcing/geometry; mismatch causes silent unit-conversion
      errors
  - name: MODFLOW external boundaries (CHD, GHB, FHB, WEL)
    unit: head / flux
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: MODFLOW package input files
    notes: Specified-head, head-dependent, and specified-flow boundaries plus well pumping/withdrawals
  - name: 'MODFLOW solver selection and tolerances (NWT/PCG: MXITER, HCLOSE)'
    unit: switch / convergence criteria
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: MODFLOW NWT or PCG package
    notes: NWT (Newton-Raphson) for drying/rewetting cells; tolerance settings affect convergence
  - name: MODFLOW LENUNI / ITMUNI
    unit: length/time unit code
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: MODFLOW DIS package
    notes: e.g. LENUNI=2 (meters), ITMUNI=4 (days)
  - name: cascade routing network (ncascade, hru_up_id, hru_down_id, hru_segment, cascade_flg)
    unit: topology
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: PRMS .params / ncascade.params
    notes: Defines HRU-to-HRU and HRU-to-segment lateral flow paths; required for streamflow to reach
      the outlet
outputs:
  primary:
  - name: basin_cfs
    unit: ft³/s
    description: Simulated streamflow at the basin outlet (convert to m³/s ×0.028317)
    validation_rank: 3
    emitted_in: PRMS statvar file (stat_var_file)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Discard 1–3 yr spinup before scoring; including it strongly degrades NSE/KGE
        - Unit mismatch (cfs vs m³/s ≈35×) must be reconciled before comparison
      - obs_shape: categorical_event
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        - timing_accuracy
        determining_metric: csi
        caveats:
        - Daily time step cannot resolve sub-daily flood peaks; high-flow event timing limited to daily
          resolution
      detrending_options:
      - none
  - name: basin_stflow
    unit: in/day
    description: Basin total streamflow as depth (convert to m³/s via × area_km² × 25.4 × 1000 / 86400)
    validation_rank: 4
    emitted_in: PRMS water-budget / CSV basin summary
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Area-based depth→volume conversion required; do not confuse with the direct basin_cfs path
      detrending_options:
      - none
  - name: basin_actet
    unit: in
    description: Area-weighted actual evapotranspiration
    validation_rank: 1
    emitted_in: GSFLOW CSV (basinpervet) / PRMS water-budget file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - No surface energy-balance closure; ET is a PET-limited demand calculation, biases inherit from
          the PET method
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - HRU-resolution field; compare against gridded ET only after HRU→grid mapping
      detrending_options:
      - none
  - name: basin_recharge
    unit: in
    description: Groundwater recharge from soil zone / unsaturated zone (uzf_recharge)
    validation_rank: 5
    emitted_in: GSFLOW CSV (uzf_recharge) / PRMS summary
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Recharge is rarely directly observed; comparison usually indirect via heads/baseflow
      detrending_options:
      - seasonal
      - decadal_mean
  - name: gw_head (MODFLOW .hds)
    unit: length (ft/m)
    description: Simulated groundwater head per layer/cell
    validation_rank: 2
    emitted_in: MODFLOW head file (.hds)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: r
        caveats:
        - Cell-averaged head vs point well measurement; cell size must be appropriate to the gradient
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Compare on the MODFLOW grid layer corresponding to the screened interval
      detrending_options:
      - none
  - name: basin_snow
    unit: in
    description: Basin snowpack water equivalent (SWE)
    validation_rank: 6
    emitted_in: PRMS statvar / CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Point SNOTEL SWE vs HRU-mean SWE; elevation/aspect of the HRU matters
      detrending_options:
      - none
  - name: basin_soil_moist
    unit: in
    description: Basin soil-moisture storage
    validation_rank: 7
    emitted_in: PRMS statvar / CSV (basinsoilmoist)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Bucket storage (inches) is not directly volumetric soil moisture; pattern comparison more defensible
          than magnitude
      detrending_options:
      - none
  - name: overall water budget (IN/OUT, percent discrepancy)
    unit: length³ and length³/day
    description: MODFLOW/GSFLOW volumetric budget summaries with overall budget error and percent discrepancy
    validation_rank: 8
    emitted_in: MODFLOW listing (.list) / GSFLOW water-budget file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Internal mass-balance check (target percent discrepancy near 0), not an external observation
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: 'Model runs successfully but simulated streamflow is 25× higher than

    observed. Massive flooding in all seasons. Basin water balance shows

    precipitation far exceeding any reasonable value.

    '
  diagnosis: 'Precipitation units not converted from mm/day (CMFD source) to

    inches/day (GSFLOW precip_units=0). The factor of 25.4 was missed.

    GSFLOW interprets mm values as inches, inflating precipitation by 25.4×.

    '
  remedy: 'Multiply precipitation by MM_TO_INCHES = 1/25.4 = 0.03937 before

    writing to .day or .data file. Alternatively, set precip_units=1 (mm)

    in the parameter file to keep mm units. Verify: annual precipitation

    should be ~30-80 inches (760-2000 mm) for most basins.

    '
  severity: silent
- id: dt_002
  symptom: 'No snow accumulation even in winter for basins that should have snow.

    ET is unrealistically high in winter. All precipitation falls as rain

    regardless of season.

    '
  diagnosis: 'Temperature data in Celsius being read by GSFLOW as Fahrenheit

    (temp_units=0). 0°C is interpreted as 0°F, which is -17.8°C — but

    during summer, 25°C is read as 25°F (-3.9°C), which is still cold.

    Actually the issue is reversed: Kelvin or Celsius values are much

    higher than expected Fahrenheit values'
  remedy: 'Convert temperature: K→°F = (K-273.15)×9/5+32 or K→°C = K-273.15.

    Match temp_units in parameter file to actual data units.

    Check: winter temperatures should be near/below 32°F (0°C) for

    snow-producing basins.

    '
  severity: silent
- id: dt_003
  symptom: 'Simulated ET is approximately half the expected value. Soil moisture

    remains too high. Streamflow is moderately overestimated due to

    insufficient ET extraction.

    '
  diagnosis: 'Solar radiation not converted from W/m² (CMFD source) to

    Langleys/day (GSFLOW internal). The conversion factor is ~2.065.

    Without conversion, radiation appears ~2× too low, reducing

    computed potential ET by a similar factor.

    '
  remedy: 'Convert: Langleys/day = W/m² × 86400/41868 ≈ W/m² × 2.065.

    Verify: peak summer solar radiation should be 400-700 Langleys/day

    (200-340 W/m²). If values are < 200, likely not converted.

    '
  severity: silent
- id: dt_004
  symptom: 'All precipitation is stored in soil with almost no streamflow generated.

    Soil moisture never reaches capacity. The soil acts as an infinite sponge.

    '
  diagnosis: 'Soil moisture capacity (soil_moist_max) computed in mm but GSFLOW

    expects inches. A typical soil_moist_max of 200mm becomes 200 inches

    (5080mm) — an impossibly large soil reservoir that never fills.

    '
  remedy: 'Convert soil depth/capacity from mm to inches: divide by 25.4.

    Typical soil_moist_max range: 2-20 inches (50-500 mm).

    If soil_moist_max > 30 inches, likely still in mm.

    '
  severity: silent
- id: dt_005
  symptom: 'Temperature lapse rate corrections are wildly wrong. Valley HRUs

    are too cold or mountain HRUs too warm. Snow line is at wrong

    elevation. Streamflow timing is incorrect.

    '
  diagnosis: 'DEM elevation units (meters) don''t match GSFLOW elevation units

    (feet, via elev_units parameter). If DEM is in meters but GSFLOW

    expects feet, lapse rate corrections are applied to wrong values.

    1 meter ≈ 3.28 feet, so error is ~3.3×.

    '
  remedy: 'Either convert DEM to feet before extracting hru_elev, or set

    elev_units=1 (meters) in the parameter file. Verify by checking

    hru_elev values against known basin elevations.

    '
  severity: silent
- id: dt_006
  symptom: 'GSFLOW crashes immediately at startup with error about reading

    control file or "unexpected end of file" error.

    '
  diagnosis: 'Missing #### delimiter between parameter blocks in control file.

    Each parameter block must start and end with ####. A single missing

    delimiter causes the parser to misalign all subsequent parameters.

    '
  remedy: 'Ensure every parameter block in the control file is bounded by

    #### lines. Use build_control_file.py tool which handles delimiters

    automatically. Validate by counting #### lines: should be

    2 × (number of parameters) + 1.

    '
  severity: fatal
- id: dt_007
  symptom: 'GSFLOW crashes during initialization with "dimension mismatch" or

    "array bounds exceeded" error message.

    '
  diagnosis: 'Parameter array length doesn''t match declared dimension. For example,

    if nhru=128 but soil_moist_max has only 100 values, GSFLOW crashes

    when trying to read value 101.

    '
  remedy: 'Verify each parameter has exactly the declared number of values.

    Check dimension declarations in parameter files match across all

    parameter files (nhru, nsegment, nssr must be consistent).

    '
  severity: fatal
- id: dt_008
  symptom: 'Parameter values are all zero or all the same default value.

    Model runs but produces uniform output across all HRUs.

    '
  diagnosis: 'Wrong data type code in parameter file. Using code 1 (integer) for

    a float parameter truncates decimal values to 0. Using code 4 (string)

    for a numeric parameter reads garbage.

    '
  remedy: 'Data type codes: 1=integer, 2=real (float), 4=character (string).

    Verify data type codes match parameter type. Most physical parameters

    are type 2 (real). soil_type and cov_type are type 1 (integer).

    '
  severity: silent
- id: dt_009
  symptom: '"FAILED TO MEET SOLVER CONVERGENCE CRITERIA" repeated in MODFLOW

    listing file. Model may produce output but water budget doesn''t close.

    '
  diagnosis: 'MODFLOW groundwater solver (PCG, NWT) cannot converge within the

    specified iterations. Common causes: unrealistic hydraulic conductivity,

    initial heads far from solution, dry cells with rewetting problems,

    or grid resolution too fine relative to properties.

    '
  remedy: '1. Switch from PCG to NWT solver (more robust for unconfined flow)

    2. Increase MXITER in solver settings (e.g., 500→1000)

    3. Relax convergence criteria (HCLOSE: 0.001→0.01)

    4. Check hydraulic conductivity values are reasonable

    5. Set initial heads to land surface elevation

    6. Check for extremely thi'
  severity: fatal
- id: dt_010
  symptom: 'GSFLOW aborts with "modflow_time_zero must precede simulation

    start_time" or similar timing error.

    '
  diagnosis: 'The modflow_time_zero control parameter is set to the same date or

    a date after start_time. GSFLOW requires modflow_time_zero to be

    at least 1 day before start_time.

    '
  remedy: 'Set modflow_time_zero to 1 day before start_time. For example,

    if start_time = 1980,10,1, set modflow_time_zero = 1980,9,30.

    '
  severity: fatal
- id: dt_011
  symptom: 'No streamflow generated. basin_cfs is always 0. All water goes to

    soil and groundwater storage but never reaches streams.

    '
  diagnosis: 'Cascade flow network not defined or improperly configured.

    HRUs are not connected to stream segments, so surface runoff and

    interflow have no pathway to streams. Water accumulates in HRUs.

    '
  remedy: 'Verify cascade parameters are defined:

    - ncascade > 0

    - hru_up_id and hru_down_id arrays properly assigned

    - Terminal HRUs cascade to stream segments (hru_segment)

    Alternatively, use strmflow_in_out module for simple routing.

    '
  severity: degraded
- id: dt_012
  symptom: 'Simulated peak flows are much higher than observed, while baseflow

    is too low. Hydrograph is too flashy with rapid rise and fall.

    '
  diagnosis: 'Groundwater parameters (ssr2gw_rate, gwflow_coef) are too low,

    causing insufficient groundwater recharge and baseflow. Most water

    runs off as surface flow or quick interflow.

    '
  remedy: 'Increase ssr2gw_rate (0.1-0.5) and gwflow_coef (0.01-0.05).

    Also check soil_moist_max — if too low, soil fills quickly and

    generates excess surface runoff.

    '
  severity: silent
- id: dt_013
  symptom: '"File not found" errors when running on Linux. Control file was

    created on Windows and contains backslash path separators.

    '
  diagnosis: 'Windows-style paths (\..\input\prms\file.params) are not valid

    on Linux. The backslashes are interpreted as escape characters

    or literal characters, not path separators.

    '
  remedy: 'Convert all backslashes to forward slashes in control file and

    MODFLOW name file: sed -i ''s|\\|/|g'' *.control *.nam

    The build_control_file.py tool always uses forward slashes.

    '
  severity: fatal
- id: dt_014
  symptom: 'Output directory errors. GSFLOW reports cannot open output files.

    No output files are created.

    '
  diagnosis: 'Output directories specified in control file don''t exist. GSFLOW

    does NOT create directories automatically. If the control file

    specifies output/prms/ but that directory doesn''t exist, writes fail.

    '
  remedy: 'Create all output directories before running:

    mkdir -p output/prms output/modflow

    Check all paths in csv_output_file, model_output_file, etc.

    '
  severity: fatal
- id: dt_015
  symptom: 'GSFLOW crashes during first timestep with "data file read error"

    or "wrong number of values" in data file.

    '
  diagnosis: 'The .day file has wrong number of values per line. GSFLOW expects

    exactly nhru values after the 6 date fields. Fewer values → crash.

    More values → silently ignored (but usually causes alignment issues).

    '
  remedy: 'Verify each data line has exactly 6 + nhru columns.

    Check nhru dimension in parameter file matches .day file column count.

    Watch for inconsistent line endings (Windows CRLF vs Unix LF).

    '
  severity: fatal
- id: dt_016
  symptom: 'Validation metrics (NSE, KGE) are much worse than expected despite

    reasonable-looking hydrographs. NSE is strongly negative.

    '
  diagnosis: 'Spinup period included in validation statistics. The first 1-3 years

    of simulation have unrealistic initial conditions (dry soil, wrong

    groundwater heads), which dramatically inflate error statistics.

    '
  remedy: 'Discard first 1-3 years as spinup period. For Bengbu 1980-1990:

    start model at 1980, validate only 1981-1990 (or even 1982-1990).

    '
  severity: silent
- id: dt_017
  symptom: 'Simulated discharge is approximately 35× higher or lower than

    observed discharge. Temporal pattern may look correct but magnitude

    is completely wrong.

    '
