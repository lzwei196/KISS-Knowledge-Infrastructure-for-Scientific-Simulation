# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: Delft3D
  language: fortran
  implementation:
    id: dflowfm
    version: 2026.02 (engines built from github.com/Deltares/Delft3D)
    provenance: Fortran 90; Deltares D-Flow FM (dflowfm) unstructured-grid kernel, orchestrated under
      DIMR.
  scientific_reference_version: D-Flow Flexible Mesh shallow-water hydrodynamics (Deltares Delft3D FM
    lineage; Kernkamp et al. 2011 unstructured-grid scheme)
inputs:
  forcing:
  - name: wind_speed
    unit: m/s at 10 m
    category: meteorological
    source_kind: forcing
    model_input_format: .wnd / .ext+.bc meteo block
    notes: reference height is 10 m
  - name: wind_direction
    unit: degrees nautical (FROM North)
    category: meteorological
    source_kind: forcing
    model_input_format: .wnd / .ext+.bc meteo block
    notes: nautical FROM convention, not meteorological-TO; a 180-degree error reverses wind setup
  - name: atmospheric_pressure
    unit: Pa
    category: meteorological
    source_kind: forcing
    model_input_format: .ext+.bc meteo block
    notes: must be Pa, not hPa; drives the inverse-barometer water-level response
  - name: air_temperature
    unit: degC
    category: meteorological
    source_kind: forcing
    model_input_format: .ext+.bc meteo block
    notes: drives heat-flux model (Temperature module)
  - name: relative_humidity
    unit: '% (0-100)'
    category: meteorological
    source_kind: forcing
    model_input_format: .ext+.bc meteo block
    notes: percentage not fraction
  - name: cloud_cover
    unit: fraction (0-1)
    category: meteorological
    source_kind: forcing
    model_input_format: .ext+.bc meteo block
  - name: shortwave_radiation
    unit: W/m2
    category: meteorological
    source_kind: forcing
    model_input_format: .ext+.bc meteo block
    notes: must be non-negative; negative values from interpolation corrupt the heat budget
  - name: precipitation
    unit: mm/hr
    category: meteorological
    source_kind: forcing
    model_input_format: .ext+.bc meteo block
  parameters:
  - name: friction_type_and_coefficient
    unit: Chezy m^(1/2)/s | Manning s/m^(1/3) | White-Colebrook
    category: bed_friction
    source_kind: calibrated
    model_input_format: MDU UnifFrictType + UnifFrictCoef (or spatial friction field)
    notes: type selector and coefficient value must be consistent; default uniform value frcuni=0.023
      (Manning) when no field provided
  - name: horizontal_eddy_viscosity
    unit: m2/s
    category: turbulence
    source_kind: calibrated
    model_input_format: MDU Vicouv
    notes: model default vicouv=0.1 m2/s; controls momentum mixing and is a silent numerical-diffusion
      default
  - name: horizontal_eddy_diffusivity
    unit: m2/s
    category: turbulence
    source_kind: calibrated
    model_input_format: MDU Dicouv
    notes: model default dicouv=0.1 m2/s; controls scalar mixing
  - name: bed_level
    unit: 'm (Delft3D convention: depth positive DOWN)'
    category: bathymetry
    source_kind: dataset_lookup
    model_input_format: _net.nc node/cell bed level (bl)
    notes: static substrate geometry; sign convention is positive-down, opposite to GEBCO/ETOPO positive-up
  - name: reference_density
    unit: kg/m3
    category: physical_constant
    source_kind: default
    model_input_format: kernel default rhomean=1000.0
    notes: Boussinesq reference density in pressure/baroclinic terms
  initial_conditions:
  - name: initial_water_level
    unit: m (MSL)
    category: hydrodynamic
    source_kind: user_provided
    model_input_format: initial field file (.ini) / restart _rst.nc
    notes: state s1 at simulation start
  - name: initial_velocity
    unit: m/s
    category: hydrodynamic
    source_kind: user_provided
    model_input_format: initial field file / restart _rst.nc
  - name: initial_salinity
    unit: PSU
    category: constituent
    source_kind: user_provided
    model_input_format: initial field file / restart _rst.nc
    notes: background default backgroundsalinity=30 ppt feeds density when the salinity module is off
  - name: initial_temperature
    unit: degC
    category: constituent
    source_kind: user_provided
    model_input_format: initial field file / restart _rst.nc
    notes: background default backgroundwatertemperature=20 degC when the temperature module is off
  boundary_conditions:
  - name: water_level_boundary
    unit: m (datum-referenced)
    category: open_boundary
    source_kind: user_provided
    model_input_format: .pli location + .bc time series (waterlevelbnd)
    notes: datum/sign convention (MSL vs chart datum) must be consistent with bathymetry
  - name: velocity_boundary
    unit: m/s
    category: open_boundary
    source_kind: user_provided
    model_input_format: .pli + .bc (velocitybnd)
  - name: river_discharge_boundary
    unit: m3/s
    category: open_boundary
    source_kind: user_provided
    model_input_format: .pli + .bc (dischargebnd)
    notes: freshwater inflow must carry an explicit salinity (S=0 PSU); otherwise it inherits ocean salinity
  - name: salinity_boundary
    unit: PSU
    category: open_boundary
    source_kind: user_provided
    model_input_format: .bc (salinitybnd)
  - name: temperature_boundary
    unit: degC
    category: open_boundary
    source_kind: user_provided
    model_input_format: .bc (temperaturebnd)
  - name: tidal_harmonic_boundary
    unit: amplitude m, phase deg, period MINUTES
    category: open_boundary
    source_kind: user_provided
    model_input_format: .bc astronomical/harmonic components
    notes: D-Flow FM .bc periods are in minutes (M2=745.2); phases must be referenced to the simulation
      RefDate epoch
  - name: vertical_structure_Kmx
    unit: count
    category: control
    source_kind: user_provided
    model_input_format: MDU Kmx
    notes: Kmx=0 -> 2D depth-averaged; Kmx>0 -> 3D layered (default sigma layers)
  - name: time_reference_and_unit
    unit: RefDate YYYYMMDD; Tunit S/M/H
    category: control
    source_kind: user_provided
    model_input_format: MDU RefDate + Tunit
    notes: all MDU time parameters are in Tunit except DtMax, which is always in seconds
  - name: friction_type_switch_UnifFrictType
    unit: enum (0=Chezy,1=Manning,2=White-Colebrook)
    category: control
    source_kind: user_provided
    model_input_format: MDU UnifFrictType
  - name: heat_flux_model_selector
    unit: enum (Temperature module mode)
    category: control
    source_kind: user_provided
    model_input_format: MDU Temperature
    notes: selects excess vs composite/heat-flux surface exchange
outputs:
  primary:
  - name: water_level
    unit: m
    description: Sea surface elevation (s1) at cell centres
    validation_rank: 1
    emitted_in: _his.nc (observation points), _map.nc (spatial field)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - tide-gauge datum (MSL vs chart datum) must match the model datum before comparison
        - for tidal records, evaluate M2 amplitude ratio (0.8-1.2) and phase error (<30 min) explicitly;
          NSE is artificially inflated for large-mean small-variation signals
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - requires gridded/altimetry surface; mesh-to-grid interpolation introduces sampling error
      detrending_options:
      - none
  - name: velocity
    unit: m/s
    description: Depth-averaged (2D) or per-layer cell-centre water flow velocity (ucx, ucy)
    validation_rank: 3
    emitted_in: _map.nc, _his.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - ADCP/current-meter measurement depth must match the compared model layer; speed and direction
          may need separate evaluation
      detrending_options:
      - none
  - name: salinity
    unit: PSU
    description: Water-column salinity / salt concentration constituent (sa1)
    validation_rank: 4
    emitted_in: _map.nc, _his.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - sensor depth and stratification must be matched; salt-intrusion comparisons are sensitive to
          freshwater-boundary salinity specification
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - captures salt-intrusion extent / plume structure
      detrending_options:
      - none
  - name: temperature
    unit: degC
    description: Water temperature constituent (tem1), driven by surface heat flux
    validation_rank: 5
    emitted_in: _map.nc, _his.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - heat-flux forcing quality (RH, shortwave, cloud) dominates bias; sensor depth must be matched
      detrending_options:
      - none
  - name: bed_shear_stress
    unit: N/m2
    description: Bottom shear stress (taus / taubu)
    validation_rank: 6
    emitted_in: _map.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - rarely measured directly; usually inferred, so comparison is semi-quantitative
      detrending_options:
      - none
  - name: bed_level_change
    unit: m
    description: Morphodynamic bed-level evolution (sediment module)
    validation_rank: 7
    emitted_in: _map.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - bathymetric-survey difference maps; sensitive to MorFac, initial bed composition, and survey
          epoch
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: pbias
        caveats:
        - morphological change accumulates and amplifies over decadal timescales
      detrending_options:
      - none
      - linear_residual
  - name: significant_wave_height
    unit: m
    description: Significant wave height (hwav) from the coupled D-Waves module
    validation_rank: 2
    emitted_in: _map.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - only available when wave coupling is active; buoy (NDBC-style) Hs comparison
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: All cells are dry. Model reports 'no wet cells' or crashes at start. Water level is below bed
    everywhere.
  diagnosis: Bathymetry sign convention not negated — GEBCO positive-up used directly as Delft3D depth;
    GEBCO/ETOPO stores elevation as positive UP (ocean floor = negative values, e.g., -500 m). Delft3D
    expects depth as positive DOWN (ocean floor = +500 m). If GEBCO values are used without negation,
    the model se
  remedy: 'Negate GEBCO elevation values: depth_delft3d = -elevation_gebco; convert_bathymetry; [''Check
    NetNode_z values in _net.nc — ocean should have POSITIVE depth'', ''If ocean points have negative
    values, run convert_bathymetry with --negate_depth'']; convert_bathymetry validates sign convention
    and warns if'
  severity: crash
- id: dt_002
  symptom: Water levels show almost no response to atmospheric pressure. Inverse barometer effect is 100x
    too small (~0.1 mm instead of ~10 mm per hPa).
  diagnosis: Atmospheric pressure in hPa instead of Pa — 100x too small; Delft3D expects atmospheric pressure
    in Pascals (e.g., 101325 Pa). Many datasets and tools display pressure in hectoPascals (1013.25 hPa).
    If hPa values are used directly, the pressure gradient is 100x too small, producing negligible invers
  remedy: Multiply pressure values by 100 to convert hPa to Pa; convert_forcing_to_delft3d; ['Check max
    pressure in forcing file — should be ~101000-103000 Pa', 'If max pressure is ~1010-1030, values are
    in hPa — multiply by 100']; convert_forcing_to_delft3d auto-detects hPa and converts to Pa
  severity: silent
- id: dt_003
  symptom: Storm surge occurs on wrong side of domain. Wind setup is in opposite direction from expected.
  diagnosis: 'Wind direction convention is TO instead of FROM — 180° error; Delft3D uses nautical convention:
    wind direction indicates where the wind blows FROM (0°=N, 90°=E). Some datasets use mathematical convention:
    direction wind blows TO. A 180° error means a north wind (FROM north) becomes a south wind (FRO'
  remedy: Add 180° to wind direction and take modulo 360; convert_forcing_to_delft3d; ['During a known
    NW storm event, check if wind direction in forcing is ~315° (FROM NW)', 'If it shows ~135° (FROM SE),
    the convention is reversed — add 180°']; Verify with ERA5 (uses same nautical convention as Delft3D)
  severity: silent
- id: dt_004
  symptom: Extreme evaporation or condensation. Water surface heat budget is severely wrong. Temperature
    bias > 5°C.
  diagnosis: 'Relative humidity as fraction (0-1) instead of percentage (0-100); Delft3D expects relative
    humidity as percentage (0-100). If values are provided as fraction (0.0-1.0), the model interprets
    0.7 (70%) as 0.7% RH, computing extreme evaporation. This silently corrupts the entire heat budget.

    ; [''conve'
  remedy: Multiply RH values by 100 if they are in 0-1 range; convert_forcing_to_delft3d; ['Check max
    RelHum in forcing — should be 70-100 for coastal areas', 'If max RelHum < 1.5, values are fraction
    — multiply by 100']; convert_forcing_to_delft3d auto-detects fraction and warns
  severity: silent
- id: dt_005
  symptom: Tidal boundary oscillates with wrong frequency. M2 period is 60x too fast or 60x too slow.
  diagnosis: Harmonic constituent period in hours instead of minutes (or vice versa); D-Flow FM .bc files
    expect the harmonic period in MINUTES. M2 period is 745.2 minutes (12.42 hours). If hours are used
    (12.42), the period is interpreted as 12.42 minutes, producing a tide that oscillates 60x too fast.
    If secon
  remedy: 'Ensure harmonic periods are in minutes: M2 = 745.2, S2 = 720.0, K1 = 1436.1; convert_boundary_conditions;
    ["Check the ''Unit'' field in .bc file — should be ''minutes''", ''Verify M2 period value is ~745
    (not ~12.4 hours or ~44712 seconds)'']; convert_boundary_conditions uses standard period database
    in m'
  severity: silent
- id: dt_006
  symptom: NaN values appear in temperature output. Model crashes after a few timesteps.
  diagnosis: Negative shortwave radiation values from temporal interpolation; When interpolating 3-hourly
    forcing to hourly timesteps, linear interpolation can produce small negative shortwave radiation during
    dawn/dusk transitions. Negative SW radiation is physically impossible and can cause numerical artifacts
  remedy: 'Clip shortwave radiation to max(0, SW) after interpolation; convert_forcing_to_delft3d; [''Check
    min shortwave in forcing — must be >= 0 W/m²'', ''If negative values exist, clip: SW = max(0, SW)''];
    convert_forcing_to_delft3d clips SW to >= 0 by default'
  severity: crash
- id: dt_007
  symptom: Flow velocities are near zero everywhere. Water barely moves despite strong forcing.
  diagnosis: 'Friction type and value mismatch — Manning value used with Chezy type; UnifFrictType=0 means
    Chezy (typical values 40-70 m^0.5/s). UnifFrictType=1 means Manning (typical values 0.015-0.05 s/m^1/3).
    If FrictType=0 (Chezy) is set with a Manning value like 0.025, Delft3D interprets Chezy coefficient
    = '
  remedy: 'Verify UnifFrictType matches UnifFrictCoef: Chezy=40-70, Manning=0.01-0.05; [''Check UnifFrictType
    in MDU: 0=Chezy, 1=Manning, 2=White-Colebrook'', ''If Type=0 (Chezy), ensure Coef is 40-70, NOT 0.01-0.05'',
    ''If Type=1 (Manning), ensure Coef is 0.01-0.05, NOT 40-70'']; run_delft3d preflight check validat'
  severity: silent
- id: dt_008
  symptom: Simulation is 60x too short or 60x too long. End time is wrong.
  diagnosis: 'Tunit mismatch — times interpreted in wrong unit (S vs M vs H); All time parameters in MDU
    (TStart, TStop, DtUser, output intervals) are in units of Tunit. If Tunit=M (minutes) and TStop=86400,
    the simulation runs for 86400 minutes = 60 days, not 86400 seconds = 1 day. Note: DtMax is ALWAYS
    in secon'
  remedy: 'Check Tunit and recalculate all time values consistently; [''Read Tunit: S=seconds, M=minutes,
    H=hours'', ''Calculate expected TStop: e.g., 30 days = 2592000 S = 43200 M = 720 H'', ''Verify DtUser
    and output intervals are also in Tunit'', ''Remember: DtMax is ALWAYS in seconds'']; run_delft3d preflight
    chec'
  severity: silent
- id: dt_009
  symptom: Grid cell areas are wrong by orders of magnitude. Volume computations nonsensical.
  diagnosis: Geographic coordinates (degrees) used without proper projection; If the grid uses lat/lon
    in degrees without a proper geographic CRS definition, Delft3D may compute cell areas as degree² instead
    of m². A cell of 0.01° × 0.01° should be ~1.1 km × 0.85 km (~0.94 km²), but without projection it's
    compu
  remedy: 'Use projected coordinates (UTM) or ensure CRS is correctly defined in _net.nc; [''Check grid
    coordinate ranges: if < 360, likely degrees; if > 10000, likely meters'', "For geographic grids, ensure
    NetFile has proper ''projected_coordinate_system'' attribute", ''Alternatively, regenerate grid in
    UTM proje'
  severity: silent
- id: dt_010
  symptom: Water levels grow exponentially. Velocities reach 100+ m/s. Model crashes with 'divergence'
    message.
  diagnosis: CFL violation — timestep too large for grid resolution and water depth; The Courant-Friedrichs-Lewy
    condition requires CFL = c*dt/dx < 1, where c = sqrt(g*h) is the wave speed. Deep water (h=1000m →
    c=99 m/s) with fine grid (dx=100m) requires dt < 1s. If DtMax is too large, the numerical scheme beco
  remedy: 'Reduce DtMax or coarsen the grid; [''Calculate required DtMax: dt < CFLMax * dx_min / sqrt(g
    * h_max)'', ''For dx=100m, h=50m: dt < 0.7 * 100 / sqrt(9.81*50) = 3.2 seconds'', ''Set DtMax to this
    value or smaller'', ''Or increase CFLMax cautiously (never above 1.0)'']; run_delft3d preflight estimates
    CFL and'
  severity: crash
- id: dt_011
  symptom: Output files are empty or contain only 1-2 timesteps. Simulation appears to finish instantly.
  diagnosis: 'Output interval larger than simulation duration; If MapInterval = 86400 (seconds) but TStop-TStart
    = 3600 (1 hour), no map output is written because the first output time hasn''t been reached. Similarly,
    if output intervals are in Tunit and Tunit is misunderstood.

    ; [''MDU_output'', ''MapInterval'', ''His'
  remedy: Set MapInterval and HisInterval smaller than simulation duration; ['Verify output interval units
    match Tunit', 'Ensure interval << simulation duration (e.g., interval = duration/100)']; run_delft3d
    checks output interval vs simulation duration
  severity: silent
- id: dt_012
  symptom: Model crashes immediately with file not found error. References to missing .ext, .bc, .pli,
    or grid file.
  diagnosis: 'Input file path mismatch — file referenced in MDU/MDF does not exist; The MDU file references
    other files by relative path (relative to MDU location). If files are moved or paths are wrong, the
    model crashes at startup. Common causes: wrong working directory, path separator mismatch (Windows/Linux),'
  remedy: Verify all file paths in MDU are correct and files exist; ['Read MDU/MDF and list all file references',
    'Check each file exists relative to the MDU/MDF directory', 'Pay attention to case sensitivity on
    Linux']; run_delft3d preflight validates all file references
  severity: crash
- id: dt_013
  symptom: Model runs but no output files are created. Output directory remains empty.
  diagnosis: Output directory does not exist — D-Flow FM does not create it automatically; The MDU parameter
    OutputDir specifies where output files are written. D-Flow FM does NOT create this directory if it
    doesn't exist. The simulation runs normally but silently skips all output writing. This is particularly
    f
  remedy: 'Create the output directory before running: mkdir -p dflowfm/output; [''Read OutputDir from
    MDU file'', ''Create the directory: mkdir -p <workingDir>/<OutputDir>'']; run_delft3d preflight creates
    output directory if missing'
  severity: silent
- id: dt_014
  symptom: Tidal high/low water timing is shifted by hours compared to observations.
  diagnosis: Tidal phase reference time mismatch — phases computed for different epoch than RefDate; Harmonic
    tidal phases are relative to a reference time (epoch). FES2014 uses a specific epoch; TPXO uses another.
    Delft3D applies phases relative to the simulation RefDate. If the phase extraction epoch differs f
  remedy: 'Convert phases to simulation RefDate epoch or use time-series boundaries; [''Identify the epoch
    used by tide model (FES2014, TPXO)'', ''Compute phase shift: dPhase = 360 * (RefDate - epoch) / constituent_period'',
    "Add dPhase to each constituent''s phase", ''Or use observed time-series boundaries instead '
  severity: silent
- id: dt_015
  symptom: Salinity is much higher than expected near river mouth. Freshwater inflow appears salty.
  diagnosis: River discharge boundary missing salinity specification — defaults to ocean salinity; When
    a discharge boundary condition is set without explicit salinity, Delft3D may use the initial salinity
    field value or a default. If the domain is initialized with ocean salinity (35 PSU), the river inflow
    effec
  remedy: Add salinity=0 (and temperature) specification to river discharge boundary; ["Add 'Quantity
    = salinitybnd' with 'Unit = PSU' and value 0.0 to river .bc file", 'Optionally add temperature for
    the river inflow']; convert_boundary_conditions sets river salinity to 0 by default
  severity: silent
- id: dt_016
  symptom: Observation points output (_his.nc) is empty or has no stations. No time series available.
  diagnosis: Observation point coordinates in wrong CRS — all points outside domain; Observation points
    (.xyn file) must use the same coordinate reference system as the grid. If the grid is in UTM (meters,
    e.g., x=500000, y=5700000) but .xyn has geographic coordinates (e.g., x=5.0, y=52.0), all points are
    interp
  remedy: 'Convert observation coordinates to same CRS as grid; [''Check grid coordinate range: ncdump
    -v NetNode_x grid.nc | head'', ''Check .xyn coordinate range: head observation_points.xyn'', ''If
    ranges differ by orders of magnitude, CRS is mismatched'', ''Convert using pyproj: transformer.transform(lon,
    lat) → '
  severity: silent
