# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: ForeFire
  language: c++
  implementation:
    id: forefire
    version: v1.0 (HydroCraft KI binding; package wildfire-forefire 1.0.0)
    provenance: C++; CNRS / Universite de Corse (SPE Lab) ForeFire engine (libforefireL) with forefire
      CLI / .ff interpreter and pyforefire Python bindings.
  scientific_reference_version: ForeFire wildland-fire front-tracking engine with Rothermel (1972) and
    Balbi physical rate-of-spread models (Filippi/Balbi, Univ. de Corse / CNRS)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/ForeFire/source/repo/bin/forefire
    type: work_dir
pipeline:
  stages:
  - s1_landscape_data
  - s2_fuel_parameters
  - s3_simulation_scripting
  - s4_execution
  - s5_output_parsing
tools:
  count: 6
  files:
  - tools/convert_fuel_params.py
  - tools/convert_landscape_to_nc.py
  - tools/parse_forefire_output.py
  - tools/prepare_fire_case.py
  - tools/run_forefire.py
  - tools/validate_spread.py
inputs:
  forcing:
  - name: wind field (windU eastward, windV northward)
    unit: m/s
  - name: fuel moisture (dead Md / live Ml, optional moisture layer)
    unit: fraction
  - name: air temperature
    unit: K
  parameters:
  - name: digital elevation model (altitude)
    unit: m
  - name: fuel type map (fuel index)
    unit: integer index
  - name: fuel combustion parameters (Rothermel/Balbi SI set)
    unit: mixed SI (kg/m3, 1/m, m, kg/m2, J/kg, K)
  - name: fuel combustion parameters (RothermelAndrews2018 Imperial set)
    unit: imperial (tons/acre, ft, 1/ft, lb/ft3, BTU/lb, %)
  initial_conditions:
  - name: ignition points / initial fire front
    unit: UTM m (or lon/lat degrees), time s
  - name: loaded landscape state / domain extent
    unit: UTM m
  boundary_conditions:
  - name: propagationModel
    unit: categorical
  - name: spatialIncrement
    unit: m
  - name: perimeterResolution
    unit: m
  - name: relax (front smoothing / ROS relaxation factor)
    unit: dimensionless
  - name: windReductionFactor
    unit: dimensionless (0-1)
  - name: propagationSpeedAdjustmentFactor
    unit: dimensionless
  - name: minSpeed / minimalPropagativeFrontDepth
    unit: m/s, m
  - name: time advancement command
    unit: s
  - name: dumpMode / output format
    unit: categorical
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - arrival_time_of_front
  - fire_front_perimeter
  - burned_area
  - rate_of_spread
  - fire_line_intensity
  other: []
validation:
  tier: validated
  tier_justification: 'measured: R=0.063, 2 scorecard(s)'
  metrics:
    best_r: 0.063
summary:
  total_tools: 6
  total_stage_docs: 5
  total_diagnostic_triplets: 24
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
