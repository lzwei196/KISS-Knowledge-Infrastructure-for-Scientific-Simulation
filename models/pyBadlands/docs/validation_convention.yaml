validation:
  - dag_variable: elevation
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched pyBadlands/Badlands paper gives a numeric CSI threshold for gridded or TIN elevation-pattern validation."
        cites: []
      - metric: rmse
        direction: minimize
        unit: m
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "Bayeslands-style validation reports elevation RMSE, but the acceptable value is scale-, relief-, duration-, and observation-error-dependent."
        cites: []
    secondary_metrics:
      - metric: likelihood
        direction: maximize
        status: supportive
        ceiling_reason: "Bayesian Badlands studies use likelihood/posterior comparison against present-day topography; this supports calibration but is not a fixed validation band."
        cites: [bayeslands2019, ptbayeslands2019, surrogate2020]
      - metric: lod95
        direction: minimize
        status: supportive
        ceiling_reason: "Topographic-change studies filter differences through observation uncertainty; this is an observation-side limit, not a universal model-skill threshold."
        cites: [james2017]
    validated_when: "UNRESOLVED - require spatial agreement and low elevation RMSE against independent topography, with residuals interpreted relative to observation uncertainty; no fetched paper supplies a numeric CSI/RMSE pass band."
    evidence_strength: moderate
    confidence: 0.4
    notes: >-
      The dag determining_metric csi is retained, but cached Badlands validation papers use RMSE and likelihood rather than CSI. Bayeslands states that RMSE is used for predicted topography and sediment erosion/deposition; reported RMSE values are benchmark outcomes, not transferable pass/fail bands. James 2017 gives an observation convention: LoD95 is calculated from survey precision. Temme 2017 defines independent validation as comparing model outputs with data not used in calibration.

  - dag_variable: cumdiff
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper provides a numeric CSI threshold for erosion/deposition thickness maps from pyBadlands."
        cites: []
      - metric: rmse
        direction: minimize
        unit: m
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "Use RMSE or signed residuals against matched-time erosion/deposition observations, but no universal meter-scale band is cited."
        cites: []
    secondary_metrics:
      - metric: lod95
        direction: minimize
        status: supportive
        ceiling_reason: "Observed topographic change should be interpreted with a 95 percent level-of-detection or comparable uncertainty model before judging erosion/deposition residuals."
        cites: [james2017]
      - metric: likelihood
        direction: maximize
        status: supportive
        ceiling_reason: "Bayeslands incorporates successive erosion/deposition values in the likelihood; useful for inversion, not a numeric validation threshold."
        cites: [bayeslands2019, ptbayeslands2019, surrogate2020]
    validated_when: "UNRESOLVED - spatial erosion/deposition maps should match independent DoD, denudation, or sediment-thickness evidence over the same time window, with differences judged relative to observation uncertainty; no fetched numeric CSI/RMSE threshold exists."
    evidence_strength: moderate
    confidence: 0.4
    notes: >-
      The dag determining_metric csi is retained. Bayeslands explicitly evaluates final topography plus selected erosion/deposition through RMSE; PT-Bayeslands repeats the same RMSEelev/RMSEsed convention. James 2017 supports confidence-bounded topographic-change detection, so sub-LoD residuals should not trigger KI fixes.

  - dag_variable: cumdiff
    obs_shape: regional_aggregate_snapshot
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched source-to-sink or Badlands paper gives a numeric PBIAS tier for basin-integrated denudation, sediment volume, or sediment yield inferred from cumdiff."
        cites: []
      - metric: relative_volume_error
        direction: zero_centered
        unit: percent
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "Regional sediment-volume comparison is expected, but the acceptable percent error depends on dating, density, compaction, and sediment-budget uncertainty."
        cites: []
    secondary_metrics:
      - metric: sediment_flux_error
        direction: zero_centered
        status: supportive
        ceiling_reason: "pyBadlands source-to-sink applications compare modelled sediment accumulation and flux patterns with field and subsurface evidence, but without a universal percent-error band."
        cites: [pybadlands2018]
    validated_when: "UNRESOLVED - basin-integrated cumdiff should reproduce independent denudation/sediment-volume/sediment-yield estimates after density and time-window conversion; no fetched numeric PBIAS band exists."
    evidence_strength: weak
    confidence: 0.35
    notes: >-
      The dag determining_metric pbias is retained. pyBadlands 2018 compares predicted sediment accumulation with seismic/core/backscatter evidence and estimates sediment implications, but does not provide a transferable regional PBIAS tier. Hydrologic NSE/PBIAS discharge tiers are not appropriate because cumdiff is an integrated erosion/deposition thickness, not a gauged hydrograph.

  - dag_variable: stratigraphy
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched stratigraphic-forward-model paper provides a numeric CSI threshold for accepting interpreted layer architecture."
        cites: []
      - metric: rmse
        direction: minimize
        unit: m
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "Layer-thickness RMSE should be judged against well/seismic interpretation uncertainty; the fetched paper gives example measurement errors, not a universal pass band."
        cites: []
    secondary_metrics:
      - metric: objective_function
        direction: minimize
        status: supportive
        ceiling_reason: "Stratigraphic inverse modeling minimizes a normalized objective function across output variables such as sediment thickness and facies fraction."
        cites: [porta2021]
      - metric: facies_fraction_error
        direction: zero_centered
        status: supportive
        ceiling_reason: "Available stratigraphic calibration data include wellbore thickness/sediment distributions and seismic-derived layer geometry; facies agreement is informative but not a numeric pyBadlands pass tier."
        cites: [porta2021]
    validated_when: "UNRESOLVED - stratigraphy should reproduce interpreted layer thickness, facies distribution, and architecture from wells/seismic or mapped sections within observation/interpretation uncertainty; no fetched numeric CSI/RMSE threshold exists."
    evidence_strength: moderate
    confidence: 0.4
    notes: >-
      The dag determining_metric csi is retained. pyBadlands 2018 shows stratigraphic cross-sections and reports agreement with subsurface/backscatter evidence. Porta 2021 states stratigraphic validation is a key limitation and frames calibration against thickness, sediment fraction, and seismic architecture, with convergence tied to measurement-error variance rather than a fixed field-wide band.

  - dag_variable: discharge
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched Badlands paper gives a numeric CSI threshold for the spatial drainage/discharge proxy."
        cites: []
      - metric: drainage_area_rms
        direction: minimize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "Flow-routing benchmarks use RMS or spatial drainage-area differences, but do not provide a universal acceptable threshold for pyBadlands discharge snapshots."
        cites: []
    secondary_metrics:
      - metric: csi
        direction: maximize
        status: structurally_limited
        ceiling_reason: "The pyBadlands discharge field is a single-flow-direction drainage-structure proxy, not a gauged hydrograph. Flow-routing choice controls drainage area and channel geometry; SFD routing can collapse channels to single-thread features depending on DEM resolution."
        cites: [pybadlands2018, shelef2013]
      - metric: nse
        direction: maximize
        status: structurally_limited
        ceiling_reason: "NSE-style hydrograph validation is structurally inappropriate for this spatial snapshot because the output is accumulated routed volume per node rather than a time series of observed streamflow."
        cites: [pybadlands2018, shelef2013]
    validated_when: "UNRESOLVED - compare only as spatial drainage-network/flow-accumulation structure after matching grid, routing convention, and drainage mask; do not apply hydrograph NSE/PBIAS tiers to this output."
    evidence_strength: weak
    confidence: 0.35
    notes: >-
      The dag determining_metric csi is retained. pyBadlands describes discharge as part of width/incision and routed surface-process calculations, while Shelef and Hilley show that flow-routing rules determine drainage area and can strongly alter channel-network geometry. This supports a structural ceiling for hydrograph-style metrics, but supplies no numeric CSI pass band.

