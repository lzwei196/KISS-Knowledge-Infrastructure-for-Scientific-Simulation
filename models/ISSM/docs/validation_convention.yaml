validation:
  - dag_variable: "Vel (and Vx, Vy, Vz)"
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: rmse
        direction: minimize
        unit: m/yr
        bands: {very_good: 50.0, good: 94.5, satisfactory: 308.0}
        pass_band: satisfactory
        band_note: "initMIP-Antarctica reports surface-speed RMSE 47.5-94.5 m/yr for velocity-assimilating models and 116-308 m/yr otherwise; Larour 2012 reports intrinsic model differences on average less than 50 m/yr."
        cites: [seroussi2019_initmip_antarctica, larour2012_issm]
    secondary_metrics:
      - metric: csi
        direction: maximize
        status: supportive
        ceiling_reason: "The dag determining metric is csi, but fetched ice-sheet benchmarks judge continuous velocity fields with RMSE/RMSD or velocity-misfit cost functions, not categorical overlap."
        cites: [seroussi2019_initmip_antarctica, goelzer2018_initmip_greenland, larour2012_issm]
      - metric: log_rmse
        direction: minimize
        status: supportive
        ceiling_reason: "initMIP-Antarctica also reports log-speed RMSE 0.62-1.51 because raw speed RMSE is dominated by fast ice streams."
        cites: [seroussi2019_initmip_antarctica]
    validated_when: "Modeled surface velocity magnitude/components are compared to observed surface velocity fields and RMSE <= 308 m/yr, with <= 94.5 m/yr indicating the assimilated-velocity benchmark range."
    evidence_strength: strong
    confidence: 0.78
    notes: "The field convention supersedes spatial csi for this continuous field: initMIP figures are explicitly 'Root mean square error (RMSE)' against observed surface velocity."

  - dag_variable: "Vel (and Vx, Vy, Vz)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched ISSM/ISMIP paper gives an NSE threshold for point or fluxgate velocity time series."
        cites: []
      - metric: rmse
        direction: minimize
        unit: m/yr
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Spatial snapshot RMSE benchmarks should not be reused as a time-series validation threshold without a fetched temporal-velocity study."
        cites: []
    secondary_metrics:
      - metric: velocity_misfit_cost
        direction: minimize
        status: supportive
        ceiling_reason: "ISSM inversions minimize cost functions measuring modeled-observed horizontal surface-velocity misfit."
        cites: [larour2012_issm]
    validated_when: "UNRESOLVED - retain dag nse as the requested time-series metric, but no cited numeric time-series threshold was fetched."
    evidence_strength: weak
    confidence: 0.30
    notes: "Goldberg 2013 demonstrates time-dependent inverse use of velocity/surface data, but not a field threshold for velocity NSE."

  - dag_variable: Thickness
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: rmse
        direction: minimize
        unit: m
        bands: {very_good: 304.0, good: 350.0, satisfactory: 422.3}
        pass_band: good
        band_note: "GRISLI validation retained a 'good representation' at RMSE lower than 350 m, with 12 best members <=304 m; initMIP-Antarctica reports observed-vs-modeled thickness RMSE 91.2-422.3 m."
        cites: [quiquet2018_grisli, seroussi2019_initmip_antarctica]
    secondary_metrics:
      - metric: csi
        direction: maximize
        status: supportive
        ceiling_reason: "The dag csi metric is not the convention for continuous ice-thickness fields; fetched benchmarks compute RMSE against radar/Bedmap thickness."
        cites: [quiquet2018_grisli, goelzer2018_initmip_greenland]
    validated_when: "Ice thickness spatial snapshots are validated primarily by RMSE against observed thickness; pass at RMSE <= 350 m, with <= 304 m matching the best calibrated GRISLI subset."
    evidence_strength: strong
    confidence: 0.82
    notes: "Quiquet 2018 states the metric 'puts a strong constraint on ice sheet geometry' and avoids compensatory volume bias."

  - dag_variable: Thickness
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives an NSE threshold for local ice-thickness time series."
        cites: []
      - metric: rmse
        direction: minimize
        unit: m
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Snapshot thickness RMSE bands are not automatically valid for transient point thickness without a fetched time-series convention."
        cites: []
    secondary_metrics:
      - metric: model_drift
        direction: minimize
        status: supportive
        ceiling_reason: "initMIP-Greenland treats forward control-run drift as complementary to observed-geometry match."
        cites: [goelzer2018_initmip_greenland]
    validated_when: "UNRESOLVED - compare point thickness time series when available, but no fetched NSE/RMSE pass band exists."
    evidence_strength: weak
    confidence: 0.30
    notes: "Goelzer 2018 notes that mass trend and observed-geometry match are complementary measures, not a local NSE gate."

