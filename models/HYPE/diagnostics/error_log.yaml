- id: err_001
  timestamp: '2026-03-24T11:57:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s7_execution
  failure_domain: parameter_format
  symptom:
    description: HYPE requires trailing slash on directory argument. Without it, Fortran string concat produces 'dirinfo.txt'
      instead of 'dir/info.txt'. No error message — just file not found.
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: 'Fortran string concatenation: trim(dir)//filename. If dir=''mydir'' not ''mydir/'', result is ''mydirinfo.txt''.'
    explanation: ''
    affected_components: []
  resolution:
    action: Always append '/' to directory paths when calling HYPE.
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: true
  promoted_as: 'dt_r01'
- id: err_002
  timestamp: '2026-03-24T11:57:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s4_geodata_generation
  failure_domain: silent_output
  symptom:
    description: SLC fractions in GeoData.txt not summing to 1.0 produces wrong water balance — no warning from HYPE.
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: HYPE reads SLC fractions and uses them directly for area-weighted calculations. If they sum to 0.8 instead
      of 1.0, 20% of precipitation is lost silently.
    explanation: ''
    affected_components: []
  resolution:
    action: Validate SLC fractions sum to 1.0 ± 0.01 using validate_geodata.py before running.
    files_changed: []
    prevention: ''
  severity: silent
  promoted: true
  promoted_as: 'dt_s01'
