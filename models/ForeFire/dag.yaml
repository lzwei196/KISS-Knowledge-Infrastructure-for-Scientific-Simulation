template_version: "3.5"

identity:
  model_id: "ForeFire"
  scientific_reference_version: "ForeFire wildland-fire front-tracking engine with Rothermel (1972) and Balbi physical rate-of-spread models (Filippi/Balbi, Univ. de Corse / CNRS)"
  implementation:
    id: "forefire"
    version: "v1.0 (HydroCraft KI binding; package wildfire-forefire 1.0.0)"
    provenance: "C++; CNRS / Universite de Corse (SPE Lab) ForeFire engine (libforefireL) with forefire CLI / .ff interpreter and pyforefire Python bindings."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL-3.0"
  repo_url: "https://github.com/forefireAPI/firefront"

boundary:
  scope_in:
    - "Wildland fire front propagation / fire spread over complex terrain"
    - "Rate-of-spread modeling (Rothermel, Balbi, RothermelAndrews2018, Farsite, Isotropic)"
    - "Fire perimeter geometry and per-cell arrival-time (burning) map computation"
    - "Optional two-way coupled fire-atmosphere simulation (e.g. MesoNH)"
  scope_out:
    - "Atmospheric dynamics itself (handled by an external coupled model such as MesoNH)"
    - "Long-term ecosystem / fuel-regrowth dynamics (single fire-event simulator)"
    - "Sub-surface or deep 3-D processes (effectively a 2-D surface-fire model, DIMZ=1)"
  spatial: "2-D grid"
  temporal: "event"
  closure: "none"
  notes: "Lagrangian front-tracking on a 2-D structured NetCDF landscape grid in projected (UTM) coordinates; the fire front is a linked list of FireNode markers advanced by a local rate-of-spread model, while an Eulerian per-cell arrival-time matrix records front passage. Time is event-driven via a prioritized TimeTable (no fixed global timestep); simulation time is seconds from domain start. The engine tracks a propagating front rather than closing a mass or energy budget; heat/vapor/scalar flux fields are produced only when flux models are active for atmosphere coupling."

inputs:
  forcing:
    - category: "atmospheric"
      name: "wind field (windU eastward, windV northward)"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "NetCDF landscape layers windU/windV (DIMT,DIMZ,DIMY,DIMX), or trigger[wind;vel=(u,v,w)] constant/time-varying in the .ff script"
      notes: "Primary driver of wind-driven spread; enters the ROS wind factor. Must be m/s; time-varying wind triggers use absolute time from domain start."
    - category: "atmospheric"
      name: "fuel moisture (dead Md / live Ml, optional moisture layer)"
      unit: "fraction"
      source_kind: "forcing"
      model_input_format: "Optional NetCDF moisture layer and/or Md/Ml columns in the fuels table"
      notes: "Raises ignition energy and lowers ROS; spread stops above the moisture of extinction."
    - category: "atmospheric"
      name: "air temperature"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "Optional NetCDF temperature layer; ambient Ta also a fuels-table column"
      notes: "Used in the Balbi ignition-energy balance; Kelvin required (Celsius gives negative ignition energy)."
  parameters:
    - category: "topography"
      name: "digital elevation model (altitude)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "altitude variable in landscape NetCDF (DIMT,DIMZ,DIMY,DIMX); from SRTM/Copernicus DEM/LiDAR GeoTIFF reprojected to UTM"
      notes: "Topography; internal slope (and aspect) are derived from altitude and drive slope-driven spread. A flat layer yields slope factor = 0."
    - category: "land_surface"
      name: "fuel type map (fuel index)"
      unit: "integer index"
      source_kind: "dataset_lookup"
      model_input_format: "fuel variable in landscape NetCDF (integer raster); each index selects a row in the fuels table"
      notes: "Index 0 should be non-burnable (e=0). Max index in the raster must be < number of fuel rows or an out-of-bounds read occurs."
    - category: "fuel_properties"
      name: "fuel combustion parameters (Rothermel/Balbi SI set)"
      unit: "mixed SI (kg/m3, 1/m, m, kg/m2, J/kg, K)"
      source_kind: "calibrated"
      model_input_format: "Semicolon-delimited fuels table, one row per fuel index: Rhod, Rhol, Md, Ml, sd, sl, e, Sigmad, Sigmal, stoch, RhoA, Ta, Tau0, Deltah, DeltaH, Cp, Cpa, Ti, X0, r00, Blai, me"
      notes: "Rothermel/Balbi require SI in the CSV and convert internally to Imperial; do NOT pre-convert. me is a fraction here. Applies to Rothermel and Balbi propagation models."
    - category: "fuel_properties"
      name: "fuel combustion parameters (RothermelAndrews2018 Imperial set)"
      unit: "imperial (tons/acre, ft, 1/ft, lb/ft3, BTU/lb, %)"
      source_kind: "calibrated"
      model_input_format: "Semicolon-delimited fuels table: fl1h_tac, fd_ft, SAVcar_ftinv, mdOnDry1h_r, fuelDens_lbft3, H_BTUlb, Dme_pc, totMineral_r, effectMineral_r"
      notes: "RothermelAndrews2018 consumes Imperial fuel parameters directly (no internal conversion of fuel params). Dme_pc is a percentage. Applies to the RothermelAndrews2018 model only."
  initial_conditions:
    - category: "fire_state"
      name: "ignition points / initial fire front"
      unit: "UTM m (or lon/lat degrees), time s"
      source_kind: "user_provided"
      model_input_format: "startFire[loc=(x,y,z);t=T] in UTM, startFire[lonlat=(lon,lat,z);t=T] in degrees, or an explicit FireFront/FireNode node hierarchy"
      notes: "Seeds the initial front(s); multiple and delayed ignitions are supported. Must lie within the loaded domain bounds and on burnable fuel."
    - category: "landscape_state"
      name: "loaded landscape state / domain extent"
      unit: "UTM m"
      source_kind: "dataset_lookup"
      model_input_format: "loadData[data.nc;timestamp]; FireDomain[sw=(...);ne=(...)] or inferred from the NetCDF extent"
      notes: "Establishes the domain SW/NE corners and the t=0 landscape fields before ignition."
  boundary_conditions:
    - category: "model_selection"
      name: "propagationModel"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "setParameter[propagationModel=Rothermel|Balbi2020|RothermelAndrews2018|Farsite|Iso]"
      notes: "Selects the rate-of-spread model; MUST match the fuels-table unit system. Engine default is Iso (isotropic), not Rothermel/Balbi — omitting it gives trivial constant spread."
    - category: "numerical_control"
      name: "spatialIncrement"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "setParameter[spatialIncrement=...]"
      notes: "Lagrangian space step used in dt = ds/speed; controls integration accuracy/CFL. Sub-1 m values over large domains create millions of nodes and can hang."
    - category: "numerical_control"
      name: "perimeterResolution"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "setParameter[perimeterResolution=...]"
      notes: "Target spacing between fire-front nodes (re-meshing resolution)."
    - category: "numerical_control"
      name: "relax (front smoothing / ROS relaxation factor)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "setParameter[relax=...]"
      notes: "Temporal relaxation of node speed: speed = (1-relax)*speed + relax*newSpeed."
    - category: "physical_control"
      name: "windReductionFactor"
      unit: "dimensionless (0-1)"
      source_kind: "user_provided"
      model_input_format: "setParameter[windReductionFactor=...]"
      notes: "Midflame wind reduction for canopy effects. When < 1.0 Rothermel also switches to the Andrews/Cruz/Rothermel (2013) wind-cap formula Uf=96.81*Ir^(1/3) - an undocumented coupling. Set 0 suppresses wind entirely."
    - category: "numerical_control"
      name: "propagationSpeedAdjustmentFactor"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "setParameter[propagationSpeedAdjustmentFactor=...]"
      notes: "Global multiplier on computed ROS."
    - category: "numerical_control"
      name: "minSpeed / minimalPropagativeFrontDepth"
      unit: "m/s, m"
      source_kind: "user_provided"
      model_input_format: "setParameter[minSpeed=...]; setParameter[minimalPropagativeFrontDepth=...]"
      notes: "Stop thresholds: minimum propagation speed and minimum front depth for continued propagation."
    - category: "simulation_control"
      name: "time advancement command"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "step[dt=seconds] or goTo[t=seconds] after startFire"
      notes: "Without a step/goTo the simulation stays at t=0 and produces no advancement."
    - category: "output_control"
      name: "dumpMode / output format"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "setParameter[dumpMode=ff|kml|geojson|json]"
      notes: "Selects serialization format for emitted fronts."

processes:
  modules:
    - name: "Command (.ff interpreter)"
      role: "driver"
      brief: "Parses ForeFire script commands (FireDomain, startFire, step, goTo, setParameter, loadData, print, save, trigger, include) and drives the run; mutates the global SimulationParameters store at runtime."
    - name: "FireDomain"
      role: "driver"
      brief: "Central orchestrator owning the FDCell grid, BurningMap, DataBroker and the registered propagation/flux models; dispatches getPropagationSpeed per node and manages front topology (merge/split, burning scan)."
    - name: "Simulator / TimeTable"
      role: "integrator"
      brief: "Event-driven simulation clock; pops the next scheduled ForeFireAtom (FireNode) update by time and advances it, realizing the asynchronous DEVS-style time stepping (no fixed global dt)."
    - name: "FireNode"
      role: "integrator"
      brief: "Lagrangian front marker; timeAdvance() obtains local ROS, relaxes speed (relax), sets dt = ds/speed, and predicts the next location along the slope-tilted outward normal."
    - name: "FireFront"
      role: "allocator"
      brief: "Ordered ring of FireNodes forming one fire contour; re-meshes to perimeterResolution and handles node insertion/removal, splitting and merging of contours."
    - name: "PropagationModel (base + registry)"
      role: "process_solver"
      brief: "Abstract ROS interface; getSpeedForNode pulls per-node properties (slope, normalWind, fuel.*) from DataBroker then calls getSpeed(). Concrete models self-register by name via a string-keyed factory."
    - name: "Rothermel"
      role: "process_solver"
      brief: "Rothermel (1972) surface-fire ROS; takes SI fuel props, converts internally to Imperial, applies wind reduction and the 2013 wind cap when windReductionFactor<1, returns ROS in m/s."
    - name: "Balbi2020"
      role: "process_solver"
      brief: "Balbi physics-based radiation/convection ROS (Univ. de Corse); flame angle/height/vertical velocity with an iterative solver (max 40 iterations, tol 0.01 m/s); requires temperature and moisture inputs."
    - name: "RothermelAndrews2018"
      role: "process_solver"
      brief: "Updated Rothermel per Andrews 2018 (RMRS-GTR-371) using NFFL/FBFM-style fuel parameters directly in Imperial units (no internal fuel-param conversion)."
    - name: "Farsite"
      role: "optional_module"
      brief: "FARSITE-compatible propagation using standard NFFL fuel models with moisture classes (1-hr, 10-hr, 100-hr, live herbaceous, live woody)."
    - name: "Isotropic (Iso)"
      role: "optional_module"
      brief: "Constant speed in all directions; the engine default propagation model, intended for testing rather than physical spread."
    - name: "DataBroker"
      role: "allocator"
      brief: "Loads the landscape NetCDF and fuels table, builds altitude/slope/wind/fuel/flux DataLayers, and fills each model's properties[] buffer through the registered-property index contract."
    - name: "DataLayers (NCXYZT / Fuel / Flux / Gradient)"
      role: "allocator"
      brief: "Spatio-temporal field accessors sampling altitude, derived slope, windU/windV, fuel index and flux fields at a node's location and time, interpolating the NetCDF inputs."
    - name: "BurningMap"
      role: "integrator"
      brief: "Eulerian per-cell arrival-time matrix updated as front nodes pass; the source of the arrival-time NetCDF output and the burned-area raster."
    - name: "FluxModel family (Heat / Vapor / Scalar)"
      role: "optional_module"
      brief: "Computes surface heat, water-vapor and chemistry/emission fluxes from burning cells (burningDuration, nominalHeatFlux) for atmosphere coupling."
      applicability: "fire-atmosphere coupling (e.g. MesoNH) only"
    - name: "StringRepresentation"
      role: "process_solver"
      brief: "Serializes fronts/nodes to .ff text, KML, GeoJSON and NetCDF; produces the model's external perimeter and state outputs."
  internal_edges:
    - from: "Command (.ff interpreter)"
      to: "FireDomain"
      kind: "invokes"
      brief: "FireDomain / startFire / step / goTo commands construct and drive the domain."
    - from: "Command (.ff interpreter)"
      to: "Inputs"
      kind: "consumes_input"
      brief: "loadData reads the landscape NetCDF; setParameter ingests propagation/numerical controls."
    - from: "FireDomain"
      to: "Simulator / TimeTable"
      kind: "invokes"
      brief: "Domain schedules atom updates through the event-driven simulator clock."
    - from: "Simulator / TimeTable"
      to: "FireNode"
      kind: "invokes"
      brief: "TimeTable pops and calls FireNode::timeAdvance() / update() at the scheduled time."
    - from: "FireNode"
      to: "FireDomain"
      kind: "invokes"
      brief: "timeAdvance calls domain->getPropagationSpeed(node)."
    - from: "FireDomain"
      to: "PropagationModel (base + registry)"
      kind: "invokes"
      brief: "getPropagationSpeed dispatches to the propagation model bound to the cell's fuel index."
    - from: "PropagationModel (base + registry)"
      to: "DataBroker"
      kind: "invokes"
      brief: "getSpeedForNode calls getPropagationData to fill the properties[] buffer before getSpeed()."
    - from: "DataBroker"
      to: "DataLayers (NCXYZT / Fuel / Flux / Gradient)"
      kind: "reads_state"
      brief: "Samples altitude/slope/wind/fuel layers at the node's location and time."
    - from: "DataLayers (NCXYZT / Fuel / Flux / Gradient)"
      to: "Inputs"
      kind: "consumes_input"
      brief: "Layers are built from the landscape NetCDF and fuels table."
    - from: "DataBroker"
      to: "PropagationModel (base + registry)"
      kind: "writes_state"
      brief: "Fills model->properties[] (slope, normalWind, fuel.*) per the registered index order."
    - from: "Rothermel"
      to: "FireNode"
      kind: "produces_output"
      brief: "getSpeed returns ROS (m/s) assigned to the node speed."
    - from: "Balbi2020"
      to: "FireNode"
      kind: "produces_output"
      brief: "getSpeed returns ROS (m/s) for the node via the iterative physical solver."
    - from: "RothermelAndrews2018"
      to: "FireNode"
      kind: "produces_output"
      brief: "getSpeed returns ROS (m/s) assigned to the node speed (Imperial fuel-param path)."
    - from: "FireNode"
      to: "FireNode"
      kind: "writes_state"
      brief: "Speed relaxed: speed=(1-relax)*speed+relax*newSpeed; velocity = speed * normal."
    - from: "FireNode"
      to: "DataLayers (NCXYZT / Fuel / Flux / Gradient)"
      kind: "reads_state"
      brief: "setLoc reads the altitude layer for Z; computeNormal reads the derived slope layer to tilt the normal."
    - from: "FireNode"
      to: "BurningMap"
      kind: "writes_state"
      brief: "update() triggers firenodeBurningScan, writing arrival time into the Eulerian matrix as a side effect of advancing."
    - from: "FireNode"
      to: "FireDomain"
      kind: "invokes"
      brief: "update() triggers checkTopology (merge/split)."
    - from: "FireDomain"
      to: "FireFront"
      kind: "invokes"
      brief: "Merge/split/remesh operations on fronts and their nodes."
    - from: "FireFront"
      to: "FireNode"
      kind: "writes_state"
      brief: "Inserts/removes nodes to keep spacing near perimeterResolution."
    - from: "FireDomain"
      to: "FluxModel family (Heat / Vapor / Scalar)"
      kind: "invokes"
      brief: "computeActiveSurfacesFlux calls the flux models over burning cells when coupling is active."
    - from: "FluxModel family (Heat / Vapor / Scalar)"
      to: "Atmosphere"
      kind: "produces_output"
      brief: "Flux layers accumulate heat/vapor/scalar fields exported to the coupled atmospheric model."
    - from: "BurningMap"
      to: "StringRepresentation"
      kind: "invokes"
      brief: "Arrival-time matrix passed to serialization for NetCDF and burned-area output."
    - from: "FireFront"
      to: "StringRepresentation"
      kind: "invokes"
      brief: "Front node rings passed to serialization for .ff/KML/GeoJSON perimeters."
    - from: "StringRepresentation"
      to: "Outputs"
      kind: "produces_output"
      brief: "Writes arrival-time NetCDF, fire-front perimeters and the .ff reload state."

states:
  variables:
    - name: "FireNode.location"
      unit: "UTM m"
      role: "prognostic"
    - name: "FireNode.velocity"
      unit: "m/s"
      role: "prognostic"
    - name: "FireNode.speed (rate of spread)"
      unit: "m/s"
      role: "prognostic"
    - name: "FireNode.normal"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "FireNode.frontDepth"
      unit: "m"
      role: "diagnostic"
    - name: "FireNode.curvature"
      unit: "1/m"
      role: "diagnostic"
    - name: "FireNode.currentState"
      unit: "enum (init/moving/merging/splitting/final/link)"
      role: "diagnostic"
    - name: "FireFront (linked ring of FireNodes)"
      unit: "n/a"
      role: "prognostic"
    - name: "BurningMap arrival-time field"
      unit: "s"
      role: "accumulator"
    - name: "TimeTable (event queue / simulation clock)"
      unit: "s"
      role: "prognostic"
    - name: "FluxLayer fields (heat / vapor / scalar)"
      unit: "W/m2, kg/m2/s, varies"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "arrival_time_of_front"
    validation_rank: 2
    unit: "s (seconds from domain start; 0 = never burned)"
    description: "Per-cell Eulerian time the fire front reached each grid cell (the burning / arrival-time map)."
    emitted_in: "ForeFire.0.nc (NetCDF), via save[]"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Compared against a final fire-extent/perimeter map: threshold arrival_time>0 to a burned/unburned mask, then score overlap (Sorensen coefficient, hit/false-alarm)."
            - "CRS and grid alignment (UTM) must match the observation; reprojection errors masquerade as spatial bias."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "timing_accuracy"
          determining_metric: "csi"
          caveats:
            - "When isochrones / multi-time perimeters are observed, compare arrival-time contours; isochrone timing is sensitive to ignition time and wind timing."
      detrending_options:
        - "none"
  - var: "fire_front_perimeter"
    validation_rank: 3
    unit: "UTM m (polygon geometry)"
    description: "Fire-front polygon geometry per timestep (final or intermediate perimeters)."
    emitted_in: "GeoJSON / KML via print[...], dumpMode geojson|kml"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Against an observed final perimeter: Sorensen coefficient SC=2|A∩B|/(|A|+|B|) (>0.6 good), over/under-estimation ratios, Hausdorff distance between boundaries."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "timing_accuracy"
          determining_metric: "csi"
          caveats:
            - "Against time-stamped observed perimeters/isochrones; timing accuracy depends on correct ignition time and time-varying wind."
      detrending_options:
        - "none"
  - var: "burned_area"
    validation_rank: 1
    unit: "ha"
    description: "Total wildfire-burned vegetation area derived from the arrival-time / perimeter at a given time."
    emitted_in: "post-processing of the burning map / perimeters"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Single-fire-event burned-area total compared to an observed final area; over/under-estimation ratios apply."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "When the observed extent is a mask rather than a scalar, compare the burned footprint spatially rather than just the area total."
      detrending_options:
        - "none"
  - var: "rate_of_spread"
    validation_rank: 4
    unit: "m/s"
    description: "Local fire-front rate of spread (node speed field)."
    emitted_in: "speed field in the NetCDF output path; per-node .ff records"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Against observed/experimental ROS at a location (e.g. instrumented burn plots); ROS is dominated by wind so wind-forcing error propagates directly."
      detrending_options:
        - "none"
  - var: "fire_line_intensity"
    validation_rank: 5
    unit: "kW/m"
    description: "Byram fire-line intensity = ROS × heat yield × fuel load."
    emitted_in: "post-processing of ROS, fuel load and heat of combustion"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Against estimated observed fireline intensity; inherits ROS and fuel-load uncertainty."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "wind speed (windU/windV)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations:
        - "balbi2009_physical_model_wildland_fires"
        - "filippi2011_mesonh_forefire_fireflux"
        - "rochoux2014_model_suited_data_assimilation"
    - from: "wind speed (windU/windV)"
      to: "burned_area"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations:
        - "trucchia2018_surrogate_global_sensitivity"
        - "filippi2011_mesonh_forefire_fireflux"
    - from: "wind direction"
      to: "burned_area"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations:
        - "trucchia2018_surrogate_global_sensitivity"
    - from: "slope (from DEM altitude)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations:
        - "balbi2009_physical_model_wildland_fires"
    - from: "fuel moisture content (Md/Ml)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations:
        - "balbi2009_physical_model_wildland_fires"
        - "filippi2014_evaluation_large_observation_database"
    - from: "fuel load (Sigmad/Sigmal)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "rochoux2014_model_suited_data_assimilation"
        - "balbi2009_physical_model_wildland_fires"
    - from: "fuel type / properties"
      to: "burned_area"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "filippi2014_evaluation_large_observation_database"
        - "filippi2011_mesonh_forefire_fireflux"
    - from: "fuel particle surface-area-to-volume ratio (sd/sl)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "balbi2009_physical_model_wildland_fires"
    - from: "front-depth (non-stationary front representation)"
      to: "burned_area"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      applicability: "always"
      citations:
        - "filippi2014_evaluation_large_observation_database"
    - from: "marker / front-tracking resolution (perimeterResolution, spatialIncrement)"
      to: "burned_area"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      applicability: "always"
      citations:
        - "filippi2009_discrete_event_front_tracking"
  _caveat: "No ForeFire-specific quantitative global sensitivity analysis (Sobol/Morris/EFAST) exists in the surveyed literature. The wind-speed→ROS, slope→ROS and front-depth→burned_area edges are mechanistically dominant in the Balbi physical ROS formulation but are cited only by qualitative dominance statements, so they are capped at MEDIUM. The single HIGH-grade evidence is the cross-family Sobol' GSA of Trucchia et al. 2018 (a stochastic-fireline spread model, not ForeFire's exact Balbi implementation), which reports wind speed/direction as the leading variance-based factors for burnt-area topology and size; those two edges (wind speed→burned_area, wind direction→burned_area) carry HIGH as cross-family proxy evidence."
  citation_index:
    balbi2009_physical_model_wildland_fires:
      short_citation: "Balbi et al. 2009"
      doi: "10.1016/j.combustflame.2009.07.010"
      note: "Physical (radiative+convective) wildland-fire ROS model — the core spread physics used by ForeFire; wind and slope increase heating, moisture/fuel structure modulate ignition energy."
    filippi2014_evaluation_large_observation_database:
      short_citation: "Filippi et al. 2014"
      doi: "10.5194/nhess-14-3077-2014"
      note: "Evaluation of Rothermel and Balbi (ForeFire) ROS models on ~80 observed fires; non-stationary front-depth formulation and fuel/front representation are key controls on simulated burnt area."
    filippi2009_discrete_event_front_tracking:
      short_citation: "Filippi et al. 2009 (SIMULATION)"
      doi: "10.1177/0037549709343117"
      note: "ForeFire discrete-event Lagrangian front-tracking solver; marker resolution and ROS sub-model parameters control simulated front position and burnt area."
    filippi2011_mesonh_forefire_fireflux:
      short_citation: "Filippi et al. 2011"
      doi: "10.1155/2011/540390"
      note: "MesoNH-ForeFire coupled fire-atmosphere simulation vs FireFlux; fire-induced wind feedback strongly drives ROS, with fuel type setting heat fluxes."
    rochoux2014_model_suited_data_assimilation:
      short_citation: "Rochoux et al. 2014"
      doi: "10.1007/s00024-014-0893-9"
      note: "Balbi-family ROS model for data assimilation; ROS uncertainty dominated by wind and fuel/biomass parameters."
    trucchia2018_surrogate_global_sensitivity:
      short_citation: "Trucchia et al. 2018"
      doi: "10.48550/arXiv.1809.05430"
      note: "gPC/GP surrogate global (Sobol') sensitivity analysis of a stochastic-fireline spread model; wind is the leading factor for burnt-area topology and size. Cross-family proxy — not ForeFire's exact Balbi implementation."

safety:
  hazards:
    - id: "wind_units_not_ms"
      kind: "weather_file_semantic"
      description: "Wind supplied in km/h, mph or knots instead of m/s; enters the ROS wind factor as a power law, so a several-fold wind error gives a large ROS error."
      severity: "silent"
    - id: "coords_lonlat_not_utm"
      kind: "weather_file_semantic"
      description: "Landscape coordinates in lon/lat degrees instead of projected UTM meters; the domain collapses to a microscopic extent and the fire fails to spread or falls outside bounds."
      severity: "silent"
    - id: "rothermel_balbi_fuel_imperial"
      kind: "coefficient_runtime_silent_fallback"
      description: "Fuels table given in Imperial units for Rothermel/Balbi, which expect SI and convert internally to Imperial; double conversion makes ROS orders of magnitude wrong."
      severity: "silent"
    - id: "andrews2018_fuel_si"
      kind: "coefficient_runtime_silent_fallback"
      description: "RothermelAndrews2018 fed SI fuel parameters when it expects Imperial directly (no fuel-param conversion); produces near-zero ROS for all fuels."
      severity: "silent"
    - id: "temperature_celsius_not_kelvin"
      kind: "weather_file_semantic"
      description: "Ambient/ignition temperature in Celsius instead of Kelvin; the Balbi ignition-energy balance can go negative and the fire will not spread."
      severity: "silent"
    - id: "moisture_of_extinction_convention"
      kind: "coefficient_runtime_silent_fallback"
      description: "Moisture of extinction given as percentage for Rothermel (expects fraction me 0.1-0.5) or as fraction for Andrews (expects Dme_pc percent); the extinction threshold is off by 100x so fire always or never spreads."
      severity: "silent"
    - id: "fuels_table_comma_delimiter"
      kind: "parser_semantic"
      description: "fuels table uses comma instead of the required semicolon delimiter; the parser reads an entire row as one field, producing garbage fuel coefficients or a segfault (dt_008)."
      severity: "fatal"
    - id: "fuel_index_out_of_range"
      kind: "soil_semantic"
      description: "A fuel index in the landscape raster exceeds the number of rows in the fuels table; the model reads beyond the fuel array (out-of-bounds), giving wrong fuel or a crash."
      severity: "fatal_or_silent"
    - id: "nonburnable_has_nonzero_depth"
      kind: "soil_semantic"
      description: "A non-burnable fuel type (water/road/urban) has non-zero fuel bed depth e, so non-burnable areas catch fire instead of stopping the front; conversely ignition on e=0 fuel gives ROS=0 everywhere."
      severity: "silent"
    - id: "ignition_outside_domain"
      kind: "initial_condition_semantic"
      description: "Ignition coordinates fall outside the loaded FireDomain bounds (often a UTM/lon-lat frame mismatch); no fire appears after startFire."
      severity: "silent"
    - id: "flat_altitude_zero_slope"
      kind: "initial_condition_semantic"
      description: "A constant (flat) altitude layer yields slope factor = 0, so only wind drives asymmetry and slope-driven spread is silently absent."
      severity: "degraded"
    - id: "default_isotropic_model"
      kind: "control_semantic"
      description: "Omitting setParameter[propagationModel=...] leaves the engine default 'Iso' (isotropic) active, yielding trivial constant spread rather than physical Rothermel/Balbi behavior."
      severity: "silent"
    - id: "missing_time_advance"
      kind: "control_semantic"
      description: "No step[dt=]/goTo[t=] after startFire leaves simulation time at t=0 with no front advancement and empty output."
      severity: "silent"
    - id: "balbi_nonconvergence_hang"
      kind: "numerical_instability"
      description: "Balbi iterative solver fails to converge (max 40 iterations, tol 0.01 m/s) under extreme fuel parameters, or sub-1 m spatialIncrement over a large domain spawns millions of nodes; the simulation hangs."
      severity: "degraded"
    - id: "wind_cap_switch_windreduction"
      kind: "control_semantic"
      description: "Setting windReductionFactor<1.0 silently switches Rothermel to the Andrews/Cruz/Rothermel (2013) wind-cap Uf=96.81*Ir^(1/3), clamping ROS in high winds; windReductionFactor=0 suppresses wind entirely. Additionally, a trigger[wind;...] scheduled at an absolute time past the simulation end never takes effect, so a planned wind change is silently ignored."
      severity: "degraded"
  validation_limits:
    - "Effectively a 2-D surface-fire model (NetCDF DIMZ=1); does not resolve vertical fire/plume structure except via external atmosphere coupling."
    - "Single fire-event simulator; no fuel-regrowth or long-term ecosystem dynamics."
    - "Operates only in projected (UTM) coordinates; geographic lon/lat domains are not natively supported."
    - "Rothermel/Balbi ROS validity assumes fuel/atmospheric parameters within physical ranges (e.g. altitude 0-9000 m, surface wind <80 m/s, Rhod 200-900 kg/m3, me 0.1-0.5); outside these the ROS formulation is uncalibrated."
  warnings:
    - "Two conflicting internal defaults exist for relax and minSpeed (FireNode static initializers relax=0.1, minSpeed=-1 vs the SimulationParameters table relax=0.5, minSpeed=0.005); the effective value depends on whether the parameter table is applied at domain setup."
    - "The engine default propagation model is Isotropic, not a physical ROS model — a physically meaningful run must explicitly set propagationModel."
    - "windReductionFactor couples to the wind-cap formula (a value <1.0 changes which wind-limit equation is used), an interaction not exposed in the user-facing parameter description."
  assumptions:
    - statement: "Model geometry is a 2-D surface-fire front on a structured UTM grid; vertical structure is not resolved (NetCDF DIMZ=1)."
      scope: "spatial representation"
      source: "ForeFire core-concepts and landscape-file documentation (forefire.readthedocs.io)"
      status: "adopted"
    - statement: "The engine tracks a propagating fire front and an Eulerian arrival-time field rather than closing a mass or energy budget; no conservation closure is asserted."
      scope: "closure"
      source: "ForeFire core-concepts (front representation + numerical method) documentation"
      status: "adopted"
    - statement: "Default propagation model is Isotropic; physical spread requires explicitly selecting Rothermel/Balbi/RothermelAndrews2018/Farsite with a matching fuels-table unit system."
      scope: "model selection / control semantics"
      source: "SimulationParameters default 'propagationModel'=Iso in ForeFire source; propagationModel parameter in docs"
      status: "adopted"
    - statement: "Rothermel/Balbi consume SI fuel parameters and convert internally to Imperial, while RothermelAndrews2018 consumes Imperial fuel parameters directly; the fuels-table unit system must match the chosen model."
      scope: "fuel parameter units"
      source: "Rothermel.cpp internal SI→Imperial conversion and ForeFire fuel-parameter documentation"
      status: "adopted"
