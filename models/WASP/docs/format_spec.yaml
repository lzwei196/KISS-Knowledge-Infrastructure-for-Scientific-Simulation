# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: WASP
  language: python
  implementation:
    id: hydrocraft-wasp
    version: 1.0.0
    provenance: Python; analytic reimplementation of WASP core water-quality processes (EPA public-domain
      lineage) for lakes and reservoirs.
  scientific_reference_version: WASP (US EPA Water Analysis Simulation Program) core water-quality physics;
    analytic lake/reservoir reimplementation (temperature, DO, BOD, TSI)
inputs:
  forcing:
  - name: water temperature
    unit: deg C
    category: forcing
    source_kind: forcing
    model_input_format: observed surface/profile temperature time series in Celsius
    notes: Model performs no internal conversion; Benson-Krause adds 273.15 internally, so inputs must
      be Celsius.
  - name: dissolved_oxygen
    unit: mg/L
    category: forcing
    source_kind: forcing
    model_input_format: observed DO concentration time series
  - name: chlorophyll_a
    unit: ug/L
    category: forcing
    source_kind: forcing
    model_input_format: observed Chl-a; drives TSI(Chl-a)
  - name: depth
    unit: m
    category: forcing
    source_kind: forcing
    model_input_format: observation depth for profile modes
  - name: day_of_year
    unit: integer 1-366
    category: forcing
    source_kind: forcing
    model_input_format: day-of-year index driving the sinusoidal seasonal model
  - name: secchi_depth
    unit: m
    category: forcing
    source_kind: forcing
    model_input_format: Secchi transparency; drives TSI(Secchi)
  - name: total_phosphorus
    unit: ug/L
    category: forcing
    source_kind: forcing
    model_input_format: TP concentration; drives TSI(TP)
  parameters:
  - name: T_mean
    unit: deg C
    category: parameters
    source_kind: calibrated
    model_input_format: annual average surface temperature (sinusoidal model); typical 2-30
  - name: amplitude
    unit: deg C
    category: parameters
    source_kind: calibrated
    model_input_format: seasonal temperature swing; typical 3-18
  - name: phase
    unit: day
    category: parameters
    source_kind: calibrated
    model_input_format: day-of-year of temperature peak (~130 NH); typical 90-170
  - name: kd
    unit: 1/d
    category: parameters
    source_kind: calibrated
    model_input_format: BOD deoxygenation rate; 0.05-0.3 typical for lakes
  - name: ka
    unit: 1/d
    category: parameters
    source_kind: calibrated
    model_input_format: atmospheric reaeration rate; 0.1-1.0 typical for lakes
  - name: BOD0
    unit: mg/L
    category: parameters
    source_kind: calibrated
    model_input_format: background/initial BOD loading; 1-10 typical for lakes
    notes: Dual role — calibration parameter in the seasonal DO model and an initial condition for the
      time-dependent deficit solution.
  - name: DO_offset
    unit: mg/L
    category: parameters
    source_kind: calibrated
    model_input_format: systematic DO correction; typical -3 to 3
  - name: T_surface
    unit: deg C
    category: parameters
    source_kind: calibrated
    model_input_format: epilimnion (summer surface) temperature; typical 15-30
  - name: T_bottom
    unit: deg C
    category: parameters
    source_kind: calibrated
    model_input_format: hypolimnion temperature; typical 4-15
  - name: thermo_depth
    unit: m
    category: parameters
    source_kind: calibrated
    model_input_format: depth of maximum dT/dz; typical 3-30
  - name: thermo_width
    unit: m
    category: parameters
    source_kind: calibrated
    model_input_format: thermocline transition thickness; typical 0.5-10
  - name: z_max
    unit: m
    category: parameters
    source_kind: dataset_lookup
    model_input_format: maximum lake depth (morphometry)
  - name: z_mean
    unit: m
    category: parameters
    source_kind: dataset_lookup
    model_input_format: mean depth = volume / surface area
  - name: area
    unit: km2
    category: parameters
    source_kind: dataset_lookup
    model_input_format: lake surface area
  - name: volume
    unit: m3
    category: parameters
    source_kind: dataset_lookup
    model_input_format: total lake volume
  - name: SOD
    unit: g O2/m2/d
    category: parameters
    source_kind: calibrated
    model_input_format: sediment oxygen demand; typical 0.1-3.0
  - name: depletion_rate
    unit: per meter below thermocline
    category: parameters
    source_kind: calibrated
    model_input_format: hypolimnetic DO depletion rate; oligotrophic 0.01-0.03, eutrophic 0.05-0.15
  initial_conditions:
  - name: D0
    unit: mg/L
    category: initial_conditions
    source_kind: user_provided
    model_input_format: initial oxygen deficit (DO_sat - DO) for the Streeter-Phelps deficit solution
  - name: BOD0
    unit: mg/L
    category: initial_conditions
    source_kind: user_provided
    model_input_format: initial BOD for first-order decay (time-dependent mode)
  boundary_conditions: []
outputs:
  primary:
  - name: temperature_timeseries
    unit: deg C
    description: Seasonal surface water temperature time series (sinusoidal annual cycle).
    validation_rank: 4
    emitted_in: WASP output (seasonal time-series mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Single seasonal cycle; cannot reproduce interannual variability. Exclude warmup year.
      detrending_options:
      - none
  - name: do_timeseries
    unit: mg/L
    description: Seasonal dissolved-oxygen time series (steady-state Streeter-Phelps).
    validation_rank: 1
    emitted_in: WASP output (seasonal time-series mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Steady-state seasonal simplification; reduced skill where interannual loading variability dominates.
      detrending_options:
      - none
  - name: temperature_profile
    unit: deg C
    description: 1-D vertical lake/reservoir water-column temperature profile vs depth (logistic thermocline).
    validation_rank: 5
    emitted_in: WASP output (profile mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Per-depth comparison; valid only for summer stratification (Jun-Aug NH) given fixed thermocline
          depth.
      detrending_options:
      - none
  - name: do_profile
    unit: mg/L
    description: 1-D vertical lake/reservoir water-column DO profile vs depth (epilimnion/hypolimnion).
    validation_rank: 2
    emitted_in: WASP output (profile mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Hypolimnetic depletion depends on SOD/depletion_rate set per lake productivity; summer-stratification
          only.
      detrending_options:
      - none
  - name: do_saturation
    unit: mg/L
    description: Benson-Krause DO saturation in lake/reservoir water as a function of water temperature.
    validation_rank: 3
    emitted_in: WASP output (diagnostic)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Closed-form function of temperature; comparison is effectively a check of the temperature input.
      detrending_options:
      - none
  - name: TSI
    unit: dimensionless
    description: Carlson Trophic State Index for lake/reservoir water from Chl-a, Secchi, and/or TP (Carlson
      1977 scale).
    validation_rank: 6
    emitted_in: WASP output (TSI mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        - ranking_quality
        determining_metric: spearman
        caveats:
        - TSI(Chl-a)/TSI(Secchi)/TSI(TP) agree only for algae-dominated systems; divergence diagnoses
          non-algal turbidity or P-limitation.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - When TSI is tracked across a season.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_wasp_001
  symptom: Surface temperature seasonal cycle shifted upward by ~15-20 C; summer values exceed 40 C
  diagnosis: WQP temperature data in Fahrenheit instead of Celsius; WQP observation records include a
    ResultMeasure/MeasureUnitCode field that may be 'deg F' for some monitoring organizations. The WASP
    analytic model expects temperature in deg C. Feeding Fahrenheit values directly into the sinusoidal
    temperature
  remedy: 'Convert Fahrenheit to Celsius: T_C = (T_F - 32) * 5/9 before fitting the seasonal model; convert_forcing_to_wasp;
    [''Check ResultMeasure/MeasureUnitCode in WQP CSV for temperature records'', ''If values > 50 in a
    temperate lake, units are almost certainly Fahrenheit'', ''Apply conversion: T_C = (T_F - 32'
  severity: silent
- id: dt_wasp_002
  symptom: Temperature values all above 200 C; DO saturation formula returns nonsensical results
  diagnosis: Temperature data in Kelvin instead of Celsius; Some reanalysis or satellite-derived datasets
    report temperature in Kelvin (e.g., 273-303 K for typical lake surface conditions). The Benson-Krause
    DO saturation formula uses absolute temperature internally (TK = T + 273.15), so passing Kelvin values
    ad
  remedy: 'Subtract 273.15 from Kelvin values to convert to Celsius; convert_forcing_to_wasp; [''If all
    temperature values are between 200 and 330, data is likely in Kelvin'', ''Apply conversion: T_C =
    T_K - 273.15'', ''Verify converted values fall in plausible range (0-35 C for most lakes)'']; convert_forcing_to_wa'
  severity: silent
- id: dt_wasp_003
  symptom: Dissolved oxygen observations show values of 60-110 mg/L; calibration produces nonsensical
    DO_offset
  diagnosis: DO data reported as percent saturation instead of mg/L concentration; Some WQP records report
    dissolved oxygen as percent saturation (typically 60-110%) rather than concentration in mg/L (typically
    4-14). The WASP model expects mg/L. At 20 C, 100% saturation equals 9.09 mg/L. Feeding percent saturat
  remedy: 'Convert percent saturation to mg/L: DO_mgL = (DO_pct / 100) * DO_sat(T); convert_forcing_to_wasp;
    [''Check ResultMeasure/MeasureUnitCode for DO records'', "If unit is ''%'' or ''percent'', apply conversion
    using concurrent temperature", ''DO_sat at 20 C = 9.09 mg/L; at 10 C = 11.29 mg/L; at 25 C = 8.26
    mg/'
  severity: silent
- id: dt_wasp_004
  symptom: Dissolved oxygen values are all near zero (0.001-0.015 mg/L) despite the lake not being anoxic
  diagnosis: DO data in ug/L instead of mg/L; Some laboratory analyses report DO in ug/L (micrograms per
    liter). Typical surface water DO of 8000-12000 ug/L divided by 1000 gives the expected 8-12 mg/L.
    If ug/L values are not converted, the model sees 8000-12000 mg/L (caught by the > 20 check) or, if
    the data ha
  remedy: 'Divide ug/L values by 1000 to convert to mg/L; convert_forcing_to_wasp; [''If DO values are
    consistently between 0.001 and 0.020, data may be in ug/L divided by 1e6 instead of 1e3'', ''If DO
    values are between 4000 and 15000, data is in ug/L -- divide by 1000'', ''Verify converted values:
    surface DO shou'
  severity: silent
- id: dt_wasp_005
  symptom: Depth profile plots show observations far deeper than the lake maximum depth
  diagnosis: Depth values in feet instead of meters; WQP ActivityDepthHeightMeasure/MeasureValue may be
    in feet for some monitoring organizations. The WASP profile model expects depth in meters. A 20 m
    deep lake with observations at 30, 50, 60 'ft' (actually 9, 15, 18 m) would appear to have data far
    below the l
  remedy: 'Multiply feet by 0.3048 to convert to meters; convert_forcing_to_wasp; [''Check ActivityDepthHeightMeasure/MeasureUnitCode
    in WQP CSV'', "If unit is ''ft'' or ''feet'', multiply by 0.3048", ''Cross-check against HydroLAKES
    max depth for the lake'']; convert_forcing_to_wasp.py compares observation depths to '
