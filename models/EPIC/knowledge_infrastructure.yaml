# ============================================================================
# EPIC Knowledge Infrastructure v1.0.0
# ============================================================================
# EPIC 1102 via Geo-EPIC-win toolkit
# Field-scale crop growth simulation model for geospatial applications
# ============================================================================

package:
  name: "hydrocraft-epic-crop"
  version: "1.0.0"
  description: "Knowledge infrastructure for EPIC crop simulation within HydroCraft"
  target_model: "EPIC 1102 (Geo-EPIC-win)"
  domain: "crop growth simulation and yield estimation"
  authors:
    - "Auto-generated by knowledge dissection toolkit"
  license: "BSD"

pipeline:
  stages:
    - id: s0_config
      name: "Configuration"
      description: "Create config.yml, define experiment, model path, simulation period"
      order: 0
      depends_on: []
      skill_document: "docs/s0_configuration_skill.md"
      tools: []
      milestones:
        - id: m0_config_defined
          description: "config.yml exists with EPICModel, start_date, duration, output_types"
          verification: "python -c \"from ruamel.yaml import YAML; c=YAML().load(open('config.yml')); assert 'EPICModel' in c\""

    - id: s1_weather
      name: "Weather data preparation"
      description: "Fetch/convert weather data to EPIC .DLY format with unit conversions"
      order: 1
      depends_on: [s0_config]
      skill_document: "docs/s1_weather_preparation_skill.md"
      tools: [convert_weather_to_dly]
      milestones:
        - id: m1_dly_created
          description: "DLY file exists with correct columns and units"
          verification: "head -1 weather/*.DLY shows 9 fixed-width columns, srad < 50, rh < 1.1"

    - id: s2_soil
      name: "Soil data preparation"
      description: "Convert SSURGO/HWSD/SoilGrids to EPIC .SOL and .SIT formats"
      order: 2
      depends_on: [s0_config]
      skill_document: "docs/s2_soil_preparation_skill.md"
      tools: [convert_soil_to_sol]
      milestones:
        - id: m2_sol_created
          description: "SOL and SIT files exist with valid soil layers"
          verification: "test -f soil/*.SOL && test -f sites/*.SIT"

    - id: s3_operations
      name: "Operations and management"
      description: "Create/edit .OPC files for crop planting, harvest, fertilizer, irrigation"
      order: 3
      depends_on: [s0_config]
      skill_document: "docs/s3_operations_management_skill.md"
      tools: []
      milestones:
        - id: m3_opc_created
          description: "OPC file exists with valid planting and harvest operations"
          verification: "test -f opc/*.OPC"

    - id: s4_execution
      name: "Model execution"
      description: "Configure workspace, run EPIC binary for all sites, collect outputs"
      order: 4
      depends_on: [s1_weather, s2_soil, s3_operations]
      skill_document: "docs/s4_execution_skill.md"
      tools: [run_epic_workspace]
      milestones:
        - id: m4_run_complete
          description: "EPIC exits 0, ACY and DGN files exist in output/"
          verification: "test -f output/*.ACY && test -f output/*.DGN"

    - id: s5_output
      name: "Output parsing and analysis"
      description: "Parse ACY/DGN files, compute derived variables, generate summaries"
      order: 5
      depends_on: [s4_execution]
      skill_document: "docs/s5_output_analysis_skill.md"
      tools: [parse_epic_output]
      milestones:
        - id: m5_output_parsed
          description: "Summary JSON and CSV exports generated"
          verification: "test -f output/*_summary.json"

    - id: s6_calibration
      name: "Calibration"
      description: "Calibrate PARM.DAT or CROPCOM.DAT against observed yield using PSO/DE"
      order: 6
      depends_on: [s5_output]
      skill_document: "docs/s6_calibration_skill.md"
      tools: []
      milestones:
        - id: m6_calibrated
          description: "Calibrated parameter files saved"
          verification: "Calibration log shows RMSE improvement"

    - id: s7_regional
      name: "Regional simulation"
      description: "Scale to regional extent with parallel multi-site execution"
      order: 7
      depends_on: [s4_execution]
      skill_document: "docs/s7_regional_simulation_skill.md"
      tools: []
      milestones:
        - id: m7_regional_complete
          description: "All sites in info.csv produced output"
          verification: "Count of ACY files matches info.csv row count"

tools:
  - id: convert_weather_to_dly
    name: "Weather to DLY Converter"
    description: "Convert NASA POWER / CMFD / MSWX / CSV weather data to EPIC .DLY format"
    stage: s1_weather
    script_path: "tools/convert_weather_to_dly.py"
    language: python
    inputs:
      - name: source
        type: string
        description: "Data source: nasa_power, csv"
        required: true
      - name: input
        type: string
        description: "Input directory or file path"
        required: true
      - name: lat
        type: number
        description: "Station latitude"
        required: true
      - name: lon
        type: number
        description: "Station longitude"
        required: true
    outputs:
      - name: dly_file
        type: file
        description: "EPIC .DLY daily weather file"
        path_pattern: "weather/*.DLY"
    preconditions:
      - "Input data covers the simulation period"
    postconditions:
      - "srad values are 0-50 MJ/m2/day"
      - "rh values are 0-1 fraction"
      - "tmax > tmin"

  - id: convert_soil_to_sol
    name: "Soil to SOL/SIT Converter"
    description: "Convert HWSD / SoilGrids / CSV soil data to EPIC .SOL and .SIT formats"
    stage: s2_soil
    script_path: "tools/convert_soil_to_sol.py"
    language: python
    inputs:
      - name: source
        type: string
        description: "Data source: hwsd, soilgrids, csv"
        required: true
      - name: input
        type: string
        description: "Input file path"
        required: true
      - name: lat
        type: number
        description: "Site latitude"
        required: true
      - name: lon
        type: number
        description: "Site longitude"
        required: true
    outputs:
      - name: sol_file
        type: file
        description: "EPIC .SOL soil profile file"
        path_pattern: "soil/*.SOL"
      - name: sit_file
        type: file
        description: "EPIC .SIT site information file"
        path_pattern: "sites/*.SIT"
    preconditions:
      - "Soil data exists for the target location"
    postconditions:
      - "Layer depths are monotonically increasing"
      - "Bulk density in range 0.5-2.5 g/cm3"
      - "Wilting capacity < Field capacity"

  - id: run_epic_workspace
    name: "EPIC Workspace Runner"
    description: "Configure and execute EPIC binary for workspace sites"
    stage: s4_execution
    script_path: "tools/run_epic_workspace.py"
    language: python
    inputs:
      - name: workspace
        type: directory
        description: "Path to Geo-EPIC workspace"
        required: true
      - name: timeout
        type: number
        description: "Per-site timeout in seconds"
        required: false
    outputs:
      - name: acy_files
        type: file
        description: "Annual crop yield files"
        path_pattern: "output/*.ACY"
      - name: dgn_files
        type: file
        description: "Daily general output files"
        path_pattern: "output/*.DGN"
    preconditions:
      - "config.yml, info.csv, and all input files exist"
    postconditions:
      - "EPIC exits with code 0"
      - "ACY and DGN files exist with non-zero size"

  - id: parse_epic_output
    name: "EPIC Output Parser"
    description: "Parse ACY/DGN output files to CSV and compute summary statistics"
    stage: s5_output
    script_path: "tools/parse_epic_output.py"
    language: python
    inputs:
      - name: output_dir
        type: directory
        description: "Directory containing EPIC output files"
        required: true
      - name: site_id
        type: string
        description: "Site identifier"
        required: true
    outputs:
      - name: summary
        type: file
        description: "JSON summary of simulation results"
        path_pattern: "output/*_summary.json"
    preconditions:
      - "ACY or DGN file exists for the site"
    postconditions:
      - "Summary JSON contains yield and biomass statistics"

