      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "The fetched ice-sheet papers use continuous-elevation or geometry misfit diagnostics, not csi, for surface/base fields."
        cites: []
    secondary_metrics:
      - metric: surface_elevation_misfit
        direction: minimize
        status: supportive
        ceiling_reason: "Surface elevation is used as an inversion target in initMIP-style initialization, but the fetched passages do not state a numeric validation band."
        cites: [goelzer2018_initmip_greenland, goldberg2013_adjoint]
    validated_when: "UNRESOLVED - spatial surface/base elevation should be evaluated as continuous elevation error, but no cited numeric pass band was fetched."
    evidence_strength: weak
