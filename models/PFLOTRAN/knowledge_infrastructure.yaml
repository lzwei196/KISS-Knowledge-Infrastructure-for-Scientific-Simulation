# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: PFLOTRAN
  language: fortran
  implementation:
    id: hydrocraft-pflotran-subsurface
    version: package v1.1.0 (PFLOTRAN v6.0 core, PETSc v3.18+)
    provenance: Fortran 2003/2008; LANL/SNL/ORNL open-source PFLOTRAN built on PETSc for MPI domain decomposition.
  scientific_reference_version: PFLOTRAN v6.0 (RICHARDS variably-saturated flow + multicomponent reactive
    transport; van Genuchten/Mualem characteristic curves)
  binary:
    path: KISSPATH_KI_ROOT/PFLOTRAN/source/repo/src/pflotran/pflotran
    type: work_dir
pipeline:
  stages:
  - s1_grid_generation
  - s2_material_properties
  - s3_forcing_boundary_conditions
  - s5_input_deck_assembly
  - s6_execution
  - s7_output_analysis
tools:
  count: 4
  files:
  - tools/convert_forcing_to_pflotran.py
  - tools/convert_soil_to_pflotran.py
  - tools/parse_pflotran_output.py
  - tools/run_pflotran.py
inputs:
  forcing:
  - name: Recharge / infiltration flux (top boundary)
    unit: m/s
  - name: Root-zone evapotranspiration sink
    unit: m^3/s
  - name: River / lake stage (head boundary)
    unit: Pa
  - name: Well pumping / injection rate
    unit: m^3/s
  parameters:
  - name: Intrinsic permeability (PERM_ISO)
    unit: m^2
  - name: Porosity
    unit: fraction (0-1)
  - name: Tortuosity
    unit: '-'
  - name: Longitudinal dispersivity
    unit: m
  - name: van Genuchten alpha
    unit: 1/Pa
  - name: van Genuchten m
    unit: '-'
  - name: Liquid residual saturation
    unit: '-'
  - name: Molecular diffusion coefficient
    unit: m^2/s
  - name: Reaction parameters (equilibrium constants, kinetic rates, sorption isotherm/ion-exchange/surface-complexation
      coefficients)
    unit: various
  initial_conditions:
  - name: Initial liquid pressure / water table
    unit: Pa
  - name: Initial temperature
    unit: C
  - name: Initial species concentrations
    unit: mol/L
  boundary_conditions:
  - name: Simulation mode selector
    unit: '-'
  - name: Steady-state vs transient flag
    unit: '-'
  - name: Saturation / relative-permeability function choice
    unit: '-'
  - name: Region / material / strata assignment
    unit: '-'
  - name: Boundary condition types
    unit: '-'
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - Liquid_Pressure
  - Liquid_Saturation
  - Hydraulic_Head
  - Darcy_Velocity
  - Solute_Concentration
  - Cumulative_Mass_Balance
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=1.000, KGE=-0.089, R=1.000, 2 scorecard(s)'
  metrics:
    best_nse: 1.0
    best_kge: -0.0895
    best_r: 1.0
summary:
  total_tools: 4
  total_stage_docs: 6
  total_diagnostic_triplets: 27
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
