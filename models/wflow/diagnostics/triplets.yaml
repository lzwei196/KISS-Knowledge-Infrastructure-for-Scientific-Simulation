    root_cause: "Different Wflow.jl versions \u2014 v1.0 uses CSDMS standard names,\
      \ pre-v1.0 uses short names"
    explanation: 'wflow v1.0 (Dec 2024) was a breaking release that changed the TOML
      configuration format. Variable names, section structure, and some parameter
      names changed to follow CSDMS standard naming. A TOML file generated for v1.0
      will not work with pre-v1.0, and vice versa. Most online examples and tutorials
