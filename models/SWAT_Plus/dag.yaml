safety:
  hazards:
    - id: "weather_solar_units_W_per_m2"
      kind: "weather_file_semantic"
      description: "Solar radiation supplied in W/m2 instead of MJ/m2/day is silently consumed; inflates PET ~12x and collapses water yield."
      severity: "silent"
      triplet_id: "dt_012"
    - id: "weather_temperature_kelvin_or_reversed"
      kind: "weather_file_semantic"
      description: "Tmax < Tmin or temperatures in Kelvin (~300) are silently accepted; PET, snowmelt, and crop growth all become wrong."
      severity: "silent"
      triplet_id: "dt_003"
    - id: "weather_rh_percent_not_fraction"
      kind: "weather_file_semantic"
      description: "Relative humidity supplied as percent (0-100) instead of fraction (0-1) is silently accepted by Penman-Monteith."
      severity: "silent"
    - id: "weather_file_header_format"
      kind: "weather_file_semantic"
      description: "Weather files must have exactly 3 header lines and space delimiters; tabs or extra header lines either crash initialization or produce NaN downstream."
      severity: "fatal_or_silent"
      triplet_id: "dt_002"
    - id: "weather_record_truncated"
      kind: "weather_file_semantic"
      description: "time.sim end date beyond the weather record silently produces NaN/zero outputs for the over-extended period without raising an error."
      severity: "silent"
      triplet_ids: ["dt_030", "dt_029"]
    - id: "soil_layer_count_mismatch"
      kind: "soil_semantic"
      description: "soils.sol nly value not matching the number of layer lines that follow corrupts all subsequent soil profile reads and can crash at EOF."
      severity: "fatal_or_silent"
      triplet_id: "dt_006"
    - id: "soil_cn2_out_of_range"
      kind: "soil_semantic"
      description: "CN2 values in hru-data.hru outside the physically realistic range (25-98) are not clamped; partitioning is silently wrong."
      severity: "silent"
      triplet_id: "dt_026"
    - id: "soil_zero_extreme_layer_values"
      kind: "soil_semantic"
      description: "Zero SOL_K, SOL_BD, or SOL_AWC, or extreme USLE_K/USLE_C, can cause mid-run FPE or unrealistic sediment yield (>100 t/ha/yr)."
      severity: "fatal_or_silent"
      triplet_ids: ["dt_014", "dt_021", "dt_034"]
    - id: "calibration_misspelled_parameter"
      kind: "coefficient_runtime_silent_fallback"
      description: "Parameter names in calibration.cal that don't match the cal_parms.cal vocabulary are silently ignored; calibration appears applied but has no effect."
      severity: "silent"
      triplet_id: "dt_013"
    - id: "calibration_absval_on_spatial_param"
      kind: "coefficient_runtime_silent_fallback"
      description: "absval on cn2 or awc replaces every HRU's value uniformly, destroying spatial heterogeneity intended by the input layer."
      severity: "degraded"
      triplet_id: "dt_013"
    - id: "structural_hydrology_not_calibratable"
      kind: "coefficient_runtime_silent_fallback"
      description: "perco, cn3_swf, and similar structural hydrology parameters live in hydrology.hyd and are NOT in cal_parms.cal; calibration.cal entries for them are silently ignored."
      severity: "silent"
      triplet_id: "dt_013"
    - id: "denit_threshold_disabled_by_default"
      kind: "coefficient_runtime_silent_fallback"
      description: "Baked-in sdnco=1.30 in basin_module.f90 places the denitrification soil-water threshold above 1.0, effectively disabling denitrification unless explicitly reset."
      severity: "silent"
    - id: "nperco_out_of_range_silent_inflation"
      kind: "coefficient_runtime_silent_fallback"
      description: "NPERCO (n_perc) > 1 in parameters.bsn is not range-checked and silently inflates nitrate leaching at every soil-layer step, producing TN exports above 50 kgN/ha/yr."
      severity: "silent"
      triplet_id: "dt_023"
    - id: "initial_channel_nutrients_default"
      kind: "initial_condition_semantic"
      description: "Default om_water.ini channel constituent concentrations (orgn=90, no3=70 mg/L) are placeholders; they create stored channel-nutrient mass that dominates HRU contributions unless zeroed."
      severity: "silent"
      triplet_id: "dt_wq_002"
    - id: "initial_soil_nutrients_too_low"
      kind: "initial_condition_semantic"
      description: "Zero or very low nutrients.sol pools force the model to mine soil organic matter to support uptake, producing systematically negative nutrient mass balance and declining yields."
      severity: "silent"
      triplet_id: "dt_022"
    - id: "warmup_too_short_for_aridity"
      kind: "initial_condition_semantic"
      description: "Default 2-3 year warmup is insufficient for arid basins (5+ years recommended) and for nutrient pools; goodness-of-fit including the warmup is biased."
      severity: "degraded"
    - id: "quale_solver_blowup_extreme_flow"
      kind: "numerical_instability"
      description: "Rev 59.3 QUAL2E semi-analytical solver (wq_cha=1) diverges during extreme flows (>10x bankfull); channel NO3 / orgn / solp can reach 1e9 mg/L. Use HRU-level loads instead."
      severity: "degraded"
      triplet_id: "dt_wq_001"
    - id: "qual2e_oscillation_flashy_basins"
      kind: "numerical_instability"
      description: "Daily-step QUAL2E in-stream routing produces oscillating or negative channel nutrient concentrations in flashy basins with large flow variation."
      severity: "degraded"
      triplet_id: "dt_036"
    - id: "fortran_array_bound_exceeded"
      kind: "numerical_instability"
      description: "Hardcoded PARAMETER limits in the Fortran binary cause segfault or out-of-bounds when HRU/subbasin/channel/soil-layer counts exceed compile-time dimensions; stream-order array is hard-capped at 12."
      severity: "fatal"
      triplet_id: "dt_005"
    - id: "channel_units_ham_per_day"
      kind: "parser_semantic"
      description: "channel_sd flo_out is emitted in ha-m/day, not m3/s. Downstream parsers that assume m3/s without converting overestimate discharge by ~200x."
      severity: "silent"
      triplet_id: "dt_v006"
    - id: "print_prt_nutrient_output_disabled"
      kind: "parser_semantic"
      description: "print.prt category flags set to 'n' silently suppress nutrient columns (basin_nb, channel_sd nutrient) even when the model computes them internally."
      severity: "silent"
      triplet_ids: ["dt_020", "dt_031"]
    - id: "missing_management_or_wrong_cropname"
      kind: "control_semantic"
      description: "Crop names in management.sch that don't match plants.plt (case-sensitive) silently leave the HRU as bare soil; misordered operations (plant after harvest, missing kill) produce zero yields with no warning."
      severity: "degraded"
      triplet_id: "dt_011"
    - id: "wq_cha_on_with_default_inits"
      kind: "control_semantic"
      description: "Enabling QUAL2E (wq_cha=1) without zeroing om_water.ini initial nutrient concentrations causes mass generation from the placeholder defaults."
      severity: "silent"
    - id: "rtu_wq_off_zeros_channel_TP"
      kind: "control_semantic"
      description: "rtu_wq=0 in codes.bsn silently zeroes channel TP output because HRU-computed P is never routed to channels."
      severity: "silent"
      triplet_id: "dt_024"
    - id: "fertilizer_only_N_no_P"
      kind: "control_semantic"
      description: "Management schedules that apply only N fertilizer with no P-containing product silently yield near-zero basin TP regardless of crop demand."
      severity: "silent"
      triplet_id: "dt_025"
    - id: "object_cnt_data_count_mismatch"
      kind: "control_semantic"
      description: "object.cnt counts not matching actual records in data files (hru-data.hru, chandeg.con, aquifer.aqu) cause initialization crashes or wrong-record reads."
      severity: "fatal"
      triplet_id: "dt_009"

  validation_limits:
    - "Spatial heterogeneity is fixed at HRU creation; HRU thresholds above 20% silently remove minor land uses and bias basin averages."
    - "Daily timestep cannot resolve sub-daily hydrology except through unit-hydrograph adjustments or the optional Green-Ampt path."
    - "Channel routing is internal and limited to Muskingum or variable storage; coupling to external hydraulic routers (Lohmann, CaMa-Flood, 2-D hydrodynamic) is out of scope."
    - "Lumped Aquifer1D representation is a single linear-reservoir per aquifer object; head and storage at within-aquifer points are not resolved unless gwflow=1."
    - "MUSLE is peak-flow-driven and empirical; not appropriate where gully or process-based hillslope erosion dominates."
    - "QUAL2E in-stream WQ is not reliable in Rev 59.3 for flashy basins or extreme flows; use HRU-level export coefficients instead."
    - "Hardcoded stream-order array size 12 means basins with Strahler order > 12 are silently truncated."
    - "Floodplain-deposition conversion assumes floodplain width = 3 * channel width and bulk density = 1 t/m3 (baked into time_control)."

  warnings:
    - "Baseline denitrification is effectively off until sdnco is reset below 1.0 (baked-in default 1.30)."
    - "Channel water temperature is fixed at wtemp = 5 + 0.75 * tave with no input control; QUAL2E temperature-dependent kinetics inherit this regression."
    - "The undocumented basin RNG seed igen defaults to 5 (not 0/1) and influences the weather generator and any stochastic management trigger."
    - "Aquifer1D delay_e is read from input but the lagged-recharge line is commented out in aqu_1d_control; the parameter is silently ignored."
    - "The CENTURY/Kemanian carbon chain selector (cswat) switches three mutually-exclusive residue/N mineralization paths that share soil C pools; switching mid-run corrupts state."
    - "Southern-hemisphere PHU and yr_skip are reset on Julian day 181 regardless of leap year (hard-coded in time_control)."
    - "Wetland/paddy module replaces the standard precip-runoff partition once surface storage exists; debugging surfq against precip ignores this substitution."

  assumptions:
    - statement: "Each HRU is treated as a homogeneous lumped unit: soil, slope, land use, and management are spatially uniform within an HRU, and lateral within-HRU connectivity is ignored."
      scope: "All HRU-level water, sediment, nutrient, and plant computations."
      source: "Bieger et al. 2017 (SWAT+ introduction, JAWRA) and SWAT+ I/O Documentation, Introduction / HRU section."
      status: "adopted"
    - statement: "Daily timestep is the primary integration step; sub-daily processes are represented through unit-hydrograph factors or the optional Green-Ampt route."
      scope: "Surface runoff partitioning, channel hydrograph generation, snowmelt."
      source: "SWAT+ I/O Documentation (time.sim, step=0) and source main.f90 / time_control.f90."
      status: "adopted"
    - statement: "Mass-balance closure holds for water and N/P/sediment under the recommended configuration (wq_cha=0); the QUAL2E channel-WQ path is treated as optional and is not relied on for budget closure in Rev 59.3."
      scope: "Basin nutrient and water budgets; channel constituent loads."
      source: "Source modules sd_channel_control3.f90 / ch_watqual4.f90 and SWAT+ Rev 59.3 release notes."
      status: "adopted"
    - statement: "Surface energy balance is not closed; PET is a demand-side flux from Priestley-Taylor, Penman-Monteith, or Hargreaves and actual ET is partitioned from PET via vegetation/soil compensation."
      scope: "ET, snowmelt energy considerations, soil temperature."
      source: "et_pot.f90 and SWAT+ I/O Documentation (codes.bsn pet_method)."
      status: "adopted"
    - statement: "When the gwflow module is inactive, groundwater is represented as a single linear-reservoir aquifer per aquifer object with delayed recharge effectively disabled in Rev 59.3."
      scope: "Baseflow generation, water-table depth, channel-aquifer exchange."
      source: "aqu_1d_control.f90 (commented-out lag-recharge line) and Bailey et al. 2020 (Hydrology 7(4):75) for the contrast with the distributed gwflow module."
      status: "adopted"
    - statement: "Channel water temperature is regressed from daily mean air temperature (wtemp = 5 + 0.75 * tave) with no separate energy balance for the channel."
      scope: "QUAL2E nutrient kinetics, in-stream biological rate constants."
      source: "sd_channel_control3.f90 lines 104-105 and Stefan & Preud'homme (1993) regression form."
      status: "adopted"
