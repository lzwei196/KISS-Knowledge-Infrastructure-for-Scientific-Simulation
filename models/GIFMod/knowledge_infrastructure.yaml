# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).
# CURATED OVERRIDE 2026-10-06 (real-engine wiring): binary.path now points at the PATCHED-FORK
# headless engine, `package.engine_fork` and the 5th tool were added by hand. generate_ki_manifest.py
# does not know these fields -- re-apply them after any regeneration
# (record: KISSPATH_HOME/ki_fix_campaign/reviews/GIFMod/).

package:
  name: GIFMod
  language: c++
  implementation:
    id: gifmod-usepa
    version: 0.1.26
    provenance: C++ (Qt5 GUI); US EPA / Catholic University of America GIFMod, driven by .GIFMod project
      files and an embedded JavaScript scripting engine.
  scientific_reference_version: GIFMod (Massoudieh et al. 2017 framework; block-connector variably-saturated
    flow + ADR reactive transport)
  binary:
    path: KISSPATH_HOME/engine_builds_20261006/gifmod/install/GIFMod
    type: ELF
    launcher: KISSPATH_HOME/engine_builds_20261006/gifmod/install/gifmod_headless.sh
    tool: tools/run_gifmod_engine.py
  engine_fork:
    note: PATCHED FORK of upstream GIFMod (upstream is GUI-only); patches listed in SKILL.md "Real engine"
    upstream_repo: https://github.com/USEPA/GIFMod
    upstream_commit: 2a314750418099ca51a100d824381924ba982c91
    patches: QPainterPath include; cmath include; headless driver in main.cpp (--wizard/--script/--model,
      auto-closes modal dialogs); return statements added to 20 non-void functions; optional GIFMOD_DEBUG_WIZ print
    build: Qt 5.15.15 (conda env KISSPATH_HOME/engine_builds_20261006/gifmod/qt_env), GCC 13.3
    previous_binary_path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/GIFMod/source/repo/bindata/GIFMod
      (unpatched upstream build; GUI-only, cannot run headless)
    test_case: test_cases/simple_pond
pipeline:
  stages:
  - s0_configuration
  - s2_soil_parameters
  - s4_forcing
  - s6_execution
  - s7_output_parsing
tools:
  count: 5
  files:
  - tools/convert_forcing.py
  - tools/convert_soil_params.py
  - tools/parse_gifmod_output.py
  - tools/run_gifmod.py
  - tools/run_gifmod_engine.py
inputs:
  forcing:
  - name: Precipitation
    unit: m/day
  - name: Temperature
    unit: Celsius
  - name: Humidity
    unit: fraction (0-1)
  - name: Wind speed
    unit: m/s
  - name: Solar radiation
    unit: W/m^2
  - name: External inflow
    unit: m^3/day
  parameters:
  - name: Saturated hydraulic conductivity (Ks)
    unit: m/day
  - name: Porosity
    unit: fraction (0-1)
  - name: Residual moisture content (theta_r)
    unit: fraction
  - name: Saturated moisture content (theta_s)
    unit: fraction
  - name: van Genuchten-Mualem retention parameters (alpha, n)
    unit: 1/m, dimensionless
  - name: Bulk density
    unit: kg/m^3
  - name: Dispersivity
    unit: m
  - name: Manning roughness (n)
    unit: s/m^(1/3)
  - name: Partition coefficient (Kd)
    unit: L/kg
  - name: Reaction rate constants
    unit: 1/day
  - name: Particle settling velocity
    unit: m/day
  - name: Particle attachment/release coefficients
    unit: 1/day
  - name: Block geometry (Area, Depth, Bottom elevation)
    unit: m^2, m, m
  - name: Evaporation/transpiration coefficients
    unit: dimensionless
  initial_conditions:
  - name: Initial head / water storage
    unit: m / m^3
  - name: Initial soil moisture
    unit: fraction
  - name: Initial constituent concentration
    unit: user-defined
  boundary_conditions:
  - name: Block-connector network topology
    unit: n/a
  - name: ET method selection
    unit: n/a
  - name: Rating-curve / prescribed-flow boundaries
    unit: stage-discharge or Q(t)
  - name: Bottom groundwater-head boundary
    unit: m
  - name: Process-inclusion switches
    unit: n/a
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - head
  - flow
  - moisture
  - storage
  - concentration
  - velocity
  other:
  - mass_balance_error
validation:
  tier: tested
  tier_justification: 'measured: R=0.772'
  metrics:
    best_r: 0.772
summary:
  total_tools: 5
  total_stage_docs: 5
  total_diagnostic_triplets: 15
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
