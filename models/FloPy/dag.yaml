template_version: "3.5"

identity:
  model_id: "FloPy"
  scientific_reference_version: "MODFLOW-family finite-difference groundwater flow/transport (MODFLOW 6, MODFLOW-2005/NWT/USG, MT3D/SEAWAT) as built and post-processed by FloPy"
  implementation:
    id: "flopy"
    version: "3.11.0"
    provenance: "Python; U.S. Geological Survey FloPy model-builder/pre-post-processor (Bakker, Post, Hughes et al.) that writes MODFLOW input files, invokes the external compiled MODFLOW binary, and parses its binary/text output."
  ki_class: "adapter_or_library"
  is_family_dag: true
  language: "python"
  license: "CC0-1.0"
  repo_url: "https://github.com/modflowpy/flopy"

boundary:
  scope_in:
    - "Programmatic construction of MODFLOW simulations: spatial discretization (DIS/DISV/DISU), temporal stress periods (TDIS), initial conditions, aquifer properties, boundary-condition/stress packages, solver configuration, and output control"
    - "Writing MODFLOW-standard input files and invoking the external MODFLOW-based solver executable"
    - "Reading and post-processing MODFLOW output (hydraulic head, drawdown, cell-by-cell budget, concentration) into arrays/DataFrames"
    - "Computing derived quantities (specific discharge / flow vectors) and particle tracking via MODPATH"
    - "Visualization and GIS export (mapping, contouring, shapefiles, rasters)"
  scope_out:
    - "FloPy contains no numerical solver; the finite-difference solution is performed by the external compiled MODFLOW/MT3D/SEAWAT binary, which must be installed separately"
    - "No automatic unit conversion: MODFLOW is unit-agnostic and FloPy does not warn on inconsistent length/time units (LENUNI/ITMUNI)"
    - "Does not supply forcing data; recharge, ET, pumping, and river stages must be provided by the user"
  spatial: "3-D"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-balance closure is on water (and on solute mass for MT3D/SEAWAT transport runs); the MODFLOW listing file reports a volumetric water budget with PERCENT_DISCREPANCY as the closure diagnostic (target <1%). Spatial discretization is user-defined (nlay x nrow x ncol structured DIS, or vertex/unstructured); temporal grain is set by stress periods and is not intrinsically daily (units chosen via ITMUNI; days is the most common convention). Steady-state vs transient is per-stress-period: steady-state ignores storage."

inputs:
  forcing:
    - category: "forcing"
      name: "recharge"
      unit: "m/day (model L/T)"
      source_kind: "user_provided"
      model_input_format: "areal flux array (nrow,ncol) per stress period via RCH/RCHA package"
      notes: "Commonly derived as R = P x recharge_fraction; source data typically in mm/day and must be divided by 1000 to model units. Unit mismatch is silent (heads can rise above land surface yet still converge)."
    - category: "forcing"
      name: "evapotranspiration"
      unit: "m/day (model L/T)"
      source_kind: "user_provided"
      model_input_format: "head-dependent ET sink via EVT/EVTA package (max rate evtr, extinction depth exdp, ET surface surf, option nevtop)"
      notes: "Head-dependent sink; source data typically in mm/day and must be converted to model length/time units. FloPy EVT defaults are placeholders (nevtop=3 highest-active-cell, evtr=1e-3 L/T, exdp=1.0 L, surf=0.0); a run left at default ET surf=0.0 / evtr placeholder gives meaningless extraction."
    - category: "forcing"
      name: "well pumping / injection"
      unit: "m3/day (model L^3/T)"
      source_kind: "user_provided"
      model_input_format: "per-stress-period list of [lay,row,col,flux] via WEL package"
      notes: "Extraction is NEGATIVE, injection POSITIVE in MODFLOW convention. Source rates in L/s (x86.4) or m3/hr (x24) must be converted to m3/day."
  parameters:
    - category: "parameter"
      name: "horizontal hydraulic conductivity (K / hk)"
      unit: "m/day (model L/T)"
      source_kind: "calibrated"
      model_input_format: "NPF (MF6) / LPF-UPW (MF2005) array; hardcoded FloPy default hk=1.0 (placeholder)"
      notes: "Literature K often in cm/s (x864) or m/s (x86400) to convert to m/day. Default value is an unphysical placeholder; a run left at default produces meaningless heads."
    - category: "parameter"
      name: "vertical hydraulic conductivity / anisotropy (K33 / vka)"
      unit: "m/day (model L/T)"
      source_kind: "calibrated"
      model_input_format: "NPF (MF6) / LPF-UPW (MF2005); interpretation depends on layvka; FloPy default vka=1.0"
      notes: "Typically 0.01-0.1 x horizontal K."
    - category: "parameter"
      name: "specific storage (Ss / ss)"
      unit: "1/m"
      source_kind: "calibrated"
      model_input_format: "STO package; FloPy default ss=1e-5"
      notes: "Typical 1e-6 to 1e-4; governs confined transient storage response."
    - category: "parameter"
      name: "specific yield (Sy / sy)"
      unit: "dimensionless (0-1)"
      source_kind: "calibrated"
      model_input_format: "STO package; FloPy default sy=0.15"
      notes: "Typical 0.01-0.35; governs unconfined transient storage response."
    - category: "parameter"
      name: "riverbed / streambed conductance"
      unit: "m2/day"
      source_kind: "calibrated"
      model_input_format: "RIV record [lay,row,col,stage,cond,rbot]; GHB/DRN conductance terms"
      notes: "C = K_bed x L_cell x W / d_bed; K_bed typically 0.01-1 m/day. Using aquifer K or wrong geometry makes the river over/under-connected."
    - category: "parameter"
      name: "layer type (laytyp / convertible flag)"
      unit: "dimensionless code"
      source_kind: "user_provided"
      model_input_format: "LPF/UPW laytyp (0=confined; >0=convertible/water-table); MF6 NPF icelltype; FloPy default laytyp=0"
      notes: "Default 0 (confined) is a common silent trap; water-table behavior requires convertible layers."
  initial_conditions:
    - category: "initial_conditions"
      name: "starting heads (strt)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "IC (MF6) / BAS (MF2005); FloPy default strt=1.0"
      notes: "Should be above layer bottoms to avoid initial dry cells; default 1.0 everywhere is unphysical for transient/nonlinear runs."
    - category: "initial_conditions"
      name: "active-cell domain (ibound / idomain)"
      unit: "integer flag"
      source_kind: "user_provided"
      model_input_format: "BAS ibound (active/inactive/CHD flags) / MF6 idomain; hnoflo no-flow sentinel"
      notes: "Activates/deactivates cells for the solver; inactive cells carry the hnoflo sentinel (-999.99 FloPy default)."
    - category: "initial_conditions"
      name: "initial concentration (transport)"
      unit: "mass/L^3"
      source_kind: "user_provided"
      model_input_format: "MT3D/SEAWAT initial concentration arrays"
      notes: "Only for solute/density-transport runs."
  boundary_conditions:
    - category: "boundary_conditions"
      name: "constant-head boundary (CHD)"
      unit: "m ASL"
      source_kind: "user_provided"
      model_input_format: "CHD package per-stress-period specified-head cells"
      notes: "Specified-head Dirichlet boundary; too many or too-low CHD cells can drain the model."
    - category: "boundary_conditions"
      name: "river / general-head / drain boundary (RIV/GHB/DRN)"
      unit: "stage & rbot in m ASL"
      source_kind: "user_provided"
      model_input_format: "RIV/GHB/DRN head-dependent boundary records (conductance-based)"
      notes: "Exchange flux = conductance x (boundary head - cell head); stage/datum must match grid elevation datum."
    - category: "boundary_conditions"
      name: "spatial & temporal discretization (DIS/TDIS)"
      unit: "m (cell sizes), model time units (perlen)"
      source_kind: "user_provided"
      model_input_format: "DIS (nlay,nrow,ncol,delr,delc,top,botm) + stress periods (nper,perlen,nstp,tsmult,steady); MF6 splits into DIS+TDIS"
      notes: "Steady vs transient flag per period; perlen units must match ITMUNI."
    - category: "boundary_conditions"
      name: "unit-system codes (LENUNI / ITMUNI)"
      unit: "code"
      source_kind: "user_provided"
      model_input_format: "DIS metadata: LENUNI (1=ft,2=m,3=cm), ITMUNI (1=s,2=min,3=hr,4=day,5=yr)"
      notes: "MODFLOW is unit-agnostic; all quantities must be in the chosen consistent length/time units. 0=undefined is dangerous."
    - category: "boundary_conditions"
      name: "solver configuration (IMS / PCG / NWT / SMS)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "IMS (MF6) complexity (SIMPLE/MODERATE/COMPLEX), outer/inner_maximum, outer/inner_dvclose; PCG/NWT for MF2005"
      notes: "Iteration limits, closure criteria, under-relaxation, and Newton formulation determine whether and how the head field converges."
    - category: "boundary_conditions"
      name: "output control (OC)"
      unit: "schedule"
      source_kind: "user_provided"
      model_input_format: "OC package + ipakcb/save_flows flags selecting which timesteps save HEAD/BUDGET"
      notes: "Heads and budget outputs are ABSENT (not zero) if OC is misconfigured; gates the existence of .hds/.cbc."

processes:
  modules:
    - name: "Discretization (DIS/TDIS)"
      role: "integrator"
      brief: "Defines the spatial grid (nlay,nrow,ncol,delr,delc,top,botm,idomain) and temporal stress periods (nper,perlen,nstp,tsmult,steady); the coordinate frame all other packages bind to."
    - name: "InitialConditions (IC/BAS)"
      role: "allocator"
      brief: "Sets starting heads (strt), active/inactive cell mask (ibound/idomain), and no-flow sentinel (hnoflo)."
    - name: "FlowProperties (NPF/LPF/UPW)"
      role: "process_solver"
      brief: "Node-property-flow: hydraulic conductivity (hk,vka/K33), layer type, and dry-cell head sentinel hdry; parameterizes inter-cell conductances of the groundwater-flow PDE."
    - name: "Storage (STO)"
      role: "process_solver"
      brief: "Specific storage Ss (confined) and specific yield Sy (unconfined) govern transient head change between timesteps; inactive under steady-state."
      applicability: "transient stress periods only"
    - name: "BoundaryStress (CHD/WEL/RCH/EVT/RIV/DRN/GHB)"
      role: "process_solver"
      brief: "Specified-head, specified-flux, and head-dependent-flux boundary packages that add/remove water per stress period."
    - name: "Solver (IMS/PCG/NWT/SMS)"
      role: "integrator"
      brief: "Iterative linear/nonlinear matrix solver; complexity, closure criteria, under-relaxation, and Newton-Raphson formulation control convergence of the head field."
    - name: "OutputControl (OC)"
      role: "driver"
      brief: "Schedules which timesteps save HEAD/DRAWDOWN/BUDGET and to which files; gates the existence of .hds/.cbc outputs."
    - name: "MODFLOW_FD_kernel"
      role: "process_solver"
      brief: "External compiled Fortran executable (MODFLOW 6 / 2005 / NWT / USG) that assembles and solves the finite-difference saturated groundwater-flow equations; the actual mechanistic engine, invoked by FloPy via subprocess."
    - name: "Transport (MT3D/SEAWAT)"
      role: "optional_module"
      brief: "Advection-dispersion of solute concentration; SEAWAT adds variable-density flow-transport coupling."
      applicability: "solute/density transport runs only"
    - name: "ParticleTracking (MODPATH)"
      role: "optional_module"
      brief: "Traces pathlines/endpoints through the converged steady/transient flow field."
      applicability: "MODPATH post-processing only"
    - name: "HeadReader (HeadFile)"
      role: "process_solver"
      brief: "Parses .hds/.ddn binaries with single/double precision auto-detection; dry (hdry) and no-flow (hnoflo) sentinels must be masked downstream."
    - name: "BudgetReader (CellBudgetFile)"
      role: "process_solver"
      brief: "Parses .cbc/.bud cell-by-cell flow terms (STO-SS, FLOW-JA-FACE, WEL, RCH, RIV, EVT, DATA-SPDIS) for water-balance and flow-vector post-processing."
  internal_edges:
    - from: "Discretization (DIS/TDIS)"
      to: "FlowProperties (NPF/LPF/UPW)"
      kind: "writes_state"
      brief: "Grid dims constrain the shapes of hk/vka/laytyp arrays."
    - from: "Discretization (DIS/TDIS)"
      to: "Storage (STO)"
      kind: "writes_state"
      brief: "Grid + stress-period structure size the Ss/Sy arrays and transient flags."
    - from: "Discretization (DIS/TDIS)"
      to: "BoundaryStress (CHD/WEL/RCH/EVT/RIV/DRN/GHB)"
      kind: "writes_state"
      brief: "Boundary/stress records must reference valid (lay,row,col) cells and (nrow,ncol) arrays per period."
    - from: "InitialConditions (IC/BAS)"
      to: "Solver (IMS/PCG/NWT/SMS)"
      kind: "writes_state"
      brief: "ibound active-cell mask and strt starting heads define the linear system the solver assembles."
    - from: "FlowProperties (NPF/LPF/UPW)"
      to: "Solver (IMS/PCG/NWT/SMS)"
      kind: "writes_state"
      brief: "Conductivity/layer-type parameterize the finite-difference coefficient matrix."
    - from: "Storage (STO)"
      to: "Solver (IMS/PCG/NWT/SMS)"
      kind: "writes_state"
      brief: "Storage terms are added to the matrix for transient timesteps only."
    - from: "BoundaryStress (CHD/WEL/RCH/EVT/RIV/DRN/GHB)"
      to: "Solver (IMS/PCG/NWT/SMS)"
      kind: "writes_state"
      brief: "Specified-flux stresses enter the RHS; head-dependent boundaries add conductance terms to the matrix diagonal and RHS."
    - from: "Solver (IMS/PCG/NWT/SMS)"
      to: "MODFLOW_FD_kernel"
      kind: "invokes"
      brief: "Solver settings are written to disk and consumed by the compiled kernel that performs the iteration."
    - from: "OutputControl (OC)"
      to: "MODFLOW_FD_kernel"
      kind: "invokes"
      brief: "OC tells the kernel which timesteps to save heads/budget and to which files."
    - from: "MODFLOW_FD_kernel"
      to: "hydraulic head h"
      kind: "writes_state"
      brief: "Iterates to the converged head field and writes it to .hds."
    - from: "MODFLOW_FD_kernel"
      to: "HeadReader (HeadFile)"
      kind: "produces_output"
      brief: "Kernel writes binary head/drawdown; HeadFile reads it back (precision must match compile)."
    - from: "MODFLOW_FD_kernel"
      to: "BudgetReader (CellBudgetFile)"
      kind: "produces_output"
      brief: "Kernel writes cell-by-cell flows to .cbc/.bud; CellBudgetFile parses them."
    - from: "FlowProperties (NPF/LPF/UPW)"
      to: "HeadReader (HeadFile)"
      kind: "reads_state"
      brief: "The hdry (-1e30) dry-cell sentinel defined here must be masked when reading heads back."
    - from: "HeadReader (HeadFile)"
      to: "hydraulic head h"
      kind: "reads_state"
      brief: "Parsed arrays expose the head state to post-processing and calibration."
    - from: "BudgetReader (CellBudgetFile)"
      to: "specific discharge (qx,qy,qz)"
      kind: "produces_output"
      brief: "DATA-SPDIS records yield qx,qy,qz specific-discharge vectors."
    - from: "MODFLOW_FD_kernel"
      to: "Transport (MT3D/SEAWAT)"
      kind: "produces_output"
      brief: "Converged flow field drives advection-dispersion of solute concentration."
    - from: "MODFLOW_FD_kernel"
      to: "ParticleTracking (MODPATH)"
      kind: "produces_output"
      brief: "Velocity field traces particle pathlines/endpoints."

states:
  variables:
    - name: "hydraulic head h"
      unit: "m"
      role: "prognostic"
    - name: "cell saturation / dry-wet status"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "drawdown"
      unit: "m"
      role: "diagnostic"
    - name: "cell-by-cell flow budget"
      unit: "m3/day"
      role: "diagnostic"
    - name: "specific discharge (qx,qy,qz)"
      unit: "m/day"
      role: "diagnostic"
    - name: "solute concentration"
      unit: "mass/L^3"
      role: "prognostic"
    - name: "volumetric water-balance discrepancy"
      unit: "percent"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "hydraulic head"
    validation_rank: 1
    unit: "m"
    description: "Simulated hydraulic head per cell (layer, row, col) and timestep, the primary state of the groundwater-flow solution."
    emitted_in: ".hds"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Compare at the observation-well cell after masking HDRY (-1e30) and hnoflo (-999.99) sentinels"
            - "Steady-state head only; datum (m ASL) must match the well measurement datum"
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats:
            - "Transient runs require correct STO storage and transient flagging; a period mis-flagged steady-state cannot reproduce the gradual drawdown response"
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Interpolated water-table surfaces carry interpolation error; compare on consistent layer/datum"
      detrending_options: ["none"]
  - var: "drawdown"
    validation_rank: 2
    unit: "m"
    description: "Groundwater head change relative to starting head, used for pumping-test and aquifer stress-response analysis."
    emitted_in: ".ddn"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Requires transient simulation with realistic Ss/Sy; mask dry-cell sentinels before differencing"
      detrending_options: ["none", "first_difference"]
  - var: "cell-by-cell flow budget"
    validation_rank: 3
    unit: "m3/day"
    description: "Per-cell groundwater volumetric flows by budget term (STO, FLOW-JA-FACE, CHD, RCH, WEL, RIV, DRN, GHB, EVT, DATA-SPDIS)."
    emitted_in: ".cbc / .bud"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Term-by-term budget magnitudes (e.g., total recharge, net pumping) compared against independent water-balance estimates"
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Stream-aquifer baseflow exchange (RIV/DRN term) compared against gauged baseflow separation"
      detrending_options: ["none"]
  - var: "specific discharge"
    validation_rank: 4
    unit: "m/day"
    description: "Groundwater Darcy flux vectors (qx,qy,qz) derived from the converged flow field for velocity/transport analysis."
    emitted_in: ".cbc (DATA-SPDIS record)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Requires save_specific_discharge=True; direct flux observations are rare, usually compared qualitatively"
      detrending_options: ["none"]
  - var: "solute concentration"
    validation_rank: 5
    unit: "mass/L^3"
    description: "Advection-dispersion solute concentration from MT3D/SEAWAT transport runs."
    emitted_in: ".ucn"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "timing_accuracy", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Only for transport runs; breakthrough timing depends on dispersivity and porosity parameterization"
      detrending_options: ["none"]
  - var: "volumetric water-balance discrepancy"
    validation_rank: 6
    unit: "percent"
    description: "Global mass-balance closure error (PERCENT_DISCREPANCY) from the listing file; a convergence/closure QA diagnostic."
    emitted_in: ".lst / .list"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Internal closure metric, not an external observation; acceptance threshold <1% (well-converged) rather than a measured value"
      detrending_options: ["none"]

influence:
  edges:
    - from: "hydraulic conductivity (hk / K)"
      to: "hydraulic head"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "mustafa2018_modflow_input_param_uncertainty"
        - "tolley2019_integrated_modflow_sensitivity"
        - "hill2000_modflow2000_sensitivity_process"
        - "hill2007_effective_gw_calibration"
    - from: "groundwater recharge (rch)"
      to: "hydraulic head"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations:
        - "mustafa2018_modflow_input_param_uncertainty"
        - "tolley2019_integrated_modflow_sensitivity"
        - "hill2007_effective_gw_calibration"
    - from: "groundwater recharge (rch)"
      to: "stream-aquifer baseflow flux"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations:
        - "reinecke2019_global_gw_morris_sensitivity"
        - "tolley2019_integrated_modflow_sensitivity"
    - from: "riverbed / streambed conductance"
      to: "stream-aquifer baseflow flux"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "mustafa2018_modflow_input_param_uncertainty"
        - "tolley2019_integrated_modflow_sensitivity"
        - "hill2000_modflow2000_sensitivity_process"
    - from: "riverbed / streambed conductance"
      to: "hydraulic head"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "near surface-water bodies"
      citations:
        - "mustafa2018_modflow_input_param_uncertainty"
        - "reinecke2019_global_gw_morris_sensitivity"
    - from: "specific yield (sy)"
      to: "hydraulic head"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "transient, unconfined"
      citations:
        - "mustafa2018_modflow_input_param_uncertainty"
        - "hill2000_modflow2000_sensitivity_process"
    - from: "specific storage (ss)"
      to: "hydraulic head"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "transient, confined"
      citations:
        - "hill2000_modflow2000_sensitivity_process"
        - "mustafa2018_modflow_input_param_uncertainty"
    - from: "pumping / extraction rate (WEL)"
      to: "hydraulic head"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "management"
      applicability: "near stressed cells"
      citations:
        - "hill2000_modflow2000_sensitivity_process"
        - "tolley2019_integrated_modflow_sensitivity"
    - from: "boundary head / GHB-CHD conductance"
      to: "boundary flux"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "hill2000_modflow2000_sensitivity_process"
        - "hill2007_effective_gw_calibration"
  citation_index:
    reinecke2019_global_gw_morris_sensitivity:
      short_citation: "Reinecke et al. 2019"
      doi: "10.5194/hess-23-4561-2019"
      note: "Morris global SA of a global gradient-based (MODFLOW-family) groundwater model; groundwater-surface-water FLOW (Q_swb) is rank-1 sensitive to recharge in ~60% of cells, while HEAD has no single dominant parameter (rank-1 split between surface-water-body elevation, K, and recharge)."
    mustafa2018_modflow_input_param_uncertainty:
      short_citation: "Mustafa et al. 2018"
      doi: "10.1029/2017WR021857"
      note: "Input (recharge) and parameter (HK, Sy, riverbed conductance) uncertainty in a fully distributed MODFLOW model; recharge and HK dominate head uncertainty."
    tolley2019_integrated_modflow_sensitivity:
      short_citation: "Tolley et al. 2019"
      doi: "10.1029/2018WR024209"
      note: "Morris global SA + PEST calibration of an integrated MODFLOW model; HK, recharge, and streambed conductance control heads and baseflow."
    hill2000_modflow2000_sensitivity_process:
      short_citation: "Hill et al. 2000"
      doi: "10.3133/ofr00184"
      note: "MODFLOW-2000 Sensitivity Process; sensitivity-equation derivatives of heads/fluxes to K, storage, recharge, pumping, boundary head/conductance."
    hill2007_effective_gw_calibration:
      short_citation: "Hill & Tiedeman 2007"
      doi: "10.1002/0470041080"
      note: "Standard MODFLOW calibration/SA methodology; HK, recharge, and boundary conductances typically most influential on heads/flows."

safety:
  hazards:
    - id: "K_units_cm_s_not_m_day"
      kind: "weather_file_semantic"
      description: "Hydraulic conductivity authored in cm/s instead of m/day (864x too small) yields a flat water table; silent (dt_001)."
      severity: "silent"
    - id: "recharge_units_mm_day_not_m_day"
      kind: "weather_file_semantic"
      description: "Recharge in mm/day instead of m/day (1000x too much input) raises heads above land surface; model may still converge (dt_002)."
      severity: "silent"
    - id: "well_units_L_s_not_m3_day"
      kind: "weather_file_semantic"
      description: "Well pumping rate in L/s instead of m3/day (86x too small) gives negligible drawdown (dt_003)."
      severity: "silent"
    - id: "et_units_mm_day_not_m_day"
      kind: "weather_file_semantic"
      description: "ET rate in mm/day instead of m/day (1000x too much extraction) collapses the water table (dt_008)."
      severity: "silent"
    - id: "storage_unset_or_too_small"
      kind: "coefficient_runtime_silent_fallback"
      description: "Ss too small or Sy unset on an unconfined layer removes transient storage response; behaves quasi-steady (dt_004)."
      severity: "silent"
    - id: "river_conductance_wrong"
      kind: "coefficient_runtime_silent_fallback"
      description: "River/GHB conductance computed with aquifer K instead of bed K, or wrong geometry, over/under-connects the river (dt_005)."
      severity: "degraded"
    - id: "boundary_datum_mismatch"
      kind: "control_semantic"
      description: "Boundary head/stage in a different vertical datum than grid elevations reverses the gradient and flow direction (dt_006)."
      severity: "silent"
    - id: "perlen_itmuni_mismatch"
      kind: "control_semantic"
      description: "Stress-period length (perlen) in wrong time units relative to ITMUNI gives the wrong simulation duration (dt_007)."
      severity: "silent"
    - id: "well_flux_sign_convention"
      kind: "control_semantic"
      description: "Positive well flux (injection) used where extraction (negative) is intended produces mounding instead of drawdown (dt_019)."
      severity: "silent"
    - id: "zero_based_indexing"
      kind: "control_semantic"
      description: "1-based MODFLOW-doc indices used in 0-based FloPy place boundaries/wells in the wrong cells (dt_009)."
      severity: "silent"
    - id: "stress_period_dict_repeat"
      kind: "control_semantic"
      description: "Missing stress-period dict keys REPEAT the previous period's data (they do not default to zero); empty list [] turns boundaries off (dt_010)."
      severity: "degraded"
    - id: "mf6_mf2005_api_mix"
      kind: "control_semantic"
      description: "Mixing flopy.mf6.* and flopy.modflow.* class hierarchies raises AttributeError / package-not-found (dt_011)."
      severity: "fatal"
    - id: "transient_flagged_steady"
      kind: "control_semantic"
      description: "A transient period flagged steady-state silently drops storage; heads jump instantaneously between periods (dt_015)."
      severity: "silent"
    - id: "missing_layered_keyword_mf6"
      kind: "control_semantic"
      description: "Non-3D arrays / missing LAYERED keyword in MF6 apply the first layer's values to all layers (dt_014)."
      severity: "silent"
    - id: "hdry_not_masked"
      kind: "parser_semantic"
      description: "Unmasked HDRY (-1e30) dry-cell heads corrupt head statistics, gradients, and plots (dt_012)."
      severity: "degraded"
    - id: "binary_precision_mismatch"
      kind: "parser_semantic"
      description: "Reading a single-precision .hds/.bud as double (or vice versa) yields garbage arrays with no error (dt_013)."
      severity: "degraded"
    - id: "failed_to_converge"
      kind: "numerical_instability"
      description: "Insufficient iterations or too-tight closure for model complexity gives FAILED TO CONVERGE (dt_016)."
      severity: "fatal"
    - id: "dry_wet_cycling_oscillation"
      kind: "numerical_instability"
      description: "Cells alternately drying and rewetting in unconfined layers oscillate and fail to converge; needs Newton-Raphson/under-relaxation (dt_017)."
      severity: "fatal"
    - id: "ill_conditioned_extreme_contrast"
      kind: "numerical_instability"
      description: "Extreme K contrasts (>1000x) or bad cell aspect ratios produce an ill-conditioned matrix and very slow runs (dt_018)."
      severity: "degraded"
    - id: "chd_drains_model"
      kind: "control_semantic"
      description: "Too many or too-low constant-head (CHD) cells drain the model so all heads converge to the CHD value (dt_020)."
      severity: "degraded"
  validation_limits:
    - "FloPy contains no solver; physical validity is governed entirely by the external MODFLOW/MT3D/SEAWAT binary, which must be installed and discoverable."
    - "Daily (or coarser) stress-period timestepping cannot resolve sub-daily groundwater transients unless the user refines nstp/perlen accordingly."
    - "MODFLOW is unit-agnostic and performs no unit conversion or unit-mismatch warning; consistency of LENUNI/ITMUNI is the user's responsibility."
    - "Structured DIS assumes a layered finite-difference grid; highly irregular geometries require DISV/DISU (MODFLOW-USG/6) and are not representable in classic structured form."
  warnings:
    - "save_flows=True (and a correctly configured OC package) are required for budget output; otherwise .hds/.cbc are absent rather than zero."
    - "MF6 (NPF/IMS/IC) and MF2005 (LPF/PCG/BAS) expose different package names and unit handling (TDIS vs DIS for steady-state); a model must stay within one API family."
    - "Default hardcoded properties (hk=1.0, strt=1.0, laytyp=0=confined, EVT evtr=1e-3/surf=0.0) are unphysical placeholders; a run left at defaults produces meaningless heads."
    - "Water-balance PERCENT_DISCREPANCY should be checked (<1%) as a closure QA before trusting any head or budget output."
  assumptions:
    - statement: "FloPy holds no physical solver state; hydraulic head, drawdown, budget, and concentration are MODFLOW-engine states read back from binary/text output files."
      scope: "states and processes blocks"
      source: "FloPy README / introduction (flopy.readthedocs.io) and BaseModel/run_model coupling-through-files behavior in FloPy source (mbase.py)"
      status: "adopted"
    - statement: "This dag describes the MODFLOW-family science as exposed by the FloPy wrapper across MF6 and MF2005 codes; module names list both API families (NPF/LPF, IC/BAS, IMS/PCG) as one family-level artifact."
      scope: "identity.is_family_dag and processes.modules"
      source: "FloPy supported-models list (README) and KI SKILL.md documenting both flopy.mf6.* and flopy.modflow.* APIs"
      status: "adopted"
    - statement: "Closure is mass-balance on water (and solute mass for transport); the model carries no surface energy budget."
      scope: "boundary.closure"
      source: "MODFLOW volumetric water-balance listing (PERCENT_DISCREPANCY) documented in FloPy MfListBudget / Mf6ListBudget readers"
      status: "adopted"
    - statement: "Stress-period timestepping is treated as daily by convention for shape classification, but the actual temporal unit is user-set via ITMUNI."
      scope: "boundary.temporal"
      source: "DIS/TDIS ITMUNI codes documented in FloPy ModflowDis and MF6 TDIS"
      status: "tentative"

