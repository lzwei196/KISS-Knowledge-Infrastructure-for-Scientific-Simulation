  # ---------- sub-grid routing: the parameters that PRODUCE the scored series ----------
  - name: routingGammaShape
    description: "Shape parameter of the gamma time-delay histogram SUMMA convolves
      basin runoff with (subRouting = timeDlay) — controls hydrograph PEAKEDNESS."
    type: continuous
    units: "-"
    default: 2.5
    range: [2.05, 2.95]
    hard_bounds: [2.00, 3.00]
