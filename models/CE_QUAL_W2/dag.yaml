template_version: "3.5"

identity:
  model_id: "CE_QUAL_W2"
  scientific_reference_version: "CE-QUAL-W2 4.5.5 (PSU User Manual, Wells 2026; ERDC/EcohydrologyTeam v4.5 lineage)"
  implementation:
    id: "ce-qual-w2-v45"
    version: "4.5.5"
    provenance: "Fortran 90; CE-QUAL-W2 (USACE ERDC / Portland State, Cole & Wells) realizing the laterally-averaged 2D LARM->GLVHT->W2 lineage; NPT fixed-width-FORMAT I/O contract."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "MIT"
  repo_url: "https://github.com/EcohydrologyTeam/CE-QUAL-W2"

boundary:
  scope_in:
    - "2D laterally-averaged hydrodynamics (longitudinal + vertical velocities, free-surface)"
    - "water temperature and density-driven thermal stratification"
    - "density-driven inflow placement (plunging / interflow / overflow)"
    - "selective withdrawal from outlets at specified elevations"
    - "multi-branch / multi-waterbody topology with branch junctions and head boundaries"
    - "surface heat exchange, ice cover onset/growth/breakup, and sediment/water heat exchange"
    - "water quality kinetics (DO, NH4, NO3, bioavailable P, organic matter, algae/periphyton, CBOD, TDS/ISS, zooplankton, macrophytes, sediment diagenesis)"
    - "hydraulic structures (gates, spillways, pipes, pumps, weirs) and wetting/drying"
    - "adaptive auto-stepping (stability-limited) timestep"
  scope_out:
    - "lateral (cross-channel) variation in velocity/temperature/constituents (laterally averaged)"
    - "vertical momentum / strong vertical acceleration (hydrostatic, Boussinesq approximation)"
    - "full 3D circulation"
    - "watershed runoff generation (supplied as boundary inflow)"
    - "compact/round lakes where a 1-D model is adequate"
  spatial: "2-D grid"
  temporal: "sub-hourly"
  closure: "both"
  notes: >
    2-D longitudinal-vertical (x-z) over a Waterbody->Branch->Segment(DLX)->Layer(H) grid;
    lateral dimension averaged out, quasi-3D only via branching. Governing equations are
    laterally and layer averaged in conservative form under the Boussinesq and hydrostatic
    approximations (vertical momentum neglected). Mass-balance closure applies to water volume
    and to each active constituent (heat/N/P/C accounting; ~1e-9 volume-balance tolerance in
    BALANCES). The surface energy budget is an equilibrium-temperature / term-by-term heat
    exchange (solar with BETA surface fraction and EXH2O attenuation, longwave back-radiation,
    evaporative + sensible via Bowen ratio, CBHE bottom exchange), so energy closure is the
    surface heat-flux balance rather than a fully resolved 3-D energy field. Timestep is
    auto-stepped for stability (DLT CON / DLTMIN floor); implicit free-surface and vertical
    diffusion remove gravity-wave and vertical-diffusion stability limits.

inputs:
  forcing:
    - category: "meteorology"
      name: "air temperature (TAIR)"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "met file METFN (e.g., met_wb*.npt), TAIR column vs decimal JDAY"
    - category: "meteorology"
      name: "dew point temperature (TDEW)"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "met file METFN, TDEW column"
      notes: "dew point, not relative humidity or vapor pressure; should be <= TAIR; drives evaporative/latent heat flux"
    - category: "meteorology"
      name: "wind speed (WIND)"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "met file METFN, WIND column"
    - category: "meteorology"
      name: "wind direction (PHI / WDIR)"
      unit: "degrees (0-360) in v4.x+"
      source_kind: "forcing"
      model_input_format: "met file METFN, wind-direction column"
      notes: "version-dependent units; v4.x onward expects degrees (some v3.x expected radians)"
    - category: "meteorology"
      name: "cloud cover (CLOUD)"
      unit: "tenths (0-10)"
      source_kind: "forcing"
      model_input_format: "met file METFN, CLOUD column"
      notes: "cloud cover in tenths, not fraction (0-1) or percent; modulates longwave/shortwave when solar not supplied directly"
    - category: "meteorology"
      name: "shortwave solar radiation (SRO)"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "met file METFN, optional direct shortwave column (else internally computed from solar geometry + cloud)"
  parameters:
    - category: "surface_mixing"
      name: "wind sheltering coefficient (WSC)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "control file card / WSC file WSCFN; typical 0.5-1.0"
      notes: "scales wind shear / surface mixing and thermal stratification"
    - category: "light"
      name: "light extinction for pure water (EXH2O)"
      unit: "m^-1"
      source_kind: "calibrated"
      model_input_format: "EX COEF card; typical 0.1-1.0 (~1.7/Secchi depth)"
      notes: "sets light attenuation and thermocline depth; EXINOR/EXORG add ISS/organic attenuation"
    - category: "light"
      name: "surface solar absorption fraction (BETA)"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "EX COEF card; typical 0.3-0.6"
      notes: "fraction of shortwave absorbed at the surface layer"
    - category: "mixing"
      name: "longitudinal momentum dispersion (AX)"
      unit: "m^2/s"
      source_kind: "calibrated"
      model_input_format: "HYD COEF card; typical 0.1-10"
    - category: "mixing"
      name: "longitudinal temperature/constituent dispersion (DX)"
      unit: "m^2/s"
      source_kind: "calibrated"
      model_input_format: "HYD COEF card; typical 0.1-100"
    - category: "heat"
      name: "bottom (sediment) heat exchange coefficient (CBHE)"
      unit: "W/m^2/C"
      source_kind: "calibrated"
      model_input_format: "HYD COEF card; typical 0.3-1.5"
    - category: "heat"
      name: "sediment temperature (TSED)"
      unit: "deg C"
      source_kind: "calibrated"
      model_input_format: "HYD COEF card; ~annual mean air temperature, typical 5-15"
    - category: "friction"
      name: "bottom friction (Chezy / Manning n)"
      unit: "Chezy or Manning n (n ~0.02-0.05)"
      source_kind: "calibrated"
      model_input_format: "bathymetry file; friction type set by FRICC"
    - category: "kinetics"
      name: "water-quality kinetic coefficients (>120; e.g., AG, AR, AM, AT1, ASAT, SOD, LDOMDK)"
      unit: "various (1/day, gO2/m^2/day, deg C, etc.)"
      source_kind: "calibrated"
      model_input_format: "control file kinetic cards; ~10 typically adjusted in calibration"
      notes: "only active when the corresponding constituents are turned on"
  initial_conditions:
    - category: "thermal"
      name: "initial temperature field (T2I / IT2)"
      unit: "deg C"
      source_kind: "user_provided"
      model_input_format: "control file; uniform value, vertical profile (VPRFN), or longitudinal/vertical profile (LPRFN)"
    - category: "water_quality"
      name: "initial constituent concentrations (IC2 / C2)"
      unit: "g/m^3 (mg/L)"
      source_kind: "user_provided"
      model_input_format: "control file / profile files; optional"
    - category: "hydraulic"
      name: "initial water surface elevation (ELWS)"
      unit: "m ASL"
      source_kind: "user_provided"
      model_input_format: "control file; must be >= bottom elevation (ELBOT) at active segments"
    - category: "ice"
      name: "initial ice thickness (ICETHI / ICE)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "control file; optional"
    - category: "restart"
      name: "restart state (RSIC reading RSOC/rso.opt)"
      unit: "state snapshot"
      source_kind: "user_provided"
      model_input_format: "restart file; optional"
  boundary_conditions:
    - category: "geometry"
      name: "bathymetry (segment widths per layer)"
      unit: "m (width), m (elevation)"
      source_kind: "dataset_lookup"
      model_input_format: "bth_wb*.npt width matrix [KMX layers] x [IMX segments]; boundary segments 1 and IMX zero-width; bottom elevations monotonically non-increasing downstream"
    - category: "geometry"
      name: "branch topology (US, DS, UHS, DHS, SLOPE)"
      unit: "segment indices / slope"
      source_kind: "user_provided"
      model_input_format: "control file BR GEOM; DHS must reference a valid segment in the receiving branch"
    - category: "inflow"
      name: "branch inflow discharge (QIN)"
      unit: "m^3/s"
      source_kind: "forcing"
      model_input_format: "qin_br*.npt vs JDAY; placement PQC (even or by density)"
    - category: "inflow"
      name: "branch inflow temperature (TIN)"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "tin_br*.npt vs JDAY"
    - category: "inflow"
      name: "branch inflow constituents (CIN)"
      unit: "g/m^3 (mg/L), constituent-dependent"
      source_kind: "forcing"
      model_input_format: "cin_br*.npt; column count must equal number of constituents ON; optional"
    - category: "inflow"
      name: "distributed / tributary inflow (QTR/QDTR, TTR/TDTR) and precipitation (PRC)"
      unit: "m^3/s; deg C"
      source_kind: "forcing"
      model_input_format: "qdt_*.npt / tdt_*.npt; tributary placement PTRC, distributed DTRC area-weighted"
    - category: "outflow"
      name: "outflow / withdrawal discharge (QOUT, QWD)"
      unit: "m^3/s"
      source_kind: "forcing"
      model_input_format: "qot_br*.npt vs JDAY; downstream selective withdrawal and lateral withdrawals"
    - category: "outflow"
      name: "outlet / withdrawal elevation"
      unit: "m ASL"
      source_kind: "user_provided"
      model_input_format: "control file structure cards; elevation in m ASL on the bathymetry datum (not depth-from-surface)"
    - category: "head"
      name: "external head boundaries (EUH/EDH, TUH/TDH, CUH/CDH)"
      unit: "m ASL; deg C; g/m^3"
      source_kind: "forcing"
      model_input_format: "control file UHS/DHS head BC; chiefly estuarine; optional"
    - category: "control"
      name: "simulation period (TMSTRT, TMEND, YEAR)"
      unit: "decimal JDAY / year"
      source_kind: "user_provided"
      model_input_format: "control file TIME CON card; all time-series inputs must cover this span"
    - category: "control"
      name: "waterbody type (WTYPE freshwater/saltwater)"
      unit: "switch"
      source_kind: "user_provided"
      model_input_format: "control file; selects density equation-of-state branch"
    - category: "control"
      name: "method / option switches (turbulence scheme, transport scheme, HEATC, SLHTC, FRICC, constituent ON/OFF)"
      unit: "switch"
      source_kind: "user_provided"
      model_input_format: "control file cards; e.g., transport upwind/QUICKEST/ULTIMATE, AZ scheme (k-epsilon/TKE/RNG/W2/W2N), heat-exchange method"

processes:
  modules:
    - name: "InputDriver"
      role: "driver"
      brief: "reads the w2_con control file plus bathymetry/met/inflow .npt files, allocates arrays, and supplies interpolated time-varying forcing each step (INPUT / READ_INPUT_DATA / INTERPOLATE_INPUTS)"
    - name: "Initialization"
      role: "driver"
      brief: "builds grid geometry, initial temperature/constituent fields, and initial water-surface/velocity state before the time loop (init / init-geom / init-cond / init-u-elws)"
    - name: "HydroInOut"
      role: "driver"
      brief: "assembles branch, tributary, distributed, and withdrawal inflows/outflows into the hydrodynamic boundary terms (hydroinout)"
    - name: "Density"
      role: "process_solver"
      brief: "equation-of-state water density as f(T, TDS, suspended solids) feeding baroclinic pressure gradients and buoyancy (density.f90, UNESCO-style polynomial)"
    - name: "TurbulenceClosure"
      role: "process_solver"
      brief: "vertical eddy viscosity/diffusivity AZ from a selectable closure (k-epsilon/TKE/TKE1/RNG/PARAB/W2/W2N), clamped to AZMIN floor (az.f90)"
    - name: "MomentumWaterSurfaceVelocity"
      role: "integrator"
      brief: "implicit free-surface (tridiagonal) and longitudinal/vertical velocity solution under the z-coordinate hydrostatic momentum equations"
    - name: "Transport"
      role: "process_solver"
      brief: "advection-diffusion of heat and constituents (upwind / QUICKEST / ULTIMATE) with vertical AZ mixing (transport.f90)"
    - name: "SurfaceHeatExchange"
      role: "process_solver"
      brief: "surface heat budget: shortwave (BETA/EXH2O), longwave back-radiation, evaporative+sensible (Bowen ratio), equilibrium-temperature CSHE; ice formation/melt (heat-exchange.f90)"
    - name: "Temperature"
      role: "process_solver"
      brief: "water temperature transport plus surface/bottom heat source-sink (TSS), always active; can be made conservative via HEATC (temperature.f90)"
    - name: "WaterQualityKinetics"
      role: "optional_module"
      brief: "DO, N/P nutrient cycling (nitrification/denitrification, P sediment release), organic matter decay, algal growth/mortality, SOD/diagenesis, zooplankton, Hg; gated by the CONSTITUENTS flag (wqconstituents / water-quality.f90)"
      applicability: "when constituents are turned ON"
    - name: "DensityInflowPlacement"
      role: "process_solver"
      brief: "places branch inflow at the matching density level (plunging / interflow / overflow) using temperature-derived density"
    - name: "SelectiveWithdrawal"
      role: "process_solver"
      brief: "distributes outflow across layers around the specified outlet elevation; structure routing for gates/spillways/pipes (withdrawal.f90, gate-spill-pipe.f90)"
    - name: "LayerAddSub"
      role: "allocator"
      brief: "dynamic surface-layer (KT) add/subtract and wetting/drying as water level moves, re-deriving layer geometry (layeraddsub.F90)"
    - name: "Balances"
      role: "integrator"
      brief: "volume and mass (heat/constituent) balance accounting to ~1e-9 volume tolerance (balances.F90)"
    - name: "TimestepControl"
      role: "integrator"
      brief: "CFL/stability-limited auto-stepping of DLT with the DLTMIN floor (DLT CON)"
  internal_edges:
    - from: "Inputs"
      to: "InputDriver"
      kind: "consumes_input"
      brief: "control file, bathymetry, met, and inflow .npt files read and interpolated"
    - from: "InputDriver"
      to: "HydroInOut"
      kind: "invokes"
      brief: "boundary inflows/outflows assembled into hydrodynamic forcing"
    - from: "Initialization"
      to: "water temperature (T1/T2)"
      kind: "writes_state"
      brief: "initial T, velocity, water-surface, and constituent fields set before the loop"
    - from: "Temperature"
      to: "Density"
      kind: "writes_state"
      brief: "updated temperature feeds the equation of state"
    - from: "WaterQualityKinetics"
      to: "Density"
      kind: "writes_state"
      brief: "TDS and suspended solids modify density when freshwater/saltwater/suspended-solids flags are set"
    - from: "Density"
      to: "MomentumWaterSurfaceVelocity"
      kind: "invokes"
      brief: "density field drives baroclinic horizontal pressure gradients"
    - from: "MomentumWaterSurfaceVelocity"
      to: "longitudinal velocity (U)"
      kind: "writes_state"
      brief: "longitudinal velocity updated by the hydrodynamic solve"
    - from: "MomentumWaterSurfaceVelocity"
      to: "vertical velocity (W)"
      kind: "writes_state"
      brief: "vertical velocity updated by continuity from the hydrodynamic solve"
    - from: "MomentumWaterSurfaceVelocity"
      to: "water surface elevation (ELWS / Z)"
      kind: "writes_state"
      brief: "implicit free-surface solution updates ELWS"
    - from: "MomentumWaterSurfaceVelocity"
      to: "TurbulenceClosure"
      kind: "invokes"
      brief: "velocity shear and bottom/wind friction feed the AZ closure"
    - from: "TurbulenceClosure"
      to: "MomentumWaterSurfaceVelocity"
      kind: "invokes"
      brief: "AZ eddy viscosity used in the implicit vertical momentum tridiagonal"
    - from: "TurbulenceClosure"
      to: "Transport"
      kind: "invokes"
      brief: "AZ vertical diffusivity mixes heat and constituents"
    - from: "Inputs"
      to: "SurfaceHeatExchange"
      kind: "consumes_input"
      brief: "meteorological forcing (TAIR, TDEW, WIND, CLOUD, solar) drives the surface heat budget"
    - from: "SurfaceHeatExchange"
      to: "Temperature"
      kind: "invokes"
      brief: "equilibrium-temperature CSHE and back-radiation become the surface temperature source-sink"
    - from: "water temperature (T1/T2)"
      to: "SurfaceHeatExchange"
      kind: "reads_state"
      brief: "surface water temperature TSUR used in Bowen-ratio and back-radiation terms"
    - from: "Transport"
      to: "Temperature"
      kind: "invokes"
      brief: "advection-diffusion operator applied to the temperature field"
    - from: "Temperature"
      to: "water temperature (T1/T2)"
      kind: "writes_state"
      brief: "updates the 2-D temperature field / thermal stratification"
    - from: "Transport"
      to: "WaterQualityKinetics"
      kind: "invokes"
      brief: "same transport scheme advects constituent concentrations"
    - from: "water temperature (T1/T2)"
      to: "WaterQualityKinetics"
      kind: "reads_state"
      brief: "temperature drives Arrhenius corrections of kinetic rates"
    - from: "WaterQualityKinetics"
      to: "water quality constituents (C1/C2: DO, NH4, NO3, PO4, ISS, TDS, LDOM/RDOM/LPOM/RPOM, algae, zooplankton, CBOD, Hg species)"
      kind: "writes_state"
      brief: "updates DO, nutrients, organic matter, algae, etc."
    - from: "HydroInOut"
      to: "DensityInflowPlacement"
      kind: "invokes"
      brief: "branch inflow handed to density-based vertical placement"
    - from: "water temperature (T1/T2)"
      to: "DensityInflowPlacement"
      kind: "reads_state"
      brief: "ambient density profile determines plunging/interflow/overflow level"
    - from: "DensityInflowPlacement"
      to: "MomentumWaterSurfaceVelocity"
      kind: "invokes"
      brief: "placed inflow enters the hydrodynamic solve at the matched layer"
    - from: "HydroInOut"
      to: "SelectiveWithdrawal"
      kind: "invokes"
      brief: "outflow distributed across layers around the outlet elevation"
    - from: "SelectiveWithdrawal"
      to: "Outputs"
      kind: "produces_output"
      brief: "layer-distributed withdrawal yields dam-release discharge and temperature"
    - from: "MomentumWaterSurfaceVelocity"
      to: "LayerAddSub"
      kind: "invokes"
      brief: "updated water-surface/Z triggers surface-layer add/subtract and wetting/drying"
    - from: "LayerAddSub"
      to: "layer thickness / surface layer index (KT)"
      kind: "writes_state"
      brief: "reassigns KT and recomputes layer geometry and thicknesses"
    - from: "Temperature"
      to: "Balances"
      kind: "invokes"
      brief: "heat content fed to mass/energy balance accounting"
    - from: "WaterQualityKinetics"
      to: "Balances"
      kind: "invokes"
      brief: "constituent mass fed to balance accounting"
    - from: "MomentumWaterSurfaceVelocity"
      to: "TimestepControl"
      kind: "reads_state"
      brief: "velocity/geometry set the CFL-limited adaptive timestep"
    - from: "Temperature"
      to: "Outputs"
      kind: "produces_output"
      brief: "temperature, velocity, ELWS and constituent fields written to snp/tsr/spr/cpl/prf .opt files"

states:
  variables:
    - name: "water temperature (T1/T2)"
      unit: "deg C"
      role: "prognostic"
    - name: "longitudinal velocity (U)"
      unit: "m/s"
      role: "prognostic"
    - name: "vertical velocity (W)"
      unit: "m/s"
      role: "prognostic"
    - name: "water surface elevation (ELWS / Z)"
      unit: "m ASL"
      role: "prognostic"
    - name: "water density (RHO)"
      unit: "kg/m^3"
      role: "diagnostic"
    - name: "vertical eddy viscosity/diffusivity (AZ)"
      unit: "m^2/s"
      role: "diagnostic"
    - name: "turbulent kinetic energy (TKE)"
      unit: "m^2/s^2"
      role: "prognostic"
    - name: "layer thickness / surface layer index (KT)"
      unit: "m / index"
      role: "prognostic"
    - name: "ice thickness (ICETH)"
      unit: "m"
      role: "prognostic"
    - name: "water quality constituents (C1/C2: DO, NH4, NO3, PO4, ISS, TDS, LDOM/RDOM/LPOM/RPOM, algae, zooplankton, CBOD, Hg species)"
      unit: "g/m^3 (mg/L)"
      role: "prognostic"
    - name: "sediment diagenesis state (sediment C/N/P, NO3/NH4/PO4, CH4/H2S/SO4, FeOOH/Fe+2/MnO2/Mn+2, sediment T/pH/alkalinity)"
      unit: "g/m^3, deg C, pH units"
      role: "prognostic"
    - name: "volume / mass balance accumulators (flowbal, wbal)"
      unit: "m^3, mass"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "water temperature"
    validation_rank: 2
    unit: "deg C"
    description: "2-D laterally-averaged water temperature over the segment-layer grid; thermal stratification structure"
    emitted_in: "snp*.opt (2-D snapshot), tsr*.opt (cell time series), prf*.opt (vertical profile)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "in-pool profile loggers map to a specific segment-layer cell; depth must align with the model layer"
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "single-cast profile compared at one instant; sensitive to timestep/output-frequency alignment"
      detrending_options: ["none"]
  - var: "dam release temperature"
    validation_rank: 3
    unit: "deg C"
    description: "water temperature of selective-withdrawal outflow at the outlet, controlled by withdrawal elevation and stratification"
    emitted_in: "tsr*.opt (withdrawal cell), withdrawal/structure outflow output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "release temperature is intermediate between surface and bottom; strongly depends on correct outlet elevation datum (m ASL)"
      detrending_options: ["none"]
  - var: "dissolved oxygen"
    validation_rank: 4
    unit: "g/m^3 (mg/L)"
    description: "dissolved oxygen concentration in reservoir water over the segment-layer grid; hypolimnetic depletion driven by SOD, respiration, and organic decay"
    emitted_in: "snp*.opt, tsr*.opt, prf*.opt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "DO accuracy is contingent on SOD and algal-kinetic calibration; only valid when constituents are turned on"
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "vertical DO profile at a single cast; compare layer-by-layer at the matching segment"
      detrending_options: ["none"]
  - var: "water surface elevation"
    validation_rank: 5
    unit: "m ASL"
    description: "free-surface elevation evolving with the inflow/outflow water balance"
    emitted_in: "tsr*.opt, spr*.opt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "reservoir stage gauge; mismatch usually reflects inflow/outflow boundary errors rather than hydrodynamics"
      detrending_options: ["none"]
  - var: "outflow discharge"
    validation_rank: 1
    unit: "m^3/s"
    description: "withdrawal/dam-release discharge used for downstream coupling"
    emitted_in: "tsr*.opt, withdrawal/structure output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "largely prescribed by the outflow boundary; useful as a water-balance closure check, not an independent skill metric"
      detrending_options: ["none"]
  - var: "chlorophyll-a / algal biomass"
    validation_rank: 6
    unit: "ug/L (chl-a) or g/m^3 (algal biomass)"
    description: "phytoplankton standing biomass from algal growth/mortality kinetics"
    emitted_in: "snp*.opt, tsr*.opt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "highly sensitive to algal-kinetic parameters and nutrient loading; only valid with constituents on and calibrated"
      detrending_options: ["none"]
  - var: "ice thickness"
    validation_rank: 7
    unit: "m"
    description: "ice cover onset, growth, and breakup"
    emitted_in: "snp*.opt, tsr*.opt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["timing_accuracy", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "ice on/off timing more diagnostic than absolute thickness"
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "csi"
          caveats:
            - "ice presence/absence as a binary event"
      detrending_options: ["none"]

influence:
  _caveat: >
    CE-QUAL-W2 thermal-parameter sensitivity in the available literature
    (restrepo2023_w2_tropical_temp_do, terrain2024_w2_wsc_tuning,
    wells2019_w2_outflow_temp_do_nutrients) comes from calibration / dominance /
    descriptive-dataset studies, NOT variance-decomposition SA (no Sobol/Morris/EFAST
    indices). EXH2O/BETA/WSC and withdrawal-elevation therefore cannot claim HIGH from
    this literature even though they are mechanistically dominant for stratification and
    release temperature/DO. Only the algal/DO kinetic edges (AG, AT1, AR, AP, AM, ASAT,
    SOD, LDOMDK) backed by cheng2018 Sobol' GSA and bowen2018 full-factorial retain
    literature_quantitative + HIGH.
  edges:
    - from: "EXH2O (light extinction for pure water)"
      to: "water temperature"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["restrepo2023_w2_tropical_temp_do", "terrain2024_w2_wsc_tuning"]
    - from: "BETA (surface solar absorption fraction)"
      to: "water temperature"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["restrepo2023_w2_tropical_temp_do", "terrain2024_w2_wsc_tuning"]
    - from: "WSC (wind sheltering coefficient)"
      to: "water temperature"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["terrain2024_w2_wsc_tuning", "restrepo2023_w2_tropical_temp_do", "wells2019_w2_outflow_temp_do_nutrients"]
    - from: "wind-function coefficients (AFW, BFW, CFW)"
      to: "water temperature"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["terrain2024_w2_wsc_tuning"]
    - from: "CBHE (bottom/sediment heat exchange)"
