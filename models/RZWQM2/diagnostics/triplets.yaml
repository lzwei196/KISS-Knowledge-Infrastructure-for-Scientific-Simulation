  - id: "dt_032"
    stage: "s7_scenario_assembly"
    symptom: "RZWQM2 crashes with 'File: SBGRO040.CUL not found' or 'MZCER040.CUL not found' after crop selection change"
    diagnosis: "update_crop_selection.py updated the crop definition (line ~488 in rzwqm.dat) but did NOT update the planting schedule plant reference numbers. The planting lines still reference the old crop (e.g., plant_ref=2 for soybean), so RZWQM2 tries to plant the wrong crop and looks for the wrong .CUL file."
    remedy: "Fixed in update_crop_selection.py (2026-04-10): now also calls _update_planting_references() to rewrite all planting schedule entries to use the correct plant reference (1=maize, 2=soybean, 3=wheat). Verify with: grep '^[123]  ' rzwqm.dat — all planting lines should start with the target plant ref."
    severity: "critical"
    silent: false

  - id: "dt_033"
    stage: "s7_scenario_assembly"
    symptom: "forrtl: severe (59): list-directed I/O syntax error, unit 69, file MZDSSAT.RZX"
    diagnosis: "update_rzx_paths.py or initialize_scenario.py corrupted the .RZX file by replacing a comment line containing 'DSSAT' (e.g., '==  RZWQM-DSSAT CONTROL FILE') instead of the actual database path lines at positions 68-69."
    remedy: "Fixed in both tools (2026-04-10): now uses the 'DATABASE FILE LOCATIONS' section marker to find the correct path lines, skipping comments. Falls back to fixed positions 68-69 only if no marker found. Both path lines must be relative: 'DSSAT/' and './' — absolute paths cause file-not-found on some Linux configurations."
    severity: "critical"
    silent: false

  - id: "dt_034"
    stage: "s7_scenario_assembly"
    symptom: "initialize_scenario.py creates the new scenario inside the template directory instead of a separate output location"
    diagnosis: "The tool only had PROJECT_PATH (which defaults to the canonical template), so new scenarios were created as siblings of the template scenario. This pollutes the template directory and causes confusion."
    remedy: "Fixed (2026-04-10): Added OUTPUT_DIR parameter (6th CLI argument). When set, the tool creates a self-contained project at OUTPUT_DIR with proper structure (scenario/, Meteorology/, Analysis/), IPNAMES.DAT paths pointing to the new location, and relative RZX paths. Usage: initialize_scenario.py <template_root> <template_name> <new_name> <start> <end> <output_dir>"
    severity: "minor"
    silent: false
