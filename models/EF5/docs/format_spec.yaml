    it substitutes only YYYY/MM/DD and leaves the literal characters "HHUU" in the filename, so EF5'
  remedy: 'For daily forcing (FREQ=d) set NAME=forcing_YYYYMMDD0000.asc in ALL of [PrecipForcing]/[PETForcing]/[TempForcing]
    (literal 0000, NOT HHUU). The SKILL.md "Complete example" NAME=precip_YYYYMMDDHH.tif is for FREQ=1h
    only. General rule: the NAME pattern must contain date tokens ONLY down to the FREQ re'
