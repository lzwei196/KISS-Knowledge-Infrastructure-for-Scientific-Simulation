      file: "site_settings/trialParams.nc"
      variable: "routingGammaShape"
      dimension: "gru"

  - name: routingGammaScale
    description: "Scale parameter (seconds) of the gamma time-delay histogram — the mean
      basin lag is shape x scale, i.e. the direct handle on freshet timing."
    type: continuous
    units: "s"
    default: 20000.0
    range: [3600.0, 172800.0]
    hard_bounds: [1.0, 5.0e+06]
    transform: log
    scope: per-GRU
    zone_key: "gruId"
    activation: "configuration.subRouting == 'timeDlay'"
    expected_sensitivity: medium
    confidence: high
    cite:
      - "SUMMA basinParamInfo.txt: routingGammaScale default 20000.0 s, limits
         [1.0, 5.0e+06] s"
      - "SUMMA source engine/var_derive.f90:445-475: the histogram has nTimeDelay=1000 bins of
         one forcing step (1 h), so the delay distribution must be exhausted well inside 1000 h
         or SUMMA warns that the histogram is truncated.  The 1 h .. 48 h range gives a mean lag
         of shape x scale = 2 h .. 142 h, comfortably inside the 1000 h window — verified: no
         truncation warning at either bound."
      - "commissioning 2026-08-04: lo -> nse 0.5601, hi -> nse 0.4534; applied == requested at both"
    address:
      kind: api
      setter: "tools.s4_parameters.set_trial_parameters:append_basin_parameters"
      file: "site_settings/trialParams.nc"
      variable: "routingGammaScale"
      dimension: "gru"

# ---------------------------------------------------------------------------
# constraints — hard feasibility, checked BEFORE any model run (schema C5)
# ---------------------------------------------------------------------------
# SUMMA's engine/paramCheck.f90 ABORTS the run when the transpiration/wilting/field-
# capacity thresholds fall outside [theta_res, theta_sat].  The site's theta_res
# (0.155), critSoilWilting (0.1812) and fieldCapacity (0.3072) are held FIXED at the
# validated ROSETTA-loam values, so the only pair that can conflict is the one below.
# The declared ranges already make it structurally impossible, but it is asserted
# here so a future range widening cannot silently start producing aborted runs.
constraints:
  - "critSoilTranspire < theta_sat"
  - "critSoilTranspire > 0.1812"          # >= the fixed critSoilWilting
  - "theta_sat > 0.155"                   # > the fixed theta_res

# ---------------------------------------------------------------------------
# runner — one candidate -> gate-valid metrics JSON
# ---------------------------------------------------------------------------
runner:
  kind: subprocess
  command: ["python3", "tools/calib_run.py", "--workdir", "{workdir}", "--out", "{metrics_json}"]
  metrics_file: "{metrics_json}"
  timeout: 900              # soft hint only; the kit does not bound a real-binary run
  notes: >-
    ~62 s wall per evaluation (11 model-years, hourly, 1 GRU / 3 HRUs; ~29 s SUMMA
    physics).  Each evaluation runs in a fresh scratch dir under
    <workdir>/_evals/, staged by symlink from the validated case dir — no download,
    no forcing rebuild, no domain rebuild per eval.  Emits nse / kge / pbias / r /
    rmse plus the reserved __kdt__ block (applied_params, case_id, scored_obs,
    split, n_paired_days, station identity, obs_stats).

# ---------------------------------------------------------------------------
# strategy
# ---------------------------------------------------------------------------
strategy:
  cost_class: moderate
  default_algorithm: dds            # single scalarized objective, ~1 min per eval
  max_evaluations: 240              # TOTAL across all staged rounds
  screen_trajectories: 4            # Morris R; 4 x (14 + 1) = 60 screening evals
  staged: true                      # screen -> calibrate few -> escalate
  staged_start: 4
  staged_step: 3
  min_round_evaluations: 25
  probe_objectives: true
  triage:
    pattern_tol: 0.5
    mag_tol: 0.1
  holdout:
    kind: years
    protocol: blocked_temporal
    grouping_key: calendar_year
    generalization_axis: temporal
    fraction: 0.5                   # 5 held-out years of the 10 scored years
    calibration_window: "2006-01-01..2010-12-31"
    holdout_window: "2011-01-01..2015-12-31"
    rationale: >-
      obs_shape is point_time_series, so the schema default is a CONTIGUOUS blocked
      temporal split, and the promotion claim is temporal transfer at this gauge.
      The two blocks are exactly the validated run's own period_calibration /
      period_validation, so a calibrated NSE is directly comparable to the validated
      cal 0.5445 / val 0.6467 pair.  2005 is excluded from both blocks as cold-start
      spinup.  The holdout block is wetter (mean 5.22 vs 3.82 m3/s) and contains the
      record maximum (70.0 m3/s), so it is a genuinely harder, non-interpolated test.
    cite:
      - "CALIBRATION_YAML_SCHEMA.md v2: 'Default per obs_shape: point_time_series ->
         contiguous blocked temporal'"
      - "validated run SUMMA_20260629T153311Z: period_calibration 2006-01-01..2010-12-31,
         period_validation 2011-01-01..2015-12-31 (val NSE 0.6467 >= cal NSE 0.5445, i.e. the
         uncalibrated model is already not over-fit on this split)"
    confidence: high
