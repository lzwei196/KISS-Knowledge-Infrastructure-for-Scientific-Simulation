schema_version: 1
model_id: SWMM
domain: hydrology
generated_by: "Step-B validation-convention agent (GPT-5 Codex)"
generated_at: 2026-08-14

# Blocks are keyed by SWMM dag_variable, not by an invented canonical quantity.
# Numeric bands are copied only from fetched/read texts. Transferred bands are
# marked in band_note/notes; uncited or non-field thresholds remain null.

