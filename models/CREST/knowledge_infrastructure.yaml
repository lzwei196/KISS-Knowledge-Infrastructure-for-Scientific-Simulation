# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: CREST
  language: c++
  implementation:
    id: crest-ef5-v123
    version: EF5 v1.2.3 (hydrocraft-crest-ef5 package v1.1.0)
    provenance: C++; HyDROSLab EF5 framework (Flamig/Vergara/Gourley), single bin/ef5 executable; CREST
      is one of EF5's selectable water-balance modules (MODEL=CREST).
  scientific_reference_version: CREST distributed water balance (Wang et al. 2011, HSJ 56:84-98) as realized
    in EF5 v1.2.3
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/CREST/source/repo/build/ef5
    type: work_dir
pipeline:
  stages:
  - s1_dem_preparation
  - s2_forcing_conversion
  - s3_parameter_preparation
  - s4_execution
  - s5_output_analysis
tools:
  count: 5
  files:
  - tools/convert_forcing_to_ef5.py
  - tools/convert_params_to_ef5.py
  - tools/parse_ef5_output.py
  - tools/prepare_basic_grids.py
  - tools/run_ef5.py
inputs:
  forcing:
  - name: Precipitation
    unit: mm per config UNIT interval (internally converted to mm/hr)
  - name: PET (potential evapotranspiration)
    unit: mm per config UNIT interval, or C (UNIT=C for internally-computed temperature-based PET)
  - name: Temperature
    unit: C
  parameters:
  - name: WM
    unit: mm
  - name: B
    unit: '-'
  - name: IM
    unit: '% (0-100)'
  - name: KE
    unit: '-'
  - name: FC (Ksat)
    unit: mm/hr
  - name: 'Channel routing coefficients (LR: RIVER, COEM, UNDER, LEAKO, LEAKI, TH; KW: ALPHA, BETA, ALPHA0,
      UNDER, LEAKI, TH)'
    unit: mixed (multipliers, fractions, FAM-cell threshold)
  initial_conditions:
  - name: IWU
    unit: '% of WM (0-100)'
  - name: ISO / ISU
    unit: mm
  - name: Saved state grids
    unit: mm (SM); module-specific for routing/snow
  boundary_conditions:
  - name: ROUTING selector
    unit: '-'
  - name: DDM encoding flag (ESRIDDM)
    unit: '-'
  - name: FAM self-inclusion flag (SELFFAM)
    unit: '-'
  - name: Simulation window and timestep (TIME_BEGIN, TIME_END, TIME_WARMEND, TIMESTEP)
    unit: datetime / interval
  - name: Gauge specification (LON/LAT, BASINAREA, OBS)
    unit: WGS84 degrees / km2 / m3/s
  - name: Static basic grids (DEM, DDM, FAM)
    unit: m / direction code / cell count
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - STREAMFLOW (Q)
  - SOILMOISTURE (SM)
  - SNOWWATER (SWE)
  - RETURNPERIOD (RP)
  - INUNDATION (depth)
  other: []
validation:
  tier: tested
  tier_justification: 'measured: NSE=0.885, KGE=0.912, R=0.941, 2 scorecard(s)'
  metrics:
    best_nse: 0.8846
    best_kge: 0.9121
    best_r: 0.9406
summary:
  total_tools: 5
  total_stage_docs: 5
  total_diagnostic_triplets: 21
  generated: '2026-08-15'
