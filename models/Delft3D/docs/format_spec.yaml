model:
  name: "Delft3D"
  version: "D-Flow FM + Delft3D-FLOW (Deltares)"
  domain: "coastal-estuarine-river hydrodynamics"
  description: >
    2D/3D hydrodynamic model for coastal and inland waters. Simulates tidal and
    wind-driven flows (shallow water equations), salinity/temperature transport,
    sediment transport and morphodynamics, wave-current interaction (SWAN coupling),
    water quality (DELWAQ/BLOOM), particle tracking, and real-time control structures.
  engines:
    - name: "D-Flow FM"
      description: "Flexible Mesh (unstructured grids)"
      binary: "dflowfm"
    - name: "Delft3D-FLOW"
      description: "Structured grids (legacy)"
      binary: "flow2d3d"
    - name: "DIMR"
      description: "Deltares Integrated Model Runner (orchestrator)"
      binary: "dimr"
  binary_path: null  # BUILD FAILED - requires PETSc + proj + Intel oneAPI or Docker
  binary_status: "BUILD_FAILED"
  binary_notes: >
    CMake configure failed: proj library not found. Full build requires Docker
    container with Intel oneAPI 2024 compilers, PETSc 3.24.5, HDF5 1.14.2,
    NetCDF 4.9.2, Proj 9.7.1, METIS, and other dependencies.
  source_repo: "https://github.com/Deltares/Delft3D"

inputs:
  forcing:
    - name: "wind_speed"
      symbol: "Ws"
      unit: "m/s at 10m"
      valid_range: [0, 80]
      trap: "Height adjustment needed if not at 10m"
    - name: "wind_direction"
      symbol: "Wd"
      unit: "degrees from N (nautical FROM convention)"
      valid_range: [0, 360]
      trap: "Must be FROM direction, not TO. 180 deg error reverses storm surge"
    - name: "atmospheric_pressure"
      symbol: "P_atm"
      unit: "Pa"
      valid_range: [87000, 108000]
      trap: "Must be Pa, NOT hPa. Multiply by 100 if hPa. Silent 10cm error if wrong"
    - name: "air_temperature"
      symbol: "T_air"
      unit: "degC"
      valid_range: [-50, 60]
    - name: "relative_humidity"
      symbol: "RH"
      unit: "percent (0-100)"
      valid_range: [0, 100]
      trap: "NOT fraction 0-1. Multiply by 100 if fraction"
    - name: "cloud_cover"
      symbol: "Fc"
      unit: "fraction (0-1)"
      valid_range: [0, 1]
      trap: "NOT percentage 0-100. Divide by 100 if percentage"
    - name: "shortwave_radiation"
      symbol: "Q_sw"
      unit: "W/m2"
      valid_range: [0, 1400]
    - name: "precipitation"
      symbol: "Rain"
      unit: "mm/hr"
      valid_range: [0, 300]
      trap: "NOT m/day"
    - name: "river_discharge"
      symbol: "Q"
      unit: "m3/s"
      valid_range: [0, 500000]
    - name: "water_level_boundary"
      symbol: "s1"
      unit: "m (MSL)"
      valid_range: [-10, 10]
      trap: "Sign convention relative to MSL"

  bathymetry:
    - name: "bathymetry"
      symbol: "z_b"
      unit: "m (positive down for Delft3D)"
      valid_range: [0, 11000]
      trap: "GEBCO is positive-up (elevation). MUST negate for Delft3D"

  parameters:
    critical:
      - name: "chezy_friction"
        symbol: "C"
        unit: "m^0.5/s"
        valid_range: [20, 100]
        default: 65
        description: "Bottom friction (Chezy). Higher = smoother. UnifFrictType=0"
      - name: "manning_friction"
        symbol: "n"
        unit: "s/m^(1/3)"
        valid_range: [0.01, 0.10]
        default: 0.025
        description: "Bottom friction (Manning). Higher = rougher. UnifFrictType=1"
        trap: "Chezy and Manning are inversely related. Wrong type = extreme friction"
      - name: "horizontal_viscosity"
        symbol: "Vicouv"
        unit: "m2/s"
        valid_range: [0.1, 100]
        default: 2
        description: "Horizontal eddy viscosity"
      - name: "horizontal_diffusivity"
        symbol: "Dicouv"
        unit: "m2/s"
        valid_range: [1, 1000]
        default: 10
        description: "Horizontal diffusivity for tracers"
      - name: "CFL_max"
        symbol: "CFLMax"
        unit: "dimensionless"
        valid_range: [0.1, 1.0]
        default: 0.7
        description: "Maximum Courant number for time stepping"
      - name: "timestep_max"
        symbol: "DtMax"
        unit: "seconds"
        valid_range: [0.1, 300]
        default: 30
        description: "Maximum computational timestep"
      - name: "vertical_layers"
        symbol: "Kmx"
        unit: "count"
        valid_range: [0, 100]
        default: 0
        description: "Number of vertical sigma/z layers (0 = 2D depth-averaged)"
      - name: "latitude"
        symbol: "AngLat"
        unit: "degrees"
        valid_range: [-90, 90]
        description: "Latitude for Coriolis calculation"
      - name: "water_density"
        symbol: "Rhow"
        unit: "kg/m3"
        valid_range: [990, 1040]
        default: 1025
        description: "Reference water density"

outputs:
  primary:
    - name: "water_level"
      symbol: "s1"
      unit: "m"
      valid_range: [-15, 15]
      file: "_map.nc, _his.nc"
    - name: "velocity_x"
      symbol: "ucx"
      unit: "m/s"
      valid_range: [-10, 10]
      file: "_map.nc"
    - name: "velocity_y"
      symbol: "ucy"
      unit: "m/s"
      valid_range: [-10, 10]
      file: "_map.nc"
    - name: "water_depth"
      symbol: "waterdepth"
      unit: "m"
      valid_range: [0, 11000]
      file: "_map.nc"
    - name: "discharge"
      symbol: "q1"
      unit: "m3/s"
      valid_range: [-1e6, 1e6]
      file: "_map.nc"
    - name: "salinity"
      symbol: "sa1"
      unit: "PSU"
      valid_range: [0, 45]
      file: "_map.nc"
    - name: "temperature"
      symbol: "tem1"
      unit: "degC"
      valid_range: [-2, 40]
      file: "_map.nc"
    - name: "bed_shear_stress"
      symbol: "taus"
      unit: "N/m2"
      valid_range: [0, 100]
      file: "_map.nc"
    - name: "significant_wave_height"
      symbol: "hwav"
      unit: "m"
      valid_range: [0, 25]
      file: "_map.nc"
      notes: "From coupled D-Waves (SWAN)"

  file_formats:
    map: "_map.nc (NetCDF4, CF+UGRID conventions, spatial fields at intervals)"
    history: "_his.nc (NetCDF4, time series at observation points)"
    restart: "_rst.nc (NetCDF4, model state for restart)"

known_issues:
  - id: "dt_001"
    description: "Bathymetry sign convention differs between engines and data sources"
    severity: "critical"
    symptom: "Model sees ocean as mountains, crashes or produces nonsense"
  - id: "dt_002"
    description: "Atmospheric pressure must be Pa, not hPa"
    severity: "high"
    symptom: "Silent ~10cm water level offset"
  - id: "dt_003"
    description: "Wind direction must use FROM convention (nautical)"
    severity: "high"
    symptom: "Reversed storm surge direction"
  - id: "dt_007"
    description: "Chezy vs Manning friction type mismatch"
    severity: "critical"
    symptom: "Flow nearly stops (Chezy=0.025 acts as solid wall)"
  - id: "dt_008"
    description: "RefDate + Tunit determines all timing"
    severity: "high"
    symptom: "Simulation 60x too short or too long"
  - id: "dt_009"
    description: "Grid CRS must match coordinate system"
    severity: "high"
    symptom: "Cell areas off by factor of ~10^10"
