entries:
- id: err_001
  timestamp: '2026-03-24T11:57:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s6_execution
  failure_domain: parameter_format
  symptom:
    description: 'SHAW reads .inp filename from stdin interactively. Must pipe: printf ''file.inp\n\n'' | ./shaw. The second
      newline answers ''overwrite?'' prompt.'
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: Fortran READ(*,*) reads from stdin unit 5. No command-line argument parsing. Interactive prompts for file
      overwrite confirmation.
    explanation: ''
    affected_components: []
  resolution:
    action: Use printf pipe, or echo. The run_shaw.py tool handles this automatically.
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_002
  timestamp: '2026-03-24T11:57:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s1_site_setup
  failure_domain: path_and_filesystem
  symptom:
    description: Distribution .inp files have Windows backslash paths. Linux Fortran interprets backslash as escape character
      or literal, not path separator. Files not found.
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: Shaw303.zip was packaged on Windows. All .inp path references use backslash. Linux requires forward slash.
    explanation: ''
    affected_components: []
  resolution:
    action: 'Replace all backslashes with forward slashes in .inp files: sed -i ''s|\\|/|g'' *.inp'
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_003
  timestamp: '2026-03-24T12:35:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s1_site_setup
  failure_domain: parameter_format
  symptom:
    description: SHAW crashes reading .sit file with 'unexpected data' when MCANFLG=0 but root distribution line is present.
      Fortran READ reads the root fractions even though canopy flag says no canopy.
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: When MCANFLG=0 (no canopy), SHAW skips canopy parameter reads but the file cursor must also skip the root
      distribution line. If the line is present, subsequent soil reads are shifted, causing crash or garbage values.
    explanation: ''
    affected_components: []
  resolution:
    action: When MCANFLG=0, do NOT include the root distribution line (RTDP values) in .sit file. Only include it when MCANFLG>=1.
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_004
  timestamp: '2026-03-24T12:35:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s1_site_setup
  failure_domain: parameter_format
  symptom:
    description: SHAW crashes when NSALT=0 but soil lines include ASALT and DISPER columns. Extra columns shift the Fortran
      fixed-format READ.
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: 'SHAW .sit soil lines have variable column count depending on NSALT flag. If NSALT=0 (no solute), each soil
      line must have exactly: depth, sand%, silt%, clay%, organic%, rock%, bulk_density, Ksat, b_or_alpha, psi_e. Adding ASALT/DISPER
      columns causes misread.'
    explanation: ''
    affected_components: []
  resolution:
    action: Match column count to NSALT. If NSALT=0, omit ASALT and DISPER from soil lines.
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_005
  timestamp: '2026-03-24T12:35:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s2_weather_prep
  failure_domain: parameter_format
  symptom:
    description: SHAW crashes with EOF error at end of simulation year. Weather file has exactly 8760 hourly records but SHAW
      reads one extra record for boundary condition.
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: SHAW reads ahead by one timestep for interpolation. If weather file has exactly N_hours records, SHAW hits
      EOF at the last timestep. Need N_hours+24 records (one extra day padding).
    explanation: ''
    affected_components: []
  resolution:
    action: Pad weather file with 24 extra hours of repeated last-day values. The convert_forcing_to_shaw.py tool handles
      this automatically.
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_006
  timestamp: '2026-03-24T12:35:56Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s6_execution
  failure_domain: calibration
