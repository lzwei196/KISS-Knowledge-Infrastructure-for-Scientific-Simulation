    width_m, slope, manning_n before rerunning python3 tools/s1_installation/verify_dlbreach.py --json.
  severity: fatal
- id: dt_024
  symptom: The run completes but final breach bottom width stops at an unexpectedly small value compared
    with the dam geometry.
  diagnosis: dag.yaml safety.hazards states Embankment_Length is the maximum breach bottom width, not
    the crest length. tools/s2_dam_properties/create_dam_geometry.py also warns when length_m is smaller
    than the computed trapezoid base_width_m.
  remedy: Compute base_width_m with create_dam_geometry.py, set --length_m to the intended maximum breach
    bottom width, and verify the generated Embankment_Length card before assembly.
  severity: degraded
- id: dt_025
  symptom: casename.out contains NaN, Inf, oscillating discharge, or the model crashes during rapid breach
    growth.
  diagnosis: dag.yaml safety.hazards documents timestep_too_large_instability for DLBreach's explicit
    forward-Euler time loop. The KI recommends 0.1-1 s for lab cases and 1-5 s for field cases, with smaller
    steps for very large dams.
  remedy: Reduce Time_Step, rerun run_dlbreach.py, and compare peak_breach_q_m3s and peak_time_hr against
    a second run at half the time step before accepting the result.
  severity: fatal
- id: dt_026
