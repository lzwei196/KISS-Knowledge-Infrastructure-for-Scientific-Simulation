validation:
  tier: "synthetic"
  tier_justification: "Ran built-in quickstart demo with Oxford land forcing data. Compared normalized flow patterns against observed Thames flow (NRFA 39008). Pattern correlation R=0.71 daily, R=0.77 monthly. Model not calibrated — demo scale vs real scale. Pipeline test with pattern comparison."
  test_case: "Quickstart demo with Oxford land forcing and Thames observed flow"
  metrics:
    pearson_R_daily: 0.7071
    pearson_R_monthly: 0.7719
    mean_flow_m3d: 6.863
    negative_flows: 0
    n_timesteps: 1456

