safety:
  hazards:
    - id: "corg_percent_vs_fraction"
      kind: "soil_semantic"
      description: "Soil organic carbon supplied as percent instead of mass fraction inflates the initial C pool ~100x and silently inflates CO2 emissions 10-100x."
      severity: "silent"
    - id: "temperature_kelvin_read_as_celsius"
      kind: "weather_file_semantic"
      description: "climate.txt temperature in Kelvin is read as Celsius: no snow, extreme ET, all temperature-dependent biogeochemistry wrong. Detect via tavg>100."
      severity: "silent"
    - id: "ndep_g_m2_vs_kgN_ha"
      kind: "weather_file_semantic"
      description: "N deposition in g/m2/yr instead of kgN/ha/yr adds 10x spurious N input and silently inflates N2O / breaks the N budget."
      severity: "silent"
    - id: "precip_not_summed_to_daily"
      kind: "weather_file_semantic"
      description: "Sub-daily precipitation not summed to a daily total leaves daily precip ~1/8 of true, producing a near-drought simulation."
      severity: "silent"
    - id: "climate_txt_not_tab_or_bad_header"
      kind: "parser_semantic"
      description: "climate.txt that is comma/space-separated instead of tab, or whose header column names don't match LDNDC's expected names, fails at init with 'Error reading climate data' / 'Unexpected column count' (dt_006)."
      severity: "fatal"
    - id: "species_name_mismatch_or_abstract_base"
      kind: "coefficient_runtime_silent_fallback"
      description: "Sowing species name not an exact case-sensitive leaf-node match (or an abstract base like RICE) is silently skipped, giving zero yield and zero emissions."
      severity: "silent"
    - id: "ksat_unit_cm_per_min"
      kind: "soil_semantic"
      description: "Saturated conductivity (sks) expected in cm/min; mm/hr or m/day left unconverted gives ~600x too-fast drainage."
      severity: "silent"
    - id: "tillage_depth_meters"
      kind: "control_semantic"
      description: "Tillage depth is in meters; a cm value (25) is read as tens of metres, incorporating residue far too deep."
      severity: "silent"
    - id: "zero_or_negative_bulk_density_segfault"
      kind: "soil_semantic"
      description: "Zero/negative bulk density or zero-thickness layer drives negative porosity (1 - bd/2.65) and segfaults during soil initialization with no helpful message."
      severity: "fatal"
    - id: "malformed_site_xml"
      kind: "soil_semantic"
      description: "Unclosed tags, missing required soil attributes, or non-monotonic layer depths in site.xml cause an XML parse / 'invalid soil layer' crash at init."
      severity: "fatal"
    - id: "unknown_or_miscased_module"
      kind: "control_semantic"
      description: "setup.xml module name absent in this version or wrongly capitalized raises 'Unknown module / Module not registered' at init."
      severity: "fatal"
    - id: "module_stack_ecosystem_mismatch"
      kind: "control_semantic"
      description: "A kernel stack that doesn't match the ecosystem (e.g. forest physiology with cropland management, or aerobic metrx for a flooded paddy) gives nonsensical output or a first-timestep segfault."
      severity: "fatal_or_silent"
    - id: "event_date_out_of_schedule"
      kind: "control_semantic"
      description: "Management event dates outside the project.xml schedule (or non-ISO format) raise 'Invalid event date' fatal error."
      severity: "fatal"
    - id: "metrx_solver_nan_or_epsilon_negative_o2"
      kind: "numerical_instability"
      description: "Extreme soil/precip inputs cause NaN propagation; separately, a floating-point epsilon-negative O2 can trip the MeTrx mass-balance bounds check after many valid years (degraded, not a true physical error)."
      severity: "degraded"
    - id: "paddy_missing_flood_drain_events"
      kind: "control_semantic"
      description: "Paddy management without explicit flood/drain events never establishes the ponded water layer, producing no CH4 and an unrealistic water balance."
      severity: "fatal_or_silent"
  validation_limits:
    - "Crop yields are not reliably usable without species GDD/phenology calibration."
    - "Default aerobic dryland kernel stack (physiology:plamox + soilchemistry:metrx) cannot simulate flooded anaerobic paddies; a paddy-capable stack is required for rice CH4."
    - "No native lateral/distributed routing; cells are independent 1-D columns synchronized only in time."
    - "Daily forcing timestep cannot resolve genuinely sub-daily process variability beyond the model's internal sub-stepping."
  warnings:
    - "dN_n2o_emis is reported as kgN/ha; comparison to gN2O literature requires x1000 x(44/28)."
    - "yield is reported as kgC/ha; convert to dry matter (x~2.0, ~45% C)."
    - "Annual N budgets only close (<5% residual) when fixation, NH3 volatilization and NO terms are summed across both the soilchemistry and physiology outputs."
    - "Absolute N2O is sensitive to phenology (DVS) maturity; relative change is more robust than the absolute level."
  assumptions:
    - statement: "The simulation is a 1-D vertical soil-vegetation-atmosphere column; regional runs are many such columns synchronized in time with no native lateral mass exchange."
      scope: "spatial geometry / coupling"
      source: "LandscapeDNDC Models Description v1.37.0 (Synopsis), ldndc.imk-ifu.kit.edu/products/ldndc-models-description.pdf"
      status: "adopted"
    - statement: "Coupled C, N and water budgets are closed by mass balance across the MoBiLE substates (shipped tolerance 1.0e-09; documented residual target <5%); surface energy is computed but not maintained as a standalone closed energy budget."
      scope: "conservation / closure"
      source: "Models Description v1.37.0 budget sections; ldndc.conf default balance tolerance"
      status: "adopted"
    - statement: "All precipitation is treated as snow when air temperature is below TLIMIT=0 degC, melting above it (SnowDNDC)."
      scope: "water-cycle phase partitioning"
      source: "Models Description v1.37.0 Section 1.4.4.4 (SnowDNDC), page 43"
      status: "adopted"
    - statement: "The deployed runnable kernel stack is the dryland-crop configuration microclimate:canopyecm / watercycle:watercycledndc / airchemistry:airchemistrydndc / physiology:plamox / soilchemistry:metrx; other kernels shipped in the binary (e.g. psim, grasslanddndc, dndc soilchemistry, oryza2000, echy) are selectable but out of scope for this dag.yaml."
      scope: "implementation / module selection"
      source: "setup.xml <modulelist> and module ids registered in bin/ldndc; Models Description Ch.1 (MoBiLE substates)"
      status: "adopted"
    - statement: "Layer-specific soil type is determined only when clay+sand+silt sums to ~1.0; otherwise a profile-wide soil type is used (e.g. for peat soils)."
      scope: "soil-profile interpretation"
      source: "Models Description v1.37.0 Section 1.6 (Soilchemistry initialisation) and climate/soil input docs"
      status: "adopted"

medium_evidence:
  - var: "dN_n2o_emis"
    source: "CAPABILITY_INVENTORY.md"
    quote: "Simulates N2O production from both nitrification (aerobic, NH4 -> NO3 with N2O byproduct) and denitrification (anaerobic, NO3 -> N2 with N2O intermediate). Production depends on soil moisture (anaerobic volume fraction -- anvf), temperature, NH4/NO3 availability, and labile C."
    note: "N2O production is tied to soil moisture and soil N transformations."
  - var: "dN_no_emis"
    source: "CAPABILITY_INVENTORY.md"
    quote: "NO production from chemodenitrification (abiotic, acid soils) and as a byproduct of nitrification. Important for atmospheric chemistry (ozone precursor)."
    note: "NO is produced in soils and emitted to atmospheric chemistry."
  - var: "dC_ch4_emis"
    source: "CAPABILITY_INVENTORY.md"
    quote: "CH4 production in anaerobic soil zones (methanogenesis) minus CH4 oxidation in aerobic zones (methanotrophy). Net emission depends on water table depth and soil anaerobic volume."
    note: "CH4 production and oxidation are soil-zone processes with net emission."
  - var: "dN_no3_leach"
    source: "SKILL.md"
    quote: "**Nutrient leaching**: NO3, NH4, dissolved organic N leaching to groundwater"
    note: "NO3 leaching is a groundwater-directed nutrient leaching output."
  - var: "yield"
    source: "SKILL.md"
    quote: "**Crop/vegetation growth**: GPP, NPP, yield, LAI, biomass allocation via PlaMox or PSIM modules"
    note: "Yield is a crop/vegetation growth output."
  - var: "lai"
    source: "CAPABILITY_INVENTORY.md"
    quote: "Tracks LAI from emergence through senescence. Drives light interception, transpiration, and canopy microclimate."
    note: "LAI belongs to the canopy/vegetation medium."
