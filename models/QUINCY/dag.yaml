safety:
  hazards:
    - id: "temperature_in_kelvin"
      kind: weather_file_semantic
      description: "Air temperature left in Kelvin instead of deg C explodes the Arrhenius (T-Tref) terms, silently inflating GPP and Rh (monthly GPP >50 umol/m2/s). (dt_quincy_001)"
      severity: fatal
    - id: "precip_kg_m2_s_not_mm_day"
      kind: weather_file_semantic
      description: "Precipitation left in kg/m2/s instead of mm/day is ~86400x too small, driving the bell-shaped moisture scalar to zero and shutting down heterotrophic respiration (Rh~0, NEE strongly negative). (dt_quincy_002)"
      severity: fatal
    - id: "precip_subdaily_not_summed"
      kind: weather_file_semantic
      description: "Sub-daily precipitation (e.g., mm/3hr) used as a single step instead of summing 8 makes precip ~8x too small, distorting the Rh moisture response. (dt_quincy_002)"
      severity: degraded
    - id: "vpd_wrong_pressure_unit"
      kind: weather_file_semantic
      description: "VPD supplied in kPa or Pa instead of hPa distorts the Ci/Ca surrogate, opening/closing the stomatal effect wrongly and giving summer GPP that looks like extreme drought. (dt_quincy_003)"
      severity: silent
    - id: "co2_mole_fraction_not_ppm"
      kind: weather_file_semantic
      description: "CO2 supplied as a mole fraction (~0.0004) instead of ppm (~400) drives Farquhar Ci to ~zero, making the Rubisco-limited rate negligible and GPP near zero. (dt_quincy_020)"
      severity: silent
    - id: "missing_value_sentinel_not_replaced"
      kind: weather_file_semantic
      description: "FLUXNET2015 -9999 sentinel not replaced with NaN corrupts means (T~-2000 deg C) and propagates NaN through all fluxes. (dt_quincy_006)"
      severity: fatal
    - id: "fluxnet_subset_column_names"
      kind: parser_semantic
      description: "FLUXNET2015 SUBSET column suffixes (e.g., SW_IN_F_MDS, TA_ERA) differ from expected FULLSET names, raising a KeyError when reading forcing. (dt_quincy_005)"
      severity: fatal
    - id: "n_leaf_ref_wrong_mass_unit"
      kind: coefficient_runtime_silent_fallback
      description: "n_leaf_ref in kgN/m2 or mgN/m2 instead of gN/m2 collapses vcmax25_eff = vcmax_n_slope*leaf_N, silently dropping GPP to 20-50% of expected. (dt_quincy_004)"
      severity: silent
    - id: "activation_energy_kJ_not_J"
      kind: coefficient_runtime_silent_fallback
      description: "ea_vcmax/ea_jmax/ea_rd in kJ/mol instead of J/mol make the Arrhenius exponent 1000x too small, flattening the temperature response of photosynthesis. (dt_quincy_018)"
      severity: silent
    - id: "cn_leaf_as_reciprocal"
      kind: coefficient_runtime_silent_fallback
      description: "cn_leaf entered as an N:C ratio (e.g., 0.025) instead of C:N (gC/gN) silently breaks stoichiometric consistency. (dt_quincy_016)"
      severity: silent
    - id: "lai_min_equals_lai_max"
      kind: control_semantic
      description: "lai_min set equal to (or near) lai_max removes the Gaussian-temperature LAI seasonality, so simulated GPP loses its seasonal cycle. (dt_quincy_007)"
      severity: silent
    - id: "lai_t_opt_above_site_range"
      kind: control_semantic
      description: "lai_t_opt set far above the site temperature range means the Gaussian LAI response never fires and LAI stays at lai_min year-round. (dt_quincy_022)"
      severity: degraded
    - id: "vcmax25_too_high_for_pft"
      kind: coefficient_runtime_silent_fallback
      description: "Vcmax25 too high for the PFT (or N-limitation effectively disabled via a very high n_leaf_ref) overestimates GPP 2-3x with the seasonal pattern preserved. (dt_quincy_008)"
      severity: silent
    - id: "rh_q10_or_base_too_high"
      kind: coefficient_runtime_silent_fallback
      description: "rh_q10 too high (3-4 vs 2.0) or rh_base too large exponentially inflates Rh in warm months, pushing Reco/GPP out of range and flipping NEE to a net source. (dt_quincy_009)"
      severity: degraded
    - id: "jmax_vcmax_ratio_too_high"
      kind: coefficient_runtime_silent_fallback
      description: "jmax_vcmax_ratio >3 or alpha_j >0.5 makes the RuBP-regeneration rate (Wj) never limiting, so GPP loses light sensitivity. (dt_quincy_010)"
      severity: silent
    - id: "rh_precip_response_inverted"
      kind: coefficient_runtime_silent_fallback
      description: "rh_precip_scale with the wrong sign or rh_precip_opt=0 inverts the bell-shaped moisture response so decomposition peaks in dry months. (dt_quincy_024)"
      severity: degraded
    - id: "g1_bb_too_high_energy_imbalance"
      kind: coefficient_runtime_silent_fallback
      description: "An over-large stomatal-slope-driven conductance inflates LE >300 W/m2, driving the residual sensible heat H negative and breaking the energy partition. (Note: g1_bb itself is not consumed by the analytic assimilation routine; see warnings.) (dt_quincy_013)"
      severity: degraded
    - id: "arrhenius_overflow_extreme_T"
      kind: numerical_instability
      description: "Extreme temperature (>60 or <-60 deg C) from bad forcing overflows the Vcmax/Jmax Arrhenius exp(), returning Inf and propagating NaN from that month onward. (dt_quincy_011)"
      severity: fatal_or_silent
    - id: "nee_sign_convention_flip"
      kind: parser_semantic
      description: "Computing NEE as GPP-Reco instead of Reco-GPP flips the sign relative to the FLUXNET convention, producing apparent carbon-balance non-closure. (dt_quincy_012)"
      severity: silent
    - id: "daylength_scaling_omitted"
      kind: control_semantic
      description: "Omitting the day-fraction (daylength/24) scaling leaves instantaneous daytime GPP compared against a 24-h eddy-covariance mean, inflating GPP ~2x. (dt_quincy_014)"
      severity: silent
    - id: "latitude_hemisphere_sign"
      kind: control_semantic
      description: "Site latitude entered with the wrong hemisphere sign swaps the solar-declination daylength, shifting the GPP seasonal peak by ~6 months. (dt_quincy_021)"
      severity: degraded
    - id: "output_delimiter_column_shift"
      kind: parser_semantic
      description: "A delimiter mismatch (tab vs comma) when parsing the output CSV misaligns rows, so columns are silently shifted (GPP holds NEE, etc.). (dt_quincy_025)"
      severity: silent
  validation_limits:
    - "Point-scale (0-D) only: no spatial coupling, lateral transport, or distributed routing."
    - "Monthly effective timestep: cannot resolve diurnal or sub-daily processes (the upstream QUINCY runs half-hourly)."
    - "Default parameters are boreal-ENF (Scots pine) specific; uncalibrated application to other PFTs/biomes is unreliable without recalibration."
    - "No realized phosphorus limitation: P stoichiometry is tracked but does not constrain productivity, so P-limited (e.g., tropical) sites are not represented."
    - "Validated as 'real-data' at a single boreal site (FLUXNET2015 monthly); generalization beyond that is unestablished."
  warnings:
    - "The documented Ball-Berry conductance (g1_bb) is declared and range-checked but not consumed by the analytic assimilation routine; the Ci/Ca effect is realized by a VPD-linear surrogate, so g1_bb-based tuning has no direct effect on GPP in this implementation."
    - "Respiration is diagnostic and coupled to instantaneous GPP (Ra via npp_approx = gpp - r_maint, Rh via a temperature x moisture response); there are no explicit C-N-P pools, so annual (GPP-Reco) is not guaranteed to equal cumulative NEE."
    - "Energy balance is not closed: LE is diagnosed from GPP via a fixed water-use efficiency and H is the Rn-LE residual, so H inherits all LE/Rn errors."
    - "Without leaf-N data the model falls back to reference N values; the N-control on photosynthesis then reflects defaults, not site conditions."
    - "Early years (first 1-2) can be biased by a respiration spin-up transient when initial decomposition terms are far from equilibrium; discard or add spin-up for short runs."
  assumptions:
    - statement: "The model represents a 0-D single-column point ecosystem with no lateral exchange."
      scope: "spatial geometry of all fluxes and states"
      source: "Thum et al. 2019 (GMD 12, 4781-4802), stand-alone site application; analytic reimplementation single-column structure"
      status: adopted
    - statement: "NEE follows the micrometeorological sign convention, NEE = Reco - GPP (positive = net source to atmosphere)."
      scope: "NEE output and any obs comparison"
      source: "QUINCY documentation and FLUXNET sign convention"
      status: adopted
    - statement: "QUINCY's coupled-nitrogen control on photosynthesis is realized here only as an upper cap, vcmax25_eff = min(vcmax_n_slope*leaf_N, vcmax25), rather than the full optimality-based N-allocation scheme."
      scope: "photosynthesis / N-limitation behavior"
      source: "Caldararu et al. 2020 (New Phytologist, 10.1111/nph.16320) optimality N-use-efficiency scheme vs the analytic reimplementation"
      status: adopted
    - statement: "Phosphorus is tracked stoichiometrically (cp_leaf, np_leaf) but does not limit productivity in this implementation."
      scope: "nutrient limitation; tropical / P-limited applicability"
      source: "Yu et al. 2020 (New Phytologist, 10.1111/nph.16538); QUINCY P scheme not realized in the analytic version"
      status: adopted
    - statement: "Mass and energy balance are not enforced; respiration is diagnostic and surface energy is partitioned as a residual, not closed."
      scope: "carbon/energy conservation interpretation of the analytic surrogate"
      source: "QUINCY analytic reimplementation core (calc_reco / calc_energy_fluxes structure) vs Thum et al. 2019 mass-balanced formulation"
      status: adopted
