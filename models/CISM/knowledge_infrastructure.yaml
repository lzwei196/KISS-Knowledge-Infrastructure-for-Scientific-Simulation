# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: CISM
  language: fortran
  implementation:
    id: cism-driver-v21
    version: '2.1'
    provenance: Fortran 90/95; CESM Land Ice Working Group cism_driver executable (Glide SIA + Glissade
      higher-order dycores), netCDF/CF I/O.
  scientific_reference_version: CISM 2.1 (Lipscomb et al. 2019, GMD; documentation dated 2018-06-17)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/CISM/source/repo/builds/mpi/cism_driver/cism_driver
    type: work_dir
pipeline:
  stages:
  - s0_configuration
  - s1_input_generation
  - s2_forcing_preparation
  - s3_config_generation
  - s4_execution
  - s5_output_parsing
  - s6_validation
  - s7_troubleshooting
tools:
  count: 5
  files:
  - tools/convert_forcing_to_cism.py
  - tools/generate_cism_config.py
  - tools/generate_input_nc.py
  - tools/parse_cism_output.py
  - tools/run_cism.py
inputs:
  forcing:
  - name: acab (surface mass balance)
    unit: m/yr ice equivalent
  - name: artm (annual mean surface air temperature)
    unit: deg C
  - name: Glint climate fields (temp, prcp, arng)
    unit: deg C; m water/yr; deg C
  parameters:
  - name: default_flwa (Glen flow-law rate factor A)
    unit: Pa^-n s^-1
  - name: flow_enhancement_factor
    unit: dimensionless
  - name: beta (basal traction coefficient)
    unit: Pa yr/m
  - name: btrac_const (uniform basal friction)
    unit: Pa yr/m
  - name: tauf / mintauf (basal yield stress)
    unit: Pa
  - name: geothermal / bheatflx (basal geothermal heat flux)
    unit: W/m^2
  - name: ice_limit (minimum ice thickness for dynamics)
    unit: m
  - name: lapse_rate (atmospheric temperature lapse rate)
    unit: deg C / m
  initial_conditions:
  - name: thk (initial ice thickness)
    unit: m
  - name: topg (bedrock topography)
    unit: m
  - name: usurf (initial upper surface elevation)
    unit: m
  - name: temp (initial 3-D ice temperature)
    unit: deg C
  - name: relx (relaxed bedrock topography)
    unit: m
  - name: uvel/vvel (restart velocity fields)
    unit: m/yr
  boundary_conditions:
  - name: dycore
    unit: enum
  - name: which_ho_approx
    unit: enum
  - name: which_ho_babc (basal boundary condition)
    unit: enum
  - name: which_ho_sparse (linear solver)
    unit: enum
  - name: which_ho_nonlinear (nonlinear iteration)
    unit: enum
  - name: temperature (thermal mode)
    unit: enum
  - name: flow_law
    unit: enum
  - name: evolution (thickness scheme)
    unit: enum
  - name: marine_margin (calving scheme)
    unit: enum
  - name: isostasy
    unit: enum
  - name: basal_water
    unit: enum
  - name: grid geometry (ewn, nsn, upn, dew, dns)
    unit: count; m
  - name: time control (tstart, tend, dt, ntem)
    unit: yr; yr; yr; count
  - name: kinbcmask (velocity Dirichlet mask)
    unit: 0/1
  - name: eus (eustatic sea level)
    unit: m
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - thk
  - usurf
  - velnorm
  - uvel
  - temp
  - bmlt
  - ivol
  - imass / imass_above_flotation
  - iarea / iareag / iareaf
  - calving_flux / gl_flux
  other: []
validation:
  tier: tested
  tier_justification: 'measured: NSE=0.999, KGE=0.993, R=1.000, 2 scorecard(s)'
  metrics:
    best_nse: 0.99943
    best_kge: 0.99293
    best_r: 0.99975
summary:
  total_tools: 5
  total_stage_docs: 8
  total_diagnostic_triplets: 21
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
