# ============================================================================
# HEC-HMS Diagnostic Triplets
# ============================================================================
# 18 diagnostic triplets covering 6 failure domains.
# Generated during HEC-HMS knowledge dissection for HydroCraft platform.
# ============================================================================

# --- Unit Conversion (HIGHEST PRIORITY — Silent Errors) ---

- id: dt_101
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Simulated discharge is 24x too high. Massive flood every day regardless of season."
    error_pattern: "discharge spike"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Precipitation in mm/day passed to hourly timestep without dividing by 24"
    explanation: >
      CMFD provides daily precipitation in mm/day. If the model runs at hourly timestep,
      each hour receives the full daily amount instead of 1/24th. Total precipitation
      becomes 24x too large, producing unrealistic runoff.
    affected_components: [convert_forcing_to_hms, run_hec_hms]
  remedy:
    action: "Divide daily precipitation by number of timesteps per day when using sub-daily interval"
    tool_to_run: convert_forcing_to_hms
    manual_steps:
      - "Check if model timestep matches forcing timestep"
      - "If forcing is daily and model is hourly: P_hr = P_day / 24"
      - "Verify total annual precipitation is 400-2000 mm for most basins"
    prevention: "convert_forcing_to_hms validates annual totals against expected range"
  severity: silent
  cross_references: [dt_108, dt_114]

- id: dt_102
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "PET is extremely high (>100 mm/day). No snow accumulation even in winter. Unrealistic water balance."
    error_pattern: "extreme evaporation"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Temperature in Kelvin instead of Celsius for PET calculation"
    explanation: >
      CMFD temperature is in Kelvin (typically 260-310 K). Hargreaves or Priestley-Taylor
      PET formulas expect Celsius. Passing 293 K as 293°C yields astronomical PET values,
      draining all soil moisture and producing zero runoff.
    affected_components: [convert_forcing_to_hms]
  remedy:
    action: "Subtract 273.15 from CMFD temperature before PET calculation"
    tool_to_run: convert_forcing_to_hms
    manual_steps:
      - "Check temperature range in forcing CSV — should be -30 to +45°C"
      - "If values > 200, they are in Kelvin — subtract 273.15"
    prevention: "convert_forcing_to_hms checks for T > 100 and auto-converts"
  severity: silent
  cross_references: [dt_101]

- id: dt_108
  stage: s7_postprocess
  failure_domain: unit_conversion
  symptom:
    description: "Discharge is 10^6 too large or too small. Clearly wrong magnitude."
    error_pattern: "magnitude error"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Basin area in m² instead of km² (or vice versa) in runoff-to-discharge conversion"
    explanation: >
      Converting runoff depth (mm) to discharge (m³/s) requires:
      Q = runoff_mm * area_km2 * 1000 / 86400. If area is accidentally in m²
      (e.g., from shapefile area calculation), the result is 10^6 too large.
    affected_components: [run_hec_hms, parse_hms_output]
  remedy:
    action: "Verify basin area units. Shapefile .area returns m² — divide by 1e6 for km²"
    tool_to_run: parse_hms_output
    manual_steps:
      - "Check basin area: Bengbu should be ~121,330 km²"
      - "If using geopandas: area_km2 = gdf.to_crs(epsg=6933).area.sum() / 1e6"
    prevention: "run_hec_hms prints basin area and checks against expected range"
  severity: silent
  cross_references: [dt_101, dt_114]

- id: dt_110
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "PET values unrealistically high or low. Seasonal cycle absent."
    error_pattern: "PET magnitude"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Radiation in W/m² not converted to MJ/m²/day for Priestley-Taylor PET"
    explanation: >
      CMFD shortwave radiation is in W/m². Priestley-Taylor PET expects net radiation
      in MJ/m²/day. Conversion: MJ/m²/day = W/m² × 0.0864. Omitting this conversion
      gives PET ~12x too large (since 1 MJ ≈ 11.6 W·day).
    affected_components: [convert_forcing_to_hms]
  remedy:
    action: "Multiply W/m² by 0.0864 to get MJ/m²/day before PET calculation"
    tool_to_run: convert_forcing_to_hms
    manual_steps:
      - "Check radiation values — W/m² range: 0-400; MJ/m²/day range: 0-35"
    prevention: "convert_forcing_to_hms applies conversion automatically"
  severity: silent
  cross_references: [dt_102]

- id: dt_114
  stage: s7_postprocess
  failure_domain: unit_conversion
  symptom:
    description: "Simulated discharge looks reasonable in shape but magnitude is wrong by factor of ~1000/86400"
    error_pattern: "wrong scale"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Runoff mm to m³/s conversion missing the 1000 or 86400 factor"
    explanation: >
      The correct conversion is Q(m³/s) = runoff(mm) × area(km²) × 1000 / 86400.
      The 1000 converts mm·km² to m³ (1 mm on 1 km² = 1000 m³).
      The 86400 converts per-day to per-second. Missing either factor gives
      wrong magnitude with correct temporal pattern.
    affected_components: [run_hec_hms, parse_hms_output]
  remedy:
    action: "Use Q = runoff_mm * area_km2 * 1000 / 86400 exactly"
    tool_to_run: parse_hms_output
    manual_steps:
      - "For Bengbu (121,330 km²): 1 mm/day runoff ≈ 1404 m³/s"
      - "Mean annual runoff ~200-300 mm → mean Q ~300-500 m³/s"
    prevention: "parse_hms_output validates discharge magnitude against expected range"
  severity: silent
  cross_references: [dt_108]

- id: dt_118
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "ET is ~30x too high or too low. Monthly PET values used as daily."
    error_pattern: "PET timing"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Monthly average PET (mm/month) used directly as daily PET (mm/day)"
    explanation: >
      HEC-HMS Monthly Average ET expects values in mm/month. If these are divided by
      days-in-month to get daily values but then the model internally divides again,
      ET is ~30x too low. Conversely, if daily PET is passed as monthly, ET is 30x too high.
    affected_components: [convert_forcing_to_hms]
  remedy:
    action: "Verify PET units match the method. Monthly Average expects mm/month. Priestley-Taylor expects mm/day."
    tool_to_run: convert_forcing_to_hms
    manual_steps:
      - "Monthly PET range: 30-200 mm/month; Daily PET range: 1-8 mm/day"
    prevention: "validate_outputs checks PET range against expected daily/monthly bounds"
  severity: silent
  cross_references: [dt_110]

# --- Parameter Range Errors ---

- id: dt_103
  stage: s2_soil
  failure_domain: parameter_range
  symptom:
    description: "Zero runoff regardless of rainfall amount. Hydrograph is flat at baseflow."
    error_pattern: "zero runoff"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Curve Number is 0, NaN, or below 30 due to failed soil group lookup"
    explanation: >
      SCS Curve Number valid range is 30-100. If the HWSD soil group lookup returns
      no data (ocean, missing tile, or wrong CRS), CN defaults to 0 or NaN.
      With CN=0, S=infinity, and Q=0 for any realistic rainfall.
    affected_components: [convert_soil_to_hms]
  remedy:
    action: "Validate CN is in [30, 100]. If NaN or 0, check HWSD spatial overlap with basin."
    tool_to_run: convert_soil_to_hms
    manual_steps:
      - "Check soil group distribution: A/B/C/D should sum to 100% within basin"
      - "If all NaN: verify basin shapefile CRS matches HWSD CRS (both should be EPSG:4326)"
    prevention: "convert_soil_to_hms validates CN range and warns if < 30"
  severity: silent
  cross_references: [dt_104]

- id: dt_104
  stage: s5_parameters
  failure_domain: parameter_choice
  symptom:
    description: "Simulated runoff volume is significantly less than observed. Model systematically underestimates peaks."
    error_pattern: "volume underestimate"
    detection_method: metric_comparison
  diagnosis:
    root_cause: "Initial abstraction ratio Ia/S = 0.2 (classic) used instead of 0.05 (recommended)"
    explanation: >
      The classic SCS method uses Ia = 0.2*S, meaning 20% of maximum retention must be
      satisfied before runoff begins. USDA research (Woodward et al. 2003) found that
      Ia = 0.05*S better fits most observed data. Using 0.2 in humid basins like Huai River
      can underestimate total runoff by 15-30%.
    affected_components: [run_hec_hms]
  remedy:
    action: "Set Ia_ratio = 0.05 for humid/semi-humid basins. Keep 0.2 only for arid regions."
    tool_to_run: run_hec_hms
    manual_steps:
      - "Compare simulated vs observed annual runoff volume"
      - "If PBIAS < -20%, try reducing Ia_ratio from 0.2 to 0.05"
    prevention: "calibrate_hms.py includes Ia_ratio in calibration parameter space"
  severity: medium
  cross_references: [dt_103]

- id: dt_111
  stage: s2_soil
  failure_domain: parameter_range
  symptom:
    description: "Green-Ampt model produces no infiltration or instant saturation."
    error_pattern: "infiltration extreme"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Suction head or hydraulic conductivity values unrealistic for soil type"
    explanation: >
      Green-Ampt wetting front suction head ranges from 5 cm (sand) to 32 cm (clay).
      Saturated hydraulic conductivity ranges from 0.03 cm/hr (clay) to 11.8 cm/hr (sand).
      Values outside these ranges indicate wrong soil classification or unit errors.
    affected_components: [convert_soil_to_hms]
  remedy:
    action: "Cross-reference soil properties with USDA soil texture triangle"
    tool_to_run: convert_soil_to_hms
    manual_steps:
      - "Check Ksat: sand 11.8 cm/hr, loam 1.3 cm/hr, clay 0.03 cm/hr"
      - "Check suction: sand 5 cm, loam 9 cm, clay 32 cm"
    prevention: "convert_soil_to_hms validates against USDA lookup tables"
  severity: silent
  cross_references: [dt_103]

# --- Numerical / Algorithmic Errors ---

- id: dt_105
  stage: s6_run
  failure_domain: numerical
  symptom:
    description: "Unit hydrograph peak is clipped or poorly resolved. Peak discharge significantly underestimated."
    error_pattern: "UH resolution"
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Computational interval D is too large relative to time-to-peak Tp"
    explanation: >
      SCS UH requires D <= 0.29*Tp for adequate peak resolution. If D > Tp/3,
      the discrete convolution misses the true peak, and the routed hydrograph
      is flattened and delayed.
    affected_components: [run_hec_hms]
  remedy:
    action: "Set D <= Tp/5. For Tp=24hr, use D <= 4.8hr (e.g., D=1hr or D=3hr)"
    tool_to_run: run_hec_hms
    manual_steps:
      - "Check Tp value and compare to model timestep"
      - "If timestep > Tp/3, reduce timestep or increase Tp"
    prevention: "run_hec_hms warns if D > 0.29*Tp"
  severity: medium
  cross_references: [dt_116]

- id: dt_106
  stage: s6_run
  failure_domain: numerical
  symptom:
    description: "Negative discharge values in routed flow. Oscillating hydrograph."
    error_pattern: "negative flow"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Muskingum X > 0.5 or routing timestep violates Courant condition"
    explanation: >
      Muskingum routing coefficients C1, C2, C3 must all be non-negative for stable routing.
      This requires 2*K*X <= dt <= 2*K*(1-X). If X > 0.5, C1 can become negative.
      If dt > 2*K*(1-X), C3 becomes negative, causing oscillations.
    affected_components: [run_hec_hms]
  remedy:
    action: "Constrain X to [0, 0.5]. Verify dt satisfies 2KX <= dt <= 2K(1-X)."
    tool_to_run: run_hec_hms
    manual_steps:
      - "Print C1, C2, C3 — all must be >= 0"
      - "If any negative, adjust K, X, or dt"
    prevention: "run_hec_hms checks Courant condition and warns"
  severity: error
  cross_references: [dt_105]

- id: dt_113
  stage: s6_run
  failure_domain: numerical
  symptom:
    description: "Very small storms produce exactly zero runoff. Only large storms generate flow."
    error_pattern: "threshold effect"
    detection_method: visual_inspection
  diagnosis:
    root_cause: "SCS-CN initial abstraction Ia is larger than most daily precipitation events"
    explanation: >
      With CN=65 and Ia_ratio=0.2: S = 25400/65 - 254 = 136.8 mm; Ia = 0.2*136.8 = 27.4 mm.
      Any rain < 27.4 mm/day produces zero runoff. In areas with many small rain events,
      this eliminates most of the runoff volume.
    affected_components: [run_hec_hms]
  remedy:
    action: "Use Ia_ratio=0.05 to reduce the threshold. Or increase CN if soil/land cover warrants."
    tool_to_run: run_hec_hms
    manual_steps:
      - "Calculate Ia = Ia_ratio * (25400/CN - 254)"
      - "Compare Ia to median daily precipitation"
      - "If Ia > median P, most days produce zero runoff — reduce Ia_ratio or increase CN"
    prevention: "run_hec_hms logs Ia threshold and compares to forcing statistics"
  severity: medium
  cross_references: [dt_104]

# --- Format / Configuration Errors ---

- id: dt_109
  stage: s4_forcing
  failure_domain: format
  symptom:
    description: "Time series shifted by one day. Peaks occur a day early or late compared to observations."
    error_pattern: "time shift"
    detection_method: visual_inspection
  diagnosis:
    root_cause: "DSS midnight convention: 2400 = end of day, not start of next day"
    explanation: >
      HEC-DSS uses 2400 to denote the end of a day (equivalent to 0000 of the next day).
      When converting DSS time series to pandas timestamps, 2400 must be mapped to
      00:00 of the following day. Incorrect handling shifts the entire series by one day.
    affected_components: [convert_forcing_to_hms, parse_hms_output]
  remedy:
    action: "When reading DSS: replace 2400 with 0000 and add 1 day to date"
    tool_to_run: convert_forcing_to_hms
    manual_steps:
      - "Compare forcing timestamps with an independent source"
      - "Check if peaks are consistently offset by 1 day"
    prevention: "Python tools use pandas datetime which avoids DSS convention issues"
  severity: medium
  cross_references: []

- id: dt_112
  stage: s5_parameters
  failure_domain: format
  symptom:
    description: "HEC-HMS run fails with 'No meteorologic model found' or 'Basin model not linked'."
    error_pattern: "model linkage"
    detection_method: error_message
  diagnosis:
    root_cause: "Basin model, meteorologic model, and control specs not properly linked in .run file"
    explanation: >
      HEC-HMS requires a .run file that explicitly links: (1) a basin model name matching
      the .basin file, (2) a meteorologic model name matching the .met file, and
      (3) a control specification name matching the .control file. Mismatched names
      cause a runtime error.
    affected_components: [run_hec_hms]
  remedy:
    action: "Verify that names in .run file exactly match names in .basin, .met, and .control files"
    tool_to_run: run_hec_hms
    manual_steps:
      - "Open .run file — check Basin Model, Met Model, Control names"
      - "Open corresponding files — verify the names match exactly (case-sensitive)"
    prevention: "Python tools bypass native file format by computing directly"
  severity: error
  cross_references: []

- id: dt_115
  stage: s6_run
  failure_domain: runtime
  symptom:
    description: "Model crashes or produces empty output. Error: 'No data for specified period'."
    error_pattern: "period mismatch"
    detection_method: error_message
  diagnosis:
    root_cause: "Simulation period extends beyond available forcing data"
    explanation: >
      If the control specification requests 1980-1990 but forcing data only covers
      1985-1990, the model either crashes or produces NaN for the missing period.
      This is common when CMFD files are partially downloaded.
    affected_components: [run_hec_hms, convert_forcing_to_hms]
  remedy:
    action: "Verify forcing data covers the entire simulation period"
    tool_to_run: convert_forcing_to_hms
    manual_steps:
      - "List available forcing files: ls *_{yyyy}.nc"
      - "Verify continuous coverage from start_date to end_date"
    prevention: "convert_forcing_to_hms validates date range coverage"
  severity: error
  cross_references: []

- id: dt_116
  stage: s5_parameters
  failure_domain: parameter_range
  symptom:
    description: "Peak arrives much too early or too late compared to observations."
    error_pattern: "timing error"
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Lag time (Tp) unrealistic for basin size"
    explanation: >
      SCS lag time depends on basin slope, length, and CN. For large basins like Bengbu
      (121,330 km²), Tp should be on the order of days, not hours. For small urban
      catchments, Tp is typically 0.5-6 hours. Using a small-basin lag time on a large
      basin compresses the hydrograph unrealistically.
    affected_components: [run_hec_hms]
  remedy:
    action: "Estimate Tp from basin characteristics: Tp = L^0.8 * (S+1)^0.7 / (1140 * Y^0.5) [SCS method]"
    tool_to_run: run_hec_hms
    manual_steps:
      - "L = hydraulic length (longest flow path) in feet"
      - "S = (1000/CN) - 10 [inches]"
      - "Y = average basin slope in %"
    prevention: "run_hec_hms validates Tp against basin area heuristic"
  severity: medium
  cross_references: [dt_105]

- id: dt_117
  stage: s4_forcing
  failure_domain: data_quality
  symptom:
    description: "Dry spells much longer than expected. Simulated baseflow recession unrealistically fast."
    error_pattern: "missing data"
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Missing precipitation days filled with zero instead of NaN or interpolated"
    explanation: >
      When CMFD NetCDF files have missing days (corrupt files, gaps), filling with
      zero precipitation creates artificial dry spells. This is indistinguishable from
      real dry periods but can severely underestimate total runoff volume.
    affected_components: [convert_forcing_to_hms]
  remedy:
    action: "Flag missing days as NaN. Interpolate short gaps (<3 days). Report long gaps."
    tool_to_run: convert_forcing_to_hms
    manual_steps:
      - "Count consecutive zero-precipitation days — > 30 days is suspicious"
      - "Cross-reference with nearby stations or alternative forcing datasets"
    prevention: "convert_forcing_to_hms logs gap statistics and warns if > 5 consecutive missing days"
  severity: medium
  cross_references: [dt_115]

- id: dt_107
  stage: s5_parameters
  failure_domain: parameter_units
  symptom:
    description: "Baseflow is constant or decays instantly. No seasonal baseflow pattern."
    error_pattern: "baseflow shape"
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Recession constant confused with hydraulic conductivity or decay rate"
    explanation: >
      HEC-HMS linear reservoir baseflow uses a dimensionless recession constant k (0 < k < 1).
      k=0.95 means 95% of baseflow persists to the next timestep (slow recession).
      k=0.5 means rapid decay. This is NOT a rate (1/time) or conductivity (length/time).
      Using a Ksat value (e.g., 0.001 cm/hr) as k gives essentially zero baseflow.
    affected_components: [run_hec_hms]
  remedy:
    action: "Set recession constant as dimensionless ratio 0.5-0.99. Start with 0.95 for large basins."
    tool_to_run: run_hec_hms
    manual_steps:
      - "Check baseflow recession: plot log(Q_base) vs time — should be linear"
      - "Estimate k from observed recession: k = Q(t+1)/Q(t) during dry periods"
    prevention: "run_hec_hms validates k is in [0.01, 0.999]"
  severity: silent
  cross_references: []
