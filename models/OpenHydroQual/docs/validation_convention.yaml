    good] ... 20 <= PBIAS < +/-30 [satisfactory], PBIAS >= +/-30 [unsatisfactory]". Moriasi 2007 general
    table gives a looser N/P PBIAS envelope (satisfactory +/-40 to +/-70), superseded here by the stricter
    2015 tiers. Confidence reduced because OpenHydroQual constituents extend beyond N/P (DO, temperature,
    pH) for which these are the nearest-available cited threshold, not species-exact.'
