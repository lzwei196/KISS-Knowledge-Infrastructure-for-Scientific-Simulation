# pyGIMLi produces inverse-model fields and internal diagnostics rather than
# directly measured environmental state variables. The fetched literature
# supports masking/appraising inversion products with coverage, sensitivity,
# resolution, data uncertainty, borehole/lab checks, and data misfit, but it
# does not provide universal numeric CSI/PBIAS validation pass bands for these
# dag variables. Per the no-fabrication rule, headline bands are null and low
# confidence; structural-limit claims cite fetched papers.

