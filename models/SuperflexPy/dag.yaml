template_version: "3.5"

identity:
  model_id: "SuperflexPy"
  scientific_reference_version: "SUPERFLEX conceptual framework (Fenicia/Kavetski/Savenije 2011) as realized by SuperflexPy 1.3.x"
  implementation:
    id: "superflexpy"
    version: "1.3.2"
    provenance: "Python; SuperflexPy (Dal Molin / Fenicia / Kavetski, Eawag-WUR) component-based framework implementing the SUPERFLEX reservoir/lag/connector elements."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "LGPL-3.0"
  repo_url: "https://github.com/dalmo1991/superflexPy"

boundary:
  scope_in:
    - "Conceptual (bucket-style) rainfall-runoff transformation"
    - "Lumped single-catchment models assembled from reservoir/lag/connector elements"
    - "Semi-distributed models (parallel HRU Units within a catchment Node)"
    - "Distributed models over a river network (tree of Nodes) with internal-location streamflow prediction"
    - "Building and testing custom conceptual model structures (ships GR4J, HBV-style, HYMOD)"
  scope_out:
    - "Not a single fixed model — a framework for assembling model structures"
    - "Physically-based / process-distributed grid models are not the paradigm"
    - "Feedback loops between elements (elements solved sequentially upstream-to-downstream, one at a time)"
    - "GPU/CUDA acceleration"
    - "Meteorological forcing generation, parameter estimation/calibration, and GIS delineation (all external)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Each reservoir element enforces the water-balance ODE dS/dt = I(theta,t) - O(S,theta,t); connectors (Splitter/Junction/Transparent/FluxAggregator) and lag functions conserve mass without storage. Closure is per-element water mass only; no energy budget. Fluxes are assumed constant over each user-defined time step. The framework is formally unit-agnostic and timestep-agnostic; the operational HydroCraft binding fixes fluxes to mm and the integration step to days (dt=1.0 daily, 1/24 hourly), and that mm/day, day convention is what these facts assume."

inputs:
  forcing:
    - category: "meteorology"
      name: "Precipitation (P)"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: "numpy array of length n_timesteps passed via set_input(); flux order is element-specific"
      notes: "Total rainfall flux. Framework is unit-agnostic; mm/d is the operational convention. Input array order differs by entry element (GR4J InterceptionFilter expects [PET, P]; HBV UnsaturatedReservoir expects [P, PET]) — wrong order silently produces nonsense."
    - category: "meteorology"
      name: "Potential evapotranspiration (PET)"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: "numpy array of length n_timesteps via set_input()"
      notes: "Drives interception, production store, and unsaturated/upper-zone reservoir AET demand."
    - category: "meteorology"
      name: "Temperature (T)"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "numpy array via set_input()"
      notes: "Consumed only by the Snow Reservoir element; required only when a snow module is present in the assembled structure."
  parameters:
    - category: "production_store"
      name: "x1 (GR4J production-store capacity)"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "hierarchically-prefixed parameter dict key (e.g. model_ps_x1)"
      notes: "Production store size; partitions precipitation between storage and percolation. Very high calibration sensitivity. KI documents conflicting defaults (SKILL table 50.0 vs tool/example 350.0)."
    - category: "routing_store"
      name: "x2 (GR4J groundwater exchange coefficient)"
      unit: "mm/d"
      source_kind: "calibrated"
      model_input_format: "prefixed parameter dict key"
      notes: "Exchange flux magnitude. SuperflexPy sign convention: positive x2 = EXPORT/loss from the catchment (losing stream), negative = import (gaining stream) — per gr4j.py docstring 'Exchange flux (F), positive if loss' (CORRECTED 2026-08-22; this note previously taught the inverted sign)."
    - category: "routing_store"
      name: "x3 (GR4J routing-store capacity)"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "prefixed parameter dict key"
      notes: "Routing store size, controls baseflow depletion. KI default conflicts (table 20.0 vs tool 90.0)."
    - category: "lag"
      name: "x4 (GR4J unit-hydrograph base time)"
      unit: "d"
      source_kind: "calibrated"
      model_input_format: "prefixed parameter dict key"
      notes: "UH base time; controls peak timing. KI default conflicts (table 3.5 vs tool 1.7)."
    - category: "production_store"
      name: "GR4J fixed shape exponents (alpha=2.0, beta=5.0, ni=4/9, gamma=5.0, omega=3.5)"
      unit: "-"
      source_kind: "default"
      model_input_format: "hardcoded element defaults in gr4j.py flux equations"
      notes: "Canonical GR4J shape constants baked into the production-store, routing-store, and exchange flux equations; not normally calibrated."
    - category: "unsaturated_reservoir"
      name: "HBV/HYMOD soil parameters (Smax, Ce, m, beta)"
      unit: "mm (Smax); - (Ce, m, beta)"
      source_kind: "calibrated"
      model_input_format: "prefixed parameter dict keys"
      notes: "Smax = storage capacity (high sensitivity), beta = runoff partitioning exponent (high sensitivity), Ce = ET correction, m = smoothing coefficient. Smax/beta may be derived from soil databases (HWSD) via pedotransfer."
    - category: "power_reservoir"
      name: "Power/linear reservoir parameters (k, alpha)"
      unit: "1/d (k); - (alpha)"
      source_kind: "calibrated"
      model_input_format: "prefixed parameter dict keys"
      notes: "k = recession rate coefficient, alpha = power-law outflow exponent (Q = k*S^alpha). KI default for k conflicts (table 0.01 vs tool/example 0.05)."
    - category: "snow"
      name: "Snow reservoir parameters (T0, m, k)"
      unit: "degC (T0); mm/degC/d (m); 1/d (k)"
      source_kind: "calibrated"
      model_input_format: "prefixed parameter dict keys"
      notes: "Temperature-threshold snowmelt; applicable only when a Snow Reservoir is in the structure."
    - category: "geometry"
      name: "Catchment area"
      unit: "km2"
      source_kind: "dataset_lookup"
      model_input_format: "scalar float at Node setup"
      notes: "Used for Node/Network volumetric routing conversion (Q_m3s = Q_mm_d * area_km2 / 86.4); area in m2 instead of km2 breaks routing by ~1e6."
  initial_conditions:
    - category: "reservoir_state"
      name: "Reservoir initial storage (S0)"
      unit: "mm"
      source_kind: "user_provided"
      model_input_format: "dict {'S0': value} per reservoir element"
      notes: "Typically 0-500 mm, often set ~0.5*Smax with a 1-2 yr warmup. Wrong units (m/cm) produce a long initial transient."
    - category: "lag_state"
      name: "Lag-element initial state"
      unit: "convolution array"
      source_kind: "user_provided"
      model_input_format: "dict {'lag': None} per LagElement"
      notes: "MUST be None; the framework auto-sizes the lag-bin array from the lag-time parameter. A pre-allocated wrong-length array crashes the convolution."
  boundary_conditions:
    - category: "structure"
      name: "HRU weights (Node)"
      unit: "fraction [0,1]"
      source_kind: "user_provided"
      model_input_format: "list of floats per Node, must sum to 1.0"
      notes: "Fractional weights of parallel Units. Framework does not enforce normalization; weights as percentages (0-100) scale output ~100x."
    - category: "structure"
      name: "Network topology"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "node-to-downstream-node mapping (tree)"
      notes: "Must be an acyclic tree (each node at most one downstream, outlet downstream=None); a cycle hangs the topological solver."
    - category: "numerical"
      name: "ODE approximator choice"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "approximator object (ImplicitEuler | ExplicitEuler | RungeKutta4)"
      notes: "Implicit Euler is the recommended/stable choice; Explicit Euler can produce negative storage and NaN for large timesteps."
    - category: "numerical"
      name: "Root finder choice"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "root-finder object (Pegasus | Newton | Explicit)"
      notes: "Pegasus (bracketing) is the default robust choice. Root-finder architecture (python/numba) must match the approximator architecture, validated at construction."
    - category: "numerical"
      name: "Timestep (dt)"
      unit: "d"
      source_kind: "user_provided"
      model_input_format: "set_timestep(dt) float in days"
      notes: "Must match the forcing temporal resolution (1.0 daily, 1/24 hourly); a mismatch silently corrupts storage dynamics."

processes:
  modules:
    - name: "ODEsElement"
      role: "process_solver"
      brief: "Base reservoir element governed by dS/dt = inputs - outputs; holds storage state S0, owns flux functions, dispatches to the numerical approximator. Specialized as ProductionStore, RoutingStore, PowerReservoir, UnsaturatedReservoir, Snow Reservoir."
    - name: "LagElement"
      role: "process_solver"
      brief: "Convolution / unit-hydrograph element; distributes incoming flux over a weight array built from a lag-time parameter and carries a rolling lag state (UnitHydrograph1/2, Half-Triangular)."
    - name: "GR4J_ProductionStore"
      role: "process_solver"
      brief: "GR4J soil-moisture production store of capacity x1; partitions net rainfall between storage, evaporation, and percolation via fixed exponents alpha/beta/ni."
      applicability: "GR4J structure"
    - name: "GR4J_RoutingStore"
      role: "process_solver"
      brief: "GR4J routing store of capacity x3 producing main outflow Qr (exponent gamma) and groundwater exchange flux F = (x2/x3^omega)*S^omega."
      applicability: "GR4J structure"
    - name: "GR4J_InterceptionFilter"
      role: "process_solver"
      brief: "GR4J entry element receiving [PET, P] and emitting net rainfall and net PET (interception offset)."
      applicability: "GR4J structure"
    - name: "GR4J_FluxAggregator"
      role: "allocator"
      brief: "GR4J terminal element combining routing outflow, exchange flux, and the UH2 branch as Qr + max(0, Q2_out - F); applies the exchange-loss sign convention at the outlet."
      applicability: "GR4J structure"
    - name: "HBV_UnsaturatedReservoir"
      role: "process_solver"
      brief: "HBV/HYMOD unsaturated soil reservoir of capacity Smax with smoothed AET (Ce, m) and beta-controlled runoff generation."
      applicability: "HBV-style / HYMOD structure"
    - name: "HBV_PowerReservoir"
      role: "process_solver"
      brief: "Nonlinear fast/baseflow reservoir generating discharge Q = k*S^alpha."
      applicability: "HBV-style / HYMOD structure"
    - name: "SnowReservoir"
      role: "optional_module"
      brief: "Temperature-threshold snow store (params T0, m, k) producing snowmelt + rainfall; present only when the assembled structure includes snow."
      applicability: "snow-affected catchments only"
    - name: "Connectors"
      role: "allocator"
      brief: "Splitter (one flux to many), Junction (many to one), Linker (reorder), Transparent (pass-through); wire the element DAG without altering mass."
    - name: "NumericalApproximator"
      role: "integrator"
      brief: "Abstract ODE integrator (ImplicitEuler / ExplicitEuler / RungeKutta4, python or numba); separates scalar vs vector parameters, broadcasts dt, loops timesteps calling the root finder, returns the state trajectory."
    - name: "RootFinder"
      role: "process_solver"
      brief: "Scalar root-finding of the implicit ODE residual (Pegasus bracketing / Newton / Explicit algebraic); Pegasus is the robust default with tol_F/tol_x=1e-8, iter_max=10."
    - name: "Unit"
      role: "driver"
      brief: "Directed-acyclic graph of elements in upstream-to-downstream layers representing one HRU / complete model structure; drives layer-by-layer dataflow wiring outputs by num_upstream/num_downstream."
    - name: "Node"
      role: "driver"
      brief: "Catchment = weighted parallel collection of Units sharing inputs, summing outputs over an influence area with optional node-level routing."
    - name: "Network"
      role: "driver"
      brief: "Tree of Nodes; routes fluxes from upstream to downstream nodes per a topology dict to produce spatially-distributed streamflow."
  internal_edges:
    - from: "Inputs"
      to: "GR4J_InterceptionFilter"
      kind: "consumes_input"
      brief: "GR4J entry element receives [PET, P] and emits net rainfall and net PET."
    - from: "GR4J_InterceptionFilter"
      to: "GR4J_ProductionStore"
      kind: "invokes"
      brief: "Net PET and P passed as the production store's two input fluxes."
    - from: "GR4J_ProductionStore"
      to: "S0_storage"
      kind: "writes_state"
      brief: "Solves dS/dt and writes updated soil-moisture storage."
    - from: "GR4J_ProductionStore"
      to: "Connectors"
      kind: "produces_output"
      brief: "Emits combined (net rainfall + percolation) to the canonical 90/10 Splitter."
    - from: "Connectors"
      to: "LagElement"
      kind: "invokes"
      brief: "Splitter routes the 90% branch through UnitHydrograph1 (base x4) and the 10% branch through UnitHydrograph2 (base 2*x4)."
    - from: "LagElement"
      to: "lag_state"
      kind: "writes_state"
      brief: "Rolls the lag-bin state array left and zeros the tail, persisting partial convolution across get_output calls."
    - from: "LagElement"
      to: "GR4J_RoutingStore"
      kind: "invokes"
      brief: "UH1 lagged flux becomes the routing-store input."
    - from: "GR4J_RoutingStore"
      to: "S0_storage"
      kind: "writes_state"
      brief: "Solves the routing-store ODE, updating its storage."
    - from: "GR4J_RoutingStore"
      to: "GR4J_FluxAggregator"
      kind: "produces_output"
      brief: "Emits Qr (main outflow) and F (exchange flux) to the aggregator."
    - from: "LagElement"
      to: "GR4J_FluxAggregator"
      kind: "produces_output"
      brief: "UH2 lagged flux Q2_out feeds the aggregator's third input."
    - from: "GR4J_FluxAggregator"
      to: "Outputs"
      kind: "produces_output"
      brief: "Computes Qr + max(0, Q2_out - F) as total GR4J streamflow."
    - from: "Inputs"
      to: "HBV_UnsaturatedReservoir"
      kind: "consumes_input"
      brief: "HBV/HYMOD soil reservoir receives [P, PET]."
    - from: "HBV_UnsaturatedReservoir"
      to: "S0_storage"
      kind: "writes_state"
      brief: "Solves the soil-moisture ODE with smoothed AET; updates storage."
    - from: "HBV_UnsaturatedReservoir"
      to: "HBV_PowerReservoir"
      kind: "invokes"
      brief: "Unsaturated-zone output feeds the fast power reservoir."
    - from: "HBV_PowerReservoir"
      to: "S0_storage"
      kind: "writes_state"
      brief: "Solves the nonlinear reservoir ODE, updating storage."
    - from: "HBV_PowerReservoir"
      to: "Outputs"
      kind: "produces_output"
      brief: "Emits Q = k*S^alpha as the HBV/HYMOD unit streamflow."
    - from: "SnowReservoir"
      to: "snow_storage_S"
      kind: "writes_state"
      brief: "Accumulates snow (dS/dt = P_snow - M) and emits snowmelt + rainfall to downstream soil elements."
    - from: "ODEsElement"
      to: "NumericalApproximator"
      kind: "invokes"
      brief: "_solve_differential_equation calls the approximator with flux functions, S0, dt and unprefixed parameters."
    - from: "NumericalApproximator"
      to: "RootFinder"
      kind: "invokes"
      brief: "Per-timestep loop calls the root finder on the implicit residual (S-S0)/dt - sum(fluxes) = 0 to find the new state."
    - from: "NumericalApproximator"
      to: "state_array"
      kind: "writes_state"
      brief: "Returns the solved state trajectory reshaped to (n_timesteps, n_ODEs), stored on the element."
    - from: "Unit"
      to: "ODEsElement"
      kind: "invokes"
      brief: "Unit.get_output sets layer[0] input then walks layers upstream-to-downstream, wiring element outputs via num_upstream/num_downstream."
    - from: "Node"
      to: "Unit"
      kind: "invokes"
      brief: "Node sums weighted Unit outputs over its influence area, optionally applying node routing."
    - from: "Network"
      to: "Node"
      kind: "invokes"
      brief: "Network.get_output solves each node and routes outputs downstream per the topology tree."
    - from: "Network"
      to: "Outputs"
      kind: "produces_output"
      brief: "Emits per-node routed streamflow as the distributed catchment output."

states:
  variables:
    - name: "S0_storage"
      unit: "mm"
      role: "prognostic"
    - name: "snow_storage_S"
      unit: "mm"
      role: "prognostic"
    - name: "lag_state"
      unit: "convolution array (mm per lag bin)"
      role: "prognostic"
    - name: "state_array"
      unit: "mm"
      role: "diagnostic"
    - name: "AET"
      unit: "mm/d"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "Q_sim"
    validation_rank: 1
    unit: "mm/d"
    description: "Simulated total streamflow at the catchment / Unit outlet; model.get_output() returns a list of numpy arrays (one per output flux)."
    emitted_in: "model.get_output()"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Compute metrics on the evaluation period only, after a 1-2 yr warmup."
            - "Compare in consistent units; convert mm/d to m3/s via area only after matching the gauge support area."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Single-instant flow comparison is weak for a storage model; prefer the time series."
      detrending_options:
        - "none"
  - var: "Network_Q"
    validation_rank: 2
    unit: "mm/d"
    description: "Per-node routed streamflow for a semi-distributed Network; network.get_output() returns a dict mapping node IDs to output arrays, enabling internal-location prediction."
    emitted_in: "network.get_output()"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Each node maps to an interior gauge; routing area (km2) must be correct or fluxes scale by ~1e6."
      detrending_options:
        - "none"
  - var: "AET"
    validation_rank: 3
    unit: "mm/d"
    description: "Actual water evapotranspiration flux from the production store / unsaturated reservoir; via get_aet()/get_AET()."
    emitted_in: "element.get_aet() / get_AET()"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Conceptual AET is a demand-limited bucket flux, not an energy-balance ET; expect structural bias against eddy-covariance ET."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Only meaningful when many Units/Nodes give spatial coverage; lumped runs cannot be compared as a field."
      detrending_options:
        - "none"
  - var: "S"
    validation_rank: 4
    unit: "mm"
    description: "Reservoir water storage state trajectory over time per reservoir element; model.get_states()."
    emitted_in: "model.get_states()"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Conceptual storage is not directly observable; at best correlated with relative soil-moisture or piezometric dynamics (pattern, not magnitude)."
      detrending_options:
        - "none"
  - var: "F"
    validation_rank: 5
    unit: "mm/d"
    description: "GR4J groundwater exchange (loss/gain) flux F = (x2/x3^omega)*S^omega; positive x2 = EXPORT/loss from the catchment, negative = import (CORRECTED 2026-08-22, rank audit: superflexpy/implementation/elements/gr4j.py docstring 'Exchange flux (F), positive if loss' and _flux_function_python emits -(x2*(S/x3)**omega); the flux is applied in both the routing store and the lag branch)."
    emitted_in: "model.get_output() (GR4J routing store flux)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Exchange flux is rarely observed directly; usually only inferable through water-balance closure."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "Smax (unsaturated/production store storage capacity)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      applicability: "HBV-style / GR4J production store"
      citations:
        - "dalmolin2021_superflexpy_framework"
        - "fenicia2011_superflex_part1"
        - "kavetski2011_superflex_part2"
    - from: "Smax (unsaturated reservoir storage capacity)"
      to: "AET"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      applicability: "HBV-style"
      citations:
        - "dalmolin2021_superflexpy_framework"
        - "fenicia2011_superflex_part1"
    - from: "beta (runoff partitioning exponent)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      applicability: "HBV-style / HYMOD"
      citations:
        - "dalmolin2021_superflexpy_framework"
        - "fenicia2011_superflex_part1"
    - from: "k (fast reservoir rate coefficient)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      applicability: "power reservoir"
      citations:
        - "dalmolin2021_superflexpy_framework"
        - "fenicia2011_superflex_part1"
        - "kavetski2011_superflex_part2"
    - from: "alpha (fast reservoir power-law outflow exponent)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      applicability: "power reservoir"
      citations:
        - "dalmolin2021_superflexpy_framework"
        - "vanesse2013_structure_performance_237"
    - from: "k (slow/groundwater reservoir rate coefficient)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      applicability: "slow flow path"
      citations:
        - "dalmolin2021_superflexpy_framework"
        - "fenicia2014_catchment_correspondence"
    - from: "lag time (routing lag function parameter)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      citations:
        - "dalmolin2021_superflexpy_framework"
        - "kavetski2011_superflex_part2"
    - from: "reservoir arrangement (serial vs parallel structure)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      citations:
        - "vanesse2013_structure_performance_237"
        - "fenicia2014_catchment_correspondence"
    - from: "snow/temperature threshold (snow reservoir parameters)"
      to: "Q_sim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      applicability: "snow-affected catchments only"
      citations:
        - "dalmolin2021_superflexpy_framework"
  citation_index:
    dalmolin2021_superflexpy_framework:
      short_citation: "Dal Molin et al. 2021"
      doi: "10.5194/gmd-14-7047-2021"
      note: "SuperflexPy 1.3.0 framework paper; defines reservoir/lag elements and the parameters partitioning P into ET vs runoff and shaping the hydrograph."
    fenicia2011_superflex_part1:
      short_citation: "Fenicia et al. 2011"
      doi: "10.1029/2010WR010174"
      note: "SUPERFLEX framework part 1; storage-discharge constitutive relations establishing capacity/exponent/time-constant controls on flux partitioning."
    kavetski2011_superflex_part2:
      short_citation: "Kavetski & Fenicia 2011"
      doi: "10.1029/2011WR010748"
      note: "SUPERFLEX part 2; parameter identifiability across four catchments — reservoir time constants and capacities control hydrograph shape and recession."
    fenicia2014_catchment_correspondence:
      short_citation: "Fenicia et al. 2014"
      doi: "10.1002/hyp.9726"
      note: "Multiple SUPERFLEX structures over Luxembourg catchments; structural choices change which parameters dominate streamflow."
    vanesse2013_structure_performance_237:
      short_citation: "van Esse et al. 2013"
      doi: "10.5194/hess-17-4227-2013"
      note: "237 French catchments; parallel reservoirs and a power-function outflow (exponent alpha) most favorable for streamflow NSE."

safety:
  hazards:
    - id: "precip_unit_m_per_day"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in m/d instead of mm/d gives a silent 1000x over-forcing and unbounded storage growth."
      severity: "silent"
    - id: "pet_unit_per_month"
      kind: "weather_file_semantic"
      description: "PET supplied in mm/month instead of mm/d creates 50-200 mm/d false ET demand and dries the model out."
      severity: "silent"
    - id: "timestep_forcing_mismatch"
      kind: "control_semantic"
      description: "Integration dt not matching forcing resolution (e.g. hourly forcing with dt=1.0) gives a 24x water-balance error."
      severity: "silent"
    - id: "input_flux_order_swapped"
      kind: "control_semantic"
      description: "Element-specific input order (GR4J entry [PET,P] vs HBV [P,PET]); a swapped array yields a physically meaningless hydrograph with no error."
      severity: "silent"
    - id: "init_storage_wrong_unit"
      kind: "initial_condition_semantic"
      description: "Initial storage S0 in m/cm instead of mm produces a long artificial warmup transient."
      severity: "silent"
    - id: "lag_state_preallocated"
      kind: "initial_condition_semantic"
      description: "LagElement state initialized as an array instead of {'lag': None} crashes the convolution (broadcast error)."
      severity: "fatal"
    - id: "param_name_unprefixed"
      kind: "coefficient_runtime_silent_fallback"
      description: "set_parameters() requires full hierarchical names (e.g. model_ps_x1); a bare 'x1' raises KeyError or is silently ignored. Discover via get_parameters_name()."
      severity: "fatal_or_silent"
    - id: "explicit_euler_negative_storage"
      kind: "numerical_instability"
      description: "Explicit Euler produces negative storage for large timestep/flux; S^alpha of a negative base yields NaN. Use Implicit Euler with Pegasus."
      severity: "fatal"
    - id: "pegasus_nonconvergence"
      kind: "numerical_instability"
      description: "Pegasus root finder fails to converge for extreme k/alpha (too-steep residual), giving subtle errors; reduce dt or stay within documented parameter bounds."
      severity: "degraded"
    - id: "time_varying_param_length"
      kind: "control_semantic"
      description: "A time-varying parameter array shorter than the number of timesteps causes an IndexError mid-solve; use scalars for constants."
      severity: "fatal"
    - id: "splitter_matrix_shape"
      kind: "control_semantic"
      description: "Splitter weight/direction matrix dims not matching topology [n_downstream][n_upstream_fluxes] cause IndexError or wrong routing, surfacing only at solve time."
      severity: "fatal"
    - id: "network_cycle_hang"
      kind: "control_semantic"
      description: "A cyclic Network topology (A->B->C->A) makes the topological solver loop forever; topology must be an acyclic tree."
      severity: "fatal_or_silent"
    - id: "node_weights_not_normalized"
      kind: "control_semantic"
      description: "Node Unit weights not summing to 1.0 (or given as percentages 0-100) scale output up/down (~100x) with no framework check."
      severity: "silent"
    - id: "node_area_unit"
      kind: "control_semantic"
      description: "Node area in m2 instead of km2 breaks the mm/d-to-m3/s routing conversion by ~1e6."
      severity: "silent"
    - id: "gr4j_x2_sign_convention"
      kind: "control_semantic"
      description: "GR4J exchange x2 sign in SuperflexPy is positive=EXPORT/loss, negative=import (gr4j.py docstring: 'Exchange flux (F), positive if loss'; CORRECTED 2026-08-22 — this triplet previously taught the INVERTED sign); a wrong sign breaks water balance."
      severity: "silent"
    - id: "reset_states_lag_memory"
      kind: "initial_condition_semantic"
      description: "reset_states() does not reset lag-function memory; lag must be re-set to None after a calibration run for a clean simulation."
      severity: "silent"
  validation_limits:
    - "Conceptual bucket model: no physically-based, process-distributed grid representation."
    - "Elements solved sequentially upstream-to-downstream; no inter-element feedback loops can be represented."
    - "Daily/sub-daily lumped-to-semi-distributed scope; not a fine-grid 2-D/3-D model."
    - "Snow processes only when a Snow Reservoir is explicitly included."
  warnings:
    - "Numba JIT compiles on the first get_output() call (5-30 s); this is one-time per session, not a hang — do not kill the process."
    - "Numba and numpy versions are coupled (numba==0.57.1 with numpy==1.24.3); a mismatch breaks the JIT solvers (TypingError)."
    - "Plausibility checks: output length == input length; no NaN or negative Q; runoff ratio (sum Q / sum P) ~ 0.1-0.9; P-ET-Q ~ dS over long periods."
  assumptions:
    - statement: "Fluxes and the integration step are interpreted in mm and days respectively, although SuperflexPy itself is formally unit- and timestep-agnostic."
      scope: "all forcing, parameters, states, and the dt of the operational binding"
      source: "SuperflexPy docs (numerical_solver / elements_list state fluxes are user-defined and constant over the time step) plus the KI's mm/day operational convention"
      status: "adopted"
    - statement: "Closure is per-element water mass-balance only; there is no surface energy budget, and AET is a demand-limited conceptual flux."
      scope: "all reservoir elements and AET output"
      source: "SuperflexPy components docs (reservoir ODE dS/dt = I - O); get_aet/get_AET element docs"
      status: "adopted"
    - statement: "Influence-edge grades are MEDIUM/LOW with literature_qualitative basis because the available SUPERFLEX papers report identifiability/structural-influence findings, not quantitative variance-based (Sobol/Morris/EFAST) indices for the SuperflexPy default models."
      scope: "all influence edges"
      source: "Dal Molin et al. 2021 (10.5194/gmd-14-7047-2021); van Esse et al. 2013 (10.5194/hess-17-4227-2013); Fenicia/Kavetski 2011 (10.1029/2010WR010174, 10.1029/2011WR010748)"
      status: "adopted"

medium_evidence:
  - var: "AET"
    source: "dag.yaml"
    quote: "Each reservoir element enforces the water-balance ODE dS/dt = I(theta,t) - O(S,theta,t); connectors (Splitter/Junction/Transparent/FluxAggregator) and lag functions conserve mass without storage."
    note: "DAG boundary notes define reservoir fluxes and state changes as water-balance mass terms."
  - var: "S"
    source: "dag.yaml"
    quote: "Each reservoir element enforces the water-balance ODE dS/dt = I(theta,t) - O(S,theta,t); connectors (Splitter/Junction/Transparent/FluxAggregator) and lag functions conserve mass without storage."
    note: "DAG boundary notes define reservoir storage trajectories as water-balance state terms."
