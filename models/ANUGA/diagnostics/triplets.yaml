# ANUGA Diagnostic Triplets
# =========================
# 22 triplets covering 8 failure domains for ANUGA
# (2D shallow-water equation solver, finite-volume unstructured triangular mesh)
#
# Failure domains covered:
#   UNIT           - Unit conversion errors (rainfall, elevation)
#   IO_FORMAT      - SWW file, mesh file, forcing CSV format issues
#   CONFIGURATION  - Domain setup, flow algorithm, boundary tag errors
#   PARAMETER      - Manning's n, mesh resolution, initial conditions
#   NUMERICAL      - CFL violation, wet/dry instability, mass conservation
#   BUILD_RUNTIME  - Python import, C extension compilation, parallel merge
#   SPATIAL        - CRS / coordinate mismatch, DEM alignment, mesh quality
#   OUTPUT         - SWW interpretation, stage vs depth confusion

triplets:

  # ==========================================================================
  # UNIT: Unit Conversion Errors
  # ==========================================================================

  - id: dt_anuga_001
    symptom:
      description: >
        Entire domain floods unrealistically; flood depths are 1000x too high
        even for moderate rainfall events. Rate_operator appears to inject
        vastly too much water.
    diagnosis:
      root_cause: >
        Rainfall rate passed to Rate_operator in mm/hr instead of m/s.
        ANUGA Rate_operator expects rainfall in m/s. If CMFD precipitation
        (kg/m2/s, numerically equivalent to mm/s) or mm/hr values are passed
        without conversion, the rate is 1000x or 3600x too high.
        For example, 10 mm/hr = 2.78e-6 m/s, but if passed as 10.0 the
        solver interprets it as 10 m/s of rainfall.
    remedy:
      action: >
        Convert rainfall to m/s before passing to Rate_operator.
        CMFD: value is kg/m2/s = mm/s, so divide by 1000 to get m/s.
        MSWX: mm/3hr, divide by (1000 * 10800).
        NASA POWER: mm/hr, divide by (1000 * 3600).
        Use convert_forcing_to_anuga.py which handles this automatically.

  - id: dt_anuga_002
    symptom:
      description: >
        No flooding at all despite heavy rainfall event being applied.
        Rate_operator is active but contributes negligible water volume.
        Max depth remains near zero throughout the simulation.
    diagnosis:
      root_cause: >
        Rainfall rate double-divided: already in m/s but divided by 1000
        again (treating m/s as mm/s). For example, CMFD load_hourly_forcing
        returns precip_mm (mm per timestep). The convert_forcing tool should
        divide by 1000 (mm to m) and by timestep_s (per-timestep to per-second).
        If the raw kg/m2/s value (already ~1e-5) is divided by 1000 again,
        the rate becomes ~1e-8 m/s, effectively zero.
    remedy:
      action: >
        Trace the unit chain: CMFD raw = kg/m2/s. load_hourly_forcing
        returns mm/timestep (already multiplied by timestep_s). To get m/s:
        divide by 1000 (mm to m) then by timestep_s (per-timestep to per-second).
        Verify max rainfall_m_per_s is in the range 1e-7 to 1e-4 for
        realistic storms (0.36 to 360 mm/hr).

  - id: dt_anuga_003
    symptom:
      description: >
        DEM elevations appear shifted by 20-40m compared to expected terrain.
        Simulated water surface elevation (stage) is systematically offset from
        reference gauge data. Flood extent is wrong because terrain is too high
        or too low relative to boundary water levels.
    diagnosis:
      root_cause: >
        Vertical datum mismatch between DEM and boundary condition water levels.
        China DEM 90m uses EGM96 geoid heights. If boundary water levels are
        referenced to WGS84 ellipsoid or local chart datum, the offset can
        be 20-40m depending on location. ANUGA uses raw elevation values
        without datum awareness.
    remedy:
      action: >
        Ensure DEM and all water level boundary conditions use the same
        vertical datum. If DEM is EGM96-geoid and boundary levels are
        ellipsoidal, subtract the local geoid undulation from the DEM or
        add it to the boundary levels. Check with: gdalinfo dem.tif | grep VERT.

  # ==========================================================================
  # IO_FORMAT: Input/Output File Format Errors
  # ==========================================================================

  - id: dt_anuga_004
    symptom:
      description: >
        run_anuga.py crashes with KeyError or ValueError when reading the
        forcing CSV. Error message references missing column name
        'time_seconds' or 'rainfall_m_per_s'.
    diagnosis:
      root_cause: >
        The rainfall CSV file does not have the expected header row
        (time_seconds, rainfall_m_per_s). The file may have been hand-edited,
        saved from Excel with different delimiters, or generated by a tool
        that uses different column names (e.g., 'time', 'precip', 'rate').
        run_anuga.py uses csv.DictReader which requires exact header matches.
    remedy:
      action: >
        Ensure the forcing CSV has exactly two columns with header:
        time_seconds,rainfall_m_per_s. Use convert_forcing_to_anuga.py to
        regenerate the file. If editing manually, verify no BOM characters,
        no trailing commas, and comma (not tab) delimiters.

  - id: dt_anuga_005
    symptom:
      description: >
        parse_anuga_output.py fails with 'NetCDFFile' or 'No such variable'
        error when reading the SWW file. The SWW file exists and has nonzero
        size but cannot be parsed.
    diagnosis:
      root_cause: >
        The SWW file was produced by a parallel ANUGA run and consists of
        multiple per-processor SWW fragments (e.g., anuga_sim_P0_0.sww,
        anuga_sim_P1_0.sww) that were not merged. The expected single
        anuga_sim.sww either does not exist or is an incomplete fragment.
        domain.sww_merge() may have failed silently.
    remedy:
      action: >
        After domain.evolve completes, call domain.sww_merge(delete_old=True)
        to combine parallel fragments. If merge fails, run manually:
        python -c "import anuga; anuga.sww_merge('anuga_sim', delete_old=False)".
        Verify the merged file by checking that 'x', 'y', 'stage', and
        'elevation' variables are present in the SWW NetCDF.

  - id: dt_anuga_006
    symptom:
      description: >
        SWW output file is missing or zero bytes after simulation completes
        without error. run_summary.json shows sww_exists=false. The ANUGA
        log shows evolve loop completed normally.
    diagnosis:
      root_cause: >
        domain.set_datadir() was called with a path that does not exist, or
        domain.set_name() was not called so the output goes to an unexpected
        default filename. ANUGA writes SWW to datadir/name.sww. If datadir
        is not created beforehand, ANUGA may silently fail to write output
        (depending on version) or write to the current working directory.
    remedy:
      action: >
        Ensure os.makedirs(output_dir, exist_ok=True) is called before
        domain creation. Verify domain.set_datadir(output_dir) and
        domain.set_name("anuga_sim") are both called. After simulation,
        check: os.path.isfile(os.path.join(output_dir, "anuga_sim.sww")).

  # ==========================================================================
  # CONFIGURATION: Domain Setup and Solver Configuration Errors
  # ==========================================================================

  - id: dt_anuga_007
    symptom:
      description: >
        ANUGA produces different results between runs with identical inputs.
        Or: stage profile has unexpected oscillations near boundaries that
        differ between flow algorithms. Analytical benchmark (dam_break_wet)
        fails NSE threshold.
    diagnosis:
      root_cause: >
        Incorrect or missing flow algorithm setting. ANUGA supports multiple
        finite-volume schemes: 'DE0' (default recommended, discontinuous
        elevation), 'DE1' (higher order), '1_5' (original 1st/2nd order).
        If set_flow_algorithm is not called, the default may vary by ANUGA
        version. 'DE0' is the most stable and recommended for general use.
        '1_5' can produce excessive numerical diffusion.
    remedy:
      action: >
        Explicitly call domain.set_flow_algorithm('DE0') after domain
        creation. For benchmarks requiring higher accuracy, try 'DE1'.
        Avoid leaving the flow algorithm unset. The run_anuga.py tool
        always sets 'DE0'.

  - id: dt_anuga_008
    symptom:
      description: >
        Water accumulates at domain edges and does not leave. The simulation
        shows artificially high water levels at boundaries. Total water volume
        in the domain increases over time even after rainfall stops.
    diagnosis:
      root_cause: >
        All boundaries set to Reflective_boundary. Reflective boundaries act
        as solid walls, preventing water from exiting the domain. For
        catchment simulations, the downstream outlet boundary must be
        Transmissive (or Dirichlet with a prescribed stage) to allow outflow.
    remedy:
      action: >
        Set the outlet/downstream boundary to anuga.Transmissive_boundary(domain)
        to allow free outflow. Keep Reflective_boundary on upslope/lateral
        boundaries. In run_anuga.py, the 'bottom' boundary is Transmissive
        by default (outlet), while 'top', 'left', 'right' are Reflective.
        For coastal domains, use Dirichlet_boundary with prescribed tide level.

  - id: dt_anuga_009
    symptom:
      description: >
        ANUGA raises an error during domain creation:
        'create_domain_from_regions: boundary_tags do not match polygon edges'.
        Or the mesh is created but boundary conditions cannot be applied
        because tag names do not match.
    diagnosis:
      root_cause: >
        The boundary_tags dictionary in create_domain_from_regions must map
        tag names to polygon edge indices (0-based). For a rectangular
        bounding polygon with 4 vertices [SW, SE, NE, NW], the edges are:
        edge 0 = bottom (SW to SE), edge 1 = right (SE to NE),
        edge 2 = top (NE to NW), edge 3 = left (NW to SW).
        If tags reference wrong edge indices, or not all edges are tagged,
        the domain creation fails or boundary conditions are applied to
        wrong sides.
    remedy:
      action: >
        Verify that boundary_tags covers all polygon edges. For a 4-vertex
        rectangle: {"bottom": [0], "right": [1], "top": [2], "left": [3]}.
        The tag names in set_boundary() must exactly match the tag names in
        boundary_tags. Use domain.get_boundary_tags() to verify available tags.

  # ==========================================================================
  # PARAMETER: Manning's n, Mesh Resolution, Initial Conditions
  # ==========================================================================

  - id: dt_anuga_010
    symptom:
      description: >
        Flood wave propagates much faster than expected. Water reaches the
        domain outlet in a fraction of the expected travel time. Peak
        discharge is too high and too early compared to observations.
    diagnosis:
      root_cause: >
        Manning's n set too low (e.g., 0.001 or 0.0). Low friction allows
        unrealistically fast flow velocities. For real-world catchments,
        Manning's n should be 0.02-0.15 depending on land cover. A value of
        0.0 (frictionless) is only appropriate for analytical benchmarks
        like dam_break_wet. The run_anuga.py default of 0.03 is suitable
        for moderate terrain.
    remedy:
      action: >
        Set domain.set_quantity('friction', n) with appropriate Manning's n:
        0.02-0.03 for smooth channels, 0.03-0.05 for natural streams,
        0.05-0.10 for floodplains with vegetation, 0.10-0.15 for dense
        forest. Use --manning_n flag in run_anuga.py. For spatially varying
        friction, pass a function or array to set_quantity.

  - id: dt_anuga_011
    symptom:
      description: >
        Simulation takes hours or days for a modest domain. Memory usage is
        extremely high (>16 GB). The domain has millions of triangles for a
        5-10 km extent.
    diagnosis:
      root_cause: >
        maximum_triangle_area set too small relative to domain size. ANUGA
        cost scales as O(N * T/dt) where N = number of triangles. For a
        5000m x 5000m domain, max_area=1 m2 produces ~25 million triangles.
        The default 10000 m2 produces ~2500 triangles, which is often too
        coarse but runs fast. A balanced value depends on the application.
    remedy:
      action: >
        For real-world flood modeling, use max_area = 100-1000 m2 for domains
        up to 10 km. For analytical benchmarks, use max_area = 1-10 m2 for
        accuracy. Check mesh size with len(domain) after creation. Target
        10,000-100,000 triangles for typical catchment simulations. Use
        interior_regions for local mesh refinement near channels.

  - id: dt_anuga_012
    symptom:
      description: >
        Simulation starts with an initial 'splash' or shock wave even though
        initial conditions should be calm (dry bed or flat water). The first
        few timesteps show large transient oscillations that corrupt the
        early-time solution.
    diagnosis:
      root_cause: >
        Initial stage set to a constant value (e.g., 0.0) rather than to
        the bed elevation. When stage < elevation, ANUGA clips depth to zero,
        but when stage > elevation in some cells and < elevation in others,
        the discontinuity generates a spurious wave. For dry-bed initial
        conditions, stage must equal elevation everywhere.
    remedy:
      action: >
        For dry-bed simulations, set:
        domain.set_quantity('stage', expression='elevation').
        This ensures depth = stage - elevation = 0 everywhere. For partially
        wet domains, ensure stage >= elevation at every mesh vertex. The
        run_anuga.py tool correctly sets stage=elevation by default.

  # ==========================================================================
  # NUMERICAL: CFL Violation, Wet/Dry Instability, Mass Conservation
  # ==========================================================================

  - id: dt_anuga_013
    symptom:
      description: >
        Simulation crashes with NaN or Inf values in stage or momentum after
        running for some time. The log may show 'WARNING: set_timestep is
        zero' or the evolve loop raises a FloatingPointError.
    diagnosis:
      root_cause: >
        CFL violation causing numerical instability. ANUGA uses adaptive
        timestepping with CFL condition: dt <= CFL * min(dx / sqrt(g*h))
        across all triangles. If a single triangle has very small area
        (high resolution) combined with deep water, dt becomes extremely
        small. If the mesh has degenerate (very thin/long) triangles, the
        effective dx is near zero, forcing dt to zero, which causes NaN.
    remedy:
      action: >
        Check mesh quality: avoid degenerate triangles by ensuring the mesh
        generator has reasonable minimum angle constraints. ANUGA's default
        mesh generator (Triangle) usually handles this, but imported meshes
        may have poor quality. Use anuga.mesh_statistics(domain) to check.
        If NaN occurs with deep water, reduce maximum_triangle_area to get
        more uniform mesh cells. Try domain.set_CFL(0.5) instead of default.

  - id: dt_anuga_014
    symptom:
      description: >
        Checkerboard pattern in water depth: alternating wet and dry cells
        across the mesh. Small spurious oscillations appear near the wetting
        front. The wet/dry interface shows unrealistic behavior.
    diagnosis:
      root_cause: >
        Wet/dry instability in the shallow water solver. ANUGA handles
        wetting and drying, but on coarse meshes or with abrupt topography
        transitions, the wetting front can oscillate. The DE0 algorithm
        is more robust than older schemes but can still exhibit this on
        meshes with insufficient resolution at the wet/dry interface.
    remedy:
      action: >
        Increase mesh resolution near the expected wetting front using
        interior_regions with smaller max_area. Ensure the 'DE0' flow
        algorithm is selected (most stable for wet/dry). Adding a small
        Manning's n (>= 0.01) helps dampen oscillations. For very flat
        terrain, ensure the DEM does not have single-cell depressions
        that trap water artifacts.

  - id: dt_anuga_015
    symptom:
      description: >
        Total water volume in the domain does not balance: rainfall input
        minus outflow does not equal stored volume change. Mass conservation
        error exceeds 5-10% over the simulation.
    diagnosis:
      root_cause: >
        Transmissive boundaries can both remove and inject water depending
        on local flow conditions. If the boundary water depth oscillates,
        small amounts of water can be spuriously injected at each cycle.
        Additionally, very coarse meshes lose mass accuracy in the
        finite-volume integration. Large yieldstep values can mask
        transient mass balance errors between output times.
    remedy:
      action: >
        Check mass balance with domain.report_water_volume_statistics().
        Reduce yieldstep to capture transient behavior. For strict mass
        conservation, use Dirichlet_boundary with a prescribed constant
        stage at the outlet instead of Transmissive_boundary. Increase mesh
        resolution in areas with complex flow patterns.

  # ==========================================================================
  # BUILD_RUNTIME: Python Import, C Extension, Parallel Issues
  # ==========================================================================

  - id: dt_anuga_016
    symptom:
      description: >
        'import anuga' fails with ImportError referencing a missing .so or
        .cpython-312-x86_64-linux-gnu.so file. Error mentions
        'undefined symbol' or 'cannot open shared object file'.
    diagnosis:
      root_cause: >
        ANUGA's C extensions (finite-volume kernels, mesh operations) were
        compiled for a different Python version or architecture. The
        .so files in the anuga package directory do not match the current
        Python interpreter. This commonly happens after a Python upgrade
        (e.g., 3.11 to 3.12) without reinstalling ANUGA.
    remedy:
      action: >
        Reinstall ANUGA for the current Python: pip install --force-reinstall
        anuga. Verify with: python -c "import anuga; print(anuga.__file__)".
        The preflight_check.py script tests this automatically. If using the
        HydroCraft python_env, ensure the path
        KISSPATH_PYTHON_ENV/lib/python3.12/site-packages
        is on sys.path and matches the running Python version (3.12).

  - id: dt_anuga_017
    symptom:
      description: >
        ANUGA simulation hangs or produces a segfault during domain.evolve()
        when running in parallel (MPI). Or: sww_merge fails with 'file not
        found' for one of the processor SWW fragments.
    diagnosis:
      root_cause: >
        ANUGA parallel execution via mpirun creates per-processor domains
        and SWW files. If one MPI rank fails or is killed (e.g., OOM), its
        SWW fragment is missing or truncated, and sww_merge cannot combine
        the outputs. Additionally, running parallel ANUGA requires
        anuga.distribute to partition the domain, which is not set up
        in the default run_anuga.py tool.
    remedy:
      action: >
        For the KI workflow, run ANUGA in serial (single process) which is
        the default in run_anuga.py. If parallel is needed, use:
        domain = anuga.distribute(domain) after setup, then
        mpirun -np N python run_anuga.py. Ensure all ranks complete before
        calling sww_merge. For most catchment sizes (<100K triangles),
        serial is sufficient.

  # ==========================================================================
  # SPATIAL: CRS, DEM Alignment, Mesh Quality
  # ==========================================================================

  - id: dt_anuga_018
    symptom:
      description: >
        DEM elevation values are all NaN or a single constant across the
        entire mesh. The terrain appears completely flat despite using a
        real DEM. Simulation produces uniform shallow flow everywhere.
    diagnosis:
      root_cause: >
        The DEM GeoTIFF extent does not overlap with the ANUGA domain in
        local coordinates. run_anuga.py converts lat/lon to a local meter
        coordinate system centered at (0,0) and builds the domain polygon
        in that system. The DEM window is extracted using the lat/lon
        bounding box. If the conversion between lat/lon and local meters
        has an error (e.g., m_per_deg_lon computed at wrong latitude), the
        DEM window may miss the actual terrain. Also occurs if the DEM
        file does not cover the requested region.
    remedy:
      action: >
        Verify DEM coverage: the bounding box [lat-extent/2/111320,
        lon-extent/2/(111320*cos(lat))] must fall within the DEM file extent.
        Check with: gdalinfo china_dem_90m.tif | grep 'Upper Left\|Lower Right'.
        If using a different DEM, ensure it covers the study area. The
        elevation_func returned by load_dem_elevation logs the elevation range;
        if it says 'uniform elevation', the DEM load failed.

  - id: dt_anuga_019
    symptom:
      description: >
        Flood map is spatially displaced from the actual terrain by several
        hundred meters or more. Water flows in unexpected directions. Channels
        visible in the DEM do not appear in the correct location in ANUGA output.
    diagnosis:
      root_cause: >
        x/y axis swap in the DEM-to-mesh coordinate transformation. The
        RegularGridInterpolator in load_dem_elevation takes (y, x) order
        for the points argument, but the ANUGA mesh uses (x, y). If the
        elevation_func is called with (x, y) but interpolates as (x, y)
        instead of (y, x), the DEM is rotated 90 degrees. Also possible:
        the rasterio row/column ordering (north-to-south rows) is not
        correctly handled when building the interpolator.
    remedy:
      action: >
        Verify the elevation_func: sample a few known (x,y) points and
        compare against the DEM. The current run_anuga.py interpolator
        uses pts = np.column_stack([y, x]) which is correct for
        RegularGridInterpolator((y_coords, x_coords), grid). If modifying
        the code, ensure the axis ordering is preserved.

  - id: dt_anuga_020
    symptom:
      description: >
        ANUGA mesh has very few triangles in critical areas (channels, flood
        zones) but excessive refinement in unimportant areas. Simulation
        accuracy is poor despite high total triangle count.
    diagnosis:
      root_cause: >
        Uniform maximum_triangle_area used across the entire domain. ANUGA's
        create_domain_from_regions supports interior_regions for local mesh
        refinement, but the default run_anuga.py applies a single max_area.
        Channel areas and expected flood zones need finer resolution, while
        hilltops and dry areas can be coarser.
    remedy:
      action: >
        Use interior_regions parameter in create_domain_from_regions to
        specify polygons with smaller max_area for channels and flood zones.
        Example: interior_regions=[[channel_polygon, 100.0]] for 100 m2
        triangles in the channel, with 10000 m2 elsewhere. This can reduce
        total triangles by 10x while maintaining accuracy where needed.

  # ==========================================================================
  # OUTPUT: SWW Interpretation Errors
  # ==========================================================================

  - id: dt_anuga_021
    symptom:
      description: >
        Reported flood depth at a gauge location is 150-300m, which is
        physically impossible. The parse_anuga_output.py tool reports
        stage_m values that match terrain elevation rather than water depth.
    diagnosis:
      root_cause: >
        Stage (water surface elevation in m above datum) confused with depth
        (water thickness above bed). ANUGA stores 'stage' in the SWW file,
        which equals bed_elevation + water_depth. For terrain at 150m
        elevation with 0.5m of water, stage = 150.5m. If stage is reported
        as 'flood depth', the value appears to be 150.5m instead of 0.5m.
    remedy:
      action: >
        Always compute depth = stage - elevation. In parse_anuga_output.py,
        the extract_stage_at_gauge function correctly returns both stage and
        depth = max(stage - elevation, 0). Use the depth_m column from the
        output CSV for flood depth analysis, not stage_m. When comparing
        to gauge data, verify whether the gauge reports stage (water surface
        elevation) or depth (water thickness).

  - id: dt_anuga_022
    symptom:
      description: >
        Discharge extracted via get_flow_through_cross_section is zero or
        near-zero despite visible water flow in the domain. Or: discharge
        has the wrong sign (negative when inflow is expected).
    diagnosis:
      root_cause: >
        The cross-section polyline does not intersect any wet mesh triangles,
        or it is oriented perpendicular to the expected flow direction. ANUGA
        computes discharge as the integral of (uh, vh) dot n along the
        cross-section, where n is the outward normal. If the cross-section
        is parallel to the flow instead of perpendicular, Q is zero. If the
        polyline endpoints are outside the mesh, no triangles are intersected.
        The sign depends on which side of the polyline is 'positive'.
    remedy:
      action: >
        Ensure the cross-section polyline is perpendicular to the expected
        flow direction and fully within the mesh domain. The polyline
        coordinates must be in the same local coordinate system as the mesh
        (meters, centered at 0,0 for run_anuga.py). For run_anuga.py with
        extent_m=5000, valid coordinates are in [-2500, 2500]. To flip
        discharge sign, swap the polyline endpoint order.

  - id: dt_anuga_023
    symptom:
      description: >
        run_anuga.py aborts on any non-China site with
        "RuntimeError: DEM load failed for declared DEM
        KISSPATH_STATIC/china_dem_90m/china_dem_90m.tif:
        DEM not found" -- or, worse on an older build, silently loads a DEM
        window whose bbox lies entirely OUTSIDE the China raster and returns
        edge-clamped nonsense terrain. Seen 2026-08-09 on a HYDAT (Canada)
        site.
    diagnosis:
      root_cause: >
        load_dem_elevation() HARDCODED the China 90 m DEM path. There was no
        --dem_path option and no global fallback, so every basin outside China
        was structurally unrunnable even though MERIT DEM 90 m covers the whole
        globe on this server.
    remedy:
      action: >
        Use run_anuga.py --dem_path <geotiff>, or rely on the automatic
        resolution added 2026-08-09: --dem_path -> China 90 m DEM (only when
        the whole domain bbox fits inside its footprint) -> the overlapping
        MERIT DEM v1.0.2 tiles under KISSPATH_DATA/MERIT_DEM, mosaicked across
        a seam when the domain straddles tiles. Tile names follow the SOUTH-
        WEST corner floored to 5 degrees, so lon -121.7 lives in w125, NOT
        w120. Check run_summary.json "dem_sources" / "dem_range_m" to confirm
        which raster was actually used.

  - id: dt_anuga_024
    symptom:
      description: >
        Simulated stage at a gauge is a perfectly FLAT line (zero variance),
        so NSE is NaN or hugely negative while the flood is clearly evolving
        elsewhere in the domain. depth == 0 for every stored timestep.
    diagnosis:
      root_cause: >
        extract_stage_at_gauge() takes the mesh vertex NEAREST the gauge
        lat/lon. A published gauge position is a bank, bridge pier or cableway
        location, not a point in the channel; on a 30-90 m DEM meshed at
        200-350 m the nearest vertex is routinely a floodplain/bank cell that
        never wets. A dry vertex reports stage == its own bed elevation, i.e.
        a constant, which then gets scored as if it were a model prediction.
    remedy:
      action: >
        Pass parse_anuga_output.py --snap_to_channel_m <radius> (e.g. 400 m,
        ~2 mesh spacings) to move the extraction point to the LOWEST-elevation
        vertex within that radius -- the local channel low point, which is what
        the gauge actually measures. The tool logs the snap distance and the
        elevation drop, records both in <output>_summary.json
        "gauge_extraction", and WARNS when the chosen vertex is wet in under
        50% of stored timesteps. Treat that warning as a hard stop: re-check
        the inlet placement, the outlet side and the mesh resolution before
        scoring anything.

  - id: dt_anuga_025
    symptom:
      description: >
        Stage NSE against a real gauge is large and negative with a constant
        offset of several metres, even though Pearson r is high and the
        hydrograph timing looks right.
    diagnosis:
      root_cause: >
        Two independent datum/terrain problems, both invisible to ANUGA:
        (1) the gauge is published on an ARBITRARY vertical datum. HYDAT
        STATIONS.DATUM_ID 10 = "ASSUMED DATUM" has a meaningless zero (e.g.
        08MF005 needs +27.926 m to reach the geodetic datum), so raw levels
        are not comparable to DEM elevations at all.
        (2) even on a geodetic datum, a 30-90 m DEM records the WATER SURFACE
        at acquisition rather than the bed and resolves neither channel
        bathymetry nor engineered dikes, so the model conveys the flood across
        the whole floodplain and biases absolute stage low.
    remedy:
      action: >
        Read <csv>.meta.json from load_hydat_series.py and confirm
        datum_name is geodetic BEFORE scoring; otherwise apply the published
        STN_DATUM_CONVERSION offset or pick a different station. Never apply
        an ad-hoc "fitted" shift -- that manufactures the agreement being
        tested. When the DEM is the binding constraint, report r/timing as the
        KI-validity signal and label nse/pbias as a terrain-data statement,
        not a solver statement (dag caveat: "Gauge must report stage on the
        same vertical datum as the DEM; ANUGA carries no datum awareness").
