name: EPIC
version: "0810-ki-2.0.0"
description: |
  EPIC (Environmental Policy Integrated Climate) field-scale crop, soil water,
  nutrient and erosion model. This KI wraps the precompiled epic0810.x Linux ELF
  binary distributed with the auto_dissect EPIC tarball. Compatible with the
  EPIC1102 example file bundle after two fixes (SOIL38K alias + SOL alpha-token
  sanitization) that the tools handle automatically.

domain: agriculture/cropland
model_type: process-based field-scale crop model
language: Fortran (Intel ifort 2010 build, stripped ELF)
build: precompiled (no build step)

binary:
  path: /home/server/knowledge-dissection-toolkit/auto_dissect_multi_agent/_work_v2/EPIC/source/repo/epic0810.x
  type: ELF 64-bit LSB executable
  size_kb: ~3000

template_files:
  example_dir: /home/server/knowledge-dissection-toolkit/auto_dissect_multi_agent/_work_v2/EPIC/source/repo/epic1102_example_files_20221002
  format: Fortran fixed-width text

pipeline:
  - id: s0
    name: workspace_setup
    tool: tools/run_epic_workspace.py
    function: setup_workspace
    doc: docs/s0_workspace_setup.md
  - id: s1
    name: weather_preparation
    tool: tools/convert_forcing_to_dly.py
    function: convert
    doc: docs/s1_weather_preparation.md
  - id: s2
    name: soil_preparation
    tool: tools/convert_soil_to_sol.py
    function: convert
    doc: docs/s2_soil_preparation.md
  - id: s3
    name: execution
    tool: tools/run_epic_workspace.py
    function: run
    doc: docs/s3_execution.md
  - id: s4
    name: output_parsing
    tool: tools/parse_epic_output.py
    function: parse_dgn
    doc: docs/s4_output_parsing.md
  - id: s5
    name: calibration_validation
    tool: tools/parse_epic_output.py
    function: water_balance_summary
    doc: docs/s5_calibration_validation.md
  - id: s6
    name: diagnostics
    tool: diagnostics/triplets.yaml
    doc: docs/s6_diagnostics.md

inputs:
  forcing:
    sources: [cmfd, mswx, nasa_power, daymet, gridmet]
    timestep: daily
    variables: [tmax, tmin, prcp, srad, rh, ws]
    file_format: ".DLY  (I6,2I4,6F6.2)"
  soil:
    sources: [hwsd, ssurgo, soilgrids]
    file_format: ".SOL  19 properties × 6 layers, F8.2"
  management:
    file_format: ".OPC  fixed-width 15-column operation schedule"

outputs:
  - extension: .OUT
    description: human-readable annual report (always produced)
  - extension: .ACY
    description: annual crop yield table (toggled in PRNT1102.DAT)
  - extension: .DGN
    description: daily general output (PET, ET, LAI, BIOM, Q, ...)
  - extension: .ANN
    description: annual summary (PRCP, PET, ET, Q, IRGA, DN, ...)
  - extension: .ACN
    description: annual carbon/nitrogen mass

dependencies:
  python:
    - numpy
    - pandas
    - matplotlib
    - pyyaml
  shared:
    - ki_tools_common.load_forcing.load_daily_forcing
    - ki_tools_common.soil_utils.lookup_hwsd
    - ki_tools_common.soil_utils.rosetta_vgn
    - ki_tools_common.metrics.all_metrics
    - ki_tools_common.validation.validate_water_balance

validation:
  tier: real
  benchmark: bundled umstead_NC test case
  description: |
    The EPIC1102 example bundle ships a complete site (umstead.SIT/SOL/OPC,
    NCRDU.DLY/NCCLAYTO.WP1/.WND) for an 80-year mixed pine/hardwood stand at
    Umstead Park, NC (35.86 N, -78.78 W). After SOIL38K aliasing + SOL alpha-code
    sanitization, the EPIC0810 binary runs the 15-year simulation and produces
    a multi-year annual water balance in the .OUT report.
  metrics_target:
    annual_PRCP_mm: 1100
    annual_ET_mm: 700
    closure_error_pct: <5

stats:
  tools: 4
  docs: 6
  triplets: 18
  lines_of_python: ~900
