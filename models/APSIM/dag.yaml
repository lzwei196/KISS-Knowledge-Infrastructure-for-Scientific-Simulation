safety:
  hazards:
    - id: "weather_radn_units_megajoule"
      kind: weather_file_semantic
      description: "Solar radiation authored in W/m^2 or J/m^2/day instead of MJ/m^2/day causes 10-50x biomass over-prediction (radn should be 0-35)."
      severity: fatal
    - id: "weather_temperature_kelvin"
      kind: weather_file_semantic
      description: "Temperature supplied in Kelvin (values ~280-310) instead of Celsius accumulates extreme thermal time and crops fail to develop."
      severity: fatal
    - id: "weather_rain_subdaily_not_summed"
      kind: weather_file_semantic
      description: "Sub-daily (mm/3hr) rainfall not summed to daily totals yields ~1/8 of true rain and false drought stress."
      severity: fatal
    - id: "weather_vp_kpa_not_hpa"
      kind: weather_file_semantic
      description: "Vapour pressure in kPa instead of hPa inflates VPD and ET."
      severity: degraded
    - id: "weather_missing_tav_amp"
      kind: weather_file_semantic
      description: "Missing tav/amp header metadata leaves the CERES soil-temperature model with wrong defaults, distorting germination and root growth."
      severity: degraded
    - id: "soil_water_limit_ordering"
      kind: soil_semantic
      description: "Soil water limits not ordered AirDry <= LL15 <= DUL <= SAT per layer produce impossible water contents and crash the water balance."
      severity: fatal
    - id: "soil_thickness_cm_not_mm"
      kind: soil_semantic
      description: "Layer thickness in cm instead of mm makes the profile 10x too shallow; roots hit the bottom and over-stress."
      severity: fatal
    - id: "soil_bulk_density_kgm3"
      kind: soil_semantic
      description: "Bulk density in kg/m^3 (e.g. 1400) instead of g/cc crashes or zeroes the water balance."
      severity: fatal
    - id: "soil_array_layer_count_mismatch"
      kind: soil_semantic
      description: "Physical/Chemical/Organic/WaterBalance soil arrays of unequal length raise an index-out-of-range crash."
      severity: fatal
    - id: "cultivar_name_not_in_resource_db"
      kind: control_semantic
      description: "Cultivar name not matching the case-sensitive built-in resource database raises a null-reference crash on sowing."
      severity: fatal
    - id: "population_plants_per_ha"
      kind: control_semantic
      description: "Plant population given in plants/ha instead of plants/m^2 gives impossible density, plant die-off or astronomical LAI."
      severity: fatal
    - id: "initial_no3_silent_yield_inflation"
      kind: initial_condition_semantic
      description: "High initial NO3 silently relieves N stress and inflates yield with no error."
      severity: silent
    - id: "biomass_output_unit_misread"
      kind: parser_semantic
      description: "Grain.Wt / AboveGround.Wt are g/m^2, not kg/ha or t/ha; comparing g/m^2 to t/ha without converting gives R^2 near 0 and huge PBIAS (false validation failure)."
      severity: silent
    - id: "report_event_not_firing"
      kind: control_semantic
      description: "Report.EventNames missing [Clock].DoReport (or a crop event with the crop never sown) yields an empty Report table despite a successful run."
      severity: silent
  validation_limits:
    - "Point/field (single Zone) model; cannot represent regional/gridded aggregation directly — regional yield statistics average many fields with different soils, varieties, and management."
    - "Daily timestep cannot resolve sub-daily processes; thermal time is from 3-hourly temps interpolated from daily max/min."
    - "Function forms are calibrated to experimental datasets; applicability is bounded by the calibration range of the chosen cultivar."
    - "Soil profile solved consecutively each day (not simultaneous coupled flow); SWIM is the alternative solver for tightly-coupled flow."
  warnings:
    - "Crop assimilate production scales with RUE x intercepted radiation, so radiation units and cultivar RUE dominate biomass magnitude."
    - "APSIM can return exit code 0 even when individual simulations failed; check the _Messages table (MessageType=2) for per-simulation errors."
    - "Drainage is defined as the downward flux of the last soil layer; downstream solute leaching depends on this convention."
    - "Nutrient pools are wired by string Name lookup; renaming a soil/solute child silently breaks the C/N coupling."
  assumptions:
    - statement: "The model operates at a single point/field on an area basis with a representative plant population, not individual-plant detail."
      scope: "spatial geometry"
      source: "APSIM Plant crop-module documentation (apsim.info) and the Zone/area-basis design"
      status: adopted
    - statement: "Conservation is mass-balance for water and soil C/N; MicroClimate provides a potential-ET energy term but the model does not close a surface energy budget."
      scope: "closure"
      source: "APSIM crop-growth-and-development framework docs and MicroClimate / WaterBalance module behavior in ApsimX source"
      status: adopted
    - statement: "Basic physiological principles are treated as essentially the same across species, with species/cultivar differences captured solely through parameter inputs in the Plant Modelling Framework."
      scope: "cross-species generalisation"
      source: "APSIM Plant module design-premise documentation (apsim.info)"
      status: adopted
    - statement: "The soil profile is solved consecutively (process-by-process) each day rather than as simultaneous coupled differential flow equations (the SWIM alternative)."
      scope: "soil water numerics"
      source: "APSIM SoilWat vs SWIM documentation (apsim.info)"
      status: adopted
    - statement: "Germination is taken to occur the day after sowing once soil water in the sowing layer exceeds the pesw_germ threshold."
      scope: "phenology initiation"
      source: "APSIM Plant module phenology documentation (apsim.info)"
      status: adopted

medium_evidence:
  - var: "Grain.Wt"
    source: "SKILL.md"
    quote: "It models crop growth, soil water balance, nitrogen cycling, and management operations at field/point scale with a daily timestep."
    note: "APSIM is declared as a crop and farming-system simulator at field/point scale, so grain yield is a crop/plant-area output."
  - var: "Leaf.LAI"
    source: "KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1002_csc2.20857.txt"
    quote: "The maize model simulates phenology, leaf development and senescence, and biomass accumulation and partitioning across nine crop phases."
    note: "The cited APSIM crop model statement places LAI with crop leaf/canopy development."
  - var: "Phenology.Stage / flowering & maturity date"
    source: "KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1038_s41598-020-74740-3.txt"
    quote: "Disturbance mainly causes a shift in phenological development of crops and affects their economic yield."
    note: "The paper ties phenological development to cereal crop growth and development."
  - var: "Root.RootingDepth"
    source: "KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1002_csc2.20857.txt"
    quote: "this parameter determines the root front velocity, and affects soil water and nitrogen availability to the plant at each of the 12 APSIM crop stages."
    note: "Rooting depth is the crop root front in the soil profile, controlling plant access to soil water and nitrogen."
