model:
  name: "Noah_MP"
  version: "5.2.0"
  domain: "land_surface"
  description: "Noah Multi-Parameterization Land Surface Model — coupled energy, water, and carbon cycle simulation"
  binary_path: "KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/Noah_MP/run_fullyear/hrldas.exe"
  driver: "HRLDAS (High Resolution Land Data Assimilation System)"
  language: "Fortran (F90/F2003/F2008)"

inputs:
  forcing:
    format: "NetCDF (one file per timestep: YYYYMMDDHH.LDASIN_DOMAIN1)"
    variables:
      - name: "T2D"
        description: "2-m air temperature"
        unit: "K"
        valid_range: [200.0, 340.0]
      - name: "Q2D"
        description: "2-m specific humidity"
        unit: "kg/kg"
        valid_range: [0.0, 0.04]
      - name: "U2D"
        description: "10-m U wind component"
        unit: "m/s"
        valid_range: [-50.0, 50.0]
      - name: "V2D"
        description: "10-m V wind component"
        unit: "m/s"
        valid_range: [-50.0, 50.0]
      - name: "PSFC"
        description: "Surface pressure"
        unit: "Pa"
        valid_range: [50000.0, 110000.0]
      - name: "SWDOWN"
        description: "Downward shortwave radiation"
        unit: "W/m2"
        valid_range: [0.0, 1400.0]
      - name: "LWDOWN"
        description: "Downward longwave radiation"
        unit: "W/m2"
        valid_range: [50.0, 600.0]
      - name: "RAINRATE"
        description: "Precipitation rate"
        unit: "mm/s"
        valid_range: [0.0, 0.03]

  parameters:
    critical:
      - name: "surface_runoff_option"
        valid_range: [1, 8]
        description: "Runoff generation scheme (SIMGM/SIMTOP/Schaake96/BATS/VIC/XAJ)"
      - name: "subsurface_runoff_option"
        valid_range: [1, 6]
        description: "Subsurface runoff / baseflow scheme"
      - name: "DKSAT"
        valid_range: [1.0e-7, 1.0e-4]
        description: "Saturated hydraulic conductivity (m/s)"
      - name: "SMCMAX"
        valid_range: [0.3, 0.5]
        description: "Porosity / max volumetric soil moisture (m3/m3)"
      - name: "BEXP"
        valid_range: [2.0, 13.0]
        description: "Clapp-Hornberger B exponent"
      - name: "MFSNO"
        valid_range: [1.0, 4.0]
        description: "Snowmelt curve parameter"
      - name: "VCMX25"
        valid_range: [20.0, 80.0]
        description: "Max carboxylation rate at 25C (umol/m2/s)"

  setup_file:
    format: "NetCDF (HRLDAS setup/initialization)"
    variables:
      - name: "IVGTYP"
        description: "Vegetation type index"
        unit: "integer"
      - name: "ISLTYP"
        description: "Soil type index"
        unit: "integer"
      - name: "TSLB"
        description: "Initial soil temperature per layer"
        unit: "K"
      - name: "SMOIS"
        description: "Initial volumetric soil moisture per layer"
        unit: "m3/m3"
      - name: "TMN"
        description: "Deep soil temperature"
        unit: "K"
      - name: "VEGFRA"
        description: "Vegetation fraction"
        unit: "percent"
        valid_range: [0.0, 100.0]

  namelist:
    file: "namelist.hrldas"
    block: "NOAHLSM_OFFLINE"
    key_parameters:
      - name: "noah_timestep"
        default: 900
        unit: "s"
      - name: "forcing_timestep"
        unit: "s"
        constraint: "must be integer multiple of noah_timestep"
      - name: "NSOIL"
        default: 4
        description: "Number of soil layers"

outputs:
  primary:
    format: "NetCDF (one file per output_timestep: YYYYMMDDHH00.LDASOUT_DOMAIN1)"
    variables:
      - name: "SOIL_M"
        description: "Volumetric soil moisture per layer"
        unit: "m3/m3"
        valid_range: [0.0, 0.5]
      - name: "SOIL_T"
        description: "Soil temperature per layer"
        unit: "K"
        valid_range: [240.0, 340.0]
      - name: "SFCRNOFF"
        description: "Accumulated surface runoff"
        unit: "m"
        valid_range: [0.0, 1000.0]
      - name: "UGDRNOFF"
        description: "Accumulated subsurface runoff"
        unit: "m"
        valid_range: [0.0, 1000.0]
      - name: "HFX"
        description: "Sensible heat flux"
        unit: "W/m2"
        valid_range: [-200.0, 800.0]
      - name: "LH"
        description: "Latent heat flux"
        unit: "W/m2"
        valid_range: [-50.0, 1000.0]
      - name: "GRDFLX"
        description: "Ground heat flux"
        unit: "W/m2"
        valid_range: [-200.0, 200.0]
      - name: "FSA"
        description: "Absorbed shortwave radiation"
        unit: "W/m2"
        valid_range: [0.0, 1200.0]
      - name: "FIRA"
        description: "Net longwave radiation"
        unit: "W/m2"
        valid_range: [0.0, 500.0]
      - name: "SNOWH"
        description: "Snow depth"
        unit: "m"
        valid_range: [0.0, 10.0]
      - name: "SNEQV"
        description: "Snow water equivalent"
        unit: "mm"
        valid_range: [0.0, 5000.0]
      - name: "GPP"
        description: "Gross primary productivity"
        unit: "g C/m2/s"
        valid_range: [0.0, 50.0e-6]
      - name: "NEE"
        description: "Net ecosystem exchange"
        unit: "g C/m2/s"
      - name: "LAI"
        description: "Leaf area index"
        unit: "m2/m2"
        valid_range: [0.0, 10.0]
      - name: "ALBEDO"
        description: "Surface albedo"
        unit: "dimensionless"
        valid_range: [0.0, 1.0]

known_issues:
  - id: "dt_001"
    description: "Temperature forcing must be Kelvin, not Celsius — causes NaN crash"
  - id: "dt_002"
    description: "Precipitation rate must be mm/s, not mm/hr — causes instant soil saturation"
  - id: "dt_003"
    description: "Must use specific humidity (kg/kg), not relative humidity — causes extreme LH"
  - id: "dt_007"
    description: "VEGFRA 0-1 vs 0-100 mismatch causes zero vegetation"
  - id: "dt_008"
    description: "NoahmpTable.TBL MMINLU must match setup file classification"
  - id: "dt_009"
    description: "forcing_timestep must divide evenly into noah_timestep"
