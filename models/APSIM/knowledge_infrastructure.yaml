package:
  name: APSIM
  language: csharp
  implementation:
    id: apsim-ng
    version: APSIM Next Generation (ApsimX, .NET 8.0 build)
    provenance: C#; APSIM Initiative ApsimX Next Generation, JSON .apsimx simulations with SQLite output.
  scientific_reference_version: APSIM Next Generation (Plant Modelling Framework lineage; daily soil-plant-atmosphere
    continuum)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/APSIM/source/repo/bin/Release/net8.0/apsim
    type: work_dir
pipeline:
  stages:
  - s0_configuration
  - s1_domain_setup
  - s2_weather_preparation
  - s3_simulation_assembly
  - s4_execution
  - s5_output_parsing
  - s6_validation
  - s7_calibration
tools:
  count: 5
  files:
  - tools/build_apsimx.py
  - tools/convert_met.py
  - tools/convert_soil.py
  - tools/parse_output.py
  - tools/run_apsim.py
inputs:
  forcing:
  - name: Solar radiation (radn)
    unit: MJ/m^2/day
  - name: Maximum temperature (maxt)
    unit: degC
  - name: Minimum temperature (mint)
    unit: degC
  - name: Rainfall (rain)
    unit: mm/day
  - name: Vapour pressure (vp)
    unit: hPa
  - name: Wind (wind)
    unit: m/s
  - name: Pan evaporation (pan)
    unit: mm/day
  - name: Atmospheric CO2 (co2)
    unit: ppm
  - name: Air pressure
    unit: hPa
  parameters:
  - name: tav (annual average ambient temperature)
    unit: degC
  - name: amp (annual amplitude of mean monthly temperature)
    unit: degC
  - name: latitude / longitude
    unit: decimal degrees
  - name: Layer thickness
    unit: mm
  - name: Bulk density (BD)
    unit: g/cc
  - name: AirDry / LL15 / DUL / SAT
    unit: mm/mm
  - name: Saturated hydraulic conductivity (KS)
    unit: mm/day
  - name: Crop lower limit (LL)
    unit: mm/mm
  - name: Root uptake rate (KL)
    unit: /day
  - name: Root exploration factor (XF)
    unit: dimensionless
  - name: Soil evaporation U / Cona (Summer/Winter)
    unit: mm; mm/d^0.5
  - name: Bare-soil curve number (CN2Bare) / Salb / SWCON / diffusivity
    unit: dimensionless; 0-1; 0-1
  - name: Crop/cultivar genetic coefficients
    unit: mixed (degC.d, g/MJ, dimensionless)
  initial_conditions:
  - name: Initial soil water per layer (SW)
    unit: mm/mm
  - name: Initial mineral N pools (NO3, NH4, Urea per layer)
    unit: kg/ha
  - name: Initial organic C/N pools and surface residue
    unit: kg/ha; %
  boundary_conditions:
  - name: Sowing (Population, Cultivar, Depth, RowSpacing)
    unit: plants/m^2; string; mm; mm
  - name: Fertiliser application (Amount, Depth, Type)
    unit: kg/ha; mm; enum (NO3N/NH4N/UreaN)
  - name: Irrigation application (Amount, Depth, Efficiency)
    unit: mm; mm; 0-1
  - name: Harvest operation
    unit: event/date
  - name: Simulation period (Clock Start/End)
    unit: date
  - name: Zone area
    unit: ha
  - name: Reported variables and reporting event
    unit: variable list; event name
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - Grain.Wt
  - AboveGround.Wt
  - Leaf.LAI
  - Phenology.Stage / flowering & maturity date
  - Root.RootingDepth
  - Soil.Water.SW / ESW
  - SoilWater.Drainage / Runoff / Es
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=-14.688, KGE=-0.979, R=0.990, 2 scorecard(s)'
  metrics:
    best_nse: -14.688
    best_kge: -0.979
    best_r: 0.99
summary:
  total_tools: 5
  total_stage_docs: 8
  total_diagnostic_triplets: 20
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
