outputs:
  - var: "OUT_RUNOFF"
    validation_rank: 2
    unit: "mm"
    description: "Surface runoff generated by the variable infiltration capacity partition (per timestep total)."
    emitted_in: "per-cell ASCII flux file (classic driver); column position controlled by OUTVAR list in the global parameter file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "VIC has no internal routing; gauge streamflow requires post-hoc routing of OUT_RUNOFF+OUT_BASEFLOW before comparison."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Cells are independent; aggregating to basin scale requires routing to be meaningful for hydrograph comparisons."
      detrending_options: ["none", "first_difference", "linear_residual"]
  - var: "OUT_BASEFLOW"
    validation_rank: 6
    unit: "mm"
    description: "Subsurface drainage from the bottom soil layer via the ARNO / non-linear baseflow function."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Baseflow comparison is typically against hydrograph separation of observed streamflow; direct gauge observations of baseflow are rare."
      detrending_options: ["none", "linear_residual"]
  - var: "OUT_DISCHARGE"
    validation_rank: 1
    unit: "m^3/s"
    description: "Routed discharge value emitted only by the lake module; for non-lake cells streamflow is not produced internally."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Inside VIC, OUT_DISCHARGE is generated only by the optional lake module; basin-scale discharge against a gauge requires an external routing model."
      detrending_options: ["none"]
  - var: "OUT_EVAP"
    validation_rank: 3
    unit: "mm"
    description: "Total evapotranspiration (canopy interception + transpiration + bare soil + sublimation, per timestep)."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Eddy-covariance comparison requires conversion between mm and W/m^2 and energy-balance closure adjustment of the observation."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Remote-sensing ET products carry their own model assumptions; not an independent benchmark in the strict sense."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none", "linear_residual"]
  - var: "OUT_SOIL_MOIST"
    validation_rank: 7
    unit: "mm"
    description: "Per-layer soil moisture (liquid + ice) integrated over the layer."
    emitted_in: "per-cell ASCII flux file (one column per soil layer)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "In-situ probes measure volumetric moisture over a narrow depth range; convert VIC layer-integrated mm to volumetric and align depths."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "ranking_quality"]
          determining_metric: "csi"
          caveats:
            - "Satellite soil moisture senses only the top ~5 cm; map to VIC top-layer with a representative-depth caveat."
      detrending_options: ["none", "first_difference"]
  - var: "OUT_SWE"
    validation_rank: 4
    unit: "mm"
    description: "Total snow water equivalent of the ground snowpack."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "timing_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "SNOTEL / pillow observations are point measurements; subgrid heterogeneity within the VIC cell is not resolved."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "timing_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Passive-microwave SWE retrievals saturate above ~150-200 mm and degrade in forested cells."
      detrending_options: ["none"]
  - var: "OUT_SNOW_MELT"
    validation_rank: 8
    unit: "mm"
    description: "Snowmelt flux from the ground snowpack."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["timing_accuracy", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Direct melt observations are scarce; lysimeter or differenced-SWE proxies typical."
      detrending_options: ["none"]
  - var: "OUT_SOIL_TEMP"
    validation_rank: 9
    unit: "degC"
    description: "Soil temperature per layer (and OUT_SOIL_TNODE per thermal node)."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Match observation depth to the VIC layer or interpolate between nearest thermal nodes."
      detrending_options: ["none"]
  - var: "OUT_LATENT"
    validation_rank: 10
    unit: "W/m^2"
    description: "Surface latent heat flux."
    emitted_in: "per-cell ASCII flux file (full-energy mode)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Eddy-covariance non-closure typically requires Bowen-ratio adjustment of the observation."
      detrending_options: ["none"]
  - var: "OUT_SENSIBLE"
    validation_rank: 11
    unit: "W/m^2"
    description: "Surface sensible heat flux."
    emitted_in: "per-cell ASCII flux file (full-energy mode)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "OUT_R_NET"
    validation_rank: 12
    unit: "W/m^2"
    description: "Net all-wave radiation at the surface."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "OUT_ALBEDO"
    validation_rank: 13
    unit: "fraction"
    description: "Surface broadband albedo (snow + canopy + bare soil composite)."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Satellite albedo (MODIS MCD43) is narrow-to-broadband; account for spectral conversion."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Flux-tower pyranometer pairs measure broadband albedo at point scale; subgrid heterogeneity within the VIC cell is not resolved."
      detrending_options: ["none"]
  - var: "OUT_ZWT"
    validation_rank: 5
    unit: "cm"
    description: "Water table depth below the surface."
    emitted_in: "per-cell ASCII flux file"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats:
            - "VIC water table is derived from layer moisture; comparison to well levels is qualitative."
      detrending_options: ["none", "linear_residual"]
  - var: "OUT_GPP"
    validation_rank: 14
    unit: "g C/m^2/day"
    description: "Vegetation gross primary production from the optional CARBON module."
    emitted_in: "per-cell ASCII flux file (CARBON mode)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Eddy-covariance NEE partitioning into GPP/Reco carries partitioning uncertainty."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none"]
  - var: "OUT_LAKE_VOLUME"
    validation_rank: 15
    unit: "m^3"
    description: "Composite within-cell lake volume (LAKES mode)."
    emitted_in: "per-cell ASCII flux file (LAKES mode)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Composite-lake assumption: multiple lakes in one cell are not resolved."
      detrending_options: ["none"]

influence:
  _caveat: "Forcing-lever edges (PREC, AIR_TEMP, SWDOWN/LWDOWN -> outputs) are graded HIGH/MEDIUM on mechanistic dominance and qualitative SHAP attribution (ijde2026) rather than on classical variance-based SA, because cited VIC SA literature (Demaria 2007; Gou 2020; Sepulveda 2022; Bennett 2018) varies soil/veg/snow parameters under fixed or scenario weather and does not compute Sobol/Morris/EFAST indices on the meteorological forcings themselves."
  edges:
    - from: "binfilt (b_infilt)"
      to: "OUT_RUNOFF"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["demaria2007_vic_monte_carlo", "gou2020_vic_china_calibration", "sepulveda2022_vic_hydroclimatic_gradient"]
    - from: "binfilt (b_infilt)"
      to: "streamflow (post-routed OUT_RUNOFF+OUT_BASEFLOW)"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["demaria2007_vic_monte_carlo", "gou2020_vic_china_calibration"]
    - from: "Ds"
      to: "OUT_BASEFLOW"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["demaria2007_vic_monte_carlo", "sepulveda2022_vic_hydroclimatic_gradient"]
    - from: "Dsmax"
      to: "OUT_BASEFLOW"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["demaria2007_vic_monte_carlo", "sepulveda2022_vic_hydroclimatic_gradient"]
    - from: "Ws"
      to: "OUT_BASEFLOW"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["demaria2007_vic_monte_carlo", "sepulveda2022_vic_hydroclimatic_gradient"]
    - from: "expt (Brooks-Corey drainage exponent)"
      to: "OUT_RUNOFF"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "strongly hydroclimate-dependent"
      citations: ["demaria2007_vic_monte_carlo", "sepulveda2022_vic_hydroclimatic_gradient"]
    - from: "depth_layer1 (D1)"
      to: "OUT_RUNOFF"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "most Chinese basins (Gou 2020)"
