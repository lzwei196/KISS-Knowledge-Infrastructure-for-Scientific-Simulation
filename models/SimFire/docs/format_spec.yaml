  remedy: 'Disable recording or save intermediate results.; None; [''Set record: false in config for long
    runs'', ''For visualization, run shorter segments with record: true'', ''Or save fire_map snapshots
    and create animation post-hoc'']; Estimate memory: n_frames × H × W × 3 bytes (RGB)'
  severity: degraded
- id: dt_015
  symptom: Fire appears briefly then disappears. Burned pixels revert to BURNED status immediately.
  diagnosis: max_fire_duration too low (1-2 frames). Fire sprites pruned before spreading.; The RothermelFireManager
