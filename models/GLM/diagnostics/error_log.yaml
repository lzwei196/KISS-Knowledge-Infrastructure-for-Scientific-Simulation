- id: err_003
  timestamp: '2026-03-22T05:25:24Z'
  recorded_by: server
  run_context:
    basin: Miyun
    model: GLM
    run_name: miyun_glm_test
  stage: s8_execution
  failure_domain: silent_error
  symptom:
    description: 'GLM v3.3.3 ice model fails on deep lakes (>50m) with daily forcing: surface T asymptotes to 0.002 C but
      never crosses 0 C. Tested with lw_factor from 0.5-1.0, coef_wind_stir 0.18-0.40, wind_factor 0.7-1.0 — min surface T
      always 0.002134 C. Even with extreme lw_factor=0.50 (unrealistic), ice never forms.'
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: GLM ice formation requires surface layer temperature to drop below 0 C. For very deep reservoirs (~60m depth,
      ~188 km2, ~4.5 billion m3 volume), the enormous thermal inertia prevents the surface from crossing the freezing threshold
      at daily timestep resolution. The 0.002 C floor appears to be a numerical artifact in the surface energy balance solver.
    explanation: ''
    affected_components:
    - snowice_block
    - glm_surface
    - mixing_block
  resolution:
    action: Document as known limitation. Ice simulation on deep reservoirs requires either (1) subdaily forcing with correct
      parsing, or (2) a future GLM patch to handle ice nucleation at near-zero temperatures. The thermal simulation (stratification,
      seasonal cycle) is accurate without ice.
    files_changed: []
    prevention: For deep reservoirs at high latitudes, verify ice formation against published data. Consider GLM-AED with
      subdaily forcing if ice is critical.
  severity: silent
  promoted: false
  promoted_as: ''
- id: err_004
  timestamp: '2026-03-22T05:25:36Z'
  recorded_by: server
  run_context:
    basin: Miyun
    model: GLM
    run_name: miyun_glm_test
  stage: s2_met_forcing
  failure_domain: silent_error
  symptom:
    description: CMFD met forcing converted to GLM has zero precipitation (Rain=0, Snow=0 for all timesteps). Miyun receives
      ~480mm/yr but the met file has none. Lake water balance is inflow-dominated only.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: The CMFD-to-GLM conversion pipeline (convert_met_to_glm.py) does not include precipitation from CMFD prec
      variable. The VIC forcing files used as source may also have precipitation in a different column format not mapped to
      GLM Rain/Snow columns.
    explanation: ''
    affected_components:
    - convert_met_to_glm
  resolution:
    action: Add precipitation extraction to convert_met_to_glm.py. For CMFD, use the prec variable (mm/3hr) and convert to
      m/day. Split into rain vs snow based on air temperature threshold (0 C).
    files_changed: []
    prevention: Validate that Rain column in met CSV has non-zero values. Annual sum should be approximately basin annual
      precipitation in meters.
  severity: silent
  promoted: false
  promoted_as: ''
- id: err_005
  timestamp: '2026-03-22T05:25:46Z'
  recorded_by: server
  run_context:
    basin: Miyun
    model: GLM
    run_name: miyun_glm_test
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: 3-hourly met forcing with subdaily=.true. produces unrealistic summer surface temp (max 4.5 C instead of
      28+ C). Met file has correct summer air temps (~30 C) but GLM output shows no seasonal cycle.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: When subdaily=.true. with timefmt=2, GLM reads 3-hourly datetime timestamps but may not interpolate correctly
      between entries, or may apply the forcing at wrong times. The daily forcing with subdaily=.false. works correctly.
    explanation: ''
    affected_components:
    - meteorology_block
    - convert_met_to_glm
  resolution:
    action: Use daily forcing with subdaily=.false. for CMFD data. The 3-hourly forcing requires further investigation of
      timestamp alignment and potential timezone issues between CMFD UTC+8 and GLM timezone parameter.
    files_changed: []
    prevention: When using subdaily forcing, validate first 7 days of output against expected seasonal pattern before running
      full simulation.
  severity: degraded
  promoted: false
  promoted_as: ''
- id: err_006
