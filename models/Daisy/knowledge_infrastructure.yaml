# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: Daisy
  language: c++
  implementation:
    id: daisy-cpp
    version: 7.1.4
    provenance: C++; University of Copenhagen Agrohydrology group (Per Abrahamsen, Søren Hansen); 1D mechanistic
      soil-plant-atmosphere system model.
  scientific_reference_version: Daisy 7.1.x — open Soil-Plant-Atmosphere system model (Abrahamsen & Hansen
    2000 lineage; University of Copenhagen Agrohydrology group)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/Daisy/source/repo/build/linux-gcc-portable/daisy
    type: work_dir
pipeline:
  stages:
  - s1_weather_preparation
  - s2_soil_definition
  - s3_management_setup
  - s4_execution
  - s5_output_analysis
  - s6_validation
tools:
  count: 5
  files:
  - tools/calib_run.py
  - tools/convert_soil_to_dai.py
  - tools/convert_weather_to_dwf.py
  - tools/parse_daisy_output.py
  - tools/run_daisy.py
inputs:
  forcing:
  - name: GlobRad
    unit: W/m^2
  - name: AirTemp
    unit: dgC
  - name: Precip
    unit: mm/d
  - name: RefEvap
    unit: mm/d
  - name: Wind
    unit: m/s
  - name: RelHum
    unit: '% (0-100)'
  - name: VapPres
    unit: Pa
  - name: Atmospheric N deposition (NH4/NO3 wet/dry)
    unit: ppm / kg N/ha/year
  parameters:
  - name: Soil texture (clay / silt / sand fractions)
    unit: fraction 0-1
  - name: Humus / organic fraction
    unit: fraction 0-1
  - name: Dry bulk density
    unit: g/cm^3
  - name: C/N ratio
    unit: g C / g N
  - name: van Genuchten-Mualem retention parameters (Theta_res, Theta_sat, alpha, n)
    unit: dimensionless; alpha in cm^-1
  - name: Saturated hydraulic conductivity K_sat
    unit: cm/h
  - name: Crop / vegetation parameters
    unit: various
  - name: Organic-matter pool initialization (input C, root C, end depth)
    unit: kg C/ha/y; cm
  initial_conditions:
  - name: Initial soil water content per layer
    unit: cm^3/cm^3 (or pressure h in cm)
  - name: Initial soil mineral N pools (NH4, NO3) per layer
    unit: kg N/ha
  - name: Initial soil organic-matter and microbial-biomass pools
    unit: kg C/ha; kg N/ha
  boundary_conditions:
  - name: Simulation period (start / stop dates)
    unit: YYYY MM DD HH
  - name: Groundwater lower-boundary model
    unit: categorical
  - name: SVAT / energy-balance option
    unit: categorical (None | PMSW | SSOC)
  - name: MaxRootingDepth
    unit: cm
  - name: Management operations (sow, fertilize, irrigate, plow, seedbed prep, harvest, tillage)
    unit: various (kg N/ha mineral; T w.w./ha organic; mm irrigation; cm tillage)
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - sorg_DM
  - harvest_index
  - Harvest_N
  - Leaching
  - Denitrification
  - Evapotranspiration
  - Drain / Percolation
  - Theta
  - Soil temperature
  - DS
  - LAI
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.651, KGE=0.727, R=0.807, 2 scorecard(s)'
  metrics:
    best_nse: 0.6511
    best_kge: 0.7272
    best_r: 0.8072
summary:
  total_tools: 5
  total_stage_docs: 6
  total_diagnostic_triplets: 19
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
