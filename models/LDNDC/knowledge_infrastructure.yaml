package:
  name: LDNDC
  language: c++
  implementation:
    id: ldndc-1.37-linux64
    version: '1.37'
    provenance: C++11; KIT/IMK-IFU precompiled closed-source linux64 binary (bin/ldndc) realizing the
      MoBiLE modular framework.
  scientific_reference_version: LandscapeDNDC 1.37.0 (MoBiLE framework; Models Description Apr 2026),
    MeTrx soil-biogeochemistry lineage from Arable-DNDC / Forest-DNDC
  binary:
    path: KISSPATH_BINARIES/ldndc/ldndc-1.37.linux64/bin/ldndc
    type: ELF
pipeline:
  stages:
  - s10_vic_coupling_skill
  - s1_installation_skill
  - s1_project_setup_skill
  - s2_site_config_skill
  - s3_setup_modules_skill
  - s4_climate_prep_skill
  - s5_airchemistry_prep_skill
  - s6_management_config_skill
  - s7_species_params_skill
  - s8_execution_skill
  - s9_coupling_skill
  - s9_output_parsing_skill
tools:
  count: 20
  files:
  - tools/run_ldndc_bengbu_ghg.py
  - tools/run_ldndc_rice_paddy_ch4.py
  - tools/s10_vic_coupling/vic_soil_to_ldndc_site.py
  - tools/s10_vic_coupling/vic_to_ldndc_climate.py
  - tools/s10_vic_coupling/vic_to_ldndc_soilwater.py
  - tools/s1_project_setup/create_project_structure.py
  - tools/s1_project_setup/generate_project_xml.py
  - tools/s2_site_config/generate_site_xml.py
  - tools/s2_site_config/hwsd_to_ldndc_soil.py
  - tools/s3_setup_modules/generate_setup_xml.py
  - tools/s4_climate_prep/convert_forcing_to_ldndc_climate.py
  - tools/s4_climate_prep/validate_climate_file.py
  - tools/s5_airchemistry_prep/generate_airchemistry_file.py
  - tools/s6_management_config/generate_management_xml.py
  - tools/s7_species_params/validate_species_params.py
  - tools/s8_execution/run_ldndc.py
  - tools/s9_output_parsing/aggregate_annual_budget.py
  - tools/s9_output_parsing/parse_physiology_output.py
  - tools/s9_output_parsing/parse_soilchemistry_output.py
  - tools/s9_output_parsing/parse_watercycle_output.py
inputs:
  forcing:
  - name: tavg (or tmin/tmax)
    unit: degC
  - name: prec
    unit: mm/day
  - name: grad (incoming global shortwave radiation)
    unit: W m-2
  - name: lrad (incoming longwave radiation)
    unit: W m-2
  - name: wind
    unit: m s-1
  - name: rh / vpd / press (humidity, vapour pressure deficit, air pressure)
    unit: '% / kPa / mbar'
  - name: co2
    unit: ppm
  - name: N deposition (nh4_dep, no3_dep)
    unit: kgN/ha/yr
  parameters:
  - name: texture fractions (clay, sand, silt)
    unit: fraction (0-1)
  - name: bulk density (bd)
    unit: g/cm3
  - name: soil organic carbon content (corg)
    unit: mass fraction
  - name: soil organic nitrogen content (norg)
    unit: mass fraction
  - name: stone/gravel fraction
    unit: fraction
  - name: saturated hydraulic conductivity (sks)
    unit: cm/min
  - name: pH
    unit: '-'
  - name: crop/vegetation species coefficients
    unit: various
  - name: site/soil/global biogeochemical defaults (Lresources)
    unit: various
  initial_conditions:
  - name: initial soil organic C pools
    unit: kgC/ha
  - name: initial soil organic and mineral N pools
    unit: kgN/ha
  - name: initial per-layer soil water and groundwater state
    unit: mm / m
  boundary_conditions:
  - name: simulation schedule and site geometry (lat, lon, time span)
    unit: '-'
  - name: MoBiLE modulelist (ecosystem + process kernel choice)
    unit: '-'
  - name: sowing/planting events
    unit: '-'
  - name: fertilization events
    unit: kgN/ha
  - name: tillage events
    unit: m (depth), 0-1 (intensity)
  - name: harvest / cutting / grazing events
    unit: 0-1 (residue fraction)
  - name: irrigation events
    unit: mm
  - name: flood / drain events
    unit: mm depth / DOY
  - name: output sink configuration
    unit: '-'
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - dN_n2o_emis
  - dN_no_emis
  - dC_co2_emis_hetero
  - dC_ch4_emis
  - dN_no3_leach
  - evapotranspiration
  - yield
  - lai
  other: []
validation:
  tier: validated
  tier_justification: 'measured: 8 scorecard(s)'
summary:
  total_tools: 20
  total_stage_docs: 12
  total_diagnostic_triplets: 27
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
