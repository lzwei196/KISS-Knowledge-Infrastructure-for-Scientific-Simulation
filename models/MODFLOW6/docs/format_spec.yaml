  severity: silent
- id: dt_mf6_015
  symptom: Baseflow exported to routing model has wrong sign. Routing receives negative flow values. Or
    baseflow is subtracted from streamflow instead of added.
  diagnosis: 'MODFLOW budget convention uses negative values for outflow (DRN, WEL extraction). Routing
