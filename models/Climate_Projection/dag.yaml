template_version: "3.5"

identity:
  model_id: "Climate_Projection"
  scientific_reference_version: "Delta-change (change-factor) downscaling of CMIP6 bias-corrected projections for VIC; HydroCraft Climate_Projection pipeline (S1 extract -> S2 deltas -> S3 apply -> S4 ensemble)"
  implementation:
    id: "climate-projection-deltachange"
    version: "HydroCraft KI (Jianyun Zhang Research Group); unversioned"
    provenance: "Python; 3-stage delta-change forcing-generation + VIC ensemble-orchestration pipeline; consumes already-bias-corrected CMIP6 (China Cmip6BaisCorrect product or global NASA NEX-GDDP-CMIP6)."
  ki_class: "hybrid_or_framework"
  is_family_dag: false
  language: "python"
  license: ""
  repo_url: ""

boundary:
  scope_in:
    - "Derive monthly CMIP6 climate-change signals (future vs historical climatology)"
    - "Apply delta signals to a baseline VIC forcing to generate projected future forcing"
    - "Orchestrate a multi-model / multi-scenario VIC + routing ensemble and summarise hydrologic change"
  scope_out:
    - "VIC calibration (assumed done upstream)"
    - "Raw GCM bias correction (uses already-bias-corrected products)"
    - "Change in wind, pressure, shortwave/longwave radiation, humidity (passed through unchanged)"
    - "Internal hydrological state evolution (occurs in the downstream VIC model, not here)"
  spatial: "2-D grid"
  temporal: "daily"
  closure: "none"
  notes: "This is a forcing-generation and ensemble-orchestration framework, not a balance-closing physical model. Delta-change is a stateless transform: only monthly means of temperature (additive) and precipitation (multiplicative) are altered; the remaining four of seven VIC forcing variables (wind, pressure, shortwave/longwave radiation, humidity) pass through from the baseline. Mass/energy closure is a property of the downstream VIC model. The China bias-corrected path is mainland-China-only (73.75-135.25E, 15.25-53.75N, 0.25 deg, 4163 land cells); the NEX-GDDP path is global at 0.25 deg."

inputs:
  forcing:
    - category: "climate_change_signal"
      name: "pr"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "CMIP6 bias-corrected daily series; China tab-separated text (Cor_{Model}_PreDaily.txt, 3 metadata cols + 2 header rows) or global NEX-GDDP-CMIP6 NetCDF"
      notes: "Multiplicative variable; only the monthly climatology is used to form a change factor. NEX-GDDP pr arrives as kg/m2/s and is unit-converted, China product is already mm/day."
    - category: "climate_change_signal"
      name: "tasmax"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "CMIP6 bias-corrected daily series (Cor_{Model}_tasmaxDaily.txt or NEX-GDDP NetCDF)"
      notes: "Additive variable; 5 China models carry precip only and lack temperature."
    - category: "climate_change_signal"
      name: "tasmin"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "CMIP6 bias-corrected daily series (Cor_{Model}_tasminDaily.txt or NEX-GDDP NetCDF)"
      notes: "Additive variable."
    - category: "baseline_meteorology"
      name: "baseline_forcing_1d (air_temp, prec, pressure, swdown, lwdown, vp/shum, wind)"
      unit: "mixed (degC, mm, kPa, W/m2, W/m2, kPa, m/s)"
      source_kind: "forcing"
      model_input_format: "VIC forcing_1d NetCDF (CMFD or MSWX baseline)"
      notes: "Supplies sub-daily variability and all 7 VIC variables. Temperature is shifted additively, precipitation scaled multiplicatively; the other 4 variables pass through unchanged. Baseline years are recycled (modulo) onto target years."
  parameters:
    - category: "numerical_clamp"
      name: "PR_FLOOR"
      unit: "mm/day"
      source_kind: "default"
      model_input_format: "hardcoded constant (0.1)"
      notes: "Floor on historical precip in the ratio denominator to avoid divide-by-near-zero in arid months."
    - category: "numerical_clamp"
      name: "precip_ratio_clip"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "hardcoded bounds [0.1, 5.0]"
      notes: "Hard cap on delta_pr; silently truncates extreme wet/dry change signals."
    - category: "grid_matching"
      name: "cell_match_tolerance"
      unit: "deg"
      source_kind: "default"
      model_input_format: "hardcoded nearest-neighbour acceptance radius (~0.26 deg / 0.13 deg half-cell)"
      notes: "Cells beyond tolerance are dropped as unmatched; many VIC cells may map to one CMIP6 column."
  initial_conditions: []
  boundary_conditions:
    - category: "model_selection"
      name: "MODEL_NAME"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "case-sensitive hyphenated GCM name (e.g. ACCESS-CM2)"
      notes: "Selects one GCM realisation; ensemble of >=5 recommended for uncertainty."
    - category: "scenario_selection"
      name: "SCENARIO"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "short code r1 | 126 | 245 | 585 (NOT ssp-prefixed folder names)"
      notes: "r1 = historical baseline; 245 (SSP2-4.5) is the default future scenario."
    - category: "reference_window"
      name: "REF_PERIOD"
      unit: "year-year"
      source_kind: "user_provided"
      model_input_format: "(start, end), default (1981, 2010), must lie within 1961-2014"
      notes: "Historical climatology window; must not overlap FUTURE_PERIOD or deltas collapse to ~1.0/0.0."
    - category: "projection_window"
      name: "FUTURE_PERIOD"
      unit: "year-year"
      source_kind: "user_provided"
      model_input_format: "(start, end), default (2041, 2070), must lie within 2015-2099"
      notes: "Future target window for the projected forcing."
    - category: "ensemble_member"
      name: "ENSEMBLE (r1i1p1f1)"
      unit: "n/a"
      source_kind: "default"
      model_input_format: "hardcoded NEX-GDDP global-path member"
      notes: "Only r1i1p1f1 is fetched on the global path regardless of model."
    - category: "domain_geometry"
      name: "basin_grid"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "VIC basin grid NetCDF (lat/lon + land mask)"
      notes: "Defines the cells for which CMIP6 data are extracted and matched."

processes:
  modules:
    - name: "cmip6_extraction"
      role: "driver"
      brief: "Reads China bias-corrected CMIP6 pr/tasmax/tasmin tab-separated text, nearest-neighbour matches basin grid cells to CMIP6 columns, and writes per-variable basin NetCDF for historical and future periods."
      applicability: "China domain (Cmip6BaisCorrect_for_China)"
    - name: "nex_gddp_fetch"
      role: "driver"
      brief: "Global drop-in alternative that fetches NASA NEX-GDDP-CMIP6 (0.25 deg BCSD) per year via THREDDS NCSS with spatial subsetting, retries, and yearly caching; historical labelled 'historical' (must be renamed r1 for the delta stage)."
      applicability: "basins outside China"
    - name: "cell_matcher"
      role: "allocator"
      brief: "Nearest-neighbour Euclidean matching of basin/forcing grid cells to CMIP6 or delta cells with tolerance, deduplication, and many-to-one remap."
    - name: "monthly_climatology"
      role: "process_solver"
      brief: "Groups extracted daily series by calendar month and averages over the period slice to produce a 12-month climatology for the historical and future windows."
    - name: "delta_computer"
      role: "process_solver"
      brief: "Forms change signals: multiplicative ratio for precipitation (floored + clipped) and additive difference for tasmax/tasmin, on a (month=12, cell) grid."
    - name: "delta_applicator"
      role: "process_solver"
      brief: "Applies month-indexed deltas to baseline forcing: multiplicative for precip (clamped >=0), additive_mean (mean of tasmax and tasmin deltas) for mean temperature, pass-through for the other variables."
    - name: "forcing_projector"
      role: "driver"
      brief: "Discovers baseline forcing_1d files, recycles baseline annual cycles onto target years (leap-aware), invokes the delta applicator, and emits projected forcing NetCDF (and VIC ASCII)."
    - name: "ensemble_analysis"
      role: "process_solver"
      brief: "Runs VIC + routing per model/scenario with the projected forcing and compares historical vs future hydrology across a multi-model ensemble (discharge change, seasonal cycle, flood frequency, water balance, uncertainty decomposition)."
    - name: "netcdf_io"
      role: "integrator"
      brief: "xarray Dataset assembly and NetCDF writers carrying units/method/provenance attributes across all stages."
    - name: "validators"
      role: "optional_module"
      brief: "Per-stage precondition checks (paths, scenario/period ranges) and post-checks (all-NaN, negative ratio, output sanity) emitting structured exit codes."
  internal_edges:
    - from: "Inputs"
      to: "cmip6_extraction"
      kind: "consumes_input"
      brief: "Reads basin_grid mask and China CMIP6 tab-separated daily files."
    - from: "Inputs"
      to: "nex_gddp_fetch"
      kind: "consumes_input"
      brief: "Fetches global NEX-GDDP-CMIP6 per-year NetCDF over THREDDS for the basin bbox."
    - from: "cmip6_extraction"
      to: "cell_matcher"
      kind: "invokes"
      brief: "Maps basin cells to CMIP6 columns within tolerance, dedups columns."
    - from: "nex_gddp_fetch"
      to: "monthly_climatology"
      kind: "invokes"
      brief: "Global-path extracted series feed the same climatology step (after renaming historical to r1)."
    - from: "cmip6_extraction"
      to: "monthly_climatology"
      kind: "invokes"
      brief: "Historical and future basin NetCDF feed the month-grouped climatology."
    - from: "monthly_climatology"
      to: "clim_hist"
      kind: "writes_state"
      brief: "12-month historical (r1) climatology."
    - from: "monthly_climatology"
      to: "clim_fut"
      kind: "writes_state"
      brief: "12-month future (SSP) climatology."
    - from: "clim_hist"
      to: "delta_computer"
      kind: "reads_state"
      brief: "Denominator/subtrahend of the change signal."
    - from: "clim_fut"
      to: "delta_computer"
      kind: "reads_state"
      brief: "Numerator/minuend of the change signal."
    - from: "delta_computer"
      to: "delta_pr"
      kind: "writes_state"
      brief: "Multiplicative monthly precip ratio (floored + clipped)."
    - from: "delta_computer"
      to: "delta_tasmax"
      kind: "writes_state"
      brief: "Additive monthly tasmax change."
    - from: "delta_computer"
      to: "delta_tasmin"
      kind: "writes_state"
      brief: "Additive monthly tasmin change."
    - from: "cell_matcher"
      to: "cell_match_index"
      kind: "writes_state"
      brief: "Forcing-grid to delta-cell nearest-neighbour index (a second regridding step)."
    - from: "cell_match_index"
      to: "delta_applicator"
      kind: "reads_state"
      brief: "Routes each forcing cell to its delta cell."
    - from: "delta_pr"
      to: "delta_applicator"
      kind: "reads_state"
      brief: "Multiplicative factor for projected precipitation."
    - from: "delta_tasmax"
      to: "delta_applicator"
      kind: "reads_state"
      brief: "Used in the additive_mean temperature shift."
    - from: "delta_tasmin"
      to: "delta_applicator"
      kind: "reads_state"
      brief: "Used in the additive_mean temperature shift."
    - from: "Inputs"
      to: "delta_applicator"
      kind: "consumes_input"
      brief: "Baseline forcing_1d supplies sub-daily variability and the 4 pass-through variables."
    - from: "delta_applicator"
      to: "forcing_projector"
      kind: "invokes"
      brief: "Per-month delta application embedded in the year-recycling projection loop."
    - from: "forcing_projector"
      to: "Outputs"
      kind: "produces_output"
      brief: "Projected forcing_1d NetCDF / VIC ASCII for the future window."
    - from: "forcing_projector"
      to: "ensemble_analysis"
      kind: "invokes"
      brief: "Projected forcing drives VIC + routing per model/scenario."
    - from: "ensemble_analysis"
      to: "Outputs"
      kind: "produces_output"
      brief: "Projected discharge, change summary, and ensemble comparison plot."
    - from: "cmip6_extraction"
      to: "netcdf_io"
      kind: "invokes"
      brief: "NetCDF writer assembles the extracted/delta/forcing datasets with provenance attrs."
    - from: "forcing_projector"
      to: "validators"
      kind: "invokes"
      brief: "Output sanity gates (all-NaN, negative ratio, missing pass-through vars)."

states:
  variables:
    - name: "clim_hist"
      unit: "mm/day, degC"
      role: "diagnostic"
    - name: "clim_fut"
      unit: "mm/day, degC"
      role: "diagnostic"
    - name: "delta_pr"
      unit: "dimensionless (ratio)"
      role: "diagnostic"
    - name: "delta_tasmax"
      unit: "degC"
      role: "diagnostic"
    - name: "delta_tasmin"
      unit: "degC"
      role: "diagnostic"
    - name: "cell_match_index"
      unit: "index"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "delta_pr"
    validation_rank: 2
    unit: "dimensionless (ratio)"
    description: "Monthly multiplicative precipitation change factor (future vs historical climatology), floored at 0.1 mm/day and clipped to [0.1, 5.0]."
    emitted_in: "deltas/{MODEL}_{ssp}_deltas_{basin}_{start}-{end}.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "A derived change factor, not a directly observable quantity; assess plausibility against multi-model ensemble agreement, not against an observation dataset."
            - "Multiplicative ratios are inflated in arid months where historical precip approaches the 0.1 mm/day floor."
      detrending_options: ["none"]
  - var: "delta_tas"
    validation_rank: 3
    unit: "degC"
    description: "Monthly additive temperature change factor (tasmax/tasmin future minus historical climatology)."
    emitted_in: "deltas/{MODEL}_{ssp}_deltas_{basin}_{start}-{end}.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Change factor, not a directly observable quantity; evaluate via inter-model spread and physical plausibility."
      detrending_options: ["none"]
  - var: "projected_precipitation"
    validation_rank: 4
    unit: "mm/day"
    description: "Future VIC precipitation forcing = baseline precipitation scaled by the monthly delta_pr factor."
    emitted_in: "forcing_{MODEL}_{ssp}/prec_*.nc (and forcing_final_{MODEL}_{ssp}/ ASCII)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Only a historical-window reconstruction is observable; the future window is not directly verifiable."
            - "Sub-daily variability and the inter-annual sequence are inherited from the recycled baseline, not GCM-realised future weather, so future extremes/variability are not represented."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Distinct VIC cells may share an identical CMIP6 column via many-to-one matching."
      detrending_options: ["none"]
  - var: "projected_air_temperature"
    validation_rank: 1
    unit: "degC"
    description: "Future VIC mean-temperature forcing = baseline temperature shifted by the mean of the monthly tasmax and tasmin deltas."
    emitted_in: "forcing_{MODEL}_{ssp}/temp_*.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Mean-temperature forcing is shifted by the average of the tasmax and tasmin deltas (additive_mean), despite the internal delta_key naming suggesting tasmax only."
            - "Future window not directly observable; diurnal range change is not represented (only the mean shift is applied)."
      detrending_options: ["none"]
  - var: "projected_discharge"
    validation_rank: 5
    unit: "m3/s"
    description: "Daily routed discharge at the basin outlet under projected forcing (downstream VIC + routing within the ensemble stage)."
    emitted_in: "routing_{MODEL}_{ssp}/"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Valid only for the historical reconstruction period and only with a calibrated VIC; uncalibrated soil parameters amplify the climate signal and distort absolute discharge."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match"]
          determining_metric: "decadal_pbias"
          caveats:
            - "Future projections should be assessed as relative (% change) signals, which are more robust than absolute discharge."
      detrending_options: ["linear_residual", "decadal_mean"]
  - var: "change_summary_pct_Q"
    validation_rank: 6
    unit: "%"
    description: "Percent change in mean / maximum / minimum discharge (future vs historical) summarised across the ensemble."
    emitted_in: "change_summary.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match"]
          determining_metric: "decadal_pbias"
          caveats:
            - "Relative change is the intended robust metric; absolute magnitudes depend on VIC calibration."
            - "Interpret only as an ensemble of >=5 models; a single model is one realisation, not a definitive projection."
      detrending_options: ["decadal_mean"]

influence:
  edges:
    - from: "emission_scenario (SSP)"
      to: "projected_air_temperature"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "late-century lead times"
      citations: ["hawkins2009_uncertainty_partition", "deque2007_anova_uncertainty"]
    - from: "GCM_choice"
      to: "projected_air_temperature"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "mid-century lead times"
      citations: ["hawkins2009_uncertainty_partition", "deque2007_anova_uncertainty"]
    - from: "GCM_choice"
      to: "projected_precipitation"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "all lead times"
      citations: ["deque2007_anova_uncertainty", "hawkins2009_uncertainty_partition", "joseph2019_hydro_uncertainty"]
    - from: "internal_variability (ensemble member)"
      to: "projected_air_temperature"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "near-term / decadal lead times"
      citations: ["hawkins2009_uncertainty_partition"]
    - from: "emission_scenario (SSP)"
      to: "projected_precipitation"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "all lead times"
      citations: ["hawkins2009_uncertainty_partition", "deque2007_anova_uncertainty"]
    - from: "downscaling_method"
      to: "projected_precipitation"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "summer precipitation, local scale"
      citations: ["deque2007_anova_uncertainty", "lafferty2023_downscaling_biascorrection"]
    - from: "downscaling_method"
      to: "local_projection_uncertainty"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "structural"
      citations: ["lafferty2023_downscaling_biascorrection", "wilby2010_cascade"]
    - from: "bias_correction_method"
      to: "projected_discharge"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "structural"
      citations: ["lafferty2023_downscaling_biascorrection", "joseph2019_hydro_uncertainty"]
    - from: "GCM_choice"
      to: "projected_discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "top of the impact cascade"
      citations: ["joseph2019_hydro_uncertainty", "wilby2010_cascade"]
    - from: "hydrological_model_parameters (downstream VIC)"
      to: "projected_discharge"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "secondary overall; dominant on dry/low-flow days"
      citations: ["joseph2019_hydro_uncertainty"]
  citation_index:
    hawkins2009_uncertainty_partition:
      short_citation: "Hawkins & Sutton 2009"
      doi: "10.1175/2009BAMS2607.1"
      note: "Variance partitioning of climate projection uncertainty into internal variability, GCM model, and emission scenario; lead-time dominance ordering."
    deque2007_anova_uncertainty:
      short_citation: "Deque et al. 2007"
      doi: "10.1007/s10584-006-9228-x"
      note: "ANOVA variance partitioning of the PRUDENCE RCM ensemble across emission scenario, driving GCM, and RCM formulation."
    lafferty2023_downscaling_biascorrection:
      short_citation: "Lafferty & Sriver 2023"
      doi: "10.1038/s41612-023-00486-0"
      note: "CMIP6 variance decomposition showing downscaling and bias-correction contribute substantial, heterogeneous local uncertainty."
    wilby2010_cascade:
      short_citation: "Wilby & Dessai 2010"
      doi: "10.1002/wea.543"
      note: "Cascade-of-uncertainty framing: scenario -> GCM -> downscaling -> impact model -> adaptation."
    joseph2019_hydro_uncertainty:
      short_citation: "Joseph et al. 2019"
      doi: "10.1038/s41598-019-41334-7"
      note: "Multi-GCM vs hydrological-parameter uncertainty in projected streamflow; GCM dominant, parameters dominant on dry days."

safety:
  hazards:
    - id: "basin_outside_china_domain"
      kind: "control_semantic"
      description: "Basin lies outside the China bias-corrected domain (73.75-135.25E, 15.25-53.75N) so zero CMIP6 cells match; use the global NEX-GDDP path or ESGF raw + manual bias correction."
      severity: "fatal"
    - id: "model_name_or_missing_temperature"
      kind: "weather_file_semantic"
      description: "Case-sensitive hyphenated GCM name mismatch, or a precip-only model lacking tasmax/tasmin, yields a CMIP6 file-not-found."
      severity: "fatal"
    - id: "coordinate_precision_miscolumn"
      kind: "weather_file_semantic"
      description: "Float-precision mismatch in nearest-neighbour matching selects the wrong CMIP6 column, giving silently wrong per-cell values."
      severity: "silent"
    - id: "hist_future_confusion_zero_delta"
      kind: "control_semantic"
      description: "Identical or heavily overlapping historical and future periods/directories make climatologies near-identical, collapsing deltas to ~1.0 (precip) or ~0.0 (temp)."
      severity: "silent"
    - id: "arid_month_ratio_blowup"
      kind: "numerical_instability"
      description: "Division by near-zero historical precip in dry months produces extreme multiplicative ratios; the [0.1,5.0] cap still amplifies dry-month projected precip — prefer additive deltas for very arid basins."
      severity: "degraded"
    - id: "vic_time_range_mismatch"
      kind: "control_semantic"
      description: "Downstream VIC global_param STARTYEAR/ENDYEAR/FORCEYEAR not matching the projected forcing year range triggers a 'Not enough records' failure; use a separate projected param file."
      severity: "fatal"
    - id: "passthrough_variables_missing"
      kind: "weather_file_semantic"
      description: "Pass-through baseline files (wind, pressure, srad, lrad, shum) not found in the baseline dir leave those variables zero/NaN in projected forcing while temp/prec look valid."
      severity: "silent"
  validation_limits:
    - "China bias-corrected path is mainland-China-only; basins elsewhere require the global NEX-GDDP path."
    - "Only monthly-mean temperature (additive) and precipitation (multiplicative) change; future inter-annual variability and extremes are not represented because the baseline annual cycle is recycled."
    - "Wind, pressure, shortwave/longwave radiation, and humidity are held at baseline values under all future climates."
    - "Absolute projected discharge requires a calibrated VIC; uncalibrated soil parameters amplify the climate signal."
  warnings:
    - "Uncalibrated VIC parameters (binfilt, Ds, Ws) exaggerate runoff sensitivity; report relative (% change) discharge rather than absolute when no observations are available."
    - "Mean-temperature forcing is shifted by the mean of tasmax and tasmin deltas (additive_mean), not by tasmax alone as the delta_key name implies."
    - "Many-to-one cell matching can make distinct VIC cells share identical CMIP6 forcing."
