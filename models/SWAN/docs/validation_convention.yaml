references:
  du2019:
    doi: 10.5194/os-15-361-2019
    title: Wave boundary layer model in SWAN revisited
    venue: Ocean Science
    year: 2019
    oa: gold
    resolves: https://os.copernicus.org/articles/15/361/2019/os-15-361-2019.pdf
  lei2023:
    doi: 10.3389/fmars.2023.1298727
    title: A general method to determine the optimal whitecapping dissipation coefficient in the SWAN
