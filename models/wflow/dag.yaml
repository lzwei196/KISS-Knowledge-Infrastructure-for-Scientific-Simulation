template_version: "3.5"

identity:
  model_id: "wflow"
  scientific_reference_version: "Wflow.jl v1.x (CSDMS standard-name TOML era); wflow_sbm SBM concept per van Verseveld et al. 2024 GMD"
  implementation:
    id: "wflow-jl"
    version: "1.1.0-dev"
    provenance: "Julia; Deltares Wflow.jl package (github.com/Deltares/Wflow.jl), CSDMS standard-name TOML configuration."
  ki_class: "forward_model"
  is_family_dag: false
  language: "julia"
  license: "MIT"
  repo_url: "https://github.com/Deltares/Wflow.jl"

boundary:
  scope_in:
    - "Distributed grid-based catchment hydrology (wflow_sbm SBM vertical concept)"
    - "Interception, snow accumulation/melt, glacier melt (degree-day), multi-layer soil water, evapotranspiration"
    - "Lateral routing of river, overland and subsurface flow (kinematic wave or local inertial)"
    - "Unconfined-aquifer groundwater flow (sbm_gwf configuration)"
    - "Reservoir/lake storage-outflow regulation"
    - "Water demand and allocation (domestic, industry, livestock, irrigation incl. paddy)"
    - "Sediment erosion, in-stream transport and deposition (wflow_sediment, post-processing of SBM hydrology)"
  scope_out:
    - "Global river routing and floodplain dynamics beyond the internal network (delegated externally, e.g. CaMa-Flood); wflow already routes internally"
    - "Detailed glacier dynamics (built-in is degree-day only; better delegated to a dedicated glacier model)"
    - "wflow_sediment does not compute hydrology; it consumes overland and river runoff from wflow_sbm"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-balance water conservation is verified internally (per-timestep land/river/reservoir mass-balance diagnostics; documented acceptable closure error < 5% of precipitation). Configurable timestep Δt: daily (timestepsecs=86400) is the documented default, sub-daily is supported and switches interception from Gash (daily) to modified Rutter (sub-daily). Snow/glacier melt and PET use temperature-index / demand-side flux methods, not a closed surface energy budget."

inputs:
  forcing:
    - category: "forcing"
      name: "precipitation"
      unit: "mm Δt⁻¹"
      source_kind: "forcing"
      model_input_format: "gridded NetCDF forcing variable (precip), per cell per timestep"
      notes: "MUST be mm/timestep (mm/day at daily Δt), NOT mm/s or mm/3hr; no internal unit check, so a wrong unit silently scales runoff by up to 86400x."
    - category: "forcing"
      name: "air temperature"
      unit: "°C"
      source_kind: "forcing"
      model_input_format: "gridded NetCDF forcing variable (temp), per cell per timestep"
      notes: "MUST be Celsius, NOT Kelvin; drives snow precipitation-phase split (threshold tt) and degree-day melt. Kelvin values silently break the snow module and PET."
    - category: "forcing"
      name: "potential (reference) evapotranspiration"
      unit: "mm Δt⁻¹"
      source_kind: "forcing"
      model_input_format: "gridded NetCDF forcing variable (pet), per cell per timestep"
      notes: "Required unless wflow computes PET internally (Penman-Monteith / De Bruin) from individual met variables; if missing or zero, all precipitation becomes runoff."
  parameters:
    - category: "soil"
      name: "vertical saturated hydraulic conductivity (KsatVer)"
      unit: "mm Δt⁻¹"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "Typical 10-10000 mm/day. Units differ across models (VIC mm/s, MODFLOW m/day); cross-model transfer without conversion makes the soil 86400x too permeable."
    - category: "soil"
      name: "horizontal conductivity fraction (KsatHorFrac)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "staticmaps.nc per-cell grid (multiplier on KsatVer for lateral subsurface flow)"
      notes: "Sets lateral subsurface saturated conductivity = KsatHorFrac × KsatVer; in practice the primary streamflow calibration parameter."
    - category: "soil"
      name: "Ksat exponential decay parameter (f)"
      unit: "m⁻¹ (mm⁻¹ in KI parameter table)"
      source_kind: "calibrated"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "Exponential decline of saturated conductivity with depth; controls baseflow-vs-quickflow partitioning and recession. Too low → flat baseflow-dominated hydrograph."
    - category: "soil"
      name: "soil thickness (SoilThickness)"
      unit: "mm"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "Typical 500-5000 mm; controls total column water storage capacity."
    - category: "soil"
      name: "Brooks-Corey exponent (c)"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc with a (layer, y, x) dimension"
      notes: "Pore-size index; pore-size lambda derived internally as 2/(c-3). MUST carry a layer dimension or wflow raises a 'type InputEntries has no field' (3D-vs-2D) error."
    - category: "soil"
      name: "saturated / residual water content (θS, θR)"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "θS > θR required everywhere."
    - category: "soil"
      name: "compacted infiltration capacity (InfiltCapSoil)"
      unit: "mm Δt⁻¹"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "Typical 50-500 mm/day; limits infiltration and thus saturation/infiltration-excess runoff."
    - category: "vegetation"
      name: "rooting depth (RootingDepth)"
      unit: "mm"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "Controls ET extraction depth and soil-moisture availability."
    - category: "vegetation"
      name: "canopy/LAI parameters (max canopy storage, LAI, light extinction, canopy gap fraction, crop coefficient)"
      unit: "mm / m² m⁻² / dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grids"
      notes: "Drive Gash/modified-Rutter interception and transpiration."
    - category: "snow"
      name: "snow degree-day and threshold parameters (degree-day coefficient, snowfall/melt thresholds, liquid water holding capacity)"
      unit: "mm °C⁻¹ Δt⁻¹ / °C / fraction"
      source_kind: "default"
      model_input_format: "staticmaps.nc grids or config defaults (degree-day coeff default 3.75)"
      notes: "HBV temperature-index snow; precipitation phase split at temperature threshold."
    - category: "glacier"
      name: "glacier parameters (initial ice equivalent, melting threshold, degree-day coefficient, accumulation fraction, glacier area fraction)"
      unit: "mm / °C / mm °C⁻¹ Δt⁻¹ / dimensionless"
      source_kind: "default"
      model_input_format: "staticmaps.nc grids or config defaults (initial ice eq. default 5500, ddf default 3.0)"
      notes: "Built-in degree-day glacier; GlacierFrac all-zeros silently disables glacier melt."
    - category: "routing"
      name: "river Manning roughness (N_River) and overland Manning roughness"
      unit: "s m⁻¹ᐟ³"
      source_kind: "calibrated"
      model_input_format: "staticmaps.nc per-cell grids (defaults 0.036 river, 0.072 overland when absent)"
      notes: "Controls routed flow velocity and flood-peak timing/magnitude."
    - category: "routing"
      name: "river/land geometry (slope, river width, bankfull depth, river length)"
      unit: "m m⁻¹ / m"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grids (DEM-derived)"
      notes: "Placeholder (non-DEM-derived) geometry gives correct timing but 2-3x magnitude error."
    - category: "surface"
      name: "paved/impervious fraction (PathFrac)"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "Typical 0-0.3; sets direct-runoff fraction."
    - category: "sediment"
      name: "USLE C cover-management factor"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid (from land-cover classification)"
      notes: "Typical 0.01-0.3 (forest ~0.004, cropland ~0.30, bare ~0.90); near-zero everywhere → silent zero erosion. (sediment model only)"
    - category: "sediment"
      name: "USLE K soil-erodibility factor"
      unit: "t·ha·h·ha⁻¹·MJ⁻¹·mm⁻¹ (SI)"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grid"
      notes: "SI range 0.001-0.1; US-customary values must be ×0.1317 to SI or sediment yield is ~7.6x off. (sediment model only)"
    - category: "sediment"
      name: "grain-size fractions (clay/silt/sand/small-agg/large-agg) and river-bed D50"
      unit: "fraction / mm"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc per-cell grids"
      notes: "Five grain classes MUST sum to 1.0 per cell or the sediment budget is unclosed. (sediment model only)"
  initial_conditions:
    - category: "state_init"
      name: "initial model states (soil/snow/glacier/interception/surface/river storages)"
      unit: "mm / m / m³ s⁻¹"
      source_kind: "user_provided"
      model_input_format: "instates NetCDF (warm start) or cold_start__flag defaults"
      notes: "cold_start__flag=true initializes from defaults but the TOML must still declare all 11 state variables under [state.variables]."
    - category: "state_init"
      name: "initial reservoir water level (waterlevel_reservoir)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "staticmaps.nc / instates; reservoir storage re-derived from water level on state load"
      notes: "Active when reservoir__flag is set."
  boundary_conditions:
    - category: "domain"
      name: "DEM / elevation (wflow_dem)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc grid; y-axis MUST be descending (north first)"
      notes: "Ascending y-axis inverts the LDD; wflow internally transposes (y,x) and reverses y."
    - category: "domain"
      name: "local drain direction (wflow_ldd)"
      unit: "dimensionless (D8 code)"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc, float64 with NaN for inactive cells; must be cycle-free"
      notes: "Cycles → 'cycles detected in flow graph' fatal; boundary cells must be pits in both numpy- and wflow-space."
    - category: "domain"
      name: "subcatchment mask (wflow_subcatch) and river mask (wflow_river)"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc, float64 with NaN inactive; river mask 1 = river cell"
      notes: "Inactive cells set to 0 instead of NaN are treated as active zero-parameter cells; all-zero river mask → zero flow."
    - category: "config_switch"
      name: "model configuration switches (variant sbm/sbm_gwf/sediment, routing method kinematic vs local_inertial, reservoir__flag, lake__flag, glacier toggle, cold_start__flag)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "TOML configuration keys"
      notes: "Select which process and routing modules are active; structural levers."
    - category: "config"
      name: "simulation window and timestep (starttime, endtime, timestepsecs)"
      unit: "datetime / s"
      source_kind: "user_provided"
      model_input_format: "TOML [time] section (backfilled from NetCDF time axis if absent)"
      notes: "timestepsecs=86400 for daily."
    - category: "external_flux"
      name: "lateral/external inflows and abstractions"
      unit: "m³ s⁻¹ (routing) / mm Δt⁻¹ (land)"
      source_kind: "user_provided"
      model_input_format: "NetCDF/config-specified external flux fields"
      notes: "Optional prescribed inflows/abstractions; outlet discharge itself is an emergent output, not a prescribed BC."
    - category: "reservoir"
      name: "reservoir operating parameters (ResMaxVolume, reservoir_area, ResDemand, ResMaxRelease, ResTargetFullFrac, ResTargetMinFrac, outflowfunc, storfunc)"
      unit: "m³ / m² / m³ s⁻¹ / dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "staticmaps.nc / reservoir tables; outflowfunc 1-4, storfunc 1-2"
      notes: "ResMaxVolume in MCM instead of m³ (1e6 too small) → immediate overflow with no regulation; reservoir_area in km² instead of m² → negligible evaporation; reservoir not on a river cell is silently ignored. Active when reservoir__flag is set."

processes:
  modules:
    - name: "Driver"
      role: "driver"
      brief: "Wflow.jl run/run!/run_timestep!: builds Model from TOML Config, advances the Clock, calls update_model! per timestep, manages IO and state writing."
    - name: "Rainfall-Interception"
      role: "process_solver"
      brief: "Canopy interception (Gash at daily Δt, modified Rutter sub-daily): canopy storage, throughfall, stemflow, interception evaporation."
    - name: "Snow-HBV"
      role: "process_solver"
      brief: "HBV degree-day snowpack: precipitation phase split by temperature threshold, melt and refreeze, liquid-water retention."
    - name: "Glacier"
      role: "process_solver"
      brief: "Temperature-index glacier melt and snow-to-ice conversion."
      applicability: "when glacier toggle enabled and GlacierFrac > 0"
    - name: "Runoff-OpenWater"
      role: "process_solver"
      brief: "Open-water and paved-area runoff generation feeding the soil/overland balance."
    - name: "Soil-SBM"
      role: "process_solver"
      brief: "SBM vertical column: infiltration, Brooks-Corey unsaturated/saturated stores, capillary rise, leakage, transpiration/root uptake, recharge, water-table depth zi."
    - name: "LandHydrologySBM"
      role: "integrator"
      brief: "Composes interception + snow + glacier + runoff + soil into the per-cell vertical water balance each timestep."
    - name: "Subsurface-flow"
      role: "process_solver"
      brief: "Lateral saturated subsurface flow (kinematic wave) on the land network using the soil layered conductivity profile; exponential transmissivity decay with depth."
    - name: "Groundwater"
      role: "process_solver"
      brief: "Unconfined/confined aquifer head solve (four-direction connectivity) replacing kinematic subsurface flow."
      applicability: "sbm_gwf model type only"
    - name: "Overland-flow"
      role: "process_solver"
      brief: "Land surface water routing (kinematic wave or local inertial 2D) with adaptive CFL timestepping."
    - name: "River-flow"
      role: "process_solver"
      brief: "River channel routing (kinematic wave or local inertial 1D, optional 1D floodplain, Froude limiting)."
    - name: "Reservoir"
      role: "process_solver"
      brief: "Reservoir/lake storage-outflow via rating curve / free weir / modified-Puls / simple-target outflow types; sits inside the routing call graph at outlet nodes."
      applicability: "when reservoir__flag (or lake__flag) is set"
    - name: "Routing"
      role: "integrator"
      brief: "Orchestrates subsurface, overland, reservoir and river flow with lateral-inflow exchange across the network."
    - name: "Water-demand"
      role: "allocator"
      brief: "Domestic/industry/livestock/irrigation demand, paddy ponding, surface-water vs groundwater allocation and return flow."
      applicability: "when water demand active"
    - name: "Sediment-Erosion"
      role: "optional_module"
      brief: "Rainfall (EUROSEM/ANSWERS) and overland-flow (USLE) soil erosion by particle class."
      applicability: "wflow_sediment model type only"
    - name: "Sediment-Transport"
      role: "optional_module"
      brief: "In-stream transport capacity (Bagnold/Engelund-Hansen/Kodatie/Yang/Molinas-Wu), deposition (Einstein settling), land-to-river and river routing of sediment by class."
      applicability: "wflow_sediment model type only"
    - name: "MassBalance"
      role: "integrator"
      brief: "Per-timestep storage_prev vs storage mass-balance diagnostics for land/river/reservoir."
  internal_edges:
    - from: "Inputs"
      to: "LandHydrologySBM"
      kind: "consumes_input"
      brief: "Dynamic forcing reader supplies precipitation, temperature and potential ET each timestep."
    - from: "Driver"
      to: "LandHydrologySBM"
      kind: "invokes"
      brief: "update_land_hydrology_model! advances the vertical water balance."
    - from: "Rainfall-Interception"
      to: "Soil-SBM"
      kind: "produces_output"
      brief: "Throughfall + stemflow become net precipitation entering soil/snow."
    - from: "Snow-HBV"
      to: "Glacier"
      kind: "writes_state"
      brief: "Snow storage feeds snow-to-ice conversion; glacier melt returns to snow/melt water."
    - from: "Snow-HBV"
      to: "Soil-SBM"
      kind: "produces_output"
      brief: "Snowmelt + rain throughfall form potential infiltration."
    - from: "Glacier"
      to: "Routing"
      kind: "produces_output"
      brief: "Glacier melt adds to net runoff entering routing."
    - from: "Runoff-OpenWater"
      to: "LandHydrologySBM"
      kind: "produces_output"
      brief: "Open-water/paved runoff contributes to the per-cell water balance."
    - from: "Soil-SBM"
      to: "Subsurface-flow"
      kind: "writes_state"
      brief: "soil.recharge → subsurface boundary condition (rescaled by flow_width·0.001·BASETIMESTEP/dt); soil zi (mm)/1000 → subsurface zi (m)."
    - from: "Soil-SBM"
      to: "Subsurface-flow"
      kind: "reads_state"
      brief: "kh_layered_profile! exposes the soil layered Kv profile as lateral conductivity."
    - from: "Subsurface-flow"
      to: "Soil-SBM"
      kind: "writes_state"
      brief: "update_soil_water_storage! consumes subsurface flow to update saturated water depth / unsaturated store."
    - from: "Water-demand"
      to: "Subsurface-flow"
      kind: "writes_state"
      brief: "Groundwater abstraction is subtracted from the recharge boundary condition when demand is active."
    - from: "Water-demand"
      to: "River-flow"
      kind: "reads_state"
      brief: "Surface-water allocation reads available river water."
    - from: "Water-demand"
      to: "Soil-SBM"
      kind: "writes_state"
      brief: "Irrigation/paddy supply added to the soil/ponded water balance."
    - from: "Soil-SBM"
      to: "Overland-flow"
      kind: "produces_output"
      brief: "Infiltration-excess + saturation-excess runoff become overland lateral inflow."
    - from: "Soil-SBM"
      to: "Groundwater"
      kind: "writes_state"
      brief: "In sbm_gwf, recharge drives the aquifer head solve instead of kinematic subsurface flow."
    - from: "Overland-flow"
      to: "River-flow"
      kind: "produces_output"
      brief: "Land-to-river flow becomes river lateral inflow."
    - from: "Subsurface-flow"
      to: "River-flow"
      kind: "produces_output"
      brief: "Exfiltrating subsurface flow contributes to river lateral inflow."
    - from: "Overland-flow"
      to: "Reservoir"
      kind: "produces_output"
      brief: "Overland + subsurface flow feed reservoir inflow before the river update."
    - from: "River-flow"
      to: "Reservoir"
      kind: "invokes"
      brief: "River update calls the reservoir update at outlet nodes; reservoir outflow re-enters the river."
    - from: "Domain"
      to: "Routing"
      kind: "consumes_input"
      brief: "Network connectivity (flow width/length, river indices, topological order) drives all routing."
    - from: "Routing"
      to: "MassBalance"
      kind: "reads_state"
      brief: "compute_mass_balance! reads routing storages against storage_prev."
    - from: "Soil-SBM"
      to: "Sediment-Erosion"
      kind: "produces_output"
      brief: "Overland flow + precipitation intensity from SBM hydrology drive splash/overland erosion."
    - from: "Sediment-Erosion"
      to: "Sediment-Transport"
      kind: "produces_output"
      brief: "Eroded mass by class feeds transport capacity and land-to-river routing."
    - from: "River-flow"
      to: "Outputs"
      kind: "produces_output"
      brief: "write_output emits river q_av/depth, land storages and fluxes to NetCDF/CSV each timestep."

states:
  variables:
    - name: "vegetation_canopy_water__depth (canopy interception storage)"
      unit: "mm"
      role: "prognostic"
    - name: "snowpack_dry_snow__leq_depth (dry snow store)"
      unit: "mm w.e."
      role: "prognostic"
    - name: "snowpack_liquid_water__depth (snowpack liquid water)"
      unit: "mm"
      role: "prognostic"
    - name: "glacier_ice__leq_depth (glacier ice store)"
      unit: "mm w.e."
      role: "prognostic"
    - name: "soil_layer_water_unsaturated_zone__depth (per-layer unsaturated store)"
      unit: "mm"
      role: "prognostic"
    - name: "soil_water_saturated_zone__depth (saturated store / water table)"
      unit: "mm"
      role: "prognostic"
    - name: "soil_surface__temperature (only when snow present)"
      unit: "°C"
      role: "prognostic"
    - name: "subsurface_water__volume_flow_rate (lateral subsurface flow, sbm)"
      unit: "m³ s⁻¹"
      role: "prognostic"
    - name: "subsurface_water__hydraulic_head (groundwater head, sbm_gwf)"
      unit: "m"
      role: "prognostic"
    - name: "land_surface_water__instantaneous_volume_flow_rate (overland q, kinematic) / x,y components (local inertial)"
      unit: "m³ s⁻¹"
      role: "prognostic"
    - name: "land_surface_water__depth (overland water depth)"
      unit: "m"
      role: "prognostic"
    - name: "river_water__instantaneous_volume_flow_rate (river q)"
      unit: "m³ s⁻¹"
      role: "prognostic"
    - name: "river_water__depth (river water depth)"
      unit: "m"
      role: "prognostic"
    - name: "floodplain_water__instantaneous_volume_flow_rate / __depth"
      unit: "m³ s⁻¹ / m"
      role: "prognostic"
    - name: "reservoir_water_surface__elevation (reservoir storage state)"
      unit: "m"
      role: "prognostic"
    - name: "paddy_surface_water__depth (ponded paddy water)"
      unit: "mm"
      role: "prognostic"
    - name: "river_water_<class>__mass / river_bed_<class>__mass (sediment suspended and bed, per grain class)"
      unit: "t"
      role: "prognostic"
    - name: "land/river/reservoir water_mass_balance_error (diagnostics)"
      unit: "mm / m³"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "river discharge (q_river / river_water__volume_flow_rate)"
    validation_rank: 1
    unit: "m³ s⁻¹"
    description: "Routed river discharge per cell and at gauge points."
    emitted_in: "output_grid.nc (every cell) and output_scalar.nc (gauge points)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Uncalibrated wflow vs another model (e.g. VIC) can differ 3-5x in magnitude from structural uncertainty — assess timing/correlation separately from magnitude."
            - "Placeholder (non-DEM-derived) river geometry yields correct timing but 2-3x magnitude bias."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Gridded discharge fields are routing-network dependent; compare on the river mask only."]
      detrending_options: ["none"]
  - var: "unrouted runoff (runoff)"
    validation_rank: 2
    unit: "mm Δt⁻¹"
    description: "Cell runoff (overland + subsurface lateral) before river routing."
    emitted_in: "output_grid.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Correct variable for external routing coupling; do not compare routed q_river against runoff."]
      detrending_options: ["none"]
  - var: "actual evapotranspiration (actevap)"
    validation_rank: 3
    unit: "mm Δt⁻¹"
    description: "Actual evapotranspiration (interception + bare-soil + transpiration)."
    emitted_in: "output_grid.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Annual ~200-1500 mm is plausible; remote-sensing ET products carry their own retrieval uncertainty."]
      detrending_options: ["none"]
  - var: "soil moisture / saturated water depth (satwaterdepth)"
    validation_rank: 4
    unit: "mm"
    description: "Saturated-zone water depth / soil water storage state."
    emitted_in: "output_grid.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Model storage is in mm depth; satellite soil moisture is a surface volumetric fraction — compare anomalies/patterns, not absolute values."]
      detrending_options: ["none", "linear_residual"]
  - var: "snow water equivalent (SWE)"
    validation_rank: 5
    unit: "mm"
    description: "Total snow water equivalent (dry snow + liquid water in pack)."
    emitted_in: "output_grid.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "csi"
          caveats: ["Degree-day (temperature-index) snow; depends critically on temperature being in Celsius."]
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Point SNOTEL-style comparison sensitive to sub-grid elevation."]
      detrending_options: ["none"]
  - var: "groundwater recharge"
    validation_rank: 6
    unit: "mm Δt⁻¹"
    description: "Recharge flux from the soil column to lateral subsurface / aquifer."
    emitted_in: "output_grid.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Recharge is rarely directly observed; usually evaluated via downstream baseflow or coupled-model fluxes."]
      detrending_options: ["none"]
  - var: "reservoir storage (storage_reservoir / reservoir_water__volume)"
    validation_rank: 7
    unit: "m³"
    description: "Reservoir stored water volume."
    emitted_in: "output_scalar.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Depends on correct ResMaxVolume units (m³, not MCM) and the reservoir being on a river cell."]
      detrending_options: ["none"]
  - var: "soil loss / erosion rate (soilloss)"
    validation_rank: 8
    unit: "t ha⁻¹ yr⁻¹"
    description: "Gross soil erosion rate per cell (wflow_sediment)."
    emitted_in: "output_grid.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Typical 0.5-50 t/ha/yr; sensitive to USLE K SI-vs-US units (~7.6x) and C-factor land-cover lookup."]
      detrending_options: ["none"]
  - var: "sediment yield / specific yield at outlet"
    validation_rank: 9
    unit: "t yr⁻¹ (yield) / t km⁻² yr⁻¹ (specific)"
    description: "In-stream sediment yield at the basin outlet (wflow_sediment)."
    emitted_in: "output_scalar.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Specific yield typically 10-1000 t/km²/yr; grain fractions must sum to 1.0 for a closed budget."]
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Long-term mean specific yield against basin-aggregate sediment surveys."]
      detrending_options: ["none"]

