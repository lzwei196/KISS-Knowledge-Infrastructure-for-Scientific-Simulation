# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: CRHM
  language: cpp
  implementation:
    id: crhmcode
    version: 1.3.5 (released 2024-05-30)
    provenance: C++; Centre for Hydrology / University of Saskatchewan CRHMcode CLI build, GPL-3.0, source
      at github.com/CentreForHydrology/CRHM.
  scientific_reference_version: Cold Regions Hydrological Modelling platform — Pomeroy et al. (2007, Hydrol.
    Process. 21:2650-2667, doi:10.1002/hyp.6787)
inputs:
  forcing:
  - name: air_temperature (t)
    unit: degC
    category: atmospheric
    source_kind: forcing
    model_input_format: column in .obs file at hourly or daily timestep
    notes: Lapsed from obs_elev to hru_elev by the obs module using lapse_rate; physical-bounds check
      [-80, 60] C.
  - name: relative_humidity (rh)
    unit: '%'
    category: atmospheric
    source_kind: forcing
    model_input_format: column in .obs file
    notes: Strictly 0-100 %, NOT 0-1; specific humidity in kg/kg interpreted as RH silently zeroes ET/sublimation.
  - name: wind_speed (u)
    unit: m/s
    category: atmospheric
    source_kind: forcing
    model_input_format: column in .obs file
    notes: Topographic amplification optional via walmsley_wind module (A, B, L coefficients).
  - name: precipitation (p)
    unit: mm per timestep
    category: atmospheric
    source_kind: forcing
    model_input_format: column in .obs file; canonical variable name 'p' (older docs use 'ppt')
    notes: mm per CRHM timestep, NOT mm/day; snow/rain partitioned in the obs module using tmax_allrain
      / tmax_allsnow thresholds or the Harder (1995) routine.
  - name: incoming_shortwave (Qsi)
    unit: W/m^2
    category: atmospheric
    source_kind: forcing
    model_input_format: column in .obs file
    notes: Slope/aspect corrected by Slope_Qsi when configured; Annan module substitutes from temperature
      when Qsi unavailable.
  - name: incoming_longwave (Qli)
    unit: W/m^2
    category: atmospheric
    source_kind: forcing
    model_input_format: column in .obs file (optional)
  - name: atmospheric_pressure (press)
    unit: kPa
    category: atmospheric
    source_kind: forcing
    model_input_format: column in .obs file (optional)
  parameters:
  - name: hru_area, hru_elev, hru_GSL (slope), hru_ASL (aspect), hru_lat
    unit: km^2 / m / deg / deg / deg
    category: HRU_geometry
    source_kind: calibrated
    model_input_format: .prj Parameters section, one value per HRU
  - name: soil_moist_max, soil_rechr_max, gw_max, Sdmax, soil_gw_K, gw_K
    unit: mm / mm/d
    category: soil_hydraulics
    source_kind: calibrated
    model_input_format: .prj Parameters section per HRU
  - name: soil_type (USDA texture class 0-12)
    unit: categorical
    category: soil_hydraulics
    source_kind: dataset_lookup
    model_input_format: .prj Parameters; Ksat derived internally from hardcoded soilproperties[][] table
      in GlobalDll.h
  - name: Ht (canopy height), LAI, fetch distance, canopy flag, evap_type
    unit: m / m^2/m^2 / m / categorical
    category: vegetation
    source_kind: calibrated
    model_input_format: .prj Parameters per HRU
  - name: Albedo_bare, Albedo_snow, max_z_s_0, T_g, z_u
    unit: fraction / m / degC / m
    category: snow_module
    source_kind: calibrated
    model_input_format: .prj Parameters; SnobalCRHM / albedo modules
  - name: fetch, distrib, N_S, Walmsley_Ht (A, B, L)
    unit: m / fraction / dimensionless / m
    category: PBSM
    source_kind: calibrated
    model_input_format: .prj Parameters per HRU
  - name: Kstorage, Lag, gwKstorage, gwLag, order, whereto, gwwhereto, runK, ssrK
    unit: d / d / dimensionless
    category: routing
    source_kind: calibrated
    model_input_format: .prj Parameters per HRU; Netroute / Netroute_M / REWroute
  - name: Cs, Cp, Rgas, Tm, Ls, Lv, Lf, kappa, sbc, emiss, emiss_c, em
    unit: various (J/m^3/K, J/kg/K, K, J/kg, W/m^2/K^4, dimensionless)
    category: physical_constants
    source_kind: default
    model_input_format: hardcoded in src/core/CRHM_constants.h
    notes: PBSM and SnobalCRHM keep separate copies of several of these (FREEZE=273.15 vs 273.16; VON_KARMAN=0.4
      vs 0.35; rho_air=1.23 vs 1.22) — module-internal inconsistency.
  initial_conditions:
  - name: SWE_init
    unit: mm
    category: snowpack
    source_kind: user_provided
    model_input_format: .prj Initial_State section (optional)
  - name: soil_moist, soil_rechr, gw, Sd at t=0
    unit: mm
    category: soil_water
    source_kind: user_provided
    model_input_format: .prj Initial_State section per HRU
  - name: fallstat (autumn soil moisture for frozen-soil infiltration)
    unit: '% saturation'
    category: frozen_soil
    source_kind: user_provided
    model_input_format: .prj Parameters / Initial_State
  - name: SI_Lo (initial canopy interception load)
    unit: mm SWE-equivalent
    category: canopy
    source_kind: user_provided
    model_input_format: .prj Initial_State (optional; defaults to zero)
  - name: gw_init
    unit: mm
    category: groundwater
    source_kind: user_provided
    model_input_format: .prj Parameters per HRU
  boundary_conditions:
  - name: Modules section selecting the process chain (e.g., Prairie chain basin>global>obs>PBSM>PrairieInfil>Soil>Netroute)
    unit: ordered list
    category: module_chain
    source_kind: user_provided
    model_input_format: .prj Modules section, flat format ('basin CRHM 02/24/12')
    notes: Chain order must be radiation > canopy > snow > infiltration > soil > routing; consumer modules
      (declgetvar) must follow producer modules (declvar) or initialization fails.
  - name: snowmelt method (SnobalCRHM | ebsm | qmelt | Essery)
    unit: categorical
    category: module_choice
    source_kind: user_provided
    model_input_format: .prj Modules entry
  - name: infiltration method (GreenAmpt | PrairieInfil | crack | Greencrack)
    unit: categorical
    category: module_choice
    source_kind: user_provided
    model_input_format: .prj Modules entry
  - name: ET method via evap_type (Granger=0 land | Priestley-Taylor=1 water | Penman-Monteith | Shuttleworth-Wallace)
    unit: categorical
    category: module_choice
    source_kind: user_provided
    model_input_format: .prj Parameters evap_type per HRU
  - name: routing method (Netroute | Netroute_D | Netroute_M | REWroute)
    unit: categorical
    category: module_choice
    source_kind: user_provided
    model_input_format: .prj Modules entry
  - name: lapse_rate, precip_elev_adj, catchadjust, ClimChng_t, ClimChng_precip
    unit: degC/m / fraction / fraction / degC / fraction
    category: forcing_adjustment
    source_kind: user_provided
    model_input_format: .prj Parameters / obs module
  - name: Dates (start, end), Summary_period
    unit: date
    category: simulation_window
    source_kind: user_provided
    model_input_format: .prj Dates section
  - name: Display_Variable (which declvar variables to write)
    unit: list
    category: output_selection
    source_kind: user_provided
    model_input_format: '.prj Display_Variable section (module-prefixed: ''Netroute basinflow 1'')'
outputs:
  primary:
  - name: SWE
    unit: mm
    description: Snow water equivalent per HRU; primary cold-region state variable, should peak late winter/early
      spring and reach zero in summer for non-glaciated basins.
    validation_rank: 4
    emitted_in: Display_Variable output file (Output.txt / .csv) when listed in .prj Display_Variable
      section
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Compare at the HRU containing the snow pillow / snow course; account for HRU-vs-point spatial
          mismatch in canopy and wind exposure.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Snow-course / snow-survey peak-SWE on a single date; HRU-vs-point spatial mismatch (canopy,
          wind exposure) and date selection (use peak-SWE DOY rather than fixed calendar date) both bias
          the comparison.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - magnitude_accuracy
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Snow-cover or SWE maps must be re-aggregated to HRU polygons; CRHM does not produce gridded
          SWE natively.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        - spatial_pattern_match
        determining_metric: nse
        caveats:
        - Same HRU-to-grid aggregation caveat; align timestep before comparison.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Basin-mean SWE products (e.g., SNODAS, passive-microwave swaths) must be re-aggregated to the
          basin boundary; shallow-snow and dense-forest SWE retrievals carry known retrieval bias that
          should be acknowledged before scoring magnitude.
      detrending_options:
      - none
  - name: basinflow_s
    unit: m^3/s
    description: Watershed outlet discharge at simulation timestep (m^3/s); aggregates surface, sub-surface
      and groundwater contributions through Netroute.
    validation_rank: 1
    emitted_in: Display_Variable output file from Netroute module
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Spring snowmelt peak timing and recession shape are the diagnostic targets; gwLag and Netroute
          Kstorage govern recession but Netroute lag-stores produce a structural ~4-5% un-closable storage
          residual on decadal runs.
      detrending_options:
      - none
  - name: basinflow
    unit: m^3/int
    description: Watershed outlet discharge per simulation interval; divide by 86400 for daily-timestep
      m^3/s; includes basingw.
    validation_rank: 2
    emitted_in: Display_Variable output file from Netroute module
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Resample to daily before pairing with daily gauge observations.
      detrending_options:
      - none
  - name: hru_actet
    unit: mm/int
    description: Actual evapotranspiration from the HRU soil-column and land/water surface water balance
      per timestep (Granger / Priestley-Taylor / Penman-Monteith / Shuttleworth-Wallace depending on evap_type).
    validation_rank: 3
    emitted_in: Display_Variable output file from evap module
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Match HRU to footprint of eddy-covariance tower; aggregate sub-daily ET to flux observation
          timestep.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - magnitude_accuracy
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Re-aggregate gridded ET products to HRU polygons before comparison.
      detrending_options:
      - none
  - name: Subl
    unit: mm/int
    description: Blowing-snow and canopy sublimation per timestep; PBSM contributes 15-40% of snowfall
      in prairie, CRHMCanopy 30-50% in boreal forest.
    validation_rank: 5
    emitted_in: Display_Variable output file from PBSM / CRHMCanopy modules
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Direct sublimation observations are rare; commonly inferred from energy-balance closure at a
          flux tower.
      detrending_options:
      - none
  - name: soil_moist
    unit: mm
    description: Total soil moisture storage state per HRU (declstatvar).
    validation_rank: 6
    emitted_in: Display_Variable output file from Soil module
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - In-situ probes report volumetric water content; convert via soil depth and porosity before comparison.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Satellite soil moisture products (SMAP, ASCAT) sense only top few cm; CRHM soil_moist is column-integrated.
      detrending_options:
      - none
  - name: snowmeltD
    unit: mm/d
    description: Daily snowmelt depth from ebsm or SnobalCRHM energy-balance solver.
    validation_rank: 7
    emitted_in: Display_Variable output file from ebsm / SnobalCRHM
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Snowmelt timing (DOY of peak) is the diagnostic; magnitude requires accurate forcing and snow
          albedo.
      detrending_options:
      - none
  - name: infil_act
    unit: mm/int
    description: Actual infiltration into soil (GreenAmpt, PrairieInfil, or crack); partitioned from melt
      and net rain.
    validation_rank: 8
    emitted_in: Display_Variable output file from Soil / infiltration module
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Direct infiltration measurement is rare; usually inferred from soil moisture change plus surface
          runoff.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: 'CRHM simulation runs to completion but SWE accumulates indefinitely, never melting completely
    in summer. Sublimation is near zero. ET is unrealistically low. No error message is produced.

    '
  diagnosis: Specific humidity (kg/kg) passed as relative humidity (%) in .obs file; VIC forcing provides
    specific humidity (values 0.001-0.02 kg/kg). CRHM expects relative humidity (values 0-100%). If specific
    humidity is written directly to the .obs file, CRHM interprets 0.005 as 0.005% RH -- essentially bone-
  remedy: 'Convert specific humidity to relative humidity using Tetens formula; convert_vic_to_obs; [''Check
    max RH in .obs file: if max < 1.0, units are wrong'', ''Apply conversion: RH = (q*P / (0.622*es))
    * 100'', ''Verify RH values are 0-100%, not 0-1 or 0-0.02'']; Always use convert_vic_to_obs.py which
    handles c'
  severity: silent
- id: dt_002
  symptom: 'Simulated discharge peaks are 3-8x too high. Flooding occurs in every month, not just spring
    melt. Annual water balance shows more output water than input precipitation.

    '
  diagnosis: Precipitation rate vs accumulation mismatch; VIC forcing provides precipitation per timestep
    (e.g., mm per 3 hours). CRHM expects precipitation rate in mm/day. If 3-hourly accumulation is passed
    directly, CRHM receives 8 timesteps per day, each interpreted as mm/d, effectively multiplying daily
    prec
  remedy: 'Convert precipitation from mm/timestep to mm/d rate; convert_vic_to_obs; [''Multiply precipitation
    by 24/timestep_hours'', ''For 3-hourly VIC: multiply by 24/3 = 8 to get daily rate'', ''Wait -- that
    makes it 8x larger? No: VIC value is already per 3h, not per day'', ''CORRECT: If CRHM reads sub-daily,
    pas'
  severity: silent
- id: dt_003
  symptom: 'CRHM crashes at startup with error about observation file format. Error message mentions variable
    count mismatch or invalid header.

    '
  diagnosis: '.obs file header format incorrect; CRHM .obs header must have exact format: variable name,
    space, column count (integer), space, unit in parentheses. Example: "t 1 (C)". Common mistakes: missing
    column count, using tab instead of space, unit without parentheses, or variable name with spaces.

    ; [''.ob'
  remedy: 'Fix .obs header to match required format; validate_obs_file; ["Each variable line: ''varname
    N (unit)''", "Computed variables: ''$varname formula (unit) description''", ''Column count N must
    be integer >= 1'', ''Data columns (after YYYY M D H 0) must equal sum of all N values'']; Use convert_vic_to_obs.py
    t'
  severity: fatal
- id: dt_004
  symptom: 'CRHM crashes during initialization with error about unresolved variable reference. Error mentions
    a variable name that a module tries to get but no other module provides.

    '
  diagnosis: Module chain order incorrect -- module requires variable from later module; CRHM modules
    use declgetvar() to retrieve variables produced by earlier modules via declvar(). If module A calls
    declgetvar("SWE") but module B (which provides SWE) appears AFTER module A in the chain, the variable
    doesn't e
  remedy: 'Reorder module chain so producers come before consumers; select_modules; [''Identify which
    module produces the missing variable'', ''Move that module earlier in the chain (before the consumer)'',
    ''Standard order: basin > global > obs > radiation > canopy > snow > infiltration > soil > routing''];
    Use sel'
  severity: fatal
- id: dt_005
  symptom: 'CRHM crashes or produces garbage output. Parameter values appear to be read from wrong locations
    in the .prj file. Some HRUs have physically impossible parameter values.

    '
  diagnosis: Wrong number of parameter values for nhru; Per-HRU parameters must have exactly nhru values.
    If nhru=10 but only 8 values are provided, CRHM reads the next 2 values from whatever follows in the
    file -- which may be the next parameter's declaration line or range specification. This shifts all
    subsequ
  remedy: Ensure each per-HRU parameter has exactly nhru values; validate_prj; ['Count nhru in Dimensions
    section', 'For each parameter, count values (space-separated across lines)', 'Values must equal nhru
    (per-HRU) or 1 (global)']; Use create_prj_file.py which auto-generates correct value counts
  severity: fatal
- id: dt_006
  symptom: 'Simulation runs without error but results don''t change when you modify a parameter value.
    You set fetch=50000 but results are identical to fetch=10000.

    '
  diagnosis: 'Parameter value silently clamped to declared range boundary; CRHM parameters have declared
    ranges in angle brackets: <min to max>. If a value exceeds the max, CRHM silently clamps it to max.
    The .prj file shows 50000 but the model uses 10000. No warning is produced. This makes parameter sensitivity '
  remedy: Ensure all parameter values are within declared ranges; validate_prj; ['Run validate_prj.py
    -- it checks all values against ranges', 'For any range violation, adjust the value to be within <min
    to max>', 'If the range is too narrow for your basin, this may indicate the wrong module']; Always
    validat
  severity: silent
- id: dt_007
  symptom: 'CRHM crashes at startup with error about observation file not found. The .prj file has a valid
    path but CRHM cannot find it.

    '
  diagnosis: Observation file path in .prj is relative to working directory, not .prj location; CRHM resolves
    .obs file paths relative to the current working directory (CWD) when crhm is invoked, NOT relative
    to the .prj file's directory. If the .prj has "obs/basin.obs" and you run CRHM from /home/user, it
    looks
  remedy: 'Use absolute paths or --obs_file_directory flag; ; [''Option 1: Use absolute path in .prj Observations
    section'', ''Option 2: Run CRHM with --obs_file_directory pointing to obs directory'', ''Option 3:
    cd to the directory containing the .obs file before running CRHM'']; create_prj_file.py generates
    absolu'
  severity: fatal
- id: dt_008
  symptom: 'CRHM exits with non-zero return code. Error message on stderr mentions a specific module name
    and variable.

    '
  diagnosis: 'Module encountered invalid data or state during simulation; Common causes: (1) observation
    data has NaN or extreme outlier values that cause numerical overflow, (2) parameter combination leads
    to division by zero (e.g., zero soil depth), (3) snow depth goes negative due to excessive sublimation,
    (4)'
  remedy: Check observation data quality and parameter ranges; validate_obs_file; ['Run validate_obs_file.py
    to check for extreme values', 'Check for NaN, -9999, or other missing value indicators in .obs', "Verify
    no parameter is zero that shouldn't be (soil_Depth, route_L)", 'Try running with a shorter perio
  severity: fatal
- id: dt_009
  symptom: 'Merged CRHM+VIC comparison shows wildly different magnitudes for the same variable (e.g.,
    VIC SWE is 50mm while CRHM SWE is 5000mm or vice versa). Water balance doesn''t close.

    '
  diagnosis: 'Unit mismatch between VIC and CRHM output variables; VIC reports some variables in different
    units than CRHM: - VIC runoff: mm/day. CRHM runoff: may be mm/timestep. - VIC SWE: mm. CRHM SWE: mm
    (usually same, but check). - VIC ET: mm/day. CRHM ET_act: mm/day or mm/timestep. Merging without unit
    align'
  remedy: 'Verify units for every variable before merging; merge_crhm_vic; [''Check CRHM output units
    (row 2 of STD output)'', ''Check VIC output units (from global_param OUTVAR definitions)'', ''Convert
    all variables to common units before merging'', ''For fluxes: mm/day. For states: mm.'']; Build a
    unit conversion t'
  severity: silent
- id: dt_010
  symptom: 'Combined water balance shows more output (ET + Q) than input (P). Annual runoff ratio exceeds
    1.0. Results appear physically impossible but no error is raised.

    '
  diagnosis: 'Double-counting hydrological processes between VIC and CRHM; Both VIC and CRHM compute snowmelt,
    sublimation, ET, and soil moisture. If both models'' snowmelt values are added together, the total
    melt is 2x the actual value. Similarly for ET and runoff. The process ownership table (from PREFLIGHT.md '
  remedy: 'Define and enforce process ownership table; ; [''Create process ownership table: each process
    assigned to exactly one model'', "When merging, use ONLY the owner''s value for each process", ''For
    snow processes: typically CRHM (better cold regions physics)'', ''For routing: always VIC (grid-based
    Lohmann/C'
  severity: silent
- id: dt_011
  symptom: 'Winter SWE is unrealistically smooth or constant. Temperature, wind, and precipitation show
    suspiciously repetitive patterns during December-March. Simulated spring melt timing is wrong.

    '
  diagnosis: Gap-filled winter observation data with artificial constant values; Cold-region weather stations
    frequently fail during extreme cold (-40C), blizzards, or rime icing of instruments. Automated gap
    filling often inserts constant values (last known reading) or climatological means during these outages.
  remedy: Detect and properly fill winter data gaps; validate_obs_file; ['Check for constant-value runs
    > 3 days (suspicious in winter)', 'Compare against nearby stations or reanalysis for gap periods',
    'Use ERA5 or MERRA-2 for winter gap filling (better than constant fill)', 'Flag gap-filled periods
    in outpu
  severity: silent
- id: dt_012
  symptom: 'Total HRU area is much larger or smaller than expected basin area. HRU elevations are all
    identical or don''t match known basin relief.

    '
  diagnosis: CRS mismatch between DEM and basin shapefile; If the DEM is in UTM (meters) and the shapefile
    is in WGS84 (degrees), the spatial clip operation may return incorrect areas. A 100 km2 basin might
    compute as 0.01 km2 (if area is in degrees-squared) or 10^10 m2 (if coordinates are treated as meters
    when
  remedy: 'Reproject DEM and shapefile to common CRS before clipping; create_hru_config; ["Check DEM CRS:
    gdalinfo dem.tif | grep ''AUTHORITY''", "Check shapefile CRS: ogrinfo basin.shp -al | grep ''AUTHORITY''",
    ''If different, reproject: gdalwarp -t_srs EPSG:4326 dem.tif dem_wgs84.tif'', ''Re-run create_hru_config.'
  severity: silent
- id: dt_013
  symptom: 'CRHM fails to parse .prj file. Error about missing section or unexpected content where a section
    header was expected.

    '
  diagnosis: Section delimiter is not exactly 6 hash characters '######'; CRHM .prj format uses exactly
    '######' (6 hashes) on a standalone line as section delimiters. Using 5 hashes, 7 hashes, or adding
    spaces after the hashes causes CRHM to treat the delimiter as content rather than a section boundary.
    The sec
  remedy: Fix section delimiters to exactly '######'; validate_prj; ["Search .prj for lines with '#' characters",
    "Replace any that are not exactly '######' (6 characters, no trailing spaces)", "Ensure section name
    is on the line between two '######' lines"]; Use create_prj_file.py which generates correct del
  severity: fatal
- id: dt_014
  symptom: 'CRHM exits with code 0 (success) but the output file is empty or contains only header lines
    with no data.

    '
  diagnosis: No output variables specified in Display_Variable section of .prj; If the Display_Variable
    section is empty, CRHM runs the entire simulation but writes nothing to the output file. The exit
