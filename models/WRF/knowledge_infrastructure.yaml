# ============================================================================
# Diagnostic Triplets
# ============================================================================
diagnostic_triplets:
  file: diagnostics/triplets.yaml
  count: 30
  failure_domains:
    - unit_conversion
    - parameter_format
    - path_resolution
    - dependency_mismatch
    - compilation
    - runtime
    - silent_error
    - environment

# ============================================================================
# Summary
# ============================================================================
summary:
  tools: 4
  tool_loc: ~1600
  skill_documents: 8
  diagnostic_triplets: 30
  pipeline_stages: 8
  physics_suites: [CONUS, tropical]
  validation_status: source_only
