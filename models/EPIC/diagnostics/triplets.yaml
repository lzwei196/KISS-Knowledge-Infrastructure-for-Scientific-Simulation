triplets:
  - id: T01
    symptom: |
      forrtl: severe (29): file not found, unit 39, file ./fort.39
      Earlier message: "File SOIL38K.DAT IS MISSING."
    diagnosis: |
      EPIC0810 looks for SOIL38K.DAT, but the EPIC1102 example bundle ships SOIL35K.DAT.
      The file format is identical; only the file name changed between releases.
    remedy: |
      In your workspace: cp SOIL35K.DAT SOIL38K.DAT
      run_epic_workspace.setup_workspace() does this automatically.

  - id: T02
    symptom: |
      forrtl: severe (64): input conversion error, unit 24, file <site>.SOL
    diagnosis: |
      The .SOL file contains alphabetic structure codes (e.g. "A B C D" rows)
      that the EPIC0810 Fortran reader rejects when reading numeric F8.2 fields.
    remedy: |
      Run sanitize_sol(sol_path) in tools/run_epic_workspace.py — it replaces
      every alpha token with "0.00" while preserving column widths. The header
      line (line 1) is left as free text.

  - id: T03
    symptom: |
      Binary hangs forever and prints "FORTRAN PAUSE\nPAUSE prompt>"
    diagnosis: |
      EPIC0810 hits a Fortran PAUSE statement on a non-fatal warning (e.g. missing
      optional file) and waits for keyboard ENTER from stdin.
    remedy: |
      Always invoke with stdin closed: subprocess.run([bin], cwd=ws,
      stdin=subprocess.DEVNULL, stdout=PIPE, stderr=PIPE, timeout=600)

  - id: T04
    symptom: |
      OUT file is < 2 KB, no annual data, no error message.
    diagnosis: |
      EPICRUN.DAT line is missing the trailing "/" required by the namelist read,
      or the site_id column is not exactly 9 chars wide.
    remedy: |
      Format must be: "{site_id:>9s} {NSIT:3d} {NWP1:3d} {NWND:3d} {NWP5:3d}
      {NSOL:3d} {NOPS:3d} {NDLY:3d}/" — note the trailing slash.

  - id: T05
    symptom: |
      <site>.ACY and <site>.DGN files exist but have only 11 lines (header only).
    diagnosis: |
      The output-type toggles in PRNT1102.DAT are 0 for these extensions, or the
      site never triggered a harvest event (forest sites produce no .ACY rows by design).
    remedy: |
      For empty .ACY: check OPC for harvest operation code 650. For empty .DGN:
      verify the daily print toggle row in PRNT1102.DAT. Use parse_out_annual_table()
      to scrape annual values from the .OUT report instead.

  - id: T06
    symptom: |
      ANN file shows all-zero precipitation/ET despite .DLY having data.
    diagnosis: |
      EPICCONT.DAT start year is outside the .DLY date range, so EPIC falls back
      to the WXGEN weather generator with empty .WP1 statistics.
    remedy: |
      Set EPICCONT.DAT IYR to a year that exists in your .DLY file. The
      update_epiccont() helper takes start_year and validates against the range.

  - id: T07
    symptom: |
      forrtl: severe error during model startup; OUT file shows year 1 day 1 only.
    diagnosis: |
      tmax < tmin in one or more rows of the .DLY file (forcing converter bug).
    remedy: |
      Add `assert (data["tmax"] >= data["tmin"]).all()` to the forcing converter.
      Most often caused by swapped tmin/tmax columns when reading source NetCDF.

  - id: T08
    symptom: |
      ACY rows show YLDG=0 every year for a clearly cropped site.
    diagnosis: |
      The Potential Heat Units (PHU) in the OPC planting row (column OPV1)
      are wrong, so the crop never reaches maturity within the season.
    remedy: |
      Compute PHU as sum of (Tavg - Tbase) between planting and observed maturity
      from the .DLY file. For corn Tbase=8 °C, typical PHU = 1500–2000 °C·day.

  - id: T09
    symptom: |
      ANN ET > PRCP for several years; soil dries out completely.
    diagnosis: |
      Relative humidity in .DLY is in percent (0–100) instead of fraction (0–1).
      EPIC interprets RH=70 as "RH = 7000%" and the vapor pressure deficit
      explodes, driving PET to absurd values.
    remedy: |
      Divide RH by 100 in the forcing converter. Add a range check
      `assert data["rh"].max() < 1.5` to validate_forcing_dict().

  - id: T10
    symptom: |
      LAI in DGN goes negative or NaN; OUT file mentions "CROP NOT FOUND".
    diagnosis: |
      The crop code in the OPC planting row doesn't exist in CROPCOM.DAT.
    remedy: |
      Look up the crop code in CROPCOM.DAT (column CPNM). For corn, code is 2;
      for switchgrass, 22; for natural mixed forest, 38.

  - id: T11
    symptom: |
      Yield is reasonable but ET is implausibly low (< 200 mm/yr in temperate climate).
    diagnosis: |
      Solar radiation in .DLY is in W/m² instead of MJ/m²/day. PET is then
      ~24× too low and the model becomes water-limited.
    remedy: |
      Convert: srad_MJ = srad_Wm2 * 0.0864 (for daily mean) or
      srad_Wm2 * dayl_seconds / 1e6 for Daymet.

  - id: T12
    symptom: |
      Soil water never drains; runoff = 0 every storm.
    diagnosis: |
      Saturated hydraulic conductivity in row 19 of SOL is in cm/day instead of mm/h.
      A typical loam Ksat of 5 mm/h becomes 5 cm/day = 0.21 mm/h, ~24× too low.
    remedy: |
      Multiply Ksat_cm_per_day * 10 / 24 to get mm/h.

  - id: T13
    symptom: |
      Bulk density row in SOL has values like 1440 instead of 1.44.
    diagnosis: |
      Bulk density in kg/m³ instead of g/cm³.
    remedy: |
      Divide by 1000.

  - id: T14
    symptom: |
      Layer depth row in SOL has values like 5, 15, 30, 60 — runoff and percolation are wild.
    diagnosis: |
      Layer depths in cm instead of metres.
    remedy: |
      Divide by 100. EPIC0810 expects metres in the layer depth row.

  - id: T15
    symptom: |
      Crop matures in 30 days; harvest yields ~0.
    diagnosis: |
      PHU set too low (e.g. 200 °C·day) — crop sprints through phenology
      and never accumulates biomass.
    remedy: |
      Use realistic PHU per crop: corn 1500, wheat 1700, soybean 1500,
      switchgrass 2000.

  - id: T16
    symptom: |
      Same workspace produces different results on repeat runs.
    diagnosis: |
      Stale output files from a previous run aren't being deleted; EPIC0810
      appends rather than overwrites some output files (notably .ACY in append mode).
    remedy: |
      Before re-running: rm -f workspace/<site_id>.* (then run again).
      Or use a fresh setup_workspace() into a new temp dir.

  - id: T17
    symptom: |
      EPIC0810 segfaults at startup with no Fortran error.
    diagnosis: |
      Workspace is missing one of the database files: CROPCOM.DAT, FERT2012.DAT,
      TILLCOM.DAT, PESTCOM.DAT, or PARM1102.DAT. The Fortran open succeeds
      (file is auto-created empty) but the read fails.
    remedy: |
      Verify all REQUIRED_TEMPLATE_FILES are present:
      `python tools/run_epic_workspace.py --workspace ws` will validate.

  - id: T18
    symptom: |
      Wind speed in .DLY printed as "***" or model crashes on day 1.
    diagnosis: |
      Wind speed exceeds the F6.2 column width (i.e. > 99.99 m/s) due to
      forcing units in km/h or mph not converted.
    remedy: |
      km/h → m/s: divide by 3.6. mph → m/s: multiply by 0.44704.
      Add range check `assert (0 <= ws).all() and (ws < 50).all()`.
