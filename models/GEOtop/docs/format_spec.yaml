- id: dt_014
  symptom: Model crashes immediately with soil-related error.
  diagnosis: Residual water content (vwc_r) greater than or equal to saturated content (vwc_s); Van Genuchten
    model requires theta_r < theta_s. If values are swapped or incorrect, the retention curve is undefined.;
    ['water.balance', 'pedo.funct']
  remedy: Verify vwc_r < vwc_w < vwc_fc < vwc_s for all layers; convert_soil.py; ['Check soil file columns
    are in correct order', 'Verify no copy-paste errors in parameter values']; convert_soil.py validates
    theta ordering
