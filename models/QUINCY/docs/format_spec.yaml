    When comparing against FLUXNET observations (which also use positive = source), the mismatch causes
    apparent no'
  remedy: 'Ensure NEE = Reco - GPP throughout the pipeline. A healthy forest should have slightly negative
    NEE (net sink). Verify: NEE_annual should be -100 to -500 gC/m2/yr for a productive forest. If NEE
    is positive and large, the sign convention is likely wrong.

    '
  severity: major
- id: dt_quincy_013
  symptom: 'Latent heat flux (LE) is unrealistically large (>300 W/m2 monthly mean) and sensible heat
    flux (H) goes negative. The energy balance does not close.

    '
  diagnosis: 'The Penman-Monteith approximation for LE uses stomatal conductance from the Ball-Berry model.
    If g1_bb (Ball-Berry slope) is set too high (e.g., 12 instead of 6), stomatal conductance is doubled,
    transpiration is excessive, and LE dominates the energy budget. Since H is computed as residual (Rnet
    - '
  remedy: 'Set g1_bb to PFT-appropriate values: ENF ~4-8, DBF ~6-10, crops ~8-12, grasslands ~6-9. Default
    for boreal ENF is 6.0. Verify that monthly LE stays below Rnet (incoming shortwave minus outgoing
    longwave). Typical peak LE is 80-150 W/m2 for forests.

    '
  severity: major
- id: dt_quincy_014
  symptom: 'Simulated GPP shows correct daytime magnitude in umol/m2/s but the daily/monthly mean is ~2x
    too high compared to FLUXNET observations.

    '
  diagnosis: The day fraction (daylength/24h) scaling was not applied to GPP. QUINCY computes instantaneous
    daytime GPP rate (umol/m2/s during sunlit hours), but FLUXNET GPP_NT_VUT_REF is a 24-hour mean. Without
    dividing by (24/daylength), the model GPP represents only daytime hours but is compared against the
    2
  remedy: 'Ensure GPP output is multiplied by (daylength_hours / 24) to convert from daytime-only rate
    to 24h mean. The run_quincy.py tool applies this correction automatically. Daylength can be computed
    from latitude and day of year using standard solar geometry.

    '
  severity: major
- id: dt_quincy_015
  symptom: 'The first 1-2 years of simulation show a large positive NEE (carbon source) that gradually
    transitions to a sink. Multi-year statistics are biased by the spinup transient.

    '
  diagnosis: Soil organic matter pools (CENTURY-like) were initialized at zero or at default values far
    from equilibrium. The heterotrophic respiration takes 1-3 years to equilibrate with litter inputs.
    During spinup, Rh is either too low (if SOM pools start empty, producing unrealistic sink) or too
    high (if ini
  remedy: 'Discard the first 2 years of output from any analysis. If running a short simulation (<5 years),
    extend the forcing data to include at least 2 spinup years. Alternatively, initialize SOM pools from
    literature values for the biome (e.g., rh_base calibrated to match observed annual Reco).

    '
  severity: major
- id: dt_quincy_016
  symptom: 'C:N:P stoichiometry diagnostics show leaf C:N ratio outside the expected range (30-60 gC/gN).
