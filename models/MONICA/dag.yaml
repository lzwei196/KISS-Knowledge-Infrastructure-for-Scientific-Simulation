safety:
  hazards:
    - id: "globrad_unit_inflation"
      kind: "weather_file_semantic"
      description: "globrad supplied in J cm-2 or W m-2 instead of MJ m-2 d-1 is read as-is, silently inflating PAR and yield ~12-100x."
      severity: "silent"
    - id: "relhumid_fraction_vs_percent"
      kind: "weather_file_semantic"
      description: "relative humidity as fraction [0-1] instead of percent corrupts Penman-Monteith VPD, giving ET0~0 and false water stress (TraDef stuck at 1.0)."
      severity: "silent"
    - id: "wind_kmh_vs_ms"
      kind: "weather_file_semantic"
      description: "wind in km h-1 instead of m s-1 enters Penman-Monteith directly, a 3.6x ET overestimate that dries soil too fast."
      severity: "silent"
    - id: "precip_m_vs_mm"
      kind: "weather_file_semantic"
      description: "precipitation in m d-1 instead of mm d-1 gives 1000x rainfall, waterlogging and oxygen-stress crop death."
      severity: "silent"
    - id: "layer_thickness_cm_vs_m"
      kind: "soil_semantic"
      description: "soil layer thickness in cm instead of m (e.g. 30 read as 30 m) makes the water balance nonsensical and can produce negative soil moisture / crash."
      severity: "fatal"
    - id: "bulk_density_gcm3_vs_kgm3"
      kind: "soil_semantic"
      description: "SoilRawDensity in g cm-3 instead of kg m-3 (1.4 read as near-zero density) corrupts porosity and the PTF-derived hydraulics."
      severity: "silent"
    - id: "soc_gkg_vs_percent"
      kind: "soil_semantic"
      description: "SoilOrganicCarbon in g kg-1 instead of % (15 g kg-1 = 1.5% read as 15%) drives extreme SOC decomposition rates."
      severity: "silent"
    - id: "texture_percent_vs_fraction"
      kind: "soil_semantic"
      description: "Sand/Clay given as percent instead of fraction [0-1] yields wrong PTF field-capacity / wilting-point."
      severity: "silent"
    - id: "fertiliser_product_vs_N"
      kind: "control_semantic"
      description: "mineral fertiliser given as kg product ha-1 instead of kg N ha-1 inflates N surplus and leaching ~3-5x (N partitioning lives in fert-params, not the amount field)."
      severity: "silent"
    - id: "ndeposition_daily_vs_annual"
      kind: "control_semantic"
      description: "NDeposition given as a daily rate instead of annual (kg N ha-1 yr-1) deposits 365x background N and runaway leaching."
      severity: "silent"
    - id: "vappd_mmHg_vs_kPa"
      kind: "weather_file_semantic"
      description: "vapour pressure deficit in mm Hg instead of kPa scales the aerodynamic ET term incorrectly."
      severity: "silent"
    - id: "winter_crop_flag_mismatch"
      kind: "control_semantic"
      description: "is-winter-crop flag inconsistent with sowing season prevents vernalisation, giving failed/late development or crop death."
      severity: "degraded"
    - id: "automatic_harvest_never_triggers"
      kind: "control_semantic"
      description: "AutomaticHarvest latest-date set before maturity, or cultivar StageTemperatureSum too large for the available degree-days, leaves the crop unharvested with no yield."
      severity: "degraded"
  validation_limits:
    - "1-D point/profile representation only — no lateral hydrology or spatial routing; not applicable where multi-cell coupling matters."
    - "Daily time step cannot resolve sub-daily processes (e.g. diurnal flux dynamics)."
    - "Capacity-based (non-Richards) soil water; percolation via empirical texture-dependent rate, so saturated/perched-water dynamics are approximate."
    - "Crop and soil parameters are calibrated per crop/region; uncalibrated cultivar-climate combinations (e.g. mismatched vernalisation) degrade predictions."
    - "Reference-ET / Kc demand approach, not a closed surface energy budget."
  warnings:
    - "When relhumid or et0 is absent the orchestrator substitutes a -1.0 sentinel the moisture module must interpret; missing humidity collapses computed ET."
    - "Penman-Monteith ET0 enforces a hardcoded minimum windspeed of 0.5 m/s, bounding the aerodynamic term at low wind."
    - "Negative computed sinusoidal groundwater depths are clamped to a hardcoded 20.0 m (treated as effectively no groundwater)."
    - "When atmospheric CO2 is not supplied it is synthesised from a hardcoded per-RCP logistic+seasonal fit defaulting to RCP8.5, which can silently set the CO2 forcing."
    - "Water balance failure to close usually traces to a soil parameter error (bulk density / field capacity) or a column shallower than 2 m truncating percolation."
  assumptions:
    - statement: "Geometry is a single 1-D vertical soil-plant column (1 m² surface, 2 m depth, 20 × 0.1 m layers); no lateral transport."
      scope: "all simulations"
      source: "MONICA documentation overview (zalf-rpm/monica-documentation) and Nendel et al. 2011 (doi:10.1016/j.ecolmodel.2011.02.018)"
      status: adopted
    - statement: "Mass-balance closure holds for water, carbon and nitrogen over the column with groundwater as lower boundary; there is no closed surface energy balance (ET is a Penman-Monteith demand calculation)."
      scope: "water / C / N accounting"
      source: "MONICA soil_moisture documentation and SoilMoisture / SoilOrganic / SoilTransport module behaviour in the source"
      status: adopted
    - statement: "Soil water uses a capacity approach (saturation/field-capacity/wilting-point from texture, OM, bulk density) rather than Richards, with empirical percolation (lambda = 1.15*fs^2 + 0.1*fc + 0.35*fu)."
      scope: "soil moisture module"
      source: "MONICA soil_moisture documentation (zalf-rpm/monica-documentation, model_science/soil_processes/soil_moisture)"
      status: adopted
    - statement: "Crop development is governed by accumulated thermal sums (degree-days) across stages 0-7, with radiation-driven assimilation modulated by temperature, water, N, heat, oxygen and frost stress."
      scope: "crop growth module"
      source: "MONICA crop_processes documentation and Nendel et al. 2011 (doi:10.1016/j.ecolmodel.2011.02.018)"
      status: adopted
    - statement: "Atmospheric CO2 is treated as a time-varying forcing; absent an external series it is generated from an embedded per-RCP curve (default RCP8.5)."
      scope: "CO2 forcing"
      source: "CO2ForDate logic in the MONICA core source (monica-model.cpp)"
      status: tentative
