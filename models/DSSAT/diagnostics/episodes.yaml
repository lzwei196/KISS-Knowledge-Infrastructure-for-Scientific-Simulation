  # =========================================================================
  # EP_009: Summary.OUT parsing — spaces in TNAME break split()
  # =========================================================================
  - id: "ep_009"
    timestamp: "2026-03-16T16:53:00"
    model: "DSSAT-CSM v4.8.5 Build 41"
    platform: "Linux x86_64"
    stage: "s9_output_parsing"

    context:
      goal: "Parse yields from Summary.OUT after successful 224-cell run"
      action: "Used line.split() to extract HWAM column"
      command: "run_dssat_grid.py output parsing"
      working_directory: "/tmp/dssat_runs/c0001"
      input_files: ["Summary.OUT"]
      preceding_steps: ["All 224 cells ran successfully — STOP 99 errors all resolved"]

    error:
      observed_output: "Yield mean: 1,980,237 kg/ha (implausible — should be 1000-10000)"
      error_pattern: ""
      exit_code: 0
      error_file: ""
      misleading: false

    debugging_trace:
      - step: "Checked Summary.OUT format"
        result: "TNAME field 'RAINFED MZ GRID 0001' contains spaces — split() breaks it into 4 tokens, shifting all subsequent column indices"
        useful: true
      - step: "Tried counting fields: expected HWAM at index 23, but got SDAT (year 1980237)"
        result: "Confirmed: the '1980237' value was SDAT (simulation date in YYYYDDD), not yield"
        useful: true
      - step: "Switched to header-based column position parsing"
        result: "Find '@' header line, locate 'HWAM' position, extract value at same character position from data line"
        useful: true

    resolution:
      root_cause: "Summary.OUT uses fixed-width Fortran FORMAT, not delimiter-separated. The TNAME field is 25 characters wide and can contain spaces. Using Python's str.split() (which splits on whitespace) misaligns all columns after TNAME."
      fix_action: "Parse Summary.OUT by column positions from the @ header line, not by split(). Find each variable name in the header, then extract the value at the same character position from the data line."
      fix_command: "pos = header.find('HWAM'); value = data_line[pos:pos+8].strip()"
      time_to_resolve_minutes: 10
      difficulty: "moderate"

    infrastructure_feedback:
      triplet_id: "dt_050"
      triplet_action: "new"
      preventable_by_existing_docs: true
      skill_gap: "s9_output_parsing_skill.md mentions fixed-width format but parse_summary_out.py handles it correctly — the gridded runner reimplemented parsing without reading the skill doc"
      tool_gap: "run_dssat_grid.py should import parse_summary_out.py from the knowledge infrastructure rather than reimplementing"
      common_failure_pattern: "cfp_006"

    failure_domain: "silent_error"
    severity: "silent"
    tags: ["output_parsing", "fixed_width", "split_danger", "silent_error", "TNAME"]

# ============================================================================
# Summary Statistics
# ============================================================================
# Total episodes: 9
# Failure domains: path_resolution (3), string_overflow (3), parameter_format (2), silent_error (1)
# Common failure patterns matched: cfp_001 (3 episodes), cfp_003 (1), cfp_006 (3)
# New triplets generated: dt_045, dt_046, dt_047, dt_048, dt_049, dt_050
# Existing triplets validated: dt_040
# Errors preventable by existing docs: 3/9 (33%)
# Errors requiring new documentation: 6/9 (67%)
#
# Key insight: 7/9 errors (78%) are about path/string handling in Fortran
# legacy code. This is the dominant failure mode for DSSAT on Linux.
# The knowledge infrastructure had 44 triplets but none specifically
# addressed Linux deployment, which is a critical gap.
