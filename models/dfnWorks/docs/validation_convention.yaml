# dfnWorks validation literature is dominated by verification, code-comparison,
# stochastic-ensemble, and process-sensitivity papers. Most papers report behavior
# or benchmark spread, not transferable pass/fail thresholds for NSE, PBIAS, CSI,
# or Spearman. Numeric bands below are therefore used only where a fetched paper
# states an explicit benchmark criterion or target; otherwise bands stay null.

