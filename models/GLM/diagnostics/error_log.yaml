  promoted: false
  promoted_as: ''
- id: err_007
  timestamp: '2026-03-22T05:33:07Z'
  recorded_by: server
  run_context:
    basin: Miyun
    model: GLM
    run_name: miyun_glm_test
  stage: s6_namelist
  failure_domain: silent_error
  symptom:
    description: Missing dt_iceon_avg and min_ice_thickness params in snowice block causes zero ice formation. GLM ice model
      silently disabled without these params.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: The snowice block requires dt_iceon_avg (ice onset averaging period in days) and min_ice_thickness to function.
      Without dt_iceon_avg, GLM never triggers ice formation even when surface T approaches 0 C. The parameter is not documented
      in most GLM examples.
    explanation: ''
    affected_components:
    - snowice_block
    - generate_glm_nml
  resolution:
    action: 'Added dt_iceon_avg=0.02 and min_ice_thickness=0.001 to snowice block. Ice forms correctly: 71 days/yr with max
      0.28m blue ice on Miyun Reservoir.'
    files_changed: []
    prevention: Always include dt_iceon_avg=0.02 and min_ice_thickness=0.001 in snowice block for temperate/boreal lakes
  severity: silent
  promoted: false
  promoted_as: ''
