# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: MOSART
  language: python
  implementation:
    id: mosartwmpy
    version: 1.0.x (mosartwmpy, PyPI/conda-forge)
    provenance: Python; IMMM-SFA / PNNL (Thurber, Xu, Vernon) numba-JIT translation of the Fortran MOSART-WM
      routing + water-management science, with BMI interface.
  scientific_reference_version: MOSART-WM (MOSART routing of Li et al. 2013 + Voisin et al. 2013 water
    management, with ISTARF reservoir release)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/MOSART/venv/bin/python
    type: work_dir
pipeline:
  stages:
  - s1_runoff_forcing
  - s2_grid_preparation
  - s3_configuration
  - s4_execution
  - s5_output_analysis
tools:
  count: 7
  files:
  - tools/build_mosart_grid.py
  - tools/convert_grid_parameters.py
  - tools/convert_runoff_forcing.py
  - tools/delineate_d8_from_merit.py
  - tools/frac_to_basin_shp.py
  - tools/parse_mosart_output.py
  - tools/run_mosartwmpy.py
inputs:
  forcing:
  - name: surface_runoff (QOVER)
    unit: mm/s
  - name: subsurface_runoff (QDRAI)
    unit: mm/s
  - name: wetland_runoff (QGWL, optional)
    unit: mm/s
  - name: total_demand (totalDemand)
    unit: m3/s
  parameters:
  - name: main channel geometry (rlen, rslp, rwid, rwid0, rdep)
    unit: m, m/m
  - name: subnetwork (tributary) geometry (tslp, twid)
    unit: m, m/m
  - name: hillslope geometry (hslp, gxr)
    unit: m/m, m^-1
  - name: Manning's roughness (nr, nt, nh)
    unit: s/m^(1/3)
  - name: grid topology (ID, dnID, fdir, lat, lon, area, areaTotal, areaTotal2, frac)
    unit: -, degrees, m2, 0-1
  - name: reservoir parameters (GRAND_ID, GRID_CELL_INDEX, CAP_MCM, AREA_SKM, DAM_HGT_M, ISTARF coefficients)
    unit: million m3, km2, m
  - name: reservoir dependency database
    unit: '-'
  - name: mean monthly reservoir flow and demand schedules
    unit: m3/s
  initial_conditions:
  - name: model state restart
    unit: mixed
  boundary_conditions:
  - name: simulation.timestep
    unit: s
  - name: simulation.subcycles / simulation.routing_iterations
    unit: '-'
  - name: simulation.output_resolution / output_file_frequency
    unit: s, -
  - name: water_management.enabled
    unit: '-'
  - name: water_management.reservoirs.enable_istarf
    unit: '-'
  - name: grid.subdomain
    unit: '-'
  - name: runoff.read_from_file
    unit: '-'
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - RIVER_DISCHARGE_OVER_LAND_LIQ
  - channel_outflow
  - STORAGE_LIQ
  - WRM_STORAGE
  - WRM_SUPPLY
  - WRM_DEFICIT
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.837, KGE=0.874, R=0.919, 2 scorecard(s)'
  metrics:
    best_nse: 0.8367
    best_kge: 0.8741
    best_r: 0.9186
summary:
  total_tools: 7
  total_stage_docs: 5
  total_diagnostic_triplets: 22
  generated: '2026-08-15'
