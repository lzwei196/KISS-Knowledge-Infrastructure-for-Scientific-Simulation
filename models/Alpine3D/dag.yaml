template_version: "3.5"

identity:
  model_id: "Alpine3D"
  scientific_reference_version: "Alpine3D 3.2.0 (SLF release; SNOWPACK 1D snow/soil physics + MeteoIO interpolation + EnergyBalance terrain radiation + optional SnowDrift + Runoff)"
  implementation:
    id: "alpine3d-slf"
    version: "3.2.0"
    provenance: "C++ (MPI/OpenMP parallelized); WSL/SLF Alpine3D driver coupling the SNOWPACK 1D column engine and the MeteoIO I/O/interpolation library."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL-3.0-or-later"
  repo_url: "https://code.wsl.ch/snow-models/alpine3d"

boundary:
  scope_in:
    - "Distributed per-pixel 1-D snow/soil/canopy energy and mass balance over a DEM (SNOWPACK physics per cell)"
    - "Spatial and temporal interpolation/downscaling of point-station meteo to the grid (MeteoIO)"
    - "Terrain-aware shortwave/longwave radiation: topographic shading, sky view factors, terrain reflection/emission (EnergyBalance)"
    - "Wind-driven snow transport — saltation, suspension, sublimation, deposition (optional SnowDrift)"
    - "Snowmelt- and rainfall-driven surface and soil-column runoff, aggregated per sub-catchment (Runoff)"
    - "Soil heat flux and soil thermal/water state beneath the snowpack"
  scope_out:
    - "Lateral subsurface/overland fluxes between columns (core 1-D no-lateral-flux assumption); inter-column coupling occurs only via wind redistribution and radiative terrain exchange"
    - "Channel/streamflow routing and downstream hydraulics (delegated to external models such as PREVAH forced by Alpine3D runoff grids)"
    - "Atmospheric model coupling — the model is driven by external meteo forcing only"
    - "Water bodies (excluded from SNOWPACK computation)"
  spatial: "distributed-stream"
  temporal: "hourly"
  closure: "both"
  notes: "Per-pixel 1-D mass-and-energy-balance closure; water and energy are conserved within each column. There is no lateral inter-column closure except wind-driven snow redistribution (SnowDrift) and radiative terrain exchange (EnergyBalance). The outer driver cadence is fixed at dt_main = 3600 s; CALCULATION_STEP_LENGTH only sets the SNOWPACK inner sub-step count, and sub-threshold precipitation is held in an internal accumulation store, so precipitation conservation holds over the accumulation window rather than strictly per timestep."

inputs:
  forcing:
    - {category: "forcing", name: "Air temperature (TA)", unit: "K", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Authored in Kelvin; MeteoIO min_max filter (240-320 K) rejects Celsius values as nodata."}
    - {category: "forcing", name: "Relative humidity (RH)", unit: "fraction 0-1", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Fraction, not percent; values >1 are clipped to 1.0 causing permanent saturation."}
    - {category: "forcing", name: "Wind speed (VW)", unit: "m/s", source_kind: "forcing", model_input_format: "SMET station time series"}
    - {category: "forcing", name: "Wind direction (DW)", unit: "degrees (0=N,90=E,180=S,270=W)", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Required for LISTON_WIND spatial interpolation."}
    - {category: "forcing", name: "Precipitation (PSUM)", unit: "kg/m2 (mm w.e.)", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Accumulated water-equivalent; accumulation period must equal the step length."}
    - {category: "forcing", name: "Incoming shortwave radiation (ISWR)", unit: "W/m2", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Optional; prefer MeteoIO CLEARSKY_SW generator over supplying synthesized values."}
    - {category: "forcing", name: "Incoming longwave radiation (ILWR)", unit: "W/m2", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Optional; can be generated by MeteoIO ALLSKY_LW (Unsworth) / CLEARSKY_LW (Dilley)."}
    - {category: "forcing", name: "Atmospheric pressure (P)", unit: "Pa", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Optional; STD_PRESS lapse used when absent."}
    - {category: "forcing", name: "Snow height (HS)", unit: "m", source_kind: "forcing", model_input_format: "SMET station time series", notes: "Optional; used for validation or with ENFORCE_MEASURED_SNOW_HEIGHTS."}
    - {category: "forcing", name: "3-D / gridded wind fields", unit: "m/s", source_kind: "forcing", model_input_format: "MeteoIO GRID3D plugin (e.g. ARPS), WINDFIELDS key", notes: "Required only when SnowDrift is enabled (--enable-drift)."}
  parameters:
    - {category: "parameters", name: "Roughness length (ROUGHNESS_LENGTH)", unit: "m", source_kind: "calibrated", model_input_format: "[Snowpack] config key", notes: "Default 0.002 m; controls Monin-Obukhov turbulent exchange; high sensitivity."}
    - {category: "parameters", name: "Height of meteo values (HEIGHT_OF_METEO_VALUES)", unit: "m", source_kind: "calibrated", model_input_format: "[Snowpack] config key", notes: "Default 2.0 m; measurement reference height for turbulent fluxes."}
    - {category: "parameters", name: "Geothermal heat flux (GEO_HEAT)", unit: "W/m2", source_kind: "calibrated", model_input_format: "[Snowpack] config key", notes: "Default 0.06 W/m2; basal boundary flux controlling basal melt."}
    - {category: "parameters", name: "Rain/snow threshold (THRESH_RAIN)", unit: "K above freezing", source_kind: "calibrated", model_input_format: "[SnowpackAdvanced] config key", notes: "Default ~1.2 K; partitions precipitation phase; high sensitivity."}
    - {category: "parameters", name: "Air-temperature lapse rate", unit: "K/m", source_kind: "calibrated", model_input_format: "[Interpolations2D] config", notes: "Typical -0.003 to -0.009 K/m; governs interpolated TA field."}
    - {category: "parameters", name: "Precipitation lapse rate", unit: "1/m", source_kind: "calibrated", model_input_format: "[Interpolations2D] config", notes: "Sets the elevation gradient of interpolated precipitation."}
    - {category: "parameters", name: "DEM grid", unit: "m elevation", source_kind: "dataset_lookup", model_input_format: "ARC ASCII raster", notes: "Defines domain extent, resolution, CRS; shadow-casting cells outside the domain must be retained."}
    - {category: "parameters", name: "Land-use / land-cover grid", unit: "categorical (PREVAH 1LLDC codes)", source_kind: "dataset_lookup", model_input_format: "ARC ASCII raster", notes: "One code per cell; header (ncols,nrows,xllcorner,yllcorner,cellsize) must match the DEM exactly."}
    - {category: "parameters", name: "Catchment-definition grid", unit: "powers-of-two membership code", source_kind: "dataset_lookup", model_input_format: "ARC ASCII raster", notes: "Optional; needed for sub-catchment runoff aggregation."}
    - {category: "parameters", name: "Soil/snow layer physical coefficients (in .sno)", unit: "mixed (Rho_S kg/m3, Conduc_S W/m/K, HeatCapac_S J/kg/K, rg/rb mm)", source_kind: "dataset_lookup", model_input_format: "SMET .sno per-cell file", notes: "Static substrate/snow microstructure coefficients within the initial profile."}
  initial_conditions:
    - {category: "initial_conditions", name: "Initial snow/soil stratigraphy (.sno)", unit: "mixed per field", source_kind: "user_provided", model_input_format: "SMET 1.1 .sno per grid cell (or per land-cover class)", notes: "Per-layer Layer_Thick (m), T (K), Vol_Frac_I/W/V/S (sum=1.0), density, grain rg/rb, dd, sp, mk; must be dated before simulation start. Recommended cold-start: bare ground on Oct 1, or 3-5 yr soil-temperature spinup."}
    - {category: "initial_conditions", name: "Canopy initial state", unit: "mixed", source_kind: "user_provided", model_input_format: "canopy parameters in .sno / land-cover config", notes: "Initial vegetation/canopy energy-mass state (CanopyData)."}
  boundary_conditions:
    - {category: "boundary_conditions", name: "Distributed mode switch (ALPINE3D)", unit: "boolean", source_kind: "user_provided", model_input_format: "[SnowpackAdvanced] config key", notes: "Must be TRUE; if FALSE, SNOWPACK runs each cell as an independent point ignoring distributed forcing/terrain."}
    - {category: "boundary_conditions", name: "Coordinate system (COORDSYS / COORDPARAM)", unit: "CRS identifier", source_kind: "user_provided", model_input_format: "[Input]/[Output] config keys", notes: "Must match the DEM CRS and use MGRS band-letter notation for UTM; mismatch silently misplaces stations."}
    - {category: "boundary_conditions", name: "Computation step length (CALCULATION_STEP_LENGTH)", unit: "minutes", source_kind: "user_provided", model_input_format: "[Snowpack] config key", notes: "Default 15 min; sets the SNOWPACK inner sub-step count only — the outer driver cadence is hardcoded at 3600 s."}
    - {category: "boundary_conditions", name: "Snow-erosion / SnowDrift enable (SNOW_EROSION / --enable-drift)", unit: "switch", source_kind: "user_provided", model_input_format: "[SnowpackAdvanced] config / build flag", notes: "Activates wind-driven redistribution and the 3-D wind-field requirement."}
    - {category: "boundary_conditions", name: "Snow water-transport model (WATERTRANSPORTMODEL_SNOW)", unit: "method selector (BUCKET / RICHARDSEQUATION)", source_kind: "user_provided", model_input_format: "[SnowpackAdvanced] config key", notes: "Selects bucket vs Richards-equation percolation."}
    - {category: "boundary_conditions", name: "Atmospheric stability scheme (ATMOSPHERIC_STABILITY)", unit: "method selector", source_kind: "user_provided", model_input_format: "[Snowpack] config key", notes: "Default MO_MICHLMAYR; controls Monin-Obukhov correction; high sensitivity."}
    - {category: "boundary_conditions", name: "Terrain radiation method (TERRAIN_RADIATION_METHOD)", unit: "method selector (SIMPLE / COMPLEX / HELBIG)", source_kind: "user_provided", model_input_format: "[EBalance] config key", notes: "Selects the terrain reflected/emitted radiation algorithm; only active when terrain radiation is enabled."}
    - {category: "boundary_conditions", name: "Precipitation undercatch correction (PSUM undercatch_wmo)", unit: "filter selector", source_kind: "user_provided", model_input_format: "[Filters] config key", notes: "Corrects solid-precipitation gauge undercatch (e.g. Hellmannsh); requires VW present."}

processes:
  modules:
    - {name: "AlpineControl", role: "driver", brief: "Master time-step loop at the hardcoded dt_main = 3600 s cadence: pulls/prepares meteo, runs SnowDrift, runs EnergyBalance, runs the SNOWPACK interface, writes outputs and restart .sno files."}
    - {name: "MeteoIO", role: "driver", brief: "Reads SMET station forcing; applies QC filters (min_max, rate, mad, undercatch_wmo) and generators (CLEARSKY_SW, ALLSKY_LW/CLEARSKY_LW, ISWR_ALBEDO); temporal resampling (PSUM ACCUMULATE); 2-D spatial interpolation (lapse-rate kriging/IDW, LISTON_RH, LISTON_WIND, PPHASE, STD_PRESS) to the grid."}
    - {name: "EnergyBalance", role: "process_solver", brief: "Distributed shortwave/longwave radiation over terrain: shading, direct/diffuse split, sky view factors, terrain reflection/emission; populates the radiation grids SNOWPACK reads as boundary radiation."}
    - {name: "TerrainRadiationAlgorithm", role: "optional_module", brief: "Pluggable terrain-radiation method (SIMPLE / COMPLEX / HELBIG) selected by TERRAIN_RADIATION_METHOD; computes inter-pixel view factors returning ISWR_TERRAIN and ILWR_TERRAIN.", applicability: "when terrain radiation enabled"}
    - {name: "SnowpackInterface", role: "integrator", brief: "Decomposes the DEM into pixels, distributes SnowStation columns across MPI/OpenMP workers, and aggregates per-pixel results into the SnGrids 2-D grids (SWE, HS, TSS, runoff, soil-temperature depth grids)."}
    - {name: "SnowpackInterfaceWorker", role: "process_solver", brief: "Per-thread loop over its pixels: builds CurrentMeteo, applies glacier/stability overrides, calls Meteo then runs the SNOWPACK column for nr_snowsteps sub-steps, then Stability and fillGrids."}
    - {name: "SNOWPACK", role: "process_solver", brief: "1-D layered snow/soil column engine (runSnowpackModel): heat-conduction temperature solve, new-snow deposition, settlement, and energy/mass surface boundary conditions — the core per-pixel physics."}
    - {name: "Metamorphism", role: "process_solver", brief: "Evolves finite-element-layer microstructure: grain radius (rg), bond radius (rb), dendricity (dd), sphericity (sp), coordination number — feeding albedo, conductivity and RG/RB/SP/N3 outputs."}
    - {name: "WaterTransport", role: "process_solver", brief: "Moves liquid water through the snow/soil column (bucket or Richards), producing surface runoff (MS_SNOWPACK_RUNOFF) and soil-depth runoff."}
    - {name: "PhaseChange", role: "process_solver", brief: "Melt/refreeze of ice and water within layers using latent-heat constants; couples energy and mass between WaterTransport and the temperature solve."}
    - {name: "ReSolver1d", role: "optional_module", brief: "Richards-equation solver for snow/soil water flow when WATERTRANSPORTMODEL = RICHARDSEQUATION; required for soil-runoff-at-depth outputs.", applicability: "when Richards water transport selected"}
    - {name: "Meteo", role: "process_solver", brief: "Per-pixel surface-layer atmosphere: Monin-Obukhov stability (MO_MICHLMAYR/MO_HOLTSLAG), computes ustar, z0, psi_s used by turbulent fluxes."}
    - {name: "Stability", role: "process_solver", brief: "Post-step avalanche/stability indices on the column (diagnostic; not coupled back into mass/energy state)."}
    - {name: "SnowDrift", role: "optional_module", brief: "Wind-driven snow transport (saltation, suspension, sublimation); overwrites the VW/DW wind grids and updates the drifted-mass (mns) grid feeding SNOWPACK.", applicability: "when snow erosion / drift enabled"}
    - {name: "Canopy", role: "optional_module", brief: "Vegetation canopy energy/mass exchange and throughfall; resets canopy state each step and modifies sub-canopy radiation (ISWR_BELOW_CAN) and interception.", applicability: "when CANOPY enabled"}
    - {name: "Glaciers", role: "optional_module", brief: "Glacier-mask handling; on exposed glacier pixels overrides albedo (glacier/blueice) and forces stable atmospheric stability when TA exceeds 5 degC.", applicability: "glaciated pixels"}
    - {name: "Runoff", role: "process_solver", brief: "Aggregates per-cell surface runoff (at snow/soil interface) and total runoff (column base) into sub-catchment sums with precipitation/snowmelt/glacier-melt components."}
  internal_edges:
    - {from: "Inputs", to: "MeteoIO", kind: "consumes_input", brief: "Reads SMET station forcing, DEM and land-use grids."}
    - {from: "AlpineControl", to: "MeteoIO", kind: "invokes", brief: "Master loop pulls and prepares the interpolated 2-D meteo grids each dt_main step."}
    - {from: "AlpineControl", to: "SnowDrift", kind: "invokes", brief: "Runs wind-driven snow redistribution before the snow physics, each step when drift is enabled."}
    - {from: "AlpineControl", to: "EnergyBalance", kind: "invokes", brief: "Runs the terrain shortwave/longwave radiation balance each step."}
    - {from: "AlpineControl", to: "SnowpackInterface", kind: "invokes", brief: "Runs the distributed SNOWPACK interface (per-pixel column physics) each step."}
    - {from: "MeteoIO", to: "EnergyBalance", kind: "produces_output", brief: "Supplies interpolated 2-D meteo grids consumed by the radiation balance."}
    - {from: "MeteoIO", to: "SnowpackInterface", kind: "produces_output", brief: "Interpolated 2-D grids of TA, RH, VW, DW, PSUM, PSUM_PH, ILWR, P each timestep."}
    - {from: "MeteoIO", to: "SnowDrift", kind: "consumes_input", brief: "Provides psum, psum_ph, p, vw, dw, rh, ta, tsg before the drift computation."}
    - {from: "SnowDrift", to: "SnowpackInterface", kind: "writes_state", brief: "Overwrites the VW/DW wind grids and updates the drifted-mass (mns) grid."}
    - {from: "EnergyBalance", to: "TerrainRadiationAlgorithm", kind: "invokes", brief: "Delegates terrain reflected/emitted radiation to the selected method when terrain radiation is on."}
    - {from: "TerrainRadiationAlgorithm", to: "EnergyBalance", kind: "produces_output", brief: "Returns ISWR_TERRAIN and ILWR_TERRAIN contributions via view factors."}
    - {from: "EnergyBalance", to: "SnowpackInterface", kind: "writes_state", brief: "Populates direct/diffuse/reflected/ilwr/sky_ilwr/terrain radiation grids."}
    - {from: "SnowpackInterface", to: "SnowpackInterfaceWorker", kind: "invokes", brief: "Distributes per-pixel SnowStation columns and meteo to MPI/OpenMP workers."}
    - {from: "SnowpackInterface", to: "EnergyBalance", kind: "reads_state", brief: "Worker reads the diffuse radiation grid into the pixel meteo when energy balance is active."}
    - {from: "SnowpackInterfaceWorker", to: "Meteo", kind: "invokes", brief: "compMeteo computes ustar, z0, psi_s for the pixel before the snow physics."}
    - {from: "SnowpackInterfaceWorker", to: "Glaciers", kind: "invokes", brief: "Applies exposed-glacier albedo and stability overrides per pixel."}
    - {from: "SnowpackInterfaceWorker", to: "SNOWPACK", kind: "invokes", brief: "Calls runSnowpackModel(meteoPixel, snowPixel, store, Bdata, surfaceFlux) nr_snowsteps times per hour."}
    - {from: "SnowpackInterfaceWorker", to: "Stability", kind: "invokes", brief: "Runs checkStability on the column after the snow physics."}
    - {from: "SNOWPACK", to: "Metamorphism", kind: "invokes", brief: "Updates grain/bond geometry of the finite-element layers."}
    - {from: "SNOWPACK", to: "WaterTransport", kind: "invokes", brief: "Routes liquid water to surface and soil runoff."}
    - {from: "SNOWPACK", to: "PhaseChange", kind: "invokes", brief: "Performs melt/refreeze using latent-heat constants."}
    - {from: "SNOWPACK", to: "Canopy", kind: "invokes", brief: "Applies canopy interception and sub-canopy radiation when canopy is active."}
    - {from: "WaterTransport", to: "ReSolver1d", kind: "invokes", brief: "Calls the Richards-equation solver when that water-transport model is selected."}
    - {from: "SNOWPACK", to: "Snowpack_state", kind: "writes_state", brief: "Updates the multi-layer stratigraphy, total height, new-snow height/density, eroded mass and internal energy."}
    - {from: "AlpineControl", to: "Precip_store", kind: "writes_state", brief: "Accumulates sub-threshold precipitation into the internal store grid carried across timesteps."}
    - {from: "Precip_store", to: "SNOWPACK", kind: "reads_state", brief: "Held precipitation mass is passed in and zeroed only when enough mass forms a new finite-element layer."}
    - {from: "SnowpackInterfaceWorker", to: "SnowpackInterface", kind: "produces_output", brief: "fillGrids writes per-pixel SWE, HS, TSS, TSG, RSNO, grain metrics and runoff into the SnGrids."}
    - {from: "SnowpackInterface", to: "Runoff", kind: "produces_output", brief: "Per-pixel runoff fields feed sub-catchment aggregation."}
    - {from: "Runoff", to: "Outputs", kind: "produces_output", brief: "Writes sub-catchment total/component runoff sums and optional per-pixel runoff grids."}
    - {from: "SnowpackInterface", to: "AlpineControl", kind: "produces_output", brief: "getGrid returns assembled grids; HS can optionally be fed back into the meteo-interpolation DEM."}
    - {from: "AlpineControl", to: "Outputs", kind: "produces_output", brief: "Writes gridded ARC ASCII outputs, POI .met/.pro time series, and restart .sno files."}

states:
  variables:
    - {name: "Snowpack_state", unit: "multi-layer finite-element column", role: "prognostic"}
    - {name: "Layer ice/water/void/soil volume fractions", unit: "fraction (sum=1.0)", role: "prognostic"}
    - {name: "Layer temperature", unit: "K", role: "prognostic"}
    - {name: "Layer density", unit: "kg/m3", role: "prognostic"}
    - {name: "Layer liquid water content", unit: "kg/m2", role: "prognostic"}
    - {name: "Grain microstructure (rg, rb, dd, sp, mk)", unit: "mm / dimensionless", role: "prognostic"}
    - {name: "Snow water equivalent (SWE)", unit: "kg/m2", role: "diagnostic"}
    - {name: "Snow depth / total column height (HS)", unit: "m", role: "diagnostic"}
    - {name: "Snow surface temperature (TSS)", unit: "K", role: "prognostic"}
    - {name: "Soil thermal/water state", unit: "K / kg/m2", role: "prognostic"}
    - {name: "Surface albedo", unit: "fraction (clamped 0.3-0.9)", role: "diagnostic"}
    - {name: "Canopy state (CanopyData)", unit: "mixed", role: "prognostic"}
    - {name: "Surface energy/mass flux accumulators (SurfaceFluxes)", unit: "W/m2, kg/m2", role: "accumulator"}
    - {name: "Precip_store", unit: "kg/m2", role: "accumulator", note: "Held sub-threshold precipitation accumulated across timesteps until enough mass forms a new finite-element layer."}
    - {name: "Drifted-mass grid (mns)", unit: "kg/m2", role: "accumulator"}
  provenance: "populated"

outputs:
  - var: "SWE"
    validation_rank: 1
    unit: "kg/m2"
    description: "Snow water equivalent per pixel (bulk snowpack mass)."
    emitted_in: "Gridded ARC ASCII (YYYYMMDDHHMI_SWE.asc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Point pillow/snow-course obs compare to the containing pixel; sub-pixel terrain and drift create representativeness error.", "Gauge solid-precipitation undercatch can drive strong negative SWE bias unless an undercatch correction is enabled."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Against airborne/laser-scan snow-depth-derived SWE maps; wind redistribution dominates the spatial pattern."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Requires repeat distributed snapshots; comparison is per-snapshot spatial plus accumulation timing."]
      detrending_options: ["none"]
  - var: "HS"
    validation_rank: 2
    unit: "m"
    description: "Snow depth per pixel."
    emitted_in: "Gridded ARC ASCII (YYYYMMDDHHMI_HS.asc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Snow-on/snow-off timing is informative; representativeness error at the point applies."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Laser-scan / photogrammetry snow-depth maps are the canonical distributed reference."]
      detrending_options: ["none"]
  - var: "TSS"
    validation_rank: 6
    unit: "K"
    description: "Snow (or bare-surface) skin temperature from the surface energy balance."
    emitted_in: "Gridded ARC ASCII; POI .met time series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Sensitive to longwave forcing quality; synthesized ILWR can bias nighttime cooling."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Against thermal-IR remote-sensing surface-temperature retrievals."]
      detrending_options: ["none"]
  - var: "MS_SNOWPACK_RUNOFF"
    validation_rank: 3
    unit: "kg/m2"
    description: "Surface runoff leaving the base of the snowpack (snow/soil interface), per pixel; aggregated to sub-catchment sums by Runoff."
    emitted_in: "Gridded ARC ASCII; sub-catchment SMET runoff sums"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Alpine3D produces runoff generation only; channel routing is external (e.g. PREVAH), so direct comparison to gauged streamflow conflates the missing routing.", "Component sums (precip/snowmelt/glacier-melt) are measured at the snow/soil interface and are smaller than total column-base runoff."]
      detrending_options: ["none"]
  - var: "MS_SOIL_RUNOFF"
    validation_rank: 7
    unit: "kg/m2"
    description: "Runoff at the bottom of the soil column, per pixel."
    emitted_in: "Gridded ARC ASCII; sub-catchment SMET runoff sums"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Total column-base runoff; same external-routing caveat as surface runoff."]
      detrending_options: ["none"]
  - var: "RSNO"
    validation_rank: 4
    unit: "kg/m3"
    description: "Mean snowpack density per pixel."
    emitted_in: "Gridded ARC ASCII"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Bulk density from snow-pit / snow-course density measurements at the pixel."]
      detrending_options: ["none"]
  - var: "POI energy/mass-balance terms (.met)"
    validation_rank: 5
    unit: "mixed (W/m2, kg/m2, K)"
    description: "Full per-timestep SNOWPACK energy and mass balance at Points of Interest: lw_in/out, sw_in/out, sensible (qs), latent (ql), ground (qg) fluxes, snow/rain precip, evaporation, sublimation, melt, runoff, HS, SWE, density, layer count, surface temperature, stability indices."
    emitted_in: "POI .met SMET time series; .pro stratigraphy profiles"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Flux-tower / energy-balance-station comparison; closure depends on the active ET and stability options."]
      detrending_options: ["none"]

