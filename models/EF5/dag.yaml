template_version: "3.5"

identity:
  model_id: "EF5"
  scientific_reference_version: "EF5 v1.2 (Ensemble Framework For Flash Flood Forecasting; Flamig, Vergara & Gourley 2020, GMD 13:4943-4958)"
  implementation:
    id: "ef5-hydroslab"
    version: "1.2.3"
    provenance: "C++; HyDROSLab (University of Oklahoma) / NOAA NSSL EF5 source from github.com/HyDROSLab/EF5, one binary that couples a chosen water-balance model, routing model, and optional snow and inundation modules."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "Unlicense"
  repo_url: "https://github.com/HyDROSLab/EF5"

boundary:
  scope_in:
    - "Water balance and runoff generation, one model per run: CREST, SAC-SMA or HP distributed per grid cell; HyMOD lumped per gauge basin (no routing, snow, inundation or grids)"
    - "Split of runoff excess into fast (overland) and slow (interflow / ground) flow per cell"
    - "Downstream routing of runoff on a D8 flow network (kinematic wave or linear reservoir)"
    - "Optional Snow-17 temperature-index snow accumulation and melt ahead of the water balance"
    - "Optional PET derived from air temperature (Hamon method)"
    - "Optional water depth from discharge (simple or VC inundation)"
    - "Optional insertion of observed gauge discharge into kinematic-wave routing states (data assimilation)"
    - "Optional streamflow return-period statistics (Log-Pearson Type III)"
  scope_out:
    - "Groundwater aquifer storage and lateral groundwater flow"
    - "Reservoir and dam operations, water withdrawals"
    - "Energy-balance snow physics (Snow-17 is temperature-index only)"
    - "Full dynamic Saint-Venant routing (kinematic wave drops acceleration and backwater terms)"
    - "2-D hydraulic floodplain inundation"
    - "Surface energy balance, vegetation dynamics, water quality"
  spatial: "2-D grid"
  temporal: "hourly"
  closure: "mass-balance"
  notes: "Water mass balance is kept per grid cell in the chosen water-balance store and routed downstream on the DEM/DDM/FAM flow network. The time step is user-set (seconds to days); flash-flood use is sub-hourly to hourly, and the model is built for that range. There is no energy-balance closure: the ET demand is PET times a factor (KE in CREST), and actual ET is limited by available water (in CREST it equals the demand only when precipitation exceeds it, otherwise precipitation plus a soil-limited share; 0 with no rain and an empty store, CRESTModel.cpp:251-260); snow uses a temperature index. Water from cells that drain to no gauge gets no parameters and is not simulated."

inputs:
  forcing:
    - category: "meteorology"
      name: "precipitation"
      unit: "mm/h (internal rate; depth per step = rate x step hours)"
      source_kind: "forcing"
      model_input_format: "time-named raster per FREQ step (ESRI ASCII, BIF, float32 GeoTIFF; also TRMM RT and MRMS grids. TYPE=TRMMV7 is accepted by the parser but has no reader in this source, so it gives 'Unsupported precip format' and zero rain; convert TRMM V7 to TIF first)"
      notes: "Only the TIME part of the declared UNIT (e.g. mm/3h, mm/d) is used to rescale values to mm/h; a wrong UNIT scales rain with no error. The LENGTH part is parsed (m, mm, cm accepted) but ignored, so values must already be in mm: 0.001 declared as m/h is used as 0.001 mm/h, not 1 mm/h. An optional forecast precipitation series is used for steps where observed precipitation is missing. When Snow-17 is on, its rain+melt output replaces precipitation as the water-balance input."
    - category: "meteorology"
      name: "potential evapotranspiration"
      unit: "mm/h (internal rate)"
      source_kind: "forcing"
      model_input_format: "time-named raster per FREQ step (ESRI ASCII, BIF, float32 GeoTIFF)"
      notes: "May be given as mm/h, mm/d or mm per month and is rescaled by the TIME part of the declared UNIT only; the length part (m, cm) is ignored, so values must already be in mm. If the PET forcing is declared as temperature (degC), EF5 computes Hamon PET per cell using latitude from the grid projection; T <= 0 degC gives PET = 0. In CREST, KE x PET is the evaporative DEMAND, not actual ET: actual ET equals that demand only when precipitation exceeds it; otherwise it is precipitation plus a soil-water-limited share (demand left x SM/WM, capped by SM), so with no rain and an empty store actual ET is 0 (CRESTModel.cpp:133, 230, 251-260)."
    - category: "meteorology"
      name: "air temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "time-named raster per FREQ step (ESRI ASCII or float32 GeoTIFF)"
      notes: "Read only when Snow-17 is on (never with HyMOD, which runs lumped without Snow-17). Precipitation is snow below a fixed 1 degC threshold and rain above it. Kelvin input breaks melt. NoData temperature cells become 0 degC. When the temperature grid is not on the DEM grid and a temperature-grid DEM is given, temperature is lapse-adjusted by -0.0065 degC per m of height difference."
  parameters:
    - category: "terrain"
      name: "DEM (elevation)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "ESRI ASCII or GeoTIFF raster sharing grid with DDM and FAM"
      notes: "Gives cell slope as max(drop, 1 m)/horizontal length and Snow-17 air pressure. Feet input makes slopes 3.28x too steep. The raster origin is always read as a cell corner: the GeoTIFF tiepoint as the upper-left corner, and the ESRI ASCII xll/yll values as the lower-left corner (the xllcorner/xllcenter label is not checked)."
    - category: "terrain"
      name: "DDM (D8 drainage direction)"
      unit: "direction code"
      source_kind: "dataset_lookup"
      model_input_format: "raster; ESRI coding (1..128) or TauDEM coding (1..8), chosen by a switch"
      notes: "Defines the downstream link of every cell."
    - category: "terrain"
      name: "FAM (flow accumulation)"
      unit: "cell count"
      source_kind: "dataset_lookup"
      model_input_format: "raster; counts the cell itself (min 1) or not (min 0), chosen by a switch"
      notes: "Used for gauge snapping against basin area and for the channel test FAM > TH."
    - category: "soil_water_balance"
      name: "CREST WM (maximum soil water capacity)"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a parameter grid"
      notes: "Typical 50-500 mm. WM < 0 silently falls back to 100 mm."
    - category: "soil_water_balance"
      name: "CREST B (variable infiltration curve exponent)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a parameter grid"
      notes: "Typical 0.1-1.5, must be > 0. B < 0 silently becomes 1.0; NaN becomes 0.0."
    - category: "soil_water_balance"
      name: "CREST IM (impervious area fraction)"
      unit: "% (0-100)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a parameter grid"
      notes: "Scalar only: IM/100. With a grid: IM x grid, no /100. Result clamped to 0-1. Grid zeros become 0.01, so a true zero needs scalar IM = 0."
    - category: "soil_water_balance"
      name: "CREST KE (PET to actual ET factor)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a parameter grid"
      notes: "Typical 0.5-2.0."
    - category: "soil_water_balance"
      name: "CREST FC (saturated hydraulic conductivity)"
      unit: "mm/h"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a parameter grid"
      notes: "Typical 0.1-120 mm/h. FC < 0 silently becomes 1.0."
    - category: "soil_water_balance"
      name: "SAC-SMA parameters (UZTWM, UZFWM, UZK, PCTIM, ADIMP, RIVA, ZPERC, REXP, LZTWM, LZFSM, LZFPM, LZSK, LZPK, PFREE, SIDE, RSERV)"
      unit: "mm (UZTWM, UZFWM, LZTWM, LZFSM, LZFPM); 1/day (UZK, LZSK, LZPK); - fractions (PCTIM, ADIMP, RIVA, PFREE, SIDE, RSERV); - (ZPERC, REXP)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalars, optionally times parameter grids"
      notes: "Used only when SAC-SMA is the water-balance model. In this source only the first six (UZTWM, UZFWM, UZK, PCTIM, ADIMP, RIVA) take a grid multiplier."
    - category: "soil_water_balance"
      name: "HyMOD parameters (HUZ, B, ALP, NQ, KQ, KS, XCUZ, XQ, XS, PRECIP)"
      unit: "HUZ mm; B -; ALP - (0-1 share to quick flow); NQ count of quick reservoirs; KQ, KS 1/day; XCUZ - (fraction of store capacity); XQ, XS mm; PRECIP - (precipitation multiplier)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalars (no grid multiplier in this source)"
      notes: "Used only when HyMOD is the water-balance model. HyMOD is LUMPED in EF5 (IsLumped() = true): it runs once per gauge on gauge-averaged precipitation and PET, and the routing model, Snow-17, inundation, return period and all grid outputs are skipped. KQ and KS are divided by 24 in code, so they are entered per day and used per hour. XCUZ, XQ and XS are start values of the HyMOD stores, not rates. The manual gives no HyMOD units; the units here follow how the code uses each value."
    - category: "soil_water_balance"
      name: "HP SPLIT (fast/slow split fraction) and HP PRECIP (precipitation multiplier)"
      unit: "- (both clamped to 0-1)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalars, optionally times grids"
      notes: "Used only when HP is the water-balance model; no soil store. PRECIP is read and clamped but the HP water balance in this source never multiplies precipitation by it, so changing PRECIP has no effect."
    - category: "routing"
      name: "KW ALPHA (channel storage relation A = ALPHA x Q^BETA multiplier)"
      unit: "m^(2-3 BETA) s^BETA (so that A in m2 for Q in m3/s)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times an a-priori grid"
      notes: "Typical 1-10. ALPHA = 0 does NOT give zero flow: it removes the channel storage term, so inflow passes straight through with no attenuation. The code solves the channel step with the storage term ALPHA x Q^BETA (A = ALPHA x Q^BETA); the manual's text 'Q = alpha*A^beta' is the inverse form and does not match the code. ALPHA < 0 silently becomes 1.0."
    - category: "routing"
      name: "KW BETA (channel exponent in A = ALPHA x Q^BETA)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times an a-priori grid"
      notes: "Typical 0.5-1.0. Used for channel cells only; BETA < 0 silently becomes 0.6."
    - category: "routing"
      name: "KW ALPHA0 (overland / hillslope alpha in h = ALPHA0 x q^0.6)"
      unit: "m^-0.2 s^0.6 (so that storage depth in m for unit flow q in m2/s)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a grid"
      notes: "Hillslope kinematic wave always uses a fixed beta of 0.6 with ALPHA0, in the same storage form as the channel (storage = ALPHA0 x q^0.6, q = unit-width flow). ALPHA0 < 0 silently becomes 1.0."
    - category: "routing"
      name: "TH (channel threshold)"
      unit: "upstream cells"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar"
      notes: "A cell is channel when FAM > TH. Shared by KW and LR routing and read by inundation."
    - category: "routing"
      name: "UNDER (interflow speed multiplier)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a grid"
      notes: "Typical 0.5-5."
    - category: "routing"
      name: "LEAKI (interflow reservoir leak fraction per step)"
      unit: "- (0-1)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalar, optionally times a grid"
      notes: "Clamped to 0-1. Typical 0.01-0.1. A fraction of the interflow store released per step, with no time-step scaling, so the same LEAKI drains faster in real time at shorter steps."
    - category: "routing"
      name: "Linear-reservoir routing parameters (COEM, RIVER, LEAKO)"
      unit: "COEM, RIVER - (speed multipliers; no unit given in manual or code); LEAKO - (0-1 fraction per step)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalars, optionally times grids"
      notes: "Used only with linear-reservoir routing; travel speed = depth^0.66 x sqrt(slope) x COEM (overland) or RIVER (channel). LEAKO clamped to 0-1. The manual LR section is unfinished, so COEM and RIVER have no stated unit."
    - category: "snow"
      name: "Snow-17 parameters (UADJ, MBASE, MFMAX, MFMIN, TIPM, NMF, PLWHC, SCF)"
      unit: "UADJ mm/mb per 6 h; MBASE degC; MFMAX, MFMIN mm/degC per 6 h; TIPM - (0-1); NMF mm/degC per 6 h; PLWHC - (fraction of ice); SCF - (snowfall multiplier)"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalars, optionally times grids"
      notes: "Used only when Snow-17 is on. The code scales MFMAX, MFMIN, NMF and UADJ by step hours / 6, so they are per-6-hour values; the manual gives no units for these. Fixed constants in code: rain/snow threshold 1 degC, rain-on-snow threshold 0.25 mm/h, heat deficit cap 0.33 x WI."
    - category: "inundation"
      name: "Inundation ALPHA, BETA (rating relation)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "per-gauge scalars, optionally times grids"
      notes: "Used only by simple inundation: stage = ALPHA x Q^BETA, depth = stage minus cell height above the channel. VC inundation reads ALPHA and BETA but does not use them to compute depth. The manual text 'A = (Q/alpha)^(1/beta)' (cross-section area) does not match the code, which computes a stage height."
    - category: "return_period"
      name: "LP3 statistic grids (mean, std, skew of annual peak log10-Q)"
      unit: "log10(m3/s) for mean; log10 units for std; - for skew"
      source_kind: "derived"
      model_input_format: "GeoTIFF grids named by RP_AVGGRID / RP_STDGRID / RP_CSGRID"
      notes: "Made by an earlier return-period-mode run, which takes log10 of each year's peak Q per cell and writes the mean, std and skew grids (avgq, stdq, sc). Needed to turn Q into a return period in a normal simulation run; Q for each return period = 10^(mean + k x std)."
  initial_conditions:
    - category: "soil_water"
      name: "CREST IWU (initial soil water)"
      unit: "% of WM"
      source_kind: "user_provided"
      model_input_format: "per-gauge scalar (SM0 = IWU x WM / 100) or a saved soil-moisture state grid"
      notes: "Values that give SM0 > WM trigger startup warnings."
    - category: "soil_water"
      name: "SAC-SMA initial stores (UZTWC, UZFWC, LZTWC, LZFSC, LZFPC, ADIMC)"
      unit: "fraction of capacity (ADIMC: mm)"
      source_kind: "user_provided"
      model_input_format: "per-gauge scalars or saved state grids"
      notes: "Set before the grid multiplier is applied, so they use the ungridded capacities. The manual gives these in mm, but the code multiplies them by capacity, so mm values entered as the manual says give stores far above capacity with no error."
    - category: "routing_storage"
      name: "ISU (initial interflow reservoir)"
      unit: "mm/s-scaled store (same units as KW_IR; not a mm depth)"
      source_kind: "user_provided"
      model_input_format: "per-gauge scalar or saved KW state grid"
      notes: "Usually 0. Copied directly into the interflow store. Rate-scaled, not a depth: each step the code adds the water-balance rate (mm/s) to this store and releases a LEAK fraction of it per step as a rate, with no time-step conversion (KinematicRoute.cpp:246-250, 419; LinearRoute.cpp:78-99, 162-165). So ISU=10 with LEAKI=0.1 releases 1 mm/s in the first step (3600 mm over a 1-hour step), not 1 mm; the manual's 'initial value of the interflow reservoir' gives no unit."
    - category: "routing_storage"
      name: "ISO (initial overland reservoir, linear-reservoir routing)"
      unit: "mm/s-scaled store (same convention as ISU; not a mm depth)"
      source_kind: "user_provided"
      model_input_format: "per-gauge scalar"
      notes: "Linear-reservoir states are never saved or restored; only ISO/ISU start values exist."
    - category: "warm_start"
      name: "saved model state grids (soil stores, KW channel/overland/interflow states, Snow-17 states)"
      unit: "same as the matching states.variables entry (mm for soil and snow stores; mm/s-scaled for the KW interflow store IR; m3/s or m2/s for KW flow states; degC for Snow-17 ATI)"
      source_kind: "user_provided"
      model_input_format: "state rasters for the run start time"
      notes: "Read at the start time if present; otherwise scalar initial values are used. HyMOD and linear-reservoir states have no saved grids."
  boundary_conditions:
    - category: "method_switch"
      name: "water-balance model choice (CREST | SAC-SMA | HyMOD | HP)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "task model selector"
    - category: "method_switch"
      name: "routing model choice (kinematic wave | linear reservoir)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "task routing selector"
      notes: "With no routing model, discharge stays 0."
    - category: "method_switch"
      name: "snow module on/off (Snow-17)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "task snow selector"
    - category: "method_switch"
      name: "inundation module choice (none | simple | VC)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "task inundation selector"
    - category: "method_switch"
      name: "return-period mode (STYLE=SIMU_RP: track annual peaks and write LP3 statistic grids)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "task style selector"
      notes: "SIMU_RP writes the avgq/stdq/sc LP3 grids at the end of the run. Return-period values (gauge column, rp/maxrp grids) are written only when RP_AVGGRID, RP_STDGRID and RP_CSGRID are set and all three load; this works with any simulation style."
    - category: "method_switch"
      name: "data assimilation of observed gauge discharge on/off"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "per-gauge switch plus observed discharge series"
      notes: "Observed Q within 1 h of the step and > 0 overwrites KW routing states at the gauge cell. Has no effect with linear-reservoir routing."
    - category: "time_control"
      name: "TIMESTEP"
      unit: "time (y, m = month, d, h, u = minute, s)"
      source_kind: "user_provided"
      model_input_format: "control value, e.g. 1h or 5u"
      notes: "'m' means month, not minute."
    - category: "time_control"
      name: "simulation window (begin, warm-up end, end, state save time)"
      unit: "YYYYMMDDHHUU"
      source_kind: "user_provided"
      model_input_format: "control values"
      notes: "Outputs before warm-up end are spin-up."
    - category: "grid_control"
      name: "projection (geographic WGS84 | LAEA std parallel 45N, central meridian 100W)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "control value"
      notes: "Also sets latitude used by Hamon PET."
    - category: "grid_control"
      name: "DDM coding switch (ESRI vs TauDEM) and FAM self-count switch"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "control values"
    - category: "domain"
      name: "gauge network (gauge lon/lat or cell, optional basin area for snapping) and basin as a set of gauges"
      unit: "deg, km^2"
      source_kind: "user_provided"
      model_input_format: "gauge and basin control blocks"
      notes: "Parameters are set per independent gauge and copied to every cell draining to it; cells that drain to no gauge get no parameters. A task can name a default parameter gauge (DEFAULTPARAMSGAUGE) whose parameter set fills any gauge that has none, so a gauge without its own set is only skipped when no default is named."

processes:
  modules:
    - name: "FlowNetwork"
      role: "process_solver"
      brief: "Builds the D8 cell tree from DEM/DDM/FAM: slope (min 1 m drop), horizontal length, cell and contributing area, downstream link, channel flag (FAM > TH), gauge snapping and gauge-to-cell parameter assignment."
    - name: "HamonPET"
      role: "optional_module"
      brief: "Hamon PET from air temperature and cell latitude, mm/day converted to mm/h; PET = 0 at T <= 0 degC."
      applicability: "when PET forcing is declared as temperature"
    - name: "Snow17"
      role: "optional_module"
      brief: "NWS Snow-17 temperature-index snow: rain/snow split at 1 degC, seasonal melt factor between MFMIN and MFMAX, rain-on-snow melt, heat deficit, liquid water holding; outputs rain+melt and SWE."
      applicability: "when snow module on"
    - name: "CREST"
      role: "process_solver"
      brief: "Coupled Routing and Excess STorage water balance: impervious split (IM), variable infiltration curve (WM, B), ET demand = KE x PET with actual ET limited by available water (CRESTModel.cpp:251-260), Ksat (FC) split of excess into overland (fast) and interflow (slow); state soil moisture."
      applicability: "when water-balance model = CREST"
    - name: "SAC-SMA"
      role: "optional_module"
      brief: "Sacramento soil moisture accounting: upper/lower tension and free water zones, percolation (ZPERC, REXP), impervious and riparian areas; gives surface (fast) and ground (slow) runoff. An alternative to CREST, like HyMOD and HP."
      applicability: "when water-balance model = SAC-SMA"
    - name: "HyMOD"
      role: "optional_module"
      brief: "HyMOD conceptual water balance (probability-distributed upper-zone store, NQ quick reservoirs in series and one slow reservoir), run LUMPED once per gauge on gauge-averaged precipitation and PET; its own reservoirs replace routing, and Snow-17, inundation and grid outputs are skipped."
      applicability: "when water-balance model = HyMOD"
    - name: "HP"
      role: "optional_module"
      brief: "Hydrophobic pass-through: no soil store; precipitation split by SPLIT into fast and slow flow."
      applicability: "when water-balance model = HP"
    - name: "KinematicWaveRouting"
      role: "process_solver"
      brief: "Kinematic wave routing: Newton-solved hillslope flow (ALPHA0, beta fixed 0.6) and channel flow (storage A = ALPHA x Q^BETA), plus interflow linear reservoir (UNDER, LEAKI); produces cell discharge."
      applicability: "when routing = kinematic wave"
    - name: "LinearReservoirRouting"
      role: "optional_module"
      brief: "Dual linear reservoir routing (overland and interflow) with travel time from a Manning-like speed depth^0.66 x sqrt(slope) x COEM or RIVER; leaks LEAKO/LEAKI."
      applicability: "when routing = linear reservoir"
    - name: "SimpleInundation"
      role: "optional_module"
      brief: "Water depth from cell discharge through a power-law rating relation (ALPHA, BETA) minus cell height above the channel."
      applicability: "when inundation = simple"
    - name: "VCInundation"
      role: "optional_module"
      brief: "Volume-fill inundation: for each channel cell, Q x cell length is spread as a water volume over the channel cell and the hillslope cells draining to it, filled in order of elevation. ALPHA and BETA are read but not used for depth."
      applicability: "when inundation = VC"
    - name: "DataAssimilation"
      role: "optional_module"
      brief: "Inserts observed gauge discharge into KW routing states at gauge cells before routing and stops upstream inflow into that cell for the step."
      applicability: "when data assimilation on and routing = kinematic wave"
    - name: "ReturnPeriodLP3"
      role: "optional_module"
      brief: "In SIMU_RP style, tracks annual peak discharge and writes Log-Pearson Type III statistic grids (mean, std, skew of log10 peaks). When LP3 grids are given (RP_AVGGRID/RP_STDGRID/RP_CSGRID), converts discharge to return period."
      applicability: "when return-period mode on"
  internal_edges:
    - from: "Inputs"
      to: "FlowNetwork"
      kind: "consumes_input"
      brief: "DEM, DDM, FAM and gauge locations build the cell tree and gauge assignment"
    - from: "Climate"
      to: "HamonPET"
      kind: "consumes_input"
      brief: "air temperature per cell when PET is declared as temperature"
    - from: "FlowNetwork"
      to: "HamonPET"
      kind: "invokes"
      brief: "cell latitude from the grid projection"
    - from: "Climate"
      to: "Snow17"
      kind: "consumes_input"
      brief: "precipitation and air temperature per cell"
    - from: "FlowNetwork"
      to: "Snow17"
      kind: "invokes"
      brief: "DEM elevation for air pressure"
    - from: "Snow17"
      to: "SNOW17_WI"
      kind: "writes_state"
      brief: "ice water equivalent"
    - from: "Snow17"
      to: "SNOW17_WQ"
      kind: "writes_state"
      brief: "liquid water in pack"
    - from: "Snow17"
      to: "SNOW17_ATI"
      kind: "writes_state"
      brief: "antecedent temperature index"
    - from: "Snow17"
      to: "SNOW17_DEFICIT"
      kind: "writes_state"
      brief: "heat deficit"
    - from: "Snow17"
      to: "CREST"
      kind: "invokes"
      brief: "rain+melt (mm/h) replaces precipitation as water-balance input"
    - from: "Snow17"
      to: "SAC-SMA"
      kind: "invokes"
      brief: "rain+melt replaces precipitation as water-balance input"
    - from: "Snow17"
      to: "HP"
      kind: "invokes"
      brief: "rain+melt replaces precipitation"
    - from: "Climate"
      to: "CREST"
      kind: "consumes_input"
      brief: "precipitation (when snow off) and PET"
    - from: "HamonPET"
      to: "CREST"
      kind: "invokes"
      brief: "temperature-derived PET"
    - from: "HamonPET"
