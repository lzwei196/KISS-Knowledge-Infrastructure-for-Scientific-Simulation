[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ki_tools_common"
version = "0.1.0"
description = "Shared utility library for knowledge-dissection-toolkit ki/tools scripts"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
netcdf = [
    "xarray>=0.19",
    "netCDF4>=1.5",
]
geo = [
    "geopandas>=0.9",
    "shapely>=1.7",
]
all = [
    "xarray>=0.19",
    "netCDF4>=1.5",
    "geopandas>=0.9",
    "shapely>=1.7",
    "pandas>=1.3",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["ki_tools_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
