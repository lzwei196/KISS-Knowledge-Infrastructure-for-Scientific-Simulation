kiss_manifest_version: 1
model: HydroCNHS
binary_type: Python
verified: observed
install_dir: HydroCNHS

acquire:
  strategy: pip
  package: hydrocnhs
  produces: hydrocnhs

python_deps: [hydrocnhs]

reference_case: >-
  python -c "import hydrocnhs; print(hydrocnhs.__name__, 'importable')"

notes: >-
  OBSERVED 2026-08-18: `kiss init HydroCNHS` installed hydrocnhs 1.2.0 into a clean venv
  and the KI's own preflight_check.py passed with no hand-written recipe. The
  package name was resolved from the KI directory name and confirmed by import,
  not assumed from a PyPI name match.
