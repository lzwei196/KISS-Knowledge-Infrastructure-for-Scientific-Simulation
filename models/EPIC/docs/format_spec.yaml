# format_spec.yaml — Machine-readable model format specification
# Generated by KDT generate_format_spec.py
# Source: KISSPATH_KI_ROOT/EPIC/knowledge_infrastructure

model:
  name: EPIC (Environmental Policy Integrated Climate)
  domain: crop
  secondary_domains:
  - soil_carbon
  - water_balance
  - nutrient_leaching
  binary: epic1102-official_release.exe
  binary_path: KISSPATH_BINARIES/epic/epic1102-official_release.exe
  language: Fortran (compiled PE32 Windows console EXE; runs via wine on Linux)
  execution: WINEDEBUG=-all wine ./epic1102-official_release.exe
  notes: USDA-ARS field-scale crop-soil-water-nutrient model. Widely used for cropland N₂O / soil C inventory.
inputs:
  forcing:
  - name: precipitation
    unit: mm/day
    valid_range: null
    format: ''
    source: ki_yaml
    conversion_from_source: from kg m-2 s-1 (CMFD) × 86400.0
  - name: tmax
    unit: degC
    valid_range: null
    format: ''
    source: ki_yaml
    conversion_from_source: from K (CMFD) offset -273.15
  - name: tmin
    unit: degC
    valid_range: null
    format: ''
    source: ki_yaml
    conversion_from_source: from K (CMFD) offset -273.15
  - name: srad
    unit: MJ m-2 day-1
    valid_range: null
    format: ''
    source: ki_yaml
    conversion_from_source: from W m-2 (CMFD mean) × 0.0864
  - name: rh
    unit: fraction (0-1)
    valid_range: null
    format: ''
    source: ki_yaml
    conversion_from_source: from % × 0.01
  - name: wind
    unit: m s-1
    valid_range: null
    format: ''
    source: ki_yaml
    conversion_from_source: from m s-1 × 1.0
  - name: Radiation
    unit: MJ m-2 day-1
    format: ''
    source: skill_md
outputs:
  primary:
  - name: grain_yield
    canonical_id: yield
    file: <site>.ACY
    column: YLDG
    unit: t/ha
    valid_range: [0.0, 30.0]
    aggregation: annual; one row per year per crop
    notes: Primary crop yield output. Convert to kg/ha × 1000.
  - name: forage_yield
    canonical_id: yield
    file: <site>.ACY
    column: YLDF
    unit: t/ha
    valid_range: [0.0, 50.0]
  - name: total_biomass
    canonical_id: biomass
    file: <site>.ACY
    column: BIOM
    unit: t/ha
    valid_range: [0.0, 80.0]
  - name: harvest_index
    canonical_id: harvest_index
    file: <site>.ACY
    column: HI
    unit: fraction (0-1)
  - name: nitrogen_in_yield
    canonical_id: nitrogen_in_yield
    file: <site>.ACY
    column: YLN
    unit: kgN/ha
  - name: phosphorus_in_yield
    canonical_id: phosphorus_in_yield
    file: <site>.ACY
    column: YLP
    unit: kgP/ha
  - name: n2o_emission_annual
    canonical_id: n2o_emission
    file: <site>.ANN
    column: DN2O
    unit: kgN/ha/year
    valid_range: [0.0, 50.0]
    notes: Annual denitrification N2O. Sum across run years for total emission inventory.
  - name: total_runoff_annual
    canonical_id: runoff
    file: <site>.ANN
    column: Q
    unit: mm/year
    valid_range: [0.0, 2000.0]
  - name: evapotranspiration_annual
    canonical_id: evapotranspiration
    file: <site>.ANN
    column: ET
    unit: mm/year
    valid_range: [0.0, 2500.0]
  - name: drainage_annual
    canonical_id: drainage
    file: <site>.ANN
    column: DN
    unit: mm/year
  - name: irrigation_applied
    canonical_id: irrigation
    file: <site>.ANN
    column: IRGA
    unit: mm/year
  - name: water_balance_daily
    canonical_id: water_balance
    file: <site>.DWC
    unit: mm/day
    aggregation: daily water cycle components
  - name: cn_cycle_daily
    canonical_id: nitrogen_flux
    file: <site>.DCN
    unit: kgN/ha/day
    notes: Daily C and N cycle components — leaching, mineralization, immobilization
  - name: soil_organic_carbon
    canonical_id: soil_carbon
    file: <site>.ACN
    unit: kgC/ha
    valid_range: [0.0, 200000.0]
    aggregation: annual; topsoil + profile total
  - name: soil_layer_state
    canonical_id: soil_layer_properties
    file: <site>.ASL
    unit: various
    notes: Annual per-layer soil state (water content, organic C, nitrate, etc.)
known_issues:
- id: EPIC_001
  description: ''
  affected_output: 'A control or site file (SIT/SOL/OPC/DLY) was regenerated from

    scratch from a Python dict instead of copied from a template.

    EPIC uses rigid Fortran fixed-width formats — a single misplaced

    space break'
  detection: 'A control or site file (SIT/SOL/OPC/DLY) was regenerated from

    scratch from a Python dict instead of copied from a template.

    EPIC uses rigid Fortran fixed-width formats — a single misplaced

    space break'
  fix: 'Use the copy-first tools (build_site_file.py, build_soil_file.py,

    build_opc_file.py). Never write fixed-format Fortran files from

    Python dicts. If you have to patch a value, load the template

    text, mo'
- id: EPIC_002
  description: ''
  affected_output: 'Precipitation in the .DLY file was written in kg m-2 s-1 (CMFD

    raw unit) instead of mm/day.

    '
  detection: 'Precipitation in the .DLY file was written in kg m-2 s-1 (CMFD

    raw unit) instead of mm/day.

    '
  fix: 'Multiply CMFD prec by 86400 before writing to .DLY. The

    convert_forcing_to_epic.py tool does this automatically via

    ki_tools_common.load_forcing. Verify .ANN PRCP column is

    ~500-2000 mm/yr.

    '
- id: EPIC_003
  description: ''
  affected_output: 'Temperature in .DLY was written in Kelvin (~290) instead of

    degC (~17). PET is inflated.

    '
  detection: 'Temperature in .DLY was written in Kelvin (~290) instead of

    degC (~17). PET is inflated.

    '
  fix: 'Subtract 273.15 from CMFD tmax/tmin before writing. Verify mean

    Tmax on DLY lines reads 15-25C, not 280-300.

    '
- id: EPIC_004
  description: ''
  affected_output: 'Solar radiation in .DLY was written in W m-2 (CMFD daily mean

    ~180) instead of MJ m-2 day-1 (~15).

    '
  detection: 'Solar radiation in .DLY was written in W m-2 (CMFD daily mean

    ~180) instead of MJ m-2 day-1 (~15).

    '
  fix: 'Multiply W m-2 by 0.0864 = MJ m-2 day-1. The heuristic in

    convert_forcing_to_epic.py: if monthly mean > 60, assume W m-2

    and convert. Verify SRAD is 5-30 for temperate latitudes.

    '
- id: EPIC_005
  description: ''
  affected_output: 'The crop code in the .OPC plant line is wrong — the wrong row

    of CROPCOM.DAT was selected. Silent because EPIC happily grows

    any crop it finds.

    '
  detection: 'The crop code in the .OPC plant line is wrong — the wrong row

    of CROPCOM.DAT was selected. Silent because EPIC happily grows

    any crop it finds.

    '
  fix: 'Always look up crop codes with `select_crop.py --name <NAME>`

    before passing to build_opc_file.py. Cross-check the ACY CPNM

    column in the output — it echoes the crop name EPIC actually ran.

    '
- id: EPIC_006
  description: ''
  affected_output: 'EPIC reads input files by hard-coded filename from the current

    working directory. Running `wine epic.exe` from a different

    directory does not work.

    '
  detection: 'EPIC reads input files by hard-coded filename from the current

    working directory. Running `wine epic.exe` from a different

    directory does not work.

    '
  fix: "Run the binary from inside the workspace directory:\n  cd /path/to/workspace && wine ./epic1102-official_release.exe\n\
    run_epic.py does this automatically via cwd=workspace.\n"
- id: EPIC_007
  description: ''
  affected_output: '.OPC plant line used the wrong equipment code. Using a harvest

    code (292) in the plant row means the crop never gets seeded.

    '
  detection: '.OPC plant line used the wrong equipment code. Using a harvest

    code (292) in the plant row means the crop never gets seeded.

    '
  fix: 'Start from the shipped umstead.OPC template — it has verified

    equip codes (136 plant, 261 fert, 292 harvest, 451 kill).

    '
- id: EPIC_008
  description: ''
  affected_output: 'NBYR in EPICCONT.DAT row 1 col 1 exceeds the number of years

    available in the .DLY file. EPIC reads past EOF.

    '
  detection: 'NBYR in EPICCONT.DAT row 1 col 1 exceeds the number of years

    available in the .DLY file. EPIC reads past EOF.

    '
  fix: 'Ensure NBYR times 365 <= rows in .DLY. Set NBYR and IYR0 via

    build_control_files.py --nbyr and --iyr0.

    '
- id: EPIC_009
  description: ''
  affected_output: 'In the .OPC file, column 10-13 is the Julian day number and must

    match the month+day. Changing MM/DD but not JD causes mismatch.

    '
  detection: 'In the .OPC file, column 10-13 is the Julian day number and must

    match the month+day. Changing MM/DD but not JD causes mismatch.

    '
  fix: 'build_opc_file.py computes JD from (month, day) via datetime.

    Never set MM/DD and JD separately by hand.

    '
- id: EPIC_010
  description: ''
  affected_output: 'SCS curve number not set or soil bulk density overridden too low

    (<1.2 t/m3). EPIC uses CN from .SIT row 5 and soil props from .SOL.

    '
  detection: 'SCS curve number not set or soil bulk density overridden too low

    (<1.2 t/m3). EPIC uses CN from .SIT row 5 and soil props from .SOL.

    '
  fix: 'Use build_soil_file.py with HWSD-derived bulk density (usually

    1.35-1.55 t/m3). Verify .SIT row 5 has CN 75-85 for row crops.

    '
- id: EPIC_011
  description: ''
  affected_output: 'Wine is not installed or its prefix is corrupted. Fresh Linux

    VMs need `wine wineboot` once to initialize the prefix.

    '
  detection: 'Wine is not installed or its prefix is corrupted. Fresh Linux

    VMs need `wine wineboot` once to initialize the prefix.

    '
  fix: 'sudo apt install wine; wine wineboot; wine --version

    '
- id: EPIC_012
  description: ''
  affected_output: 'Irrigation silently does not happen: .ACY IRGA = 0.000 in every

    year and the .OUT MANAGEMENT DATA block reads DRYLAND AGRICULTURE. The IRR

    flag is NOT in EPICCONT.DAT at all (verified 2026-08-10 by sweeping every

    integer of row 2 through the binary) -- it is the first integer of the flag

    line at the end of <run>.SIT, and the automatic trigger is OPV3 on the .OPC

    planting row.

    '
  detection: 'grep -E "DRYLAND AGRICULTURE|IRRIGATION" <run>.OUT and read the .ACY

    IRGA column; a mangled EPICCONT.DAT row 2 (shifted flags, extra trailing

    columns) is the tell that the old EPICCONT-editing code ran.

    '
  fix: 'Use configure_irrigation.py, which sets .SIT IRR (I4 grid) and the .OPC

    OPV3 trigger via edit_opc.set_auto_trigger and no longer touches

    EPICCONT.DAT. See triplet EPIC_032 (supersedes EPIC_019 item 3).

    '
- id: EPIC_013
  description: ''
  affected_output: 'The .DLY file contains NaN or sentinel values (-99, 9999) that

    EPIC reads as zeros.

    '
  detection: 'The .DLY file contains NaN or sentinel values (-99, 9999) that

    EPIC reads as zeros.

    '
  fix: 'convert_forcing_to_epic.py validates inputs. Run the

    water_balance_check in parse_outputs.py and check the residual.

    '
- id: EPIC_014
  description: ''
  affected_output: 'PRNT1102.DAT output-variable selection block has all zeros for

    the output file class.

    '
  detection: 'PRNT1102.DAT output-variable selection block has all zeros for

    the output file class.

    '
  fix: 'Start from the shipped PRNT1102.DAT template — never blank it.

    '
- id: EPIC_015
  description: ''
  affected_output: 'EPICRUN.DAT run line has 7 integer columns after the run name:

    SIT WP1 WP5 WND SOL OPS DLY. If any index is wrong EPIC loads

    the wrong file silently.

    '
  detection: 'EPICRUN.DAT run line has 7 integer columns after the run name:

    SIT WP1 WP5 WND SOL OPS DLY. If any index is wrong EPIC loads

    the wrong file silently.

    '
  fix: 'Use build_control_files.py which appends new entries AND rewrites

    the run line with matching indexes.

    '
- id: EPIC_016
  description: ''
  affected_output: 'HWSD gives organic carbon as g/g. The .SOL format expects

    percent (0-100). Writing g/g gives 100x too little; multiplying

    twice gives 100x too much.

    '
  detection: 'HWSD gives organic carbon as g/g. The .SOL format expects

    percent (0-100). Writing g/g gives 100x too little; multiplying

    twice gives 100x too much.

    '
  fix: 'In build_soil_file.py, multiply g/g by 100 exactly once.

    Typical .SOL organic C values are 0.5-3.0 for ag soils.

    '
- id: EPIC_017
  description: ''
  affected_output: 'Spin-up too short; soil water pool hasn''t equilibrated.

    '
  detection: 'Spin-up too short; soil water pool hasn''t equilibrated.

    '
  fix: 'Run with at least 2 years of spinup. Discard first 2 years from

    metrics. Check .DWC daily file for soil water drift.

    '
unit_conversions:
- variable: precipitation
  source: kg m-2 s-1 (CMFD)
  target: mm/day
  factor: 86400.0
  operation: multiplicative
- variable: tmax
  source: K (CMFD)
  target: degC
  factor: -273.15
  operation: additive
- variable: tmin
  source: K (CMFD)
  target: degC
  factor: -273.15
  operation: additive
- variable: srad
  source: W m-2 (CMFD mean)
  target: MJ m-2 day-1
  factor: 0.0864
  operation: multiplicative
- variable: rh
  source: '%'
  target: fraction (0-1)
  factor: 0.01
  operation: multiplicative
- variable: wind
  source: m s-1
  target: m s-1
  factor: 1.0
  operation: multiplicative
