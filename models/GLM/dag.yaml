template_version: "3.5"

identity:
  model_id: "GLM"
  scientific_reference_version: "GLM 3.0 science (Hipsey et al. 2019, GMD 12:473-523); AED2 water-quality coupling"
  implementation:
    id: "glm-aed-333"
    version: "3.3.3"
    provenance: "C (core) with Fortran AED2 modules; AquaticEcoDynamics (UWA) General Lake Model + AED2 library, single compiled binary."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c"
  license: "GPL-3.0"
  repo_url: "https://github.com/AquaticEcoDynamics/glm-aed"

boundary:
  scope_in:
    - "1D vertical thermal stratification and mixing of a single lake/reservoir"
    - "lake water balance (inflows, outflows, rainfall, evaporation, seepage)"
    - "surface energy budget (shortwave, longwave, sensible, latent fluxes)"
    - "vertical density structure from temperature and salinity (UNESCO 1981 EOS)"
    - "snow-ice cover formation, growth, decay, and albedo feedback"
    - "light penetration via multi-band Beer-Lambert extinction"
    - "density-driven inflow insertion at neutral buoyancy depth; outflow/withdrawal at specified elevation"
    - "optional AED2 aquatic biogeochemistry (oxygen, nutrients, organic matter, silica, phytoplankton, zooplankton)"
  scope_out:
    - "lateral/horizontal variation within the water body (no horizontal resolution)"
    - "gridded or distributed basin hydrology"
    - "water-quality chemistry in the GLM core itself (handled only by the coupled AED2/FABM library)"
  spatial: "1-D column"
  temporal: "daily"
  closure: "both"
  notes: "Mass-balance closure applies to the lake water balance over the Lagrangian layers and to AED2 biogeochemical pools when enabled; energy-balance closure is the surface heat budget (net shortwave + net longwave + sensible + latent). Inflows/outflows are resolved at daily resolution while surface mass/heat fluxes may be computed daily or sub-daily; daily shortwave is internally disaggregated to an idealized diurnal cycle that conserves the daily total. Evaporation/precipitation act only on the surface layer and seepage only on the bottom layer."

inputs:
  forcing:
    - category: "meteorology"
      name: "ShortWave (incoming shortwave radiation)"
      unit: "W/m2"
      source_kind: "forcing"
      model_input_format: "met CSV column read per &meteorology; required for rad_mode 0-3"
      notes: "Must be clipped to >= 0; un-clipped night-time negatives after interpolation can drive NaN temperatures. Daily values internally disaggregated to an idealized diurnal cycle."
    - category: "meteorology"
      name: "LongWave (incoming longwave radiation)"
      unit: "W/m2"
      source_kind: "forcing"
      model_input_format: "met CSV column; consumed when lw_type=LW_IN / rad_mode=2"
      notes: "lw_type selects handling: LW_IN reads this column, LW_CC computes longwave from cloud cover. Mismatch double-counts longwave and warms summer surface by 3-5 degC."
    - category: "meteorology"
      name: "Clouds (cloud cover fraction)"
      unit: "fraction (0-1)"
      source_kind: "forcing"
      model_input_format: "met CSV column; required for rad_mode 0,1,4 / lw_type=LW_CC"
    - category: "meteorology"
      name: "AirTemp (air temperature at ~10 m)"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "met CSV column"
    - category: "meteorology"
      name: "RelHum (relative humidity at ~10 m)"
      unit: "% (0-100)"
      source_kind: "forcing"
      model_input_format: "met CSV column"
      notes: "Must be percent (0-100), NOT fraction (0-1); a fractional value is read literally (0.7 -> 0.7% RH) and produces runaway evaporation."
    - category: "meteorology"
      name: "WindSpeed (at ~10 m)"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "met CSV column"
      notes: "Outliers (>30 m/s) can destabilize the mixing solver and yield NaN temperatures."
    - category: "meteorology"
      name: "Rain (rainfall depth)"
      unit: "m/day"
      source_kind: "forcing"
      model_input_format: "met CSV column"
      notes: "Native unit is m/day, NOT mm/day; an mm/day value is 1000x too large and causes continuous overflow. Rain partitioned to snow below snow_threshold."
    - category: "meteorology"
      name: "Snow (snowfall depth)"
      unit: "m/day"
      source_kind: "forcing"
      model_input_format: "met CSV column; consumed when snow_sw / snowice active"
    - category: "boundary_inflow"
      name: "inflow FLOW (riverine inflow rate)"
      unit: "ML/day"
      source_kind: "forcing"
      model_input_format: "inflow CSV column (daily); one file per configured inflow"
      notes: "Inflow inserted at neutral-buoyancy depth set by its density relative to the column."
    - category: "boundary_inflow"
      name: "inflow TEMP (inflow water temperature)"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "inflow CSV column"
      notes: "Required; a missing/zero TEMP inserts 0 degC water forming an artificial cold density current that disrupts thermal structure."
    - category: "boundary_inflow"
      name: "inflow SALT (inflow salinity)"
      unit: "mg/L"
      source_kind: "forcing"
      model_input_format: "inflow CSV column"
      notes: "Must be 0 for freshwater lakes; non-zero salinity raises inflow density and inserts the inflow too deep."
    - category: "boundary_inflow"
      name: "inflow WQ constituents (AED2)"
      unit: "mmol/m3"
      source_kind: "forcing"
      model_input_format: "extra inflow CSV columns (NIT_nit, NIT_amm, PHS_frp, OGM_*, OXY_oxy, SIL_rsi, PHY_*) when AED2 enabled"
      notes: "Absent nutrient columns give zero external loading; AED2 phytoplankton then collapse to near-zero biomass."
    - category: "boundary_outflow"
      name: "outflow FLOW (withdrawal/release rate)"
      unit: "ML/day"
      source_kind: "forcing"
      model_input_format: "outflow CSV column (daily); one column per configured outlet; or internal natural overflow"
  parameters:
    - category: "light"
      name: "Kw (light extinction coefficient)"
      unit: "1/m"
      source_kind: "calibrated"
      model_input_format: "&light namelist"
      notes: "Controls thermocline depth and light penetration; Kw ~ 1.7/Secchi_depth_m. Too high (>3) suppresses stratification; too low (<0.1) gives unrealistic deep heating."
    - category: "mixing"
      name: "coef_wind_stir (wind stirring coefficient)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "&mixing namelist"
      notes: "Sets surface mixed-layer depth; too high prevents stratification in small sheltered lakes."
    - category: "mixing"
      name: "coef_mix_hyp (hypolimnetic/deep mixing coefficient)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "&mixing namelist"
    - category: "mixing"
      name: "coef_mix_conv (convective mixing coefficient)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "&mixing namelist"
    - category: "meteorology"
      name: "ce, ch, cd (bulk transfer coefficients for latent, sensible, momentum flux)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "&meteorology namelist"
    - category: "meteorology"
      name: "wind_factor, sw_factor, lw_factor, rain_factor, at_factor, rh_factor (forcing scaling factors)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "&meteorology namelist"
      notes: "Multiplicative scalings applied to met forcing variables; wind_factor and sw_factor are dominant temperature calibration levers."
    - category: "morphometry"
      name: "hypsographic curve H[] / A[] (depth-area, optionally volume)"
      unit: "m / m2"
      source_kind: "dataset_lookup"
      model_input_format: "&morphometry namelist (bsn_vals points)"
      notes: "H[] and A[] must be monotonically ascending bottom-to-top with A[0]~0 and crest_elev=max(H); >=10-15 points recommended for realistic volume."
    - category: "layer_control"
      name: "min_layer_thick / max_layer_thick (h_min / h_max)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "&glm_setup namelist"
      notes: "Bound the adaptive Lagrangian layer thickness; max_layer_thick too small triggers layer-merge errors/hangs."
    - category: "inflow_geometry"
      name: "strm_hf_angle, strmbd_slope, strmbd_drag, submerged"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "&inflow namelist (per inflow)"
    - category: "outflow_geometry"
      name: "outl_elevs, bsn_len_outl, bsn_wid_outl, seepage_rate"
      unit: "m / m / m / m/day"
      source_kind: "calibrated"
      model_input_format: "&outflow namelist"
    - category: "aed2"
      name: "R_growth (max phytoplankton growth rate)"
      unit: "1/day"
      source_kind: "calibrated"
      model_input_format: "aed2.nml (phytoplankton); AED2 enabled"
      notes: "Sets total phytoplankton biomass level."
    - category: "aed2"
      name: "I_S (light saturation)"
      unit: "W/m2"
      source_kind: "calibrated"
      model_input_format: "aed2.nml (phytoplankton); AED2 enabled"
    - category: "aed2"
      name: "w_p (phytoplankton sedimentation velocity)"
      unit: "m/day"
      source_kind: "calibrated"
      model_input_format: "aed2.nml (phytoplankton); AED2 enabled"
      notes: "Negative sinks, positive floats."
    - category: "aed2"
      name: "Fsed_frp (sediment P release / internal loading)"
      unit: "mmol/m2/day"
      source_kind: "calibrated"
      model_input_format: "aed2.nml (phosphorus); AED2 enabled"
    - category: "aed2"
      name: "Fsed_oxy (sediment oxygen demand)"
      unit: "mmol/m2/day"
      source_kind: "calibrated"
      model_input_format: "aed2.nml (oxygen); AED2 enabled"
  initial_conditions:
    - category: "profiles"
      name: "initial temperature/salinity depth profiles"
      unit: "degC / mg/L"
      source_kind: "user_provided"
      model_input_format: "&init_profiles namelist (depth-value pairs; initial layers equal thickness)"
      notes: "lake_depth must not exceed morphometry max depth (max(H)-min(H))."
    - category: "profiles"
      name: "initial AED2 WQ depth profiles"
      unit: "mmol/m3 (AED2 vars)"
      source_kind: "user_provided"
      model_input_format: "&init_profiles WQ entries; count must equal num_wq_vars * num_depths"
  boundary_conditions:
    - category: "control"
      name: "rad_mode (radiation mode selector)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "&meteorology namelist"
      notes: "Selects required shortwave/longwave/cloud combination; the supplied met columns must be consistent with it."
    - category: "control"
      name: "lw_type (longwave handling: LW_IN vs LW_CC)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "&meteorology namelist"
    - category: "control"
      name: "subdaily (sub-daily forcing switch)"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "&meteorology namelist"
      notes: "subdaily=.true. with 3-hourly forcing produces flat/unrealistic temperatures; use daily forcing with subdaily=.false. unless forcing is hourly."
    - category: "control"
      name: "timefmt + start/stop (simulation time configuration)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "&time namelist"
      notes: "timefmt=2 for datetime strings, timefmt=3 for integer seconds; mismatch crashes the namelist read."
    - category: "control"
      name: "dt_iceon_avg + min_ice_thickness (ice model enablement)"
      unit: "days / m"
      source_kind: "user_provided"
      model_input_format: "&snowice namelist"
      notes: "Both must be set to enable the ice model; otherwise ice is silently disabled and surface temperature floors near 0.002 degC. For deep reservoirs (>50 m) dt_iceon_avg <= 0.04."
    - category: "control"
      name: "outflow mode (natural overflow / constant / scheduled / balance)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "&outflow namelist"
    - category: "control"
      name: "num_inflows / num_outlets (inflow & outlet counts)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "&inflow / &outflow namelist"
      notes: "num_inflows must match the number of inflow files; a count of 0 with files listed silently ignores all inflow."
    - category: "control"
      name: "AED2 module activation list (&aed_models)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "aed2.nml"
      notes: "Phytoplankton requires oxygen, nitrogen, phosphorus and organic_matter modules (silica for diatoms) listed before it; missing dependencies crash at init."

processes:
  modules:
    - name: "ThermalStratification"
      role: "process_solver"
      brief: "1D vertical heat balance over adaptive Lagrangian layers producing the temperature profile; density per layer from T,S via UNESCO (1981) equation of state."
    - name: "VerticalMixing"
      role: "process_solver"
      brief: "Wind stirring, convective overturn, Kelvin-Helmholtz shear, and hypolimnetic deep mixing setting mixed-layer and thermocline depth (do_mixing/do_deep_mixing)."
    - name: "SurfaceHeatMassExchange"
      role: "process_solver"
      brief: "Surface energy budget (net shortwave + longwave + sensible + latent) and evaporation/rain mass flux at the top layer; back-modifies top-layer T/S (do_surface_thermodynamics)."
    - name: "AtmosStability"
      role: "process_solver"
      brief: "Atmospheric stability (Monin-Obukhov z/L) and layer wind-stress feeding momentum coupling into mixing (atmos_stability/calc_layer_stress)."
    - name: "WaterBalance"
      role: "integrator"
      brief: "Tracks lake volume/level from inflow, outflow, rain, evaporation and seepage; closes the mass balance each step (mb_add_inflows/mb_sub_outflows/close_balance)."
    - name: "InflowInsertion"
      role: "process_solver"
      brief: "Density-driven insertion of riverine inflow at neutral-buoyancy depth based on inflow T and salinity (do_inflows/find_layer_by_height)."
    - name: "OutflowWithdrawal"
      role: "process_solver"
      brief: "Outflow/withdrawal at specified elevation in natural-overflow, constant, scheduled or balance mode (do_outflows)."
    - name: "LayerStructure"
      role: "integrator"
      brief: "Adaptive Lagrangian layer merge/split bounded by min/max layer thickness; dynamically renumbers NumLayers between process calls (check_layer_thickness/check_layer_stability/average_layer)."
    - name: "SnowIce"
      role: "optional_module"
      brief: "Snow-ice formation, growth/decay and albedo feedback; gated by dt_iceon_avg and min_ice_thickness in &snowice, silently inactive if unset."
    - name: "LightPenetration"
      role: "process_solver"
      brief: "Multi-band Beer-Lambert extinction governed by Kw, distributing shortwave through the layers."
    - name: "AED2WaterQuality"
      role: "optional_module"
      applicability: "AED2 enabled"
      brief: "Aquatic biogeochemistry (oxygen, carbon, nitrogen, phosphorus, silica, organic matter, phytoplankton, zooplankton) stepped each subdaily timestep on hydrodynamically-derived zonal averages (aed2_do_glm)."
  internal_edges:
    - from: "Inputs"
      to: "SurfaceHeatMassExchange"
      kind: "consumes_input"
      brief: "Meteorological forcing (SW, LW, AirTemp, RelHum, WindSpeed, Rain, Snow) drives the surface flux calculation."
    - from: "SurfaceHeatMassExchange"
      to: "ThermalStratification"
      kind: "writes_state"
      brief: "Net surface heating/cooling and evaporative mass change applied to the top layer temperature/salinity."
    - from: "AtmosStability"
      to: "VerticalMixing"
      kind: "invokes"
      brief: "Wind stress and z/L stability set the available mixing energy."
    - from: "LightPenetration"
      to: "ThermalStratification"
      kind: "writes_state"
      brief: "Beer-Lambert shortwave absorption profile heats subsurface layers."
    - from: "VerticalMixing"
      to: "ThermalStratification"
      kind: "writes_state"
      brief: "Mixing redistributes heat/salt, setting mixed-layer and thermocline depth."
    - from: "ThermalStratification"
      to: "VerticalMixing"
      kind: "reads_state"
      brief: "Density gradients from the temperature profile determine mixing stability."
    - from: "VerticalMixing"
      to: "LayerStructure"
      kind: "invokes"
      brief: "Mixing triggers layer merge/split and renumbering of the Lagrangian column."
    - from: "InflowInsertion"
      to: "WaterBalance"
      kind: "writes_state"
      brief: "Inflow volume added to the lake water balance."
    - from: "OutflowWithdrawal"
      to: "WaterBalance"
      kind: "writes_state"
      brief: "Outflow/withdrawal volume removed from the lake water balance."
    - from: "SurfaceHeatMassExchange"
      to: "WaterBalance"
      kind: "writes_state"
      brief: "Evaporation and rainfall mass fluxes adjust lake volume."
    - from: "InflowInsertion"
      to: "ThermalStratification"
      kind: "writes_state"
      brief: "Inflow inserted at neutral buoyancy depth modifies the layer T/S structure."
    - from: "ThermalStratification"
      to: "InflowInsertion"
      kind: "reads_state"
      brief: "Layer density profile sets the neutral-buoyancy insertion depth."
    - from: "SurfaceHeatMassExchange"
      to: "SnowIce"
      kind: "invokes"
      brief: "Surface cooling below freezing drives snow-ice formation when the ice model is enabled."
    - from: "SnowIce"
      to: "SurfaceHeatMassExchange"
      kind: "reads_state"
      brief: "Ice/snow cover and albedo feed back on surface energy exchange."
    - from: "ThermalStratification"
      to: "AED2WaterQuality"
      kind: "reads_state"
      brief: "Layer temperature and zonal averages drive biogeochemical reaction rates."
    - from: "LightPenetration"
      to: "AED2WaterQuality"
      kind: "reads_state"
      brief: "Per-layer light availability drives phytoplankton growth."
    - from: "AED2WaterQuality"
      to: "LightPenetration"
      kind: "writes_state"
      brief: "Phytoplankton/organic matter contribute to light extinction (feedback)."
    - from: "ThermalStratification"
      to: "Outputs"
      kind: "produces_output"
      brief: "Temperature/salinity/density profiles written to output.nc and lake.csv."
    - from: "WaterBalance"
      to: "Outputs"
      kind: "produces_output"
      brief: "Lake level, volume, inflow/outflow/overflow/evaporation volumes written to lake.csv."
    - from: "AED2WaterQuality"
      to: "Outputs"
      kind: "produces_output"
      brief: "Biogeochemical concentrations written to output.nc / WQ_n.csv when AED2 enabled."

states:
  variables:
    - name: "layer temperature"
      unit: "degC"
      role: "prognostic"
    - name: "layer salinity"
      unit: "mg/L"
      role: "prognostic"
    - name: "layer density (rho)"
      unit: "kg/m3"
      role: "diagnostic"
    - name: "layer thickness / Lagrangian layer structure (NumLayers)"
      unit: "m"
      role: "prognostic"
    - name: "lake volume"
      unit: "m3"
      role: "prognostic"
    - name: "lake level / water surface elevation"
      unit: "m"
      role: "prognostic"
    - name: "blue ice thickness"
      unit: "m"
      role: "prognostic"
    - name: "white ice thickness"
      unit: "m"
      role: "prognostic"
    - name: "snow thickness"
      unit: "m"
      role: "prognostic"
    - name: "snow density / albedo"
      unit: "kg/m3 / -"
      role: "diagnostic"
    - name: "layer light / extinction coefficient"
      unit: "W/m2 / 1/m"
      role: "diagnostic"
    - name: "water-balance accumulators (tot_inflow_vol, tot_outflow_vol, overflow_vol, evap_mass_flux)"
      unit: "m3 / kg/m2"
      role: "accumulator"
    - name: "AED2 per-layer biogeochemical concentrations (oxygen, carbon, N, P, silica, organic matter, phytoplankton, zooplankton)"
      unit: "mmol/m3"
      role: "prognostic"
  provenance: "structural"

outputs:
  - var: "temp"
    validation_rank: 2
    unit: "degC"
    description: "Water temperature per Lagrangian layer (depth x time profile)."
    emitted_in: "output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Compare at matched depths; Lagrangian layers shift between outputs so interpolate to fixed observation depths."
            - "Documented warm bias (~3-5 degC summer surface) driven by longwave handling."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "The 'spatial' axis here is the vertical depth-time temperature field, not a horizontal grid."
      detrending_options: ["none"]
  - var: "surface_temp"
    validation_rank: 3
    unit: "degC"
    description: "Surface (mixed-layer) water temperature."
    emitted_in: "lake.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Satellite LSWT is a skin temperature; bulk surface-layer temperature differs slightly."
      detrending_options: ["none"]
  - var: "bottom_temp"
    validation_rank: 4
    unit: "degC"
    description: "Bottom (hypolimnetic) water temperature."
    emitted_in: "lake.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "lake_level"
    validation_rank: 1
    unit: "m"
    description: "Water surface elevation."
    emitted_in: "lake.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Sensitive to the water-balance closure; check inflow/outflow gauging and seepage."
      detrending_options: ["none", "linear_residual"]
  - var: "lake_volume"
    validation_rank: 5
    unit: "m3"
    description: "Total lake/reservoir storage volume."
    emitted_in: "lake.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Storage usually derived from observed level via the same hypsographic curve."
      detrending_options: ["none"]
  - var: "ice_thickness"
    validation_rank: 6
    unit: "m"
    description: "Combined blue/white ice (and snow) cover thickness and duration."
    emitted_in: "output.nc / lake.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Requires dt_iceon_avg/min_ice_thickness set or ice is silently zero; ice days tend to be underestimated."
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "csi"
          caveats:
            - "Ice-on/ice-off as event dates; evaluate freeze/thaw DOY timing."
      detrending_options: ["none"]
  - var: "evaporation"
    validation_rank: 7
    unit: "ML/day"
    description: "Daily lake evaporative mass flux."
    emitted_in: "lake.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Direct evaporation observations are rare; often inferred from energy-balance or water-balance residual."
      detrending_options: ["none"]
  - var: "thermocline_depth"
    validation_rank: 8
    unit: "m"
    description: "Depth of the thermocline (derived when stratified)."
    emitted_in: "derived"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Derived from the profile via a consistent definition (e.g., max density gradient) for both model and obs."
      detrending_options: ["none"]
  - var: "schmidt_stability"
    validation_rank: 9
    unit: "J/m2"
    description: "Schmidt stability of the water column (derived stratification strength)."
    emitted_in: "derived"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Computed from the temperature profile and hypsography; use the same algorithm (e.g., LakeAnalyzer) for model and obs."
      detrending_options: ["none"]
  - var: "PHY_tchla"
    validation_rank: 10
    unit: "ug/L"
    description: "Total chlorophyll-a (AED2 phytoplankton)."
    emitted_in: "output.nc (AED2 enabled)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Requires nutrient inflow loading or biomass collapses to near-zero; chlorophyll is highly parameter-sensitive."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Trophic-state comparison (e.g., seasonal mean chlorophyll) rather than instantaneous match."
      detrending_options: ["none"]
  - var: "OXY_oxy"
    validation_rank: 11
    unit: "mmol O2/m3"
    description: "Dissolved oxygen concentration (AED2)."
    emitted_in: "output.nc (AED2 enabled)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Hypolimnetic DO depletion strongly controlled by Fsed_oxy sediment demand."
      detrending_options: ["none"]
  - var: "NIT_nit, NIT_amm, PHS_frp"
    validation_rank: 12
    unit: "mmol/m3"
    description: "Dissolved nutrient species: nitrate, ammonium, filterable reactive phosphorus (AED2)."
    emitted_in: "output.nc (AED2 enabled)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Depends on inflow nutrient loading and Fsed_frp internal loading."
      detrending_options: ["none"]

influence:
  edges:
    - from: "Cd (wind drag coefficient)"
      to: "thermocline_depth"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["bruce2018_glm_multilake_sensitivity"]
    - from: "Cd (wind drag coefficient)"
      to: "schmidt_stability"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["bruce2018_glm_multilake_sensitivity"]
    - from: "Ce (evaporative/sensible heat coefficient)"
      to: "schmidt_stability"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      citations: ["bruce2018_glm_multilake_sensitivity"]
    - from: "Ce (evaporative/sensible heat coefficient)"
      to: "bottom_temp"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "hypolimnion"
      citations: ["bruce2018_glm_multilake_sensitivity"]
    - from: "Ce (evaporative/sensible heat coefficient)"
      to: "surface_temp"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "epilimnion"
      citations: ["bruce2018_glm_multilake_sensitivity", "bueche2020_glmgui_sensitivity"]
    - from: "ch (sensible/latent heat coefficient)"
      to: "lake_level"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      citations: ["bueche2020_glmgui_sensitivity"]
    - from: "wind_factor (wind speed scaling factor)"
      to: "temp"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["bueche2020_glmgui_sensitivity", "feldbauer2025_glm_calibration_sensitivity", "guo2021_1dlake_validation_sensitivity"]
    - from: "sw_factor (shortwave radiation scaling factor)"
      to: "temp"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      citations: ["feldbauer2025_glm_calibration_sensitivity"]
    - from: "Kw (light extinction coefficient)"
      to: "thermocline_depth"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      citations: ["guo2021_1dlake_validation_sensitivity"]
    - from: "Kw (light extinction coefficient)"
      to: "temp"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      citations: ["bueche2020_glmgui_sensitivity", "feldbauer2025_glm_calibration_sensitivity", "guo2021_1dlake_validation_sensitivity"]
    - from: "coef_mix_hyp (hypolimnetic mixing coefficient)"
      to: "temp"
      sensitivity_grade: LOW
      basis: literature_quantitative
      lever_type: parameter
      citations: ["feldbauer2025_glm_calibration_sensitivity"]
    - from: "physical mixing parameters (Cc, Cw, Cs, Ct, CKH)"
      to: "temp"
      sensitivity_grade: LOW
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full-profile, simulation-averaged"
      citations: ["bruce2018_glm_multilake_sensitivity"]
  citation_index:
    bruce2018_glm_multilake_sensitivity:
      short_citation: "Bruce et al. 2018"
      doi: "10.1016/j.envsoft.2017.11.016"
      note: "GLM applied to 32 lakes; SA of nine surface-heat/mixing parameters; thermocline depth and Schmidt stability most sensitive to Cd (wind drag), secondary to Ce."
    bueche2020_glmgui_sensitivity:
      short_citation: "Bueche et al. 2020"
      doi: "10.5194/gmd-13-565-2020"
      note: "glmGUI Morris-style SA; Ammersee water temperature most sensitive to ce, wind_factor, k_w, Cd; Baratz lake-level to ce (SI=0.334) and ch (SI=0.234)."
    feldbauer2025_glm_calibration_sensitivity:
      short_citation: "Feldbauer et al. 2025"
      doi: "10.5194/hess-29-1183-2025"
      note: "Large-scale multi-lake calibration; wind-speed and shortwave scaling factors dominant (>75% of total sensitivity), Kw moderate, coef_mix_hyp minor."
    guo2021_1dlake_validation_sensitivity:
      short_citation: "Guo et al. 2021"
      doi: "10.1029/2020JD033417"
      note: "Global 1-D lake-model validation/SA; water temperature most controlled by light extinction and wind/heat-flux scaling factors."
    hipsey2019_glm30_model_description:
      short_citation: "Hipsey et al. 2019"
      doi: "10.5194/gmd-12-473-2019"
      note: "GLM 3.0 model description; defines the surface-heat, wind, mixing and light-extinction parameters perturbed by the SA studies above."

safety:
  hazards:
    - id: "rain_units_mm_vs_m_per_day"
      kind: "weather_file_semantic"
      description: "Rain authored in mm/day instead of the required m/day is read 1000x too large, causing continuous overflow and runaway lake volume."
      severity: "silent"
      triplet_id: "dt_001"
    - id: "relhum_fraction_vs_percent"
      kind: "weather_file_semantic"
      description: "RelHum supplied as fraction (0-1) instead of percent (0-100) is read literally (0.7 -> 0.7% RH), driving extreme evaporation and lake dry-up."
      severity: "silent"
      triplet_id: "dt_002"
    - id: "shortwave_negative_after_interp"
      kind: "weather_file_semantic"
      description: "Un-clipped night-time shortwave going negative after temporal interpolation can produce NaN temperatures."
      severity: "fatal_or_silent"
      triplet_id: "dt_003"
    - id: "longwave_double_count_lw_type"
      kind: "weather_file_semantic"
      description: "lw_type inconsistent with the forcing (LW_IN with cloud-derived data, or vice versa) double-counts longwave and warms summer surface temperature by 3-5 degC."
      severity: "degraded"
      triplet_id: "dt_020"
    - id: "inflow_temp_missing_cold_current"
      kind: "control_semantic"
      description: "Missing/zero inflow TEMP column inserts 0 degC water, forming an artificial cold density current that disrupts thermal structure."
      severity: "degraded"
      triplet_id: "dt_004"
    - id: "inflow_salinity_nonzero_freshwater"
      kind: "control_semantic"
      description: "Non-zero inflow salinity in a freshwater lake raises inflow density and inserts it too deep, distorting the thermal/density structure."
      severity: "silent"
      triplet_id: "dt_022"
    - id: "ice_model_silently_disabled"
      kind: "control_semantic"
      description: "Missing dt_iceon_avg/min_ice_thickness in &snowice silently disables the ice model; surface temperature floors near 0.002 degC and never freezes despite sub-zero air temperature."
      severity: "silent"
      triplet_id: "dt_023/dt_027"
    - id: "morphometry_non_monotonic"
      kind: "soil_semantic"
      description: "Non-monotonic H[]/A[] hypsographic arrays prevent building the Lagrangian layer structure and crash at startup."
      severity: "fatal"
      triplet_id: "dt_006"
    - id: "bsn_vals_length_mismatch"
      kind: "control_semantic"
      description: "bsn_vals not equal to len(H)=len(A) crashes GLM at startup."
      severity: "fatal"
      triplet_id: "dt_008"
    - id: "lake_depth_exceeds_morphometry"
      kind: "initial_condition_semantic"
      description: "init_profiles lake_depth exceeding the morphometry max depth (max(H)-min(H)) cannot form the initial layer structure and crashes."
      severity: "fatal"
      triplet_id: "dt_009"
    - id: "namelist_double_quotes"
      kind: "parser_semantic"
      description: "Double-quoted strings in the Fortran namelist cause a parse error and startup crash; strings must be single-quoted."
      severity: "fatal"
      triplet_id: "dt_005"
    - id: "timefmt_format_mismatch"
      kind: "parser_semantic"
      description: "timefmt=3 (integer seconds) with datetime-string start/stop (or vice versa) crashes the namelist read."
      severity: "fatal"
      triplet_id: "dt_025"
    - id: "max_layer_thick_too_small"
      kind: "numerical_instability"
      description: "max_layer_thick too small relative to lake depth triggers excessive layer split/merge, causing a layer-merge error or apparent hang."
      severity: "fatal"
      triplet_id: "dt_015"
    - id: "forcing_outliers_nan"
      kind: "numerical_instability"
      description: "Outlier forcing (e.g., wind >30 m/s) destabilizes the mixing solver and produces NaN temperatures mid-run."
      severity: "fatal"
      triplet_id: "dt_013"
    - id: "num_inflows_zero_silent_ignore"
      kind: "control_semantic"
      description: "num_inflows=0 with inflow files listed silently runs the lake with no riverine input."
      severity: "silent"
      triplet_id: "dt_010"
    - id: "subdaily_3hourly_flat_temp"
      kind: "weather_file_semantic"
      description: "subdaily=.true. with 3-hourly forcing mis-interpolates against the internal dt and flattens temperature (no seasonal cycle); use daily forcing with subdaily=.false. unless forcing is hourly."
      severity: "silent"
      triplet_id: "dt_026"
    - id: "aed2_phyto_missing_dependencies"
      kind: "control_semantic"
      description: "AED2 phytoplankton enabled without oxygen/nitrogen/phosphorus/organic_matter (silica for diatoms) preceding it crashes at module init."
      severity: "fatal"
      triplet_id: "dt_028"
    - id: "aed2_zero_nutrient_loading"
      kind: "control_semantic"
      description: "Inflow CSV lacking nutrient columns gives AED2 zero external loading; phytoplankton biomass collapses to near-zero after the initial pool is consumed."
      severity: "silent"
      triplet_id: "dt_029"
    - id: "aed2_wq_init_count_mismatch"
      kind: "initial_condition_semantic"
      description: "wq_init_vals count not equal to num_wq_vars * num_depths, or wq_names not matching exact AED2 variable names, crashes GLM-AED2 at startup."
      severity: "fatal"
      triplet_id: "dt_030"
  validation_limits:
    - "1D vertical only: assumes no horizontal variability; shallow/well-mixed lakes, ponds and wetlands supported only with caution and checks."
    - "Inflow/outflow resolved at daily resolution; sub-daily flow dynamics cannot be represented."
    - "Best suited to seasonal-to-decadal investigations of deep stratified systems."
    - "Water-quality chemistry is not in the GLM core; quantitative biogeochemistry requires the coupled AED2 library and adequate nutrient forcing."
  warnings:
    - "Documented production validation on a 10-year reservoir showed the correct seasonal thermal cycle but a residual warm bias (~3-5 degC annual mean) from summer surface overestimation, and underestimated ice days."
    - "Kw too high (>3 1/m) absorbs all solar near the surface and silently suppresses deep stratification."
    - "wind_factor/coef_wind_stir too high for a small sheltered lake mixes surface heat down faster than solar heating maintains the gradient, preventing stratification."
    - "nsave set too large (e.g., weekly) misses layer dynamics and produces stripy artifacts in temperature heatmaps."
  assumptions:
    - statement: "The model is a 1-D vertical column; lake properties are homogeneous across each layer with no horizontal resolution."
      scope: "geometry of all simulations"
      source: "GLM v2.0-beta manual (AED Report #26), Background/Layer-structure, p.5-7"
      status: "adopted"
    - statement: "Mass-balance closure holds for the lake water balance and AED2 pools; energy-balance closure is the surface heat budget (net SW + LW + sensible + latent), with daily shortwave disaggregated to an idealized diurnal cycle that conserves the daily total."
      scope: "water/energy/biogeochemical conservation"
      source: "GLM v2.0-beta manual, Water balance / Surface energy budget / Meteorology Table 3, p.7-8, 24"
      status: "adopted"
    - statement: "Layer density is computed from temperature and salinity via the UNESCO (1981) equation of state."
      scope: "density / stratification physics"
      source: "GLM v2.0-beta manual, Layer structure, p.7"
      status: "adopted"
    - statement: "Inflow and outflow are computed at daily resolution while surface mass/heat fluxes may be daily or sub-daily."
      scope: "temporal resolution of boundary fluxes"
      source: "GLM v2.0-beta manual, Inflows/Outflows setup, p.26-27"
      status: "adopted"
    - statement: "Native inflow salinity input is in mg/L and native flow in ML/day per the GLM manual; the v3.3.3 binary inflow/outflow CSV columns follow these native units."
      scope: "inflow/outflow input units"
      source: "GLM v2.0-beta manual, inflow/outflow tables (Table 4-5), p.26-27"
      status: "tentative"
