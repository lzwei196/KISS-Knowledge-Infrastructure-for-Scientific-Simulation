    - {from: "surface_runoff_option (OPT_RUN / runoff-groundwater scheme)", to: "SFCRUNOFF + UDRUNOFF (total runoff)", sensitivity_grade: HIGH, basis: literature_quantitative, lever_type: structural, citations: ["gan2019_noahmp_physics_uncertainty"]}
    - {from: "surface_drag_option (OPT_SFC / surface-exchange scheme)", to: "HFX", sensitivity_grade: HIGH, basis: literature_quantitative, lever_type: structural, citations: ["gan2019_noahmp_physics_uncertainty", "li2022_noahmp_global_scheme_eval"]}
