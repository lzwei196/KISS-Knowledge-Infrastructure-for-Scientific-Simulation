    '
  severity: critical
- id: dt_quincy_018
  symptom: 'Activation energies for Vcmax and Jmax appear to have no effect on temperature response. GPP
    does not increase with warming as expected, or the temperature optimum is shifted.

    '
  diagnosis: Activation energies (ea_vcmax, ea_jmax, ea_rd) were specified in kJ/mol instead of J/mol.
    QUINCY expects J/mol (e.g., ea_vcmax = 65330 J/mol). If the value is entered as 65.33 kJ/mol, the
    Arrhenius exponent is 1000x too small, flattening the temperature response curve so that enzyme rates
    barely cha
  remedy: 'Ensure all activation energies are in J/mol: ea_vcmax = 65330, ea_jmax = 43540, ea_rd = 46390.
    If source literature provides kJ/mol, multiply by 1000. Verify that Vcmax approximately doubles for
    a 10 deg C increase near 25 deg C.

    '
  severity: major
- id: dt_quincy_019
  symptom: 'run_quincy.py fails with an ImportError or ModuleNotFoundError for numpy, pandas, or scipy.

    '
  diagnosis: The Python environment does not have the required dependencies installed. The QUINCY analytic
    reimplementation requires numpy (array math, exp, log), pandas (CSV I/O, timeseries), and optionally
    scipy (for optimization/calibration). This commonly occurs in fresh environments or when running inside
    a
  remedy: 'Install dependencies: pip install numpy pandas scipy. Or install the full package: pip install
