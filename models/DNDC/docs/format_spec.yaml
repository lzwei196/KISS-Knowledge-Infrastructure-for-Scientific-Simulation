model:
  name: DNDC (DNDCv.CAN)
  domain: biogeochemistry
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: Precipitation
    unit: '**cm**'
    format: ''
    source: skill_md
  - name: Radiation
    unit: Solar radiation
    format: ''
    source: skill_md
  - name: Wind
    unit: Wind speed
    format: ''
    source: skill_md
  - name: Humidity
    unit: Relative humidity
    format: ''
    source: skill_md
  - name: Temperature
    unit: deg C
    format: ''
    source: skill_md
outputs:
  primary:
  - name: SOC
    unit: kgC/kg soil
    format: ''
    source: skill_md
  - name: Temperature
    unit: deg C
    format: ''
    source: skill_md
  - name: Evapotranspiration
    unit: cm
    format: ''
    source: skill_md
  - name: Biomass
    unit: unknown
    format: ''
    source: skill_md
  - name: Yield
    unit: unknown
    format: ''
    source: skill_md
known_issues:
- id: dt_001
  description: 'Simulated crop yield is near zero or the model reports permanent drought
    stress even though precipitation inputs look reasonable in the source data.

    '
  affected_output: 'Precipitation values were supplied in mm (the standard for most
    reanalysis and station data) but DNDC expects precipitation in cm.  A 50 mm rain
    event is read as 50 cm, which is physically impossible '
  detection: 'Precipitation values were supplied in mm (the standard for most reanalysis
    and station data) but DNDC expects precipitation in cm.  A 50 mm rain event is
    read as 50 cm, which is physically impossible '
  fix: 'Divide all precipitation values by 10 (mm -> cm) before writing the DNDC climate
    input file.  Add an assertion: max daily precip should rarely exceed 30 cm.  Use
    the convert_forcing_to_dndc tool with '
- id: dt_002
  description: 'Crop growth is drastically reduced or photosynthesis is near zero
    despite realistic temperature and precipitation.  Alternatively, the model produces
    unreasonably high biomass if radiation is too large.

    '
  affected_output: Solar radiation was provided in W/m2 (instantaneous flux) instead
    of MJ/m2/day (daily integral).  DNDC expects MJ/m2/day.  Typical clear-sky W/m2
    values (200-400) are an order of magnitude larger than
  detection: Solar radiation was provided in W/m2 (instantaneous flux) instead of
    MJ/m2/day (daily integral).  DNDC expects MJ/m2/day.  Typical clear-sky W/m2 values
    (200-400) are an order of magnitude larger than
  fix: 'Convert W/m2 to MJ/m2/day by multiplying by 0.0864 (= 86400 s/day / 1e6 J/MJ).  Validate
    that resulting values fall within 0-35 MJ/m2/day.

    '
- id: dt_003
  description: 'Model crashes immediately on first time step or produces temperatures
    above 200 degrees in log output.

    '
  affected_output: 'Temperature was supplied in Kelvin (e.g., 293 K) instead of degrees
    Celsius.  DNDC expects degrees Celsius for both Tmax and Tmin.

    '
  detection: 'Temperature was supplied in Kelvin (e.g., 293 K) instead of degrees
    Celsius.  DNDC expects degrees Celsius for both Tmax and Tmin.

    '
  fix: 'Subtract 273.15 from all temperature values before writing the climate file.  Assert
    that Tmin < Tmax and both fall within [-60, 60] C.

    '
- id: dt_004
  description: 'Soil organic carbon decomposition rates are unrealistically high or
    the model reports SOC values orders of magnitude above literature ranges. Simulated
    N2O emissions may be 100x expected.

    '
  affected_output: 'SOC was entered as a percentage (e.g., 2.5 meaning 2.5%) instead
    of kgC/kg (e.g., 0.025).  DNDC expects SOC as a mass fraction (kgC/kg).

    '
  detection: 'SOC was entered as a percentage (e.g., 2.5 meaning 2.5%) instead of
    kgC/kg (e.g., 0.025).  DNDC expects SOC as a mass fraction (kgC/kg).

    '
  fix: 'Divide SOC percentage values by 100 to convert to kgC/kg.  Validate that SOC
    values fall within 0.001-0.30 kgC/kg for mineral soils.

    '
- id: dt_005
  description: 'Drainage is extremely slow or extremely fast compared to expectations;
    water table dynamics are unrealistic despite correct water table depth settings.

    '
  affected_output: 'Hydraulic conductivity was entered in cm/min (a common lab reporting
    unit) instead of m/hr as DNDC expects.  cm/min and m/hr differ by a factor of
    0.6 (1 cm/min = 0.6 m/hr).

    '
  detection: 'Hydraulic conductivity was entered in cm/min (a common lab reporting
    unit) instead of m/hr as DNDC expects.  cm/min and m/hr differ by a factor of
    0.6 (1 cm/min = 0.6 m/hr).

    '
  fix: 'Convert hydraulic conductivity from cm/min to m/hr by multiplying by 0.6.
    Typical Ksat for loam: 0.01-0.1 m/hr; for sand: 0.5-1.0 m/hr.

    '
- id: dt_006
  description: 'Field capacity and wilting point behave unexpectedly; the model simulates
    either waterlogged or bone-dry conditions that contradict the input values.

    '
  affected_output: Field capacity and wilting point were entered as volumetric water
    content (e.g., 0.33 m3/m3) but DNDC expects water-filled pore space (WFPS) fractions
    (e.g., FC at WFPS = 0.66 for porosity 0.50).  WFP
  detection: Field capacity and wilting point were entered as volumetric water content
    (e.g., 0.33 m3/m3) but DNDC expects water-filled pore space (WFPS) fractions (e.g.,
    FC at WFPS = 0.66 for porosity 0.50).  WFP
  fix: 'Divide volumetric water content by soil porosity to obtain WFPS. FC_wfps =
    FC_vol / porosity.  WP_wfps = WP_vol / porosity.  Validate that 0 < WP_wfps <
    FC_wfps < 1.0.

    '
- id: dt_007
  description: 'Fertilizer effect on crop yield is far too strong or too weak.  Simulated
    N surplus is unrealistic.

    '
  affected_output: Fertilizer amount was entered as total product mass (e.g., kgUrea/ha)
    instead of kgN/ha for each individual N form.  DNDC expects the elemental nitrogen
    mass per hectare for each fertilizer applicatio
  detection: Fertilizer amount was entered as total product mass (e.g., kgUrea/ha)
    instead of kgN/ha for each individual N form.  DNDC expects the elemental nitrogen
    mass per hectare for each fertilizer applicatio
  fix: 'Convert fertilizer mass to elemental N: for urea multiply by 0.467 (46.7%
    N), for ammonium nitrate multiply by 0.340.  Enter each form separately in kgN/ha.

    '
- id: dt_008
  description: 'Reported yield is approximately half of expected values when compared
    to field observations or census data in dry-matter terms.

    '
  affected_output: DNDC reports grain yield in kgC/ha (carbon mass).  Users compare
    this directly to dry matter yield without applying the carbon-to-dry-matter conversion
    factor.  Dry matter is approximately 2x the carb
  detection: DNDC reports grain yield in kgC/ha (carbon mass).  Users compare this
    directly to dry matter yield without applying the carbon-to-dry-matter conversion
    factor.  Dry matter is approximately 2x the carb
  fix: 'Multiply DNDC output yield (kgC/ha) by 2.22 (= 1/0.45) for a more precise
    dry-matter estimate, or by 2.0 as a common approximation. Document which conversion
    factor is used.

    '
- id: dt_009
  description: 'Model crashes or produces a soil-profile error message during initialization.  Log
    may reference "layer depth" or "profile depth".

    '
  affected_output: 'The soil profile layers do not sum to exactly 2 m total depth.  DNDC
    requires the complete soil column to be 2 m (200 cm) and will reject or crash
    if layers sum to a different depth.

    '
  detection: 'The soil profile layers do not sum to exactly 2 m total depth.  DNDC
    requires the complete soil column to be 2 m (200 cm) and will reject or crash
    if layers sum to a different depth.

    '
  fix: 'Ensure all soil layer thicknesses sum to exactly 200 cm (2.0 m). Adjust the
    deepest layer thickness as a residual to enforce the 2 m constraint.  Validate
    with: sum(layer_depths) == 200.

    '
- id: dt_010
  description: 'Water table simulation is the opposite of what was intended: the model
    simulates a high water table when the user intended free drainage, or vice versa.

    '
  affected_output: 'The water table flag in DNDC uses reversed logic: 0 = water table
    IS present (Yes), 1 = water table is NOT present (No).  Users commonly assume
    1 = Yes.

    '
  detection: 'The water table flag in DNDC uses reversed logic: 0 = water table IS
    present (Yes), 1 = water table is NOT present (No).  Users commonly assume 1 =
    Yes.

    '
  fix: 'Set water_table_flag = 0 to enable water table simulation; set water_table_flag
    = 1 to disable it (free drainage).  Always verify by inspecting the .dnd XML for
    the correct Boolean interpretation.

    '
