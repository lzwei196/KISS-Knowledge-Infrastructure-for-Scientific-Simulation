  - id: dt_v020
    stage: "s1_domain"
    failure_domain: "silent_error"
    symptom:
      description: "WRF-Hydro at 0.1° gives 3× more runoff than 0.25° for same basin — resolution affects volume, not timing"
      error_pattern: "Q_ratio.*0\\.25|mean_Q.*differs"
