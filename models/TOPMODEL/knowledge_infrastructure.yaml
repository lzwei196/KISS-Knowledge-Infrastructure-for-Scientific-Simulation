package:
  name: TOPMODEL
  language: c
  implementation:
    id: topmodel-noaa-owp-bmi
    version: NOAA-OWP topmodel (2021 BMI release)
    provenance: C; NOAA-OWP BMI port (2021) of Fred Ogden's 2009 C translation of the Beven (1995) TMOD95.02
      TOPMODEL Fortran reference, distributed at github.com/NOAA-OWP/topmodel.
  scientific_reference_version: TOPMODEL (Beven & Kirkby 1979; Beven et al. 1995 formulation, TMOD95.02
    lineage)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/TOPMODEL/source/repo/run_bmi
    type: ELF
pipeline:
  stages:
  - s0_configuration
  - s1_forcing_preparation
  - s2_topographic_index
  - s3_parameter_setup
  - s4_execution
  - s5_output_analysis
  - s6_calibration
tools:
  count: 5
  files:
  - tools/calibrate_topmodel.py
  - tools/convert_forcing_to_topmodel.py
  - tools/generate_twi_subcat.py
  - tools/parse_topmodel_output.py
  - tools/run_topmodel.py
inputs:
  forcing:
  - name: rainfall (rain)
    unit: m/hr
  - name: potential evapotranspiration (pe)
    unit: m/hr
  - name: observed discharge (Qobs)
    unit: m/hr
  parameters:
  - name: szm
    unit: m
  - name: t0 (ln T0)
    unit: ln(m/hr)
  - name: td
    unit: hr
  - name: chv
    unit: m/hr
  - name: rv
    unit: m/hr
  - name: srmax
    unit: m
  - name: xk0
    unit: m/hr
  - name: hf
    unit: m
  - name: dth
    unit: '-'
  - name: TWI histogram (lnaotb, dist_area_lnaotb)
    unit: ln(m), -
  - name: channel network (cum_dist_area, dist_from_outlet)
    unit: -, m
  - name: subcatchment area
    unit: m^2
  initial_conditions:
  - name: Q0
    unit: m/hr
  - name: sr0
    unit: m
  boundary_conditions:
  - name: infex (infiltration-excess flag)
    unit: flag (0/1)
  - name: stand_alone flag
    unit: flag (0/1)
  - name: catchment outlet
    unit: '-'
  - name: dt (timestep length)
    unit: hr
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - Q (simulated discharge)
  - qb (baseflow)
  - sbar (mean saturation deficit)
  - contrib_area (saturated contributing-area fraction)
  - ea (actual evapotranspiration)
  other:
  - qof (saturation/Hortonian overland flow)
  - bal (water-balance residual)
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.816, KGE=0.742, R=0.752'
