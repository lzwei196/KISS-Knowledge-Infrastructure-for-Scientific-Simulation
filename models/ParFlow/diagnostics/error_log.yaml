entries:
- id: err_001
  timestamp: '2026-03-22T00:18:35Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s7_solver
  failure_domain: api_usage
  symptom:
    description: pftools p.Solver.OverlandKinematic = True causes KeyError _value_ during validation
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: OverlandKinematic is a sub-object with only Epsilon attribute, no _value_ in _details_. Setting it = True
      triggers value-object-assignment which fails validation.
    explanation: ''
    affected_components: []
  resolution:
    action: 'Use BCPressure Type OverlandKinematic instead: p.Patch.top.BCPressure.Type = OverlandKinematic. Do NOT set p.Solver.OverlandKinematic
      = True.'
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_002
  timestamp: '2026-03-22T00:18:41Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s7_solver
  failure_domain: missing_key
  symptom:
    description: 'ParFlow fails with Error: Cant find required key PhaseSources.water.Type'
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: PhaseSources.water.Type is a required key in ParFlow input. The generate_parflow_script.py tool does not include
      it.
    explanation: ''
    affected_components: []
  resolution:
    action: 'Add: p.PhaseSources.water.Type = Constant; p.PhaseSources.water.GeomNames = domain; p.PhaseSources.water.Geom.domain.Value
      = 0.0'
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_003
  timestamp: '2026-03-22T00:18:45Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s7_solver
  failure_domain: missing_key
  symptom:
    description: 'ParFlow fails with Error: Cant find required key KnownSolution'
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: KnownSolution is a required key. The generate_parflow_script.py tool does not include it.
    explanation: ''
    affected_components: []
  resolution:
    action: 'Add: p.KnownSolution = NoKnownSolution'
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_004
  timestamp: '2026-03-22T00:18:52Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s7_solver
  failure_domain: api_usage
  symptom:
    description: Cycle must be defined BEFORE BCPressure that references it; otherwise alltime attribute not found on BCPressure
      object
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: pftools dynamically creates BCPressureIntervalItem children from Cycle Names. Setting Cycle.constant.Names
      = alltime creates the alltime attribute on BCPressure objects that reference constant cycle.
    explanation: ''
    affected_components: []
  resolution:
    action: Always define Cycle (Names, Length, Repeat) BEFORE setting any BCPressure values. Order matters.
    files_changed: []
    prevention: ''
  severity: fatal
  promoted: false
  promoted_as: ''
- id: err_005
  timestamp: '2026-03-22T00:19:03Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s7_solver
  failure_domain: api_usage
  symptom:
    description: generate_parflow_script.py output has Solver = Richards BEFORE TerrainFollowingGrid and OverlandKinematic,
      which resets solver sub-keys
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: In pftools, assigning p.Solver = Richards replaces the Solver object _value_ but may reset previously set
      sub-attributes depending on version. All solver sub-keys must be set AFTER p.Solver = Richards.
    explanation: ''
    affected_components: []
  resolution:
    action: Set p.Solver = Richards first, then set all Solver sub-keys (TerrainFollowingGrid, Nonlinear.*, Linear.*, etc.)
    files_changed: []
    prevention: ''
  severity: warning
  promoted: false
  promoted_as: ''
- id: err_006
  timestamp: '2026-03-22T00:19:12Z'
  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s9_output
  failure_domain: output_format
  symptom:
    description: Multi-layer ParFlow mask.pfb output shows active=1 only in layer 0 (bottom), layers 1-4 show active=0, even
      though all layers are computed
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: With variable dz (dzScale nzList) and Box geometry, ParFlow mask output is stored only at the base layer.
      The simulation IS computing all layers (pressure and saturation evolve), but the mask PFB file does not reflect multi-layer
      activity in the expected way.
    explanation: ''
    affected_components: []
  resolution:
    action: 'When analyzing multi-layer PFB output, do NOT use mask to filter per-layer data. Instead check for fill values
      (-3.4e38) to identify inactive cells: valid = data > -1e30'
    files_changed: []
    prevention: ''
  severity: warning
  promoted: false
  promoted_as: ''
