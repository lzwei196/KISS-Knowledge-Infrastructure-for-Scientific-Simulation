template_version: '3.5'
identity:
  model_id: LPJ-GUESS
  scientific_reference_version: LPJ-GUESS 4.1.1 (Smith et al. 2001, 2014; Sitch et al. 2003) — real engine
  implementation:
    id: lpj-guess-4.1.1
    version: 4.1.1 research release (Zenodo 10.5281/zenodo.8065737)
    provenance: C++ engine built 2026-10-06 from the official release (cmake Release, g++ 13.3, NetCDF linked) at
      KISSPATH_HOME/engine_builds_20261006/LPJ_GUESS/build/guess; driven by tools/run_lpjguess_engine.py. The Python
      light-use-efficiency stand-in (tools/run_lpjguess.py) is a SURROGATE and is NOT described by this dag; its
      old contract is kept apart in docs/surrogate_lpjguess_lue_dag.yaml.
  ki_class: forward_model
  is_family_dag: false
  language: C++
  license: MPL-2.0
  repo_url: https://doi.org/10.5281/zenodo.8065737
boundary:
  scope_in:
  - Canopy photosynthesis (Collatz/Haxeltine-Prentice, Farquhar-type) with daily stomatal conductance and water
    stress (canexch.cpp)
  - Autotrophic respiration (maintenance + growth) and C allocation to leaf/root/sapwood/heartwood (growth.cpp)
  - 'Individual/cohort vegetation dynamics: establishment, mortality, competition among 12 global PFTs over replicate
    patches (vegdynam.cpp)'
  - CENTURY soil organic matter and litter decomposition -> heterotrophic respiration; coupled N cycle with N limitation
    (somdynam.cpp, ntransform.cpp)
  - Multi-layer soil water and snow; transpiration, soil evaporation, interception, runoff (soil.cpp, soilwater.cpp)
  - Fire disturbance (GLOBFIRM by default in the KI) and generic patch-destroying disturbance
  - Transient CO2 forcing from an annual CO2 file
  scope_out:
  - Crop, pasture, managed-forest and land-cover-change runs (engine supports them; KI tools do not configure them
    yet)
  - BLAZE fire (needs SimfireInput.bin, not on the server)
  - Transient N deposition (Lamarque file not on the server; constant pre-industrial 2 kgN/ha/yr is used)
  - Sub-daily (diurnal) fluxes; the KI reads monthly and annual output tables
  spatial: 0-D point per grid cell (each cell = set of replicate patches); several cells per run possible
  temporal: daily process step, annual vegetation dynamics; monthly and annual output tables
  closure: 'carbon and water mass balance inside the engine (DE-Tha 1984-2014: P - ET - Q residual 0.4 percent)'
  notes: 'Spin-up: nyear_spinup (500) years cycling the first 30 forcing years (CF input, temperature detrended).
    The calendar starts nyear_spinup years before the first forcing year (cfinput.cpp set_first_calendar_year) and
    CO2 is looked up by calendar year throughout; years before the first CO2-file year get that first value
    (globalco2file.cpp). DE-Tha: spin-up 1484-1983 = 1484-1900 at 296.2 ppm, then 1901-1983 with the real rising
    CO2 record; then the forcing period 1984-2014. The KI drives two modes: the official demo (global_demo.ins, demo input)
    and point runs with -input cf from NetCDF built by build_lpjguess_cf_forcing.py.'
inputs:
  forcing:
  - category: forcing
    name: temp
    unit: K
    source_kind: forcing
    model_input_format: CF NetCDF, standard_name air_temperature, daily mean
    notes: Rejected unless units == 'K'.
  - category: forcing
    name: prec
    unit: kg m-2 s-1
    source_kind: forcing
    model_input_format: CF NetCDF, standard_name precipitation_flux, daily mean
    notes: mm/day / 86400.
  - category: forcing
    name: insol
    unit: W m-2
    source_kind: forcing
    model_input_format: CF NetCDF, standard_name surface_downwelling_shortwave_flux_in_air, 24-h mean
    notes: Not net radiation, not MJ.
  - category: forcing
    name: min_temp
    unit: K
    source_kind: forcing
    model_input_format: CF NetCDF air_temperature, daily minimum
    notes: Needed for BVOC/GWGEN; supplied anyway.
  - category: forcing
    name: max_temp
    unit: K
    source_kind: forcing
    model_input_format: CF NetCDF air_temperature, daily maximum
    notes: ''
  - category: forcing
    name: relhum
    unit: '1'
    source_kind: forcing
    model_input_format: CF NetCDF relative_humidity as a 0-1 fraction
    notes: Derived from specific humidity, pressure, temperature.
  - category: forcing
    name: wind
    unit: m s-1
    source_kind: forcing
    model_input_format: CF NetCDF wind_speed
    notes: 10 m wind from the loader.
  - category: forcing
    name: co2
    unit: ppm
    source_kind: forcing
    model_input_format: text '<year> <ppm>' per consecutive year (file_co2)
    notes: Built by build_lpjguess_co2_file.py (Law Dome + NOAA Mauna Loa).
  parameters:
  - category: parameters
    name: soil code
    unit: categorical
    source_kind: dataset_lookup
    model_input_format: LPJ soil class (soils_lpj.dat, 0.5-degree map) of the cell holding the site; run tool writes
      an exact site line
    notes: Sets texture-based water holding and thermal properties.
  - category: parameters
    name: PFT parameters
    unit: mixed
    source_kind: user_provided
    model_input_format: pft blocks in global.ins (shipped values, Smith et al. 2014)
    notes: Not calibrated by the KI.
  initial_conditions: []
  boundary_conditions:
  - category: boundary_conditions
    name: vegmode
    unit: categorical
    source_kind: user_provided
    model_input_format: '''cohort'' (individual-based) or ''population'' (area-averaged) vegetation mode'
    notes: global.ins default 'cohort'.
  - category: boundary_conditions
    name: npatch
    unit: count
    source_kind: user_provided
    model_input_format: number of replicate patches (>=25 for cohort-mode robustness)
  - category: boundary_conditions
    name: nyear_spinup
    unit: years
    source_kind: user_provided
    model_input_format: spinup length for soil C equilibration (>=500 temperate, 1000+ boreal/peatland)
  - category: boundary_conditions
    name: PFT selection
    unit: categorical
    source_kind: user_provided
    model_input_format: climatically appropriate PFTs enabled with bioclimatic filtering (T_min, T_max, GDD)
  - category: boundary_conditions
    name: firemodel
    unit: categorical
    source_kind: user_provided
    model_input_format: GLOBFIRM (KI default) | NOFIRE | BLAZE (needs SimfireInput.bin)
processes:
  modules:
  - name: canexch
    role: process_solver
    brief: Daily canopy photosynthesis, respiration, stomatal conductance, interception; reports GPP (net of leaf
      respiration), Ra.
  - name: soil/soilwater
    role: process_solver
    brief: Soil water, snow, transpiration (maet), evaporation (mevap), runoff.
  - name: growth
    role: process_solver
    brief: Annual allocation, turnover, NPP.
  - name: vegdynam
    role: process_solver
    brief: Establishment, mortality, disturbance per patch.
  - name: somdynam/ntransform
    role: process_solver
    brief: CENTURY litter/soil C and N, heterotrophic respiration (Rh), N mineralisation.
  - name: commonoutput
    role: integrator
    brief: Writes annual/monthly tables; mnpp = mgpp - mra, mnee = mrh - mnpp.
  internal_edges:
  - from: Inputs
    to: canexch
    kind: consumes_input
    brief: temp, insol, CO2, relhum
  - from: Inputs
    to: soil/soilwater
    kind: consumes_input
    brief: prec, temp
  - from: soil/soilwater
    to: canexch
    kind: invokes
    brief: water supply limits conductance
  - from: canexch
    to: growth
    kind: invokes
    brief: assimilate for allocation
  - from: growth
    to: vegdynam
    kind: invokes
    brief: vigour drives mortality/establishment
  - from: vegdynam
    to: somdynam/ntransform
    kind: invokes
    brief: litter input
  - from: somdynam/ntransform
    to: growth
    kind: invokes
    brief: N availability
  - from: canexch
    to: commonoutput
    kind: produces_output
    brief: GPP, Ra
  - from: somdynam/ntransform
    to: commonoutput
    kind: produces_output
    brief: Rh
  - from: commonoutput
    to: Outputs
    kind: produces_output
    brief: GPP, Ra, Rh, Reco, NEE, NPP tables
states:
  variables:
  - name: vegetation carbon (cmass)
    unit: kgC m-2
  - name: soil and litter carbon (cpool)
    unit: kgC m-2
  - name: leaf area index (lai)
    unit: m2 m-2
  - name: soil water content
    unit: fraction of available capacity
  provenance: structural
outputs:
- var: GPP
  validation_rank: 1
  unit: umol/m2/s
  description: Gross Primary Production (terrestrial vegetation carbon assimilation flux).
  emitted_in: mgpp.out (kgC m-2 month-1; GPP minus leaf respiration); converted to umol/m2/s by parse_lpjguess_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      - timing_accuracy
      determining_metric: nse
      caveats:
      - Eddy-covariance GPP is a partitioning-derived flux, not a direct measurement.
      - Internal flux may be gC/m2/day; convert to umol/m2/s (1 gC/m2/day = 0.9636 umol/m2/s) before comparison.
      - Engine GPP excludes leaf dark respiration (commonoutput.cpp 'GPP-LeafResp'); expect it a few percent below
        partitioned tower GPP (dt_lpjguess_025).
    detrending_options:
    - none
- var: Ra
  validation_rank: 3
  unit: umol/m2/s
  description: Autotrophic respiration (terrestrial vegetation carbon respiration flux).
  emitted_in: mra.out; converted to umol/m2/s by parse_lpjguess_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - Ra is not directly observable by eddy covariance; comparable only against partitioned/modelled estimates.
    detrending_options:
    - none
- var: Rh
  validation_rank: 4
  unit: umol/m2/s
  description: Heterotrophic respiration (soil/litter decomposition).
  emitted_in: mrh.out; converted to umol/m2/s by parse_lpjguess_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - Comparable against soil-respiration chambers or partitioned Rh, not against net tower flux directly.
    detrending_options:
    - none
- var: Reco
  validation_rank: 5
  unit: umol/m2/s
  description: Ecosystem respiration (Ra + Rh).
  emitted_in: mra.out + mrh.out; converted to umol/m2/s by parse_lpjguess_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - Tower Reco is a nighttime-extrapolated/partitioned quantity carrying partitioning uncertainty.
    detrending_options:
    - none
- var: NEE
  validation_rank: 6
  unit: umol/m2/s
  description: Net Ecosystem Exchange (Reco - GPP); positive = net source, negative = net sink.
  emitted_in: mnee.out (= mrh - mnpp; fire C excluded); converted to umol/m2/s by parse_lpjguess_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - NEE is the most directly observed eddy-covariance flux; sign convention (positive=source) must match obs.
      - NEE is a small residual of large GPP and Reco; magnitude errors are amplified.
    detrending_options:
    - none
- var: NPP
  validation_rank: 2
  unit: umol/m2/s
  description: Net Primary Production (terrestrial vegetation carbon production flux; GPP - Ra).
  emitted_in: mnpp.out (= mgpp - mra); converted to umol/m2/s by parse_lpjguess_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - NPP not directly observed by towers; comparable against biometric/inventory NPP at coarser cadence.
    - obs_shape: regional_aggregate_time_series
      comparison_mode: aggregate_trend_comparison
      metric_families:
      - trend_match
      - magnitude_accuracy
      determining_metric: pbias
      caveats:
      - Regional/inventory NPP carries non-model (management/disturbance) signal; compare trends, not inter-annual
        r.
    detrending_options:
    - none
    - decadal_mean
    - linear_residual
influence:
  edges: []
  citation_index: {}
  _reason: lit_reader returned null (no sensitivity literature was supplied to this run); per synthesizer rule,
    sensitivity-with-citation edges require >=1 citation from lit_facts.papers[], so the block is intentionally
    empty. Mechanistic input->output dependencies are captured in processes.internal_edges, not here.
safety:
  hazards:
  - id: ins_parse_failure
    kind: control_semantic
    description: Malformed instruction (.ins) file (missing string quotes, unbalanced braces, trailing whitespace)
      causes silent parse failure and wrong PFT configuration.
    severity: fatal_or_silent
    triplet_id: dt_lpjguess_005
  - id: gridlist_format_invalid
    kind: control_semantic
    description: Gridlist not space-separated 'lon lat' (CSV, header rows, reversed lon/lat, out-of-range coords)
      yields zero gridcells or immediate crash.
    severity: fatal
    triplet_id: dt_lpjguess_006
  - id: driver_netcdf_not_cf_compliant
    kind: weather_file_semantic
    description: Driver NetCDF dim ordering / variable naming / calendar not matching the CF input spec causes getclimate
      read errors.
    severity: fatal
    triplet_id: dt_lpjguess_007
  - id: cf_searchradius_segfault
    kind: control_semantic
    description: Setting searchradius_soil with -input cf segfaults 4.1.1 (local SoilInput in CFInput ctor).
    severity: fatal
    triplet_id: dt_lpjguess_019
  - id: cf_spinup_needs_30_years
    kind: weather_file_semantic
    description: CF forcing shorter than 30 full years cannot build the spin-up climate.
    severity: fatal
    triplet_id: dt_lpjguess_021
  - id: cf_units_literal
    kind: weather_file_semantic
    description: CF units/standard_name checked literally (K, kg m-2 s-1, W m-2, '1').
    severity: fatal
    triplet_id: dt_lpjguess_023
  - id: maet_transpiration_only
    kind: parser_semantic
    description: maet is transpiration only; total ET = maet + mevap + mintercep.
    severity: silent
    triplet_id: dt_lpjguess_026
  - id: pnv_vs_managed_stand
    kind: coefficient_runtime_silent_fallback
    description: Default run simulates potential natural vegetation, not the real (planted) stand.
    severity: degraded
    triplet_id: dt_lpjguess_027
  - id: surrogate_mistaken_for_model
    kind: control_semantic
    description: run_lpjguess.py output is a Python surrogate, not LPJ-GUESS.
    severity: silent
    triplet_id: dt_lpjguess_033
  validation_limits:
  - Point runs use NASA POWER (or CMFD/MSWX) reanalysis weather at the tower coordinate, not tower meteorology.
  - Vegetation is potential natural vegetation unless PFTs are restricted; managed stands and their age structure
    are not represented.
  - N deposition is constant pre-industrial (no Lamarque file); BLAZE fire is unavailable.
  warnings:
  - Engine .out tables are written with 3 decimals (kgC m-2 month-1), i.e. ~0.03 gC m-2 d-1 resolution for monthly
    fluxes.
  assumptions:
  - statement: This dag describes the real LPJ-GUESS 4.1.1 engine as driven by the KI tools; output names/units/ranks
      were kept from the earlier dag so the obs map and validation convention stay valid.
    scope: Entire dag
    source: engine source src/modules/*.cpp; KI run 2026-10-07
    status: adopted
medium_evidence:
- var: GPP
  source: SKILL.md
  quote: 'This knowledge infrastructure enables autonomous simulation of terrestrial ecosystem

    carbon and nitrogen cycling using the core physics of LPJ-GUESS.'
  note: KI overview declares LPJ-GUESS outputs as terrestrial ecosystem carbon-cycle quantities.
- var: Ra
  source: SKILL.md
  quote: 'This knowledge infrastructure enables autonomous simulation of terrestrial ecosystem

    carbon and nitrogen cycling using the core physics of LPJ-GUESS.'
  note: KI overview declares LPJ-GUESS outputs as terrestrial ecosystem carbon-cycle quantities.
- var: NPP
  source: SKILL.md
  quote: 'This knowledge infrastructure enables autonomous simulation of terrestrial ecosystem

    carbon and nitrogen cycling using the core physics of LPJ-GUESS.'
  note: KI overview declares LPJ-GUESS outputs as terrestrial ecosystem carbon-cycle quantities.
