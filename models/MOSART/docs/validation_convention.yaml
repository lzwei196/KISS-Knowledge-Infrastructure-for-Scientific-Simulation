schema_version: 1
model_id: MOSART
domain: hydrology
generated_by: "self-improve session (Claude Opus 4.8) — validation-convention Step-B, general schema"
generated_at: 2026-07-09

# Grounded ONLY in locally-fetched full texts. MOSART is a river-routing model; the gauge-comparable
# headline quantity is DISCHARGE / streamflow. Numeric PASS tiers come from the domain streamflow
# convention Moriasi et al. 2007 (Table 4, monthly time step), which is REPRODUCED verbatim in the
# open-access multi-site SWAT evaluation of Chandra et al. 2019 (Gomti basin) -> both fetched, both cited.
# MOSART's own benchmark papers (Li et al. 2015 global streamflow; Xu et al. 2022 E3SM two-way coupling)
# report correlation / R2 / RMSE only (no NSE/PBIAS tier), so they enter as SUPPORTIVE context, not as
# pass bands. STORAGE quantities (routing STORAGE_LIQ vs GRACE TWS; reservoir WRM_STORAGE) and the
# managed WRM_SUPPLY aggregate have NO cited numeric skill tier in the fetched set -> null bands +
# confidence <= 0.4 (honest data-gaps; NEVER used to loosen the gate). Bands are plain numbers read via
# `direction` (see VALIDATION_CONVENTION_SCHEMA.md).

references:
  moriasi2007:
    doi: 10.13031/2013.23153
    title: "Model Evaluation Guidelines for Systematic Quantification of Accuracy in Watershed Simulations"
    venue: "Transactions of the ASABE"
    year: 2007
    oa: manual   # user-downloaded full text in paper_cache
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.13031_2013.23153.txt
  swat_gomti2019:
    doi: 10.1007/s13201-019-1013-x
    title: "Evaluation of multisite performance of SWAT model in the Gomti River Basin, India"
    venue: "Applied Water Science"
    year: 2019
    oa: gold
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1007_s13201-019-1013-x.txt
  mosart_li2015:
    doi: 10.1175/jhm-d-14-0079.1
    title: "Evaluating Global Streamflow Simulations by a Physically Based Routing Model Coupled to a Land Surface Model"
    venue: "Journal of Hydrometeorology"
    year: 2015
    oa: manual
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1175_jhm-d-14-0079.1.txt
  mosart_e3sm2022:
    doi: 10.1029/2021ms002772
    title: "Development of Land-River Two-Way Hydrologic Coupling for Floodplain Inundation in E3SM"
    venue: "Journal of Advances in Modeling Earth Systems (JAMES)"
    year: 2022
    oa: manual
