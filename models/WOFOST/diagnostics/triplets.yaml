- id: dt_011_pp_mode_needs_soil
  symptom:
    description: 'Running SIMULATION_MODE=PP raises pcse.exceptions.ParameterError: Value for parameter
      SMFCF missing.'
  diagnosis:
    root_cause: SKILL.md / run_wofost_simulation.py assumed PP (Potential Production) needs no soil and
      loaded soildata={} for PP. In PCSE 6.0 Wofost72_PP STILL requires the soil-hydraulic params (SMFCF,
