name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the Windows assets
        required: true
        default: windows-v0.6.58
      reuse_0658_source_validation:
        description: Reuse the pinned successful 0.6.58 source tests for a packaging-only retry
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  validate-source:
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      source_validation_run: ${{ steps.source.outputs.validation_run }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record the tested application revision
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'cannot resolve the application revision' }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $validationRun = if ('${{ inputs.reuse_0658_source_validation }}' -eq 'true') { '37564645167' } else { '${{ github.run_id }}' }
          "validation_run=$validationRun" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify the approved source validation identity
        if: inputs.reuse_0658_source_validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This narrow reuse is bound to one reviewed application commit, run,
          # successful source job and the exact report bytes recorded below.
          if ('${{ steps.source.outputs.commit }}' -ne 'abaffb5b493de60a31ea3b0afebb8538a30a3a9f') { throw 'source reuse is only approved for the unchanged 0.6.58 application' }
          $run = gh api 'repos/${{ github.repository }}/actions/runs/37564645167' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne 'fe38a9dc92199a41b640679e407b01752ae55f06') { throw 'source validation workflow identity mismatch' }
          $job = gh api 'repos/${{ github.repository }}/actions/jobs/112609487734' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $job.run_id -ne 37564645167 -or $job.name -ne 'validate-source' -or $job.conclusion -ne 'success') { throw 'approved source validation job did not pass' }

      - name: Restore the approved source validation reports
        if: inputs.reuse_0658_source_validation
        uses: actions/download-artifact@v4
        with:
          name: windows-source-validation-37564645167
          run-id: 37564645167
          github-token: ${{ github.token }}
          path: .

      - name: Verify exact source validation report bytes
        if: inputs.reuse_0658_source_validation
        shell: pwsh
        run: |
          $expected = @{
            'desktop-regression.xml' = 'd7703b2b3970691ef41f175f69e195a336b1d05c296d07713d81d6a91465b7fb'
            'shared-regression.xml' = 'dd5a8dd9aaec39f0cf0cd617766f5e23d1a3532921e5bb497b2c446fa24bf6c6'
          }
          foreach ($name in $expected.Keys) {
            if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLower() -ne $expected[$name]) { throw "source validation report differs: $name" }
            [xml]$report = Get-Content -LiteralPath $name -Raw
            foreach ($suite in $report.testsuites.testsuite) {
              if ([int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) { throw "source validation report failed: $name" }
            }
          }

      - name: Install test dependencies
        if: ${{ !inputs.reuse_0658_source_validation }}
        shell: pwsh
        run: |
          # Scientific helper tests need these optional packages; the desktop
          # spec deliberately excludes them from the bundled application.
          python -m pip install --quiet pyinstaller pytest truststore certifi pandas==2.3.1 xarray==2025.7.1 matplotlib==3.10.5 -e kiss -e ki_tools_common -r kiss/requirements-calibration.txt

      - name: Release boundary regressions
        if: ${{ !inputs.reuse_0658_source_validation }}
        shell: pwsh
        run: |
          python -m pytest kiss/tests/test_data_reader_runtime.py kiss/tests/test_session_upload_safety.py kiss/tests/test_ki_guard.py 'kiss/tests/test_runtime.py::AgentSetupTests::test_julia_probe_uses_workspace_runtime_project_and_depot' -q -o faulthandler_timeout=180
          if ($LASTEXITCODE -ne 0) { throw 'release boundary regression tests failed' }

      - name: Shared-library regression tests
        if: ${{ !inputs.reuse_0658_source_validation }}
        shell: pwsh
        run: |
          # Both trees contain a top-level tests package; use separate interpreters.
          python -m pytest ki_tools_common/ki_tools_common/tests ki_tools_common/tests/flow ki_tools_common/tests/test_units.py ki_tools_common/tests/test_climate_scenarios.py -q --junitxml=shared-regression.xml
          if ($LASTEXITCODE -ne 0) { throw 'shared-library regression tests failed' }

      - name: Source regression tests
        if: ${{ !inputs.reuse_0658_source_validation }}
        shell: pwsh
        run: |
          python -m pytest kiss/tests -q --durations=20 -o faulthandler_timeout=180 --junitxml=desktop-regression.xml
          if ($LASTEXITCODE -ne 0) { throw 'application regression tests failed' }

      - name: Keep successful source regression reports
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-validation-${{ github.run_id }}
          path: |
            desktop-regression.xml
            shared-regression.xml
          if-no-files-found: error
          overwrite: true

  build-and-publish:
    needs: validate-source
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Require the application revision that passed validation
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -ne '${{ needs.validate-source.outputs.source_commit }}') { throw 'application tag changed after source validation' }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and release-check dependencies
        shell: pwsh
        run: |
          python -m pip install --quiet pyinstaller pytest truststore certifi pandas==2.3.1 xarray==2025.7.1 matplotlib==3.10.5 -e kiss -e ki_tools_common -r kiss/requirements-calibration.txt
          choco install innosetup -y --no-progress

      - name: Load standalone checks from the workflow revision
        shell: pwsh
        run: |
          # Fetch only the check source; HEAD and application files stay at the tag.
          git fetch --no-tags --depth=1 origin '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'cannot fetch the release-check revision' }
          python -c "from pathlib import Path,PurePosixPath; import subprocess,sys; out=Path('release-checks'); out.mkdir(exist_ok=True); [(out/PurePosixPath(p).name).write_bytes(subprocess.check_output(['git','show',sys.argv[1]+':'+p])) for p in ('tools/windows_release_smoke.py','tools/test_windows_release_asset_bytes.py')]" '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'cannot extract standalone release checks' }
          python -m pytest release-checks/test_windows_release_asset_bytes.py -q
          if ($LASTEXITCODE -ne 0) { throw 'standalone release-check regressions failed' }

      - name: Restore successful source regression reports
        uses: actions/download-artifact@v4
        with:
          name: windows-source-validation-${{ github.run_id }}
          path: .

      - name: Build the self-contained desktop folder
        shell: pwsh
        run: |
          # Inno Setup cannot read some bundled paths below GitHub's long
          # checkout directory. Build the same source into a short temp root.
          $distDir = Join-Path $env:RUNNER_TEMP 'gf/dist'
          $workDir = Join-Path $env:RUNNER_TEMP 'gf/build'
          python -m PyInstaller --noconfirm --clean --distpath "$distDir" --workpath "$workDir" kiss/GeoForgeDesktopWindows.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          $version = python -c "import tomllib;print(tomllib.load(open('kiss/pyproject.toml','rb'))['project']['version'])"
          $bundle = Join-Path $distDir "GeoForge Desktop $version Windows"
          if (!(Test-Path "$bundle/_internal/python311.dll")) { throw 'python311.dll missing' }
          if ((Get-ChildItem "$bundle/_internal/models" -Directory).Count -ne 127) { throw 'expected 127 KI packages' }
          if (!(Select-String -LiteralPath "$bundle/_internal/kiss_cli/web/app.html" -Pattern 'Enable Kimi with full computer access' -Quiet)) { throw 'Windows Kimi setting missing' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test the frozen application outside the checkout
        shell: pwsh
        run: |
          python release-checks/windows_release_smoke.py "$env:BUNDLE" --report windows-frozen-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'frozen application smoke failed' }

      - name: Build and test the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$((Resolve-Path $env:BUNDLE).Path)" "/DOutputDir=$((Get-Location).Path)/installer-output" kiss/installer/GeoForgeDesktopWindows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $installer = (Resolve-Path "installer-output/GeoForge-Desktop-Setup-v$env:APP_VERSION-Windows-x64.exe").Path
          $testDir = Join-Path $env:RUNNER_TEMP 'GeoForge-release-test'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=`"$testDir`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited $($process.ExitCode)" }
          if (!(Test-Path "$testDir/_internal/python311.dll")) { throw 'installed Python DLL missing' }
          if ((Get-ChildItem "$testDir/_internal/models" -Directory).Count -ne 127) { throw 'installed KI count is not 127' }
          python release-checks/windows_release_smoke.py "$testDir" --report windows-installed-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'installed application smoke failed' }
          $uninstall = Join-Path $testDir 'unins000.exe'
          $process = Start-Process $uninstall -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "uninstaller exited $($process.ExitCode)" }
          if (Test-Path "$testDir/GeoForge Desktop.exe") { throw 'uninstaller left the application executable' }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path $env:BUNDLE -DestinationPath "GeoForge-Desktop-v$env:APP_VERSION-Windows-x64.zip" -CompressionLevel Optimal
          Get-FileHash "installer-output/GeoForge-Desktop-Setup-v$env:APP_VERSION-Windows-x64.exe","GeoForge-Desktop-v$env:APP_VERSION-Windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content SHA256SUMS-Windows.txt
          $validation = @{
            version = $env:APP_VERSION
            source_commit = (git rev-parse HEAD)
            workflow_commit = '${{ github.sha }}'
            source_validation_run = '${{ needs.validate-source.outputs.source_validation_run }}'
            source_regression_tests = 'passed; see source_validation_run, exact attached JUnit reports and validate-source provenance checks'
            frozen = Get-Content windows-frozen-smoke.json -Raw | ConvertFrom-Json
            installed = Get-Content windows-installed-smoke.json -Raw | ConvertFrom-Json
            installer_exit_code = 0
            uninstaller_exit_code = 0
            scope = 'Application packaging and installation checks; no paid AI or scientific calibration runs.'
          }
          $validation | ConvertTo-Json -Depth 8 | Set-Content Windows-release-validation.json -Encoding utf8

      - name: Stage downloads and documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item "installer-output/GeoForge-Desktop-Setup-v$env:APP_VERSION-Windows-x64.exe","GeoForge-Desktop-v$env:APP_VERSION-Windows-x64.zip",release-manifest.json,DESKTOP_CHANGELOG.md,Windows-release-validation.json,windows-frozen-smoke.json,windows-installed-smoke.json,desktop-regression.xml,shared-regression.xml -Destination release-assets
          $edition = (Get-Content release-manifest.json -Raw | ConvertFrom-Json).guides.edition
          foreach ($kind in @('Quickstart','Manual','Calibration')) {
            foreach ($language in @('EN','ZH-CN')) {
              $sourceLanguage = if ($language -eq 'EN') { 'en' } else { 'zh-CN' }
              Copy-Item "kiss/kiss_cli/web/guides/$($kind.ToLower())-$sourceLanguage.pdf" "release-assets/GeoForge-Desktop-$kind-$language-v$edition.pdf"
            }
          }
          Copy-Item "docs/manual/$edition/validation.json" release-assets/guide-validation.json
          Copy-Item "docs/manual/$edition/quickstart-illustrated-validation.json" release-assets/quickstart-illustrated-validation.json
          Get-ChildItem release-assets -File | Where-Object Name -ne SHA256SUMS-Windows.txt | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release-assets/SHA256SUMS-Windows.txt -Encoding utf8

      - name: Attach assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" release-assets/* --clobber
