schema_version: 1
model_id: PyDeltaRCM
domain: hydrology
generated_by: "Step-B agent (GPT-5 Codex)"
generated_at: 2026-08-14

# PyDeltaRCM/DeltaRCM validation literature is morphodynamic and ensemble-statistical:
# published assessments compare channel-network, planform, surface/subsurface, and flow-
# partition metrics against theory, experiments, field deltas, or Delft3D. The fetched set
# does not provide a numeric pass/fail CSI or IoU threshold for any dag output, so headline
# CSI bands are intentionally null and low-confidence. Null bands must not loosen a gate.

references:
  moodie2021:
    doi: 10.21105/joss.03398
    title: "pyDeltaRCM: a flexible numerical delta model"
    venue: "Journal of Open Source Software"
    year: 2021
    oa: gold
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.21105_joss.03398.txt
  liang2015a:
    doi: 10.5194/esurf-3-67-2015
    title: "A reduced-complexity model for river delta formation - Part 1: Modeling deltas with channel dynamics"
    venue: "Earth Surface Dynamics"
    year: 2015
    oa: gold
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.5194_esurf-3-67-2015.txt
  liang2015b:
    doi: 10.5194/esurf-3-87-2015
    title: "A reduced-complexity model for river delta formation - Part 2: Assessment of the flow routing scheme"
    venue: "Earth Surface Dynamics"
    year: 2015
    oa: gold
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.5194_esurf-3-87-2015.txt
  liang2016:
