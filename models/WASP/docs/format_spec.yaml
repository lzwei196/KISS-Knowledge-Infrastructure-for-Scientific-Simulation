    a large oxygen deficit. The optimizer increases ka to compensate, trying to achieve rapid reaeration.
  remedy: 'Constrain BOD0 bounds to [0.5, 10] mg/L and ka to [0.1, 2.0] 1/d; use literature estimates
    as priors; run_wasp; [''Check calibrated BOD0: > 10 mg/L suggests overestimated loading for most lakes'',
    ''Check calibrated ka: > 2.0 1/d is unrealistic for lakes (rivers can be higher)'', ''Reduce BOD0
    upper boun'
  severity: silent
- id: dt_wasp_012
  symptom: Negative dissolved oxygen concentrations in output despite clipping code
  diagnosis: DO clipping applied after seasonal averaging but not during sub-daily computation; The seasonal
    DO model computes DO = DO_sat(T) - deficit + DO_offset. If BOD0 is high and ka is low, the deficit
    can exceed DO_sat, producing negative raw DO. The formula clips to [0, 20] mg/L, but if intermediate
    calc
  remedy: 'Apply np.clip(DO, 0, None) at every computation step, not just the final output; run_wasp;
    [''Check for negative DO in output CSV or profile arrays'', ''Add clipping after the Streeter-Phelps
