agent_hint: Configure official mHM/FORCES with native netCDF-Fortran and workspace
  fypp preprocessor via -DFYPP=<workspace>/venv/bin/fypp. If FindThreads rejects Fortran-only
  languages when loading Homebrew HDF5, enable C in top-level CMake with a minimal
  documented build-only patch. Configure -S . -B build and preserve exact product
  <workspace>/binaries/mHM/build/mhm. Do not use build2 or a different unrecorded
  directory. No scientific source substitutions, model runs or input downloads.
