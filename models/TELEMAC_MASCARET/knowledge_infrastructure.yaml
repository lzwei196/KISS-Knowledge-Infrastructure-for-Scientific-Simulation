package:
  name: TELEMAC-MASCARET
  language: fortran
  implementation:
    id: telemac-mascaret-v910
    version: v9.1.0
    provenance: Fortran 90 with BIEF/HERMES libraries; openTELEMAC consortium (EDF-R&D LNHE originated)
      finite-element / finite-volume solver, telemac2d as the 2D hydrodynamics host module.
  scientific_reference_version: TELEMAC-2D depth-averaged shallow-water (Saint-Venant) hydrodynamics;
    openTELEMAC consortium release v9.1.0 (governing-equation theory per Hervouet 2007 / TELEMAC-2D User
    Manual)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/TELEMAC_MASCARET/source/repo/builds/main_gfortran_release/bin/telemac2d
    type: ELF
pipeline:
  stages:
  - s1_domain_setup
  - s2_mesh_generation
  - s3_forcing_preparation
  - s4_steering_file
  - s5_execution
  - s6_output_analysis
tools:
  count: 4
  files:
  - tools/convert_bathymetry.py
  - tools/convert_forcing.py
  - tools/parse_selafin.py
  - tools/run_telemac.py
inputs:
  forcing:
  - name: Wind velocity (X, Y)
    unit: m/s
  - name: Atmospheric pressure
    unit: Pa
  - name: Rain / evaporation
    unit: mm/s
  - name: River discharge at liquid boundaries
    unit: m^3/s
  - name: Tidal elevation / constituents at open-sea boundaries
    unit: m (amplitude), degrees (phase)
  parameters:
  - name: Bottom friction coefficient
    unit: Manning n (s/m^(1/3)) or Strickler K (m^(1/3)/s) depending on law
  - name: Velocity (turbulent) diffusivity
    unit: m^2/s
  - name: Coefficient of wind influence (drag)
    unit: '-'
  - name: Coriolis coefficient
    unit: s^-1
  - name: Gravity acceleration
    unit: m/s^2
  - name: Water density
    unit: kg/m^3
  - name: Bottom (bathymetry) elevation field
    unit: m (positive upward from datum)
  initial_conditions:
  - name: Initial free-surface / depth state
    unit: m
  - name: Previous-computation restart state
    unit: varies (h, u, v, T fields)
  boundary_conditions:
  - name: Boundary-condition type per edge node
    unit: '-'
  - name: Law of bottom friction (method switch)
    unit: code
  - name: Turbulence model (method switch)
    unit: code
  - name: Equation/solver scheme selector
    unit: code
  - name: Wetting/drying treatment
    unit: switch
  - name: Time-stepping control
    unit: s / switch
  - name: Implicitation coefficients
    unit: '-'
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - H
  - S
  - U
  - V
  - M
  - T
  - section_discharge
  other: []
