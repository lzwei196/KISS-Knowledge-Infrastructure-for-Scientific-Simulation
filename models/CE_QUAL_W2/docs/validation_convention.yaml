        band_note: "No fetched paper gives a numeric PBIAS band for CE-QUAL-W2 ice thickness."
        cites: []
      - metric: rmse
        direction: minimize
        unit: m
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric RMSE band for CE-QUAL-W2 ice thickness."
        cites: []
    secondary_metrics:
      - metric: ice_on_off_timing_error
        direction: minimize
        status: supportive
        ceiling_reason: "Mi 2019 evaluates W2 ice by occurrence and ice-on/ice-off timing; it reports extra thin ice in W2 and a 5-day GLM ice-off delay, but not a W2 thickness threshold."
        cites: [mi2019, shatwell2019]
    validated_when: "UNRESOLVED - ice thickness should be compared directly, but no fetched numeric validation band is available."
    evidence_strength: weak
    confidence: 0.25
    notes: "The capped OpenAlex check found no CE-QUAL-W2 ice-thickness CSI/RMSE convention. Treat as a data/literature gap."

  - dag_variable: ice thickness
    obs_shape: categorical_event
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a CSI threshold for CE-QUAL-W2 ice presence/absence."
        cites: []
    secondary_metrics:
      - metric: ice_occurrence_match
        direction: maximize
        status: supportive
        ceiling_reason: "Mi 2019 says capturing ice occurrence in different years is an important criterion for simulating ice dynamics, but does not define CSI/POD/FAR bands."
        cites: [mi2019]
    validated_when: "UNRESOLVED - require observed ice/no-ice event comparison, but do not auto-validate on CSI without a fetched threshold."
    evidence_strength: weak
    confidence: 0.25
