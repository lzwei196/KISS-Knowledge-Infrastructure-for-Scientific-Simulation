# ============================================================================
# GLM Diagnostic Triplets
# ============================================================================
# 30 diagnostic triplets covering 7 failure domains.
# Generated during GLM knowledge dissection for HydroCraft platform.
# Updated 2026-04-03: Added AED2 phytoplankton triplets (dt_028-030).
# ============================================================================

# --- Unit Conversion (HIGHEST PRIORITY — Silent Errors) ---

- id: dt_001
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Lake level rises continuously, overflow every day. Lake volume grows unrealistically."
    error_pattern: "overflow"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Rain in mm/day instead of m/day — 1000x too much precipitation input"
    explanation: >
      GLM expects rain in meters per day (m/day). CMFD and MSWX provide precipitation
      in mm per 3-hour timestep. The correct conversion is: mm/3hr * 8 / 1000 = m/day.
      If the /1000 step is omitted, the lake receives 1000x too much rain.
    affected_components: [convert_met_to_glm, meteorology_block]
  remedy:
    action: "Divide rain values by 1000 in convert_met_to_glm.py"
    tool_to_run: convert_met_to_glm
    manual_steps:
      - "Check max rain value in met CSV — should be < 0.5 m/day for most climates"
      - "If max rain > 1.0 m/day, values are likely in mm/day — divide by 1000"
    prevention: "validate_outputs() in convert_met_to_glm checks for unrealistic rain values"
  severity: silent
  cross_references: [dt_002]

- id: dt_002
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Lake dries up rapidly. Extreme evaporation. Lake level drops to zero."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "RelHum as fraction (0-1) instead of percentage (0-100)"
    explanation: >
      GLM expects relative humidity as percentage (0-100). CMFD/MSWX provide vapor
      pressure in kPa, which must be converted to RH%. If the conversion yields values
      in 0-1 range instead of 0-100, GLM computes enormous evaporation because it
      interprets 0.7 (70% RH) as 0.7% RH.
    affected_components: [convert_met_to_glm, vp_to_rh]
  remedy:
    action: "Multiply RH by 100 if values are in 0-1 range"
    tool_to_run: convert_met_to_glm
    manual_steps:
      - "Check max RelHum in met CSV — should be 60-100 for most climates"
      - "If max RelHum < 1.0, values are fraction — multiply by 100"
    prevention: "validate_outputs() checks for RH < 1.0 and warns"
  severity: silent
  cross_references: [dt_001]

- id: dt_003
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Negative shortwave radiation values in forcing CSV. May cause NaN in temperature."
    error_pattern: "NaN"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Night-time shortwave radiation not clipped to zero after temporal interpolation"
    explanation: >
      When interpolating 3-hourly forcing to hourly, linear interpolation can produce
      small negative values for shortwave radiation during night-time transitions.
      GLM may handle these as-is or produce numerical artifacts.
    affected_components: [convert_met_to_glm]
  remedy:
    action: "Apply max(0, SW) after interpolation"
    tool_to_run: convert_met_to_glm
    manual_steps:
      - "Check min ShortWave value in met CSV — must be >= 0"
    prevention: "convert_met_to_glm applies np.maximum(sw, 0.0) by default"
  severity: silent
  cross_references: []

- id: dt_004
  stage: s3_inflow
  failure_domain: unit_conversion
  symptom:
    description: "Inflow temperature always 0 degC or NaN. Artificial cold layer forms at insertion depth."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Temperature column missing from inflow CSV or not estimated from air temperature"
    explanation: >
      GLM reads TEMP from inflow CSV. If the column is missing or all zeros, the inflow
      water enters at 0 degC, creating an artificially cold density current that sinks to
      the bottom and disrupts the thermal structure.
    affected_components: [convert_inflow_to_glm, inflow_block]
  remedy:
    action: "Estimate inflow temperature from air temperature using T_water = 0.9*T_air + 1.5"
    tool_to_run: convert_inflow_to_glm
    manual_steps:
      - "Verify TEMP column exists in inflow CSV"
      - "Check that values are physically reasonable (0-30 degC typically)"
    prevention: "convert_inflow_to_glm auto-estimates T from met CSV if available"
  severity: degraded
  cross_references: [dt_022]

# --- Parameter Format ---

- id: dt_005
  stage: s6_namelist
  failure_domain: parameter_format
  symptom:
    description: "Fortran read error on namelist. GLM crashes at startup with parse error."
    error_pattern: "error reading namelist"
    detection_method: log_match
  diagnosis:
    root_cause: "String values use double quotes instead of single quotes in Fortran namelist"
    explanation: >
      Fortran namelists require single-quoted strings ('value'). Double-quoted strings
      ("value") cause a parse error. This is a common mistake when generating namelists
      from Python, which prefers double quotes.
    affected_components: [generate_glm_nml]
  remedy:
    action: "Replace all double quotes with single quotes in glm3.nml"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "sed -i \"s/\\\"/'/g\" glm3.nml"
    prevention: "generate_glm_nml uses fmt_str() which always produces single quotes"
  severity: fatal
  cross_references: []

- id: dt_006
  stage: s1_lake_identification
  failure_domain: parameter_format
  symptom:
    description: "GLM crashes at startup with layer thickness or morphometry error."
    error_pattern: "layer thickness"
    detection_method: log_match
  diagnosis:
    root_cause: "H[] and A[] arrays not monotonically increasing (bottom to top)"
    explanation: >
      GLM requires the morphometry arrays H[] (elevation) and A[] (area) to be in
      ascending order from the lake bottom to the surface. If they are reversed
      (top to bottom), or contain non-monotonic values, GLM cannot construct the
      Lagrangian layer structure and crashes.
    affected_components: [build_morphometry, morphometry_block]
  remedy:
    action: "Sort H[] in ascending order and ensure A[] corresponds correctly"
    tool_to_run: build_morphometry
    manual_steps:
      - "Verify H[0] < H[1] < ... < H[n]"
      - "Verify A[0] <= A[1] <= ... <= A[n]"
      - "A[0] should be 0 or near-0 (lake bottom)"
    prevention: "build_morphometry validates monotonicity in validate_outputs()"
  severity: fatal
  cross_references: [dt_007, dt_008]

- id: dt_007
  stage: s1_lake_identification
  failure_domain: parameter_format
  symptom:
    description: "Lake volume is unrealistic. Stratification develops at wrong depth."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Depth-area curve has too few points (< 5)"
    explanation: >
      With fewer than 5 points in the hypsographic curve, the volume approximation
      is very crude. This can cause the lake to have significantly wrong total volume,
      which affects all water balance calculations and stratification dynamics.
    affected_components: [build_morphometry]
  remedy:
    action: "Interpolate to at least 10-15 depth levels"
    tool_to_run: build_morphometry
    manual_steps:
      - "Use --num_levels 15 (default) when running build_morphometry"
    prevention: "build_morphometry defaults to 15 levels"
  severity: degraded
  cross_references: [dt_006]

- id: dt_008
  stage: s6_namelist
  failure_domain: parameter_format
  symptom:
    description: "GLM crashes: bsn_vals does not match number of H/A values"
    error_pattern: "bsn_vals"
    detection_method: log_match
  diagnosis:
    root_cause: "bsn_vals manually set but does not match actual H[] and A[] array lengths"
    explanation: >
      The bsn_vals parameter must exactly equal the number of elements in both H[]
      and A[] arrays. If set manually (e.g., from an old namelist), it may not match
      the arrays generated by build_morphometry.
    affected_components: [generate_glm_nml, morphometry_block]
  remedy:
    action: "Auto-compute bsn_vals from len(H) in generate_glm_nml"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "Count elements in H array and set bsn_vals to that number"
    prevention: "generate_glm_nml auto-computes bsn_vals = len(H)"
  severity: fatal
  cross_references: [dt_006]

- id: dt_009
  stage: s5_init_profiles
  failure_domain: parameter_format
  symptom:
    description: "GLM crashes: lake_depth exceeds morphometry maximum depth"
    error_pattern: "lake_depth"
    detection_method: log_match
  diagnosis:
    root_cause: "init_profiles lake_depth > max(H) - min(H)"
    explanation: >
      The initial lake depth cannot exceed the maximum depth defined by the
      morphometry (crest_elev - bottom_elev). If it does, GLM cannot create
      the initial layer structure.
    affected_components: [build_init_profiles, init_profiles_block]
  remedy:
    action: "Clip lake_depth to morphometry range"
    tool_to_run: build_init_profiles
    manual_steps:
      - "Set lake_depth = max(H) - min(H) or slightly less"
    prevention: "build_init_profiles clips when --max_morph_depth is provided"
  severity: fatal
  cross_references: []

- id: dt_010
  stage: s6_namelist
  failure_domain: parameter_format
  symptom:
    description: "num_inflows is 0 but inflow CSV files are referenced. Inflow is silently ignored."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Inconsistency between num_inflows count and inflow file list"
    explanation: >
      If num_inflows = 0, GLM ignores all inflow_fl entries. The lake runs without
      any river input, which may be incorrect. This produces no error message.
    affected_components: [generate_glm_nml, inflow_block]
  remedy:
    action: "Set num_inflows to match the number of inflow CSV files"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "Count inflow CSV files and set num_inflows accordingly"
    prevention: "generate_glm_nml auto-sets num_inflows from inflow_csv argument"
  severity: silent
  cross_references: []

# --- Path Resolution ---

- id: dt_011
  stage: s8_execution
  failure_domain: path_resolution
  symptom:
    description: "Unable to open meteo file. GLM exits immediately."
    error_pattern: "Unable to open"
    detection_method: log_match
  diagnosis:
    root_cause: "meteo_fl path in namelist is relative but GLM run from wrong directory"
    explanation: >
      GLM resolves file paths relative to the current working directory, not the
      namelist file location. If you run GLM from a different directory than where
      the namelist and data files are, all relative paths will fail.
    affected_components: [run_glm, meteorology_block]
  remedy:
    action: "Use absolute paths in namelist, or ensure cd to run directory before executing"
    tool_to_run: run_glm
    manual_steps:
      - "cd to the directory containing glm3.nml before running"
      - "Or convert all paths in glm3.nml to absolute paths"
    prevention: "run_glm uses cwd=run_dir to ensure correct working directory"
  severity: fatal
  cross_references: [dt_012]

- id: dt_012
  stage: s8_execution
  failure_domain: path_resolution
  symptom:
    description: "Unable to open inflow file. GLM exits during setup."
    error_pattern: "Unable to open"
    detection_method: log_match
  diagnosis:
    root_cause: "inflow_fl path does not match actual file location"
    explanation: >
      Same as dt_011 but for inflow files. The inflow_fl path must be resolvable
      from the GLM working directory.
    affected_components: [run_glm, inflow_block]
  remedy:
    action: "Verify all file paths in namelist exist before running GLM"
    tool_to_run: run_glm
    manual_steps:
      - "run_glm preflight check validates all referenced file paths"
    prevention: "run_glm validates met, inflow, and outflow file paths before execution"
  severity: fatal
  cross_references: [dt_011]

# --- Runtime Errors ---

- id: dt_013
  stage: s8_execution
  failure_domain: runtime
  symptom:
    description: "GLM crashes with NaN in temperature. Simulation aborts mid-run."
    error_pattern: "NaN"
    detection_method: log_match
  diagnosis:
    root_cause: "Extremely large wind speed or unrealistic forcing causing numerical instability"
    explanation: >
      Very high wind speeds (>50 m/s sustained), zero timestep, or extreme temperature
      swings can cause the mixing calculations to produce NaN values, which propagate
      through the temperature profile and crash the model.
    affected_components: [meteorology_block, mixing_block]
  remedy:
    action: "Check forcing data for outliers. Ensure dt >= 60 seconds."
    tool_to_run: ""
    manual_steps:
      - "Check WindSpeed column for values > 30 m/s"
      - "Check AirTemp for sudden jumps > 20 degC between timesteps"
      - "Ensure dt = 3600 (standard hourly timestep)"
      - "Try reducing wind_factor if wind data is noisy"
    prevention: "validate_outputs in convert_met_to_glm flags extreme values"
  severity: fatal
  cross_references: []

- id: dt_014
  stage: s8_execution
  failure_domain: runtime
  symptom:
    description: "Ice model produces unrealistic thickness (>5m). Permanent ice cover in warm climate."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Snow accumulation without melt in warm/tropical climate due to temperature data issues"
    explanation: >
      For tropical lakes (latitude < 23), the snowice model should produce negligible
      or zero ice. If ice thickness grows unrealistically, it usually means the
      temperature data has errors (e.g., negative bias) or the snow albedo feedback
      is creating a runaway cooling effect.
    affected_components: [snowice_block, meteorology_block]
  remedy:
    action: "For tropical lakes, verify temperature data. Consider increasing min_layer_thick."
    tool_to_run: ""
    manual_steps:
      - "Check if AirTemp is consistently below 0 degC (wrong for tropical)"
      - "Verify latitude is correct in morphometry block"
      - "GLM handles ice automatically — if data is correct, ice should be zero"
    prevention: "verify latitude and temperature range are consistent"
  severity: degraded
  cross_references: []

- id: dt_015
  stage: s8_execution
  failure_domain: runtime
  symptom:
    description: "Layer merge error or GLM appears to hang in infinite loop"
    error_pattern: "layer"
    detection_method: log_match
  diagnosis:
    root_cause: "max_layer_thick too small relative to lake depth, causing excessive layer splitting"
    explanation: >
      If max_layer_thick is too small, GLM creates many layers that constantly
      split and merge, potentially causing performance issues or numerical errors.
      For very deep lakes (>100m), increase max_layer_thick to 1.0-2.0m.
    affected_components: [glm_setup_block]
  remedy:
    action: "Increase max_layer_thick. For deep lakes (>100m), use 1.0-2.0m."
    tool_to_run: ""
    manual_steps:
      - "Edit glm3.nml: max_layer_thick = 1.0 (for deep lakes)"
      - "Optionally reduce max_layers from 500 to 200"
    prevention: "generate_glm_nml scales max_layer_thick based on depth"
  severity: fatal
  cross_references: []

# --- Dependency Mismatch ---

- id: dt_016
  stage: s3_inflow
  failure_domain: dependency_mismatch
  symptom:
    description: "Inflow timing offset — flow arrives 1 day early or late"
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Timezone mismatch between forcing and inflow data"
    explanation: >
      If the meteorological CSV uses UTC timestamps but the inflow CSV uses
      local time (or vice versa), there is a systematic offset. For Chinese
      lakes (UTC+8), this is an 8-hour shift that can place peak inflows
      at the wrong time of day.
    affected_components: [convert_met_to_glm, convert_inflow_to_glm, time_block]
  remedy:
    action: "Ensure all CSV timestamps use the same timezone as GLM timezone parameter"
    tool_to_run: ""
    manual_steps:
      - "Check timezone parameter in &time block"
      - "Verify met CSV and inflow CSV use consistent time references"
    prevention: "Use the same timezone convention throughout the pipeline"
  severity: silent
  cross_references: [dt_017]

- id: dt_017
  stage: s10_coupling
  failure_domain: dependency_mismatch
  symptom:
    description: "CaMa-Flood discharge is inconsistent with GLM inflow. Water balance does not close."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "CaMa grid cell does not correspond to the actual lake inlet"
    explanation: >
      When extracting CaMa-Flood discharge for GLM inflow, the grid cell must
      be the one immediately upstream of the lake, not the lake cell itself.
      Using the wrong cell produces flow from a different tributary.
    affected_components: [convert_inflow_to_glm, glm_to_cama_outflow]
  remedy:
    action: "Verify spatial alignment of CaMa output point with GLM inflow location"
    tool_to_run: ""
    manual_steps:
      - "Check CaMa river network to find the correct upstream cell"
      - "Compare total inflow volume to expected watershed runoff"
    prevention: "Verify inflow makes hydrological sense (Q ~ P * A * runoff_coeff)"
  severity: silent
  cross_references: [dt_016]

- id: dt_018
  stage: s9_output_analysis
  failure_domain: dependency_mismatch
  symptom:
    description: "Temperature heatmap shows artifacts at depth boundaries. Stripy patterns."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Output nsave too large — misses diurnal cycle and layer dynamics"
    explanation: >
      If nsave is set too high (e.g., 168 = weekly), the output captures only
      snapshots of the evolving layer structure. The Lagrangian layers change
      depth between outputs, creating visual artifacts in the heatmap.
    affected_components: [output_block]
  remedy:
    action: "Set nsave to 24 (daily) or lower for thermal analysis"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "Edit nsave in &output block to 24 (daily, with dt=3600)"
    prevention: "generate_glm_nml defaults to nsave=24"
  severity: degraded
  cross_references: []

# --- Silent Errors (Model Runs, Results Wrong) ---

- id: dt_019
  stage: s6_namelist
  failure_domain: silent_error
  symptom:
    description: "Stratification never develops in deep lake. Surface-to-bottom temp difference < 2 degC."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Kw (light extinction) too high — all solar energy absorbed near surface"
    explanation: >
      High Kw values (>3 m^-1) cause all shortwave radiation to be absorbed in the
      top 1-2 meters. No heat penetrates deeper, so the surface warms but the deep
      water stays cold — BUT wind mixing then immediately redistributes this surface
      heat, preventing stable stratification from developing. Paradoxically, very
      turbid lakes CAN stratify, but the thermocline is very shallow.
    affected_components: [light_block, generate_glm_nml]
  remedy:
    action: "Use literature Kw values. Clear lakes: 0.2-0.5, moderate: 0.5-1.5, turbid: 1.5-3.0"
    tool_to_run: calibrate_glm
    manual_steps:
      - "Check Kw value in &light block"
      - "For clear oligotrophic lakes, start with Kw = 0.3"
      - "For eutrophic lakes with algae, Kw = 1.0-2.0"
      - "Secchi depth relationship: Kw ~ 1.7 / Secchi_depth_m"
    prevention: "generate_glm_nml defaults to Kw=0.5 (moderate)"
  severity: silent
  cross_references: [dt_021]

- id: dt_020
  stage: s2_met_forcing
  failure_domain: silent_error
  symptom:
    description: "Summer surface temperatures 3-5 degC too warm. Excessive heating."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Longwave radiation double-counted — both computed internally and provided in forcing"
    explanation: >
      GLM has two longwave modes: 'LW_IN' (incoming LW provided in forcing CSV)
      and 'LW_CC' (computed from cloud cover). If lw_type='LW_CC' but the forcing
      CSV also contains a LongWave column, the column is ignored. But if
      lw_type='LW_IN' and the LW values are too high (e.g., from a different sensor
      or double-counting), the lake receives excess thermal radiation.
    affected_components: [meteorology_block, convert_met_to_glm]
  remedy:
    action: "Set lw_type consistently: 'LW_IN' if forcing has measured/modeled LW, 'LW_CC' if only cloud cover"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "Check if LongWave column in met CSV contains real incoming LW data"
      - "If so, use lw_type = 'LW_IN'"
      - "If LW is computed from cloud cover, use lw_type = 'LW_CC' and provide Cloud column instead"
    prevention: "generate_glm_nml defaults to LW_IN when CMFD/MSWX LW data is available"
  severity: silent
  cross_references: []

- id: dt_021
  stage: s6_namelist
  failure_domain: silent_error
  symptom:
    description: "Mixing too strong — no thermal stratification develops even in summer"
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "coef_wind_stir or wind_factor too high for sheltered or small lake"
    explanation: >
      Large wind_factor (>1.5) or coef_wind_stir (>0.8) can prevent stratification
      by mixing surface heat into deeper water faster than solar heating can maintain
      the temperature gradient. Small sheltered lakes need lower values.
    affected_components: [mixing_block, meteorology_block]
  remedy:
    action: "Reduce wind_factor or coef_wind_stir for small/sheltered lakes"
    tool_to_run: calibrate_glm
    manual_steps:
      - "Start with wind_factor = 0.7-0.8 for small sheltered lakes"
      - "Start with coef_wind_stir = 0.2-0.3 for small lakes"
    prevention: "calibrate_glm optimizes these parameters against observed temperature"
  severity: silent
  cross_references: [dt_019]

- id: dt_022
  stage: s3_inflow
  failure_domain: silent_error
  symptom:
    description: "Artificial cold or warm layer forms at wrong depth. Density instability."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Inflow salinity set to non-zero when lake is freshwater"
    explanation: >
      GLM computes inflow density from both temperature AND salinity. If the inflow
      CSV has SALT = 0.5 psu (a small non-zero value) but the lake is fresh (SALT = 0),
      the inflow is denser than expected and inserts deeper than it should. This creates
      an artificial intrusion layer that disrupts the natural thermal structure.
    affected_components: [convert_inflow_to_glm, inflow_block]
  remedy:
    action: "Set inflow SALT = 0.0 for all freshwater lakes"
    tool_to_run: convert_inflow_to_glm
    manual_steps:
      - "Check SALT column in inflow CSV — should be 0.0 for freshwater"
      - "convert_inflow_to_glm defaults to salinity=0.0"
    prevention: "convert_inflow_to_glm defaults to --salinity 0.0"
  severity: silent
  cross_references: [dt_004]

# --- Miyun Validation Findings (2026-03-22) ---

- id: dt_023
  stage: s8_execution
  failure_domain: silent_error
  symptom:
    description: "Surface T asymptotes to 0.002 C but never crosses 0 C. No ice forms despite air temp reaching -15 C. All mixing/wind/LW parameters exhaustively tested."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Missing dt_iceon_avg parameter in &snowice block (see dt_027). Originally diagnosed as thermal inertia issue, but true cause was the missing ice onset parameter."
    explanation: >
      Exhaustively tested: coef_wind_stir 0.18-0.40, wind_factor 0.7-1.0, lw_factor
      0.50-1.00, coef_mix_conv 0.05-0.20, sed_temp_mean 5-8 — NONE fixed the problem.
      The 0.002 C floor was consistent across ALL parameter combinations. Root cause
      was dt_iceon_avg missing from snowice block (dt_027). After adding dt_iceon_avg=0.02,
      ice forms correctly (71 days/yr, max 0.28m on Miyun).
    affected_components: [snowice_block, generate_glm_nml]
  remedy:
    action: "Add dt_iceon_avg=0.02 and min_ice_thickness=0.001 to &snowice block"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "See dt_027 for full fix"
    prevention: "generate_glm_nml now always includes dt_iceon_avg and min_ice_thickness"
  severity: silent
  cross_references: [dt_027, dt_014]

- id: dt_024
  stage: s2_met_forcing
  failure_domain: silent_error
  symptom:
    description: "GLM met CSV has zero precipitation (Rain=0, Snow=0) for entire simulation. No direct rainfall on lake surface."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "convert_met_to_glm.py does not extract CMFD precipitation. VIC forcing files may not have precipitation mapped to GLM Rain/Snow columns."
    explanation: >
      Miyun Reservoir receives ~480 mm/yr precipitation but the met CSV has Rain=0 and
      Snow=0 for all timesteps. This affects water balance (no direct rainfall) and ice
      formation (no snow on lake). The lake water balance is purely inflow-driven.
    affected_components: [convert_met_to_glm]
  remedy:
    action: "Add precipitation extraction to convert_met_to_glm.py using CMFD prec variable"
    tool_to_run: convert_met_to_glm
    manual_steps:
      - "Extract CMFD precipitation (mm/3hr) and convert to m/day"
      - "Split rain vs snow using air temperature threshold at 0 degC"
      - "Validate: annual sum should approximate basin MAP in meters (e.g., 0.48 m for Miyun)"
    prevention: "validate_outputs() checks that Rain column sum > 0 for simulations > 1 year"
  severity: silent
  cross_references: [dt_001]

- id: dt_025
  stage: s6_namelist
  failure_domain: parameter_format
  symptom:
    description: "GLM crashes at startup when timefmt=3 but start/stop are datetime strings"
    error_pattern: "error reading"
    detection_method: log_match
  diagnosis:
    root_cause: "generate_glm_nml.py hardcoded timefmt=3 (seconds since epoch) but generates datetime string start/stop values like '2001-01-01 00:00:00'"
    explanation: >
      timefmt=2 expects datetime strings ('YYYY-MM-DD HH:MM:SS'), timefmt=3 expects
      integer seconds. The generator always outputs datetime strings but set timefmt=3,
      causing a format mismatch. Fixed by auto-detecting: if start contains '-', use
      timefmt=2.
    affected_components: [generate_glm_nml, time_block]
  remedy:
    action: "Auto-detect timefmt from start date format in generate_glm_nml.py"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "Check start and stop format — if they contain '-', set timefmt=2"
      - "If they are integer seconds, set timefmt=3"
    prevention: "generate_glm_nml.py now auto-detects timefmt from start format"
  severity: fatal
  cross_references: [dt_005]

- id: dt_026
  stage: s2_met_forcing
  failure_domain: silent_error
  symptom:
    description: "subdaily=.true. with 3-hourly CMFD forcing produces flat temperature (max ~4.5 C). No seasonal cycle despite correct forcing data."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Timestamp alignment issue between 3-hourly CMFD forcing and GLM internal dt=3600s. GLM may not correctly interpolate between 3-hourly records."
    explanation: >
      With met_miyun.csv (3-hourly, 29217 rows) and subdaily=.true., GLM produces
      unrealistic output: max surface T = 4.55 C instead of ~30 C. The same forcing
      data averaged to daily with subdaily=.false. produces correct seasonal cycle.
      Suggests a parsing or interpolation bug with 3-hourly data.
    affected_components: [meteorology_block, convert_met_to_glm]
  remedy:
    action: "Use daily forcing with subdaily=.false. for CMFD data until 3-hourly parsing is debugged"
    tool_to_run: convert_met_to_glm
    manual_steps:
      - "Average 3-hourly forcing to daily before providing to GLM"
      - "Validate first week of output matches expected seasonal pattern"
    prevention: "Default to subdaily=.false. with daily met. Only use subdaily=.true. with hourly (not 3-hourly) data."
  severity: silent
  cross_references: [dt_020]

- id: dt_027
  stage: s6_namelist
  failure_domain: silent_error
  symptom:
    description: "Zero ice formation despite sub-zero air temperatures. Surface temp asymptotes to 0.002 C but never freezes. All ice columns remain zero."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Missing dt_iceon_avg and min_ice_thickness parameters in &snowice block. Without these, GLM ice model is silently disabled."
    explanation: >
      The &snowice block in most GLM examples only includes snow_albedo_factor,
      snow_rho_max, and snow_rho_min. But GLM v3.3.3 requires dt_iceon_avg (the
      ice onset averaging period in days) and min_ice_thickness to actually trigger
      ice formation. Without dt_iceon_avg, the surface temperature approaches 0 C
      but never crosses it — the energy balance solver hits a numerical floor at
      ~0.002 C. Setting dt_iceon_avg=0.02 (averaging over ~30 minutes) enables ice.
      Values >0.04 days can disable ice again on deep lakes.
    affected_components: [snowice_block, generate_glm_nml]
  remedy:
    action: "Add dt_iceon_avg and min_ice_thickness to &snowice block"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "Add to &snowice: dt_iceon_avg = 0.02"
      - "Add to &snowice: min_ice_thickness = 0.001"
      - "For deep reservoirs (>50m), dt_iceon_avg may need to be <=0.04"
      - "For shallow lakes (<20m), dt_iceon_avg = 0.05-0.10 may work"
    prevention: "generate_glm_nml always includes dt_iceon_avg=0.02 and min_ice_thickness=0.001 in snowice block"
  severity: silent
  cross_references: [dt_023, dt_014]

# --- AED2 Configuration (Phytoplankton / Water Quality) ---

- id: dt_028
  stage: s7_aed_config
  failure_domain: aed2_config
  symptom:
    description: "GLM-AED2 crashes at startup with module initialization error when phytoplankton is enabled."
    error_pattern: "Error initializing module|Missing variable|aed_phytoplankton"
    detection_method: runtime_error
  diagnosis:
    root_cause: "Phytoplankton module enabled without required dependency modules (oxygen, nitrogen, phosphorus, organic_matter)"
    explanation: >
      The &aed_phytoplankton block couples with oxygen (photosynthetic O2 production),
      nitrogen (NO3/NH4 uptake), phosphorus (PO4 uptake), and organic matter (excretion/mortality
      products). If any dependency module is missing from the &aed_models list, AED2 cannot
      find the required state variables and crashes at initialization. Additionally, diatoms
      require the silica module (&aed_silica) for Si uptake.
    affected_components: [generate_aed_config, aed_models_block]
  remedy:
    action: "Ensure all dependency modules are in the &aed_models list before aed_phytoplankton"
    tool_to_run: generate_aed_config
    manual_steps:
      - "Add to &aed_models: 'aed_oxygen', 'aed_nitrogen', 'aed_phosphorus', 'aed_organic_matter'"
      - "If diatoms are enabled, also add 'aed_silica'"
      - "Module order in &aed_models list matters — dependencies must come before dependents"
      - "Use generate_aed_config.py with --modules including all dependencies (auto-added by tool)"
    prevention: "generate_aed_config.py auto-adds missing dependencies via ensure_phyto_dependencies()"
  severity: fatal
  cross_references: []

- id: dt_029
  stage: s7_aed_config
  failure_domain: aed2_config
  symptom:
    description: "AED2 runs successfully but phytoplankton biomass collapses to near-zero within weeks. Chlorophyll-a is unrealistically low (<0.1 ug/L) even for eutrophic lakes."
    error_pattern: "PHY_tchla.*0\\.0|PHY_diatom.*0\\.0"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Inflow CSV has no nutrient columns — AED2 receives zero external nutrient loading"
    explanation: >
      When the inflow CSV only contains FLOW, TEMP, SALT (no NIT_nit, NIT_amm, PHS_frp, etc.),
      AED2 runs with zero external nutrient input. The initial nutrient pool is consumed by
      phytoplankton within the first few weeks, after which growth becomes nutrient-limited.
      This produces unrealistically oligotrophic conditions regardless of the actual trophic
      state of the lake. The simulation runs without errors — only the results are wrong.
      This is the most common AED2 setup mistake.
    affected_components: [configure_inflow_wq, inflow_block, init_profiles_block]
  remedy:
    action: "Add nutrient concentrations to inflow CSV using configure_inflow_wq.py"
    tool_to_run: configure_inflow_wq
    manual_steps:
      - "Run configure_inflow_wq.py --inflow_csv <path> --trophic <state> --output <path>"
      - "Update glm3.nml &inflow block: inflow_varnum = 17, add all WQ vars to inflow_vars"
      - "Update &init_profiles: num_wq_vars, wq_names, wq_init_vals for AED2 variables"
      - "Verify nutrient concentrations are in mmol/m3 (AED2 internal units), NOT mg/L"
    prevention: "configure_inflow_wq.py generates complete inflow CSV with trophic-state presets"
  severity: silent
  cross_references: [dt_028]

- id: dt_030
  stage: s6_namelist
  failure_domain: aed2_config
  symptom:
    description: "GLM-AED2 crashes at startup with WQ initialization error. Error references num_wq_vars or wq_init_vals count."
    error_pattern: "wq_init_vals|num_wq_vars|init_profiles"
    detection_method: runtime_error
  diagnosis:
    root_cause: "Number of WQ initial values does not match num_wq_vars * num_depths"
    explanation: >
      The &init_profiles block in glm3.nml requires wq_init_vals to have exactly
      num_wq_vars * num_depths values. Each WQ variable needs one concentration value
      per depth level. For example, with 14 WQ variables and 3 depth levels, you need
      42 values in wq_init_vals. A mismatch crashes GLM at startup. The wq_names list
      must also match the AED2 variable names exactly (e.g., 'OXY_oxy' not 'oxygen').
    affected_components: [generate_glm_nml, init_profiles_block]
  remedy:
    action: "Ensure wq_init_vals has exactly num_wq_vars * num_depths values"
    tool_to_run: generate_glm_nml
    manual_steps:
      - "Count WQ variables in aed2.nml — each module contributes state variables"
      - "Set num_wq_vars = total count of WQ state variables"
      - "Provide num_depths values per variable in wq_init_vals (comma-separated)"
      - "Use AED2 variable names in wq_names: OXY_oxy, NIT_nit, NIT_amm, PHS_frp, etc."
      - "Typical values: OXY_oxy=300, NIT_nit=5, NIT_amm=2, PHS_frp=0.1, OGM_doc=50"
    prevention: "Auto-generate wq_init_vals from aed2.nml module list and initial concentrations"
  severity: fatal
  cross_references: [dt_028, dt_029]

# ---------------------------------------------------------------------------
# Triplets added by self-improve runs after the original corpus was published.
# Recovered 2026-08-12 and merged back; the block above is the published base,
# byte-for-byte. See REPORT.md.
# ---------------------------------------------------------------------------
- id: dt_031
  symptom:
    description: Requested comparison variable is discharge/streamflow at a creek or river gauge; all
      metrics null; lookup_hydrolakes finds no lake (or only endorheic sloughs with dis_avg=0.0) at the
      site.
  diagnosis:
    root_cause: 'Domain mismatch: GLM is a 1D vertical lake/reservoir thermodynamic model with no rainfall-runoff
      process and no discharge output variable. lake.csv ''Tot Outflow Vol'' is a prescribed boundary
      rule, not simulated discharge. No variable->metric_family contract can produce discharge_m3s.'
  remedy:
    action: 'REJECT_WRONG_MODEL. Do not run forcing/calibration. Use the SKILL.md Applicability Guard:
      gate on lookup_hydrolakes (no lake within radius / dis_avg==0.0 / lake too small or >5km away /
      discharge requested). Validate GLM only against in-lake temperature profiles, surface/bottom temp,
      lake level, or ice thickness.'
  format_spec_violated: none (applicability/domain rule, not a format rule)
  canonical_intent: ki_local_if_pass
  added_by_run: GLM_retry1
- id: dt_032
  symptom:
    description: GLM-AED2 runs to completion (exit 0, "Model Run Complete") but ALL AED2 water-column
      STATE variables are NaN/fill everywhere - output.nc OXY_oxy/NIT_*/PHS_frp etc. are entirely _FillValue
      (parse_aed_output flags all_fill_in_output_nc), and csv_point WQ columns print '-nan' from the first
      timestep while temp/salt are finite. TOT_tn/TOT_tp read 0.0. Occurs specifically when the &aed2_models
      list includes aed2_phytoplankton (and/or aed2_silica, aed2_noncohesive) with the glm-aed v3.3.3
      binary and the shipped aed2_phyto_pars.nml diatom group.
  diagnosis:
    root_cause: The phytoplankton/silica/noncohesive modules poison the coupled AED2 ODE solver with a
      NaN that propagates to the ENTIRE water-column state vector (AED2 solves all S(i) vars jointly;
      one NaN nulls all of them). repair_state=.true. does not recover it and GLM does NOT abort - it
      silently writes fill/NaN for every WQ var. The shipped examples/Sparkling-style glm_aed2_phyto_test
      reference is itself broken this way (its wq_summary.json reports TN/TP mean 0.0), so it cannot be
      trusted as a working phyto template.
  remedy:
    action: 'Use the simplified core-nutrient module set that produces finite WQ state: &aed2_models models
      = ''aed2_oxygen'',''aed2_nitrogen'',''aed2_phosphorus'',''aed2_organic_matter'',''aed2_totals''
      (10 water-column vars: OXY_oxy, NIT_amm, NIT_nit, PHS_frp, OGM_doc/poc/don/pon/dop/pop). Drop aed2_phytoplankton,
      aed2_silica, aed2_noncohesive. Match num_wq_vars=10 and wq_names in &init_profiles to the registered
      S(1..10) order, and drop SIL_rsi/PHY_diatom/NCS_ss1 from inflow_vars. This yields finite TN/TP/NH3-N.
      For nutrient (TN/TP/NH3-N) validation, phytoplankton is not required. After fixing, ALWAYS verify
      the first csv_point WQ row is finite (not -nan) before trusting the run.'
  format_spec_violated: AED2 module-coupling / solver stability (silent NaN, not a parser rule)
  canonical_intent: ki_local_if_pass
  added_by_run: GLM_real_case_guokongzhan
- id: dt_033
  symptom:
    description: AED2 enabled and WQ state is finite, but parse_aed_output.py returns an empty timeseries
      (only a 'time' column) and total_nitrogen/total_phosphorus mean 0.0. output.nc WQ vars have shape
      (time, z, lat, lon) = 4-D.
  diagnosis:
    root_cause: parse_aed_output.py assumed 2-D (time, layers) arrays; GLM writes 4-D (time, z, lat, lon)
      with singleton lat/lon. ndim==2 branches were skipped so surface extraction produced nothing and
      nanmean over padded layers gave 0. Separately, generate_glm_nml.py does NOT wire AED2 (emits num_wq_vars=0,
      no &wq_setup, inflow_varnum=3) - AED2 wiring is a manual nml-edit step.
  remedy:
    action: 'parse_aed_output.py now squeezes trailing singleton dims to (time, layers) and flags all-fill
      vars. For surface WQ validation prefer the csv_point output: set in &output csv_point_nlevs/csv_point_at
      (depth from surface with csv_point_frombot=.false.) and csv_point_vars including the AED2 var names;
      GLM writes a clean daily WQ_<depth>.csv. Manually add &wq_setup (wq_lib=aed2, wq_nml_file), num_wq_vars/wq_names/wq_init_vals
      in &init_profiles, and inflow_varnum/inflow_vars to glm3.nml after generate_glm_nml.'
  format_spec_violated: output parsing (array rank) + namelist AED2 wiring gap
  canonical_intent: ki_global
  added_by_run: GLM_real_case_guokongzhan
- id: dt_034
  symptom:
    description: 'Validating a depth-resolved AED2 variable (e.g. OXY_oxy dissolved oxygen) over the FULL
      water column. Two failure modes appear: (1) csv_point fixed-depth output (csv_point_at = 1,5,10,15,20,30,40
      from surface) returns spurious EXACTLY-0.0 values at some interior depths (e.g. 5 m and 20 m) in
      stratified months while neighbouring depths (1 m, 10 m, 40 m) are oxic - a physically impossible
      sandwiched-anoxia profile. (2) Reading the whole DO field with output.nc.variables["OXY_oxy"][:]
      (a 4018 x 500 x 1 x 1, ~500 MB var) SEGFAULTS the python process inside libnetcdf with NO traceback
      (the process just dies after the last print; not an OOM - 100+ GB free).'
  diagnosis:
    root_cause: 'csv_point samples a FIXED depth-below-surface; as the lake level moves and the adaptive
      Lagrangian layers split/merge, the requested fixed depth intermittently lands on a layer boundary
      / below the active column and GLM writes 0.0 (or the oxy_min floor) for that level - so csv_point
      is reliable only for a single near-surface point, NOT for multi-level column statistics. The bulk
      [:] read segfault is an HDF5/libnetcdf chunk-decompression issue on the large padded (z=500) variable.
      Both make a naive column-mean wrong: the spurious 0.0s and the crash.'
  remedy:
    action: 'For column / profile WQ statistics read output.nc ONE timestep at a time at only the dates
      you need: oxy_i = np.squeeze(ds.variables["OXY_oxy"][i])[:NS[i]] using NS (active-layer count per
      time) and H (layer-top heights) to get the TRUE depth-resolved profile; never bulk-[:] the padded
      variable. Compute a thickness-weighted column mean (weight = layer thickness from diff(H)) to match
      a depth-uniform profile sampler, and take the top/bottom active layer for surface/bottom DO. Convert
      OXY_oxy mmol/m3 -> mg/L via x32/1000. CALIBRATION LEVER: the shipped Fsed_oxy default (-40 mmol/m2/day
      sediment oxygen demand) OVER-depletes the hypolimnion of meso-/oligotrophic lakes - it drives bottom
      and column DO to ~0 (DeGray AR column-mean PBIAS -48%, NSE -1.8). Reduce Fsed_oxy to ~-12 and raise
      Ksed_oxy (~50) so SOD shuts off as DO falls; this lifted DeGray column-mean PBIAS to -6% / NSE +0.06
      / KGE 0.53 and surface DO to r 0.89 / NSE 0.53 / KGE 0.75. For depthless WQP grab-sample profiles,
      the depth-unambiguous comparison is per-date obs-max <-> sim top-layer (surface DO).'
  format_spec_violated: output extraction (fixed-depth csv_point + bulk netcdf read) + SOD calibration
    default
  canonical_intent: ki_global
  added_by_run: GLM_real_case_degray_do
- id: dt_036
  symptom:
    description: 'Validating simulated water TEMPERATURE against an observation taken at a FIXED depth
      (thermistor chain, profile logger, buried sensor at 5/10/20/50/100 cm). output.nc has no variable
      that is "temperature at 0.5 m": temp is (time, z=500, lat, lon) on the ADAPTIVE LAGRANGIAN grid,
      so column index k is a different physical depth at every timestep (NS, the active-layer count, changes
      daily). Taking temp[:, k] for a fixed k, or using lake.csv surface_temp for every depth, silently
      compares the model at a WANDERING depth - the series looks plausible (right seasonal shape) but
      the depth it represents drifts, and any stratified-season metric is meaningless. Before 2026-08-11
      no KI tool exposed a fixed-depth series at all: parse_glm_output.py returned only global min/max/mean
      of the whole temp array plus lake.csv surface temperature.'
  diagnosis:
    root_cause: GLM discretises the column into Lagrangian layers that split, merge and move with volume
      change; z[] holds LAYER TOP heights ABOVE THE LAKE BOTTOM (ascending, valid only for the first NS
      entries) and the water surface is z[NS-1], which itself moves with lake level. Depth below surface
      therefore has to be recomputed every timestep as z[NS-1] - layer_centre. The dag comparison caveat
      ("Compare at matched depths; Lagrangian layers shift between outputs so interpolate to fixed observation
      depths") states exactly this requirement.
  remedy:
    action: 'Use parse_glm_output.py --depths "<d1,d2,...>" --depth_timeseries <csv> (added 2026-08-11).
      It reads output.nc ONE timestep at a time (dt_034 - a bulk [:] read of the padded z=500 variable
      segfaults libnetcdf), rebuilds layer centres from z[] and NS, converts to depth-below-surface, np.interp-s
      onto the requested depths and returns NaN (never a clamped bottom value) for depths below the lake
      bottom; a water_depth_m column records the simulated column depth for each row. Two further alignment
      traps the same stage: (1) GLM writes the state at the END of each simulated day (first record is
      start_date + 24 h), so subtract one day before pairing with a daily-mean observation; (2) the FINAL
      timestep is flushed TWICE (last date repeated, second copy stamped 23:00) - drop duplicate dates
      or pandas raises "cannot reindex on an axis with duplicate labels". csv_point (dt_033) is an alternative
      only for a single near-surface point and carries the spurious-0.0 risk of dt_034.'
  format_spec_violated: output extraction (fixed-depth interpolation on an adaptive grid)
  canonical_intent: ki_global
  added_by_run: GLM_real_case_lake_catoma_ismn
- id: dt_037
  symptom:
    description: 'Scoring GLM against an in-situ TEMPERATURE network (ISMN KISSPATH_DATA/ismn_clean.db
      - SCAN / SNOTEL / USCRN / COSMOS-UK ... soil and near-surface temperature) with hand-rolled sqlite
      code. Three failure modes: sqlite3.OperationalError "unable to open database file" on the read-only
      mount; a depth mismatch where the model is sampled at 0.51 m or 1.02 m because the stations table
      depth_cm label (51, 102) was divided by 100; and inflated / noisy series because multiple sensors
      at the same nominal depth and non-good QC rows were not aggregated or filtered.'
  diagnosis:
    root_cause: ismn_clean.db is WAL-journalled on read-only media, so a plain file:...?mode=ro URI still
      fails - immutable=1 is required (same class as the MODFLOW6 yearbook.db trap). depth_cm is a ROUNDED
      label; the physical depth is depth_from_m / depth_to_m in metres (0.0508, 0.1016, 0.2032, 0.508,
      1.016 for the standard SCAN 2/4/8/20/40-inch stack). The observations table holds one row per (date,
      depth, SENSOR) with an ISMN qc_flag; only rows starting with G are clean.
  remedy:
    action: 'Use tools/s9_output_analysis/load_ismn_obs.py (added 2026-08-11): --list (+ --lat/--lon/--radius_km)
      discovers qc_pass stations near the lake, and --station/--network/--variable/--start/--end writes
      a long-form date,depth_cm,depth_m,value CSV with G-flag filtering and per-(date,depth) sensor averaging
      already applied. Pair the model against depth_m (metres), not depth_cm/100, and feed those same
      depths to parse_glm_output.py --depths so the comparison is depth-matched on both sides (dt_036).
      NOTE on interpretation: a soil-temperature station is a PROXY for the lake thermal regime - the
      seasonal pattern (r) is the KI-validity signal, while magnitude (PBIAS) carries a real physical
      offset because water has far more thermal inertia than soil (Lake Catoma 2015-2020: winter sim water
      ~11.5 C vs obs soil ~7.5 C at 5 cm, PBIAS +14.9%, r 0.94). Do not calibrate GLM to remove that offset.'
  format_spec_violated: observation ingestion (read-only WAL sqlite, depth units, QC/sensor aggregation)
  canonical_intent: ki_global
  added_by_run: GLM_real_case_lake_catoma_ismn
- id: dth
  stage: s4_outflow
  failure_domain: outflow_geometry
  symptom:
    description: 'Configured outflow is numerically valid, but the simulated lake level or release volume
      is implausible because the outlet geometry was left at the generic KI defaults: crest_width=100 m,
      bsn_len_outl=100 m, bsn_wid_outl=50 m, or outflow_elev=crest_elev-5 m.'
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'tools/s4_outflow/configure_outflow.py can run with default outlet dimensions when site-specific
      spillway and withdrawal geometry were not provided.'
    explanation: >
      In natural mode GLM computes overflow from crest_width and crest_factor, and in managed outlet modes
      generate_glm_nml.py carries outl_elvs, bsn_len_outl, and bsn_wid_outl from outflow_config.json into
      the &outflow block. Defaults are useful for a first executable run, but they are not a calibrated
      dam-operation rule and can silently bias lake level and downstream coupling.
    affected_components: [configure_outflow, generate_glm_nml, outflow_block]
  remedy:
    action: 'Re-run configure_outflow.py with observed crest/outlet geometry or a documented reservoir-release
      schedule, then inspect outflow_config.json before s6.'
    tool_to_run: configure_outflow
    manual_steps:
      - 'For natural overflow, set --crest_elev, --crest_width, and --crest_factor from the real spillway.'
      - 'For managed release, set --outflow_elev, --bsn_len_outl, --bsn_wid_outl, and --schedule_csv or --flow.'
      - 'Verify outflow_config.json does not contain unreviewed default dimensions for the target lake.'
    prevention: 'Treat s4 defaults as executable placeholders unless the target lake actually matches them.'
  severity: silent
  cross_references: [dt_017, dt_011, dt_012]
- id: dt_iceon_avg
  stage: s6_namelist
  failure_domain: snowice_config
  symptom:
    description: 'Ice remains zero or nearly zero in a freezing-climate run even though glm3.nml contains
      an &snowice block and sub-zero air temperatures occur.'
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'The &snowice dt_iceon_avg/min_ice_thickness settings are missing, stale, or unsuitable
      for the lake depth; values around or above 0.05 days disabled ice again in the Miyun deep-reservoir
      validation.'
    explanation: >
      generate_glm_nml.py now writes dt_iceon_avg = 0.02 and min_ice_thickness = 0.001, matching the
      Miyun validation fix. If glm3.nml was hand-edited, generated by an older tool copy, or overwritten
      from an external GLM example, the parameter can be absent or too large even though other snowice
      options are present.
    affected_components: [generate_glm_nml, snowice_block, run_glm]
  remedy:
    action: 'Inspect glm3.nml &snowice before s8 and regenerate with this KI tool if the ice-onset settings
      are absent or too large.'
    tool_to_run: generate_glm_nml
    manual_steps:
      - 'Confirm &snowice includes dt_iceon_avg = 0.02 and min_ice_thickness = 0.001.'
      - 'For deep reservoirs (>50 m), keep dt_iceon_avg <= 0.04 days.'
      - 'After s8, check lake.csv blue/white ice thickness columns and surface temperature behavior.'
    prevention: 'Use tools/s6_namelist/generate_glm_nml.py rather than copying a snowice block from generic GLM examples.'
  severity: silent
  cross_references: [dt_027, dt_023, dt_014]
- id: dt_035
  stage: s9_output_analysis
  failure_domain: observation_support
  symptom:
    description: 'Dissolved oxygen validation reports an acceptable column-mean metric for depthless grab
      samples while surface and bottom dissolved oxygen tell opposite stories.'
    error_pattern: ''
    detection_method: metric_comparison
  diagnosis:
    root_cause: 'Depthless OXY_oxy observations do not define a vertical support, while dag.yaml exposes
      OXY_oxy as point_time_series for the 1-D lake column.'
    explanation: >
      A thickness-weighted column mean is an invented aggregate when the provider gives no sample depth.
      In the DeGray DO case documented in SKILL.md, a column-mean score hid a good surface match and a
      failed hypolimnetic match. For depthless WQP grab samples, the KI-valid comparison is the simulated
      top active layer against per-date near-surface observations; bottom or hypolimnetic DO requires
      depth-resolved observations.
    affected_components: [parse_aed_output, parse_glm_output, dag_observability]
  remedy:
    action: 'Score depthless OXY_oxy observations as surface DO only, or mark bottom/column DO validation
      as requires_data until depth-resolved observations are available.'
    tool_to_run: parse_aed_output
    manual_steps:
      - 'For surface DO, read the top active layer or a validated near-surface csv_point output.'
      - 'Do not headline a thickness-weighted column mean unless the observation source is an actual depth-resolved profile.'
      - 'Convert OXY_oxy from mmol/m3 to mg/L with value * 32 / 1000 before comparing to mg/L observations.'
    prevention: 'Follow dag.yaml observability and docs/validation_convention.yaml support rules before computing WQ metrics.'
  severity: silent
  cross_references: [dt_034, dt_033]
