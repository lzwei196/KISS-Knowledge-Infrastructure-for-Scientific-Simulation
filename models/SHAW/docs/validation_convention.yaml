# Literature-grounded validation convention for SHAW outputs declared in dag.yaml.
# Blocks are keyed by the model's own dag_variable names, as required by the Step-B task.
# Bands are plain numbers interpreted by `direction`. Numeric bands are cited only to
# fetched full texts. Several SHAW papers report achieved benchmark skill rather than
# formal pass/fail tiers; those bands are marked as empirical benchmark envelopes and
# confidence is kept below strong unless multiple fetched benchmarks support the same
# convention.

