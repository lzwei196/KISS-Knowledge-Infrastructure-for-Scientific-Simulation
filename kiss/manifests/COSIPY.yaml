kiss_manifest_version: 1
model: COSIPY
binary_type: Python
verified: observed
install_dir: COSIPY

acquire:
  strategy: pip
  package: cosipy
  produces: cosipy

python_deps: [cosipy]

reference_case: >-
  python -c "import cosipy; print(cosipy.__name__, 'importable')"

notes: >-
  OBSERVED 2026-08-18: `kiss init COSIPY` installed cosipy 0.4.3 into a clean venv
  and the KI's own preflight_check.py passed with no hand-written recipe. The
  package name was resolved from the KI directory name and confirmed by import,
  not assumed from a PyPI name match.
