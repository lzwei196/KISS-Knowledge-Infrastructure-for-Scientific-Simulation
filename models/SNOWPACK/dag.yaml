  citation_index:
    gunther2019_snowpack_uncertainty_variance:
      short_citation: "Günther et al. 2019"
      doi: "10.1029/2018WR023403"
      note: "Sobol variance-based SA of ~230,000 snow-model realizations vs SWE at Kühtai; precipitation/air-temperature/radiation dominate accumulation, air-temperature/longwave dominate ablation; high sensitivity to liquid-water transport scheme and to albedo during ablation."
    richter2020_snowpack_stability_sobol:
      short_citation: "Richter et al. 2020"
      doi: "10.5194/nhess-20-2873-2020"
      note: "Sobol total-order SA (14,000 SNOWPACK sims/scenario) of SK38 and critical crack length to meteorological forcing; precipitation most sensitive, air temperature dominant in weak-layer formation, shortwave and RH least influential."
    sauter2015_snowpack_variance_decomposition:
      short_citation: "Sauter & Obleitner 2015"
      doi: "10.5194/gmd-8-3911-2015"
      note: "Variance-decomposition uncertainty analysis (Arctic mass balance); longwave radiation uncertainty dominates energy balance and is comparable to +/-25% precipitation uncertainty for modeled snow depth. Cross-model forcing-sensitivity reference."
    keenan2021_snowpack_firn_density_winddrift:
      short_citation: "Keenan et al. 2021"
      doi: "10.5194/tc-15-1065-2021"
      note: "Drifting-snow compaction scheme for Antarctic firn in SNOWPACK; wind-speed uncertainty is the largest source of near-surface density uncertainty, exceeding densification-model choice."
    schmucki2014_snowpack_evaluation_meteo_input:
      short_citation: "Schmucki et al. 2014"
      doi: "10.1016/j.coldregions.2013.12.004"
      note: "Evaluation of SNOWPACK HS/SWE at three Swiss sites; new-snow density and albedo choice strongly affect modeled snow depth/SWE and the insulation effect; precip/HS input quality controls accuracy."

safety:
  hazards:
    - id: "weather_TA_celsius_as_kelvin"
      kind: "weather_file_semantic"
      description: "Air/ground/surface temperature supplied in Celsius is read as Kelvin (no error); -253 C surface drives runaway accumulation and near-zero outgoing longwave."
      severity: "silent"
    - id: "weather_RH_percent_clamped"
      kind: "weather_file_semantic"
      description: "RH supplied as 0-100% is clamped to the 0-1 fraction maximum (1.0), forcing perpetual saturation and biasing latent heat / sublimation."
      severity: "silent"
    - id: "weather_PSUM_rate_unit_mismatch"
      kind: "weather_file_semantic"
      description: "Precipitation not expressed as kg/m^2 per model timestep (cumulative vs incremental, mm/day vs per-step, m vs mm) inflates SWE by 24x-1000x."
      severity: "silent"
    - id: "weather_radiation_energy_vs_power"
      kind: "weather_file_semantic"
      description: "ISWR/ILWR in MJ/m^2/day instead of W/m^2 are off by ~86400/1e6, breaking the energy balance (factor ~11.574)."
      severity: "silent"
    - id: "weather_wind_kmh_as_ms"
      kind: "weather_file_semantic"
      description: "Wind in km/h (or knots) read as m/s inflates turbulent transfer coefficients 3-4x and over-erodes snow."
      severity: "silent"
    - id: "weather_HS_cm_as_m"
      kind: "weather_file_semantic"
      description: "Snow depth HS in cm read as m yields a 100x model-vs-obs offset and corrupts HS-driven precipitation correction."
      severity: "silent"
    - id: "weather_pressure_hpa_as_pa"
      kind: "weather_file_semantic"
      description: "Atmospheric pressure in hPa/mbar read as Pa is 100x too low, biasing vapour pressure and air density."
      severity: "silent"
    - id: "weather_nodata_sentinel_mismatch"
      kind: "weather_file_semantic"
      description: "SMET nodata sentinel that does not match the actual missing marker lets sentinel values (e.g. -9999 K) enter as real data, producing NaN/extreme-value crashes."
      severity: "fatal"
    - id: "weather_forcing_gap_exceeds_buffer"
      kind: "weather_file_semantic"
      description: "Forcing gaps larger than the MeteoIO buffer abort with 'no data available'."
      severity: "fatal"
    - id: "soil_volume_fractions_not_unity"
      kind: "soil_semantic"
      description: "Per-layer ice+water+void+soil volume fractions not summing to exactly 1.0 give negative porosity (sum>1) or undefined material (sum<1) and crash the FE solver at init."
      severity: "fatal"
    - id: "soil_layer_thickness_cm_as_m"
      kind: "soil_semantic"
      description: "Layer_Thick in the .sno given in cm is read as m, producing a 100x-too-deep column with huge thermal mass that decouples soil thermal response."
      severity: "silent"
    - id: "ic_zero_thickness_or_reversed_ordering"
      kind: "initial_condition_semantic"
      description: "Zero-thickness layer or reversed soil/snow layer ordering produces a segfault or physically meaningless column."
      severity: "fatal"
    - id: "numeric_thin_pack_temperature_out_of_bound"
      kind: "numerical_instability"
      description: "Thin early-season snowpack (~3 nodes, elements thinner than MINIMUM_L_ELEMENT) plus strong net-longwave cooling ill-conditions the tri-diagonal temperature matrix, driving T~200 K; convergence-based sub-timestep halving exhausts min_allowed_sn_dt (0.01 s) and throws 'Temperature out of bound'."
      severity: "fatal"
    - id: "numeric_adaptive_timestep_flag_partial"
      kind: "numerical_instability"
      description: "ALLOW_ADAPTIVE_TIMESTEPPING=false disables only pre-emptive stability halving; convergence-based halving inside the solver loop remains active and still fires, so the flag does not prevent the thin-pack instability."
      severity: "silent"
    - id: "control_swmode_both_missing_rswr"
      kind: "control_semantic"
      description: "SW_MODE=BOTH with missing/nodata RSWR makes albedo=RSWR/ISWR evaluate to 0, absorbing all shortwave and melting snow far too fast."
      severity: "silent"
    - id: "control_forcing_atmos_missing_ilwr"
      kind: "control_semantic"
      description: "FORCING=ATMOS with missing ILWR assumes zero incoming longwave, producing a severe cold bias and suppressed melt; use FORCING=MASSBAL when only T+P are available."
      severity: "degraded"
    - id: "control_double_counted_precip_hs_and_psum"
      kind: "control_semantic"
      description: "Supplying both HS and PSUM with HS-based precipitation correction enabled double-counts new snow and inflates SWE."
      severity: "silent"
    - id: "control_sensor_height_mismatch"
      kind: "control_semantic"
      description: "HEIGHT_OF_METEO_VALUES / HEIGHT_OF_WIND_VALUE not matching real sensor heights biases Monin-Obukhov turbulent fluxes and melt rate."
      severity: "silent"
    - id: "control_calc_step_length_units"
      kind: "control_semantic"
      description: "CALCULATION_STEP_LENGTH is read in MINUTES; too-large steps destabilize the explicit/adaptive solver and (>60 s-equivalent) flood the HzDump 'Days_between is zero' logic, saturating disk I/O."
      severity: "fatal_or_silent"
  conflicts:
    - id: "io_unit_divergence_smet_input_vs_met_output"
      kind: "weather_file_semantic"
      description: "SNOWPACK uses MKSA units on the .smet FORCING side but writes the .met OUTPUT columns in display units: HS forcing is metres while the .met HS column is centimetres (100x), and TSS forcing is Kelvin while the .met TSS column is Celsius. Downstream converters that comparing .met output to obs must convert cm->m and degC->K and must NOT carry the input MKSA convention over to the output stream."
      severity: "silent"
  validation_limits:
    - "Point-scale 1D column only; no native lateral/distributed routing (use Alpine3D for spatial coupling)."
    - "Brutsaert-style ILWR parameterization with a fixed RH assumption underestimates downwelling longwave at humid maritime sites, causing systematic snow over-accumulation; pass observed RH / correct ILWR there."
    - "Soil temperature and moisture require multi-year spinup (>= ~2 annual cycles; permafrost 10+ years) before production results are trustworthy."
    - "VARIANT must match the climate regime (DEFAULT Alpine, POLAR, ANTARCTICA, NIED); new-snow microstructure and bond-strength constants are hardcoded per variant."
  warnings:
    - "Mass fluxes in the .met file are accumulated over the output interval (TS_DAYS_BETWEEN), not the calculation timestep; do not interpret them as instantaneous rates."
    - "The .pro profile file is block-structured with numeric format-code line prefixes and cannot be read as plain TSV."
    - "New snow ~50-100 kg/m^3 densifies to 300-500 kg/m^3; SWE must remain non-negative and HS returns to ~0 in summer at seasonal sites - departures flag a forcing/unit error."
    - "Several constitutive constants are hardcoded (e.g. solar constant 1366.1 W/m^2, snow emissivity 0.98, ice/water densities 917/1000, latent heats, viscosity floor and 'montana' fudge factors, max grain-growth 5 mm/d); they are not exposed in the .ini and bound the model's adjustable range."
  assumptions:
    - statement: "The model is a single 1D vertical finite-element column at one station; lateral transfers are neglected."
      scope: "all simulations in this binding"
      source: "SNOWPACK general concepts documentation (snowpack.slf.ch doc-release general.html)"
      status: "adopted"
    - statement: "Snow is treated as a three-phase porous medium (ice / liquid water / water vapour) with both energy- and mass-balance closure; surface energy closure is realized through the FE temperature solve and an optional retroactive Neumann->Dirichlet boundary correction."
      scope: "energy and mass balance"
      source: "SNOWPACK general concepts docs; runSnowpackModel boundary-condition and change_bc behavior in Snowpack.cc"
      status: "adopted"
    - statement: "CALCULATION_STEP_LENGTH is interpreted by the model in MINUTES (the operative model truth despite config tooling defaults that treat it as seconds)."
      scope: "timestep configuration"
      source: "SNOWPACK runtime behavior; CALCULATION_STEP_LENGTH handling and HzDump booleanTime hazard-interval logic"
      status: "tentative"
    - statement: "Internal C++ module names and the call graph are taken as authoritative from the libsnowpack source (runSnowpackModel) rather than from the KI's documentation-inferred process list."
      scope: "processes block"
      source: "snowpack/snowpackCore/Snowpack.cc (runSnowpackModel), Laws_sn.cc, Metamorphism.cc, WaterTransport/ReSolver1d, plugins AsciiIO/SmetIO"
      status: "adopted"
