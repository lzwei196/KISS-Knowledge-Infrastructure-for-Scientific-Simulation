  language: c
  implementation:
    id: pyswmm-swmm5
    version: SWMM 5.2.x engine (pyswmm 1.x/2.1 + swmm-toolkit bindings)
    provenance: C; EPA SWMM5 open-source engine (US EPA + CDM-Smith), driven through the pyswmm Python
      API which bundles the compiled engine.
  scientific_reference_version: EPA SWMM 5 (Reference Manual Vol I Hydrology, EPA/600/R-15/162A rev. Jan
    2016; engine line SWMM 5.2.x)
  binary:
    path: KISSPATH_KI_ROOT/SWMM/venv/lib/python3.12/site-packages/swmm/toolkit/libswmm5.so
    type: ELF
pipeline:
  stages:
  - s1_subcatchment_delineation_skill
  - s2_drainage_network_skill
  - s3_rainfall_forcing_skill
  - s4_lid_setup_skill
  - s5_model_assembly_skill
  - s6_execution_skill
  - s7_model_coupling_skill
tools:
  count: 27
  files:
  - tools/run_city_swmm.py
