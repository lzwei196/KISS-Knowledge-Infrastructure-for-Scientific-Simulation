# Grounded in the cached OA full texts (26 papers). VIC is a land-surface hydrology model:
# discharge/runoff, ET, soil moisture, SWE/snow, soil temperature, surface energy fluxes.
# STRONGEST grounding = discharge/runoff: Moriasi et al. 2007 (Table 4 general performance
# ratings) + Moriasi et al. 2015 (updated watershed-scale streamflow criteria) give explicit
# NSE / PBIAS / R2 tiers, corroborated by a VIC-specific benchmark (Xie/China dataset,
# calibrated median monthly NSE 0.56, streamflow bias reduced to 4.4%). ET has a solid multi-site
# FLUXNET benchmark envelope (Ershadi et al. 2013: best models NSE ~0.6, RMSD ~65 W/m^2; "R2>0.5
# considered acceptable"). Soil moisture and SWE have benchmark SKILL ENVELOPES (in-situ/product
# correlation and RMSE) but NO explicit pass/fail tier -> null pass-band + low confidence.
# Soil temperature and total water storage have obs bindings but no fetched numeric threshold ->
# null + weak. NO number is fabricated. Bands are plain numbers read via `direction`
# (see VALIDATION_CONVENTION_SCHEMA.md).
#
# ROUTING CAVEAT (applies to all discharge/runoff blocks): VIC has no internal channel routing;
# OUT_DISCHARGE is emitted only by the optional lake module. Gauge streamflow requires post-hoc
# routing of OUT_RUNOFF + OUT_BASEFLOW through an external routing model before comparison.

