# ========================================================================
# DSSAT Diagnostic Triplets
# ========================================================================
# 56 triplets. Converted 2026-08-12 from the `triplets:` mapping to the
# canonical TOP-LEVEL LIST. Content is byte-verified identical — this changes the
# container only. The two-shape ambiguity is what let the self-improve overlay read
# a corpus as empty and overwrite it.
# ========================================================================

- id: dt_001
  stage: s1_experiment_design
  failure_domain: file_not_found
  symptom:
    description: Simulation terminates immediately with Error 29 — the FileX (.XXX experiment file) cannot
      be located at the constructed path.
    error_pattern: File not found\.\s*Please check file name or create file\.\s*Error number:\s*29
    detection_method: log_match
  diagnosis:
    root_cause: The path constructed by combining PATHEX + FILEX does not resolve to an existing file.
      This occurs when the DSSATPRO.v48 paths are wrong, the FileX is in a different directory, or the
      12-character filename is truncated or misspelled.
    explanation: 'DSSAT constructs experiment file paths by concatenating the experiment directory path
      (PATHEX from DSSATPRO.v48 or batch file) with the 12-character FileX name. The GENERIC_MSG subroutine
      in ERROR.for outputs ''File not found'' for ERRNUM=29. Common causes: (1) batch file points to wrong
      directory, (2) the FileX was renamed or moved, (3) path separator mismatch on Linux vs Windows,
      (4) the 12-char limit was exceeded causing truncation.

      '
    affected_components:
    - Batch file (DSSBatch.v48)
    - DSSATPRO.v48
    - ERROR.for GENERIC_MSG subroutine
  remedy:
    action: Verify the batch file path and FileX name resolve to an existing file.
    tool_to_run: ls -la <PATHEX>/<FILEX>
    manual_steps:
    - Open the batch file (e.g., DSSBatch.v48) and check the FILEX and PATHEX entries.
    - 'Confirm the experiment file exists at the exact path: ls -la <PATHEX>/<FILEX>'
    - Ensure the FileX name is exactly 12 characters (e.g., UFGA7801.SBX) with correct extension.
    - Check DSSATPRO.v48 for correct directory paths if using standard installation.
    - On Linux/macOS, verify case sensitivity of the filename.
    prevention: Always use absolute paths in batch files. Validate file existence before submitting batch
      runs.
  severity: fatal
  cross_references:
  - dt_004
  - dt_040
- id: dt_002
  stage: s1_experiment_design
  failure_domain: missing_section
  symptom:
    description: Simulation terminates with Error 1 — the *TREATMENTS section header cannot be found in
      the experiment file.
    error_pattern: Treatment input section not found.*Error.*1|FIND.*\*TREATMENTS.*FOUND.*0
    detection_method: log_match
  diagnosis:
    root_cause: The experiment file (.XXX) is missing the *TREATMENTS section header, or the section is
      commented out or malformed. The CSREADS.for FIND subroutine searches for GROUP='*TREATMENTS' and
      returns FOUND=0.
    explanation: 'When the FIND subroutine (called from IPEXP and other modules like IPPEST, OPVIEW) scans
      for the section header ''*TREATMENTS'' and reaches end-of-file without finding it, it returns FOUND=0,
      triggering CALL ERROR(ERRKEY,1,FILEX,LINEXP). This can happen when: (1) the FileX is corrupted or
      truncated, (2) the section header is misspelled (e.g., ''*TREATMENT'' without the ''S''), (3) the
      file was edited with a tool that introduced invisible characters or wrong line endings.

      '
    affected_components:
    - InputModule/ipexp.for
    - Utilities/CSREADS.for
    - FileX experiment file
  remedy:
    action: Verify the *TREATMENTS section exists in the FileX with correct formatting.
    tool_to_run: grep -n '\*TREATMENTS' <FILEX>
    manual_steps:
    - Open the experiment file and search for '*TREATMENTS' (case-sensitive, asterisk required).
    - Ensure the header is on its own line starting with '*TREATMENTS' in columns 1-11.
    - Check that no invisible characters (BOM, carriage returns) precede the asterisk.
    - 'Verify the file is not truncated — check that all sections exist: *TREATMENTS, *CULTIVARS, *FIELDS,
      etc.'
    - If the file was exported from Excel or a web tool, convert line endings to Unix (LF) using dos2unix.
    prevention: Use the DSSAT XBuild tool or validated templates to create experiment files. Never hand-edit
      the section headers.
  severity: fatal
  cross_references: []
- id: dt_003
  stage: s1_experiment_design
  failure_domain: silent_default
  symptom:
    description: Simulation runs without error but uses generic default soil properties. Yields are implausible.
      The .SOL file was never read. SLNO field in FileX contains '-99' or blanks.
    error_pattern: SLNO.*-99|SLNO.*\s{3}
    detection_method: file_content_check
  diagnosis:
    root_cause: When SLNO(1:3)=='-99' or SLNO(1:3)=='   ', IPSOIL_Inp.for skips the entire soil file read
      and silently sets SLPF=1.0 and NLAYR=1. No warning is issued.
    explanation: 'In IPSOIL_Inp.for (line ~78), the condition IF (SLNO(1:3).EQ.''   ''.OR.SLNO(1:3).EQ.''-99''.OR.SLNO(8:10).EQ.''-99''.OR.SLNO(8:10).EQ.''   '')
      causes the subroutine to set SLPF=1.0 and NLAYR=1, then return without reading the .SOL file. This
      produces a single-layer default soil that will give unrealistic simulation results. The danger is
      that no error or warning is raised — the simulation appears to complete normally.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - FileX *FIELDS section (SLNO field)
  remedy:
    action: Set a valid 10-character soil profile ID in the *FIELDS section of the FileX.
    tool_to_run: grep -n 'SLNO\|ID_SOIL' <FILEX>
    manual_steps:
    - Open the FileX and locate the *FIELDS section.
    - Find the ID_SOIL column and replace '-99' or blanks with a valid soil profile code (e.g., 'IBBN910030').
    - 'Verify the soil profile exists in the target .SOL file: grep ''<SOIL_ID>'' <SOIL_FILE>'
    - Re-run and check that Summary.OUT shows realistic soil water and yield values.
    prevention: Never leave SLNO as -99 unless intentionally running without soil water simulation. Add
      a pre-flight check that validates SLNO against the .SOL file.
  severity: silent
  cross_references:
  - dt_017
- id: dt_004
  stage: s1_experiment_design
  failure_domain: file_not_found
  symptom:
    description: 'Error 29 or 30 during weather file open — the WSTA code in the FileX does not match
      any available weather file. Message: ''Weather file not found'' or ''Error opening weather file''.'
    error_pattern: Weather file not found|Error opening weather file|ErrCode.*29|ErrCode.*30
    detection_method: log_match
  diagnosis:
    root_cause: The 4-character station code (WSTA) in the FileX *FIELDS section constructs a weather
      filename (e.g., UFGA8401.WTH) that does not exist at PATHWTW. The code in IPWTH_alt.for constructs
      FileWW = WPath + WFile and calls INQUIRE(FILE=FILEWW,EXIST=FEXIST).
    explanation: 'IPWTH_alt.for reads FILEW (12-char weather file name) and PATHWTW (weather path) from
      the .INP file. The weather filename is constructed from the 4-char station code + 2-digit year +
      2-digit sequence number + extension (.WTH). If the station code in the FileX does not match any
      file, FEXIST returns FALSE. ErrCode 29 means the OPEN call failed; ErrCode 30 means the file does
      not exist on disk. The WeatherError subroutine reports the error and terminates the run.

      '
    affected_components:
    - Weather/IPWTH_alt.for
    - FileX *FIELDS section (WSTA field)
    - Weather data directory
  remedy:
    action: Verify the WSTA code in the FileX matches an existing weather file.
    tool_to_run: ls <WEATHER_DIR>/<WSTA>*.WTH
    manual_steps:
    - Open the FileX and find the WSTA (weather station) code in the *FIELDS section.
    - 'List available weather files in the weather directory: ls <WEATHER_DIR>/*.WTH'
    - Confirm the 4-character code matches (e.g., UFGA for UFGA8401.WTH).
    - Check the 2-digit year suffix matches the simulation year.
    - If using multi-year files, ensure NYEAR > 1 in the weather file header.
    prevention: Cross-validate WSTA codes against available weather files before batch submission. Use
      the DSSAT WeatherMan tool to verify weather file naming conventions.
  severity: fatal
  cross_references:
  - dt_001
- id: dt_005
  stage: s2_weather_prep
  failure_domain: parameter_range
  symptom:
    description: Simulation terminates with ErrCode 2 — solar radiation (SRAD) is negative or exceeds
      100 MJ/m2/day. WARNING.OUT shows 'Solar radiation data error on YR DOY'.
    error_pattern: Solar radiation data error on YR DOY.*\d{4}\s+\d{1,3}|SRAD =.*MJ\.m-2\.d-1
    detection_method: log_match
  diagnosis:
    root_cause: DailyWeatherCheck in IPWTH_alt.for (line ~1283) checks IF(SRAD<0.0) ErrCode=2 and IF(SRAD>100.)
      ErrCode=2. The value read from the weather file is outside the valid physical range.
    explanation: 'The DailyWeatherCheck subroutine validates each day''s weather data. SRAD is checked
      for both negative values and values exceeding 100 MJ/m2/day (the theoretical clear-sky maximum at
      any latitude is approximately 45 MJ/m2/day, so 100 is a generous upper bound). Common causes: (1)
      SRAD is in W/m2 instead of MJ/m2/day (see dt_013), (2) missing data coded as a large negative number,
      (3) data corruption.

      '
    affected_components:
    - Weather/IPWTH_alt.for (DailyWeatherCheck)
    - Weather data file (.WTH)
  remedy:
    action: Fix the SRAD values in the weather file to be within 0-100 MJ/m2/day.
    tool_to_run: ''
    manual_steps:
    - Open the weather file and find the line number reported in the error.
    - Check the SRAD column — values should be 0-45 MJ/m2/day for most locations.
    - 'If values are in W/m2, convert: SRAD_MJ = SRAD_Wm2 * 0.0864 (W/m2 * 86400 s/day / 1e6).'
    - If values are negative, replace with measured or estimated values from NASA POWER or similar.
    - Re-run the weather quality check before simulation.
    prevention: Always verify units when creating weather files from external data sources. Include a
      unit conversion step in the data pipeline.
  severity: fatal
  cross_references:
  - dt_009
  - dt_013
- id: dt_006
  stage: s2_weather_prep
  failure_domain: parameter_range
  symptom:
    description: Simulation terminates with ErrCode 6 — maximum temperature is less than minimum temperature.
      WARNING.OUT shows 'Tmax is less than Tmin on YR DOY'.
    error_pattern: Tmax is less than Tmin on YR DOY.*\d{4}\s+\d{1,3}
    detection_method: log_match
  diagnosis:
    root_cause: DailyWeatherCheck (IPWTH_alt.for, line ~1289) checks IF(TMAX.LT.TMIN) ErrCode=6. The TMAX
      and TMIN columns are swapped or one value is corrupted.
    explanation: 'This check in DailyWeatherCheck enforces the physical constraint that daily maximum
      temperature must be >= minimum temperature. Common causes: (1) TMAX and TMIN columns are swapped
      in the weather file, (2) temperature unit conversion error (e.g., mixing Fahrenheit and Celsius),
      (3) a data extraction script assigned wrong columns to TMAX/TMIN. Note: if TMAX - TMIN < 0.05 but
      TMAX >= TMIN, a warning is issued but the run continues.

      '
    affected_components:
    - Weather/IPWTH_alt.for (DailyWeatherCheck)
    - Weather data file (.WTH)
  remedy:
    action: Fix TMAX/TMIN values so that TMAX >= TMIN on every day.
    tool_to_run: ''
    manual_steps:
    - Open the weather file and locate the day reported in the error message.
    - Check if TMAX and TMIN columns are swapped — compare with surrounding days.
    - If systematically swapped, swap the two columns throughout the file.
    - If isolated errors, replace with interpolated or nearby station data.
    - Verify units are in degrees Celsius.
    prevention: Add a post-processing validation step that checks TMAX >= TMIN for all records before
      creating the .WTH file.
  severity: fatal
  cross_references: []
- id: dt_007
  stage: s2_weather_prep
  failure_domain: data_sequence
  symptom:
    description: Simulation terminates with ErrCode 8 — weather file dates are non-sequential (missing
      or duplicated days). WARNING.OUT shows 'Non-sequential data in file' or 'Duplicate record found
      in weather file'.
    error_pattern: Non-sequential data in file.*\d{4}\s+\d{1,3}|Duplicate record found in weather file
    detection_method: log_match
  diagnosis:
    root_cause: In IpWRec (IPWTH_alt.for, line ~1122), if YRDOY_A(NRecords) < YRDOY_A(NRecords-1), ErrCode=8
      is set. Dates must be strictly increasing. Duplicate dates trigger a warning and the record is skipped,
      but a date going backwards triggers a fatal error.
    explanation: 'DSSAT reads weather records into arrays and validates sequential ordering. The check
      at line 1122 compares each record''s date to the previous one. If dates go backwards, this indicates
      file corruption, incorrect year coding, or records inserted out of order. Duplicate dates (same
      YRDOY appearing twice) generate a warning but are skipped. Missing dates between two records cause
      ErrCode=10 (weather record not found for the expected date). Common causes: (1) merging data from
      multiple sources without sorting, (2) Y2K date conversion errors, (3) leap year confusion with DOY
      366.

      '
    affected_components:
    - Weather/IPWTH_alt.for (IpWRec subroutine)
    - Weather data file (.WTH)
  remedy:
    action: Sort the weather file by date and fill any gaps in the daily sequence.
    tool_to_run: ''
    manual_steps:
    - Extract the date column from the weather file and check for non-sequential entries.
    - Sort all data records by YRDOY (year*1000 + day-of-year).
    - Remove exact duplicate dates (keep the first occurrence).
    - Fill missing dates with -99 placeholder values or interpolated data.
    - Verify leap years have 366 days and non-leap years have 365 days.
    prevention: Include a date-sequence validation step in the weather file creation pipeline. Use a script
      that generates a complete date sequence and merges data onto it.
  severity: fatal
  cross_references: []
- id: dt_008
  stage: s2_weather_prep
  failure_domain: silent_conversion
  symptom:
    description: No error shown. Weather variables silently read as -99 when the source data contained
      NaN. Simulation may crash later with a SIGFPE or produce nonsensical results.
    error_pattern: ''
    detection_method: file_content_check
  diagnosis:
    root_cause: In IpWRec (IPWTH_alt.for, lines ~1027-1069), each weather variable is read with 'IF(ERR.NE.0.OR.ISNAN(var))
      var=-99.' This silently converts NaN values to -99 with no warning.
    explanation: 'The 11/19/2024 code update (FO) added ISNAN() protection for all weather variables.
      When a READ encounters NaN text (e.g., from Python numpy output or missing data coded as ''nan''),
      the ISNAN check catches it and sets the value to -99. While this prevents a Fortran runtime crash,
      the -99 value is treated as missing data. For optional variables (TDEW, WINDSP, PAR, RHUM), DSSAT
      substitutes defaults. But for required variables (SRAD, TMAX, TMIN, RAIN), the -99 will trigger
      a fatal error in DailyWeatherCheck. The danger is when NaN appears in optional fields — no error
      is raised, and default substitutions may produce subtly wrong results.

      '
    affected_components:
    - Weather/IPWTH_alt.for (IpWRec subroutine)
    - Weather data file (.WTH)
  remedy:
    action: Scan weather files for NaN values and replace with valid data or explicit -99 missing codes.
    tool_to_run: grep -in 'nan' <WEATHER_FILE>
    manual_steps:
    - Search the weather file for any occurrence of 'NaN', 'nan', 'NAN', or 'Inf'.
    - Replace NaN values with -99 (DSSAT missing code) or actual measured/estimated data.
    - If NaN appears in SRAD, TMAX, TMIN, or RAIN, obtain replacement data from NASA POWER or a nearby
      station.
    - If NaN appears in optional fields (TDEW, WIND, PAR, RHUM), -99 is acceptable but document the gap.
    prevention: In data pipelines, explicitly handle NaN before writing weather files. Use pandas fillna(-99)
      or equivalent. Never write floating-point NaN to DSSAT weather files.
  severity: silent
  cross_references: []
- id: dt_009
  stage: s2_weather_prep
  failure_domain: parameter_range
  symptom:
    description: 'WARNING.OUT contains ''Warning: SRAD < 0.1 MJ.m-2.d-1'' and ''SRAD will be set equal
      to 0.1 MJ.m-2.d-1''. Simulation continues with clamped SRAD value.'
    error_pattern: 'Warning: SRAD < 0\.1 MJ\.m-2\.d-1'
    detection_method: log_match
  diagnosis:
    root_cause: DailyWeatherCheck (IPWTH_alt.for, line ~1337) checks IF(SRAD.LT.0.1) and silently resets
      SRAD to 0.1. A warning is issued but the simulation continues. This masks data quality issues.
    explanation: 'After the fatal checks (SRAD < 0 or SRAD > 100), the code performs a soft check for
      very low but positive SRAD values. SRAD < 0.1 is replaced with 0.1 and a warning is written. SRAD
      between 0.1 and 1.0 also gets a warning but no correction. This behavior means that near-zero SRAD
      values (which may indicate unit errors or data corruption) are silently patched, potentially producing
      incorrect photosynthesis calculations that are hard to trace back to weather data quality.

      '
    affected_components:
    - Weather/IPWTH_alt.for (DailyWeatherCheck)
    - Weather data file (.WTH)
  remedy:
    action: Investigate and fix the source of very low SRAD values in the weather file.
    tool_to_run: ''
    manual_steps:
    - Check WARNING.OUT for the specific dates with low SRAD.
    - Open the weather file and examine those dates — are the values near zero?
    - Determine if this is a data gap (should be -99), a unit error (W/m2 vs MJ/m2/d), or cloudy-day data.
    - Replace erroneous values with measured or estimated data.
    - After correction, verify no more SRAD warnings appear in WARNING.OUT.
    prevention: Validate that SRAD values fall in the physically plausible range (1-45 MJ/m2/d) before
      writing weather files.
  severity: warning
  cross_references:
  - dt_005
  - dt_013
- id: dt_010
  stage: s2_weather_prep
  failure_domain: silent_default
  symptom:
    description: WARNING.OUT contains 'Value of TAV, average annual soil temperature, is missing' and
      'A default value of 20.0C is being used'. Soil temperature calculations may be inaccurate.
    error_pattern: Value of TAV.*is missing|default value of\s+20\.0
    detection_method: log_match
  diagnosis:
    root_cause: In IPWTH_alt.for (line ~460), IF(TAV.LE.0.0) sets TAV=20.0. The check uses LE (less-than-or-equal)
      not LT, so TAV=0 also triggers the default. A warning is issued but is easily missed.
    explanation: 'TAV (average annual soil temperature) is read from the weather file header. If the value
      is missing (-99), zero, or negative, DSSAT replaces it with 20.0 degrees C. This default may be
      reasonable for tropical locations but is wrong for temperate or high-latitude sites. The warning
      is written to WARNING.OUT but does not halt the simulation. The comment in the source notes that
      using LE instead of LT was a deliberate choice to match legacy STEMP behavior, despite different
      results for experiments with TAV=0. Soil temperature drives germination, root growth, and organic
      matter decomposition, so an incorrect TAV can cascade through the simulation.

      '
    affected_components:
    - Weather/IPWTH_alt.for
    - SPAM/STEMP.for
    - SPAM/STEMP_EPIC.for
    - Weather file header section
  remedy:
    action: Calculate and provide the correct TAV value in the weather file header.
    tool_to_run: ''
    manual_steps:
    - Calculate TAV as the mean of all daily (TMAX+TMIN)/2 values across the entire weather record.
    - Open the weather file header and find the TAV field (typically on the line after @ INSI LAT LONG
      ELEV TAV AMP).
    - Replace -99 or 0 with the calculated TAV value.
    - Verify the value is physically reasonable for the location (e.g., 10-15C for temperate, 25-30C for
      tropical).
    prevention: Always compute TAV and TAMP when creating weather files. The WeatherMan tool in DSSAT
      calculates these automatically.
  severity: silent
  cross_references:
  - dt_011
- id: dt_011
  stage: s2_weather_prep
  failure_domain: silent_default
  symptom:
    description: WARNING.OUT contains 'Value of TAMP, amplitude of soil temperature function, is missing'
      and 'A default value of 5.0C is being used'. Soil temperature seasonality is wrong.
    error_pattern: Value of TAMP.*amplitude.*is missing|default value of\s+5\.0
    detection_method: log_match
  diagnosis:
    root_cause: In IPWTH_alt.for (line ~473), IF(TAMP.LE.0.0) sets TAMP=5.0. Same logic as TAV — uses
      LE check, issues warning but continues.
    explanation: 'TAMP (amplitude of the annual soil temperature curve) controls the seasonal swing of
      soil temperature around TAV. A default of 5C is too low for continental climates (where TAMP can
      be 15-25C) and too high for equatorial sites (where TAMP is 1-3C). Incorrect TAMP affects soil temperature
      calculations in STEMP and STEMP_EPIC, which in turn affect soil organic matter decomposition rates,
      soil nitrogen mineralization, germination timing, and root growth. The warning is logged but does
      not stop the run.

      '
    affected_components:
    - Weather/IPWTH_alt.for
    - SPAM/STEMP.for
    - SPAM/STEMP_EPIC.for
    - Weather file header section
  remedy:
    action: Calculate and provide the correct TAMP value in the weather file header.
    tool_to_run: ''
    manual_steps:
    - Calculate monthly average temperatures for each month.
    - TAMP = (highest monthly average) - (lowest monthly average).
    - Open the weather file header and find the AMP field.
    - Replace -99 or 0 with the calculated TAMP value.
    - 'Typical ranges: equatorial 1-5C, temperate 10-20C, continental 20-30C.'
    prevention: Always compute TAMP when creating weather files. Use at least one full year of daily data
      for the calculation.
  severity: silent
  cross_references:
  - dt_010
- id: dt_012
  stage: s2_weather_prep
  failure_domain: unit_mismatch
  symptom:
    description: No error raised. Wind speed values are implausibly high (>500 km/day) or implausibly
      low (<1 km/day). ET calculations, canopy resistance, and disease models produce incorrect results.
    error_pattern: ''
    detection_method: file_content_check
  diagnosis:
    root_cause: DSSAT expects wind speed (WIND column) in km/day. External data sources commonly provide
      wind in m/s. The conversion factor is 86.4 (m/s * 86400 s/day / 1000 m/km). If m/s values are used
      directly, winds are ~86x too low.
    explanation: 'The weather file header ''WIND'' column is documented as ''Daily wind run (km/d)'' in
      IPWTH_alt.for (line ~1045). If the user provides m/s data without converting, a typical wind speed
      of 3 m/s appears as 3 km/day instead of the correct 259 km/day. This affects Penman-Monteith ET
      calculations, crop canopy energy balance, and any pest/disease model that uses wind. If WINDSP is
      missing or <=0, DSSAT silently substitutes 86.4 km/day (~1 m/s) as a default. There is no range
      check on wind values in the current code — the old check (commented out in IPWTH_alt.for lines 843-851)
      was removed.

      '
    affected_components:
    - Weather/IPWTH_alt.for
    - SPAM/PET.for (Penman-Monteith)
    - Weather data file (.WTH) WIND column
  remedy:
    action: Convert wind speed from m/s to km/day by multiplying by 86.4.
    tool_to_run: ''
    manual_steps:
    - Identify the source units of wind speed data (most APIs provide m/s).
    - Multiply all WIND values by 86.4 to convert from m/s to km/day.
    - 'Verify converted values are reasonable: 50-500 km/day for most locations.'
    - If wind data is unavailable, use -99 (DSSAT will use default of 86.4 km/day).
    prevention: 'Document the required unit (km/day) in the weather file creation pipeline. Add a range
      check: warn if any WIND value < 10 or > 900 km/day.'
  severity: silent
  cross_references: []
- id: dt_013
  stage: s2_weather_prep
  failure_domain: unit_mismatch
  symptom:
    description: SRAD values in weather file are 100-400+ (W/m2 instead of MJ/m2/day). Either triggers
      ErrCode 2 (SRAD > 100) or, if marginal, produces overpredicted biomass.
    error_pattern: Solar radiation data error|SRAD =\s+\d{3}
    detection_method: log_match
  diagnosis:
    root_cause: DSSAT expects SRAD in MJ/m2/day. Many data sources (NASA POWER, weather APIs) provide
      instantaneous or daily-average irradiance in W/m2. The conversion is SRAD_MJ = SRAD_Wm2 * 0.0864.
    explanation: 'A typical clear-sky irradiance of 250 W/m2 (daily average) corresponds to about 21.6
      MJ/m2/day. If the raw W/m2 value (250) is placed directly in the SRAD column, DailyWeatherCheck
      will trigger ErrCode=2 (SRAD > 100). For partly cloudy days where raw W/m2 values are 50-100, the
      values pass the >100 check but are still 12-60x too high. This produces dramatically overpredicted
      photosynthesis and biomass accumulation. The conversion factor is: 1 W/m2 = 0.0864 MJ/m2/day (=
      1 J/s * 86400 s / 1e6).

      '
    affected_components:
    - Weather/IPWTH_alt.for (DailyWeatherCheck)
    - Weather data file (.WTH) SRAD column
  remedy:
    action: Convert SRAD from W/m2 to MJ/m2/day by multiplying by 0.0864.
    tool_to_run: ''
    manual_steps:
    - Identify the source units of solar radiation data.
    - If in W/m2 (daily average shortwave down), multiply by 0.0864 to get MJ/m2/day.
    - If in kJ/m2/day, divide by 1000.
    - If in cal/cm2/day (langleys), multiply by 0.04184.
    - 'Verify: typical clear-sky values should be 15-35 MJ/m2/day depending on latitude and season.'
    prevention: 'Always verify SRAD units before weather file creation. Add an assertion: all SRAD values
      must be between 0 and 50 MJ/m2/day.'
  severity: fatal
  cross_references:
  - dt_005
  - dt_009
- id: dt_014
  stage: s3_soil_setup
  failure_domain: parameter_ordering
  symptom:
    description: Simulation terminates with Error 7 from IPSOIL — saturated water content (SAT) is less
      than drained upper limit (DUL) in one or more soil layers.
    error_pattern: 'Error key: IPSOIL.*Error.*7|DUL.*SAT.*Error'
    detection_method: log_match
  diagnosis:
    root_cause: IPSOIL_Inp.for (line ~499) checks IF((DUL(J)-SAT(J)).GT.0.0) CALL ERROR(ERRKEY,7,FILES,LINSOL).
      This enforces the physical constraint SAT >= DUL.
    explanation: 'Soil water content follows the physical ordering: SAT >= DUL >= LL (saturation >= field
      capacity >= wilting point). When SAT < DUL in any layer, it indicates either: (1) values were swapped
      between columns, (2) pedotransfer functions produced inconsistent estimates, or (3) manual editing
      introduced errors. The error includes the line number in the .SOL file where the violation occurs.
      Note: if SAT == DUL exactly, DSSAT silently adds 0.01 to SAT (line ~508-509) to prevent division-by-zero,
      but SAT < DUL is fatal.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - Soil file (.SOL)
  remedy:
    action: Correct the soil water parameters so that SAT >= DUL >= LL in every layer.
    tool_to_run: ''
    manual_steps:
    - Open the .SOL file and find the soil profile identified by the error.
    - 'For each layer, verify: SSAT >= SDUL >= SLLL.'
    - If values are swapped, reorder them correctly.
    - If values came from pedotransfer functions, re-run with correct inputs or use measured data.
    - 'Typical ranges: SAT 0.40-0.55, DUL 0.25-0.40, LL 0.05-0.20 (cm3/cm3).'
    prevention: Validate soil water parameters (SAT >= DUL >= LL) in every layer before creating the .SOL
      file. Use the DSSAT SBuild tool for consistency checks.
  severity: fatal
  cross_references:
  - dt_015
- id: dt_015
  stage: s3_soil_setup
  failure_domain: parameter_ordering
  symptom:
    description: Simulation terminates with Error 8 from IPSOIL — lower limit (LL) exceeds drained upper
      limit (DUL) in one or more soil layers.
    error_pattern: 'Error key: IPSOIL.*Error.*8|LL.*DUL.*Error'
    detection_method: log_match
  diagnosis:
    root_cause: IPSOIL_Inp.for (line ~502) checks IF((LL(J)-DUL(J)).GT.0.0) CALL ERROR(ERRKEY,8,FILES,LINSOL).
      This enforces DUL >= LL.
    explanation: 'The lower limit of plant-extractable water (LL, a.k.a. wilting point) must be less than
      or equal to the drained upper limit (DUL, a.k.a. field capacity). When LL > DUL, the available water
      capacity (AWC = DUL - LL) becomes negative, which is physically impossible. Note: if LL == DUL exactly,
      DSSAT silently subtracts 0.01 from LL (line ~511-512). Common causes: (1) column misalignment in
      the .SOL file, (2) using LL_15bar instead of LL for the specific crop, (3) pedotransfer function
      errors.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - Soil file (.SOL)
  remedy:
    action: Correct soil water parameters so that DUL >= LL in every layer.
    tool_to_run: ''
    manual_steps:
    - Open the .SOL file and locate the layer reported in the error.
    - Swap SLLL and SDUL if they are reversed, or recalculate using pedotransfer functions.
    - Ensure a minimum AWC of 0.02 cm3/cm3 per layer for numerical stability.
    - Cross-check with literature values for the soil texture class.
    prevention: Always validate the constraint chain SAT >= DUL >= LL with at least 0.01 margin after
      pedotransfer estimation.
  severity: fatal
  cross_references:
  - dt_014
- id: dt_016
  stage: s3_soil_setup
  failure_domain: array_overflow
  symptom:
    description: Simulation terminates with Error 2 from IPSOIL — soil profile has more than 20 layers,
      exceeding the NL parameter limit.
    error_pattern: 'Error key: IPSOIL.*Error.*2'
    detection_method: log_match
  diagnosis:
    root_cause: 'IPSOIL_Inp.for (line ~383) checks IF(L.GT.NL) CALL ERROR(ERRKEY,2,FILES,LINSOL). NL is
      defined as 20 in ModuleDefs.for (line ~49): INTEGER, PARAMETER :: NL = 20.'
    explanation: 'DSSAT allocates fixed-size arrays for soil layer data with dimension NL=20. If the .SOL
      file contains more than 20 layers for a profile, the layer counter exceeds NL and triggers Error
      2. This is a hard limit compiled into the executable. Note: DSSAT''s layer-setting routines (LYRSET,
      LYRSET2, LYRSET3) will redistribute input layers to fit within NL, but the input reading occurs
      first and the check happens during the read loop before redistribution. If exactly 20 layers are
      provided, the code sets DS(NL) = MAX(DS(NL), ZLYR(NLAYRI)) to capture the full profile depth.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - Utilities/ModuleDefs.for (NL parameter)
    - Soil file (.SOL)
  remedy:
    action: Reduce the soil profile to 20 or fewer layers by combining thin layers.
    tool_to_run: ''
    manual_steps:
    - Count the number of layer lines under the soil profile header in the .SOL file.
    - If > 20, combine adjacent thin layers by weighted averaging of properties.
    - Prioritize keeping distinct layers in the root zone (0-60 cm) and combining deeper layers.
    - Ensure the bottom layer depth matches the original profile depth.
    - Use DSSAT SBuild to restructure the layers automatically.
    prevention: When creating .SOL files from detailed soil surveys, pre-aggregate to <= 20 layers. Use
      the DSSAT standard layer structure (5, 15, 30, 45, 60, 90, 120, ... cm).
  severity: fatal
  cross_references: []
- id: dt_017
  stage: s3_soil_setup
  failure_domain: file_not_found
  symptom:
    description: Simulation terminates with Error 4 from IPSOIL — the soil profile ID specified in the
      FileX was not found in any searched .SOL file. WARNING.OUT shows 'Soil profile missing from file'.
    error_pattern: 'Soil profile missing from file|Soil ID:.*|Error key: IPSOIL.*Error.*4'
    detection_method: log_match
  diagnosis:
    root_cause: IPSOIL_Inp.for (line ~271) issues CALL ERROR(ERRKEY,4,FILES,LINSOL) after searching the
      entire .SOL file (and the two-letter country code .SOL file) without finding PEDON == SLNO.
    explanation: 'The soil reading code first searches SOIL.SOL, then if not found, constructs a country-specific
      file (e.g., IB.SOL from SLNO(1:2)) and searches that. If neither file contains the profile ID, Error
      4 is raised. The profile ID matching is done after converting both PEDON and SLNO to uppercase.
      Common causes: (1) typo in the soil ID in the FileX, (2) the .SOL file is not in the expected directory,
      (3) the soil profile was deleted or renamed, (4) leading/trailing spaces in the 10-character SLNO
      field.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - Soil file (.SOL)
    - FileX *FIELDS section (ID_SOIL field)
  remedy:
    action: Ensure the soil profile ID in the FileX exactly matches a profile in the .SOL file.
    tool_to_run: grep '\*' <SOL_FILE> | head -20
    manual_steps:
    - 'Note the soil ID from the error message (''Soil ID: XXXX'').'
    - 'Search the .SOL file for that ID: grep ''<SOIL_ID>'' <SOL_FILE>'
    - If not found, check for typos — compare character by character.
    - Verify the .SOL file path in DSSATPRO.v48 or the batch file.
    - If the profile exists in a different .SOL file, update the file reference.
    prevention: Cross-validate soil IDs between FileX and .SOL files before batch submission.
  severity: fatal
  cross_references:
  - dt_003
- id: dt_018
  stage: s3_soil_setup
  failure_domain: division_by_zero
  symptom:
    description: 'Prior to the March 2026 fix: simulation crashes with SIGFPE (division by zero) during
      CENTURY organic matter output. SOC_40CM_P = SOC_40CM / SOIL_40CM when SOIL_40CM is zero for soils
      shallower than 20 cm. After the fix: values are set to 0.0.'
    error_pattern: 'SIGFPE|Floating point exception|forrtl: error'
    detection_method: log_match
  diagnosis:
    root_cause: OPSOMLIT_C.for computes SOC_40CM_P = SOC_40CM / SOIL_40CM. For soils with total depth
      < 20 cm, the 20-40cm soil mass (SOIL_40CM) is zero, causing division by zero. A fix was committed
      (GH 03/11/2026) that checks IF(SOIL_40CM.GT.0.0) before division.
    explanation: 'The CENTURY organic matter output routine calculates soil organic carbon percentage
      for the 0-20cm and 20-40cm depth ranges. For very shallow soils (< 20 cm total depth), there is
      no soil in the 20-40cm range, so SOIL_40CM remains at its initialized value of 0.0. The division
      SOC_40CM / SOIL_40CM then produces a floating-point exception. The commit d3a65881 (''Prevent zero
      divide for shallow soils less than 20 cm'') adds a guard: IF (SOIL_40CM .GT. 0.0) THEN ... ELSE
      SOC_40CM_P = 0.0. Users running older DSSAT versions will encounter the crash; users on the latest
      develop branch have the fix.

      '
    affected_components:
    - Soil/CENTURY_OrganicMatter/OPSOMLIT_C.for
  remedy:
    action: Update to latest DSSAT develop branch that includes the shallow-soil fix, or avoid CENTURY
      SOM model with soils < 20 cm.
    tool_to_run: git log --oneline -5 Soil/CENTURY_OrganicMatter/OPSOMLIT_C.for
    manual_steps:
    - Check if your DSSAT version includes commit d3a65881.
    - 'If not, pull the latest develop branch: git pull origin develop'
    - Alternatively, if the soil is genuinely < 20 cm, consider if DSSAT is appropriate for this scenario.
    - As a workaround, extend the soil profile to at least 20 cm with estimated properties.
    prevention: Always use DSSAT builds from the latest develop branch. Flag soil profiles < 20 cm as
      potential issues in pre-flight checks.
  severity: silent
  cross_references:
  - dt_035
- id: dt_019
  stage: s3_soil_setup
  failure_domain: numerical_instability
  symptom:
    description: WARNING.OUT contains 'Soil layer 1 thicker than 5 cm' and 'Soil water algorithms may
      become unstable'. Simulation runs but soil water dynamics may oscillate.
    error_pattern: Soil layer 1 thicker than 5 cm|Soil water algorithms may become unstable
    detection_method: log_match
  diagnosis:
    root_cause: IPSOIL_Inp.for (line ~548) checks IF(DLAYR(1)>5) and issues a warning. The Ritchie soil
      water balance uses explicit numerical integration that becomes unstable with thick surface layers.
    explanation: 'After the LYRSET layer redistribution, if the top computational layer exceeds 5 cm,
      the warning is issued. The soil evaporation and infiltration routines (SOILEV, INFIL, WATBAL) use
      the surface layer thickness for evaporation stage calculations. A thick surface layer causes the
      two-stage evaporation model to overestimate or oscillate. This typically happens when the .SOL file
      has its first layer boundary at > 5 cm and MESOL=''3'' is selected (which preserves original layer
      boundaries). The default MESOL=''2'' redistributes layers and usually avoids this issue.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - Soil/SoilWater/WATBAL.for
    - SPAM/SOILEV.for
  remedy:
    action: Ensure the first soil layer in the .SOL file is 5 cm or thinner, or use MESOL=2.
    tool_to_run: ''
    manual_steps:
    - Check the first SLB (layer bottom depth) value in the .SOL file — it should be <= 5.
    - If > 5, add an additional layer boundary at 5 cm with interpolated properties.
    - Alternatively, change MESOL to '2' (default) in simulation controls, which will auto-redistribute
      layers.
    - After correction, verify WARNING.OUT no longer contains this message.
    prevention: Always include a 5-cm surface layer in custom .SOL files. Use MESOL=2 unless there is
      a specific reason to preserve original layer boundaries.
  severity: warning
  cross_references: []
- id: dt_020
  stage: s3_soil_setup
  failure_domain: silent_clamp
  symptom:
    description: WARNING.OUT contains 'Invalid value for SLNF in soil file' and 'Value changed to 1.0'.
      The nitrogen mineralization factor was out of range but silently corrected.
    error_pattern: Invalid value for SLNF in soil file|Value changed to 1\.0
    detection_method: log_match
  diagnosis:
    root_cause: IPSOIL_Inp.for (line ~487) checks IF(SLNF>1.0.OR.SLNF<0.0) and resets SLNF to 1.0. The
      warning is only issued if ISWNIT is not 'N'.
    explanation: 'SLNF is the soil nitrogen mineralization factor (0-1 scale). Values > 1.0 or < 0.0 are
      invalid. The code clamps to 1.0 (maximum mineralization) and issues a warning. This means if the
      user intended a specific SLNF value but introduced a typo (e.g., 1.5 or -0.5), the simulation silently
      uses 1.0 instead. The impact depends on how far the intended value was from 1.0 — if SLNF should
      have been 0.5 (reduced mineralization), using 1.0 will overestimate N availability.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - Soil file (.SOL) SLNF field
  remedy:
    action: Set SLNF to a valid value between 0.0 and 1.0 in the .SOL file.
    tool_to_run: ''
    manual_steps:
    - Open the .SOL file and find the SLNF value for the soil profile.
    - Set SLNF to a valid value (0.0-1.0). Default is 1.0 (no reduction in mineralization).
    - 'Common values: 1.0 for fertile soils, 0.5-0.8 for soils with reduced mineralization.'
    prevention: Validate SLNF is in [0.0, 1.0] during .SOL file creation.
  severity: silent
  cross_references: []
- id: dt_021
  stage: s3_soil_setup
  failure_domain: parameter_range
  symptom:
    description: Simulation terminates with Error 12 from IPSOIL — soil albedo (SALB) is zero or negative.
    error_pattern: 'Error key: IPSOIL.*Error.*12'
    detection_method: log_match
  diagnosis:
    root_cause: IPSOIL_Inp.for (line ~479-484) checks IF(SALB.LE.0.0) CALL ERROR(ERRKEY,12,FILES,LINSOL).
      Soil albedo must be positive for surface energy balance calculations.
    explanation: 'SALB (soil albedo) controls the fraction of incoming solar radiation reflected by bare
      soil. It is used in the energy balance and soil temperature routines. A value of zero or negative
      is physically impossible and would cause division errors in downstream calculations. Common causes:
      (1) SALB field left as -99 (missing), (2) column misalignment when editing the .SOL file. The commented-out
      code shows that a default of 0.13 was considered but rejected in favor of a hard error.

      '
    affected_components:
    - InputModule/IPSOIL_Inp.for
    - Soil file (.SOL) SALB field
  remedy:
    action: Set SALB to a valid positive value in the .SOL file.
    tool_to_run: ''
    manual_steps:
    - Open the .SOL file and find the SALB field for the soil profile.
    - 'Set SALB to a value between 0.05 and 0.30. Typical values: 0.09-0.13 for dark soils, 0.20-0.25
      for sandy soils.'
    - If unknown, use 0.13 as a reasonable default for most agricultural soils.
    prevention: Never leave SALB as -99 in .SOL files. Include SALB in the soil parameter estimation pipeline.
  severity: fatal
  cross_references: []
- id: dt_022
  stage: s4_genotype_config
  failure_domain: file_not_found
  symptom:
    description: Simulation terminates with Error 2 from IPVAR — the cultivar code specified in the FileX
      was not found in the .CUL file. All lines were read without matching VARNO.
    error_pattern: 'Error key: IPVAR.*Error.*2|cultivar.*not found'
    detection_method: log_match
  diagnosis:
    root_cause: IPVAR.for (line ~148) issues CALL ERROR(ERRKEY,2,FILEG,LINVAR) when ISECT==0 (end of file)
      is reached without finding VARTY==VARNO. The cultivar code from the FileX does not match any entry
      in the .CUL file.
    explanation: 'IPVAR reads the cultivar (.CUL) file line by line, comparing the 6-character VARTY field
      against VARNO from the experiment file. If the end of file is reached without a match, Error 2 is
      raised. Common causes: (1) typo in the cultivar code in the FileX *CULTIVARS section, (2) wrong
      .CUL file for the crop model, (3) the cultivar was added to a different .CUL file version, (4) leading/trailing
      spaces in the code. Note: the comparison uses ADJUSTL on both strings, so leading spaces are handled.

      '
    affected_components:
    - InputModule/IPVAR.for
    - Genotype .CUL file
    - FileX *CULTIVARS section
  remedy:
    action: Ensure the cultivar code in the FileX matches an entry in the correct .CUL file.
    tool_to_run: grep '<CULTIVAR_CODE>' <CUL_FILE>
    manual_steps:
    - Check the cultivar code (CR field) in the FileX *CULTIVARS section.
    - Identify the correct .CUL file for the crop model (e.g., MZCER048.CUL for CERES-Maize).
    - 'Search for the cultivar code: grep ''<CODE>'' <CUL_FILE>'
    - If not found, check for typos or use a similar cultivar (e.g., DFAULT for testing).
    - Verify the MODEL field in the FileX matches the .CUL file prefix.
    prevention: Cross-validate cultivar codes between FileX and .CUL files. Use the DSSAT GBuild tool
      to select cultivars.
  severity: fatal
  cross_references:
  - dt_023
- id: dt_023
  stage: s4_genotype_config
  failure_domain: silent_misconfiguration
  symptom:
    description: Simulation completes without error but produces implausible phenology or yield. The wrong
      crop model was selected (e.g., CSCRP instead of CRGRO for a legume), reading wrong coefficients
      from the .CUL file.
    error_pattern: ''
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: IPVAR.for uses a SELECT CASE(MODEL(1:5)) to determine the READ format for cultivar parameters.
      If the wrong model is specified, the READ still succeeds (same VARNO match) but the parsed coefficients
      have wrong meanings.
    explanation: 'DSSAT supports multiple crop models, each with different cultivar coefficient formats.
      The MODEL field in the FileX simulation controls determines which READ format is used. If MODEL
      is wrong (e.g., ''CSCRP'' instead of ''CRGRO''), the code reads the same line of the .CUL file but
      interprets the numbers differently. Since the READ uses IOSTAT error handling, partial reads succeed
      without error. The cultivar coefficients end up with plausible but wrong values, producing incorrect
      phenology, growth patterns, and yields. This is extremely difficult to diagnose from output alone
      because the simulation appears to run normally.

      '
    affected_components:
    - InputModule/IPVAR.for
    - FileX *SIMULATION CONTROLS (MODEL field)
    - Genotype .CUL and .ECO files
  remedy:
    action: Verify the MODEL field matches the intended crop model for the species.
    tool_to_run: ''
    manual_steps:
    - Check the MODEL field in the FileX *SIMULATION CONTROLS section.
    - 'Verify it matches the crop: MZCER=CERES-Maize, CRGRO=CROPGRO, CSCRP=CropSim-Wheat, etc.'
    - 'Cross-reference the .CUL file: the filename prefix should match the MODEL code.'
    - Compare simulated phenology (ADAT, MDAT) with observed data to validate the configuration.
    - If unsure, run with the DFAULT cultivar first to establish a baseline.
    prevention: Use the DSSAT experiment editor (XBuild) which auto-populates the correct MODEL for each
      crop. Include a model-crop consistency check in pre-flight validation.
  severity: silent
  cross_references:
  - dt_022
  - dt_024
- id: dt_024
  stage: s4_genotype_config
  failure_domain: parameter_range
  symptom:
    description: No error raised. Cultivar coefficients are outside the MINIMA/MAXIMA ranges defined in
      the species (.SPE) file. Phenology is incorrect — anthesis and maturity dates do not match observations.
    error_pattern: ''
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: DSSAT does not enforce range limits on cultivar parameters during input. The MINIMA/MAXIMA
      values in .SPE files are documentation only. Out-of-range coefficients produce wrong phenology without
      any error.
    explanation: 'Each .SPE (species) file contains MINIMA and MAXIMA sections that define the valid range
      for cultivar coefficients. However, these ranges are not checked at runtime. A user can set P1=9999
      (thermal time to flowering) or PHINT=-5 (phyllochron) and the simulation will run. The result will
      be wrong phenology (e.g., crop never flowers, or flowers on day 1). IPVAR.for does check a few specific
      coefficients for being <= 0 (e.g., LFMAX, SLAVAR, XFRUIT for CROPGRO), but general range checking
      against MINIMA/MAXIMA is not performed.

      '
    affected_components:
    - InputModule/IPVAR.for
    - Genotype .CUL file
    - Genotype .SPE file (MINIMA/MAXIMA sections)
  remedy:
    action: Compare all cultivar coefficients against the MINIMA/MAXIMA ranges in the .SPE file.
    tool_to_run: ''
    manual_steps:
    - Open the relevant .SPE file (e.g., MZCER048.SPE for CERES-Maize).
    - Find the MINIMA and MAXIMA sections listing valid ranges for each coefficient.
    - Compare each coefficient in the .CUL file against these ranges.
    - Adjust any out-of-range values. Use the DFAULT cultivar as a reference for typical values.
    - Re-run and validate phenology against observed anthesis and maturity dates.
    prevention: Implement a pre-simulation coefficient range check that reads MINIMA/MAXIMA from the .SPE
      file and warns about out-of-range values.
  severity: silent
  cross_references:
  - dt_023
- id: dt_025
  stage: s5_simulation_controls
  failure_domain: date_ordering
  symptom:
    description: Simulation terminates with Error 4 — simulation start date (SDATE) is after the planting
      date (YRPLT). The model cannot simulate pre-planting soil dynamics.
    error_pattern: Error.*4.*simulation.*start|SDATE.*YRPLT|YRSIM.*plant
    detection_method: log_match
  diagnosis:
    root_cause: The simulation start date (SDATE) must precede or equal the planting date (YRPLT) to allow
      initialization of soil water and nitrogen dynamics before planting. When SDATE > YRPLT, the model
      cannot process events that should have already occurred.
    explanation: 'DSSAT processes events chronologically from SDATE forward. If planting is scheduled
      before the simulation starts, the model has no soil state to plant into. This error is most common
      when: (1) SDATE is entered in wrong format (YYDDD vs YRDOY), (2) the user set SDATE to the planting
      date instead of a day before, (3) seasonal runs have SDATE auto-calculated incorrectly. For automatic
      planting (IPLTI=''A''), SDATE should precede the start of the planting window (PWDINF). The recommended
      practice is to set SDATE at least 1 day before planting.

      '
    affected_components:
    - InputModule/IPSIM.for
    - FileX *SIMULATION CONTROLS (SDATE, YRPLT)
  remedy:
    action: Set SDATE to a date before the planting date.
    tool_to_run: ''
    manual_steps:
    - Open the FileX and check SDATE in *SIMULATION CONTROLS and YRPLT in *PLANTING DETAILS.
    - 'Ensure SDATE < YRPLT (both in YRDOY format: year*1000 + day_of_year).'
    - Set SDATE to at least 1 day before planting, preferably 30+ days to allow soil initialization.
    - If using automatic planting, set SDATE before PWDINF (start of planting window).
    prevention: Always set SDATE to the start of the season or earlier. Add a date-ordering check in pre-flight
      validation.
  severity: fatal
  cross_references: []
- id: dt_026
  stage: s5_simulation_controls
  failure_domain: switch_inconsistency
  symptom:
    description: Simulation runs but nitrogen outputs are all -99 or zero despite fertilizer applications.
      ISWNIT=Y but ISWWAT=N — nitrogen simulation requires water simulation but water is disabled.
    error_pattern: ''
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: When ISWWAT='N', soil water is not simulated. Nitrogen transport depends on soil water
      movement (leaching, diffusion). Running ISWNIT='Y' with ISWWAT='N' produces degraded N dynamics
      — many N routines return early when ISWWAT='N'.
    explanation: 'Multiple source files check both switches together. For example, OPSOILNI.for (line
      ~90): ''IF (ISWWAT .EQ. N .OR. ISWNIT .EQ. N) RETURN''. When ISWWAT=''N'', the nitrogen output routine
      returns without writing, producing -99 in outputs. Internally, nitrogen mineralization may still
      be computed, but N transport through soil layers requires water flux. The IPFERT subroutine (line
      ~524-530) automatically sets ISWNIT=''Y'' and ISWWAT=''Y'' if fertilizer is specified (LNFER > 0),
      but this override only applies when LNSIM=0 (no simulation controls override). If the user explicitly
      sets ISWWAT=''N'' in simulation controls, the override does not occur.

      '
    affected_components:
    - InputModule/IPSIM.for
    - Soil/Inorganic_N/OPSOILNI.for
    - InputModule/IPMAN.for (IPFERT)
  remedy:
    action: Set ISWWAT=Y when ISWNIT=Y to enable consistent water-nitrogen simulation.
    tool_to_run: ''
    manual_steps:
    - Open the FileX *SIMULATION CONTROLS section.
    - Check the WATER and NITRO switch columns.
    - If NITRO=Y, ensure WATER=Y as well.
    - Re-run and verify nitrogen outputs appear in SoilNi.OUT and Summary.OUT.
    prevention: 'Add a consistency check: if ISWNIT=Y then ISWWAT must also be Y. Warn users about switch
      dependencies.'
  severity: silent
  cross_references: []
- id: dt_027
  stage: s5_simulation_controls
  failure_domain: silent_default
  symptom:
    description: No error raised. A method switch (e.g., MESOM, MEWTH, MEEVP) has an invalid value and
      is silently replaced by the default. The simulation runs with a different method than intended.
    error_pattern: ''
    detection_method: file_content_check
  diagnosis:
    root_cause: IPSIM.for initializes method switches with defaults (e.g., MEWTH='M', MESOM='G', MEEVP='R')
      before reading from the file. If the read fails or contains an unrecognized value, the default persists.
      No warning is issued for unrecognized method codes.
    explanation: 'In IPSIM.for (lines ~134-145), method switches are initialized: MEWTH=''M'', MESIC=''M'',
      MELI=''E'', MEEVP=''R'', MEPHO=''L'', MESOM=''G'', etc. If the simulation controls section contains
      an invalid code (e.g., MESOM=''X''), the READ with IOSTAT error handling silently keeps the default.
      There is no SELECT CASE validation that warns about unrecognized method codes. This means a typo
      in simulation controls can silently change the simulation method (e.g., using CERES SOM instead
      of CENTURY).

      '
    affected_components:
    - InputModule/IPSIM.for
    - FileX *SIMULATION CONTROLS (method fields)
  remedy:
    action: Verify all method switch codes in the FileX are valid recognized values.
    tool_to_run: ''
    manual_steps:
    - Open the FileX *SIMULATION CONTROLS and check each method field.
    - 'Valid MEWTH: M (measured), G (generated), S (simulated), W (weather).'
    - 'Valid MESOM: G (Godwin/CERES), P (CENTURY-Parton), O (organic).'
    - 'Valid MEEVP: R (Priestley-Taylor), F (FAO-56), Z (Zotarelli-Penman-Monteith).'
    - Check INFO.OUT for the actual methods used — compare with intended settings.
    prevention: Use the DSSAT shell interface to set simulation controls, which validates method codes.
  severity: silent
  cross_references: []
- id: dt_028
  stage: s6_initial_conditions
  failure_domain: layer_mismatch
  symptom:
    description: Initial condition (IC) layer depths in the FileX do not match the soil profile layer
      depths from the .SOL file. Interpolation of IC values to computational layers may produce unexpected
      initial soil water or nitrogen distributions.
    error_pattern: ''
    detection_method: file_content_check
  diagnosis:
    root_cause: DSSAT uses LMATCH to interpolate initial condition values (SH2O, SNO3, SNH4) from IC layers
      to computational soil layers. If IC layers are coarser, finer, or misaligned relative to .SOL layers,
      the interpolation may produce unexpected distributions, especially near layer boundaries.
    explanation: 'The INSOIL subroutine reads initial soil water (SH2O) and nitrogen (SNO3, SNH4) values
      for user-specified layer depths. These are then matched to the computational layers using LMATCH.
      If the IC section has 3 layers (0-30, 30-60, 60-100) but the soil profile has 10 layers (5, 15,
      30, 45, 60, 75, 90, 105, 120, 150), the interpolation assigns the 0-30 IC values to layers 1-3,
      etc. This works reasonably well when IC layers bracket the soil layers, but can produce artifacts
      when boundaries do not align. The main risk is that no warning is issued for this mismatch, and
      the user may not realize the initial conditions are not as specified.

      '
    affected_components:
    - InputModule/INSOIL.for
    - Soil/SoilUtilities/LMATCH.for
    - FileX *INITIAL CONDITIONS section
  remedy:
    action: Align IC layer depths with soil profile layer depths or use MESIC=M to auto-initialize.
    tool_to_run: ''
    manual_steps:
    - Compare the SLB (layer bottom depth) values in the FileX *INITIAL CONDITIONS with the .SOL file
      layers.
    - Ideally, IC layer depths should match .SOL layer depths exactly.
    - If that is impractical, ensure IC layers bracket all soil layers (same bottom depth).
    - Alternatively, set MESIC='M' (measured) which reads IC values, or MESIC='S' which uses previous
      simulation output.
    - After running, check the initial SH2O values in the output to verify they match expectations.
    prevention: Generate IC sections programmatically from the .SOL file layer structure. Use MESIC=M
      with matching layers.
  severity: silent
  cross_references: []
- id: dt_029
  stage: s6_initial_conditions
  failure_domain: silent_clamp
  symptom:
    description: No error raised. Initial soil water content (SH2O) exceeds saturation (SAT) for one or
      more layers. DSSAT silently clamps SH2O to SAT. The simulation starts with less water than specified.
    error_pattern: ''
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: The soil water balance initialization clamps SH2O to the range [LL, SAT]. If the user
      specifies SH2O > SAT (e.g., SH2O=0.55 when SAT=0.50), it is silently reset to SAT with no warning.
    explanation: 'The soil water balance routines (WATBAL, WBSUBS) enforce that water content cannot exceed
      saturation. During initialization, if SH2O from the IC section exceeds SAT from the soil profile,
      it is clamped. This is physically correct (soil cannot hold more water than its pore space), but
      the silent clamping can mask data errors. For example, if the user intended saturated conditions
      but specified SAT and SH2O from different sources with different values, the mismatch is hidden.
      Similarly, if IC values came from a different soil profile with higher SAT, the excess water disappears.

      '
    affected_components:
    - Soil/SoilWater/WATBAL.for
    - Soil/SoilWater/WBSUBS.for
    - FileX *INITIAL CONDITIONS (SH2O)
  remedy:
    action: Ensure IC SH2O values are within the range [LL, SAT] for each corresponding soil layer.
    tool_to_run: ''
    manual_steps:
    - 'For each IC layer, verify: LL <= SH2O <= SAT using the matching .SOL profile values.'
    - If SH2O should represent saturated conditions, set SH2O = SAT for each layer.
    - If SH2O should represent field capacity, set SH2O = DUL for each layer.
    - Check the initial soil water in output files to verify the expected values were used.
    prevention: Cross-validate IC SH2O against .SOL SAT and LL during file creation. Add explicit range
      checks in pre-flight validation.
  severity: silent
  cross_references: []
- id: dt_030
  stage: s6_initial_conditions
  failure_domain: parameter_range
  symptom:
    description: No error raised. Excessive initial NO3 concentrations (e.g., > 100 ppm per layer) cause
      unrealistically high early-season nitrogen uptake and biomass. Yields are inflated.
    error_pattern: ''
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: DSSAT does not impose upper bounds on initial NO3 or NH4 concentrations. Very high initial
      N (e.g., from incorrectly entering kg/ha instead of ppm, or copying from a different context) produces
      excess mineral nitrogen that drives unrealistic early growth.
    explanation: 'Initial NO3 and NH4 are specified in the FileX *INITIAL CONDITIONS section in ppm. There
      is no range check on these values. If a user accidentally enters 200 ppm NO3 in each of 10 layers,
      the profile starts with enormous mineral nitrogen. The crop model takes up this N without restriction,
      producing rapid early-season growth that does not match field observations. The error is particularly
      insidious because the simulation appears to run correctly — it just overestimates yields. Common
      causes: (1) confusing units (kg/ha vs ppm), (2) using unrealistic default values, (3) copying IC
      from a heavily fertilized scenario.

      '
    affected_components:
    - InputModule/INSOIL.for
    - Soil/Inorganic_N/SoilNi_init.for
    - FileX *INITIAL CONDITIONS (SNO3, SNH4)
  remedy:
    action: Set realistic initial NO3 and NH4 values based on soil test data or typical values for the
      region.
    tool_to_run: ''
    manual_steps:
    - Review the SNO3 and SNH4 values in the FileX *INITIAL CONDITIONS section.
    - 'Typical ranges: NO3 = 2-20 ppm per layer (higher in top layers), NH4 = 1-5 ppm.'
    - Total profile inorganic N should typically be 20-100 kg N/ha for agricultural soils.
    - If no soil test data is available, use ICNO3 and ICNH4 from a similar DSSAT example.
    - Compare simulated yields with and without the IC nitrogen to assess sensitivity.
    prevention: Flag initial NO3 > 50 ppm or total profile N > 200 kg/ha as potential data quality issues.
  severity: silent
  cross_references: []
- id: dt_031
  stage: s7_management
  failure_domain: date_ordering
  symptom:
    description: Simulation terminates with Error 3 from IPFERT — a fertilizer application date is before
      the simulation start date (YRSIM).
    error_pattern: 'Error key: IPFERT.*Error.*3'
    detection_method: log_match
  diagnosis:
    root_cause: IPMAN.for (line ~559) checks IF(IFERI.EQ.'R'.AND.FDAY(NFERT).LT.YRSIM) CALL ERROR(ERRKEY,3,FILEX,LINEXP).
      The fertilizer date is before the simulation start.
    explanation: 'When fertilizer timing is set to reported dates (IFERI=''R''), each FDAY is compared
      against YRSIM. If any fertilizer date precedes the simulation start, Error 3 is raised because DSSAT
      cannot apply retroactive management operations. The date comparison uses Y4K_DOY-converted dates.
      Common causes: (1) SDATE was changed but fertilizer dates were not updated, (2) the fertilizer schedule
      is from a different year than the simulation, (3) date format confusion (YYDDD vs YYYYDDD).

      '
    affected_components:
    - InputModule/IPMAN.for (IPFERT subroutine)
    - FileX *FERTILIZERS section
  remedy:
    action: Ensure all fertilizer dates are on or after the simulation start date.
    tool_to_run: ''
    manual_steps:
    - Check the SDATE in *SIMULATION CONTROLS and all FDATE values in *FERTILIZERS.
    - Ensure every FDATE >= SDATE (both in YRDOY format).
    - If SDATE was moved forward, update all fertilizer dates accordingly.
    - For automatic fertilizer (IFERI='A'), dates are not checked against YRSIM.
    prevention: Validate all management dates against SDATE in pre-flight checks. Keep SDATE at least
      1 day before the earliest management event.
  severity: fatal
  cross_references:
  - dt_032
- id: dt_032
  stage: s7_management
  failure_domain: date_ordering
  symptom:
    description: Harvest date is before simulation start date. For IHARI='R' (reported), dates before
      YRSIM are skipped silently. For some modes, Error 6 is raised via Y4K_DOY.
    error_pattern: 'Error key: IPHAR.*Error.*6|Y4K_DOY.*IPHAR'
    detection_method: log_match
  diagnosis:
    root_cause: IPMAN.for (line ~718-724) checks IF(IHARI.EQ.'R'.AND.HDATE(NHAR).LT.YRSIM) GO TO 50 —
      it skips harvest dates before YRSIM rather than raising an error. But Y4K_DOY (called at line ~718)
      can raise Error 6 for invalid date formats.
    explanation: 'Unlike IPFERT which raises a fatal Error 3 for dates before YRSIM, IPHAR handles pre-YRSIM
      harvest dates by silently skipping them (GO TO 50 reads the next record). This means if ALL harvest
      dates are before YRSIM, the simulation will have zero valid harvest dates and will rely on automatic
      maturity-based harvest. The Y4K_DOY subroutine can still raise Error 6 if the date format itself
      is invalid (not a valid YRDOY). Common causes: same as dt_031 — year mismatch or date format confusion.

      '
    affected_components:
    - InputModule/IPMAN.for (IPHAR subroutine)
    - FileX *HARVEST section
  remedy:
    action: Ensure harvest dates are after the simulation start date and in valid YRDOY format.
    tool_to_run: ''
    manual_steps:
    - Check HDATE values in the FileX *HARVEST section.
    - Ensure at least one HDATE >= SDATE.
    - Verify date format is YYDDD (2-digit year) or YYYYDDD (4-digit year) depending on version.
    - If using automatic harvest (IHARI='A' or 'M'), harvest dates in the section may be ignored.
    prevention: Validate all management dates against SDATE. Ensure at least one harvest date falls within
      the simulation window.
  severity: fatal
  cross_references:
  - dt_031
- id: dt_033
  stage: s7_management
  failure_domain: array_overflow
  symptom:
    description: Management operations (fertilizer, irrigation, residue, etc.) silently stop being read
      after 9000 entries. No error is raised but later operations are lost.
    error_pattern: ''
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: ModuleDefs.for (line ~51) defines NAPPL=9000 as the maximum number of applications. When
      NFERT > NAPPL in IPFERT (line ~597), the loop exits (GO TO 120) without error.
    explanation: 'DSSAT allocates fixed-size arrays of dimension NAPPL=9000 for all management operations
      (fertilizer, irrigation, residue, harvest, etc.). The IPFERT subroutine checks IF(NFERT.GT.NAPPL)
      GO TO 120, which breaks out of the read loop without raising an error. The operations that were
      read are processed normally, but any additional operations in the file are silently ignored. This
      limit is virtually impossible to hit for single-season simulations but could be reached in long
      sequential runs or simulations with very frequent operations (e.g., daily fertigation).

      '
    affected_components:
    - Utilities/ModuleDefs.for (NAPPL parameter)
    - InputModule/IPMAN.for
  remedy:
    action: Ensure total management operations do not exceed 9000. For long simulations, split into sequential
      runs.
    tool_to_run: ''
    manual_steps:
    - Count the total number of management operation lines across all sections in the FileX.
    - If approaching 9000, reduce by combining operations or splitting the simulation.
    - Check if DSSAT read all operations by comparing the count in the output with the input.
    prevention: For long-term simulations, monitor the total operation count. Use automatic management
      (IFERI='A', IIRRI='A') instead of listing individual dates.
  severity: silent
  cross_references: []
- id: dt_034
  stage: s7_management
  failure_domain: silent_misconfiguration
  symptom:
    description: No error raised. Wrong FMCD (fertilizer method code) silently applies fertilizer by a
      different method than intended. For example, AP001 (broadcast) vs AP002 (banded) changes placement
      but simulation runs normally.
    error_pattern: ''
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: In IPFERT (IPMAN.for, line ~575-580), invalid FMCD codes (IFFCOD < 1 or > 20) are silently
      reset to '001' (broadcast, not incorporated). Valid but unintended codes are accepted without verification.
    explanation: 'DSSAT uses a 5-character fertilizer method code (e.g., AP001=broadcast not incorporated,
      AP002=broadcast incorporated, AP003=banded, etc.). If the code is invalid (not 001-020), it is silently
      replaced with ''001''. However, if the code is valid but unintended (e.g., user wanted AP002 but
      typed AP005), the simulation runs with the wrong application method. This affects fertilizer placement
      depth and efficiency. The Fert_Place.for subroutine distributes fertilizer differently based on
      the method code (surface vs incorporated vs banded vs injected). The difference in N availability
      and loss can be significant, especially for urea applications.

      '
    affected_components:
    - InputModule/IPMAN.for (IPFERT)
    - Management/Fert_Place.for
    - FileX *FERTILIZERS section (FMCD column)
  remedy:
    action: Verify all FMCD codes in the FileX match the intended application methods.
    tool_to_run: ''
    manual_steps:
    - Open the FileX *FERTILIZERS section and check the FMCD column.
    - 'Verify each code against the method table: AP001=broadcast/surface, AP002=broadcast/incorporated,
      AP003=banded, AP004=banded beneath surface, AP005=applied in irrigation.'
    - Cross-reference with FMETHODS.CDE or the DSSAT documentation.
    - Pay special attention to urea applications where surface vs incorporated makes a large difference
      in volatilization loss.
    prevention: Use the DSSAT XBuild tool to select fertilizer methods from a dropdown. Include FMCD validation
      in pre-flight checks.
  severity: silent
  cross_references: []
- id: dt_035
  stage: s8_batch_execution
  failure_domain: runtime_crash
  symptom:
    description: Simulation crashes with SIGFPE (signal 8, floating-point exception) during the RATE phase.
      No DSSAT error message — the Fortran runtime terminates the process. Core dump may be generated.
    error_pattern: 'SIGFPE|forrtl: error \(75\)|Floating point exception|signal 8'
    detection_method: log_match
  diagnosis:
    root_cause: 'Division by zero in a RATE calculation subroutine. Common culprits: (1) zero plant available
      water (DUL-LL=0), (2) zero LAI used as denominator, (3) zero soil mass in shallow soils (dt_018),
      (4) zero thermal time accumulation at high altitude.'
    explanation: 'SIGFPE occurs when the Fortran runtime traps a division by zero or invalid floating-point
      operation. Unlike DSSAT-managed errors (which go through the ERROR subroutine and produce readable
      messages), SIGFPE crashes the process immediately. The crash often occurs deep in a RATE calculation
      with no DSSAT context. To diagnose: (1) check if the crash correlates with specific days (may be
      a weather data issue), (2) check for degenerate soil conditions (very thin layers, LL==DUL), (3)
      check if it happens at high altitude (thermal time issues), (4) run with a Fortran debugger or compile
      with -fpe-trap=zero to get a stack trace.

      '
    affected_components:
    - Multiple RATE subroutines across all crop models
    - Soil/SoilWater/ routines
    - SPAM/ routines
  remedy:
    action: Identify the zero divisor by running with enhanced FPE trapping and examining the stack trace.
    tool_to_run: ulimit -c unlimited && ./dscsm048 B DSSBatch.v48
    manual_steps:
    - Recompile DSSAT with -g -fcheck=all -ffpe-trap=zero,overflow,invalid flags.
    - 'Run the failing simulation under a debugger: gdb ./dscsm048'
    - When SIGFPE occurs, use 'bt' (backtrace) to identify the exact source line.
    - Examine the variables at the crash point to identify the zero divisor.
    - Fix the input data that caused the degenerate condition (usually soil or weather).
    prevention: Validate that no soil layer has DUL==LL (zero AWC). Check for extreme elevation or temperature
      conditions. Use the latest DSSAT version which has additional zero-divide guards.
  severity: fatal
  cross_references:
  - dt_018
  - dt_036
- id: dt_036
  stage: s8_batch_execution
  failure_domain: runtime_crash
  symptom:
    description: Simulation crashes (SIGFPE or hangs) at high-altitude locations (>3000m). Thermal time
      accumulation collapses to zero because daily temperatures are consistently below the base temperature,
      causing division by zero in phenology routines.
    error_pattern: 'SIGFPE|forrtl: error|thermal time|TT.*0\.0'
    detection_method: log_match
  diagnosis:
    root_cause: At high altitudes, daily temperatures may be consistently below the crop base temperature
      (e.g., Tb=8C for maize). Thermal time (TT) accumulates zero for days or weeks, causing phenology
      routines to divide by zero or enter infinite loops waiting for growth stage thresholds.
    explanation: 'DSSAT calculates thermal time as TT = max(0, (TMAX+TMIN)/2 - Tbase). At locations above
      ~3000m, daily mean temperatures in cold seasons can remain below Tbase for extended periods. The
      phenology routine expects TT to accumulate over time and may divide by accumulated TT to calculate
      rates. When TT remains zero, this produces a SIGFPE. Additionally, some crop models (especially
      CERES) use TT in rate calculations without zero-guards. This is a fundamental model limitation for
      extreme environments. There is no DSSAT-level error message — the Fortran runtime crashes directly.

      '
    affected_components:
    - Plant/CERES-Maize/MZ_GROSUB.for
    - Plant/CERES-Wheat_Barley/CSCER.for
    - Plant/CROPGRO/PHENOL.for
    - All phenology subroutines
  remedy:
    action: Verify that daily temperatures at the simulation location exceed the crop base temperature
      for at least part of the growing season.
    tool_to_run: ''
    manual_steps:
    - 'Check the weather file: calculate mean daily temperature = (TMAX+TMIN)/2 for the growing season.'
    - Compare with the crop base temperature (e.g., Maize Tbase=8C, Wheat Tbase=0C).
    - If mean temperatures are consistently below Tbase, the crop cannot be grown at this location.
    - 'Consider: (1) using a different crop with a lower Tbase, (2) adjusting planting dates to warm season
      only, (3) using elevation-corrected temperature data.'
    - If temperatures are borderline, try extending the planting window to find warmer periods.
    prevention: 'Pre-screen weather data for the growing season: flag locations where mean temperature
      < Tbase for > 30 consecutive days.'
  severity: fatal
  cross_references:
  - dt_035
- id: dt_037
  stage: s8_batch_execution
  failure_domain: build_failure
  symptom:
    description: DSSAT executable cannot be built. CMake or make fails with errors about missing Fortran
      compiler (gfortran/ifort not found) or missing CMake version.
    error_pattern: 'No Fortran compiler found|CMAKE_Fortran_COMPILER|gfortran: command not found|ifort:
      command not found'
    detection_method: log_match
  diagnosis:
    root_cause: DSSAT-CSM is a Fortran project requiring a Fortran compiler (gfortran 7+ or Intel ifort)
      and CMake 3.x+. The build fails if these are not installed or not in PATH.
    explanation: 'DSSAT-CSM uses CMake as its build system. The CMakeLists.txt requires a Fortran compiler.
      On macOS, gfortran is not included with Xcode — it must be installed separately (e.g., via Homebrew:
      brew install gcc). On Linux, the gcc-gfortran or gfortran package is needed. The build also requires
      CMake 3.x. Common issues: (1) gfortran not installed, (2) gfortran installed but not in PATH, (3)
      wrong CMake version, (4) missing build-essential dependencies.

      '
    affected_components:
    - CMakeLists.txt
    - Build environment
  remedy:
    action: Install the required Fortran compiler and CMake.
    tool_to_run: ''
    manual_steps:
    - 'macOS: brew install gcc cmake (provides gfortran)'
    - 'Ubuntu/Debian: sudo apt-get install gfortran cmake build-essential'
    - 'CentOS/RHEL: sudo yum install gcc-gfortran cmake make'
    - 'Verify: gfortran --version && cmake --version'
    - 'Build: mkdir build && cd build && cmake .. && make -j4'
    prevention: Document build prerequisites in the project setup guide. Use a CI/CD system to verify
      builds.
  severity: fatal
  cross_references: []
- id: dt_038
  stage: s8_batch_execution
  failure_domain: string_overflow
  symptom:
    description: Simulation fails with a file-not-found error despite the file existing. The batch file
      path or experiment file path exceeds the Fortran CHARACTER variable length limit (~80-120 characters),
      causing silent truncation.
    error_pattern: File not found|Error number:\s*29|Error opening
    detection_method: log_match
  diagnosis:
    root_cause: Fortran CHARACTER variables have fixed lengths. PATHEX is typically CHARACTER*80, FILEWW
      is CHARACTER*92, PATHX is CHARACTER*120. Paths exceeding these limits are silently truncated, producing
      invalid file paths.
    explanation: 'DSSAT Fortran source declares fixed-length character variables for file paths. For example,
      in IPWTH_alt.for: CHARACTER*80 PATHWTW, CHARACTER*92 FILEWW. In ERROR.for: CHARACTER*120 PATHX.
      When the actual path length exceeds the variable''s declared length, Fortran silently truncates
      the string. The truncated path does not point to the actual file, producing a file-not-found error.
      This is especially problematic when DSSAT is installed in deeply nested directories (e.g., /Users/username/Documents/Research/ProjectName/DSSAT/Data/Weather/).

      '
    affected_components:
    - All input modules that construct file paths
    - Batch file path specifications
  remedy:
    action: Shorten file paths to stay within Fortran string limits.
    tool_to_run: ''
    manual_steps:
    - Check the total length of PATHEX + FILEX. It must be < 92 characters.
    - 'Check weather file paths: PATHWTW + FILEW must be < 92 characters.'
    - Move DSSAT installation to a shorter path (e.g., /opt/DSSAT/ or ~/DSSAT/).
    - Use symbolic links to shorten deep directory paths.
    - On Windows, avoid deeply nested folders under 'Documents and Settings'.
    prevention: Install DSSAT in a short base path. Keep total path+filename under 80 characters. Test
      with full paths before batch runs.
  severity: fatal
  cross_references:
  - dt_001
- id: dt_039
  stage: s8_batch_execution
  failure_domain: infinite_loop
  symptom:
    description: Simulation appears to hang indefinitely. CPU usage is 100% but no output is produced.
      The auto-planting routine (AUTPLT) cannot find a day within the planting window that meets soil
      moisture and temperature criteria.
    error_pattern: ''
    detection_method: process_monitoring
  diagnosis:
    root_cause: AUTPLT.for evaluates planting conditions daily within the window [PWDINF, PWDINL]. If
      conditions are never met, YRPLT stays at 9999999 until YRDOY > PWDINL, at which point CropStatus=11
      (failure to plant). However, if weather data extends far beyond the window, the simulation continues
      daily without planting.
    explanation: 'When IPLTI=''A'' (automatic planting), AUTPLT checks soil temperature (TSDEP >= PTTN
      and TSDEP <= PTX) and soil moisture (AVGSW >= SWPLTL and AVGSW <= SWPLTH) each day within the planting
      window. If conditions are never met, YRPLT remains 9999999. At YRDOY > PWDINL (line ~307-310), YRPLT
      is set to -99, MDATE=YRDOY, and CropStatus=11 (failure to plant). The simulation should then terminate
      the season. However, the apparent hang occurs when: (1) the planting window is very long (365+ days),
      (2) the simulation is set up as a sequential run where weather data extends many years, (3) the
      auto-planting criteria are impossible to meet (e.g., temperature range that excludes all days).
      The simulation is not truly hanging — it is processing days one at a time without planting.

      '
    affected_components:
    - Management/AUTPLT.for
    - Management/AUTHAR.for
    - FileX *SIMULATION CONTROLS (IPLTI='A')
  remedy:
    action: Review and relax the auto-planting criteria, or narrow the planting window.
    tool_to_run: ''
    manual_steps:
    - 'Check the auto-planting parameters in the FileX: PWDINF, PWDINL, PTTN, PTX, SWPLTL, SWPLTH, SWPLTD.'
    - 'Verify temperature criteria are achievable: check weather file for soil temp at 10cm.'
    - 'Verify moisture criteria are achievable: check if soil water can reach the specified range.'
    - Narrow the planting window (PWDINF to PWDINL) to a realistic period.
    - As a fallback, switch to IPLTI='R' (reported planting date) for testing.
    - Check Summary.OUT for CropStatus=11 (NO_SOW) which indicates planting failure.
    prevention: Validate auto-planting criteria against historical weather data before running. Set a
      reasonable planting window (30-60 days). Monitor simulation progress via file timestamps.
  severity: fatal
  cross_references: []
- id: dt_040
  stage: s8_batch_execution
  failure_domain: file_not_found
  symptom:
    description: WARNING.OUT or console shows 'OUTPUT.CDE file not found'. Output files may be saved with
      temporary names instead of standard names. File renaming fails.
    error_pattern: OUTPUT\.CDE file not found|OUTPUT\.CDE.*not
    detection_method: log_match
  diagnosis:
    root_cause: UTILS.for (lines ~1039-1040 and ~1374) reports when OUTPUT.CDE is missing. This file maps
      output variable codes to descriptions and is used for output file management.
    explanation: 'OUTPUT.CDE is a reference file that lists all DSSAT output files and their descriptions.
      It is used by the output management routines to determine which files to save/rename after simulation.
      The file should be in the DSSAT standard data directory (STDPATH). When missing: (1) UTILS.for line
      ~1039 writes the warning, (2) output files may retain temporary names instead of being properly
      renamed, (3) the DSSAT shell may not list output files correctly. The simulation itself completes
      normally — only the output file management is affected.

      '
    affected_components:
    - Utilities/UTILS.for
    - OUTPUT.CDE file
    - DSSAT standard data directory
  remedy:
    action: Restore the OUTPUT.CDE file to the DSSAT installation directory.
    tool_to_run: find /Users/leo/Desktop/DSSAT -name 'OUTPUT.CDE' -type f
    manual_steps:
    - Check if OUTPUT.CDE exists in the DSSAT data directory.
    - If missing, copy it from the DSSAT distribution or dssat-csm-data repository.
    - Verify the file path in DSSATPRO.v48 under the standard data path.
    - The file should be in the same directory as MODEL.ERR and other .CDE files.
    prevention: Include OUTPUT.CDE in the deployment checklist. Do not delete .CDE files from the DSSAT
      data directory.
  severity: warning
  cross_references: []
- id: dt_041
  stage: s9_output_parsing
  failure_domain: empty_output
  symptom:
    description: Summary.OUT contains all -99 values for yield and biomass columns. The simulation produced
      no meaningful results despite completing.
    error_pattern: HWAH.*-99|HWAM.*-99|CWAM.*-99
    detection_method: file_content_check
  diagnosis:
    root_cause: 'All output summary variables are initialized to -99 (OPSUM.for, line ~368: SUMDAT%HWAH=-99.0).
      If the simulation terminates before harvest or the crop model never writes summary data, these defaults
      persist in Summary.OUT.'
    explanation: 'Summary.OUT values default to -99 in OPSUM.for during SEASINIT. Each crop model is responsible
      for populating SUMDAT with actual values at harvest. If the simulation terminates early (due to
      weather error, crop failure, or a crash during RATE), the summary variables retain their -99 defaults.
      Common causes: (1) simulation start or planting errors prevented the crop from growing, (2) the
      crop failed to emerge (CropStatus=12), (3) weather data ran out before harvest, (4) a non-fatal
      error set YREND early. Check ERROR.OUT, WARNING.OUT, and the CropStatus code for clues.

      '
    affected_components:
    - Utilities/OPSUM.for
    - Summary.OUT
    - All crop model output routines
  remedy:
    action: Diagnose why the simulation did not produce results by checking ERROR.OUT and WARNING.OUT.
    tool_to_run: ''
    manual_steps:
    - Check ERROR.OUT for any runtime errors that terminated the simulation early.
    - Check WARNING.OUT for warnings that may explain the failure.
    - 'Check the PESSION column in Summary.OUT for CropStatus codes: 11=NO_SOW, 12=NOGERM, 13=NOEMRG.'
    - Verify weather data covers the full growing season.
    - Verify soil and cultivar parameters are reasonable.
    - Run a known-good test case to verify the DSSAT installation works.
    prevention: Always check ERROR.OUT and WARNING.OUT after each run, not just Summary.OUT.
  severity: fatal
  cross_references:
  - dt_042
- id: dt_042
  stage: s9_output_parsing
  failure_domain: zero_yield
  symptom:
    description: Summary.OUT shows HWAH=0 and the simulation completed (no error). The crop grew but never
      reached physiological maturity or the harvested fraction was zero.
    error_pattern: HWAH\s+0\b
    detection_method: file_content_check
  diagnosis:
    root_cause: 'HWAH (harvested weight at harvest) can be zero if: (1) the crop never reached maturity
      (MDAT not set), (2) HPC (harvest percentage) was 0, (3) the grain-filling phase was terminated by
      frost or drought before any grain was produced.'
    explanation: 'HWAH = HWAM * HPC / 100 (harvested weight = harvest weight at maturity * harvest percentage).
      If HWAM is zero (no grain formed) or HPC is zero, HWAH will be zero. The simulation can complete
      normally with zero yield if: (1) the growing season was too short for the cultivar (early frost
      or drought forced maturity before grain fill), (2) extreme stress prevented reproductive development,
      (3) the simulation was terminated by the harvest date before maturity. Check the PlantGro.OUT file
      for growth dynamics and the MDAT (maturity date) in Summary.OUT.

      '
    affected_components:
    - Utilities/OPSUM.for
    - Plant model integration routines
    - Summary.OUT
  remedy:
    action: Investigate why the crop did not produce grain by examining PlantGro.OUT and WARNING.OUT.
    tool_to_run: ''
    manual_steps:
    - 'Check Summary.OUT: is MDAT (maturity date) present or -99?'
    - If MDAT is -99, the crop never matured — check if the growing season was long enough.
    - Open PlantGro.OUT and check LAI, biomass, and grain weight over time.
    - 'Check for severe stress: look at SWFAC (water stress) and NSTRES (N stress) columns.'
    - Verify the cultivar maturity group matches the location and planting date.
    - Try a shorter-season cultivar or adjust planting dates.
    prevention: Validate that the growing season length (planting to first frost) exceeds the cultivar
      maturity requirement. Check historical performance for the cultivar-location combination.
  severity: silent
  cross_references:
  - dt_041
  - dt_043
- id: dt_043
  stage: s9_output_parsing
  failure_domain: date_confusion
  symptom:
    description: In Summary.OUT, ADAT (anthesis date) appears to be after MDAT (maturity date), which
      is biologically impossible. This indicates a date parsing or format confusion.
    error_pattern: ADAT.*MDAT|anthesis.*after.*maturity
    detection_method: output_plausibility_check
  diagnosis:
    root_cause: DSSAT outputs dates in YRDOY format (YYDDD or YYYYDDD). If the parsing code misinterprets
      the format (e.g., treating YYYYDDD as YYDDD), date comparisons produce nonsensical results. Alternatively,
      if ADAT or MDAT wraps across a year boundary, naive comparisons fail.
    explanation: 'DSSAT internally uses YRDOY (year * 1000 + day-of-year) format for all dates. Summary.OUT
      outputs dates in this format. If a downstream parsing script reads ADAT=2024180 and MDAT=2024150,
      it appears anthesis (day 180) is after maturity (day 150), which is impossible. Common causes of
      this confusion: (1) the parsing script treats the value as a plain integer instead of extracting
      year and DOY, (2) multi-year simulations where ADAT is in year N and MDAT is in year N+1 (rare but
      possible for some crops like perennials), (3) ADAT or MDAT was not set by the crop model and defaults
      to -99, which displays as a negative number. Always extract year = YRDOY/1000 and DOY = YRDOY mod
      1000 before comparing.

      '
    affected_components:
    - Summary.OUT date columns
    - Output parsing scripts
  remedy:
    action: Parse YRDOY dates correctly by extracting year and DOY components before comparison.
    tool_to_run: ''
    manual_steps:
    - Parse ADAT and MDAT from Summary.OUT as integers.
    - 'Extract year: YEAR = YRDOY // 1000 (integer division).'
    - 'Extract DOY: DOY = YRDOY % 1000 (modulo).'
    - 'Convert to actual dates: datetime(YEAR, 1, 1) + timedelta(days=DOY-1).'
    - Compare the converted dates — ADAT should precede MDAT.
    - If either value is -99, the event did not occur (crop did not reach that stage).
    prevention: Use a DSSAT output parsing library that handles YRDOY conversion. Never compare raw YRDOY
      integers across year boundaries without extracting components.
  severity: silent
  cross_references: []
- id: dt_044
  stage: s9_output_parsing
  failure_domain: incomplete_output
  symptom:
    description: Output files (PlantGro.OUT, SoilWat.OUT, etc.) are truncated or incomplete. The last
      line may be corrupted. No Summary.OUT entry for the run. Caused by a crash during RATE calculations
      before file buffers were flushed.
    error_pattern: truncated|incomplete|missing.*summary|no.*entry
    detection_method: file_content_check
  diagnosis:
    root_cause: When DSSAT crashes (SIGFPE, segfault, or STOP 99), Fortran output buffers may not be flushed.
      Files opened with sequential access are not properly closed, resulting in truncated output. Summary.OUT
      is only written at season end — if the crash occurs during the season, no summary entry is created.
    explanation: 'DSSAT writes output files during integration (daily or at specified intervals). These
      writes go to Fortran I/O buffers that are flushed periodically by the runtime. When a fatal crash
      occurs (SIGFPE, ERROR subroutine calling STOP 99, or operating system signal), the CLOSE statements
      at SEASEND are never executed. Buffered data is lost. Summary.OUT is written in the SEASEND phase
      — if the simulation never reaches SEASEND, there is no Summary entry. ERROR.OUT may capture the
      error if the ERROR subroutine was called before STOP, but SIGFPE crashes bypass this entirely. The
      last few lines of daily output files may be missing or corrupted.

      '
    affected_components:
    - All output routines (OP* subroutines)
    - Utilities/ERROR.for (STOP 99)
    - 'Output files: PlantGro.OUT, SoilWat.OUT, Summary.OUT, etc.'
  remedy:
    action: Identify and fix the crash that caused premature termination, then re-run.
    tool_to_run: ''
    manual_steps:
    - Check ERROR.OUT for the last error message before the crash.
    - Check WARNING.OUT for accumulated warnings.
    - Examine the last complete line in the truncated output file to determine the crash date.
    - Look for SIGFPE or segfault messages in the terminal or system log.
    - Re-run with debugging flags to get a stack trace (see dt_035).
    - After fixing the crash cause, delete the truncated output files and re-run.
    prevention: Run simulations in batch mode (RNMODE='B') which handles errors more gracefully than sequential
      mode. Check for zero-divide conditions in input data before running.
  severity: fatal
  cross_references:
  - dt_035
  - dt_041
- id: dt_045
  stage: s8_batch_execution
  failure_domain: path_resolution
  symptom:
    description: DSSAT compiled from source cannot find MODEL.ERR or other support files. Error appears
      immediately on startup, before any simulation logic runs.
    error_pattern: Could not locate error file.*MODEL\.ERR
    detection_method: log_match
  diagnosis:
    root_cause: DSSAT resolves support files (MODEL.ERR, DSCSM048.CTR, StandardData/) relative to the
      executable's directory, not the current working directory.
    explanation: 'When the compiled binary is at build/bin/dscsm048 but the working data is at run_test/,
      DSSAT looks for MODEL.ERR at build/bin/MODEL.ERR. On Linux the executable must be copied or symlinked
      INTO the working directory so that support files are found at the same location. This also affects
      DSSATPRO.L48 lookup on some builds.

      '
    affected_components:
    - CSM_Main/CSM.for
    - Utilities/ERROR.for
    - InputModule/PATH.for
  remedy:
    action: Copy the dscsm048 executable into the working directory and run from there.
    tool_to_run: ''
    manual_steps:
    - cp /path/to/build/bin/dscsm048 /path/to/working/directory/
    - cd /path/to/working/directory/
    - ./dscsm048 B DSSBatch.v48
    prevention: Always run DSSAT from the directory containing the data files. The run_dssat_grid.py tool
      handles this automatically.
  severity: fatal
  cross_references:
  - dt_001
  - dt_046
- id: dt_046
  stage: s8_batch_execution
  failure_domain: path_resolution
  symptom:
    description: Weather, soil, or genotype files not found despite existing at the expected paths. DSSATPRO
      path lookup fails silently.
    error_pattern: Weather file not found.*Neither.*nor.*were found
    detection_method: log_match
  diagnosis:
    root_cause: 'Three compounding issues on Linux: (1) DSSATPRO.v48 contains Windows backslashes that
      are invalid on Linux, (2) directory names are case-sensitive (Soil vs SOIL), (3) sed-based path
      replacement introduces trailing spaces that break Fortran string parsing.'
    explanation: 'DSSAT was developed primarily for Windows where paths use backslashes and filesystems
      are case-insensitive. When migrating to Linux, all three conventions break simultaneously. The safest
      approach is to place all needed files (weather, soil, genotype, standard data) directly in the working
      directory rather than relying on DSSATPRO path resolution.

      '
    affected_components:
    - InputModule/PATH.for
    - DSSATPRO.v48 / DSSATPRO.L48
  remedy:
    action: Copy all needed files into the working directory. Do not rely on DSSATPRO path resolution
      for cross-platform runs.
    tool_to_run: ''
    manual_steps:
    - 'Copy weather file: cp Weather/*.WTH <workdir>/'
    - 'Copy soil file: cp Soil/SOIL.SOL <workdir>/'
    - 'Copy genotype files: cp Genotype/MZCER048.{CUL,ECO,SPE} <workdir>/'
    - 'Copy standard data: cp StandardData/* <workdir>/'
    - 'Copy support files: cp MODEL.ERR DSCSM048.CTR <workdir>/'
    prevention: The run_dssat_grid.py tool copies all needed files into per-cell working directories automatically.
  severity: fatal
  cross_references:
  - dt_045
  - dt_001
- id: dt_047
  stage: s8_batch_execution
  failure_domain: environment
  symptom:
    description: 'DSSAT on Linux reports ''Configuration file not found: /DSSAT48/DSSATPRO.L48'' even
      when DSSATPRO.v48 exists in the working directory.'
    error_pattern: Configuration file not found.*DSSATPRO\.L48
    detection_method: log_match
  diagnosis:
    root_cause: On Linux, DSSAT looks for DSSATPRO.L48 (not .v48). The .L48 format uses '// ' prefix before
      each path instead of drive letters. If only .v48 exists, DSSAT falls back to a hardcoded default
      path (/DSSAT48/).
    explanation: 'DSSAT''s PATH.for module selects the configuration filename based on the operating system
      at compile time. Linux builds expect DSSATPRO.L48 with paths formatted as ''// /absolute/path''.
      The .v48 format (Windows) uses drive letters like ''C:\DSSAT48''. Having the wrong file is silently
      ignored and DSSAT tries the compiled-in default path.

      '
    affected_components:
    - InputModule/PATH.for
    - DSSATPRO.L48
  remedy:
    action: Create DSSATPRO.L48 (not .v48) in the working directory with '// ' path prefix.
    tool_to_run: ''
    manual_steps:
    - Copy the reference DSSATPRO.L48 from Data/DSSATPRO.L48
    - Replace all paths with the working directory using sed or regex
    - Ensure all paths start with '// ' (two slashes, space)
    - 'Example: DDB // /tmp/dssat_runs/c0001'
    prevention: The run_dssat_grid.py tool generates DSSATPRO.L48 automatically for each cell.
  severity: fatal
  cross_references:
  - dt_045
  - dt_046
- id: dt_048
  stage: s1_experiment_design
  failure_domain: parameter_format
  symptom:
    description: DSSAT reports 'Error in planting depth input' or 'Unknown ERROR 5010' when reading a
      programmatically generated FileX. The file looks correct to visual inspection.
    error_pattern: Error in planting depth|Unknown ERROR.*5010
    detection_method: log_match
  diagnosis:
    root_cause: FileX sections use Fortran fixed-width FORMAT parsing. Every field must be exactly the
      right width (counted in characters). Off by even one character shifts all subsequent fields, causing
      parse errors or silent misreads.
    explanation: 'DSSAT reads FileX using FORMAT statements like (I3, A8, F6.0, ...). The *PLANTING DETAILS
      section has 14+ fields each with specific widths. When generating FileX with Python f-strings, it
      is easy to use wrong field widths (e.g., {:4d} instead of {:5d}). The error messages are often misleading
      — ''Error in planting depth'' may actually mean a column shift from an earlier field. Error 5010
      in the *FIELDS section means the XCRD or YCRD coordinate fields are misaligned.

      The safest approach is to compare the generated FileX character-by-character against a known-working
      reference file.

      '
    affected_components:
    - InputModule/ipexp.for
    - InputModule/IPMAN.for
    - InputModule/IPFLD.for
  remedy:
    action: Compare generated FileX against a reference character-by-character. Count dots in the @ header
      line to determine field widths.
    tool_to_run: validate_filex_structure
    manual_steps:
    - Open a known-working FileX (e.g., UFGA8201.MZX) as reference
    - For each section, count characters between header column markers
    - Verify your format strings produce exactly the right widths
    - 'Use diff to compare: diff <(cut -c1-80 generated.MZX) <(cut -c1-80 reference.MZX)'
    prevention: Always test generated FileX with a single-cell run before batch execution. The validate_filex_structure.py
      tool can catch some but not all alignment issues.
  severity: fatal
  cross_references:
  - dt_002
- id: dt_049
  stage: s8_batch_execution
  failure_domain: string_overflow
  symptom:
    description: DSSAT reports 'Invalid model specified' with a truncated model name (e.g., 'MZCE048'
      instead of 'MZCER048') when the model is passed as a command-line argument.
    error_pattern: 'Invalid model specified.*Model:'
    detection_method: log_match
  diagnosis:
    root_cause: The command-line argument parser truncates the 8-character model name. Since the model
      is already mapped in DSSATPRO.L48 via the crop code, the CLI argument is redundant.
    explanation: 'DSSAT''s command-line interface accepts an optional model argument (e.g., MZCER048).
      However, the argument parsing has a character limit that truncates 8-char names. Since the DSSATPRO.L48
      file maps crop codes (MZ, WH, RI) to model names (MZCER048, WHCER048, RICER048), the CLI argument
      is unnecessary. Omitting it lets DSSAT use the DSSATPRO mapping.

      '
    affected_components:
    - CSM_Main/CSM.for (command-line parsing)
    - InputModule/PATH.for (model lookup)
  remedy:
    action: 'Do not pass the model name on the command line. Use: ./dscsm048 B DSSBatch.v48'
    tool_to_run: ''
    manual_steps:
    - Remove the model argument from the command
    - 'Before: ./dscsm048 MZCER048 B DSSBatch.v48'
    - 'After:  ./dscsm048 B DSSBatch.v48'
    prevention: Never pass the model name as a CLI argument. Let DSSATPRO.L48 handle model selection.
  severity: fatal
  cross_references:
  - dt_047
- id: dt_050
  stage: s9_output_parsing
  failure_domain: silent_error
  symptom:
    description: Parsed yield values from Summary.OUT are implausibly large (e.g., 1,980,237 kg/ha). The
      values look like dates (YYYYDDD format) rather than yields.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Summary.OUT uses Fortran fixed-width FORMAT, but the TNAME field (25 chars) can contain
      spaces. Using Python str.split() (whitespace delimiter) breaks column alignment for all fields after
      TNAME.
    explanation: 'Summary.OUT has a treatment name field (TNAME) that is 25 characters wide and commonly
      contains spaces (e.g., ''RAINFED MZ GRID 0001''). When parsed with split(), TNAME becomes 4 tokens,
      shifting all subsequent column indices. The value at expected HWAM position (index 23) is actually
      SDAT (simulation date in YYYYDDD format like 1980237), producing 7-digit ''yields''. This is a SILENT
      error — the code runs without exception, but the output data is completely wrong.

      The correct approach is column-position parsing: find the HWAM column position in the @ header line,
      then extract the value at the same character position from the data line. The knowledge infrastructure''s
      parse_summary_out.py tool handles this correctly.

      '
    affected_components:
    - Summary.OUT format
    - Any custom parsing code that uses split()
  remedy:
    action: Parse Summary.OUT by column positions from the @ header, not by split(). Or use the knowledge
      infrastructure's parse_summary_out.py tool.
    tool_to_run: parse_summary_out
    manual_steps:
    - Find the @ header line in Summary.OUT
    - Locate the target variable name (e.g., 'HWAM') by string position
    - Extract value from data line at the same character position
    - 'Example: pos = header.find(''HWAM''); val = data[pos:pos+8].strip()'
    prevention: Always use parse_summary_out.py from the knowledge infrastructure. Never reimplement Summary.OUT
      parsing with split().
  severity: silent
  cross_references: []
- id: dt_051
  stage: s5_simulation_controls
  failure_domain: wrong_photosynthesis_method
  symptom:
    description: CROPGRO-based crops (soybean, peanut, dry bean, cotton, chickpea, etc.) produce zero
      yield despite normal phenology. PlantGro.OUT shows LAI stuck near zero while leaf number advances
      normally. OVERVIEW.OUT reports 'Plant died due to extreme stress' with AGEFAC=0.00.
    error_pattern: Plant died due to extreme stress.*AGEFAC.*0\.00
    detection_method: log_match
  diagnosis:
    root_cause: The photosynthesis method (PHOTO) in the FileX simulation controls is set to 'R' (radiation-use
      efficiency) instead of 'L' (leaf-level). CROPGRO requires PHOTO=L; using PHOTO=R causes the leaf-level
      photosynthesis routine to produce near-zero assimilates, resulting in no biomass accumulation.
    explanation: 'DSSAT has two photosynthesis methods: R (radiation-use efficiency, used by CERES models
      for maize, wheat, rice, sorghum) and L (leaf-level canopy photosynthesis, used by CROPGRO for soybean,
      peanut, cotton, dry bean, etc.). When PHOTO=R is used with CROPGRO, the model calculates photosynthesis
      incorrectly, producing near-zero daily carbon gain. The crop emerges and advances through phenological
      stages (driven by temperature and photoperiod, independent of biomass) but never accumulates biomass.
      At maturity the plant dies with AGEFAC=0.00 (all leaves senesced) and zero grain yield.

      '
    affected_components:
    - FileX SIMULATION CONTROLS section (PHOTO field)
    - dssat_workdir_setup.py _generate_filex function
  remedy:
    action: Set PHOTO=L for CROPGRO-based crops in the FileX simulation controls.
    tool_to_run: dssat_workdir_setup.py (fixed in v4.0)
    manual_steps:
    - 'In the FileX, find the line: @N METHODS  WTHER INCON LIGHT EVAPO INFIL PHOTO HYDRO...'
    - Change the PHOTO column from R to L for CROPGRO crops
    - 'CROPGRO crops: soybean, peanut, dry bean, cotton, cowpea, chickpea, pigeon pea, faba bean, canola,
      sunflower, tomato'
    - 'CERES crops (keep PHOTO=R): maize, wheat, rice, sorghum, barley, millet'
    prevention: Use dssat_workdir_setup.py which now automatically sets PHOTO based on the crop model
      engine.
  severity: critical
  cross_references:
  - dt_002 (zero yield)
- id: dt_spam_single_point_undefined_r
  symptom:
    description: DSSAT yield validation against SPAM 2020 returns NaN/uncomputable Pearson r (or trips
      the r<0.5 retry gate) even when simulated yield is within a few % of the SPAM pixel; only one (sim,obs)
      pair exists.
  diagnosis:
    root_cause: SPAM 2020 is a single-year gridded product and crop_obs.get_observed_yield returns one
      scalar, so a single-point run gives one paired value. ki_tools_common.metrics.nse()/pearson_r()
      return NaN for <2 valid pairs (metrics.py:86-90), and obs variance is 0 for one point, so r/NSE/KGE
      are mathematically undefined. The KI's documented skill metric for this case is % bias / nRMSE,
      not single-pair correlation.
  remedy:
    action: 'Build a paired sample: run DSSAT at >=2 sites/pixels with tools/s9_output_parsing/validate_against_spam.py
      and correlate simulated HWAM vs SPAM yield across the sample; exclude FAOSTAT-fallback obs. For
      genuinely single-site runs, score by % bias / nRMSE (within 15%) instead of r.'
  format_spec_violated: spam2020.variables (gridded single-year yield) vs metric requiring >=2 paired
    points (metrics.py _prepare_paired / nse min 2)
  added_by_run: DSSAT_retry1
- id: dt_crop_yield_single_pair_nan_r
  symptom:
    description: Crop-yield validation returns null/NaN for metrics.r (and nse/kge); orchestrator's r<0.5
      gate retries forever even when the simulated yield is close to observed.
  diagnosis:
    root_cause: Only one (sim,obs) pair was built — single DSSAT yield vs single-year SPAM-2020 point
      (ki_tools_common.crop_obs.get_observed_yield returns one scalar). ki_tools_common/metrics.py returns
      NaN for <2 valid pairs, so r is structurally undefined regardless of accuracy.
  remedy:
    action: 'Build a temporal sample: run DSSAT across >=2 simulation years and pair each year''s HWAM
      against a MULTI-YEAR gridded yield product (GDHY v1.2/1.3 1981-2016 or GlobalCropYield5min) via
      crop_obs.get_observed_yield_series, then compute metrics.all_metrics. Use tools/s9_output_parsing/validate_yield_timeseries.py.
      Single-year SPAM cannot produce a defined r — use it only for %bias/nRMSE single-point checks.'
  format_spec_violated: 'validation must supply >=2 paired (sim,obs) points for series metrics (metrics.py:
    o.size<2 -> NaN)'
  added_by_run: DSSAT_retry2
- id: dt_point_vs_national_faostat_low_r
  symptom:
    description: Crop-yield validation has >=2 paired years (r IS computable) and good mean bias (PBIAS
      within ~10%), but r/NSE/KGE are very poor or negative (e.g. r=-0.083, NSE=-12.47) and the r<0.5
      gate retries. Obs source is FAOSTAT national aggregate (--obs faostat) while the simulation is a
      single point.
  diagnosis:
    root_cause: Obs scale/location mismatch, not model physics. A single non-representative point (Bengbu
      32.9N/117.4E, humid S. Anhui) has ~4-5x the national interannual variance and can anti-correlate
      with the national series, which is dominated by a technology trend and the production-weighted centroid
      (NE China + Henan/Shandong). The SAME national FAOSTAT series tracks at r~0.80 from a production-representative
      point (AquaCrop Henan 34.0N/113.0E), proving the failure is obs location/scale.
  remedy:
    action: 'Remap obs to the model''s native point scale: re-run validate_yield_timeseries.py with the
      default --obs gdhy (co-located 0.5deg pixel, GDHY maize 2005-2016 on disk) for the interannual r/NSE/KGE
      gate. Use --obs faostat national only for %bias/nRMSE. FAOSTAT has no sub-national Area, so to compare
      against the national aggregate build a multi-site ensemble at the production centroid first.'
  format_spec_violated: interannual r/NSE/KGE gate requires the obs to be spatially co-located with the
    simulated point (point-vs-national-aggregate is %bias-only)
  canonical_intent: ki_local_if_pass
  added_by_run: DSSAT_retry1
- id: dt_obs_scale_faostat_national_vs_point
  symptom:
    description: DSSAT single-point yield validation reports good mean bias (PBIAS ~+9%) but strongly
      negative/near-zero interannual r and large-negative NSE (e.g. r -0.083, NSE -12.47) against FAOSTAT
      national yield; r-gate (r<0.5) fails or r is nulled, sending the retry loop into an unwinnable retry.
  diagnosis:
    root_cause: 'Obs location/scale mismatch: a single non-representative point (humid-monsoon Bengbu
      32.9N/117.4E) is compared to a national aggregate dominated by a smooth technology/fertilizer trend
      and the NE-China/Henan production centroid. Point interannual variance is ~4-5x national and can
      anti-correlate. obs_shape=regional_aggregate_time_series forbids r/NSE/KGE (valid families magnitude_accuracy,
      trend_match only).'
  remedy:
    action: 'Re-run validate_yield_timeseries.py with --obs gdhy (the tool default): GDHY 0.5deg gridded
      maize (1981-2016, on disk at KISSPATH_DATA/Crop_model_dataset/GDHY_v1.2_v1.3/) is co-located and
      scale-matched to the simulated pixel, making r/NSE/KGE defined and meaningful. Use FAOSTAT national
      as a %bias-only secondary check; provincial FAOSTAT is unavailable.'
  format_spec_violated: 'dssat observability: outputs.HWAM.observability obs_shape contract (regional_aggregate_time_series
    -> [magnitude_accuracy, trend_match] only)'
  canonical_intent: ki_local_if_pass
  added_by_run: DSSAT_retry1
- id: dt_faostat_regional_aggregate_null_r_is_pass
  symptom:
    description: DSSAT multi-year (>=2 yr) yield validation with --obs faostat reports metrics.r/nse/kge
      = null while PBIAS is small (e.g. +8.94%) and trend_sign_agree=true; the orchestrator's r<0.5 gate
      fires and routes the run to diagnosis even though it is a PASS.
  diagnosis:
    root_cause: FAOSTAT national series is obs_shape=regional_aggregate_time_series (dag.yaml outputs.HWAM.observability),
      whose ONLY valid metric families are [magnitude_accuracy, trend_match]. validate_yield_timeseries.py
      intentionally nulls nse/kge/r (kept under _raw_invalid_*) because raw interannual correlation between
      a single humid-monsoon point and a smooth national technology trend is structurally inapplicable
      (point variance ~4-5x national; can even anti-correlate). This is NOT the single-pair/<2-year NaN
      cause of dt_crop_yield_single_pair_nan_r / dt_spam_single_point_undefined_r — here there are 16
      valid pairs and r is nulled by the obs-shape contract, not by pair count.
  remedy:
    action: Score the run on PBIAS (magnitude_accuracy) + sim/obs slope sign (trend_match); if PBIAS within
      tolerance and trend_sign_agree=true, it is a PASS — do NOT retry, do NOT switch to GDHY to chase
      r. Only re-run with --obs gdhy at the simulated pixel (GDHY maize 2005-2016 on disk) if the TASK
      explicitly asks for a point_time_series interannual-pattern comparison. The weak slope_ratio (~0.19)
      is a documented fixed-cultivar/management limitation, not a defect.
  format_spec_violated: 'dag.yaml outputs.HWAM.observability: regional_aggregate_time_series.metric_families=[trend_match,magnitude_accuracy]
    (r/nse/kge are out-of-family and nulled by design)'
  canonical_intent: ki_local_if_pass
  added_by_run: DSSAT_retry1
