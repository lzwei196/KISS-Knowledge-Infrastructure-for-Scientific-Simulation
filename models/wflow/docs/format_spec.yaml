# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: wflow
  language: julia
  implementation:
    id: wflow-jl
    version: 1.1.0-dev
    provenance: Julia; Deltares Wflow.jl package (github.com/Deltares/Wflow.jl), CSDMS standard-name TOML
      configuration.
  scientific_reference_version: Wflow.jl v1.x (CSDMS standard-name TOML era); wflow_sbm SBM concept per
    van Verseveld et al. 2024 GMD
inputs:
  forcing:
  - name: precipitation
    unit: mm Δt⁻¹
    category: forcing
    source_kind: forcing
    model_input_format: gridded NetCDF forcing variable (precip), per cell per timestep
    notes: MUST be mm/timestep (mm/day at daily Δt), NOT mm/s or mm/3hr; no internal unit check, so a
      wrong unit silently scales runoff by up to 86400x.
  - name: air temperature
    unit: °C
    category: forcing
    source_kind: forcing
    model_input_format: gridded NetCDF forcing variable (temp), per cell per timestep
    notes: MUST be Celsius, NOT Kelvin; drives snow precipitation-phase split (threshold tt) and degree-day
      melt. Kelvin values silently break the snow module and PET.
  - name: potential (reference) evapotranspiration
    unit: mm Δt⁻¹
    category: forcing
    source_kind: forcing
    model_input_format: gridded NetCDF forcing variable (pet), per cell per timestep
    notes: Required unless wflow computes PET internally (Penman-Monteith / De Bruin) from individual
      met variables; if missing or zero, all precipitation becomes runoff.
  parameters:
  - name: vertical saturated hydraulic conductivity (KsatVer)
    unit: mm Δt⁻¹
    category: soil
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid
    notes: Typical 10-10000 mm/day. Units differ across models (VIC mm/s, MODFLOW m/day); cross-model
      transfer without conversion makes the soil 86400x too permeable.
  - name: horizontal conductivity fraction (KsatHorFrac)
    unit: dimensionless
    category: soil
    source_kind: calibrated
    model_input_format: staticmaps.nc per-cell grid (multiplier on KsatVer for lateral subsurface flow)
    notes: Sets lateral subsurface saturated conductivity = KsatHorFrac × KsatVer; in practice the primary
      streamflow calibration parameter.
  - name: Ksat exponential decay parameter (f)
    unit: m⁻¹ (mm⁻¹ in KI parameter table)
    category: soil
    source_kind: calibrated
    model_input_format: staticmaps.nc per-cell grid
    notes: Exponential decline of saturated conductivity with depth; controls baseflow-vs-quickflow partitioning
      and recession. Too low → flat baseflow-dominated hydrograph.
  - name: soil thickness (SoilThickness)
    unit: mm
    category: soil
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid
    notes: Typical 500-5000 mm; controls total column water storage capacity.
  - name: Brooks-Corey exponent (c)
    unit: dimensionless
    category: soil
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc with a (layer, y, x) dimension
    notes: Pore-size index; pore-size lambda derived internally as 2/(c-3). MUST carry a layer dimension
      or wflow raises a 'type InputEntries has no field' (3D-vs-2D) error.
  - name: saturated / residual water content (θS, θR)
    unit: dimensionless
    category: soil
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid
    notes: θS > θR required everywhere.
  - name: compacted infiltration capacity (InfiltCapSoil)
    unit: mm Δt⁻¹
    category: soil
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid
    notes: Typical 50-500 mm/day; limits infiltration and thus saturation/infiltration-excess runoff.
  - name: rooting depth (RootingDepth)
    unit: mm
    category: vegetation
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid
    notes: Controls ET extraction depth and soil-moisture availability.
  - name: canopy/LAI parameters (max canopy storage, LAI, light extinction, canopy gap fraction, crop
      coefficient)
    unit: mm / m² m⁻² / dimensionless
    category: vegetation
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grids
    notes: Drive Gash/modified-Rutter interception and transpiration.
  - name: snow degree-day and threshold parameters (degree-day coefficient, snowfall/melt thresholds,
      liquid water holding capacity)
    unit: mm °C⁻¹ Δt⁻¹ / °C / fraction
    category: snow
    source_kind: default
    model_input_format: staticmaps.nc grids or config defaults (degree-day coeff default 3.75)
    notes: HBV temperature-index snow; precipitation phase split at temperature threshold.
  - name: glacier parameters (initial ice equivalent, melting threshold, degree-day coefficient, accumulation
      fraction, glacier area fraction)
    unit: mm / °C / mm °C⁻¹ Δt⁻¹ / dimensionless
    category: glacier
    source_kind: default
    model_input_format: staticmaps.nc grids or config defaults (initial ice eq. default 5500, ddf default
      3.0)
    notes: Built-in degree-day glacier; GlacierFrac all-zeros silently disables glacier melt.
  - name: river Manning roughness (N_River) and overland Manning roughness
    unit: s m⁻¹ᐟ³
    category: routing
    source_kind: calibrated
    model_input_format: staticmaps.nc per-cell grids (defaults 0.036 river, 0.072 overland when absent)
    notes: Controls routed flow velocity and flood-peak timing/magnitude.
  - name: river/land geometry (slope, river width, bankfull depth, river length)
    unit: m m⁻¹ / m
    category: routing
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grids (DEM-derived)
    notes: Placeholder (non-DEM-derived) geometry gives correct timing but 2-3x magnitude error.
  - name: paved/impervious fraction (PathFrac)
    unit: dimensionless
    category: surface
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid
    notes: Typical 0-0.3; sets direct-runoff fraction.
  - name: USLE C cover-management factor
    unit: dimensionless
    category: sediment
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid (from land-cover classification)
    notes: Typical 0.01-0.3 (forest ~0.004, cropland ~0.30, bare ~0.90); near-zero everywhere → silent
      zero erosion. (sediment model only)
  - name: USLE K soil-erodibility factor
    unit: t·ha·h·ha⁻¹·MJ⁻¹·mm⁻¹ (SI)
    category: sediment
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grid
    notes: SI range 0.001-0.1; US-customary values must be ×0.1317 to SI or sediment yield is ~7.6x off.
      (sediment model only)
  - name: grain-size fractions (clay/silt/sand/small-agg/large-agg) and river-bed D50
    unit: fraction / mm
    category: sediment
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc per-cell grids
    notes: Five grain classes MUST sum to 1.0 per cell or the sediment budget is unclosed. (sediment model
      only)
  initial_conditions:
  - name: initial model states (soil/snow/glacier/interception/surface/river storages)
    unit: mm / m / m³ s⁻¹
    category: state_init
    source_kind: user_provided
    model_input_format: instates NetCDF (warm start) or cold_start__flag defaults
    notes: cold_start__flag=true initializes from defaults but the TOML must still declare all 11 state
      variables under [state.variables].
  - name: initial reservoir water level (waterlevel_reservoir)
    unit: m
    category: state_init
    source_kind: user_provided
    model_input_format: staticmaps.nc / instates; reservoir storage re-derived from water level on state
      load
    notes: Active when reservoir__flag is set.
  boundary_conditions:
  - name: DEM / elevation (wflow_dem)
    unit: m
    category: domain
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc grid; y-axis MUST be descending (north first)
    notes: Ascending y-axis inverts the LDD; wflow internally transposes (y,x) and reverses y.
  - name: local drain direction (wflow_ldd)
    unit: dimensionless (D8 code)
    category: domain
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc, float64 with NaN for inactive cells; must be cycle-free
    notes: Cycles → 'cycles detected in flow graph' fatal; boundary cells must be pits in both numpy-
      and wflow-space.
  - name: subcatchment mask (wflow_subcatch) and river mask (wflow_river)
    unit: dimensionless
    category: domain
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc, float64 with NaN inactive; river mask 1 = river cell
    notes: Inactive cells set to 0 instead of NaN are treated as active zero-parameter cells; all-zero
      river mask → zero flow.
  - name: model configuration switches (variant sbm/sbm_gwf/sediment, routing method kinematic vs local_inertial,
      reservoir__flag, lake__flag, glacier toggle, cold_start__flag)
    unit: dimensionless
    category: config_switch
    source_kind: user_provided
    model_input_format: TOML configuration keys
    notes: Select which process and routing modules are active; structural levers.
  - name: simulation window and timestep (starttime, endtime, timestepsecs)
    unit: datetime / s
    category: config
    source_kind: user_provided
    model_input_format: TOML [time] section (backfilled from NetCDF time axis if absent)
    notes: timestepsecs=86400 for daily.
  - name: lateral/external inflows and abstractions
    unit: m³ s⁻¹ (routing) / mm Δt⁻¹ (land)
    category: external_flux
    source_kind: user_provided
    model_input_format: NetCDF/config-specified external flux fields
    notes: Optional prescribed inflows/abstractions; outlet discharge itself is an emergent output, not
      a prescribed BC.
  - name: reservoir operating parameters (ResMaxVolume, reservoir_area, ResDemand, ResMaxRelease, ResTargetFullFrac,
      ResTargetMinFrac, outflowfunc, storfunc)
    unit: m³ / m² / m³ s⁻¹ / dimensionless
    category: reservoir
    source_kind: dataset_lookup
    model_input_format: staticmaps.nc / reservoir tables; outflowfunc 1-4, storfunc 1-2
    notes: ResMaxVolume in MCM instead of m³ (1e6 too small) → immediate overflow with no regulation;
      reservoir_area in km² instead of m² → negligible evaporation; reservoir not on a river cell is silently
      ignored. Active when reservoir__flag is set.
outputs:
  primary:
  - name: river discharge (q_river / river_water__volume_flow_rate)
    unit: m³ s⁻¹
    description: Routed river discharge per cell and at gauge points.
    validation_rank: 1
    emitted_in: output_grid.nc (every cell) and output_scalar.nc (gauge points)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Uncalibrated wflow vs another model (e.g. VIC) can differ 3-5x in magnitude from structural
          uncertainty — assess timing/correlation separately from magnitude.
        - Placeholder (non-DEM-derived) river geometry yields correct timing but 2-3x magnitude bias.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Gridded discharge fields are routing-network dependent; compare on the river mask only.
      detrending_options:
      - none
  - name: unrouted runoff (runoff)
    unit: mm Δt⁻¹
    description: Cell runoff (overland + subsurface lateral) before river routing.
    validation_rank: 2
    emitted_in: output_grid.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Correct variable for external routing coupling; do not compare routed q_river against runoff.
      detrending_options:
      - none
  - name: actual evapotranspiration (actevap)
    unit: mm Δt⁻¹
    description: Actual evapotranspiration (interception + bare-soil + transpiration).
    validation_rank: 3
    emitted_in: output_grid.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Annual ~200-1500 mm is plausible; remote-sensing ET products carry their own retrieval uncertainty.
      detrending_options:
      - none
  - name: soil moisture / saturated water depth (satwaterdepth)
    unit: mm
    description: Saturated-zone water depth / soil water storage state.
    validation_rank: 4
    emitted_in: output_grid.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Model storage is in mm depth; satellite soil moisture is a surface volumetric fraction — compare
          anomalies/patterns, not absolute values.
      detrending_options:
      - none
      - linear_residual
  - name: snow water equivalent (SWE)
    unit: mm
    description: Total snow water equivalent (dry snow + liquid water in pack).
    validation_rank: 5
    emitted_in: output_grid.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: csi
        caveats:
        - Degree-day (temperature-index) snow; depends critically on temperature being in Celsius.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Point SNOTEL-style comparison sensitive to sub-grid elevation.
      detrending_options:
      - none
  - name: groundwater recharge
    unit: mm Δt⁻¹
    description: Recharge flux from the soil column to lateral subsurface / aquifer.
    validation_rank: 6
    emitted_in: output_grid.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Recharge is rarely directly observed; usually evaluated via downstream baseflow or coupled-model
          fluxes.
      detrending_options:
      - none
  - name: reservoir storage (storage_reservoir / reservoir_water__volume)
    unit: m³
    description: Reservoir stored water volume.
    validation_rank: 7
    emitted_in: output_scalar.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Depends on correct ResMaxVolume units (m³, not MCM) and the reservoir being on a river cell.
      detrending_options:
      - none
  - name: soil loss / erosion rate (soilloss)
    unit: t ha⁻¹ yr⁻¹
    description: Gross soil erosion rate per cell (wflow_sediment).
    validation_rank: 8
    emitted_in: output_grid.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Typical 0.5-50 t/ha/yr; sensitive to USLE K SI-vs-US units (~7.6x) and C-factor land-cover lookup.
      detrending_options:
      - none
  - name: sediment yield / specific yield at outlet
    unit: t yr⁻¹ (yield) / t km⁻² yr⁻¹ (specific)
    description: In-stream sediment yield at the basin outlet (wflow_sediment).
    validation_rank: 9
    emitted_in: output_scalar.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Specific yield typically 10-1000 t/km²/yr; grain fractions must sum to 1.0 for a closed budget.
      - obs_shape: regional_aggregate_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Long-term mean specific yield against basin-aggregate sediment surveys.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_w001
  symptom: Runoff is much too high (10x-100x expected) or much too low
  diagnosis: Precipitation is in mm/s or mm/3hr instead of mm/timestep (mm/day for daily wflow); wflow
    expects precipitation in mm per timestep. For daily runs (timestepsecs=86400), that is mm/day. CMFD
    provides mm/3hr (8 values per day). If these are summed to daily without adjusting the total, or if
    mm/s value
  remedy: 'Verify precipitation conversion. For CMFD 3-hourly: sum 8 values per day. For mm/s: multiply
    by 86400.; convert_forcing_to_wflow; [''Check forcing.nc: ncdump -v precip forcing.nc | tail -5'',
    ''Mean daily precip should be 1-10 mm/day for most basins'', ''If mean is <0.01 or >100, units are
    wrong'']; Alway'
  severity: silent
- id: dt_w002
  symptom: Extremely high or zero actual ET throughout simulation
  diagnosis: Temperature is in Kelvin instead of Celsius; wflow expects temperature in degrees Celsius.
    CMFD and MSWX provide Kelvin. If temperature is not converted (subtract 273.15), the snow module will
    never activate (everything above 0K is rain), and PET calculations will be wrong. The model produces
    result
  remedy: 'Convert temperature from Kelvin to Celsius: T_C = T_K - 273.15; convert_forcing_to_wflow; [''Check
    forcing.nc temperature: ncdump -v temp forcing.nc | head -20'', ''If mean temperature is >200, it
    is in Kelvin'', ''Subtract 273.15'']; The convert_forcing_to_wflow.py tool auto-detects Kelvin and
    converts.'
  severity: silent
- id: dt_w003
  symptom: Zero PET everywhere, or PET is 10x too high
  diagnosis: 'PET variable missing, has wrong units, or was not calculated; wflow_sbm requires potential
    evapotranspiration (PET) as forcing input (unless configured to compute it internally from individual
    met variables). If PET is missing or zero, actual ET will be zero and all precipitation becomes runoff.
    If '
  remedy: 'Calculate PET using calculate_pet.py tool (Hargreaves or Penman-Monteith method); calculate_pet;
    ["Check forcing.nc for ''pet'' variable: ncdump -h forcing.nc | grep pet", ''If missing, run calculate_pet.py'',
    ''Expected mean PET: 1-8 mm/day depending on climate'']; Always include PET calculation in forci'
  severity: silent
- id: dt_w004
  symptom: Snow accumulates in tropical basins where it should never snow
  diagnosis: Temperature offset not applied — values still in Kelvin make snow threshold meaningless;
    The wflow snow module uses temperature threshold 'tt' (default 0 degC) to partition precipitation
    into rain and snow. If temperature is in Kelvin (~280-310), ALL precipitation falls as rain (>0),
    which is correc
  remedy: 'Ensure temperature is in Celsius. If Kelvin detected, subtract 273.15.; ; [''Check minimum
    temperature in forcing: should be < 0 for cold basins'', ''If min temp > 200, data is in Kelvin''];
    Use convert_forcing_to_wflow.py which auto-detects Kelvin.'
  severity: silent
- id: dt_w005
  symptom: Sediment yield is 1000x too high or too low
  diagnosis: USLE K factor is in US customary units instead of SI, or C factor lookup uses wrong land
    cover classification; USLE K factor has different units in US customary (t*acre*h/(100*ft-tonf*acre*in))
    and SI (t*ha*h/(ha*MJ*mm)). The conversion factor is approximately 0.1317. If US values are used directly,
  remedy: 'Verify USLE K units. SI range: 0.001-0.1. US range: 0.01-0.7.; ; [''Check mean K value: should
    be 0.01-0.06 in SI for most soils'', ''If K > 0.1, likely US units — multiply by 0.1317'']; build_sediment_model.py
    uses SI units by default.'
  severity: silent
- id: dt_w006
  symptom: Julia throws MethodError on startup when loading Wflow
  diagnosis: 'Wflow.jl version does not match the TOML format used; wflow v1.0 introduced breaking changes
    to the TOML configuration format, using CSDMS standard names. TOMLs generated for pre-v1.0 will cause
    MethodError or KeyError when loaded by v1.0+. Similarly, v1.0+ TOMLs will fail on older Wflow versions.

    ;'
  remedy: 'Check Wflow.jl version and regenerate TOML for the installed version; generate_wflow_toml;
    [''Check version: julia -e \''using Pkg; Pkg.status("Wflow")\'''', ''If v1.0+, use generate_wflow_toml.py
    (generates v1.0 format)'', ''If pre-v1.0, use --legacy flag'']; Always use generate_wflow_toml.py
    to match inst'
  severity: fatal
- id: dt_w007
  symptom: Julia OutOfMemoryError during wflow execution
  diagnosis: Domain too large for available RAM — wflow loads entire spatial grid into memory; Unlike
    VIC which processes cells sequentially, wflow loads the entire staticmaps.nc and forcing.nc into memory.
    For large basins (>100,000 km2) at fine resolution (0.1 deg), memory requirements can exceed 16 GB.
    A 1000
  remedy: 'Reduce domain size or resolution. 0.25 deg uses ~6x less memory than 0.1 deg.; ; ["Check grid
    size: ncdump -h staticmaps.nc | grep ''x = ''", ''If grid > 500x500, consider using 0.25 deg resolution'',
    ''Or split simulation into shorter periods'', ''Monitor memory: julia --threads=1 to reduce memory
    overhea'
  severity: fatal
- id: dt_w008
  symptom: DimensionMismatch error during wflow execution
  diagnosis: staticmaps.nc and forcing.nc have different spatial dimensions; wflow requires the forcing
    grid to match the staticmaps grid exactly — same number of rows (y) and columns (x), same coordinate
    values. If they were generated separately (e.g., staticmaps from HydroMT, forcing from convert_forcing_to_wf
  remedy: 'Ensure staticmaps.nc and forcing.nc have identical y and x dimensions; ; ["ncdump -h staticmaps.nc
    | grep -E ''y|x''", "ncdump -h forcing.nc | grep -E ''y|x''", ''Compare coordinate values: must be
    identical'', ''If different, regenerate forcing using staticmaps.nc as grid reference'']; Use --staticmaps_nc '
  severity: fatal
- id: dt_w009
  symptom: wflow takes 30-60 seconds before any output appears, then runs normally
  diagnosis: Julia JIT compilation on first run — this is normal behavior, not an error; Julia compiles
    code just-in-time on first execution. Loading Wflow.jl triggers compilation of thousands of methods.
    This takes 30-60 seconds on first run, ~5 seconds on subsequent runs in the same Julia session. This
    is a fu
  remedy: 'Wait patiently. This is normal Julia behavior.; ; [''First run: expect 30-60s delay before
    progress output'', ''Subsequent runs: ~5s startup'', ''For production: use PackageCompiler.jl to create
    sysimage (~2s startup)'']; Use PackageCompiler sysimage for production deployments.'
  severity: degraded
- id: dt_w010
  symptom: KeyError or 'variable not found' when wflow reads TOML config
  diagnosis: TOML references variable names not present in staticmaps.nc, or uses old naming convention;
    wflow v1.0 uses CSDMS standard names for variables. If the TOML references 'ksat' but staticmaps.nc
    has 'KsatVer', or vice versa, wflow will fail with KeyError. Most online tutorials and examples use
    pre-v1.0
  remedy: 'Check variable names in staticmaps.nc match TOML references; ; [''List variables: ncdump -h
    staticmaps.nc'', ''Compare with TOML [input.static] section'', ''Use generate_wflow_toml.py to regenerate
    TOML'']; Always generate TOML and staticmaps together or verify name consistency.'
  severity: fatal
- id: dt_w011
  symptom: TOML parse error on wflow startup
  diagnosis: 'Invalid TOML syntax — missing quotes, wrong brackets, or malformed values; TOML is strict
    about syntax: string values need quotes, arrays use brackets, nested sections use dotted keys or [[double
    brackets]] for arrays of tables. A common mistake is using = without quotes for string values, or
    mixing'
  remedy: Validate TOML syntax with a linter before running wflow; ; ['python -c "import tomllib; tomllib.load(open(\'wflow_sbm.toml\',\'rb\'))"',
    'Fix reported syntax errors', 'Or regenerate TOML using generate_wflow_toml.py']; Always use generate_wflow_toml.py
    which produces valid TOML.
  severity: fatal
- id: dt_w012
  symptom: All cells have identical parameter values despite spatial parameter map
  diagnosis: TOML scale=0 or offset dominates — the spatial variation is overridden; If the TOML sets
    scale=0 for a parameter, all values become 0 regardless of the NetCDF map. If offset is set to a large
    value with scale=0, all cells get the offset value uniformly. This is a calibration mistake, not a
    code erro
  remedy: Check TOML scale/offset values. scale=0 zeroes the parameter. Default should be scale=1, offset=0.;
    adjust_parameters; ["grep 'scale' wflow_sbm.toml", 'Verify no scale=0 entries', 'Use adjust_parameters.py
    --list_params to see valid ranges']; Review parameter adjustments before running.
  severity: silent
- id: dt_w013
  symptom: River routing produces zero flow everywhere
  diagnosis: River network not properly defined in staticmaps.nc — wflow_river mask is all zeros; The
    kinematic wave routing requires a river network defined in staticmaps.nc (wflow_river variable). If
    this is all zeros or all ones, routing will fail silently. The manual build uses a placeholder that
    marks all c
  remedy: Verify wflow_river in staticmaps.nc has a proper channel network pattern; ; ['python -c "import
