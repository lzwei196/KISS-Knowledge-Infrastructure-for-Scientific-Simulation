validation:
- obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.75
      good: 0.65
      satisfactory: 0.5
    pass_band: satisfactory
    band_note: 'Moriasi 2007 Table 4 watershed-scale flow: satisfactory 0.50<NSE<0.65, good 0.65-0.75,
      very good >0.75; Moriasi 2015 keeps NSE>0.50 satisfactory for watershed flow.'
    cites:
    - moriasi2007
    - moriasi2015
    - arnold2012
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: 10
      good: 15
      satisfactory: 25
    pass_band: satisfactory
    band_note: 'Moriasi 2007 streamflow PBIAS: very good <+/-10, good +/-10-15, satisfactory +/-15-25,
      unsatisfactory >+/-25. NOTE Moriasi 2015 tightens watershed-flow satisfactory to PBIAS <= +/-15%;
      use 15 for a stricter gate.'
    cites:
    - moriasi2007
    - moriasi2015
  secondary_metrics:
  - metric: kge
    direction: maximize
    status: supportive
    ceiling_reason: 'KGE is the mHM community''s routine objective function but has no Moriasi-style tier
      table; floor -0.41 = a run beats the mean-flow benchmark (Dembele 2022). Achieved mHM benchmarks:
      KGE 0.53 sparsely-gauged W-Africa (Pomeon 2018), up to 0.91-0.93 seamless-MPR Rhine (Samaniego 2017);
      mRM routing changes median KGE by <0.11 (Thober 2019).'
    cites:
    - dembele2022
    - pomeon2018
    - samaniego2017
    - thober2019
  - metric: rsr
    direction: minimize
    status: supportive
    ceiling_reason: 'RMSE-to-obs-SD ratio; Moriasi 2007 Table 4: satisfactory 0.60<RSR<0.70, good 0.50-0.60,
      very good <0.50. Co-reported with NSE (RSR=sqrt(1-NSE)).'
    cites:
    - moriasi2007
  validated_when: NSE >= 0.50 (Moriasi satisfactory) AND |PBIAS| <= 25% for streamflow. mHM's own German
    operational convention calibrates catchments to NSE >= 0.65 (Zink 2017, ~good tier).
  evidence_strength: strong
  confidence: 0.85
  notes: 'Headline quantity and the dag determining_metric (nse) is retained. Moriasi 2007: "model simulation
    can be judged as satisfactory if NSE > 0.50 and RSR < 0.70, and if PBIAS < +/-25% for streamflow";
    Arnold/SWAT 2012 reproduces "NSE ... >0.75 ... very good" per Moriasi 2007. Zink 2017 German ensemble:
    basins accepted at "a Nash-Sutcliffe model efficiency of 0.65 (NSE >= 0.65)". Gauge must snap to the
    correct L11 routing cell (a mis-snapped gauge zeros discharge) and routing resolution can shift peak
    timing 1-3 days (dag caveats) — a timing offset is not a water-balance failure.'
  dag_variable: mRM_runoff (routed discharge)
- obs_shape: spatial_time_series
  headline_metrics:
  - metric: spaef
    direction: maximize
    unit: dimensionless
    bands:
      very_good: null
      good: null
      satisfactory: null
    pass_band: satisfactory
    band_note: 'SPAEF optimum = 1 (Koch 2018, three equally-weighted components: correlation, CV-ratio,
      histogram-match). NO generic numeric pass threshold exists: Dembele 2022 — "it is difficult to formulate
      generic guidelines for the desired range of SPAEF and KGE ... lower bound of -0.41 for KGE and -0.73
      for SPAEF". Benchmark spatial-AET calibration in Germany reaches only average SPAEF ~= 0.46 (Demirel
      2018: "although not perfect (average SPAEF = 0.46)"). Un- thresholded => gate may contextualize,
      never auto-validate or loosen.'
    cites:
    - koch2018
    - demirel2018
    - dembele2022
  secondary_metrics:
  - metric: csi
    direction: maximize
    status: supportive
    ceiling_reason: dag placeholder metric for spatial AET is csi (categorical), but the mHM/remote-sensing
      literature judges continuous spatial ET patterns with SPAEF (Koch 2018; Demirel 2018; Dembele 2022),
      which supersedes csi here.
    cites:
    - koch2018
  validated_when: Spatial AET pattern judged by SPAEF (optimum 1); no cited pass tier — contextual only.
    Benchmark spatial calibrations achieve SPAEF ~0.4-0.6.
  evidence_strength: moderate
  confidence: 0.4
  notes: SPAEF is a well-established convention metric (moderate) but carries no field pass threshold
    (band null, confidence 0.4). Spatial AET pattern is set by PET-correction/aspect and vegetation parameters,
    not by discharge-only calibration (dag caveat) — spatial ET failure under a Q-only calibration is
    a calibration-design limitation, not necessarily a KI defect.
  dag_variable: aET (actual evapotranspiration)
- obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      satisfactory: null
    pass_band: satisfactory
    band_note: No fetched paper reports a flux-tower / point AET NSE tier; the Moriasi 2007/2015 tiers
      were derived for streamflow (and sediment/nutrient), not for ET, so they are not transferred here.
    cites: []
  secondary_metrics: []
  validated_when: UNRESOLVED — no cited point-ET temporal-skill threshold in the fetched set.
  evidence_strength: weak
  confidence: 0.3
  notes: dag determining_metric (nse) retained but null-banded per the no-fabrication rule. PET-method/
    forcing mismatch (e.g. Hargreaves with only tavg) systematically biases aET (dag caveat). A flux-
    tower ET evaluation reporting NSE/RMSE tiers would raise this block.
  dag_variable: aET (actual evapotranspiration)
- obs_shape: spatial_time_series
  headline_metrics:
  - metric: spaef
    direction: maximize
    unit: dimensionless
    bands:
      very_good: null
      good: null
      satisfactory: null
    pass_band: satisfactory
    band_note: 'Same SPAEF convention as spatial AET: optimum 1 (Koch 2018), no generic pass threshold
      (Dembele 2022: "difficult to formulate generic guidelines"; floor -0.73). Satellite spatial soil-moisture
      patterns are evaluated with SPAEF/its components, not a fixed tier.'
    cites:
    - koch2018
    - demirel2018
    - dembele2022
  secondary_metrics:
  - metric: csi
    direction: maximize
    status: supportive
    ceiling_reason: dag placeholder for spatial SM is csi; the field uses SPAEF for continuous spatial
      soil-moisture patterns (Koch 2018; Demirel 2018).
    cites:
    - koch2018
  validated_when: Spatial soil-moisture pattern judged by SPAEF (optimum 1); no cited pass tier — contextual
    only.
  evidence_strength: moderate
  confidence: 0.4
  notes: Satellite SM products sense a shallow surface layer — compare against the matching model horizon
    (dag caveat). SPAEF metric is solid; pass threshold is undefined (band null, confidence 0.4).
  dag_variable: SM (soil moisture)
- obs_shape: point_time_series
  headline_metrics:
  - metric: r
    direction: maximize
    unit: dimensionless
    bands:
      satisfactory: null
    pass_band: satisfactory
    band_note: No fetched paper gives a model-vs-obs point soil-moisture r tier. Kunnath-Poovakka 2019
      notes satellite SM has "typical correlations of greater than 0.8" against ground SM — but that is
      an obs-product inter-comparison, NOT a model-validation pass threshold, so it is not adopted as
      a band.
    cites:
    - kunnath2018
  secondary_metrics: []
  validated_when: UNRESOLVED — no cited point soil-moisture r threshold; anomaly/index comparison often
    more meaningful than absolute mm (dag caveat).
  evidence_strength: weak
  confidence: 0.3
  notes: Absolute SM magnitude depends on soil-depth configuration (dag caveat); correlation of anomalies
    is the practical target but has no fetched numeric tier.
  dag_variable: SM (soil moisture)
- obs_shape: spatial_time_series
  headline_metrics:
  - metric: spaef
    direction: maximize
    unit: dimensionless
    bands:
      satisfactory: null
    pass_band: satisfactory
    band_note: Per-cell generated runoff is pre-routing and rarely observed spatially; SPAEF (optimum
      1, Koch 2018) is the applicable spatial-pattern metric but there is no cited pass threshold, and
      there is no gridded runoff obs product bound in obs_map.
    cites:
    - koch2018
  secondary_metrics: []
  validated_when: UNRESOLVED — do not compare per-cell generated runoff to gauge hydrographs (dag caveat);
    no cited spatial pass tier.
  evidence_strength: weak
  confidence: 0.3
  notes: Included for completeness; the gradeable runoff signal is the routed discharge block above, not
    per-cell generated runoff.
  dag_variable: total_runoff (Q)
