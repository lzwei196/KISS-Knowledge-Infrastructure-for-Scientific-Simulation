# Hydrologic validation conventions are grounded in fetched/cached full texts only.
# Moriasi et al. 2015 is the updated watershed-scale flow criterion used for
# NSE and PBIAS bands. Moriasi et al. 2007 is retained for the older RSR rule
# and for the widely reproduced hydrologic model evaluation context. HEC-HMS
# application papers corroborate that field practice evaluates HEC-HMS by
# observed-vs-simulated hydrographs using NSE/PBIAS/R2/RMSE-style measures.

