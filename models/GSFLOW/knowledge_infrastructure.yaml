# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: GSFLOW
  language: fortran
  implementation:
    id: gsflow-v2
    version: 2.3.1 (gsflow_v2)
    provenance: Fortran 90 + C; USGS public-domain GSFLOW couples PRMS-V surface hydrology with MODFLOW-2005/MODFLOW-NWT
      groundwater flow.
  scientific_reference_version: GSFLOW (USGS TM 6-D1, 2008; PRMS + MODFLOW-2005/MODFLOW-NWT integration),
    2.2.x lineage
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/GSFLOW/source/repo/autotest/gsflow
    type: ELF
pipeline:
  stages: []
tools:
  count: 5
  files:
  - tools/build_control_file.py
  - tools/convert_forcing_to_gsflow.py
  - tools/convert_soil_params.py
  - tools/parse_gsflow_output.py
  - tools/run_gsflow.py
inputs:
  forcing:
  - name: precipitation
    unit: in/day (precip_units=0) or mm/day (precip_units=1)
  - name: air temperature (tmax and tmin)
    unit: degF (temp_units=0) or degC (temp_units=1)
  - name: solar radiation (swrad)
    unit: Langleys/day (cal/cm²/day)
  - name: potential ET (potet)
    unit: in/day
  - name: pan evaporation
    unit: length
  - name: observed streamflow
    unit: ft³/s (runoff_units=0) or m³/s (runoff_units=1)
  parameters:
  - name: soil_moist_max
    unit: in
  - name: soil_rechr_max
    unit: in
  - name: ssr2gw_rate
    unit: fraction/day
  - name: slowcoef_lin / fastcoef
    unit: 1/day
  - name: gwflow_coef
    unit: 1/day
  - name: smidx_coef / smidx_exp
    unit: dimensionless
  - name: jh_coef
    unit: dimensionless
  - name: rain_cbh_adj / snow_cbh_adj / tmax_cbh_adj / tmin_cbh_adj
    unit: factor / degrees
  - name: hru_area
    unit: acres
  - name: hru_elev / hru_slope / hru_aspect / hru_type
    unit: ft or m (elev_units) / fraction / degrees / code
  - name: soil_type
    unit: code (1=sand,2=loam,3=clay)
  - name: cov_type / covden_sum / covden_win
    unit: code / fraction (0–1)
  - name: hru_percent_imperv / imperv_stor_max
    unit: fraction / in
  - name: MODFLOW hydraulic conductivity / transmissivity (HK, VKA)
    unit: length/time
  - name: streambed / lakebed leakance (SFR, LAK)
    unit: length/time per length
  initial_conditions:
  - name: initial groundwater heads
    unit: length
  - name: initial soil moisture / recharge-zone storage
    unit: in
  - name: initial snowpack water equivalent
    unit: in
  - name: initial unsaturated-zone and gravity-reservoir storage
    unit: length
  boundary_conditions:
  - name: model_mode
    unit: code
  - name: start_time / end_time
    unit: Y M D H Min S
  - name: modflow_time_zero
    unit: date
  - name: climate module selection (temp_module, precip_module, solrad_module, et_module)
    unit: switch
  - name: process module selection (srunoff_module, strmflow_module, soilzone_module)
    unit: switch
  - name: unit codes (temp_units, precip_units, runoff_units, elev_units)
    unit: integer code
  - name: MODFLOW external boundaries (CHD, GHB, FHB, WEL)
    unit: head / flux
  - name: 'MODFLOW solver selection and tolerances (NWT/PCG: MXITER, HCLOSE)'
    unit: switch / convergence criteria
  - name: MODFLOW LENUNI / ITMUNI
    unit: length/time unit code
  - name: cascade routing network (ncascade, hru_up_id, hru_down_id, hru_segment, cascade_flg)
    unit: topology
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - basin_cfs
  - basin_stflow
  - basin_actet
  - basin_recharge
  - gw_head (MODFLOW .hds)
  - basin_snow
  - basin_soil_moist
  - overall water budget (IN/OUT, percent discrepancy)
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=-0.513, KGE=0.359, R=0.477'
  metrics:
    best_nse: -0.5134
    best_kge: 0.3594
    best_r: 0.4774
summary:
  total_tools: 5
  total_stage_docs: 0
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
