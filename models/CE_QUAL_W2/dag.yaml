      doi: "10.3390/w15061013"
      note: "CE-QUAL-W2 tropical reservoir (Urra); calibration/dominance study (best-fit WSC=0.4, EXH2O=0.75; no variance-based SA indices) finding EXH2O, BETA, WSC dominant for temperature/stratification, sediment heat exchange minor"
    wells2019_w2_outflow_temp_do_nutrients:
      short_citation: "Wells et al. 2019"
      doi: "10.1038/s41597-019-0316-y"
      note: "CE-QUAL-W2 descriptive dataset paper on outlet-elevation impact on downstream temperature, DO and nutrients; withdrawal elevation and SOD calibrated (not a quantitative SA)"
    terrain2024_w2_wsc_tuning:
      short_citation: "Terrain-based WSC tuning 2024"
      doi: "10.1007/s40996-024-01719-9"
      note: "Terrain-based WSC/RMSE-reduction tuning method (no variance-based sensitivity metrics); confirms WSC, EXH2O, BETA, wind-function coefficients as dominant thermal-calibration parameters"

safety:
  hazards:
    - id: "cloud_cover_units_tenths"
      kind: "weather_file_semantic"
      description: "CLOUD given as fraction (0-1) or percent instead of tenths (0-10); model sees near-clear sky and warms water 3-5 C with no error"
      severity: "silent"
    - id: "dewpoint_vapor_pressure_units"
      kind: "weather_file_semantic"
      description: "vapor pressure in Pa/hPa instead of kPa before TDEW conversion drives dew point to ~-40 C, causing excess evaporation/thermal error"
      severity: "silent"
    - id: "inflow_discharge_units"
      kind: "weather_file_semantic"
      description: "branch inflow not in m^3/s (e.g., supplied as mm/day grid runoff) makes discharge off by orders of magnitude; reservoir fills/drains unrealistically"
      severity: "silent"
    - id: "wind_direction_units_version"
      kind: "weather_file_semantic"
      description: "wind direction in radians when v4.x+ expects degrees (or vice versa) reverses circulation and surface temperature asymmetry"
      severity: "silent"
    - id: "decimal_julian_day"
      kind: "weather_file_semantic"
      description: "JDAY given as integer instead of decimal (DOY + hour/24 + min/1440) loses the diurnal cycle and shifts seasonal/shortwave phasing"
      severity: "silent"
    - id: "control_file_8char_fixed_width"
      kind: "control_semantic"
      description: "any numeric field in w2_con not exactly 8 chars right-justified shifts the fixed-width Fortran FORMAT columns; all subsequent parameters read as garbage with no error"
      severity: "silent"
    - id: "bathymetry_8char_field"
      kind: "soil_semantic"
      description: "bth_wb*.npt width values exceeding the 8-char FORMAT field are misread or the file is rejected"
      severity: "fatal_or_silent"
    - id: "file_path_72char_truncation"
      kind: "parser_semantic"
      description: "input file paths over the Fortran CHARACTER*72 limit are silently truncated, yielding file-not-found despite the file existing"
      severity: "fatal"
    - id: "timeseries_coverage"
      kind: "control_semantic"
      description: "any time-series input (met/qin/tin/qot) not spanning TMSTRT-TMEND causes a read-past-EOF crash or partial results"
      severity: "fatal"
    - id: "zero_width_active_segment"
      kind: "soil_semantic"
      description: "an active segment with zero width at all layers (no water column) triggers a layer/zero-thickness error at startup"
      severity: "fatal"
    - id: "cfl_short_segment"
      kind: "numerical_instability"
      description: "segment length too short relative to layer thickness violates CFL, forcing sub-second timesteps and accumulating instability/NaN"
      severity: "degraded"
    - id: "invalid_branch_dhs"
      kind: "control_semantic"
      description: "branch DHS pointing to a non-existent or wrong segment in the receiving branch crashes at the junction"
      severity: "fatal"
    - id: "nonmonotonic_bottom_elevation"
      kind: "soil_semantic"
      description: "bottom elevation rising downstream traps water in a depression; model runs but produces unphysical upstream flow"
      severity: "silent"
    - id: "elws_below_elbot"
      kind: "initial_condition_semantic"
      description: "initial water surface elevation below bottom elevation at active segments crashes at startup unless wetting/drying is enabled"
      severity: "fatal"
    - id: "constituent_column_mismatch"
      kind: "control_semantic"
      description: "number of constituents ON not matching cin_br*.npt column count: data ignored (flag off) or column-shift corruption of later constituents (flag on, missing column)"
      severity: "silent"
    - id: "sod_too_high"
      kind: "coefficient_runtime_silent_fallback"
      description: "SOD set too high (e.g., 5 gO2/m^2/day) silently drives full hypolimnion anoxia within days"
      severity: "silent"
    - id: "algal_growth_rate_too_high"
      kind: "coefficient_runtime_silent_fallback"
      description: "algal growth rate >2.5/day with unconstrained nutrients produces an unphysical bloom (chlorophyll >1000 ug/L)"
      severity: "silent"
    - id: "outlet_elevation_datum"
      kind: "control_semantic"
      description: "outlet elevation entered as depth-from-surface instead of m ASL on the bathymetry datum draws water from the wrong thermal layer, biasing release temperature"
      severity: "silent"
    - id: "outflow_units"
      kind: "control_semantic"
      description: "outflow not in m^3/s (L/s or m^3/day) drains or fills the reservoir unrealistically"
      severity: "silent"
    - id: "negative_layer_thickness"
      kind: "numerical_instability"
      description: "drawdown below a layer boundary without wetting/drying produces NEGATIVE THICKNESS and the model stops"
      severity: "fatal"
    - id: "bathymetry_gradient_nan"
      kind: "numerical_instability"
      description: "sharp width gradients (e.g., 500 m to 50 m) or extreme forcing (wind >30 m/s) produce NaN and a mid-run crash"
      severity: "fatal"
    - id: "missing_output_cards"
      kind: "control_semantic"
      description: "missing or zero-interval SNP/TSR/SPR output cards yield exit 0 with no output files produced"
      severity: "silent"
  validation_limits:
    - "inappropriate for waterbodies with significant lateral (cross-channel) water-quality variation (lateral averaging); best for length:width > 5:1"
    - "hydrostatic + Boussinesq approximations with vertical momentum neglected: inaccurate where vertical acceleration is significant (selective-withdrawal algorithm only partially compensates near withdrawals)"
    - "not a 3-D model; complex 3-D circulation requires a different model"
    - "upwind transport adds numerical diffusion often exceeding physical diffusion; QUICKEST/ULTIMATE reduce it but can over/undershoot in high-gradient areas (small negative concentrations)"
    - "zero-order SOD varies only with temperature and is uncoupled from the water column; first-order sediment model only handles labile oxic decay"
    - "sediment diagenesis model is data-intensive; data availability is often the limiting factor"
    - "auto-stepping does not guarantee stability in all cases; grid spacing must vary gradually and results should be verified grid-independent"
  warnings:
    - "temperature transport cannot be turned off; it can be made conservative only by disabling heat-exchange (HEATC), and density always depends on temperature via the equation of state"
    - "an appropriate vertical turbulence closure must be selected for the waterbody type (k-epsilon recommended); the choice changes AZ and stratification"
    - "release temperature/DO depend critically on the correct outlet elevation in m ASL and on stratification being resolved"
    - "WQ constituents are only meaningful when the relevant constituent flags are ON and the kinetic coefficients are calibrated; otherwise concentrations stay at initial/zero"
  assumptions:
    - statement: "Governing equations are laterally and layer averaged in conservative form under the Boussinesq and hydrostatic approximations; vertical momentum is neglected."
      scope: "all hydrodynamics"
      source: "CE-QUAL-W2 User Manual Part 1 (Wells 2026), Capabilities and Limitations - Theoretical, p.26; http://cee.pdx.edu/w2/W2manual455_Part1_Intro_rev0.pdf"
      status: "adopted"
    - statement: "Mass-balance closure holds for water volume and each active constituent; the surface energy budget is the equilibrium-temperature / term-by-term heat-exchange flux, not a fully resolved 3-D energy field."
      scope: "water and constituent transport; surface heat exchange"
      source: "heat-exchange.f90 (CSHE/back-radiation/Bowen terms) and balances.F90 volume/mass accounting; CE-QUAL-W2 User Manual Part 1"
      status: "adopted"
    - statement: "Wind direction is interpreted in degrees (0-360), consistent with v4.x+; radians input is treated as a unit error."
      scope: "meteorological forcing"
      source: "CE-QUAL-W2 User Manual surface boundary condition / WDIC card; version-dependence noted in v3.x"
      status: "adopted"

medium_evidence:
  - var: "dam release temperature"
    source: "dag.yaml"
    quote: "water temperature and density-driven thermal stratification"
    note: "scope_in declares the model temperature state as water; selective withdrawal produces the dam-release temperature output."
  - var: "dissolved oxygen"
    source: "dag.yaml"
    quote: "water quality kinetics (DO, NH4, NO3, bioavailable P, organic matter, algae/periphyton, CBOD, TDS/ISS, zooplankton, macrophytes, sediment diagenesis)"
    note: "scope_in declares DO under water quality kinetics, so the output is dissolved oxygen in reservoir water."
