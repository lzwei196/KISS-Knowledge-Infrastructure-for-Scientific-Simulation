  _caveat: "RHESSys forcing/structural drivers (precipitation spatial extrapolation, air-temperature interpolation, soil depth) are mechanistically dominant but the available literature (tague2012, garcia2013, tague2004) characterizes them only qualitatively as uncertainty sources / method comparisons, with no variance-based sensitivity index; they are therefore capped at MEDIUM despite likely high real-world influence. Quantitative Morris-ranked edges (smith2022, mengistu2016) retain HIGH."
