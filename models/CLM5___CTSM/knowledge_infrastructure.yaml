package:
  name: CLM5_CTSM
  language: fortran
  implementation:
    id: clm5-ctsm
    version: CTSM 5.4
    provenance: Fortran 2003+; NCAR/UCAR CTSM 5.4, the land component of CESM, realizing the CLM5/CLM6
      land-surface science.
  scientific_reference_version: CLM5/CTSM (CTSM 5.4 framework; CLM4.5/CLM5.0/CLM6.0 selectable physics)
  binary:
    path: KISSPATH_HOME/cesm/scratch/test_clm5/bld/cesm.exe
    type: work_dir
pipeline:
  stages:
  - s0_configuration_skill
  - s2_forcing_skill
  - s3_soil_params_skill
  - s6_execution_skill
  - s7_output_analysis_skill
tools:
  count: 5
  files:
  - tools/convert_forcing_to_clm.py
  - tools/convert_soil_params.py
  - tools/make_site_dataset.py
  - tools/parse_clm_output.py
  - tools/run_clm.py
inputs:
  forcing:
  - name: TBOT
    unit: K
  - name: QBOT
    unit: kg/kg
  - name: WIND
    unit: m/s
  - name: PRECTmms
    unit: mm/s (kg/m2/s)
  - name: FSDS
    unit: W/m2
  - name: FLDS
    unit: W/m2
  - name: PSRF
    unit: Pa
  - name: co2_ppmv
    unit: ppmv
  parameters:
  - name: PFT/CFT fractions
    unit: fraction
  - name: soil texture (sand/clay/silt %)
    unit: '%'
  - name: soil organic matter
    unit: kg/m3
  - name: soil bulk density / soil color
    unit: kg/m3 / index
  - name: PFT physiological parameters
    unit: various
  - name: medlynslope
    unit: dimensionless
  - name: baseflow_scalar
    unit: dimensionless
  - name: fff
    unit: 1/m
  initial_conditions:
  - name: finidat
    unit: n/a
  - name: soil/vegetation carbon-nitrogen pools
    unit: gC/m2
  - name: initial soil moisture/temperature, snow state
    unit: mm3/mm3, K, mm
  boundary_conditions:
  - name: physics/compset mode
    unit: n/a
  - name: calendar
    unit: n/a
  - name: spinup_state / CLM_ACCELERATED_SPINUP
    unit: n/a
  - name: land use transitions
    unit: fraction
  - name: co2_type
    unit: n/a
  - name: resolution / domain file
    unit: n/a
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
