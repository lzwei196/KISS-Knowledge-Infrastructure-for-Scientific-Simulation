schema_version: 1
model_id: Noah_MP
domain: hydrology                 # land-surface model spanning hydrology / cryosphere / biogeochem
generated_by: "self-improve session (Claude Opus 4.8) — validation-convention campaign, general schema"
generated_at: 2026-07-06

# Grounded ONLY in locally-fetched OA full texts (no new DOIs fetched; 28-paper cache complete).
# Five headline quantities the Noah-MP KI produces and the obs_map binds (LE->latent-heat/ET,
# discharge->routed runoff) or the field routinely evaluates (SWE, soil moisture, GPP):
#   * RUNOFF  = best-grounded (PRESCRIPTIVE Moriasi 2007 NSE/PBIAS/RSR tiers, reproduced verbatim in
#               two OA SWAT papers) -> strong.
#   * ET/LE   = flux-tower RMSE vs eddy-covariance + post-closure-uncertainty-band tolerance -> strong.
#   * SWE     = point RMSE / peak-SWE bias vs SNOTEL/pillow/ASO, explicit tier bands -> strong.
#   * GPP     = FLUXNET RMSE ~30% "acceptable" (Jung 2007) + a documented dynamic-veg/LAI structural
#               ceiling (Niu 2020, Ma 2017) -> strong but ceiling-bounded.
#   * SOIL M  = in-situ RMSE / correlation envelope (Zhuo 2019, Gao 2015); no stated pass threshold
#               in the fetched set -> moderate.
# Bands are plain numbers read via `direction` (see VALIDATION_CONVENTION_SCHEMA.md). Where a paper
# reports achieved Noah-MP skill rather than a stated pass target, the band is a benchmark envelope and
# confidence is held moderate. NOTE: the skeleton's has_obs_binding flags are a stale name-join
# (validation var `LH` vs obs_map `LE`; `SNEQV`/`SMOIS`/`GPP` unmatched); real obs bindings exist for
# latent heat (ET) and routed discharge (runoff), and SWE/SM/GPP are the field-standard LSM targets.

