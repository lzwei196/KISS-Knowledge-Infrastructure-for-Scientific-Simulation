# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: SimFire
  language: python
  implementation:
    id: simfire
    version: 2.0.1
    provenance: Python; MITRE Fireline open-source 2-D cellular wildfire simulator implementing the Rothermel
      surface fire spread equation over a pixel grid.
  scientific_reference_version: Rothermel surface fire spread model (USDA Forest Service RMRS-GTR-371;
    Anderson FBFM-13 fuel models)
inputs:
  forcing:
  - name: wind speed
    unit: mph (config); converted internally to ft/min via mph_to_ftpm
    category: atmospheric
    source_kind: forcing
    model_input_format: wind.simple.speed / wind.perlin.speed.range_* (mph) or wind.cfd.speed (m/s); per-pixel
      U grid in ft/min internally
    notes: Authored in mph in YAML and converted by mph_to_ftpm; a pre-converted ft/min value is multiplied
      by ~88 again (catastrophic over-spread). m/s authored as mph under-spreads by ~2.24x. CFD path takes
      m/s.
  - name: wind direction
    unit: degrees clockwise from North (TO-direction convention)
    category: atmospheric
    source_kind: forcing
    model_input_format: wind.simple.direction / wind.perlin.direction.range_* (degrees); per-pixel U_dir
      grid
    notes: 'TO-direction: 90 means wind blows toward East, the OPPOSITE of meteorological ''from'' convention.
      rothermel.py uses radians(90 - U_dir); fire spreads toward U_dir.'
  - name: dead fuel moisture
    unit: fraction
    category: environment
    source_kind: forcing
    model_input_format: environment.moisture (scalar fraction, M_f)
    notes: Fraction not percent (0.03 = 3%). If M_f >= fuel moisture of extinction M_x, the moisture damping
      eta_M floors to ~0 and fire silently never spreads.
  parameters:
  - name: oven-dry fuel load (w_0)
    unit: lb/ft2
    category: fuel_bed
    source_kind: dataset_lookup
    model_input_format: per-pixel Fuel(w_0) from FBFM-13 preset (1-13) or procedural function; range 0.034-0.321
    notes: FBFM-13 presets already in lb/ft2; only custom fuels risk kg/m2 confusion (x0.2048).
  - name: fuel bed depth (delta)
    unit: ft
    category: fuel_bed
    source_kind: dataset_lookup
    model_input_format: per-pixel Fuel(delta) from FBFM-13 preset; range 0.2-6.0
  - name: dead fuel moisture of extinction (M_x)
    unit: fraction
    category: fuel_bed
    source_kind: dataset_lookup
    model_input_format: per-pixel Fuel(M_x) from FBFM-13 preset; range 0.12-0.40
  - name: surface-area-to-volume ratio (sigma)
    unit: ft2/ft3
    category: fuel_bed
    source_kind: dataset_lookup
    model_input_format: per-pixel Fuel(sigma) from FBFM-13 preset; range 1145-3500
  - name: low heat content (h)
    unit: BTU/lb
    category: fuel_particle
    source_kind: default
    model_input_format: FuelParticle.h constant = 8000 (hardcoded, not exposed in config)
  - name: total mineral content (S_T)
    unit: fraction
    category: fuel_particle
    source_kind: default
    model_input_format: FuelParticle.S_T constant = 0.0555
  - name: effective mineral content (S_e)
    unit: fraction
    category: fuel_particle
    source_kind: default
    model_input_format: FuelParticle.S_e constant = 0.01
  - name: oven-dry particle density (rho_p)
    unit: lb/ft3
    category: fuel_particle
    source_kind: default
    model_input_format: FuelParticle.p_p constant = 32
  - name: elevation
    unit: ft
    category: topography
    source_kind: dataset_lookup
    model_input_format: per-pixel TopographyLayer elevation grid (operational LandFire 30 m, functional
      Perlin/Gaussian/flat, or historical); slope magnitude and aspect derived via np.gradient(elevation,
      pixel_scale)
    notes: Internal slope uses feet; custom DEM in meters makes the slope factor ~10.8x too small (x3.28084
      to convert).
  - name: RoS attenuation magnitudes
    unit: ft/min subtracted from RoS
    category: control_line_attenuation
    source_kind: default
    model_input_format: RoSAttenuation FIRELINE=980 / SCRATCHLINE=490 / WETLINE=245 (hardcoded enums;
      applied when ros_attenuation=true)
  initial_conditions:
  - name: ignition position
    unit: pixels (row, col)
    category: fire
    source_kind: user_provided
    model_input_format: fire.fire_initial_position (static / random / historical); seeds the initial BURNING
      pixel(s) in fire_map
  boundary_conditions:
  - name: screen_size
    unit: pixels
    category: grid_geometry
    source_kind: user_provided
    model_input_format: area.screen_size [height, width]
  - name: pixel_scale
    unit: ft/pixel
    category: grid_geometry
    source_kind: user_provided
    model_input_format: area.pixel_scale (feet per pixel)
    notes: 'Couples to ignition timing, not only resolution: a pixel ignites when burn_amounts > pixel_scale,
      so pixel_scale silently sets spread timing. Should equal resolution_meters x 3.28084.'
  - name: update_rate
    unit: min/step
    category: time_control
    source_kind: user_provided
    model_input_format: simulation.update_rate (minutes per step)
    notes: RoS is multiplied by update_rate before accruing into burn_amounts, so temporal discretization
      directly scales effective spread.
  - name: runtime
    unit: time string ('Xd Xh Xm')
    category: time_control
    source_kind: user_provided
    model_input_format: simulation.runtime parsed via str_to_minutes; total_updates = round(minutes /
      update_rate)
  - name: diagonal_spread
    unit: bool
    category: spread_topology
    source_kind: user_provided
    model_input_format: fire.diagonal_spread (true = 8-connected, false = 4-connected)
    notes: False halves effective spread and yields a cross/diamond shape instead of an ellipse.
  - name: max_fire_duration
    unit: frames (update steps)
    category: sprite_lifetime
    source_kind: user_provided
    model_input_format: fire.max_fire_duration; sprite pruned to BURNED once duration >= this
    notes: Too low (1-2) prunes sprites before they ignite neighbors and the fire dies out.
  - name: ros_attenuation
    unit: bool
    category: mitigation_mode
    source_kind: user_provided
    model_input_format: mitigation.ros_attenuation (true subtracts RoSAttenuation, false zeroes RoS at
      control lines)
  - name: terrain/fuel layer mode
    unit: enum
    category: fuel_terrain_mode
    source_kind: structural
    model_input_format: operational (LandFire FBFM-13 + elevation, 30 m) / functional (procedural) / historical
      (BurnMD); historical cannot mix with operational or functional
  - name: operational geolocation and extent
    unit: lat/lon decimal degrees; height/width meters; resolution 30 m; year
    category: operational_extent
    source_kind: user_provided
    model_input_format: operational.latitude/longitude/height/width/resolution/year; height/width in METERS,
      resolution must be 30
outputs:
  primary:
  - name: fire_map
    unit: BurnStatus enum grid (0-5), shape (H, W)
    description: Per-pixel burn/control-line status at end of run; the final fire footprint (burned vs
      unburned) and placed control lines.
    validation_rank: 3
    emitted_in: in-memory FireSimulation.fire_map; persisted as .npy / .h5 / .jsonl when save_data=true
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - event_detection
        determining_metric: csi
        caveats:
        - Compare the binarized burned/unburned mask against an observed fire perimeter; the model's native
          validation metrics are Sorensen coefficient, Cohen's kappa, commission error and omission error.
        - Compared maps must share grid size and georeferencing; size mismatch is a hard failure.
      - obs_shape: categorical_event
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        determining_metric: csi
        caveats:
        - Per-pixel burned/not-burned hit/miss classification against an observed perimeter; sensitive
          to ignition placement and pixel_scale.
      detrending_options:
      - none
  - name: burned_area
    unit: acres / ha (derived as burned_pixels x pixel_scale^2, /43560 for acres)
    description: Total vegetation/land area burned by the fire at end of run, derived from the burned-pixel
      count and pixel_scale.
    validation_rank: 1
    emitted_in: derived from fire_map (burned-pixel count x pixel_scale^2)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Area is acutely sensitive to a correct pixel_scale (feet) and the ft2->acres conversion; an
          unmatched pixel_scale biases area by 2-10x.
      detrending_options:
      - none
  - name: fire_perimeter_length
    unit: ft / miles (edge-pixel count x pixel_scale)
    description: Length of the fire perimeter at end of run, derived from boundary pixels of the burned
      region.
    validation_rank: 2
    emitted_in: derived from fire_map (edge-pixel count x pixel_scale)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Perimeter length depends on grid resolution; coarse pixel_scale discretizes the boundary and
          biases length.
      detrending_options:
      - none
  - name: rate_of_spread
    unit: ft/min (convert to m/s /196.85 or chains/hr /1.1)
    description: Fire rate of spread over time; the core Rothermel output, per-pixel and as a time series
      of head-fire spread.
    validation_rank: 4
    emitted_in: in-memory RothermelFireManager.rate_of_spread (derived time series)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Defensible only where an observed or reference head-fire spread-rate series exists; SimFire
          has no calibrated/validated ROS dataset of its own.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Compare a representative head-fire ROS against a measured spread rate; sensitive to wind/moisture
          unit conventions.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Fire spreads catastrophically fast — fills the grid in minutes. sim/expected RoS ratio ≈ 88×.
    (Verified 2026-04-29 against simfire 2.0.1.)
  diagnosis: Wind speed in YAML wind.simple.speed (or perlin.speed.range_*) written in ft/min instead
    of mph — SimFire applies mph_to_ftpm internally and the value ends up 88× too high.; The official
    MITRE SimFire docs (`docs/source/config.md` line 285-289) and the source itself (`simfire/utils/config.py:860`
    ca
  remedy: 'Write the wind speed in mph directly in the YAML; do NOT pre-multiply by 88.; None; [''Open
    config YAML, find wind.simple.speed'', ''If value > 100, it is almost certainly already in ft/min
    — replace with the mph value (typical 0-60 mph for surface wind)'', ''Same fix for wind.perlin.speed.range_min
    and '
  severity: silent
- id: dt_002
  symptom: Fire spread is ~2.24× faster than intended when input numeric magnitude was meant to be m/s
    but written into wind.simple.speed.
  diagnosis: 'wind.simple.speed expects mph, not m/s. Writing 10 (intending 10 m/s ≈ 22 mph) produces
    10 mph internal.; ERA5, MERRA2, and most weather models report wind in m/s. SimFire''s simple.speed
    YAML is in mph, so writing the m/s value directly (e.g. 10) gets interpreted as 10 mph. This is an
    underestimate '
  remedy: Convert m/s to mph (× 2.237) before writing to YAML.; None; ['If your wind data source is m/s,
    multiply by 2.237 to get mph', 'Write the mph value to wind.simple.speed']; Document the source-data
    unit alongside the YAML and check before run.
  severity: silent
- id: dt_003
  symptom: Fire spreads extremely fast, consuming entire domain in minutes.
  diagnosis: Fuel load (w_0) provided in kg/m² instead of lb/ft². ~4.88× too high.; The Rothermel equation
    uses w_0 in lb/ft². If fuel load is in metric units (kg/m²), values are approximately 5× too large,
    producing much higher reaction intensity I_R and thus faster fire spread. For example, Chaparral w_0
    = 1.1
  remedy: 'Convert fuel load: lb/ft² = kg/m² × 0.2048; None; [''Check fuel parameter source units'', ''If
    kg/m²: multiply by 0.2048 to get lb/ft²'', ''Standard FBFM-13 values are already in lb/ft² — only
    affects custom fuels'']; Verify w_0 is in range 0.01-0.5 lb/ft² for standard fuel types'
  severity: silent
- id: dt_004
  symptom: Fire never spreads beyond ignition point. All fuel appears non-combustible.
  diagnosis: Fuel moisture M_f specified as percentage (e.g., 3) instead of fraction (0.03).; The Rothermel
    equation computes moisture damping as r_M = M_f / M_x. If M_f = 3.0 (3% as integer) and M_x = 0.20
    (20% extinction), then r_M = 15, which is clamped to 1.0, making eta_M = 0. This zeroes the reaction
    inten
  remedy: 'Express moisture as fraction: divide percentage by 100.; None; [''Open config YAML, find environment.moisture'',
    "If value > 1.0, it''s likely a percentage", ''Divide by 100 (e.g., 3% → 0.03)'']; Validate moisture
    is in range [0.001, 0.99]'
  severity: silent
- id: dt_005
  symptom: Fire ignores terrain completely. Spreads identically on hills and flat ground.
  diagnosis: Elevation provided in meters instead of feet. Slope gradient is 3.28× too small.; SimFire
    computes slope as np.gradient(elevation, pixel_scale) where both elevation and pixel_scale must be
    in feet. If elevation is in meters but pixel_scale is in feet, the gradient is 3.28× too small. Since
    phi_s dep
  remedy: Multiply elevation by 3.28084 to convert meters → feet.; convert_landfire_to_simfire; ['Check
    elevation data source units', 'LandFire provides meters — must convert to feet', 'convert_landfire_to_simfire.py
    handles this automatically']; Verify max elevation is in reasonable feet range (e.g., < 20000
  severity: silent
- id: dt_006
  symptom: Fire spreads too fast or too slow relative to expected. Burned area doesn't match expected
    physical size.
  diagnosis: Pixel scale in config doesn't match actual data resolution.; If pixel_scale is 50 ft/pixel
    but actual data is 30m (98.4 ft) per pixel, the fire needs to accumulate burn_amounts > 50 ft to spread
    to a neighbor, but the physical distance is actually 98.4 ft. This makes fire spread about 2× too
    fast in
  remedy: 'Set pixel_scale = resolution_meters × 3.28084; None; [''For operational mode at 30m: pixel_scale
    = 30 × 3.28084 ≈ 98.4 ft'', ''Or use desired scale and adjust interpretation'']; Cross-check pixel_scale
    × screen_size = expected physical domain'
  severity: silent
- id: dt_007
  symptom: 'pygame.error: No available video device. Simulation crashes on startup.'
  diagnosis: 'headless mode is false but no display server (X11/Wayland) is available.; SimFire uses PyGame
    for rendering. On headless servers (SSH, Docker, CI), no display is available. PyGame.init() fails
    with ''No available video device''. This is the most common deployment error.

    ; [''config.simulation.headless'''
  remedy: 'Set headless: true in config, or set SDL_VIDEODRIVER=dummy.; None; [''In config YAML: set simulation.headless:
    true'', ''Or: export SDL_VIDEODRIVER=dummy before running'', ''Also set record: false (recording requires
    display memory)'']; Always use headless: true for server/batch/CI runs'
  severity: fatal
- id: dt_008
  symptom: Fire starts but stops immediately at adjacent pixels. Fuel code 0 surrounds ignition.
  diagnosis: All or most pixels have non-burnable fuel code (0, 91-99, nodata).; Non-burnable fuel types
    (Urban=91, Water=93, Agriculture=98, etc.) have w_0 = 0.0, which makes the Rothermel RoS = 0. If the
    bounding box is over an urban area, water body, or agricultural land, most pixels will be non-burnable.
    The
  remedy: 'Check bounding box location. Move to area with natural vegetation.; convert_landfire_to_simfire;
    [''Load fuel array and check unique values'', ''If mostly 0/91-99: wrong location for wildfire simulation'',
    ''Use LANDFIRE viewer to preview fuel data at target location'']; convert_landfire_to_simfire.py rep'
  severity: silent
- id: dt_009
  symptom: Fire ignites but never spreads. Moisture damping coefficient eta_M = 0.
  diagnosis: 'Fuel moisture M_f exceeds or equals moisture of extinction M_x for all fuel types.; When
    M_f >= M_x, the moisture ratio r_M >= 1.0, and the damping coefficient eta_M = 1 - 2.59*r_M + 5.11*r_M²
    - 3.52*r_M³ evaluates to ~0 or negative (clamped to 0). This zeros the reaction intensity I_R and
    prevents '
  remedy: 'Reduce M_f below M_x of the target fuel. Typical range: 0.001-0.08.; None; [''Check config
    environment.moisture value'', ''Compare against M_x of dominant fuel type'', ''For SoCal chaparral:
    M_x=0.20, use M_f < 0.20 (typically 0.03-0.05)'', ''For grass: M_x=0.12, use M_f < 0.12'']; Warn if
    M_f > min(M_x) fo'
  severity: degraded
- id: dt_010
  symptom: Operational mode downloads tiny region. Simulation domain much smaller than expected.
  diagnosis: Operational area height/width specified in feet instead of meters.; The config operational.height
    and operational.width are in METERS. If specified in feet (e.g., 6000 ft instead of 2000 m), the downloaded
    region is 3.28× smaller than intended. This is confusing because pixel_scale is in feet, but a
  remedy: Specify height/width in meters in the operational section.; None; ['Ensure operational.height
    and operational.width are in meters', '2000 meters ≈ 6562 feet ≈ 1.24 miles']; Config validator should
