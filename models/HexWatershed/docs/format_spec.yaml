model:
  name: "HexWatershed"
  version: "1.0.0"
  domain: "hydrology"
  subdomain: "watershed delineation"
  description: "Mesh-independent flow direction model for watershed delineation on unstructured meshes (hexagonal, square, latlon, MPAS, DGGRID, TIN)"
  binary_path: "KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/HexWatershed/source/repo/build/hexwatershed"
  invocation: "hexwatershed <configuration_file.json>"

inputs:
  configuration:
    format: "JSON"
    parameters:
      critical:
        - name: "sMesh_type"
          type: "string"
          valid_values: ["hexagon", "square", "latlon", "mpas", "dggrid", "tin"]
          description: "Mesh type selector — must match input mesh JSON structure"
        - name: "sFilename_mesh"
          type: "string"
          description: "Path to mesh information JSON (generated by PyFlowline)"
        - name: "sWorkspace_output"
          type: "string"
          description: "Output root directory"
        - name: "dAccumulation_threshold"
          type: "float"
          valid_range: [0.001, 100000]
          default: 0.05
          description: "Stream threshold — if <1.0 treated as ratio of max accumulation, if >=1.0 as absolute cell count"
        - name: "dMissing_value_dem"
          type: "float"
          default: -9999.0
          description: "DEM nodata sentinel — must match actual DEM nodata value"
        - name: "dBreach_threshold"
          type: "float"
          valid_range: [0.0, 1000.0]
          default: 0.0
          unit: "m"
          description: "Elevation jump limit for breaching (0 = no breaching)"
      flags:
        - name: "iFlag_global"
          type: "int"
          valid_values: [0, 1]
          default: 0
          description: "Global (1) vs regional (0) simulation"
        - name: "iFlag_flowline"
          type: "int"
          valid_values: [0, 1]
          default: 0
          description: "Enable stream burning from pre-processed flowlines"
        - name: "iFlag_multiple_outlet"
          type: "int"
          valid_values: [0, 1]
          default: 0
          description: "Enable multiple watershed outlets"
        - name: "iFlag_hillslope"
          type: "int"
          valid_values: [0, 1]
          default: 0
          description: "Calculate hillslope attributes"
        - name: "iFlag_vtk"
          type: "int"
          valid_values: [0, 1]
          default: 0
          description: "Generate VTK 3D output"
        - name: "iFlag_debug"
          type: "int"
          valid_values: [0, 1]
          default: 0
          description: "Debug mode with extra output"
        - name: "iFlag_stream_grid_option"
          type: "int"
          valid_values: [1, 2]
          default: 2
          description: "1=burned-in stream grid, 2=accumulation threshold"

  mesh:
    format: "JSON"
    description: "Mesh information file generated by PyFlowline"
    fields:
      - name: "lCellID"
        type: "long"
        description: "Global unique cell ID"
      - name: "dElevation_mean"
        unit: "m"
        description: "Mean cell elevation"
      - name: "dLongitude_center_degree"
        unit: "degrees"
        description: "Cell center longitude (GCS/WGS84)"
      - name: "dLatitude_center_degree"
        unit: "degrees"
        description: "Cell center latitude (GCS/WGS84)"
      - name: "dArea"
        unit: "m2"
        description: "Cell area"
      - name: "aNeighbor"
        type: "array[long]"
        description: "Neighbor cell IDs"
      - name: "aNeighbor_distance"
        unit: "m"
        description: "Distance to each neighbor"

outputs:
  primary:
    - name: "watershed.json"
      format: "GeoJSON"
      description: "Per-cell watershed attributes"
      fields:
        - name: "dElevation_mean"
          unit: "m"
          description: "Depression-filled elevation"
        - name: "dElevation_raw"
          unit: "m"
          description: "Original DEM elevation"
        - name: "dAccumulation"
          unit: "cells"
          valid_range: [0, null]
          description: "Flow accumulation (cell count, NOT area)"
        - name: "dSlope_between"
          unit: "ratio"
          valid_range: [0.0, 10.0]
          description: "Slope to downslope neighbor (rise/run, unitless)"
        - name: "dDistance_to_channel"
          unit: "m"
          valid_range: [0.0, null]
          description: "Overland distance to nearest stream"
    - name: "watershed.txt"
      format: "text"
      description: "Watershed summary characteristics (area, slope, drainage density, stream lengths)"
    - name: "segment.txt"
      format: "CSV"
      description: "Stream segment attributes (ID, downstream ID, Strahler order, length, elevation drop, slope)"
      fields:
        - name: "total_length"
          unit: "m"
        - name: "elevation_drop"
          unit: "m"
        - name: "average_slope"
          unit: "ratio"
    - name: "subbasin.txt"
      format: "CSV"
      description: "Subbasin attributes (ID, outlet, cell count, area, slope, drainage density)"
    - name: "stream_edge.json"
      format: "GeoJSON"
      description: "Stream network edge geometries"

known_issues:
  - id: "nan_subbasin_area"
    description: "Subbasin total_area and drainage_area show NaN when cell dArea field is zero or missing in mesh JSON"
    severity: "silent"
    workaround: "Ensure mesh generator populates dArea for all cells"
  - id: "accumulation_is_cell_count"
    description: "dAccumulation stores cell count, not drainage area — multiply by mean cell area for actual area"
    severity: "silent"
  - id: "slope_is_ratio"
    description: "All slope outputs are rise/run ratios, not degrees or percent"
    severity: "silent"
  - id: "depression_fills_elevation"
    description: "Priority-Flood modifies dElevation_mean; use dElevation_raw for original values"
    severity: "silent"

dependencies:
  build:
    - "C++11 compiler"
    - "CMake >= 3.1"
    - "RapidJSON (bundled)"
    - "OpenMP (optional)"
  runtime:
    - "PyFlowline (mesh generation)"
    - "PyHexWatershed (Python wrapper, optional)"
