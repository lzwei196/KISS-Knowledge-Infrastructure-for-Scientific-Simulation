# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: ELM
  language: fortran
  implementation:
    id: elm-e3sm
    version: E3SM v2/v3-era ELM (components/elm)
    provenance: Fortran; E3SM Land Model component of DOE E3SM, CLM4.5-derived, DATM-forced offline, with
      optional FATES vegetation demography.
  scientific_reference_version: E3SM Land Model (ELM), E3SM v2/v3 lineage — CLM4.5-derived land-surface
    scheme with CN(P) biogeochemistry and optional FATES vegetation demography
  binary:
    path: KISSPATH_HOME/e3sm_scratch/elm_test_case/bld/e3sm.exe
    type: work_dir
pipeline:
  stages:
  - s0_configuration
  - s1_surface_data
  - s2_forcing_data
  - s3_namelist_setup
  - s4_initial_conditions
  - s6_execution
  - s7_output_analysis
tools:
  count: 4
  files:
  - tools/convert_forcing_to_elm.py
  - tools/convert_surface_data.py
  - tools/parse_elm_output.py
  - tools/run_elm.py
inputs:
  forcing:
  - name: TBOT (near-surface air temperature)
    unit: K
  - name: QBOT (near-surface specific humidity)
    unit: kg/kg
  - name: WIND (near-surface wind speed)
    unit: m/s
  - name: PRECTmms (total precipitation rate)
    unit: mm/s
  - name: FSDS (downward shortwave radiation)
    unit: W/m2
  - name: FLDS (downward longwave radiation)
    unit: W/m2
  - name: PSRF (surface pressure)
    unit: Pa
  - name: ZBOT (atmospheric reference height)
    unit: m
  - name: Atmospheric CO2 mixing ratio
    unit: ppmv
  parameters:
  - name: WATSAT (saturated volumetric water content / porosity)
    unit: mm3/mm3
  - name: SUCSAT (saturated soil matric potential)
    unit: mm
  - name: BSW (Clapp-Hornberger b exponent)
    unit: dimensionless
  - name: HKSAT (saturated hydraulic conductivity)
    unit: mm/s
  - name: PFT composition and plant functional type parameters
    unit: mixed
  - name: Soil layer discretization (levgrnd / levsoi depths and thicknesses)
    unit: m
  initial_conditions:
  - name: Initial H2OSOI / SOILLIQ / SOILICE (soil water and ice)
    unit: mm3/mm3 ; kg/m2
  - name: Initial TSOI (soil temperature profile)
    unit: K
  - name: Initial ZWT (water-table depth)
    unit: m
  - name: Initial carbon-nitrogen pools (TOTSOMC and associated C/N pools)
    unit: gC/m2
  - name: Initial TLAI (leaf area index)
    unit: m2/m2
  boundary_conditions:
  - name: use_cn (carbon-nitrogen biogeochemistry enabled)
    unit: boolean
  - name: use_vertsoilc (vertically-resolved soil carbon)
    unit: boolean
  - name: use_fates (FATES vegetation demography enabled)
    unit: boolean
  - name: Simulation domain / surface dataset selection and run period
    unit: n/a
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - QRUNOFF
  - QDRAI
  - H2OSOI
  - EFLX_LH_TOT
  - FSH
  - GPP
  - NEE
  - TSOI
  - TWS
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.550, KGE=0.684, R=0.750, 6 scorecard(s)'
  metrics:
    best_nse: 0.5502
    best_kge: 0.6839
    best_r: 0.75
summary:
  total_tools: 4
  total_stage_docs: 7
  total_diagnostic_triplets: 20
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
