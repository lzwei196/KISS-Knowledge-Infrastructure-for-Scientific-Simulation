  diagnosis: GW_DELAY too high (>500 days) or ALPHA_BF too low (<0.001) in aquifer.aqu; GW_DELAY controls
    the lag between water leaving the soil profile and entering the shallow aquifer. Very high values
    (>500 days) mean percolation water never reaches the aquifer during a typical simulation. Similarly,
    ALPHA_BF
  remedy: '[''Check aquifer.aqu: gw_delay should be 1-365 days (default 31)'', ''Check alpha_bf: typical
    range 0.01-0.3 (default 0.048)'', ''If both look reasonable, check that soils have percolation path
    (SOL_K > 0)'', ''Verify with basin_wb_yr.txt: latq + perc should be > 0'']; Preflight: assert gw_delay
    < 500 and a'
  severity: silent
- id: dt_033
  symptom: NSE is negative (often -0.5 to -10) despite seemingly correct setup
  diagnosis: 'Model needs systematic calibration; default parameters are not appropriate for this basin;
    Negative NSE means the model performs worse than using the observed mean as a predictor. Common causes:
    (1) wrong CN2 for land use, (2) ESCO default 0.95 wrong for climate, (3) AWC from HWSD not representative'
  remedy: '[''First check for structural issues (dt_026, dt_027, dt_028, dt_029)'', ''If no structural
    issues, run calibration with SWAT-CUP or iPySwat'', ''Priority parameters: CN2, ESCO, AWC, GW_DELAY,
    ALPHA_BF, SURLAG'', ''Target: NSE > 0.5 (good), NSE > 0.3 (acceptable for uncalibrated)'']; Always
    calibrate before'
  severity: degraded
- id: dt_034
  symptom: Sediment yield exceeds 100 t/ha/yr — unrealistic for most non-loess regions
  diagnosis: 'USLE_K or USLE_C factors are too high, or slope length/steepness from DEM is incorrect;
    MUSLE sediment yield > 100 t/ha/yr is physically unrealistic for all but the most extreme erosion
    environments (e.g., Chinese Loess Plateau). Common causes: USLE_K auto-calculated too high for organic
    soils, USLE'
  remedy: '[''Check USLE_K in soils.sol: typical range 0.01-0.45'', ''Check USLE_C in management.sch:
    bare soil ~0.5, crops 0.01-0.2'', ''Check slope_len in topography.hyd: >100m may be unrealistic'',
    ''For regions <30 t/ha/yr expected, reduce USLE_P or adjust practices'']; Compare sediment yield against
    regional lite'
  severity: silent
- id: dt_035
  symptom: 'basin_wb_yr.txt water balance does not close: precip differs significantly from ET + Q + delta_storage'
  diagnosis: 'Water balance residual indicates a storage term or flux is missing or miscounted; In basin_wb_yr.txt,
    precip should approximately equal ET + surq_gen + latq + tile + perc - revap +/- change in soil/aquifer
    storage. A residual >5% of precip after warmup suggests: (1) aquifer deep percolation losing w'
  remedy: '[''Extract annual values from basin_wb_yr.txt'', ''Compute: residual = precip - (et + surq_gen
    + latq + tile + perc - revap)'', ''If residual > 0: check rchrg_dp (deep aquifer recharge fraction)
    — reduce if >0.3'', ''If residual < 0: check for irrigation or reservoir inflows'', ''First year is
    warmup — focus'
  severity: silent
- id: dt_036
  symptom: Channel nutrient concentrations oscillate wildly or go negative between time steps
  diagnosis: 'QUAL2E in-stream routing solver is numerically unstable at daily time step; The QUAL2E solver
    in SWAT+ uses an analytical steady-state solution that assumes constant flow within a day. In flashy
    basins with large flow variation, this produces numerical instability: concentrations oscillate, go
    negat'
  remedy: '[''Set wq_cha = 0 in codes.bsn to disable in-stream WQ (use HRU outputs instead)'', ''Use basin_nb_yr.txt
    for N and P budgets at basin scale'', ''If in-stream WQ needed: use SWAT+ Rev 60.5+ with improved
    solver'', ''Alternatively: aggregate to monthly output to smooth oscillations'']; Use HRU-level nutrient'
  severity: degraded
- id: dt_037
  symptom: SWAT+ runs with default parameters; calibration.cal file is missing or empty
  diagnosis: calibration.cal was not created or was accidentally deleted from TxtInOut; calibration.cal
    contains parameter adjustment instructions (chg_typ, chg_val) that modify base parameter values at
    runtime. Without it, SWAT+ runs with raw parameter values from input files, which are rarely appropriate
    for a
  remedy: '[''Check if calibration.cal exists in TxtInOut: ls -la calibration.cal'', ''If missing, generate
    from SWAT-CUP or manually create with key parameters'', ''Minimum calibration parameters: cn2, esco,
    awc, gw_delay, alpha_bf, surlag'', "Format: ''chg_typ absval chg_val 0.75 ... '' (see SWAT+ documentation)"]; '
  severity: silent
- id: dt_wq_004
  symptom: WQ verifier against a China National guokongzhan (e.g. station 2258 Bengbu Sluice) reports
    r<0.5 and large negative NSE on derived in-stream concentration, despite clean run and water balance.
    NH3-N PBIAS approaches -3000%.
  diagnosis: Obs is in-stream CONCENTRATION (mg/L) of a single species at a gate-regulated station with
    no co-located discharge. With wq_cha=0 mandatory (Rev 59.3 QUAL2E blowup, dt_wq_001/dt_036), SWAT+
    has no in-stream concentration state and exports only HRU LOADS (kg). Deriving conc as HRU_load/channel_flo_ou
  remedy: Do not derive in-stream concentration from HRU_load/flow and do not compare TOTAL-N to NH3-N.
    Remap the verifier target to LOADS (kg) via validate_water_quality.py, or use concentration paired
    with measured discharge so load = C x Q. A bare concentration series at a guokongzhan is not a valid
    target
  severity: silent
