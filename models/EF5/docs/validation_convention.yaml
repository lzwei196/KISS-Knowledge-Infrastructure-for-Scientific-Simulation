validation:
  - dag_variable: discharge
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.80, good: 0.70, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "Moriasi 2015 watershed-scale flow PEC: satisfactory when NSE > 0.50; EF5 reports NSE as its gauge skill metric."
        cites: [moriasi2015, moriasi2007]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 5.0, good: 10.0, satisfactory: 15.0}
        pass_band: satisfactory
        band_note: "Moriasi 2015 watershed-scale flow PEC: satisfactory when PBIAS <= +/-15%."
        cites: [moriasi2015]
    secondary_metrics:
      - metric: normalized_bias
        direction: zero_centered
        status: supportive
        ceiling_reason: null
        cites: [flamig2020]
      - metric: cc
        direction: maximize
        status: supportive
        ceiling_reason: null
        cites: [flamig2020]
    validated_when: "At gauged subbasin outlets, NSE >= 0.50 and |PBIAS| <= 15% after warmup, with drainage-area support checked."
    evidence_strength: strong
    confidence: 0.85
    notes: >-
      Moriasi 2015 states that watershed-scale flow can be judged satisfactory with "NSE > 0.50" and
      "PBIAS <= +/-15%"; Moriasi 2007 gives the earlier monthly watershed guideline of NSE > 0.50
      and PBIAS +/-25% for streamflow, so the 2015 flow PBIAS band is the stricter headline rule.
      Flamig 2020 evaluates EF5 against about 10,000 USGS stations using NSE, correlation coefficient,
      and normalized bias; EF5/CREST and EF5/SAC-SMA median biases were 9% and -8%, with NSE up to 0.76.

  - dag_variable: discharge
    obs_shape: categorical_event
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric CSI pass band for EF5 flood-event detection at gauges."
        cites: []
    secondary_metrics:
      - metric: pod
        direction: maximize
        status: supportive
        ceiling_reason: null
        cites: [wu2014]
      - metric: far
        direction: minimize
        status: supportive
        ceiling_reason: null
        cites: [wu2014]
    validated_when: "UNRESOLVED - flood-event CSI at a gauge is not auto-validated without a cited event threshold and pass band."
    evidence_strength: weak
    confidence: 0.30
    notes: >-
      The EF5 dag scores gauge discharge flood events (categorical_event) by CSI. Wu 2014 defines
      flood-event CSI from a 2 x 2 contingency table and reports benchmark CSI values of 0.25-0.34 for
      floods longer than three days, but gives no pass band, so the headline band stays null. (Until
      2026-10-16 this block was keyed to the wrong-model HYPE variable cout with obs_shape
      spatial_time_series.)

  - dag_variable: swe
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a SWE point-time-series NSE validation threshold."
        cites: []
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: null
        cites: [newman2015]
    validated_when: "UNRESOLVED - compare SWE to point observations only as contextual evidence until an SWE-specific NSE/RMSE band is fetched."
    evidence_strength: weak
    confidence: 0.35
    notes: >-
      Newman 2015 is relevant because it uses Snow-17 with SAC-SMA and highlights NSE values of 0.55 and
      0.8 as hydrologic model-performance thresholds, saying 0.55 indicates some model skill. That threshold
      is for streamflow model performance across CAMELS basins, not a direct SWE-observation convention, so
      the headline SWE band remains null.

  - dag_variable: swe
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric R pass band for EF5 SWE or snow-cover snapshots (the dag's determining metric for this comparison is R)."
        cites: []
    secondary_metrics:
      - metric: sca_agreement
        direction: maximize
        status: supportive
        ceiling_reason: null
        cites: [li2019]
    validated_when: "UNRESOLVED - snow snapshot R must be treated as descriptive until a snow-map threshold paper is fetched."
    evidence_strength: weak
    confidence: 0.30
    notes: >-
      Li 2019 reviews using SWE and snow-covered-area observations in hydrologic prediction and notes that
      SCA constraints can improve snow depth and streamflow estimates, but it does not provide a numeric
      pass band for validating EF5 snow snapshots. (Until 2026-10-16 this block's headline was CSI.)

  - dag_variable: soil_moisture
    obs_shape: point_time_series
    headline_metrics:
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "The dag's determining metric is R (pattern only, the output is a store percent). No fetched paper gives a soil-moisture R pass band for EF5 soil moisture (percent of the conceptual CREST WM store or of SAC-SMA upper-zone capacity)."
        cites: []
    secondary_metrics:
      - metric: ubrmse
        direction: minimize
        status: supportive
        ceiling_reason: null
        cites: [xing2023]
    validated_when: "UNRESOLVED - compare anomalies/rescaled storage to in situ or satellite soil moisture, but do not auto-validate on R without a cited band."
    evidence_strength: weak
    confidence: 0.35
    notes: >-
      Xing 2023 says soil-moisture assessment uses Pearson R, ubRMSE, and bias as common estimators, and
      keeps sites only when all products have R > 0.4; median ubRMSE values around 0.07-0.08 m3/m3 are
      reported against ISMN. Those are remote-sensing/reanalysis benchmarks, not EF5 store-percent R
      thresholds, so the headline band is null.

  - dag_variable: soil_moisture
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives an R pass band for spatial EF5 soil-moisture (store-percent) fields; Xing 2023 uses R as an estimator but not as an EF5 pass band."
        cites: []
    secondary_metrics:
      - metric: ubrmse
        direction: minimize
        status: supportive
        ceiling_reason: null
        cites: [xing2023]
    validated_when: "UNRESOLVED - spatial soil-moisture R is descriptive only until a cited pass band is fetched."
    evidence_strength: weak
    confidence: 0.30
    notes: >-
      Soil-moisture literature in the fetched set favors R, ubRMSE, and bias against in situ networks. The EF5
      dag uses R for this comparison; no fetched paper gives a numeric pass band for it. (Until 2026-10-16
      this block was keyed to the HYPE variable soim with a CSI headline.)

