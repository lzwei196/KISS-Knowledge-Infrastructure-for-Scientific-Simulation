package:
  name: HydroTrend
  language: c
  implementation:
    id: hydrotrend-3.0
    version: 3.0.5
    provenance: C (ANSI-standard) with built-in CSDMS BMI; csdms-contrib/hydrotrend release; epoch/year
      driver in hydrotrend.c.
  scientific_reference_version: HydroTrend v3.0 (Kettner & Syvitski 2008); BQART sediment-flux relation
    per Syvitski & Milliman 2007
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/HydroTrend/source/repo/_build/hydrotrend
    type: work_dir
pipeline:
  stages: []
tools:
  count: 4
  files:
  - tools/build_hypsometry.py
  - tools/convert_climate_to_hydrotrend.py
  - tools/parse_hydrotrend_output.py
  - tools/run_hydrotrend.py
inputs:
  forcing:
  - name: Monthly mean temperature (12 months)
    unit: degC
  - name: Monthly temperature std dev (12 months)
    unit: degC
  - name: Monthly total precipitation (12 months)
    unit: mm
  - name: Monthly precipitation std dev (12 months)
    unit: mm
  - name: Annual temperature trend (T_start, T_change, T_std)
    unit: degC, degC/yr, degC
  - name: Annual precipitation trend (P_start, P_change, P_std)
    unit: m/yr, m/yr^2, m/yr
  - name: Optional daily climate override (T, P time series)
    unit: degC, m/day
  parameters:
  - name: Hypsometry (elevation vs cumulative area)
    unit: m, km2
  - name: Basin (river) length
    unit: km
  - name: Delta plain gradient
    unit: m/m
  - name: Lithology factor B (L)
    unit: '-'
  - name: Anthropogenic factor Eh
    unit: '-'
  - name: Number of grain sizes
    unit: '-'
  - name: Grain-size proportions
    unit: fraction
  - name: Bedload rating term
    unit: '-'
  - name: Sediment filter
    unit: '-'
  - name: Lapse rate
    unit: degC/km
  - name: Glacier ELA change
    unit: m/yr
  - name: Dry-precipitation evaporation fraction
    unit: '-'
  - name: Canopy interception alpha/beta
    unit: mm/d, -
  - name: Evapotranspiration alpha/beta
    unit: mm/d, -
  - name: Groundwater storage max/min
    unit: m3
  - name: Subsurface storm flow coefficient/exponent
    unit: '-'
  - name: Saturated hydraulic conductivity Ko
    unit: mm/day
  - name: Constant annual baseflow
    unit: m3/s
  - name: Velocity coefficient k and exponent m
    unit: m/s, -
  - name: Width coefficient a and exponent b
    unit: m, -
  - name: Reservoir volume and parameter-type flag
    unit: km3, flag
  initial_conditions:
  - name: Initial groundwater storage
    unit: m3
  - name: Starting glacier ELA
    unit: m
  boundary_conditions:
  - name: Sediment-formula selection (0=QRT / 1=ART / 2=BQART)
    unit: '-'
  - name: ASCII output flag (ON/OFF)
    unit: '-'
  - name: Number of outlets and outlet fractions
    unit: '-'
  - name: Event specification (events/yr or Qpeak threshold)
    unit: '-'
  - name: Optional earthquake events (year, energy, distance, duration)
    unit: '-'
  - name: River mouth longitude/latitude
    unit: decimal degrees
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
