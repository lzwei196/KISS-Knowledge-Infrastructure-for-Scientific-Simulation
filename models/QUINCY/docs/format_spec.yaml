# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: QUINCY
  language: python
  implementation:
    id: quincy-analytic-py
    version: analytic reimplementation (QUINCYModel, monthly timestep)
    provenance: Python; HydroCraft analytic reimplementation of QUINCY's core biogeochemistry (Farquhar
      photosynthesis with N-limited Vcmax, CENTURY-like heterotrophic respiration, temperature-driven
      LAI), not the upstream MPI-BGC Fortran QUINCY.
  scientific_reference_version: QUINCY v1.0 (Thum et al. 2019, GMD; revision 1996 lineage) — analytic
    single-site C-N reimplementation of the coupled C-N(-P) terrestrial-biogeochemistry formulation
inputs:
  forcing:
  - name: SW_IN (incoming shortwave radiation)
    unit: W/m2
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column SW_IN; converted internally to PPFD via a fixed
      factor
    notes: Drives light-limited (Wj) electron transport and canopy assimilation; also sets net radiation
      for the energy-flux approximation.
  - name: TA (air temperature at 2 m)
    unit: deg C
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column TA
    notes: Must be deg C, NOT Kelvin; drives Arrhenius temperature response of Vcmax/Jmax/Rd/Rh and the
      Gaussian LAI phenology.
  - name: VPD (vapor pressure deficit)
    unit: hPa
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column VPD; used internally in hPa
    notes: Reduces the Ci/Ca ratio (VPD-linear surrogate in lieu of a Ball-Berry solve), constraining
      assimilation.
  - name: PRECIP (precipitation)
    unit: mm/day
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column PRECIP
    notes: Drives the bell-shaped soil-moisture scalar of heterotrophic respiration; not used for a prognostic
      soil-water balance.
  - name: CO2 (atmospheric CO2 mole fraction)
    unit: ppm
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column CO2
    notes: Sets ambient CO2 entering the Farquhar Ci computation; must be ppm, not mole fraction.
  - name: DAYLENGTH (day fraction driver)
    unit: hours
    category: forcing
    source_kind: derived
    model_input_format: QUINCY-format forcing CSV column DAYLENGTH (derived from latitude and day-of-year)
    notes: Instantaneous daytime GPP is scaled by daylength/24 to a 24-h mean for comparison against eddy-covariance
      daily means.
  - name: LW_IN (incoming longwave radiation, optional)
    unit: W/m2
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column LW_IN (optional)
  - name: WIND (wind speed, optional)
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column WIND (optional)
  - name: PA (air pressure, optional)
    unit: kPa
    category: forcing
    source_kind: forcing
    model_input_format: QUINCY-format forcing CSV column PA (optional)
  parameters:
  - name: vcmax25 (max carboxylation rate at 25C)
    unit: umol/m2/s
    category: photosynthesis
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: 'Acts only as an upper cap on the N-derived value: effective Vcmax25 = min(vcmax_n_slope*leaf_N,
      vcmax25). PFT-specific (boreal ENF default 45).'
  - name: jmax_vcmax_ratio (Jmax/Vcmax ratio)
    unit: '-'
    category: photosynthesis
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Controls whether RuBP-regeneration (Wj) ever limits assimilation; default 1.9.
  - name: alpha_j (quantum yield of electron transport)
    unit: mol/mol
    category: photosynthesis
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
  - name: theta_j (curvature of light response)
    unit: '-'
    category: photosynthesis
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
  - name: ea_vcmax (activation energy for Vcmax)
    unit: J/mol
    category: photosynthesis
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Must be J/mol, not kJ/mol; default 65330.
  - name: ea_jmax (activation energy for Jmax)
    unit: J/mol
    category: photosynthesis
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Default 43540.
  - name: n_leaf_ref (reference leaf nitrogen content)
    unit: gN/m2_leaf
    category: n_limitation
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Must be gN/m2; ENF 1.5-2.5. Sets the N-limited carboxylation capacity.
  - name: vcmax_n_slope (Vcmax per unit leaf N)
    unit: umol/s/gN
    category: n_limitation
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Vcmax25_eff = vcmax_n_slope*leaf_N, capped at vcmax25; the analytic surrogate's realization
      of QUINCY's N-control on photosynthesis.
  - name: g1_bb (Ball-Berry slope parameter)
    unit: '-'
    category: stomatal_conductance
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Declared and range-checked but NOT consumed by the assimilation routine in this analytic version;
      the Ci/Ca effect is realized by a hardcoded VPD-linear surrogate. Documented Ball-Berry conductance
      is not wired in here.
  - name: r_maint_leaf (leaf maintenance respiration at 25C)
    unit: umol/m2leaf/s
    category: respiration
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
  - name: r_maint_stem (stem maintenance respiration at 25C)
    unit: umol/m2ground/s
    category: respiration
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
  - name: r_maint_root (root maintenance respiration at 25C)
    unit: umol/m2ground/s
    category: respiration
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
  - name: r_growth_frac (growth respiration fraction of NPP)
    unit: '-'
    category: respiration
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Growth respiration term r_growth_frac*(GPP-R_maint); default 0.25.
  - name: ea_rd (activation energy for dark respiration)
    unit: J/mol
    category: respiration
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Default 46390; must be J/mol.
  - name: rh_base (base heterotrophic respiration rate at Tref)
    unit: umol/m2/s
    category: soil_decomposition
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Default 1.8.
  - name: rh_q10 (Q10 temperature sensitivity of Rh)
    unit: '-'
    category: soil_decomposition
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Default 2.0; >3 inflates Reco and flips NEE to net source.
  - name: rh_t_ref (reference temperature for Rh)
    unit: deg C
    category: soil_decomposition
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Default 15.
  - name: rh_precip_scale (precipitation scaling for moisture response)
    unit: '-'
    category: soil_decomposition
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Must be positive; default 0.02. Bell-shaped exp(-scale*(P-opt)^2).
  - name: rh_precip_opt (optimal precipitation for decomposition)
    unit: mm/day
    category: soil_decomposition
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Default 2.5; moisture response peaks here.
  - name: lai_max (maximum LAI)
    unit: m2/m2
    category: phenology
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Must exceed lai_min or the seasonal GPP cycle vanishes.
  - name: lai_min (minimum / evergreen-base LAI)
    unit: m2/m2
    category: phenology
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
  - name: lai_t_opt (temperature for maximum LAI)
    unit: deg C
    category: phenology
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Set near mean growing-season T; if above site T range, LAI stays at lai_min.
  - name: lai_t_range (temperature range for LAI response)
    unit: deg C
    category: phenology
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
  - name: cn_leaf (leaf C:N ratio)
    unit: gC/gN
    category: stoichiometry
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: gC/gN (leaf 30-60); tracked stoichiometrically, not as prognostic pools in this version.
  - name: cn_root (fine-root C:N ratio)
    unit: gC/gN
    category: stoichiometry
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Typical 40-80.
  - name: cn_wood (wood C:N ratio)
    unit: gC/gN
    category: stoichiometry
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Typical 200-500.
  - name: cp_leaf (leaf C:P ratio)
    unit: gC/gP
    category: stoichiometry
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Tracked structurally; P limitation not realized in this analytic version.
  - name: np_leaf (leaf N:P ratio)
    unit: gN/gP
    category: stoichiometry
    source_kind: calibrated
    model_input_format: PFT parameter dict / JSON
    notes: Tracked structurally; P limitation not realized.
  - name: Kc (Michaelis constant for carboxylation at 25C; Ea 79430 J/mol)
    unit: umol/mol
    category: kinetic_constant
    source_kind: default
    model_input_format: hardcoded Farquhar kinetic constant (404.9) in the analytic core
    notes: Not exposed as configurable.
  - name: Ko (Michaelis constant for oxygenation at 25C; Ea 36380 J/mol)
    unit: mmol/mol
    category: kinetic_constant
    source_kind: default
    model_input_format: hardcoded kinetic constant (278.4)
  - name: Gamma_star (CO2 compensation point at 25C; Ea 37830 J/mol)
    unit: umol/mol
    category: kinetic_constant
    source_kind: default
    model_input_format: hardcoded kinetic constant (42.75)
  - name: Oi (intercellular O2 concentration)
    unit: mmol/mol
    category: kinetic_constant
    source_kind: default
    model_input_format: hardcoded kinetic constant (210)
  initial_conditions_note: The analytic reimplementation carries no explicit prognostic pool state and
    does not document initial-condition inputs; LAI and effective Vcmax are recomputed diagnostically
    each timestep from forcing and parameters. (Upstream QUINCY initializes from bare-ground plus a default
    SOM profile and a multi-decade spin-up; that does not apply to this surrogate.)
  initial_conditions: []
  boundary_conditions:
  - name: lat (site latitude)
    unit: deg
    category: site_config
    source_kind: user_provided
    model_input_format: run configuration
    notes: Used for daylength / day-fraction scaling of GPP; wrong hemisphere sign swaps the seasonal
      cycle.
  - name: lon (site longitude)
    unit: deg
    category: site_config
    source_kind: user_provided
    model_input_format: run configuration
  - name: pft (plant functional type selector)
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: run configuration (e.g., enf = evergreen needleleaf)
    notes: Selects the default parameter set; defaults are boreal ENF (Scots pine).
outputs:
  primary:
  - name: GPP
    unit: umol CO2/m2/s
    description: Gross primary production (Farquhar co-limitation with N-limited Vcmax and Beer's-law
      canopy scaling), scaled by day fraction (daylength/24) to a 24-h mean.
    validation_rank: 1
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance GPP is a 24-h mean partitioned from NEE; ensure the day-fraction scaling is
          applied before comparison.
        - Defaults are boreal-ENF (Scots pine) specific; expect 2-3x magnitude bias if Vcmax25 / PFT is
          mismatched.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Annual or seasonal-mean GPP only; single-instant comparison is weak for a monthly model.
      detrending_options:
      - none
  - name: NEE
    unit: umol CO2/m2/s
    description: Net ecosystem exchange = Reco - GPP (micrometeorological convention, positive = net source
      to atmosphere).
    validation_rank: 3
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Sign convention must match (Reco - GPP, positive = source); a flipped sign produces apparent
          carbon-balance non-closure.
        - First 1-2 years can be biased by spin-up transient if SOM-equivalent terms are far from equilibrium.
      detrending_options:
      - none
  - name: Reco
    unit: umol CO2/m2/s
    description: Ecosystem respiration (Ra + Rh).
    validation_rank: 4
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance Reco is partitioned, not directly measured; carries partitioning uncertainty.
        - Healthy mature forest annual Reco/GPP ~0.7-0.9.
      detrending_options:
      - none
  - name: Ra
    unit: umol CO2/m2/s
    description: Terrestrial ecosystem autotrophic respiration (maintenance + growth), coupled to instantaneous
      GPP.
    validation_rank: 5
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Rarely measured directly at flux sites; usually only available via partitioning/upscaling, so
          comparison is indirect.
      detrending_options:
      - none
  - name: Rh
    unit: umol CO2/m2/s
    description: Soil heterotrophic respiration in the terrestrial ecosystem (CENTURY-like Q10 temperature
      response with a bell-shaped precipitation moisture response).
    validation_rank: 6
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Soil heterotrophic respiration is hard to isolate observationally; chamber/partitioned estimates
          carry large uncertainty.
      detrending_options:
      - none
  - name: LAI
    unit: m2/m2
    description: Vegetation leaf area index from temperature-driven (Gaussian) phenology.
    validation_rank: 7
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Seasonal amplitude should be >=1.0 m2/m2; lai_min == lai_max yields a flat (uncomparable) cycle.
      - obs_shape: spatial_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Satellite-LAI point extraction at the site only; the model is 0-D and has no spatial field to
          match.
      detrending_options:
      - none
  - name: LE
    unit: W/m2
    description: Latent heat flux (water-use-efficiency approximation from GPP; simplified Penman-Monteith).
    validation_rank: 2
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - LE is diagnosed from GPP via a fixed WUE, not from a closed surface-energy budget; monthly LE
          should stay below Rnet (peak ~80-150 W/m2).
      detrending_options:
      - none
  - name: H
    unit: W/m2
    description: Terrestrial ecosystem sensible heat flux as the Rn-LE residual (no independent energy-balance
      closure).
    validation_rank: 8
    emitted_in: results CSV
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - H is a residual, so it inherits all LE/Rn errors; an over-large g1_bb-driven LE drives H negative.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_quincy_001
  symptom: 'GPP is unrealistically high (>50 umol/m2/s monthly mean) and all carbon fluxes are inflated.
    Heterotrophic respiration is also extremely large.

    '
  diagnosis: Temperature forcing from CMFD or MSWX was left in Kelvin instead of being converted to degrees
    Celsius. QUINCY expects deg C. Arrhenius temperature responses for Vcmax, Jmax, and Rh use (T - Tref)
    terms. With T ~ 290 K treated as 290 deg C, the exponential activation terms explode, producing astrono
  remedy: 'Subtract 273.15 from temperature before writing the forcing CSV. The convert_forcing_to_quincy.py
    tool handles this automatically when --source is set to CMFD or MSWX. Verify that monthly mean temperature
    values are in the range -40 to +45 deg C.

    '
  severity: critical
- id: dt_quincy_002
  symptom: 'Heterotrophic respiration (Rh) is near zero and NEE is strongly negative (large carbon sink)
    regardless of season. Soil decomposition appears completely shut down.

    '
  diagnosis: Precipitation forcing from CMFD was left in kg/m2/s (raw CMFD unit) instead of being converted
    to mm/day. QUINCY's bell-shaped moisture response for Rh uses precipitation in mm/day with an optimal
    value of ~2.5 mm/day. Raw CMFD values (~1e-5 kg/m2/s) are 86400x too small, placing the moisture scalar
  remedy: 'Multiply CMFD precipitation by 86400 to convert kg/m2/s to mm/day. For MSWX (mm/3hr), sum 8
    sub-daily timesteps to get daily totals. Verify that monthly mean precipitation is ~0.5-10 mm/day
    for temperate sites.

    '
  severity: critical
- id: dt_quincy_003
  symptom: 'GPP is very low in summer even though temperature and radiation look correct. Stomatal conductance
    appears unreasonably small. The model behaves as though the site is under extreme drought.

    '
  diagnosis: VPD was supplied in kPa instead of hPa. QUINCY uses hPa internally for VPD in the Ball-Berry
    stomatal conductance calculation. A VPD of 1.5 kPa (normal summer value) is read as 1.5 hPa (extremely
    low VPD should increase gs, but the Ci/Ca ratio calculation is distorted). Alternatively, VPD may
    have b
  remedy: 'Ensure VPD is in hPa (1 hPa = 100 Pa = 0.1 kPa). FLUXNET2015 VPD_F is already in hPa and needs
    no conversion. If sourcing VPD from other datasets, convert accordingly. Typical range: 2-30 hPa.

    '
  severity: major
- id: dt_quincy_004
  symptom: 'N-limited GPP (Vcmax25_eff) is unrealistically low, even though the leaf nitrogen value looks
    reasonable in literature units. GPP is ~20-50% of expected values.

    '
  diagnosis: Leaf nitrogen content (n_leaf_ref) was supplied in kgN/m2 or mgN/m2 instead of gN/m2. QUINCY
    computes Vcmax25_eff = vcmax_n_slope * leaf_N, where vcmax_n_slope is 25 umol/s/gN. If leaf_N is in
    kgN/m2 (0.0018 instead of 1.8), effective Vcmax drops to ~0.045 umol/m2/s, essentially shutting down
    photos
  remedy: 'Ensure n_leaf_ref is in gN/m2_leaf. Typical values for ENF are 1.5-2.5 gN/m2. If source data
    is in kgN/m2, multiply by 1000. If in mgN/m2, divide by 1000.

    '
  severity: major
- id: dt_quincy_005
  symptom: 'The convert_forcing_to_quincy.py tool raises a KeyError for column names like ''SW_IN_F''
    or ''TA_F'' when reading a FLUXNET2015 CSV file.

    '
  diagnosis: 'The FLUXNET2015 CSV file is from the SUBSET product instead of the FULLSET product. SUBSET
    files use different column suffixes (e.g., SW_IN_F_MDS instead of SW_IN_F, or TA_ERA instead of TA_F).
    The forcing converter expects FULLSET column names: SW_IN_F, TA_F, VPD_F, P_F, CO2_F_MDS.

    '
  remedy: 'Use the FLUXNET2015 FULLSET CSV file. If only SUBSET is available, map column names manually:
    SW_IN_F_MDS -> SW_IN_F, TA_ERA -> TA_F, VPD_ERA -> VPD_F, P_ERA -> P_F. Verify all five required columns
    are present before running the converter.

    '
  severity: critical
- id: dt_quincy_006
  symptom: 'All computed fluxes (GPP, NEE, Reco) are NaN or the model produces no valid output. Statistics
    show NaN for means and standard deviations across the entire simulation period.

    '
  diagnosis: FLUXNET2015 missing value sentinel (-9999) was not replaced with NaN before computation.
    When -9999 values enter the forcing arrays, they corrupt temperature means (driving T to ~-2000 deg
    C), radiation sums, and VPD values. The Arrhenius functions and Farquhar model produce NaN from these
    extreme i
  remedy: 'Replace all -9999 values with NaN immediately after reading the FLUXNET2015 CSV. The convert_forcing_to_quincy.py
    tool does this in its loading step. Verify with: df.replace(-9999, np.nan). Check that no column has
    >50% NaN; if CO2 data is >50% missing, apply the linear trend fallback (360 ppm in 19'
  severity: critical
- id: dt_quincy_007
  symptom: 'Simulated GPP has no seasonal cycle; it is nearly constant year-round even at a boreal site
    with strong temperature seasonality. LAI appears fixed at a single value.

    '
  diagnosis: The LAI phenology parameters lai_min and lai_max are set to the same value (or nearly so).
    QUINCY uses a Gaussian temperature response to interpolate LAI between lai_min and lai_max. If they
    are equal, LAI is constant and the seasonal GPP modulation from canopy dynamics is lost. This can
    happen when
  remedy: 'Set lai_min < lai_max with ecologically appropriate values. For boreal ENF: lai_min=3.5, lai_max=5.5.
    For temperate DBF: lai_min=0.5, lai_max=6.0. Verify that the output LAI timeseries shows a seasonal
    amplitude of at least 1.0 m2/m2.

    '
  severity: major
- id: dt_quincy_008
  symptom: 'Simulated GPP is 2-3x higher than observations. The model greatly overestimates carbon uptake,
    especially in summer, but the seasonal pattern looks correct.

    '
  diagnosis: 'Vcmax25 is set too high for the PFT. The default 45 umol/m2/s is for boreal ENF (Scots pine).
    Using this value for a tropical or cropland PFT where Vcmax25 should be 30-80 umol/m2/s (or the opposite:
    using a C4 crop value of 80 for a boreal ENF) causes a proportional GPP bias. Additionally, if N-lim'
  remedy: 'Set Vcmax25 appropriate to the PFT: boreal ENF ~40-50, temperate DBF ~50-65, tropical ~30-40,
    C3 crops ~60-80 umol/m2/s. Ensure N-limitation is active by setting n_leaf_ref to a realistic value
    (1.5-2.5 gN/m2 for ENF) so that Vcmax25_eff = vcmax_n_slope * leaf_N constrains the effective rate.

    '
  severity: major
- id: dt_quincy_009
  symptom: 'Ecosystem respiration (Reco) is much too high relative to GPP, and NEE is strongly positive
    (net carbon source) even in summer. The site appears to be losing carbon rapidly.

    '
  diagnosis: The Q10 parameter (rh_q10) for heterotrophic respiration is set too high (e.g., 3.0-4.0 instead
    of the default 2.0), or the base heterotrophic respiration rate (rh_base) is too large. With Q10=3.0,
    a 10 deg C temperature increase triples Rh instead of doubling it, compounding exponentially in warm
    m
  remedy: 'Use default Q10=2.0 and rh_base=1.8 umol/m2/s unless site-specific calibration indicates otherwise.
    Verify that rh_t_ref=15 deg C (standard reference). Check that annual Reco/GPP ratio is 0.7-0.9 for
    a mature forest.

    '
  severity: major
- id: dt_quincy_010
  symptom: 'The Jmax/Vcmax ratio appears ignored; GPP does not respond to changes in jmax_vcmax_ratio.
    Light-limited photosynthesis (Wj) never constrains GPP even under low-light conditions.

    '
  diagnosis: 'The jmax_vcmax_ratio parameter was set to a very high value (e.g., >3.0) or the alpha_j
    (quantum yield) was set too high (>0.5 mol/mol). This makes Wj always larger than Wc, so the Farquhar
    model always selects the Rubisco-limited rate. The electron transport branch of the model becomes
    irrelevant, '
  remedy: 'Use jmax_vcmax_ratio in the range 1.5-2.2 (default 1.9 for ENF). Set alpha_j to 0.2-0.35 mol/mol
    (default 0.3). Verify that under low radiation (<200 W/m2), Wj < Wc so that GPP shows light limitation.

    '
  severity: critical
- id: dt_quincy_011
  symptom: 'NaN values appear in GPP or Reco output columns starting from a specific month. Subsequent
    months are all NaN. The model does not crash but output is unusable.

    '
  diagnosis: The Arrhenius temperature function for Vcmax or Jmax produces overflow when temperature is
    extremely high (>60 deg C) or extremely low (<-60 deg C) due to bad forcing data. The exponent ea_vcmax
    * (T - 25) / (298.15 * R * T_K) becomes very large, and exp() returns Inf, which propagates as NaN
    throug
  remedy: 'Clamp temperature forcing to a physically realistic range (-50 to +55 deg C) before running
    the model. Check for outlier values in the forcing CSV. Investigate the specific month where NaN first
    appears -- it likely contains a corrupted temperature value or an un-replaced -9999 sentinel.

    '
  severity: critical
- id: dt_quincy_012
  symptom: 'Carbon balance does not close: annual (GPP - Reco) does not match the cumulative NEE. The
    discrepancy grows over multi-year runs.

    '
  diagnosis: 'NEE sign convention is incorrect. QUINCY uses micrometeorological convention: NEE = Reco
