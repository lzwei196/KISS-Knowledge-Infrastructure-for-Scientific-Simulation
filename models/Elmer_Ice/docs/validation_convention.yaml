# Blocks are keyed by the model's own dag.yaml output names. Continuous ice-flow
# fields are usually judged with RMSE/misfit diagnostics rather than categorical
# CSI; categorical/line-position scoring is retained only for the grounding mask.
# Null bands mean the cached/fetched literature did not provide a numeric
# validation threshold for that metric.

