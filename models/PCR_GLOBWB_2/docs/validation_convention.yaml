schema_version: 1
model_id: PCR_GLOBWB_2
domain: hydrology
generated_by: "self-improve session (Claude Opus 4.8) — Step-B validation-convention build, general schema"
generated_at: 2026-07-09

# Grounded ONLY in locally-fetched OA full texts. HEADLINE numeric bands come from the domain
# threshold convention Moriasi et al. 2015 (Trans. ASABE) — the reproduced streamflow tier table
# (satisfactory NSE > 0.50, |PBIAS| <= 15%, R2 > 0.60) and its EPIC/APEX runoff criteria
# (NSE >= 0.55, |PBIAS| within 20%). PCR-GLOBWB-specific skill for discharge / TWS / ET / runoff
# is taken from fetched benchmark evaluations (Sutanudjaja hyper-res 2023; Beck 10-model runoff 2017;
# Muller Schmied WaterGAP 2021; Scanlon-group GRACE-amplitude 2019; Lopez ET-calibration 2017) and
# the model-description paper (Sutanudjaja 2018). Net: discharge = strong (cited tier + 2 GHM
# benchmarks); runoff = moderate (transferred tier + PCR-GLOBWB r benchmark); TWS-vs-GRACE and ET
# have benchmark SKILL numbers but NO field-wide pass tier -> null bands, confidence <= 0.4;
# groundwater storage and SWE are structurally limited / data-thin -> null bands, weak.
# Bands are plain numbers read via `direction` (see VALIDATION_CONVENTION_SCHEMA.md).

