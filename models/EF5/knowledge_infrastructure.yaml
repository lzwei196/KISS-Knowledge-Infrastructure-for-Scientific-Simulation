# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: EF5
  language: c++
  implementation:
    id: ef5-hydroslab
    version: 1.2.3
    provenance: C++; HyDROSLab (University of Oklahoma) / NOAA NSSL EF5 source from github.com/HyDROSLab/EF5,
      one binary that couples a chosen water-balance model, routing model, and optional snow and inundation
      modules.
  scientific_reference_version: EF5 v1.2 (Ensemble Framework For Flash Flood Forecasting; Flamig, Vergara
    & Gourley 2020, GMD 13:4943-4958)
  binary:
    path: KISSPATH_BINARIES/EF5/bin/ef5
    type: work_dir
pipeline:
  stages:
  - s1_basic_grids
  - s2_forcing_preparation
  - s3_parameter_preparation
  - s5_execution
  - s6_output_analysis
tools:
  count: 5
  files:
  - tools/convert_forcing_to_ef5.py
  - tools/convert_params_to_ef5.py
  - tools/parse_ef5_output.py
  - tools/prepare_basic_grids.py
  - tools/run_ef5.py
inputs:
  forcing:
  - name: precipitation
    unit: mm/h (internal rate; depth per step = rate x step hours)
  - name: potential evapotranspiration
    unit: mm/h (internal rate)
  - name: air temperature
    unit: degC
  parameters:
  - name: DEM (elevation)
    unit: m
  - name: DDM (D8 drainage direction)
    unit: direction code
  - name: FAM (flow accumulation)
    unit: cell count
  - name: CREST WM (maximum soil water capacity)
    unit: mm
  - name: CREST B (variable infiltration curve exponent)
    unit: '-'
  - name: CREST IM (impervious area fraction)
    unit: '% (0-100)'
  - name: CREST KE (PET to actual ET factor)
    unit: '-'
  - name: CREST FC (saturated hydraulic conductivity)
    unit: mm/h
  - name: SAC-SMA parameters (UZTWM, UZFWM, UZK, PCTIM, ADIMP, RIVA, ZPERC, REXP, LZTWM, LZFSM, LZFPM,
      LZSK, LZPK, PFREE, SIDE, RSERV)
    unit: mm (UZTWM, UZFWM, LZTWM, LZFSM, LZFPM); 1/day (UZK, LZSK, LZPK); - fractions (PCTIM, ADIMP,
      RIVA, PFREE, SIDE, RSERV); - (ZPERC, REXP)
  - name: HyMOD parameters (HUZ, B, ALP, NQ, KQ, KS, XCUZ, XQ, XS, PRECIP)
    unit: HUZ mm; B -; ALP - (0-1 share to quick flow); NQ count of quick reservoirs; KQ, KS 1/day; XCUZ
      - (fraction of store capacity); XQ, XS mm; PRECIP - (precipitation multiplier)
  - name: HP SPLIT (fast/slow split fraction) and HP PRECIP (precipitation multiplier)
    unit: '- (both clamped to 0-1)'
  - name: KW ALPHA (channel storage relation A = ALPHA x Q^BETA multiplier)
    unit: m^(2-3 BETA) s^BETA (so that A in m2 for Q in m3/s)
  - name: KW BETA (channel exponent in A = ALPHA x Q^BETA)
    unit: '-'
  - name: KW ALPHA0 (overland / hillslope alpha in h = ALPHA0 x q^0.6)
    unit: m^-0.2 s^0.6 (so that storage depth in m for unit flow q in m2/s)
  - name: TH (channel threshold)
    unit: upstream cells
  - name: UNDER (interflow speed multiplier)
    unit: '-'
  - name: LEAKI (interflow reservoir leak fraction per step)
    unit: '- (0-1)'
  - name: Linear-reservoir routing parameters (COEM, RIVER, LEAKO)
    unit: COEM, RIVER - (speed multipliers; no unit given in manual or code); LEAKO - (0-1 fraction per
      step)
  - name: Snow-17 parameters (UADJ, MBASE, MFMAX, MFMIN, TIPM, NMF, PLWHC, SCF)
    unit: UADJ mm/mb per 6 h; MBASE degC; MFMAX, MFMIN mm/degC per 6 h; TIPM - (0-1); NMF mm/degC per
      6 h; PLWHC - (fraction of ice); SCF - (snowfall multiplier)
  - name: Inundation ALPHA, BETA (rating relation)
    unit: '-'
  - name: LP3 statistic grids (mean, std, skew of annual peak log10-Q)
    unit: log10(m3/s) for mean; log10 units for std; - for skew
  initial_conditions:
  - name: CREST IWU (initial soil water)
    unit: '% of WM'
  - name: SAC-SMA initial stores (UZTWC, UZFWC, LZTWC, LZFSC, LZFPC, ADIMC)
    unit: 'fraction of capacity (ADIMC: mm)'
  - name: ISU (initial interflow reservoir)
    unit: mm/s-scaled store (same units as KW_IR; not a mm depth)
  - name: ISO (initial overland reservoir, linear-reservoir routing)
    unit: mm/s-scaled store (same convention as ISU; not a mm depth)
  - name: saved model state grids (soil stores, KW channel/overland/interflow states, Snow-17 states)
    unit: same as the matching states.variables entry (mm for soil and snow stores; mm/s-scaled for the
      KW interflow store IR; m3/s or m2/s for KW flow states; degC for Snow-17 ATI)
  boundary_conditions:
  - name: water-balance model choice (CREST | SAC-SMA | HyMOD | HP)
    unit: '-'
  - name: routing model choice (kinematic wave | linear reservoir)
    unit: '-'
  - name: snow module on/off (Snow-17)
    unit: '-'
  - name: inundation module choice (none | simple | VC)
    unit: '-'
  - name: 'return-period mode (STYLE=SIMU_RP: track annual peaks and write LP3 statistic grids)'
    unit: '-'
  - name: data assimilation of observed gauge discharge on/off
    unit: '-'
  - name: TIMESTEP
    unit: time (y, m = month, d, h, u = minute, s)
  - name: simulation window (begin, warm-up end, end, state save time)
    unit: YYYYMMDDHHUU
  - name: projection (geographic WGS84 | LAEA std parallel 45N, central meridian 100W)
    unit: '-'
  - name: DDM coding switch (ESRI vs TauDEM) and FAM self-count switch
    unit: '-'
  - name: gauge network (gauge lon/lat or cell, optional basin area for snapping) and basin as a set of
      gauges
    unit: deg, km^2
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - discharge
  - discharge_grid
  - unit_discharge_grid
  - soil_moisture
  - swe
  - inundation_depth
  - return_period
  - fast_flow
  - slow_flow
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.656, KGE=0.728, R=0.880, 2 scorecard(s)'
  metrics:
    best_nse: 0.6565
    best_kge: 0.728
    best_r: 0.88
summary:
  total_tools: 5
  total_stage_docs: 5
  total_diagnostic_triplets: 22
  generated: '2026-10-16'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
