template_version: "3.5"

identity:
  model_id: "pySTEPS"
  scientific_reference_version: "STEPS cascade-based stochastic nowcasting scheme (Bowler et al. 2006 / Seed 2003 S-PROG lineage) as realized in pysteps 1.20.0"
  implementation:
    id: "pysteps"
    version: "1.20.0"
    provenance: "Python; community-driven pySTEPS library (pySTEPS developers) implementing the STEPS ensemble nowcasting scheme; version via importlib.metadata."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "BSD-3-Clause"
  repo_url: "https://github.com/pySTEPS/pysteps"

boundary:
  scope_in:
    - "Short-term probabilistic / deterministic nowcasting of 2-D radar precipitation intensity fields"
    - "Motion (advection) field estimation from a past radar frame sequence via optical flow"
    - "Stochastic ensemble generation of future precipitation fields (STEPS cascade approach)"
    - "Exceedance-probability mapping from the ensemble"
    - "Forecast verification (categorical and spatial skill scores) against held-out observed frames"
  scope_out:
    - "Numerical weather prediction integration (NWP fields are blended in, not computed by pysteps)"
    - "Non-precipitation atmospheric variables (temperature, wind, pressure are not forecast)"
    - "Rainfall-runoff / land-surface / discharge simulation; pysteps is not a hydrological model and cannot be scored standalone against discharge or water-quality stations"
  spatial: "2-D grid"
  temporal: "sub-hourly"
  closure: "none"
  notes: "Lagrangian persistence / advection-based evolution: the field is extrapolated along a quasi-stationary motion field and each cascade level is advanced by an AR(2) autoregressive model with stochastic perturbation. Mass is not strictly conserved (semi-Lagrangian interpolation introduces numerical diffusion and overshoots; advected-out pixels are set to a fill value; stochastic noise perturbs intensities). Skill decays with the Lagrangian predictability horizon, typically minutes to ~2-3 hours of lead time. The model operates on a uniform Cartesian radar grid; no surface energy or water budget is closed."

inputs:
  forcing:
    - category: "radar_precipitation"
      name: "precipitation intensity field sequence"
      unit: "mm/h"
      source_kind: "forcing"
      model_input_format: "sequence of 2-D arrays (T, m, n) on a uniform Cartesian radar grid plus a metadata dict (projection, x1/y1/x2/y2, xpixelsize/ypixelsize, unit, transform, accutime, threshold, zerovalue, zr_a, zr_b)"
      notes: "At least 2 consecutive frames required for motion estimation; typically 3-4 past frames at 5-15 min cadence. May be supplied as reflectivity (dBZ) or log-rain (dBR); STEPS works internally in dBR. Unit state is carried implicitly through the metadata dict, so the caller must ensure the correct transform domain; feeding dBZ where mm/h is expected produces chaotic motion and inflated nowcasts."
    - category: "external_nwp"
      name: "external NWP precipitation nowcast"
      unit: "mm/h"
      source_kind: "user_provided"
      model_input_format: "precomputed NWP precipitation field array supplied to the blending path"
      notes: "Optional. When provided to the blending module, the autoregression and advection steps are omitted for the extrapolation cascade and the NWP component is blended per cascade level by skill-dependent weights."
  parameters:
    - category: "ensemble_config"
      name: "n_ens_members"
      unit: "count"
      source_kind: "default"
      model_input_format: "integer (StepsNowcasterConfig field)"
      notes: "Source default 24; >=20 required for stable probability estimates, 48-100 for severe-threshold research; 1 = deterministic."
    - category: "cascade_config"
      name: "n_cascade_levels"
      unit: "count"
      source_kind: "default"
      model_input_format: "integer number of FFT bandpass spatial scales"
      notes: "Source default 6 (chosen via upstream issue #385). Must satisfy 2^n_levels <= min(nx, ny)."
    - category: "temporal_config"
      name: "ar_order"
      unit: "count"
      source_kind: "default"
      model_input_format: "integer AR model order per cascade level"
      notes: "Source default 2 (AR(2) standard); valid range 1-3."
    - category: "zr_relationship"
      name: "zr_a, zr_b (Marshall-Palmer Z-R coefficients)"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "two floats used as R = (Z/zr_a)^(1/zr_b)"
      notes: "Source defaults zr_a=200.0, zr_b=1.6 when metadata lacks them; convert dBZ to mm/h before nowcasting."
    - category: "velocity_perturbation_config"
      name: "velocity_perturbation BPS coefficients (p_par/p_perp)"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "BPS p_par/p_perp coefficient triplets"
      notes: "Tunable parallel/perpendicular velocity-perturbation scaling coefficients applied when the 'bps' velocity-perturbation method is active; they set lead-time-dependent motion-field uncertainty and ensemble spread. (The on/off SELECTION of the velocity-perturbation and noise methods is a structural switch, recorded under boundary_conditions.)"
  initial_conditions:
    - category: "antecedent_state"
      name: "antecedent radar frame sequence"
      unit: "mm/h"
      source_kind: "forcing"
      model_input_format: "the most recent observed frames used to seed motion estimation and cascade decomposition at t=0"
      notes: "pySTEPS is a stateless functional library: there is no persistent simulation state across runs; the antecedent frames ARE the effective initial condition for a nowcast call."
  boundary_conditions:
    - category: "horizon"
      name: "timesteps / n_leadtimes"
      unit: "count or list"
      source_kind: "user_provided"
      model_input_format: "integer number, or explicit list, of forecast lead times"
      notes: "User choice controlling the nowcast horizon; skill degrades significantly beyond 2-3 hours (e.g. 36 steps at 5-min cadence)."
    - category: "method_selection"
      name: "nowcast method (extrapolation / sprog / steps / sseps / anvil / linda)"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "dispatch string passed to nowcasts.interface.get_method"
      notes: "Structural switch selecting deterministic vs ensemble vs localized nowcast algorithm."
    - category: "method_selection"
      name: "noise_method / velocity_perturbation_method"
      unit: "categorical"
      source_kind: "default"
      model_input_format: "method selector strings (noise_method e.g. 'nonparametric'; velocity_perturbation_method e.g. 'bps')"
      notes: "Source defaults: noise active and velocity_perturbation_method='bps' ON for STEPS; 'bps' requires kmperpixel and timestep. Selecting/disabling these is a structural switch on ensemble spread (the tunable BPS p_par/p_perp coefficients are a separate parameter entry)."
    - category: "mask_config"
      name: "mask_method / probmatching_method"
      unit: "categorical"
      source_kind: "default"
      model_input_format: "method selector strings (mask_method='incremental', probmatching_method='cdf')"
      notes: "Incremental masking requires timestep and kmperpixel (raises ValueError if timestep=None); CDF probability matching re-anchors each member to the observed field each step."

processes:
  modules:
    - name: "data_import_and_unit_conversion"
      role: "driver"
      brief: "Format-specific radar importers (OPERA/KNMI/MCH/BoM/FMI/SAF/DWD/MRMS) load 2-D fields plus a metadata dict; Marshall-Palmer Z-R (zr_a=200, zr_b=1.6) and dB_transform convert dBZ <-> mm/h <-> dBR. Unit state travels through the metadata dict."
    - name: "motion_estimation"
      role: "process_solver"
      brief: "Optical-flow estimation of the advection velocity field (2, m, n) in pixels/timestep from the past frame sequence. Methods: Lucas-Kanade (default, Shi-Tomasi features + IDW interpolation), VET, Proesmans, DARTS, constant."
    - name: "cascade_decomposition"
      role: "process_solver"
      brief: "FFT bandpass (gaussian/uniform) decomposition of the field into n_cascade_levels spatial scales with per-level means/stds; supports recomposition back to a single field."
    - name: "timeseries_ar_model"
      role: "process_solver"
      brief: "Estimates per-cascade-level lag autocorrelations (gamma) and AR(p) coefficients (phi) via Yule-Walker, then iterates the AR(2) model to evolve each scale forward in time (larger scales decorrelate more slowly)."
    - name: "stochastic_noise_generation"
      role: "optional_module"
      brief: "FFT-based stochastic perturbation generator (nonparametric/parametric/SSFT) injecting spatially-correlated noise matching the observed power spectrum into cascade levels to create ensemble spread."
      applicability: "ensemble methods (STEPS/SSEPS/LINDA)"
    - name: "velocity_perturbation"
      role: "optional_module"
      brief: "Perturbs the advection field per ensemble member using BPS p_par/p_perp coefficients; ON by default for STEPS, requires kmperpixel and timestep."
      applicability: "ensemble methods (STEPS/SSEPS)"
    - name: "extrapolation_semilagrangian"
      role: "integrator"
      brief: "Advects fields forward along backward semi-Lagrangian trajectories (n_iter sub-steps, bilinear/bicubic interpolation), producing each lead-time frame; advected-out cells take a fill value (NaN)."
    - name: "probability_matching"
      role: "process_solver"
      brief: "Probability matching (CDF or mean) re-maps each forecast member's distribution onto the most recent observed field's statistics every step."
    - name: "steps_ensemble_nowcaster"
      role: "driver"
      brief: "Orchestrates the full STEPS ensemble pipeline: decompose -> fit AR -> per member (perturb motion + AR-evolve + add noise + extrapolate + mask + probmatch) -> recompose into mm/h fields."
    - name: "sprog_nowcaster"
      role: "process_solver"
      brief: "Deterministic spectral-prognosis nowcast: AR(2) cascade evolution without stochastic noise; progressively removes unpredictable small scales (deterministic limit of STEPS). Reuses cascade_decomposition and timeseries_ar_model."
      applicability: "method=sprog"
    - name: "anvil_nowcaster"
      role: "process_solver"
      brief: "Autoregressive nowcasting of vertically-integrated liquid / rain rate with reduced bias and better small-scale preservation than S-PROG. Reuses cascade_decomposition and timeseries_ar_model."
      applicability: "method=anvil"
    - name: "extrapolation_nowcaster"
      role: "process_solver"
      brief: "Pure Lagrangian-persistence baseline: advect the last observed frame with the motion field, no AR or noise."
      applicability: "method=extrapolation"
    - name: "linda_nowcaster"
      role: "process_solver"
      brief: "Lagrangian INtegro-Difference equation with Autoregression; localized convective-scale ensemble nowcasting alternative."
      applicability: "method=linda"
    - name: "blending"
      role: "optional_module"
      brief: "Scale-dependent blending of the extrapolation nowcast, stochastic noise and external NWP per cascade level using skill-dependent weights, then reconstruction of the precipitation field."
      applicability: "when an external NWP nowcast is supplied"
    - name: "verification"
      role: "process_solver"
      brief: "Skill metrics: categorical CSI/POD/FAR/HSS/ETS at intensity thresholds (det_cat_fct) and Fractions Skill Score at spatial scales (FSS), plus ensemble/probabilistic scores, against held-out observed frames."
  internal_edges:
    - from: "Inputs"
      to: "data_import_and_unit_conversion"
      kind: "consumes_input"
      brief: "raw radar files + metadata ingested and converted toward mm/h"
    - from: "data_import_and_unit_conversion"
      to: "motion_estimation"
      kind: "invokes"
      brief: "converted frame sequence drives optical-flow motion estimation"
    - from: "data_import_and_unit_conversion"
      to: "cascade_decomposition"
      kind: "invokes"
      brief: "converted frames decomposed into n_cascade_levels spatial scales"
    - from: "cascade_decomposition"
      to: "timeseries_ar_model"
      kind: "produces_output"
      brief: "per-level normalized cascades feed autocorrelation and AR-coefficient estimation"
    - from: "timeseries_ar_model"
      to: "steps_ensemble_nowcaster"
      kind: "writes_state"
      brief: "phi/gamma stored as AR model coefficients used to evolve each cascade level"
    - from: "stochastic_noise_generation"
      to: "steps_ensemble_nowcaster"
      kind: "invokes"
      brief: "stochastic noise field added to cascade levels per ensemble member"
    - from: "velocity_perturbation"
      to: "extrapolation_semilagrangian"
      kind: "produces_output"
      brief: "per-member perturbed velocity field passed to advection"
    - from: "motion_estimation"
      to: "extrapolation_semilagrangian"
      kind: "produces_output"
      brief: "advection velocity field drives semi-Lagrangian extrapolation"
    - from: "steps_ensemble_nowcaster"
      to: "extrapolation_semilagrangian"
      kind: "invokes"
      brief: "advect each recomposed member field to the next lead time"
    - from: "steps_ensemble_nowcaster"
      to: "probability_matching"
      kind: "invokes"
      brief: "match member CDF/mean to the observed field each step"
    - from: "steps_ensemble_nowcaster"
      to: "precipitation_forecast"
      kind: "writes_state"
      brief: "advected, recomposed member frames appended to the forecast state"
    - from: "steps_ensemble_nowcaster"
      to: "Outputs"
      kind: "produces_output"
      brief: "ensemble precipitation intensity fields emitted"
    - from: "data_import_and_unit_conversion"
      to: "sprog_nowcaster"
      kind: "consumes_input"
      brief: "converted frame sequence fed to the S-PROG deterministic nowcaster (reuses cascade_decomposition + timeseries_ar_model)"
    - from: "motion_estimation"
      to: "sprog_nowcaster"
      kind: "produces_output"
      brief: "advection field drives S-PROG deterministic cascade evolution"
    - from: "sprog_nowcaster"
      to: "Outputs"
      kind: "produces_output"
      brief: "deterministic S-PROG nowcast field emitted"
    - from: "data_import_and_unit_conversion"
      to: "anvil_nowcaster"
      kind: "consumes_input"
      brief: "converted frame sequence fed to the ANVIL nowcaster (reuses cascade_decomposition + timeseries_ar_model)"
    - from: "motion_estimation"
      to: "anvil_nowcaster"
      kind: "produces_output"
      brief: "advection field drives ANVIL AR-integrated nowcast"
    - from: "anvil_nowcaster"
      to: "Outputs"
      kind: "produces_output"
      brief: "ANVIL nowcast field emitted"
    - from: "data_import_and_unit_conversion"
      to: "extrapolation_nowcaster"
      kind: "consumes_input"
      brief: "converted last observed frame fed to the Lagrangian-persistence baseline"
    - from: "motion_estimation"
      to: "extrapolation_nowcaster"
      kind: "produces_output"
      brief: "advect last observed frame (Lagrangian-persistence baseline, no AR or noise)"
    - from: "extrapolation_nowcaster"
      to: "Outputs"
      kind: "produces_output"
      brief: "Lagrangian-persistence baseline nowcast field emitted"
    - from: "data_import_and_unit_conversion"
      to: "linda_nowcaster"
      kind: "consumes_input"
      brief: "converted frame sequence fed to the LINDA localized nowcaster"
    - from: "motion_estimation"
      to: "linda_nowcaster"
      kind: "produces_output"
      brief: "advection field drives LINDA localized AR nowcast"
    - from: "linda_nowcaster"
      to: "Outputs"
      kind: "produces_output"
      brief: "LINDA localized ensemble nowcast field emitted"
    - from: "blending"
      to: "Outputs"
      kind: "produces_output"
      brief: "blended nowcast+NWP precipitation field emitted (when NWP supplied)"
    - from: "steps_ensemble_nowcaster"
      to: "verification"
      kind: "produces_output"
      brief: "forecast frames passed to categorical and spatial skill scoring against held-out observations"
    - from: "verification"
      to: "Outputs"
      kind: "produces_output"
      brief: "CSI/POD/FAR/HSS/ETS and FSS skill scores emitted"

states:
  variables:
    - name: "motion_field"
      unit: "pixels/timestep"
      role: "diagnostic"
    - name: "cascade_decomposition"
      unit: "dimensionless (per-level normalized field)"
      role: "prognostic"
    - name: "ar_model_coefficients (phi)"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "autocorrelation_coefficients (gamma)"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "precipitation_forecast"
      unit: "mm/h"
      role: "prognostic"
    - name: "noise_perturbation_state"
      unit: "dimensionless"
      role: "prognostic"
    - name: "velocity_perturbations"
      unit: "pixels/timestep"
      role: "prognostic"
    - name: "precip_mask"
      unit: "boolean"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "precipitation_intensity"
    unit: "mm/h"
    description: "Deterministic or ensemble nowcast of N future atmospheric radar precipitation-intensity frames on the same radar grid as the input. STEPS computes internally in log (dBR) space and converts the output back to mm/h. Shape (n_leadtimes, ny, nx) deterministic or (n_ens, n_leadtimes, ny, nx) ensemble; values are instantaneous rates per lead time, not accumulations."
    emitted_in: "nowcast array returned by nowcasts.<method>.forecast (exported to NetCDF/GeoTIFF/CSV in postprocess)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "csi"
          caveats:
            - "Compare against held-out observed radar QPE frames on the same grid/CRS; reproject if grids differ."
            - "Skill decays with lead time; evaluate per lead time, not just as a pooled average."
            - "Advected-out boundary pixels are fill values and should be masked before scoring."
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families:
            - "event_detection"
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Threshold (mm/h) must match the data unit; CSI/POD/FAR/HSS/ETS (det_cat_fct) and FSS at a chosen spatial scale apply."
            - "All-zero forecast-and-observation pairs give a degenerate contingency table (NaN scores)."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Point comparison (e.g. against a rain-gauge accumulation) requires accumulating instantaneous mm/h rates by the frame timestep (depth = sum(rate * accutime/60))."
            - "Radar-gauge representativeness mismatch limits point-scale interpretation."
      detrending_options:
        - "none"
  - var: "exceedance_probability"
    validation_rank: 2
    unit: "dimensionless [0,1]"
    description: "Atmospheric radar precipitation-intensity probability-of-exceedance maps derived from the STEPS ensemble (fraction of members whose precipitation intensity exceeds a given mm/h threshold at each grid cell and lead time). Requires >=20 ensemble members for stable estimates."
    emitted_in: "ensemble post-processing (thresholded ensemble) / nowcasts.lagrangian_probability"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "categorical_event_comparison"
          metric_families:
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Probabilistic skill scored against binary observed exceedance fields (Brier score, BSS, reliability); needs >=20-48 members for stable probabilities."
            - "Exceedance threshold unit must match the nowcast output unit (mm/h, not dBZ)."
      detrending_options:
        - "none"
  - var: "motion_field"
    validation_rank: 1
    unit: "pixels/timestep"
    description: "Estimated 2-D atmospheric radar precipitation advection velocity field (2, ny, nx) from the optical-flow stage on the radar precipitation frame sequence; an intermediate product also returnable on its own."
    emitted_in: "motion.<method> output (e.g. dense_lucaskanade)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Rarely validated directly; meaningful only against an independent motion estimate or tracked-feature displacement, in pixels/timestep on the same grid."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "n_cascade_levels"
      to: "precipitation_intensity"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "STEPS / S-PROG"
      citations:
        - "pulkkinen2019_pysteps_v1"
        - "seed2003_sprog_dynamic_scaling"
        - "bowler2006_steps_scheme"
    - from: "n_ens_members"
      to: "exceedance_probability"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "ensemble methods; strongest at severe-precipitation thresholds"
      citations:
        - "pulkkinen2019_pysteps_v1"
    - from: "ar_order"
      to: "precipitation_intensity"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations:
        - "seed2003_sprog_dynamic_scaling"
        - "bowler2006_steps_scheme"
    - from: "noise_method"
      to: "exceedance_probability"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      applicability: "ensemble methods"
      citations:
        - "pulkkinen2019_pysteps_v1"
        - "bowler2006_steps_scheme"
    - from: "velocity_perturbation_params"
      to: "exceedance_probability"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "ensemble methods"
      citations:
        - "pulkkinen2019_pysteps_v1"
        - "bowler2006_steps_scheme"
    - from: "optical_flow_method"
      to: "precipitation_intensity"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "structural"
      citations:
        - "pulkkinen2019_pysteps_v1"
    - from: "nwp_blending_weights"
      to: "precipitation_intensity"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "blending path (nowcast + NWP)"
      citations:
        - "imhoff2023_pysteps_blending"
    - from: "nwp_skill"
      to: "precipitation_intensity"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "blending path, longer lead times"
      citations:
        - "imhoff2023_pysteps_blending"
    - from: "flow_regime_orography"
      to: "precipitation_intensity"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      citations:
        - "foresti2014_orography_predictability"
  citation_index:
    pulkkinen2019_pysteps_v1:
      short_citation: "Pulkkinen et al. 2019"
      doi: "10.5194/gmd-12-4185-2019"
      note: "Reference pysteps v1.0 paper (GMD); tests sensitivity to ensemble size, optical-flow method, cascade decomposition (~20% CSI gain, ~40% MAE reduction at 2 h), AR order, noise and velocity-perturbation parameters."
    bowler2006_steps_scheme:
      short_citation: "Bowler et al. 2006"
      doi: "10.1256/qj.04.100"
      note: "Original STEPS scheme: multiplicative cascade, AR(2) per scale, stochastic noise and BPS velocity perturbation as controls on ensemble spread and skill."
    seed2003_sprog_dynamic_scaling:
      short_citation: "Seed 2003"
      doi: "10.1175/1520-0450(2003)042<0381:ADASSA>2.0.CO;2"
      note: "S-PROG deterministic backbone; dynamic scaling of feature lifetime motivates cascade levels and per-level AR decorrelation times."
    imhoff2023_pysteps_blending:
      short_citation: "Imhoff et al. 2023"
      doi: "10.1002/qj.4461"
      note: "Scale-dependent blending of STEPS ensemble nowcasts with NWP in pysteps; per-level nowcast-vs-NWP weights and NWP skill control crossover lead time and blended CSI."
    foresti2014_orography_predictability:
      short_citation: "Foresti and Seed 2014"
      doi: "10.5194/hess-18-4671-2014"
      note: "Flow regime and orography control feature lifetime (Lagrangian persistence ~2x longer upwind vs downwind); power-law dynamic scaling with feature scale."

safety:
  hazards:
    - id: "unit_dbz_not_converted"
      kind: "weather_file_semantic"
      description: "Input in dBZ (reflectivity, -10..60) fed to routines expecting mm/h (0..~100) yields chaotic motion vectors and inflated nowcasts; convert via Marshall-Palmer Z-R first."
      severity: "silent"
    - id: "double_db_transform"
      kind: "weather_file_semantic"
      description: "mm/h data passed through an extra dB_transform drives values toward zero, producing a silent near-zero nowcast with CSI/POD ~0; check metadata['transform'] is None before transforming."
      severity: "silent"
    - id: "accumulation_timestep_mismatch"
      kind: "weather_file_semantic"
      description: "Outputs are instantaneous mm/h rates; treating them as depths or forgetting timestep scaling (depth = sum(rate * accutime/60)) inflates/deflates accumulation totals 2-12x."
      severity: "silent"
    - id: "nan_propagation"
      kind: "numerical_instability"
      description: "Input NaNs (beam blockage, masked pixels) propagate through semi-Lagrangian interpolation and FFT cascade, contaminating neighbors each step and dominating later lead times; fill/interpolate NaNs before nowcasting."
      severity: "degraded"
    - id: "semilagrangian_diffusion_overshoot"
      kind: "numerical_instability"
      description: "Semi-Lagrangian + bilinear interpolation causes numerical diffusion (smearing), ghosting/streaks, and negative overshoots, worsened when CFL>1; clip negatives to 0 and raise extrapolation sub-steps."
      severity: "degraded"
    - id: "domain_too_small_advect_out"
      kind: "numerical_instability"
      description: "If advection distance over the horizon exceeds the domain buffer, features exit the domain and advected-out pixels become fill values, creating artificial edge precipitation loss; size buffer ~1.5x max displacement."
      severity: "degraded"
    - id: "degenerate_ensemble_no_spread"
      kind: "control_semantic"
      description: "Too-weak stochastic perturbation (noise_method=None, too few cascade levels, n_ens_members=1, AR phi near 1 with tiny noise) yields a degenerate ensemble with sharp 0%/100% probability maps; use >=20 members and an active noise method."
      severity: "degraded"
    - id: "exceedance_threshold_unit_mismatch"
      kind: "control_semantic"
      description: "Exceedance / verification threshold in the wrong unit (e.g. 10 dBZ drizzle vs 10 mm/h heavy rain) makes probability maps and skill scores meaningless; threshold unit must match the nowcast output unit."
      severity: "silent"
    - id: "verification_degenerate_inputs"
      kind: "parser_semantic"
      description: "det_cat_fct / fss return NaN when both forecast and observation are all-zero below threshold, on shape mismatch, or when the FSS spatial scale exceeds the domain; assert matching shapes and valid threshold."
      severity: "fatal_or_silent"
    - id: "projection_crs_mismatch"
      kind: "weather_file_semantic"
      description: "Wrong/missing metadata['projection'] (radar composites use varied CRS such as OPERA LAEA EPSG:3035) offsets the field by tens-to-hundreds of km when overlaid or coupled to another grid; reproject to a common CRS before merging."
      severity: "silent"
  validation_limits:
    - "Short-term nowcasting horizon only; skill decays beyond the Lagrangian predictability limit, typically minutes to ~2-3 hours of lead time."
    - "Designed and validated for radar precipitation fields on a uniform Cartesian grid; not applicable to non-precipitation variables."
    - "Not a hydrological model: cannot be validated standalone against station discharge or water-quality observations. Standalone validation is against a synthetic analytical advection case with known ground truth; in a hydrological context it must be scored only as part of a coupled rainfall-runoff chain."
    - "When an external NWP nowcast is supplied to blending, the autoregression and advection steps are omitted for the extrapolation cascade, changing the effective model form."
  warnings:
    - "Velocity-perturbation method defaults ON ('bps') and incremental masking is the default; both require timestep and kmperpixel, raising a ValueError deep in initialization if timestep is None."
    - "CDF probability matching is applied to every member by default, re-anchoring forecast statistics to the most recent observed field each step."
    - "Memory scales as O(n_ens * n_cascade_levels * 2 * nx * ny * n_leadtimes); large national/continental composites (>=2000x2000) with many members can OOM. Mitigate by cropping the domain, reducing n_ens_members to ~20, and reducing n_cascade_levels."
  assumptions:
    - statement: "The advection (motion) field is quasi-stationary over the nowcast horizon (Lagrangian persistence), with optional stochastic motion perturbation to quantify uncertainty."
      scope: "All nowcast methods"
      source: "pysteps documentation (nowcasts) and Bowler et al. 2006 (10.1256/qj.04.100)"
      status: "adopted"
    - statement: "Each cascade level is evolved by an AR(2) autoregressive model that captures scale-dependent temporal predictability decay; unpredictable small scales are progressively filtered."
      scope: "STEPS / S-PROG / ANVIL cascade evolution"
      source: "Seed 2003 (10.1175/1520-0450(2003)042<0381:ADASSA>2.0.CO;2) and pysteps timeseries.autoregression module"
      status: "adopted"
    - statement: "No mass or energy budget is closed; the field is an advection/AR extrapolation with stochastic perturbation on a uniform Cartesian radar grid."
      scope: "Whole model"
      source: "pysteps documentation (overview) and extrapolation.semilagrangian module behavior"
      status: "adopted"
    - statement: "Input precipitation is on a regular Cartesian grid with consistent metadata (projection, pixel size, unit, transform); reflectivity (dBZ) inputs require a Z-R relationship for conversion to rain rate."
      scope: "Inputs / unit handling"
      source: "pysteps io documentation and utils.conversion / utils.transformation modules"
      status: "adopted"

