# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: SWAT+
  language: fortran
  implementation:
    id: swat-plus-rev593
    version: Rev 59.3
    provenance: Fortran 90; USDA-ARS / Texas A&M AgriLife operational SWAT+ Rev 59.3 binary; sd_channel-stable
      pre-2023 build.
  scientific_reference_version: SWAT+ Rev 59.3 (operational HydroCraft binary; watershed water/sediment/nutrient
    process spec inherited from SWAT 2012 with object-based restructuring per Bieger et al. 2017)
inputs:
  forcing:
  - name: precipitation
    unit: mm/day
    category: atmospheric
    source_kind: forcing
    model_input_format: Daily station time series, one .pcp file per station; missing values flagged -99.0
  - name: maximum air temperature
    unit: deg C
    category: atmospheric
    source_kind: forcing
    model_input_format: Daily station time series in .tmp
    notes: SWAT+ does not validate Tmax >= Tmin or Celsius range; Kelvin (~300) is silently consumed as
      Celsius.
  - name: minimum air temperature
    unit: deg C
    category: atmospheric
    source_kind: forcing
    model_input_format: Daily station time series in .tmp
  - name: solar radiation
    unit: MJ/m2/day
    category: atmospheric
    source_kind: forcing
    model_input_format: Daily station time series in .slr
    notes: Unit is MJ/m2/day, NOT W/m2; W/m2 inputs are silently consumed and inflate PET ~12x.
  - name: relative humidity
    unit: fraction (0-1)
    category: atmospheric
    source_kind: forcing
    model_input_format: Daily station time series in .hmd
    notes: Fraction, not percent; percent values are silently consumed.
  - name: wind speed
    unit: m/s
    category: atmospheric
    source_kind: forcing
    model_input_format: Daily station time series in .wnd
  - name: atmospheric CO2 concentration
    unit: ppm
    category: atmospheric
    source_kind: forcing
    model_input_format: Annual basin-scale series (co2.bsn) or constant via bsn_prm%co2 default 400
  - name: atmospheric nitrogen deposition
    unit: kgN/ha/yr (wet+dry)
    category: atmospheric
    source_kind: forcing
    model_input_format: Optional atmo.cli station series
  parameters:
  - name: soil hydraulic profile (SOL_BD, SOL_AWC, SOL_K, SOL_CBN, CLAY/SILT/SAND, ROCK, SOL_ALB, USLE_K,
      SOL_EC, SOL_CAL, SOL_PH)
    unit: mixed (g/cm3, mm/mm, mm/hr, %, ...)
    category: soil
    source_kind: dataset_lookup
    model_input_format: Multi-layer soils.sol records; profile line + N layer lines in increasing-depth
      order
    notes: Pedotransfer chain (Saxton & Rawls 2006 for AWC and Ksat; Williams 1995 for USLE_K) is typical
      upstream; nly mismatch silently corrupts subsequent profiles.
  - name: structural hydrology defaults per HRU (esco, epco, perco, cn3_swf, lat_ttime, canmx)
    unit: mixed
    category: soil-structural
    source_kind: calibrated
    model_input_format: hydrology.hyd
    notes: perco and cn3_swf live in hydrology.hyd, not in cal_parms.cal — runtime calibration.cal cannot
      adjust them; changing them requires regenerating the HRU layer.
  - name: basin scalar coefficients (surlag, cn_froz, cmn, cdn, sdnco, nperco, pperco, phoskd, psp, rsdco,
      tlaps, plaps, evlai, nfixmx, uhalpha, prf, n_updis, p_updis)
    unit: mixed
    category: basin-scalar
    source_kind: default
    model_input_format: parameters.bsn with hard-coded fallbacks in basin_module.f90
    notes: Many defaults are baked into source (e.g., surlag=4.0, sdnco=1.30 which effectively disables
      denitrification unless reset, prf=484 legacy ft-unit constant, igen=5 undocumented RNG seed).
  - name: channel hydraulic and morphological parameters (chw, chd, chs, chl, chn, chk, bank cohesion,
      floodplain geometry)
    unit: m, m/m, dimensionless
    category: channel
    source_kind: dataset_lookup
    model_input_format: channel-hyd.cha, channel-lte.cha, hyd-sed-lte.cha
  - name: lumped aquifer parameters (alpha_bf, gw_delay, revap_co, rchrg_dp, flo_min, gw_spyld)
    unit: mixed (1/day, days, fraction, mm)
    category: aquifer
    source_kind: calibrated
    model_input_format: aquifer.aqu and initial.aqu
  - name: distributed aquifer grid parameters (K, specific yield, streambed thickness and Ksat, drain
      perimeter K)
    unit: m/day, dimensionless
    category: gwflow-grid
    source_kind: calibrated
    model_input_format: gwflow.* input files
    notes: Only consulted when bsn_cc%gwflow=1; otherwise replaced by lumped aqu_1d module.
  - name: plant species/cultivar coefficients (bio_e, hvsti, blai, dlai, t_base, t_opt, gsi, vpdfr, frgrw1/2,
      laimx1/2, alai_min, bio_leaf, mat_yrs)
    unit: mixed
    category: plant
    source_kind: dataset_lookup
    model_input_format: plants.plt
  - name: land-use coefficient table including CN2 lookup by hydrologic soil group
    unit: dimensionless
    category: landuse
    source_kind: dataset_lookup
    model_input_format: cntable.lum and landuse.lum (links each HRU LU code to management, CN2, urban
      params, tile drains)
  - name: USLE practice and cover factors (USLE_P, USLE_C via plant cover, slope length)
    unit: dimensionless / m
    category: erosion
    source_kind: dataset_lookup
    model_input_format: hru-data.hru and plants.plt
  initial_conditions:
  - name: initial soil water content per layer
    unit: mm
    category: soil-water
    source_kind: default
    model_input_format: Initialized to field capacity unless overridden; basin_sw_init in time_control
  - name: initial soil N (NO3, NH4, organic) and P pools per layer
    unit: kg/ha
    category: soil-nutrient
    source_kind: user_provided
    model_input_format: nutrients.sol (optional); else initialized from SOL_CBN via mineralization defaults
    notes: Zero or under-initialized pools force the model to mine soil organic matter to balance crop
      uptake (silent negative nutrient balance).
  - name: initial aquifer storage and water-table depth
    unit: mm, m
    category: aquifer-storage
    source_kind: user_provided
    model_input_format: initial.aqu
  - name: initial channel water organic/mineral constituent concentrations
    unit: mg/L
    category: channel-constituents
    source_kind: user_provided
    model_input_format: om_water.ini
    notes: Bundled defaults (orgn=90, no3=70 mg/L) are placeholder values; they create massive stored
      channel mass that dominates HRU loads unless zeroed.
  - name: initial surface residue and plant biomass / heat-unit accumulators
    unit: kg/ha, heat units
    category: plant-residue
    source_kind: default
    model_input_format: plant_all_init, structure_init at startup; nyskip warmup years recommended (2-3,
      5 for arid)
  - name: initial snow water equivalent per HRU
    unit: mm H2O
    category: snow
    source_kind: default
    model_input_format: Initialized to zero unless snow.sno provides override
  boundary_conditions:
  - name: PET method selector
    unit: enum (0=Priestley-Taylor, 1=Penman-Monteith, 2=Hargreaves)
    category: method-switch
    source_kind: user_provided
    model_input_format: basin code (bsn_cc%pet)
  - name: surface runoff method selector
    unit: enum (0=SCS Curve Number, 1=Green-Ampt)
    category: method-switch
    source_kind: user_provided
    model_input_format: basin code (bsn_cc%cn)
  - name: channel routing method selector
    unit: enum (0=variable storage, 1=Muskingum)
    category: method-switch
    source_kind: user_provided
    model_input_format: basin code (bsn_cc%rte)
  - name: carbon cycle selector
    unit: enum (0=static, 1=CENTURY/Zhang2, 2=Kemanian)
    category: method-switch
    source_kind: user_provided
    model_input_format: basin code (bsn_cc%cswat)
    notes: Switches between three mutually-exclusive residue/N mineralization chains sharing soil carbon
      pools.
  - name: in-stream water quality toggle
    unit: enum (0=off, 1=QUAL2E)
    category: method-switch
    source_kind: user_provided
    model_input_format: basin code (bsn_cc%wq_cha)
    notes: Rev 59.3 QUAL2E solver is numerically unstable for flashy/extreme flows; recommended OFF (use
      HRU-level loads).
  - name: groundwater module selector
    unit: enum (0=lumped aquifer, 1=gwflow 2-D grid)
    category: method-switch
    source_kind: user_provided
    model_input_format: basin code (bsn_cc%gwflow)
  - name: land-use management schedule (plant, fert, irrigate, tillage, harvest, kill, graze, burn)
    unit: operations indexed by date or heat-unit fraction
    category: management
    source_kind: user_provided
    model_input_format: management.sch driven by landuse.lum links; decision tables in lum.dtl for condition-triggered
      actions
  - name: fertilizer application schedule and product
    unit: kg N/ha, kg P/ha
    category: management
    source_kind: user_provided
    model_input_format: management.sch operations referencing fertilizer.frt entries (elem_n, elem_p,
      28-0-0, beef_fr, dairy_fr, poultry)
  - name: irrigation source, amount, and trigger
    unit: mm, source object id
    category: management
    source_kind: user_provided
    model_input_format: irr.ops / decision tables; can withdraw from channel, reservoir, aquifer, or external
      source via wallo
  - name: spatial connectivity (HRU -> LSU -> channel -> aquifer -> reservoir chain)
    unit: object id graph
    category: watershed-topology
    source_kind: user_provided
    model_input_format: hru.con, chandeg.con, aquifer.con, reservoir.con, recall.con + rout_unit.con
  - name: weather station to spatial object mapping
    unit: station id per HRU/channel
    category: watershed-topology
    source_kind: user_provided
    model_input_format: weather-sta.cli (nearest-station assignment by centroid)
  - name: weather generator monthly statistics per station
    unit: 12 monthly rows of climate statistics
    category: watershed-topology
    source_kind: user_provided
    model_input_format: wgn.wgn (read at initialization even when daily data are complete)
  - name: simulation calendar (start/end day, year)
    unit: Julian day, year
    category: simulation-control
    source_kind: user_provided
    model_input_format: time.sim
  - name: runtime parameter overrides
    unit: cal_parm name + chg_typ (absval | abschg | pctchg) + value + spatial condition
    category: calibration
    source_kind: calibrated
    model_input_format: calibration.cal
    notes: Misspelled parameter names are silently ignored; absval on cn2/awc destroys spatial heterogeneity;
      structural defaults in hydrology.hyd cannot be overridden here.
outputs:
  primary:
  - name: streamflow at channel outlet (flo_out)
    unit: m3/s (after conversion from ha-m/day)
    description: Daily channel discharge leaving each routed segment; primary calibration target for hydrology.
    validation_rank: 1
    emitted_in: channel_sd_day.txt / channel_sd_mon.txt / channel_sd_yr.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - SWAT+ emits flo_out in ha-m/day; downstream consumers must convert to m3/s before comparison.
        - Exclude warmup years (nyskip) from any goodness-of-fit calculation.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Annual or basin-aggregate gauge series carry abstraction/management trends not in the forcing;
          detrend before comparison.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: basin water balance components (precip, snofall, snomlt, surq_gen, latq, perc, et, qtile, wateryld,
      sw_final)
    unit: mm/day or mm/yr
    description: Closed water-balance accounting at the basin level.
    validation_rank: 3
    emitted_in: basin_wb_day.txt / basin_wb_mon.txt / basin_wb_yr.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - magnitude_accuracy
        - trend_match
        determining_metric: pbias
        caveats:
        - ET and recharge observations at basin scale are typically remote-sensing or reanalysis products
          with their own bias structure.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Spatial comparison meaningful only when HRU output (hru_wb) is mapped back to a grid; basin_wb
          is a scalar series.
      detrending_options:
      - none
      - linear_residual
  - name: 'HRU water balance (hru_wb: per-HRU surq, latq, perc, et, sw)'
    unit: mm/yr (typical)
    description: Yearly per-HRU water balance components; daily writing produces multi-GB files for large
      basins.
    validation_rank: 4
    emitted_in: hru_wb_yr.txt / hru_wb_aa.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - HRU geometry is irregular; remap to grid for raster comparison.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats: []
      detrending_options:
      - none
  - name: 'basin landscape nutrient losses (basin_ls: sedorgn, surqno3, sedmin)'
    unit: kgN/ha/day or kgN/ha/yr; kgP/ha/yr
    description: Landscape-level (pre-channel) nutrient losses from HRUs; reliable alternative to in-channel
      nutrient outputs when QUAL2E is unstable.
    validation_rank: 7
    emitted_in: basin_ls_day.txt / basin_ls_yr.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - magnitude_accuracy
        - trend_match
        determining_metric: pbias
        caveats:
        - Landscape losses differ from in-stream loads by channel processing; pair with HRU export coefficients
          when possible.
      detrending_options:
      - none
      - linear_residual
  - name: 'basin nutrient balance (basin_nb: fertn, denit, act_nit_n, plant uptake)'
    unit: kgN/ha/yr
    description: Closed nutrient-balance accounting per basin per year.
    validation_rank: 8
    emitted_in: basin_nb_yr.txt / basin_nb_day.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Inventory-based reference loads have wide uncertainty; PBIAS is the only defensible metric in
          most basins.
      detrending_options:
      - none
  - name: channel nutrient loads (orgn_out, no3_out, sedp_out, solp_out)
    unit: kg/day
    description: In-stream nutrient mass fluxes routed by QUAL2E.
    validation_rank: 9
    emitted_in: channel_sd_day.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Rev 59.3 QUAL2E solver is numerically unstable at extreme flows (>10x bankfull); values can
          blow up to physically impossible magnitudes (>1e9 mg/L). Use basin_ls and basin_nb for nutrient
          loads instead.
        - Compare only when wq_cha=1 and the basin is non-flashy; otherwise treat as not observable.
      detrending_options:
      - none
  - name: sediment yield (HRU sedyld; channel sed_in/sed_out)
    unit: t/ha; t
    description: MUSLE-based HRU sediment yield and routed channel sediment load.
    validation_rank: 10
    emitted_in: basin_ls_day.txt, channel_sd_day.txt, channel_sdmorph_yr.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Gauged sediment series are typically sparse and rating-curve-derived; agreement weaker than
          streamflow.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
  - name: crop yield (basin yield_yr / yield_aa, hru_pw)
    unit: t/ha
    description: Per-crop yield at harvest, aggregated to basin or kept per-HRU.
    validation_rank: 11
    emitted_in: yield_yr.txt / yield_aa.txt / hru_pw_yr.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/provincial yield series carry strong technology trends not represented by a weather-driven
          process model; detrending is required.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Yield aggregated to admin unit; per-HRU comparison requires zonal stats.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Single-site experimental yield series; detrending typically not needed if site management is
          stable across years.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-year, single-site trial; HRU containing the trial site must be identified and management
          aligned.
      - obs_shape: regional_aggregate_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Admin-unit average for a single year; only meaningful when basin coverage of the admin unit
          is high.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        - trend_match
        determining_metric: pbias
        caveats:
        - Remote-sensed yield surrogates (e.g., crop-yield-from-VI products) at coarser grain than HRU;
          aggregate to pixel before comparison; detrending recommended.
      detrending_options:
      - linear_residual
      - decadal_mean
  - name: aquifer state (storage, water-table depth, baseflow flo)
    unit: mm, m, mm
    description: Per-aquifer storage and baseflow; gwflow grid-cell head when gwflow=1.
    validation_rank: 6
    emitted_in: aquifer_day.txt / aquifer_yr.txt / gwflow output files
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Lumped aquifer (aqu_1d) has one storage per aquifer object; point-well comparison only meaningful
          under gwflow=1.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Only meaningful under gwflow=1 distributed module.
      detrending_options:
      - none
      - linear_residual
  - name: snow water equivalent (hru%sno_mm; snofall, snomlt fluxes)
    unit: mm H2O
    description: Snowpack water equivalent per HRU and daily snowfall/melt fluxes.
    validation_rank: 5
    emitted_in: hru_wb_day.txt, basin_wb_day.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: csi
        caveats:
        - Remote-sensing SWE products coarser than HRU; aggregate HRU output to pixel before comparison.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Peak SWE depth and ablation rate are the magnitude targets; snow-pillow / snow-course stations
          are the typical reference.
      detrending_options:
      - none
  - name: evapotranspiration (basin et, eplant, esoil, pet)
    unit: mm/day
    description: Actual ET partitioned into plant transpiration and bare-soil evaporation, plus PET.
    validation_rank: 2
    emitted_in: basin_wb_day.txt, hru_wb_day.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Remote-sensing ET (e.g., 8-day) requires temporal aggregation.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - magnitude_accuracy
        - trend_match
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
      - linear_residual
  secondary: []
known_issues:
- id: dt_001
  symptom: SWAT+ crashes immediately at startup with a Fortran 'file not found' or 'cannot open file'
    error. The binary exits with a non-zero code within the first second of execution.
  diagnosis: A file listed in file.cio does not exist in the TxtInOut directory.; file.cio lists all required
    input files by category. SWAT+ opens every referenced file at initialization. If any file is missing,
    the Fortran OPEN statement fails and the program stops. This commonly happens when optional files
    are
  remedy: 'Run validate_txtinout to identify the missing file(s). Either create the file or replace the
    reference with ''null'' in file.cio.; validate_txtinout; [''Parse file.cio and list all referenced
    filenames'', ''Check each filename exists in TxtInOut: ls TxtInOut/<filename>'', "For missing files:
    replace filen'
  severity: fatal
- id: dt_002
  symptom: SWAT+ crashes during initialization when reading weather files. Error message references weather
    file parsing or unexpected data format. May also manifest as NaN values in output.
  diagnosis: 'Weather input files (.pcp, .tmp, .slr, .hmd, .wnd) have wrong number of header lines or
    incorrect column format.; SWAT+ expects exactly 3 header lines in each weather file: (1) title, (2)
    column headers, (3) station metadata (nbyr, tstep, lat, lon, elev). Data starts on line 4. If header
    lines are m'
  remedy: 'Verify each weather file has exactly 3 header lines. Check for tabs (replace with spaces).
    Validate column count matches expected format.; validate_weather_data; [''head -5 TxtInOut/<station>.pcp
    — line 4 should be first data row'', ''Check for tab characters: cat -A TxtInOut/<station>.pcp | head
    -5'', '
  severity: fatal
- id: dt_003
  symptom: SWAT+ runs to completion but ET is unreasonably high or low, snowmelt timing is wrong, or hydrograph
    shape does not match observations. No error messages.
  diagnosis: Temperature file has Tmax < Tmin for some or all days, or temperature is in wrong units (K
    vs C).; SWAT+ does not validate that Tmax >= Tmin. If they are swapped, the model computes negative
    temperature range, which produces wrong PET (Hargreaves method uses Tmax-Tmin), wrong snowmelt (depends
    on me
  remedy: 'Validate all .tmp files: check Tmax >= Tmin for every row. If mean temperature > 200, data
    is likely in Kelvin — subtract 273.15.; validate_weather_data; [''python -c "import pandas as pd;
    df=pd.read_csv(\''station.tmp\'', skiprows=3, delim_whitespace=True, names=[\''yr\'',\''jday\'',\''tmax\'',\''tmin\'']);
    p'
  severity: silent
- id: dt_004
  symptom: Simulated water yield or nutrient loads are significantly biased compared to observations,
    despite reasonable weather and soil inputs. Model runs without errors.
  diagnosis: 'HRU thresholds are too aggressive (>20%), removing significant land use or soil types and
    biasing the basin-average properties.; When HRU thresholds eliminate land uses that occupy <20% of
    a subbasin, the redistributed area changes the effective land use distribution. Agricultural land
    (often small '
  remedy: 'Reduce HRU thresholds to 5-10% for land use and soil, 10-20% for slope. For water quality studies,
    use 0% threshold (all HRUs).; apply_hru_threshold; [''Compare land use distribution before and after
    threshold: does any land use type lose >50% of its original area?'', ''Regenerate HRUs with lower
    thres'
  severity: silent
- id: dt_005
  symptom: SWAT+ crashes during simulation with a segmentation fault, Fortran runtime error 'Index N is
    out of bounds', or 'STOP' message with a line reference.
  diagnosis: Array dimensions in compiled binary are too small for the number of HRUs, subbasins, channels,
