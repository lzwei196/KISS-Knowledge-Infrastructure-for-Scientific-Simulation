- id: dt_015
  symptom: Floating point exception in soil hydraulic calculations.
  diagnosis: Van Genuchten n parameter less than 1.0; The Van Genuchten model requires n > 1. The m parameter
    is computed as m = 1 - 1/n. If n <= 1, m is non-positive, causing division by zero or undefined behavior.;
    ['water.balance', 'pedo.funct']
  remedy: 'Ensure n > 1.0 for all soil layers; convert_soil.py; [''Check n column in soilXXXX.txt'', ''Typical
    range: 1.1 to 3.0'', ''If n = 1.0 or less, use a minimum of 1.05'']; convert_soil.py enforces n >
    1.0'
