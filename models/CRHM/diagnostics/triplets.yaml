- id: dt_020
  stage: s2_observation_data
  failure_domain: parameter_format
  symptom:
    description: 'CRHM crashes with ''Observation: u, not in Data file'' despite u being in header'
    error_pattern: not in Data file
    detection_method: error_message
  diagnosis:
    root_cause: .obs file has 2 description lines instead of 1
    explanation: 'CRHM .obs format expects EXACTLY 1 description line, then variable declarations.
      The forcing converter wrote 2 description lines. CRHM parsed the second description line as
      a variable declaration, shifting all subsequent variable names. When it looked for ''u'' (wind),
      it found a shifted/wrong variable name. The resulting SIGSEGV is from accessing invalid data.
      Discovered by comparing with working Belly River .obs.

