validation:
  - dag_variable: "analysis ensemble mean (posterior state)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched DART validation paper gives a universal NSE pass tier; DART point-series validation is usually reported as posterior-vs-prior RMSE, bias, correlation, and consistency with independent or withheld observations."
        cites: []
      - metric: rmse
        direction: minimize
        unit: host-model state units
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "RMSE is central, but acceptable magnitude is variable-specific and observation-error-specific; no model-wide DART numeric RMSE threshold was fetched."
        cites: []
      - metric: bias
        direction: zero_centered
        unit: host-model state units
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Near-zero bias is required qualitatively; no universal host-model-unit tolerance is reported in the fetched DART benchmark set."
        cites: []
    secondary_metrics:
      - metric: prior_to_posterior_rmse_reduction
        direction: maximize
        status: supportive
        ceiling_reason: "DART studies judge the analysis mean by whether posterior/analysis departures are smaller than prior/background departures against observations."
        cites: [arellano2007, karspeck2018, raeder2012]
      - metric: independent_observation_skill
        direction: maximize
        status: supportive
        ceiling_reason: "Independent or withheld observations are preferred because assimilated observations can otherwise make validation circular."
        cites: [rubin2016, arellano2007]
    validated_when: "After spinup, compare the posterior ensemble mean to withheld or independent observations in the host-model units; posterior RMSE and bias should improve over prior/open-loop skill and be interpreted against observation error, but no universal NSE/RMSE/bias pass band is available."
    evidence_strength: moderate
    confidence: 0.4
    notes: >-
      The dag's NSE headline is retained, but the DART literature mainly reports RMSE, bias, correlation,
      and prior-to-posterior improvement. Arellano 2007 reports that predicted variables improved in
      "RMSEs and bias"; Karspeck 2018 states updated analyses allow error reductions to be monitored;
      Rubin 2016 validates posterior AOT against AERONET observations that were not assimilated.

  - dag_variable: "analysis ensemble mean (posterior state)"
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched DART paper gives a general CSI threshold; CSI is only appropriate after converting a continuous field to a thresholded event or extent."
        cites: []
      - metric: rmse
        direction: minimize
        unit: host-model state units
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Continuous gridded DART fields are benchmarked by RMSE against raw observations, reanalyses, or gridded products; acceptable magnitude remains variable- and product-specific."
        cites: []
      - metric: spatial_correlation
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Spatial or anomaly correlation is reported as pattern evidence, but the fetched DART papers do not define a universal pass tier."
        cites: []
    secondary_metrics:
      - metric: benchmark_comparison
        direction: maximize
        status: supportive
        ceiling_reason: "For continuous spatial fields, DART/CESM papers use comparison with established reanalyses or observation products rather than event-contingency CSI."
        cites: [karspeck2018, raeder2012, anderson2009dart]
      - metric: no_assim_or_control_improvement
        direction: maximize
        status: supportive
        ceiling_reason: "Spatial analyses are judged by improvement over a no-assimilation/control simulation and by agreement with observations or reanalysis products."
        cites: [karspeck2018, ling2019]
    validated_when: "For continuous host-model fields, use RMSE/bias/correlation or Taylor-style pattern metrics against independent gridded observations or established reanalyses, plus improvement over a no-assimilation/control run. Treat CSI as unresolved unless the run defines a thresholded event and fetches an event-verification convention."
    evidence_strength: moderate
    confidence: 0.35
    notes: >-
      The dag's CSI metric is not a standard DART-wide field-validation gate in the fetched literature.
      Karspeck 2018 uses "multiple lines of evidence" and compares CESM/DART to reanalyses and raw
      observations; Ling 2019 evaluates gridded LAI with RMSE, relative bias, innovations, and residuals.

  - dag_variable: "analysis ensemble spread (posterior sd)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "The spread-skill target is qualitative spread/RMSE consistency, not a fetched universal percent-bias tolerance."
        cites: []
      - metric: spread_error_ratio
        direction: zero_centered
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Ideal reliability centers spread/RMSE near 1, but the fetched literature does not specify a universal absolute tolerance around 1."
        cites: []
    secondary_metrics:
      - metric: rank_histogram_uniformity
        direction: maximize
        status: supportive
        ceiling_reason: "Rank histograms are used with spread-error diagnostics to assess ensemble reliability and distinguish underdispersion, overdispersion, and bias."
        cites: [hamill2001, grimit2007, rubin2016]
      - metric: correct_average_spread
        direction: minimize
        status: supportive
        ceiling_reason: "The field compares RMSE with the square root of average ensemble variance; using average standard deviation can falsely diagnose underdispersion."
        cites: [fortin2014]
    validated_when: "Compare posterior ensemble spread with RMSE of the ensemble mean after spinup; a reliable ensemble has spread comparable to RMSE, stable regional spread, and rank histograms consistent with the observations. No universal percent tolerance is available."
    evidence_strength: moderate
    confidence: 0.4
    notes: >-
      Fortin 2014 says reliability assessment commonly compares ensemble-mean RMSE to average ensemble
      spread and warns about the computation. Rubin 2016 calls small RMSE comparable to total spread a
      benchmark of a good ensemble system. Hamill 2001 cautions that rank histograms are necessary but
      not sufficient, so this block is supportive and non-numeric.

  - dag_variable: "observation-space innovations and QC (obs_seq.final)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched DART observation-space diagnostic paper gives an NSE pass tier; innovations are normally judged by RMSE, bias, prior-to-posterior reduction, residuals, and QC behavior."
        cites: []
      - metric: rmse
        direction: minimize
        unit: observation units
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Observation-space RMSE is variable- and observation-error-specific; no universal DART threshold was fetched."
        cites: []
      - metric: bias
        direction: zero_centered
        unit: observation units
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Bias should be near zero or physically explained, but no universal observation-unit tolerance was fetched."
        cites: []
    secondary_metrics:
      - metric: residual_smaller_than_innovation
        direction: maximize
        status: supportive
        ceiling_reason: "Observation-minus-analysis residuals should be smaller than observation-minus-background innovations when the assimilation is working."
        cites: [ling2019, waller2016, arellano2007]
      - metric: qc_rejection_fraction
        direction: minimize
        status: supportive
        ceiling_reason: "Unexpectedly different observations should be rejected by QC, but persistent or unstable rejection indicates model, operator, or observation-error problems."
        cites: [raeder2012, rubin2016]
    validated_when: "Filter DART missing sentinels before statistics; compare observation-minus-background and observation-minus-analysis departures, RMSE, bias, total spread, observation counts, and QC flags. Posterior residuals should be smaller than innovations and QC rejection should be stable and physically explainable, but no NSE pass band is available."
    evidence_strength: moderate
    confidence: 0.4
    notes: >-
      Ling 2019 states that small residuals compared with innovations indicate a working LDAS; Waller
      2016 grounds observation-minus-background and observation-minus-analysis residual diagnostics.
      Raeder 2012 describes DART QC discarding observations unexpectedly different from the ensemble.

  - dag_variable: "binned observation-space diagnostics (bias, rmse, totalspread)"
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched DART binned-diagnostics paper gives an NSE pass tier; regional bins are judged by RMSE, bias, total spread, and counts against observations."
        cites: []
      - metric: rmse
        direction: minimize
        unit: observation units
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Regional aggregate RMSE is observation-type-specific; no universal DART pass threshold was fetched."
        cites: []
      - metric: totalspread_rmse_ratio
        direction: zero_centered
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Total spread should be comparable to RMSE, but no universal numeric tolerance around equality was fetched."
        cites: []
    secondary_metrics:
      - metric: regional_spread_rmse_consistency
        direction: maximize
        status: supportive
        ceiling_reason: "DART and ensemble-forecast literature use binned RMSE, bias, spread, and observation counts to diagnose regional reliability."
        cites: [rubin2016, raeder2012, fortin2014]
      - metric: posterior_error_reduction
        direction: maximize
        status: supportive
        ceiling_reason: "Binned observation-space diagnostics compare prior/background and posterior/analysis departures so error reductions can be monitored through time and region."
        cites: [karspeck2018, arellano2007]
    validated_when: "Aggregate only valid observations after spinup; regional bins should show posterior RMSE and bias no worse than prior/background, total spread comparable to RMSE, adequate counts, and stable QC. No universal NSE/RMSE/total-spread numeric pass band is available."
    evidence_strength: moderate
    confidence: 0.4
    notes: >-
      Rubin 2016 explicitly evaluates regions with RMSE, bias, ensemble/total spread, assimilated counts,
      and rank histograms. Raeder 2012 explains total spread as the expected model-mean/observation
      difference. Karspeck 2018 uses observation-space diagnostics to monitor assimilation error reduction.

