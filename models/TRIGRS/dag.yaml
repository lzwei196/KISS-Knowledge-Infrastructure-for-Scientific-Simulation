safety:
  hazards:
    - id: "rainfall_intensity_unit_high"
      kind: "weather_file_semantic"
      description: "Rainfall intensity entered in mm/hr instead of m/s (3.6e6x too high) saturates the whole domain in the first timestep, Fs<1 everywhere."
      severity: "silent"
    - id: "rainfall_intensity_unit_low"
      kind: "weather_file_semantic"
      description: "Rainfall intensity in m/hr or m/day instead of m/s (3600x/86400x too low) yields no transient response; Fs frozen at initial values."
      severity: "silent"
    - id: "time_unit_hours_not_seconds"
      kind: "control_semantic"
      description: "Storm duration t and period boundaries capt entered in hours instead of seconds; storm effectively lasts seconds with negligible infiltration."
      severity: "silent"
    - id: "cohesion_unit_kpa_not_pa"
      kind: "soil_semantic"
      description: "Cohesion entered in kPa instead of Pa (1000x too high) produces unrealistically high Fs (>100) and masks all instability."
      severity: "silent"
    - id: "unit_weight_kn_not_n"
      kind: "soil_semantic"
      description: "Unit weight of water/soil in kN/m^3 instead of N/m^3 (1000x too small) systematically distorts Fs."
      severity: "silent"
    - id: "ksat_unit_cmhr_not_ms"
      kind: "soil_semantic"
      description: "Saturated hydraulic conductivity in cm/hr instead of m/s gives wrong infiltration timing / instant drainage."
      severity: "silent"
    - id: "slope_radians_not_degrees"
      kind: "soil_semantic"
      description: "Slope grid supplied in radians (or percent) instead of degrees underestimates driving force; Fs clusters near 1.0 with no spatial variation."
      severity: "silent"
    - id: "grid_incongruence_crash"
      kind: "parser_semantic"
      description: "Input grids with mismatched ncols/nrows/origin/cellsize or nodata locations cause array-bounds error or segmentation fault."
      severity: "fatal"
    - id: "nodata_inconsistent"
      kind: "parser_semantic"
      description: "NODATA_value not -9999 or inconsistent across grids yields spurious -9999 Fs or computed nodata cells."
      severity: "silent"
    - id: "rainfall_grid_origin_mismatch"
      kind: "parser_semantic"
      description: "Rainfall grid origin (xllcorner/yllcorner) differs from the DEM, so rain is applied to the wrong cells."
      severity: "silent"
    - id: "alpha_sign_silent_saturated_fallback"
      kind: "coefficient_runtime_silent_fallback"
      description: "Negative Gardner alpha silently forces the saturated infiltration model when the unsaturated model was intended."
      severity: "silent"
    - id: "mmax_sign_wrong_depth_model"
      kind: "control_semantic"
      description: "Positive mmax (infinite-depth) for shallow soils on bedrock prevents pore-pressure decay (infinite drainage); finite-depth model (negative mmax) is needed."
      severity: "silent"
    - id: "background_flux_off_overdrying"
      kind: "control_semantic"
      description: "Background flux option off (bkgrof=F) drives pore pressures below steady-state during dry periods of multi-period runs."
      severity: "silent"
    - id: "theta_ordering_invalid"
      kind: "soil_semantic"
      description: "theta_s not strictly greater than theta_r>0 causes crash/NaN or a silent saturated fallback in the unsaturated model."
      severity: "fatal_or_silent"
    - id: "series_nonconvergence_slow"
      kind: "numerical_instability"
      description: "Saturated finite-depth error-function series converges poorly for certain D0/zmax/t combinations, giving very slow runs; non-convergent cells flagged in TRnon_convrg_* grids."
      severity: "degraded"
    - id: "flat_cell_fs_infinity"
      kind: "control_semantic"
      description: "Flat cells (slope ~0) give Fs->infinity (mathematically correct) but mask other failure modes; can be misread as unconditionally safe."
      severity: "silent"
    - id: "zmin_zero_surface_artifact"
      kind: "control_semantic"
      description: "zmin=0 with a shallow wetting front places the minimum-Fs depth at the surface (z=0) for all cells, a surface artifact; set zmin>0."
      severity: "silent"
  validation_limits:
    - "Strictly 1-D vertical per-cell flow; pore-pressure estimates err once lateral inter-cell flow responds."
    - "Not recommended for slopes steeper than 60 degrees; for ~50-60 degrees eq. 18 can predict Fs increasing with steepening at constant depth, and the 1-D infiltration assumption breaks down above 60-70 degrees."
    - "Infinite-slope assumption only; tends to compute lower Fs than rigorous methods where failures are non-planar; most accurate for shallow, planar, smooth, uniform-mantle slopes."
    - "No evapotranspiration; not suitable for long-term alternating rainfall/ET cycles, only storm events of hours to a few days."
    - "Runoff routing is instantaneous and cannot estimate stream flow."
    - "Very sensitive to initial conditions (steady seepage and initial water-table depth); without accurate initial conditions results are limited to hypothetical scenarios."
  warnings:
    - "Fs is the minimum over all depths and timesteps per cell; values are clamped to a maximum of 10 (cells below slomin assigned 11), and shallow (z<=1 cm) cells are forced to the maximum, masking near-surface instability."
    - "Very low-slope cells produce very high Fs (>>10) that is not a real instability signal; set slomin (5-10 degrees) to exclude flat areas."
    - "Fs=-9999 denotes nodata / outside domain; failure threshold is Fs=1.0."
    - "Profile/list output (TRlist_z_p_fs) can become very large with many timesteps and vertical increments; reserve for small calibration test grids."
  assumptions:
    - statement: "Flow is 1-D vertical in homogeneous, isotropic soil with approximately constant hydraulic diffusivity (Darcy's law in the linear range)."
      scope: "infiltration and pore-pressure solvers"
      source: "USGS Open-File Report 2008-1159, Theoretical Basis (Iverson 2000 linearized Richards solution)"
      status: "adopted"
    - statement: "Soil-water characteristic curves are approximated by the Gardner (1958) exponential function; the magnitude of resulting errors is not evaluated."
      scope: "unsaturated infiltration model"
      source: "USGS Open-File Report 2008-1159, Theoretical Basis (Srivastava & Yeh 1991 + Gardner 1958)"
      status: "adopted"
    - statement: "Slope stability is evaluated with the infinite-slope model (uniform slope, thickness and properties; planar failure parallel to the surface; pore pressure a function only of depth and time)."
      scope: "factor-of-safety computation"
      source: "USGS Open-File Report 2008-1159, Slope Stability (Taylor 1948, eq. 18)"
      status: "adopted"
    - statement: "Pressure head under downward gravity-driven flow cannot exceed Z*beta and is reduced to that cap; beta is selected by the flowdir option (general / slope-parallel cos^2 delta / hydrostatic beta=1)."
      scope: "steady pressure-head baseline"
      source: "USGS Open-File Report 2008-1159, eq. 3A"
      status: "adopted"
    - statement: "The sign conventions are load-bearing structural switches: negative input scalars select the corresponding grid file, negative alpha selects the saturated model, and the sign of mmax selects finite- vs infinite-depth infiltration."
      scope: "model-form / input selection"
      source: "ivestp.f95 and trini.f95 source behavior with USGS OFR 2008-1159 Table 3"
      status: "adopted"
    - statement: "Cells are unchanged by failures during a simulation (soil thickness/properties not modified when Fs<1); the model does not forecast post-failure conditions."
      scope: "temporal evolution of the slope"
      source: "USGS Open-File Report 2008-1159, Limitations"
      status: "adopted"

medium_evidence:
  - var: "minimum_factor_of_safety"
    source: "dag.yaml"
    quote: "Transient rainfall infiltration via 1-D vertical analytical flow, one independent soil column per grid cell"
    note: "boundary.scope_in declares the model domain as independent soil columns; this output is the minimum factor of safety across depths in each soil column."
  - var: "actual_infiltration_rate"
    source: "dag.yaml"
    quote: "Transient rainfall infiltration via 1-D vertical analytical flow, one independent soil column per grid cell"
    note: "boundary.scope_in identifies the infiltration medium as the soil column for each grid cell."
