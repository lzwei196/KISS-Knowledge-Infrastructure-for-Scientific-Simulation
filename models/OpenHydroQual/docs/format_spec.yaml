# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: OpenHydroQual
  language: c++
  implementation:
    id: openhydroqual-204
    version: 2.0.4
    provenance: C++14; Aquifolium engine by Arash Massoudieh / EnviroInformatics, generic implicit block-link
      mass-balance + reactive-transport solver.
  scientific_reference_version: OpenHydroQual 2.0.4 (Aquifolium block-link mass-balance / reactive-transport
    engine; Massoudieh & Nguyen 2023, EMS)
inputs:
  forcing:
  - name: Temperature
    unit: Celsius
    category: climate
    source_kind: forcing
    model_input_format: CSV time series (col1 = time in days from simulation start, col2 = value)
    notes: Drives Penman ET and Arrhenius temperature correction of reaction rates.
  - name: Wind speed
    unit: m/s
    category: climate
    source_kind: forcing
    model_input_format: CSV time series (time-days, value)
    notes: Drives aeration and ET.
  - name: Solar radiation
    unit: W/m^2
    category: climate
    source_kind: forcing
    model_input_format: CSV time series (time-days, value)
    notes: Penman ET expects W/m^2 (not MJ/m^2/day).
  - name: Relative humidity
    unit: fraction (0-1)
    category: climate
    source_kind: forcing
    model_input_format: CSV time series (time-days, value)
    notes: Fraction, not percent; enters vapour-pressure-deficit term of Penman ET.
  - name: Inflow hydrograph
    unit: m^3/day
    category: hydrologic
    source_kind: forcing
    model_input_format: CSV time series (time-days, value) attached to a block as inflow boundary
    notes: Missing inflow file is silently treated as zero inflow.
  - name: Constituent loading
    unit: g/day
    category: mass_loading
    source_kind: forcing
    model_input_format: CSV time series (time-days, value) as external mass flow to a block
  parameters:
  - name: Manning roughness (ManningCoeff)
    unit: s/m^(1/3)
    category: hydraulic
    source_kind: calibrated
    model_input_format: .ohq link property value[unit]
    notes: On wide_channel / pipe links; controls flow velocity and depth. High sensitivity.
  - name: hydraulic_conductivity
    unit: m/day
    category: hydraulic
    source_kind: calibrated
    model_input_format: .ohq block/link property value[unit]
    notes: Darcy / groundwater / bed-sediment links; governs GW-SW exchange. High sensitivity.
  - name: Storage / alpha / beta / bottom_elevation / area / length / width / depth
    unit: m^3, m^2, m (per property)
    category: geometry
    source_kind: user_provided
    model_input_format: .ohq block/link geometric properties value[unit]
    notes: Define block control-volume geometry and stage-storage relations.
  - name: porosity / specific_yield
    unit: dimensionless (0-1)
    category: porous_media
    source_kind: calibrated
    model_input_format: .ohq block property value[unit]
    notes: Sediment/aquifer storage; low sensitivity. Fraction, not percent.
  - name: diffusion_coefficient
    unit: m^2/day
    category: transport
    source_kind: calibrated
    model_input_format: .ohq constituent property value[unit]
    notes: Constituent mixing between blocks; low sensitivity.
  - name: Reaction parameters (base_value, reference_temperature, Arrhenius_factor)
    unit: per parameter (e.g. mu_H 1/day, K_s g/m^3, Y_H gCOD/gCOD)
    category: reaction_kinetics
    source_kind: calibrated
    model_input_format: .ohq reaction_parameter declarations; rate_expression references them
    notes: 'ASM1-style example set: mu_H, K_s, K_o, mu_N, K_n, K_on, mu_dn, K_dn, b_H, Y_H. Each parameter
      carries base_value + temperature correction. base_value left at 0 silently disables the reaction.'
  - name: c_n_weight
    unit: dimensionless (0-1)
    category: numerical
    source_kind: default
    model_input_format: settings.json / .ohq solver setting
    notes: Crank-Nicholson weight; 1=implicit/stable-diffusive, 0=explicit/accurate-oscillatory. Default
      1. Low sensitivity to results but high impact on stability.
  initial_conditions:
  - name: Initial Storage / head / piezometric_head
    unit: m^3 / m
    category: hydraulic_state
    source_kind: user_provided
    model_input_format: .ohq block initial property value[unit]
    notes: Starting water level/volume per block.
  - name: Initial constituent concentration
    unit: g/m^3 (= mg/L)
    category: water_quality_state
    source_kind: user_provided
    model_input_format: .ohq constituent initial concentration value[unit]
    notes: Starting per-block species concentration (DOM, O2, NH3, NOx, ...).
  boundary_conditions:
  - name: fixed_head boundary
    unit: m (head)
    category: boundary_block
    source_kind: user_provided
    model_input_format: .ohq create block fixed_head with head + large dummy Storage
    notes: Acts as an infinite reservoir only if Storage is large (e.g. 100000 m^3); small Storage lets
      the head drift, silently violating the BC.
  - name: Atmospheric exchange / aeration source
    unit: g/m^3 (target saturation)
    category: atmospheric_exchange
    source_kind: user_provided
    model_input_format: .ohq create source (atmospheric exchange) referenced before dependent blocks
    notes: Maintains dissolved O2 toward saturation.
  - name: Solver control settings (nr_tolerance, minimum_timestep, initial_time_step, write_interval,
      simulation end time)
    unit: various (days, dimensionless, count)
    category: solver_control
    source_kind: user_provided
    model_input_format: settings.json / .ohq solver and simulation settings
    notes: Control HOW the run executes. write_interval larger than run length yields no output rows;
      end time defaults to 1 day if omitted.
outputs:
  primary:
  - name: constituent_concentration
    unit: g/m^3 (= mg/L)
    description: Per-block/per-link water-quality species concentration over time (e.g., O2, DOM, NH3,
      NOx).
    validation_rank: 1
    emitted_in: output.txt (column header 'block_name:variable_name')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare at the block/station representing the monitored location; concentrations in mg/L.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Grab-sample or effluent-event concentration at a single instant.
      detrending_options:
      - none
  - name: flow
    unit: m^3/day
    description: Hydraulic flow through links (channels, weirs, pipes, Darcy connections).
    validation_rank: 2
    emitted_in: output.txt (column header 'link_name:flow')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Gauge units typically m^3/s; convert (x86400) before comparing to the m^3/day output.
        - Peak-timing accuracy relevant for event hydrographs.
      detrending_options:
      - none
  - name: head_storage
    unit: m / m^3
    description: Per-block water level (head) and storage volume over time.
    validation_rank: 3
    emitted_in: output.txt (column header 'block_name:head' or ':Storage')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Water-table / stage observations at the block representing the monitored well or pond.
      detrending_options:
      - none
  - name: evapotranspiration
    unit: m^3/day (or mm/day over block area)
    description: Atmospheric water-loss flux computed by the Penman/simple ET source.
    validation_rank: 4
    emitted_in: output.txt (ET source / block water-balance term)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Convert volumetric flux to depth using block area before comparing to mm/day ET observations.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Model crashes immediately with no output or cryptic JSON parse error (Cannot open file|JSON
    parse error|template not found)
  diagnosis: Template path in .ohq file points to non-existent location; OHQ examples embed hardcoded
    developer absolute paths and binary resolves default template relative to its own location
  remedy: Replace template paths with local absolute paths (run_ohq.py --fix-paths)
  severity: fatal
- id: dt_002
  symptom: Model runs but produces empty output.txt (0 bytes)
  diagnosis: Working folder derivation via QFileInfo::canonicalPath() fails when input .ohq path is relative,
    so output and time-series inputs silently resolve to nowhere
  remedy: Use absolute paths for the input .ohq file and verify time-series files exist in its directory
  severity: fatal
- id: dt_003
  symptom: Values appear unreasonable (e.g., storage shows as 357.6 with no unit interpretation)
  diagnosis: Missing unit bracket notation [unit] on parameter values; bare value accepted in default
    units which may differ from intended (silent)
  remedy: Add unit brackets to all dimensional values using OHQ notation, e.g. [m~^3]
  severity: silent
- id: dt_004
  symptom: Some parameters in a create command are silently ignored
  diagnosis: 'Semicolon/comma delimiter confusion: semicolon separates command fields, comma separates
    key=value pairs; misuse drops subsequent parameters'
  remedy: Use semicolon only before type/name fields; use commas between properties
  severity: silent
- id: dt_005
  symptom: Flow rates or reactions are 86400x too fast or too slow
  diagnosis: Time units in seconds instead of days; OHQ uses days internally for all rates (1/day, m^3/day,
    m^2/day)
  remedy: Convert all rates to per-day before input (multiply per-second by 86400)
  severity: silent
- id: dt_006
  symptom: Concentrations are 1000x too high, reactions saturate immediately
  diagnosis: Concentration in mg/m^3 or ug/L instead of g/m^3 (=mg/L); Monod kinetics saturate at 1.0,
    hiding half-saturation effects
  remedy: Convert concentrations to g/m^3 (divide ug/L by 1000)
  severity: silent
- id: dt_007
  symptom: Boundary block water level changes during simulation (should be fixed)
  diagnosis: fixed_head block Storage value too small, so boundary depletes/fills and head drifts, violating
    boundary condition without error
  remedy: Set Storage >= 100000[m~^3] for fixed_head blocks
  severity: degraded
- id: dt_008
  symptom: Solution oscillates wildly or diverges to NaN (nan|inf|NaN)
  diagnosis: Crank-Nicholson weight too low (c_n_weight=0 or 0.3) with large initial_time_step violates
    explicit-scheme stability limit
  remedy: Set c_n_weight=1 (fully implicit) for unconditional stability; reduce initial_time_step
  severity: fatal
- id: dt_009
  symptom: Solver hangs indefinitely, CPU at 100% but no progress (timeout|stall)
  diagnosis: Newton-Raphson tolerance too tight (e.g. 1e-10) relative to minimum_timestep for a highly
    nonlinear system, so solver makes tiny per-step progress
  remedy: Relax nr_tolerance to 0.001, set minimum_timestep 1e-6, cap maximum_time_allowed
  severity: fatal
- id: dt_010
  symptom: Pond fills or drains unrealistically fast (hours instead of days)
  diagnosis: Inflow rate in m^3/s instead of m^3/day; SI flow is 86400x too high, producing physically
    impossible water levels without error
  remedy: Multiply m^3/s inflow values by 86400 to get m^3/day
  severity: silent
- id: dt_011
  symptom: Groundwater drains completely or water table drops to aquifer bottom
  diagnosis: Hydraulic conductivity in m/s instead of m/day; entering 8.64 m/day as m/s gives 746496 m/day
    (instant drainage), or entering 1e-4 m/s gives clay-like low K
  remedy: Convert Ksat to m/day (multiply m/s by 86400); sand ~1-10 m/day
  severity: silent
- id: dt_012
  symptom: Evapotranspiration values are ~11x too high or too low
  diagnosis: Solar radiation in MJ/m^2/day instead of W/m^2; Penman ET expects W/m^2, conversion factor
    11.57, so MJ values give ~11.6x too low ET
  remedy: Convert MJ/m^2/day to W/m^2 by multiplying by 11.57
  severity: silent
- id: dt_013
  symptom: Negative concentrations appear in output (concentration.*-[0-9])
  diagnosis: Numerical undershoot from explicit/semi-implicit integration (c_n_weight<1) with fast reactions;
    violates mass conservation and can cascade to NaN via log/sqrt
  remedy: Use c_n_weight=1 and reduce initial_time_step to 0.0001
  severity: degraded
- id: dt_014
  symptom: ET unrealistically high (>50 mm/day) or excessive water loss
  diagnosis: Relative humidity provided as percentage (0-100) instead of fraction (0-1); vapor pressure
    deficit becomes huge, grossly overestimating ET, no error
  remedy: Divide RH by 100 to convert % to fraction (typical 0.3-0.9)
  severity: silent
- id: dt_015
  symptom: Binary fails to start with shared library errors (libOHQLib.so/libQt6Core.so/libgsl.so not
    found)
  diagnosis: Missing runtime dependencies (libOHQLib, Qt6Core, GSL, LAPACK, BLAS, Armadillo) not in LD_LIBRARY_PATH,
    common when running from a different directory than the build folder
  remedy: Set LD_LIBRARY_PATH to include the build directory (or run ldconfig); verify with ldd
  severity: fatal
- id: dt_016
  symptom: Weir block type not found, model reports unknown type (type not found|unknown type weir)
  diagnosis: OHQ spells weir as 'wier' in main_components.json template; using standard 'weir' causes
    a type lookup failure
  remedy: Use 'wier' (OHQ spelling) instead of 'weir' in create link commands
  severity: fatal
- id: dt_017
  symptom: Reaction does not affect constituent concentrations
  diagnosis: Reaction parameter base_value left at placeholder 0; rate expression evaluates to zero so
    no reaction occurs while model runs normally
  remedy: Set non-zero base_value for all reaction parameters from literature (e.g. mu_H=6.0, K_s=20)
  severity: silent
- id: dt_018
  symptom: Diffusion appears too fast or too slow by factor of 86400
  diagnosis: Diffusion coefficient in m^2/s instead of m^2/day; literature m^2/s values used directly
    give negligible diffusion
  remedy: Multiply m^2/s values by 86400 to get m^2/day (OHQ range 0.0001-0.01)
  severity: silent
