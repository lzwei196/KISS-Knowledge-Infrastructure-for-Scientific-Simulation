template_version: "3.5"

identity:
  model_id: "SWMM"
  scientific_reference_version: "EPA SWMM 5 (Reference Manual Vol I Hydrology, EPA/600/R-15/162A rev. Jan 2016; engine line SWMM 5.2.x)"
  implementation:
    id: "pyswmm-swmm5"
    version: "SWMM 5.2.x engine (pyswmm 1.x/2.1 + swmm-toolkit bindings)"
    provenance: "C; EPA SWMM5 open-source engine (US EPA + CDM-Smith), driven through the pyswmm Python API which bundles the compiled engine."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c"
  license: "Public-Domain"
  repo_url: "https://github.com/USEPA/Stormwater-Management-Model"

boundary:
  scope_in:
    - "Rainfall-runoff generation from urban subcatchments (nonlinear-reservoir overland flow over pervious/impervious subareas)"
    - "Infiltration losses (Horton, Modified Horton, Green-Ampt, Curve Number)"
    - "Snow accumulation and melt; evaporation of standing surface water"
    - "Groundwater (two-zone aquifer) percolation and lateral interflow to the drainage network"
    - "Conveyance hydraulic routing through pipes, channels, storage units, pumps, and regulators (steady / kinematic-wave / dynamic-wave)"
    - "Low Impact Development (LID) green-infrastructure controls (bioretention, permeable pavement, green roof, rain barrel, infiltration trench, rain garden, rooftop disconnection, vegetative swale)"
    - "Rainfall-Dependent Inflow and Infiltration (RDII) via unit hydrographs"
    - "Water quality: pollutant buildup, washoff, treatment, and advective transport through the network"
    - "Urban flooding: node surcharging, flooding volumes, and surface ponding"
  scope_out:
    - "Watershed/basin-scale rural hydrology (delegated to land-surface models; SWMM operates at ~0.01-100 km2 urban scale)"
    - "Basin-scale river-channel routing (delegated to dedicated river-routing models; river stage enters only as an outfall boundary)"
    - "DEM-only topographic delineation without built-environment detail (subcatchments must reflect impervious surfaces, inlets, lot grading)"
    - "Closed surface energy budget (evaporation is a demand-side flux, not an energy-balance solve)"
  spatial: "distributed-stream"
  temporal: "sub-hourly"
  closure: "mass-balance"
  notes: "Mass-balance closure on water (and on pollutant mass when water quality is active) is the governing principle: surface runoff is a nonlinear-reservoir mass balance on ponded depth d (dd/dt = i - e - f - q), and node/link/groundwater balances are tracked as separate continuity errors (runoff, flow-routing, groundwater, quality). Separate runoff, routing, and reporting timesteps advance state as X_t = f(X_{t-1}, I_t, P). Mass closure is NOT guaranteed when ALLOW_PONDING=NO and a node floods, since flood water is then removed from the system as a sink."

inputs:
  forcing:
    - {category: "meteorology", name: "Precipitation (rainfall)", unit: "mm/hr (intensity) or mm/interval (volume), CMS; in/hr or in (CFS)", source_kind: "forcing", model_input_format: "[RAINGAGES] + [TIMESERIES] in INP; FORMAT INTENSITY|VOLUME|CUMULATIVE, held constant within a runoff timestep", notes: "FORMAT (INTENSITY vs VOLUME) must match the data encoding; an interval mismatch scales runoff by intervals-per-hour with no warning."}
    - {category: "meteorology", name: "Air temperature", unit: "deg C/F", source_kind: "forcing", model_input_format: "[TEMPERATURE] daily max-min or continuous series", notes: "Drives snowmelt partitioning and Hargreaves evaporation."}
    - {category: "meteorology", name: "Evaporation", unit: "mm/day (SI) or in/day (US)", source_kind: "forcing", model_input_format: "[EVAPORATION] time series (actual; pan x ~0.7) or Hargreaves from temperature", notes: "SWMM expects actual evaporation; Hargreaves needs a multi-day (7-day running) temperature average."}
    - {category: "meteorology", name: "Wind speed", unit: "km/hr (SI) or mph (US)", source_kind: "forcing", model_input_format: "[WIND] series", notes: "Refines snowmelt rate during rain-on-snow."}
  parameters:
    - {category: "subcatchment_geometry", name: "Area (A)", unit: "ha (CMS) / acre (CFS)", source_kind: "user_provided", model_input_format: "[SUBCATCHMENTS]"}
    - {category: "subcatchment_geometry", name: "Characteristic width (W)", unit: "m (CMS) / ft (CFS)", source_kind: "user_provided", model_input_format: "[SUBCATCHMENTS]", notes: "Implied overland flow length L = Area/Width; over-large W (e.g., sqrt(Area) shortcut) artificially peaks the hydrograph."}
    - {category: "subcatchment_geometry", name: "Slope (S)", unit: "ft/ft (dimensionless)", source_kind: "user_provided", model_input_format: "[SUBCATCHMENTS]"}
    - {category: "subcatchment_geometry", name: "Percent imperviousness", unit: "%", source_kind: "user_provided", model_input_format: "[SUBCATCHMENTS]"}
    - {category: "subcatchment_geometry", name: "% Zero-Imperv (impervious area with no depression storage)", unit: "%", source_kind: "user_provided", model_input_format: "[SUBAREAS]"}
    - {category: "surface_roughness", name: "Manning's n (pervious n_P, impervious n_I)", unit: "dimensionless", source_kind: "calibrated", model_input_format: "[SUBAREAS]", notes: "No range check; a dropped/added zero shifts velocity 10-13x. Typical range [0.005, 0.100]."}
    - {category: "surface_storage", name: "Depression storage (pervious S-perv, impervious S-imperv)", unit: "mm (CMS) / in (CFS)", source_kind: "calibrated", model_input_format: "[SUBAREAS]"}
    - {category: "infiltration", name: "Infiltration parameters", unit: "rates mm/hr; decay /hr; suction mm", source_kind: "calibrated", model_input_format: "[INFILTRATION]: Horton (MaxRate,MinRate,Decay,DryTime,MaxInfil), Green-Ampt (Suction,Ksat,IMD), or SCS CN", notes: "Column layout MUST match the method in [OPTIONS] INFILTRATION; mismatch silently misreads columns."}
    - {category: "groundwater", name: "Aquifer parameters (up to 14 per subcatchment)", unit: "mixed", source_kind: "calibrated", model_input_format: "[AQUIFERS]/[GROUNDWATER]", notes: "Only required when groundwater is modeled."}
    - {category: "network_geometry", name: "Node attributes (invert elev, max depth, surcharge depth, ponded area Aponded)", unit: "m (CMS) / ft (CFS); Aponded m2", source_kind: "user_provided", model_input_format: "[JUNCTIONS], [STORAGE]"}
    - {category: "network_geometry", name: "Conduit attributes (length, Manning roughness, inlet/outlet offsets, cross-section)", unit: "m (CMS) / ft (CFS)", source_kind: "user_provided", model_input_format: "[CONDUITS] + [XSECTIONS]", notes: "Length=0 (coincident nodes) causes division-by-zero/NaN."}
    - {category: "lid", name: "LID layer properties (Surface/Soil/Pavement/Storage/Drain)", unit: "thicknesses mm; porosity/FC/WP fractions; conductivity mm/hr", source_kind: "calibrated", model_input_format: "[LID_CONTROLS]", notes: "Soil layer must satisfy Wilting Point < Field Capacity < Porosity; SWMM does not validate this."}
    - {category: "water_quality", name: "Pollutant buildup/washoff and treatment coefficients", unit: "mixed (mass, mass/volume)", source_kind: "calibrated", model_input_format: "[POLLUTANTS], [BUILDUP], [WASHOFF], [LANDUSES], [TREATMENT]"}
  initial_conditions:
    - {category: "runoff", name: "Ponded runoff depth d", unit: "mm", source_kind: "default", model_input_format: "initialized to 0"}
    - {category: "infiltration", name: "Infiltration sub-states / antecedent dry time", unit: "mixed", source_kind: "default", model_input_format: "Horton DryTime / soil moisture storage S", notes: "Most infiltration sub-states (t_p, F_e, Fu, T, P) start at 0; soil moisture storage S is user-supplied."}
    - {category: "snowmelt", name: "Snow pack initial state (w_snow, fw, ati)", unit: "mm water equivalent; deg", source_kind: "user_provided", model_input_format: "[SNOWPACKS] initial conditions"}
    - {category: "groundwater", name: "Initial unsaturated moisture theta_u and saturated depth d_L", unit: "fraction; m", source_kind: "user_provided", model_input_format: "[GROUNDWATER] initial values"}
    - {category: "network", name: "Node initial depth / link initial flow", unit: "m (CMS); m3/s (CMS)", source_kind: "user_provided", model_input_format: "[JUNCTIONS] Init_Depth (usually 0); link initial flow"}
    - {category: "lid", name: "LID initial soil saturation (InitSat)", unit: "%", source_kind: "user_provided", model_input_format: "[LID_USAGE]", notes: "30-50% typical for event runs; washes out over continuous simulation."}
  boundary_conditions:
    - {category: "control_switch", name: "FLOW_UNITS", unit: "enum CFS|GPM|MGD|CMS|LPS|MLD", source_kind: "user_provided", model_input_format: "[OPTIONS]", notes: "Silently sets the unit system for ALL inputs and outputs; no dimension validation. Single most dangerous silent error."}
    - {category: "control_switch", name: "INFILTRATION method", unit: "enum HORTON|MOD_HORTON|GREEN_AMPT|CURVE_NUMBER", source_kind: "user_provided", model_input_format: "[OPTIONS]"}
    - {category: "control_switch", name: "ROUTING_MODEL", unit: "enum STEADY|KINWAVE|DYNWAVE", source_kind: "user_provided", model_input_format: "[OPTIONS]", notes: "Kinematic wave cannot represent adverse slopes, backwater, or surcharging; only dynamic wave handles reverse flow."}
    - {category: "control_switch", name: "ALLOW_PONDING", unit: "enum YES|NO", source_kind: "user_provided", model_input_format: "[OPTIONS]", notes: "Default NO removes flood water as a mass sink; YES with Aponded>0 conserves it."}
    - {category: "control_switch", name: "Timesteps (WET_STEP, DRY_STEP, ROUTING_STEP, REPORT_STEP) and VARIABLE_STEP", unit: "s; min for report", source_kind: "user_provided", model_input_format: "[OPTIONS]", notes: "ROUTING_STEP must satisfy the Courant condition for dynamic wave."}
    - {category: "boundary_data", name: "Outfall stage boundary", unit: "m (CMS) / ft (CFS)", source_kind: "user_provided", model_input_format: "[OUTFALLS] FREE|NORMAL|FIXED|TIDAL|TIMESERIES (+ [TIMESERIES] for a head series)", notes: "Time-varying head boundary (e.g., downstream river stage). TIMESERIES name must exist and span the simulation period."}
    - {category: "boundary_data", name: "External inflow hydrographs / pollutographs at nodes", unit: "m3/s (CMS); mass/volume", source_kind: "user_provided", model_input_format: "[INFLOWS]", notes: "External lateral inflow (e.g., upstream rural runoff coupling)."}
    - {category: "boundary_data", name: "Dry-weather sanitary flow", unit: "FLOW_UNITS", source_kind: "user_provided", model_input_format: "[DWF] + optional [PATTERNS]", notes: "Required for combined-sewer dry-weather base flow."}
    - {category: "management", name: "Control rules for pumps and regulators", unit: "n/a", source_kind: "user_provided", model_input_format: "[CONTROLS] IF-THEN-ELSE rules"}

processes:
  modules:
    - {name: "RainGage", role: "driver", brief: "Reads rainfall time series/intensity per gage and assigns it to subcatchments (intensity, volume, or cumulative format)."}
    - {name: "Snowmelt", role: "process_solver", brief: "Snow-pack accumulation and degree-day/energy-balance melt with areal depletion; partitions precipitation into rain vs snow and releases meltwater.", applicability: "when Snow Pack objects are defined"}
    - {name: "Evaporation", role: "process_solver", brief: "Actual evaporation from a time series (pan x coefficient) or the Hargreaves method; removes standing surface water and reduces snow/soil water."}
    - {name: "Infiltration", role: "process_solver", brief: "Horton / Modified Horton / Green-Ampt / Curve-Number loss of rainfall into pervious soil; f=0 on impervious subareas."}
    - {name: "RunoffSubcatchment", role: "process_solver", brief: "Nonlinear-reservoir overland flow per subcatchment, mass balance dd/dt = i - e - f - q solved per pervious(A1)/impervious(A2,A3) subarea via Manning's equation."}
    - {name: "Groundwater", role: "process_solver", brief: "Two-zone aquifer water balance; tracks unsaturated moisture theta_u and saturated depth d_L and routes lateral groundwater interflow to a conveyance node.", applicability: "when Aquifer objects are modeled"}
    - {name: "LID", role: "optional_module", brief: "Low Impact Development controls; multi-layer (Surface/Soil/Pavement/Storage/Drain) capture, infiltration, storage, and slow release of subcatchment runoff.", applicability: "when LID controls are placed on subcatchments"}
    - {name: "RDII_UnitHydrograph", role: "process_solver", brief: "Triangular R-T-K unit hydrographs convert rainfall to wet-weather inflow/infiltration injected at conveyance nodes.", applicability: "when RDII unit hydrographs are defined"}
    - {name: "FlowRouting", role: "integrator", brief: "Conveyance routing of all inflows through conduits/nodes/storage/regulators via STEADY, kinematic-wave, or full dynamic-wave (Saint-Venant) solve; handles surcharging, backwater, reverse flow, ponding."}
    - {name: "Nodes_Links", role: "allocator", brief: "Junction/outfall/divider/storage nodes and conduit/pump/orifice/weir/outlet links holding the hydraulic state vector the router updates."}
    - {name: "WaterQuality", role: "process_solver", brief: "Pollutant buildup/washoff by land use on subcatchments and advective routing/treatment of pollutant mass through the network.", applicability: "when pollutants/land uses are defined"}
    - {name: "ContinuityCheck", role: "process_solver", brief: "Mass-balance continuity-error accounting for runoff, groundwater, flow routing, and water quality; the primary numerical-stability diagnostic."}
  internal_edges:
    - {from: "RainGage", to: "Snowmelt", kind: "produces_output", brief: "Precipitation time series partitioned by the snowmelt module."}
    - {from: "RainGage", to: "RunoffSubcatchment", kind: "consumes_input", brief: "Rainfall intensity drives overland-flow generation."}
    - {from: "Snowmelt", to: "RunoffSubcatchment", kind: "produces_output", brief: "Rain plus meltwater is the effective inflow i onto the subcatchment surface."}
    - {from: "Evaporation", to: "RunoffSubcatchment", kind: "produces_output", brief: "Evaporation rate e enters the surface mass balance."}
    - {from: "RainGage", to: "Infiltration", kind: "consumes_input", brief: "Snow-free precipitation available for infiltration."}
    - {from: "Infiltration", to: "RunoffSubcatchment", kind: "produces_output", brief: "Infiltration rate f subtracted from the pervious surface mass balance."}
    - {from: "Infiltration", to: "Groundwater", kind: "produces_output", brief: "Percolated infiltration becomes aquifer recharge."}
    - {from: "RunoffSubcatchment", to: "d", kind: "writes_state", brief: "Updates ponded depth d each runoff timestep."}
    - {from: "RunoffSubcatchment", to: "LID", kind: "invokes", brief: "Runon/runoff routed through LID units before reaching the network."}
    - {from: "LID", to: "RunoffSubcatchment", kind: "produces_output", brief: "LID drain/surface flow returns to the parent subcatchment outlet, reducing effective runoff."}
    - {from: "RunoffSubcatchment", to: "Nodes_Links", kind: "produces_output", brief: "Subcatchment runoff hydrograph becomes lateral inflow at its outlet node."}
    - {from: "Groundwater", to: "Nodes_Links", kind: "produces_output", brief: "Lateral groundwater interflow enters routing nodes as inflow."}
    - {from: "RDII_UnitHydrograph", to: "Nodes_Links", kind: "produces_output", brief: "RDII wet-weather flow added at conveyance nodes."}
    - {from: "Nodes_Links", to: "FlowRouting", kind: "reads_state", brief: "Node heads and link flows are the routing solver's state vector."}
    - {from: "FlowRouting", to: "Nodes_Links", kind: "writes_state", brief: "Saint-Venant solve updates node depth/head (y) and link flow/area (q,a) each routing step."}
    - {from: "RunoffSubcatchment", to: "WaterQuality", kind: "produces_output", brief: "Washoff loads enter the network as pollutant mass."}
    - {from: "FlowRouting", to: "WaterQuality", kind: "produces_output", brief: "Hydraulic flow field advects pollutant concentrations in the same timestep."}
    - {from: "RunoffSubcatchment", to: "ContinuityCheck", kind: "produces_output", brief: "Runoff mass balance yields the runoff continuity error."}
    - {from: "Groundwater", to: "ContinuityCheck", kind: "produces_output", brief: "Groundwater mass balance yields the gw continuity error."}
    - {from: "FlowRouting", to: "ContinuityCheck", kind: "produces_output", brief: "Routing mass balance yields the flow-routing continuity error."}
    - {from: "WaterQuality", to: "ContinuityCheck", kind: "produces_output", brief: "Quality mass balance yields the quality continuity error."}
    - {from: "RunoffSubcatchment", to: "Outputs", kind: "produces_output", brief: "Subcatchment RAIN/INFIL/RUNOFF written to results."}
    - {from: "Nodes_Links", to: "Outputs", kind: "produces_output", brief: "Node depth/head/flooding and link flow/depth/velocity written to .out/.rpt."}
    - {from: "WaterQuality", to: "Outputs", kind: "produces_output", brief: "Pollutant concentrations/loads written per element."}

states:
  variables:
    - {name: "d", unit: "depth (mm/in)", role: "prognostic"}
    - {name: "t_p", unit: "s", role: "prognostic"}
    - {name: "F_e", unit: "depth", role: "accumulator"}
    - {name: "Fu", unit: "fraction", role: "prognostic"}
    - {name: "T", unit: "s", role: "prognostic"}
    - {name: "P", unit: "depth", role: "prognostic"}
    - {name: "S", unit: "depth", role: "prognostic"}
    - {name: "theta_u", unit: "fraction", role: "prognostic"}
    - {name: "d_L", unit: "m", role: "prognostic"}
    - {name: "w_snow", unit: "mm water equiv.", role: "prognostic"}
    - {name: "fw", unit: "mm", role: "prognostic"}
    - {name: "ati", unit: "deg", role: "prognostic"}
    - {name: "cc", unit: "energy/depth equiv.", role: "accumulator"}
    - {name: "y", unit: "m", role: "prognostic"}
    - {name: "q", unit: "m3/s", role: "prognostic"}
    - {name: "a", unit: "m2", role: "diagnostic"}
    - {name: "soil_moisture (LID)", unit: "fraction", role: "prognostic"}
    - {name: "storage_depth (LID)", unit: "mm", role: "prognostic"}
    - {name: "m_B", unit: "mass", role: "prognostic"}
    - {name: "m_P", unit: "mass", role: "prognostic"}
    - {name: "c_N", unit: "mass/volume", role: "prognostic"}
    - {name: "c_L", unit: "mass/volume", role: "prognostic"}
    - {name: "t_sweep", unit: "days", role: "accumulator"}
  provenance: "populated"

outputs:
  - var: "subcatchment_runoff"
    validation_rank: 1
    unit: "m3/s (CMS) or cfs (US)"
    description: "Surface runoff flow rate generated by a subcatchment."
    emitted_in: ".out (SubcatchResult RUNOFF) and .rpt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Subcatchment runoff is rarely observed directly; usually compared at a gauged outlet/link rather than per-subcatchment."]
      detrending_options: ["none"]
  - var: "node_depth_head"
    validation_rank: 2
    unit: "m (CMS) or ft (US)"
    description: "Water depth above invert and hydraulic head at a node (junction, storage, outfall)."
    emitted_in: ".out (NodeResult DEPTH/HEAD)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "r"
          caveats: ["Compared against pressure-transducer/stage records at instrumented manholes; requires datum alignment between model invert and sensor reference."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Peak-stage or high-water-mark comparison at a single node."]
      detrending_options: ["none"]
  - var: "node_flooding"
    validation_rank: 3
    unit: "flow m3/s; volume m3"
    description: "Surface-water overflow rate and total surface floodwater volume at a drainage-network node when capacity is exceeded."
    emitted_in: ".out (NodeResult FLOOD) and .rpt node flooding summary"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Flood volume is mass-balance-sensitive to ALLOW_PONDING; compare only when ponding is configured consistently with the observation context."]
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "csi"
          caveats: ["Flood/no-flood per node against reported flooding locations; threshold-dependent."]
      detrending_options: ["none"]
  - var: "link_flow"
    validation_rank: 4
    unit: "m3/s (CMS) or cfs (US)"
    description: "Stormwater flow rate through a drainage-network conduit/link; outfall discharge equals total inflow at the outfall node."
    emitted_in: ".out (LinkResult FLOW) and .rpt outfall loading summary"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Primary calibration target; compared against flow-gauge records at an outfall or trunk conduit."]
      detrending_options: ["none"]
  - var: "link_depth_velocity"
    validation_rank: 5
    unit: "depth m; velocity m/s; capacity fraction"
    description: "Stormwater flow depth, velocity, and fraction-of-full capacity in a drainage-network conduit."
    emitted_in: ".out (LinkResult DEPTH/velocity)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Velocity rarely directly observed; depth comparable where a sensor exists in the conduit."]
      detrending_options: ["none"]
  - var: "subcatchment_infiltration"
    validation_rank: 6
    unit: "mm/hr"
    description: "Infiltration rate into pervious soil per subcatchment."
    emitted_in: ".out (SubcatchResult INFILTRATION)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Seldom directly observed; usually inferred from a runoff-coefficient or water-balance closure rather than a direct sensor."]
      detrending_options: ["none"]
  - var: "groundwater_outflow"
    validation_rank: 7
    unit: "flow m3/s; table elev m"
    description: "Groundwater table elevation and lateral groundwater outflow per subcatchment."
    emitted_in: ".out (SubcatchResult / SystemAttribute GW_INFLOW)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Compared against monitoring-well table elevations where aquifer parameters are calibrated; only meaningful when groundwater is enabled."]
      detrending_options: ["none"]
  - var: "pollutant_concentration_load"
    validation_rank: 8
    unit: "mass/volume; mass"
    description: "Pollutant concentration and washoff load at subcatchments, nodes, and links."
    emitted_in: ".out (pollutant per element) and .rpt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Grab-sample / EMC data are sparse and noisy; event-mean concentration comparison is often the only defensible match."]
      detrending_options: ["none"]
  - var: "continuity_error"
    validation_rank: 9
    unit: "percent"
    description: "Surface-runoff water and drainage-network water flow-routing continuity errors; primary internal mass-balance/numerical-stability diagnostic."
    emitted_in: ".rpt continuity tables"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Self-diagnostic, not an observation; checked against acceptance thresholds (<5%, <1% for dynamic wave), not against field data."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "PctImperv (percent imperviousness)"
      to: "subcatchment_runoff (runoff volume)"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["barco2008_swmm_autocalibration", "swmm2024_sensitivity_runoff_pollution", "ema2019_swmm_greenland_runoff"]
    - from: "PctImperv (percent imperviousness)"
      to: "link_flow (peak flow)"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["barco2008_swmm_autocalibration", "swmm2024_sensitivity_runoff_pollution"]
    - from: "DStore-Imperv (impervious depression storage)"
      to: "subcatchment_runoff (runoff volume)"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["barco2008_swmm_autocalibration", "yazdi2019_swmm_review_gap"]
