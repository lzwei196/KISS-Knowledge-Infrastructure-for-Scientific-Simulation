# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: WRF
  language: fortran
  implementation:
    id: wrf-arw-471
    version: 4.7.1
    provenance: Fortran 90/2003 with C utilities; NCAR/UCAR community WRF-ARW release 4.7.1 (github.com/wrf-model/WRF);
      MPI + OpenMP parallel; NetCDF I/O.
  scientific_reference_version: 'Advanced Research WRF (ARW) dynamical core, v4.x lineage; governing equations
    per the ARW Technical Note (NCAR TN series): fully compressible nonhydrostatic Euler equations in
    flux form on a terrain-following hybrid hydrostatic-pressure (eta) mass coordinate, Arakawa C-grid'
inputs:
  forcing:
  - name: Global reanalysis/forecast lateral boundary fields (3-D temperature, u/v wind, geopotential
      height, relative humidity, surface and mean-sea-level pressure)
    unit: K, m s-1, m, %, Pa
    category: meteorological_lateral_forcing
    source_kind: forcing
    model_input_format: Lateral boundary fields in wrfbdy_d01 (NetCDF), updated at interval_seconds; derived
      from interpolated met_em fields
    notes: Drives the domain-1 lateral boundary tendencies throughout the run. interval_seconds must match
      the driving-data frequency (hourly=3600, 6-hourly=21600). 12-24 h spin-up recommended before the
      analysis period.
  - name: Skin/sea-surface temperature, soil moisture and temperature, land-sea mask, 2-m fields
    unit: K, m3 m-3, 0/1
    category: meteorological_surface_forcing
    source_kind: forcing
    model_input_format: met_em.d0N fields (SKINTEMP, SST, SM000010, ST000010, LANDSEA) consumed by real.exe;
      optional time-varying SST via wrflowinp with sst_update=1
    notes: Soil moisture/temperature and SST must be present in the met_em files or real.exe falls back
      / produces zero-soil fields. SST over water defaults to SKINTEMP when absent.
  parameters:
  - name: Terrain elevation, dominant land-use category, dominant soil category (top/bottom), slope category
    unit: m, category index
    category: static_terrestrial
    source_kind: dataset_lookup
    model_input_format: geo_em.d0N.nc static fields (HGT_M, LU_INDEX, SCT_DOM, SCB_DOM) produced by geogrid
      from WPS_GEOG (USGS GMTED2010 topo, MODIS 21-cat or USGS 24-cat land use, STATSGO/FAO 16-cat soil)
    notes: num_land_cat must match the land-use dataset (MODIS=21, USGS=24).
  - name: Monthly green-vegetation fraction, monthly surface albedo, maximum snow albedo, leaf area index,
      deep soil temperature
    unit: fraction, K
    category: static_terrestrial_seasonal
    source_kind: dataset_lookup
    model_input_format: geo_em.d0N.nc (GREENFRAC, ALBEDO12M, SNOALB) and met_em annual-mean deep soil
      temperature
  - name: Land-surface, vegetation, soil, and radiation lookup tables
    unit: scheme-specific
    category: physics_lookup_tables
    source_kind: default
    model_input_format: LANDUSE.TBL, VEGPARM.TBL, SOILPARM.TBL, GENPARM.TBL, RRTM_DATA / RRTMG_LW_DATA
      / RRTMG_SW_DATA / CAM_ABS_DATA
    notes: Radiation lookup tables must be present in the run directory at runtime or radiation crashes
      or uses wrong physics.
  - name: Scheme tuning coefficients (e.g. Kain-Fritsch entrainment/downdraft multipliers, CAPE consumption
      time, Noah saturated-soil-water multiplier, PBL momentum-diffusivity profile exponent, radiation
      scattering tuning)
    unit: dimensionless / scheme-specific
    category: tunable_physics_coefficients
    source_kind: calibrated
    model_input_format: Scheme-internal coefficients (subset namelist-exposed; many hardwired in module_model_constants.F)
    notes: These are the levers identified by published WRF sensitivity analyses (see influence). Most
      are not surfaced in standard namelist tables.
  initial_conditions:
  - name: Initial 3-D wind, perturbation potential temperature, geopotential, pressure, dry-air column
      mass, water-vapor mixing ratio
    unit: m s-1, K, m2 s-2, Pa, kg kg-1
    category: atmospheric_initial_state
    source_kind: derived
    model_input_format: wrfinput_d0N (NetCDF) variables U, V, W, T, PH/PHB, P/PB, MU/MUB, QVAPOR produced
      by real.exe vertical interpolation of met_em onto the eta grid plus base-state computation
  - name: Initial soil temperature and volumetric soil moisture by layer
    unit: K, m3 m-3
    category: land_initial_state
    source_kind: derived
    model_input_format: wrfinput_d0N TSLB, SMOIS (num_soil_layers consistent with the land-surface scheme)
  boundary_conditions:
  - name: Domain dimensions, nesting, projection, and vertical levels
    unit: grid units, m
    category: domain_grid_control
    source_kind: user_provided
    model_input_format: namelist.input &domains (max_dom, e_we, e_sn, e_vert, dx, dy, parent_grid_ratio,
      parent_time_step_ratio, i/j_parent_start, feedback) and namelist.wps projection settings
    notes: parent_grid_ratio must be odd (3,5,7) for real-data nesting; e_vert must be identical across
      nested domains; dx/dy in meters for real-data cases.
  - name: Run length, start/end times, integration timestep, boundary-update and history intervals
    unit: s, min
    category: time_control
    source_kind: user_provided
    model_input_format: namelist.input &time_control (run_days/hours, start/end y/m/d/h, interval_seconds,
      history_interval, io_form_history) and &domains time_step
    notes: time_step is CFL-bound (dt <= 6*dx_km) unless use_adaptive_time_step=.true., which overrides
      it at runtime via observed CFL.
  - name: Physics parameterization choices (microphysics, LW/SW radiation, surface layer, land-surface
      model, PBL, cumulus)
    unit: scheme index
    category: physics_scheme_selection
    source_kind: user_provided
    model_input_format: namelist.input &physics (mp_physics, ra_lw_physics, ra_sw_physics, sf_sfclay_physics,
      sf_surface_physics, bl_pbl_physics, cu_physics, radt, num_soil_layers, num_land_cat)
    notes: num_soil_layers must match the LSM (Noah=4, RUC=6, Noah-MP=4, CLM4=10); cu_physics must be
      0 for domains with dx<5 km; scheme suites (surface layer / PBL / LSM) must be mutually compatible.
  - name: Dynamical-core and numerics switches (RK order, diffusion, advection order, hybrid coordinate,
      damping)
    unit: option index
    category: dynamics_numerics_control
    source_kind: user_provided
    model_input_format: namelist.input &dynamics (rk_ord, diff_opt, km_opt, non_hydrostatic, hybrid_opt,
      h/v_mom_adv_order, h/v_sca_adv_order, moist_adv_opt, w_damping, damp_opt, zdamp, dampcoef, epssm)
    notes: Damping/epssm options stabilize strong updrafts over steep terrain (mitigate 'WOULD GO OFF
      TOP' and NaN growth).
outputs:
  primary:
  - name: T2
    unit: K
    description: 2-metre air temperature (diagnosed at the surface; already in Kelvin, no base-state offset
      needed)
    validation_rank: 1
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare to station 2-m temperature at the grid cell containing the station; representativeness
          error over heterogeneous terrain.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Gridded reanalysis/satellite LST is a proxy for 2-m air temperature, not identical.
      detrending_options:
      - none
  - name: RAINC+RAINNC
    unit: mm
    description: Total accumulated atmospheric precipitation at the land/ocean surface (convective RAINC
      plus grid-scale RAINNC), accumulated from simulation start
    validation_rank: 3
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Difference consecutive output times for interval precip; gauge point vs grid-cell-average mismatch;
          convective timing/displacement errors dominate at sub-daily scale.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Compare against gridded radar/satellite QPE; displacement of convective cells penalizes point-to-point
          metrics.
      - obs_shape: categorical_event
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        determining_metric: csi
        caveats:
        - Threshold-exceedance (heavy-rain) verification via hit rate / false-alarm / CSI is more robust
          to displacement than magnitude metrics.
      detrending_options:
      - none
      - first_difference
  - name: U10/V10
    unit: m s-1
    description: 10-metre atmospheric wind components (grid-relative on the C-grid; require COSALPHA/SINALPHA
      rotation to earth-relative for direction comparison)
    validation_rank: 2
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Rotate to earth-relative before direction comparison; wind direction bias of 10-30 deg arises
          if grid-relative winds are compared directly on projected grids.
      detrending_options:
      - none
  - name: PSFC
    unit: Pa
    description: Surface pressure (total, in Pa)
    validation_rank: 4
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Reduce to common reference (station vs MSL); elevation mismatch between station and grid-cell
          terrain height biases magnitude.
      detrending_options:
      - none
  - name: T
    unit: K
    description: 3-D atmospheric perturbation potential temperature (theta - 300 K); actual temperature
      = (T+300)*((P+PB)/100000)^(Rd/cp)
    validation_rank: 5
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Must add 300 K base state and apply Exner function before comparison to radiosonde/aircraft
          temperature; compare on pressure or height levels after interpolation.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Reanalysis upper-air fields require destaggering and base-state reconstruction first.
      detrending_options:
      - none
  - name: SWDOWN
    unit: W m-2
    description: Downward shortwave radiation at the surface
    validation_rank: 6
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Diurnal cycle resolution depends on radt; cloud-radiation interaction errors dominate; compare
          instantaneous flux, not accumulated.
      detrending_options:
      - none
  - name: TSLB
    unit: K
    description: Soil temperature by layer (land-surface state)
    validation_rank: 7
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Match the model soil-layer midpoint depth to the observation depth; strongly conditioned on
          the initial soil state from the forcing.
      detrending_options:
      - none
  - name: SMOIS
    unit: m3 m-3
    description: Volumetric soil moisture by layer (land-surface state)
    validation_rank: 8
    emitted_in: wrfout_d0N
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Volumetric fraction (not mm or % saturation); satellite products sense only a shallow surface
          layer; LSM-scheme-dependent.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Compare top-layer SMOIS against satellite surface soil moisture; depth-support mismatch.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: 'Surface temperatures in wrfout are ~300 K too cold (e.g., T2 shows -27 C when expecting +25
    C), or downstream analysis reports temperatures near 0 K.

    '
  diagnosis: 'The 3D temperature variable T in wrfout is perturbation potential temperature (theta - 300
    K). Code is reading T directly without adding the 300 K base state. For actual temperature, one must
    also apply the Exner function: T_actual = (T + 300) * (P_total / 100000)^(287/1003.5).

    '
  remedy: 'Always add 300 to T before any use: theta = T + 300. For actual temperature, compute T_actual
    = theta * ((P + PB) / 100000.0)^(R_d/c_p). For 2-m temperature, use the T2 variable directly (already
    in K, not perturbation).

    '
  severity: critical
- id: dt_002
  symptom: 'Surface pressure values are ~100x too small (e.g., 1013 instead of 101300). Downstream calculations
    using pressure give nonsensical results.

    '
  diagnosis: 'Pressure was read in hPa (millibars) but WRF expects and outputs Pa internally. Alternatively,
    only the perturbation pressure P was used instead of total pressure P + PB.

    '
  remedy: 'For input data: multiply hPa by 100 to get Pa. For wrfout data: total pressure is P + PB (perturbation
    + base state). P alone is only ~100-1000 Pa. PSFC is total surface pressure in Pa.

    '
  severity: critical
- id: dt_003
  symptom: 'Mixing ratios (qv, qc, qr) are 1000x too large, causing unrealistic precipitation or model
    crash. Total column water exceeds 200 kg/m2.

    '
  diagnosis: 'Input specific humidity or mixing ratio was provided in g/kg instead of the WRF-required
    kg/kg. A value of 15 g/kg should be 0.015 kg/kg.

    '
  remedy: 'Divide g/kg values by 1000 before ingestion. Check that qv values are in range 0 to ~0.04 kg/kg
    (0 to 40 g/kg is extreme tropical).

    '
  severity: critical
- id: dt_004
  symptom: 'Geopotential height values are ~9.81x too large. Model produces unrealistic pressure gradients
    or crashes during initialization.

    '
  diagnosis: 'ERA5 provides geopotential in m2/s2, but WRF GHT field expects height in meters. The conversion
    factor is g = 9.81 m/s2.

    '
  remedy: 'Divide ERA5 geopotential (z) by 9.81 to get geopotential height in meters: GHT = z / 9.81.

    '
  severity: critical
- id: dt_005
  symptom: 'Precipitation totals are always zero or always accumulating without reset. Hourly rainfall
    rates appear as multi-day totals.

    '
  diagnosis: 'WRF RAINC and RAINNC are accumulated from simulation start. To get interval precipitation,
    you must difference consecutive output times. Additionally, total precipitation requires RAINC + RAINNC
    (convective plus grid-scale).

    '
  remedy: 'Compute interval precip: P(t) = (RAINC(t) + RAINNC(t)) - (RAINC(t-1) + RAINNC(t-1)). For the
    first output time, the accumulation is from simulation start.

    '
  severity: high
- id: dt_006
  symptom: 'Radiation flux values are wrong by factor of ~86400 or 1e6. Solar radiation appears as 0.005
    W/m2 when expecting 500 W/m2.

    '
  diagnosis: 'Input radiation data was in MJ/m2/day but WRF expects W/m2 (1 W = 1 J/s). Conversion: W/m2
    = MJ/m2/day * 1e6 / 86400.

    '
  remedy: 'Multiply MJ/m2/day by 11.574 to get W/m2. Alternatively, W/m2 = MJ/m2/day * 1000000 / 86400.

    '
  severity: high
- id: dt_007
  symptom: 'Model crashes within first few timesteps with "cfl" errors in rsl.error.0000. Simulation immediately
    aborts.

    '
  diagnosis: 'Time step violates the CFL (Courant-Friedrichs-Lewy) stability condition. The rule of thumb
    is dt <= 6 * dx(km). For dx=12 km, dt must be <= 72 s.

    '
  remedy: 'Reduce time_step in namelist.input. Start conservative (dt = 4*dx_km) and increase if stable.
    Also check parent_time_step_ratio for nested domains.

    '
  severity: critical
- id: dt_008
  symptom: 'real.exe or wrf.exe crashes with segmentation fault. No useful error message. Core dump shows
    crash in land surface module.

    '
  diagnosis: 'num_soil_layers does not match the land surface model selection: Noah LSM (sf_surface_physics=2)
    requires 4, RUC (3) requires 6, Noah-MP (4) requires 4, CLM4 (5) requires 10.

    '
  remedy: 'Set num_soil_layers to match sf_surface_physics: sf_surface_physics=1→5, =2→4, =3→6, =4→4,
    =5→10.

    '
  severity: critical
- id: dt_009
  symptom: 'Precipitation is unrealistically high (2-3x observed). Domain 2 (4 km) shows much more rain
    than observations.

    '
  diagnosis: 'cu_physics (cumulus parameterization) is enabled on a domain with dx < 5 km. At convection-permitting
    resolution, convection is explicitly resolved, so parameterized + resolved = double-counted.

    '
  remedy: 'Set cu_physics = 0 for all domains with dx < 5 km. For the parent domain (dx > 10 km), keep
    cu_physics = 1 (Kain-Fritsch) or 16 (New Tiedtke).

    '
  severity: high
- id: dt_010
  symptom: 'Nesting interpolation produces checkerboard patterns at nest boundaries. Temperature or wind
    fields show regular oscillations.

    '
  diagnosis: 'parent_grid_ratio is an even number (2, 4, 6). WRF requires odd ratios (3, 5, 7) for real-data
    simulations to properly center the interpolation stencil.

    '
  remedy: 'Change parent_grid_ratio to an odd number. Common: 3:1 (12km→4km) or 5:1 (25km→5km).

    '
  severity: high
- id: dt_011
  symptom: 'Boundary condition update causes sharp discontinuities or model crash. Temperature jumps every
    6 hours at domain boundaries.

    '
  diagnosis: 'interval_seconds in namelist.input does not match the temporal resolution of the forcing
    data (met_em files). If interval_seconds=3600 but met_em files are 6-hourly, WRF expects files that
    don''t exist.

    '
  remedy: 'Set interval_seconds to match the forcing data frequency: ERA5 hourly=3600, GFS/FNL 6-hourly=21600,
    3-hourly=10800.

    '
  severity: high
- id: dt_012
  symptom: 'Model produces NaN values that spread through the domain within 10-20 timesteps, eventually
    crashing or filling output with NaN.

    '
  diagnosis: 'NaN injection from: (1) division by zero in physics (e.g., near-zero pressure or density),
    (2) corrupt initial conditions, (3) extreme topography gradient with too-large time step, or (4) inconsistent
    restart file precision.

    '
  remedy: '(1) Check wrfinput for NaN: ncdump -v T wrfinput_d01 | grep -i nan. (2) Reduce time_step by
    30%. (3) Enable w_damping=1 and epssm=0.1 for steep terrain. (4) Ensure restart uses same precision.

    '
  severity: critical
- id: dt_013
  symptom: 'wrf.exe runs but produces no wrfout files. Log shows normal timestep progress but no output
    is written.

    '
  diagnosis: 'history_interval is set larger than the total simulation duration, or frames_per_outfile
    is set to 0, or io_form_history is invalid.

    '
  remedy: 'Verify history_interval (minutes) < total simulation time (minutes). Ensure frames_per_outfile
    >= 1. Set io_form_history = 2 for netCDF.

    '
  severity: high
- id: dt_014
  symptom: 'Model crashes with "WOULD GO OFF TOP" error after several hours. Log shows extreme vertical
    velocities.

    '
  diagnosis: 'Strong updrafts (from steep terrain or intense convection) push air parcels above the model
    top. The model domain top (ztop or p_top_requested) is too low, or the upper-level damping is insufficient.

    '
  remedy: '(1) Increase ztop (or decrease p_top_requested to lower pressure, e.g., 1000 Pa). (2) Enable
    Rayleigh damping: damp_opt=3, zdamp=5000, dampcoef=0.2. (3) Reduce time_step if over steep terrain.

    '
  severity: high
- id: dt_015
  symptom: 'Simulation is extremely slow. Wall-clock time per timestep is 10x longer than expected for
    the grid size.

    '
  diagnosis: '(1) MPI decomposition inefficient (too few or too many cores). (2) I/O bottleneck from writing
    too-frequent output. (3) Spectral bin microphysics (mp_physics=30/32) is 100x slower than bulk schemes.
    (4) Radiation called every timestep instead of every 15 min.

    '
  remedy: '(1) Optimal MPI: ~25x25 grid points per process. (2) Increase history_interval or frames_per_outfile.
    (3) Use bulk microphysics (mp_physics=8 Thompson) for production. (4) Set radt=15 (minutes) for radiation
    call frequency.

    '
  severity: medium
- id: dt_016
  symptom: 'real.exe crashes with "not enough levels" or produces wrfinput with all-zero soil fields.
    Soil temperature shows 0 K.

    '
  diagnosis: 'met_em files are missing soil moisture and temperature fields. This happens when the Vtable
    doesn''t include soil variables, or the source GRIB data doesn''t contain soil fields.

    '
  remedy: '(1) Verify Vtable includes SM and ST fields. (2) Check met_em: ncdump -h met_em.d01.* | grep
    SM (3) If source data lacks soil, use a separate soil dataset (e.g., ERA5 soil separate from pressure-level
    data).

    '
  severity: critical
- id: dt_017
  symptom: 'SST is constant at 0 or 300 K everywhere. Ocean surface fluxes are unrealistic. Coastal temperature
    gradients are wrong.

    '
  diagnosis: 'SST field was not extracted from GRIB data, or the Vtable doesn''t map the SST variable
    correctly. real.exe falls back to using SKINTEMP over water, which may be wrong.

    '
  remedy: '(1) Ensure Vtable includes SST mapping. (2) For ERA5, SST is a separate dataset from pressure
    levels. (3) Verify: ncdump -v SST met_em.d01.* shows realistic ocean temps. (4) For time-varying SST,
    use wrflowinp with sst_update=1.

    '
  severity: high
- id: dt_018
  symptom: 'Temporal interpolation artifacts appear as 6-hourly pulses in temperature or wind. Boundary
    forcing shows step changes.

    '
  diagnosis: 'Gap in met_em temporal coverage. One or more intermediate times are missing, causing WRF
    to extrapolate or use stale boundaries.

    '
  remedy: '(1) List all met_em files and verify continuous temporal coverage. (2) Rerun ungrib/metgrid
    to fill gaps. (3) Ensure GRIB data covers full simulation period including end time.

    '
  severity: high
- id: dt_019
  symptom: 'Wind direction comparison with observations shows systematic bias of 10-30 degrees. Wind speed
    is correct but direction is offset.

    '
  diagnosis: 'U10 and V10 in wrfout are grid-relative, not earth-relative. For Lambert conformal or polar
    stereographic projections, the grid north differs from true north by the convergence angle.

    '
  remedy: 'Rotate winds using COSALPHA and SINALPHA variables from wrfout: u_earth = U10*COSALPHA - V10*SINALPHA
    v_earth = V10*COSALPHA + U10*SINALPHA

    '
  severity: high
- id: dt_020
  symptom: 'Spatial plots show half-grid-cell offset between wind and temperature fields. Wind vectors
    appear shifted relative to the temperature contours.

    '
  diagnosis: '3D wind components (U, V, W) are on staggered grid faces (Arakawa C-grid). U has an extra
    point in X, V in Y, W in Z. Plotting raw staggered data against unstaggered mass-point data causes
    spatial offset.

    '
  remedy: 'Destagger before analysis: u_mass = 0.5 * (U[:,:,:-1] + U[:,:,1:]) v_mass = 0.5 * (V[:,:-1,:]
    + V[:,1:,:])

    '
  severity: medium
- id: dt_021
  symptom: 'Vertical profile of pressure shows only small perturbation values (~100-1000 Pa) instead of
    full atmospheric pressure (~100000 Pa).

    '
  diagnosis: 'Only the perturbation pressure variable P was read, ignoring the base-state pressure PB.
    Total pressure is P + PB.

    '
  remedy: 'Always compute total pressure: pressure = P + PB. Similarly, total geopotential: ph_total =
    PH + PHB.

    '
  severity: medium
- id: dt_022_nasa_power_lst_vs_utc_and_climatology_proxy
  symptom: WRF T2 (or any sub-daily field) scored against NASA POWER hourly appears anti-correlated (r~-0.05,
