model:
  name: "Elmer_Ice"
  full_name: "Elmer/Ice (Elmer FEM 26.1)"
  domain: "cryosphere — ice sheet and glacier dynamics"
  binary_path: "KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/Elmer_Ice/install/bin/ElmerSolver"
  auxiliary_binaries:
    - path: "KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/Elmer_Ice/install/bin/ElmerGrid"
      purpose: "Mesh generation and format conversion"
    - path: "KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/Elmer_Ice/install/bin/Mesh2D"
      purpose: "2D mesh generation"
  config_format: "SIF (Solver Input File) — plain text with hierarchical blocks"
  mesh_format: "ElmerGrid native (mesh.header, mesh.nodes, mesh.elements, mesh.boundary)"
  output_format: "VTU (VTK Unstructured Grid XML)"

inputs:
  forcing:
    - name: "surface_mass_balance"
      unit: "m/a ice equivalent"
      valid_range: [-10.0, 5.0]
      description: "Surface mass balance (positive=accumulation, negative=ablation)"
    - name: "surface_temperature"
      unit: "deg C"
      valid_range: [-60.0, 20.0]
      description: "Surface temperature boundary condition"
    - name: "geothermal_heat_flux"
      unit: "mW/m2"
      valid_range: [20.0, 200.0]
      description: "Basal geothermal heat flux"
    - name: "ocean_thermal_forcing"
      unit: "deg C"
      valid_range: [-2.0, 10.0]
      description: "Ocean thermal forcing for marine-terminating glaciers"
  geometry:
    - name: "bed_elevation"
      unit: "m"
      valid_range: [-5000.0, 5000.0]
      source: "BedMachine v5"
    - name: "ice_thickness"
      unit: "m"
      valid_range: [0.0, 5000.0]
      source: "BedMachine v5"
    - name: "surface_elevation"
      unit: "m"
      valid_range: [0.0, 5000.0]
      source: "ArcticDEM / REMA"
  parameters:
    critical:
      - name: "SSA Friction Parameter (beta)"
        valid_range: [1.0e-5, 1.0e-1]
        description: "Basal friction coefficient — units depend on friction law"
      - name: "Viscosity Exponent"
        valid_range: [0.25, 0.5]
        description: "1/n for Glen's flow law (n=3 → 0.333). MUST be 1/n, NOT n"
      - name: "Rate Factor A"
        unit: "Pa^-3 s^-1"
        valid_range: [1.0e-25, 1.0e-16]
        description: "Arrhenius rate factor for ice viscosity"
      - name: "Critical Shear Rate"
        unit: "s^-1"
        valid_range: [1.0e-12, 1.0e-6]
        description: "Floor for strain rate invariant to prevent division by zero"
      - name: "Ice Density"
        unit: "kg/m3"
        valid_range: [850.0, 920.0]
        description: "Density of ice — MUST be in kg/m3, NOT g/cm3"
      - name: "Water Density"
        unit: "kg/m3"
        valid_range: [1020.0, 1030.0]
        description: "Density of seawater — MUST be in kg/m3"
      - name: "Timestep Sizes"
        unit: "s"
        valid_range: [86400.0, 315569260.0]
        description: "SIF timestep in seconds. 1 year = 31556926.0 s. NOT years"

outputs:
  primary:
    - name: "SSAVelocity"
      unit: "m/s (convert to m/a by multiplying by 31556926)"
      valid_range: [0.0, 4.0e-4]
      description: "Depth-averaged horizontal velocity (1 DOF flowline, 2 DOF plan-view)"
    - name: "Velocity"
      unit: "m/s"
      valid_range: [0.0, 4.0e-4]
      description: "3D velocity field (u,v,w)"
    - name: "Temperature"
      unit: "deg C (relative to pressure melting point)"
      valid_range: [-60.0, 0.0]
      description: "Ice temperature"
    - name: "H"
      unit: "m"
      valid_range: [0.0, 5000.0]
      description: "Ice thickness"
    - name: "Pressure"
      unit: "Pa"
      valid_range: [0.0, 5.0e7]
      description: "Ice pressure"
    - name: "GroundedMask"
      unit: "dimensionless"
      valid_range: [-1, 1]
      description: "-1=floating, 0=grounding line, 1=grounded"
  secondary:
    - name: "Stress"
      unit: "MPa"
      description: "Deviatoric stress tensor (6 components)"
    - name: "StrainRate"
      unit: "a^-1"
      description: "Strain rate tensor (6 components)"
    - name: "Hydraulic Potential"
      unit: "m"
      description: "Subglacial water potential (GlaDS solver)"
    - name: "Effective Pressure"
      unit: "Pa"
      description: "Ice overburden minus water pressure"
    - name: "Water Content"
      unit: "%"
      description: "Temperate ice water fraction"

known_issues:
  - id: "dt_001"
    description: "Velocity m/s vs m/a confusion — factor of 3.17e7"
  - id: "dt_002"
    description: "Viscosity Exponent: must use 1/n not n — 27x error if wrong"
  - id: "dt_003"
    description: "Density must be kg/m3 not g/cm3 — flotation 1000x wrong"
  - id: "dt_009"
    description: "Timestep in seconds not years — 3.17e7x too slow if years assumed"
  - id: "dt_013"
    description: "Critical Shear Rate must be > 0 or NaN propagates"
