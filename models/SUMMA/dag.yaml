safety:
  hazards:
    - id: "precip_unit_or_timestep_silent_runoff_bias"
      kind: "weather_file_semantic"
      description: "Precipitation rate scaled by the wrong factor (e.g. divided by 86400 instead of the 10800 s 3-hourly step) leaves runoff multiples too high/low with no error; verify mean pptrate ~1e-5 to 1e-4 kg/m2/s."
      severity: "silent"
    - id: "airpres_kPa_energy_balance_NaN"
      kind: "weather_file_semantic"
      description: "Air pressure supplied in kPa instead of Pa breaks saturation vapour pressure / Penman-Monteith; soil temperatures diverge >400K or <200K and NaN propagates. Expect ~80000-105000 Pa."
      severity: "fatal_or_silent"
    - id: "spechum_g_per_kg_high_ET"
      kind: "weather_file_semantic"
      description: "Specific humidity in g/kg instead of g/g (or pressure in kPa) yields wrong vapour-pressure deficit and ET >10 mm/day or negative, with no error. Expect spechum ~0.002-0.015."
      severity: "silent"
    - id: "vGn_alpha_positive_NaN"
      kind: "soil_semantic"
      description: "van Genuchten vGn_alpha must be NEGATIVE (matric-head convention); a positive value makes (alpha*psi)^n NaN for non-integer n, giving NaN soil moisture and runoff. Valid range ~[-1.0,-0.01]."
      severity: "silent"
    - id: "soil_param_ordering_violation"
      kind: "soil_semantic"
      description: "Soil parameters mixed from different pedotransfer frameworks (e.g. Saxton-Rawls vs ROSETTA) can violate the required ordering theta_res < critSoilWilting < critSoilTranspire < fieldCapacity < theta_sat, causing an out-of-range crash. Derive all soil parameters from one framework."
      severity: "fatal"
    - id: "theta_res_ge_theta_sat"
      kind: "soil_semantic"
      description: "theta_res must be strictly less than theta_sat; otherwise the retention curve is ill-posed and the run crashes / produces NaN."
      severity: "fatal"
    - id: "trialparams_name_silent_fallback"
      kind: "coefficient_runtime_silent_fallback"
      description: "trialParams.nc variable names must match SUMMA's case-sensitive internal names (var_lookup.f90); unrecognized names are silently ignored and lookup-table defaults are used with no warning."
      severity: "silent"
    - id: "coldstate_nsoil_dimension_mismatch"
      kind: "initial_condition_semantic"
      description: "Number of soil layers in coldState.nc must match the model's nSoil configuration exactly; a mismatch aborts at the layer dimension check."
      severity: "fatal"
    - id: "coldstart_spinup_unrealistic"
      kind: "initial_condition_semantic"
      description: "Cold-start initial conditions far from equilibrium produce 1-2 yr (5+ for groundwater basins) of unrealistic runoff/storage that must be discarded; over-dry init causes long spinup, above-theta_sat init causes runoff spikes."
      severity: "degraded"
    - id: "nrg_flux_convergence_failure_subtropical"
      kind: "numerical_instability"
      description: "canopySnow phase-change equations are stiff; on warm/subtropical basins the first freezing event under nrg_flux can fail to converge ('failed to converge [mass]') for all GRUs. presTemp avoids the crash but yields zero ET / zero runoff (diagnostic only); two-phase spinup mitigates."
      severity: "fatal_or_silent"
    - id: "convergence_dt_below_dtmin"
      kind: "numerical_instability"
      description: "Unrealistic forcing (e.g. negative shortwave), steep terrain/thin layers, or incompatible decisions drive 'dt < dtmin' / 'failed to converge' and STOP 40; clean forcing, raise dt_init, or coarsen soil layers."
      severity: "fatal"
    - id: "fDerivMeth_numerical_unimplemented"
      kind: "control_semantic"
      description: "fDerivMeth=numericl is not implemented for the coupled hydro-thermal solver; soilLiqFlx returns err=20 and the run crashes. Only fDerivMeth=analytic works."
      severity: "fatal"
    - id: "groundwater_decision_incompatibility"
      kind: "control_semantic"
      description: "groundwatr=qTopmodl requires bcLowrSoiH=zeroFlux AND hc_profile=pow_prof; spatial_gw=singleBasin requires groundwatr=bigBuckt. Incompatible decision combinations are fatal at init (enforced in mDecisions)."
      severity: "fatal"
    - id: "invalid_decision_option"
      kind: "control_semantic"
      description: "Case-sensitive decision keywords with a typo/invalid value (and intentionally-abbreviated options like 'itertive', 'numericl', 'consettl') trigger STOP 30 'unknown option'."
      severity: "fatal"
    - id: "hru_id_inconsistency_across_files"
      kind: "control_semantic"
      description: "hruId/gruId values and order must be identical across attributes, forcing, coldState and trialParams NetCDFs; a single missing/extra/reordered HRU is fatal at startup."
      severity: "fatal"
    - id: "netcdf_varname_or_dim_order"
      kind: "parser_semantic"
      description: "Misspelled or mis-cased NetCDF variable names (ppt_rate vs pptrate) or wrong (time,hru) dimension order cause STOP 20 NetCDF dimension errors (Fortran names are case-sensitive)."
      severity: "fatal"
    - id: "mixed_output_unit_families"
      kind: "parser_semantic"
      description: "SUMMA emits runoff fluxes (scalarTotalRunoff, drainage, baseflow) in m/s but ET/throughfall/pptrate in kg/m2/s. Treating them with a single unit conversion (e.g. dividing runoff by water density) makes discharge ~1000x too low and opens a spurious ~1000 mm/yr water-balance gap; consult each variable's units attribute."
      severity: "silent"
    - id: "presTemp_boundary_zero_ET"
      kind: "control_semantic"
      description: "A presTemp upper/lower thermodynamic boundary bypasses the energy balance and silently produces zero ET and hence zero runoff (diagnostic mode only)."
      severity: "silent"
    - id: "averageRoutedRunoff_scored_as_channel_discharge"
      kind: "workflow_semantic"
      description: "Scoring averageRoutedRunoff x basin area against a gauge on a large basin yields the signature r >= 0.7 with NSE <= 0.3: the shape is right but all channel travel time is missing. This is a workflow error, not a model verdict. Gauged-discharge validation requires the external s8_routing (mizuRoute) stage."
      severity: "silent"
    - id: "mizuroute_hybas_id_int32_overflow_and_unit_double_conversion"
      kind: "coupling_semantic"
      description: "When wiring mizuRoute, HydroBASINS HYBAS_ID overflows mizuRoute's int32 river-network id payload (max 4,071,348,160 vs int32 max 2,147,483,647; read_streamSeg.f90:254 loads NTOPO via i4b); ids must be renumbered 1..N. mizuRoute accepts m/s natively (read_control.f90:457 case('m') -> length_conv=1.0), which is already SUMMA's scalarTotalRunoff unit -- do not convert, or discharge is 1000x wrong."
      severity: "fatal_or_silent"
    - id: "lumped_discretisation_cannot_be_routed"
      kind: "workflow_semantic"
      description: "A river-network router requires runoff per sub-basin. A lumped single-GRU / elevation-band discretisation cannot be routed; re-discretise to one GRU per sub-basin first."
      severity: "fatal"
  validation_limits:
    - "No channel/stream-network routing inside SUMMA; gauged-discharge comparison requires external routing (e.g. mizuRoute) of HRU runoff."
    - "No lateral moisture exchange between GRUs; lateral hillslope/hydraulic connectivity between distinct GRUs cannot be represented."
    - "Designed for cold-region / snow-dominated / mountain / Arctic-subarctic basins where canopy-snow interception matters; the canopySnow phase-change path is poorly conditioned on warm/subtropical basins under nrg_flux."
    - "Single 1-D vertical column per HRU; sub-HRU spatial heterogeneity within a land-cover/soil class is not resolved."
    - "Same parameterization applies across the entire model domain in this version (no per-region physics mixing within one run)."
  warnings:
    - "presTemp diagnostic boundary yields zero ET / zero runoff that looks like a successful but physically meaningless run."
    - "All-zero runoff and unrealistically-high ET are silent symptoms (no STOP) of forcing-unit or boundary-condition errors, not necessarily model failure."
    - "Soil/vegetation lookup parameters are applied by successive overwriting (local attributes -> local params -> basin params -> Noah-MP tables -> trialParams); a later source silently overrides an earlier one."
    - "Total runoff and ET are per-HRU surface fluxes; averageRoutedRunoff is sub-grid gamma routing, not channel discharge."
  assumptions:
    - statement: "Each HRU is treated as an independent 1-D vertical column (canopy + snow + soil + aquifer) with no lateral moisture exchange between GRUs."
      scope: "spatial geometry / domain decomposition"
      source: "SUMMA configuration docs (https://summa.readthedocs.io/en/latest/configuration/SUMMA_configuration/)"
      status: "adopted"
    - statement: "The model closes both a water mass balance and a surface energy balance on a common conservation core, with the conservation equations decoupled from the numerical solver."
      scope: "conservation / closure"
      source: "Clark et al. 2015 WRR (DOI:10.1002/2015WR017198) and https://ral.ucar.edu/model/summa"
      status: "adopted"
    - statement: "vGn_alpha is interpreted under SUMMA's negative matric-head sign convention (valid ~[-1.0,-0.01]); positive values are treated as an error, not an alternative convention."
      scope: "soil-parameter sign convention"
      source: "soil_utils.f90 / soilLiqFlx.f90 behavior and SUMMA parameter guidance"
      status: "adopted"
    - statement: "Only fDerivMeth=analytic is a valid numerical-derivative method; the numericl option is regarded as unimplemented rather than a selectable alternative."
      scope: "numerical solver configuration"
      source: "soilLiqFlx.f90 (err=20 cross-derivative guard) and mDecisions.f90"
      status: "adopted"
    - statement: "scalarTotalRunoff is a flux in m/s; gauged discharge is obtained as runoff x HRUarea with no division by water density, and runoff/ET unit families are kept distinct."
      scope: "output-units interpretation"
      source: "multiconst.f90 (iden_water=1000) and SUMMA output-units documentation"
      status: "adopted"
    - statement: "Soil-layer count nSoil in the cold state must equal the model's configured soil discretization; the default is 8 layers to ~4 m depth."
      scope: "state-vector / discretization"
      source: "SUMMA initial-conditions documentation and runtime dimension check"
      status: "adopted"
