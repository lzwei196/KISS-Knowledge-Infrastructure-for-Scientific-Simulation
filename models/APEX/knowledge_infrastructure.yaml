  - name: Maximum air temperature (TMAX)
    unit: degC
  - name: Minimum air temperature (TMIN)
    unit: degC
  - name: Solar radiation (SRAD)
    unit: MJ/m2/day
  - name: Wind speed
    unit: m/s
  - name: Relative humidity (RHM)
    unit: fraction (0-1)
  - name: Atmospheric CO2 concentration
    unit: ppm by volume
  parameters:
  - name: Crop growth coefficients
    unit: mixed
  - name: Soil profile hydraulic and chemical properties
    unit: mixed
  - name: Site geometry
    unit: mixed
  - name: Subarea routing geometry
    unit: mixed
  - name: Monthly weather-generator statistics
    unit: mixed
  - name: APEX general/internal parameters (PARM)
    unit: dimensionless
  initial_conditions:
  - name: Initial soil water content by layer
    unit: mm or fraction
  - name: Initial soil N (NO3) and P pool states
    unit: kg/ha
  - name: Initial surface residue mass
    unit: t/ha
  boundary_conditions:
  - name: Operation schedule (planting, tillage, fertilization, irrigation, harvest, kill, grazing)
    unit: date + rate
  - name: Run control settings
    unit: codes
  - name: PET equation selector (IET)
    unit: code
  - name: Water-erosion equation selector
    unit: code
  - name: Weather input/generate code (NGN)
    unit: code
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
