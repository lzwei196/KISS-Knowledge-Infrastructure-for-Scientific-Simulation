      short_citation: "Günther et al. 2019"
      doi: "10.1029/2018WR023403"
      note: "Sobol variance-based SA of ~230,000 FSM realizations at Kühtai; forcing error > structure > parameters for SWE."
    essery2013_1701_snowmodels:
      short_citation: "Essery et al. 2013"
      doi: "10.1016/j.advwatres.2012.07.013"
      note: "1701-configuration ensemble at Col de Porte; prognostic albedo + density + liquid-water storage give best/most consistent performance."
    essery2015_fsm10_factorial:
      short_citation: "Essery 2015"
      doi: "10.5194/gmd-8-3867-2015"
