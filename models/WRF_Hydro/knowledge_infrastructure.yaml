package:
  name: WRF_Hydro
  language: fortran
  implementation:
    id: wrf-hydro-standalone-520
    version: 5.2.0
    provenance: Fortran 90, MPI-parallel; NCAR WRF-Hydro/NDHMS standalone (offline) binary wrf_hydro.exe
      run via mpirun, no WRF atmospheric coupling.
  scientific_reference_version: WRF-Hydro v5.2.0 standalone/offline (Noah-MP LSM + gridded overland/subsurface/channel
    routing + conceptual groundwater bucket; NCAR NDHMS architecture)
  binary:
    path: KISSPATH_BINARIES/wrf_hydro/source/trunk/NDHMS/Run/wrf_hydro_NoahMP.exe
    type: null
pipeline:
  stages:
  - s11_output_interpretation_skill
  - s4_channel_routing_skill
  - s6_groundwater_skill
  - s9_runoff_options_skill
tools:
  count: 17
  files:
  - tools/calib_run.py
  - tools/run_wrfhydro_full_pipeline.py
  - tools/s10_execution/calibrate_wrfhydro.py
  - tools/s10_execution/run_wrfhydro.py
  - tools/s11_output/extract_discharge.py
  - tools/s1_domain/define_lambert_domain.py
  - tools/s2_geo_em/build_geo_em.py
  - tools/s3_wrfinput/build_wrfinput.py
  - tools/s4_fulldom/build_fulldom_hires.py
  - tools/s4_fulldom/build_route_link.py
  - tools/s4_fulldom/build_spatial_weights.py
  - tools/s5_soil_properties/build_soil_properties.py
