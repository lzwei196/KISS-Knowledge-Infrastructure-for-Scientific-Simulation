    percol
  remedy: 'Multiply Ksat by 24 to convert mm/h to mm/d; convert_soil_to_velma.py; [''Check Ksat source
    units in the soil database documentation'', ''If in mm/h, apply: Ksat_mmd = Ksat_mmh * 24'', ''If
    in cm/h, apply: Ksat_mmd = Ksat_cmh * 240'', ''Typical VELMA Ksat range: 10-500 mm/d depending on
    soil texture'']; Alw'
  severity: silent
- id: dt_velma_006
  symptom: 'Soil layer capacities are 100x too large. Layers never fill to field capacity. Model produces
    zero runoff and zero lateral flow for years because all precipitation is absorbed into enormous soil
