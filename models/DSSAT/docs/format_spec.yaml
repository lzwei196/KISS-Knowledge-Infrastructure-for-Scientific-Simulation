# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: DSSAT
  language: fortran
  implementation:
    id: dssat-csm-485
    version: 4.8.5 Build 41
    provenance: DSSAT-CSM Fortran source build 41 from github.com/DSSAT/dssat-csm-os; CMake + gfortran/Intel
      IFort; binary dscsm048.
  scientific_reference_version: DSSAT 4.8.5 cropping-system shell (Jones et al. 2003 modular CSM architecture;
    Hoogenboom et al. 2019)
inputs:
  forcing:
  - name: SRAD (solar radiation)
    unit: MJ/m2/day
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW (DSSAT fixed-width)
    notes: Range-checked 0-100; <0.1 silently clamped to 0.1 with WARNING; W/m2 must be converted (x0.0864).
  - name: TMAX (max air temperature)
    unit: deg C
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW
    notes: Must satisfy TMAX >= TMIN every day.
  - name: TMIN (min air temperature)
    unit: deg C
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW
  - name: RAIN (precipitation)
    unit: mm/day
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW
  - name: WIND
    unit: km/day
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW
    notes: Required if MEEVP=F (FAO-56 PM) or Z (ASCE); DSSAT expects km/day not m/s (x86.4).
  - name: TDEW / DEWP (dew-point temperature)
    unit: deg C
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW
    notes: Required for FAO-56 PM and ASCE ET options.
  - name: RHUM (relative humidity)
    unit: '%'
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW
  - name: PAR (photosynthetically active radiation)
    unit: moles/m2/day
    category: weather
    source_kind: forcing
    model_input_format: .WTH FileW
  - name: CO2 (atmospheric CO2 concentration)
    unit: ppm
    category: atmospheric
    source_kind: forcing
    model_input_format: ICO2 switch selects M=measured CO2xxx.WDA per year, D=static default ~380 ppm,
      W=from .WTH file
    notes: Time-varying atmospheric driver; affects photosynthesis via CO2 fertilization.
  parameters:
  - name: SALB (bare/dry surface albedo)
    unit: fraction
    category: soil_surface
    source_kind: calibrated
    model_input_format: .SOL profile header
  - name: SLU1 (stage-1 soil evaporation upper limit U)
    unit: mm
    category: soil_surface
    source_kind: calibrated
    model_input_format: .SOL profile header
  - name: SLDR (drainage rate SWCON)
    unit: fraction/day
    category: soil_surface
    source_kind: calibrated
    model_input_format: .SOL profile header
  - name: SLRO (SCS runoff curve number CN)
    unit: dimensionless
    category: soil_surface
    source_kind: calibrated
    model_input_format: .SOL profile header
  - name: SLNF (N mineralization factor)
    unit: fraction
    category: soil_surface
    source_kind: calibrated
    model_input_format: .SOL profile header
    notes: Silently clamped to 1.0 if outside [0,1].
  - name: SLPF (photosynthesis/growth factor)
    unit: fraction
    category: soil_surface
    source_kind: calibrated
    model_input_format: .SOL profile header
  - name: SLB (layer bottom depth)
    unit: cm
    category: soil_layer
    source_kind: dataset_lookup
    model_input_format: .SOL per-layer
    notes: Strictly monotonic; max NL=20 layers; layer 1 top fixed at 0 cm.
  - name: SLLL (lower limit / wilting point LL)
    unit: cm3/cm3
    category: soil_layer
    source_kind: calibrated
    model_input_format: .SOL per-layer
  - name: SDUL (drained upper limit / field capacity DUL)
    unit: cm3/cm3
    category: soil_layer
    source_kind: calibrated
    model_input_format: .SOL per-layer
  - name: SSAT (saturated water content SAT)
    unit: cm3/cm3
    category: soil_layer
    source_kind: calibrated
    model_input_format: .SOL per-layer
    notes: Must satisfy SLLL < SDUL < SSAT in every layer.
  - name: SRGF (relative root growth factor)
    unit: fraction
    category: soil_layer
    source_kind: calibrated
    model_input_format: .SOL per-layer
  - name: SSKS (saturated hydraulic conductivity)
    unit: cm/hr
    category: soil_layer
    source_kind: calibrated
    model_input_format: .SOL per-layer
  - name: SBDM (bulk density)
    unit: g/cm3
    category: soil_layer
    source_kind: dataset_lookup
    model_input_format: .SOL per-layer
  - name: SLOC (organic carbon)
    unit: '%'
    category: soil_layer
    source_kind: dataset_lookup
    model_input_format: .SOL per-layer
  - name: SLCL/SLSI/SLCF (clay/silt/coarse-fragment fractions)
    unit: '%'
    category: soil_layer
    source_kind: dataset_lookup
    model_input_format: .SOL per-layer
  - name: SLNI (total N)
    unit: '%'
    category: soil_layer
    source_kind: dataset_lookup
    model_input_format: .SOL per-layer
  - name: SLHW/SLHB (pH in water / buffer)
    unit: pH units
    category: soil_layer
    source_kind: dataset_lookup
    model_input_format: .SOL per-layer
  - name: SCEC (cation exchange capacity)
    unit: cmol/kg
    category: soil_layer
    source_kind: dataset_lookup
    model_input_format: .SOL per-layer
  - name: TAV (annual mean air temperature)
    unit: deg C
    category: weather_climatology
    source_kind: calibrated
    model_input_format: .WTH station header
    notes: Defaults silently to 20 deg C if missing/<=0; controls soil temperature seasonality.
  - name: AMP / TAMP (annual amplitude of monthly mean T)
    unit: deg C
    category: weather_climatology
    source_kind: calibrated
    model_input_format: .WTH station header
    notes: Defaults silently to 5 deg C if missing/<=0.
  - name: LAT, LONG, ELEV, REFHT, WNDHT (station geometry)
    unit: degrees / m
    category: weather_station
    source_kind: dataset_lookup
    model_input_format: .WTH station header
  - name: CERES grain coefficients (e.g., P1, P2/P2O, P2R, P5, G1, G2, G3, PHINT, P1D, P1V, VEFF, THOT)
    unit: mixed (GDD, hours, GDD/h, count, g, dimensionless)
    category: cultivar
    source_kind: calibrated
    model_input_format: .CUL (e.g., MZCER048.CUL, WHCER048.CUL, RICER048.CUL)
    notes: Range bounds in .SPE MINIMA/MAXIMA are documentation only; out-of-range values run silently.
  - name: CROPGRO photothermal coefficients (CSDL, PPSEN, EM-FL, FL-SD, SD-PM, LFMAX, SLAVR, WTPSD, etc.)
    unit: mixed (h, 1/h, photothermal days, mg CO2/m2/s, cm2/g, g)
    category: cultivar
    source_kind: calibrated
    model_input_format: .CUL (e.g., SBGRO048.CUL)
  - name: Ecotype coefficients
    unit: mixed
    category: ecotype
    source_kind: calibrated
    model_input_format: .ECO (e.g., SBGRO048.ECO; not used for some CERES crops like rice)
  - name: Species coefficients (cardinal temperatures, RUE, partitioning rules, MINIMA/MAXIMA bounds)
    unit: mixed
    category: species
    source_kind: calibrated
    model_input_format: .SPE (e.g., MZCER048.SPE)
  initial_conditions:
  - name: SH2O (initial volumetric soil water by layer)
    unit: cm3/cm3
    category: soil_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS layer fields (ICBL must match .SOL SLB)
    notes: Silently clamped to [LL, SAT] at initialization.
  - name: SNO3 (initial soil nitrate by layer)
    unit: ppm
    category: soil_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS layer fields
    notes: Defaults to 0.1 ppm when ISWNIT=N; no upper bound enforced; unit confusion (kg/ha vs ppm) silently
      inflates yield.
  - name: SNH4 (initial soil ammonium by layer)
    unit: ppm
    category: soil_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS layer fields
  - name: ICRES (initial surface residue mass)
    unit: kg/ha
    category: residue_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS header
  - name: ICREN, ICREP, ICRIP, ICRID (residue %N, %P, % incorporated, incorporation depth)
    unit: '% / cm'
    category: residue_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS header
  - name: PCR (previous crop code)
    unit: 2-char code
    category: legacy_crop
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS header
  - name: ICRT, ICND, ICRN, ICRE (initial root weight, nodules, root N, root growth params)
    unit: kg/ha / mixed
    category: soil_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS header
  - name: ICWD (water-table depth)
    unit: cm (-99 if none)
    category: soil_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS header
  - name: ICDAT (initial-conditions date)
    unit: YYDDD Julian
    category: soil_state
    source_kind: user_provided
    model_input_format: FileX *INITIAL CONDITIONS header
    notes: Must be <= SDATE.
  boundary_conditions:
  - name: SDATE (simulation start date)
    unit: YYDDD Julian
    category: control
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS GENERAL
    notes: Must satisfy SDATE <= PDATE (earliest management event).
  - name: NYERS (number of simulated years)
    unit: count
    category: control
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS GENERAL
  - name: SMODEL (8-char crop model identifier)
    unit: code
    category: control
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS GENERAL
    notes: Blank defaults to DSSATPRO mapping; wrong code silently misinterprets cultivar coefficients.
  - name: WATER, NITRO, SYMBI, PHOSP, POTAS, DISES, CHEM, TILL (process toggles ISWWAT/ISWNIT/ISWSYM/ISWPHO/ISWPOT/ISWDIS/ISWCHE/ISWTIL)
    unit: Y/N
    category: control_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS OPTIONS
    notes: WATER=N forces NITRO and PHOSP to N; SYMBI valid only for legumes.
  - name: MEEVP / EVAPO (ET method)
    unit: code (R/P/F/Z/D/M/H/T)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
    notes: R=Ritchie (default), P=Priestley-Taylor, F=FAO-56 Penman-Monteith, Z=ASCE.
  - name: MESEV (soil evaporation method)
    unit: code (S/R)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
    notes: S=Suleiman-Ritchie (recommended); R=old Ritchie two-stage (code default when section absent).
  - name: MEINF / INFIL (infiltration method)
    unit: code (S/N/R)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
  - name: MEPHO / PHOTO (photosynthesis method)
    unit: code (L/C/R)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
    notes: L=leaf-level daily (required for CROPGRO crops), C=hourly canopy (ETPHOT), R=RUE radiation-use-efficiency
      (CERES default).
  - name: MEHYD / HYDRO (hydrology method)
    unit: code (R)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
  - name: MESOM (SOM engine)
    unit: code (G/P)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
    notes: G=Godwin/CERES single-pool; P=Parton/Century multi-pool (requires mesic spin-up).
  - name: MESOL (soil-layer redistribution)
    unit: code (1/2/3)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
  - name: METMP (soil temperature method)
    unit: code (D/E)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
    notes: D=DSSAT-Kimball improved (v4.8+); E=EPIC.
  - name: MEGHG (greenhouse-gas method)
    unit: code (0/1)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
    notes: 0=DSSAT original denitrification; 1=DayCent N2O.
  - name: MEWTH / WTHER (weather source)
    unit: code (M/G/S)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
  - name: ICO2 (CO2 source switch)
    unit: code (M/D/W)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
  - name: INCON (initial-conditions source)
    unit: code (M/S)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
  - name: NSWIT (N routine selector)
    unit: code (1)
    category: method_switch
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS METHODS
  - name: 'IPLTI, IIRRI, IFERI, IHARI (planting/irrigation/fertilizer/harvest mode: R reported, A automatic,
      N none, F/D variants)'
    unit: code
    category: management_mode
    source_kind: user_provided
    model_input_format: FileX *SIMULATION CONTROLS MANAGEMENT
  - name: PDATE (planting date)
    unit: YYDDD Julian
    category: management_planting
    source_kind: user_provided
    model_input_format: FileX *PLANTING DETAILS
  - name: PPOP (plant population)
    unit: plants/m2
    category: management_planting
    source_kind: user_provided
    model_input_format: FileX *PLANTING DETAILS
  - name: PLRS (row spacing)
    unit: cm
    category: management_planting
    source_kind: user_provided
    model_input_format: FileX *PLANTING DETAILS
  - name: PLDP (planting depth)
    unit: cm
    category: management_planting
    source_kind: user_provided
    model_input_format: FileX *PLANTING DETAILS
  - name: INGENO (cultivar code)
    unit: 6-char code
    category: management_planting
    source_kind: user_provided
    model_input_format: FileX *CULTIVARS (must match VAR# in .CUL for selected crop model)
  - name: Irrigation events {IDATE, IRVAL amount, IROP method, EFIR efficiency}
    unit: YYDDD / mm / code / fraction
    category: management_irrigation
    source_kind: user_provided
    model_input_format: FileX *IRRIGATION AND WATER MANAGEMENT
  - name: Fertilizer events {FDATE, FAMN N rate, FAMP P rate, FAMK K rate, FMCD method code, FDEP depth}
    unit: YYDDD / kg/ha / code / cm
    category: management_fertilizer
    source_kind: user_provided
    model_input_format: FileX *FERTILIZERS (INORGANIC)
    notes: Invalid FMCD silently reset to '001' broadcast.
  - name: Organic-residue events
    unit: mixed
    category: management_residue
    source_kind: user_provided
    model_input_format: FileX *RESIDUES
  - name: Tillage events
    unit: mixed
    category: management_tillage
    source_kind: user_provided
    model_input_format: FileX *TILLAGE
  - name: Chemical/pesticide events
    unit: mixed
    category: management_chemical
    source_kind: user_provided
    model_input_format: FileX *CHEMICAL
  - name: Harvest events {HDATE, HPC harvest %, HBPC by-product %, HSTG harvest stage}
    unit: YYDDD / %
    category: management_harvest
    source_kind: user_provided
    model_input_format: FileX *HARVEST
  - name: Automatic-management thresholds (PWDINF/PWDINL window, soil-moisture/temperature criteria, irrigation/fertilizer
      triggers)
    unit: mixed
    category: management_auto
    source_kind: user_provided
    model_input_format: FileX @AUTOMATIC MANAGEMENT
  - name: WSTA (4-char weather-station code linking to .WTH)
    unit: code
    category: linkage
    source_kind: user_provided
    model_input_format: FileX *FIELDS
  - name: ID_SOIL (10-char soil-profile code linking to .SOL pedon)
    unit: code
    category: linkage
    source_kind: user_provided
    model_input_format: FileX *FIELDS
    notes: SLNO='-99' or blank silently substitutes a 1-layer generic default soil.
outputs:
  primary:
  - name: HWAM (harvested grain yield at maturity, dry)
    unit: kg/ha
    description: Dry grain/seed yield at physiological maturity per treatment - the canonical end-of-season
      yield variable.
    validation_rank: 1
    emitted_in: Summary.OUT
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - 'Single-year/single-site comparison: only a magnitude check is meaningful; r/NSE/KGE are structurally
          undefined for a single (sim, obs) pair.'
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - ranking_quality
        determining_metric: pbias
        caveats:
        - Multi-year same-site requires NYERS >= 2 and consistent cultivar/management; inter-annual signal
          is weather-driven.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/sub-national yield aggregates carry a technology/cultivar-improvement trend that a
          weather-only point process model cannot reproduce; detrend before comparing temporal patterns.
      - obs_shape: regional_aggregate_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-year aggregate yield (e.g., FAOSTAT one year, national); scalar check only.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - DSSAT has no built-in spatial mode; a 'field' is constructed by running many point simulations
          on a grid; per-pixel comparison only makes sense if cultivar/management/soil are spatially varied
          consistently with the obs.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Requires a gridded ensemble of DSSAT point runs over multiple seasons; per-pixel comparison
          only valid where cultivar/management/soil vary consistently with the obs.
      detrending_options:
      - none
      - first_difference
      - linear_residual
      - decadal_mean
  - name: HWAH (harvested yield, dry, at harvest date)
    unit: kg/ha
    description: Yield actually harvested = HWAM * HPC/100; zero when crop never matured or HPC=0.
    validation_rank: 2
    emitted_in: Summary.OUT
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/sub-national harvested yield aggregates carry a technology/cultivar-improvement trend
          that a weather-only point process model cannot reproduce; detrend before comparing temporal
          patterns; HPC must be set or HWAH=0.
      - obs_shape: regional_aggregate_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-year aggregate; one point comparison only.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - DSSAT has no built-in spatial mode; construct a gridded ensemble.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Gridded ensemble of point runs; align cultivar/management/soil spatially.
      detrending_options:
      - none
      - first_difference
      - linear_residual
      - decadal_mean
  - name: CWAM (aboveground biomass at maturity)
    unit: kg/ha
    description: Tops dry weight at physiological maturity.
    validation_rank: 3
    emitted_in: Summary.OUT
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/sub-national biomass aggregates carry a technology/cultivar-improvement trend that
          a weather-only point process model cannot reproduce; detrend before comparing temporal patterns.
      - obs_shape: regional_aggregate_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-year aggregate biomass; scalar check only.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - DSSAT has no built-in spatial mode; construct a gridded ensemble for biomass fields.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Gridded ensemble of point runs over multiple seasons; align cultivar/management/soil spatially.
      detrending_options:
      - none
      - first_difference
      - linear_residual
      - decadal_mean
  - name: HIAM (harvest index at maturity)
    unit: fraction
    description: Grain / aboveground biomass ratio at maturity.
    validation_rank: 10
    emitted_in: Summary.OUT
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
  - name: ADAT (anthesis date)
    unit: YRDOY
    description: Day of year of anthesis/flowering for the simulated season.
    validation_rank: 11
    emitted_in: Summary.OUT
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - timing_accuracy
        determining_metric: day_bias
        caveats:
        - Compare as DOY (after stripping YYYY); year-boundary issues if YRDOY is treated as raw integer.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - timing_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  - name: MDAT (physiological maturity date)
    unit: YRDOY
    description: Day of year when the simulated crop reaches physiological maturity.
    validation_rank: 12
    emitted_in: Summary.OUT
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - timing_accuracy
        determining_metric: day_bias
        caveats:
        - ADAT > MDAT is biologically impossible and indicates a YRDOY parsing bug, not a model error.
      - obs_shape: point_time_series
