      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      applicability: "equal-intensity networks with differing backbone topology"
      citations: ["hyman2019_structural_transport_linking"]
    - from: "fracture_radius_length_distribution"
      to: "effective_permeability"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
