# =============================================================================
# Knowledge Infrastructure: HYPE (HYdrological Predictions for the Environment) v5.35.0
# =============================================================================

package:
  name: "hype-hydrocraft"
  version: "1.0.0"
  description: "Knowledge infrastructure for HYPE v5.35.0 — semi-distributed hydrology with integrated nutrient transport"
  target_model: "HYPE v5.35.0"
  domain: "semi-distributed hydrology, water quality (N/P), lake regulation"
  authors:
    - "Zhang Jianyun Research Group, Hohai University"
  license: "LGPL-3.0"

pipeline:
  stages:
    - id: s1_subbasin_delineation
      name: "Subbasin Delineation & MAINDOWN Topology"
      description: "Delineate subbasins from DEM and define MAINDOWN routing network"
      order: 1
      depends_on: []
      skill_document: "docs/s1_subbasin_skill.md"
      tools: [delineate_subbasins, validate_topology]
      milestones:
        - id: m1_subbasins_delineated
          description: "Subbasin shapefile and MAINDOWN table exist"
          verification: "test -f subbasins.shp && test -f maindown.csv"

    - id: s2_slc_classification
      name: "SLC (Soil-Land use Class) Classification"
      description: "Compute SLC fractions per subbasin from AVHRR landcover + HWSD soil"
      order: 2
      depends_on: [s1_subbasin_delineation]
      skill_document: "docs/s2_slc_skill.md"
      tools: [compute_slc_fractions, generate_geoclass]
      milestones:
        - id: m2_slc_computed
          description: "SLC fractions computed, GeoClass.txt generated"
          verification: "test -f GeoClass.txt"

    - id: s3_forcing_preparation
      name: "Meteorological Forcing Preparation"
      description: "Convert CMFD/MSWX 3-hourly to daily Pobs.txt + Tobs.txt + ForcKey.txt"
      order: 3
      depends_on: [s1_subbasin_delineation]
      skill_document: "docs/s3_forcing_skill.md"
      tools: [convert_forcing_to_hype]
      milestones:
        - id: m3_forcing_ready
          description: "Pobs.txt, Tobs.txt, and ForcKey.txt exist in forcingdir"
          verification: "test -f forcingdir/Pobs.txt && test -f forcingdir/Tobs.txt"

    - id: s4_geodata_generation
      name: "GeoData Generation"
      description: "Generate GeoData.txt from subbasin shapefiles + SLC fractions + DEM statistics"
      order: 4
      depends_on: [s1_subbasin_delineation, s2_slc_classification]
      skill_document: "docs/s4_geodata_skill.md"
      tools: [generate_geodata, validate_geodata]
      milestones:
        - id: m4_geodata_valid
          description: "GeoData.txt exists and passes topology validation"
          verification: "python validate_geodata.py --geodata modelfiles/GeoData.txt"

    - id: s5_parameter_setup
      name: "Parameter Setup"
      description: "Generate par.txt from World-Wide HYPE defaults or literature values"
      order: 5
      depends_on: [s2_slc_classification]
      skill_document: "docs/s5_parameter_skill.md"
      tools: [setup_parameters, extract_wwh_params]
      milestones:
        - id: m5_params_ready
          description: "par.txt exists with correct number of values per parameter"
          verification: "test -f modelfiles/par.txt"

    - id: s6_lake_reservoir_config
      name: "Lake & Reservoir Configuration (Optional)"
      description: "Configure LakeData.txt and DamData.txt from HydroLAKES + GRanD"
      order: 6
      depends_on: [s1_subbasin_delineation]
      skill_document: "docs/s6_lake_skill.md"
      tools: [setup_lake_data]
      milestones:
        - id: m6_lake_configured
          description: "LakeData.txt exists (if lakes present in basin)"
          verification: "test -f modelfiles/LakeData.txt || echo 'no lakes'"

    - id: s7_execution
      name: "HYPE Execution"
      description: "Generate info.txt, run HYPE, parse log for errors"
      order: 7
      depends_on: [s3_forcing_preparation, s4_geodata_generation, s5_parameter_setup]
      skill_document: "docs/s7_execution_skill.md"
      tools: [configure_info, run_hype]
      milestones:
        - id: m7_run_complete
          description: "HYPE exited with code 0, timeCOUT.txt exists"
          verification: "test -f resultdir/timeCOUT.txt"

    - id: s8_output_analysis
      name: "Output Analysis & Cross-Model Comparison"
      description: "Parse HYPE output, compute metrics, compare with VIC discharge"
      order: 8
      depends_on: [s7_execution]
      skill_document: "docs/s8_analysis_skill.md"
      tools: [parse_hype_output, plot_hype_results, compare_vic_hype]
      milestones:
        - id: m8_results_analyzed
          description: "Performance metrics computed and plots generated"
          verification: "test -f results/discharge_comparison.png"

tools:
  - id: delineate_subbasins
    name: "Delineate Subbasins with MAINDOWN Topology"
    description: "Multi-subbasin delineation from DEM using WhiteboxTools, outputs shapefile + MAINDOWN CSV"
    stage: s1_subbasin_delineation
    script_path: "tools/s1_subbasin_delineation/delineate_subbasins.py"
    language: python

  - id: validate_topology
    name: "Validate MAINDOWN Topology"
    description: "Check MAINDOWN network for cycles, disconnected subbasins, correct outlet"
    stage: s1_subbasin_delineation
    script_path: "tools/s1_subbasin_delineation/validate_topology.py"
    language: python

  - id: compute_slc_fractions
    name: "Compute SLC Fractions"
    description: "Compute soil-landcover class fractions per subbasin from AVHRR + HWSD"
    stage: s2_slc_classification
    script_path: "tools/s2_slc_classification/compute_slc_fractions.py"
    language: python

  - id: generate_geoclass
    name: "Generate GeoClass.txt"
    description: "Create GeoClass.txt with SLC class definitions and soil layer depths"
    stage: s2_slc_classification
    script_path: "tools/s2_slc_classification/generate_geoclass.py"
    language: python

  - id: convert_forcing_to_hype
    name: "Convert Forcing to HYPE Format"
    description: "Convert CMFD/MSWX 3-hourly gridded forcing to daily Pobs.txt + Tobs.txt per subbasin"
    stage: s3_forcing_preparation
    script_path: "tools/s3_forcing_preparation/convert_forcing_to_hype.py"
    language: python

  - id: generate_geodata
    name: "Generate GeoData.txt"
    description: "Create GeoData.txt from subbasin shapefile, SLC fractions, DEM stats"
    stage: s4_geodata_generation
    script_path: "tools/s4_geodata_generation/generate_geodata.py"
    language: python

  - id: validate_geodata
    name: "Validate GeoData.txt"
    description: "Check GeoData.txt topology, SLC sum, required columns, MAINDOWN ordering"
    stage: s4_geodata_generation
    script_path: "tools/s4_geodata_generation/validate_geodata.py"
    language: python

  - id: setup_parameters
    name: "Setup par.txt"
    description: "Generate par.txt with parameter values from WWH defaults or manual specification"
    stage: s5_parameter_setup
    script_path: "tools/s5_parameter_setup/setup_parameters.py"
    language: python

  - id: extract_wwh_params
    name: "Extract WWH Parameters"
    description: "Extract World-Wide HYPE parameter values for a given region/climate zone"
    stage: s5_parameter_setup
    script_path: "tools/s5_parameter_setup/extract_wwh_params.py"
    language: python

  - id: setup_lake_data
    name: "Setup LakeData.txt"
    description: "Configure lakes/reservoirs from HydroLAKES + GRanD databases"
    stage: s6_lake_reservoir_config
    script_path: "tools/s6_lake_reservoir_config/setup_lake_data.py"
    language: python

  - id: configure_info
    name: "Generate info.txt"
    description: "Generate HYPE info.txt configuration file with model options and output control"
    stage: s7_execution
    script_path: "tools/s7_execution/configure_info.py"
    language: python

  - id: run_hype
    name: "Run HYPE"
    description: "Execute HYPE with progress monitoring, log parsing, and error handling"
    stage: s7_execution
    script_path: "tools/s7_execution/run_hype.py"
    language: python

  - id: parse_hype_output
    name: "Parse HYPE Output"
    description: "Read timeCOUT.txt/mapCOUT.txt into pandas DataFrame or NetCDF"
    stage: s8_output_analysis
    script_path: "tools/s8_output_analysis/parse_hype_output.py"
    language: python

  - id: plot_hype_results
    name: "Plot HYPE Results"
    description: "Generate discharge time series and spatial map plots from HYPE output"
    stage: s8_output_analysis
    script_path: "tools/s8_output_analysis/plot_hype_results.py"
    language: python

  - id: compare_vic_hype
    name: "Compare VIC vs HYPE"
    description: "Cross-model discharge comparison with NSE, KGE, PBIAS metrics"
    stage: s8_output_analysis
    script_path: "tools/s8_output_analysis/compare_vic_hype.py"
    language: python

