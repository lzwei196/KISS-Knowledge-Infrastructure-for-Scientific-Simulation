template_version: "3.5"

identity:
  model_id: "KINEROS2"
  scientific_reference_version: "KINEROS2 (USDA-ARS Kinematic Runoff and Erosion Model lineage; Woolhiser/Smith/Goodrich), instantiated here as a lumped daily continuous Green-Ampt + dual-reservoir kinematic-wave reimplementation"
  implementation:
    id: "hydrocraft-kineros2-lumped"
    version: "1.0.0"
    provenance: "Python; HydroCraft lumped daily continuous reimplementation of KINEROS2 physics (Green-Ampt infiltration + dual nonlinear/linear reservoir kinematic-wave routing). NOT the canonical USDA-ARS event-based distributed Fortran binary."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "Public domain (USDA-ARS lineage)"
  repo_url: ""

boundary:
  scope_in:
    - "Daily basin-average precipitation partitioning via Green-Ampt infiltration"
    - "Infiltration-excess (Hortonian) surface runoff generation"
    - "Lumped soil-moisture accounting with ET extraction and gravity drainage"
    - "Dual-reservoir kinematic-wave-analog routing (fast surface + slow baseflow) to outlet discharge"
    - "Internal Hamon PET from temperature and latitude"
  scope_out:
    - "Distributed cascading-plane / channel-element routing of the canonical KINEROS2 (collapsed to a lumped basin here)"
    - "Sub-daily event-scale storm hydrograph resolution"
    - "Erosion / sediment transport (native to KINEROS2 lineage but not emitted by this lumped daily reimplementation)"
    - "Channel transmission losses, backwater, and diffusive-wave attenuation"
    - "Snow / glacier processes and explicit groundwater dynamics beyond the conceptual slow reservoir"
  spatial: "0-D point"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Lumped basin-average water mass balance: precipitation is partitioned by Green-Ampt into infiltration and surface excess; soil-moisture storage closes against ET (Hamon) and gravity drainage; routed runoff is conserved through fast and slow reservoirs to outlet discharge. No surface energy-balance closure (PET is Hamon temperature-index, not a closed energy budget). The canonical KINEROS2 solves distributed kinematic-wave continuity at sub-event timesteps; that distributed/energy-resolved physics is collapsed to a 0-D daily conceptualization here, which the KI itself flags as a significant extrapolation when applied to large basins."

inputs:
  forcing:
    - category: "atmospheric"
      name: "precipitation"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: "daily basin-average precipitation time series"
      notes: "Drives Green-Ampt infiltration and infiltration-excess runoff. Model performs NO internal unit conversion; native sources are commonly kg/m2/s, mm/3h, or m/d and must be converted to mm/d before entry (see safety.hazards)."
    - category: "atmospheric"
      name: "temperature"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "daily mean air temperature time series"
      notes: "Consumed internally by the Hamon PET routine. Native sources commonly in Kelvin; model expects deg C."
  parameters:
    - category: "infiltration"
      name: "Ks"
      unit: "mm/d"
      source_kind: "calibrated"
      model_input_format: "scalar Green-Ampt saturated hydraulic conductivity"
      notes: "Green-Ampt saturated hydraulic conductivity; very high sensitivity. Typical range [1,80] mm/d. May be estimated from soil texture via pedotransfer functions."
    - category: "infiltration"
      name: "psi_f"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "scalar Green-Ampt wetting-front suction head"
      notes: "Wetting-front suction (net capillary drive analog); typical range [10,500] mm."
    - category: "soil_storage"
      name: "Smax"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "scalar maximum soil-moisture storage capacity"
      notes: "Maximum soil-moisture storage; typical range [100,800] mm."
    - category: "soil_storage"
      name: "fc"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "field capacity as fraction of Smax"
      notes: "Field capacity fraction; typical range [0.2,0.8]. Sets gravity-drainage threshold."
    - category: "routing"
      name: "k_fast"
      unit: "1/d"
      source_kind: "calibrated"
      model_input_format: "fast-reservoir recession rate"
      notes: "Fast (surface) nonlinear-reservoir recession; typical range [0.01,0.5] 1/d."
    - category: "routing"
      name: "k_slow"
      unit: "1/d"
      source_kind: "calibrated"
      model_input_format: "slow-reservoir recession rate"
      notes: "Slow (baseflow) linear-reservoir recession; typical range [0.001,0.05] 1/d."
    - category: "routing"
      name: "f_slow"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "fraction of runoff routed to slow reservoir"
      notes: "Runoff split to baseflow reservoir; typical range [0.1,0.7]."
    - category: "routing"
      name: "alpha"
      unit: "unitless"
      source_kind: "calibrated"
      model_input_format: "fast-reservoir kinematic-wave routing exponent"
      notes: "Nonlinear storage-discharge exponent; physical reference ~5/3 (1.667, Manning). Typical range [1.0,2.0]; low sensitivity."
    - category: "geophysical"
      name: "basin_area"
      unit: "km2"
      source_kind: "dataset_lookup"
      model_input_format: "scalar basin drainage area"
      notes: "Required for mm/d-to-m3/s discharge conversion (Q_m3s = Q_mmd * area_km2 * 1e6 / 86400 / 1000)."
    - category: "geophysical"
      name: "latitude"
      unit: "deg"
      source_kind: "dataset_lookup"
      model_input_format: "scalar basin latitude"
      notes: "Used by the Hamon PET routine."
  initial_conditions:
    - category: "soil_state"
      name: "initial_soil_moisture_storage"
      unit: "mm"
      source_kind: "user_provided"
      model_input_format: "initial soil-moisture reservoir level"
      notes: "Tracked between days for continuous use; a warm-start near ~0.5*Smax with a >=1 year spinup (excluded from metrics) is required to avoid first-year transients."
    - category: "routing_state"
      name: "initial_reservoir_storage"
      unit: "mm"
      source_kind: "user_provided"
      model_input_format: "initial fast/slow reservoir storage"
      notes: "Slow-reservoir initial level affects early baseflow; absorbed during spinup."
  boundary_conditions: []

processes:
  modules:
    - name: "HamonPET"
      role: "process_solver"
      brief: "Computes potential evapotranspiration internally from daily temperature and latitude (Hamon temperature-index method)."
    - name: "GreenAmptInfiltration"
      role: "process_solver"
      brief: "Partitions daily precipitation into infiltration and surface excess via wetting-front approximation f(t)=Ks*(1+psi_f*delta_theta/F), where F is cumulative infiltration and delta_theta the soil-moisture deficit."
    - name: "SoilMoistureAccounting"
      role: "process_solver"
      brief: "Lumped soil-water balance: bounds storage by Smax, extracts actual ET proportional to available water above wilting point against Hamon PET demand, and drains by gravity above field capacity fc."
    - name: "DualReservoirRouting"
      role: "integrator"
      brief: "Routes surface excess and drainage through a fast nonlinear reservoir (Q=k_fast*S^alpha) and a slow linear reservoir (recession k_slow), with split fraction f_slow, approximating kinematic-wave behavior at the lumped daily scale."
    - name: "DischargeConversion"
      role: "integrator"
      brief: "Converts routed runoff depth (mm/d) to outlet volumetric discharge (m3/s) using basin_area."
  internal_edges:
    - from: "precipitation"
      to: "GreenAmptInfiltration"
      kind: "consumes_input"
      brief: "Daily precipitation drives infiltration partitioning."
    - from: "temperature"
      to: "HamonPET"
      kind: "consumes_input"
      brief: "Daily temperature (with latitude) drives PET."
    - from: "HamonPET"
      to: "SoilMoistureAccounting"
      kind: "invokes"
      brief: "PET sets the ET demand extracted from soil storage."
    - from: "GreenAmptInfiltration"
      to: "cumulative_infiltration_F"
      kind: "writes_state"
      brief: "Infiltrated depth accumulates into F, which feeds back into the Green-Ampt rate."
    - from: "GreenAmptInfiltration"
      to: "SoilMoistureAccounting"
      kind: "invokes"
      brief: "Infiltrated water enters the soil-moisture reservoir."
    - from: "SoilMoistureAccounting"
      to: "soil_moisture_storage"
      kind: "writes_state"
      brief: "Updates soil-moisture storage after infiltration gain, ET loss, and drainage."
    - from: "GreenAmptInfiltration"
      to: "DualReservoirRouting"
      kind: "invokes"
      brief: "Infiltration-excess surface runoff becomes inflow to the routing reservoirs."
    - from: "SoilMoistureAccounting"
      to: "DualReservoirRouting"
      kind: "invokes"
      brief: "Gravity drainage contributes to (slow) reservoir inflow."
    - from: "DualReservoirRouting"
      to: "fast_reservoir_storage"
      kind: "writes_state"
      brief: "Updates fast nonlinear reservoir storage."
    - from: "DualReservoirRouting"
      to: "slow_reservoir_storage"
      kind: "writes_state"
      brief: "Updates slow linear (baseflow) reservoir storage."
    - from: "DualReservoirRouting"
      to: "DischargeConversion"
      kind: "invokes"
      brief: "Combined fast+slow reservoir outflow is passed to discharge conversion."
    - from: "DischargeConversion"
      to: "Outputs"
      kind: "produces_output"
      brief: "Emits daily outlet discharge in m3/s."

states:
  variables:
    - name: "soil_moisture_storage"
      unit: "mm"
      role: "prognostic"
    - name: "cumulative_infiltration_F"
      unit: "mm"
      role: "accumulator"
    - name: "fast_reservoir_storage"
      unit: "mm"
      role: "prognostic"
    - name: "slow_reservoir_storage"
      unit: "mm"
      role: "prognostic"
  provenance: "structural"

outputs:
  - var: "discharge"
    validation_rank: 1
    unit: "m3/s"
    description: "Daily simulated streamflow at the basin outlet."
    emitted_in: "daily discharge output series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Exclude the spinup period (typically >=1 year) before computing metrics."
            - "Lumped dual-reservoir routing cannot resolve the travel-time distribution of large basins (>100 km2); peak-timing error is inherent and expected when extrapolated beyond the small-watershed design domain."
            - "Sim and obs must share the same units (m3/s); a unit mismatch yields NSE << 0."
      detrending_options:
        - "none"
  - var: "infiltration"
    validation_rank: 2
    unit: "mm/d"
    description: "Green-Ampt infiltration into the soil column."
    emitted_in: "daily water-balance output series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Rarely directly observed; usually evaluated only as an internal water-balance diagnostic."
      detrending_options:
        - "none"
  - var: "surface_excess"
    validation_rank: 3
    unit: "mm/d"
    description: "Infiltration-excess (Hortonian) surface runoff: precipitation minus infiltration capacity."
    emitted_in: "daily water-balance output series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Internal flux; comparable to observations only after routing to outlet discharge."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "Ks"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "infiltration-excess runoff volume and peak; canonical-KINEROS2 SA, maps to the lumped Green-Ampt Ks"
      citations:
        - "hantush2005_kineros2_uncertainty_sensitivity"
        - "alqurashi2008_kineros2_oman_arid"
        - "korgaonkar2020_kineros2_starvars_gsa"
        - "goodrich2012_kineros2_agwa_calibration"
        - "kennedy2013_kineros2_residential_runoff"
    - from: "psi_f"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "wetting-front net capillary drive (G); second only to Ks for flow-discharge uncertainty"
      citations:
        - "hantush2005_kineros2_uncertainty_sensitivity"
        - "alqurashi2008_kineros2_oman_arid"
    - from: "initial_soil_moisture_storage"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "antecedent/initial relative saturation; most sensitive for most flow responses except peak arrival time"
      citations:
        - "hantush2005_kineros2_uncertainty_sensitivity"
    - from: "precipitation"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      applicability: "rainfall was the single most sensitive factor in STAR-VARS GSA; controls peak flow and reorders all other parameter rankings"
      citations:
        - "korgaonkar2020_kineros2_starvars_gsa"
  citation_index:
    hantush2005_kineros2_uncertainty_sensitivity:
      short_citation: "Hantush & Kalin 2005"
      doi: "10.1623/hysj.2005.50.6.1151"
      note: "Monte Carlo uncertainty/sensitivity of KINEROS2 runoff and sediment in a small agricultural watershed; Ks, net capillary drive, and initial relative saturation dominate flow; median particle size and cohesion dominate sediment."
    alqurashi2008_kineros2_oman_arid:
      short_citation: "Al-Qurashi et al. 2008"
      doi: "10.1016/j.jhydrol.2008.03.006"
      note: "27-event Monte Carlo SA (20,000 runs/event, 11 params) in an arid Oman catchment; Ks most sensitive, then net capillary drive G and overland Manning's n."
    korgaonkar2020_kineros2_starvars_gsa:
      short_citation: "Korgaonkar et al. 2020"
      doi: "10.1016/j.envsoft.2020.104814"
      note: "STAR-VARS variance-based global SA of 15-17 KINEROS2 (green-infrastructure) parameters; rainfall most sensitive, then Ks, rock fraction, surface roughness."
    goodrich2012_kineros2_agwa_calibration:
      short_citation: "Goodrich et al. 2012"
      doi: "10.13031/2013.42072"
      note: "KINEROS2/AGWA use, calibration and validation; Ks and Manning's roughness identified as the dominant calibration parameters for runoff peaks and volumes."
    kennedy2013_kineros2_residential_runoff:
      short_citation: "Kennedy et al. 2013"
      doi: "10.1061/(ASCE)HE.1943-5584.0000655"
      note: "KINEROS2 residential-development runoff study; a 53% decrease in Ks of pervious areas accounted for ~17% of modeled runoff increase, confirming Ks as the dominant runoff control."

safety:
  hazards:
    - id: "precip_kgm2s_not_mmd"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in kg/m2/s instead of mm/d (1 kg/m2/s = 86400 mm/d) yields near-zero infiltration excess and a near-flat hydrograph 86400x too low."
      severity: "fatal"
    - id: "precip_mm3h_as_daily"
      kind: "weather_file_semantic"
      description: "3-hourly precipitation accumulations treated as daily totals over-precipitate by ~8x, causing unrealistic flooding; the eight sub-daily values must be summed per day."
      severity: "degraded"
    - id: "temperature_kelvin_into_hamon"
      kind: "weather_file_semantic"
      description: "Temperature supplied in Kelvin (or deg F) instead of deg C produces absurdly high Hamon PET, instant soil drying, and suppressed runoff."
      severity: "degraded"
    - id: "ks_mmh_not_mmd"
      kind: "soil_semantic"
      description: "Saturated conductivity Ks supplied in mm/h (x24) or cm/h (x240) instead of mm/d makes infiltration capacity ~24-240x too low so nearly all rainfall becomes runoff."
      severity: "degraded"
    - id: "psif_cm_not_mm"
      kind: "soil_semantic"
      description: "Wetting-front suction psi_f supplied in cm instead of mm (x10) understates capillary drive, leaving Green-Ampt infiltration insensitive to soil-moisture deficit."
      severity: "degraded"
    - id: "smax_m_not_mm"
      kind: "soil_semantic"
      description: "Maximum soil storage Smax supplied in meters instead of mm (x1000) makes the soil never saturate, producing zero surface runoff."
      severity: "silent"
    - id: "basin_area_ha_not_km2"
      kind: "control_semantic"
      description: "Basin area in hectares instead of km2 (1 km2 = 100 ha) makes the mm/d-to-m3/s discharge conversion wrong by a factor of 100."
      severity: "degraded"
    - id: "discharge_unit_mismatch_sim_obs"
      kind: "parser_semantic"
      description: "Sim discharge (m3/s) compared against obs in mm/d-over-basin (or vice versa) without conversion drives NSE << 0 from a pure unit mismatch."
      severity: "silent"
    - id: "calibration_includes_spinup"
      kind: "initial_condition_semantic"
      description: "Calibration window that includes the spinup year (or non-overlapping obs) lets first-year initial-condition transients contaminate the objective, converging to physically unrealistic parameters with NSE < 0."
      severity: "degraded"
    - id: "green_ampt_near_saturation_collapse"
      kind: "numerical_instability"
      description: "Very small Ks paired with very large psi_f collapses infiltration capacity abruptly when soil-moisture deficit drops below ~0.01, giving physically correct but numerically sensitive all-or-nothing runoff transitions."
      severity: "warning"
    - id: "nonlinear_reservoir_negative_discharge"
      kind: "numerical_instability"
      description: "The nonlinear fast reservoir Q=k_fast*S^alpha can yield physically impossible negative discharge or rising-limb ringing near zero/tiny storage with non-integer alpha; storage and discharge should be floored at zero each timestep."
      severity: "warning"
  validation_limits:
    - "Designed for small watersheds (<100 km2); applying the lumped daily form to large basins (e.g. >1000 km2) cannot capture the basin-wide travel-time distribution and produces inherent peak-timing errors."
    - "Daily timestep cannot resolve sub-daily storm-event hydrograph dynamics that the canonical event-based KINEROS2 is built for."
    - "This reimplementation emits discharge and water-balance fluxes only; it does not produce the erosion/sediment outputs of the canonical KINEROS2 lineage."
  warnings:
    - "f_slow near 1.0 with a very small k_slow damps all event-scale response, yielding a flat baseflow-only hydrograph; keep f_slow in [0.1,0.7] (below 0.5 for event-responsive basins)."
    - "alpha calibrating to a bound outside [1.0,2.0] indicates overfitting masking unit or runoff-generation (Ks/psi_f/Smax) errors; fix those before recalibrating."
    - "fc calibrating near 0.0 or 1.0 signals a mis-scaled Smax rather than genuine soil behavior."
    - "A >=1 year spinup excluded from metrics is required; initializing soil moisture at 0 or Smax makes the first simulated year wildly inaccurate."
  assumptions:
    - statement: "The runnable entity is a 0-D lumped daily continuous reimplementation of KINEROS2 physics, not the canonical event-based distributed model; distributed plane/channel routing and sub-event timestepping are collapsed to a basin-average daily conceptualization."
      scope: "whole model; spatial and temporal grain"
      source: "USDA-ARS KINEROS2 overview (ars.usda.gov KINEROS2 docs) contrasted with the lumped daily reimplementation described in the KINEROS2 knowledge infrastructure"
      status: "adopted"
    - statement: "Water mass balance is closed (precipitation = infiltration + surface excess; soil storage closes against ET and drainage); no surface energy-balance closure, since PET is a Hamon temperature-index estimate."
      scope: "closure"
      source: "KINEROS2 lumped soil-moisture and Hamon-PET module description"
      status: "adopted"
    - statement: "Published KINEROS2 sensitivity analyses (canonical distributed model) are taken to govern the Green-Ampt parameters of the lumped form, since Ks, net capillary drive, and antecedent saturation are shared structural controls."
      scope: "influence edges"
      source: "Hantush & Kalin 2005 (HSJ); Al-Qurashi et al. 2008 (J. Hydrol.); Korgaonkar et al. 2020 (Env. Model. Softw.)"
      status: "tentative"
