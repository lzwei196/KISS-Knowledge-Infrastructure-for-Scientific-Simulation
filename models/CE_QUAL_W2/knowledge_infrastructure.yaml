package:
  name: CE_QUAL_W2
  language: fortran
  implementation:
    id: ce-qual-w2-v45
    version: 4.5.5
    provenance: Fortran 90; CE-QUAL-W2 (USACE ERDC / Portland State, Cole & Wells) realizing the laterally-averaged
      2D LARM->GLVHT->W2 lineage; NPT fixed-width-FORMAT I/O contract.
  scientific_reference_version: CE-QUAL-W2 4.5.5 (PSU User Manual, Wells 2026; ERDC/EcohydrologyTeam v4.5
    lineage)
  binary:
    path: KISSPATH_BINARIES/ce_qual_w2/bin/w2_v5
    type: null
pipeline:
  stages:
  - s0_configuration_skill
  - s10_execution_skill
  - s11_output_analysis_skill
  - s1_bathymetry_skill
  - s3_met_forcing_skill
  - s9_control_file_skill
tools:
  count: 16
  files:
  - tools/s10_execution/run_w2.py
  - tools/s11_output_analysis/parse_w2_output.py
  - tools/s11_output_analysis/plot_w2_curtain.py
  - tools/s11_output_analysis/plot_w2_timeseries.py
  - tools/s12_calibration/calibrate_w2.py
  - tools/s13_coupling/w2_to_cama_coupling.py
  - tools/s1_bathymetry/build_reservoir_grid.py
  - tools/s2_branch_topology/build_branch_topology.py
  - tools/s3_met_forcing/convert_met_to_w2.py
  - tools/s4_inflow/convert_inflow_to_w2.py
  - tools/s4_inflow/generate_distributed_inflow.py
  - tools/s5_outflow/configure_w2_outflow.py
  - tools/s6_init_conditions/build_init_conditions.py
  - tools/s7_hydraulic_params/set_hydraulic_params.py
  - tools/s8_wq_config/configure_wq.py
  - tools/s9_control_file/generate_w2_control.py
inputs:
  forcing:
  - name: air temperature (TAIR)
    unit: deg C
  - name: dew point temperature (TDEW)
    unit: deg C
  - name: wind speed (WIND)
    unit: m/s
  - name: wind direction (PHI / WDIR)
    unit: degrees (0-360) in v4.x+
  - name: cloud cover (CLOUD)
    unit: tenths (0-10)
  - name: shortwave solar radiation (SRO)
    unit: W/m^2
  parameters:
  - name: wind sheltering coefficient (WSC)
    unit: dimensionless
  - name: light extinction for pure water (EXH2O)
    unit: m^-1
  - name: surface solar absorption fraction (BETA)
    unit: fraction
  - name: longitudinal momentum dispersion (AX)
    unit: m^2/s
  - name: longitudinal temperature/constituent dispersion (DX)
    unit: m^2/s
  - name: bottom (sediment) heat exchange coefficient (CBHE)
    unit: W/m^2/C
  - name: sediment temperature (TSED)
    unit: deg C
  - name: bottom friction (Chezy / Manning n)
    unit: Chezy or Manning n (n ~0.02-0.05)
  - name: water-quality kinetic coefficients (>120; e.g., AG, AR, AM, AT1, ASAT, SOD, LDOMDK)
    unit: various (1/day, gO2/m^2/day, deg C, etc.)
  initial_conditions:
  - name: initial temperature field (T2I / IT2)
    unit: deg C
  - name: initial constituent concentrations (IC2 / C2)
    unit: g/m^3 (mg/L)
  - name: initial water surface elevation (ELWS)
    unit: m ASL
  - name: initial ice thickness (ICETHI / ICE)
    unit: m
  - name: restart state (RSIC reading RSOC/rso.opt)
    unit: state snapshot
  boundary_conditions:
  - name: bathymetry (segment widths per layer)
    unit: m (width), m (elevation)
  - name: branch topology (US, DS, UHS, DHS, SLOPE)
    unit: segment indices / slope
  - name: branch inflow discharge (QIN)
    unit: m^3/s
  - name: branch inflow temperature (TIN)
    unit: deg C
  - name: branch inflow constituents (CIN)
    unit: g/m^3 (mg/L), constituent-dependent
  - name: distributed / tributary inflow (QTR/QDTR, TTR/TDTR) and precipitation (PRC)
    unit: m^3/s; deg C
  - name: outflow / withdrawal discharge (QOUT, QWD)
    unit: m^3/s
  - name: outlet / withdrawal elevation
    unit: m ASL
  - name: external head boundaries (EUH/EDH, TUH/TDH, CUH/CDH)
    unit: m ASL; deg C; g/m^3
  - name: simulation period (TMSTRT, TMEND, YEAR)
    unit: decimal JDAY / year
  - name: waterbody type (WTYPE freshwater/saltwater)
    unit: switch
  - name: method / option switches (turbulence scheme, transport scheme, HEATC, SLHTC, FRICC, constituent
      ON/OFF)
    unit: switch
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - water temperature
  - dam release temperature
  - dissolved oxygen
  - water surface elevation
  - outflow discharge
  - chlorophyll-a / algal biomass
  - ice thickness
  other: []
