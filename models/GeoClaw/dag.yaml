template_version: "3.5"

identity:
  model_id: "GeoClaw"
  scientific_reference_version: "GeoClaw 2D depth-averaged shallow-water solver (Clawpack ecosystem; Berger-George-LeVeque-Mandli 2011 formulation)"
  implementation:
    id: "geoclaw-clawpack"
    version: "Clawpack/GeoClaw 5.14.x (KI tracks geoclaw-ki v1.0, Clawpack 5.7.1+)"
    provenance: "Fortran 90/77 numerical core (xgeoclaw) with Python configuration/I-O; Clawpack (clawutil, amrclaw, geoclaw, riemann, pyclaw, visclaw)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "BSD-3-Clause"
  repo_url: "https://github.com/clawpack/geoclaw"

boundary:
  scope_in:
    - "2D depth-averaged (shallow-water) flow over variable topography"
    - "Tsunami generation, propagation, and coastal inundation"
    - "Storm surge driven by parametric/data wind and pressure fields"
    - "Dam-break and other geophysical free-surface flows"
    - "Wetting/drying at shorelines"
  scope_out:
    - "3D / non-hydrostatic Navier-Stokes flow (depth-averaged only; Boussinesq dispersive corrections are an optional extension)"
    - "Short-wavelength dispersive wind-wave spectra (outside the shallow-water + optional Boussinesq regime)"
    - "Sediment transport / morphodynamics (not in the core shallow-water solver)"
  spatial: "2-D grid"
  temporal: "event"
  closure: "mass-balance"
  notes: "Finite-volume formulation conserves mass and momentum for the depth-averaged shallow-water system. The bed-slope term -gh∇B is incorporated in a well-balanced f-wave Riemann solver (not a separate source), preserving steady states. Manning friction and Coriolis enter as fractional-step momentum source terms; there is no surface energy-balance closure. Adaptive time stepping is governed by the CFL condition (cfl_desired ~0.75, cfl_max default 1.0). All times are in seconds; lat-lon (coordinate_system=2) uses earth_radius=6367500 m for metric terms, Cartesian (=1) uses meters."

inputs:
  forcing:
    - category: "bathymetry"
      name: "Topography / bathymetry B(x,y)"
      unit: "m relative to datum (ocean depth negative, land positive)"
      source_kind: "dataset_lookup"
      model_input_format: "topotype 1 (x,y,z), 2/3 (header + grid), or 4 (NetCDF CF); registered via topo_data.topofiles"
      notes: "Read into topowork and written to aux(1) per cell; bed slope is consumed directly inside the well-balanced Riemann solver. Files must cover the whole domain or gaps default to zero elevation."
    - category: "seafloor_deformation"
      name: "Dynamic topography (dtopo)"
      unit: "displacement m; time s"
      source_kind: "derived"
      model_input_format: "dtopotype 1 (t,x,y,dz) or 3 (.tt3 time-dependent); via dtopo_data.dtopofiles"
      notes: "Time-dependent seafloor deformation applied to aux(1) mid-run (topo0+dtopo); the tsunami-generation driver, typically produced by the Okada model from fault slip."
    - category: "atmospheric"
      name: "Storm wind velocity (surge mode)"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "parametric or data-driven storm fields (storm_module); aux(wind_index)"
      notes: "Wind stress applied to momentum in the source step (surge runs only)."
    - category: "atmospheric"
      name: "Atmospheric pressure (surge mode)"
      unit: "Pa"
      source_kind: "forcing"
      model_input_format: "storm fields; aux(pressure_index)"
      notes: "Pressure-gradient forcing is folded into the Riemann/flux step, not the src2 source term."
  parameters:
    - category: "friction"
      name: "Manning coefficient (manning_coefficient / manning_break)"
      unit: "dimensionless (n); break depths in m"
      source_kind: "calibrated"
      model_input_format: "geo_data.manning_coefficient / manning_break; optional per-cell field via friction_module"
      notes: "Typical natural-channel range 0.01-0.06; default 0.025. >0.1 stalls flow; can be spatially variable or topo-region selected via manning_break."
    - category: "physical_constant"
      name: "Gravity"
      unit: "m/s^2"
      source_kind: "default"
      model_input_format: "geo_data.gravity (read into geoclaw_module.grav)"
      notes: "9.81 m/s^2; controls wave celerity sqrt(gh)."
    - category: "geodesy"
      name: "Earth radius"
      unit: "m"
      source_kind: "default"
      model_input_format: "geo_data.earth_radius"
      notes: "GeoClaw convention 6367500.0 m (not 6371000); used for lat-lon metric terms when coordinate_system=2."
    - category: "numerical"
      name: "dry_tolerance"
      unit: "m"
      source_kind: "default"
      model_input_format: "geo_data.dry_tolerance (default 1e-3)"
      notes: "Depth below which a cell is treated as dry at wet/dry fronts."
    - category: "numerical"
      name: "speed_limit"
      unit: "m/s"
      source_kind: "default"
      model_input_format: "geo_data.speed_limit (v5.11.0+; pre-5.11 data files get no cap)"
      notes: "Caps unrealistic velocities; version-dependent default."
    - category: "friction"
      name: "friction_depth"
      unit: "m"
      source_kind: "default"
      model_input_format: "geo_data.friction_depth"
      notes: "Maximum water depth at which Manning friction is applied."
  initial_conditions:
    - category: "sea_state"
      name: "sea_level"
      unit: "m relative to datum"
      source_kind: "user_provided"
      model_input_format: "geo_data.sea_level"
      notes: "Reference still-water surface elevation; must share the bathymetry datum."
    - category: "perturbation"
      name: "Initial surface/momentum perturbation (qinit)"
      unit: "m (eta) or m^2/s (momentum)"
      source_kind: "user_provided"
      model_input_format: "qinit_data.qinit_type (0-4), qinitfiles, variable_eta_init, force_dry_list"
      notes: "Sets initial h/hu/hv or surface perturbation; force_dry_list marks dry land below sea level."
  boundary_conditions:
    - category: "control"
      name: "Coordinate system"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "geo_data.coordinate_system (1=Cartesian/m, 2=spherical/deg)"
      notes: "All spatial inputs (topo, domain bounds, gauges, regions) must share this system."
    - category: "domain"
      name: "Computational domain bounds and resolution"
      unit: "m or deg; cell counts"
      source_kind: "user_provided"
      model_input_format: "clawdata.lower/upper[0..1], num_cells (mx,my), t0/tfinal (seconds)"
    - category: "edge_condition"
      name: "Per-edge boundary conditions"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "clawdata.bc_lower/bc_upper (e.g. 'extrap' non-reflecting outflow)"
    - category: "amr_control"
      name: "AMR levels and refinement ratios"
      unit: "integer"
      source_kind: "user_provided"
      model_input_format: "amrdata.amr_levels_max (1-6), refinement_ratios_x/y/t (len = levels-1), flagregions"
      notes: "Refinement ratios must be positive integers of length amr_levels_max-1."
    - category: "amr_control"
      name: "AMR flagging tolerances"
      unit: "wave: m; speed: m/s"
      source_kind: "user_provided"
      model_input_format: "refinement_data.wave_tolerance, speed_tolerance (per level)"
    - category: "numerical"
      name: "CFL targets"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "clawdata.cfl_desired (~0.75), cfl_max (default 1.0)"
    - category: "control"
      name: "friction_forcing switch"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "geo_data.friction_forcing"
      notes: "Enables/disables the Manning friction source term."

processes:
  modules:
    - name: "rpn2_geoclaw"
      role: "process_solver"
      brief: "Normal-direction augmented David-George f-wave Riemann solver (riemann_aug_JCP, maxiter=1) for the shallow-water-with-topography system; well-balanced, handles wet/dry fronts; consumes aux(1) bed slope and (in surge) pressure forcing."
    - name: "riemann_aug_JCP"
      role: "process_solver"
      brief: "Augmented JCP Riemann solver kernel invoked by rpn2; computes near-critical (criticaltol) and rarefaction-corrected fluctuations for shallow water with bathymetry."
    - name: "rpt2_geoclaw"
      role: "process_solver"
      brief: "Transverse Riemann solver propagating corrections across the orthogonal direction."
    - name: "step2"
      role: "integrator"
      brief: "Dimensional-unsplit Godunov time step per AMR patch; calls normal+transverse solvers, accumulates fluxes, enforces positivity relimiting, returns grid CFL."
    - name: "src2"
      role: "process_solver"
      brief: "Fractional-step momentum source terms: implicit Manning bed friction (n^2 g |u| / h^(7/3)), Coriolis rotation, wind stress, and optional spherical-geometry source."
    - name: "geoclaw_module"
      role: "driver"
      brief: "Holds physics constants (grav, rho, earth_radius, sea_level, dry_tolerance, speed_limit, manning) and geodesy helpers (Coriolis, spherical distance, latlon<->xy); reads geoclaw.data."
    - name: "topo_module"
      role: "optional_module"
      brief: "Loads and packs multi-resolution topography (topotype 1/2/3/4) into topowork and fills aux(1)."
    - name: "topo_update"
      role: "optional_module"
      brief: "Applies time-dependent dtopo (seafloor deformation) into aux(1) during the run for tsunami generation."
    - name: "qinit_module"
      role: "allocator"
      brief: "Sets the initial sea-surface perturbation / depth / momentum into q."
    - name: "setaux"
      role: "allocator"
      brief: "Fills aux arrays per cell: topography integral aux(1), cell capacity aux(2), edge-length ratio aux(3) for lat-lon grids."
    - name: "friction_module"
      role: "optional_module"
      brief: "Spatially-variable Manning override; defines friction_index and toggles per-cell vs region-based n."
    - name: "refinement_module"
      role: "optional_module"
      brief: "AMR cell flagging by wave_tolerance (surface-elevation difference) and per-level speed_tolerance (flag2refine2/errest)."
    - name: "storm_module"
      role: "optional_module"
      brief: "Parametric/data-derived tropical-cyclone wind and pressure fields feeding wind stress and pressure forcing in surge runs."
    - name: "Boussinesq dispersive correction"
      role: "optional_module"
      brief: "Optional dispersive-wave corrections (2d/bouss variant) extending the shallow-water equations to shorter wavelengths; q(4:5) corrections zeroed in the pure shallow-water step."
      applicability: "Boussinesq (2d/bouss) variant only"
    - name: "Multi-layer stratified extension"
      role: "optional_module"
      brief: "Multi-layer stratified shallow-water equations for density-layered flows."
      applicability: "multilayer variant only"
    - name: "gauges_module"
      role: "optional_module"
      brief: "Records q/aux time series at fixed (x,y) gauge points interpolated from the best AMR grid."
    - name: "fgmax_module"
      role: "optional_module"
      brief: "Fixed-grid running maxima: tracks max depth, max speed, momentum flux, and first-wave arrival time."
    - name: "fgout_module"
      role: "optional_module"
      brief: "Writes the solution interpolated to a fixed uniform output grid at specified times."
    - name: "valout"
      role: "driver"
      brief: "Output writer; appends eta=h+B to each frame and writes ascii/binary/HDF5 fort.q/fort.a/fort.t."
    - name: "amr2"
      role: "integrator"
      brief: "Top-level AMRClaw integrator loop: initializes modules, manages the block-structured adaptive-mesh hierarchy, advances time, regrids, and triggers output."
  internal_edges:
    - from: "Inputs"
      to: "geoclaw_module"
      kind: "consumes_input"
      brief: "geoclaw.data supplies grav, rho, earth_radius, sea_level, friction, dry_tolerance, speed_limit."
    - from: "Inputs"
      to: "topo_module"
      kind: "consumes_input"
      brief: "topo files (tt1/2/3/4) loaded into topowork."
    - from: "topo_module"
      to: "setaux"
      kind: "invokes"
      brief: "topography integral written to aux(1) per cell."
    - from: "setaux"
      to: "B"
      kind: "writes_state"
      brief: "aux(1) bathymetry filled per cell."
    - from: "Inputs"
      to: "topo_update"
      kind: "consumes_input"
      brief: "dtopo files read for time-dependent seafloor deformation."
    - from: "topo_update"
      to: "B"
      kind: "writes_state"
      brief: "modifies aux(1) topography mid-run from topo0+dtopo (earthquake source)."
    - from: "qinit_module"
      to: "h"
      kind: "writes_state"
      brief: "initial surface/depth perturbation set into q(1)."
    - from: "geoclaw_module"
      to: "rpn2_geoclaw"
      kind: "invokes"
      brief: "physics constants (grav, dry_tolerance, rho) consumed by the Riemann solver."
    - from: "B"
      to: "rpn2_geoclaw"
      kind: "reads_state"
      brief: "bed slope -g*h*B_x folded into the well-balanced f-wave."
    - from: "rpn2_geoclaw"
      to: "riemann_aug_JCP"
      kind: "invokes"
      brief: "normal solver dispatches to the augmented JCP kernel."
    - from: "rpn2_geoclaw"
      to: "step2"
      kind: "invokes"
      brief: "returns f-waves, speeds, fluctuations to the integrator."
    - from: "rpt2_geoclaw"
      to: "step2"
      kind: "invokes"
      brief: "transverse corrections passed to the integrator."
    - from: "step2"
      to: "h"
      kind: "writes_state"
      brief: "flux differencing updates conserved h/hu/hv per patch."
    - from: "step2"
      to: "amr2"
      kind: "produces_output"
      brief: "returns cflgrid controlling adaptive dt."
    - from: "geoclaw_module"
      to: "src2"
      kind: "invokes"
      brief: "Manning coefficients and Coriolis function consumed by the source step."
    - from: "B"
      to: "src2"
      kind: "reads_state"
      brief: "friction selects manning region via manning_break vs aux(1)."
    - from: "friction_module"
      to: "src2"
      kind: "invokes"
      brief: "variable friction supplies aux(friction_index)."
    - from: "storm_module"
      to: "src2"
      kind: "invokes"
      brief: "wind stress applied to momentum."
    - from: "src2"
      to: "hu"
      kind: "writes_state"
      brief: "implicit friction, Coriolis rotation, wind, and sphere source modify momentum."
    - from: "refinement_module"
      to: "amr2"
      kind: "invokes"
      brief: "wave_tolerance/speed_tolerance flagging drives regridding of the AMR hierarchy."
    - from: "amr2"
      to: "step2"
      kind: "invokes"
      brief: "driver advances each grid one step."
    - from: "amr2"
      to: "src2"
      kind: "invokes"
      brief: "driver applies fractional-step source terms."
    - from: "h"
      to: "valout"
      kind: "reads_state"
      brief: "eta = h + B computed at write time."
    - from: "valout"
      to: "Outputs"
      kind: "produces_output"
      brief: "frame solution (h,hu,hv,eta), metadata, and aux written to fort.q/fort.t/fort.a."
    - from: "h"
      to: "gauges_module"
      kind: "reads_state"
      brief: "q/aux interpolated to gauge points."
    - from: "gauges_module"
      to: "Outputs"
      kind: "produces_output"
      brief: "gauge time series written."
    - from: "h"
      to: "fgmax_module"
      kind: "reads_state"
      brief: "running maxima (depth/speed/arrival) accumulated."
    - from: "fgmax_module"
      to: "Outputs"
      kind: "produces_output"
      brief: "max-value grids written at finalize."

states:
  variables:
    - name: "h"
      unit: "m"
      role: "prognostic"
    - name: "hu"
      unit: "m^2/s"
      role: "prognostic"
    - name: "hv"
      unit: "m^2/s"
      role: "prognostic"
    - name: "eta"
      unit: "m"
      role: "diagnostic"
    - name: "u"
      unit: "m/s"
      role: "diagnostic"
    - name: "v"
      unit: "m/s"
      role: "diagnostic"
    - name: "speed"
      unit: "m/s"
      role: "diagnostic"
    - name: "B"
      unit: "m"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "h"
    validation_rank: 1
    unit: "m"
    description: "Water depth (prognostic q[0]); zero in dry cells."
    emitted_in: "fort.qNNNN"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["At tide/DART gauges, depth is usually compared via eta; raw depth comparison is mainly meaningful for inundation/flow gauges."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Mapped inundation extent depends on dry_tolerance and AMR resolution."]
      detrending_options: ["none"]
  - var: "eta"
    validation_rank: 2
    unit: "m"
    description: "Free-surface elevation eta = h + B; the primary tsunami/surge observable (computed at write time, not stored in q)."
    emitted_in: "fort.gauge / gaugeNNNNN.txt; fort.qNNNN (appended column)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["DART/tide-gauge water-surface elevation is the standard comparison; arrival-time error reflects bathymetry + source timing. fgmax surface elevation can be unrealistic if depth and topo are interpolated separately then added."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Maximum-elevation fields compared against post-event survey maps."]
      detrending_options: ["none"]
  - var: "speed"
    validation_rank: 3
    unit: "m/s"
    description: "Total water speed sqrt(u^2+v^2), u=hu/h, v=hv/h; avoid division by zero in dry cells (h < ~1e-6)."
    emitted_in: "derived in post-processing; fgmax (max speed)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Velocity observations are sparse; momentum flux is the more robust hazard metric."]
      detrending_options: ["none"]
  - var: "max_depth_max_speed_arrival_time"
    validation_rank: 4
    unit: "m; m/s; s"
    description: "fgmax running-maximum fields over the whole run: maximum depth, maximum speed, momentum flux, and first-wave arrival time."
    emitted_in: "fgmaxNNNN.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy", "event_detection"]
          determining_metric: "csi"
          caveats: ["Maximum-inundation depth/extent compared against post-event field surveys; arrival time compared against gauge first-arrival."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy", "timing_accuracy"]
          determining_metric: "pbias"
          caveats: ["Per-site peak runup or arrival time at survey points."]
      detrending_options: ["none"]

influence:
  _caveat: "All GeoClaw sensitivity evidence is one-at-a-time parameter-sweep (Gibbons 2022) or PC-surrogate Bayesian inference (Sraj 2014/2017); no study reports formal variance-based indices (Sobol/Morris/EFAST). Grades therefore cap at MEDIUM despite mechanistically dominant drivers (strike, friction-on-velocity, slip)."
  edges:
    - from: "manning_coefficient"
      to: "speed"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "onshore inundation"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity"]
    - from: "manning_coefficient"
      to: "max_depth_max_speed_arrival_time"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "momentum flux / onshore velocity"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity"]
    - from: "manning_coefficient"
      to: "h"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "inundation distance on gently sloping terrain"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity"]
    - from: "manning_coefficient"
      to: "eta"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "onshore/near-shore n; deep-water n weakly constrained"
      citations: ["sraj2014_geoclaw_manning_uq_dart"]
    - from: "earthquake_strike_angle"
      to: "h"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "offshore sources; inundation distance"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity"]
    - from: "earthquake_strike_angle"
      to: "max_depth_max_speed_arrival_time"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "offshore sources; runup"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity", "sraj2017_geoclaw_eqparams_bayesian"]
    - from: "earthquake_dip_angle"
      to: "max_depth_max_speed_arrival_time"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "weaker than strike; diminishes with depth"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity"]
    - from: "earthquake_rake_angle"
      to: "max_depth_max_speed_arrival_time"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "smooth variation; recommend rake=+/-90"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity"]
    - from: "earthquake_depth"
      to: "max_depth_max_speed_arrival_time"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "modulates dip sensitivity"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity"]
    - from: "fault_slip_distribution"
      to: "eta"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "Okada source sets the initial wave"
      citations: ["sraj2017_geoclaw_faultslip_pc"]
    - from: "earthquake_source_location"
      to: "eta"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "buoy elevation time series"
      citations: ["sraj2017_geoclaw_eqparams_bayesian"]
    - from: "wind_stress_drag_coefficient"
      to: "eta"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "storm-surge mode"
      citations: ["mandli2014_geoclaw_storm_surge_amr"]
    - from: "bathymetry_topography"
      to: "eta"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "storm-surge magnitude / nearshore"
      citations: ["mandli2014_geoclaw_storm_surge_amr"]
    - from: "bathymetry_topography"
      to: "h"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "coastal slope governs inundation distance"
      citations: ["gibbons2022_geoclaw_source_friction_sensitivity", "mandli2014_geoclaw_storm_surge_amr"]
    - from: "amr_grid_resolution"
      to: "max_depth_max_speed_arrival_time"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: structural
      applicability: "coastal runup/inundation accuracy"
      citations: ["mandli2014_geoclaw_storm_surge_amr", "gibbons2022_geoclaw_source_friction_sensitivity"]
  citation_index:
    gibbons2022_geoclaw_source_friction_sensitivity:
      short_citation: "Gibbons et al. 2022"
      doi: "10.3389/feart.2021.757618"
      note: "High-resolution GeoClaw-family inundation sensitivity to earthquake source parameters (strike dominant) and Manning friction (velocity/momentum-flux dominant) via structured one-at-a-time parameter sweeps; no variance-based index reported."
    sraj2014_geoclaw_manning_uq_dart:
      short_citation: "Sraj et al. 2014"
      doi: "10.1016/j.ocemod.2014.09.001"
      note: "Polynomial-chaos surrogate + Bayesian inference of Manning n from Tohoku DART buoy surface elevation; deep-water n weakly constrained."
    sraj2017_geoclaw_faultslip_pc:
      short_citation: "Sraj et al. 2017 (Ocean Dynamics)"
      doi: "10.1007/s10236-017-1105-9"
      note: "Polynomial-chaos inference of Tohoku fault slip distribution from buoy water-surface elevation."
    sraj2017_geoclaw_eqparams_bayesian:
      short_citation: "Sraj et al. 2017 (Comp. Geosci.)"
      doi: "10.1007/s10596-017-9646-z"
      note: "Bayesian inference of earthquake source location/strike/dip/slip from buoy data via PC surrogate."
    mandli2014_geoclaw_storm_surge_amr:
      short_citation: "Mandli & Dawson 2014"
      doi: "10.1016/j.ocemod.2014.01.002"
      note: "GeoClaw storm-surge with AMR; surge elevation driven by wind stress and bathymetry, validated vs ADCIRC + Hurricane Ike tide gauges."

safety:
  hazards:
    - id: "bathymetry_sign_convention"
      triplet: "dt_001"
      kind: "soil_semantic"
      description: "Positive-down ocean depth instead of GeoClaw negative-below-datum makes ocean read as land; zero flow, no wave propagation."
      severity: "silent"
    - id: "coordinate_system_mismatch"
      triplet: "dt_002"
      kind: "soil_semantic"
      description: "Topo coordinates (meters) vs geo_data.coordinate_system (lat-lon, or vice versa) mismatch; domain misplaced, solution in one corner or empty."
      severity: "silent"
    - id: "time_units_not_seconds"
      triplet: "dt_003"
      kind: "control_semantic"
      description: "tfinal/t0 in minutes or hours instead of seconds; simulation finishes instantly or never completes."
      severity: "silent"
    - id: "manning_too_high"
      triplet: "dt_004"
      kind: "coefficient_runtime_silent_fallback"
      description: "Manning coefficient >0.1 causes extreme bottom friction; flow stalls within a few cells, inundation under-predicted."
      severity: "silent"
    - id: "sea_level_units_or_datum"
      triplet: "dt_005"
      kind: "initial_condition_semantic"
      description: "sea_level in feet/cm or on a different datum than bathymetry; domain wrongly flooded or dry."
      severity: "silent"
    - id: "gravity_imperial"
      triplet: "dt_006"
      kind: "control_semantic"
      description: "gravity=32.2 ft/s^2 instead of 9.81 m/s^2; wave celerity sqrt(gh) off by ~1.81x."
      severity: "silent"
    - id: "earth_radius_km"
      triplet: "dt_007"
      kind: "control_semantic"
      description: "earth_radius in km (6367.5) instead of meters (6367500.0); lat-lon metric terms 1000x off."
      severity: "silent"
    - id: "wind_speed_units"
      triplet: "dt_008"
      kind: "weather_file_semantic"
      description: "Storm wind speed in knots/mph instead of m/s; surge height ~2x wrong."
      severity: "silent"
    - id: "pressure_units"
      triplet: "dt_009"
      kind: "weather_file_semantic"
      description: "Atmospheric pressure in mbar/hPa instead of Pa; pressure forcing 100x too small, negligible surge."
      severity: "silent"
    - id: "fault_slip_cm"
      triplet: "dt_010"
      kind: "initial_condition_semantic"
      description: "Okada fault slip in centimeters instead of meters; seafloor deformation 100x too small, tsunami invisible."
      severity: "silent"
    - id: "cfl_exceeds_max"
      triplet: "dt_011"
      kind: "numerical_instability"
      description: "CFL/Courant number exceeds cfl_max (default 1.0) from extreme velocities or under-resolution; abort or NaN/Inf."
      severity: "fatal"
    - id: "dry_tolerance_too_small"
      triplet: "dt_012"
      kind: "numerical_instability"
      description: "dry_tolerance too small drives numerical oscillations / checkerboard at the wet-dry interface."
      severity: "silent"
    - id: "amr_ratio_length_mismatch"
      triplet: "dt_013"
      kind: "control_semantic"
      description: "refinement_ratios array length != amr_levels_max-1; Fortran array-bounds error / segfault at startup."
      severity: "fatal"
    - id: "topo_domain_gaps"
      triplet: "dt_014"
      kind: "soil_semantic"
      description: "Topography files leave domain gaps that default to zero elevation; artificial walls/cliffs reflect waves."
      severity: "silent"
    - id: "gauge_outside_domain"
      triplet: "dt_016"
      kind: "control_semantic"
      description: "Gauge placed outside the domain or in a permanently dry cell; empty/missing gauge output, silently skipped."
      severity: "silent"
  validation_limits:
    - "Depth-averaged hydrostatic shallow-water assumption: cannot resolve non-hydrostatic / strongly dispersive wave behavior unless the optional Boussinesq solver is enabled."
    - "2D horizontal only; no vertical structure (stratification only via the optional multi-layer extension)."
    - "Core solver carries no sediment transport / morphodynamics."
    - "KI is example_validated against the bowl-slosh analytical solution only; no real-event (DART/tide-gauge) validation is asserted in the KI itself."
  warnings:
    - "fgmax surface elevation can be unrealistically high if fluid depth and topography are interpolated separately then added; depth and topography are monitored separately by default."
    - "speed/velocity derived as hu/h must guard against division by zero in dry cells (h < ~1e-6)."
    - "Spherical mass/momentum source terms are off by default (sphere_source=0); physics differ silently from full spherical SWE unless enabled."
    - "speed_limit defaults to infinity for pre-v5.11.0 data files, so old configurations silently get no velocity cap."
  assumptions:
    - statement: "The model is 2D depth-averaged (hydrostatic, long-wave); vertical structure is removed by depth averaging."
      scope: "core shallow-water solver (non-Boussinesq, single-layer)"
      source: "GeoClaw overview (clawpack.org/geoclaw.html) and Berger-George-LeVeque-Mandli 2011"
      status: "adopted"
    - statement: "Mass and momentum are conserved by the finite-volume formulation; the bed-slope term is well-balanced inside the Riemann solver, and there is no surface energy-balance closure."
      scope: "conservation / closure"
      source: "rpn2_geoclaw / geoclaw_riemann_utils well-balanced f-wave; src2 fractional-step friction/Coriolis"
      status: "adopted"
    - statement: "Sea-surface elevation eta = h + B with z=0 datum; bathymetry z<0 below sea level, z>0 above."
      scope: "sign / datum convention"
      source: "clawpack.org/topo.html and valout.f90 (eta computed at write time)"
      status: "adopted"
    - statement: "Okada fault depth is treated in meters by the dtopotools Python API even though user-facing tables state km; depth in km is a documentation convention."
      scope: "Okada source depth units"
      source: "GeoClaw dtopotools source/docs (s2 earthquake-source documentation vs dtopotools code)"
      status: "tentative"
    - statement: "Pressure-gradient forcing is applied in the Riemann/flux step (rpn2 via pressure_index aux), not as a src2 source term."
      scope: "storm-surge pressure forcing location"
      source: "rpn2_geoclaw and src2.f90 module behavior in GeoClaw source"
      status: "adopted"
