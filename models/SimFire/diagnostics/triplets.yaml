# SimFire Diagnostic Triplets
# symptom → diagnosis → remedy for common failure modes
# 15+ entries covering unit conversions, parameters, runtime, and dependencies

- id: dt_001
  stage: s3_wind_setup
  failure_domain: unit_conversion
  symptom:
    description: "Fire spreads catastrophically fast — fills the grid in minutes. sim/expected RoS ratio ≈ 88×. (Verified 2026-04-29 against simfire 2.0.1.)"
    error_pattern: "burned_fraction > 0.5 in < 30 min on flat terrain"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Wind speed in YAML wind.simple.speed (or perlin.speed.range_*) written in ft/min instead of mph — SimFire applies mph_to_ftpm internally and the value ends up 88× too high."
    explanation: >
      The official MITRE SimFire docs (`docs/source/config.md` line 285-289)
      and the source itself (`simfire/utils/config.py:860` calls
      `mph_to_ftpm(yaml["wind"]["simple"]["speed"])`) state that wind.simple.speed
      is in MPH. SimFire converts to ft/min internally for the Rothermel
      calculation. If a user pre-converts (e.g. writes 1760 thinking
      "20 mph × 88 = 1760 ft/min"), SimFire reads 1760 mph and multiplies
      by 88 again, yielding 154,880 ft/min internal wind. This drives
      phi_w to extreme values and the fire fills the grid in minutes.
      The same applies to wind.perlin.speed.range_min/range_max
      (config.py:897-901).
    affected_components: [config.yaml, wind.simple.speed, wind.perlin.speed.range_min, wind.perlin.speed.range_max]
  remedy:
    action: "Write the wind speed in mph directly in the YAML; do NOT pre-multiply by 88."
    tool_to_run: null
    manual_steps:
      - "Open config YAML, find wind.simple.speed"
      - "If value > 100, it is almost certainly already in ft/min — replace with the mph value (typical 0-60 mph for surface wind)"
      - "Same fix for wind.perlin.speed.range_min and range_max"
      - "Sanity-check: at runtime, sim head-fire RoS should be 1-50 ft/min for surface fires; if you observe >2000 ft/min on flat terrain you likely doubled the conversion"
    prevention: "Use SKILL.md and s3_wind_setup.md as the canonical source; older notes claiming 'must be in ft/min' are wrong for the YAML input layer."
  severity: silent
  cross_references: [dt_002, dt_016]

- id: dt_002
  stage: s3_wind_setup
  failure_domain: unit_conversion
  symptom:
    description: "Fire spread is ~2.24× faster than intended when input numeric magnitude was meant to be m/s but written into wind.simple.speed."
    error_pattern: "sim_RoS / expected_RoS_at_intended_mph_value ≈ 2.24"
    detection_method: value_comparison
  diagnosis:
    root_cause: "wind.simple.speed expects mph, not m/s. Writing 10 (intending 10 m/s ≈ 22 mph) produces 10 mph internal."
    explanation: >
      ERA5, MERRA2, and most weather models report wind in m/s. SimFire's
      simple.speed YAML is in mph, so writing the m/s value directly (e.g.
      10) gets interpreted as 10 mph. This is an underestimate by ~2.24x in
      magnitude. Symptom is more subtle than dt_001 because the magnitude is
      smaller — the fire still spreads, just slower than intended.
    affected_components: [config.yaml, wind.simple.speed]
  remedy:
    action: "Convert m/s to mph (× 2.237) before writing to YAML."
    tool_to_run: null
    manual_steps:
      - "If your wind data source is m/s, multiply by 2.237 to get mph"
      - "Write the mph value to wind.simple.speed"
    prevention: "Document the source-data unit alongside the YAML and check before run."
  severity: silent
  cross_references: [dt_001, dt_016]

- id: dt_003
  stage: s2_terrain_setup
  failure_domain: unit_conversion
  symptom:
    description: "Fire spreads extremely fast, consuming entire domain in minutes."
    error_pattern: "burned_fraction > 0.9 in < 1h"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Fuel load (w_0) provided in kg/m² instead of lb/ft². ~4.88× too high."
    explanation: >
      The Rothermel equation uses w_0 in lb/ft². If fuel load is in metric units
      (kg/m²), values are approximately 5× too large, producing much higher
      reaction intensity I_R and thus faster fire spread. For example, Chaparral
      w_0 = 1.12 kg/m² → 0.23 lb/ft² correctly, but 1.12 lb/ft² would produce
      extreme fire behavior.
    affected_components: [Fuel.w_0, presets.py, custom fuel definitions]
  remedy:
    action: "Convert fuel load: lb/ft² = kg/m² × 0.2048"
    tool_to_run: null
    manual_steps:
      - "Check fuel parameter source units"
      - "If kg/m²: multiply by 0.2048 to get lb/ft²"
      - "Standard FBFM-13 values are already in lb/ft² — only affects custom fuels"
    prevention: "Verify w_0 is in range 0.01-0.5 lb/ft² for standard fuel types"
  severity: silent
  cross_references: []

- id: dt_004
  stage: s1_configuration
  failure_domain: unit_conversion
  symptom:
    description: "Fire never spreads beyond ignition point. All fuel appears non-combustible."
    error_pattern: "burned_pixels == 0"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Fuel moisture M_f specified as percentage (e.g., 3) instead of fraction (0.03)."
    explanation: >
      The Rothermel equation computes moisture damping as r_M = M_f / M_x. If
      M_f = 3.0 (3% as integer) and M_x = 0.20 (20% extinction), then r_M = 15,
      which is clamped to 1.0, making eta_M = 0. This zeroes the reaction intensity
      and prevents all fire spread. The correct value is M_f = 0.03.
    affected_components: [config.yaml, environment.moisture, Environment.M_f]
  remedy:
    action: "Express moisture as fraction: divide percentage by 100."
    tool_to_run: null
    manual_steps:
      - "Open config YAML, find environment.moisture"
      - "If value > 1.0, it's likely a percentage"
      - "Divide by 100 (e.g., 3% → 0.03)"
    prevention: "Validate moisture is in range [0.001, 0.99]"
  severity: silent
  cross_references: []

- id: dt_005
  stage: s2_terrain_setup
  failure_domain: unit_conversion
  symptom:
    description: "Fire ignores terrain completely. Spreads identically on hills and flat ground."
    error_pattern: "slope_factor_phi_s ≈ 0"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Elevation provided in meters instead of feet. Slope gradient is 3.28× too small."
    explanation: >
      SimFire computes slope as np.gradient(elevation, pixel_scale) where both
      elevation and pixel_scale must be in feet. If elevation is in meters but
      pixel_scale is in feet, the gradient is 3.28× too small. Since phi_s
      depends on slope², the slope factor is ~10.8× too small, making terrain
      effects negligible.
    affected_components: [TopographyLayer, RothermelFireManager.slope_mag]
  remedy:
    action: "Multiply elevation by 3.28084 to convert meters → feet."
    tool_to_run: convert_landfire_to_simfire
    manual_steps:
      - "Check elevation data source units"
      - "LandFire provides meters — must convert to feet"
      - "convert_landfire_to_simfire.py handles this automatically"
    prevention: "Verify max elevation is in reasonable feet range (e.g., < 20000 ft)"
  severity: silent
  cross_references: []

- id: dt_006
  stage: s1_configuration
  failure_domain: parameter
  symptom:
    description: "Fire spreads too fast or too slow relative to expected. Burned area doesn't match expected physical size."
    error_pattern: "area mismatch by factor of 2-10"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Pixel scale in config doesn't match actual data resolution."
    explanation: >
      If pixel_scale is 50 ft/pixel but actual data is 30m (98.4 ft) per pixel,
      the fire needs to accumulate burn_amounts > 50 ft to spread to a neighbor,
      but the physical distance is actually 98.4 ft. This makes fire spread about
      2× too fast in physical space. Conversely, if pixel_scale is too large,
      fire spreads too slowly.
    affected_components: [config.area.pixel_scale, RothermelFireManager]
  remedy:
    action: "Set pixel_scale = resolution_meters × 3.28084"
    tool_to_run: null
    manual_steps:
      - "For operational mode at 30m: pixel_scale = 30 × 3.28084 ≈ 98.4 ft"
      - "Or use desired scale and adjust interpretation"
    prevention: "Cross-check pixel_scale × screen_size = expected physical domain"
  severity: silent
  cross_references: []

- id: dt_007
  stage: s4_execution
  failure_domain: runtime
  symptom:
    description: "pygame.error: No available video device. Simulation crashes on startup."
    error_pattern: "pygame.error"
    detection_method: log_match
  diagnosis:
    root_cause: "headless mode is false but no display server (X11/Wayland) is available."
    explanation: >
      SimFire uses PyGame for rendering. On headless servers (SSH, Docker, CI),
      no display is available. PyGame.init() fails with 'No available video device'.
      This is the most common deployment error.
    affected_components: [config.simulation.headless, game.py, PyGame]
  remedy:
    action: "Set headless: true in config, or set SDL_VIDEODRIVER=dummy."
    tool_to_run: null
    manual_steps:
      - "In config YAML: set simulation.headless: true"
      - "Or: export SDL_VIDEODRIVER=dummy before running"
      - "Also set record: false (recording requires display memory)"
    prevention: "Always use headless: true for server/batch/CI runs"
  severity: fatal
  cross_references: []

- id: dt_008
  stage: s2_terrain_setup
  failure_domain: parameter
  symptom:
    description: "Fire starts but stops immediately at adjacent pixels. Fuel code 0 surrounds ignition."
    error_pattern: "burning_pixels == 1 for all timesteps"
    detection_method: value_comparison
  diagnosis:
    root_cause: "All or most pixels have non-burnable fuel code (0, 91-99, nodata)."
    explanation: >
      Non-burnable fuel types (Urban=91, Water=93, Agriculture=98, etc.) have
      w_0 = 0.0, which makes the Rothermel RoS = 0. If the bounding box is
      over an urban area, water body, or agricultural land, most pixels will be
      non-burnable. The fire at the ignition point burns but cannot spread.
    affected_components: [FuelLayer, fuel_array, presets.py FuelModelToFuel]
  remedy:
    action: "Check bounding box location. Move to area with natural vegetation."
    tool_to_run: convert_landfire_to_simfire
    manual_steps:
      - "Load fuel array and check unique values"
      - "If mostly 0/91-99: wrong location for wildfire simulation"
      - "Use LANDFIRE viewer to preview fuel data at target location"
    prevention: "convert_landfire_to_simfire.py reports burnable fraction"
  severity: silent
  cross_references: []

- id: dt_009
  stage: s4_execution
  failure_domain: parameter
  symptom:
    description: "Fire ignites but never spreads. Moisture damping coefficient eta_M = 0."
    error_pattern: "burned_pixels == 0 after long runtime"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Fuel moisture M_f exceeds or equals moisture of extinction M_x for all fuel types."
    explanation: >
      When M_f >= M_x, the moisture ratio r_M >= 1.0, and the damping coefficient
      eta_M = 1 - 2.59*r_M + 5.11*r_M² - 3.52*r_M³ evaluates to ~0 or negative
      (clamped to 0). This zeros the reaction intensity I_R and prevents spread.
      For example, Short Grass (M_x=0.12) won't burn if M_f > 0.12.
    affected_components: [environment.moisture, rothermel.py eta_M calculation]
  remedy:
    action: "Reduce M_f below M_x of the target fuel. Typical range: 0.001-0.08."
    tool_to_run: null
    manual_steps:
      - "Check config environment.moisture value"
      - "Compare against M_x of dominant fuel type"
      - "For SoCal chaparral: M_x=0.20, use M_f < 0.20 (typically 0.03-0.05)"
      - "For grass: M_x=0.12, use M_f < 0.12"
    prevention: "Warn if M_f > min(M_x) for any fuel in the domain"
  severity: degraded
  cross_references: [dt_004]

- id: dt_010
  stage: s1_configuration
  failure_domain: unit_conversion
  symptom:
    description: "Operational mode downloads tiny region. Simulation domain much smaller than expected."
    error_pattern: "actual_area << expected_area"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Operational area height/width specified in feet instead of meters."
    explanation: >
      The config operational.height and operational.width are in METERS. If
      specified in feet (e.g., 6000 ft instead of 2000 m), the downloaded
      region is 3.28× smaller than intended. This is confusing because
      pixel_scale is in feet, but area dimensions are in meters.
    affected_components: [config.operational.height, config.operational.width]
  remedy:
    action: "Specify height/width in meters in the operational section."
    tool_to_run: null
    manual_steps:
      - "Ensure operational.height and operational.width are in meters"
      - "2000 meters ≈ 6562 feet ≈ 1.24 miles"
    prevention: "Config validator should check area dimensions are reasonable (100-50000 m)"
  severity: degraded
  cross_references: []

- id: dt_011
  stage: s1_configuration
  failure_domain: parameter
  symptom:
    description: "Fire spreads in cross/diamond pattern instead of realistic ellipse shape."
    error_pattern: "fire_shape is cross-shaped"
    detection_method: value_comparison
  diagnosis:
    root_cause: "diagonal_spread set to false, limiting fire to 4-connected neighbors."
    explanation: >
      With diagonal_spread=false, fire can only spread to 4 adjacent pixels (N,S,E,W).
      This produces diamond-shaped fire patterns instead of realistic elliptical
      shapes. The effective spread rate is lower because fire cannot take diagonal
      shortcuts, which is not physically realistic.
    affected_components: [config.fire.diagonal_spread, RothermelFireManager._get_new_locs]
  remedy:
    action: "Set diagonal_spread: true for realistic 8-connected fire spread."
    tool_to_run: null
    manual_steps:
      - "In config: fire.diagonal_spread: true"
    prevention: "Default should always be true for realistic simulations"
  severity: degraded
  cross_references: []

- id: dt_012
  stage: s2_terrain_setup
  failure_domain: dependency
  symptom:
    description: "HTTP error or timeout when downloading LandFire data. No terrain data available."
    error_pattern: "ConnectionError|HTTPError|Timeout"
    detection_method: log_match
  diagnosis:
    root_cause: "LandFire API is unavailable, rate-limited, or network issue."
    explanation: >
      The landfire Python package downloads data from USGS LandFire web services.
      These can be temporarily unavailable, rate-limited, or blocked by firewalls.
      Large area requests may also timeout.
    affected_components: [landfire package, OperationalFuelLayer, OperationalTopographyLayer]
  remedy:
    action: "Retry later, use smaller area, or pre-download GeoTIFFs."
    tool_to_run: convert_landfire_to_simfire
    manual_steps:
      - "Check network connectivity: ping landfire.gov"
      - "Try smaller area (e.g., 1000m × 1000m)"
      - "Download GeoTIFFs manually from https://landfire.gov/viewer/"
      - "Use --fuel-tif and --elev-tif flags with convert_landfire_to_simfire.py"
    prevention: "Cache downloaded data in sf_home directory"
  severity: fatal
  cross_references: []

- id: dt_013
  stage: s3_wind_setup
  failure_domain: parameter
  symptom:
    description: "CFD wind field has artifacts, vortices, or unrealistic patterns."
    error_pattern: "wind_field_irregular"
    detection_method: value_comparison
  diagnosis:
    root_cause: "CFD solver not converged due to insufficient training iterations."
    explanation: >
      The Navier-Stokes CFD wind solver requires adequate iterations (time_to_train)
      to reach steady state. With too few iterations (< 500), the velocity field
      may contain transient artifacts, boundary effects, or unphysical vortices.
      The default of 1000 is generally sufficient for simple terrain.
    affected_components: [config.wind.cfd.time_to_train, WindControllerCFD]
  remedy:
    action: "Increase time_to_train to 2000+ for complex terrain."
    tool_to_run: null
    manual_steps:
      - "In config: wind.cfd.time_to_train: 2000"
      - "For very rugged terrain: try 5000"
      - "Visually inspect wind field: sim.wind_speed, sim.wind_direction"
    prevention: "Compare CFD wind to simpler Perlin wind for sanity check"
  severity: silent
  cross_references: []

- id: dt_014
  stage: s4_execution
  failure_domain: runtime
  symptom:
    description: "MemoryError or process killed during GIF save. Large simulation data."
    error_pattern: "MemoryError|OOM|Killed"
    detection_method: log_match
  diagnosis:
    root_cause: "Recording frames in memory for GIF creation exceeds available RAM."
    explanation: >
      When record=true, SimFire stores every rendered frame as a PIL Image in memory.
      For long simulations (>6h) on large grids (>200×200), this can consume
      gigabytes of RAM. save_gif() then attempts to encode all frames, which
      doubles memory usage.
    affected_components: [Game.frames, sim.save_gif(), Pillow]
  remedy:
    action: "Disable recording or save intermediate results."
    tool_to_run: null
    manual_steps:
      - "Set record: false in config for long runs"
      - "For visualization, run shorter segments with record: true"
      - "Or save fire_map snapshots and create animation post-hoc"
    prevention: "Estimate memory: n_frames × H × W × 3 bytes (RGB)"
  severity: degraded
  cross_references: []

- id: dt_015
  stage: s1_configuration
  failure_domain: parameter
  symptom:
    description: "Fire appears briefly then disappears. Burned pixels revert to BURNED status immediately."
    error_pattern: "very few BURNING pixels at any time"
    detection_method: value_comparison
  diagnosis:
    root_cause: "max_fire_duration too low (1-2 frames). Fire sprites pruned before spreading."
    explanation: >
      The RothermelFireManager prunes fire sprites after max_fire_duration frames
      and marks them as BURNED. If this value is too low, fire sprites are removed
      before they accumulate enough burn_amounts (> pixel_scale ft) to ignite
      neighbors. The fire appears to start and immediately die out.
    affected_components: [config.fire.max_fire_duration, FireManager._prune_sprites]
  remedy:
    action: "Set max_fire_duration to at least 4-5."
    tool_to_run: null
    manual_steps:
      - "In config: fire.max_fire_duration: 5"
      - "For slow-burning fuels (litter): may need 8-10"
      - "Higher values = more concurrent sprites = more computation"
    prevention: "Default of 5 works for most fuel types at update_rate=1"
  severity: silent
  cross_references: []

- id: dt_016
  stage: s3_wind_setup
  failure_domain: unit_conversion
  symptom:
    description: "Perlin wind field is 88× too strong; sim spreads catastrophically. (Re-verified 2026-04-29.)"
    error_pattern: "internal max wind speed > ~10000 ft/min for plausible weather"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Perlin range_min/range_max written in ft/min instead of mph. The loader (config.py:897-901) calls mph_to_ftpm on these YAML scalars; pre-multiplied values get multiplied by 88 a second time."
    explanation: >
      `simfire/utils/config.py:897-901` wraps each YAML perlin.speed.range_*
      with `mph_to_ftpm`. So a YAML value of 4136 (intended as 47 mph × 88)
      becomes 4136 mph × 88 = 363,968 ft/min internal. For 7-47 mph wind,
      write `range_min: 7` and `range_max: 47` directly.
    affected_components: [config.wind.perlin.speed.range_min, config.wind.perlin.speed.range_max]
  remedy:
    action: "Write the mph values directly to range_min and range_max; do NOT multiply by 88."
    tool_to_run: null
    manual_steps:
      - "In config: wind.perlin.speed.range_min: 5    (mph)"
      - "In config: wind.perlin.speed.range_max: 30   (mph)"
      - "If you find values > 100 in this field they are almost certainly already in ft/min and need to be replaced with the mph value"
    prevention: "Use the s3_wind_setup.md v2 doc as the canonical reference."
  severity: silent
  cross_references: [dt_001, dt_002, dt_018]

- id: dt_018
  stage: s3_wind_setup
  failure_domain: convention
  symptom:
    description: "Fire spreads in the OPPOSITE direction from what the user intended (head-fire goes upwind / against the meteorological wind they wrote in the config)."
    error_pattern: "head-fire elongation azimuth = (intended_meteorological_from_dir + 180) mod 360"
    detection_method: visual_inspection
  diagnosis:
    root_cause: "wind.simple.direction in the YAML is *TO direction* (degrees clockwise from N pointing to where the wind blows TO), not the meteorological 'from' convention."
    explanation: >
      `simfire/world/rothermel.py:104` computes
      `wind_angle_radians = np.radians(90 − U_dir)` and projects the wind
      vector onto the candidate spread direction. Maximum spread occurs
      when angle_of_travel == U_dir, i.e. the wind blows TOWARD U_dir.
      Concretely: `direction = 90` means wind blows TOWARD East and the
      head fire moves East. This is OPPOSITE to standard meteorological
      convention where "wind direction = 90" means "wind from East".
      For a Diablo NE wind that meteorologically blows FROM NE (TO SW),
      use `direction: 225`, NOT `direction: 45`.
    affected_components: [config.wind.simple.direction, config.wind.perlin.direction.range_min, config.wind.perlin.direction.range_max]
  remedy:
    action: "Use 'TO direction' encoding: direction = the bearing the wind blows TOWARD. For a meteorological 'wind from X', add 180 mod 360."
    tool_to_run: null
    manual_steps:
      - "Want fire to spread East? direction: 90"
      - "Want fire to spread SW (Diablo wind from NE)? direction: 225"
      - "Want fire to spread NE (SW wind from SW)? direction: 45"
      - "Sanity-check by running a 30-min sim on flat terrain and confirming head-fire elongation azimuth matches direction"
    prevention: "Use the lookup table in s3_wind_setup.md and write the TO direction next to the meteorological FROM direction in YAML comments."
  severity: silent
  cross_references: [dt_001, dt_016]

- id: dt_017
  stage: s5_output_analysis
  failure_domain: unit_conversion
  symptom:
    description: "Computed burn area is extremely large or small. Off by orders of magnitude."
    error_pattern: "area seems unreasonable"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Wrong pixel_scale used in area calculation, or forgot ft²→acres conversion."
    explanation: >
      Burn area = burned_pixels × pixel_scale² (ft²). Common errors:
      1) Using meters/pixel for pixel_scale when it should be feet/pixel
      2) Forgetting to divide ft² by 43560 to get acres
      3) Using pixel count directly as area (ignoring scale)
      Result: area off by 10-10000×.
    affected_components: [parse_simfire_output.py, manual analysis scripts]
  remedy:
    action: "Verify pixel_scale matches config. Convert ft² ÷ 43560 = acres."
    tool_to_run: parse_simfire_output
    manual_steps:
      - "Check config area.pixel_scale (in feet)"
      - "area_ft2 = burned_pixels × pixel_scale²"
      - "area_acres = area_ft2 / 43560"
      - "area_ha = area_acres × 0.404686"
    prevention: "parse_simfire_output.py requires --pixel-scale and reports multiple units"
  severity: silent
  cross_references: [dt_006]

- id: dt_019
  stage: s1_configuration
  failure_domain: runtime
  symptom:
    description: "Config() raises KeyError on a section the run does not even use (e.g. a pure functional-terrain config)."
    error_pattern: "KeyError: 'operational'"
    detection_method: exception
  diagnosis:
    root_cause: "simfire's Config loader reads EVERY section unconditionally, not just the ones the selected modes need."
    explanation: >
      Config.__init__ (config.py:263) calls _load_operational() before it ever looks at
      terrain.topography.type, and _load_operational() does
      OperationalConfig(**self.yaml_data["operational"]) (config.py:527). A config that
      omits `operational:` therefore dies even in pure `functional` mode. The same holds
      for wind.cfd and wind.perlin, which _load_wind reads before dispatching on
      wind.function. Verified 2026-08-09 against simfire 2.0.1: the KI's own
      run_simfire.py --quick-test shipped such a config and could never run.
    affected_components: [tools/run_simfire.py, any hand-written YAML]
  remedy:
    action: "Every SimFire config must carry ALL sections: area, display, simulation, mitigation, operational, terrain, fire, environment, wind{cfd,simple,perlin}."
    tool_to_run: run_simfire
    manual_steps:
      - "Copy configs/functional_config.yml from the simfire source as the skeleton"
      - "Leave unused sections at their example values; they are parsed but ignored"
    prevention: "run_simfire.py --quick-test now emits a fully-populated config."
  severity: fatal
  cross_references: [dt_007]

- id: dt_020
  stage: s2_terrain_setup
  failure_domain: dependency
  symptom:
    description: "Operational terrain/fuel download dies while parsing the LandFire response; the body is an HTML page, not JSON."
    error_pattern: "JSONDecodeError: Expecting value: line 1 column 1"
    detection_method: exception
  diagnosis:
    root_cause: "The `landfire` PyPI client (0.5.0) posts to the RETIRED ArcGIS GPServer endpoint; USGS now serves the LFPS web page there."
    explanation: >
      landfire/__init__.py:18-20 builds REQUEST_URL from
      https://lfps.usgs.gov/arcgis/rest/services/LandfireProductService/GPServer/LandfireProductService
      and calls .json() on the reply. That path now returns a Next.js HTML document, so
      EVERY `terrain.{topography,fuel}.type: operational` run fails. dt_012 does not match
      (no ConnectionError/HTTPError/Timeout - the request succeeds, the body is just HTML).
      The live API is https://lfps.usgs.gov/api/job/{submit,status} plus /api/products;
      `Email` is now REQUIRED, `Resample_Resolution` must be >= 31 (omit it for native
      30 m), and layer ids changed (200F13_19/200F13_20 -> LF2016_FBFM13,
      220F13_22 -> LF2022_FBFM13, ELEV2020 -> LF2020_Elev).
      lfps.usgs.gov also fails TLS through the sandbox proxy (SSL_ERROR_SYSCALL) - the
      session must set trust_env=False.
    affected_components: [landfire==0.5.0, simfire/utils/layers.py, operational mode]
  remedy:
    action: "Install the LFPS v2 shim before building Config."
    tool_to_run: convert_landfire_to_simfire
    manual_steps:
      - "from convert_landfire_to_simfire import install_lfps2_shim"
      - "install_lfps2_shim(email='you@example.org')   # BEFORE Config(...)"
      - "Then use simfire's operational path unchanged"
      - "The shim also finds the AOI under the client's 'Area_Of_Interest' key (capital O)"
    prevention: "preflight_check.py now probes https://lfps.usgs.gov/api/products."
  severity: fatal
  cross_references: [dt_012]

- id: dt_021
  stage: s3_wind_setup
  failure_domain: parameter
  symptom:
    description: "Simulated fire spreads 2-3x too fast even though the wind speed in the YAML matches the observed weather in mph."
    error_pattern: "burned_area >> observed with correct-looking mph wind"
    detection_method: value_comparison
  diagnosis:
    root_cause: "A 10 m (or 2 m) meteorological wind was written into wind.simple.speed, but Rothermel needs the MIDFLAME wind."
    explanation: >
      Rothermel's U is the midflame wind - the wind acting on the flame inside/above the
      surface fuel bed - not the open 10 m wind that reanalyses and weather APIs report.
      The standard chain is: reference height -> 20 ft (6.1 m) open wind via the log
      profile, then 20 ft -> midflame via the Albini & Baughman (1979) unsheltered wind
      adjustment factor WAF = 1.83 / ln((20 + 0.36 H) / (0.13 H)), H = fuel bed depth in
      ft (Andrews 2012, RMRS-GTR-266). WAF ~ 0.36 for grass (H = 1 ft) and ~ 0.55 for
      chaparral (H = 6 ft), so skipping it inflates phi_w by roughly 2-3x. This is SILENT:
      the units are right, only the reference height is wrong.
    affected_components: [config.wind.simple.speed, config.wind.perlin.speed.range_min, config.wind.perlin.speed.range_max]
  remedy:
    action: "Derive wind.simple.speed with the NASA POWER mode of the wind tool, which applies the log profile and the WAF."
    tool_to_run: convert_wind_to_simfire
    manual_steps:
      - "python tools/convert_wind_to_simfire.py --nasa-power --lat LAT --lon LON --date YYYY-MM-DD --fuel-bed-depth-ft H --output-dir DIR"
      - "Take H from the DOMINANT burnable FBFM-13 model in the domain, not a guess"
      - "Use --start-offset-hours (12 - lon/15) to sample the LOCAL afternoon, not the UTC night"
      - "Direction: the tool returns a speed-weighted VECTOR mean already flipped to the 'TO' convention"
    prevention: "Never write a raw 10 m wind into wind.simple.speed."
  severity: silent
  cross_references: [dt_001, dt_002, dt_018]

- id: dt_022
  stage: s4_execution
  failure_domain: unit_conversion
  symptom:
    description: "Weather-derived fuel moisture comes out at the floor for every site; relative humidity is exactly 0.0 everywhere."
    error_pattern: "mean_rh_pct == 0.0"
    detection_method: value_comparison
  diagnosis:
    root_cause: "ki_tools_common.humidity.specific_humidity_to_rh takes temperature in KELVIN; load_forcing returns temp_c in CELSIUS."
    explanation: >
      The helper's argument is named temp_k and it subtracts 273.15 internally. Passing
      load_forcing's temp_c evaluates the Tetens saturation vapour pressure ~273 K below
      the real temperature, e_s explodes and RH clips to 0.0. Simard EMC then returns
      ~0.03 % and every site clamps to the dead-fuel-moisture floor - a physically
      plausible-looking but completely weather-independent number. Verified 2026-08-09:
      31.4 degC / q = 2.1 g/kg gave RH 0.0 before the fix and RH 7.3 % after.
    affected_components: [tools/derive_fire_environment.py, any ki_tools_common humidity use]
  remedy:
    action: "Pass temp_c + 273.15 into specific_humidity_to_rh."
    tool_to_run: derive_fire_environment
    manual_steps:
      - "Sanity-check mean_rh_pct: a real value is 3-95 %, never exactly 0.0 or 100.0"
    prevention: "derive_fire_environment.py converts explicitly and records mean_rh_pct in its provenance block."
  severity: silent
  cross_references: [dt_004, dt_009]

- id: dt_023
  stage: s2_terrain_setup
  failure_domain: parameter
  symptom:
    description: "The simulated grid is narrower (fewer columns) than area.screen_size implies, or a 4326 request yields cells that are not 30 m."
    error_pattern: "fuel.shape[1] < floor(width/30)"
    detection_method: value_comparison
  diagnosis:
    root_cause: "simfire treats 0.00027777777803598015 degrees as 30 m in BOTH lat and lon, and then crops assuming exactly 30 m cells."
    explanation: >
      config.py:340-342 computes the bottom-right corner with one isotropic
      degrees-per-pixel constant. That is right for latitude (~30.9 m) but at 40 deg N one
      such step of LONGITUDE is only ~23.5 m. layers.py:123-127 then crops the returned
      raster to [:floor(height/30), :floor(width/30)]. Once floor(width/30) exceeds ~360 at
      mid-latitudes the AOI runs out of columns and numpy slicing silently returns a
      NARROWER array - the domain is truncated east-west with no error.
      Separately, requesting Output_Projection=4326 from LFPS returns cells that are square
      in DEGREES (~0.00037 deg -> ~41 m N-S, ~32 m E-W at 40 deg N), which contradicts both
      the crop and area.pixel_scale = int(30/0.3048) = 98 ft.
    affected_components: [simfire/utils/config.py, simfire/utils/layers.py, area.screen_size, area.pixel_scale]
  remedy:
    action: "Request LandFire in its NATIVE 30 m Albers projection and widen the AOI so the east-west extent in METRES is at least the north-south extent."
    tool_to_run: convert_landfire_to_simfire
    manual_steps:
      - "install_lfps2_shim() defaults to output_projection=None (native Albers) and applies isotropize_bbox()"
      - "After Config(), assert cfg.area.screen_size equals (floor(height/30), floor(width/30))"
      - "Take the georeference for any obs comparison from the cached GeoTIFF's own affine transform (mtbs_perimeter_to_grid.grid_reference), never from the config lat/lon"
    prevention: "grid_reference() raises if the raster is smaller than the requested crop instead of scoring a truncated domain."
  severity: silent
  cross_references: [dt_006, dt_010, dt_017]

- id: dt_024
  stage: s2_terrain_setup
  failure_domain: dependency
  symptom:
    description: "Reading the cached LandFire GeoTIFF fails inside the geotiff package."
    error_pattern: "ValueError: zarr .* < 3 is not supported"
    detection_method: exception
  diagnosis:
    root_cause: "tifffile.aszarr needs zarr >= 3, but zarr >= 3.2 removed zarr.core.chunk_grids.RegularChunkGrid, which tifffile still imports."
    explanation: >
      simfire's layers._make_data() reads the raster with geotiff.GeoTiff(...).read(),
      which goes through tifffile.aszarr. Both zarr 2.x AND zarr 3.2+ raise the SAME
      misleading message ("zarr 3.3.0 < 3 is not supported"), because tifffile reports the
      version it found when the import guard fails for any reason. Verified 2026-08-09:
      zarr 2.12.0 fails, 3.3.0 fails, 3.1.6 works.
    affected_components: [geotiff, tifffile, zarr, simfire/utils/layers.py]
  remedy:
    action: "pip install 'zarr>=3,<3.2' in the SimFire venv."
    tool_to_run: null
    manual_steps:
      - "The SimFire venv also needs rasterio and xarray, neither of which ships with it"
      - "python preflight_check.py verifies all four"
    prevention: "preflight_check.py imports zarr.core.chunk_grids.RegularChunkGrid explicitly."
  severity: fatal
  cross_references: [dt_020]

- id: dt_025
  stage: s1_configuration
  failure_domain: convention
  symptom:
    description: "The fire starts in the wrong place; the simulated burn scar sits in a transposed position relative to the intended ignition."
    error_pattern: "sorensen ~ 0 with a plausibly-sized burn scar"
    detection_method: value_comparison
  diagnosis:
    root_cause: "fire.fire_initial_position.static.position is (X, Y) = (COLUMN, ROW), not (row, col)."
    explanation: >
      simulation.py _create_fire_map does
        x, y = self.config.fire.fire_initial_position
        self.fire_map[y, x] = BurnStatus.BURNING
      and config.py _load_fire's `random` branch draws pos_x from screen_size[1]
      (the WIDTH) and pos_y from screen_size[0] (the HEIGHT) - both confirm the
      (x, y) order. SKILL.md previously annotated the example as "(row, col)",
      which transposes every ignition point. On a SQUARE domain this raises no
      error at all: the fire simply starts at the mirrored cell, and any
      perimeter-overlap metric collapses toward zero for a reason that looks
      like a physics failure. Verified 2026-08-09.
    affected_components: [config.fire.fire_initial_position.static.position]
  remedy:
    action: "Write position as (column, row). When deriving the ignition cell from a raster with rasterio.transform.rowcol, SWAP before writing the YAML."
    tool_to_run: null
    manual_steps:
      - "row, col = rasterio.transform.rowcol(transform, x, y)"
      - "YAML:  position: (col, row)"
      - "Verify: after one update, np.argwhere(sim.fire_map == 1) should be the intended (row, col)"
    prevention: "Use a non-square test domain once; the transposition then raises IndexError instead of failing silently."
  severity: silent
  cross_references: [dt_018]
