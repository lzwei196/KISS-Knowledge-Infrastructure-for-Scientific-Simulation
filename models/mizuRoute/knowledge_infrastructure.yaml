    - convert_wrfhydro_runoff.py (s3 alternative for WRF-Hydro)
    - add_lakes_to_network.py (s1 extension for lake routing)
    - run_mizuroute_full_pipeline.py (end-to-end wrapper)
  coverage_percentage: 70
