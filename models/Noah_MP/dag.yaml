    - {from: "DKSAT (saturated hydraulic conductivity)", to: "SFCRUNOFF + UDRUNOFF (total runoff)", sensitivity_grade: HIGH, basis: literature_quantitative, lever_type: parameter, citations: ["cuntz2016_noahmp_hardcoded_sobol"]}
