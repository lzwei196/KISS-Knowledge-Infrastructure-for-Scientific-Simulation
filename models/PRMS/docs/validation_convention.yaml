# Convention is keyed by dag_variable per the 2026-08-14 Step-B campaign instruction.
# Numeric streamflow gates come from watershed-model evaluation criteria and a PRMS
# Red River Basin report that applies them directly to seg_outflow at streamgages.
# Non-streamflow process variables keep the dag determining metric, but bands are
# transferred only where the fetched literature supports a watershed-scale convention;
# spatial CSI and conceptual-storage diagnostics remain null/low-confidence.

