safety:
  hazards:
    - id: "tair_kelvin_not_celsius"
      kind: "weather_file_semantic"
      description: "Atmospheric temperature supplied in Kelvin not Celsius; under BULK_FLUXES drives SST to ~300 degC and corrupts heat fluxes."
      severity: "silent"
      triplet: "dt_001"
    - id: "wind_stress_pa_not_m2s2"
      kind: "weather_file_semantic"
      description: "Prescribed wind stress in Pa not divided by rho0 (~1025); currents ~1000x too strong and the run blows up."
      severity: "fatal_or_silent"
      triplet: "dt_002"
    - id: "forcing_time_ref_mismatch"
      kind: "control_semantic"
      description: "Forcing time units not aligned with ocean.in TIME_REF; ROMS extrapolates or uses wrong-season forcing, producing NaN or unphysical fields."
      severity: "fatal"
      triplet: "dt_003"
    - id: "precip_mmday_not_kgm2s"
      kind: "weather_file_semantic"
      description: "Precipitation in mm/day instead of kg/m2/s makes freshwater flux ~10^6x too high and salinity collapses to zero."
      severity: "silent"
      triplet: "dt_008"
    - id: "humidity_rh_not_specific"
      kind: "weather_file_semantic"
      description: "Relative humidity (%) used in place of specific humidity (kg/kg) makes latent-heat/evaporation flux ~4000x wrong."
      severity: "silent"
      triplet: "dt_015"
    - id: "wave_direction_degrees_not_radians"
      kind: "weather_file_semantic"
      description: "Wave direction in meteorological degrees (from, CW from north) instead of ROMS radians (to, CCW from east) reverses wave-current forcing."
      severity: "silent"
      triplet: "dt_011"
    - id: "bathymetry_sign_convention"
      kind: "soil_semantic"
      description: "GEBCO/ETOPO bathymetry not negated to ROMS positive-down convention; ocean cells get h<0, masked as land, immediate crash."
      severity: "fatal"
      triplet: "dt_007"
    - id: "bathymetry_rx0_too_steep"
      kind: "soil_semantic"
      description: "Bathymetry rx0 (Beckmann-Haidvogel number) > 0.2 in sigma coordinates causes spurious slope currents and pressure-gradient errors."
      severity: "degraded"
      triplet: "dt_016"
    - id: "ic_ts_out_of_eos_range"
      kind: "initial_condition_semantic"
      description: "Initial T/S outside EOS-valid range (T -2..40 degC, S 0..42 PSU) or fill values (9999) yield NaN density and blowup."
      severity: "fatal"
      triplet: "dt_012"
    - id: "wetdry_zeta_inconsistent"
      kind: "initial_condition_semantic"
      description: "WET_DRY enabled with initial zeta below Dcrit on shallow cells causes checkerboard wet/dry oscillation."
      severity: "degraded"
      triplet: "dt_017"
    - id: "cfl_barotropic_blowup"
      kind: "numerical_instability"
      description: "Barotropic timestep DT/NDTFAST violating CFL < ~0.7 causes immediate BLOWUP with exponential velocity/SSH growth."
      severity: "fatal"
      triplet: "dt_005"
    - id: "bc_wrong_arakawa_stagger"
      kind: "parser_semantic"
      description: "Boundary data on the wrong Arakawa-C stagger (rho vs u/v dims) interpolates to wrong locations, producing edge stripe artifacts."
      severity: "silent"
      triplet: "dt_009"
    - id: "restart_nrrec_time_mismatch"
      kind: "control_semantic"
      description: "NRREC not matching the restart file time record misaligns the simulation clock and time-dependent forcing on restart."
      severity: "fatal"
      triplet: "dt_013"
    - id: "bulk_fluxes_flag_forcing_mismatch"
      kind: "control_semantic"
      description: "BULK_FLUXES CPP flag inconsistent with the forcing variable set; mismatched variables are silently ignored, leaving zero surface forcing."
      severity: "silent"
      triplet: "dt_006"
    - id: "coupling_interval_non_integer"
      kind: "control_semantic"
      description: "Coupling interval not an integer multiple of all component timesteps; exchanges are missed and stale data is reused, causing stepping artifacts."
      severity: "degraded"
      triplet: "dt_010"
    - id: "mpi_tiling_node_mismatch"
      kind: "control_semantic"
      description: "NtileI x NtileJ not equal to NnodesOCN; processes wait on non-existent partners and the run deadlocks at startup with no error."
      severity: "fatal"
      triplet: "dt_004"
    - id: "swan_spectral_resolution_too_coarse"
      kind: "control_semantic"
      description: "SWAN spectral grid below ~24 directions / ~25 frequencies leaks energy between spectral peaks, missing swell and biasing wave period."
      severity: "degraded"
      triplet: "dt_014"
  validation_limits:
    - "Component-internal physics is governed by each component model's own reference; COAWST adds only the inter-component exchange and feedback."
    - "Terrain-following S-coordinate degrades over steep topography (rx0 control); not suited to abrupt bathymetric steps without smoothing."
    - "Coupling conservation is only as accurate as the SCRIP remap weights between non-coincident component grids."
    - "Daily/coarse atmospheric forcing cannot resolve the sub-hourly air-sea feedback that drives rapid storm intensification."
  warnings:
    - "rho_eos must run before diag/prsgrd and set_depth before the 3D solve each step; this ordering is an implicit hard dependency not enforced by the namelist."
    - "When wave coupling is active, ocean momentum silently depends on SWAN via Stokes-drift and radiation-stress arrays even though this is not visible from ROMS docs alone."
    - "Sanity envelopes for QC: SST -2..35 degC, salinity 0..42 PSU, sea level +/-2 m (tidal/surge), currents < ~2 m/s, Tair -60..50 degC, Pair 850..1100 mb, swrad 0..1400 W/m2."
  assumptions:
    - statement: "The dag describes the coupled coawstM binding (ROMS+SWAN+WRF via MCT); component-internal science is referenced, not re-enumerated, at the COAWST level."
      scope: "whole framework"
      source: "USGS COAWST science page and CSDMS Model:COAWST metadata"
      status: "adopted"
    - statement: "Ocean state is Boussinesq with reference density rho0=1025 kg/m3 and specific heat Cp=3985 J/kg/degC for flux-to-state-flux conversions."
      scope: "ROMS ocean component"
      source: "ROMS mod_scalars.F constants (rho0, Cp)"
      status: "adopted"
    - statement: "Mass/momentum closure is on a split-explicit free surface with the barotropic mode sub-cycled NDTFAST times per baroclinic DT; surface energy closure holds only when bulk-flux/WRF coupling supplies the budget."
      scope: "ocean dynamics + air-sea coupling"
      source: "ROMS main3d.F step2d/step3d structure and bulk_flux.F (COARE)"
      status: "adopted"
    - statement: "Two-way feedback (not one-way forcing) is assumed: ocean and waves evolve and feed back to the atmosphere through MCT exchange."
      scope: "coupling configuration"
      source: "USGS COAWST coupling/two-way feedback documentation"
      status: "adopted"
