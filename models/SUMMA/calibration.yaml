    confidence: high
    cite:
      - "SUMMA basinParamInfo.txt: routingGammaShape default 2.5, limits [2.0, 3.0];
         range held strictly inside both"
      - "SUMMA source engine/var_derive.f90:417-471 — the timeDelay branch that builds
         fractionFuture and hence averageRoutedRunoff, THE SCORED SERIES"
      - "dag.yaml influence: 'flux parameterization choice (model decisions)' ->
         scalarTotalRunoff, MEDIUM (clark2015a/clark2015b/vanbeusekom2022); subRouting is one
         of those decisions and these are its two free parameters"
      - "commissioning 2026-08-04: lo -> nse 0.5489, hi -> nse 0.5397; applied == requested at both"
    address:
