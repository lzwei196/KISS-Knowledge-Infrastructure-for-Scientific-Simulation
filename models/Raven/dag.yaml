safety:
  hazards:
    - id: "forcing_units_ignored_silent"
      kind: "weather_file_semantic"
      description: "Raven performs no unit conversion on .rvt forcing; wrong units (TEMP in K not degC, SW in W/m2 not MJ/m2/d, AIR_PRES in Pa not kPa) run without error and give silently wrong PET/snow/discharge."
      severity: "silent"
    - id: "precip_subdaily_not_aggregated"
      kind: "weather_file_semantic"
      description: "Precip supplied in mm/3hr (un-aggregated) is read as a daily total, giving ~8x overestimated discharge."
      severity: "silent"
    - id: "missing_forcing_zeroed"
      kind: "weather_file_semantic"
      description: "A required forcing variable missing from .rvt is silently filled with zeros (zero PRECIP -> zero discharge), with no warning."
      severity: "silent"
    - id: "timestep_data_interval_mismatch"
      kind: "control_semantic"
      description: ".rvi :TimeStep not matching the .rvt :Data interval makes Raven misread or spread forcing across timesteps (e.g. reports zero precip)."
      severity: "silent"
    - id: "internal_forcing_generators_silent"
      kind: "weather_file_semantic"
      description: "40+ internal generators silently estimate missing forcing (e.g. SW_RADIA from latitude/day, wind, TEMP_AVE); outputs differ from expectation unless ForcingFunctions.csv is inspected."
      severity: "silent"
    - id: "pet_method_forcing_unmet_fallback"
      kind: "coefficient_runtime_silent_fallback"
      description: "A PET method whose required forcing is absent (e.g. PET_PENMAN_MONTEITH without WIND/RH/SW) silently falls back to internal estimation, degrading PET."
      severity: "degraded"
    - id: "snow_template_mismatch"
      kind: "control_semantic"
      description: "Snow-incapable templates (GR4J basic, HYMOD, basic SAC-SMA) treat all winter precip as rain; on cold/snow basins this yields no snowmelt peaks and wrong seasonal physics without error."
      severity: "silent"
    - id: "class_name_mismatch"
      kind: "soil_semantic"
      description: "Soil/land-use/vegetation/terrain class names not matching exactly (case-sensitive) between .rvh and .rvp cause fatal 'class/profile not found'."
      severity: "fatal"
    - id: "hru_area_sum_mismatch"
      kind: "soil_semantic"
      description: "Sum of HRU areas not equal to SubBasin/basin area causes a fatal startup crash."
      severity: "fatal"
    - id: "rvh_column_count"
      kind: "parser_semantic"
      description: ".rvh HRU lines require exactly 13 comma-separated fields including AQUIFER_PROFILE ([NONE] if unused); wrong count segfaults."
      severity: "fatal"
    - id: "rvt_data_count_mismatch"
      kind: "parser_semantic"
      description: "Declared data count in the .rvt :Data header not matching the actual data lines causes fatal 'Bad data / Insufficient data'."
      severity: "fatal"
    - id: "rvc_must_exist"
      kind: "initial_condition_semantic"
      description: "v4.1 requires a .rvc file to exist (even minimal) for cold start, or Raven aborts with 'Cannot find or read .rvc file'."
      severity: "fatal"
    - id: "incompatible_algorithm_mixing"
      kind: "control_semantic"
      description: "Mixing process algorithms across model families (e.g. GR4J infiltration + HBV baseflow) references non-existent state variables and crashes; hidden dependencies (INF_HBV needs HBV_BETA; MOHYSE needs MOHYSE_PET_COEFF/AET_COEFF) also crash fatally if missing."
      severity: "fatal"
    - id: "timestep_too_large_mass_balance"
      kind: "numerical_instability"
      description: "Timestep too large for the chosen process/routing algorithm exceeds the mass-balance tolerance and aborts."
      severity: "fatal"
    - id: "diagnostics_need_obs"
      kind: "control_semantic"
      description: "Without observed discharge, Diagnostics.csv reports NSE=-9999 (not computed) rather than erroring."
      severity: "silent"
  validation_limits:
    - "Conceptual rainfall-runoff framework: no native physically-based energy/water land-surface scheme (unlike VIC); energy closure only for processes that track energy state."
    - "No coupled flood-inundation routing; channel routing is 1-D conceptual within subbasins."
    - "Daily default timestep cannot resolve sub-daily flood dynamics in the validated configuration."
    - "Calibration data-length limit: ~3 years of daily data per calibrated parameter; high-parameter templates (HBV 21, SAC-SMA 16) overfit on short records."
    - "Practical scale ceiling: very many HRUs (>10,000) or very long daily simulations (>50 yr) risk stack-overflow segfaults."
  warnings:
    - "ORDERED_SERIES solver applies hydrologic processes strictly in the order listed in the .rvi block, mutating state in place; reordering processes silently changes the water balance (EULER is order-independent)."
    - "Named template stores (PRODUCT_STORE, FAST_RESERVOIR, ROUTING_STORE) are parse-time aliases for SOIL[i]; the model has no distinct internal compartments by those names."
    - "TOTAL_SWE is derived (recomputed each step as the sum of SNOW + SNOW_LIQ); any value set for it in .rvc is overwritten."
    - "Parameter sentinels (-11111.1 AUTO_COMPUTE, -33333.3 NOT_SPECIFIED, -55555.5 USE_TEMPLATE_VALUE, -1.2345 blank) are control flags, not data; literal use corrupts the run."
    - "Cold-start spinup: discard the first 1-2 simulation years or warm-start from solution.rvc."
    - "Raven-vs-other-model differences of 20-50% are expected structural uncertainty, not error; benchmark against observed gauges."
  assumptions:
    - statement: "Mass and energy balance close per HRU each timestep via the global numerical solver."
      scope: "All HRU vertical-balance processes"
      source: "Raven v4.0 User's and Developer's Manual, Section 1.2.1 HRU Mass/Energy Balance; Solvers.cpp MassEnergyBalance"
      status: "adopted"
    - statement: "Spatial geometry is semi-distributed point/column HRUs aggregated into 1-D channel-routed SubBasins; no native 2-D/3-D surface hydrodynamics."
      scope: "Spatial discretization and routing"
      source: "Raven v4.0 Manual, Chapter 4 Routing and Section 9.1 Code Organization"
      status: "adopted"
    - statement: "Internal K<->C conversion uses 273.16 (triple point), not 273.15."
      scope: "Temperature unit handling inside the model"
      source: "RavenInclude.h ZERO_CELSIUS constant (line 112)"
      status: "tentative"
