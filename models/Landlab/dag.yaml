safety:
  hazards:
    - id: "rainfall_unit_inflates_discharge"
      kind: weather_file_semantic
      description: "water__unit_flux_in supplied in mm/hr or mm/day instead of m/s inflates discharge by ~3.6e6x, causing runaway erosion; Landlab does not check units."
      severity: silent
    - id: "diffusivity_time_unit_mismatch"
      kind: numerical_instability
      description: "LinearDiffuser D in m^2/s while dt is in years flattens hillslopes within one step (effective D*dt enormous)."
      severity: silent
    - id: "K_sp_exponent_mismatch"
      kind: coefficient_runtime_silent_fallback
      description: "K_sp reused across different m_sp/n_sp exponents; units of K depend on m,n so erosion is off by orders of magnitude."
      severity: silent
    - id: "grid_spacing_in_degrees"
      kind: soil_semantic
      description: "Grid xy_spacing in degrees (unreprojected WGS84 DEM) makes dx ~0.0003 and slopes ~1e5x too steep."
      severity: silent
    - id: "timestep_time_unit_mismatch"
      kind: control_semantic
      description: "dt in seconds while K/D/uplift are per-year (or vice versa) rescales all rates by ~3.15e7; no internal check exists."
      severity: silent
    - id: "soil_depth_cm_as_m"
      kind: soil_semantic
      description: "Soil depth in cm used as meters collapses ExponentialWeatherer production to ~0 so SPACE cannot erode bedrock."
      severity: silent
    - id: "elevation_feet_as_m"
      kind: soil_semantic
      description: "Elevation in feet with meter spacing makes slopes and erosion ~3.28x too high."
      severity: silent
    - id: "manning_chezy_confusion"
      kind: coefficient_runtime_silent_fallback
      description: "Manning n confused with Chezy C in overland-flow components inverts/rescales velocity by 500-5000x."
      severity: silent
    - id: "dem_nodata_not_closed"
      kind: weather_file_semantic
      description: "DEM NoData (-9999) not masked as closed boundary is treated as very low elevation, so D8 routing converges flow into NoData regions."
      severity: degraded
    - id: "all_boundaries_closed"
      kind: control_semantic
      description: "All grid boundaries closed leaves no outlet; drainage_area=0 everywhere and erosion never occurs."
      severity: fatal
    - id: "no_depression_routing"
      kind: control_semantic
      description: "Real DEM with pits and no DepressionFinder/PriorityFlood routing stalls D8 flow at pits, creating artificial plateaus."
      severity: degraded
    - id: "diffusion_cfl_violation"
      kind: numerical_instability
      description: "External sub-stepping or very high D defeats LinearDiffuser internal sub-stepping (D*dt/dx^2 >= 0.15), producing checkerboard/NaN oscillation."
      severity: degraded
    - id: "erosion_before_flowaccumulator"
      kind: control_semantic
      description: "Erosion component run before FlowAccumulator in the time loop reads uninitialized zero drainage_area, so no erosion occurs."
      severity: fatal
    - id: "field_at_wrong_grid_element"
      kind: parser_semantic
      description: "Field added at the wrong grid element (cell vs node vs link) raises FieldError or silently reads all-zeros."
      severity: fatal_or_silent
    - id: "space_used_for_annual_sediment_yield"
      kind: control_semantic
      description: "SPACE (transport-limited) used for annual sediment yield on a real DEM returns near-zero export (~2.7% efficiency); detachment-limited stream power is required instead."
      severity: silent
  validation_limits:
    - "Does not produce a daily discharge hydrograph; not applicable to gauge-discharge streamflow benchmarks (use a hydrologic model)."
    - "surface_water__discharge from FlowAccumulator is steady-state, not a time series."
    - "OverlandFlow de Almeida shallow-water solver operates on RasterModelGrid only and is most stable in low-relief terrain; instabilities arise on steep landscapes."
    - "SPACE is a geologic-timescale landscape-evolution model and is structurally unsuited to annual sediment-yield estimation on real DEMs."
    - "Unit-agnostic: no internal dimensional checking, so all dimensional correctness is external to the model."
  warnings:
    - "FlowAccumulator must run before any erosion component each timestep, and again after erosion changes topography."
    - "Set boundary-node status before component instantiation; at least one open (FIXED_VALUE) outlet is required."
    - "Only core nodes should be uplifted; uplifting fixed-value boundary nodes corrupts the outlet condition."
    - "Components couple only through shared named grid fields; a component that mutates topographic__elevation directly can silently break the topo = bedrock + soil invariant maintained by SPACE/ErosionDeposition."
    - "For slope-area concavity use a 2-D spatial gradient and log-area binning, and open_all boundaries on DEM clips; D8 receiver slope on a depression-filled DEM collapses the regression."
    - "Fit SPACE Qs-Q as log(Qs) vs log(Q) directly; fitting SSC=Qs/Q vs Q yields a spurious always-negative exponent."
  assumptions:
    - statement: "This dag describes the validated landscape-evolution workflow (flow routing -> stream-power/SPACE erosion -> hillslope diffusion -> weathering) composed from Landlab components, not the full ~60-component framework."
      scope: "scope and module selection"
      source: "Landlab User Guide (components) and Hobley et al. 2017 ESurf 5:21-46"
      status: adopted
    - statement: "The dominant temporal grain is annual: the validated workflow steps in years (e.g. 500 yr/step over 2 Myr) over geologic landscape-evolution timescales; the event-scale overland-flow components are a secondary capability."
      scope: "temporal scale"
      source: "Landlab User Guide and Hobley et al. 2017 ESurf 5:21-46"
      status: adopted
    - statement: "Geometry is treated as 2-D over a model grid with 1-D vertical soil/bedrock columns (topographic__elevation = bedrock__elevation + soil__depth)."
      scope: "geometry / closure"
      source: "Landlab grid User Guide and SPACE/ErosionDeposition component field invariant"
      status: adopted
    - statement: "Mass-balance closure holds for the sediment/soil/bedrock columns and fluvial sediment routing; there is no internal unit or energy-balance closure (the framework is unit-agnostic)."
      scope: "closure"
      source: "Landlab components User Guide; component _info field metadata"
      status: adopted
    - statement: "soil_production__rate (m/yr) is the standard ExponentialWeatherer output field (the P in P = P0 exp(-H/H*)); it is reported in the docs output table though not enumerated among the source-level grid state fields."
      scope: "states / ExponentialWeatherer output grounding"
      source: "Landlab ExponentialWeatherer component documentation"
      status: tentative
    - statement: "v_s is interpreted in m/yr at landscape-evolution timescales, despite the calibration table listing m/s, because the validated SPACE configuration uses v_s = 5 m/yr."
      scope: "ErosionDeposition/SPACE settling velocity units"
      source: "Landlab ErosionDeposition/SPACE component documentation and the validated SPACE configuration"
      status: tentative
    - statement: "Annual sediment yield is obtained via detachment-limited stream power (E = K_sp A^m S^n), and SPACE is reserved for transport-limited landscape evolution."
      scope: "sediment-yield methodology"
      source: "Shobe et al. 2017 SPACE (GMD) vs Whipple & Tucker 1999 stream-power incision (JGR)"
      status: adopted
