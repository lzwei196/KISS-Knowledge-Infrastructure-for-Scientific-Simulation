- id: dt_001
  name: "DLBreach binary not found"
  severity: fatal
  stage: s1_installation
  failure_domain: dependency
  symptom: "tools/s1_installation/verify_dlbreach.py reports status=binary_not_found or tools/s6_execution/run_dlbreach.py returns DLBreach binary not found."
  diagnosis: "The KI wraps the standalone Clarkson DLBreach 2016.4 Fortran binary, searched at KISSPATH_BINARIES/dlbreach/bin/DLBreach_Barrier.exe and related paths by verify_dlbreach.py and run_dlbreach.py. The binary is absent or not on PATH."
  remedy: "Place DLBreach_Barrier.exe or DLBreach.exe under KISSPATH_BINARIES/dlbreach/bin, then run python3 tools/s1_installation/verify_dlbreach.py --json and confirm status=success."
  detection: "python3 tools/s1_installation/verify_dlbreach.py --json"
  cross_references:
    - "SKILL.md Quick Reference"

- id: dt_002
  name: "Windows executable without Wine"
  severity: fatal
  stage: s1_installation
  failure_domain: dependency
  symptom: "verify_dlbreach.py reports status=wine_not_available or run_dlbreach.py returns Windows .exe found but Wine not installed."
  diagnosis: "On Linux this KI runs DLBreach_Barrier.exe through Wine unless a native executable is supplied. verify_dlbreach.py detects an .exe but shutil.which(\"wine\") is empty."
  remedy: "Install Wine or supply a native executable, then rerun python3 tools/s1_installation/verify_dlbreach.py --json and confirm the platform is windows_exe_wine or linux_native."
  detection: "python3 tools/s1_installation/verify_dlbreach.py --json | rg 'wine_not_available|windows_exe_no_wine'"
  cross_references:
    - dt_001

- id: dt_003
  name: "Case input file missing"
  severity: fatal
  stage: s6_execution
  failure_domain: runtime
  symptom: "run_dlbreach.py exits with Input file not found for casename.txt."
  diagnosis: "DLBreach reads a single card-based ASCII file named casename.txt from the run working directory. tools/s6_execution/run_dlbreach.py checks work_dir/casename.txt before launching the binary."
  remedy: "Run tools/s5_breach_config/assemble_input_file.py with the same --casename and --output_dir used by run_dlbreach.py, then verify that work_dir/casename.txt exists."
  detection: "python3 tools/s6_execution/run_dlbreach.py --casename CASE --work_dir WORKDIR"
  cross_references:
    - dt_006

- id: dt_004
  name: "Empty output from missing downstream channel card"
  severity: fatal
  stage: s6_execution
  failure_domain: configuration
  symptom: "run_dlbreach.py returns status=no_output, or casename.out exists but is empty even though the model launched."
  diagnosis: "SKILL.md states the Fortran binary requires Downstream_Channel_Flow_Out. tools/s5_breach_config/assemble_input_file.py now appends this card with width, slope, and Manning n because omitting it produces an empty output file."
  remedy: "Regenerate the input with assemble_input_file.py or add Downstream_Channel_Flow_Out width_m, slope, manning_n to casename.txt, then rerun run_dlbreach.py and confirm casename.out has data lines."
  detection: "rg '^Downstream_Channel_Flow_Out' WORKDIR/CASE.txt && test -s WORKDIR/CASE.out"
  cross_references:
    - "SKILL.md Downstream card required"

- id: dt_005
  name: "Malformed multiline card block"
  severity: fatal
  stage: s5_breach_config
  failure_domain: configuration
  symptom: "DLBreach crashes immediately, prints a Fortran read error, or extract_breach_results.py later finds no valid rows."
  diagnosis: "DLBreach uses Fortran READ parsing. SKILL.md forbids comments or blank lines between multiline card keywords and their data lines for Upstream_Reservoir, Upstream_Reservoir_Inflow, and WSL time-series cards."
  remedy: "Regenerate reservoir and inflow cards with create_reservoir_curve.py and convert_cama_to_inflow.py, then assemble with assemble_input_file.py. Inspect the final card blocks and remove comments or blank lines inside each multiline block."
  detection: "rg -n '^Upstream_Reservoir|^Upstream_Reservoir_Inflow|^Upstream_.*WSL' WORKDIR/CASE.txt"
  cross_references:
    - dt_003
    - dt_018

- id: dt_006
  name: "Required cards missing"
  severity: fatal
  stage: s5_breach_config
  failure_domain: configuration
  symptom: "assemble_input_file.py prints Missing required cards and returns status=incomplete."
  diagnosis: "tools/s5_breach_config/assemble_input_file.py requires Time_Step, Simulation_Period, embankment geometry, breach mode, sediment cards, Sediment_Internal_Friction, and Initial_Up&Downstream_WSL before a complete DLBreach input can be run."
  remedy: "Generate geometry with create_dam_geometry.py, reservoir with create_reservoir_curve.py, inflow with convert_cama_to_inflow.py or manual CSV, breach parameters with set_breach_parameters.py, then rerun assemble_input_file.py until required_missing is empty."
  detection: "python3 tools/s5_breach_config/assemble_input_file.py --casename CASE --output_dir WORKDIR --time_step 1 --sim_period '0, 86400'"
  cross_references:
    - dt_003

- id: dt_007
  name: "Mixed time-unit convention"
  severity: silent
  stage: s4_inflow
  failure_domain: unit_conversion
  symptom: "The run completes but peak breach discharge occurs 3600 times too early or too late, or the inflow hydrograph timing does not match the CaMa event."
  diagnosis: "This KI documents a mixed DLBreach convention. Time_Step and Simulation_Period are seconds, while Upstream_Reservoir_Inflow, WSL time series, and output column 1 are hours. convert_cama_to_inflow.py writes hourly times and offsets sim_start_sec by dividing by 3600."
  remedy: "Keep Time_Step and Simulation_Period in seconds, keep inflow and WSL tabular times in hours, and regenerate CaMa inflow with convert_cama_to_inflow.py rather than hand-converting daily CaMa data."
  detection: "rg -n '^Time_Step|^Simulation_Period|^Upstream_Reservoir_Inflow' WORKDIR/CASE.txt"
  cross_references:
    - "dag.yaml inputs.forcing.inflow_hydrograph"
    - dt_008

- id: dt_008
  name: "Simulation period entered as hours"
  severity: fatal
  stage: s6_execution
  failure_domain: unit_conversion
  symptom: "casename.out contains only one or two data lines and the breach never has time to develop."
  diagnosis: "Simulation_Period is seconds in SKILL.md and dag.yaml. Entering 24 for a one-day case stops the model after 24 seconds, not 24 hours."
  remedy: "Set Simulation_Period end_sec to hours * 3600, for example 86400 for 24 hours or 172800 for 48 hours, then rerun run_dlbreach.py."
  detection: "rg -n '^Simulation_Period' WORKDIR/CASE.txt && wc -l WORKDIR/CASE.out"
  cross_references:
    - dt_007

- id: dt_009
  name: "Reservoir volume or area left in MCM or km2"
  severity: silent
  stage: s3_reservoir_curve
  failure_domain: unit_conversion
  symptom: "The upstream water level drops to near zero almost immediately and peak breach discharge is far too low for the stated reservoir."
  diagnosis: "DLBreach Upstream_Reservoir values are SI. docs/format_spec.yaml and dag.yaml require volume in m3 and surface area in m2. Passing storage in MCM or area in km2 makes the reservoir about 1000000 times too small."
  remedy: "Convert MCM to m3 by multiplying by 1000000 and km2 to m2 by multiplying by 1000000, then regenerate the Upstream_Reservoir card with create_reservoir_curve.py using --volume_m3 and --area_m2."
  detection: "python3 tools/s3_reservoir_curve/create_reservoir_curve.py --method 2 --volume_m3 V --area_m2 A --dam_height H"
  cross_references:
    - "tools/s3_reservoir_curve/create_reservoir_curve.py"

- id: dt_010
  name: "Water levels are absolute elevations"
  severity: silent
  stage: s5_breach_config
  failure_domain: unit_conversion
  symptom: "The model completes but overtopping starts at the wrong head, downstream tailwater is unrealistic, or breach flow is zero when a flood was expected."
  diagnosis: "Initial_Up&Downstream_WSL and WSL time series are meters above embankment base, not georeferenced elevation. dag.yaml states water levels are relative to the embankment base."
  remedy: "Subtract the embankment base elevation from reservoir and tailwater elevations before writing Initial_Up&Downstream_WSL or WSL time-series cards. Verify upstream_wsl is greater than Embankment_Height for initial overtopping."
  detection: "rg -n '^Embankment_Height|^Initial_Up&Downstream_WSL|^Upstream_WSL|^Downstream_WSL' WORKDIR/CASE.txt"
  cross_references:
    - dt_021

- id: dt_011
  name: "Slope convention reversed"
  severity: silent
  stage: s2_dam_properties
  failure_domain: unit_conversion
  symptom: "Generated geometry is implausibly steep or flat, and breach width or side-slope evolution is abnormal without a parser error."
  diagnosis: "DLBreach uses V/H slope ratios for Embankment_Upstream_Slope, Embankment_Downstream_Slope, and breach side slope. create_dam_geometry.py validates slopes as V/H, so entering 3 for a 1V to 3H face makes the slope far too steep."
  remedy: "Enter V/H as the reciprocal of H/V. For a 1V to 3H earthfill slope, use 0.333, then rerun create_dam_geometry.py and check the computed base_width_m."
  detection: "python3 tools/s2_dam_properties/create_dam_geometry.py --height_m H --crest_width_m C --upstream_slope_vh S1 --downstream_slope_vh S2 --length_m L"
  cross_references:
    - "SKILL.md Key Input Format Rules"

- id: dt_012
  name: "Internal friction entered in degrees"
  severity: silent
  stage: s5_breach_config
  failure_domain: unit_conversion
  symptom: "Breach side-slope mass wasting is effectively disabled or wildly overactive, but DLBreach still runs."
  diagnosis: "Sediment_Internal_Friction is tan(phi) in this KI, not phi in degrees. SKILL.md and dag.yaml list the unit as tan(phi), and set_breach_parameters.py writes the value directly to the card."
  remedy: "Convert degrees to tangent before authoring the card. For phi=30 degrees use about 0.577, then rerun set_breach_parameters.py with --internal_friction 0.577."
  detection: "rg -n '^Sediment_Internal_Friction' WORKDIR/CASE.txt"
  cross_references:
    - "dag.yaml Sediment_Internal_Friction"

- id: dt_013
  name: "Porosity entered as percent"
  severity: silent
  stage: s5_breach_config
  failure_domain: unit_conversion
  symptom: "Erosion rate and breach growth are nonsensical while the input file still parses."
  diagnosis: "Sediment_Porosity is a fraction in dag.yaml and set_breach_parameters.py defaults it to 0.35. Entering 35 instead of 0.35 corrupts sediment volume accounting."
  remedy: "Use decimal fractions in the 0.30 to 0.45 range, then regenerate breach cards with set_breach_parameters.py and inspect Sediment_Porosity."
  detection: "rg -n '^Sediment_Porosity' WORKDIR/CASE.txt"
  cross_references:
    - "tools/s5_breach_config/set_breach_parameters.py"

- id: dt_014
  name: "Cohesive kd unit trap"
  severity: silent
  stage: s5_breach_config
  failure_domain: unit_conversion
  symptom: "For a cohesive embankment the breach develops almost instantly or barely erodes even though no runtime error is raised."
  diagnosis: "Cohesive_Soil_Erosion_kd is expected in cm3/N-s by SKILL.md, dag.yaml, and set_breach_parameters.py. Treating it as m3/N-s or applying an extra SI conversion changes erodibility by orders of magnitude."
  remedy: "Use the DLBreach card value in cm3/N-s, start with kd=10.0 for a baseline cohesive case, and run sensitivity cases across 2.5, 5, 10, 20, and 30."
  detection: "rg -n '^Cohesive_Soil_Erosion_kd|^Noncohesive_or_Cohesive_Sediment' WORKDIR/CASE.txt"
  cross_references:
    - "SKILL.md Recommended Parameter Values"

- id: dt_015
  name: "Noncohesive Manning formula inverted"
  severity: degraded
  stage: s5_breach_config
  failure_domain: configuration
  symptom: "Noncohesive breach discharge is systematically too high or too low and breach evolution is overly sensitive to roughness."
  diagnosis: "set_breach_parameters.py auto-computes noncohesive Breach_Manning_n as 12 * d50^(1/6) for field cases when --manning_n is omitted. Manually entering a value from the reciprocal helper estimate or from different conventions bypasses that Wu 2016 card convention."
  remedy: "For noncohesive runs, omit --manning_n unless site roughness is known, or compute n with the same field convention used by set_breach_parameters.py and confirm the generated Breach_Manning_n card."
  detection: "python3 tools/s5_breach_config/set_breach_parameters.py --breach_mode 1 --sediment_type 1 --sediment_diameter D"
  cross_references:
    - "tools/s5_breach_config/set_breach_parameters.py"

- id: dt_016
  name: "Wrong CaMa inflow cell"
  severity: degraded
  stage: s4_inflow
  failure_domain: grid_coupling
  symptom: "The Upstream_Reservoir_Inflow hydrograph is zero, far too small, or from the wrong river branch for the dam."
  diagnosis: "convert_cama_to_inflow.py maps dam_lat and dam_lon to the nearest CaMa outflw grid cell and only warns when the distance exceeds 0.25 degrees. CaMa 15 arcmin routing can select an adjacent tributary or dry cell if the dam coordinate is off."
  remedy: "Compare the selected outflw magnitude with observed or design inflow, inspect neighboring CaMa cells, and use manual_csv if the nearest grid cell is not hydrologically representative."
  detection: "python3 tools/s4_inflow/convert_cama_to_inflow.py --cama_outflw_nc FILE --dam_lat LAT --dam_lon LON --output inflow.json"
  cross_references:
    - "docs/model_couplings.yaml coupling_cama_to_dlbreach_inflow"

- id: dt_017
  name: "Breach injection cell or area wrong"
  severity: degraded
  stage: s7_output
  failure_domain: grid_coupling
  symptom: "After inject_breach_to_cama.py and rerunning CaMa-Flood, the flood wave appears in the wrong location or has an impossible runoff depth."
  diagnosis: "docs/model_couplings.yaml requires injecting breach_flow plus spillway_gate_flow into the first downstream CaMa cell, not the dam cell. inject_breach_to_cama.py also converts m3/s to mm/day using cell_area_m2, so a km2 area value creates a 1000000-fold unit error."
  remedy: "Use CaMa nextxy to select the first downstream cell, pass --cell_area_m2 in square meters, and verify total_breach_volume_m3 plus a downstream discharge increase after the CaMa rerun."
  detection: "python3 tools/s7_output/inject_breach_to_cama.py --breach_csv CSV --cama_runoff_nc NC --downstream_lat LAT --downstream_lon LON --cell_area_m2 AREA"
  cross_references:
    - "docs/model_couplings.yaml coupling_dlbreach_to_cama_runoff"

- id: dt_018
  name: "Output parser finds no 13-column rows"
  severity: fatal
  stage: s7_output
  failure_domain: validation
  symptom: "extract_breach_results.py exits with No valid data lines parsed from output file or logs expected 13 columns."
  diagnosis: "DLBreach output is a 13-column ASCII file according to SKILL.md and tools/s7_output/extract_breach_results.py. A wrong file, truncated run, empty output, or malformed Fortran output leaves the parser without valid rows."
  remedy: "Check that run_dlbreach.py produced the expected casename.out, confirm the file has numeric 13-column rows, then rerun extract_breach_results.py on that file."
  detection: "awk 'NF && $1 !~ /^[#!]/ {print NF; exit}' WORKDIR/CASE.out"
  cross_references:
    - dt_004
    - dt_005

- id: dt_019
  name: "Python reimplementation used"
  severity: silent
  stage: s6_execution
  failure_domain: validation
  symptom: "The workflow completes but peak breach discharge is about an order of magnitude lower than the DLBreach benchmark expectation."
  diagnosis: "SKILL.md explicitly forbids substituting dlbreach.py for the Fortran DLBreach_Barrier.exe. The KI notes the simplified Python reimplementation produced about 10x lower peak discharge than the Fortran original on the Banqiao validation case."
  remedy: "Run the real binary through tools/s6_execution/run_dlbreach.py and verify binary_path points to DLBreach_Barrier.exe or a native Fortran build, not dlbreach.py."
  detection: "python3 tools/s6_execution/run_dlbreach.py --casename CASE --work_dir WORKDIR --output run.json && rg 'DLBreach_Barrier|DLBreach.exe' run.json"
  cross_references:
    - "SKILL.md Mandatory Execution Policy"

- id: dt_020
  name: "Piping breach starts above water"
  severity: silent
  stage: s5_breach_config
  failure_domain: initial_conditions
  symptom: "A piping-mode case runs but produces no piping flow and no breach development."
  diagnosis: "Initial_Piping_Breach is depth below crest plus width. The pipe elevation equals Embankment_Height minus the depth value; if that elevation is above Initial_Up&Downstream_WSL upstream water level, no hydraulic head drives piping."
  remedy: "Set Initial_Piping_Breach depth so Embankment_Height - pipe_depth is below upstream_wsl, regenerate breach cards with set_breach_parameters.py, and rerun."
  detection: "rg -n '^Breach_Mode|^Embankment_Height|^Initial_Piping_Breach|^Initial_Up&Downstream_WSL' WORKDIR/CASE.txt"
  cross_references:
    - "dag.yaml Initial_Piping_Breach"

- id: dt_021
  name: "Overtopping never initiates"
  severity: silent
  stage: s5_breach_config
  failure_domain: initial_conditions
  symptom: "Breach flow remains zero for the full overtopping simulation and breach geometry does not change."
  diagnosis: "For Breach_Mode=1, upstream water level must exceed Embankment_Height or be raised above it by the inflow hydrograph. If Initial_Up&Downstream_WSL is below crest and inflow never fills the reservoir, overtopping does not start."
  remedy: "Set upstream WSL above the embankment crest for an initial overtopping case, or provide an Upstream_Reservoir_Inflow hydrograph that raises the reservoir above crest during the Simulation_Period."
  detection: "rg -n '^Breach_Mode|^Embankment_Height|^Initial_Up&Downstream_WSL|^Upstream_Reservoir_Inflow' WORKDIR/CASE.txt"
  cross_references:
    - dt_010

- id: dt_022
  name: "Visualization CSV headers missing"
  severity: fatal
  stage: s8_visualization
  failure_domain: validation
  symptom: "plot_breach_hydrograph.py or plot_breach_evolution.py exits with a KeyError such as time_hr, breach_flow_m3s, or breach_top_width_m."
  diagnosis: "The S8 visualization tools read CSV files with csv.DictReader and directly require the column names emitted by tools/s7_output/extract_breach_results.py. Supplying raw casename.out, a hand-edited CSV, or a CSV generated outside this KI leaves the expected headers absent."
  remedy: "Run python3 tools/s7_output/extract_breach_results.py --output_file WORKDIR/CASE.out --format csv --output_dir WORKDIR, then pass WORKDIR/CASE_results.csv to the S8 plotting tool and confirm the header contains time_hr and breach_flow_m3s."
  detection: "head -n 1 WORKDIR/CASE_results.csv | rg 'time_hr,breach_flow_m3s,spillway_gate_flow_m3s'"
  cross_references:
    - dt_018
    - "tools/s7_output/extract_breach_results.py"

- id: dt_023
  name: "Preflight test omits downstream channel card"
  severity: fatal
  stage: s1_installation
  failure_domain: configuration
  symptom: "verify_dlbreach.py finds the DLBreach binary but returns status=test_failed with no output file generated."
  diagnosis: "SKILL.md says the Fortran binary requires Downstream_Channel_Flow_Out, but tools/s1_installation/verify_dlbreach.py embeds MINIMAL_TEST_INPUT without that card. A real installed binary can therefore look broken during preflight because the KI test case is incomplete."
  remedy: "Patch MINIMAL_TEST_INPUT in tools/s1_installation/verify_dlbreach.py to include Downstream_Channel_Flow_Out width_m, slope, manning_n before rerunning python3 tools/s1_installation/verify_dlbreach.py --json."
  detection: "python3 tools/s1_installation/verify_dlbreach.py --json | rg 'test_failed|no output file generated'"
  cross_references:
    - dt_004
    - "tools/s1_installation/verify_dlbreach.py"

- id: dt_024
  name: "Embankment length caps breach width"
  severity: degraded
  stage: s2_dam_properties
  failure_domain: configuration
  symptom: "The run completes but final breach bottom width stops at an unexpectedly small value compared with the dam geometry."
  diagnosis: "dag.yaml safety.hazards states Embankment_Length is the maximum breach bottom width, not the crest length. tools/s2_dam_properties/create_dam_geometry.py also warns when length_m is smaller than the computed trapezoid base_width_m."
  remedy: "Compute base_width_m with create_dam_geometry.py, set --length_m to the intended maximum breach bottom width, and verify the generated Embankment_Length card before assembly."
  detection: "python3 tools/s2_dam_properties/create_dam_geometry.py --height_m H --crest_width_m C --upstream_slope_vh US --downstream_slope_vh DS --length_m L"
  cross_references:
    - "dag.yaml safety.hazards.embankment_length_caps_breach_width"
    - "tools/s2_dam_properties/create_dam_geometry.py"

- id: dt_025
  name: "Explicit time step instability"
  severity: fatal
  stage: s6_execution
  failure_domain: runtime
  symptom: "casename.out contains NaN, Inf, oscillating discharge, or the model crashes during rapid breach growth."
  diagnosis: "dag.yaml safety.hazards documents timestep_too_large_instability for DLBreach's explicit forward-Euler time loop. The KI recommends 0.1-1 s for lab cases and 1-5 s for field cases, with smaller steps for very large dams."
  remedy: "Reduce Time_Step, rerun run_dlbreach.py, and compare peak_breach_q_m3s and peak_time_hr against a second run at half the time step before accepting the result."
  detection: "rg -n 'nan|inf|Infinity' WORKDIR/CASE.out || rg -n '^Time_Step' WORKDIR/CASE.txt"
  cross_references:
    - "dag.yaml safety.hazards.timestep_too_large_instability"
    - "SKILL.md Time Step"

- id: dt_026
  name: "Manual inflow CSV uses seconds"
  severity: silent
  stage: s4_inflow
  failure_domain: unit_conversion
  symptom: "A manual inflow case runs but the flood peak timing is shifted by a factor of 3600."
  diagnosis: "tools/s4_inflow/convert_cama_to_inflow.py manual_csv mode reads the first column directly as times_hr and writes it unchanged to Upstream_Reservoir_Inflow. Supplying seconds in manual_csv silently violates the DLBreach inflow card convention."
  remedy: "Convert the manual CSV first column to hours before running convert_cama_to_inflow.py, then inspect the generated Upstream_Reservoir_Inflow block for hour-scale times."
  detection: "python3 tools/s4_inflow/convert_cama_to_inflow.py --manual_csv INFLOW.csv --dam_lat LAT --dam_lon LON --output inflow.json && rg 'Upstream_Reservoir_Inflow' inflow.json"
  cross_references:
    - dt_007
    - "tools/s4_inflow/convert_cama_to_inflow.py"

- id: dt_027
  name: "Stale DLBreach output reused"
  severity: silent
  stage: s6_execution
  failure_domain: runtime
  symptom: "extract_breach_results.py succeeds, but the parsed peak discharge belongs to an older run rather than the current input cards."
  diagnosis: "tools/s6_execution/run_dlbreach.py deletes WORKDIR/CASE.out before execution, but manual binary runs do not. If DLBreach fails before writing a new output, a stale casename.out can still be parsed as valid 13-column output."
  remedy: "Run through tools/s6_execution/run_dlbreach.py or delete WORKDIR/CASE.out immediately before a manual run, then confirm the output modification time is newer than WORKDIR/CASE.txt."
  detection: "test WORKDIR/CASE.out -nt WORKDIR/CASE.txt && python3 tools/s7_output/extract_breach_results.py --output_file WORKDIR/CASE.out --format json --output_dir WORKDIR"
  cross_references:
    - dt_018
    - "tools/s6_execution/run_dlbreach.py"

- id: dth
  name: "Dam-height datum mismatch"
  severity: silent
  stage: s5_breach_config
  failure_domain: unit_conversion
  symptom: "An overtopping case assembles and executes, but breach_flow_m3s remains zero, S8 plots show no breach geometry evolution, or upstream_wsl_m is inconsistent with the intended crest/headwater relation."
  diagnosis: "tools/s2_dam_properties/create_dam_geometry.py writes Embankment_Height as crest-to-base height, and tools/s5_breach_config/set_breach_parameters.py writes Initial_Up&Downstream_WSL directly as meters above the same embankment base. Supplying absolute reservoir elevations or crest elevations mixes datums; the S8 tools then plot upstream_wsl_m and breach_bottom_elev_m from tools/s7_output/extract_breach_results.py on the wrong base-relative comparison."
  remedy: "Regenerate S2 with --height_m equal to crest elevation minus base elevation, regenerate S5 with --upstream_wsl and --downstream_wsl also measured above the embankment base, then verify the assembled CASE.txt contains consistent Embankment_Height and Initial_Up&Downstream_WSL values before rerunning S6-S8."
  detection: "rg -n '^Embankment_Height|^Initial_Up&Downstream_WSL|^Breach_Mode' WORKDIR/CASE.txt && python3 tools/s7_output/extract_breach_results.py --output_file WORKDIR/CASE.out --format json --output_dir WORKDIR"
  cross_references:
    - dt_010
    - dt_021
    - "tools/s2_dam_properties/create_dam_geometry.py"
    - "tools/s5_breach_config/set_breach_parameters.py"

- id: dth_m
  name: "Dam height not supplied in meters"
  severity: degraded
  stage: s2_dam_properties
  failure_domain: unit_conversion
  symptom: "create_dam_geometry.py rejects height_m as outside the 1-300 m range, warns about an implausible computed base_width_m, or S8 breach-evolution plots show impossible breach-bottom elevations for the intended dam."
  diagnosis: "The S2 tool validates height_m against VALID_RANGES in tools/s2_dam_properties/create_dam_geometry.py and computes base_width_m as crest_width + height / upstream_slope_vh + height / downstream_slope_vh. Passing feet, centimeters, storage-elevation values, or an absolute crest elevation instead of a meter-scale crest-to-base height corrupts the generated Embankment_Height card used by S5 and by the S8 geometry interpretation."
  remedy: "Convert the dam height to meters above embankment base before running create_dam_geometry.py, then check that its JSON has status=success, validation_errors=[], and a plausible properties.base_width_m before assembling the DLBreach input."
  detection: "python3 tools/s2_dam_properties/create_dam_geometry.py --height_m H --crest_width_m C --upstream_slope_vh US --downstream_slope_vh DS --length_m L --output WORKDIR/geometry.json"
  cross_references:
    - dt_011
    - dt_024
    - "docs/format_spec.yaml"
