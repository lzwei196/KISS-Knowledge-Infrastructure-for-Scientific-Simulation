validation:
  tier: "analytic"
  tier_justification: "Validated against built-in Hupselbrook test case with published reference water balance"
  benchmark: "Hupselbrook, Netherlands (KNMI station 283), 2002-2004"
  metrics:
    reference_rain_cm: 84.18
    reference_transpiration_cm: 38.17
    reference_soil_evaporation_cm: 16.69
    reference_drainage_cm: 22.11
  figure: "figures/s8_validation.png"

