    doi: 10.13031/trans.58.10715
    needed_for: [drainage_flux, bottom_flux]
  - ref: "Anderson and Woessner / Hill groundwater-head calibration criteria"
    doi: unknown_not_fetched
    needed_for: [groundwater_level]
  - ref: "Partitioned ET evaporation/transpiration field validation studies for SWAP or lysimeter ET partitioning"
    doi: unknown_not_fetched
    needed_for: [actual_transpiration, actual_soil_evaporation]
