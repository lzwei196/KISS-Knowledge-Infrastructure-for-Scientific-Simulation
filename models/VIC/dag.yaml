    - from: "PREC (precipitation forcing)"
      to: "OUT_RUNOFF"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      citations: ["ijde2026_vic_tibetan_gsa_ml", "sepulveda2022_vic_hydroclimatic_gradient"]
    - from: "AIR_TEMP (temperature forcing)"
      to: "OUT_SWE"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      citations: ["ijde2026_vic_tibetan_gsa_ml", "bennett2018_vic_colorado_global_sensitivity"]
    - from: "SWDOWN / LWDOWN (radiation forcing)"
      to: "OUT_EVAP"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      citations: ["ijde2026_vic_tibetan_gsa_ml"]
  citation_index:
    demaria2007_vic_monte_carlo:
      short_citation: "Demaria, Nijssen & Wagener 2007"
      doi: "10.1029/2006JD007534"
      note: "Monte Carlo / MCAT sensitivity and identifiability of 10 VIC runoff parameters over four US watersheds; b_inf and exp sensitivities depend on hydroclimatic gradient."
    gou2020_vic_china_calibration:
      short_citation: "Gou et al. 2020"
      doi: "10.1029/2019WR025968"
      note: "Sobol-sequence GSA on 13 VIC parameters at 30 gauges across 10 major Chinese basins; ASMO calibration; B and soil depths D1/D2 highly sensitive."
    sepulveda2022_vic_hydroclimatic_gradient:
      short_citation: "Sepulveda et al. 2022"
      doi: "10.5194/hess-26-3419-2022"
      note: "DELSA hybrid local-global SA on 43 VIC parameters across 101 Chilean catchments / 5574 grid cells at 0.05 deg; 12 dominant parameters incl. INFILT, Ds, DsMAX, Ws, Expt2, Depth2, Depth3, NEW_ALB, ALB_THA, ALB_AA, LAI, Rmin."
    bennett2018_vic_colorado_global_sensitivity:
      short_citation: "Bennett et al. 2018"
      doi: "10.1002/2017WR020471"
      note: "Variance-based Sobol-style GSA with LHS and emulator on 46 VIC parameters in the Colorado Basin under future climate; snow-dominated regions most sensitive; ET / runoff sensitive to albedo; SWE sensitive to canopy fraction and LAI."
    ijde2026_vic_tibetan_gsa_ml:
      short_citation: "Tibetan-Plateau VIC GSA + ML 2026"
      doi: "10.1080/17538947.2026.2625537"
      note: "Three GSA methods + Random Forest SHAP attribution on VIC over the Tibetan Plateau; east-west gradient driven by T, P, radiation; two-step optimization improves LST and SCF without degrading runoff."

safety:
  hazards:
    - id: "max_layers_silent_cap"
      kind: "control_semantic"
      description: "MAX_LAYERS=3 is a compile-time cap (vic_def.h line 42); requesting Nlayer>3 in the global parameter file silently fails to take effect."
      severity: "silent"
    - id: "max_nodes_silent_cap"
      kind: "control_semantic"
      description: "MAX_NODES=50 (vic_def.h line 43) caps the number of soil thermal nodes; requesting more is silently truncated."
      severity: "silent"
    - id: "subdaily_step_bounds"
      kind: "control_semantic"
      description: "MIN_SUBDAILY_STEPS_PER_DAY=4 and MAX_SUBDAILY_STEPS_PER_DAY=1440 (vic_def.h lines 56-57); steps coarser than 6 h or finer than 1 minute are rejected at init."
      severity: "fatal"
    - id: "resid_moist_default_zero"
      kind: "soil_semantic"
      description: "Default residual soil moisture SOIL_RESID_MOIST=0.0 (initialize_parameters.c) drains layers to bone-dry under sustained ET unless overridden in the soil parameter file."
      severity: "silent"
    - id: "huge_resist_initialization_order"
      kind: "numerical_instability"
      description: "veg_var.rc and rsLayer[*] are initialized to HUGE_RESIST=1e20 before canopy_evap runs; any solver that reads these before canopy_evap completes returns near-zero transpiration."
      severity: "silent"
    - id: "fcanopy_zero_lai_normalization_skip"
      kind: "numerical_instability"
      description: "vic_run.c lines 219-225: when fcanopy=0 the LAI normalization is skipped and Wdmax is not reset, so previous-step Wdmax persists into the next step."
      severity: "silent"
    - id: "lake_areai_restart_silent_zero"
      kind: "initial_condition_semantic"
      description: "lake_var.areai is restarted from the previous step's new_ice_area; if a state file does not preserve new_ice_area, the restart silently begins with areai=0."
      severity: "silent"
    - id: "lake_in_place_runoff_mutation"
      kind: "control_semantic"
      description: "vic_run.c lines 388-403: when LAKES is on, cell->runoff and cell->baseflow are mutated in place after the main loop writes them; downstream consumers see the lake-adjusted value, not the raw veg-tile contribution."
      severity: "silent"
    - id: "gridcell_avg_albedo_last_tile_leak"
      kind: "numerical_instability"
      description: "vic_run.c lines 357-360: gridcell_avg.avg_albedo is computed using the overstory flag from the LAST iterated veg tile; inconsistent overstory across tiles can yield a misweighted grid-cell albedo."
      severity: "silent"
    - id: "vic_run_veg_lib_global_pointer"
      kind: "numerical_instability"
      description: "vic_run.c line 90 sets a module-scope pointer vic_run_veg_lib=veg_lib that subordinate routines read instead of receiving veg_lib by argument; re-entrancy hazard when cells are parallelised."
      severity: "silent"
    - id: "missing_value_sentinel"
      kind: "parser_semantic"
      description: "MISSING=-99999.0 (vic_def.h) is emitted as the sentinel when a veg or band fraction is zero, or when an OUT_* variable is not produced by the active option set; consumers that average without masking will be biased."
      severity: "silent"
    - id: "forcing_record_count_mismatch"
      kind: "control_semantic"
      description: "Forcing files must span exactly STARTYEAR/STARTMONTH/STARTDAY to ENDYEAR/ENDMONTH/ENDDAY at FORCE_STEPS_PER_DAY; otherwise VIC errors 'Not enough records in forcing file'."
      severity: "fatal"
    - id: "model_force_steps_mismatch"
      kind: "control_semantic"
      description: "MODEL_STEPS_PER_DAY and FORCE_STEPS_PER_DAY must be consistent with the forcing temporal resolution; mismatches give physically meaningless fluxes without a fatal error."
      severity: "fatal_or_silent"
    - id: "frozen_soil_flag_type"
      kind: "control_semantic"
      description: "FROZEN_SOIL is a boolean (TRUE/FALSE) token in the global parameter file; supplying a path or other value is rejected at parse time."
      severity: "fatal"
    - id: "saturating_continueonerror"
      kind: "numerical_instability"
      description: "Solver return ERROR=-999 halts the cell unless CONTINUEONERROR is set; with CONTINUEONERROR on, failed cells silently produce MISSING outputs that aggregate into the grid-cell averages."
      severity: "silent"
  validation_limits:
    - "Designed for large grid cells (>> 1 km), flat and uniform; sub-kilometer or strongly heterogeneous cells violate the design assumption."
    - "No inter-cell lateral flow and no channel-to-soil return; basin-scale streamflow requires an external routing model."
    - "Plant phenology and biomass are not dynamic; LAI, fcanopy, root profile are prescribed."
    - "Multiple lakes in a single cell are collapsed to one composite lake; storage-area relationship is approximate per the model documentation."
  warnings:
    - "VIC-5 and VIC-4 are not interchangeable: input formats, state files, and binary configurations differ (Hamman et al. 2018)."
    - "An elevation-band file is required only when the number of snow bands exceeds 1; AreaFract and Pfactor each must sum to 1 across bands."
    - "Root-fraction sums >1 across root zones are auto-normalized by the model (benign warning); user should check intent."
    - "Vegetation, soil, and snow-band fractions are weighted but not geographically resolved within a cell."
    - "MODEL_STEPS_PER_DAY must align with FORCE_STEPS_PER_DAY; lake and snow sub-stepping (LAKE_STEPS_PER_DAY, SNOW_STEPS_PER_DAY) inherit this consistency requirement."
  assumptions:
    - statement: "VIC grid cells are simulated independently with no inter-cell lateral surface or subsurface flow."
      scope: "all model variants"
      source: "VIC ReadTheDocs Model Overview, Assumptions section (https://vic.readthedocs.io/en/master/Overview/ModelOverview/)"
      status: "adopted"
    - statement: "Streamflow routing is performed post-hoc by an external routing model; VIC's OUT_DISCHARGE is non-zero only inside the optional lake module."
      scope: "all model variants"
      source: "VIC ReadTheDocs Model Overview; VIC-5.1.0 vic/vic_run/src/vic_run.c and lake module code"
      status: "adopted"
    - statement: "Up to 3 soil layers and up to 50 soil thermal nodes are supported; exceeding these caps silently fails."
      scope: "all variants of VIC-5.1.0"
      source: "vic/vic_run/include/vic_def.h (MAX_LAYERS=3, MAX_NODES=50)"
      status: "adopted"
    - statement: "Per-cell water balance closes always; per-cell surface energy balance closes only in full-energy mode."
      scope: "FULL_ENERGY option in the global parameter file"
      source: "VIC ReadTheDocs Model Overview, Closure section; vic_run.c surface_fluxes / calc_surf_energy_bal"
      status: "adopted"
    - statement: "Default residual soil moisture is zero, default lapse rate is -0.0065 C/m, default surface emissivity is 0.97 for ground/veg/ice/snow and 0.98 for open water, and Stefan-Boltzmann and Von Karman constants are hard-coded."
      scope: "VIC-5.1.0 defaults applied when the soil parameter file does not override"
      source: "vic/drivers/shared_all/src/initialize_parameters.c; vic/vic_run/include/vic_physical_constants.h"
      status: "adopted"
    - statement: "When LAKES is enabled, cell->runoff and cell->baseflow are mutated in place after the main loop; reported OUT_RUNOFF and OUT_BASEFLOW reflect the post-lake values."
      scope: "LAKES option enabled"
      source: "vic/vic_run/src/vic_run.c lines 388-403"
      status: "adopted"
