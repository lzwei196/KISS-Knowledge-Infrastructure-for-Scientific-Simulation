template_version: "3.5"

identity:
  model_id: "QUINCY"
  scientific_reference_version: "QUINCY v1.0 (Thum et al. 2019, GMD; revision 1996 lineage) — analytic single-site C-N reimplementation of the coupled C-N(-P) terrestrial-biogeochemistry formulation"
  implementation:
    id: "quincy-analytic-py"
    version: "analytic reimplementation (QUINCYModel, monthly timestep)"
    provenance: "Python; HydroCraft analytic reimplementation of QUINCY's core biogeochemistry (Farquhar photosynthesis with N-limited Vcmax, CENTURY-like heterotrophic respiration, temperature-driven LAI), not the upstream MPI-BGC Fortran QUINCY."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "GPLv3 (upstream QUINCY code; model description CC-BY-4.0)"
  repo_url: "https://gmd.copernicus.org/articles/12/4781/2019/"

boundary:
  scope_in:
    - "Single-site terrestrial ecosystem carbon exchange (GPP, NEE, Reco, autotrophic and heterotrophic respiration)"
    - "Temperature-driven LAI phenology"
    - "Coupled carbon-nitrogen control of photosynthesis (leaf N modulates effective Vcmax)"
    - "Approximate latent and sensible heat fluxes"
  scope_out:
    - "Spatial coupling / lateral transport (point-scale only)"
    - "Fully implemented phosphorus limitation (stoichiometry tracked structurally; P limitation not realized)"
    - "Explicit prognostic vegetation/soil C-N-P pools (respiration is diagnostic, coupled to instantaneous GPP)"
    - "Closed surface energy balance (H is the Rn-LE residual)"
    - "Isotope tracking, biological N fixation, nitrification/denitrification (present in full QUINCY, absent in this analytic version)"
  spatial: "0-D point"
  temporal: "monthly (daily forcing aggregated to monthly; full QUINCY runs half-hourly)"
  closure: "none"
  notes: "Mass-balance is NOT enforced in the analytic reimplementation: respiration is diagnostic (Ra derived from instantaneous GPP via npp_approx = gpp - r_maint; Rh from a temperature x moisture response), with no explicit C-N-P pools or pool carryover, so annual (GPP-Reco) need not equal cumulative NEE. Energy is not closed: LE is derived from GPP via a fixed water-use efficiency and H is taken as the Rn-LE residual. The upstream QUINCY v1.0 enforces C/N/P mass balance and resolves explicit vegetation/soil pools at a half-hourly step; that closure does not transfer to this surrogate."

inputs:
  forcing:
    - {category: forcing, name: "SW_IN (incoming shortwave radiation)", unit: "W/m2", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column SW_IN; converted internally to PPFD via a fixed factor", notes: "Drives light-limited (Wj) electron transport and canopy assimilation; also sets net radiation for the energy-flux approximation."}
    - {category: forcing, name: "TA (air temperature at 2 m)", unit: "deg C", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column TA", notes: "Must be deg C, NOT Kelvin; drives Arrhenius temperature response of Vcmax/Jmax/Rd/Rh and the Gaussian LAI phenology."}
    - {category: forcing, name: "VPD (vapor pressure deficit)", unit: "hPa", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column VPD; used internally in hPa", notes: "Reduces the Ci/Ca ratio (VPD-linear surrogate in lieu of a Ball-Berry solve), constraining assimilation."}
    - {category: forcing, name: "PRECIP (precipitation)", unit: "mm/day", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column PRECIP", notes: "Drives the bell-shaped soil-moisture scalar of heterotrophic respiration; not used for a prognostic soil-water balance."}
    - {category: forcing, name: "CO2 (atmospheric CO2 mole fraction)", unit: "ppm", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column CO2", notes: "Sets ambient CO2 entering the Farquhar Ci computation; must be ppm, not mole fraction."}
    - {category: forcing, name: "DAYLENGTH (day fraction driver)", unit: "hours", source_kind: derived, model_input_format: "QUINCY-format forcing CSV column DAYLENGTH (derived from latitude and day-of-year)", notes: "Instantaneous daytime GPP is scaled by daylength/24 to a 24-h mean for comparison against eddy-covariance daily means."}
    - {category: forcing, name: "LW_IN (incoming longwave radiation, optional)", unit: "W/m2", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column LW_IN (optional)"}
    - {category: forcing, name: "WIND (wind speed, optional)", unit: "m/s", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column WIND (optional)"}
    - {category: forcing, name: "PA (air pressure, optional)", unit: "kPa", source_kind: forcing, model_input_format: "QUINCY-format forcing CSV column PA (optional)"}
  parameters:
    - {category: photosynthesis, name: "vcmax25 (max carboxylation rate at 25C)", unit: "umol/m2/s", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Acts only as an upper cap on the N-derived value: effective Vcmax25 = min(vcmax_n_slope*leaf_N, vcmax25). PFT-specific (boreal ENF default 45)."}
    - {category: photosynthesis, name: "jmax_vcmax_ratio (Jmax/Vcmax ratio)", unit: "-", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Controls whether RuBP-regeneration (Wj) ever limits assimilation; default 1.9."}
    - {category: photosynthesis, name: "alpha_j (quantum yield of electron transport)", unit: "mol/mol", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON"}
    - {category: photosynthesis, name: "theta_j (curvature of light response)", unit: "-", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON"}
    - {category: photosynthesis, name: "ea_vcmax (activation energy for Vcmax)", unit: "J/mol", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Must be J/mol, not kJ/mol; default 65330."}
    - {category: photosynthesis, name: "ea_jmax (activation energy for Jmax)", unit: "J/mol", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Default 43540."}
    - {category: n_limitation, name: "n_leaf_ref (reference leaf nitrogen content)", unit: "gN/m2_leaf", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Must be gN/m2; ENF 1.5-2.5. Sets the N-limited carboxylation capacity."}
    - {category: n_limitation, name: "vcmax_n_slope (Vcmax per unit leaf N)", unit: "umol/s/gN", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Vcmax25_eff = vcmax_n_slope*leaf_N, capped at vcmax25; the analytic surrogate's realization of QUINCY's N-control on photosynthesis."}
    - {category: stomatal_conductance, name: "g1_bb (Ball-Berry slope parameter)", unit: "-", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Declared and range-checked but NOT consumed by the assimilation routine in this analytic version; the Ci/Ca effect is realized by a hardcoded VPD-linear surrogate. Documented Ball-Berry conductance is not wired in here."}
    - {category: respiration, name: "r_maint_leaf (leaf maintenance respiration at 25C)", unit: "umol/m2leaf/s", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON"}
    - {category: respiration, name: "r_maint_stem (stem maintenance respiration at 25C)", unit: "umol/m2ground/s", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON"}
    - {category: respiration, name: "r_maint_root (root maintenance respiration at 25C)", unit: "umol/m2ground/s", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON"}
    - {category: respiration, name: "r_growth_frac (growth respiration fraction of NPP)", unit: "-", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Growth respiration term r_growth_frac*(GPP-R_maint); default 0.25."}
    - {category: respiration, name: "ea_rd (activation energy for dark respiration)", unit: "J/mol", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Default 46390; must be J/mol."}
    - {category: soil_decomposition, name: "rh_base (base heterotrophic respiration rate at Tref)", unit: "umol/m2/s", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Default 1.8."}
    - {category: soil_decomposition, name: "rh_q10 (Q10 temperature sensitivity of Rh)", unit: "-", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Default 2.0; >3 inflates Reco and flips NEE to net source."}
    - {category: soil_decomposition, name: "rh_t_ref (reference temperature for Rh)", unit: "deg C", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Default 15."}
    - {category: soil_decomposition, name: "rh_precip_scale (precipitation scaling for moisture response)", unit: "-", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Must be positive; default 0.02. Bell-shaped exp(-scale*(P-opt)^2)."}
    - {category: soil_decomposition, name: "rh_precip_opt (optimal precipitation for decomposition)", unit: "mm/day", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Default 2.5; moisture response peaks here."}
    - {category: phenology, name: "lai_max (maximum LAI)", unit: "m2/m2", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Must exceed lai_min or the seasonal GPP cycle vanishes."}
    - {category: phenology, name: "lai_min (minimum / evergreen-base LAI)", unit: "m2/m2", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON"}
    - {category: phenology, name: "lai_t_opt (temperature for maximum LAI)", unit: "deg C", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Set near mean growing-season T; if above site T range, LAI stays at lai_min."}
    - {category: phenology, name: "lai_t_range (temperature range for LAI response)", unit: "deg C", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON"}
    - {category: stoichiometry, name: "cn_leaf (leaf C:N ratio)", unit: "gC/gN", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "gC/gN (leaf 30-60); tracked stoichiometrically, not as prognostic pools in this version."}
    - {category: stoichiometry, name: "cn_root (fine-root C:N ratio)", unit: "gC/gN", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Typical 40-80."}
    - {category: stoichiometry, name: "cn_wood (wood C:N ratio)", unit: "gC/gN", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Typical 200-500."}
    - {category: stoichiometry, name: "cp_leaf (leaf C:P ratio)", unit: "gC/gP", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Tracked structurally; P limitation not realized in this analytic version."}
    - {category: stoichiometry, name: "np_leaf (leaf N:P ratio)", unit: "gN/gP", source_kind: calibrated, model_input_format: "PFT parameter dict / JSON", notes: "Tracked structurally; P limitation not realized."}
    - {category: kinetic_constant, name: "Kc (Michaelis constant for carboxylation at 25C; Ea 79430 J/mol)", unit: "umol/mol", source_kind: default, model_input_format: "hardcoded Farquhar kinetic constant (404.9) in the analytic core", notes: "Not exposed as configurable."}
    - {category: kinetic_constant, name: "Ko (Michaelis constant for oxygenation at 25C; Ea 36380 J/mol)", unit: "mmol/mol", source_kind: default, model_input_format: "hardcoded kinetic constant (278.4)"}
    - {category: kinetic_constant, name: "Gamma_star (CO2 compensation point at 25C; Ea 37830 J/mol)", unit: "umol/mol", source_kind: default, model_input_format: "hardcoded kinetic constant (42.75)"}
    - {category: kinetic_constant, name: "Oi (intercellular O2 concentration)", unit: "mmol/mol", source_kind: default, model_input_format: "hardcoded kinetic constant (210)"}
  initial_conditions:
    _reason: "The analytic reimplementation carries no explicit prognostic pool state and does not document initial-condition inputs; LAI and effective Vcmax are recomputed diagnostically each timestep from forcing and parameters. (Upstream QUINCY initializes from bare-ground plus a default SOM profile and a multi-decade spin-up; that does not apply to this surrogate.)"
  boundary_conditions:
    - {category: site_config, name: "lat (site latitude)", unit: "deg", source_kind: user_provided, model_input_format: "run configuration", notes: "Used for daylength / day-fraction scaling of GPP; wrong hemisphere sign swaps the seasonal cycle."}
    - {category: site_config, name: "lon (site longitude)", unit: "deg", source_kind: user_provided, model_input_format: "run configuration"}
    - {category: control_switch, name: "pft (plant functional type selector)", unit: "-", source_kind: user_provided, model_input_format: "run configuration (e.g., enf = evergreen needleleaf)", notes: "Selects the default parameter set; defaults are boreal ENF (Scots pine)."}

processes:
  modules:
    - {name: "TemperatureResponse", role: process_solver, brief: "Arrhenius scaling of rate constants (Vcmax, Jmax, dark respiration, kinetic constants) from a 25C reference to ambient temperature."}
    - {name: "Phenology_LAI", role: process_solver, brief: "Gaussian temperature-modulated LAI interpolated between lai_min and lai_max (evergreen base maintained year-round)."}
    - {name: "N_Limitation", role: process_solver, brief: "Sets effective carboxylation capacity vcmax25_eff = min(vcmax_n_slope*leaf_N, vcmax25); the analytic realization of QUINCY's coupled-N control on photosynthesis (reduced here to a cap)."}
    - {name: "Photosynthesis_Farquhar", role: process_solver, brief: "Farquhar Rubisco-limited (Wc) and RuBP-regeneration-limited (Wj) co-limitation with N-limited Vcmax, Beer's-law canopy scaling, VPD-based Ci/Ca surrogate, and daylength scaling to a 24-h GPP mean."}
    - {name: "AutotrophicRespiration", role: process_solver, brief: "Maintenance respiration (leaf/stem/root, Arrhenius temperature dependence) plus growth respiration as a fixed fraction of NPP; coupled to instantaneous GPP via npp_approx = gpp - r_maint."}
    - {name: "HeterotrophicRespiration_CENTURY", role: process_solver, brief: "CENTURY-like base rate with a Q10 temperature factor and a bell-shaped precipitation moisture factor; diagnostic, no explicit SOM pools in this version."}
    - {name: "EnergyFluxes", role: process_solver, brief: "Latent heat LE derived from GPP via a fixed water-use efficiency; sensible heat H taken as the Rn-LE residual (simplified Penman-Monteith, no closed energy budget)."}
    - {name: "ModelRunner", role: integrator, brief: "Per-timestep loop calling LAI -> GPP -> Reco -> NEE -> energy fluxes; assembles output arrays. (Silent NaN-forcing fallback behavior is a wrapper hazard, see safety.)"}
  internal_edges:
    - {from: "Inputs", to: "ModelRunner", kind: consumes_input, brief: "Forcing arrays (TA, SW_IN, VPD, PRECIP, CO2, DAYLENGTH) feed the per-timestep loop."}
    - {from: "ModelRunner", to: "Phenology_LAI", kind: invokes, brief: "calc_lai(TA, month) each timestep."}
    - {from: "Phenology_LAI", to: "LAI", kind: writes_state, brief: "Updates the effective leaf area index state."}
    - {from: "Phenology_LAI", to: "Photosynthesis_Farquhar", kind: invokes, brief: "LAI feeds the Beer's-law canopy light-extinction fraction in the assimilation routine."}
    - {from: "TemperatureResponse", to: "Photosynthesis_Farquhar", kind: invokes, brief: "Arrhenius scaling of Vcmax and Jmax."}
    - {from: "N_Limitation", to: "vcmax25_eff", kind: writes_state, brief: "Sets the N-limited carboxylation capacity before temperature scaling."}
    - {from: "vcmax25_eff", to: "Photosynthesis_Farquhar", kind: reads_state, brief: "Effective Vcmax25 entering the Rubisco-limited rate."}
    - {from: "Photosynthesis_Farquhar", to: "GPP", kind: produces_output, brief: "Gross primary production per timestep (daylength-scaled)."}
    - {from: "TemperatureResponse", to: "AutotrophicRespiration", kind: invokes, brief: "Arrhenius scaling of maintenance respiration."}
    - {from: "Photosynthesis_Farquhar", to: "AutotrophicRespiration", kind: invokes, brief: "GPP drives growth respiration via npp_approx = gpp - r_maint (Ra coupled to GPP)."}
    - {from: "AutotrophicRespiration", to: "Ra", kind: produces_output, brief: "Autotrophic respiration."}
    - {from: "HeterotrophicRespiration_CENTURY", to: "Rh", kind: produces_output, brief: "Heterotrophic respiration from Q10 temperature x precipitation moisture factor."}
    - {from: "Ra", to: "Reco", kind: reads_state, brief: "Reco = Ra + Rh."}
    - {from: "Rh", to: "Reco", kind: reads_state, brief: "Reco = Ra + Rh."}
    - {from: "Reco", to: "NEE", kind: reads_state, brief: "NEE = Reco - GPP (micrometeorological sign convention, positive = net source)."}
    - {from: "GPP", to: "NEE", kind: reads_state, brief: "NEE = Reco - GPP."}
    - {from: "Photosynthesis_Farquhar", to: "EnergyFluxes", kind: invokes, brief: "LE derived from GPP via a fixed water-use efficiency."}
    - {from: "EnergyFluxes", to: "LE", kind: produces_output, brief: "Latent heat flux."}
    - {from: "EnergyFluxes", to: "H", kind: produces_output, brief: "Sensible heat flux as the Rn-LE residual."}

states:
  variables:
    - {name: "LAI", unit: "m2/m2", role: diagnostic}
    - {name: "vcmax25_eff", unit: "umol/m2/s", role: diagnostic}
    - {name: "vcmax", unit: "umol/m2/s", role: diagnostic}
    - {name: "jmax", unit: "umol/m2/s", role: diagnostic}
    - {name: "ci", unit: "ppm", role: diagnostic}
    - {name: "a_gross", unit: "umol/m2/s", role: diagnostic}
    - {name: "npp_approx", unit: "umol/m2/s", role: diagnostic}
  provenance: "structural"

outputs:
  - var: "GPP"
    validation_rank: 1
    unit: "umol CO2/m2/s"
    description: "Gross primary production (Farquhar co-limitation with N-limited Vcmax and Beer's-law canopy scaling), scaled by day fraction (daylength/24) to a 24-h mean."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Eddy-covariance GPP is a 24-h mean partitioned from NEE; ensure the day-fraction scaling is applied before comparison.", "Defaults are boreal-ENF (Scots pine) specific; expect 2-3x magnitude bias if Vcmax25 / PFT is mismatched."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Annual or seasonal-mean GPP only; single-instant comparison is weak for a monthly model."]
      detrending_options: ["none"]
  - var: "NEE"
    validation_rank: 3
    unit: "umol CO2/m2/s"
    description: "Net ecosystem exchange = Reco - GPP (micrometeorological convention, positive = net source to atmosphere)."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Sign convention must match (Reco - GPP, positive = source); a flipped sign produces apparent carbon-balance non-closure.", "First 1-2 years can be biased by spin-up transient if SOM-equivalent terms are far from equilibrium."]
      detrending_options: ["none"]
  - var: "Reco"
    validation_rank: 4
    unit: "umol CO2/m2/s"
    description: "Ecosystem respiration (Ra + Rh)."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Eddy-covariance Reco is partitioned, not directly measured; carries partitioning uncertainty.", "Healthy mature forest annual Reco/GPP ~0.7-0.9."]
      detrending_options: ["none"]
  - var: "Ra"
    validation_rank: 5
    unit: "umol CO2/m2/s"
    description: "Autotrophic respiration (maintenance + growth), coupled to instantaneous GPP."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Rarely measured directly at flux sites; usually only available via partitioning/upscaling, so comparison is indirect."]
      detrending_options: ["none"]
  - var: "Rh"
    validation_rank: 6
    unit: "umol CO2/m2/s"
    description: "Heterotrophic respiration (CENTURY-like Q10 temperature response with a bell-shaped precipitation moisture response)."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Soil heterotrophic respiration is hard to isolate observationally; chamber/partitioned estimates carry large uncertainty."]
      detrending_options: ["none"]
  - var: "LAI"
    validation_rank: 7
    unit: "m2/m2"
    description: "Leaf area index from temperature-driven (Gaussian) phenology."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Seasonal amplitude should be >=1.0 m2/m2; lai_min == lai_max yields a flat (uncomparable) cycle."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Satellite-LAI point extraction at the site only; the model is 0-D and has no spatial field to match."]
      detrending_options: ["none"]
  - var: "LE"
    validation_rank: 2
    unit: "W/m2"
    description: "Latent heat flux (water-use-efficiency approximation from GPP; simplified Penman-Monteith)."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["LE is diagnosed from GPP via a fixed WUE, not from a closed surface-energy budget; monthly LE should stay below Rnet (peak ~80-150 W/m2)."]
      detrending_options: ["none"]
  - var: "H"
    validation_rank: 8
    unit: "W/m2"
    description: "Sensible heat flux as the Rn-LE residual (no independent energy-balance closure)."
    emitted_in: "results CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["H is a residual, so it inherits all LE/Rn errors; an over-large g1_bb-driven LE drives H negative."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "vcmaxn (RuBisCO carboxylation efficiency per unit leaf N)"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always (analytic surrogate realizes this as vcmax_n_slope x leaf_N capped at vcmax25)"
      citations: ["thum2019_quincy_v10_gmd", "caldararu2020_quincy_nue_optimality_nph"]
    - from: "kfnchl / achln (leaf N-to-chlorophyll scaling)"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY chlorophyll-resolved photosynthesis; not explicit in the analytic surrogate"
      citations: ["thum2019_quincy_v10_gmd", "miinalainen2025_quincy_chlorophyll_bg"]
    - from: "k0struc (structural N fraction in leaves)"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY leaf-N allocation; not explicit in the analytic surrogate"
      citations: ["thum2019_quincy_v10_gmd"]
    - from: "leaf C:N ratio"
      to: "leaf chlorophyll"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY (chlorophyll not emitted by the analytic surrogate)"
      citations: ["miinalainen2025_quincy_chlorophyll_bg"]
    - from: "leaf chlorophyll"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY chlorophyll-resolved photosynthesis"
      citations: ["miinalainen2025_quincy_chlorophyll_bg", "thum2025_quincy_decadal_borden_bg"]
    - from: "nitrogen deposition"
      to: "leaf chlorophyll"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "full QUINCY, evergreen sites; N deposition is not an input to the analytic surrogate"
      citations: ["miinalainen2025_quincy_chlorophyll_bg"]
    - from: "air temperature"
      to: "leaf chlorophyll"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "full QUINCY across-site analysis"
      citations: ["miinalainen2025_quincy_chlorophyll_bg"]
    - from: "leaf nitrogen allocation (RuBisCO vs structural/chlorophyll partitioning)"
      to: "Vcmax"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY optimality-based N allocation; collapsed to a vcmax_n_slope cap in the analytic surrogate"
