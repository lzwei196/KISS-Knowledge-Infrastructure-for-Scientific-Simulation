    secondary_metrics:
      - metric: r2
        direction: maximize
        status: supportive
        ceiling_reason: "Zhang 2020 reports overall R2 of 0.54, 0.54, and 0.38 for corn, soybean, and winter wheat county yields; Muller 2017 recommends best-performing crop models as benchmarks when pure observation benchmarks are lacking."
        cites: [zhang2020, muller2017]
    validated_when: "|PBIAS| <= 20% against detrended/regional yield statistics; retain trend/correlation metrics as supportive."
    evidence_strength: strong
    confidence: 0.8
    notes: "This is the best-grounded yield block because the DayCent benchmark was explicitly county/regional."

