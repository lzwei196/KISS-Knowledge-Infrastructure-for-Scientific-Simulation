  - {ref: "Vousdoukas et al. 2016 / Moriasi et al. 2007 & 2015 — original NSE/PBIAS/RSR performance-rating tier tables (would set a cited NSE band for water_level); primary tables are closed-access and not in-cache", doi: 10.13031/trans.58.10715, needed_for: [water_level]}
  - {ref: "Bermudez/Sanders et al. — flood map boundary sensitivity to DEM resolution and roughness in relation to model performance (cited SFINCS-family CSI-vs-DEM study; fetch_failed)", doi: 10.1080/19475705.2019.1604573, needed_for: [flood_extent]}
