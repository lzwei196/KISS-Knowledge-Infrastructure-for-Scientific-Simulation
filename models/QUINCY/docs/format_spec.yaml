    '
  diagnosis: 'The rh_precip_scale parameter has the wrong sign or rh_precip_opt is set to zero. QUINCY
    uses a bell-shaped moisture function: moisture_factor = exp(-rh_precip_scale * (P - rh_precip_opt)^2).
    If rh_precip_opt = 0, the function peaks at zero precipitation (maximum decomposition in drought).
    If rh_pre'
  remedy: 'Set rh_precip_opt to a realistic value (default 2.5 mm/day) and ensure rh_precip_scale is positive
    (default 0.02). The moisture response should peak near 2-3 mm/day and decline symmetrically for both
