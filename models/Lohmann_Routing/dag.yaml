template_version: "3.5"

identity:
  model_id: "Lohmann_Routing"
  scientific_reference_version: "Lohmann diffusive-wave routing (Lohmann et al. 1996 Tellus A; Lohmann et al. 1998 VIC-2L coupling)"
  implementation:
    id: "lohmann-rout-1.0"
    version: "route_1.0"
    provenance: "Fortran 77; standalone VIC routing post-processor (rout), Lohmann/Lettenmaier lineage, distributed with VIC 4.2.d."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: ""
  repo_url: "https://vic.readthedocs.io/en/vic.4.2.d/Documentation/Routing/RoutingInput/"

boundary:
  scope_in:
    - "Within-cell routing of daily grid-cell total runoff (surface runoff + baseflow) to the cell outlet via a unit-hydrograph impulse response"
    - "Channel/river-network routing of cell-outlet flow to gauge/outlet points using the linearized (diffusive-wave) Saint-Venant equation parameterized by wave velocity and diffusivity"
    - "Source-to-sink convolution and fraction-weighted accumulation of upstream cell contributions into daily/monthly/climatological discharge at defined stations"
  scope_out:
    - "Generation of runoff and baseflow (these are inputs from an upstream land-surface model such as VIC/mHM, not computed here)"
    - "Land-surface water/energy balance simulation"
    - "Feedback to the land surface (routing is offline/decoupled, one-way post-processing)"
    - "Full nonlinear shallow-water hydrodynamics, backwater, reservoir/lake operation, or sub-daily flood-wave dynamics"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass conservation is the routing redistribution of upstream runoff+baseflow volume to the gauge: discharge is a linear convolution (per-cell unit-hydrograph + diffusive-wave channel impulse response) weighted by cell drainage fraction and area, so volume is conserved while timing is redistributed. The internal routing timestep is hourly (DT=3600 s, LE=48 hourly impulse steps) but forcing and output are daily; channel routing is the LINEARIZED diffusive-wave equation with constant per-reach velocity/diffusivity, not the full nonlinear Saint-Venant equations. Missing per-cell flux files are silently zero-filled, which can break volume closure low without an error exit."

inputs:
  forcing:
    - category: "forcing"
      name: "surface_runoff"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "Per-cell daily VIC flux ASCII file (7-column: year month day prec evap runoff baseflow); only column 6 (runoff) is read"
      notes: "Valid model range 0-500 mm/day. Read in MAKE_CONVOLUTION; converted to m3/s via FACTOR = fraction*area/86400 then *1/1000 (mm->m). Feeding raw 22-column VIC flux files reads the wrong column and yields extreme/negative discharge."
    - category: "forcing"
      name: "baseflow"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "Per-cell daily VIC flux ASCII file; column 7 (baseflow) is read"
      notes: "Valid model range 0-100 mm/day. Summed with surface_runoff inside the routing module to give total per-cell channel inflow."
  parameters:
    - category: "parameter"
      name: "velocity (channel wave celerity C)"
      unit: "m/s"
      source_kind: "calibrated"
      model_input_format: "Scalar default 1.5 m/s (INIT_ARRAY when rout_global flag is .false.) or per-cell ArcInfo ASCII grid with 6-line header"
      notes: "Most-calibrated channel parameter. Documented ranges 1-3 m/s (Weser), 0.5-2.0 m/s (Columbia). Used in MAKE_UHM (Lohmann eq.15). Model-side valid range 0.5-5.0 m/s."
    - category: "parameter"
      name: "diffusion (channel diffusivity D)"
      unit: "m2/s"
      source_kind: "calibrated"
      model_input_format: "Scalar default 800 m2/s (INIT_ARRAY) or per-cell ArcInfo ASCII grid"
      notes: "Controls hydrograph spreading/attenuation. Documented range 200-4000 m2/s (Weser). Used in MAKE_UHM impulse-response denominator."
    - category: "parameter"
      name: "unit_hydrograph (within-cell box UH)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "ASCII UH file; exactly KE=12 daily ordinates (index 0-11 + weight), weights summing to 1.0"
      notes: "Within-cell hillslope impulse response. Must be exactly 12 lines or the Fortran READ fails with 'End of file'."
    - category: "parameter"
      name: "flow_direction (D8 network)"
      unit: "D8_code"
      source_kind: "dataset_lookup"
      model_input_format: "ArcInfo ASCII grid with 6-line header; READ_DIREC decodes SEQUENTIAL codes 1-8 (1=E,2=NE,3=N,4=NW,5=W,6=SW,7=S,8=SE on the left-right-flipped internal grid)"
      notes: "Defines the drainage network connecting cells to the outlet. The model's sequential 1-8 decoding differs from the ArcGIS power-of-two convention some docs/prep scripts assume; mismatched codes silently misroute."
    - category: "parameter"
      name: "fraction"
      unit: "fraction"
      source_kind: "dataset_lookup"
      model_input_format: "ArcInfo ASCII grid with 6-line header; 0-1 fraction of cell draining to gauge"
      notes: "Enters FACTOR = fraction*area/86400, so it scales discharge magnitude. Supplying km2 area instead of a 0-1 fraction inflates discharge by orders of magnitude."
    - category: "parameter"
      name: "xmask (flow distance)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "ArcInfo ASCII grid with 6-line header; per-cell channel/flow length in metres (cell-size*cos(lat) for irregular grids)"
      notes: "Flow-distance numerator in the cell impulse response (MAKE_UHM)."
  initial_conditions:
    - category: "initial_conditions"
      name: "cached source-to-outlet unit hydrograph (.uh_s)"
      unit: "dimensionless"
      source_kind: "derived"
      model_input_format: "Per-station <NAME5>.uh_s cache; supplied via staloc line 2 path, or recomputed when that line is 'NONE'"
      notes: "Precomputed per-station impulse response. A stale cache from a prior basin (5-char NAME5 collision) corrupts peak timing; STATUS='NEW' open fails if the file already exists."
  boundary_conditions:
    - category: "boundary_conditions"
      name: "station/outlet location (staloc)"
      unit: "grid index + lat,lon"
      source_kind: "user_provided"
      model_input_format: "ASCII; line 1 = '1 NAME column row AREA'; line 2 = UH_STRING ('NONE' to recompute UH_S, else a .uh_s cache path). Both lines mandatory."
      notes: "Selects which grid cells produce output discharge. Missing line 2 crashes 'ERROR reading station file'."
    - category: "boundary_conditions"
      name: "simulation and output write windows (rout_global.txt date block)"
      unit: "year-month"
      source_kind: "user_provided"
      model_input_format: "rout_global.txt START/STOP and FIRST/LAST year-month fields"
      notes: "First row's year/month of each per-cell VIC flux file must match START_YEAR/START_MO or MAKE_CONVOLUTION STOPs."
    - category: "boundary_conditions"
      name: "input-file toggles and paths (rout_global.txt)"
      unit: "flags/paths"
      source_kind: "user_provided"
      model_input_format: "rout_global.txt switches for direc/velo/diff/xmask/fraction (use grid file vs scalar default), inpath+coordinate precision, outpath, UH file path"
      notes: "When a grid toggle is .false. the model falls back to INIT_ARRAY scalar defaults (velocity 1.5, diffusion 800)."

processes:
  modules:
    - name: "InputReader"
      role: "driver"
      brief: "rout.f main: parses rout_global.txt, dispatches grid readers or INIT_ARRAY scalar defaults, reads the station/date blocks, computes NDAY/NMONTHS (leap-aware via isaleap)."
    - name: "READ_DIREC"
      role: "process_solver"
      brief: "Reads the D8 flow-direction grid + ArcInfo header, decodes sequential codes 1-8 into downstream (i,j) targets (DIREC), with a left-right grid flip; enforces IROW<=NROW, ICOL<=NCOL."
    - name: "GridParamReaders"
      role: "process_solver"
      brief: "READ_VELO / READ_DIFF / READ_XMASK / READ_FRACTION read 6-header-line ASCII grids (with the same flip); INIT_ARRAY fills scalar defaults (velocity 1.5 m/s, diffusion 800 m2/s) when the rout_global toggle is .false."
    - name: "SEARCH_CATCHMENT"
      role: "process_solver"
      brief: "Traces DIREC downstream from every cell; cells that reach the station (PI,PJ) become the CATCHIJ list of NO_OF_BOX upstream cells."
    - name: "MAKE_UHM"
      role: "process_solver"
      brief: "Computes each cell's hourly channel impulse response via Lohmann (1996) eq.15 from velocity, diffusion and flow distance over LE=48 hourly steps; normalized to unit area (diffusive-wave Saint-Venant)."
    - name: "READ_GRID_UH"
      role: "process_solver"
      brief: "Reads the within-cell daily unit hydrograph (KE=12 ordinates) from the UH file into UH_BOX for each upstream cell."
    - name: "MAKE_GRID_UH"
      role: "integrator"
      brief: "Convolves cell impulse responses along the DIREC path to the outlet to build the source-to-outlet UH_S (length 107); reads the cached .uh_s when staloc line 2 != 'NONE', else computes and writes a new cache."
    - name: "CREATE_VIC_NAMES"
      role: "allocator"
      brief: "Formats the lat_lon filename suffix (configurable decimal precision) to locate each per-cell VIC flux file under INPATH."
    - name: "MAKE_CONVOLUTION"
      role: "integrator"
      brief: "Core routing: per upstream cell computes spherical AREA and FACTOR=fraction*area/86400, reads VIC runoff (col6)+baseflow (col7), convolves with UH_S, accumulates daily FLOW (m3/s); zero-fills missing per-cell flux files."
    - name: "WRITE_DATA"
      role: "driver"
      brief: "Writes daily discharge: .day (m3/s) and .day_mm (FLOW/FACTOR_SUM, basin-area-normalized mm/day)."
    - name: "WRITE_MONTH"
      role: "integrator"
      brief: "Aggregates daily FLOW to monthly means (.month/.month_mm) and a climatological 12-month cycle (.year/.year_mm) over the output write window."
    - name: "isaleap"
      role: "process_solver"
      brief: "Leap-year predicate used in NDAY accumulation so simulation length and Feb-day counts are correct."
  internal_edges:
    - from: "Inputs"
      to: "InputReader"
      kind: "consumes_input"
      brief: "rout_global.txt control file (toggles/paths, station, date and write windows, UH file) + staloc station file."
    - from: "READ_DIREC"
      to: "InputReader"
      kind: "invokes"
      brief: "Main routine dispatches the flow-direction reader and obtains grid header (XC,YC,SIZE,IROW,ICOL)."
    - from: "GridParamReaders"
      to: "InputReader"
      kind: "invokes"
      brief: "Main dispatches velocity/diffusion/xmask/fraction readers or scalar defaults."
    - from: "flow_direction (D8 network)"
      to: "READ_DIREC"
      kind: "consumes_input"
      brief: "D8 grid decoded into downstream (i,j) pointers."
    - from: "velocity (channel wave celerity C)"
      to: "GridParamReaders"
      kind: "consumes_input"
      brief: "Celerity grid or scalar default 1.5 m/s."
    - from: "diffusion (channel diffusivity D)"
      to: "GridParamReaders"
      kind: "consumes_input"
      brief: "Diffusivity grid or scalar default 800 m2/s."
    - from: "xmask (flow distance)"
      to: "GridParamReaders"
      kind: "consumes_input"
      brief: "Per-cell flow distance grid."
    - from: "fraction"
      to: "GridParamReaders"
      kind: "consumes_input"
      brief: "Per-cell drainage fraction grid."
    - from: "READ_DIREC"
      to: "SEARCH_CATCHMENT"
      kind: "invokes"
      brief: "Decoded downstream pointers are traced to enumerate the upstream catchment of each station."
    - from: "SEARCH_CATCHMENT"
      to: "catchment_cells"
      kind: "writes_state"
      brief: "Builds CATCHIJ, the (i,j) list of NO_OF_BOX upstream cells."
    - from: "GridParamReaders"
      to: "MAKE_UHM"
      kind: "invokes"
      brief: "Velocity/diffusion/xmask feed the cell impulse-response computation."
    - from: "MAKE_UHM"
      to: "cell_impulse_response"
      kind: "writes_state"
      brief: "Normalized per-cell hourly impulse response (UHM, LE=48 steps)."
    - from: "unit_hydrograph (within-cell box UH)"
      to: "READ_GRID_UH"
      kind: "consumes_input"
      brief: "Within-cell daily UH (12 ordinates) read into UH_BOX."
    - from: "cell_impulse_response"
      to: "MAKE_GRID_UH"
      kind: "reads_state"
      brief: "Cell impulse responses convolved along the DIREC path to the outlet."
    - from: "READ_GRID_UH"
      to: "MAKE_GRID_UH"
      kind: "invokes"
      brief: "Box UH combined with the channel response into the source-to-outlet UH."
    - from: "MAKE_GRID_UH"
      to: "source_to_outlet_uh"
      kind: "writes_state"
      brief: "Source-to-outlet UH_S per cell (length KE+UH_DAY-1=107)."
    - from: "MAKE_GRID_UH"
      to: "Outputs"
      kind: "produces_output"
      brief: "Writes the <NAME5>.uh_s cache (STATUS='NEW') when staloc line 2 != 'NONE'."
    - from: "CREATE_VIC_NAMES"
      to: "MAKE_CONVOLUTION"
      kind: "invokes"
      brief: "Builds the lat_lon filename to open each per-cell VIC flux file."
    - from: "surface_runoff"
      to: "MAKE_CONVOLUTION"
      kind: "consumes_input"
      brief: "VIC flux column 6 (mm/day) per cell."
    - from: "baseflow"
      to: "MAKE_CONVOLUTION"
      kind: "consumes_input"
      brief: "VIC flux column 7 (mm/day) per cell; summed with runoff."
    - from: "source_to_outlet_uh"
      to: "MAKE_CONVOLUTION"
      kind: "reads_state"
      brief: "UH_S is the convolution kernel applied to (runoff+baseflow)."
    - from: "fraction"
      to: "MAKE_CONVOLUTION"
      kind: "consumes_input"
      brief: "Enters FACTOR=fraction*area/86400 (mm/day -> m3/s) and FACTOR_SUM (mm normalizer)."
    - from: "MAKE_CONVOLUTION"
      to: "routed_discharge"
      kind: "writes_state"
      brief: "Accumulated routed discharge per day (FLOW, m3/s) and FACTOR_SUM basin-area normalizer."
    - from: "routed_discharge"
      to: "WRITE_DATA"
      kind: "reads_state"
      brief: "Daily FLOW written to .day and .day_mm."
    - from: "WRITE_DATA"
      to: "Outputs"
      kind: "produces_output"
      brief: "Daily discharge (m3/s) and mm/day outputs."
    - from: "routed_discharge"
      to: "WRITE_MONTH"
      kind: "reads_state"
      brief: "Daily FLOW aggregated to monthly means and the climatological cycle."
    - from: "WRITE_MONTH"
      to: "Outputs"
      kind: "produces_output"
      brief: "Monthly mean and climatological monthly-cycle discharge."
    - from: "isaleap"
      to: "InputReader"
      kind: "invokes"
      brief: "Leap-day correction in NDAY accumulation."

states:
  variables:
    - name: "DIREC (downstream pointers)"
      unit: "grid index"
      role: "diagnostic"
    - name: "catchment_cells (CATCHIJ / NO_OF_BOX)"
      unit: "count + grid index"
      role: "diagnostic"
    - name: "cell_impulse_response (UHM)"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "UH_BOX (within-cell box UH)"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "source_to_outlet_uh (UH_S)"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "routed_discharge (FLOW)"
      unit: "m3/s"
      role: "accumulator"
    - name: "FACTOR_SUM (basin-area normalizer)"
      unit: "m3/s per mm/day"
      role: "accumulator"
    - name: "STORAGE (linear-reservoir storage)"
      unit: "m3"
      role: "prognostic"
  provenance: "populated"

outputs:
  - var: "discharge_daily"
    validation_rank: 1
    unit: "m3/s"
    description: "Routed daily streamflow at each defined station/outlet (FLOW)."
    emitted_in: "<NAME5>.day"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Gauge observations are point streamflow at the outlet; the model resolves daily flow only, so sub-daily peak timing cannot be evaluated."
            - "Peak timing/magnitude depend on channel velocity and diffusivity, which are calibration parameters; un-calibrated runs may bias timing by days."
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "csi"
          caveats:
            - "Flood-event hit/miss is sensitive to routing-parameter calibration and to upstream-runoff bias from the land-surface model."
      detrending_options: ["none"]
  - var: "discharge_monthly"
    validation_rank: 2
    unit: "m3/s"
    description: "Monthly-mean routed streamflow at each station/outlet."
    emitted_in: "<NAME5>.month"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Routing-parameter effects largely vanish at monthly aggregation; monthly-mean skill is dominated by upstream runoff/baseflow rather than the routing scheme."
      detrending_options: ["none"]
  - var: "discharge_yearly"
    validation_rank: 3
    unit: "m3/s"
    description: "Long-term climatological mean monthly cycle (12 values) of routed river discharge across all simulation years."
    emitted_in: "<NAME5>.year"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "A 12-month climatological cycle; compare against the observed mean annual regime, not an inter-annual series."
      detrending_options: ["none"]
  - var: "discharge_daily_mm"
    validation_rank: 4
    unit: "mm/day"
    description: "Daily discharge normalized by basin area (FLOW/FACTOR_SUM)."
    emitted_in: "<NAME5>.day_mm"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Area-normalized runoff depth; observed gauge flow must be divided by the same basin area for a like-for-like comparison."
      detrending_options: ["none"]
  - var: "discharge_monthly_mm"
    validation_rank: 5
    unit: "mm/day"
    description: "Monthly-mean discharge normalized by basin area."
    emitted_in: "<NAME5>.month_mm"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Area-normalized; routing-parameter influence is weak at monthly scale."
      detrending_options: ["none"]

influence:
  edges:
    - from: "velocity (channel wave celerity C)"
      to: "discharge_daily (peak timing)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "daily / peak-flow scale"
      citations: ["lohmann1996_routing_formulation", "lohmann1998_vic2l_formulation", "cortessalazar2023_routing_matters"]
    - from: "velocity (channel wave celerity C)"
      to: "discharge_daily (peak magnitude)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "daily / peak-flow scale"
      citations: ["cortessalazar2023_routing_matters", "lohmann1996_routing_formulation"]
    - from: "diffusion (channel diffusivity D)"
      to: "discharge_daily (hydrograph attenuation/spreading)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "daily / peak-flow scale"
      citations: ["lohmann1996_routing_formulation", "lohmann1998_vic2l_formulation"]
    - from: "diffusion (channel diffusivity D)"
      to: "discharge_daily (peak magnitude)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "daily / peak-flow scale"
      citations: ["lohmann1998_weser_application", "lohmann1996_routing_formulation"]
    - from: "unit_hydrograph (within-cell box UH)"
      to: "discharge_daily (peak timing)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "daily / peak-flow scale"
      citations: ["lohmann1996_routing_formulation", "lohmann1998_vic2l_formulation"]
    - from: "velocity (channel wave celerity C)"
      to: "discharge_monthly (monthly-mean flow)"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: parameter
      applicability: "monthly aggregation"
      citations: ["lohmann1998_weser_application", "cortessalazar2023_routing_matters"]
    - from: "diffusion (channel diffusivity D)"
      to: "discharge_monthly (monthly-mean flow)"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: parameter
      applicability: "monthly aggregation"
      citations: ["lohmann1998_weser_application", "cortessalazar2023_routing_matters"]
  citation_index:
    lohmann1996_routing_formulation:
      short_citation: "Lohmann et al. 1996"
      doi: "10.3402/tellusa.v48i5.12200"
      note: "Foundational routing formulation; velocity C controls travel time/peak timing, diffusivity D controls hydrograph spreading (diffusive-wave Saint-Venant). Descriptive, no quantitative SA index."
    lohmann1998_vic2l_formulation:
      short_citation: "Lohmann et al. 1998 (I)"
      doi: "10.1080/02626669809492107"
      note: "VIC-2L coupling; IRF channel routing with velocity and diffusivity as the two calibrated channel parameters plus grid-cell UH."
    lohmann1998_weser_application:
      short_citation: "Lohmann et al. 1998 (II)"
      doi: "10.1080/02626669809492108"
      note: "Weser calibration; velocity 1-3 m/s, diffusivity 200-4000 m2/s; ~1.5 m/s and ~800 m2/s acceptable for monthly flows (parameter sensitivity strong at daily/peak, weak at monthly)."
    cortessalazar2023_routing_matters:
      short_citation: "Cortes-Salazar et al. 2023"
      doi: "10.5194/hess-27-3505-2023"
      note: "Quantifies routing impact on VIC streamflow: strong on storm hydrographs/peaks (annual max daily flow reduced by >400 m3/s vs no-routing), weak on low flows, largely vanishing at monthly aggregation. Routing-impact magnitudes, not a per-parameter variance index."

safety:
  hazards:
    - id: "vic_column_mismatch"
      kind: "weather_file_semantic"
      description: "Raw VIC fluxes have 22+ columns but routing reads only the 7-column (year month day prec evap runoff baseflow) form (runoff=col6, baseflow=col7); wrong columns produce extreme (tens of thousands m3/s) or negative discharge. (dt_005)"
      severity: "silent"
    - id: "fraction_unit_confusion"
      kind: "soil_semantic"
      description: "fraction grid supplied as km2 (area) instead of a dimensionless 0-1 fraction makes FACTOR=fraction*area/86400 inflate discharge by orders of magnitude."
      severity: "silent"
    - id: "uh_file_12line_format"
      kind: "weather_file_semantic"
      description: "The within-cell UH file must be exactly KE=12 ordinates (index 0-11 + weight, summing to 1.0); otherwise the Fortran READ aborts with 'End of file'. (dt_003)"
      severity: "fatal"
    - id: "staloc_missing_NONE_line"
      kind: "control_semantic"
      description: "The station file must have a mandatory 2nd line (UH_STRING = 'NONE' to recompute UH_S, or a .uh_s cache path); a missing line crashes with 'ERROR reading station file'. (dt_002)"
      severity: "fatal"
    - id: "flow_direction_d8_convention_mismatch"
      kind: "control_semantic"
      description: "READ_DIREC decodes SEQUENTIAL D8 codes 1-8 on a left-right-flipped internal grid; feeding ArcGIS power-of-two codes (1/2/4/8/...) or a differently-ordered 1-8 mapping silently misroutes the network and can create off-grid sink loops yielding zero/negative discharge."
      severity: "silent"
    - id: "coordinate_filename_mismatch"
      kind: "weather_file_semantic"
      description: "xllcorner/yllcorner not matching the VIC per-cell filename coordinates yields 'NOT FOUND, INSERTING ZEROS' and all-zero discharge; missing per-cell flux files are silently zero-filled, biasing discharge low without an error exit. (dt_007)"
      severity: "silent"
    - id: "stale_uh_s_cache"
      kind: "initial_condition_semantic"
      description: "A leftover <NAME5>.uh_s cache (5-char name collision across basins) is reused with wrong peak timing, or its STATUS='NEW' OPEN fails 'File exists' on rerun; delete .uh_s before re-running. (dt_009)"
      severity: "fatal_or_silent"
    - id: "vic_date_block_mismatch"
      kind: "control_semantic"
      description: "MAKE_CONVOLUTION STOPs if the first row's year/month of any per-cell VIC flux file differs from START_YEAR/START_MO in rout_global.txt."
      severity: "fatal"
  validation_limits:
    - "Linearized diffusive-wave channel routing with constant per-reach velocity/diffusivity; cannot represent backwater, nonlinear flood-wave dynamics, reservoir/lake operation, or hydraulic structures."
    - "Daily forcing/output; sub-daily flood-wave timing is not resolvable despite the internal hourly convolution step."
    - "Offline post-processor: no feedback to the land surface; output skill is bounded by the quality of the upstream VIC/mHM runoff and baseflow."
  warnings:
    - "Velocity and diffusivity are basin-specific calibration parameters; the scalar defaults (1.5 m/s, 800 m2/s) are acceptable for monthly-mean flows but generally require recalibration for daily/peak accuracy."
    - "The .end_of_month output unit is opened but not written in this WRITE_MONTH version, despite being listed as an output file."
    - "Monthly aggregation washes out routing-parameter influence, so monthly skill mainly reflects upstream runoff rather than routing configuration."
  assumptions:
    - statement: "Channel routing solves the LINEARIZED (diffusive-wave) Saint-Venant equation with constant per-reach wave velocity and diffusivity, not the full nonlinear shallow-water equations."
      scope: "channel/river-network routing (MAKE_UHM impulse response)"
      source: "Lohmann et al. 1996 (Tellus A, doi:10.3402/tellusa.v48i5.12200) and VIC 4.2.d Routing Input documentation"
      status: "adopted"
    - statement: "The model's flow-direction codes are SEQUENTIAL 1-8 (1=E,2=NE,3=N,4=NW,5=W,6=SW,7=S,8=SE) on a left-right-flipped internal grid, taken as authoritative over the ArcGIS power-of-two convention some docs/prep scripts assume."
      scope: "flow_direction input decoding (READ_DIREC)"
      source: "rout source read_routines.f READ_DIREC decoding vs docs/format_spec.yaml"
      status: "adopted"
    - statement: "Routing conserves volume (mass-balance) while redistributing timing; the internal routing timestep is hourly (DT=3600 s) though forcing and output are daily."
      scope: "whole-model closure and timestepping"
      source: "rout source (make_convolution.f FACTOR conversion, rout.f DT=3600) and Lohmann et al. 1998 IRF formulation"
      status: "adopted"
    - statement: "Output discharge is reported in m3/s (and area-normalized mm/day), per the source WRITE routines, resolving the docs' silence on output units."
      scope: "outputs"
      source: "rout source write_routines.f (.day/.month/.year m3/s and *_mm)"
      status: "adopted"

