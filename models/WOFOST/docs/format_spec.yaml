# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: WOFOST
  language: python
  implementation:
    id: pcse-wofost72
    version: PCSE 6.0.12 / WOFOST 7.2
    provenance: Python; PCSE (Allard de Wit / WUR) wraps WOFOST 7.2 numerics; engine classes Wofost72_PP
      / Wofost72_WLP_FD / Wofost72_WLP_CWB.
  scientific_reference_version: WOFOST 7.2 (Wageningen / WUR, PCSE 6.0 lineage)
inputs:
  forcing:
  - name: IRRAD
    unit: J m-2 day-1
    category: forcing
    source_kind: forcing
    model_input_format: Daily global shortwave radiation; engine-internal unit is Joules (not kJ or MJ)
    notes: Spring/summer values typically 1e7-3.5e7 J m-2 d-1; winter 2e6-8e6. IRRAD drives photosynthesis
      through the Spitters 3-point Gauss integration; an order-of-magnitude unit error silently zeroes
      yield.
  - name: TMIN
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: Daily minimum air temperature
  - name: TMAX
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: Daily maximum air temperature; TMIN <= TMAX required every day
  - name: VAP
    unit: hPa
    category: forcing
    source_kind: forcing
    model_input_format: Mean daily vapour pressure (engine-internal hPa)
  - name: WIND
    unit: m s-1
    category: forcing
    source_kind: forcing
    model_input_format: Mean daily wind speed at 2 m height
  - name: RAIN
    unit: cm day-1
    category: forcing
    source_kind: forcing
    model_input_format: Daily precipitation, engine-internal unit cm/day (consumed by WaterbalanceFD)
  - name: SNOWDEPTH
    unit: cm
    category: forcing
    source_kind: forcing
    model_input_format: Optional daily snow cover depth; required (non-NaN) under PCSE 6.0 when frost-damage
      / SnowMAUS path is active; otherwise set to 0.0
  - name: CO2
    unit: ppm
    category: forcing
    source_kind: forcing
    model_input_format: Atmospheric CO2 concentration; in PCSE 6.0 WOFOST 7.2 path it is handled via crop
      CO2 tables rather than as a site parameter, but it is a time-varying atmospheric driver of the assimilation
      submodel
    notes: Acts on AMAX and on the CO2 factor in assimilation; only the CO2-aware assimilation path consumes
      it explicitly.
  parameters:
  - name: TSUM1
    unit: degC d
    category: parameter
    source_kind: calibrated
    model_input_format: Crop YAML parameter (TSUM1); thermal time emergence -> anthesis
  - name: TSUM2
    unit: degC d
    category: parameter
    source_kind: calibrated
    model_input_format: Crop YAML parameter (TSUM2); thermal time anthesis -> maturity
  - name: TBASEM
    unit: degC
    category: parameter
    source_kind: calibrated
    model_input_format: Base temperature for emergence thermal-time accumulation
  - name: TDWI
    unit: kg ha-1
    category: parameter
    source_kind: calibrated
    model_input_format: Initial total dry-matter weight at emergence; partitioned into TWLV/TWST/TWRT
      at init within 1e-4 tolerance
  - name: SPAN
    unit: d
    category: parameter
    source_kind: calibrated
    model_input_format: Maximum leaf lifespan at 35 degC; controls leaf-cohort senescence in WOFOST_Leaf_Dynamics
  - name: AMAXTB
    unit: kg CH2O ha-1 hr-1 vs DVS
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; maximum leaf gross assimilation rate as a function of DVS
  - name: EFFTB
    unit: kg CH2O J-1 vs degC
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; light-use efficiency of single leaves vs temperature
  - name: SLATB
    unit: ha kg-1 vs DVS
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; specific leaf area vs DVS; multiplies leaf biomass to give LAI
  - name: KDIFTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; extinction coefficient for diffuse PAR
  - name: FRTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; fraction of total dry matter partitioned to roots
  - name: FLTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN above-ground partitioning fraction to leaves; FRTB+(FLTB+FSTB+FOTB)(1-FRTB)=1
      within 1e-4
  - name: FSTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN above-ground partitioning fraction to stems
  - name: FOTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN above-ground partitioning fraction to storage organs
  - name: CVO
    unit: kg DM kg-1 CH2O
    category: parameter
    source_kind: calibrated
    model_input_format: Conversion efficiency assimilates -> storage organ dry matter
  - name: Q10
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: Temperature sensitivity of maintenance respiration; TEFF = Q10**((TEMP-25)/10)
  - name: VERNSAT
    unit: d
    category: parameter
    source_kind: calibrated
    model_input_format: Cold-day requirement for full vernalisation; only active when IDSL>=2
  - name: VERNBASE
    unit: degC
    category: parameter
    source_kind: calibrated
    model_input_format: Base temperature for vernalisation accumulation
  - name: VERNDVS
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: Safety-cutoff DVS at which vernalisation is force-completed even if VERNSAT not
      reached
  - name: RDMSOL
    unit: cm
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Maximum rootable soil depth; soil-side cap on rooting
  - name: RDMCR
    unit: cm
    category: parameter
    source_kind: calibrated
    model_input_format: Maximum crop rooting depth; effective RDM = min(RDMSOL, RDMCR)
  - name: SMW
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Wilting point (pF 4.2)
  - name: SMFCF
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Field capacity (pF 2.0); ordering constraint SMW < SMFCF < SM0
  - name: SM0
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Soil porosity / saturation moisture; SM0 <= 0.65
  - name: CRAIRC
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Critical air content for oxygen stress; CRAIRC < SM0 - SMFCF
  - name: K0
    unit: cm d-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Saturated hydraulic conductivity
  - name: SOPE
    unit: cm d-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Maximum percolation rate root zone
  - name: KSUB
    unit: cm d-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Maximum percolation rate subsoil
  - name: DEPNR
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: Crop group number for SWEAF easily-available-water curve in evapotranspiration
  initial_conditions:
  - name: WAV
    unit: cm
    category: initial_condition
    source_kind: user_provided
    model_input_format: Initial available soil water in the profile; >= 0
  - name: SSI
    unit: cm
    category: initial_condition
    source_kind: user_provided
    model_input_format: Initial surface storage
  - name: SMLIM
    unit: cm3 cm-3
    category: initial_condition
    source_kind: user_provided
    model_input_format: Maximum initial topsoil moisture for water-balance initialization
  - name: DVS_initial
    unit: '-'
    category: initial_condition
    source_kind: default
    model_input_format: Hardcoded -0.1 at sowing (CROP_START_TYPE='sowing') so pre-emergence DVR = 0.1*DTSUME/TSUMEM
      advances to 0 at emergence
  boundary_conditions:
  - name: production_level
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Selector between Wofost72_PP (potential), Wofost72_WLP_FD (water-limited, free
      drainage), and Wofost72_WLP_CWB (water-limited, classic water balance with groundwater); choice
      activates / bypasses the soil water balance and changes which soil parameters are required
    notes: Misusing PP where WLP is intended silently inflates yields 2-5x; the choice is a model-form
      switch, not a parameter.
  - name: crop_start_type
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Enum 'sowing' | 'emergence'; controls whether the pre-emergence thermal-time submodel
      (TSUMEM) is exercised
  - name: crop_end_type
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Enum 'maturity' | 'harvest' | 'earliest'; controls termination criterion
  - name: crop_start_date
    unit: date
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Sowing or emergence date in agromanagement YAML; campaign_start_date <= crop_start_date
  - name: max_duration
    unit: d
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Maximum number of days the campaign is allowed to run; truncates silently if reached
      before DVS=2
  - name: irrigation_events
    unit: cm event-1
    category: boundary_condition
    source_kind: user_provided
    model_input_format: 'TimedEvents ''irrigate'' in agromanagement YAML; events_table of {date: {amount:
      cm, efficiency: 0-1}}; consumed by WaterbalanceFD via AgroManager signal'
  - name: IFUNRN
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Infiltration flag (0 = no runoff, 1 = USDA curve-number reduction via NINFTB)
  - name: NOTINF
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Fraction of rainfall that does not infiltrate when IFUNRN=0
  - name: SSMAX
    unit: cm
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Maximum surface storage
outputs:
  primary:
  - name: DVS
    unit: '-'
    description: Crop development stage (0=emergence, 1=anthesis, 2=maturity)
    validation_rank: 4
    emitted_in: daily _saved_output (OUTPUT_VARS)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - DVS itself is rarely observed; comparison is usually via derived phenology dates (DOE/DOA/DOM)
          below
      detrending_options:
      - none
  - name: DOA
    unit: date
    description: Crop day of anthesis (summary)
    validation_rank: 5
    emitted_in: _saved_summary_output (SUMMARY_OUTPUT_VARS)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Best compared as DOY bias against observed heading/anthesis dates; weather quality dominates
          skill
      detrending_options:
      - none
  - name: DOM
    unit: date
    description: Crop day of maturity (summary)
    validation_rank: 6
    emitted_in: _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Sensitive to TSUM2 and to whether the campaign max_duration truncated the run before DVS=2
      detrending_options:
      - none
  - name: LAI
    unit: m2 m-2
    description: Crop canopy leaf area index
    validation_rank: 2
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Compare to ground LAI campaigns or satellite-retrieved LAI at the point; rise/peak/decline shape
          is the primary signal
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Requires running the point model on a grid; satellite LAI products have their own retrieval
          errors
      detrending_options:
      - none
  - name: LAIMAX
    unit: m2 m-2
    description: Maximum LAI over the season (summary)
    validation_rank: 7
    emitted_in: _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - LAIMAX > 15 indicates SLATB error rather than skill
      detrending_options:
      - none
  - name: TAGP
    unit: kg ha-1
    description: Total above-ground crop biomass dry-matter production
    validation_rank: 8
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Best compared at sampled harvest dates within the season; daily values rarely observed
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Field-level end-of-season biomass weighings
      detrending_options:
      - none
  - name: TWSO
    unit: kg ha-1
    description: Total crop storage-organ biomass (harvestable yield)
    validation_rank: 1
    emitted_in: daily _saved_output and _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Field-trial yields under known management are the cleanest comparison; PP vs WLP choice changes
          the expected magnitude by 2-5x
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National / regional yield aggregates carry a technology trend that a weather-only WOFOST run
          cannot reproduce; compare detrended residuals or decadal means, not raw inter-annual r
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Requires gridded ensemble runs; SPAM-style yield maps have their own disaggregation uncertainty
      detrending_options:
      - none
      - first_difference
      - linear_residual
      - decadal_mean
  - name: TWLV
    unit: kg ha-1
    description: Total crop leaf dry-matter biomass
    validation_rank: 9
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Usually destructive sampling at intervals
      detrending_options:
      - none
  - name: TWST
    unit: kg ha-1
    description: Total crop stem dry-matter biomass
    validation_rank: 10
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  - name: TWRT
    unit: kg ha-1
    description: Total crop root dry-matter biomass
    validation_rank: 11
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Root biomass is hard to observe; comparisons are typically scarce and noisy
      detrending_options:
      - none
  - name: TRA
    unit: cm day-1
    description: Daily actual crop transpiration
    validation_rank: 12
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare to eddy-covariance latent-heat partitioning or sap-flow; canopy energy balance is not
          closed
      detrending_options:
      - none
  - name: CTRAT
    unit: cm
    description: Cumulative crop transpiration over the season
    validation_rank: 13
    emitted_in: _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
  - name: SM
    unit: cm3 cm-3
    description: Volumetric root-zone soil moisture
    validation_rank: 3
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Single-bucket / two-bucket layering cannot resolve depth-specific probes; compare to a depth-integrated
          average over RD
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: r
        caveats:
        - Satellite root-zone soil moisture (e.g., SMAP L4) has its own retrieval / DA depth conventions
      detrending_options:
      - none
  - name: RD
    unit: cm
    description: Crop rooting depth in the soil profile
    validation_rank: 14
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: pbias
        caveats:
        - Rooting depth is rarely observed continuously; one or two profile observations per season is
          typical
      detrending_options:
      - none
  - name: WWLOW
    unit: cm
    description: Total profile water (root-zone + subsoil)
    validation_rank: 15
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: PCSE raises yaml.scanner.ScannerError or yaml.parser.ParserError when loading crop parameter
    YAML files. The error message references a specific line and column with 'mapping values are not allowed
    here' or 'expected <block end>'.
  diagnosis: 'The YAML crop parameter file has an indentation error, a missing colon, or mixed tabs and
    spaces. YAML is extremely sensitive to whitespace — a single misplaced space can silently change the
    document structure or cause a parse error.; PCSE crop parameter YAML files use a hierarchical structure
    with '
  remedy: 'Fix the YAML indentation and syntax at the reported line.; ; [''Read the error message — it
    reports the exact line and column of the error.'', ''Open the YAML file and check the reported line
    for indentation issues.'', "Ensure ALL indentation uses spaces (not tabs). Run: cat -A file.yaml |
    grep ''\\^I'' t'
  severity: fatal
- id: dt_002
  symptom: Agromanagement YAML loads without error, but the CropCalendar or TimedEvents are None/empty
    even though they were defined in the file. The simulation starts but no crop is planted.
  diagnosis: 'The CropCalendar block is indented at the wrong level in the YAML file. It becomes a sibling
    of the campaign date dict instead of a child. YAML parses successfully (it is valid YAML) but the
    structure is semantically wrong.; PCSE agromanagement YAML has a specific nested structure: - Level
    0: list i'
  remedy: 'Fix the indentation so CropCalendar is nested under the campaign date.; validate_agromanagement;
    ["Load the YAML and inspect the structure: agro = yaml.safe_load(open(''agro.yaml''))", ''Check: agro[0]
    should be a dict with ONE key (a datetime.date)'', "The value of that key should be a dict with ''CropC'
  severity: silent
- id: dt_003
  symptom: WOFOST simulation completes without error but yield (TWSO) is near zero or unreasonably low
    (<100 kg/ha). LAI stays very low (<0.5) throughout the season. No error messages in output.
  diagnosis: Solar radiation (IRRAD) is provided in MJ/m2/day instead of J/m2/day. Values like 15.0 (MJ)
    should be 15000000 (J). With radiation 1e6x too low, photosynthesis produces negligible assimilates,
    and the crop barely grows.; PCSE/WOFOST uses J/m2/day for irradiance (Joules, NOT kiloJoules — the
    PCSE doc
  remedy: 'Multiply all IRRAD values by 1e6 to convert from MJ/m2/day to J/m2/day.; validate_weather_data;
    [''Check: print(max(IRRAD)). If < 100000, it is in MJ or kJ — convert to J.'', ''If converting from
    VIC W/m2: IRRAD_J = SW_Wm2 * 86400'', ''If converting from DSSAT MJ: IRRAD_J = SRAD_MJ * 1e6'', ''If
    using NASA'
  severity: silent
- id: dt_004
  symptom: WOFOST water-limited simulation shows permanent waterlogging. Soil moisture (SM) stays near
    saturation (SM0). Crop suffers oxygen stress. Yield is low but not zero. No error messages.
  diagnosis: Precipitation (RAIN) is provided in mm/day instead of cm/day. Values like 5.0 (mm) are interpreted
    as 5.0 (cm) = 50 mm. Rainfall is 10x too high, keeping the soil permanently saturated.; PCSE/WOFOST
    uses cm/day for precipitation, which is non-standard. VIC uses mm, DSSAT uses mm, most meteorological
  remedy: 'Divide all RAIN values by 10 to convert from mm/day to cm/day.; validate_weather_data; [''Check:
    print(max(RAIN)). If > 30, it is likely in mm — divide by 10.'', ''If converting from VIC mm: RAIN_cm
    = PREC_mm / 10.0'', ''If converting from DSSAT mm: RAIN_cm = RAIN_mm / 10.0'', ''Re-run the simulation
    after'
  severity: silent
- id: dt_005
  symptom: 'Winter wheat simulation runs to max_duration but DVS never exceeds 0.3-0.5. The crop never
    reaches anthesis (DVS=1). Yield is zero or near-zero. A warning may appear in PCSE logs: ''Vernalization
    requirements not met.'''
  diagnosis: VERNSAT (required vernalization days) is too high for the climate, or the simulation starts
    in spring (missing the winter cold period). The crop needs a certain number of cold days (TMIN < VERNBASE)
    to satisfy vernalization. If the winter is too mild or too short, vernalization is never satisfied
    an
  remedy: 'Reduce VERNSAT to match the available cold days, or switch to a spring variety.; validate_crop_params;
    [''Check the weather data: count days where TMIN < 8C (approximate VERNBASE)'', ''If cold days < VERNSAT:
    reduce VERNSAT to match, or use a spring variety'', ''Ensure VERNDVS is set (default ~0.30) — th'
  severity: silent
- id: dt_006
  symptom: DVS progresses very slowly but never reaches 2.0 (maturity) within the simulation period. The
    crop flowers (DVS>1) but does not mature. Final DVS is between 1.0 and 1.9.
  diagnosis: TSUM2 (thermal time from anthesis to maturity) is too high for the climate, or the growing
    season is too short (max_duration too low). The crop needs more heat units to mature than the remaining
    growing season provides.; After anthesis (DVS=1), development rate depends on daily effective temperature
  remedy: 'Reduce TSUM2 to match the available growing season heat, or increase max_duration.; check_simulation_status;
    [''Calculate post-anthesis thermal time: sum(max(0, Tavg - TBASE)) for days after anthesis'', ''Compare
    with TSUM2. If available < TSUM2, reduce TSUM2 or use a shorter-season variety'', ''If max_d'
  severity: degraded
- id: dt_007
  symptom: WOFOST simulation completes with exit code 0. DVS may or may not reach 2.0. But TWSO (yield)
    is exactly 0 or very close to 0 (<10 kg/ha). No error messages. All other outputs look structurally
    correct.
  diagnosis: 'Multiple possible causes, in order of likelihood: (1) IRRAD in MJ instead of J — photosynthesis
    negligible, (2) DVS never reached the storage-organ partitioning phase — FOTB table starts partitioning
    at DVS>1 but DVS<1 due to vernalization/thermal time, (3) Severe water stress killed all leaves —
    LA'
