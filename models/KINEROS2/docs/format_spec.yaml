model:
  name: KINEROS2 Knowledge Infrastructure
  domain: hydrology
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: Precipitation
    unit: '**mm/d**'
    format: ''
    source: skill_md
  - name: Temperature
    unit: '**deg C**'
    format: ''
    source: skill_md
  - name: Precip
    unit: mm/d
    format: ''
    source: skill_md
outputs:
  primary:
  - name: Temperature
    unit: '**deg C**'
    format: ''
    source: skill_md
  - name: PET
    unit: mm/d
    format: ''
    source: skill_md
  - name: Discharge
    unit: m3/s
    format: ''
    source: skill_md
  - name: Soil_moisture
    unit: unknown
    format: ''
    source: skill_md
