# Grounded ONLY in locally-fetched OA full texts (no new fetches needed — cache complete).
# HEADLINE conventions by quantity:
#   discharge / water_level / depth  -> NSE + PBIAS tiers from Moriasi 2007 (Table 4) and the
#     tightened Moriasi 2015 watershed criteria (NSE>0.50, PBIAS<=15% satisfactory). These are the
#     domain streamflow conventions; CaMa-Flood benchmarks (Siqueira 2018 continental S. America
#     "NSE>0.6 in 55% of stations"; Revel 2023 Amazon WSE/discharge DA) confirm the same NSE frame.
#   flood_extent (fldfrc/fldare) -> CSI, with the field convention ">0.7 good, <0.5 poor" quoted
#     verbatim from Bernhofen 2018, the collective validation of global fluvial flood models that
#     explicitly scored CaMa-Flood among the highest-CSI models (CSI 0.73 Lokoja). Hoch 2021 and the
#     LISFLOOD-FP SAR calibration study (2016) corroborate CSI as THE flood-extent skill measure.
#   velocity, storage (TWS/GRACE) -> NO cited numeric threshold in the fetched set -> null bands,
#     confidence<=0.4 (diagnostic / anomaly-only; never used to loosen the gate).
# Bands are plain numbers read via `direction` (see VALIDATION_CONVENTION_SCHEMA.md).

