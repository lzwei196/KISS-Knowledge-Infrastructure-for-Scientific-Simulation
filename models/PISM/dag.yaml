template_version: "3.5"

identity:
  model_id: "PISM"
  scientific_reference_version: "PISM 2.3.x (Parallel Ice Sheet Model; User's Manual v2.3.1)"
  implementation:
    id: "pism-2.3.0"
    version: "2.3.0"
    provenance: "C++; PISM (University of Alaska Fairbanks + Potsdam Institute for Climate Impact Research), parallel via PETSc/MPI, CF-NetCDF I/O."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL-3.0"
  repo_url: "https://github.com/pism/pism"

boundary:
  scope_in:
    - "Ice sheet, glacier, and ice-shelf dynamics (grounded and floating ice)"
    - "Stress balance via a hierarchy of approximations (SIA, SSA, SIA+SSA hybrid, Blatter first-order)"
    - "Mass continuity / ice geometry (thickness) evolution"
    - "Polythermal enthalpy-based conservation of energy in ice, subglacial layer, and thermal bedrock"
    - "Subglacial hydrology (till water storage; optional transportable water routing)"
    - "Basal strength / pseudo-plastic sliding via till friction angle"
    - "Marine ice physics: dynamic calving fronts, flotation, grounding-line dynamics"
    - "Bed deformation (Lingle-Clark solid-earth coupling)"
    - "Surface mass balance via PDD or energy-balance (debm_simple) schemes, or directly prescribed"
    - "Sub-shelf melt/thermal forcing via constant, PICO, or three-equation ocean models"
  scope_out:
    - "Atmosphere and ocean dynamics are not internally simulated; they enter as boundary/forcing (one surface and one ocean component required, atmosphere optional)"
    - "Full-Stokes momentum solution (PISM uses shallow approximations up to a first-order/Blatter higher-order model, not full Stokes)"
  spatial: "3-D"
  temporal: "annual"
  closure: "both"
  notes: "Mass conservation is enforced in geometry evolution and energy is conserved across the ice / subglacial / thermal-bedrock layers (polythermal enthalpy). Closure is conditional on configuration: the default -hydrology null subglacial model is NOT mass-conserving in the map plane (till water above threshold is permanently lost), whereas -hydrology routing is. PISM advances on an adaptive (CFL-governed) timestep; 'annual' denotes the typical glaciological reporting/forcing cadence, not the internal step. Energy-balance closure of the surface depends on the chosen surface model (PDD is a temperature-index demand scheme, not a closed surface energy budget)."

inputs:
  forcing:
    - category: "atmosphere"
      name: "air_temp"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "CF-NetCDF time series (monthly or finer); near-surface air temperature consumed by the PDD/temperature-index surface model"
      notes: "Distinct from ice_surface_temp used by the 'surface given' mode; supplying the wrong one for the chosen surface model is a silent error. degC accepted ONLY if the units attribute is set correctly, else +273.15 must be applied."
    - category: "atmosphere"
      name: "precipitation"
      unit: "kg m-2 s-1"
      source_kind: "forcing"
      model_input_format: "CF-NetCDF time series; total precipitation, phase split by air temperature (>2C rain, <0C snow) in the PDD scheme"
      notes: "Manual/source canonical flux unit is kg m-2 s-1; the bootstrap/per-year convenience unit kg m-2 year-1 is also accepted via UDUNITS. m w.e. year-1 is a fatal 1000x trap."
    - category: "atmosphere"
      name: "air_temp_sd"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "CF-NetCDF; standard deviation of daily temperature variation used by the PDD scheme"
    - category: "ocean"
      name: "theta_ocean"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "CF-NetCDF time series; potential temperature on the continental shelf (PICO ocean model input)"
      notes: "PICO expects degC, not kelvin; supplying kelvin is a silent trap."
    - category: "ocean"
      name: "salinity_ocean"
      unit: "g kg-1 (PSU)"
      source_kind: "forcing"
      model_input_format: "CF-NetCDF time series; shelf salinity (PICO ocean model input)"
    - category: "ocean"
      name: "delta_SL"
      unit: "m"
      source_kind: "forcing"
      model_input_format: "scalar time series; sea-level offset relative to present"
    - category: "atmosphere"
      name: "delta_T"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "scalar paleo time series; relative temperature anomaly applied to the surface forcing"
      notes: "An anomaly: degC and K are equivalent here; adding 273.15 double-converts (silent ~273 K offset)."
    - category: "atmosphere"
      name: "frac_P / delta_P"
      unit: "1 or kg m-2 s-1"
      source_kind: "forcing"
      model_input_format: "scalar time series; multiplicative or additive precipitation scaling"
  parameters:
    - category: "rheology"
      name: "SIA enhancement factor (stress_balance.sia.enhancement_factor)"
      unit: "1"
      source_kind: "calibrated"
      model_input_format: "config parameter (-sia_e); model default 1.0"
      notes: "Model's own default is E=1.0 (pism_config.cdl). Multiplies internal shear deformation; the single strongest control on ice volume and a primary control on flow speed."
    - category: "rheology"
      name: "SSA enhancement factor (stress_balance.ssa.enhancement_factor)"
      unit: "1"
      source_kind: "calibrated"
      model_input_format: "config parameter (-ssa_e); model default 1.0"
      notes: "Scales membrane (shelf/stream) flow."
    - category: "basal"
      name: "pseudo-plastic sliding exponent q (basal_resistance.pseudo_plastic.q)"
      unit: "1"
      source_kind: "calibrated"
      model_input_format: "config parameter (-pseudo_plastic_q); model default 0.25"
      notes: "q=0 is purely plastic, q=1 is linear-viscous. With q=0 and no till friction parameterization, basal yield stress can collapse to zero (infinite sliding)."
    - category: "basal"
      name: "till effective fraction of overburden (basal_yield_stress.mohr_coulomb.till_effective_fraction_overburden)"
      unit: "1"
      source_kind: "calibrated"
      model_input_format: "config parameter; model default 0.02 (delta in Bueler & van Pelt 2015)"
    - category: "basal"
      name: "till friction angle parameterization (topg_to_phi)"
      unit: "degrees (with m breakpoints)"
      source_kind: "calibrated"
      model_input_format: "config option (-topg_to_phi phi_min,phi_max,topg_min,topg_max); maps bed elevation to till friction angle"
      notes: "Low bed elevation -> low friction angle -> weak till -> fast sliding."
    - category: "surface"
      name: "PDD factor for ice (surface.pdd.factor_ice)"
      unit: "m degC-1 day-1 (water equiv.)"
      source_kind: "calibrated"
      model_input_format: "config parameter; default ~0.008"
    - category: "surface"
      name: "PDD factor for snow (surface.pdd.factor_snow)"
      unit: "m degC-1 day-1 (water equiv.)"
      source_kind: "calibrated"
      model_input_format: "config parameter; default ~0.003"
    - category: "earth"
      name: "ice density (constants.ice.density)"
      unit: "kg m-3"
      source_kind: "default"
      model_input_format: "physical constant; default 910"
    - category: "earth"
      name: "sea water density (constants.sea_water.density)"
      unit: "kg m-3"
      source_kind: "default"
      model_input_format: "physical constant; default 1028 (sets flotation / grounding-line criterion)"
    - category: "numerics"
      name: "adaptive timestep ratio (time_stepping.adaptive_ratio)"
      unit: "1"
      source_kind: "default"
      model_input_format: "config parameter; default 0.12 (safety ratio for the diffusivity-limited SIA timestep)"
  initial_conditions:
    - category: "geometry"
      name: "thk"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "CF-NetCDF bootstrap field (standard_name land_ice_thickness); required, cannot be missing"
    - category: "geometry"
      name: "topg"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "CF-NetCDF bootstrap field (standard_name bedrock_altitude); required, cannot be missing"
    - category: "thermal"
      name: "enthalpy"
      unit: "J kg-1"
      source_kind: "dataset_lookup"
      model_input_format: "optional 3D bootstrap field; if absent it is established by spinup. Restart files MUST carry it or sub-models re-thermalize."
    - category: "hydrology"
      name: "tillwat"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "optional 2D bootstrap field; till water layer thickness, else initialized to default"
    - category: "thermal"
      name: "ice_surface_temp"
      unit: "K"
      source_kind: "dataset_lookup"
      model_input_format: "bootstrap surface temperature; ice temperature at the surface below firn (used by 'surface given')"
    - category: "mass-balance"
      name: "climatic_mass_balance"
      unit: "kg m-2 s-1"
      source_kind: "dataset_lookup"
      model_input_format: "bootstrap surface mass balance flux into the ice (used by 'surface given'); m w.e. year-1 is a fatal 1000x trap"
    - category: "geometry"
      name: "previous spinup state (restart)"
      unit: "mixed"
      source_kind: "dataset_lookup"
      model_input_format: "full PISM output read with -i FILE (no -bootstrap); preserves thermal/dynamic equilibrium from a 10k-200k year spinup"
  boundary_conditions:
    - category: "geothermal"
      name: "bheatflx"
      unit: "W m-2"
      source_kind: "dataset_lookup"
      model_input_format: "2D field; geothermal heat flux applied at the base of the bedrock thermal layer (or ice base if no bedrock layer). mW m-2 is a silent 1000x trap."
    - category: "grid"
      name: "domain / grid specification"
      unit: "m (extent), count (points)"
      source_kind: "user_provided"
      model_input_format: "grid extent and resolution (-Mx/-My/-Lx/-Ly/-dx/-dy horizontal; -Mz/-Lz ice, -Mbz/-Lbz bedrock vertical); Lz MUST exceed maximum ice thickness or the run crashes"
    - category: "grid"
      name: "map projection (PROJ)"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "PROJ string global attribute (polar stereographic for ice sheets); required for lon/lat recomputation"
    - category: "grid"
      name: "grid registration"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "corner vs center registration switch; must match input data convention or a half-cell offset results"
    - category: "physics-choice"
      name: "stress-balance model selection"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "structural switch: SIA | SSA | SIA+SSA hybrid | Blatter first-order (hybrid recommended for whole ice sheets)"
    - category: "physics-choice"
      name: "energy model selection"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "structural switch (-energy): enthalpy (default, polythermal) | cold (temperature-based) | none"
    - category: "physics-choice"
      name: "subglacial hydrology selection"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "structural switch (-hydrology): null (default, not map-plane mass-conserving) | routing (mass-conserving) | steady"
    - category: "physics-choice"
      name: "surface (SMB) model selection"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "structural switch: pdd | debm_simple (energy-balance) | given (prescribed SMB)"
    - category: "physics-choice"
      name: "ocean model selection"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "structural switch: constant | pico | th (three-equation) | given"
    - category: "physics-choice"
      name: "calving / front-retreat selection"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "structural switch: eigen_calving | thickness_calving | vonmises_calving | hayhurst_calving | float_kill (combinable)"
    - category: "physics-choice"
      name: "bed deformation selection"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "structural switch (-bed_def): none (default) | lc (Lingle-Clark) | given; advised for runs >1000 yr"
    - category: "calendar"
      name: "time axis / calendar"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "UDUNITS time units + calendar matching the forcing files; forcing axis must cover the run period or interpolation fails (fatal)"

processes:
  modules:
    - name: "StressBalance"
      role: "process_solver"
      brief: "Computes the 3D ice velocity field from a hierarchy of stress-balance approximations; reads thermal state (via FlowLaw) and basal yield stress within the same step."
    - name: "SIAFD"
      role: "process_solver"
      brief: "Shallow Ice Approximation (finite-difference), local per column; provides diffusive vertical-shear flow for grounded interior ice."
      applicability: "SIA or SIA+SSA hybrid"
    - name: "SSAFD"
      role: "process_solver"
      brief: "Shallow Shelf Approximation (finite-difference) membrane-stress solver for floating ice / ice streams; doubles as the sliding law for grounded ice in the hybrid."
      applicability: "SSA, SIA+SSA hybrid, or marine ice"
    - name: "FlowLaw"
      role: "process_solver"
      brief: "Temperature/enthalpy-dependent ice rheology (flow law) supplying ice softness to the stress balance; the thermomechanical coupling pathway."
    - name: "EnergyModel"
      role: "process_solver"
      brief: "Polythermal enthalpy-based conservation of energy (Aschwanden et al. 2012) evolving 3D enthalpy/temperature; -energy cold gives the temperature-only variant."
    - name: "BedThermalUnit"
      role: "process_solver"
      brief: "Thermal bedrock layer carrying the geothermal-flux lower boundary condition into the energy model."
    - name: "Hydrology"
      role: "process_solver"
      brief: "Subglacial water: null (till storage only), routing (transportable bwat, mass-conserving), or steady; produces tillwat governing basal strength."
    - name: "YieldStress"
      role: "process_solver"
      brief: "Mohr-Coulomb / pseudo-plastic till model computing basal yield stress (tauc) from till water (effective pressure) and the till friction angle."
    - name: "GeometryEvolution"
      role: "integrator"
      brief: "Mass-continuity step: advects ice using StressBalance advective velocity + diffusive flux and applies surface/basal mass fluxes to evolve thickness; enforces geometry consistency (cell_type)."
    - name: "FrontRetreat"
      role: "process_solver"
      brief: "Calving and front retreat (eigen, thickness, von Mises, Hayhurst, float_kill) controlling the dynamic calving-front position and discharge."
    - name: "BedDef"
      role: "process_solver"
      brief: "Lingle-Clark (FFTW-based) solid-earth bed deformation under ice load; options none / lc / given."
      applicability: "-bed_def lc or given"
    - name: "SurfaceModel"
      role: "driver"
      brief: "Surface boundary: PDD or energy-balance (debm_simple) converting air temp + precip to SMB and ice-surface temperature, or directly prescribed (given)."
    - name: "OceanModel"
      role: "driver"
      brief: "Marine boundary supplying sub-shelf melt and thermal forcing and an average water-column pressure injected into the SSA momentum balance; constant / PICO / three-equation / given."
    - name: "AgeModel"
      role: "process_solver"
      brief: "Advects a 3D ice-age tracer on the shared temperature/age sub-timestep; diagnostic of stratigraphy."
      applicability: "when age tracking enabled"
    - name: "AdaptiveTimeStep"
      role: "integrator"
      brief: "CFL/diffusivity-governed adaptive timestep with a skip mechanism for expensive sub-models (energy/age sub-cycling)."
  internal_edges:
    - from: "SurfaceModel"
      to: "GeometryEvolution"
      kind: "invokes"
      brief: "Supplies climatic mass balance (SMB) consumed by the mass-continuity step."
    - from: "EnergyModel"
      to: "FlowLaw"
      kind: "invokes"
      brief: "Enthalpy/temperature sets temperature-dependent ice softness (thermomechanical coupling)."
    - from: "FlowLaw"
      to: "StressBalance"
      kind: "invokes"
      brief: "Ice rheology feeds the velocity solve."
    - from: "BedThermalUnit"
      to: "EnergyModel"
      kind: "invokes"
      brief: "Geothermal flux from the bedrock thermal layer is the lower energy boundary condition."
    - from: "Hydrology"
      to: "tillwat"
      kind: "writes_state"
      brief: "Subglacial model updates till water thickness."
    - from: "Hydrology"
      to: "YieldStress"
      kind: "invokes"
      brief: "Till water and subglacial water set effective pressure for the Mohr-Coulomb yield stress."
    - from: "YieldStress"
      to: "tauc"
      kind: "writes_state"
      brief: "Computes basal yield stress."
    - from: "YieldStress"
      to: "SSAFD"
      kind: "invokes"
      brief: "Basal yield stress enters the SSA sliding law."
    - from: "SIAFD"
      to: "StressBalance"
      kind: "invokes"
      brief: "Vertical-shear (diffusive) contribution to the hybrid velocity."
    - from: "SSAFD"
      to: "StressBalance"
      kind: "invokes"
      brief: "Membrane (sliding/shelf) contribution to the hybrid velocity."
    - from: "OceanModel"
      to: "StressBalance"
      kind: "invokes"
      brief: "Average water-column pressure couples ocean pressure into the SSA momentum balance for floating ice."
    - from: "StressBalance"
      to: "GeometryEvolution"
      kind: "invokes"
      brief: "Advective velocity + diffusive flux drive ice flux divergence in mass continuity."
    - from: "StressBalance"
      to: "AgeModel"
      kind: "invokes"
      brief: "3D velocity field advects the ice-age tracer on the shared TempAge sub-timestep (AgeModel and EnergyModel share m_t_TempAge/m_dt_TempAge and read the same velocity field)."
    - from: "AgeModel"
      to: "age"
      kind: "writes_state"
      brief: "Evolves the 3D ice-age tracer."
    - from: "GeometryEvolution"
      to: "thk"
      kind: "writes_state"
      brief: "Evolves ice thickness from flux divergence and surface/basal mass fluxes."
    - from: "OceanModel"
      to: "GeometryEvolution"
      kind: "invokes"
      brief: "Sub-shelf melt merges with grounded basal melt before geometry evolution."
    - from: "EnergyModel"
      to: "Hydrology"
      kind: "invokes"
      brief: "Basal melt from the energy model is the surface input to subglacial hydrology."
    - from: "EnergyModel"
      to: "enthalpy"
      kind: "writes_state"
      brief: "Evolves 3D ice enthalpy."
    - from: "FrontRetreat"
      to: "thk"
      kind: "writes_state"
      brief: "Calving/front retreat removes ice and updates the calving-front geometry and mask."
    - from: "BedDef"
      to: "topg"
      kind: "writes_state"
      brief: "Bed deforms under ice load (Lingle-Clark)."
    - from: "Inputs"
      to: "GeometryEvolution"
      kind: "consumes_input"
      brief: "Sea-level offset (delta_SL) sets the flotation criterion / grounding-line position."
    - from: "StressBalance"
      to: "Outputs"
      kind: "produces_output"
      brief: "Surface and basal speed diagnostics (e.g. velsurf_mag, velbase_mag)."
    - from: "GeometryEvolution"
      to: "Outputs"
      kind: "produces_output"
      brief: "Thickness, surface elevation, mask, and scalar mass/volume diagnostics."
    - from: "AdaptiveTimeStep"
      to: "GeometryEvolution"
      kind: "invokes"
      brief: "CFL/diffusivity-limited dt bounds the mass-continuity step."

states:
  variables:
    - name: "thk"
      unit: "m"
      role: "prognostic"
    - name: "enthalpy"
      unit: "J kg-1"
      role: "prognostic"
    - name: "topg"
      unit: "m"
      role: "prognostic"
    - name: "ice_area_specific_volume"
      unit: "m"
      role: "prognostic"
    - name: "tillwat"
      unit: "m"
      role: "prognostic"
    - name: "bwat"
      unit: "m"
      role: "prognostic"
    - name: "tauc"
      unit: "Pa"
      role: "diagnostic"
    - name: "velocity (u,v,w)"
      unit: "m s-1"
      role: "diagnostic"
    - name: "cell_type / mask"
      unit: "categorical"
      role: "diagnostic"
    - name: "cell_grounded_fraction"
      unit: "1"
      role: "diagnostic"
    - name: "bedrock_thermal_temperature"
      unit: "K"
      role: "prognostic"
    - name: "age"
      unit: "s"
      role: "prognostic"
    - name: "ice_volume_glacierized"
      unit: "m3"
      role: "accumulator"
    - name: "ice_mass"
      unit: "kg"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "thk"
    validation_rank: 3
    unit: "m"
    description: "Ice thickness"
    emitted_in: "spatial output NetCDF (-o / -extra_file)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Equilibrium thickness depends on spinup adequacy; transient drift confounds comparison if spinup is short."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Meaningful only against thickness-change observations over a matched forcing period."]
      detrending_options: ["none", "linear_residual"]
  - var: "usurf"
    validation_rank: 4
    unit: "m"
    description: "Ice surface elevation"
    emitted_in: "spatial output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Surface elevation = bed + thickness; bed errors propagate directly."]
      detrending_options: ["none"]
  - var: "velsurf_mag"
    validation_rank: 1
    unit: "m year-1"
    description: "Surface ice speed magnitude"
    emitted_in: "spatial output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy", "ranking_quality"]
          determining_metric: "csi"
          caveats: ["Fast-flow features span orders of magnitude; log-space or rank metrics often more informative. Primary observable used to calibrate sliding/enhancement parameters."]
      detrending_options: ["none"]
  - var: "velbase_mag"
    validation_rank: 5
    unit: "m year-1"
    description: "Basal sliding speed magnitude"
    emitted_in: "spatial output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Rarely directly observed; usually inferred, so comparison is indirect."]
      detrending_options: ["none"]
  - var: "mask"
    validation_rank: 6
    unit: "categorical"
    description: "Cell type (ice-free / grounded / floating / ocean), encodes grounding-line and ice extent"
    emitted_in: "spatial output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection", "spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Grounding-line position and ice extent compared as classified regions; sub-grid grounded fraction matters near the GL."]
      detrending_options: ["none"]
  - var: "ice_volume_glacierized"
    validation_rank: 7
    unit: "m3"
    description: "Total glacierized ice volume (convertible to sea-level equivalent)"
    emitted_in: "scalar time-series NetCDF (-ts_file)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Absolute volume is spinup-dependent; volume CHANGE (mass balance) is the more defensible comparison."]
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none", "first_difference"]
  - var: "tendency_of_ice_mass"
    validation_rank: 2
    unit: "Gt year-1"
    description: "Total ice mass change rate (net mass balance)"
    emitted_in: "scalar time-series NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Compared against gravimetric (GRACE-class) or input-output mass-balance estimates; transient observations strongly constrain calibration."]
      detrending_options: ["none", "first_difference"]
  - var: "tendency_of_ice_mass_due_to_discharge"
    validation_rank: 8
    unit: "Gt year-1"
