validation:
  - dag_variable: FATES_VEGC
    obs_shape: point_snapshot
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives an acceptable PBIAS cutoff for FATES live vegetation carbon; evaluate against inventory or biomass-product uncertainty."
        cites: []
    secondary_metrics:
      - metric: observed_range_overlap
        direction: maximize
        status: supportive
        ceiling_reason: "Massoud 2019 and Huang 2020 compare simulated biomass with observed ranges or inventories, but do not set a pass band."
        cites: [massoud2019, huang2020]
    validated_when: "UNRESOLVED - vegetation carbon is benchmarked against forest inventories or biomass products, but no cited numeric pass band was fetched."
    evidence_strength: moderate
    confidence: 0.4
    notes: "Massoud 2019 used a qualitative comparison to literature ranges; Huang 2020 reports AGB observations and simulations in Table 5. Luo 2012 lists plant biomass as a candidate carbon-pool benchmark and says thresholds must be justified."

  - dag_variable: FATES_VEGC
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "CSI is the dag spatial-pattern metric, but fetched land-model benchmark papers use bias, RMSE, spatial distribution, and ILAMB scores rather than a CSI cutoff for biomass."
        cites: []
      - metric: ilamb_overall_score
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "ILAMB scores are on [0,1], but no fetched paper defines a FATES biomass score threshold for validation."
        cites: []
    secondary_metrics:
      - metric: spatial_distribution_score
        direction: maximize
        status: supportive
        ceiling_reason: "ILAMB integrates bias, RMSE, interannual variability, spatial pattern, and related scores; plant biomass is listed as a benchmark variable."
        cites: [collier2018, luo2012, lawrence2019]
    validated_when: "UNRESOLVED - use biomass-product spatial benchmarking, but do not auto-pass without a cited score cutoff."
    evidence_strength: moderate
    confidence: 0.35
    notes: "Collier 2018 says ILAMB produces maps, time series, and metrics; Lawrence 2019 warns overall scores mix several metrics."

  - dag_variable: FATES_GPP
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "The dag metric is retained, but fetched FATES and land-model papers did not give a GPP NSE validation threshold."
        cites: []
      - metric: rmse
        direction: minimize
        unit: kgC/m2/time
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Field papers report RMSE or normalized errors against flux towers; no numeric acceptable RMSE cutoff was fetched."
        cites: []
    secondary_metrics:
      - metric: bias_vs_observed_variability
        direction: zero_centered
        status: supportive
        ceiling_reason: "Longo 2020 judged GPP by biases relative to tower estimates and errors less than observed variability."
        cites: [longo2020]
    validated_when: "UNRESOLVED - compare converted GPP time series to flux-tower benchmarks using RMSE/bias/correlation, but no cited pass band exists."
    evidence_strength: moderate
    confidence: 0.4
    notes: "Longo 2020 reports GPP showed small biases and relatively small errors; Huang 2020 reports reasonable GPP values against observations."

  - dag_variable: FATES_GPP
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "CSI is retained from the dag, but fetched terrestrial GPP benchmark papers use ILAMB bias/RMSE/phase/spatial metrics instead of CSI thresholds."
        cites: []
      - metric: ilamb_overall_score
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper states a minimum ILAMB GPP score that validates FATES."
        cites: []
    secondary_metrics:
      - metric: bias_rmse_phase_spatial_score
        direction: maximize
        status: supportive
        ceiling_reason: "Collier 2018 defines bias, centralized RMSE, phase shift, interannual variability, and spatial distribution scores for GPP-like variables."
        cites: [collier2018, lawrence2019]
    validated_when: "UNRESOLVED - use ILAMB-style GPP benchmark scores, but leave the automatic gate undecidable until a cited score cutoff is fetched."
    evidence_strength: moderate
    confidence: 0.4
    notes: "Collier 2018 maps zero error to score 1 and reduces scores as error grows; Lawrence 2019 applies ILAMB to GPP and climate relationships."

  - dag_variable: FATES_NPP
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched FATES or land-model paper gives a point-time-series NPP NSE validation threshold."
        cites: []
      - metric: rmse
        direction: minimize
        unit: kgC/m2/time
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "NPP is benchmarked against site or gridded products, but no acceptable RMSE cutoff was fetched."
        cites: []
    secondary_metrics:
      - metric: observed_range_overlap
        direction: maximize
        status: supportive
        ceiling_reason: "Massoud 2019 reports simulated and observed NPP ranges; Huang 2020 compares NPP to observation-based estimates."
        cites: [massoud2019, huang2020]
    validated_when: "UNRESOLVED - compare NPP to observed ranges or products, but do not auto-pass on NSE/RMSE without a cited band."
    evidence_strength: moderate
    confidence: 0.35
    notes: "Luo 2012 lists NPP as a candidate benchmark for carbon influx; Huang 2020 notes its selected parameter set overestimates NPP."

  - dag_variable: FATES_NPP
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper defines an acceptable regional NPP PBIAS cutoff for FATES."
        cites: []
      - metric: ilamb_overall_score
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "ILAMB supports regional/global NPP evaluation, but no minimum score threshold was fetched."
        cites: []
    secondary_metrics:
      - metric: global_total_bias
        direction: zero_centered
        status: supportive
        ceiling_reason: "Lawrence 2019 compares global NPP and carbon-cycle fluxes with data products; Luo 2012 lists yearly global NPP benchmarks."
        cites: [lawrence2019, luo2012]
    validated_when: "UNRESOLVED - use regional or global NPP bias/score diagnostics, but no cited pass band was fetched."
    evidence_strength: moderate
    confidence: 0.35
    notes: "Luo 2012 treats NPP as a carbon-influx benchmark; Lawrence 2019 reports global carbon fluxes against available data products."

  - dag_variable: FATES_LAI
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "The dag metric is retained, but fetched LAI benchmarks do not give an NSE pass cutoff."
        cites: []
      - metric: phase_shift
        direction: zero_centered
        unit: days
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Phenology timing is important, but no fetched FATES/ILAMB paper gives an acceptable day-of-year phase error cutoff."
        cites: []
    secondary_metrics:
      - metric: rmse_against_modis
        direction: minimize
        status: supportive
        ceiling_reason: "Lawrence 2019 reports LAI RMSE against MODIS by PFT; Massoud 2019 compares LAI with MODIS-derived ranges."
        cites: [lawrence2019, massoud2019]
    validated_when: "UNRESOLVED - compare LAI seasonality and magnitude with MODIS or site observations, but no cited threshold was fetched."
    evidence_strength: moderate
    confidence: 0.4
    notes: "Lawrence 2019 says CLM5 reduced RMSE compared to MODIS LAI for nine of 14 PFTs, but this is comparative, not a pass band."

  - dag_variable: FATES_LAI
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "CSI is retained from the dag, but fetched LAI literature uses RMSE, bias, phase, spatial distribution, and ILAMB scores."
        cites: []
