    silently violates the DLBreach inflow card convention.
  remedy: Convert the manual CSV first column to hours before running convert_cama_to_inflow.py, then
    inspect the generated Upstream_Reservoir_Inflow block for hour-scale times.
  severity: silent
- id: dt_027
  symptom: extract_breach_results.py succeeds, but the parsed peak discharge belongs to an older run rather
