influence:
  edges:
    - from: "precipitation (snowfall forcing)"
      to: "snw"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "always"
      citations: ["gunther2019_fsm_uncertainty_sensitivity", "bonsoms2024_fsm2_ros_sensitivity"]
    - from: "air temperature (forcing)"
      to: "snw"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "always"
      citations: ["bonsoms2024_fsm2_ros_sensitivity", "gunther2019_fsm_uncertainty_sensitivity"]
    - from: "air temperature (forcing)"
      to: "Melt"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "always"
