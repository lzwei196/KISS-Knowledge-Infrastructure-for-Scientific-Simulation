# MONICA Diagnostic Triplets
# symptom → diagnosis → remedy for common failure modes
# Organized by failure domain

---
# Unit conversion traps (silent errors)

- id: dt_01
  stage: climate_forcing
  failure_domain: unit_conversion
  symptom: >
    Yield is 10–100× too high (e.g., 500,000 kg ha⁻¹ instead of 5,000).
    Crop LAI grows to extreme values. All biomass pools inflated.
  diagnosis: >
    Global radiation (globrad) was supplied in J cm⁻² or W m⁻² instead of
    MJ m⁻² d⁻¹. MONICA reads the value as-is, resulting in 100× or ~12×
    over-estimation of available photosynthetically active radiation.
  remedy: >
    Convert globrad before writing climate.csv:
    - J cm⁻² → MJ m⁻² d⁻¹: divide by 100
    - W m⁻² → MJ m⁻² d⁻¹: multiply by 0.0864
    Alternatively, use header-to-acd-names in sim.json:
    "globrad": ["globrad", "/", 100]
  severity: silent

- id: dt_02
  stage: climate_forcing
  failure_domain: unit_conversion
  symptom: >
    ET0 is always 0 or near 0. Crops show severe water stress even with
    adequate precipitation. Transpiration deficit (TraDef) stuck at 1.0.
  diagnosis: >
    Relative humidity was provided as a fraction [0–1] instead of percentage
    [0–100]. The Penman-Monteith ET calculation receives near-zero humidity
    values, leading to incorrect vapour pressure deficit computation.
  remedy: >
    Ensure relhumid is in percent (0–100). If source data is fraction,
    multiply by 100. Use --relhumid-unit fraction flag in the converter tool.
  severity: silent

- id: dt_03
  stage: climate_forcing
  failure_domain: unit_conversion
  symptom: >
    Unrealistic actual evapotranspiration values (ET > 20 mm d⁻¹ regularly).
    Soil dries out much faster than expected.
  diagnosis: >
    Wind speed was provided in km h⁻¹ instead of m s⁻¹. Wind speed enters
    the Penman-Monteith equation directly; a 3.6× overestimate amplifies
    the aerodynamic term of ET.
  remedy: >
    Convert wind speed: km h⁻¹ ÷ 3.6 = m s⁻¹.
    Use --wind-unit km_h flag in the converter tool.
  severity: silent

- id: dt_04
  stage: climate_forcing
  failure_domain: unit_conversion
  symptom: >
    Precipitation totals are 1000× too high. Massive waterlogging and
    surface runoff. Crop dies from oxygen stress.
  diagnosis: >
    Precipitation was provided in m d⁻¹ instead of mm d⁻¹.
    ERA5 natively reports total precipitation in metres.
  remedy: >
    Convert m to mm: multiply by 1000.
    Use --precip-unit m flag in the converter tool.
  severity: silent

- id: dt_05
  stage: soil_parameterisation
  failure_domain: unit_conversion
  symptom: >
    Negative volumetric soil moisture. Model may crash or produce
    physically impossible soil water content values.
  diagnosis: >
    Soil layer thickness was provided in cm instead of m. A layer
    specified as "30" (meaning 30 cm) is interpreted as 30 m, causing
    the water balance to become nonsensical.
  remedy: >
    Ensure Thickness is in metres: [0.1, "m"] for 10 cm layers.
    If source data is in cm, divide by 100.
  severity: fatal

- id: dt_06
  stage: soil_parameterisation
  failure_domain: unit_conversion
  symptom: >
    Soil water dynamics are wrong. Field capacity and wilting point
    computed by pedotransfer functions are incorrect.
  diagnosis: >
    Bulk density (SoilRawDensity) was provided in g cm⁻³ instead of
    kg m⁻³. A value of 1.4 (g cm⁻³) is interpreted as 1.4 kg m⁻³
    (essentially zero density), corrupting porosity calculations.
  remedy: >
    Convert g cm⁻³ to kg m⁻³: multiply by 1000.
    Value should be in range [500, 2000] kg m⁻³.
  severity: silent

- id: dt_07
  stage: soil_parameterisation
  failure_domain: unit_conversion
  symptom: >
    SOC decomposition rates are extreme. Either too fast (SOC in g/kg
    interpreted as %) or unmeasurably slow (SOC as fraction interpreted as %).
  diagnosis: >
    SoilOrganicCarbon was provided in g kg⁻¹ instead of %.
    A value of 15 g kg⁻¹ = 1.5% is read as 15%.
  remedy: >
    Convert g kg⁻¹ to %: divide by 10.
    Typical agricultural SOC: 0.5–4%.
  severity: silent

- id: dt_08
  stage: soil_parameterisation
  failure_domain: unit_conversion
  symptom: >
    Sand/clay fractions appear as 40–80 in the JSON (as percentages)
    but MONICA expects fractions. Pedotransfer functions produce wrong
    field capacity and wilting point.
  diagnosis: >
    Sand and Clay were provided as percentages (0–100) where fractions
    (0–1) are expected, or vice versa depending on configuration.
  remedy: >
    When using Sand/Clay directly (not KA5TextureClass), provide as
    fractions [0–1]. Divide percentages by 100.
  severity: silent

- id: dt_09
  stage: crop_rotation
  failure_domain: unit_conversion
  symptom: >
    Nitrogen surplus is 5× higher than expected. Soil NO₃ accumulates
    to extreme levels. N leaching far exceeds observations.
  diagnosis: >
    Mineral fertiliser amount was specified in kg product ha⁻¹ instead
    of kg N ha⁻¹. For example, 200 kg Ammonium Nitrate ha⁻¹ contains
    only ~68 kg N ha⁻¹ (34% N).
  remedy: >
    Specify fertiliser amount as kg N ha⁻¹. The N partitioning
    (NH4/NO3/Carbamid fractions) is defined in the fertiliser parameter
    file, not the amount field.
  severity: silent

- id: dt_10
  stage: soil_parameterisation
  failure_domain: unit_conversion
  symptom: >
    Background N leaching is very high even without fertilisation.
    Soil mineral N accumulates unrealistically between crop seasons.
  diagnosis: >
    NDeposition was specified as a daily rate (kg N ha⁻¹ d⁻¹) instead
    of annual (kg N ha⁻¹ yr⁻¹). A value of 30 kg N ha⁻¹ d⁻¹ would
    deposit 10,950 kg N ha⁻¹ yr⁻¹.
  remedy: >
    NDeposition must be annual: [30, "kg N ha-1 y-1"].
    Typical range: 5–50 kg N ha⁻¹ yr⁻¹.
  severity: silent

# Configuration and runtime errors

- id: dt_11
  stage: execution
  failure_domain: path_resolution
  symptom: >
    MONICA starts but produces zero output. No crop growth, no soil
    processes. Output file contains only headers.
  diagnosis: >
    The MONICA_PARAMETERS environment variable is not set or points to
    a wrong directory. All "include-from-file" references fail silently,
    resulting in default (zero) parameters.
  remedy: >
    Set MONICA_PARAMETERS to the monica-parameters repository root:
    export MONICA_PARAMETERS=/path/to/monica-parameters
    Verify: ls $MONICA_PARAMETERS/crops/ should list crop JSON files.
  severity: silent

- id: dt_12
  stage: execution
  failure_domain: runtime
  symptom: >
    JSON parse error on startup. MONICA refuses to run with a cryptic
    error message about unexpected token.
  diagnosis: >
    The JSON configuration file has a syntax error. Most commonly: a
    trailing comma after the last element in an array or object. JSON
    does not allow trailing commas (unlike JavaScript).
  remedy: >
    Validate JSON with a linter (python -m json.tool sim.json).
    Remove trailing commas. Check for missing brackets.
  severity: fatal

- id: dt_13
  stage: execution
  failure_domain: runtime
  symptom: >
    Segmentation fault immediately on startup. No output produced.
  diagnosis: >
    The mas_cpp_misc symlink is missing or broken. MONICA's shared
    libraries (date, helpers, climate-file-io) cannot be found,
    leading to uninitialised function pointers.
  remedy: >
    Create the symlink: ln -sf ../mas-infrastructure/src mas_cpp_misc
    Rebuild: cd _cmake_release && cmake .. && make -j$(nproc)
  severity: fatal

- id: dt_14
  stage: execution
  failure_domain: dependency_mismatch
  symptom: >
    "No climate data available" error. Simulation period is empty
    despite climate.csv having data.
  diagnosis: >
    Date format mismatch between climate.csv and sim.json configuration.
    Climate.csv uses DE-date (DD.MM.YYYY) but sim.json maps it as
    iso-date (YYYY-MM-DD), or vice versa.
  remedy: >
    Match the header-to-acd-names mapping in sim.json to the actual
    column names in climate.csv. Use "DE-date": "de-date" for German
    dates or "iso-date": "iso-date" for ISO dates.
  severity: fatal

- id: dt_15
  stage: execution
  failure_domain: runtime
  symptom: >
    Crop never reaches harvest. AutomaticHarvest never triggers.
    Simulation runs to end date without producing yield.
  diagnosis: >
    The latest-date for AutomaticHarvest is set too early (before the
    crop reaches maturity), OR the crop cultivar's StageTemperatureSum
    is too large for the available growing degree days at this location.
  remedy: >
    Extend the latest-date to well past expected maturity. Check that
    the cultivar is appropriate for the climate zone. Compare TempSum
    accumulation in daily output against StageTemperatureSum requirements.
  severity: degraded

- id: dt_16
  stage: crop_rotation
  failure_domain: parameter_format
  symptom: >
    Winter crop planted in spring shows extremely late development
    and low yield. Spring crop planted in autumn dies.
  diagnosis: >
    The is-winter-crop flag does not match the actual sowing season.
    Winter crops require vernalisation (cold period); sowing them in
    spring means they never satisfy vernalisation requirements.
  remedy: >
    Set is-winter-crop correctly. Match sowing date to crop type:
    winter crops in Sep–Nov, spring crops in Mar–May.
  severity: degraded

- id: dt_17
  stage: output_analysis
  failure_domain: silent_error
  symptom: >
    Water balance does not close. Annual ET + recharge + runoff
    differs significantly from precipitation + irrigation.
  diagnosis: >
    Likely a soil parameter error (wrong bulk density or field capacity)
    causing incorrect storage change calculations, or the soil column
    depth is insufficient (< 2m) leading to truncated percolation.
  remedy: >
    Check soil parameters, especially bulk density units (kg m⁻³).
    Ensure soil column extends to 2 m (20 layers × 0.1 m).
    Compare simulated vs measured soil moisture profiles.
  severity: degraded

# ── Multi-site / CMFD workflow traps (added 2026-04-30) ─────────────────────

- id: dt_18
  stage: soil_setup
  failure_domain: tool_bug
  symptom: >
    MONICA crashes immediately with:
    "terminate called after throwing an instance of 'std::out_of_range'
     what():  vector::_M_range_check: __n (which is 0) >= this->size() (which is 0)"
    Binary exits with returncode -6 (SIGABRT). No output file created.
  diagnosis: >
    convert_soil_to_monica.py places SoilProfileParameters at the JSON root level,
    but MONICA requires it nested inside SiteParameters. The soil layers vector is
    empty from MONICA's perspective, causing an out-of-bounds access on the first
    simulation step. This is a bug in the KI tool's JSON output structure.
  remedy: >
    After running convert_soil_to_monica.py, move SoilProfileParameters inside
    SiteParameters using:
      python3 -c "
      import json
      with open('site.json') as f: d = json.load(f)
      template = <load original working site.json>
      template['SiteParameters']['SoilProfileParameters'] = d['SoilProfileParameters']
      with open('site.json','w') as f: json.dump(template, f, indent=2)
      "
    Alternatively, the bug is at line ~288 of convert_soil_to_monica.py where
    'SoilProfileParameters' is written at root; it should be nested under
    SiteParameters in the output dict. Fix the tool directly:
    Change output structure so SoilProfileParameters is inside SiteParameters.
  severity: fatal

- id: dt_19
  stage: climate_forcing
  failure_domain: configuration
  symptom: >
    MONICA crashes with std::out_of_range (same as dt_18 symptom) OR produces
    zero yield for all years, despite climate.csv containing valid data.
    Log shows no obvious error. Elapsed time is near 0s.
  diagnosis: >
    csv-separator in sim.json does not match the actual delimiter in climate.csv.
    convert_climate_to_monica.py outputs semicolon-delimited (;) files, but
    sim.json defaults to csv-separator: "," (comma). MONICA reads zero rows
    and the climate data vector is empty.
  remedy: >
    After generating climate.csv with convert_climate_to_monica.py, check its
    delimiter with: head -1 climate.csv
    If semicolons are used, update sim.json:
      "climate.csv-options": { "no-of-climate-file-header-lines": 2, "csv-separator": ";" }
    Note: convert_climate_to_monica.py always outputs ";" as the separator.
  severity: fatal

- id: dt_20
  stage: soil_setup
  failure_domain: input_format
  symptom: >
    convert_soil_to_monica.py --format hwsd raises:
    "UnicodeDecodeError: 'utf-8' codec can't decode byte 0x97"
    when passed the HWSD raster file (hwsd.bil).
  diagnosis: >
    The --format hwsd mode expects a pre-extracted CSV lookup table
    (with columns T_SAND, T_CLAY, T_OC, T_BULK_DENSITY, T_PH_H2O),
    NOT the binary .bil raster file. Passing the raster triggers a
    UTF-8 decode failure when the tool tries to read it as CSV.
  remedy: >
    Step 1 — look up the MU_GLOBAL code at the target lat/lon from the raster:
      python3 -c "
      import rasterio; from rasterio.transform import rowcol; import numpy as np
      with rasterio.open('data/soil/HWSD_RASTER/hwsd.bil') as src:
          row,col = rowcol(src.transform, lon, lat)
          print('MU_GLOBAL:', src.read(1)[row,col])
      "
    Step 2 — look up soil properties from data/soil/HWSD_DATA.csv
      (use encoding='latin-1'; key columns: T_SAND, T_SILT, T_CLAY, T_OC,
      T_REF_BULK_DENSITY, T_PH_H2O, and S_* variants for subsoil)
    Step 3 — write a 1-row CSV with ONLY T_* columns (topsoil):
      T_SAND,T_SILT,T_CLAY,T_OC,T_BULK_DENSITY,T_PH_H2O
      36,43,21,0.65,1.39,8.0
    Step 4 — pass that CSV to convert_soil_to_monica.py --format hwsd
    Note: passing only topsoil row generates all 20 layers from topsoil
    properties (no subsoil gradient). Adequate for uncalibrated runs;
    for calibrated runs, add a second row with S_* column names.
  severity: fatal

- id: dt_21
  stage: validation
  failure_domain: systematic_bias
  symptom: >
    MONICA severely underestimates yield (PBIAS < -40%) for Chinese wheat
    despite reasonable soil and climate inputs. NSE strongly negative.
  diagnosis: >
    UseAutomaticIrrigation is set to false (default). Chinese winter wheat
    (Huang-Huai-Hai Plain) receives 3-4 irrigations per season (~150-200 mm
    total). Running rainfed against irrigated national/provincial statistics
    produces a systematic -40 to -60% bias.
  remedy: >
    Enable irrigation in sim.json for Chinese wheat simulations:
      "UseAutomaticIrrigation": true,
      "AutoIrrigationParams": {
          "irrigationParameters": { "nitrateConcentration": [0, "mg dm-3"] },
          "amount": [50, "mm"],
          "trigger_if_nFC_below_%": [55, "%"],
          "calc_nFC_until_depth_m": [0.6, "m"]
      }
    Also relax the AutomaticHarvest precipitation conditions (originally
    max-3d-precip-sum: 5, max-curr-day-precip: 1 — too strict for China's
    rainy early-summer climate). Recommended: max-3d-precip-sum: 25,
    max-curr-day-precip: 5.
  severity: silent

- id: dt_22
  stage: climate_forcing
  failure_domain: forcing_choice
  symptom: >
    MONICA yields with CMFD forcing are 20-30% higher than with NASA POWER
    forcing for the same site and settings. Unclear which is more accurate.
  diagnosis: >
    CMFD (China Meteorological Forcing Dataset) is a station-based reanalysis
    with higher solar radiation values than NASA POWER's satellite-derived
    estimates. Higher radiation drives more photosynthesis → higher simulated
    yields. For Chinese basins, CMFD is the preferred forcing (observation-based,
    0.1° resolution) but causes a systematic ~26% yield inflation relative to
    NASA POWER at Shandong (36.5°N). Neither is "wrong" — they differ in
    radiation estimation methodology.
  remedy: >
    For China basins: use CMFD forcing and compare against provincial yield
    statistics rather than national FAOSTAT averages. Provincial statistics
    are typically 5-20% higher than national averages and closer to the
    single-site CMFD simulation.
    For global/non-China sites: use MSWX or NASA POWER.
    Note: after DM→FW conversion (yield_DM ÷ 0.88), CMFD-based MONICA yields
    at Chinese sites are ~15-30% above FAOSTAT national averages, which is
    physically plausible (high-productivity single sites > national mean).
  severity: degraded

- id: dt_23
  stage: soil_setup
  failure_domain: data_quality
  symptom: >
    Henan province wheat yield is underestimated by -10 to -20% even with
    irrigation enabled. Other NCP (North China Plain) provinces simulate
    closer to reference values.
  diagnosis: >
    HWSD MU_GLOBAL codes for the Henan sampling point (e.g., 11078) report
    ~80% sand in both topsoil and subsoil — a Fluvisol/Entisol mapping unit
    that does not represent actual cultivated soil. Millennia of cultivation
    and sediment management have changed the effective soil texture. The
    sandy HWSD profile has very low plant-available water capacity (PAW),
    limiting yield even under automatic irrigation.
  remedy: >
    For Henan wheat validation, override the HWSD texture with a loam
    approximation (T_SAND=45, T_CLAY=25) representative of cultivated
    Fluvisols in the Huang-Huai-Hai Plain. This is consistent with
    China's second soil survey data for the region.
    Alternatively, use SoilGrids v2 (250m) instead of HWSD for Chinese
    agricultural plains — it better captures cultivation-modified soils.
  severity: degraded

- id: dt_24
  stage: output_comparison
  failure_domain: scale_mismatch
  symptom: >
    A single irrigated high-yield-province point simulation (e.g. Shandong
    winter wheat, ~4500 kg DM ha-1 → ~5100 kg FW ha-1) overshoots the
    FAOSTAT *national* China wheat yield (~3300-4100 kg ha-1) by +40-45%
    PBIAS, and the detrended interannual correlation is ~0 or negative
    (r_detr ≈ -0.3). NSE/KGE are strongly negative.
  diagnosis: >
    obs_shape mismatch, NOT a model or unit error. FAOSTAT national yield is
    a `regional_aggregate_time_series`: a fresh-weight area-weighted mean over
    ALL provinces (high- and low-yielding) that also carries a multi-decade
    technology/management uptrend. A single point sim at one productive,
    irrigated province is unrepresentative of that aggregate in BOTH level
    (a top province overshoots the national mean; a rainfed point undershoots
    it — cf dt_21) and trend (a weather-driven point has no technology trend).
    The dag (outputs.Yield.observability) declares only
    [magnitude_accuracy, trend_match] valid for this obs_shape; raw NSE/KGE/r
    (temporal_pattern_match) are structurally invalid and must not gate.
  remedy: >
    1. Score ONLY magnitude_accuracy (PBIAS on DM→FW converted levels) and
       trend_match (detrended/first-difference r) — never raw NSE/KGE/r.
    2. For a defensible *magnitude* test, compare the point sim against the
       matching PROVINCIAL reference (Shandong ≈ 5-6 t/ha FW), not the
       national mean — as the validated China multi-site workflow does.
    3. To compare against the national aggregate honestly, representative-
       aggregate several province point runs (area-weighted) before scoring,
       and detrend both series to remove the technology trend the point model
       cannot reproduce.
    Expect the single-province-vs-national comparison to remain a structural
    overshoot; this is the irrigated mirror of dt_21's rainfed undershoot.
  severity: structural

- id: dt_25
  stage: output_comparison
  failure_domain: scale_mismatch
  symptom: >
    You want to honestly compare MONICA point runs against the FAOSTAT
    *national* China wheat series (dt_24's regional_aggregate_time_series),
    and need a concrete representative-aggregation recipe + which moisture
    convention to use. Also: the validated multi-site PBIAS table in SKILL.md
    (+5.8% Hebei … +10.3% Shandong) appears to compare model kg DM ha-1
    DIRECTLY against fresh-weight provincial refs, while the SKILL "Unit notes"
    document a DM->FW /0.88 conversion — applying that conversion shifts every
    PBIAS up by ~+14%, so the two parts of the SKILL are internally inconsistent.
  diagnosis: >
    Empirically resolved on 2026-06-24. Area-weighting the 5 validated NCP
    winter-wheat province point runs (Hebei/Shandong/Henan/Jiangsu/Anhui,
    1992-2000) by wheat sown area (approx Mha: Henan 5.0, Shandong 3.8,
    Hebei 2.5, Jiangsu 2.2, Anhui 2.2) into ONE national-representative series,
    then comparing against FAOSTAT "China, mainland" Wheat Yield kg/ha
    (mean ~3670 kg ha-1 over 1992-2000), gives:
      - DM-direct  (no /0.88, matches the validated multi-site table): PBIAS +7.0%
                   -> STRONG magnitude PASS.
      - FW (/0.88, matches the SKILL Unit-notes convention):          PBIAS +21.6%.
    This is a dramatic improvement over the single-Shandong-/0.88-vs-national
    +43% (dt_24 / prior real-case run): representative aggregation, not a
    parameter/cultivar change, is what fixes the magnitude. The detrended trend
    stays weak in BOTH conventions (obs slope +66.5 vs sim slope +18-21
    kg ha-1 yr-1, slope ratio ~0.27, r_detr ~0.22) — confirming dt_24's point:
    a fixed-management weather-driven point cannot reproduce the national
    multi-decade technology uptrend. raw NSE/KGE/r (temporal_pattern_match)
    remain negative/near-zero and stay gate-invalid for this obs_shape.
  remedy: >
    1. For the national magnitude test, area-weight several NCP province runs
       (weights above) BEFORE computing PBIAS; expect PBIAS within roughly
       +-10% (DM-direct) — far better than any single province.
    2. Pick ONE moisture convention and state it. The validated multi-site
       table is DM-direct; to use the documented /0.88 you must re-baseline
       the whole table (+~14% to each PBIAS). Do not mix (e.g. /0.88 on the sim
       while citing the DM-direct table's "good" PBIAS) — that double-counts
       and was a contributor to the prior single-province +43% overshoot.
    3. trend_match: report detrended (linear-residual) r and the sim/obs slope
       ratio; do NOT expect a point model to match the national tech trend —
       a weak/failed trend_match here is structural, not a tunable defect.
  severity: structural

- id: dt_26
  stage: output_comparison
  failure_domain: tooling
  symptom: >
    parse_monica_output.py aborts with
    "ValueError: dict contains fields not in fieldnames: 'daily'"
    (or another column name) inside write_clean_csv / csv.DictWriter.writerows
    when parsing a normal MONICA out.csv that contains more than one output
    section (e.g. a daily section plus a crop/harvest-event section).
  diagnosis: >
    write_clean_csv derived the CSV fieldnames from timeseries[0].keys() only.
    extract_timeseries adds a key to a row's dict ONLY when that row's cell is
    non-empty, so rows from different MONICA sections legitimately carry
    different key sets. Any later row whose keys are not a subset of the first
    row's keys triggers csv.DictWriter's default extrasaction='raise'. This is
    a pure writer bug — the model run itself (run_monica.py rc=0, 3667 rows)
    is fine; only the post-run clean-CSV writer crashes.
  remedy: >
    Build the fieldname list as the UNION of all rows' keys (preserving
    first-seen order) and construct the DictWriter with restval="" and
    extrasaction="ignore" so heterogeneous-section rows are written with
    blanks for absent columns instead of raising. Fixed in
    tools/parse_monica_output.py write_clean_csv. NOTE: this fix only unblocks
    the writer; parse_monica_output()'s len(vals)==len(header_names) row filter
    still keeps just the rows whose column count matches the first header line,
    so multi-section files report a low "Parsed N data rows" — that section
    filtering is a separate, pre-existing limitation, not part of this fix.
    For validated province yields use the multisite yield_for_plot.csv tables.
  severity: degraded
