- id: dt_020
  symptom: 'Runoff or carbon flux values are 86400x too high when comparing to observations. Annual runoff
    is reported as thousands of mm/yr instead of hundreds. GPP is reported as millions of gC/m²/yr.

    '
  diagnosis: ELM output flux rates (mm/s, gC/m²/s) treated as daily totals; All ELM flux outputs are in
    per-second rates. QRUNOFF is mm/s (not mm/day), GPP is gC/m²/s (not gC/m²/day). Forgetting to multiply
    by 86400 when computing daily totals, or conversely treating already per-second rates as daily, causes
    864
  remedy: Multiply per-second rates by 86400 for daily, by 86400×365 for annual; parse_elm_output.py --to_daily;
    ['QRUNOFF_mm_day = QRUNOFF_mm_s × 86400', 'GPP_gC_m2_day = GPP_gC_m2_s × 86400', 'Use --to_daily flag
    in parse_elm_output.py']; Always check output variable units with ncdump -h before analysis
  severity: silent
