  symptom:
    description: Zero yield despite correct temp/rain — IRRAD 1000x too low
    error_pattern: TWSO = 0
    detection_method: value_comparison
  diagnosis:
    root_cause: IRRAD must be J/m2/d not kJ — multiply SW by 86400 not 86.4
    explanation: ''
    affected_components: []
  resolution:
    action: IRRAD = shortwave_W_m2 * 86400
    files_changed: []
    prevention: Validate IRRAD 5e6-35e6 J/m2/d range
  severity: silent
  promoted: false
