# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: CaMa_Flood
  language: fortran
  implementation:
    id: cama-flood-v420
    version: v4.20
    provenance: Fortran 90 (OpenMP/MPI parallel); stand-alone MAIN_cmf driver of CaMa-Flood v4.20 from
      Global Hydrodynamics Lab, University of Tokyo.
  scientific_reference_version: CaMa-Flood v4.20 (local-inertial river hydrodynamics; Yamazaki et al.
    2011 floodplain parameterization + Yamazaki et al. 2013 local-inertial flow equation)
inputs:
  forcing:
  - name: lateral surface runoff
    unit: mm/day
    category: forcing
    source_kind: forcing
    model_input_format: gridded (time, lat, lon) binary or NetCDF on the source model grid; latitude must
      be North-to-South (descending)
    notes: Primary external driver. Model converts mm/day to m3/s internally using per-cell catchment
      area via the input matrix; runoff MUST NOT be pre-converted to m3/s. Interpolated to river-network
      cells by the input matrix (CMF_FORCING).
  - name: sub-surface runoff (baseflow)
    unit: mm/day
    category: forcing
    source_kind: forcing
    model_input_format: gridded (time, lat, lon), optional second runoff field
    notes: Consumed only when LROSPLIT is enabled; otherwise total runoff is treated as a single field.
      Routed to river/groundwater reservoir depending on LGDWDLY.
  - name: potential water evaporation
    unit: mm/day
    category: forcing
    source_kind: forcing
    model_input_format: gridded (time, lat, lon)
    notes: Optional open-water evaporation forcing, active only when LWEVAP is set; extracts water from
      open-water/floodplain storage.
  parameters:
  - name: PMANRIV (river channel Manning's n)
    unit: s m^-1/3
    category: parameters
    source_kind: calibrated
    model_input_format: namelist scalar (&NPARAM); spatial field rivman.bin (CRIVMAN) overrides where
      provided
    notes: Default 0.03 hardcoded in cmf_ctrl_nmlist_mod before namelist override. Primary calibration
      lever; higher n slows flow, increases peak attenuation and lag.
  - name: PMANFLD (floodplain Manning's n)
    unit: s m^-1/3
    category: parameters
    source_kind: default
    model_input_format: namelist scalar (&NPARAM)
    notes: Default 0.10, hardcoded scalar used directly in the floodplain local-inertial momentum equation;
      not spatially distributed.
  - name: river network topology (next-downstream cell)
    unit: cell index
    category: parameters
    source_kind: dataset_lookup
    model_input_format: nextxy.bin (CNEXTXY)
    notes: Upstream-downstream flow-direction map defining routing; derived from MERIT-Hydro-based map.
  - name: unit-catchment area
    unit: m2
    category: parameters
    source_kind: dataset_lookup
    model_input_format: ctmare.bin (CGRAREA)
  - name: cell elevation
    unit: m
    category: parameters
    source_kind: dataset_lookup
    model_input_format: elevtn.bin (CELEVTN)
  - name: distance to downstream cell
    unit: m
    category: parameters
    source_kind: dataset_lookup
    model_input_format: nxtdst.bin (CNXTDST)
    notes: Sets the slope length term in the local-inertial momentum equation and bounds the CFL adaptive
      time step.
  - name: river channel length
    unit: m
    category: parameters
    source_kind: dataset_lookup
    model_input_format: rivlen.bin (CRIVLEN)
  - name: sub-grid floodplain height profile
    unit: m
    category: parameters
    source_kind: dataset_lookup
    model_input_format: fldhgt.bin (CFLDHGT), discretized into NLFP elevation sub-layers
    notes: Sub-grid topographic profile used to diagnose flooded depth/area/fraction from storage (Yamazaki
      2011).
  - name: river channel width
    unit: m
    category: parameters
    source_kind: calibrated
    model_input_format: rivwth_gwdlr.bin (CRIVWTH)
    notes: Set as empirical power law of climatological mean discharge Q (W = WC*Q^WP, WC=2.50, WP=0.60,
      WMIN=5.0 m) during map preparation.
  - name: river channel bank height / depth
    unit: m
    category: parameters
    source_kind: calibrated
    model_input_format: rivhgt.bin (CRIVHGT)
    notes: Set as empirical power law of climatological mean discharge Q (H = HC*Q^HP, HC=0.10, HP=0.50,
      HMIN=1.0 m).
  - name: PCADP (CFL adaptive time-step coefficient)
    unit: dimensionless
    category: parameters
    source_kind: default
    model_input_format: namelist scalar (&NPARAM)
    notes: Default 0.7; DT_MIN = PCADP*dist/sqrt(g*depth) sets inner sub-step from minimum CFL across
      all cells.
  - name: PDSTMTH (river-mouth downstream distance)
    unit: m
    category: parameters
    source_kind: default
    model_input_format: namelist scalar (&NPARAM)
    notes: Default 10000 m; assumed downstream distance at river-mouth cells, controlling mouth slope
      and mouth-cell CFL.
  initial_conditions:
  - name: river channel storage
    unit: m3
    category: initial_conditions
    source_kind: user_provided
    model_input_format: restart file (CRESTSTO) or zero start
    notes: Carried between time steps. Empty initial storage makes first-year results unreliable; 1-2
      spin-up iterations of the first year recommended.
  - name: floodplain storage
    unit: m3
    category: initial_conditions
    source_kind: user_provided
    model_input_format: restart file (CRESTSTO) or zero start
  boundary_conditions:
  - name: downstream sea-level / ocean boundary
    unit: m
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: optional boundary time series at river-mouth cells (&NBOUND)
    notes: Sets tidal/sea-surface elevation at outlets when enabled; otherwise a default fixed sea level
      is assumed.
  - name: flow-solver selection (LADPSTP / LKINE / LSLPMIX / LFLDOUT / LPTHOUT)
    unit: switch
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: namelist logical switches (&NRUNVER)
    notes: Structural switches selecting local-inertial (default) vs kinematic-wave vs slope-mixed routing,
      enabling floodplain outflow, and enabling bifurcation pathways.
  - name: optional sub-model activation (LDAMOUT / LLEVEE / LGDWDLY / LROSPLIT / LWEVAP)
    unit: switch
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: namelist logical switches (&NRUNVER)
    notes: Enable reservoir operation, levee scheme, groundwater delay, runoff split, and open-water evaporation
      respectively; all off by default.
  - name: outer time step DT and I/O frequency
    unit: s
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: 'namelist (&NDIMTIME): DT, IFRQ_INP, IFRQ_OUT'
    notes: Default DT=86400 s; DT must be a multiple of 60 (model counts time in minutes), enforced with
      STOP 9 in CMF_CONFIG_CHECK.
outputs:
  primary:
  - name: outflw
    unit: m3/s
    description: Total main-river-network discharge (river outflow + floodplain outflow + bifurcation
      outflow); primary validation variable.
    validation_rank: 1
    emitted_in: o_outflw{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Gauge must be allocated to the correct unit-catchment on the coarse river network; mis-allocation
          produces wrong drainage area and discharge.
        - First simulated year unreliable from empty initial storage; exclude spin-up period.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-instant peak/flood-stage comparison sensitive to channel-parameter uncertainty at the
          gauge cell.
      detrending_options:
      - none
  - name: rivout
    unit: m3/s
    description: River channel outflow (in-channel discharge component).
    validation_rank: 2
    emitted_in: o_rivout{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - In overbank conditions in-channel rivout under-represents total flow; compare total outflw against
          gauge discharge instead.
      detrending_options:
      - none
  - name: rivdph
    unit: m
    description: River channel water depth.
    validation_rank: 4
    emitted_in: o_rivdph{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Depth is diagnosed from storage via channel-geometry power laws; absolute depth carries channel-depth
          parameter uncertainty.
      detrending_options:
      - none
  - name: sfcelv
    unit: m
    description: Water-surface elevation (bed elevation + river depth).
    validation_rank: 3
    emitted_in: o_sfcelv{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Comparable to satellite-altimetry / gauge stage; absolute datum depends on the DEM bed elevation.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Along-river water-surface profile comparison against altimetry virtual stations.
      detrending_options:
      - none
  - name: flddph
    unit: m
    description: Floodplain flood-water inundation depth above floodplain ground.
    validation_rank: 5
    emitted_in: o_flddph{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Sub-grid diagnostic; meaningful at native resolution only after diagnostic downscaling to fine
          grid.
      detrending_options:
      - none
  - name: fldfrc
    unit: '-'
    description: Flooded area fraction of the unit-catchment (0-1).
    validation_rank: 6
    emitted_in: o_fldfrc{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Compared to satellite-derived flood-extent maps via a wet/dry threshold; hit/false-alarm depend
          on the fraction threshold chosen.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Sub-grid fraction; downscaling needed to match high-resolution inundation observations.
      detrending_options:
      - none
  - name: fldare
    unit: m2
    description: Flooded area within the unit-catchment.
    validation_rank: 7
    emitted_in: o_fldare{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Basin-aggregated inundated-area time series vs remote-sensing flood-area products.
      detrending_options:
      - none
  - name: rivvel
    unit: m/s
    description: River flow velocity from the local-inertial equation.
    validation_rank: 8
    emitted_in: o_rivvel{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Rarely directly observed; in-situ velocity gauging sparse, mainly a diagnostic of routing behavior.
      detrending_options:
      - none
  - name: rivsto
    unit: m3
    description: River channel water storage (prognostic state diagnostic output).
    validation_rank: 9
    emitted_in: o_rivsto{YYYY}.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Total terrestrial/surface water storage comparable to GRACE-class anomalies only after basin
          aggregation and as anomaly, not absolute.
      detrending_options:
      - none
      - linear_residual
  secondary: []
known_issues:
- id: dt_001
  symptom: CaMa-Flood exits immediately with STOP 10 or a file-open failure before producing o_outflwYYYY.nc.
  diagnosis: The run namelist was built with relative paths for CDIMINFO, CNEXTXY, CGRAREA, CELEVTN, CNXTDST,
    CRIVLEN, CFLDHGT, CRIVWTH, CRIVHGT, CRIVMAN, CINPMAT, or CROFCDF. tools/run_cama.py warns on relative
    ../../ paths because the generated run script changes directory to RDIR before MAIN_cmf opens files.
  remedy: Regenerate the script with tools/configure_simulation.py or edit the generated gosh/run_{basin}_1d_nc.sh
    so every map, diminfo, inpmat, and runoff NetCDF path is absolute under KISSPATH_BINARIES/cmf_v420_pkg
    or the selected forcing directory.
  severity: fatal
- id: dt_002
  symptom: preflight_check.py reports CaMa-Flood binary not found, not executable, loader failure, or
    binary startup failure.
  diagnosis: This KI is bound to the real Fortran executable at KISSPATH_BINARIES/cmf_v420_pkg/src/MAIN_cmf.
    SKILL.md forbids substituting a Python routing approximation, and preflight_check.py treats the binary
    and startup probe as critical.
  remedy: Restore or rebuild KISSPATH_BINARIES/cmf_v420_pkg/src/MAIN_cmf, make it executable
    with chmod +x, then rerun python preflight_check.py before any setup or calibration run.
  severity: fatal
- id: dt_003
  symptom: MAIN_cmf cannot read the forcing variable or the run stops after opening CROFCDF, even though
    the NetCDF file exists.
  diagnosis: CaMa-Flood is configured with CVNROF = 'Runoff'. docs/format_spec.yaml and SKILL.md require
    the forcing variable to be capitalized exactly as Runoff, while generic source files often use runoff,
    rof, total_runoff, or Q.
  remedy: Create CaMa-ready yearly files with tools/prepare_runoff_input.py so the NetCDF contains variable
    Runoff with dimensions time, lat, lon, or rerun the generic converter with --netcdf_var set to the
    source variable and inspect the output.
  severity: fatal
- id: dt_004
  symptom: The run completes but o_outflwYYYY.nc contains implausibly huge discharge, commonly above 1000000
    m3/s for a basin that should be far smaller.
  diagnosis: CaMa-Flood expects gridded runoff in mm/day and converts it internally to volumetric flow
    using catchment area from ctmare.bin. Feeding m3/s into Runoff applies the area conversion again and
    inflates discharge by orders of magnitude.
  remedy: Regenerate the forcing with tools/prepare_runoff_input.py and keep Runoff.units as mm/day. Do
    not convert VIC OUT_RUNOFF plus OUT_BASEFLOW to m3/s before CaMa. Recheck the maximum Runoff value
    before rerunning MAIN_cmf.
  severity: silent
- id: dt_005
  symptom: The run completes but discharge is near zero and the input NetCDF Runoff maximum is below 0.01
    while the source file is a flux rate.
  diagnosis: tools/prepare_runoff_input.py --source netcdf multiplies the selected variable by --scale_factor
    only. A source runoff rate in m/s must be converted to mm/day with 86400*1000 before CaMa reads it
    as Runoff.
  remedy: Rerun the generic converter with --scale_factor 86400000 for m/s input, verify Runoff.units
    is mm/day and values are in a plausible daily depth range, then rerun tools/configure_simulation.py
    only if the grid extent changed.
  severity: silent
- id: dt_006
  symptom: The hydrograph volume is biased low or high by a fixed factor such as 24, while timing and
    spatial pattern still look reasonable.
  diagnosis: SKILL.md sets IFRQ_INP = 24 and requires daily Runoff in mm/day. The VIC path in tools/prepare_runoff_input.py
    assumes daily OUT_RUNOFF plus OUT_BASEFLOW rows for each date, while only the wflow path contains
    explicit sub-daily resampling logic.
  remedy: Aggregate sub-daily source runoff to daily depth before calling the VIC or generic converter,
    or use the wflow converter path when the wflow output has sub-daily time coordinates so the tool resamples
    with a daily sum.
  severity: silent
- id: dt_007
  symptom: CaMa-Flood runs to completion but outflw is near zero or spatially displaced despite nonzero
    Runoff in the input NetCDF.
  diagnosis: The input matrix generated by configure_simulation.py uses OLAT = 'NtoS'. If the Runoff NetCDF
    latitude coordinate is ascending south-to-north, generate_inpmat maps CaMa cells to the wrong source
    cells.
  remedy: Regenerate the forcing with tools/prepare_runoff_input.py, which writes descending latitudes,
    or regenerate inpmat with the correct OLAT for the actual source grid. Confirm the first lat value
    is larger than the last before running MAIN_cmf.
  severity: silent
- id: dt_008
  symptom: The model finishes but discharge is near zero over most river cells even though the runoff
    NetCDF has realistic nonzero daily values.
  diagnosis: generate_inpmat needs WESTIN, EASTIN, NORTHIN, and SOUTHIN from the source runoff grid, not
    from the buffered CaMa regional domain. configure_simulation.py separates read_grid_nc source extents
    from compute_domain map extents for this reason.
  remedy: Rerun tools/configure_simulation.py with --grid_nc pointing to the VIC basin_grid.nc, or pass
    --west --east --south --north as source grid cell-edge coordinates. Rebuild diminfo_{basin}_025deg.txt
    and inpmat_{basin}_025deg.bin.
  severity: silent
- id: dt_009
  symptom: Total discharge is too low and many mapped runoff cells are exactly zero around the basin edge
    even during wet periods.
  diagnosis: The runoff conversion created a rectangular grid larger than the actual VIC or source model
    domain. If those padded zeros are included in the source grid described by diminfo and inpmat, CaMa
    receives zero lateral runoff for cells that should map to active source cells.
  remedy: Regenerate the Runoff NetCDF from actual source coordinates only. For VIC, use tools/prepare_runoff_input.py
    so coordinates come from the flux filenames. Then rebuild the input matrix against that exact grid.
  severity: degraded
- id: dt_010
  symptom: Hydrographs are inflated or double-routed after using wflow output, while the NetCDF appears
    structurally valid.
  diagnosis: tools/prepare_runoff_input.py documents that wflow_sbm should supply lateral subsurface flow
    plus overland flow or total_runoff, not the already routed Q variable. Routed discharge is not a lateral
    runoff depth and should not be fed to CaMa as Runoff.
  remedy: Rerun the wflow conversion using total_runoff, or sum lateral subsurface and overland flow variables.
    Do not select routed Q as --netcdf_var for generic conversion unless it has first been converted back
    to a gridded lateral runoff depth, which is normally not appropriate.
  severity: silent
- id: dt_cama_012
  symptom: The run completes, but rivhgt.bin is uniformly 1.0 m and/or rivwth.bin uniformly 2.0 m across
    the whole basin; flood extent is over-predicted and calibration needs an implausible PMANRIV (e.g.
    0.30 vs the natural 0.03) to match observed discharge.
  diagnosis: calc_outclm correctly runs on the GLOBAL grid, but its output is a global-sized array (e.g.
    1440x720). calc_rivwth reads outclm.bin from the REGIONAL directory with fixed-recl direct access
    sized nx*ny of the REGIONAL domain, so a raw copy hands it an arbitrary byte slice of the global file.
    Width a
  remedy: 'CLIP the global array to the regional window using the two diminfo files, and write it in FORTRAN
    order: calc_rivwth declares rivout(nx,ny) with index = ix + iy*nx, while numpy''s tofile() always
    writes C order - a C-order write puts correct values on the WRONG cells (verified: spearman(rivwth,
    upare'
  severity: fatal
- id: dt_011
  symptom: Channel-parameter setup fails, calc_outclm produces no outclm.bin, or outclm.bin is zero-filled
    before calc_rivwth.
  diagnosis: calc_outclm must run from KISSPATH_BINARIES/cmf_v420_pkg/map/glb_15min because
    it accumulates GPCC climatological runoff through the full global river network. Running it inside
    map/{basin}_15min truncates upstream pathways.
  remedy: Use tools/configure_simulation.py step3_channel_params, which runs ./src_param/calc_outclm from
    glb_15min using ELSE_GPCC_coastmod_dayclm-1981-2010.one, then CLIPS outclm.bin to the regional domain
    (NOT a raw copy - see dt_cama_012).
  severity: fatal
- id: dt_012
  symptom: The simulation runs but river widths, bank heights, depths, or flood timing are physically
    wrong; rivwth.bin size does not match the regional grid.
  diagnosis: calc_rivwth reads diminfo to allocate its output arrays. If glb_15min diminfo is used instead
    of map/{basin}_15min/diminfo_{basin}_025deg.txt, the regional run later interprets a global-sized
    binary as a regional map.
  remedy: Rerun calc_rivwth from the regional map directory with the regional diminfo file, copy rivwth.bin
    to rivwth_gwdlr.bin, recreate rivman.bin if needed, and verify rivwth.bin size equals nXX*nYY*4 bytes.
  severity: silent
- id: dt_013
  symptom: Outputs look plausible but discharge peaks at the wrong locations or the river network does
    not align with the requested basin.
  diagnosis: CaMa map files encode basin-specific nextxy, ctmare, elevtn, nxtdst, rivlen, fldhgt, rivwth_gwdlr,
    rivhgt, rivman, diminfo, and inpmat. Reusing map/{old_basin}_15min in a new run routes water through
    the wrong river network without necessarily crashing.
  remedy: Run tools/configure_simulation.py for the new basin name and source grid, let it create map/{new_basin}_15min,
    and ensure the generated script MAPDIR and all NMAP paths point to that directory.
  severity: silent
- id: dt_014
  symptom: MAIN_cmf or generate_inpmat stops with a Fortran read error while parsing diminfo_{basin}_025deg.txt.
  diagnosis: CaMa expects diminfo_{basin}_025deg.txt in the fixed 11-line structure produced by generate_inpmat.
    Hand edits, missing lines, swapped north and south edges, or hidden characters can make the Fortran
    reader fail or silently describe the wrong grid.
  remedy: Regenerate diminfo and inpmat with tools/configure_simulation.py instead of hand-editing. If
    auditing manually, verify 11 lines, integer grid sizes on lines 1-6, inpmat filename on line 7, and
    west, east, north, south source grid edges on lines 8-11.
  severity: fatal
- id: dt_015
  symptom: Downscaling or CaMa-to-SFINCS coupling fails with a missing 1min/location.txt or missing files
    under map/{basin}_15min/1min.
  diagnosis: CaMa routing can run on the 15-minute regional map, but downstream downscaling needs the
    high-resolution subgrid produced by the combine_hires loop in tools/configure_simulation.py step1_regionalize.
  remedy: Rerun the regionalization step without --skip_step1, or run combine_hires from map/{basin}_15min/src_region
    after confirming region_info.txt is correct. Verify map/{basin}_15min/1min contains the expected high-resolution
    files.
  severity: fatal
- id: dt_016
  symptom: Validation metrics are poor mainly in the first simulated year, then improve after storage
    has spun up.
  diagnosis: dag.yaml, docs/format_spec.yaml, and SKILL.md state that river and floodplain storage are
    prognostic states and empty initial storage makes first-year results unreliable. configure_simulation.py
    writes restart logic with nspinup, and calibration.yaml excludes 1968-1969 for the Jinghong case.
  remedy: Run one or two spin-up iterations with tools/configure_simulation.py --nspinup 2 or exclude
    the first simulated year from parse_cama_output.py and validation scoring. Confirm restartYYYY010100.nc
    files are present before scoring later years.
  severity: silent
- id: dt_017
  symptom: Extracted point discharge has wrong magnitude or phase even though basin-wide spatial output
    looks reasonable.
  diagnosis: tools/parse_cama_output.py uses nearest latitude and longitude only and warns when the nearest
    grid cell is more than 30 km away. The calibration runner uses drainage-area matching for Jinghong
    because dag.yaml caveats note that gauge allocation to the correct unit-catchment is critical.
  remedy: For formal discharge validation, allocate the gauge to the CaMa cell whose upstream area best
    matches the published gauge drainage area within a local search window, or use tools/calib_run.py
    behavior as the reference for the Jinghong target.
  severity: silent
- id: dt_018
  symptom: Changing PMANRIV in input_cmf.nam produces little or no change in main-channel discharge during
    calibration.
  diagnosis: calibration.yaml and tools/calib_run.py document that the v4.20 main-channel routing consumes
    D2RIVMAN read from rivman.bin, while PMANRIV is kept only for parity. Editing only the namelist does
    not inject river Manning into the binary map actually used by the solver.
  remedy: Inject river Manning by rewriting rivman.bin on valid cells, or run tools/calib_run.py with
    KDT_CALIB_PARAMS so the candidate map is built, rivman.bin is rewritten, and the read-back check verifies
    the applied value.
  severity: silent
- id: dt_019
  symptom: tools/calib_run.py exits with a message refusing KDT_CAMA_OBS, KDT_CAMA_LAT, KDT_CAMA_LON,
    KDT_CAMA_AREA_KM2, KDT_CAMA_MAPDIR, or related environment overrides.
  diagnosis: The KI calibration case is hard-pinned to SITE:jinghong, station 90243100, with fixed map,
    forcing, observation path, gauge coordinates, and drainage area. Redirecting those environment variables
    would score a different model case while declaring the Jinghong case.
  remedy: Unset the forbidden KDT_CAMA_* environment variables and pass only KDT_CALIB_PARAMS plus optional
    KDT_CALIB_SPLIT. To calibrate a different site, create a new pinned case instead of overriding this
    runner.
  severity: fatal
- id: dt_020
  symptom: Discharge validation fails or compares against missing data because rivout, rivdph, flddph,
    or sfcelv was used where observed streamflow Q is expected.
  diagnosis: docs/format_spec.yaml ranks outflw as the primary discharge validation variable in m3/s.
    rivout is only the in-channel component, rivdph and flddph are depths in m, and sfcelv is water-surface
    elevation with datum caveats.
  remedy: Use tools/parse_cama_output.py --variable outflw for streamflow gauges and compare with observed
    Q in m3/s. Use sfcelv only for stage or altimetry validation and account for the DEM datum caveat
    in docs/validation_convention.yaml.
  severity: silent
- id: dt_021
  symptom: Calibration candidates run to completion but runoff_scale changes produce discharge shifts
    of about 86400000x or almost no hydrologic response.
  diagnosis: tools/calib_run.py injects runoff scaling through the Fortran namelist field DROFUNIT, using
    DROFUNIT_BASE = 86400.0 * 1000.0 because the CaMa forcing reader converts Runoff from mm/day to m3/m2/s
    by dividing by DROFUNIT. Manually setting DROFUNIT to 1.0 for CaMa-ready Runoff in mm/day bypasses
    that
  remedy: Let tools/calib_run.py write the calibration run script from KDT_CALIB_PARAMS, or set DROFUNIT
    to 86400000 divided by the intended runoff_scale when Runoff.units is mm/day. Inspect the generated
    input_cmf.nam and confirm the written DROFUNIT before scoring.
  severity: silent
- id: dt_cama_001
  symptom: CaMa-Flood exits immediately with STOP 10 or a file-open failure before producing o_outflwYYYY.nc.
  diagnosis: The generated run script changes into RDIR before MAIN_cmf opens the Fortran namelist, so
    relative map, diminfo, inpmat, or forcing paths are resolved from the output directory. SKILL.md lists
    CDIMINFO, CNEXTXY, CGRAREA, CELEVTN, CNXTDST, CRIVLEN, CFLDHGT, CRIVWTH, CRIVHGT, CRIVMAN, CINPMAT,
    and CRO
  remedy: Regenerate the script with tools/configure_simulation.py, which writes absolute paths under
    KISSPATH_BINARIES/cmf_v420_pkg and the selected runoff directory, or edit gosh/run_{basin}_1d_nc.sh
    so every namelist file path is absolute before rerunning tools/run_cama.py.
  severity: fatal
- id: dt_cama_002
  symptom: CaMa-Flood runs without error but outflw is near zero over most cells despite realistic nonzero
    Runoff in the yearly NetCDF input.
  diagnosis: generate_inpmat needs WESTIN, EASTIN, NORTHIN, and SOUTHIN from the source runoff grid, not
    from the buffered CaMa regional map domain. tools/configure_simulation.py intentionally separates
    read_grid_nc source-grid extents from compute_domain map extents before calling step2_generate_inpmat.
  remedy: Rerun tools/configure_simulation.py with --grid_nc pointing to the source basin_grid.nc, or
    pass --west --east --south --north as source grid cell-edge coordinates. Rebuild diminfo_{basin}_025deg.txt
    and inpmat_{basin}_025deg.bin, then rerun the CaMa script.
  severity: silent
- id: dt_cama_003
  symptom: CaMa-Flood completes, but river channel widths or bank heights are physically wrong and flood
    timing or water depth is implausible.
  diagnosis: calc_rivwth allocates binary output from the diminfo file it is given. If it is run with
    glb_15min diminfo instead of map/{basin}_15min/diminfo_{basin}_025deg.txt, the regional run can later
    interpret a global-sized or wrong-shaped rivwth.bin and rivhgt.bin as regional channel geometry.
  remedy: Run calc_rivwth from the regional map directory with the regional diminfo file, copy rivwth.bin
    to rivwth_gwdlr.bin, recreate rivman.bin, and verify the binary size equals nXX*nYY*4 bytes for the
    regional grid.
  severity: silent
- id: dt_cama_004
  symptom: Channel-parameter setup fails, calc_outclm produces no outclm.bin, or the copied outclm.bin
    is zero-filled.
  diagnosis: calc_outclm must run from KISSPATH_BINARIES/cmf_v420_pkg/map/glb_15min because
    it routes the GPCC climatological runoff through the full global river network. Running it from a
    regional map truncates upstream pathways and corrupts the climatological discharge used by calc_rivwth.
  remedy: Use tools/configure_simulation.py step3_channel_params so ./src_param/calc_outclm runs in glb_15min
    against ELSE_GPCC_coastmod_dayclm-1981-2010.one, then copies outclm.bin into the regional map before
    calc_rivwth.
  severity: fatal
- id: dt_cama_005
  symptom: The simulation produces plausible-looking output, but discharge peaks at the wrong locations
    or the river network does not align with the requested basin.
  diagnosis: 'CaMa map directories contain basin-specific nextxy.bin, ctmare.bin, elevtn.bin, nxtdst.bin,
    rivlen.bin, fldhgt.bin, rivwth_gwdlr.bin, rivhgt.bin, rivman.bin, diminfo, and inpmat files. Pointing
    a new run script at map/{old_basin}_15min routes water through the old basin topology without necessarily '
  remedy: Run tools/configure_simulation.py for the new basin name and source grid so it creates map/{new_basin}_15min,
    then confirm MAPDIR and all NMAP paths in gosh/run_{basin}_1d_nc.sh point to that new directory.
  severity: silent
- id: dt_cama_006
  symptom: CaMa receives a structurally valid Runoff file, but many mapped cells have exactly zero lateral
    runoff and basin discharge is too low.
  diagnosis: The forcing grid was padded to a rectangle larger than the actual source model grid, so zero-valued
    cells around the source domain are included in diminfo and inpmat. tools/prepare_runoff_input.py convert_vic
    avoids this by deriving coordinates from the VIC flux filenames and writing only those lat/
  remedy: Regenerate the CaMa-ready Runoff NetCDF from actual source coordinates only, verify the zero-cell
    fraction, then rebuild the input matrix against that exact grid with tools/configure_simulation.py.
  severity: degraded
- id: dt_cama_007
  symptom: CaMa-Flood runs to completion but outflw is near zero or spatially displaced even though the
    input NetCDF contains nonzero Runoff.
  diagnosis: tools/configure_simulation.py writes OLAT = 'NtoS' for generate_inpmat, and SKILL.md requires
    runoff latitude to be North-to-South. If the NetCDF latitude coordinate is ascending south-to-north,
    the input matrix maps CaMa cells to the wrong source cells.
  remedy: Regenerate forcing with tools/prepare_runoff_input.py, which flips or writes descending latitudes,
    or rebuild inpmat with OLAT matching the actual source-grid order. Confirm the first latitude is greater
    than the last before execution.
  severity: silent
- id: dt_cama_008
  symptom: A setup run completes, but rivwth.bin size does not match the regional grid and resulting widths
    or depths are wrong.
  diagnosis: SKILL.md records a known setup_cama_basin.py failure mode where calc_rivwth is run with glb_15min
    diminfo after calc_outclm, rather than with the regional diminfo. The current KI tool avoids this
    in tools/configure_simulation.py step3_channel_params by checking map/{basin}_15min/diminfo_{basin}_025d
  remedy: Prefer tools/configure_simulation.py for Step 3. If an older setup script was used, manually
    rerun ./src_param/calc_rivwth from map/{basin}_15min with ./diminfo_{basin}_025deg.txt, copy rivwth.bin
    to rivwth_gwdlr.bin, and verify file sizes.
  severity: degraded
- id: dt_cama_009
  symptom: CaMa-Flood completes but o_outflwYYYY.nc contains discharge that is orders of magnitude too
    high, such as millions of m3/s for a basin where that is physically impossible.
  diagnosis: CaMa-Flood expects gridded Runoff in mm/day and converts it internally to volumetric flow
    using ctmare.bin and the forcing-unit conversion. Pre-converting VIC OUT_RUNOFF plus OUT_BASEFLOW,
    wflow runoff, or generic runoff to m3/s applies the area conversion twice.
  remedy: Regenerate yearly forcing with tools/prepare_runoff_input.py and keep Runoff.units as mm/day.
    For generic NetCDF input, use --scale_factor only to convert the source values into mm/day, not m3/s,
    then rerun tools/run_cama.py.
  severity: silent
- id: dt_cama_010
  symptom: MAIN_cmf or generate_inpmat stops with a Fortran read error while parsing diminfo_{basin}_025deg.txt.
  diagnosis: CaMa expects the fixed 11-line diminfo structure produced by generate_inpmat. Hand edits,
    missing lines, hidden characters, or swapped north and south source-grid edges can make the Fortran
    reader fail or silently describe the wrong grid.
  remedy: Regenerate diminfo and inpmat with tools/configure_simulation.py. If auditing manually, verify
    11 lines, integer grid sizes on lines 1-6, the inpmat filename on line 7, and west, east, north, and
    south source-grid edges on lines 8-11.
  severity: fatal
- id: dt_cama_011
  symptom: Downscaling or CaMa-to-SFINCS coupling fails because map/{basin}_15min/1min/location.txt or
    other 1min files are missing.
  diagnosis: The 15-minute CaMa routing files can exist without the high-resolution subgrid, but downstream
    downscaling needs the 1min data produced by the combine_hires loop in tools/configure_simulation.py
    step1_regionalize.
  remedy: Rerun regionalization without --skip_step1, or run combine_hires from map/{basin}_15min/src_region
    after confirming region_info.txt is correct. Verify map/{basin}_15min/1min/location.txt exists before
    invoking downscaling or SFINCS coupling.
  severity: fatal
- id: dt_cama_013
  symptom: Stage 2 creates channel-geometry files, but rivwth.bin, rivwth_gwdlr.bin, or rivhgt.bin has
    a byte size inconsistent with diminfo_{basin}_025deg.txt, leading to implausible flood timing, water
    depth, or discharge attenuation.
  diagnosis: tools/configure_simulation.py step3_channel_params must run ./src_param/calc_rivwth from
    map/{basin}_15min with the regional diminfo file after CLIPPING outclm.bin from glb_15min to the regional
    window (never copying it - dt_cama_012). If a global or stale diminfo is used, the Fortran setup tool
    wri
  remedy: Regenerate Stage 2 with tools/configure_simulation.py, or manually rerun ./src_param/calc_rivwth
    from the regional map directory using ./diminfo_{basin}_025deg.txt (with a CLIPPED regional outclm.bin,
    dt_cama_012), then copy rivwth.bin to rivwth_gwdlr.bin and verify each single-layer float32 geometr
  severity: degraded
- id: dt_cama_014
  symptom: 'A KI tool that reads NetCDF (tools/prepare_runoff_input.py --source netcdf/wflow, tools/parse_cama_output.py,
    tools/configure_simulation.py --grid_nc) dies with OSError: [Errno -101] NetCDF: HDF error: ''<path>''
    -- on a file that ncdump reads fine, including CaMa''s own shipped forcing and CaMa''s own '
  diagnosis: In KISSPATH_PYTHON_ENV (netCDF4 1.7.4 / HDF5 1.14.6 / libnetcdf 4.9.3
    / xarray 2025.11.0) xarray's DEFAULT 'netcdf4' backend fails to open every NETCDF4/HDF5 file, while
    netCDF4.Dataset(path) opens the same file successfully and engine='h5netcdf' works. The file is NOT
    corrupt an
  remedy: 'Open NetCDF through the tools'' open_nc() helper, which tries the default engine then falls
    back to h5netcdf, netcdf4 and scipy in turn (tools/parse_cama_output.py open_nc, tools/prepare_runoff_input.py
    open_nc). Any NEW code in this KI must use it too. preflight_check.py check_netcdf_read now OPENS '
  severity: fatal
- id: dt_cama_015
  symptom: CSI against a satellite flood-extent product (GFD v1.4, gfd_v1_4_global) is implausibly low
    (< 0.1) with a huge false-alarm count concentrated along river channels and lakes, or POD is near
    1.0 with FAR near 1.0.
  diagnosis: 'Two independent causes. (1) PERMANENT WATER: GFD''s band 1 ''flooded'' EXCLUDES JRC permanent
    water, while etc/downscale_flddph/src/downscale_flddph_trib deliberately forces every pixel flagged
    in <res>.rivwth.bin up to flood(ix,iy)=max(0.1, flood) -- so the entire river network and every lake
    scores a'
  remedy: Downscale first with tools/downscale/run_downscale.sh (needs --output_format binary), then threshold
    the downscaled depth STRICTLY ABOVE 0.1 m, and drop pixels/cells that GFD marks as permanent water
    (tools/gfd_flood_obs.py excludes them by default). Also drop cells whose GFD valid-pixel fraction
    is
  severity: silent
- id: dt_cama_016
  symptom: Downscaling silently does nothing, or exits with 'Map目录不存在' / 'no such file or directory' naming
    a /Volumes/... path that does not exist on this Linux server.
  diagnosis: 'tools/downscale/{main_downscale.sh,run_downscale.sh,visualize_flddph.sh} were symlinks into
    KISSPATH_ROOT/Hydrocraft/skills/cama-downscale/, whose scripts hard-code BASE=/Volumes/Expansion2t/hydro-model-workspace
    (a macOS laptop) and an output-directory pattern out/{basin}_{year}_bin '
  remedy: Use tools/downscale/run_downscale.sh, which is now a REAL file in this KI taking explicit --map_dir/--out_dir/--syear/--smon/--eyear/--emon
    [--res --west --east --south --north --dest --jobs] and wrapping the official etc/downscale_flddph/src/downscale_flddph_trib.
    main_downscale.sh and visualize_fl
  severity: fatal
