package:
  name: SFINCS
  language: fortran
  implementation:
    id: sfincs-v232
    version: v2.3.2 (mt_Faber lineage)
    provenance: Fortran reduced-physics flood solver shipped by Deltares; realizes the SFINCS local-inertial/SSWE
      spec (Leijnse et al. 2021) with subgrid per van Ormondt et al. 2025.
  scientific_reference_version: SFINCS reduced-physics solver (Leijnse et al. 2021; local-inertial / SSWE),
    subgrid per van Ormondt et al. 2025
  binary:
    path: KISSPATH_BINARIES/sfincs/bin/sfincs
    type: ELF
pipeline:
  stages:
  - s1_domain_skill
  - s2_topobathy_skill
  - s3_roughness_skill
  - s4_forcing_skill
  - s5_structures_skill
  - s6_config_skill
  - s7_execution_skill
  - s8_postprocess_skill
tools:
  count: 13
  files:
  - tools/calib_run.py
  - tools/s1_domain/setup_sfincs_domain.py
  - tools/s2_topobathy/build_sfincs_topobathy.py
  - tools/s3_roughness/build_sfincs_roughness.py
  - tools/s4_forcing/cama_to_sfincs_boundary.py
  - tools/s4_forcing/hydat_to_sfincs_boundary.py
  - tools/s4_forcing/prepare_sfincs_rainfall.py
  - tools/s4_forcing/register_vertical_datum.py
  - tools/s6_config/generate_sfincs_inp.py
  - tools/s7_execution/run_sfincs.py
  - tools/s8_postprocess/extract_sfincs_results.py
  - tools/s8_postprocess/plot_sfincs_flood_map.py
  - tools/s9_validation/screen_obs_independence.py
inputs:
  forcing:
  - name: precipitation
    unit: mm/hr
  - name: river discharge boundary
    unit: m3/s
  - name: water level boundary
    unit: m
  - name: wind speed and direction
    unit: m/s, degrees
  - name: atmospheric pressure
    unit: Pa
  parameters:
  - name: bed level (topography/bathymetry)
    unit: m (vertical datum must match boundary conditions)
  - name: active cell mask
    unit: category code
  - name: active-cell index map
    unit: cell indices
  - name: Manning's n roughness
    unit: s/m^(1/3) (dimensionless n, ~0.015-0.20)
  - name: subgrid tables
    unit: derived (volume-depth, conveyance, roughness)
  - name: infiltration parameters
    unit: mm/hr (qinf); method-specific (CN, Green-Ampt, Horton)
  - name: grid definition
    unit: m / EPSG
  initial_conditions:
  - name: initial water level
    unit: m
  - name: restart state
    unit: mixed
  boundary_conditions:
  - name: momentum advection toggle
    unit: 0/1
  - name: minimum flow depth threshold (huthresh)
    unit: m
  - name: momentum time-integration / smoothing weight (theta)
    unit: dimensionless
  - name: simulation time window
    unit: s / datetime
  - name: computational timestep control
    unit: s / dimensionless
  - name: output format and intervals
    unit: s
  - name: hydraulic structures
    unit: geometry / m
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - hmax
  - zsmax
  - zs
  - point_zs / point_h
  - flood extent (derived from hmax > threshold)
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.974, KGE=0.870, R=0.997, 5 scorecard(s)'
  metrics:
    best_nse: 0.9744294728702535
    best_kge: 0.8701747092619265
    best_r: 0.9968596968570795
summary:
  total_tools: 13
  total_stage_docs: 8
  total_diagnostic_triplets: 44
  generated: '2026-08-15'
