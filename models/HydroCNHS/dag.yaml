safety:
  hazards:
    - id: "precip_unit_cm_per_day_silent"
      kind: "weather_file_semantic"
      description: "Precipitation must be cm/day; mm/day, m/day, or kg/m2/s input runs silently with 10x to >100x discharge error."
      severity: "silent"
      triplet_refs:
        - "dt_001"
        - "dt_002"
    - id: "temperature_kelvin_mutes_pet"
      kind: "weather_file_semantic"
      description: "Temperature in Kelvin instead of degC saturates Hamon exp(temp/16), muting the PET seasonal cycle."
      severity: "silent"
      triplet_refs:
        - "dt_003"
    - id: "pet_unit_cm_per_day_silent"
      kind: "weather_file_semantic"
      description: "User-supplied PET in mm/day instead of cm/day makes evapotranspiration 10x too high and discharge too low."
      severity: "silent"
      triplet_refs:
        - "dt_004"
    - id: "area_unit_hectares_silent"
      kind: "soil_semantic"
      description: "Subbasin area must be hectares; km2 input gives exactly 100x-too-low discharge, m2 input ~10000x too high (depth-to-discharge uses ha)."
      severity: "silent"
      triplet_refs:
        - "dt_005"
        - "dt_006"
    - id: "flowlength_unit_meters_silent"
      kind: "soil_semantic"
      description: "FlowLength must be meters; km input makes Lohmann routing ~1000x too fast with no hydrograph attenuation."
      severity: "silent"
      triplet_refs:
        - "dt_007"
    - id: "Ur_unit_cm_suppresses_runoff"
      kind: "coefficient_runtime_silent_fallback"
      description: "GWLF Ur in mm instead of cm makes the soil zone appear 10x too large; it never saturates and runoff is suppressed."
      severity: "silent"
      triplet_refs:
        - "dt_009"
    - id: "Df_unit_cm_per_degC"
      kind: "coefficient_runtime_silent_fallback"
      description: "Snowmelt Df in mm/degC instead of cm/degC melts snow 10x too fast, exaggerating the spring freshet."
      severity: "degraded"
      triplet_refs:
        - "dt_010"
    - id: "Velo_unit_m_per_s"
      kind: "coefficient_runtime_silent_fallback"
      description: "Routing Velo in km/h instead of m/s makes the wave travel too fast and the downstream peak arrive too early."
      severity: "silent"
      triplet_refs:
        - "dt_011"
    - id: "gscale_clamp_silent_override"
      kind: "coefficient_runtime_silent_fallback"
      description: "GScale is silently clamped to >=0.0001 to avoid divide-by-zero in gamma.cdf, altering the user/calibrated value near the lower bound."
      severity: "silent"
    - id: "sentinel_minus99_nan"
      kind: "coefficient_runtime_silent_fallback"
      description: "Parameters left at the -99 calibration sentinel produce negative soil moisture, NaN in exponentials, or zero runoff."
      severity: "fatal_or_silent"
      triplet_refs:
        - "dt_014"
    - id: "datalength_mismatch_indexerror"
      kind: "control_semantic"
      description: "DataLength not equal to (EndDate-StartDate).days+1 mis-sizes pre-allocated arrays, causing a fatal IndexError or silent truncation."
      severity: "fatal_or_silent"
      triplet_refs:
        - "dt_013"
    - id: "date_format_slashes_required"
      kind: "control_semantic"
      description: "Dates must be YYYY/M/D with slashes; hyphenated dates silently misparse the simulation period."
      severity: "silent"
      triplet_refs:
        - "dt_008"
    - id: "abm_priority_order_balance"
      kind: "control_semantic"
      description: "ABM agent priorities must be unique and correctly ordered (lower runs first); a diversion running before an upstream dam release silently violates the water balance."
      severity: "silent"
      triplet_refs:
        - "dt_016"
    - id: "warmup_in_metrics"
      kind: "initial_condition_semantic"
      description: "Including the warm-up window in metric calculation lets arbitrary initial S0/U0/SnowS depress NSE/KGE."
      severity: "degraded"
      triplet_refs:
        - "dt_017"
    - id: "date_index_misalignment"
      kind: "parser_semantic"
      description: "Comparing simulated and observed flow by array position rather than DatetimeIndex intersection destroys correlation for flashy basins (a 1-day offset is enough)."
      severity: "silent"
      triplet_refs:
        - "dt_018"
  validation_limits:
    - "Daily time step cannot resolve sub-daily flood/flow dynamics."
    - "Subbasin (lumped within unit) base resolution; no native grid-based fully distributed hydrology."
    - "Human/agent behavior is not built in — regulated systems require user-coded ABM modules, so an un-coded reservoir/diversion is simply absent from the simulated flow."
    - "Defining too many routing outlets increases complexity and typically degrades performance."
  warnings:
    - "GShape/GScale (within-subbasin UH) interact with Velo/Diff (between-subbasin routing); calibrate jointly to avoid equifinality."
    - "When assigned_Q or InstreamControl is active, the in-grid unit hydrograph collapses to a single impulse (no within-subbasin lag) automatically — an observed-Q assumption baked into routing."
    - "GWLF growing-season CN antecedent-moisture branch depends on a monthly-mean temperature resample, so runoff depends on monthly-aggregated temperature, not only daily temperature."
    - "Chunked/continuous runs require passing the per-subbasin continuation state (St,Ut,SnowSt,BFt,AnteMois for GWLF; XU,XL,SnowSt for ABCD); re-running a segment without it resets soil/snow memory."
    - "Runs are not reproducible unless an explicit rn_gen is supplied; otherwise a random seed in [0,100000) is drawn."
    - "Sediment mode requires manually supplied dam-agent monthly TSS; the model does not compute it internally."
  assumptions:
    - statement: "The base hydrologic unit is the subbasin, modeled with a lumped rainfall-runoff scheme (GWLF or ABCD); appropriate where grid-level distributed detail is not required."
      scope: "spatial discretization"
      source: "HydroCNHS docs (3_101_classroom.rst, semi-distributed subbasin design)"
      status: "adopted"
    - statement: "Mass-balance closure applies to water through the node-link routing system; there is no surface energy-balance closure (PET is Hamon temperature-driven, a demand-side flux)."
      scope: "conservation / closure"
      source: "pet_hamon module behavior + HydroCNHS docs"
      status: "adopted"
    - statement: "A reservoir (Dam API) is treated as an in-stream object that completely redefines downstream flow and acts as a pseudo routing outlet; its upstream node must be a routing outlet."
      scope: "ABM Dam coupling geometry"
      source: "HydroCNHS docs (node-link routing rules, Table 1)"
      status: "adopted"
    - statement: "RiverDiv return flows with no explicit return location re-enter within-subbasin routing at the receiving outlet; InSitu acts on a single outlet before any routing."
      scope: "ABM RiverDiv/InSitu coupling"
      source: "HydroCNHS docs (Design a water system with the supporting APIs)"
      status: "adopted"
    - statement: "Internal area unit is hectares and precipitation unit is cm/day, fixed by the runoff-to-discharge conversion (0.01*Area*10000/86400)."
      scope: "input unit conventions"
      source: "gwlf.py / abcd.py cms-conversion in HydroCNHS source"
      status: "adopted"
    - statement: "Alpha and Res both govern shallow-groundwater discharge in GWLF; the KI/docs labels overlap (Alpha as baseflow rate, Res as recession), treated as a documentation ambiguity, not two independent mechanisms."
      scope: "GWLF baseflow parameterization"
      source: "HydroCNHS GWLF parameter table and gwlf.py groundwater discharge Gt=Res*St"
      status: "tentative"
