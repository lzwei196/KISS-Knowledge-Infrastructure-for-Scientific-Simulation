template_version: "3.5"

identity:
  model_id: "QUINCY"
  scientific_reference_version: "QUINCY v1.0 (Thum et al. 2019, GMD 12:4781) lineage; public release qs-2026.04-public (MPI-BGC, BSD-3-Clause, DOI 10.17871/quincy-model-2019)"
  implementation:
    id: "quincy-standalone-qs.bin"
    version: "qs-2026.04-public, commit 2851ba3120a268fbdf7947537c12c071493b1735, gfortran 13.3 build, ASCII text output"
    provenance: "Upstream MPI-BGC Fortran QUINCY standalone, cloned from https://git.bgc-jena.mpg.de/quincy-model/qs-open-access and built with ./compile_quincy.sh gs; binary KISSPATH_HOME/engine_builds_20261006/QUINCY/src/x86_64-gfortran/bin/qs.bin. The older Python stand-in (tools/run_quincy.py) is a SURROGATE and is not described by this dag; its own contract is docs/surrogate/surrogate_quincy_analytic_dag.yaml (the dag.yaml of this KI until 2026-10-07)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "BSD-3-Clause (QUINCY public release since March 2025)"
  repo_url: "https://git.bgc-jena.mpg.de/quincy-model/qs-open-access"

boundary:
  scope_in:
    - "Single-site (0-D column) terrestrial ecosystem carbon exchange: GPP, autotrophic and heterotrophic respiration, NEE"
    - "Coupled vegetation and soil C-N-P cycling with explicit plant and soil organic/inorganic pools"
    - "Canopy photosynthesis with N-dependent capacity and chlorophyll, multi-layer canopy radiation"
    - "Soil water, soil temperature, snow and the surface energy balance (latent, sensible, ground heat, net radiation)"
    - "Vegetation dynamics (height, diameter, density, LAI) from bare ground through spin-up"
  scope_out:
    - "Spatial coupling or lateral transport (point model; the engine reads one forcing file)"
    - "Gridded / NetCDF runs (this build writes ASCII text output only)"
    - "Land-use change, harvest schedules from files, fertiliser files (bc_*.nc inputs are not available in the public release)"
  spatial: "0-D point"
  temporal: "half-hourly time step (dtime_step_length_sec 1800); forcing half-hourly/hourly (timestep route) or daily (engine-made diurnal cycle)"
  closure: "C, N and P mass are conserved by the engine (matter_conservation_test output); energy balance closed at the surface; water balance P = ET + runoff + drainage + dS, except that snow sublimation is in LE but not in the water output files"
  notes: "Runs follow QUINCY's transient protocol: spin-up from bare ground by cycling the first forcing years (default 500 yr), then the forcing period. 365-day calendar; climate.dat is read line by line with no date matching."

inputs:
  forcing:
    - {category: forcing, name: "sw_srf_down (surface downward shortwave radiation)", unit: "W/m2", source_kind: forcing, model_input_format: "climate.dat column 4; daily route = 24-h mean"}
    - {category: forcing, name: "lw_srf_down (surface downward longwave radiation)", unit: "W/m2", source_kind: forcing, model_input_format: "climate.dat column 5"}
    - {category: forcing, name: "t_air (near-surface air temperature)", unit: "K", source_kind: forcing, model_input_format: "climate.dat column 6 (timestep route); tmin, tmax in K on the daily route", notes: "Kelvin, not deg C."}
    - {category: forcing, name: "q_air (near-surface specific humidity)", unit: "g/kg", source_kind: forcing, model_input_format: "climate.dat; engine divides by 1000"}
    - {category: forcing, name: "press_srf (surface air pressure)", unit: "hPa", source_kind: forcing, model_input_format: "climate.dat; engine multiplies by 100"}
    - {category: forcing, name: "rain / snow or precip (precipitation rate)", unit: "mm/day", source_kind: forcing, model_input_format: "climate.dat; a RATE in mm/day even on half-hourly rows (engine divides by 86400)"}
    - {category: forcing, name: "wind_air (wind speed)", unit: "m/s", source_kind: forcing, model_input_format: "climate.dat"}
    - {category: forcing, name: "co2_mixing_ratio (atmospheric CO2)", unit: "ppm", source_kind: forcing, model_input_format: "climate.dat; FLUXNET CO2_F_MDS or the annual Law Dome / Mauna Loa record"}
    - {category: forcing, name: "nhx_srf_down, noy_srf_down (N deposition)", unit: "mg N/m2/day", source_kind: user_provided, model_input_format: "climate.dat; from build_quincy_climate.py --ndep_kgN_ha_yr"}
    - {category: forcing, name: "p_srf_down (P deposition)", unit: "mg P/m2/day", source_kind: user_provided, model_input_format: "climate.dat; from --pdep_kgP_ha_yr"}
  parameters:
    - {category: site_config, name: "plant_functional_type_id (QUINCY PFT 1-14)", unit: "-", source_kind: user_provided, model_input_format: "qs.namelist &lnd_veg_nml", notes: "From the engine's fluxnet2/cruncep site lists or --pft."}
    - {category: soil, name: "soil sand / silt / clay fractions", unit: "fraction 0-1", source_kind: derived, model_input_format: "qs.namelist &lnd_spq_nml spq_soil_* AND &jsb_sse_nml qs_soil_*", notes: "HWSD percent / 100."}
    - {category: soil, name: "bulk density", unit: "kg/m3", source_kind: derived, model_input_format: "spq_bulk_density, qs_bulk_density", notes: "HWSD g/cm3 x 1000."}
    - {category: soil, name: "soil_ph", unit: "-", source_kind: derived, model_input_format: "&lnd_sb_nml soil_ph"}
    - {category: soil, name: "soil depth", unit: "m", source_kind: default, model_input_format: "spq_soil_depth and &jsb_hydro_nml qs_soil_depth (default 9.5)"}
    - {category: calibration, name: "process parameters (lnd_q_assimi/veg/sb/spq/pheno/rad, lctlib PFT 1-8)", unit: "multiplier of engine default", source_kind: calibrated, model_input_format: "parameter_slm_run.list, proportional mode", notes: "Written by tools/edit_quincy_parameters.py; engine echoes old/new values to parameter_sensi_param_values.txt."}
  initial_conditions:
    _reason: "The engine starts from bare ground and default soil pools; the state is built by the transient spin-up (run_quincy_engine.py --spinup_years). No restart files exist in the text-output build."
  boundary_conditions:
    - {category: site_config, name: "latitude, longitude", unit: "deg", source_kind: user_provided, model_input_format: "qs.namelist &grid_ctl", notes: "Latitude sets the solar geometry; the solar clock is local solar time."}
    - {category: site_config, name: "elevation", unit: "m", source_kind: user_provided, model_input_format: "&lnd_spq_nml spq_elevation"}

processes:
  modules:
    - {name: "Q_ASSIMI", role: process_solver, brief: "Canopy photosynthesis and stomatal conductance with N- and chlorophyll-dependent capacity over canopy layers."}
    - {name: "VEG", role: process_solver, brief: "Vegetation C-N-P pools, allocation, respiration, turnover, nutrient uptake and vegetation dynamics."}
    - {name: "Q_PHENO", role: process_solver, brief: "Phenology (growing season, leaf onset/shedding)."}
    - {name: "SB", role: process_solver, brief: "Soil biogeochemistry: litter and SOM pools, microbial decomposition, N and P mineralisation, sorption, leaching."}
    - {name: "SPQ", role: process_solver, brief: "Soil physics: soil water, soil temperature, snow, surface energy balance (LE, H, G)."}
    - {name: "RADIATION", role: process_solver, brief: "Canopy radiation transfer and albedo."}
    - {name: "atmland_forcing", role: integrator, brief: "Reads climate.dat line by line, converts units, makes sub-daily values from daily forcing."}
  internal_edges:
    - {from: "atmland_forcing", to: "Q_ASSIMI", kind: invokes, brief: "Radiation, temperature, humidity, CO2."}
    - {from: "Q_ASSIMI", to: "GPP", kind: produces_output, brief: "Gross assimilation summed per output interval."}
    - {from: "VEG", to: "Ra", kind: produces_output, brief: "Growth + maintenance + N-transform + N-fixation respiration."}
    - {from: "SB", to: "Rh", kind: produces_output, brief: "Heterotrophic respiration."}
    - {from: "SPQ", to: "LE", kind: produces_output, brief: "Latent heat from the surface energy balance."}
    - {from: "SPQ", to: "H", kind: produces_output, brief: "Sensible heat from the surface energy balance."}
    - {from: "VEG", to: "LAI", kind: produces_output, brief: "LAI from leaf C and SLA."}

states:
  variables:
    - {name: "vegetation C/N/P pools (leaf, fine root, sapwood, heartwood, coarse root, labile, reserve, fruit, seed bed)", unit: "mol/m2", role: prognostic}
    - {name: "soil organic pools (litter, microbial, residue, DOM) and inorganic N/P", unit: "mol/m2", role: prognostic}
    - {name: "soil water, soil temperature, snow", unit: "m / K / m", role: prognostic}
  provenance: "engine source (mo_qs_output_txt.f90 headers)"

outputs:
  - var: "GPP"
    validation_rank: 1
    unit: "umol CO2/m2/s"
    description: "Terrestrial ecosystem gross primary production of the vegetation canopy (gross carbon assimilation), daily mean; engine writes mol C/m2/day in vegflux_c_daily.txt, the parser converts (also g C/m2/day as GPP_gC)."
    emitted_in: "vegflux_c_daily.txt -> quincy_daily.csv (parse_quincy_engine_output.py)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Eddy-covariance GPP is partitioned from NEE (FLUXNET GPP_NT_VUT_REF); FLUXNET DAILY files are g C/m2/day, not umol/m2/s.", "Model vegetation is a spun-up equilibrium stand of the site PFT, not the managed stand history."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Annual GPP sum only."]
      detrending_options: ["none"]
  - var: "NEE"
    validation_rank: 3
    unit: "umol CO2/m2/s"
    description: "Terrestrial ecosystem net ecosystem exchange of CO2 between the land surface and the atmosphere, NEE = Ra + Rh - GPP (positive = net source to the atmosphere), daily mean."
    emitted_in: "vegflux_c_daily.txt + soilflux_cdc13dc14_daily.txt -> quincy_daily.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["A spun-up stand is near carbon equilibrium, so the long-term sink of a managed, aging forest is not reproduced; judge timing (r) separately from the mean."]
      detrending_options: ["none"]
  - var: "Reco"
    validation_rank: 4
    unit: "umol CO2/m2/s"
    description: "Terrestrial ecosystem respiration (autotrophic plus soil heterotrophic), daily mean."
    emitted_in: "quincy_daily.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Eddy-covariance Reco is partitioned (RECO_NT_VUT_REF), not measured."]
      detrending_options: ["none"]
  - var: "Ra"
    validation_rank: 5
    unit: "umol CO2/m2/s"
    description: "Terrestrial ecosystem autotrophic (plant) respiration: growth + maintenance + N-transformation + N-fixation respiration, daily mean."
    emitted_in: "vegflux_c_daily.txt -> quincy_daily.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Rarely measured directly at flux sites."]
      detrending_options: ["none"]
  - var: "Rh"
    validation_rank: 6
    unit: "umol CO2/m2/s"
    description: "Soil heterotrophic respiration from litter and soil organic matter decomposition in the soil column, daily mean."
    emitted_in: "soilflux_cdc13dc14_daily.txt -> quincy_daily.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Soil heterotrophic respiration is hard to isolate observationally (chamber / trenching data)."]
      detrending_options: ["none"]
  - var: "LAI"
    validation_rank: 7
    unit: "m2/m2"
    description: "Vegetation canopy leaf area index (one-sided green leaf area per ground area) from leaf carbon and specific leaf area."
    emitted_in: "veg_diagnostics_daily.txt -> quincy_daily.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Spun-up equilibrium canopy of the site PFT."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Satellite LAI point extraction at the site only."]
      detrending_options: ["none"]
  - var: "LE"
    validation_rank: 2
    unit: "W/m2"
    description: "Terrestrial land-surface latent heat flux to the atmosphere from the surface energy balance (includes snow sublimation), daily mean; engine writes MJ/m2/day (Qle)."
    emitted_in: "vegflux_energy_daily.txt -> quincy_daily.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Tower energy balance is not closed (LE_F_MDS vs LE_CORR); the model balance is closed."]
      detrending_options: ["none"]
  - var: "H"
    validation_rank: 8
    unit: "W/m2"
    description: "Terrestrial land-surface sensible heat flux to the atmosphere from the surface energy balance, daily mean; engine writes MJ/m2/day (Qh)."
    emitted_in: "vegflux_energy_daily.txt -> quincy_daily.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Tower energy imbalance mostly shows up in H."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "vcmaxn (RuBisCO carboxylation efficiency per unit leaf N)"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always (engine lever: lnd_q_assimi_nml vcmax2n via tools/edit_quincy_parameters.py)"
      citations: ["thum2019_quincy_v10_gmd", "caldararu2020_quincy_nue_optimality_nph"]
    - from: "kfnchl / achln (leaf N-to-chlorophyll scaling)"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "QUINCY engine chlorophyll-resolved photosynthesis (lnd_veg_nml k0_fn_chl_C3 / kfn_chl, lnd_q_assimi_nml chl2n)"
      citations: ["thum2019_quincy_v10_gmd", "miinalainen2025_quincy_chlorophyll_bg"]
    - from: "k0struc (structural N fraction in leaves)"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "QUINCY engine leaf-N allocation (lnd_q_assimi_nml k1_fn_struc)"
      citations: ["thum2019_quincy_v10_gmd"]
    - from: "leaf C:N ratio"
      to: "leaf chlorophyll"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "QUINCY engine (leaf chlorophyll is internal; not in the basic text output set)"
      citations: ["miinalainen2025_quincy_chlorophyll_bg"]
    - from: "leaf chlorophyll"
      to: "GPP"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY chlorophyll-resolved photosynthesis"
      citations: ["miinalainen2025_quincy_chlorophyll_bg", "thum2025_quincy_decadal_borden_bg"]
    - from: "nitrogen deposition"
      to: "leaf chlorophyll"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "QUINCY engine, evergreen sites; N deposition enters via climate.dat nhx/noy columns (build_quincy_climate.py --ndep_kgN_ha_yr)"
      citations: ["miinalainen2025_quincy_chlorophyll_bg"]
    - from: "air temperature"
      to: "leaf chlorophyll"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "full QUINCY across-site analysis"
      citations: ["miinalainen2025_quincy_chlorophyll_bg"]
    - from: "leaf nitrogen allocation (RuBisCO vs structural/chlorophyll partitioning)"
      to: "Vcmax"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "QUINCY engine optimality-based N allocation (flag_optimal_Nfraction in lnd_q_assimi_nml)"
      citations: ["caldararu2020_quincy_nue_optimality_nph"]
    - from: "tau_slowbase (slow SOM pool turnover rate)"
      to: "net N/P mineralization"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "QUINCY engine soil biogeochemistry (lnd_sb_nml tau_slow; soilflux_n output)"
      citations: ["thum2019_quincy_v10_gmd"]
    - from: "Topt,decomp (decomposition temperature optimum)"
      to: "net N/P mineralization"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY soil biogeochemistry"
      citations: ["thum2019_quincy_v10_gmd"]
    - from: "eta_C (microbial litter->fast / fast->slow processing efficiency)"
      to: "vegetation carbon"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY soil microbial processing"
      citations: ["thum2019_quincy_v10_gmd"]
    - from: "chi_SOMslow (slow SOM C:nutrient stoichiometry)"
      to: "net N/P mineralization"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY soil biogeochemistry"
      citations: ["thum2019_quincy_v10_gmd"]
    - from: "sla (specific leaf area)"
      to: "leaf area index"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "QUINCY engine vegetation dynamics (lctlib sla; edit_quincy_parameters.py --pft N --set sla=..)"
      citations: ["thum2019_quincy_v10_gmd", "thum2025_quincy_decadal_borden_bg"]
    - from: "klatosa (leaf-to-sapwood area ratio)"
      to: "vegetation carbon"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "full QUINCY vegetation dynamics"
      citations: ["thum2019_quincy_v10_gmd"]
    - from: "soil phosphorus availability / C cost of P acquisition"
      to: "GPP"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "QUINCY engine with include_phosphorus = .TRUE. (default) at P-limited sites"
      citations: ["yu2020_quincy_phosphorus_nph"]
    - from: "leaf area index (LAI)"
      to: "NEE"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "seasonal canopy dynamics (engine LAI from vegetation C pools and SLA)"
      citations: ["thum2025_quincy_decadal_borden_bg"]
    - from: "labile carbohydrate (reserve) pool"
      to: "NEE"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "QUINCY engine interannual-decadal legacy effects (labile/reserve pools in vegpool_c output)"
      citations: ["thum2025_quincy_decadal_borden_bg"]
    - from: "temperature acclimation of photosynthesis"
      to: "GPP"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: structural
      applicability: "full QUINCY; offsetting positive/negative effects yield minimal long-term annual-mean GPP influence"
      citations: ["thum2019_quincy_v10_gmd"]
  _caveat: "All HIGH grades rest on rank/correlation-based importance, not variance-decomposition sensitivity indices: QUINCY has no Sobol/Morris/EFAST study. Grounding is Thum et al. 2019 RPCC (rank-transformed partial correlation over a 1000-sample LHS of 45 parameters; top-group rank treated as the quantitative bar) and Miinalainen et al. 2025 correlation/permutation-importance. Treat HIGH here as 'top-ranked in the available rank/correlation analysis,' not as St>=0.3."
  citation_index:
    thum2019_quincy_v10_gmd:
      short_citation: "Thum et al. 2019"
      doi: "10.5194/gmd-12-4781-2019"
      note: "QUINCY v1.0 model description; 1000-sample Latin Hypercube Sampling over 45 parameters with importance as rank-transformed partial correlation coefficients (RPCC). No Sobol/Morris/EFAST index; RPCC top-rank treated as a rank-based quantitative sensitivity index."
    miinalainen2025_quincy_chlorophyll_bg:
      short_citation: "Miinalainen et al. 2025"
      doi: "10.5194/bg-22-6937-2025"
      note: "QUINCY leaf-chlorophyll evaluation at 422 sites; reports correlation coefficients and permutation-importance (leaf C:N->chl r=-0.87/-0.96, chl->GPP r=0.71, N-dep permutation importance 0.95-1.78)."
    thum2025_quincy_decadal_borden_bg:
      short_citation: "Thum et al. 2025"
      doi: "10.5194/bg-22-1781-2025"
      note: "QUINCY decadal/extreme-event study at Borden Forest; LAI and leaf chlorophyll control GPP/NEE seasonality, labile carbohydrate pool mediates legacy effects."
    yu2020_quincy_phosphorus_nph:
      short_citation: "Yu et al. 2020"
      doi: "10.1111/nph.16538"
      note: "QUINCY soil/plant phosphorus exchange scheme; soil P availability and C cost of P acquisition control productivity (DOI re-confirm advised)."
    caldararu2020_quincy_nue_optimality_nph:
      short_citation: "Caldararu et al. 2020"
      doi: "10.1111/nph.16320"
      note: "QUINCY optimality-based N-use-efficiency / leaf-N allocation scheme governing Vcmax and GPP response to N (DOI re-confirm advised)."

safety:
  hazards:
    - id: "engine_finish_exits_zero"
      kind: control_semantic
      description: "The engine's finish() writes the error to quincy_standalone.err and stops with exit code 0; success must be judged by the end message and an empty .err (dt_quincy_026)."
      severity: silent
    - id: "climate_file_rewound_silently"
      kind: weather_file_semantic
      description: "climate.dat is read line by line; a short file is silently rewound and reused, only a log note says so (dt_quincy_027)."
      severity: silent
    - id: "leap_day_in_forcing"
      kind: weather_file_semantic
      description: "The engine calendar has 365 days; Feb 29 rows shift every later day by one per leap year (dt_quincy_028)."
      severity: silent
    - id: "forcing_units"
      kind: weather_file_semantic
      description: "t_air in K, q_air in g/kg, pressure in hPa, precipitation as a mm/day RATE on every row, deposition in mg/m2/day (dt_quincy_029, dt_quincy_030)."
      severity: silent
    - id: "namelist_duplicate_group"
      kind: control_semantic
      description: "Fortran reads only the first copy of a namelist group; a duplicated group silently drops its values (dt_quincy_031)."
      severity: silent
    - id: "soil_texture_in_one_namelist_only"
      kind: control_semantic
      description: "Soil texture is read by three processes (lnd_spq_nml, jsb_sse_nml, jsb_hydro_nml); setting one leaves the others at 0.3/0.4/0.3 (dt_quincy_032)."
      severity: silent
    - id: "fluxnet_daily_carbon_units"
      kind: parser_semantic
      description: "FLUXNET FULLSET_DD carbon fluxes are g C/m2/day, not umol/m2/s (dt_quincy_033)."
      severity: silent
    - id: "short_spinup"
      kind: control_semantic
      description: "Too short a spin-up leaves LAI and soil pools far from equilibrium; GPP low and NEE biased (dt_quincy_034)."
      severity: degraded
  validation_limits:
    - "Point-scale (0-D) only."
    - "The public release ships no official site example; the engine check is the built-in test_canopy / test_radiation self-tests, reproduced byte for byte."
    - "A spun-up equilibrium stand does not carry the site's management or age history, so the mean NEE sink of a managed forest is underestimated."
    - "N and P deposition have no gridded server dataset; they are user inputs with a cited or stated source."
  warnings:
    - "tools/run_quincy.py and its helpers are a Python SURROGATE (contract: docs/surrogate/surrogate_quincy_analytic_dag.yaml); their numbers are not QUINCY output."
