- id: dt_051
  symptom: CROPGRO-based crops (soybean, peanut, dry bean, cotton, chickpea, etc.) produce zero yield
    despite normal phenology. PlantGro.OUT shows LAI stuck near zero while leaf number advances normally.
    OVERVIEW.OUT reports 'Plant died due to extreme stress' with AGEFAC=0.00.
  diagnosis: The photosynthesis method (PHOTO) in the FileX simulation controls is set to 'R' (radiation-use
    efficiency) instead of 'L' (leaf-level). CROPGRO requires PHOTO=L; using PHOTO=R causes the leaf-level
    photosynthesis routine to produce near-zero assimilates, resulting in no biomass accumulation.; DSSAT
  remedy: 'Set PHOTO=L for CROPGRO-based crops in the FileX simulation controls.; dssat_workdir_setup.py
    (fixed in v4.0); [''In the FileX, find the line: @N METHODS  WTHER INCON LIGHT EVAPO INFIL PHOTO HYDRO...'',
    ''Change the PHOTO column from R to L for CROPGRO crops'', ''CROPGRO crops: soybean, peanut, dry bean,'
  severity: critical
- id: dt_spam_single_point_undefined_r
  symptom: DSSAT yield validation against SPAM 2020 returns NaN/uncomputable Pearson r (or trips the r<0.5
    retry gate) even when simulated yield is within a few % of the SPAM pixel; only one (sim,obs) pair
    exists.
  diagnosis: SPAM 2020 is a single-year gridded product and crop_obs.get_observed_yield returns one scalar,
    so a single-point run gives one paired value. ki_tools_common.metrics.nse()/pearson_r() return NaN
    for <2 valid pairs (metrics.py:86-90), and obs variance is 0 for one point, so r/NSE/KGE are mathematicall
  remedy: 'Build a paired sample: run DSSAT at >=2 sites/pixels with tools/s9_output_parsing/validate_against_spam.py
    and correlate simulated HWAM vs SPAM yield across the sample; exclude FAOSTAT-fallback obs. For genuinely
    single-site runs, score by % bias / nRMSE (within 15%) instead of r.'
- id: dt_crop_yield_single_pair_nan_r
  symptom: Crop-yield validation returns null/NaN for metrics.r (and nse/kge); orchestrator's r<0.5 gate
    retries forever even when the simulated yield is close to observed.
  diagnosis: Only one (sim,obs) pair was built — single DSSAT yield vs single-year SPAM-2020 point (ki_tools_common.crop_obs.get_observed_yield
    returns one scalar). ki_tools_common/metrics.py returns NaN for <2 valid pairs, so r is structurally
    undefined regardless of accuracy.
  remedy: 'Build a temporal sample: run DSSAT across >=2 simulation years and pair each year''s HWAM against
    a MULTI-YEAR gridded yield product (GDHY v1.2/1.3 1981-2016 or GlobalCropYield5min) via crop_obs.get_observed_yield_series,
    then compute metrics.all_metrics. Use tools/s9_output_parsing/validate_yield_ti'
- id: dt_point_vs_national_faostat_low_r
