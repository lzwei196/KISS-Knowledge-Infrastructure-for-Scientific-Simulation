template_version: "3.5"

identity:
  model_id: "HydroCNHS"
  scientific_reference_version: "HydroCNHS (Lin, Yang & Wi 2022) — semi-distributed daily CNHS hydrology: GWLF/ABCD rainfall-runoff + Lohmann routing + four ABM coupling APIs"
  implementation:
    id: "hydrocnhs"
    version: "1.2.1"
    provenance: "Pure Python; HydroCNHS package (Lin / Yang group) — no compiled binaries; API model.run(temp, prec, pet)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "BSD-3-Clause"
  repo_url: "https://github.com/philip928lin/HydroCNHS"

boundary:
  scope_in:
    - "Semi-distributed daily rainfall-runoff at the subbasin level (GWLF, ABCD, or user-supplied 'Other')"
    - "Routing of subbasin runoff to routing outlets (within-subbasin gamma unit hydrograph + inter-subbasin linearized Saint-Venant river routing)"
    - "Coupled human/agent decisions via four ABM APIs (Dam reservoirs, RiverDiv diversions, Conveying trans-basin transfers, InSitu within-subbasin alteration)"
    - "Internal Hamon PET when PET is not supplied"
    - "Optional monthly USLE total-suspended-sediment accounting"
  scope_out:
    - "Grid-based fully distributed hydrology (subbasin is the base unit, not a grid cell)"
    - "Sub-daily time stepping (model operates on daily forcing)"
    - "Built-in human decision rules (agent behavior must be user-coded in .py ABM modules)"
    - "Basin delineation / subbasin geometry (external GIS, supplied as static input)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-balance closure is for water through the node-link routing system; each ABM API has a plug-in structure that preserves the water balance. There is no surface energy-balance closure — PET is supplied or computed by the temperature/latitude-driven Hamon method, a demand-side flux, not a closed energy budget. Sediment (when enabled) is a separate monthly USLE mass accounting in Mg, not closed against the daily water balance."

inputs:
  forcing:
    - category: "forcing"
      name: "precipitation (prec)"
      unit: "cm/day"
      source_kind: "forcing"
      model_input_format: "Python dict {outlet_name: [daily values]}"
      notes: "Internal area-to-discharge conversion (0.01*Area*10000/86400) confirms the model expects cm/day; mm/day, m/day, or kg/m2/s forcing runs silently with magnitude errors."
    - category: "forcing"
      name: "temperature (temp)"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "Python dict {outlet_name: [daily values]}"
      notes: "Drives Hamon PET (exp(temp/16)) and degree-day snowmelt; a monthly-mean resample of temp also selects the GWLF growing-season CN antecedent-moisture branch. Kelvin input silently saturates PET seasonality."
    - category: "forcing"
      name: "potential evapotranspiration (pet)"
      unit: "cm/day"
      source_kind: "forcing"
      model_input_format: "Python dict {outlet_name: [daily values]} (optional)"
      notes: "Optional. If omitted, computed internally by Hamon from temperature + subbasin latitude + Julian day; PET forced to 0 where temp<=0. Pre-supplying it avoids recomputation each calibration run."
  parameters:
    - category: "gwlf_parameter"
      name: "CN2 (SCS runoff curve number)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml; -99 flags for calibration"
      notes: "Range [25,100]; most sensitive GWLF parameter. Internally converted to dry/wet CN1/CN3 and detention DSkt."
    - category: "gwlf_parameter"
      name: "IS (interception fraction)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [0,0.5]."
    - category: "gwlf_parameter"
      name: "Res (baseflow recession coefficient)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [1e-3,0.5]; sets groundwater discharge Gt=Res*St."
    - category: "gwlf_parameter"
      name: "Sep (deep seepage fraction)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [0,0.5]; deep seepage Dt=Sep*St lost from the basin."
    - category: "gwlf_parameter"
      name: "Alpha (groundwater discharge / baseflow coefficient)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [0,1]. Docs/KI overlap Alpha (baseflow rate) vs Res (recession); both govern shallow-groundwater discharge."
    - category: "gwlf_parameter"
      name: "Beta (unsaturated-zone percolation coefficient)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [0,1]."
    - category: "gwlf_parameter"
      name: "Ur (available soil water capacity)"
      unit: "cm"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [1,15]; water-stress onset Ks ramps below 0.5*Ur. mm input silently suppresses runoff."
    - category: "gwlf_parameter"
      name: "Df (degree-day snowmelt coefficient)"
      unit: "cm/degC"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [0,1]; melt=min(SnowSt, Df*temp) for temp>0. Shared with ABCD."
    - category: "gwlf_parameter"
      name: "Kc (land cover / crop coefficient)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml"
      notes: "Range [0.5,1.5]."
    - category: "abcd_parameter"
      name: "a (runoff/recharge control under unsaturation)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml (LSM='ABCD')"
      notes: "Range [0,1]."
    - category: "abcd_parameter"
      name: "b (maximum soil water storage)"
      unit: "cm"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml (LSM='ABCD')"
      notes: "Range [0,400]; upper limit on ET + soil moisture storage."
    - category: "abcd_parameter"
      name: "c (groundwater recharge fraction)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml (LSM='ABCD')"
      notes: "Range [0,1]."
    - category: "abcd_parameter"
      name: "d (groundwater discharge rate)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "RainfallRunoff entry in model.yaml (LSM='ABCD')"
      notes: "Range [0,1]."
    - category: "routing_parameter"
      name: "GShape (within-subbasin gamma UH shape)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "Routing entry in model.yaml (per link)"
      notes: "Range [1,100]. Interacts with GScale → calibrate jointly. Silently set to a single impulse (no in-grid lag) when assigned_Q or InstreamControl is active."
    - category: "routing_parameter"
      name: "GScale (within-subbasin gamma UH scale)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "Routing entry in model.yaml (per link)"
      notes: "Range [1e-2,150]; clamped to >=0.0001 to avoid divide-by-zero in gamma.cdf."
    - category: "routing_parameter"
      name: "Velo (Saint-Venant wave celerity)"
      unit: "m/s"
      source_kind: "calibrated"
      model_input_format: "Routing entry in model.yaml (per link)"
      notes: "Range [0.5,55]; between-subbasin channel wave velocity."
    - category: "routing_parameter"
      name: "Diff (Saint-Venant diffusivity)"
      unit: "m^2/s"
      source_kind: "calibrated"
      model_input_format: "Routing entry in model.yaml (per link)"
      notes: "Range [200,4000]; controls hydrograph attenuation."
    - category: "static_geometry"
      name: "subbasin drainage area (Area)"
      unit: "ha"
      source_kind: "user_provided"
      model_input_format: "Outlet attribute in model.yaml"
      notes: "Used to convert runoff depth (cm) to discharge (cms). km2 or m2 input silently mis-scales discharge."
    - category: "static_geometry"
      name: "subbasin latitude (Latitude)"
      unit: "decimal degrees"
      source_kind: "user_provided"
      model_input_format: "Outlet attribute in model.yaml"
      notes: "Used by Hamon PET solar-declination term."
    - category: "static_geometry"
      name: "flow length between outlets (FlowLength)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Routing link attribute in model.yaml"
      notes: "Sets Lohmann travel time/attenuation. km input makes routing ~1000x too fast."
  initial_conditions:
    - category: "initial_condition"
      name: "S0 (initial shallow saturated soil water, GWLF)"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: "RainfallRunoff initial value in model.yaml"
      notes: "Requires 1-2 yr warm-up to equilibrate."
    - category: "initial_condition"
      name: "U0 (initial unsaturated soil water, GWLF)"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: "RainfallRunoff initial value in model.yaml"
      notes: "Requires warm-up."
    - category: "initial_condition"
      name: "SnowS (initial snow storage)"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: "RainfallRunoff initial value in model.yaml"
      notes: "Shared concept for GWLF and ABCD; requires warm-up."
    - category: "initial_condition"
      name: "XL (initial saturated/lower soil water, ABCD)"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: "RainfallRunoff initial value in model.yaml (ABCD)"
      notes: "ABCD groundwater store initial value."
  boundary_conditions:
    - category: "control"
      name: "LSM rainfall-runoff scheme selector (GWLF | ABCD | Other)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "WaterSystem.LSM in model.yaml"
      notes: "'Other' lets the user inject pre-computed subbasin runoff."
    - category: "control"
      name: "simulation period (StartDate / EndDate / DataLength)"
      unit: "date / count"
      source_kind: "user_provided"
      model_input_format: "WaterSystem in model.yaml; dates as YYYY/M/D"
      notes: "DataLength MUST equal (EndDate-StartDate).days+1 or arrays mis-size (fatal IndexError). Hyphenated dates silently misparse."
    - category: "control"
      name: "routing network topology (Outlets / Routing links)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "WaterSystem.Outlets + Routing graph in model.yaml"
      notes: "Node-link connectivity from which SimSeq routing order is derived."
    - category: "control"
      name: "InstreamControl flag"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Routing attribute in model.yaml (default False)"
      notes: "When True, in-grid UH collapses to a single impulse (no within-subbasin lag) for a reservoir-controlled outlet."
    - category: "management"
      name: "ABM agent rules and priority ordering"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "ABM section in model.yaml + user .py modules at Path.Modules"
      notes: "Agents execute in priority order (lower number first); dam release must precede downstream diversion or water balance is silently violated. Priorities must be unique."
    - category: "calibration_target"
      name: "observed streamflow"
      unit: "cms (m^3/s)"
      source_kind: "user_provided"
      model_input_format: "supplied to GA / Indicator for calibration only"
      notes: "Not consumed by the forward simulation; used only as the calibration/evaluation target."

processes:
  modules:
    - name: "GWLF"
      role: "process_solver"
      brief: "Generalized Watershed Loading Functions daily rainfall-runoff (Haith 1987): SCS-CN surface runoff with growing-season antecedent-moisture branch, interception, unsaturated/shallow-saturated soil moisture, recession baseflow, deep seepage. 9 params. Outputs subbasin runoff."
      applicability: "when LSM='GWLF'"
    - name: "ABCD"
      role: "process_solver"
      brief: "ABCD conceptual water-balance rainfall-runoff (Thomas 1981): ET-opportunity, upper/lower (XU/XL) stores, groundwater recharge/discharge. 4 core params (a,b,c,d) plus shared snowmelt Df. Outputs subbasin runoff."
      applicability: "when LSM='ABCD'"
    - name: "Hamon-PET"
      role: "process_solver"
      brief: "Hamon (1961) / Allen (1998) potential ET from temperature, latitude, and Julian-day solar declination; default PET source when none supplied. Optional 0.6 degC/100 m lapse adjustment. Output cm/day, zeroed where temp<=0."
    - name: "Degree-day-snowmelt"
      role: "process_solver"
      brief: "Simple degree-day snow: rain/snow split at 0 degC, melt=min(SnowSt, Df*temp) for temp>0; manages snow storage state. Shared by GWLF and ABCD."
    - name: "Lohmann-UH-builder"
      role: "process_solver"
      brief: "form_UH_Lohmann: builds combined within-subbasin gamma unit hydrograph (GShape/GScale) + between-subbasin linearized Saint-Venant Green's-function UH (Velo/Diff). Fixed base times (in-grid 12 d, river 96 d)."
    - name: "Lohmann-routing"
      role: "integrator"
      brief: "Convolves precomputed unit hydrographs with upstream flow each timestep to produce routed streamflow at routing outlets; conveyance variant skips in-grid routing."
    - name: "Dam-API"
      role: "optional_module"
      brief: "In-stream reservoir agent that redefines downstream flow per user release rules and acts as a pseudo routing outlet (no routing through it); upstream node must be a routing outlet. Adds release deltas to routed flow."
      applicability: "when ABM Dam agents configured"
    - name: "RiverDiv-API"
      role: "optional_module"
      brief: "Off-stream diversion agent: diverts from a routed outlet (must be routed before diversion) with possible return flow re-entering within-subbasin routing at the receiving outlet."
      applicability: "when ABM RiverDiv agents configured"
    - name: "Conveying-API"
      role: "optional_module"
      brief: "Trans-basin transfer agent (aqueducts/pumps): conveyed water has no within-subbasin routing and is routed separately; downstream-to-upstream conveyance delivered with delay."
      applicability: "when ABM Conveying agents configured"
    - name: "InSitu-API"
      role: "optional_module"
      brief: "Within-subbasin agent (urbanization, wells, local diversion) altering a single subbasin's runoff before any routing at each timestep."
      applicability: "when ABM InSitu agents configured"
    - name: "Sediment-USLE"
      role: "optional_module"
      brief: "Monthly total-suspended-sediment via rainfall erosivity + USLE (K,CP,LS) and a Q_frac^Sq transport-capacity weight with an 11-month backward routing window. Output Mg. Requires Q_frac allocation and manually supplied dam-agent monthly TSS."
      applicability: "when WaterSystem.Sediment configured"
  internal_edges:
    - from: "Inputs"
      to: "Hamon-PET"
      kind: "consumes_input"
      brief: "Temperature + subbasin latitude compute PET per timestep when pet is not supplied."
    - from: "Hamon-PET"
      to: "GWLF"
      kind: "invokes"
      brief: "PET (cm/day) feeds GWLF evapotranspiration demand."
    - from: "Hamon-PET"
      to: "ABCD"
      kind: "invokes"
      brief: "PET (cm/day) feeds ABCD evapotranspiration demand."
    - from: "Inputs"
      to: "Degree-day-snowmelt"
      kind: "consumes_input"
      brief: "Daily temperature drives degree-day snow accumulation/melt."
    - from: "Degree-day-snowmelt"
      to: "snow_storage"
      kind: "writes_state"
      brief: "Updates snowpack; melt water released to rainfall-runoff."
    - from: "Inputs"
      to: "GWLF"
      kind: "consumes_input"
      brief: "Daily precipitation + monthly-mean temperature (growing-season CN branch) drive runoff generation."
    - from: "GWLF"
      to: "soil_moisture"
      kind: "writes_state"
      brief: "Updates unsaturated (Ut) and shallow-saturated (St) soil water stores."
    - from: "GWLF"
      to: "groundwater_storage"
      kind: "writes_state"
      brief: "Updates baseflow store (BFt) via recession and seepage."
    - from: "GWLF"
      to: "Q_runoff"
      kind: "writes_state"
      brief: "Writes subbasin runoff (cms) to the local runoff state."
    - from: "ABCD"
      to: "Q_runoff"
      kind: "writes_state"
      brief: "Alternative runoff generator writes subbasin runoff (cms)."
    - from: "Lohmann-UH-builder"
      to: "UH_Lohmann"
      kind: "writes_state"
      brief: "Precomputes per-link within-subbasin + channel unit hydrographs."
    - from: "UH_Lohmann"
      to: "Lohmann-routing"
      kind: "reads_state"
      brief: "Per-timestep convolution reads the precomputed UH arrays."
    - from: "Q_runoff"
      to: "Lohmann-routing"
      kind: "reads_state"
      brief: "Routing convolves subbasin runoff to produce routed streamflow."
    - from: "Lohmann-routing"
      to: "Q_routed"
      kind: "writes_state"
      brief: "Routed streamflow written at each routing outlet."
    - from: "InSitu-API"
      to: "Q_runoff"
      kind: "writes_state"
      brief: "Alters a single subbasin's runoff before any routing at each timestep."
    - from: "Dam-API"
      to: "Q_routed"
      kind: "writes_state"
      brief: "Reservoir release defines downstream flow at the pseudo routing outlet."
    - from: "RiverDiv-API"
      to: "Q_routed"
      kind: "writes_state"
      brief: "Diversion removes water from a routed outlet; return flow re-enters routing at the receiving outlet."
    - from: "Conveying-API"
      to: "Lohmann-routing"
      kind: "invokes"
      brief: "Conveyed water routed separately with no within-subbasin lag; downstream-to-upstream delivered with delay."
    - from: "Dam-API"
      to: "reservoir_storage"
      kind: "writes_state"
      brief: "Updates reservoir storage state per release/operation rules."
    - from: "Inputs"
      to: "Sediment-USLE"
      kind: "consumes_input"
      brief: "Subbasin precipitation drives rainfall-erosivity in the USLE term."
    - from: "Q_routed"
      to: "Sediment-USLE"
      kind: "reads_state"
      brief: "Monthly-summed per-subbasin flow contribution (Q_frac^Sq) is the sediment transport-capacity weight."
    - from: "Sediment-USLE"
      to: "Outputs"
      kind: "produces_output"
      brief: "Routed monthly/annual total suspended sediment (Mg) emitted as data-collector fields."
    - from: "Q_routed"
      to: "Outputs"
      kind: "produces_output"
      brief: "Daily routed streamflow returned as the primary model output."

states:
  variables:
    - name: "soil_moisture"
      unit: "cm"
      role: "prognostic"
    - name: "groundwater_storage"
      unit: "cm"
      role: "prognostic"
    - name: "snow_storage"
      unit: "cm"
      role: "prognostic"
    - name: "reservoir_storage"
      unit: "volume (model-defined)"
      role: "prognostic"
    - name: "Q_runoff"
      unit: "cms"
      role: "diagnostic"
    - name: "Q_routed"
      unit: "cms"
      role: "diagnostic"
    - name: "UH_Lohmann"
      unit: "-"
      role: "diagnostic"
    - name: "antecedent_moisture"
      unit: "cm"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "Q_routed"
    validation_rank: 1
    unit: "cms (m^3/s)"
    description: "Daily routed streamflow at routing/gauged outlets (and dam-agent inflow outlets); the primary return of Model.run()."
    emitted_in: "model.dc.Q_routed[outlet] (data collector)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Exclude a 1-2 yr warm-up before scoring so soil/groundwater/snow stores equilibrate."
            - "Align simulated and observed on the date index, not array position; a 1-day offset destroys correlation in flashy basins."
            - "Regulated reaches require the corresponding ABM agents configured or the comparison conflates natural and human signals."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Single-instant comparison (e.g., a peak or a long-term mean flow) discards the timing information routing is designed to capture."
      detrending_options:
        - "none"
  - var: "Q_runoff"
    validation_rank: 2
    unit: "cms (m^3/s)"
    description: "Local unrouted subbasin runoff (also exposed as Q_local) before Lohmann routing."
    emitted_in: "model.dc.Q_runoff[outlet] (data collector)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Unrouted runoff is rarely directly observed; compare only against gauges representing un-routed local generation, otherwise use Q_routed."
      detrending_options:
        - "none"
  - var: "pet"
    validation_rank: 3
    unit: "cm/day"
    description: "Hamon-computed potential evapotranspiration (atmospheric water demand) when PET is not supplied as input."
    emitted_in: "model.dc.pet[outlet] (data collector)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Hamon PET is temperature-driven; comparison against energy-balance reference ET will show structural bias."
      detrending_options:
        - "none"
  - var: "TSS_monthly"
    validation_rank: 4
    unit: "Mg"
    description: "Monthly routed total suspended sediment (sediment mode only)."
    emitted_in: "model.dc TSS field (data collector, sediment mode)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "pbias"
          caveats:
            - "Monthly aggregate; depends on manually supplied dam-agent TSS and an 11-month backward routing window."
      detrending_options:
        - "none"
  - var: "ABM_agent_records"
    validation_rank: 5
    unit: "varies (storage volume, diversion volume)"
    description: "Agent-specific water-management outputs (e.g., reservoir storage, diversion volume; bookkeeping records, not a single field observable) recorded by user-defined ABM modules via the shared data collector."
    emitted_in: "model.dc.<user-defined field> (data collector)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Field names and semantics are user/ABM-module-defined, not fixed by the model; comparability depends on the specific agent implementation."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "GWLF curve number (CN2)"
      to: "Q_routed (surface runoff volume)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "GWLF only"
      citations:
        - "wu2014_gwlf_daily"
        - "lin2022_hydrocnhs_technote"
    - from: "GWLF groundwater recession coefficient (Res/Alpha)"
      to: "Q_routed (baseflow / low flow)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "GWLF only"
      citations:
        - "wu2014_gwlf_daily"
    - from: "GWLF unsaturated-zone soil water capacity (Ur)"
      to: "actual evapotranspiration"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "GWLF only"
      citations:
        - "wu2014_gwlf_daily"
    - from: "GWLF deep-seepage / recharge coefficient (Beta)"
      to: "Q_routed (baseflow)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "GWLF only"
      citations:
        - "wu2014_gwlf_daily"
    - from: "ABCD parameter d (groundwater discharge rate)"
      to: "Q_routed (baseflow)"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "ABCD only"
      citations:
        - "allafta2013_abcd_sensitivity"
        - "martinez2010_abcd_identifiability"
