- id: err_009
  timestamp: '2026-03-20T08:00:00Z'
  recorded_by: claude
  run_context:
    basin: chaohe
    model: WRF-Hydro
    run_name: chaohe_wrf_test
  stage: s10_execution
  failure_domain: parameter_format
  symptom:
    description: RESTART_FREQUENCY_HOURS=0 causes WRF-Hydro to not write LDASOUT, GWOUT, or RESTART files. Model
      runs to completion but produces no output files.
    error_pattern: no LDASOUT files
    detection_method: missing_output
  diagnosis:
    root_cause: RESTART_FREQUENCY_HOURS must be >0 in namelist.hrldas for LDASOUT and GWOUT files to be written.
      Default value 0 means never write.
    explanation: WRF-Hydro uses RESTART_FREQUENCY_HOURS to control both restart file and diagnostic output frequency.
      When set to 0, the model interprets this as never write. Set to -9999 to write at every OUTPUT_TIMESTEP,
      or to a positive integer for periodic output.
    affected_components:
    - namelist.hrldas
    - LDASOUT
    - GWOUT
  resolution:
    action: Set RESTART_FREQUENCY_HOURS=-9999 in namelist.hrldas (write at every output step) or to a positive
      value matching desired output interval
    files_changed:
    - tools/s9_namelists/generate_namelists.py
    prevention: generate_namelists.py sets RESTART_FREQUENCY_HOURS=-9999 by default
  severity: silent
  promoted: true
  promoted_as: dt_015
- id: err_010
  timestamp: '2026-03-20T12:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_2000_2005
  stage: s4_fulldom
  failure_domain: silent_error
  symptom:
    description: 50% uphill flows and 39K circular 2-cell cycles in routing — WhiteboxTools D8 encoding documentation
      is WRONG. 8 of 9 directions were misassigned, causing 95% of cells to be disconnected from outlet.
    error_pattern: topology|uphill|circular
    detection_method: value_comparison
  diagnosis:
    root_cause: WhiteboxTools D8 encoding docs wrong. Actual WBT output verified by empirical 5x5 DEM test is
      1=NE, 2=E, 4=SE, 8=S, 16=SW, 32=W, 64=NW, 128=N — NOT the documented 1=E, 2=NE, 4=N, 8=NW, 16=W, 32=SW,
      64=S, 128=SE. Old mapping had only 1 of 9 directions correct.
    explanation: ArcGIS/WRF-Hydro uses 1=E, 2=SE, 4=S, 8=SW, 16=W, 32=NW, 64=N, 128=NE. Correct WBT-to-ArcGIS
      mapping is {0:0, 1:128, 2:1, 4:2, 8:4, 16:8, 32:16, 64:32, 128:64}. The old (wrong) mapping produced 50%
      uphill flows, 39K circular 2-cell cycles, and 95% cells disconnected from the outlet. This is a SILENT error —
      the model runs but produces physically meaningless routing.
    affected_components:
    - build_fulldom_hires.py
    - Fulldom_hires.nc
    - FLOWDIRECTION
  resolution:
    action: Corrected WBT_TO_ARCGIS mapping table in build_fulldom_hires.py, verified by empirical test with
      known-slope DEM
    files_changed:
    - tools/s4_fulldom/build_fulldom_hires.py
    prevention: Always verify D8 encoding empirically with small known-slope DEM — never trust documentation
  severity: silent
  promoted: true
  promoted_as: dt_v007
- id: err_011
  timestamp: '2026-03-20T12:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_2000_2005
  stage: s8_forcing
  failure_domain: unit_conversion
  symptom:
    description: SWDOWN extrapolated to 1026 W/m2 at grid edges by scipy.griddata — exceeds physical maximum
      (solar constant = 1361 W/m2). Combined with 3-hour step-function temporal interpolation, caused sustained
      overheating in Noah-MP energy balance.
    error_pattern: SWDOWN.*1[0-9]{3}
    detection_method: value_comparison
  diagnosis:
    root_cause: scipy.griddata extrapolates beyond input range at domain edges where VIC grid does not fully cover
      the WRF-Hydro LCC domain
    explanation: Combined with 3-hour step-function temporal interpolation (constant 3hr blocks vs truly hourly data),
      sustained overheating caused Noah-MP energy balance instability. Physical max is 1361 W/m2 (solar constant).
    affected_components:
    - convert_forcing_to_ldasin.py
    - LDASIN_DOMAIN1
    - SWDOWN
  resolution:
    action: Cap SWDOWN at 1361 W/m2 (solar constant) after spatial interpolation in convert_forcing_to_ldasin.py
    files_changed:
    - tools/s8_forcing/convert_forcing_to_ldasin.py
    prevention: convert_forcing_to_ldasin.py now clips SWDOWN to solar constant after griddata interpolation
  severity: degraded
  promoted: true
  promoted_as: dt_v022
- id: err_012
  timestamp: '2026-03-20T12:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_2000_2005
  stage: s8_forcing
  failure_domain: unit_conversion
  symptom:
    description: Mountain cells receive sea-level PSFC (101 kPa at 1955m elevation) and T2D 10.7C too warm — no
      elevation correction applied during spatial interpolation from VIC 0.25deg to WRF-Hydro 1km grid
    error_pattern: emitted longwave.*<0|Noah-MP
    detection_method: value_comparison
  diagnosis:
    root_cause: No elevation correction applied to PSFC and T2D during spatial interpolation from VIC 0.25deg grid
      to WRF-Hydro 1km LCC grid
    explanation: VIC forcing is at 0.25deg (~25km) resolution. When interpolated to 1km WRF-Hydro grid, mountain
      cells at 1955m received PSFC from low-elevation VIC cells (~101 kPa vs correct ~80 kPa — 20% error). T2D was
      ~10.7C too warm at mountaintops (no lapse rate correction). Combined with Bugs 1 and 2, caused Noah-MP
      emitted longwave <0 crash.
    affected_components:
    - convert_forcing_to_ldasin.py
    - LDASIN_DOMAIN1
    - PSFC
    - T2D
  resolution:
    action: Apply T2D -= 0.0065 * dz (lapse rate) and PSFC *= exp(-g*dz/(R*Tv)) (barometric formula) after griddata
      in convert_forcing_to_ldasin.py
    files_changed:
    - tools/s8_forcing/convert_forcing_to_ldasin.py
    prevention: convert_forcing_to_ldasin.py now applies elevation correction using DEM difference between VIC
      source and WRF-Hydro target grid
  severity: silent
  promoted: true
  promoted_as: dt_v008
- id: err_013
  timestamp: '2026-03-20T12:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_2000_2005
  stage: s3_wrfinput
  failure_domain: dependency_mismatch
  symptom:
    description: SMCRT fully depleted upon disaggregation — Noah-MP crash during January cold start with fully
      frozen soil (SMC=SICE, no liquid water)
    error_pattern: SMCRT fully depleted
    detection_method: log_match
  diagnosis:
    root_cause: January cold start has fully frozen soil (SMC=SICE, no liquid water) causing SMCRT depletion during
      vertical disaggregation
    explanation: In cold-start mode, soil moisture is initialized uniformly. In January for continental basins, all
      soil moisture freezes (SICE=SMC). When Noah-MP disaggregates the 4 soil layers, liquid water (SMCRT) reaches
      zero causing a fatal assertion failure. Starting in a warmer month (Apr-Jul) avoids this.
    affected_components:
    - wrfinput_d01.nc
    - Noah-MP
    - SMCRT
  resolution:
    action: Start simulation in warmer month (Apr-Jul) for cold-start, or use restart file from winter spinup
    files_changed: []
    prevention: Start cold-start simulations in summer months; for winter starts, first run a 6-month spinup from
      summer
  severity: fatal
  promoted: true
  promoted_as: dt_v023
- id: err_014
  timestamp: '2026-03-20T12:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_2000_2005
  stage: s10_execution
  failure_domain: dependency_mismatch
  symptom:
    description: Cold-start produces 237 mm/d surface runoff on first days — unrealistic spinup artifact from uniform
      soil moisture/temperature initialization
    error_pattern: SFCRNOFF.*[0-9]{3}
    detection_method: value_comparison
  diagnosis:
    root_cause: Uniform soil moisture/temperature initialization needs months to equilibrate with forcing — first
      days produce massive unrealistic runoff
    explanation: Cold-start initializes soil moisture at saturation and soil temperature uniformly. The first rainfall
      events generate extreme surface runoff (237 mm/d) because infiltration capacity is misrepresented. After 6-12
      months of spinup, soil state equilibrates and results become physical.
    affected_components:
    - wrfinput_d01.nc
    - LDASOUT_DOMAIN1
    - SFCRNOFF
  resolution:
    action: Run 6-12 month spinup before analysis period; discard first 6 months of cold-start output
    files_changed: []
    prevention: Always discard first 6 months of cold-start run as spinup; document expected spinup duration
  severity: degraded
  promoted: true
  promoted_as: dt_v014
- id: err_015
  timestamp: '2026-03-20T16:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_025deg_2000_2005
  stage: s4_fulldom
  failure_domain: parameter_format
  symptom:
    description: CHANNELGRID built with 0/1 encoding (0=non-channel, 1=channel) but WRF-Hydro expects -9999/0
      (-9999=non-channel, 0=channel). Value semantics inverted — channels not recognized, discharge=0.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: build_fulldom_hires.py originally wrote CHANNELGRID=1 for channel cells and CHANNELGRID=0
      for non-channel cells. WRF-Hydro convention is CHANNELGRID=0 for channel and CHANNELGRID=-9999 for
      non-channel. The 0/1 encoding made all channels invisible to routing.
    explanation: WRF-Hydro's routing module checks for CHANNELGRID==0 to identify channel cells. With
      the builder's 0/1 encoding, ALL non-channel cells had CHANNELGRID=0 and were incorrectly treated
      as channels, while actual channel cells with CHANNELGRID=1 were ignored. Silent error — model runs
      but routing is nonsensical.
    affected_components:
    - build_fulldom_hires.py
    - Fulldom_hires.nc CHANNELGRID
  resolution:
    action: Changed CHANNELGRID encoding to WRF-Hydro convention (channel=0, non-channel=-9999)
    files_changed:
    - tools/s4_fulldom/build_fulldom_hires.py
    prevention: build_fulldom_hires.py now uses correct -9999/0 encoding
  severity: silent
  promoted: true
  promoted_as: dt_v010
- id: err_016
  timestamp: '2026-03-20T16:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_025deg_2000_2005
  stage: s11_output
  failure_domain: silent_error
  symptom:
    description: Basin-mean SFCRNOFF+UGDRNOFF gives 2.4x higher discharge than VIC or observations.
      Headwater Q/P=0.35-0.38 but channel cells Q/P=0.96 due to upstream flow accumulation.
    error_pattern: runoff ratio > 0.8
    detection_method: value_comparison
  diagnosis:
    root_cause: LDASOUT SFCRNOFF/UGDRNOFF accumulators include routed upstream flow, not just local
      runoff. With OVRTSWCRT=1 and SUBRTSWCRT=1, basin-averaging double/triple counts the same water.
    explanation: The correct way to get outlet discharge is from CHRTOUT (channel routing output),
      not from LDASOUT SFCRNOFF basin averaging. CHRTOUT gives true routed streamflow at each
      channel cell.
    affected_components:
    - LDASOUT_DOMAIN1 SFCRNOFF/UGDRNOFF
    - CHRTOUT_DOMAIN1
  resolution:
    action: Use CHRTOUT_DOMAIN=1 in hydro.namelist. Read outlet discharge from CHRTOUT files.
    files_changed: []
    prevention: Always use CHRTOUT for discharge comparison, not LDASOUT SFCRNOFF averaging
  severity: silent
  promoted: true
  promoted_as: dt_v009
- id: err_017
  timestamp: '2026-03-20T16:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_025deg_2000_2005
  stage: s8_forcing
  failure_domain: unit_conversion
  symptom:
    description: CMFD precip units documentation misleading — raw CMFD is kg/m2/s (=mm/s), NOT mm/3hr.
      VIC pipeline multiplies by 10800 for its own use, creating false impression of native units.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: CMFD precipitation is stored as rate kg/m2/s. VIC pipeline multiplies by 10800 to
      produce mm/3hr accumulation. Converting to WRF-Hydro LDASIN requires dividing VIC mm/3hr back
      by 10800 to recover mm/s for RAINRATE.
    explanation: Confusion arises because VIC pipeline makes CMFD look like it stores mm/3hr. Without
      understanding this chain, one might skip the /10800 division and pass mm/3hr as mm/s, giving
      10800x too much rain.
    affected_components:
    - convert_forcing_to_ldasin.py
    - cmfd_to_ldasin.py
    - LDASIN RAINRATE
  resolution:
    action: Document clearly that CMFD precip is kg/m2/s rate. VIC converts to mm/3hr. For LDASIN
      RAINRATE, divide VIC mm/3hr by 10800 to recover mm/s.
    files_changed: []
    prevention: Both forcing converters handle the /10800 conversion
  severity: silent
  promoted: true
  promoted_as: dt_v011
- id: err_018
  timestamp: '2026-03-20T16:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_025deg_2000_2005
  stage: s2_geo_em
  failure_domain: parameter_format
  symptom:
    description: 4 cells have ISLTYP=14 (water soil type) but LU_INDEX=land vegetation. Noah-MP
      skips these cells, writing -9999 to output. Not a crash but missing data.
    error_pattern: '-9999'
    detection_method: value_comparison
  diagnosis:
    root_cause: HWSD soil raster has water/nodata for cells that land cover classifies as land.
      Soil/landuse inconsistency causes Noah-MP to treat cells as neither land nor water.
    explanation: ISLTYP=14 (water) with XLAND=1 (land) — SOILPARM.TBL water entry has zeros for
      all hydraulic params, effectively disabling the cell.
    affected_components:
    - geo_em.d01.nc ISLTYP
    - HWSD raster
  resolution:
    action: Replace ISLTYP=14 on land cells with most common surrounding soil type or default
      ISLTYP=4 (silt loam)
    files_changed:
    - tools/s2_geo_em/build_geo_em.py
    prevention: build_geo_em.py post-processes to ensure no land cell has water soil type
  severity: degraded
  promoted: true
  promoted_as: dt_v012
- id: err_019
  timestamp: '2026-03-20T16:00:00Z'
  recorded_by: claude
  run_context:
    basin: bengbu
    model: WRF-Hydro
    run_name: bengbu_wrfhydro_025deg_2000_2005
  stage: s6_groundwater
  failure_domain: parameter_format
  symptom:
    description: GW bucket perpetually full — Zmax=50m too shallow. Bucket fills instantly,
      pure pass-through, no meaningful groundwater storage dynamics.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Default GWBUCKPARM.nc Zmax=50m is too shallow for large basins. Bucket fills
      within first few days, all recharge passes through as baseflow with zero delay.
    explanation: With Zmax=50m, bucket equilibrium is near surface. Incoming recharge immediately
      becomes baseflow — no damping, no storage. For meaningful GW dynamics, Zmax should be
      100-500m depending on aquifer depth.
    affected_components:
    - GWBUCKPARM.nc Zmax
    - build_groundwater.py
    - GW_DOMAIN1
  resolution:
    action: Increase Zmax to 200-500m for deep aquifer basins, or calibrate against observed
      baseflow recession.
    files_changed: []
    prevention: Document Zmax should be calibrated; default 50m gives minimal GW storage
  severity: degraded
  promoted: true
  promoted_as: dt_v013
- id: err_020
  timestamp: '2026-03-20T20:00:00Z'
  recorded_by: claude
  run_context:
    basin: chaohe
    model: WRF-Hydro
