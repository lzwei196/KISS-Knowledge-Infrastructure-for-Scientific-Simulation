model:
  name: PHREEQC Knowledge Infrastructure
  domain: water_quality
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: Temperature
    unit: Celsius
    format: ''
    source: skill_md
  - name: Pressure
    unit: bar
    format: ''
    source: skill_md
outputs:
  primary:
  - name: Temperature
    unit: Celsius
    format: ''
    source: skill_md
  - name: Concentration
    unit: mg/L (ppm)
    format: ''
    source: skill_md
  - name: total_nitrogen
    canonical_id: total_nitrogen
    unit: mgN/L
  - name: total_phosphorus
    canonical_id: total_phosphorus
    unit: mgP/L
  - name: dissolved_oxygen
    canonical_id: dissolved_oxygen
    unit: mg/L
  - name: chlorophyll_a
    canonical_id: chlorophyll_a
    unit: ug/L
