  severity: degraded
- id: dt_012
  symptom: HTTP error or timeout when downloading LandFire data. No terrain data available.
  diagnosis: 'LandFire API is unavailable, rate-limited, or network issue.; The landfire Python package
    downloads data from USGS LandFire web services. These can be temporarily unavailable, rate-limited,
    or blocked by firewalls. Large area requests may also timeout.

    ; [''landfire package'', ''OperationalFuelLayer'', '
  remedy: 'Retry later, use smaller area, or pre-download GeoTIFFs.; convert_landfire_to_simfire; [''Check
    network connectivity: ping landfire.gov'', ''Try smaller area (e.g., 1000m × 1000m)'', ''Download
    GeoTIFFs manually from https://landfire.gov/viewer/'', ''Use --fuel-tif and --elev-tif flags with
    convert_landfir'
  severity: fatal
- id: dt_013
  symptom: CFD wind field has artifacts, vortices, or unrealistic patterns.
  diagnosis: 'CFD solver not converged due to insufficient training iterations.; The Navier-Stokes CFD
    wind solver requires adequate iterations (time_to_train) to reach steady state. With too few iterations
