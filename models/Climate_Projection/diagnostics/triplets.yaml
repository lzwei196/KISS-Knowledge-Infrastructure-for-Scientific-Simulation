- id: dt_cc_001
  stage: s1_extract_cmip
  failure_domain: dependency_mismatch
  symptom:
    description: No CMIP6 cells match the basin grid — 0 matched cells
    error_pattern: No CMIP6 cells match the basin grid
    detection_method: log_match
  diagnosis:
    root_cause: Basin is outside the China domain of Cmip6BaisCorrect_for_China (73.75-135.25E, 15.25-53.75N)
    explanation: The China bias-corrected product covers only mainland-China land (4,163 cells); basins abroad or in border
      areas outside the mask get no matching cells.
    affected_components:
    - extract_cmip6_basin.py
    - basin_grid.nc
  remedy:
    action: 'Use the global path: fetch_nex_gddp_global.py (NEX-GDDP-CMIP6, 0.25 deg, already BCSD bias-corrected); rename
      its historical output to r1'
    tool_to_run: fetch_nex_gddp_global
    manual_steps:
    - Check basin_grid.nc lat/lon vs the China box
    - 'Else: raw ESGF CMIP6, quantile-mapped to MSWX'
    prevention: Check basin location first
  severity: fatal
  cross_references: []
- id: dt_cc_002
  stage: s1_extract_cmip
  failure_domain: path_resolution
  symptom:
    description: CMIP6 pr file not found for the specified model
    error_pattern: CMIP6 pr file not found
    detection_method: log_match
  diagnosis:
    root_cause: Model name does not match file naming, or model has pr only
    explanation: 'Files: Cor_{Model}_PreDaily.txt, Cor_{Model}_tasmaxDaily.txt; case-sensitive, hyphens (ACCESS-CM2). No tasmax/tasmin:
      CESM2-WACCM, IITM-ESM, CNRM-CM6-1, KACE-1-0-G, MIROC-ES2L.'
    affected_components:
    - extract_cmip6_basin.py
    - CMIP6 file system
  remedy:
    action: Check exact model spelling and that its files exist for the scenario
    tool_to_run: ''
    manual_steps:
    - ls KISSPATH_DATA/CMIP_China/Cmip6BaisCorrect_for_China/pr/r1/
    - ls .../tasmax/r1/ | grep {MODEL}
    prevention: Use the 26-model list in the skill doc (all have pr+tasmax+tasmin)
  severity: fatal
  cross_references: []
- id: dt_cc_003
  stage: s1_extract_cmip
  failure_domain: silent_error
  symptom:
    description: Extracted CMIP6 data has all zeros or unreasonable values for some cells
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Cell matching picked the wrong CMIP6 column (coordinate precision mismatch)
    explanation: 'Grids are 0.25 deg but centres can differ (31.125 vs 31.1250001). Nearest match uses 0.13 deg tolerance:
      too tight misses cells, too loose matches wrong ones.'
    affected_components:
    - extract_cmip6_basin.py
    - Grid coordinate precision
  remedy:
    action: Check matched cell coordinates against the basin grid
    tool_to_run: ''
    manual_steps:
    - Compare output cell_lat/cell_lon with VIC basin_grid.nc
    - If mismatched, adjust the tolerance in extract_cmip6_basin.py (default 0.13 deg)
    prevention: Spot-check a few cells against the raw CMIP6 text file
  severity: silent
  cross_references: []
- id: dt_cc_004
  stage: s2_compute_deltas
  failure_domain: silent_error
  symptom:
    description: All delta values are exactly 1.0 (precipitation) or 0.0 (temperature) — no change signal
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Historical and future inputs are the same, or the periods overlap
    explanation: 'Same scenario in HIST_DIR and FUTURE_DIR (both r1), or overlap like 1981-2010 vs 2000-2029, makes both climatologies
      nearly equal: deltas ~1.0 / ~0.0.'
    affected_components:
    - compute_climate_deltas.py
    - Directory paths and period configuration
  remedy:
    action: Check HIST_DIR has r1 files, FUTURE_DIR has SSP files, and the periods do not overlap
    tool_to_run: ''
    manual_steps:
    - ls {HIST_DIR}/*_r1_*.nc
    - ls {FUTURE_DIR}/*_{ssp}_*.nc
    - REF_PERIOD within 1961-2014, FUTURE_PERIOD within 2015-2099
    prevention: Extract r1 and SSP to one dir; the tool splits by filename
  severity: silent
  cross_references: []
- id: dt_cc_005
  stage: s2_compute_deltas
  failure_domain: silent_error
  symptom:
    description: Precipitation ratio extremely high (>5x) in dry months, causing unrealistic projected precipitation
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Near-zero historical precipitation in arid months gives extreme ratios
    explanation: Dry-month means can be <0.1 mm/day (north China winter). History is floored at 0.1 mm/day, ratios clipped
      to [0.1, 5.0]; the cap can still amplify dry months.
    affected_components:
    - compute_climate_deltas.py
    - Projected forcing in dry months
  remedy:
    action: Inspect delta_pr in dry months; confirm the cap is acceptable for the study
    tool_to_run: ''
    manual_steps:
    - 'Plot delta_pr by month: ~1.0 in wet months, possibly capped in dry months'
    prevention: For very arid basins use additive (mm/day) instead of multiplicative precipitation deltas
  severity: degraded
  cross_references: []
- id: dt_cc_006
  stage: s3_apply_deltas
  failure_domain: dependency_mismatch
  symptom:
    description: 'VIC error: Not enough records in forcing file — projected forcing has wrong time range'
    error_pattern: Not enough records in forcing file
    detection_method: log_match
  diagnosis:
    root_cause: VIC global STARTYEAR/ENDYEAR do not match the projected forcing years
    explanation: Projected forcing has future dates (e.g. 2041-2070); with STARTYEAR=1990 still set, VIC seeks 1990 records
      in files dated 2041 and fails on record count.
    affected_components:
    - global_param_{basin}_{MODEL}_{ssp}.txt
    - Projected forcing files
  remedy:
    action: Set STARTYEAR/ENDYEAR and FORCEYEAR to the future period in a projection global file
    tool_to_run: ''
    manual_steps:
    - STARTYEAR={future_start}, ENDYEAR={future_end}
    - FORCEYEARFIRST/LAST = same years
    - FORCING1 prefix = projected forcing dir
    prevention: One separate global_param file per projection run; never edit the baseline
  severity: fatal
  cross_references: []
- id: dt_cc_007
  stage: s3_apply_deltas
  failure_domain: silent_error
  symptom:
    description: A pass-through variable (wind, pres, srad, lrad, shum) is missing from projected forcing; convert_projected_forcing.py
      stops with 'no NetCDF files for variable(s)'
    error_pattern: no NetCDF files for variable
    detection_method: log_match
  diagnosis:
    root_cause: Pass-through baseline files (pres, srad, lrad, wind, shum) not found
    explanation: Only prec and temp change; the rest are copied. A variable with another prefix or in a subfolder is skipped
      (no output); convert_projected_forcing.py then stops.
    affected_components:
    - apply_deltas_forcing.py
    - Baseline forcing file naming
  remedy:
    action: Make sure all 7 variables (temp, prec, pres, srad, lrad, wind, shum) are in BASELINE_FORCING_DIR
    tool_to_run: ''
    manual_steps:
    - 'ls the forcing_1d dir: 7 prefixes'
    - If a prefix differs (e.g. MSWX), rename the files or edit FORCING_VAR_PREFIXES in apply_deltas_forcing.py to match
    prevention: Check 7 prefixes first
  severity: silent
  cross_references: []
- id: dt_cc_008
  stage: s4_ensemble_analysis
  failure_domain: silent_error
  symptom:
    description: Projected discharge is unreasonably high/low but VIC runs without error — uncalibrated parameters amplify
      climate signal
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Default (uncalibrated) VIC soil parameters exaggerate runoff sensitivity
    explanation: Defaults (binfilt, Ds, Ws) can give NSE<0 in history; +10% precipitation may give +50% runoff. Relative (future/historical)
      changes are fairly robust; absolute values are wrong.
    affected_components:
    - VIC soil parameters
    - All projection runs
  remedy:
    action: Calibrate VIC on observed discharge before projecting; if uncalibrated, report relative changes only
    tool_to_run: ''
    manual_steps:
    - Calibrate with skills/vic_cali_ai/
    - Use the calibrated SOIL_PARAM_COMPLETE.txt in every run
    prevention: Find gauges with find_observed_station.py
  severity: degraded
  cross_references: []
- id: dt_cc_009
  stage: s1_extract_cmip
  failure_domain: runtime
  symptom:
    description: Memory error or very slow processing when reading CMIP6 text files (650+ MB each)
    error_pattern: MemoryError|Killed
    detection_method: log_match
  diagnosis:
    root_cause: Reading a whole 4163-column CMIP6 text file into memory exceeds RAM, worse with several variables
    explanation: Each file is ~650 MB; pandas needs ~2-3 GB per file, ~6-9 GB for 3 variables of one model, more with models
      in parallel.
    affected_components:
    - extract_cmip6_basin.py
    - System RAM
  remedy:
    action: Process one model at a time; read only basin columns (usecols)
    tool_to_run: extract_cmip6_basin
    manual_steps:
    - free -h
    - Run models one after another, not in parallel
    - Confirm usecols reads only basin columns
    prevention: Sequential runs stay under ~2 GB
  severity: fatal
  cross_references: []
- id: dt_cc_010
  stage: s3_apply_deltas
  failure_domain: missing_tool
  symptom:
    description: No dedicated tool for converting projected forcing NC to VIC ASCII format; agent tried process_forcing.py
      which requires manual config editing and hit xr.open_mfdataset time coordinate errors
    error_pattern: combine='by_coords'
    detection_method: missing_output
  diagnosis:
    root_cause: Monthly NC from apply_deltas had no documented NC-to-ASCII tool
    explanation: S3a (apply deltas) was documented but S3b (NC to ASCII) was not; the Bengbu workaround used ad-hoc scripts
      with hardcoded paths that could not be reused for Nuxia.
    affected_components:
    - apply_deltas_forcing.py
    - process_forcing.py
  remedy:
    action: Use convert_projected_forcing.py (CLI, all settings as arguments) for NC to VIC ASCII
    tool_to_run: convert_projected_forcing
    manual_steps: []
    prevention: Registered in the KI manifest; see s3 skill doc Step 3
  severity: fatal
  cross_references: []
