template_version: "3.5"

identity:
  model_id: "RAPID"
  scientific_reference_version: "Matrix-based Muskingum river routing (David et al. 2011, JHM); RAPID main-branch F90 source (2024-era)"
  implementation:
    id: "rapid-fortran-petsc"
    version: "main branch (2024-era; release lineage includes v1.8.0)"
    provenance: "Fortran 90; Cedric H. David (NASA JPL); PETSc/TAO sparse linear algebra with CF-NetCDF I/O."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "BSD-3-Clause"
  repo_url: "https://github.com/c-h-david/rapid"

boundary:
  scope_in:
    - "River channel routing of lateral inflow to reach-level discharge"
    - "Channel storage volume computation per reach"
    - "Muskingum k/x parameter calibration via TAO optimizer"
    - "Kalman-filter data assimilation of runoff"
    - "Optional non-data-driven reservoir/dam routing"
  scope_out:
    - "Generating runoff / land-surface hydrology (taken as input from VIC, Noah, GLDAS, ERA5)"
    - "Building the river connectivity network (sourced from NHDPlus, MERIT-Hydro, HydroSHEDS)"
    - "Hillslope / land-surface processes"
    - "Floodplain inundation (handed off downstream to floodplain models such as CaMa-Flood)"
  spatial: "distributed-stream"
  temporal: "sub-hourly"
  closure: "mass-balance"
  notes: "Mass-conserving Muskingum routing: flow accumulates downstream through a sparse network connectivity matrix. The routing sub-step ZS_dtR (e.g. 900 s) is nested inside a forcing/routing period ZS_TauR (e.g. 10800 s) and a main/output step ZS_dtM (e.g. 86400 s); the model is sub-hourly internally even when output is daily. Muskingum assumes a linear storage-flow relationship with per-reach k, x held constant over the run."

inputs:
  forcing:
    - category: "lateral_inflow"
      name: "Vlat"
      unit: "m3 (accumulated volume over ZS_TauR, NOT a rate)"
      source_kind: "forcing"
      model_input_format: "NetCDF variable Vlat(time, rivid)"
      notes: "Surface+subsurface runoff volume entering each reach per routing period. RAPID internally computes Qlat = Vlat / ZS_TauR; supplying m3/s instead of m3 makes discharge ~ZS_TauR x (e.g. ~10800x) too small (silent). RAPID reads Vlat by position, so the rivid dimension order must match riv_bas_id ordering exactly."
  parameters:
    - category: "muskingum"
      name: "k"
      unit: "seconds"
      source_kind: "calibrated"
      model_input_format: "k_file CSV, one value per reach ordered to riv_bas_id"
      notes: "Muskingum wave travel time (k = length / celerity), typical hundreds to tens of thousands of s (range ~900-360000). Must be seconds not hours; too small relative to dtR drives unstable C1/C2/C3 and KSP divergence."
    - category: "muskingum"
      name: "x"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "x_file CSV, one value per reach"
      notes: "Muskingum attenuation weighting factor in [0, 0.5] (typical 0.1-0.3). x=0 maximizes attenuation; x=0.5 is pure translation. x>0.5 or x as percentage causes negative C3 and oscillating negative discharge."
    - category: "muskingum_scaling"
      name: "kfac / xfac"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "kfac_file / xfac_file CSV (optional)"
      notes: "Multipliers applied to k and x during calibration (kfac ~0.1-10, xfac ~0.1-5, default 1.0)."
    - category: "network_topology"
      name: "rapid_connect"
      unit: "dimensionless (reach IDs / indices)"
      source_kind: "dataset_lookup"
      model_input_format: "CSV: reach_id downstream_id num_upstream up_id_1..n (outlet downstream_id=0, headwater num_upstream=0)"
      notes: "Defines the sparse network connectivity matrix Net (1 where reach j flows into reach i). IS_max_up must equal the actual max upstream count; undersizing overruns array bounds. Circular references cause water to recirculate."
    - category: "network_topology"
      name: "riv_bas_id"
      unit: "dimensionless (reach IDs)"
      source_kind: "dataset_lookup"
      model_input_format: "CSV, one ordered reach ID per line"
      notes: "Ordered list of reaches in the simulated subbasin; fixes the PETSc vector row order for ALL state vectors and must match the Vlat rivid order. IDs must all exist in rapid_connect exactly once or PETSc matrix assembly segfaults."
  initial_conditions:
    - category: "state_restart"
      name: "Qinit"
      unit: "m3/s"
      source_kind: "user_provided"
      model_input_format: "NetCDF Qout(time=1, rivid), read only if BS_opt_Qinit=.true."
      notes: "Initial reach discharge for restart. If absent the model cold-starts all reaches at zero flow (ZS_Qout0=0), requiring days-to-weeks spinup; best practice seeds Qinit from a prior warmup Qfinal. Initial volume defaults to a hardcoded ZS_V0=10000 m3 per reach when no Qinit supplied."
  boundary_conditions:
    - category: "run_mode"
      name: "IS_opt_run"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "namelist integer (1=simulation, 2=optimization, 3=DA forecast, 4=DA analysis)"
      notes: "Selects standard routing vs TAO k/x calibration vs Kalman-filter assimilation phases."
    - category: "routing_method"
      name: "IS_opt_routing"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "namelist integer (1=matrix Muskingum KSP solve, 2=traditional, 3=transboundary, 4=Muskingum operator)"
      notes: "Operator mode (4) prunes small matrix entries via ZS_threshold and gives results that differ from the KSP solve (1) by an approximation that is not documented as accuracy-affecting."
    - category: "temporal_control"
      name: "ZS_TauM / ZS_dtM / ZS_TauR / ZS_dtR"
      unit: "seconds"
      source_kind: "user_provided"
      model_input_format: "namelist reals (e.g. TauM=2592000, dtM=86400, TauR=10800, dtR=900)"
      notes: "Total duration / output step / routing period (=Vlat step) / routing sub-step. Must satisfy divisibility (TauM mod dtM, TauR mod dtR, TauM mod TauR all 0) and TauM/TauR must equal the Vlat time-step count, or runs read past EOF or produce wrong step counts. dtR must satisfy the Courant/Muskingum stability bound."
    - category: "observations"
      name: "Qobs (+ obs_tot_id / obs_use_id)"
      unit: "m3/s"
      source_kind: "user_provided"
      model_input_format: "NetCDF Qobs(time, rivid) + CSV gage ID lists; required when IS_opt_run=2"
      notes: "Observed gage discharge driving TAO calibration of k,x and the Kalman-filter correction. Must be m3/s (cfs mismatch gives +/-100% PBIAS)."
    - category: "optional_forcing"
      name: "Qfor / dam IDs"
      unit: "m3/s (Qfor); dimensionless IDs (dam)"
      source_kind: "user_provided"
      model_input_format: "Qfor_file + for_*_id_file (BS_opt_for); dam_tot_id / dam_use_id CSV (BS_opt_dam)"
      notes: "Optional forced flow at specified reaches and dam-reach lists for the optional non-data-driven reservoir submodel; both off by default."
    - category: "output_toggles"
      name: "BS_opt_V / BS_opt_Qfinal / BS_opt_Qinit / BS_opt_influence"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "Fortran namelist booleans (.true./.false.)"
      notes: "Switch optional outputs (volume V, restart Qfinal, influence diagnostics) and restart read (Qinit) on/off."

processes:
  modules:
    - name: "rapid_main"
      role: "driver"
      brief: "Top-level orchestration: init -> per main step -> per routing period (read Vlat, assemble Qext, route, QtoV, carry init state) -> write -> finalize; branches on IS_opt_run."
    - name: "rapid_init"
      role: "driver"
      brief: "Reads namelist, allocates PETSc objects, builds network/hash/observation matrices, reads k/x and Qinit, computes initial C1/C2/C3."
    - name: "NetworkMatrix"
      role: "process_solver"
      brief: "rapid_net_mat builds the sparse river-network connectivity matrix Net from rapid_connect (Net(i,j)=1 if reach j flows into reach i)."
    - name: "MuskingumCoefficients"
      role: "allocator"
      brief: "rapid_routing_param computes C1=(-kx+dtR/2)/D, C2=(kx+dtR/2)/D, C3=(k(1-x)-dtR/2)/D with D=k(1-x)+dtR/2, and forms A=I-diag(C1)*Net."
    - name: "MuskingumOperator"
      role: "process_solver"
      brief: "rapid_mus_mat builds the explicit operator M=(I-C1*N)^-1 via a nilpotent power-series sum pruned by ZS_threshold."
      applicability: "IS_opt_routing=4"
    - name: "MuskingumRouting"
      role: "integrator"
      brief: "rapid_routing core time-stepping: loops IS_R routing sub-steps, forms RHS b from Net*Qprev plus C-weighted Qext, solves A*Qout=b (KSP / traditional / transboundary / operator per IS_opt_routing), accumulates period-mean Qoutbar."
    - name: "LateralInflowRead"
      role: "process_solver"
      brief: "rapid_read_Vlat_file reads lateral inflow VOLUME (m3) per TauR period into ZV_Vlat; main loop converts Qlat=Vlat/TauR."
    - name: "VolumeAccounting"
      role: "process_solver"
      brief: "rapid_QtoV computes per-reach storage volume V from period-mean discharge and Qext using Muskingum k,x."
      applicability: "BS_opt_V=.true."
    - name: "DamModule"
      role: "optional_module"
      brief: "rapid_get_Qdam computes dam outflow from inflow and storage state (ZV_S_dam bounded by Smin/Smax)."
      applicability: "BS_opt_dam=.true."
    - name: "TAOOptimizer"
      role: "optional_module"
      brief: "rapid_obs_mat / rapid_phiroutine / rapid_cov_mat: minimizes the cost function phi (squared sim-obs error at gages) to calibrate k and x."
      applicability: "IS_opt_run=2"
    - name: "KalmanFilter"
      role: "optional_module"
      brief: "rapid_kf_update / rapid_kf_cov_mat / rapid_kf_obs_mat build Pb/L/H operators and apply dQeb=Pb*H^T*(H*Pb*H^T+R)^-1*(Qobs-HQeb) correction to discharge."
      applicability: "IS_opt_run=3/4"
    - name: "OutputWrite"
      role: "process_solver"
      brief: "rapid_write_Qout_file / rapid_create_Qout_file create and write Qout (and V) in CF-compliant time x rivid NetCDF layout."
  internal_edges:
    - from: "Inputs"
      to: "LateralInflowRead"
      kind: "consumes_input"
      brief: "Vlat_file lateral inflow VOLUME (m3) per TauR period read from NetCDF"
    - from: "LateralInflowRead"
      to: "Vlat"
      kind: "writes_state"
      brief: "fills the ZV_Vlat lateral-inflow-volume vector"
    - from: "Vlat"
      to: "Qext"
      kind: "writes_state"
      brief: "main loop: Qlat = Vlat / ZS_TauR (volume->rate); Qext = Qlat (+Qfor +Qdam +Qhum)"
    - from: "DamModule"
      to: "Qext"
      kind: "writes_state"
      brief: "dam outflow added into Qext when BS_opt_dam"
    - from: "Inputs"
      to: "NetworkMatrix"
      kind: "consumes_input"
      brief: "rapid_connect upstream/downstream topology builds Net"
    - from: "NetworkMatrix"
      to: "MuskingumCoefficients"
      kind: "invokes"
      brief: "A = I - diag(C1)*Net built from the connectivity matrix"
    - from: "Inputs"
      to: "MuskingumCoefficients"
      kind: "consumes_input"
      brief: "k and x per reach used to compute C1/C2/C3 and denominator D"
    - from: "MuskingumCoefficients"
      to: "MuskingumOperator"
      kind: "invokes"
      brief: "M=(I-C1*N)^-1 assembled from C1 when IS_opt_routing=4"
    - from: "Qext"
      to: "MuskingumRouting"
      kind: "consumes_input"
      brief: "external inflow drives the RHS b"
    - from: "MuskingumCoefficients"
      to: "MuskingumRouting"
      kind: "invokes"
      brief: "C1/C2/C3 and A weight Qext and Net*Qprev in the solve"
    - from: "Qout"
      to: "MuskingumRouting"
      kind: "reads_state"
      brief: "Muskingum recurrence on previous-sub-step outflow (Qoutprev)"
    - from: "rapid_main"
      to: "MuskingumRouting"
      kind: "invokes"
      brief: "called once per routing period inside the main loop"
    - from: "MuskingumRouting"
      to: "Qout"
      kind: "writes_state"
      brief: "new instantaneous and period-mean outflow per sub-step"
    - from: "MuskingumRouting"
      to: "VolumeAccounting"
      kind: "invokes"
      brief: "period-mean discharge + Qext passed to rapid_QtoV"
    - from: "VolumeAccounting"
      to: "V"
      kind: "writes_state"
      brief: "per-reach storage volume computed when BS_opt_V"
    - from: "Qout"
      to: "OutputWrite"
      kind: "reads_state"
      brief: "OutputWrite reads final Qout state for NetCDF emission (ZV_QoutR -> rapid_write_Qout_file)"
    - from: "V"
      to: "OutputWrite"
      kind: "reads_state"
      brief: "OutputWrite reads channel-storage volume state for NetCDF emission when BS_opt_V (ZV_VbarR -> rapid_write_V_file)"
    - from: "OutputWrite"
      to: "Outputs"
      kind: "produces_output"
      brief: "Qout (m3/s), V (m3 when BS_opt_V), and Qfinal written to CF-compliant time x rivid NetCDF"
    - from: "Inputs"
      to: "TAOOptimizer"
      kind: "consumes_input"
      brief: "Qobs observations build the observation matrix and cost function phi (IS_opt_run=2)"
    - from: "TAOOptimizer"
      to: "MuskingumCoefficients"
      kind: "invokes"
      brief: "optimizer adjusts k,x, recomputing C1/C2/C3"
    - from: "Inputs"
      to: "KalmanFilter"
      kind: "consumes_input"
      brief: "Qobs observations drive the Kalman correction (IS_opt_run=3/4)"
    - from: "KalmanFilter"
      to: "Qout"
      kind: "writes_state"
      brief: "assimilation correction applied to discharge state before next step"
    - from: "rapid_init"
      to: "MuskingumCoefficients"
      kind: "invokes"
      brief: "computes initial coefficients during setup"
    - from: "rapid_init"
      to: "NetworkMatrix"
      kind: "invokes"
      brief: "builds Net during setup"

states:
  variables:
    - name: "Qout"
      unit: "m3/s"
      role: "prognostic"
    - name: "Qoutprev"
      unit: "m3/s"
      role: "prognostic"
    - name: "Qoutinit"
      unit: "m3/s"
      role: "prognostic"
    - name: "Qoutbar"
      unit: "m3/s"
      role: "diagnostic"
    - name: "V"
      unit: "m3"
      role: "prognostic"
    - name: "Vbar"
      unit: "m3"
      role: "diagnostic"
    - name: "Qext"
      unit: "m3/s"
      role: "diagnostic"
    - name: "Qlat"
      unit: "m3/s"
      role: "diagnostic"
    - name: "Vlat"
      unit: "m3"
      role: "diagnostic"
    - name: "C1, C2, C3"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "Net"
      unit: "dimensionless (sparse matrix)"
      role: "diagnostic"
    - name: "S_dam"
      unit: "m3"
      role: "prognostic"
  provenance: "populated"

outputs:
  - var: "Qout"
    validation_rank: 1
    unit: "m3/s"
    description: "Discharge at the outlet of each river reach per output time step (primary output)."
    emitted_in: "Qout_file (NetCDF, variable Qout(time, rivid))"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Gage discharge at a reach is the canonical target; align timestamps (UTC vs local) before scoring or a 1-day offset can drive NSE strongly negative on flashy reaches."
            - "Convert observations to m3/s (cfs x 0.02832) and confirm obs include total flow not surface runoff only, or PBIAS shifts by a fixed factor."
            - "Discard spinup steps if started from cold (BS_opt_Qinit=.false.)."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single-instant flow comparison is sensitive to timing error and spinup state."]
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Basin-outlet or aggregated-reach flow; routing effects are strong at daily/sub-daily scale but negligible at annual aggregation."]
      detrending_options: ["none"]
  - var: "V"
    validation_rank: 2
    unit: "m3"
    description: "Stored channel water volume per reach, derived from Muskingum flows (written when BS_opt_V=.true.)."
    emitted_in: "V_file (NetCDF, variable V(time, rivid))"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Direct channel-storage observations are rare; V is more often used diagnostically or coupled downstream than validated against obs."]
      detrending_options: ["none"]
  - var: "Qfinal"
    unit: "m3/s"
    description: "Final instantaneous discharge state at end of run, for restart/chaining (written when BS_opt_Qfinal=.true.)."
    emitted_in: "Qfinal_file (NetCDF, variable Qout(time=1, rivid))"
    observability:
      comparable_obs_shapes: []
      detrending_options: ["none"]

influence:
  edges:
    - from: "muskingum_k"
      to: "Qout"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["david2011_rapid_nhdplus", "tavakoly2017_rapid_mississippi", "cortessalazar2023_routing_matters"]
    - from: "muskingum_x"
      to: "Qout"
      sensitivity_grade: "LOW"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["david2011_rapid_nhdplus", "tavakoly2017_rapid_mississippi"]
    - from: "Vlat"
      to: "Qout"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["david2011_rapid_nhdplus", "tavakoly2017_rapid_mississippi"]
    - from: "channel_topography_slope"
      to: "muskingum_k"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["tavakoly2017_rapid_mississippi", "bindas2024_diff_muskingum_cunge"]
    - from: "manning_roughness"
      to: "Qout"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "large rivers (Muskingum-Cunge travel-time form)"
      citations: ["cortessalazar2023_routing_matters", "bindas2024_diff_muskingum_cunge"]
    - from: "reservoir_storage_operation_params"
      to: "Qout"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "BS_opt_dam / reservoir routing enabled"
      citations: ["tavakoly2023_rapid_reservoir"]
  citation_index:
    david2011_rapid_nhdplus:
      short_citation: "David et al. 2011"
      doi: "10.1175/2011JHM1345.1"
      note: "Foundational RAPID paper; matrix Muskingum on NHDPlus with automated k/x estimation against gages; reports K more sensitive than X."
    tavakoly2017_rapid_mississippi:
      short_citation: "Tavakoly et al. 2017"
      doi: "10.1111/1752-1688.12456"
      note: "Continental Mississippi application (>1.2M reaches); K initialized from topography, X held ~fixed; confirms K as dominant routing parameter."
    cortessalazar2023_routing_matters:
      short_citation: "Cortes-Salazar et al. 2023"
      doi: "10.5194/hess-27-3505-2023"
      note: "Larger travel-time/roughness parameters delay peak timing; daily KGE 0.64 (no routing) to 0.81 (optimal); routing effects negligible at annual scale."
    bindas2024_diff_muskingum_cunge:
      short_citation: "Bindas et al. 2024"
      doi: "10.1029/2023WR035337"
      note: "Differentiable Muskingum-Cunge: routed discharge in large rivers sensitive to Manning n and channel geometry that travel-time parameter encodes."
    tavakoly2023_rapid_reservoir:
      short_citation: "Tavakoly et al. 2023"
      doi: "10.1016/j.envsoft.2023.105631"
      note: "Adds non-data-driven reservoir routing to RAPID; downstream discharge sensitive to reservoir storage/operation parameters (median C2M +25-29%)."

safety:
  hazards:
    - id: "vlat_rate_not_volume"
      kind: "weather_file_semantic"
      description: "Vlat supplied as flow rate (m3/s) instead of accumulated volume (m3); RAPID divides by TauR internally, so discharge comes out ~TauR x (~10800x) too small."
      severity: "silent"
    - id: "vlat_runoff_units_or_area"
      kind: "weather_file_semantic"
      description: "mm/day runoff not converted to mm/s (/86400) before volume conversion, or catchment area in km2 not m2 (x1e6); yields discharge 86400x or 1e6x too large."
      severity: "silent"
    - id: "vlat_temporal_mismatch"
      kind: "weather_file_semantic"
      description: "Vlat temporal resolution differs from ZS_TauR (e.g. daily Vlat with TauR=3h); each volume is assigned to one window, creating pulsed input and spurious diurnal/3-hourly oscillation."
      severity: "degraded"
    - id: "vlat_all_zero_mapping_failure"
      kind: "weather_file_semantic"
      description: "Vlat near-zero everywhere because LSM-grid-to-catchment spatial mapping failed; produces a flat baseflow-only hydrograph with no peaks."
      severity: "silent"
    - id: "k_in_hours_not_seconds"
      kind: "coefficient_runtime_silent_fallback"
      description: "Muskingum k authored in hours instead of seconds; with k too small relative to dtR the coefficients C1/C2/C3 go unstable and Qout becomes NaN."
      severity: "fatal"
    - id: "x_out_of_range"
      kind: "coefficient_runtime_silent_fallback"
      description: "Muskingum x exceeds 0.5 or is given as percentage (0-50); C3 becomes strongly negative, producing oscillating negative discharge."
      severity: "degraded"
    - id: "muskingum_courant_violation"
      kind: "numerical_instability"
      description: "k too small relative to ZS_dtR violates k*x <= dtR/2 <= k*(1-x); matrix A=I-C1*Net becomes ill-conditioned and the PETSc KSP solver reports KSP_DIVERGED."
      severity: "fatal"
    - id: "connectivity_missing_id_or_max_up"
      kind: "control_semantic"
      description: "riv_bas_id contains reach IDs absent from rapid_connect, or IS_max_up is smaller than the actual max upstream count; out-of-bounds access segfaults during PETSc matrix assembly."
      severity: "fatal"
    - id: "connectivity_circular_reference"
      kind: "control_semantic"
      description: "Circular references in rapid_connect (a reach lists itself or two reaches point to each other) create feedback loops; water recirculates, giving correct basin totals but wrong per-reach distribution."
      severity: "silent"
    - id: "rivid_order_mismatch"
      kind: "control_semantic"
      description: "rivid ordering in Vlat.nc differs from riv_bas_id; RAPID reads Vlat by position, so inflow is routed to the wrong reaches with no error."
      severity: "silent"
    - id: "temporal_params_nondivisible"
      kind: "control_semantic"
      description: "ZS_TauM/ZS_TauR not equal to the Vlat time-step count, or non-divisible temporal parameters; yields wrong output step count or reads past the Vlat EOF."
      severity: "degraded"
    - id: "namelist_syntax_error"
      kind: "parser_semantic"
      description: "Fortran namelist syntax error (double quotes, missing &NL_namelist start, missing / terminator, trailing comma, relative paths); immediate read-error crash at startup."
      severity: "fatal"
    - id: "cold_start_spinup"
      kind: "initial_condition_semantic"
      description: "BS_opt_Qinit=.false. cold-starts all reaches at zero flow; leading output steps are zero until inflow propagates to the outlet (spinup artifact)."
      severity: "silent"
    - id: "opt_mode_no_obs"
      kind: "control_semantic"
      description: "IS_opt_run=2 (optimization) selected without observation files (or ZS_TauO=0); nothing to optimize, output NetCDF is empty / zero-length time dimension."
      severity: "degraded"
  validation_limits:
    - "Does not generate runoff; discharge accuracy is bounded by the quality of the externally supplied lateral inflow (Vlat) field."
    - "Muskingum assumes a linear storage-flow relationship with per-reach constant k, x; it does not resolve dynamic backwater, floodplain inundation, or nonlinear wave behavior natively."
    - "Routing effects on discharge are strong at daily/sub-daily scale but negligible at annual aggregation, so annual-mean validation cannot diagnose routing skill."
    - "Reservoir/dam behavior is represented only via the optional submodel; without it, regulated rivers are modeled as unregulated."
  warnings:
    - "Sim/obs time offset (UTC vs local) can drive NSE strongly negative on flashy reaches despite a visually reasonable hydrograph."
    - "Flood peaks arrive too early/late when k (celerity) is systematically off; diagnose via cross-correlation lag and recalibrate via kfac or TAO."
    - "Headwater reaches with no upstream inflow correctly show Q ~ Vlat/TauR with little routing effect; this is expected, not a bug."
    - "IS_opt_routing=4 (operator mode) prunes small matrix entries via ZS_threshold and can differ from the KSP solve; treat the threshold as accuracy-affecting."
  assumptions:
    - statement: "Vlat is interpreted as accumulated lateral-inflow VOLUME (m3) over each ZS_TauR period, not a rate; RAPID internally forms Qlat=Vlat/ZS_TauR."
      scope: "lateral inflow forcing input"
      source: "rapid_main.F90 and rapid_read_Vlat_file.F90 (Qlat = Vlat / ZS_TauR); David et al. 2011 (DOI 10.1175/2011JHM1345.1)"
      status: "adopted"
    - statement: "The model is a stateful recursive router: per-reach prior outflow seeds the next step and end-of-main-step state silently carries into the next step, so restart correctness depends on this carry plus Qinit, not on Qinit_file alone."
      scope: "state initialization and restart"
      source: "rapid_main.F90 end-of-main-step carry (QoutinitR := QoutR); RAPID source module structure"
      status: "adopted"
    - statement: "Geometry is a vector river network of discrete reaches with mass-balance closure; no surface energy budget or land-surface process is closed in the model."
      scope: "model closure and geometry"
      source: "RAPID README/Description and rapid_routing.F90 (Muskingum method, McCarthy 1938)"
      status: "adopted"
    - statement: "Default cold-start initial volume is a fixed ZS_V0=10000 m3 per reach and initial outflow ZS_Qout0=0 when no Qinit is supplied."
      scope: "initial conditions"
      source: "rapid_var.F90 hardcoded defaults (ZS_V0=10000, ZS_Qout0=0)"
      status: "tentative"
