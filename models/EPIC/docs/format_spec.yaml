# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: EPIC
  language: fortran
  implementation:
    id: epic-1102
    version: 1102 (official release v2025-05-25)
    provenance: Fortran; USDA / Texas A&M Blackland Research Center EPIC 1102 console binary (epic1102-official_release.exe).
  scientific_reference_version: EPIC 1102 (Environmental Policy Integrated Climate; User's Manual v.1102,
    Doro et al., 2024)
inputs:
  forcing:
  - name: SRAD (solar radiation)
    unit: MJ m-2 day-1
    category: weather
    source_kind: forcing
    model_input_format: daily .DLY fixed-width record (3I4,6F6.2), no column labels; order YEAR MON DAY
      SRAD TMX TMN PRCP RH WSPD
    notes: Range 0.01-900; 999.0 triggers weather-generator backfill. W m-2 vs MJ m-2 day-1 confusion
      silently depresses yields.
  - name: TMX (maximum air temperature)
    unit: degC
    category: weather
    source_kind: forcing
    model_input_format: daily .DLY fixed-width record
    notes: Range -50 to 100; Kelvin input inflates PET to ~6000 mm/yr silently.
  - name: TMN (minimum air temperature)
    unit: degC
    category: weather
    source_kind: forcing
    model_input_format: daily .DLY fixed-width record
  - name: PRCP / RFV (precipitation, required)
    unit: mm day-1
    category: weather
    source_kind: forcing
    model_input_format: daily .DLY fixed-width record
    notes: Range 0-900; raw kg m-2 s-1 input gives yields 10-100x too small silently.
  - name: RH / RHD (relative humidity, fraction) or dew point
    unit: fraction 0-1
    category: weather
    source_kind: forcing
    model_input_format: daily .DLY fixed-width record
  - name: WSPD / U10 (wind velocity at 10 m)
    unit: m s-1
    category: weather
    source_kind: forcing
    model_input_format: daily .DLY fixed-width record
    notes: Penman-Monteith PET is sensitive to wind-speed errors; Hargreaves is more robust.
  - name: CO2 (atmospheric concentration)
    unit: ppm
    category: atmospheric
    source_kind: forcing
    model_input_format: X1 column of .DLY (held constant between provided values) or EPICCONT.DAT control
      default
    notes: Drives radiation-use-efficiency / water-use-efficiency CO2 response; CO2 set to zero causes
      near-zero yield. EPIC's built-in EPICCONT.DAT default CO2 is 370.0 ppm (held constant between any
      X1 values provided in .DLY).
  - name: EVI (vegetation index, optional)
    unit: dimensionless
    category: remote_sensing
    source_kind: forcing
    model_input_format: .DLY column, active only when IEVI flag set
    notes: Range -1 to 1; optional remote-sensing driver.
  parameters:
  - name: Latitude / longitude / elevation / aspect / slope / channel geometry / SCS curve number
    unit: deg, m, m/m, dimensionless
    category: site
    source_kind: dataset_lookup
    model_input_format: .SIT site file
    notes: Slope valid 0.001-0.2 m/m; CN2 75-85 typical for row crops.
  - name: 'Soil profile per layer (up to 10): depth bottom, bulk density, wilting point, field capacity,
      sand/silt/clay, rock fragment, organic C, pH, CEC, Ksat, albedo, hydrologic group, USLE_K'
    unit: mixed (m, t/m3, m3/m3, %, cmol/kg, mm/hr)
    category: soil
    source_kind: dataset_lookup
    model_input_format: .SOL soil file
    notes: Bulk density 1.35-1.55 t/m3 typical; organic C expected as percent (0-100), C/N near 10 and
      N/P near 8. Hydrologic soil group must not be confused with curve number on soil line 2.
  - name: 'Crop parameter database (~58 columns, 150+ crops): harvest index, biomass-energy ratio, leaf-area,
      heat-unit coefficients'
    unit: mixed
    category: crop
    source_kind: dataset_lookup
    model_input_format: CROPCOM.DAT
  - name: 'Global equation/calibration coefficients (S-curve and 64 general parameters: root growth, N
      mineralization, denitrification, CENTURY rates, Hargreaves coefficients, etc.)'
    unit: mixed
    category: calibration
    source_kind: calibrated
    model_input_format: PARM1102.DAT
    notes: Shipped values are Texas A&M Blackland defaults; PARM(13)=0.6 and PARM(38)=0.0032 are model-modified
      Hargreaves PET coefficients (raised from origin 0.5/0.0023).
  - name: Fertilizer / tillage-implement / pesticide databases
    unit: mixed
    category: database
    source_kind: dataset_lookup
    model_input_format: FERT2012.DAT, TILLCOM.DAT, PESTCOM.DAT
  initial_conditions:
  - name: Initial soil water, nitrate/ammonium, organic C/N pools, residue per layer
    unit: mm, kg/ha
    category: soil_state
    source_kind: user_provided
    model_input_format: .SOL profile initial values; first ~2 years treated as spin-up and discarded
    notes: EPIC carries field state forward over the full multi-year run; soil-water pool must equilibrate
      (>=2-yr spin-up) or water-balance residual grows.
  boundary_conditions:
  - name: 'Operation schedule: plant, fertilize, irrigate, harvest, kill, tillage operations'
    unit: date + equipment/crop/material codes + OPV1..OPV9 operation values
    category: management
    source_kind: user_provided
    model_input_format: .OPC fixed-width op lines (YR MO DY equip tractor crop_id context OPV1..OPV9);
      Julian day must match month+day
    notes: Wrong crop or equipment code yields zero/tiny yields silently; OPV6=0 in plant row applies
      a lifetime (not annual) max-N cap from CROPCOM.
  - name: 'Simulation control: NBYR years, start year/month/day, print code IPD, weather-input mode NGN,
      leap-year flag LPYR'
    unit: integer flags
    category: control
    source_kind: user_provided
    model_input_format: EPICCONT.DAT (7 lines)
    notes: NBYR*365 must be <= rows in .DLY or EPIC reads past EOF and crashes.
  - name: PET method selector IET (1=Penman-Monteith, 2=Penman, 3=Priestley-Taylor, 4=Hargreaves, 5=Baier-Robertson)
    unit: method code
    category: control
    source_kind: user_provided
    model_input_format: EPICCONT.DAT control flag
    notes: Penman-Monteith most accurate but wind-sensitive; Hargreaves most robust; Baier-Robertson for
      cold climates.
  - name: Water-erosion equation selector DRV (0=MUST, 2=USLE, 3=MUSS, 4=MUSL, 6=RUSL, 7=RUS2)
    unit: method code
    category: control
    source_kind: user_provided
    model_input_format: EPICCONT.DAT control flag
  - name: Irrigation flag IRR (0=dryland, 1=scheduled, 2=auto-stress, 3=auto-deficit)
    unit: method code
    category: control
    source_kind: user_provided
    model_input_format: EPICCONT.DAT control flag
    notes: At water-surplus monsoon sites auto-irrigation never fires (WS=0) by correct physics.
  - name: Output variable / output-file selection (32 file-class toggles)
    unit: print flags
    category: control
    source_kind: user_provided
    model_input_format: PRNT1102.DAT
    notes: A blank selection block yields 0-byte / header-only output files.
outputs:
  primary:
  - name: YLDG
    unit: t/ha
    description: Annual grain / economic crop yield (reported kg/ha internally, t/ha in .ACY)
    validation_rank: 1
    emitted_in: .ACY
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Discard first ~2 spin-up years; harvest should occur at HUSC 0.9-1.2 or yields are suspect.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/regional yield aggregates carry a technology trend a weather-driven point model cannot
          reproduce; compare detrended trend, not inter-annual r.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-season mean yield at a calibrated field site.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: BIOM
    unit: t/ha
    description: Total above-ground biomass
    validation_rank: 3
    emitted_in: .ACY
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats: []
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Regional biomass aggregates carry a technology trend a weather-driven point model cannot reproduce;
          compare detrended trend, not inter-annual r.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: ET
    unit: mm/yr
    description: Actual evapotranspiration — water flux from the modeled field (soil + crop canopy) to
      the atmosphere
    validation_rank: 2
    emitted_in: .ANN
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Point-scale flux; energy-balance closure is not enforced (demand-side ET).
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Only meaningful when many HLU points are mosaicked to a grid.
      detrending_options:
      - none
  - name: Q
    unit: mm/yr
    description: Surface runoff (surface only; excludes deep percolation and lateral subsurface flow)
    validation_rank: 4
    emitted_in: .ANN
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Do not close P-ET-Q on .ANN; Q is surface runoff only and SSF/PRK are separate columns.
      detrending_options:
      - none
  - name: MUSS/MUST/USLE (water erosion sediment yield)
    unit: Mg/ha
    description: Soil loss by water erosion via the selected MUSLE/USLE/MUSS/MUST/RUSLE equation
    validation_rank: 5
    emitted_in: .ANN
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Equation valid for sediment yield from watersheds up to ~250 km2; RUSLE preferred for slopes
          >20%.
      detrending_options:
      - none
  - name: DN2O / VN2O
    unit: kg/ha
    description: Nitrous-oxide gas emission to the atmosphere from soil denitrification / nitrification
      (annual)
    validation_rank: 6
    emitted_in: .ANN
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Strongly controlled by PARM1102 denitrification coefficients; high parametric uncertainty.
      detrending_options:
      - none
  - name: QNO3 / SNO3 (nitrate loss / soil nitrate)
    unit: kg/ha
    description: Mineral N lost with runoff/leaching and residual soil nitrate
    validation_rank: 7
    emitted_in: .ANN
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
  - name: YOC / TOC (soil organic carbon)
    unit: kg/ha
    description: Organic carbon in sediment / total soil-profile organic carbon (CENTURY)
    validation_rank: 8
    emitted_in: .ANN / .ACN
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - trend_match
        determining_metric: pbias
        caveats:
        - SOC changes are slow; multi-decadal runs needed to resolve a trend.
      detrending_options:
      - none
      - linear_residual
  - name: NPPC
    unit: kg/ha
    description: Crop/vegetation net primary productivity (carbon); VAR(99) = dry matter x 420.0
    validation_rank: 9
    emitted_in: .ANN
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats: []
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Regional NPP aggregates may carry land-use / management trend a weather-driven point model cannot
          reproduce; compare detrended trend, not inter-annual r.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Requires multi-point mosaic to a grid.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  secondary: []
known_issues:
- id: EPIC_001
  symptom: 'EPIC exits immediately or prints "FORMAT ERROR AT LINE ..." into

    the .OUT file. No .ACY or .ANN produced.

    '
  diagnosis: 'A control or site file (SIT/SOL/OPC/DLY) was regenerated from

    scratch from a Python dict instead of copied from a template.

    EPIC uses rigid Fortran fixed-width formats — a single misplaced

    space breaks the read.

    '
  remedy: 'Use the copy-first tools (build_site_file.py, build_soil_file.py,

    build_opc_file.py). Never write fixed-format Fortran files from

    Python dicts. If you have to patch a value, load the template

    text, modify the exact column range, and write it back.

    '
  severity: critical
- id: EPIC_002
  symptom: 'ACY yields are 10-100x too small and .ANN PRCP column is O(1)

    instead of O(1000 mm/yr).

    '
  diagnosis: 'Precipitation in the .DLY file was written in kg m-2 s-1 (CMFD

    raw unit) instead of mm/day.

    '
  remedy: 'Multiply CMFD prec by 86400 before writing to .DLY. The

    convert_forcing_to_epic.py tool does this automatically via

    ki_tools_common.load_forcing. Verify .ANN PRCP column is

    ~500-2000 mm/yr.

    '
  severity: critical
- id: EPIC_003
  symptom: 'PET column in .ANN is ~6000 mm/yr and yields are depressed.

    '
  diagnosis: 'Temperature in .DLY was written in Kelvin (~290) instead of

    degC (~17). PET is inflated.

    '
  remedy: 'Subtract 273.15 from CMFD tmax/tmin before writing. Verify mean

    Tmax on DLY lines reads 15-25C, not 280-300.

    '
  severity: critical
- id: EPIC_004
  symptom: 'Yields unrealistically low even though P and T look correct.

    '
  diagnosis: 'Solar radiation in .DLY was written in W m-2 (CMFD daily mean

    ~180) instead of MJ m-2 day-1 (~15).

    '
  remedy: 'Multiply W m-2 by 0.0864 = MJ m-2 day-1. The heuristic in

    convert_forcing_to_epic.py: if monthly mean > 60, assume W m-2

    and convert. Verify SRAD is 5-30 for temperate latitudes.

    '
  severity: major
- id: EPIC_005
  symptom: 'Yields are 0 or negative in the .ACY. Model runs silently to

    completion.

    '
  diagnosis: 'The crop code in the .OPC plant line is wrong — the wrong row

    of CROPCOM.DAT was selected. Silent because EPIC happily grows

    any crop it finds.

    '
  remedy: 'Always look up crop codes with `select_crop.py --name <NAME>`

    before passing to build_opc_file.py. Cross-check the ACY CPNM

    column in the output — it echoes the crop name EPIC actually ran.

    '
  severity: critical
- id: EPIC_006
  symptom: 'EPIC prints "CANNOT OPEN FILE <xxx.DAT>" and halts.

    '
  diagnosis: 'EPIC reads input files by hard-coded filename from the current

    working directory. Running `wine epic.exe` from a different

    directory does not work.

    '
  remedy: "Run the binary from inside the workspace directory:\n  cd /path/to/workspace && wine ./epic1102-official_release.exe\n\
    run_epic.py does this automatically via cwd=workspace.\n"
  severity: critical
- id: EPIC_007
  symptom: '.ACY shows the right crop name but YLDG is zero or tiny.

    '
  diagnosis: '.OPC plant line used the wrong equipment code. Using a harvest

    code (292) in the plant row means the crop never gets seeded.

    '
  remedy: 'Start from the shipped umstead.OPC template — it has verified

    equip codes (136 plant, 261 fert, 292 harvest, 451 kill).

    '
  severity: major
- id: EPIC_008
  symptom: 'EPIC crashes with "SUBSCRIPT OUT OF RANGE" after the first year.

    '
  diagnosis: 'NBYR in EPICCONT.DAT row 1 col 1 exceeds the number of years

    available in the .DLY file. EPIC reads past EOF.

    '
  remedy: 'Ensure NBYR times 365 <= rows in .DLY. Set NBYR and IYR0 via

    build_control_files.py --nbyr and --iyr0.

    '
  severity: critical
- id: EPIC_009
  symptom: 'Off-by-one date behaviour: crops plant a day early or late.

    '
  diagnosis: 'In the .OPC file, column 10-13 is the Julian day number and must

    match the month+day. Changing MM/DD but not JD causes mismatch.

    '
  remedy: 'build_opc_file.py computes JD from (month, day) via datetime.

    Never set MM/DD and JD separately by hand.

    '
  severity: major
- id: EPIC_010
  symptom: '.ANN Q (runoff) column is zero in a wet basin.

    '
  diagnosis: 'SCS curve number not set or soil bulk density overridden too low

    (<1.2 t/m3). EPIC uses CN from .SIT row 5 and soil props from .SOL.

    '
  remedy: 'Use build_soil_file.py with HWSD-derived bulk density (usually

    1.35-1.55 t/m3). Verify .SIT row 5 has CN 75-85 for row crops.

    '
  severity: major
- id: EPIC_011
  symptom: '"wine: could not load ..." error on first invocation.

    '
  diagnosis: 'Wine is not installed or its prefix is corrupted. Fresh Linux

    VMs need `wine wineboot` once to initialize the prefix.

    '
  remedy: 'sudo apt install wine; wine wineboot; wine --version

    '
  severity: critical
- id: EPIC_012
  symptom: '.ANN IRGA column shows zero even though --mode auto was set.

    '
  diagnosis: 'IRR flag position in EPICCONT.DAT row 2 was edited at the wrong

    column (flag block layout is I5 fields).

    '
  remedy: 'Use configure_irrigation.py which computes the column index

    programmatically. Verify by reading .OUT header — it prints all

    control flags.

    '
  severity: major
- id: EPIC_013
  symptom: '.ANN PRCP column is all zeros and ET equals PET.

    '
  diagnosis: 'The .DLY file contains NaN or sentinel values (-99, 9999) that

    EPIC reads as zeros.

    '
  remedy: 'convert_forcing_to_epic.py validates inputs. Run the

    water_balance_check in parse_outputs.py and check the residual.

    '
  severity: major
- id: EPIC_014
  symptom: 'Output files appear but have 0-byte size or only a header.

    '
  diagnosis: 'PRNT1102.DAT output-variable selection block has all zeros for

    the output file class.

    '
  remedy: 'Start from the shipped PRNT1102.DAT template — never blank it.

    '
  severity: minor
- id: EPIC_015
  symptom: 'SITECOM.DAT has the user''s new SIT file listed, but EPICRUN.DAT

    still points at the shipped site.

    '
  diagnosis: 'EPICRUN.DAT run line has 7 integer columns after the run name:

    SIT WP1 WP5 WND SOL OPS DLY. If any index is wrong EPIC loads

    the wrong file silently.

    '
  remedy: 'Use build_control_files.py which appends new entries AND rewrites

    the run line with matching indexes.

    '
  severity: critical
- id: EPIC_016
  symptom: 'Soil organic C in the .SOL is too high (>5%), inflating N

    mineralization.

    '
  diagnosis: 'HWSD gives organic carbon as g/g. The .SOL format expects

    percent (0-100). Writing g/g gives 100x too little; multiplying

    twice gives 100x too much.

    '
  remedy: 'In build_soil_file.py, multiply g/g by 100 exactly once.

    Typical .SOL organic C values are 0.5-3.0 for ag soils.

    '
  severity: minor
- id: EPIC_017
  symptom: 'Water balance residual (P+IRGA - ET - Q) > 100 mm/yr and growing.

    '
  diagnosis: 'Spin-up too short; soil water pool hasn''t equilibrated.

    '
  remedy: 'Run with at least 2 years of spinup. Discard first 2 years from

    metrics. Check .DWC daily file for soil water drift.

    '
  severity: major
- id: EPIC_018
  symptom: 'ACY shows FTN = fertilizer only in simulation year 1 (full rate applied),

    partial rate in year 2 (remaining quota), then FTN = 0 from year 3 onward —

    even though explicit scheduled fert ops appear in the .OPC for every rotation year.

    '
  diagnosis: 'OPV6 = 0 in the plant operation row causes EPIC to use a default

    max-N-per-crop limit (~200 kg/ha from CROPCOM). This limit is a

    CUMULATIVE LIFETIME cap across the full simulation, not an annual cap.

    Year 1 fert (e.g., 193 kg/ha) consumes nearly all of the 200 kg quota;

    year 2 gets only the 7 kg rem'
  remedy: 'Set OPV6 in the plant row to >= NBYR * annual_fert_rate.

    Example: 11-year run at 193 kg/ha/yr requires OPV6 >= 2123; use 3000

    for safety. In build_opc_file.py or edit_opc.py, pass v6=<value> to

    the plant op. Also set OPC line 2 to "   1 500" (NROT=1) for an

    annual monocrop so there is no duplicate-s'
  severity: critical
- id: EPIC_019
  symptom: 'IRGA = 0 mm/yr in .ACY for ALL simulation years even though IRR = 2

    (auto-irrigation) is set in EPICCONT.DAT, or even though explicit

    scheduled irrigation ops (EQIP=502 FLOODIRR) appear in the .OPC.

    WS (annual water stress) is also 0.000 for all years.

    '
  diagnosis: "Two independent root causes, both produce IRGA=0:\n\n(1) AUTO-IRRIGATION (IRR=2): fires\
    \ only when the daily water-stress\n    index WS_daily > PARM[67] (AIWS threshold). In monsoon-dominated\n\
    \    climates (East Asia, South Asia, W. Africa wet season), summer\n    precipitation fully meets\
    \ peak ET demand,"
  remedy: "(1) For monsoon sites where WS=0: irrigation cannot meaningfully\n    improve simulated yield\
    \ through the irrigation pathway. The\n    yield gap vs. observed is driven by crop parameter miscalibration\n\
    \    (PHU, harvest index, radiation use efficiency for local cultivars),\n    not water stress. Do\
    \ NOT "
  severity: major
- id: EPIC_020
  symptom: 'Verifier requests basin-routed river discharge (m3/s, daily) such as

    GloFAS or GRDC at a gauge draining thousands of km2, but EPIC''s only

    hydrologic flux output is .ANN Q = point-scale SURFACE RUNOFF ONLY

    (mm/yr). All metrics return null because no temporal/scale overlap

    can be constructed.

    '
  diagnosis: 'Wrong-variable + wrong-scale. EPIC 1102 is a 0-D point field-scale

    agro-ecosystem model (single homogeneous HLU <=100 ha). dag.yaml

    scope_out excludes "Channel routing across heterogeneous areas" and

    "Spatially distributed / gridded simulation". No EPIC output and no KI

    tool maps point surface runof'
  remedy: 'SKIP (no retry). Switching cultivar/forcing/parameters cannot make a

    point crop-field model emit routed river discharge. The only valid

    hydrologic obs for EPIC is point_time_series surface-runoff (mm), and

    do NOT close P-ET-Q on .ANN Q (it excludes percolation/lateral flow).

    Route basin m3/s dischar'
  severity: info
- id: EPIC_021
  symptom: 'HUSC printed on the harvest line of the .OUT run log is outside the

    dag''s 0.9-1.2 band (observed 1.10 and 1.45 for spring maize at

    Changchun, Jilin), so the dag caveat marks the yields as suspect --

    even though the run completes cleanly and the .ACY looks plausible.

    '
  diagnosis: 'OPV1 of the PLANT operation is the crop''s PHU (Potential Heat Units)

    that defines maturity; HUSC = accumulated HU / PHU. build_opc_file.py

    hard-coded OPV1 = 1550 -- the value inherited from the shipped umstead

