template_version: "3.5"

identity:
  model_id: "FSM2"
  scientific_reference_version: "FSM2 (Flexible Snow Model) 2.1.x lineage; Essery et al. 2025 (GMD 18, 3583-3605) forest-canopy extension of FSM 1.0 (Essery 2015)"
  implementation:
    id: "fsm2"
    version: "2.1.2"
    provenance: "Fortran 90 with C-preprocessor compile-time physics switches; R. Essery, University of Edinburgh."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: ""  # _reason: No LICENSE file in repo (raw LICENSE URL HTTP 404); README and FSMuser/FSMsci do not declare a license — license is unknown, not omitted.
  repo_url: "https://github.com/RichardEssery/FSM2"

boundary:
  scope_in:
    - "Multi-layer snowpack energy and mass balance (accumulation and melt) on the ground"
    - "Snow in forest canopies: interception, unloading, melt drip, sub-canopy radiation/wind"
    - "Multi-layer soil heat conduction with freeze/thaw under the snow"
    - "Surface and canopy energy fluxes (sensible, latent, radiative, melt)"
    - "Snow microstructure and bulk evolution (albedo, density/compaction, grain growth, liquid water)"
  scope_out:
    - "Lateral snow redistribution / blowing-snow transport between points (wind transport rate hardwired to 0)"
    - "Glacier / firn dynamics"
    - "Generation of driving meteorology (forcing must be supplied externally)"
    - "Inter-point lateral exchange (multi-point runs are independent columns)"
  spatial: "0-D point"
  temporal: "hourly"
  closure: "both"
  notes: "Point / multi-point 1-D vertical column (Nsmax=3 snow layers over Nsoil=4 soil layers, 1-2 canopy layers via CANMOD); multi-point runs are independent columns with no lateral exchange. Surface energy balance is solved iteratively to |error| < 0.01 W m-2 (~4-10 iterations); layer mass and energy are conserved on merge/split and snow liquid water via implicit upwind + Newton-Raphson. Mass-balance closure applies to snow water (Sf - Melt - subl - Roff ~= dSWE) and energy-balance closure to the surface/soil column. ASCII output supports Npnts>1; NetCDF output (PROFNC=1) is restricted to Npnts=1."

inputs:
  forcing:
    - {category: forcing, name: "SW", unit: "W m-2", source_kind: forcing, model_input_format: "DRIV1D=1 space-delimited ASCII met file, no header, one row per timestep (col 5)", notes: "Incoming shortwave; must be >=0. Treated as all-diffuse unless SWPART=1, which splits diffuse/direct via solar position."}
    - {category: forcing, name: "LW", unit: "W m-2", source_kind: forcing, model_input_format: "met file col 6", notes: "Incoming longwave; physical range ~50-600 W m-2."}
    - {category: forcing, name: "Sf", unit: "kg m-2 s-1", source_kind: forcing, model_input_format: "met file col 7 (DRIV1D=1); cols 7-8 are Rf,Sf order-swapped in DRIV1D=2 ESM-SnowMIP", notes: "Snowfall rate; reduced by canopy interception (INTERCEPT modifies Sf inout) before reaching the snowpack when VAI>0."}
    - {category: forcing, name: "Rf", unit: "kg m-2 s-1", source_kind: forcing, model_input_format: "met file col 8 (DRIV1D=1)", notes: "Rainfall rate. ENSMBL perturbed-driving path re-derives rain/snow split from a Tc rule, overriding the forcing Rf/Sf phase."}
    - {category: forcing, name: "Ta", unit: "K", source_kind: forcing, model_input_format: "met file col 9", notes: "Air temperature in Kelvin; physical range 200-330 K."}
    - {category: forcing, name: "RH", unit: "% (0-100)", source_kind: forcing, model_input_format: "met file col 10 (DRIV1D=1)", notes: "Relative humidity. Converted internally to specific humidity Qa via Magnus formula using Ps; the raw RH is consumed in FSM2_DRIVE and does not reach the physics. DRIV1D=2 reads Qa directly."}
    - {category: forcing, name: "Ua", unit: "m s-1", source_kind: forcing, model_input_format: "met file col 11", notes: "Wind speed; floored to a minimum 0.1 m s-1 inside FSM2_DRIVE."}
    - {category: forcing, name: "Ps", unit: "Pa", source_kind: forcing, model_input_format: "met file col 12", notes: "Surface air pressure; physical range ~40000-110000 Pa; used in the RH->Qa conversion."}
  parameters:
    - {category: snow_albedo, name: "asmn", unit: "-", source_kind: default, model_input_format: "&params namelist", notes: "Minimum (melting) snow albedo, default 0.5."}
    - {category: snow_albedo, name: "asmx", unit: "-", source_kind: default, model_input_format: "&params namelist", notes: "Maximum (fresh) snow albedo, default 0.85."}
    - {category: snow_density, name: "rhof", unit: "kg m-3", source_kind: default, model_input_format: "&params namelist", notes: "Fresh snow density, default 100 (DENSTY=1/2)."}
    - {category: snow_density, name: "rfix", unit: "kg m-3", source_kind: default, model_input_format: "&params namelist", notes: "Fixed snow density, default 300 (DENSTY=0)."}
    - {category: snow_density, name: "rhow", unit: "kg m-3", source_kind: default, model_input_format: "&params namelist", notes: "Wind-packed snow density, default 300 (DENSTY=1,2)."}
    - {category: snow_cover, name: "hfsn", unit: "m", source_kind: default, model_input_format: "&params namelist", notes: "Snow-cover-fraction depth scale, default 0.1."}
    - {category: snow_thermal, name: "kfix", unit: "W m-1 K-1", source_kind: default, model_input_format: "&params namelist", notes: "Fixed snow thermal conductivity, default 0.24 (CONDCT=0)."}
    - {category: snow_microstructure, name: "rgr0", unit: "m", source_kind: default, model_input_format: "&params namelist", notes: "Fresh snow grain radius, default 5e-5."}
    - {category: snow_hydrology, name: "Wirr", unit: "-", source_kind: default, model_input_format: "&params namelist", notes: "Irreducible liquid water content of snow, default 0.03 (HYDROL=1,2)."}
    - {category: roughness, name: "z0sn", unit: "m", source_kind: default, model_input_format: "&params namelist", notes: "Snow surface roughness length, default 0.001."}
    - {category: roughness, name: "z0sf", unit: "m", source_kind: default, model_input_format: "&params namelist", notes: "Snow-free surface roughness length, default 0.1."}
    - {category: soil_surface, name: "gsat", unit: "m s-1", source_kind: default, model_input_format: "&params namelist", notes: "Surface conductance for saturated soil, default 0.01."}
    - {category: ground, name: "alb0", unit: "-", source_kind: user_provided, model_input_format: "&veg namelist (per point)", notes: "Snow-free ground albedo, default 0.2."}
    - {category: canopy, name: "vegh", unit: "m", source_kind: user_provided, model_input_format: "&veg namelist (per point)", notes: "Canopy height; 0 for open site. Requires VAI>0 to have radiative effect."}
    - {category: canopy, name: "VAI", unit: "-", source_kind: user_provided, model_input_format: "&veg namelist (per point)", notes: "Vegetation area index; 0 = open, conifer 3-6. Drives canopy presence, interception capacity, transmission, longwave."}
    - {category: soil, name: "fcly", unit: "fraction 0-1", source_kind: dataset_lookup, model_input_format: "&params namelist", notes: "Soil clay fraction, default 0.3. Feeds Cosby-style pedotransfer (b, Vsat, sathh) computed once in the main program, not per timestep."}
    - {category: soil, name: "fsnd", unit: "fraction 0-1", source_kind: dataset_lookup, model_input_format: "&params namelist", notes: "Soil sand fraction, default 0.6; fcly+fsnd<=1. Note hcon_soil derivation uses (1-fcly) as the sand exponent (apparent internal inconsistency)."}
    - {category: site, name: "lat", unit: "degrees", source_kind: user_provided, model_input_format: "&drive namelist", notes: "Latitude in degrees, converted to radians internally (lat_rad = pi/180 * lat_deg). Used only when SWPART=1."}
    - {category: site, name: "zT", unit: "m", source_kind: user_provided, model_input_format: "&drive namelist", notes: "Temperature/humidity measurement height."}
    - {category: site, name: "zU", unit: "m", source_kind: user_provided, model_input_format: "&drive namelist", notes: "Wind speed measurement height."}
    - {category: layering, name: "Dzsnow", unit: "m", source_kind: default, model_input_format: "&gridlevs namelist", notes: "Minimum snow layer thicknesses, default 0.1,0.2,0.4 (assigned only when Nsmax=3)."}
    - {category: layering, name: "Dzsoil", unit: "m", source_kind: default, model_input_format: "&gridlevs namelist", notes: "Soil layer thicknesses, default 0.1,0.2,0.4,0.8 (assigned only when Nsoil=4)."}
  initial_conditions:
    - {category: snow_state, name: "Nsnow", unit: "-", source_kind: user_provided, model_input_format: "&initial namelist / start_file dump", notes: "Number of active snow layers; cold-start = 0 (no snow) when no dump file."}
    - {category: snow_state, name: "albs", unit: "-", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial snow albedo; cold-start init 0.8."}
    - {category: snow_state, name: "Dsnw", unit: "m", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial snow layer thicknesses."}
    - {category: snow_state, name: "Sice", unit: "kg m-2", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial ice content of snow layers."}
    - {category: snow_state, name: "Sliq", unit: "kg m-2", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial liquid content of snow layers."}
    - {category: snow_state, name: "Rgrn", unit: "m", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial snow grain radii; cold-start init rgr0=5e-5."}
    - {category: snow_state, name: "Tsnow", unit: "K", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial snow layer temperatures; cold-start init 273."}
    - {category: soil_state, name: "Tsoil", unit: "K", source_kind: user_provided, model_input_format: "&initial / dump (Tprf)", notes: "Initial soil layer temperatures; default 285."}
    - {category: soil_state, name: "Vsmc", unit: "m3 m-3", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial volumetric soil moisture; cold-start init fsat*Vsat (fsat default 0.5)."}
    - {category: surface_state, name: "Tsrf", unit: "K", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial surface temperature."}
    - {category: canopy_state, name: "Sveg", unit: "kg m-2", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial canopy snow mass; -999 sentinel where VAI=0."}
    - {category: canopy_state, name: "Tveg", unit: "K", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial vegetation layer temperatures; init 285, -999 where VAI=0."}
    - {category: canopy_state, name: "Tcan", unit: "K", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial canopy air space temperatures; init 285."}
    - {category: canopy_state, name: "Qcan", unit: "kg kg-1", source_kind: user_provided, model_input_format: "&initial / dump", notes: "Initial canopy air space specific humidities; init 0."}
  boundary_conditions:
    - {category: structural_option, name: "ALBEDO", unit: "-", source_kind: user_provided, model_input_format: "compile-time C-preprocessor switch (OPTS.h / compil.sh)", notes: "1=diagnostic (temperature) / 2=prognostic (age decay + snowfall refresh) snow albedo."}
    - {category: structural_option, name: "DENSTY", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "0=fixed / 1=age-compaction / 2=overburden snow density evolution."}
    - {category: structural_option, name: "CONDCT", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "0=fixed kfix / 1=density-dependent (Yen 1981) snow thermal conductivity."}
    - {category: structural_option, name: "HYDROL", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "0=free-draining / 1=bucket / 2=gravitational drainage snow hydrology."}
    - {category: structural_option, name: "SGRAIN", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "1=temperature / 2=temperature-gradient grain metamorphism."}
    - {category: structural_option, name: "SNFRAC", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "1=linear / 2=tanh / 3=asymptotic snow-cover-fraction parameterization."}
    - {category: structural_option, name: "EXCHNG", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "0=neutral fixed exchange / 1=Monin-Obukhov stability correction of turbulent exchange."}
    - {category: structural_option, name: "CANMOD", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "1=single canopy layer / 2=two canopy layers."}
    - {category: structural_option, name: "CANRAD", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "1=Beer-Lambert / 2=two-stream canopy radiative transfer."}
    - {category: structural_option, name: "CANINT", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "1=linear / 2=nonlinear (exponential saturation) canopy snow interception."}
    - {category: structural_option, name: "CANUNL", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "1=time/melt-dependent / 2=temperature/wind-driven canopy snow unloading."}
    - {category: structural_option, name: "SWPART", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "0=all SW diffuse (solar elevation forced 0) / 1=solar-position diffuse/direct split. Default 0 is a silent partitioning pitfall."}
    - {category: structural_option, name: "ZOFFST", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "0=height above ground / 1=height above canopy top for measurement heights."}
    - {category: structural_option, name: "DRIV1D", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "1=FSM native met format / 2=ESM-SnowMIP format (column order and humidity handling differ)."}
    - {category: structural_option, name: "PROFNC", unit: "-", source_kind: user_provided, model_input_format: "compile-time switch", notes: "0=ASCII output / 1=NetCDF profile output (valid only for Npnts=1)."}
    - {category: grid, name: "Npnts", unit: "-", source_kind: user_provided, model_input_format: "&gridpnts namelist", notes: "Number of independent simulation points; must match length of each &veg array. Default 1."}
    - {category: time, name: "dt", unit: "s", source_kind: user_provided, model_input_format: "&drive namelist", notes: "Timestep, default 3600 s; must match the forcing interval."}
    - {category: restart, name: "start_file", unit: "-", source_kind: user_provided, model_input_format: "&initial namelist", notes: "Optional restart dump file; if absent the model cold-starts with no snow."}

processes:
  modules:
    - {name: "FSM2_DRIVE", role: "driver", brief: "Reads one met record per step (DRIV1D format), converts RH->specific humidity Qa via Magnus formula using Ps, floors Ua at 0.1 m/s, and optionally splits SW into diffuse/direct."}
    - {name: "SOLARPOS", role: "process_solver", brief: "Computes solar azimuth/elevation from date/time/latitude.", applicability: "SWPART=1"}
    - {name: "FSM2_TIMESTEP", role: "integrator", brief: "Orchestrates one timestep at one point by invoking CANOPY -> SWRAD -> THERMAL -> SRFEBAL -> INTERCEPT -> SNOW -> SOIL in fixed order."}
    - {name: "CANOPY", role: "process_solver", brief: "Computes canopy layer heat capacities, snow-cover fractions, area indices and snow capacities from VAI and intercepted snow.", applicability: "VAI>0"}
    - {name: "SWRAD", role: "process_solver", brief: "Shortwave radiative transfer: evolves prognostic snow albedo (ALBEDO), canopy Beer/two-stream transmission, partitions absorbed SW between surface and vegetation."}
    - {name: "TWOSTREAM", role: "process_solver", brief: "Two-stream canopy shortwave radiative-transfer solver.", applicability: "CANRAD=2"}
    - {name: "THERMAL", role: "process_solver", brief: "Computes thermal conductivities and heat capacities of snow and soil layers incl. soil freezing; defines the composite surface layer (Ds1,ks1,Ts1) and surface conductance gs1."}
    - {name: "SRFEBAL", role: "process_solver", brief: "Surface + canopy energy balance: iterates surface/canopy/veg temperatures with turbulent exchange to produce H, LE, LWout, Melt, subl, Gsrf and subcanopy diagnostics."}
    - {name: "PSIMH", role: "process_solver", brief: "Monin-Obukhov stability functions for turbulent exchange.", applicability: "EXCHNG=1"}
    - {name: "QSAT", role: "process_solver", brief: "Saturation specific humidity calculation used by the energy balance."}
    - {name: "INTERCEPT", role: "process_solver", brief: "Canopy snow mass balance: interception (reduces ground snowfall), sublimation, melt drip and unloading.", applicability: "VAI>0"}
    - {name: "SNOW", role: "process_solver", brief: "Snowpack thermodynamics and hydrology: layer temperatures, compaction/density, grain growth, melt/refreeze, water routing, relayering; outputs Gsoil, Roff, snd, snw and modifies Tsoil(1)."}
    - {name: "SOIL", role: "process_solver", brief: "Updates soil-layer temperatures via an implicit (tridiagonal) heat-diffusion solve driven by Gsoil from SNOW."}
    - {name: "FSM2_PARAMS", role: "allocator", brief: "Sets default vegetation/snow/soil/ensemble parameters then applies &params namelist overrides; populates the global PARAMETERS module."}
    - {name: "TRIDIAG", role: "process_solver", brief: "Thomas tridiagonal solver used by SOIL and SNOW for implicit heat-conduction systems."}
    - {name: "LUDCMP", role: "process_solver", brief: "LU decomposition solver used by the two-stream canopy radiation scheme."}
  internal_edges:
    - {from: "Inputs", to: "FSM2_DRIVE", kind: consumes_input, brief: "Reads year/month/day/hour SW LW Sf Rf Ta RH Ua Ps from the met file (DRIV1D=1)."}
    - {from: "Inputs", to: "FSM2_PARAMS", kind: consumes_input, brief: "&params namelist overrides default vegetation/snow/soil parameters."}
    - {from: "FSM2_DRIVE", to: "SOLARPOS", kind: invokes, brief: "Solar position requested for diffuse/direct SW partition when SWPART=1."}
    - {from: "FSM2_DRIVE", to: "FSM2_TIMESTEP", kind: produces_output, brief: "Per-step met (LW,Ps,Qa,Rf,Sdif,Sdir,Sf,Ta,Ua,elev) passed into the physics integrator."}
    - {from: "FSM2_TIMESTEP", to: "CANOPY", kind: invokes, brief: "First physics call each step; computes canopy properties from Sveg,Tveg,VAI."}
    - {from: "CANOPY", to: "SWRAD", kind: produces_output, brief: "Canopy fractions and leaf area (fcans,lveg) passed to shortwave radiation."}
    - {from: "FSM2_TIMESTEP", to: "SWRAD", kind: invokes, brief: "Computes absorbed SW and updates snow albedo state."}
    - {from: "SWRAD", to: "TWOSTREAM", kind: invokes, brief: "Canopy two-stream radiative transfer when CANRAD=2."}
    - {from: "SWRAD", to: "albs", kind: writes_state, brief: "Snow albedo state evolved inside the radiation module."}
    - {from: "FSM2_TIMESTEP", to: "THERMAL", kind: invokes, brief: "Computes ksnow, ksoil, csoil and the surface composite Ds1,ks1,Ts1,gs1."}
    - {from: "THERMAL", to: "SRFEBAL", kind: produces_output, brief: "Surface layer Ds1,ks1,Ts1 and conductance gs1 feed the energy balance (gs1 may be uninitialized if Vsmc(1)~0)."}
    - {from: "FSM2_TIMESTEP", to: "SRFEBAL", kind: invokes, brief: "Iterates surface/canopy energy balance; produces H,LE,LWout,Melt,subl,Gsrf,Eveg."}
    - {from: "SRFEBAL", to: "PSIMH", kind: invokes, brief: "Stability correction of turbulent exchange when EXCHNG=1."}
    - {from: "SRFEBAL", to: "QSAT", kind: invokes, brief: "Saturation humidity for latent-heat / sublimation terms."}
    - {from: "SRFEBAL", to: "Tsrf", kind: writes_state, brief: "Surface temperature updated."}
    - {from: "SRFEBAL", to: "Tveg", kind: writes_state, brief: "Vegetation/canopy layer temperatures updated."}
    - {from: "FSM2_TIMESTEP", to: "INTERCEPT", kind: invokes, brief: "Canopy snow mass balance; returns drip, svg, unload."}
    - {from: "SRFEBAL", to: "INTERCEPT", kind: produces_output, brief: "Veg moisture flux (Eveg) and Melt drive canopy snow sublimation/melt."}
    - {from: "INTERCEPT", to: "Inputs", kind: writes_state, brief: "Reduces the ground snowfall forcing Sf (intent(inout)) by the canopy-intercepted amount before SNOW receives it (VAI>0)."}
    - {from: "INTERCEPT", to: "Sveg", kind: writes_state, brief: "Canopy snow mass state updated."}
    - {from: "INTERCEPT", to: "SNOW", kind: produces_output, brief: "Drip (canopy meltwater) and unloaded snow added to the ground snowpack inputs."}
    - {from: "FSM2_TIMESTEP", to: "SNOW", kind: invokes, brief: "Snow thermodynamics + hydrology; updates Dsnw,Sice,Sliq,Tsnow,Rgrn,Nsnow."}
    - {from: "SRFEBAL", to: "SNOW", kind: produces_output, brief: "Gsrf (surface heat flux), Esrf and Melt drive snowpack energy/mass."}
    - {from: "SNOW", to: "Tsoil", kind: writes_state, brief: "SNOW reads and modifies Tsoil(1) (inout) for snow-base heat exchange — cross-module state write."}
    - {from: "SNOW", to: "SOIL", kind: produces_output, brief: "Gsoil = U*(Tsnow(n)-Tsoil(1)) computed in SNOW and passed to the soil solver within the same step."}
    - {from: "SNOW", to: "TRIDIAG", kind: invokes, brief: "Tridiagonal solve for snow-layer temperature increments."}
    - {from: "FSM2_TIMESTEP", to: "SOIL", kind: invokes, brief: "Implicit soil heat diffusion; last physics call of the timestep."}
    - {from: "SOIL", to: "Tsoil", kind: writes_state, brief: "Updates all soil-layer temperatures via the tridiagonal solve."}
    - {from: "SOIL", to: "TRIDIAG", kind: invokes, brief: "Thomas algorithm for the soil temperature linear system."}
    - {from: "TWOSTREAM", to: "LUDCMP", kind: invokes, brief: "LU decomposition for the two-stream radiative system."}
    - {from: "THERMAL", to: "Soil", kind: reads_state, brief: "Reads global derived soil props (b,Vsat,sathh,Vcrit,hcap_soil,hcon_soil) for soil thermal/freezing calc."}
    - {from: "SNOW", to: "Outputs", kind: produces_output, brief: "snd, snw, Melt, Roff, subl written to flux/stat files."}
    - {from: "SOIL", to: "Outputs", kind: produces_output, brief: "Tsoil written to stat file."}

states:
  variables:
    - {name: "snw", unit: "kg m-2", role: prognostic}
    - {name: "snd", unit: "m", role: diagnostic}
    - {name: "Nsnow", unit: "-", role: prognostic}
    - {name: "Dsnw", unit: "m", role: prognostic}
    - {name: "Sice", unit: "kg m-2", role: prognostic}
    - {name: "Sliq", unit: "kg m-2", role: prognostic}
    - {name: "Tsnow", unit: "K", role: prognostic}
    - {name: "Rgrn", unit: "m", role: prognostic}
    - {name: "albs", unit: "-", role: prognostic}
    - {name: "Tsoil", unit: "K", role: prognostic}
    - {name: "Vsmc", unit: "m3 m-3", role: prognostic}
    - {name: "Tsrf", unit: "K", role: prognostic}
    - {name: "Sveg", unit: "kg m-2", role: prognostic}
    - {name: "Tveg", unit: "K", role: prognostic}
    - {name: "Tcan", unit: "K", role: prognostic}
    - {name: "Qcan", unit: "kg kg-1", role: prognostic}
    - {name: "b", unit: "-", role: diagnostic}
    - {name: "Vsat", unit: "m3 m-3", role: diagnostic}
    - {name: "sathh", unit: "m", role: diagnostic}
    - {name: "Vcrit", unit: "m3 m-3", role: diagnostic}
    - {name: "hcap_soil", unit: "J K-1 m-3", role: diagnostic}
    - {name: "hcon_soil", unit: "W m-1 K-1", role: diagnostic}
  provenance: "populated"

outputs:
  - var: "snw"
    validation_rank: 1
    unit: "kg m-2"
    description: "Snow water equivalent (SWE)"
    emitted_in: "{runid}stat.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Point-scale column; obs must be a co-located SWE record (pillow/course). Snow-cover-duration / melt-out timing is a key skill target."]
      detrending_options: ["none"]
  - var: "snd"
    validation_rank: 2
    unit: "m"
    description: "Snow depth"
    emitted_in: "{runid}stat.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
