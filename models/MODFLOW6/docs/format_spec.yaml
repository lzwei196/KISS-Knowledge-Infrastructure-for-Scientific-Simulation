- id: dt_mf6_013
  symptom: Recharge or pumping rates do not correspond to the correct time periods. Seasonal patterns
    are shifted. Summer recharge appears in winter stress periods.
  diagnosis: Stress period indices in MODFLOW do not align with the time periods of VIC output. Off-by-one
