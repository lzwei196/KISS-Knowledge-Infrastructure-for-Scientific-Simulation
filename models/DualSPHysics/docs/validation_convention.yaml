# Grounded only in fetched/open cached full texts. The DualSPHysics coastal/wave
# validation literature normally reports RMSE, relative error, R2, amplitude/phase
# factors, Taylor metrics, or skill index rather than NSE/PBIAS. Where the dag's
# determining_metric is not the field convention, the block says so and uses the
# reported benchmark metric instead. No numeric band below is uncited.

