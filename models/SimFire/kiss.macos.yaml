kiss_manifest_version: 1
model: SimFire
binary_type: Python
verified: unverified
install_dir: SimFire
acquire:
  strategy: pip
  package: git+https://github.com/mitrefireline/simfire.git@5d76a16de45e7058e5080f2cf4c5b5b2f9f1d0ae
  produces: simfire
python_deps:
- numpy
- rasterio
- xarray
- geopandas
- requests
reference_case: python -c "from simfire.sim.simulation import FireSimulation; print(FireSimulation)"
notes: Adapted from Windows branch fbed40b installation configuration on 2026-09-08.
  Mac installation verification is pending.
agent_hint: Install the pinned official source in a workspace Python 3.9 environment;
  upstream requires >=3.9,<3.10. Keep setuptools==80.9.0 because this revision imports
  pkg_resources. Build the real noise dependency with native macOS tools if a wheel
  is unavailable. Keep the original POSIX wurlitzer import on macOS; no Windows portability
  patches apply. Install all upstream dependencies and KI imports in the recorded
  environment, run pip check, and import simfire.sim.simulation headlessly. Do not
  run a fire simulation.
