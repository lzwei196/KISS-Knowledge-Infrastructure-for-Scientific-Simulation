model:
  name: LPJ
  domain: biosphere
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: VP
    unit: hPa
    format: ''
    source: skill_md
  - name: Rh
    unit: umol/m2/s
    format: ''
    source: skill_md
  - name: Temperature
    unit: unknown
    format: ''
    source: skill_md
  - name: Precipitation
    unit: unknown
    format: ''
    source: skill_md
outputs:
  primary:
  - name: Temperature
    unit: unknown
    format: ''
    source: skill_md
  - name: npp
    canonical_id: npp
    unit: gC/m2/day
  - name: biomass
    canonical_id: biomass
    unit: kgC/m2
  - name: leaf_area_index
    canonical_id: leaf_area_index
    unit: m2/m2
  - name: soil_carbon
    canonical_id: soil_carbon
    unit: kgC/m2
