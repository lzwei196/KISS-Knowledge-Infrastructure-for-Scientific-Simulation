          comparison_mode: "categorical_event_comparison"
          metric_families:
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Regime classification (sub/super/critical) and hydraulic-jump location, compared against observed regime evidence."
      detrending_options:
        - "none"
  - var: "shear_stress_channel"
    validation_rank: 8
    unit: "lb/ft^2 or Pa"
    description: "Channel-bed shear stress."
    emitted_in: "<prj>.pNN.tmp.hdf at /Results/.../Additional Variables/Shear Channel"
