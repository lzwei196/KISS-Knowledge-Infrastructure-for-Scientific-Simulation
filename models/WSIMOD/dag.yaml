template_version: "3.5"

identity:
  model_id: "WSIMOD"
  scientific_reference_version: "WSIMOD (Water Systems Integrated Modelling framework), node-arc message-passing integrated water-cycle model per Dobson et al. 2024 GMD (CityWat urban + CatchWat rural lineage)"
  implementation:
    id: "wsimod"
    version: "0.8.1"
    provenance: "Python; WSIMOD package (Barnaby Dobson / Imperial College London), node-arc VQIP message-passing framework integrating CityWat urban and CatchWat rural processes."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "BSD-3-Clause"
  repo_url: "https://github.com/ImperialCollegeLondon/wsi"

boundary:
  scope_in:
    - "Integrated water quantity AND quality across the terrestrial/urban water cycle"
    - "Urban and rural hydrological catchments (Land node with multiple surfaces)"
    - "Agricultural / growing surfaces with crop nutrient cycling, ET, and soil erosion"
    - "Rivers with in-river biochemical processes (denitrification, nutrient uptake/decay)"
    - "Reservoirs and river-reservoir storage with environmental-flow requirements"
    - "Groundwater as a conceptual tank with baseflow and optional sewer infiltration"
    - "Sewer / storm / foul pipe networks (time-area routing) with CSO overflow"
    - "Freshwater and wastewater treatment works (FWTW / WWTW)"
    - "Residential / per-capita demand and water distribution with leakage"
    - "Cross-system flux and water-quality (VQIP) message passing between subsystem nodes"
  scope_out:
    - "Not a substitute for sophisticated physical/hydraulic models"
    - "Not recommended where detailed hydraulic/hydrological process representation is needed"
    - "No internal weather generation — meteorological forcing must be supplied externally"
    - "No automatic graph topology inference — node graph and connectivity are user-specified"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Semi-distributed node-arc structure; aggregation scale is user-defined (a single node can represent an entire storm-sewer network). Mass-balance closure applies to water volume and additive pollutant masses, conserved at every node and arc each timestep (tolerance FLOAT_ACCURACY=1e-11). Non-additive intensive quantities (DO, temperature, pH) are not mass-conserved — they are volume-weighted averaged on mixing. Overall timestep is user-configurable, but detailed biochemical processes in agricultural surfaces and rivers assume a daily step. Every graph requires at least one Waste node as terminal outlet."

inputs:
  forcing:
    - category: "forcing"
      name: "precipitation"
      unit: "m/timestep"
      source_kind: "forcing"
      model_input_format: "Land-node data_input_dict keyed by (variable, pandas.Timestamp); depth carries an associated VQIP quality"
      notes: "WSIMOD expects m/timestep; common mm/day sources are 1000x too large (dt_001). Convert via MM_TO_M=1e-3."
    - category: "forcing"
      name: "potential evapotranspiration (ET0)"
      unit: "m/timestep"
      source_kind: "forcing"
      model_input_format: "Land-node data_input_dict; crop ET via Allen et al. 1998 crop coefficients"
      notes: "Common mm/day sources are 1000x too large (dt_015). Convert via MM_TO_M=1e-3."
    - category: "forcing"
      name: "temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "Land-node data_input_dict; drives decay, crop growth, treatment transformations, demand wastewater quality"
      notes: "Reference 20 degC for decay k(T)=k_ref*coeff^(T-20). Kelvin/Fahrenheit make the exponent astronomically wrong (dt_007)."
    - category: "forcing"
      name: "atmospheric deposition"
      unit: "kg/timestep (N load)"
      source_kind: "forcing"
      model_input_format: "Nutrient (N) input to Land surfaces"
    - category: "forcing"
      name: "prescribed catchment inflow (flow + pollutant timeseries)"
      unit: "m3/d or ML/d (flow); kg/timestep or mg/L (quality)"
      source_kind: "forcing"
      model_input_format: "Catchment-node data_input_dict keyed by (variable, pandas.Timestamp); primary external-model coupling point"
      notes: "Flow from m3/s sources must be x86400 to m3/d (dt_018). This is the coupling surface to upstream hydrology/quality models."
  parameters:
    - category: "parameters"
      name: "surface area"
      unit: "m2"
      source_kind: "calibrated"
      model_input_format: "Per-surface attribute on Land/ImperviousSurface/PerviousSurface/Groundwater nodes"
      notes: "km2 or ha not converted gives 1e6x runoff error (dt_008). KM2_TO_M2=1e6."
    - category: "parameters"
      name: "soil depth"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "PerviousSurface attribute; typical 0.1-2.0 m"
      notes: "mm not converted gives instant saturation or overflow (dt_011)."
    - category: "parameters"
      name: "field_capacity / wilting_point"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "PerviousSurface soil-moisture thresholds (e.g. 0.3 / 0.12); IHACRES infiltration/ET/runoff partitioning"
    - category: "parameters"
      name: "tank / storage capacity"
      unit: "ML (or m3)"
      source_kind: "calibrated"
      model_input_format: "Groundwater / Reservoir node capacity"
      notes: "Default simulation volume is ML; mixing ML and m3 gives 1000x error and mass-balance violations (dt_002)."
    - category: "parameters"
      name: "sewer capacity"
      unit: "m3/d"
      source_kind: "calibrated"
      model_input_format: "Sewer node capacity (NOT ML/d)"
      notes: "ML/d makes capacity 1000x too high so CSO never triggers (dt_006)."
    - category: "parameters"
      name: "residence / pipe routing time"
      unit: "days"
      source_kind: "calibrated"
      model_input_format: "Sewer pipe_time, and time-area routing parameters on Land/Groundwater"
    - category: "parameters"
      name: "per-capita demand"
      unit: "ML/person/d"
      source_kind: "calibrated"
      model_input_format: "ResidentialDemand factor (~1.5e-4 ML/person/d ~ 150 L/d)"
    - category: "parameters"
      name: "treatment throughput capacity"
      unit: "ML/d"
      source_kind: "calibrated"
      model_input_format: "FWTW / WWTW treatment_throughput_capacity and process_parameters"
    - category: "parameters"
      name: "leakage rate"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "Distribution-node loss fraction"
    - category: "parameters"
      name: "pollutant decay / transformation coefficients"
      unit: "per day"
      source_kind: "calibrated"
      model_input_format: "DecayObj-bearing nodes; k(T)=k_ref*coeff^(T-20)"
      notes: "Rates specified per day; per-second values are not auto-converted (dt_010 unit-table)."
    - category: "parameters"
      name: "surface pollutant_load / nutrient export coefficients"
      unit: "kg/timestep (or kg/km2 for nutrient export)"
      source_kind: "calibrated"
      model_input_format: "Per-surface pollutant generation; fertilizer application for agricultural surfaces"
      notes: "Units stated inconsistently (kg/timestep per surface vs kg/km2 nutrient export); g/m2 vs kg/km2 confusion gives 1000x error (dt_012)."
    - category: "parameters"
      name: "reservoir / environmental-flow thresholds"
      unit: "ML/d (or volume)"
      source_kind: "calibrated"
      model_input_format: "Reservoir/RiverReservoir abstraction and environmental-flow limits"
  initial_conditions:
    - category: "initial_conditions"
      name: "initial tank storage volume"
      unit: "ML or m3"
      source_kind: "user_provided"
      model_input_format: "Groundwater/Reservoir/River initial_storage (volume + associated VQIP pollutant masses)"
    - category: "initial_conditions"
      name: "initial soil moisture"
      unit: "m (or fraction of capacity)"
      source_kind: "user_provided"
      model_input_format: "PerviousSurface/Land initial soil-water state"
    - category: "initial_conditions"
      name: "initial VQIP pollutant pools"
      unit: "kg (additive) / mg/L,degC,pH (non-additive)"
      source_kind: "user_provided"
      model_input_format: "Per-node VQIP initialisation; pollutant in POLLUTANTS list but never loaded stays constant zero (dt_010)"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "node-arc graph topology"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "User-specified nodes and arcs (in_port/out_port must match node names exactly, case-sensitive); at least one Waste terminal node required"
      notes: "Mismatched arc port names raise KeyError at add_arcs() construction (dt_005)."
    - category: "boundary_conditions"
      name: "orchestration sequence"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "Ordered list of per-timestep node function calls (default 13-step sequence, customizable via model.orchestration)"
      notes: "Sequence is deterministic and order-dependent; changing it changes results (dt_014). Default order is not invariant."
    - category: "boundary_conditions"
      name: "population / land-use fractions"
      unit: "persons; fraction"
      source_kind: "user_provided"
      model_input_format: "Demand population and Land surface-area fractions (should sum to ~1.0)"
    - category: "boundary_conditions"
      name: "pollutant set definition (additive vs non-additive)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "constants POLLUTANTS / additive / non-additive lists; controls mixing rule (sum vs volume-weighted)"
      notes: "A non-additive pollutant placed in the additive list is summed instead of averaged, doubling concentration at junctions (dt_003)."

processes:
  modules:
    - name: "Node (base)"
      role: "integrator"
      brief: "Base node implementing the four message handlers (pull_check, pull_set, push_check, push_set) used by all node types to route water and quality."
    - name: "Arc"
      role: "integrator"
      brief: "Transports VQIP between nodes via message passing; enforces capacity and conservation; every transfer logged as a flows record."
    - name: "VQIP"
      role: "integrator"
      brief: "Core volume + 12 pollutants object and mixing logic; blend_vqip sums additive masses and volume-weights non-additive (DO/temperature/pH); mass-balance check at FLOAT_ACCURACY=1e-11."
    - name: "Land"
      role: "process_solver"
      brief: "Surface/subsurface hydrology over ImperviousSurface, PerviousSurface, GrowingSurface; computes runoff, percolation, ET; applies irrigation; generates surface pollutant load."
    - name: "ImperviousSurface"
      role: "process_solver"
      brief: "Generates urban runoff from sealed area with pollutant_load."
    - name: "PerviousSurface"
      role: "process_solver"
      brief: "Soil store with depth, field_capacity, wilting_point; IHACRES-style infiltration, percolation and ET."
    - name: "GrowingSurface"
      role: "process_solver"
      brief: "Agricultural surface with crop nutrient cycling, crop coefficients, soil erosion and irrigation demand."
    - name: "Sewer"
      role: "process_solver"
      brief: "Routes stormwater/foul through pipes with capacity (m3/d) and pipe_time delay; generates CSO overflow when capacity exceeded."
    - name: "Groundwater"
      role: "integrator"
      brief: "Conceptual tank storage node; infiltrate accepts percolation, distribute releases baseflow (with optional sewer infiltration); storage levels logged to tanks output."
    - name: "River"
      role: "integrator"
      brief: "In-river routing storage node with biochemical processes (denitrification, nutrient uptake/decay); receives runoff, baseflow, CSO and treated effluent; storage logged to tanks output."
    - name: "Reservoir"
      role: "integrator"
      brief: "Storage / river-reservoir node; make_abstractions supplies raw water and applies environmental-flow limits; storage logged to tanks output."
    - name: "Catchment"
      role: "process_solver"
      brief: "Lumped inflow node driven by data_input_dict (flow + pollutant timeseries); routes external-model inflows to downstream rivers; primary coupling point."
    - name: "Demand"
      role: "allocator"
      brief: "Generates household/industrial demand from per_capita x population; emits pollutant load to foul sewer."
    - name: "Distribution"
      role: "integrator"
      brief: "Conveys treated supply water to demand with a leakage rate."
    - name: "FWTW"
      role: "process_solver"
      brief: "Freshwater treatment: treat_water converts raw abstraction to potable supply with treatment_throughput and process_parameters."
    - name: "WWTW"
      role: "process_solver"
      brief: "Wastewater treatment: calculate_discharge/make_discharge release treated effluent with residual pollutant load; routes excess to stormwater storage."
    - name: "Waste"
      role: "driver"
      brief: "Mandatory terminal outlet node that absorbs all incoming water (system sink)."
    - name: "DecayObj"
      role: "optional_module"
      brief: "Temperature-dependent pollutant decay k(T)=k_ref*coeff^(T-20) at reference 20 degC; applied on decay-bearing nodes."
    - name: "Model orchestration"
      role: "driver"
      brief: "Iterates over dates calling node functions in the deterministic default sequence (FWTW -> Demand -> Land -> Groundwater.infiltrate -> Sewer/Foul discharge -> WWTW -> Groundwater.distribute -> River -> Reservoir abstractions -> Land.apply_irrigation -> WWTW.make_discharge -> Catchment.route)."
  internal_edges:
    - from: "Inputs"
      to: "Land"
      kind: "consumes_input"
      brief: "precip(m)/ET0(m)/temperature(degC) from data_input_dict drive surface hydrology."
    - from: "Inputs"
      to: "Catchment"
      kind: "consumes_input"
      brief: "External flow + pollutant timeseries drive lumped catchment inflow."
    - from: "Land"
      to: "Groundwater"
      kind: "writes_state"
      brief: "Percolation flux pushed via the percolation arc into Groundwater.infiltrate."
    - from: "Land"
      to: "River"
      kind: "writes_state"
      brief: "Surface runoff pushed via the runoff arc to the river node."
    - from: "Groundwater"
      to: "River"
      kind: "writes_state"
      brief: "Groundwater.distribute sends baseflow to River."
    - from: "Sewer"
      to: "WWTW"
      kind: "invokes"
      brief: "make_discharge routes foul/storm flow to WWTW.calculate_discharge."
    - from: "Sewer"
      to: "River"
      kind: "writes_state"
      brief: "CSO overflow released to river when sewer capacity (m3/d) exceeded."
    - from: "WWTW"
      to: "River"
      kind: "writes_state"
      brief: "Treated effluent (with residual pollutant load) discharged to river."
    - from: "Reservoir"
      to: "FWTW"
      kind: "writes_state"
      brief: "make_abstractions supplies raw water to FWTW for treatment."
    - from: "FWTW"
      to: "Distribution"
      kind: "writes_state"
      brief: "treat_water produces potable supply routed via Distribution."
    - from: "Distribution"
      to: "Demand"
      kind: "writes_state"
      brief: "Supply (minus leakage) delivered to Demand."
    - from: "Demand"
      to: "Sewer"
      kind: "writes_state"
      brief: "create_demand generates foul water + pollutant load returned to foul sewer."
    - from: "Reservoir"
      to: "Land"
      kind: "writes_state"
      brief: "Abstracted water re-applied to surfaces within the same timestep via Land.apply_irrigation."
    - from: "River"
      to: "Waste"
      kind: "produces_output"
      brief: "Outflow arc terminates at the Waste outlet sink."
    - from: "VQIP"
      to: "DecayObj"
      kind: "reads_state"
      brief: "Carried VQIP temperature sets the decay-rate exponent k(T)=k_ref*coeff^(T-20) applied to additive pollutant masses."
    - from: "VQIP"
      to: "Arc"
      kind: "invokes"
      brief: "Mixing on each arc sums additive masses and volume-weights non-additive quantities."
    - from: "Arc"
      to: "Node (base)"
      kind: "invokes"
      brief: "Arc transfers call node push/pull check/set handlers."
    - from: "Model orchestration"
      to: "Land"
      kind: "invokes"
      brief: "Orchestration calls Land.run in the fixed per-timestep sequence."
    - from: "Model orchestration"
      to: "Catchment"
      kind: "invokes"
      brief: "Orchestration calls Catchment.route last in the default sequence."
    - from: "Arc"
      to: "Outputs"
      kind: "produces_output"
      brief: "Every arc transfer logged as a flows record (volume + VQIP)."
    - from: "Groundwater"
      to: "Outputs"
      kind: "produces_output"
      brief: "Groundwater storage levels logged to tanks output each timestep."
    - from: "River"
      to: "Outputs"
      kind: "produces_output"
      brief: "River storage levels logged to tanks output each timestep."
    - from: "Reservoir"
      to: "Outputs"
      kind: "produces_output"
      brief: "Reservoir storage levels logged to tanks output each timestep."
    - from: "Land"
      to: "Outputs"
      kind: "produces_output"
      brief: "Land surface states (soil moisture, runoff, percolation) logged to surfaces output."

states:
  variables:
    - name: "VQIP.volume"
      unit: "m3 or ML"
      role: "prognostic"
    - name: "VQIP additive pollutant masses (phosphate, org-phosphorus, ammonia, nitrate, nitrite, org-nitrogen, bod, cod, solids)"
      unit: "kg"
      role: "prognostic"
    - name: "VQIP non-additive quantities (do, temperature, ph)"
      unit: "mg/L, degC, pH"
      role: "diagnostic"
    - name: "tank storage volume"
      unit: "m3 or ML"
      role: "prognostic"
    - name: "soil moisture content"
      unit: "m (or fraction)"
      role: "prognostic"
    - name: "runoff store"
      unit: "m3 or ML"
      role: "prognostic"
    - name: "percolation flux"
      unit: "m3 or ML per timestep"
      role: "diagnostic"
    - name: "land nutrient pools (dissolved inorganic/organic N and P, adsorbed, humus)"
      unit: "kg"
      role: "prognostic"
    - name: "crop state (days after sowing, crop cover, ground cover, crop factor)"
      unit: "days; fraction"
      role: "prognostic"
    - name: "cumulative mass-balance residual"
      unit: "m3 or kg"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "flows"
    validation_rank: 2
    unit: "volume per timestep (m3 or ML) plus VQIP pollutant masses/concentrations"
    description: "Water volume and water-quality (VQIP) transferred along each arc; one record per arc per timestep."
    emitted_in: "flows.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Volume units are config-dependent (m3 vs ML); reconcile units before comparison.", "Aggregated/parsimonious representation prioritises cross-system fluxes over hydraulic detail."]
      detrending_options: ["none"]
  - var: "river flow / discharge"
    validation_rank: 1
    unit: "m3/d or ML/d"
    description: "Routed river discharge at a node, a subset of the flows record commonly compared to gauge data."
    emitted_in: "flows.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Semi-distributed aggregation: a node represents an aggregated reach, not a precise gauge cross-section."]
      detrending_options: ["none"]
  - var: "pollutant concentration / mass"
    validation_rank: 3
    unit: "kg (additive) or mg/L, degC, pH (non-additive)"
    description: "In-river / in-arc water-quality indicators (ammonia, phosphate, nitrate, BOD, DO, etc.)."
    emitted_in: "flows.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Validated against spot/grab samples in the GMD paper; observations are sparse and irregular in time."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Spot-sample concentrations match a single instant; high temporal variability between samples."]
      detrending_options: ["none"]
  - var: "storage / tank levels"
    validation_rank: 4
    unit: "volume (m3 or ML)"
    description: "Storage levels at reservoir, groundwater, soil and treatment storm tanks; one record per storage node per timestep."
    emitted_in: "tanks.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Conceptual tank storage; absolute volume depends on configured capacity and units."]
      detrending_options: ["none"]
  - var: "land surface states (soil moisture, runoff, percolation)"
    validation_rank: 5
    unit: "m or m3 per timestep"
    description: "Per-surface land states: soil moisture, surface runoff/infiltration excess, percolation, ET."
    emitted_in: "surfaces.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Conceptual IHACRES-style soil store; soil moisture is a relative state, not a directly measured volumetric content."]
      detrending_options: ["none"]
  - var: "CSO spill / flood volume"
    validation_rank: 6
    unit: "volume (m3 or ML)"
    description: "Combined-sewer overflow spill and flood volumes from the sewer network."
    emitted_in: "flows.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Instantaneous rainfall response (no time-of-concentration) shifts spill timing; volume accuracy ~78-83% vs detailed hydraulic models."]
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "csi"
          caveats: ["CSO triggering is sensitive to sewer-capacity units (dt_006); spill timing less reliable than spill volume."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "runoff_coefficient"
      to: "CSO spill / flood volume"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: parameter
      citations: ["muhandes2022_citywatstorm_suds", "dobson2024_wsimod_gmd"]
    - from: "runoff_coefficient"
      to: "sewer flow"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: parameter
      citations: ["dobson2024_wsimod_gmd", "muhandes2022_citywatstorm_suds"]
    - from: "sewer_roughness"
      to: "sewer flow"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: parameter
      citations: ["dobson2024_wsimod_gmd"]
    - from: "water_demand (per-capita x population)"
      to: "river flow / discharge"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: management
      applicability: "abstraction-supplied catchments; most acute in small tributaries"
      citations: ["dobson2021_covid_london_waterquality"]
    - from: "water_demand (per-capita x population)"
      to: "pollutant concentration / mass"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: management
      applicability: "ammonia and phosphate (effluent-dominated)"
      citations: ["dobson2021_covid_london_waterquality"]
    - from: "wastewater_effluent_discharge"
      to: "pollutant concentration / mass"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: parameter
      applicability: "ammonia and phosphate; small tributaries most sensitive"
      citations: ["dobson2021_covid_london_waterquality"]
    - from: "river flow / discharge (dilution)"
      to: "pollutant concentration / mass"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: boundary_forcing
      applicability: "low-flow tributaries"
      citations: ["dobson2021_covid_london_waterquality"]
    - from: "calibrated streamflow parameter set"
      to: "river flow / discharge"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "Sundargarh catchment streamflow; 11 parameters, per-parameter Sobol indices not retrievable (paywalled)"
      citations: ["hsj2026_wsimod_sobol_emulator"]
    - from: "infiltration_rate"
      to: "river flow / discharge"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: parameter
      citations: ["dobson2024_wsimod_gmd"]
    - from: "percolation"
      to: "storage / tank levels"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: parameter
      applicability: "groundwater store recharge"
      citations: ["dobson2024_wsimod_gmd"]
    - from: "fertilizer_application"
      to: "pollutant concentration / mass"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: management
      applicability: "agricultural / rural catchment diffuse nutrient load"
      citations: ["dobson2024_wsimod_gmd"]
  citation_index:
    dobson2024_wsimod_gmd:
      short_citation: "Dobson, Liu & Mijic 2024"
      doi: "10.5194/gmd-17-4495-2024"
      note: "Primary WSIMOD technical description (GMD). Parsimonious design — lists required parameters (infiltration, percolation, sewer roughness, runoff coefficient, fertilizer) but gives no formal Sobol/Morris ranking."
    dobson2023_wsimod_joss:
      short_citation: "Dobson, Liu & Mijic 2023"
      doi: "10.21105/joss.04996"
      note: "WSIMOD JOSS software paper; node-arc message-passing architecture. No parameter sensitivity analysis."
    hsj2026_wsimod_sobol_emulator:
      short_citation: "HSJ 2026 (WSIMOD source by B. Dobson)"
      doi: "10.1080/02626667.2026.2674165"
      note: "Multi-objective Sobol SA + ML emulator calibration of 11 WSIMOD streamflow parameters, Sundargarh catchment. Only formal WSIMOD Sobol study; paywalled, per-parameter indices not retrievable."
    dobson2021_covid_london_waterquality:
      short_citation: "Dobson et al. 2021"
      doi: "10.3389/frwa.2021.641462"
      note: "CityWat-SemiDistributed (WSIMOD lineage) London study; demand/population drive effluent ammonia/phosphate; river flow controls dilution. Directional findings, not quantitative SA indices."
    muhandes2022_citywatstorm_suds:
      short_citation: "Muhandes, Dobson & Mijic 2022"
      doi: "10.3389/frwa.2021.773974"
      note: "CityWatStorm (WSIMOD sewer lineage) vs InfoWorks ICM; runoff/storm inputs drive flood and CSO spill volumes (78-83% volume accuracy); instantaneous rainfall response as structural sensitivity."

safety:
  hazards:
    - id: "precipitation_mm_vs_m_silent_flood"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in mm/day instead of m/timestep is 1000x too large; all nodes flood and storage overflows, with no error raised."
      severity: "silent"
    - id: "et0_mm_vs_m_silent"
      kind: "weather_file_semantic"
      description: "ET0 in mm/day instead of m/timestep dries all storage in days (or has negligible effect if double-converted)."
      severity: "silent"
    - id: "temperature_not_celsius_decay_blowup"
      kind: "weather_file_semantic"
      description: "Temperature in Kelvin/Fahrenheit makes the decay exponent k(T)=k_ref*coeff^(T-20) astronomically wrong (Kelvin gives exponent ~273)."
      severity: "silent"
    - id: "river_inflow_m3s_vs_m3d"
      kind: "weather_file_semantic"
      description: "Catchment inflow flow rate in m3/s not converted to m3/d is 86400x off."
      severity: "silent"
    - id: "land_area_km2_vs_m2"
      kind: "soil_semantic"
      description: "Land surface area in km2 instead of m2 gives 1e6x runoff error (KM2_TO_M2=1e6 missing)."
      severity: "silent"
    - id: "soil_depth_mm_vs_m"
      kind: "soil_semantic"
      description: "Soil depth in mm instead of m makes the soil store effectively infinite (never saturates) or overflow if double-converted; typical 0.1-2.0 m."
      severity: "silent"
    - id: "storage_volume_ML_vs_m3"
      kind: "soil_semantic"
      description: "Mixing ML and m3 storage units (default sim volume is ML) gives 1000x volume error and mass-balance violations."
      severity: "silent"
    - id: "sewer_capacity_MLd_vs_m3d"
      kind: "control_semantic"
      description: "Sewer capacity in ML/d instead of m3/d is 1000x too high, so CSO overflow never triggers, silently."
      severity: "silent"
    - id: "pollutant_load_units_off"
      kind: "soil_semantic"
      description: "Surface pollutant_load / nutrient-export coefficients in g/m2 vs kg/km2 vs kg/m2 give 1000x nutrient export error; surface load is kg/timestep."
      severity: "silent"
    - id: "non_additive_pollutant_in_additive_list"
      kind: "control_semantic"
      description: "A non-additive pollutant (DO, temperature, pH) placed in the additive list is summed instead of volume-weighted averaged, doubling concentration where two flows merge."
      severity: "silent"
    - id: "uninitialized_pollutant_constant_zero"
      kind: "initial_condition_semantic"
      description: "A pollutant in the POLLUTANTS list but never loaded into any node VQIP or pollutant_load stays constant zero for the whole simulation."
      severity: "degraded"
    - id: "data_input_dict_string_keys"
      kind: "control_semantic"
      description: "data_input_dict keyed by string dates instead of pandas.Timestamp tuples causes a KeyError at model.run() (str != Timestamp lookup)."
      severity: "fatal"
    - id: "data_input_dict_incomplete_coverage"
      kind: "control_semantic"
      description: "data_input_dict not covering the full model.dates range raises a KeyError mid-simulation."
      severity: "fatal"
    - id: "arc_port_name_mismatch"
      kind: "control_semantic"
      description: "Arc in_port/out_port names not matching defined node names (case-sensitive) raise a KeyError at add_arcs() construction."
      severity: "fatal"
    - id: "orchestration_order_changes_results"
      kind: "control_semantic"
      description: "The per-timestep orchestration sequence is deterministic and order-dependent (e.g. Land before vs after Demand abstraction); changing it silently changes results."
      severity: "degraded"
    - id: "mass_balance_tolerance_masks_drift"
      kind: "numerical_instability"
      description: "FLOAT_ACCURACY=1e-11 mass-balance tolerance masks small per-node errors that accumulate; cumulative VQIP float-precision drift reaches ~1e-6 to 1e-4 of total flow over multi-year runs."
      severity: "degraded"
  validation_limits:
    - "Not a substitute for sophisticated physical/hydraulic models; parsimonious, aggregated subsystem representations."
    - "Not recommended where detailed hydraulic/hydrological process representation is required."
    - "Sewer routing uses instantaneous rainfall response with no time-of-concentration, degrading spill/flood timing fidelity."
    - "Detailed biochemical processes in agricultural surfaces and rivers assume a daily timestep; sub-daily processes are unresolved."
  warnings:
    - "Default simulation volume is ML while several parameters (e.g. sewer capacity in m3/d) use m3 — keep node-volume units config-consistent."
    - "VQIP volume units (m3 vs ML) are not pinned by the framework; flows/storage outputs inherit this configuration ambiguity."
    - "Cumulative mass balance should be monitored over the full run; flag if cumulative imbalance exceeds ~1% of total flow."
    - "Suggested input sanity ranges: max precipitation < 0.5 m/d, ET0 < 0.015 m/d, temperature -30 to +45 degC, land-use fractions sum ~1.0, flows and pollutant values non-negative."
  assumptions:
    - statement: "WSIMOD is a semi-distributed node-arc model whose spatial aggregation scale is user-defined; a single node may represent an entire subsystem (e.g. a city's storm-sewer network)."
      scope: "spatial geometry / model boundary"
      source: "Dobson et al. 2024 GMD (Sections 2.2-2.3) and WSIMOD component-library docs"
      status: "adopted"
    - statement: "Mass-balance closure holds for water volume and additive pollutant masses (conserved per node/arc, tolerance 1e-11); non-additive quantities (DO, temperature, pH) are intensive and volume-weighted on mixing, not mass-conserved."
      scope: "conservation / closure"
      source: "Dobson et al. 2024 GMD (Sections 2.2.1, 2.3.2) and WSIMOD core reference (VQIP / set_default_pollutants)"
      status: "adopted"
    - statement: "The overall timestep is user-configurable, but detailed biochemical processes in agricultural surfaces and rivers are treated at a daily step; the dag declares temporal=daily as the operative biochemical resolution."
      scope: "temporal resolution"
      source: "Dobson et al. 2024 GMD (Section 2.3.3 'Units and time steps')"
      status: "adopted"
    - statement: "Parameters are intended to be set from best-available data rather than calibrated (parsimonious philosophy), which is why no formal Sobol/Morris ranking exists in the core papers and most influence edges are graded from directional lineage-model evidence."
      scope: "parameterisation / sensitivity evidence"
      source: "Dobson et al. 2024 GMD (design philosophy)"
      status: "adopted"
