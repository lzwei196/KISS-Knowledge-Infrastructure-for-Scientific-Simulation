  severity: fatal
- id: dt_mf6_012
  symptom: mf6 exits immediately with error about missing mfsim.nam file. No output files are created.
  diagnosis: mf6 is run from a directory that does not contain mfsim.nam. MODFLOW 6 always reads mfsim.nam
