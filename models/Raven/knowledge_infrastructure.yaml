package:
  name: Raven
  language: c++
  implementation:
    id: raven-v41
    version: '4.1'
    provenance: C++; University of Waterloo Raven Hydrological Modelling Framework v4.1 (CSHS-CWRA); compiled
      HydroCraft binary Raven.exe (netCDF output disabled).
  scientific_reference_version: Raven Hydrological Modelling Framework v4.1 (Craig et al. 2020, Environ.
    Model. Softw. 129:104728)
  binary:
    path: KISSPATH_BINARIES/raven/Raven.exe
    type: ELF
pipeline:
  stages:
  - s0_model_selection_skill
  - s1_basin_hru_setup_skill
  - s3_forcing_conversion_skill
  - s4_process_algorithm_guide
  - s8_model_intercomparison_skill
  - s9_calibration_skill
tools:
  count: 11
  files:
  - tools/common/validate_raven_inputs.py
  - tools/s0_config/select_model_template.py
  - tools/s10_coupling/raven_vic_comparison.py
  - tools/s1_basin_setup/build_rvh_from_shapefile.py
  - tools/s2_parameters/build_rvp_parameters.py
  - tools/s3_forcing/convert_forcing_to_rvt.py
  - tools/s5_initial_conditions/generate_rvc_initial.py
  - tools/s6_execution/run_raven.py
  - tools/s7_output/parse_raven_output.py
  - tools/s8_ensemble/run_ensemble_comparison.py
  - tools/s9_calibration/calibrate_raven_dds.py
inputs:
  forcing:
  - name: PRECIP
    unit: mm/d
  - name: TEMP_MIN
    unit: degC
  - name: TEMP_MAX
    unit: degC
  - name: TEMP_AVE
    unit: degC
  - name: SW_RADIA
    unit: MJ/m2/d
  - name: LW_INCOMING
    unit: MJ/m2/d
  - name: WIND_VEL
    unit: m/s
  - name: REL_HUMIDITY
    unit: fraction (0-1)
  - name: AIR_PRES
    unit: kPa
  - name: PET
    unit: mm/d
  - name: observed discharge
    unit: m3/s
  parameters:
  - name: Soil class parameters (hydraulic / storage, e.g. HBV_BETA, porosity, max release rate)
    unit: various
  - name: Vegetation / land-use class parameters (e.g. AET_COEFF, interception)
    unit: various
  - name: Terrain class parameters
    unit: various
  - name: Global / emulation-template parameters (e.g. GR4J X1-X4, MOHYSE_PET_COEFF, melt factors)
    unit: various
  - name: HRU/SubBasin geometry (area, elevation, lat/lon, slope, aspect, class assignments)
    unit: km2 / m / deg
  initial_conditions:
  - name: Initial soil water storage (SOIL[i])
    unit: mm
  - name: Initial snow water equivalent and snow state (SNOW, SNOW_LIQ, COLD_CONTENT)
    unit: mm / energy
  - name: Initial canopy / groundwater storage
    unit: mm
  - name: .rvc file existence (cold start)
    unit: n/a
  boundary_conditions:
  - name: Process algorithm selection (model structure)
    unit: n/a
  - name: PET method selector
    unit: n/a
  - name: Solver / numerical method
    unit: n/a
  - name: Routing method (in-channel and in-catchment)
    unit: n/a
  - name: Simulation control (start/end dates, :TimeStep, output options)
    unit: n/a
  - name: Reservoir / water management operations (extractions, diversions)
    unit: various
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - discharge (STREAMFLOW)
  - Soil water storage (SOIL[i])
  - Snow water equivalent (SNOW / TOTAL_SWE)
  - Actual evapotranspiration (AET)
  - Performance diagnostics (NSE, KGE, PBIAS, RMSE)
  other: []
