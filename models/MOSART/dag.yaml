safety:
  hazards:
    - id: "runoff_unit_mm_per_day_as_mm_per_s"
      kind: "weather_file_semantic"
      description: "Runoff supplied in mm/day but interpreted as mm/s yields discharge ~86400x too high."
      severity: "fatal_or_silent"
    - id: "runoff_unit_m_per_s_as_mm_per_s"
      kind: "weather_file_semantic"
      description: "Runoff supplied in m/s but interpreted as mm/s yields discharge ~1000x too high."
      severity: "fatal_or_silent"
    - id: "grid_area_km2_instead_of_m2"
      kind: "soil_semantic"
      description: "Grid cell area in km2 instead of m2 makes discharge ~1e-6 of expected (area enters the mm/s->m3/s conversion)."
      severity: "silent"
    - id: "nan_slope_bypasses_minimum_replacement"
      kind: "numerical_instability"
      description: "Zero slopes are replaced by minimums (0.005 hillslope, 0.0001 channel/subnetwork) but NaN slopes bypass replacement and propagate NaN through Manning's equation, including unbounded channel depth in flat terrain."
      severity: "fatal"
    - id: "cfl_violation_too_few_subcycles"
      kind: "numerical_instability"
      description: "Large/steep basins with too few subcycles/routing_iterations violate the CFL-like criterion, causing instability/NaN; reduce timestep or raise subcycles."
      severity: "fatal"
    - id: "reservoir_area_skm_in_m2"
      kind: "coefficient_runtime_silent_fallback"
      description: "Reservoir evaporation uses 1e6 * evap * dt * AREA_SKM assuming km2; AREA_SKM already in m2 drives 1e6x evaporation and drains entire storage to zero."
      severity: "silent"
    - id: "reservoir_cap_mcm_already_m3"
      kind: "coefficient_runtime_silent_fallback"
      description: "CAP_MCM is million-m3 and multiplied by 1e6 internally; values already in m3 are double-converted and reservoirs overflow."
      severity: "silent"
    - id: "missing_floodplain_width_rwid0"
      kind: "soil_semantic"
      description: "Missing floodplain width rwid0 makes flood water disappear (trapezoidal floodplain section undefined above bankfull)."
      severity: "silent"
    - id: "lat_lon_mismatch_or_inactive_mask"
      kind: "control_semantic"
      description: "Grid lat/lon must match exactly across grid, runoff and demand files, and the routing mask must include active land cells; mismatch or all-ocean mask yields all-zero/NaN output."
      severity: "fatal_or_silent"
    - id: "output_resolution_not_multiple_of_timestep"
      kind: "control_semantic"
      description: "output_resolution must be >= timestep and an integer multiple of it; otherwise initialization raises."
      severity: "fatal"
    - id: "runoff_read_from_file_overrides_bmi"
      kind: "control_semantic"
      description: "When runoff.read_from_file is true, file runoff overwrites BMI-set runoff each timestep, silently ignoring BMI set_value."
      severity: "silent"
    - id: "demand_monthly_pad_spikes"
      kind: "control_semantic"
      description: "Demand is read monthly and padded to the nearest past time; discontinuous multi-file runoff with pad selection produces unrealistic spikes at monthly boundaries."
      severity: "degraded"
  validation_limits:
    - "Does not generate runoff or water demand; both must be supplied externally, so validation skill is bounded by the quality of the upstream forcing."
    - "Negative runoff is not routed (shed to direct-to-ocean), so the model cannot represent net abstraction signaled as negative runoff."
    - "Base routing has no surface energy or evaporation budget except reservoir evaporation; not suitable for energy-balance questions."
    - "Floodplain inundation, river stage, and suspended-sediment skill require the MOSART-Inundation / MOSART-sediment extensions, not the base routing+WM configuration."
  warnings:
    - "Reservoir release uses ISTARF statistical target rules keyed to storage level and month; it approximates operations and will not reproduce individual dam decisions."
    - "Irrigation extraction at high irrigation_extraction_maximum_fraction (default 0.5) can over-deplete channels, driving gauge discharge below observed even when demand is fully met; compare against a water_management.enabled=false natural-flow run to separate routing from abstraction."
    - "reservoir_potential_evaporation is consumed by regulation() but is documented as never initialized; reservoir evaporation may silently be zero unless explicitly provided."
    - "Reservoir release in regulation() overwrites channel outflow in place before downstream routing, so reservoir and main-channel computations are order-dependent within a routing iteration."
  assumptions:
    - statement: "This dag describes the mosartwmpy Python implementation of MOSART-WM (routing + water management + ISTARF + irrigation), not the base Fortran CTSM/E3SM MOSART routing-only model."
      scope: "whole model"
      source: "mosartwmpy source (model.py, update/update.py, reservoirs/) and Thurber et al. 2021 JOSS 6(62):3221 doi:10.21105/joss.03221"
      status: adopted
    - statement: "Kinematic-wave routing is assumed: where the channel is steep enough, the friction slope is approximated by the bed slope; an inflow-balance fallback applies when drainage_area/(width*length) exceeds 1e6."
      scope: "main-channel and subnetwork routing"
      source: "CTSM MOSART tech note section 2.14 (Eq. 2.14.1) and mosartwmpy main_channel/kinematic_wave.py"
      status: adopted
    - statement: "Mass-balance continuity dS/dt = Qin - Qout + R - I is closed on each routing tier and on reservoir storage (floored at zero); no surface energy budget is closed."
      scope: "all routing components and reservoirs"
      source: "CTSM MOSART tech note section 2.14 (Eq. 2.14.4)"
      status: adopted
    - statement: "Runoff and water demand are exogenous boundary inputs (from an upstream LSM and a demand dataset/ABM respectively); their generation is out of model scope."
      scope: "inputs"
      source: "Voisin et al. 2013 HESS 17(9):3605-3622 doi:10.5194/hess-17-3605-2013 and mosartwmpy input/runoff.py, input/demand.py"
      status: adopted
    - statement: "Sensitivity grades derive from comparative scenario / one-at-a-time experiments in MOSART development papers, not from variance-based global SA indices; channel Manning roughness is the principal calibrated parameter while most parameters are estimated a priori. Because no variance-based index exists, no influence edge is graded HIGH."
      scope: "influence block"
      source: "Li et al. 2013 doi:10.1175/JHM-D-12-015.1 and Luo et al. 2017 doi:10.5194/gmd-10-1233-2017"
      status: tentative
