- id: T09
  description: Chlorine grows instead of decaying during simulation
  affected_output: 'Bulk reaction coefficient has the wrong sign. In EPANET, negative
    coefficients produce decay and positive coefficients produce growth.

    '
  detection: 'Bulk reaction coefficient has the wrong sign. In EPANET, negative coefficients
    produce decay and positive coefficients produce growth.

    '
  fix: "1. For chlorine decay, use NEGATIVE bulk coefficient:\n   [REACTIONS] Global\
    \ Bulk -0.5  (decays at 0.5/day)\n2. Positive values are only for growth reactions\
    \ (e.g., DBP formation). 3. Check wall reactio"
- id: T10
  description: Simulation runs but report file shows no node/link results
  affected_output: 'The [REPORT] section does not specify which nodes and links to
    include. By default, EPANET does not report any results unless explicitly told
    to.

    '
  detection: 'The [REPORT] section does not specify which nodes and links to include.
    By default, EPANET does not report any results unless explicitly told to.

    '
  fix: "1. Add to [REPORT] section:\n   Nodes All\n   Links All\n2. Or specify individual\
    \ node/link IDs:\n   Nodes J1 J2 J3\n   Links P1 P2 P3\n3. Ensure REPORT Timestep\
    \ is set in [TIMES] section.\n"
