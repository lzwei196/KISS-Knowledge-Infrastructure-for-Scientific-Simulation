safety:
  hazards:
    - id: "permeability_vs_conductivity"
      kind: soil_semantic
      description: "Hydraulic conductivity K (m/s) used directly as intrinsic permeability k (m^2), ~7 orders of magnitude too permeable; domain drains instantly (k = K*mu/(rho*g))."
      severity: silent
    - id: "head_vs_pressure"
      kind: control_semantic
      description: "Hydraulic head (m) entered where pressure (Pa) is expected; near-zero pressure, no flow (P = P_atm + rho*g*h)."
      severity: silent
    - id: "concentration_unit_mg_vs_mol"
      kind: control_semantic
      description: "Concentration in mg/L used where mol/L is expected; transport/breakthrough off by MW/1000."
      severity: silent
    - id: "vangenuchten_alpha_per_cm_vs_per_pa"
      kind: soil_semantic
      description: "van Genuchten alpha in 1/cm used as 1/Pa, ~1e6 too large; soil drains with no capillary retention (alpha_Pa = alpha_cm/980665)."
      severity: silent
    - id: "exodus_label_region_mismatch"
      kind: control_semantic
      description: "Exodus mesh label IDs do not match XML region definitions; mismatched sideset silently defaults to zero-flux no-flow BC."
      severity: silent
    - id: "time_unit_years_vs_seconds"
      kind: control_semantic
      description: "Time values in years used where seconds are expected; simulation ~3.156e7x too long/short (internal time is seconds)."
      severity: fatal_or_silent
    - id: "gravity_vector_sign"
      kind: control_semantic
      description: "Gravity Z component positive (or wrong magnitude) inverts the hydrostatic gradient; water flows upward."
      severity: silent
    - id: "recharge_cm_per_yr_conversion"
      kind: control_semantic
      description: "Recharge in cm/yr not fully converted to kg/m^2/s (missing /100 cm->m); recharge ~100x too high, instant saturation."
      severity: silent
    - id: "sorption_kd_ml_per_g_vs_m3_per_kg"
      kind: control_semantic
      description: "Sorption Kd in mL/g used where m^3/kg expected; retardation 1000x too high, plume stuck at source (x0.001)."
      severity: silent
    - id: "residual_saturation_ge_one"
      kind: soil_semantic
      description: "Residual saturation S_r >= 1.0 or theta_r > theta_s; negative effective saturation -> nonsensical pressures, crash/NaN."
      severity: silent
    - id: "recharge_bc_region_name_mismatch"
      kind: control_semantic
      description: "Recharge BC missing or assigned to a mis-cased/mismatched region name; unspecified faces default to zero-flux, no water enters."
      severity: silent
    - id: "extreme_permeability_nan"
      kind: numerical_instability
      description: "Extreme permeability (>1e-6 m^2, often K used as k) or large BC magnitudes cause overflow / NaN in residual; solver crash."
      severity: fatal
    - id: "stiff_vangenuchten_nonconvergence"
      kind: numerical_instability
      description: "Stiff van Genuchten parameters (high n >2.5, sharp retention) cause nonlinear non-convergence and timestep collapse."
      severity: degraded
    - id: "sharp_wetting_front_timestep_collapse"
      kind: numerical_instability
      description: "Sharp dry-to-wet infiltration front causes repeated timestep cutting; physically correct but ~100x slowdown."
      severity: degraded
    - id: "mesh_dimension_mismatch"
      kind: control_semantic
      description: "XML dimension tag disagrees with mesh dimensionality (2-D input vs 3-D mesh); fatal dimension-mismatch at startup."
      severity: fatal
    - id: "missing_required_xml_block"
      kind: control_semantic
      description: "A required XML block (mesh/regions/materials/initial_conditions/process_kernels) is missing; fatal parse error."
      severity: fatal
  validation_limits:
    - "ATS-specific surface/snow/ET/permafrost PKs (src/physics/ats) are a distinct physics suite; an Amanzi-core-only build does not include them."
    - "MPI rank count affects mesh partitioning and solver convergence path; results can vary 0.1–1% at observation points, so cross-run comparisons should fix the rank count."
    - "Adaptive seconds-based timestepping; sub-process behavior is resolved only as finely as init_dt/max_dt and solver tolerances permit."
  warnings:
    - "Flow PK silently reads any existing 'temperature' field for temperature-dependent liquid viscosity, coupling flow to energy state even in nominally isothermal setups."
    - "Wrapper-supplied van Genuchten n maps to internal m via m=1-1/n only under the Mualem rel-perm branch; a Burdine run (n=1/(1-2m) relation) mismatches the reported vG parameters."
    - "Flow PKs default to Neumann zero normal flux on unspecified boundaries; an intended recharge/pressure BC that is mis-named or mis-typed silently becomes no-flow."
  assumptions:
    - statement: "The model is always solved on a 3-D mesh internally; 2-D and 1-D problems are represented as degenerate 3-D meshes (nx×1×nz, 1×1×nz)."
      scope: "Spatial discretization / dimensionality."
      source: "Amanzi/ATS input specification (mesh) and dimension-mismatch behavior in the Mesh framework."
      status: adopted
    - statement: "Internal units are SI with time in seconds, pressure in Pa, intrinsic permeability in m^2, concentration in mol/L; all inputs in other units require explicit conversion."
      scope: "Unit system across flow/transport/energy inputs."
      source: "Amanzi flow/transport defaults (FlowDefs.hh, TransportDefs.hh) and Amanzi docs."
      status: adopted
    - statement: "Relative permeability defaults to the Mualem model unless Brooks-Corey or another krel_function is specified."
      scope: "Water-retention / relative-permeability constitutive choice."
      source: "WRM_vanGenuchten module default in Amanzi flow PK source and docs."
      status: adopted
    - statement: "Mass-balance closure holds for water content, solute mass, and inorganic geochemistry; surface-energy closure applies only when energy / surface energy balance PKs are active."
      scope: "Conservation closure."
      source: "Amanzi/ATS flow, transport, and energy PK formulation (Painter et al. 2016 WRR; ATS flow PK docs)."
      status: adopted
