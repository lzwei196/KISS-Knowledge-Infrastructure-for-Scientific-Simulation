schema_version: 1
model_id: WRF_Hydro
domain: hydrology
generated_by: "self-improve session (Claude Opus 4.8) — Step-B validation-convention build, general schema"
generated_at: 2026-07-09

# Grounded in the in-cache OA full texts. DISCHARGE is the well-grounded headline: the two ASABE
# watershed-model evaluation conventions (Moriasi 2007 monthly NSE/PBIAS/RSR tiers; Moriasi 2015
# updated watershed-scale flow criteria) supply the numeric bands, and multiple fetched WRF-Hydro /
# National Water Model benchmarks corroborate the achievable range. The other quantities are thin on
# THRESHOLD literature: the fetched WRF-Hydro papers report ACHIEVED skill (soil-moisture R, ET NSE,
# SWE R2/PBIAS) but no field pass/fail tier specific to those variables, so their bands are transferred
# from Moriasi (SWE/ET NSE, confidence <=0.4) or left null (soil-moisture, all CSI spatial shapes).
# Groundwater "storage" is a conceptual exponential bucket (not a measurable water table) -> the temporal
# skill metric is structurally_limited on documented mechanistic grounds. Bands are plain numbers read
# via `direction` (see VALIDATION_CONVENTION_SCHEMA.md).

