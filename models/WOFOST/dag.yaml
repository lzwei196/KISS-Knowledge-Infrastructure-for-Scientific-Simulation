    - from: "TMIN / TMAX (daily temperature)"
      to: "DOA / TWSO"
      sensitivity_grade: "HIGH"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      citations: ["dewit2019_wofost_25years", "ceglar2019_wofost_wheat_phenology"]
    - from: "RAIN (daily precipitation)"
      to: "TWSO"
      sensitivity_grade: "HIGH"
      applicability: "water-limited production levels"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      citations: ["dewit2019_wofost_25years", "gilardelli2018_wofost_climate_sensitivity"]
    - from: "Q10 (maintenance respiration temperature sensitivity)"
      to: "TAGP / TWSO"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["wang2013_wofost_efast"]
    - from: "production_level (PP vs WLP_FD vs WLP_CWB)"
      to: "TWSO"
      sensitivity_grade: "HIGH"
      basis: "literature_qualitative"
      lever_type: "structural"
      citations: ["dewit2019_wofost_25years"]
  citation_index:
    wang2013_wofost_efast:
      short_citation: "Wang et al. 2013"
      doi: "10.1016/j.envsoft.2013.06.007"
      note: "EFAST global sensitivity analysis of 47 WOFOST parameters for maize at Yingke Oasis; ranks TSUM1, TSUM2, SLATB, AMAXTB, EFFTB, KDIFTB, CVO as priority parameters."
    gilardelli2018_wofost_climate_sensitivity:
      short_citation: "Gilardelli et al. 2018"
      doi: "10.1016/j.ecolmodel.2017.11.003"
      note: "Morris global sensitivity of WOFOST across European sites for winter and durum wheat, winter barley, maize, sunflower under baseline and climate-change scenarios; identifies FOTB partitioning family as most influential on simulated yield."
    ceglar2019_wofost_wheat_phenology:
      short_citation: "Ceglar et al. 2019"
      doi: "10.1016/j.agsy.2018.05.002"
      note: "Continental-scale recalibration of WOFOST winter-wheat phenology in the MARS system; adds vernalization and photoperiodicity; recalibrates TSUM1/TSUM2 per agro-environmental zone."
    dewit2019_wofost_25years:
      short_citation: "de Wit et al. 2019"
      doi: "10.1016/j.agsy.2018.06.018"
      note: "Authoritative 25-year retrospective on WOFOST documenting model structure, parameterization, and the dominant role of radiation/temperature/precipitation forcing and TSUM1/2, SLATB, AMAXTB, partitioning tables, soil water-holding capacity for simulated yield."
    li2023_wofost_efast_spring_wheat:
      short_citation: "Li et al. 2023"
      doi: "10.3390/agronomy13092294"
      note: "EFAST sensitivity analysis for spring wheat at five sites in the Yellow River Irrigation Area; ranks SLATB, AMAXTB, TSUM1, TSUM2, CVO, SPAN, EFFTB; shows water-stress regime shifts the parameter ranking and identifies soil water-holding capacity as dominant under water-limited production."

safety:
  hazards:
    - id: "irrad_units_silent_zero_yield"
      kind: "weather_file_semantic"
      description: "IRRAD authored in MJ m-2 d-1 (or kJ when bypassing the CSV provider) instead of the engine-internal J m-2 d-1 causes ~1e6x under-driving of photosynthesis and silently produces near-zero TWSO and LAI<0.5 with no error."
      severity: "silent"
    - id: "rain_units_waterlogging_or_chronic_stress"
      kind: "weather_file_semantic"
      description: "RAIN authored in mm/day and passed directly to the engine-internal variable (expects cm/day) produces 10x rainfall and permanent waterlogging; the inverse, pre-converting CSV mm to cm before the CSVWeatherDataProvider's internal /10, produces 10x under-rainfall and chronic water stress."
      severity: "silent"
    - id: "vap_units_off_by_10x"
      kind: "weather_file_semantic"
      description: "VAP supplied in kPa to the engine-internal variable (expects hPa) is 10x too low; engine-internal unit is 1 kPa = 10 hPa."
      severity: "silent"
    - id: "wind_units_off_by_86x"
      kind: "weather_file_semantic"
      description: "WIND supplied in km/day instead of m/s is ~86.4x too high (typical model range 0-15 m/s)."
      severity: "silent"
    - id: "temperature_in_kelvin"
      kind: "weather_file_semantic"
      description: "TMIN/TMAX in Kelvin (values > 200) silently break thermal-time accumulation and assimilation temperature factors."
      severity: "silent"
    - id: "et0_units_extreme_stress"
      kind: "weather_file_semantic"
      description: "E0 / ES0 / ET0 supplied in mm/day instead of cm/day (engine-internal unit) produces ~10x atmospheric demand and causes the SWEAF water-stress reducer to shut down transpiration."
      severity: "silent"
    - id: "vernalisation_never_satisfied"
      kind: "control_semantic"
      description: "For winter cereals, VERNSAT too high for the local climate (or the campaign starting after winter cold) causes VERNFAC to remain 0 throughout the vegetative stage; DVS stalls at 0.3-0.5 with zero yield and no error. VERNDVS safety cutoff can force-complete vernalisation if mis-set."
      severity: "silent"
    - id: "pp_vs_wlp_mode_confusion"
      kind: "control_semantic"
      description: "Running Wofost72_PP when water-limited results are intended yields TWSO values 2-5x literature; PP holds SM=SMFCF every day and never applies water stress."
      severity: "silent"
    - id: "max_duration_truncation"
      kind: "control_semantic"
      description: "max_duration shorter than the actual growing-cycle requirement silently truncates the run before DVS=2, leaving partial TWSO; only diagnostic is final DVS < 2 in the summary output."
      severity: "degraded"
    - id: "afgen_table_non_monotonic_x"
      kind: "parser_semantic"
      description: "AFGEN tables (AMAXTB, SLATB, FOTB, FRTB, FLTB, FSTB, KDIFTB, EFFTB, TMPFTB, ...) require strictly increasing x-values; manual YAML edits that violate this raise PCSEError on engine init or, worse, produce discontinuous interpolated growth."
      severity: "fatal_or_silent"
    - id: "soil_water_limit_ordering"
      kind: "soil_semantic"
      description: "Soil hydraulic parameters violating SMW < SMFCF < SM0 (often from cm3/cm3 vs % confusion) raise ValueError at engine init or generate an impossible water balance; SM0 <= 0.65 and CRAIRC < SM0 - SMFCF are additional constraints."
      severity: "fatal_or_silent"
    - id: "missing_soil_parameters_in_wlp"
      kind: "soil_semantic"
      description: "Wofost72_WLP_FD requires all 14 soil parameters (SMW, SMFCF, SM0, CRAIRC, K0, SOPE, KSUB, RDMSOL, IFUNRN, SSMAX, SSI, WAV, NOTINF, SMLIM); any missing key raises KeyError at engine initialization."
      severity: "fatal"
    - id: "case_sensitive_crop_or_variety_name"
      kind: "parser_semantic"
      description: "crop_name and variety_name in the agromanagement YAML are case-sensitive dict keys; 'Wheat' vs 'wheat' or 'winter_wheat_101' vs 'Winter_wheat_101' raises KeyError at engine init."
      severity: "fatal"
    - id: "weather_coverage_gap"
      kind: "weather_file_semantic"
      description: "Any day-level gap in the weather record over the campaign window (including the leap-year Feb 29) causes WeatherDataProviderError mid-run; the engine requires gap-free daily coverage from campaign_start to crop_end + max_duration."
      severity: "fatal"
    - id: "snowdepth_nan_under_pcse_60"
      kind: "weather_file_semantic"
      description: "Under PCSE 6.0, SNOWDEPTH must not be NaN even when the frost-damage / SnowMAUS path is inactive; supplying NaN aborts initialization."
      severity: "fatal"
    - id: "agromanagement_yaml_indentation_silent_empty"
      kind: "parser_semantic"
      description: "Agromanagement YAML in which CropCalendar is indented at sibling rather than child level of the campaign date parses successfully but leaves CropCalendar/TimedEvents empty so no crop is planted; the simulation runs to no purpose."
      severity: "silent"
    - id: "carbon_partitioning_balance_violation"
      kind: "numerical_instability"
      description: "WOFOST 7.2 enforces |FR + (FL+FS+FO)*(1-FR) - 1| < 1e-4 in DVS_Partitioning and |TDWI - TAGP - TWRT| < 1e-4 at initialization; small inconsistencies in user-supplied partitioning tables raise PartitioningError / CarbonBalanceError."
      severity: "fatal"
    - id: "water_balance_finalize_residual"
      kind: "numerical_instability"
      description: "WaterbalanceFD raises WaterBalanceError at finalize when |WBALRT| or |WBALTT| exceed 1e-4 cm; failures can abort runs at the very end with no earlier warning."
      severity: "fatal"
    - id: "afgen_partitioning_sum_constraint"
      kind: "parser_semantic"
      description: "At every DVS, the above-ground partitioning sum FLTB + FSTB + FOTB must equal 1.0; departures combined with FRTB rounding cause silent biomass mis-allocation if not also enforced through the 1e-4 partitioning check."
      severity: "silent"
  validation_limits:
    - "WOFOST 7.2 has no nitrogen, phosphorus, or potassium limitation; fertilisation events are silently ignored and N-stress is not represented (use 7.3+ N_Soil_Dynamics or 8.1 SNOMIN if needed)."
    - "Soil representation is a single-bucket or two-layer (root-zone + subsoil) classic water balance; multi-layer Richards-style flow is not available in 7.2 (WaterBalanceLayered is a 7.3+ module)."
    - "Daily 1-day Euler timestep cannot resolve sub-daily processes; instantaneous water stress, midday Tmax extremes, and intra-day radiation distribution are smoothed."
    - "Field/point spatial grain only; gridded ensembles are constructed by looping the point model and do not include lateral water or biomass exchange."
    - "Pre-emergence dynamics are limited to the TSUMEM thermal-time submodel (DVR = 0.1*DTSUME/TSUMEM); root/stem/leaf dynamics never advance before STAGE transitions out of 'emerging'."
    - "Frost damage requires the optional module and a SNOWDEPTH input; in the baseline 7.2 configuration here it is not applied."
  warnings:
    - "PCSE 6.0 internal IRRAD is stored in J m-2 d-1 even where older WOFOST documentation suggests kJ; the CSVWeatherDataProvider multiplies the kJ-authored CSV column by 1000 to reach J, while a direct WeatherDataContainer expects J."
    - "Mixing the Doorenbos-Kassam SWEAF easily-available-water curve (constants A=0.76, B=1.5, clipped to [0.10, 0.95]) with non-default DEPNR values is the only user-tunable lever in the water-stress reducer; the curve constants themselves are hardcoded in the assimilation/evapotranspiration source."
    - "Wofost72_PP must not be used to infer water-limited production; WaterbalancePP is a 'fake' water balance that holds SM=SMFCF every day."
    - "DSOS (consecutive oxygen-stress days) is clamped at 4 inside the RFOS reducer, so the oxygen-stress recovery saturates after 4 days irrespective of how long flooding persists."
    - "PCSE 6.0 reorganized the SiteDataProvider import path (pcse.util -> pcse.input) and removed the CO2 site parameter (CO2 is now handled via crop CO2 tables); pre-6.0 import patterns silently fail."
    - "WOFOST 7.2 has no native crop_finish for nitrogen, phosphorus, or carbon stress; the only physiological terminations are DVS=2 (maturity), max_duration, and the agromanagement crop_end_date."
  assumptions:
    - statement: "This dag describes the WOFOST 7.2 lineage as wrapped by PCSE 6.0.12 via the Wofost72_PP / Wofost72_WLP_FD / Wofost72_WLP_CWB engine classes; the 7.3 multi-layer water balance and the 8.1 SNOMIN nitrogen module are NOT in scope here."
      scope: "identity and processes blocks"
      source: "PCSE reference guide (https://pcse.readthedocs.io/en/stable/) and pcse/conf/Wofost72_PP.conf"
      status: "adopted"
    - statement: "Engine-internal IRRAD is taken to be J m-2 d-1; the CSVWeatherDataProvider CSV column is kJ m-2 d-1 (provider multiplies x1000), VAP CSV column is kPa (provider multiplies x10 to hPa), and RAIN CSV column is mm/day (provider divides /10 to cm); when a WeatherDataContainer is built directly, the engine-internal units (J m-2 d-1, hPa, cm/day) apply."
      scope: "inputs.forcing"
      source: "PCSE reference guide and pcse/crop/assimilation.py source code"
      status: "adopted"
    - statement: "Mass-balance closure is enforced for soil water (root-zone + subsoil two-bucket WaterbalanceFD with 1e-4 cm tolerance at finalize) and for the carbon partitioning checksum (1e-4 tolerance in DVS_Partitioning and TDWI initialisation); the surface energy budget is NOT closed."
      scope: "boundary.closure"
      source: "pcse/soil/classic_waterbalance.py and pcse/crop/wofost72.py / partitioning.py"
      status: "adopted"
    - statement: "Production level (PP vs WLP_FD vs WLP_CWB) is treated as a structural model-form switch (boundary_condition + structural lever_type), not as a parameter; it selects which water-balance module is active and changes which soil parameters are required."
      scope: "inputs.boundary_conditions and influence.edges"
      source: "PCSE conf files Wofost72_PP.conf / Wofost72_WLP_FD.conf / Wofost72_WLP_CWB.conf"
      status: "adopted"
    - statement: "Atmospheric CO2 is categorised as a time-varying forcing (consumed by the assimilation submodel via crop CO2 tables in PCSE 6.0) rather than a site parameter; the CO2 effect on AMAX is only exercised on the CO2-aware assimilation path."
      scope: "inputs.forcing and processes.modules"
      source: "pcse/crop/assimilation.py and PCSE 6.0 release notes (CO2 removed from WOFOST72SiteDataProvider)"
      status: "adopted"
