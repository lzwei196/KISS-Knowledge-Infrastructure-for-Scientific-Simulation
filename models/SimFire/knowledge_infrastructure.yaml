# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: SimFire
  language: python
  implementation:
    id: simfire
    version: 2.0.1
    provenance: Python; MITRE Fireline open-source 2-D cellular wildfire simulator implementing the Rothermel
      surface fire spread equation over a pixel grid.
  scientific_reference_version: Rothermel surface fire spread model (USDA Forest Service RMRS-GTR-371;
    Anderson FBFM-13 fuel models)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/SimFire/venv/bin/python
    type: work_dir
pipeline:
  stages:
  - s1_configuration
  - s2_terrain_setup
  - s3_wind_setup
  - s4_execution
  - s5_output_analysis
tools:
  count: 4
  files:
  - tools/convert_landfire_to_simfire.py
  - tools/convert_wind_to_simfire.py
  - tools/parse_simfire_output.py
  - tools/run_simfire.py
inputs:
  forcing:
  - name: wind speed
    unit: mph (config); converted internally to ft/min via mph_to_ftpm
  - name: wind direction
    unit: degrees clockwise from North (TO-direction convention)
  - name: dead fuel moisture
    unit: fraction
  parameters:
  - name: oven-dry fuel load (w_0)
    unit: lb/ft2
  - name: fuel bed depth (delta)
    unit: ft
  - name: dead fuel moisture of extinction (M_x)
    unit: fraction
  - name: surface-area-to-volume ratio (sigma)
    unit: ft2/ft3
  - name: low heat content (h)
    unit: BTU/lb
  - name: total mineral content (S_T)
    unit: fraction
  - name: effective mineral content (S_e)
    unit: fraction
  - name: oven-dry particle density (rho_p)
    unit: lb/ft3
  - name: elevation
    unit: ft
  - name: RoS attenuation magnitudes
    unit: ft/min subtracted from RoS
  initial_conditions:
  - name: ignition position
    unit: pixels (row, col)
  boundary_conditions:
  - name: screen_size
    unit: pixels
  - name: pixel_scale
    unit: ft/pixel
  - name: update_rate
    unit: min/step
  - name: runtime
    unit: time string ('Xd Xh Xm')
  - name: diagonal_spread
    unit: bool
  - name: max_fire_duration
    unit: frames (update steps)
  - name: ros_attenuation
    unit: bool
  - name: terrain/fuel layer mode
    unit: enum
  - name: operational geolocation and extent
    unit: lat/lon decimal degrees; height/width meters; resolution 30 m; year
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - fire_map
  - burned_area
  - fire_perimeter_length
  - rate_of_spread
  other: []
validation:
  tier: tested
  tier_justification: 'measured: R=1.000, 2 scorecard(s)'
  metrics:
    best_r: 0.9999
summary:
  total_tools: 4
  total_stage_docs: 5
  total_diagnostic_triplets: 25
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
