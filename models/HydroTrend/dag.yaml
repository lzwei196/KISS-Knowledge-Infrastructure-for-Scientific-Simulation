      short_citation: "Syvitski, Vorosmarty, Kettner & Green 2005"
      doi: "10.1126/science.1109454"
      note: "Global 4462-river application; reservoir trapping (Te) and the anthropogenic soil-erosion B-factor identified as high-leverage controls on delivered sediment load."

safety:
  hazards:
    - id: "monthly_precip_meters_not_mm"
      kind: "weather_file_semantic"
      description: "Monthly precipitation (HYDRO.IN lines 12-23) authored in m instead of mm; divided by 1000 internally => ~1000x-low discharge, baseflow only. (ht_001)"
      severity: "silent"
    - id: "annual_precip_mm_not_meters"
      kind: "weather_file_semantic"
      description: "Annual precipitation (line 9) authored in mm/yr instead of m/yr (no internal conversion) => ~1000x-high discharge, yearly extreme flooding. (ht_002)"
      severity: "silent"
    - id: "lapse_rate_per_meter_not_per_km"
      kind: "weather_file_semantic"
      description: "Lapse rate (line 24) in degC/m instead of degC/km; divided by 1000 internally => no altitude temperature variation, negligible snow/ice melt. (ht_003)"
      severity: "silent"
    - id: "hypsometry_area_m2_not_km2"
      kind: "soil_semantic"
      description: "Hypsometry area in m2 instead of km2 => A 1e6 too large; since Qs proportional to A^0.5, sediment load ~1000x too high. (ht_014)"
      severity: "silent"
    - id: "basin_length_m_not_km"
      kind: "weather_file_semantic"
      description: "Basin length (line 31) in meters instead of km; multiplied by 1000 internally => 1000x-too-large length and unrealistic travel times. (ht_004)"
      severity: "degraded"
    - id: "ksat_canopy_et_m_per_day_not_mm"
      kind: "weather_file_semantic"
      description: "Saturated hydraulic conductivity (line 39) or canopy/ET alpha (lines 27-28) in m/day instead of mm/day; divided by 1000 => negligible subsurface flow / interception / ET. (ht_005, ht_006)"
      severity: "silent"
    - id: "temperature_kelvin_not_celsius"
      kind: "weather_file_semantic"
      description: "Reanalysis (ERA5/CMFD) temperature left in Kelvin instead of degC (273.15 offset) => Tbar ~290 degC, corrupting lapse-rate, melt, and the BQART temperature term."
      severity: "silent"
    - id: "grain_fractions_not_summing_to_one"
      kind: "soil_semantic"
      description: "Grain-size proportions (line 7) do not sum to exactly 1.0; the model does NOT renormalize, so sum>1 inflates and sum<1 loses sediment mass. (ht_008)"
      severity: "silent"
    - id: "monthly_climate_block_column_shift"
      kind: "parser_semantic"
      description: "Monthly climate block (lines 12-23) with wrong field/month count; each line needs exactly 5 fields and 12 months, else all subsequent parameter reads shift. (ht_009)"
      severity: "fatal_or_silent"
    - id: "near_zero_climate_std_flat_hydrograph"
      kind: "weather_file_semantic"
      description: "Near-zero monthly T_std/P_std collapses the stochastic weather generator to near-constant daily values, producing a flat hydrograph with no seasonal cycle. (ht_015)"
      severity: "degraded"
    - id: "nan_in_sediment_rating"
      kind: "numerical_instability"
      description: "NaN in Qs when Qbar=0 (division by zero), a negative base raised to a fractional power, or an extreme rating exponent from log10 of a tiny Qsbar. (ht_011)"
      severity: "fatal"
    - id: "zero_qbar_arid_or_trapped_snow"
      kind: "control_semantic"
      description: "Unrealistically low/zero mean discharge when P<=ET (arid), precipitation negligible, or all precipitation falls as snow that never melts (ELA too low or lapse rate wrong). (ht_012)"
      severity: "degraded"
    - id: "baseflow_exceeds_mean_discharge"
      kind: "control_semantic"
      description: "Constant baseflow (line 11) per epoch exceeding the epoch-mean discharge Qbartotal is a fatal error in the baseflow rescaling step."
      severity: "fatal"
    - id: "long_run_memory_exhaustion"
      kind: "numerical_instability"
      description: "Very long simulations (>10000 yr) with many grain sizes, or a hypsometry bin count mismatching the data, exhaust the per-year preallocated random arrays (maxran 2200) => segfault/memory error. (ht_013)"
      severity: "fatal"
    - id: "ascii_flag_off_empty_output"
      kind: "control_semantic"
      description: "ASCII output flag (line 2) OFF writes only the binary .DIS; combined with a missing trailing '/' or absent output dir, the run appears to succeed but produces no human-readable output. (ht_010)"
      severity: "silent"
    - id: "bqart_2C_threshold_discontinuity"
      kind: "control_semantic"
      description: "BQART has a hard threshold at Tbar=2 degC: below it the coefficient doubles and the temperature term is dropped, so basins near 2 degC show a step change in sediment load (intended glacial-erosion behavior). (ht_016)"
      severity: "warning"
    - id: "reservoir_TE_method_switch_at_half_km3"
      kind: "control_semantic"
      description: "Trapping efficiency uses Brown's method for <0.5 km3 and Vorosmarty's for >=0.5 km3; the hard cutoff produces a discontinuity that may not match published Brune curves. (ht_017)"
      severity: "warning"
  validation_limits:
    - "Recommended for rivers longer than ~100 km and basins smaller than ~75,000 km2 (empirical-relation calibration domain)."
    - "Lumped at a single outlet — cannot resolve spatially distributed runoff or in-channel network routing."
    - "Daily output timestep cannot resolve sub-daily flood dynamics; fixed 365-day year (no leap days)."
    - "Sediment load is empirical, not mechanistic — not a process-based morphodynamic transport model."
  warnings:
    - "Annual outputs are not independent across years: a 50-day flood-shoulder wrap and inter-annual groundwater (gwlast) and snow carryover couple consecutive years."
    - "Each epoch is run in a 5-pass loop (mean-Q, daily-Q+baseflow, mean-Qs, Qs normalization, daily-Qs+output); daily Qs is implicitly conditioned on epoch-mean discharge, so it is not a single forward pass."
    - "Fixed RNG seed makes a given input deterministic; changing only the run length still reuses the seeded draw sequence."
  assumptions:
    - statement: "The model is lumped at a single basin outlet (0-D point in space, 1-D vertical via the hypsometric curve); no distributed or channel-network routing."
      scope: "spatial structure of all outputs (Q, Qs, Qb, Cs, VWD)"
      source: "CSDMS Model:HydroTrend wiki (Spatial and temporal scale) and Kettner & Syvitski 2008"
      status: "adopted"
    - statement: "Water balance closes daily (Q = Q_rain + Q_nival + Q_ice - Q_ET +/- Q_groundwater) to a fractional tolerance; suspended sediment is an empirical rating normalized to a long-term BQART/ART/QRT mean and is NOT mechanistically mass-conserved (grain fractions taken as supplied)."
      scope: "closure semantics for discharge vs sediment"
      source: "CSDMS Model_help:HydroTrend (Primary Equations) and HydroTrend v3.0 source mass-balance check (masscheck)"
      status: "adopted"
    - statement: "Comparisons against multi-decadal/national aggregate records use detrended/decadal-mean modes, because the stochastic weather generator and empirical long-term sediment rating target the mean, not inter-annual realization-level correlation."
      scope: "outputs.observability comparison modes for aggregate time series"
      source: "Kettner & Syvitski 2008 (Po LGM paleo application) and BQART long-term calibration in Syvitski & Milliman 2007"
      status: "tentative"
    - statement: "Positive lapse rate means temperature decreases with altitude (standard ~6.5 degC/km); sentinel -9999 triggers an internal global default."
      scope: "snow/ice/glacier elevation partitioning"
      source: "HydroTrend v3.0 source (hydroweather/hydrohypsom) and CSDMS Model_help input guidance"
      status: "adopted"
