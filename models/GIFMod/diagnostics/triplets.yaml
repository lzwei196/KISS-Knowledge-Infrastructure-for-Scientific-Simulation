# GIFMod Diagnostic Triplets
# Each triplet: symptom -> diagnosis -> remedy
# Failure domains: unit_conversion, parameter_format, path_resolution, runtime, dependency_mismatch, silent_error

- id: dt_001
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Near-zero infiltration; all precipitation runs off surface; pond/catchment blocks fill rapidly"
    error_pattern: "Head in surface blocks >> expected; soil blocks remain dry"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Hydraulic conductivity (Ks) entered in cm/s instead of m/day"
    explanation: >
      GIFMod expects Ks in m/day. Most soil databases (HWSD, SoilGrids, USDA)
      report Ks in cm/s. The conversion factor is 864.0 (= 0.01 m/cm * 86400 s/day).
      Without conversion, Ks is 864x too low, effectively making the soil impermeable.
      The model runs without error but produces unrealistic surface ponding.
    affected_components: [convert_soil_params.py, Soil blocks]
  remedy:
    action: "Multiply Ks by 864.0 to convert from cm/s to m/day"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Check Ks unit in source database"
      - "Apply: Ks_m_day = Ks_cm_s * 864.0"
      - "Verify: typical sandy soil Ks = 5-50 m/day, clay = 0.01-0.5 m/day"
    prevention: "convert_soil_params.py auto-detects and converts cm/s to m/day"
  severity: silent
  cross_references: [dt_005, dt_012]

- id: dt_002
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Catastrophic flooding; all blocks overflow; head values orders of magnitude too high"
    error_pattern: "Precipitation values > 0.5 m/day for routine events"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Precipitation entered in mm/day instead of m/day"
    explanation: >
      GIFMod requires precipitation in m/day. Common weather data sources provide
      mm/day or mm/hr. Entering mm/day directly means precipitation is 1000x too
      high (e.g., 5 mm/day becomes 5 m/day = 5000 mm/day). The model will run
      but every block will overflow.
    affected_components: [convert_forcing.py, Catchment blocks, Pond blocks]
  remedy:
    action: "Multiply mm/day by 0.001 or mm/hr by 0.024 to get m/day"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Check precipitation unit in source data"
      - "Apply: P_m_day = P_mm_day * 0.001"
      - "Or: P_m_day = P_mm_hr * 0.024"
      - "Verify: typical rain event = 0.005-0.05 m/day"
    prevention: "convert_forcing.py validates that precip < 0.5 m/day"
  severity: silent
  cross_references: []

- id: dt_003
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Block volumes and storage capacities wrong by ~10x; water balance does not close"
    error_pattern: "Area values appear ~10x smaller than expected"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Block area entered in ft^2 instead of m^2"
    explanation: >
      GIFMod uses m^2 for all area properties. US engineering data often reports
      area in ft^2. The conversion is: m^2 = ft^2 * 0.0929. Without conversion,
      areas are ~10.76x too large, causing incorrect volumes and flow rates.
    affected_components: [Soil blocks, Pond blocks, Catchment blocks]
  remedy:
    action: "Multiply ft^2 by 0.09290304 to get m^2"
    tool_to_run: ""
    manual_steps:
      - "Identify area units in source data"
      - "Apply: A_m2 = A_ft2 * 0.09290304"
    prevention: "Always verify area units before entering block properties"
  severity: silent
  cross_references: []

- id: dt_004
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Soil layers 100x too deep; unrealistic storage volumes; very long drain times"
    error_pattern: "Depth values in range 50-200 instead of 0.5-2.0"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Depth entered in cm instead of m"
    explanation: >
      GIFMod expects depth and elevation in meters. Soil databases commonly report
      depth in cm. Entering 100 cm as 100 m creates a 100-meter soil column.
    affected_components: [convert_soil_params.py, Soil blocks]
  remedy:
    action: "Multiply cm by 0.01 to get meters"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Check depth units"
      - "Apply: depth_m = depth_cm * 0.01"
    prevention: "convert_soil_params.py auto-converts depth > 10 from cm to m"
  severity: silent
  cross_references: []

- id: dt_005
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Sorption calculations wrong by 1000x; constituent mass balance errors"
    error_pattern: "Bulk density values in range 1.0-2.0 instead of 1000-2000"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Bulk density entered in g/cm^3 instead of kg/m^3"
    explanation: >
      GIFMod uses kg/m^3 for bulk density (typical range 1200-1800 kg/m^3).
      Soil databases report in g/cm^3 (range 1.2-1.8). Without multiplying by
      1000, sorption mass calculations are 1000x too low, causing overestimation
      of dissolved phase concentrations.
    affected_components: [convert_soil_params.py, Soil blocks, Constituent transport]
  remedy:
    action: "Multiply g/cm^3 by 1000 to get kg/m^3"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Check bulk density units"
      - "Apply: bd_kg_m3 = bd_g_cm3 * 1000"
      - "Verify: typical range 1200-1800 kg/m^3"
    prevention: "convert_soil_params.py auto-converts values < 10 to kg/m^3"
  severity: silent
  cross_references: [dt_001]

- id: dt_006
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Solute transport shows almost no dispersion; sharp concentration fronts"
    error_pattern: "Dispersivity values 100x smaller than expected"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Dispersivity entered in cm instead of m"
    explanation: >
      GIFMod expects dispersivity (alpha) in meters. Literature often reports
      dispersivity in cm. Entering 10 cm as 10 m gives 100x too much dispersion,
      while entering 0.1 as cm instead of m gives 100x too little.
    affected_components: [Soil blocks, Darcy blocks, Constituent transport]
  remedy:
    action: "Multiply cm by 0.01 to get meters"
    tool_to_run: ""
    manual_steps:
      - "Check dispersivity units in source"
      - "Apply: alpha_m = alpha_cm * 0.01"
      - "Typical range: 0.01-10 m (scale-dependent)"
    prevention: "Validate dispersivity range in block properties"
  severity: silent
  cross_references: []

- id: dt_007
  stage: s5_parameters
  failure_domain: unit_conversion
  symptom:
    description: "Vapor transport 86400x too fast or too slow; unrealistic gas exchange"
    error_pattern: "Diffusion coefficient off by ~5 orders of magnitude"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Diffusion coefficient in m^2/s instead of m^2/day"
    explanation: >
      GIFMod uses m^2/day for diffusion coefficients. Literature reports in m^2/s.
      The conversion is: D_m2_day = D_m2_s * 86400. Missing this yields vapor
      diffusion rates that are either negligible or explosively fast.
    affected_components: [Soil blocks, Darcy blocks]
  remedy:
    action: "Multiply m^2/s by 86400 to get m^2/day"
    tool_to_run: ""
    manual_steps:
      - "Identify diffusion coefficient units"
      - "Apply: D_m2_day = D_m2_s * 86400"
    prevention: "Document expected ranges in property catalog"
  severity: silent
  cross_references: []

- id: dt_008
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Evapotranspiration rates wrong; temperature-dependent reactions miscalculated"
    error_pattern: "Temperature values in range 50-100 instead of 10-40"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Temperature in Fahrenheit instead of Celsius"
    explanation: >
      GIFMod uses Celsius for all temperature-dependent calculations (evaporation,
      reaction rate correction via theta factor, vapor pressure). Fahrenheit values
      produce temperatures ~1.8x too high plus offset, causing excessive evaporation
      and incorrect reaction kinetics.
    affected_components: [convert_forcing.py, Evaporation, Reaction rates]
  remedy:
    action: "Convert: T_C = (T_F - 32) * 5/9"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Check temperature units in source data"
      - "Apply Fahrenheit to Celsius conversion"
    prevention: "convert_forcing.py supports --temp-unit fahrenheit flag"
  severity: degraded
  cross_references: []

- id: dt_009
  stage: s5_parameters
  failure_domain: parameter_format
  symptom:
    description: "Constituent mass balance does not close; apparent creation or destruction of mass"
    error_pattern: "Mass balance error grows linearly over time"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Mixed concentration units across blocks (e.g., mg/L in some, ug/L in others)"
    explanation: >
      GIFMod allows user-defined concentration units but ALL blocks and inflow
      boundary conditions must use the same unit system. If Block A uses mg/L
      and Block B uses ug/L, the model treats both as the same unit, causing
      1000x errors in mass transfer between blocks.
    affected_components: [Constituent definitions, Block inflows]
  remedy:
    action: "Ensure all concentration values use the same unit throughout the model"
    tool_to_run: ""
    manual_steps:
      - "Audit all block initial conditions and inflow concentrations"
      - "Convert all to a single unit (e.g., mg/L)"
      - "Check reaction rate constant units for consistency"
    prevention: "Document chosen concentration unit in project file header"
  severity: silent
  cross_references: [dt_010]

- id: dt_010
  stage: s5_parameters
  failure_domain: unit_conversion
  symptom:
    description: "Reactions proceed 24x too fast or too slow; constituent removal/production rates unrealistic"
    error_pattern: "Rate constants off by factor of 24"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Reaction rate constants in 1/hr instead of 1/day"
    explanation: >
      GIFMod Petersen matrix rate constants must be in 1/day. Literature commonly
      reports kinetic constants in 1/hr or 1/s. Using 1/hr values directly
      means reactions run 24x slower than intended.
    affected_components: [CRxnNetwork, CReaction, Petersen matrix]
  remedy:
    action: "Multiply 1/hr by 24 to get 1/day; multiply 1/s by 86400"
    tool_to_run: ""
    manual_steps:
      - "Check rate constant units in literature source"
      - "Apply: k_per_day = k_per_hr * 24"
      - "Or: k_per_day = k_per_s * 86400"
    prevention: "Always annotate rate constant units in Petersen matrix definition"
  severity: silent
  cross_references: [dt_009]

- id: dt_011
  stage: s5_parameters
  failure_domain: unit_conversion
  symptom:
    description: "Particle settling occurs in seconds instead of hours; all particles deposit instantly"
    error_pattern: "Settling velocity values in range 0.001-0.01 instead of 1-100"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Settling velocity in m/s instead of m/day"
    explanation: >
      GIFMod expects settling velocity in m/day. Stokes law and laboratory
      measurements typically report in m/s. Missing the conversion by 86400
      causes particles to settle in a single timestep.
    affected_components: [CConnection, Particle transport]
  remedy:
    action: "Multiply m/s by 86400 to get m/day"
    tool_to_run: ""
    manual_steps:
      - "Convert: vs_m_day = vs_m_s * 86400"
      - "Typical range: fine silt = 1-10 m/day, sand = 100-1000 m/day"
    prevention: "Validate settling velocity range before run"
  severity: silent
  cross_references: []

- id: dt_012
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Solver immediately diverges; NaN values in first timestep; simulation crashes"
    error_pattern: "NaN|Inf|diverge|numerical instability"
    detection_method: log_match
  diagnosis:
    root_cause: "Porosity entered as percent (40) instead of fraction (0.40)"
    explanation: >
      GIFMod expects porosity as a decimal fraction (0-1). Entering percent values
      (e.g., 40 for 40%) means porosity > 1.0, which is physically impossible.
      This causes immediate numerical instability in the Richards equation solver
      because moisture content cannot exceed porosity.
    affected_components: [convert_soil_params.py, Soil blocks, Richards equation]
  remedy:
    action: "Divide percent by 100 to get fraction: porosity = percent / 100"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Check if porosity values > 1.0"
      - "Apply: porosity_frac = porosity_pct / 100"
      - "Valid range: 0.20-0.65 for most soils"
    prevention: "convert_soil_params.py rejects porosity > 1.0"
  severity: fatal
  cross_references: [dt_001, dt_005]

- id: dt_013
  stage: s6_run
  failure_domain: runtime
  symptom:
    description: "Solver fails to converge; timestep reduces to dt_min and simulation stalls"
    error_pattern: "Maximum iterations exceeded|dt below minimum"
    detection_method: log_match
  diagnosis:
    root_cause: "Negative or zero hydraulic conductivity causes division by zero in Darcy flux"
    explanation: >
      If Ks <= 0 for any block, the flow equation becomes undefined. The Newton-
      Raphson solver cannot compute a valid Jacobian, leading to convergence failure.
      This can result from incorrect pedotransfer function inputs (negative organic
      matter, invalid texture fractions).
    affected_components: [CMedium::solve(), Jacobian calculation]
  remedy:
    action: "Ensure all Ks values are strictly positive (minimum 0.001 m/day)"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Check all Ks values in soil parameter file"
      - "Set minimum Ks = 0.001 m/day for impermeable layers"
      - "Verify sand + clay + silt = 100% in input data"
    prevention: "convert_soil_params.py clamps Ks to minimum 0.01 m/day"
  severity: fatal
  cross_references: [dt_001]

- id: dt_014
  stage: s6_run
  failure_domain: dependency_mismatch
  symptom:
    description: "Build fails with Qt-related errors; undefined symbols for Qt classes"
    error_pattern: "undefined reference to.*Q|No rule to make target.*moc"
    detection_method: log_match
  diagnosis:
    root_cause: "Qt version mismatch between qmake and installed Qt libraries"
    explanation: >
      GIFMod requires Qt5. If the system has Qt4 as default (qmake points to Qt4)
      or Qt6 with incompatible API changes, the build will fail with undefined
      references to Qt classes or missing MOC-generated files.
    affected_components: [run_gifmod.py, Build system]
  remedy:
    action: "Install Qt5 and ensure qmake-qt5 is used"
    tool_to_run: run_gifmod.py
    manual_steps:
      - "Install: sudo apt-get install qtbase5-dev qt5-qmake"
      - "Use: qmake-qt5 instead of qmake"
      - "Verify: qmake --version shows Qt 5.x"
    prevention: "run_gifmod.py checks for qmake-qt5 before falling back to qmake"
  severity: degraded
  cross_references: [dt_015]

- id: dt_015
  stage: s6_run
  failure_domain: path_resolution
  symptom:
    description: "Linker error during build: cannot find -llapack or -lblas"
    error_pattern: "cannot find -llapack|cannot find -lblas"
    detection_method: log_match
  diagnosis:
    root_cause: "LAPACK/BLAS development libraries not installed"
    explanation: >
      GIFMod uses Armadillo for matrix operations, which requires LAPACK and BLAS.
      The .pro file links with -llapack -lblas. Without the development packages
      installed, the linker cannot find these shared libraries.
    affected_components: [run_gifmod.py, lapack.pri, Build system]
  remedy:
    action: "Install LAPACK and BLAS development packages"
    tool_to_run: ""
    manual_steps:
      - "sudo apt-get install liblapack-dev libblas-dev"
      - "Verify: ldconfig -p | grep lapack"
      - "Re-run: make clean && make"
    prevention: "run_gifmod.py checks for LAPACK before starting build"
  severity: fatal
  cross_references: [dt_014]
