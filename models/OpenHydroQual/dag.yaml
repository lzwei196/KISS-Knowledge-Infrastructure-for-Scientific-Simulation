template_version: "3.5"

identity:
  model_id: "OpenHydroQual"
  scientific_reference_version: "OpenHydroQual 2.0.4 (Aquifolium block-link mass-balance / reactive-transport engine; Massoudieh & Nguyen 2023, EMS)"
  implementation:
    id: "openhydroqual-204"
    version: "2.0.4"
    provenance: "C++14; Aquifolium engine by Arash Massoudieh / EnviroInformatics, generic implicit block-link mass-balance + reactive-transport solver."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "AGPL-3.0-only"
  repo_url: "https://github.com/ArashMassoudieh/OpenHydroQual"

boundary:
  scope_in:
    - "Water flow, storage, and head in interconnected control volumes (ponds, aquifer cells, river/channel segments, pipes, tanks, sediment layers)"
    - "Solute / water-quality constituent transport (advection + diffusion) across a block-link network"
    - "Biogeochemical reactions (Monod / Arrhenius-corrected kinetics; nutrient cycling; ASM-style activated-sludge processes)"
    - "Evapotranspiration as an atmospheric water-loss source (Penman and simple methods)"
    - "Sorption / mass transfer between mobile and immobile phases; pollutant buildup-washoff"
    - "Forward reactive-transport response to hydraulic and reaction parameters (the quantity that calibration/UQ workflows perturb)"
  scope_out:
    - "Fixed-grid distributed routing (spatial structure is user-defined via the block-link graph, not gridded internally)"
    - "Closed surface energy budget (ET is a demand-side flux source, not an energy-balance closure)"
    - "Hardcoded fixed-process hydrology (state variables and processes are config/template-defined, not baked into the engine)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Lumped/zero-dimensional per block; spatial structure emerges from the block-link network topology, which the user defines (no fixed internal grid). Mass-and-water balance is solved per block and coupled across links. ALL internal time quantities are in DAYS (rates 1/day, flows m^3/day, diffusion m^2/day). Closure is mass/volume balance for water and tracked constituents; ET sources are demand-side fluxes, not a closed surface energy budget. fixed_head blocks act as boundary reservoirs only when given a large dummy Storage."

inputs:
  forcing:
    - category: "climate"
      name: "Temperature"
      unit: "Celsius"
      source_kind: "forcing"
      model_input_format: "CSV time series (col1 = time in days from simulation start, col2 = value)"
      notes: "Drives Penman ET and Arrhenius temperature correction of reaction rates."
    - category: "climate"
      name: "Wind speed"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "CSV time series (time-days, value)"
      notes: "Drives aeration and ET."
    - category: "climate"
      name: "Solar radiation"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "CSV time series (time-days, value)"
      notes: "Penman ET expects W/m^2 (not MJ/m^2/day)."
    - category: "climate"
      name: "Relative humidity"
      unit: "fraction (0-1)"
      source_kind: "forcing"
      model_input_format: "CSV time series (time-days, value)"
      notes: "Fraction, not percent; enters vapour-pressure-deficit term of Penman ET."
    - category: "hydrologic"
      name: "Inflow hydrograph"
      unit: "m^3/day"
      source_kind: "forcing"
      model_input_format: "CSV time series (time-days, value) attached to a block as inflow boundary"
      notes: "Missing inflow file is silently treated as zero inflow."
    - category: "mass_loading"
      name: "Constituent loading"
      unit: "g/day"
      source_kind: "forcing"
      model_input_format: "CSV time series (time-days, value) as external mass flow to a block"
  parameters:
    - category: "hydraulic"
      name: "Manning roughness (ManningCoeff)"
      unit: "s/m^(1/3)"
      source_kind: "calibrated"
      model_input_format: ".ohq link property value[unit]"
      notes: "On wide_channel / pipe links; controls flow velocity and depth. High sensitivity."
    - category: "hydraulic"
      name: "hydraulic_conductivity"
      unit: "m/day"
      source_kind: "calibrated"
      model_input_format: ".ohq block/link property value[unit]"
      notes: "Darcy / groundwater / bed-sediment links; governs GW-SW exchange. High sensitivity."
    - category: "geometry"
      name: "Storage / alpha / beta / bottom_elevation / area / length / width / depth"
      unit: "m^3, m^2, m (per property)"
      source_kind: "user_provided"
      model_input_format: ".ohq block/link geometric properties value[unit]"
      notes: "Define block control-volume geometry and stage-storage relations."
    - category: "porous_media"
      name: "porosity / specific_yield"
      unit: "dimensionless (0-1)"
      source_kind: "calibrated"
      model_input_format: ".ohq block property value[unit]"
      notes: "Sediment/aquifer storage; low sensitivity. Fraction, not percent."
    - category: "transport"
      name: "diffusion_coefficient"
      unit: "m^2/day"
      source_kind: "calibrated"
      model_input_format: ".ohq constituent property value[unit]"
      notes: "Constituent mixing between blocks; low sensitivity."
    - category: "reaction_kinetics"
      name: "Reaction parameters (base_value, reference_temperature, Arrhenius_factor)"
      unit: "per parameter (e.g. mu_H 1/day, K_s g/m^3, Y_H gCOD/gCOD)"
      source_kind: "calibrated"
      model_input_format: ".ohq reaction_parameter declarations; rate_expression references them"
      notes: "ASM1-style example set: mu_H, K_s, K_o, mu_N, K_n, K_on, mu_dn, K_dn, b_H, Y_H. Each parameter carries base_value + temperature correction. base_value left at 0 silently disables the reaction."
    - category: "numerical"
      name: "c_n_weight"
      unit: "dimensionless (0-1)"
      source_kind: "default"
      model_input_format: "settings.json / .ohq solver setting"
      notes: "Crank-Nicholson weight; 1=implicit/stable-diffusive, 0=explicit/accurate-oscillatory. Default 1. Low sensitivity to results but high impact on stability."
  initial_conditions:
    - category: "hydraulic_state"
      name: "Initial Storage / head / piezometric_head"
      unit: "m^3 / m"
      source_kind: "user_provided"
      model_input_format: ".ohq block initial property value[unit]"
      notes: "Starting water level/volume per block."
    - category: "water_quality_state"
      name: "Initial constituent concentration"
      unit: "g/m^3 (= mg/L)"
      source_kind: "user_provided"
      model_input_format: ".ohq constituent initial concentration value[unit]"
      notes: "Starting per-block species concentration (DOM, O2, NH3, NOx, ...)."
  boundary_conditions:
    - category: "boundary_block"
      name: "fixed_head boundary"
      unit: "m (head)"
      source_kind: "user_provided"
      model_input_format: ".ohq create block fixed_head with head + large dummy Storage"
      notes: "Acts as an infinite reservoir only if Storage is large (e.g. 100000 m^3); small Storage lets the head drift, silently violating the BC."
    - category: "atmospheric_exchange"
      name: "Atmospheric exchange / aeration source"
      unit: "g/m^3 (target saturation)"
      source_kind: "user_provided"
      model_input_format: ".ohq create source (atmospheric exchange) referenced before dependent blocks"
      notes: "Maintains dissolved O2 toward saturation."
    - category: "solver_control"
      name: "Solver control settings (nr_tolerance, minimum_timestep, initial_time_step, write_interval, simulation end time)"
      unit: "various (days, dimensionless, count)"
      source_kind: "user_provided"
      model_input_format: "settings.json / .ohq solver and simulation settings"
      notes: "Control HOW the run executes. write_interval larger than run length yields no output rows; end time defaults to 1 day if omitted."

processes:
  modules:
    - name: "Aquifolium System driver"
      role: "driver"
      brief: "Top-level container assembled from .ohq scripts + JSON templates; holds blocks/links/sources/constituents/reactions, owns solver settings and simulation parameters, runs the Solve() time loop."
    - name: "Transient time loop (Solve)"
      role: "integrator"
      brief: "Adaptive-timestep transient integrator: advances time by dt in days, solves each state variable in solvevariableorder, grows/shrinks dt from Newton iteration counts within timestep min/max factor bounds, records outputs at write_interval."
    - name: "Newton-Raphson step solver (OneStepSolve)"
      role: "process_solver"
      brief: "Implicit Crank-Nicholson-weighted Newton-Raphson solve of one state variable per step; assembles residuals, solves the linear system, damps with the NR relaxation coefficient, retries with reduced dt on convergence failure."
    - name: "Jacobian assembly"
      role: "process_solver"
      brief: "Builds and caches the Jacobian and its inverse (dense Armadillo or sparse SuperLU) for the Newton update by perturbing state variables to estimate sensitivities."
    - name: "Residual / flow evaluation"
      role: "process_solver"
      brief: "Evaluates block mass-balance residuals and link flux equations (wide_channel Manning, weir, pipe, Darcy) from connected block head/storage, including outflow limiting when a block empties."
    - name: "Block"
      role: "allocator"
      brief: "Network control volume; aggregates inflows/outflows over incident links, holds balance-type state (storage, head), enforces outflow limiting."
    - name: "Link"
      role: "allocator"
      brief: "Connector between source and destination blocks; computes flux from connected block states; supports outflow limiting."
    - name: "Quantity store (Quan / QuanSet)"
      role: "optional_module"
      brief: "Per-object named-quantity container; quantity type {balance, expression, timeseries, ...} defines what is integrated as state versus recomputed as a derived expression."
    - name: "Expression evaluator (CalcAllExpressions)"
      role: "process_solver"
      brief: "Parses and evaluates user-defined algebraic rate/rule expressions attached to quantities; recomputes all expression-type quantities each step from updated balance state."
    - name: "Solute transport"
      role: "process_solver"
      brief: "Advection + diffusion of constituents between blocks via the transport (TR) Newton path on the same block-link topology and Jacobian machinery as flow."
    - name: "Reaction kinetics"
      role: "process_solver"
      brief: "User-defined Monod-type rate expressions with stoichiometric constants and Arrhenius temperature correction; adds source/sink terms to constituent balances per block."
    - name: "Activated Sludge Models (ASM)"
      role: "optional_module"
      brief: "Heterotrophic growth/decay, nitrification, denitrification reaction set for wastewater reactors."
      applicability: "wastewater reactors (ASM1 parameter set documented; ASM3/ASM5 asserted)"
    - name: "Evapotranspiration"
      role: "optional_module"
      brief: "Penman and simple ET methods driven by climate forcing (temperature, wind, solar, RH); supplies an atmospheric water-loss source to blocks."
    - name: "Mass transfer / sorption / buildup-washoff"
      role: "optional_module"
      brief: "Sorption between mobile and immobile phases and pollutant accumulation/removal for contaminant fate."
    - name: "Source / TimeSeries forcing"
      role: "optional_module"
      brief: "External boundary sources and time-series (inflow, loading, atmospheric exchange) supplying time-varying inputs to blocks."
    - name: "MetaModel template layer"
      role: "optional_module"
      brief: "Injects shared template quantities/properties into all blocks and links at load time."
    - name: "Parameter estimation (GA / MCMC)"
      role: "optional_module"
      brief: "Repeatedly runs Solve() to fit hydraulic and reaction parameters: genetic-algorithm MLE (optimize mode) and MCMC Bayesian inversion (inverse_model mode) against observations."
  internal_edges:
    - from: "Source / TimeSeries forcing"
      to: "Block"
      kind: "consumes_input"
      brief: "External sources and time-series forcing feed inflows and loading into blocks."
    - from: "Evapotranspiration"
      to: "Block"
      kind: "writes_state"
      brief: "ET source removes water from block storage."
    - from: "Aquifolium System driver"
      to: "Transient time loop (Solve)"
      kind: "invokes"
      brief: "Solve() drives the transient loop after assembly and parameter application."
    - from: "Transient time loop (Solve)"
      to: "Newton-Raphson step solver (OneStepSolve)"
      kind: "invokes"
      brief: "Each timestep, per state variable in solvevariableorder, calls the Newton step solver."
    - from: "Newton-Raphson step solver (OneStepSolve)"
      to: "Residual / flow evaluation"
      kind: "invokes"
      brief: "Newton iteration evaluates block/link residuals at the trial state."
    - from: "Newton-Raphson step solver (OneStepSolve)"
      to: "Jacobian assembly"
      kind: "invokes"
      brief: "Assembles Jacobian and inverse for the Newton update."
    - from: "Newton-Raphson step solver (OneStepSolve)"
      to: "Quantity store (Quan / QuanSet)"
      kind: "writes_state"
      brief: "Converged balance values written back into each block/link quantity."
    - from: "Quantity store (Quan / QuanSet)"
      to: "Expression evaluator (CalcAllExpressions)"
      kind: "reads_state"
      brief: "Expression evaluation reads current balance state via quantity pointers."
    - from: "Expression evaluator (CalcAllExpressions)"
      to: "Quantity store (Quan / QuanSet)"
      kind: "writes_state"
      brief: "Recomputes all expression-type quantities from updated balance state each step."
    - from: "Link"
      to: "Block"
      kind: "reads_state"
      brief: "Link flux computed from source/destination block head/storage."
    - from: "Block"
      to: "Link"
      kind: "reads_state"
      brief: "Block mass balance aggregates flows over incident links."
    - from: "Block"
      to: "Link"
      kind: "writes_state"
      brief: "Outflow limiting gates link flux when block storage is depleted."
    - from: "Residual / flow evaluation"
      to: "Solute transport"
      kind: "invokes"
      brief: "Flow-side state feeds the constituent transport (TR) Newton path on the same topology."
    - from: "Solute transport"
      to: "Reaction kinetics"
      kind: "invokes"
      brief: "Transport supplies constituent concentrations to the reaction rate expressions."
    - from: "Reaction kinetics"
      to: "Block"
      kind: "writes_state"
      brief: "Reaction source/sink terms modify per-block constituent concentrations."
    - from: "Climate"
      to: "Evapotranspiration"
      kind: "consumes_input"
      brief: "Temperature, wind, solar, RH time series drive the Penman ET computation."
    - from: "MetaModel template layer"
      to: "Block"
      kind: "writes_state"
      brief: "Injects shared template quantities into every block at load."
    - from: "MetaModel template layer"
      to: "Link"
      kind: "writes_state"
      brief: "Injects shared template quantities into every link at load."
    - from: "Parameter estimation (GA / MCMC)"
      to: "Aquifolium System driver"
      kind: "invokes"
      brief: "GA/MCMC repeatedly run System.Solve to fit parameters against observations."
    - from: "Transient time loop (Solve)"
      to: "Outputs"
      kind: "produces_output"
      brief: "Records flagged block/link quantities into the output time series at write_interval."

states:
  variables:
    - name: "Storage / water volume"
      unit: "m^3"
      role: "prognostic"
    - name: "head / piezometric_head"
      unit: "m"
      role: "prognostic"
    - name: "constituent concentration"
      unit: "g/m^3"
      role: "prognostic"
    - name: "sediment / immobile-phase mass"
      unit: "g"
      role: "prognostic"
    - name: "link flow / flux"
      unit: "m^3/day"
      role: "diagnostic"
    - name: "reaction rate"
      unit: "g/m^3/day"
      role: "diagnostic"
    - name: "evapotranspiration flux"
      unit: "m^3/day"
      role: "diagnostic"
    - name: "objective function / fit measure"
      unit: "dimensionless"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "constituent_concentration"
    validation_rank: 1
    unit: "g/m^3 (= mg/L)"
    description: "Per-block/per-link water-quality species concentration over time (e.g., O2, DOM, NH3, NOx)."
    emitted_in: "output.txt (column header 'block_name:variable_name')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Compare at the block/station representing the monitored location; concentrations in mg/L."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Grab-sample or effluent-event concentration at a single instant."]
      detrending_options: ["none"]
  - var: "flow"
    validation_rank: 2
    unit: "m^3/day"
    description: "Hydraulic flow through links (channels, weirs, pipes, Darcy connections)."
    emitted_in: "output.txt (column header 'link_name:flow')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Gauge units typically m^3/s; convert (x86400) before comparing to the m^3/day output.", "Peak-timing accuracy relevant for event hydrographs."]
      detrending_options: ["none"]
  - var: "head_storage"
    validation_rank: 3
    unit: "m / m^3"
    description: "Per-block water level (head) and storage volume over time."
    emitted_in: "output.txt (column header 'block_name:head' or ':Storage')"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats: ["Water-table / stage observations at the block representing the monitored well or pond."]
      detrending_options: ["none"]
  - var: "evapotranspiration"
    validation_rank: 4
    unit: "m^3/day (or mm/day over block area)"
    description: "Atmospheric water-loss flux computed by the Penman/simple ET source."
    emitted_in: "output.txt (ET source / block water-balance term)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Convert volumetric flux to depth using block area before comparing to mm/day ET observations."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "hydraulic_conductivity (saturated, engineered media / native soil)"
      to: "flow"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "infiltration / green-infrastructure / GW-SW exchange blocks"
      citations: ["alikhani2020_bioretention_cincinnati", "massoudieh2017_gifmod_framework"]
    - from: "hydraulic_conductivity (saturated)"
      to: "head_storage"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "runoff-reduction / retention performance"
      citations: ["alikhani2020_bioretention_cincinnati"]
    - from: "media_depth / storage geometry"
      to: "flow"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "storage routing through media/soil-layer blocks"
      citations: ["alikhani2020_bioretention_cincinnati", "massoudieh2017_gifmod_framework"]
    - from: "link_conductance (hydraulic conductivity / Manning roughness)"
      to: "head_storage"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      citations: ["massoudieh2023_openhydroqual_framework", "massoudieh2017_gifmod_framework"]
    - from: "reaction_rate_constant (decay / Monod rate)"
      to: "constituent_concentration"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "reactive-transport / effluent water quality"
      citations: ["alikhani2020_transit_time_pollutant", "massoudieh2023_openhydroqual_framework"]
    - from: "settling_velocity"
      to: "constituent_concentration"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "particulate pollutant removal in storage blocks"
      citations: ["alikhani2020_transit_time_pollutant"]
    - from: "hydraulic_residence_time (storage depth x link conductance)"
      to: "constituent_concentration"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "unsteady pollutant removal"
      citations: ["alikhani2020_transit_time_pollutant"]
  citation_index:
    massoudieh2023_openhydroqual_framework:
      short_citation: "Massoudieh & Nguyen 2023"
      doi: "10.1016/j.envsoft.2023.105679"
      note: "Primary OpenHydroQual paper; block-link reactive-transport framework with GA/MCMC inverse modeling. Names head/storage-gradient flow and reaction-rate/settling/adsorption controls but reports no quantitative Sobol/Morris index."
    massoudieh2017_gifmod_framework:
      short_citation: "Massoudieh et al. 2017"
      doi: "10.1016/j.envsoft.2017.02.013"
      note: "GIFMod (OpenHydroQual's direct predecessor, identical block/link governing equations). Identifies saturated hydraulic conductivity, media depth, and reaction-rate constants as dominant/estimated parameters; local+global SA but no published numeric index transferable to OHQ."
    alikhani2020_bioretention_cincinnati:
      short_citation: "Alikhani et al. 2020 (JSWBE)"
      doi: "10.1061/JSWBAY.0000903"
      note: "GIFMod/OHQ bioretention calibration; saturated Ksat and media depth/storage are dominant controls on outflow and runoff reduction (log-hydrograph NSE 0.68-0.86). Dominance inferred from calibration unknowns, not a quantitative SA index."
    alikhani2020_transit_time_pollutant:
      short_citation: "Alikhani et al. 2020 (J. Hydrol.)"
      doi: "10.1016/j.jhydrol.2020.125193"
      note: "GIFMod/OHQ transit-time pollutant removal; effluent concentration controlled by reaction/decay rate, settling, and hydraulic residence time. Qualitative dominance, no published Sobol/Morris index."

safety:
  hazards:
    - id: "rate_time_unit_per_second"
      kind: "weather_file_semantic"
      description: "Flows / rates / diffusion entered per-second instead of per-day are 86400x off; OHQ is day-internal (m^3/day, 1/day, m^2/day)."
      severity: "silent"
    - id: "concentration_unit_1000x"
      kind: "weather_file_semantic"
      description: "Concentration in ug/L or mg/m^3 instead of g/m^3 (=mg/L) is 1000x high; Monod kinetics saturate at 1.0, hiding half-saturation effects."
      severity: "silent"
    - id: "ksat_unit_m_per_second"
      kind: "soil_semantic"
      description: "Hydraulic conductivity in m/s instead of m/day (86400x) drains the aquifer / water table to the bottom."
      severity: "silent"
    - id: "solar_radiation_MJ_vs_W"
      kind: "weather_file_semantic"
      description: "Solar radiation in MJ/m^2/day instead of W/m^2 makes Penman ET ~11.6x off (conversion factor 11.57)."
      severity: "silent"
    - id: "relative_humidity_percent_vs_fraction"
      kind: "weather_file_semantic"
      description: "RH supplied as percent (0-100) instead of fraction (0-1) inflates the vapour-pressure deficit and grossly overestimates Penman ET."
      severity: "silent"
    - id: "porosity_percent_vs_fraction"
      kind: "soil_semantic"
      description: "Porosity as percent (0-100) instead of dimensionless fraction (0-1) corrupts storage volume."
      severity: "silent"
    - id: "missing_unit_bracket"
      kind: "parser_semantic"
      description: "Omitting the [unit] bracket on a dimensional value is accepted silently and read in default units, giving wrong magnitude."
      severity: "silent"
    - id: "delimiter_confusion_drops_params"
      kind: "parser_semantic"
      description: "Semicolon used where a comma is required silently drops subsequent create-command parameters (semicolon separates command fields, comma separates key=value pairs)."
      severity: "silent"
    - id: "weir_spelled_wier"
      kind: "parser_semantic"
      description: "OHQ spells weir as 'wier' in the template; using standard 'weir' triggers an unknown-type lookup failure."
      severity: "fatal"
    - id: "reaction_base_value_zero"
      kind: "coefficient_runtime_silent_fallback"
      description: "Reaction parameter base_value left at placeholder 0 makes the rate expression evaluate to zero, silently disabling the reaction while the run completes normally."
      severity: "silent"
    - id: "fixed_head_storage_too_small"
      kind: "initial_condition_semantic"
      description: "fixed_head boundary block with too-small Storage lets the boundary head drift, silently violating the prescribed boundary condition (needs ~100000 m^3 dummy volume)."
      severity: "degraded"
    - id: "cn_weight_explicit_instability"
      kind: "numerical_instability"
      description: "Low Crank-Nicholson weight (c_n_weight 0-0.3) with a large initial_time_step violates the explicit-scheme stability limit, causing oscillation, negative concentrations, and divergence to NaN/Inf."
      severity: "fatal_or_silent"
    - id: "nr_tolerance_vs_min_timestep_stall"
      kind: "numerical_instability"
      description: "Over-tight nr_tolerance (e.g. 1e-10) relative to minimum_timestep for a highly nonlinear system stalls the Newton solver at 100% CPU with negligible per-step progress."
      severity: "fatal"
    - id: "default_end_time_or_write_interval_no_output"
      kind: "control_semantic"
      description: "Simulation end time defaults to 1 day if omitted, and a write_interval larger than the run length writes zero output rows; both produce empty/too-short results without an error."
      severity: "silent"
  validation_limits:
    - "Spatial structure is user-defined via the block-link graph; the engine has no fixed internal grid and no native fully-distributed routing."
    - "Daily-internal time base; sub-daily processes must be resolved through small timesteps but the model is parameterized in days."
    - "No closed surface energy budget; ET is a demand-side flux source, so energy-limited ET regimes are only approximated."
    - "No dedicated peer-reviewed global sensitivity (Sobol/Morris) study exists for OpenHydroQual specifically; quantitative sensitivity is inferred from the GIFMod predecessor."
  warnings:
    - "Crank-Nicholson c_n_weight=1 is stable but numerically diffusive; c_n_weight<1 is more accurate but can oscillate and produce negative concentrations that cascade to NaN with fast reactions."
    - "NaN/Inf or negative concentrations in output indicate numerical instability (typically explicit scheme + large timestep); reduce initial_time_step and raise c_n_weight."
    - "Loading a system invokes omp_set_num_threads(n_threads), silently reconfiguring the process-global OpenMP thread count."
    - "Reaction parameters use base_value + reference_temperature + Arrhenius_factor; the temperature correction is applied relative to reference_temperature, so a mismatched reference shifts all rates."
  assumptions:
    - statement: "All internal time quantities (simulation start/end, timestep, flow rates, reaction rates, diffusion) are in DAYS; inputs must be converted to per-day before entry."
      scope: "entire model time base"
      source: "OpenHydroQual documentation (time-base convention) and Aquifolium System/SolverSettings source"
      status: "adopted"
    - statement: "Mass/volume balance closure applies to water and tracked constituents per block; ET is a demand-side flux source, not a closed surface energy budget."
      scope: "conservation closure"
      source: "OpenHydroQual Theory and Equations Manual (block-link mass balance) and ET source formulation"
      status: "adopted"
    - statement: "Each block is a lumped (zero-dimensional) control volume; spatial resolution emerges only from the user-defined block-link network, not from any internal grid."
      scope: "spatial geometry"
      source: "Massoudieh & Nguyen 2023 (EMS, doi:10.1016/j.envsoft.2023.105679) block-link paradigm"
      status: "adopted"
    - statement: "Sensitivity edges are transferred from the GIFMod predecessor (same lead author, identical block-link governing equations); grades reflect calibration-dominance, not published quantitative indices, so none exceed MEDIUM."
      scope: "influence block evidence basis"
      source: "Massoudieh et al. 2017 (doi:10.1016/j.envsoft.2017.02.013) and Alikhani et al. 2020"
      status: "tentative"
    - statement: "ASM1 reaction-parameter set is the documented activated-sludge configuration; ASM3/ASM5 are asserted as capabilities but not parameter-documented, so the ASM module is treated as ASM1 unless the user supplies otherwise."
      scope: "wastewater reaction module"
      source: "OpenHydroQual capabilities list and wastewater.json template (ASM1 parameter table)"
      status: "tentative"
