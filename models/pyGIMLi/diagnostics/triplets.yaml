# ==========================================================================
# pyGIMLi Diagnostic Triplets
# ==========================================================================
# 18 triplets. RESTORED 2026-08-12 from the KDT dag-generation
# capture triplets.yaml
# after the self-improve overlay overwrote the corpus. Top-level LIST — do not
# wrap these entries in a `triplets:` key.
# ==========================================================================

- id: dt_001
  symptom: Inverted resistivity model values are 1000x higher than expected for site geology (model range
    10000-1e8 Ohm·m for typical sedimentary site)
  diagnosis: Input apparent resistivity is in Ohm (resistance) instead of Ohm·m (resistivity); geometric
    factor k was not applied to convert resistance (V/I) to apparent resistivity (k x V/I)
  remedy: 'Apply geometric factor: rhoa = k * R, where k = 2pi / (1/AM - 1/AN - 1/BM + 1/BN); verify rhoa
    range is 1-10000 Ohm·m before inversion'
  severity: silent
- id: dt_002
  symptom: SRT inversion produces velocities 1000x too high (e.g. 500000 m/s); velocity range exceeds
    10000 m/s for near-surface survey
  diagnosis: Travel times are in milliseconds instead of seconds; pyGIMLi expects seconds, so 1000x-too-large
    times give 1000x-too-small slowness and unrealistic velocities
  remedy: 'Divide travel times by 1000: data[''t''] /= 1000.0; check that t range is 0.001-0.1 s for near-surface'
  severity: silent
- id: dt_003
  symptom: Mesh generation fails with 'degenerate triangle' or nonsensical geometry; mesh covers < 1 m
    or > 10000 km
  diagnosis: Electrode/sensor coordinates are in lat/lon degrees instead of local metres, producing a
    ~0.01 m wide mesh or numerical precision issues
  remedy: Project coordinates to local Cartesian (UTM or subtract centroid); verify survey extent is 10-1000
    m for typical surveys
  severity: fatal
- id: dt_004
  symptom: IP inversion produces nonsensical Cole-Cole parameters (tau and c out of range); phase values
    > 100 mrad or positive when should be negative
  diagnosis: IP phase sign convention mismatch — pyGIMLi's SIP framework expects negative phase (lag convention)
    but some instruments report positive phase
  remedy: 'Negate phase values: data[''ipa''] = -abs(data[''ipa'']); check instrument manual for sign
    convention'
  severity: silent
- id: dt_005
  symptom: Chi-squared is either extremely high (>100) or extremely low (<0.01); inversion converges but
    chi² never reaches ~1.0
  diagnosis: Error estimates provided as percentage (0-100) instead of fraction (0-1); data weighting
    is 100x wrong, errors-as-percent give chi² ~100x too small (overfitting)
  remedy: 'Convert errors: if max(err) > 1, divide by 100; data[''err''] should be 0.01-0.20 (e.g. 3%
    -> 0.03); use ert.estimateError() if unsure'
  severity: degraded
- id: dt_006
  symptom: createParaMesh fails with segfault or 'no valid triangulation' (segmentation fault in Triangle
    library)
  diagnosis: Duplicate or overlapping electrode positions in DataContainer; Triangle requires unique node
    positions or Delaunay triangulation fails
  remedy: Remove duplicate sensors (check with 1mm tolerance), snap to grid if very close, re-number ABMN
    indices after removing electrodes
  severity: fatal
- id: dt_007
  symptom: Inversion produces edge artifacts — extreme resistivity/velocity values spike at model boundaries
  diagnosis: Boundary region too small — the FEM zero-flux/fixed boundary condition leaks into the parametric
    domain when the mesh boundary is too close to the sensor array
  remedy: 'Increase boundary factor to 3-5x the electrode spread: createParaMesh(data, boundary=5); or
    mask boundary cells where coverage < 0.1'
  severity: degraded
- id: dt_008
  symptom: Inversion is very slow (hours instead of minutes) or runs out of memory; mesh.cellCount() >
    100000
  diagnosis: Mesh is too fine — paraMaxCellSize too small or quality too high; Jacobian is n_data x n_cells
    and normal equations scale O(n³), so >50000 cells is excessive for 2D ERT
  remedy: Increase paraMaxCellSize (≈electrode_spacing²); reduce quality from 34 to 30; aim for 2000-20000
    cells in 2D; check cellCount before inversion
  severity: degraded
- id: dt_009
  symptom: Model is extremely smooth — no anomalies visible despite known geology; chi² decreasing but
    model looks flat
  diagnosis: Regularization parameter lambda is too high, over-penalizing model roughness and producing
    a homogeneous-half-space-like model that fits data poorly
  remedy: Reduce lambda by factor 2-5 and re-run (lam=20->10->5->2); target chi² ≈ 1.0, do not go below
    chi² = 0.5
  severity: degraded
- id: dt_010
  symptom: 'Inversion diverges — chi² increases or NaN values appear in model (RuntimeWarning: invalid
    value; NaN in model vector)'
  diagnosis: Zero or negative error estimates, or data incompatible with transform; TransLogLU requires
    strictly positive data, so zero/negative rhoa gives NaN/Inf and zero errors give infinite weights
  remedy: Remove data where rhoa <= 0; set error floor data['err'] = max(err, 0.01); for negative rhoa
    check electrode numbering (ABMN swap)
  severity: fatal
- id: dt_011
  symptom: Checkerboard-like artifacts near current/source electrodes in ERT — regular high/low pattern
    at electrode positions
  diagnosis: Singularity removal (SR) is disabled in ERTModelling; the FEM point-source singularity at
    current electrodes propagates numerical error into the Jacobian and model, looking like real structure
  remedy: 'Enable singularity removal: ERTManager(data, sr=True) (default is True); never disable sr without
    a specific reason'
  severity: silent
- id: dt_012
  symptom: SRT inversion produces velocity-inversion artefact — slower layer above faster, velocity decreasing
    with depth in a clearly layered setting
  diagnosis: Velocity/slowness transform confusion — pyGIMLi inverts for slowness (s/m) not velocity;
    applying TransLog assuming velocity parameterization produces artifacts
  remedy: Use default TravelTimeManager(data) — do not override modelTrans; model values are slowness,
    display velocity = 1/slowness
  severity: silent
- id: dt_013
  symptom: Systematic misfit pattern — residuals are structured not random; residual pseudosection shows
    consistent positive/negative bands
  diagnosis: Systematic data error (electrode contact problems, cable cross-talk, instrument drift) not
    captured by the random-noise error model, producing structured residuals that smooth regularization
    cannot reproduce
  remedy: Identify and remove systematic outliers (|residual/error| > 3); use reciprocal error as data
    error; check for dead electrodes
  severity: degraded
- id: dt_014
  symptom: Inversion requires many iterations (>15) and chi² plateaus above 2; chi² stalls at 2-5 after
    10+ iterations
  diagnosis: Starting model too far from the true model; Gauss-Newton is locally convergent, so poor linearization
    gives slow convergence or a local minimum
  remedy: 'Set a data-statistics starting model: ERT startModel = exp(mean(log(rhoa))); SRT from median
    apparent velocity; or use 1D result as 2D start'
  severity: degraded
- id: dt_015
  symptom: Model shows many small-scale fluctuations not matching known geology; noisy cell-to-cell variation
    with chi² < 0.5
  diagnosis: Overfitting — lambda too low or error estimates too large; when chi² << 1 the inversion fits
    noise, producing spurious small-scale structure
  remedy: Increase lambda (double and re-run if chi² < 0.5) or reduce error estimates; use robustData=True
    for L1 norm; target chi² = 1.0 ± 0.2
  severity: degraded
- id: dt_016
  symptom: Depth of investigation appears half of expected from electrode spread; model resolves only
    shallow features, deep anomalies missed
  diagnosis: Electrode spacing unit error — positions in decimetres/centimetres instead of metres, making
    the mesh 100x too small so the depth axis is compressed
  remedy: Verify and correct electrode position units to metres; check data.sensors() range matches physical
    survey extent (1/100 of expected => cm)
  severity: silent
- id: dt_017
  symptom: ERT model in borehole geometry is physically unreasonable; resistivity > 1e6 or < 0.01 near
    borehole electrodes
  diagnosis: Analytical geometric factor (assumes homogeneous half-space with surface electrodes) used
    for borehole/crosshole/surface+borehole geometry, producing systematically biased apparent resistivities
  remedy: 'Use numerical geometric factor with a mesh: k = ert.createGeometricFactors(data, mesh=createParaMesh(data));
    always numerical k for non-standard geometries'
  severity: silent
- id: dt_018
  symptom: Model looks reasonable but low-coverage regions show misleading structure; anomalies appear
    in regions with coverage < 10%
  diagnosis: Displaying full model without coverage masking; low cumulative-sensitivity cells are controlled
    by regularization and starting model rather than data, so showing them at full opacity is geophysically
    misleading
  remedy: 'Display model with coverage mask/alpha: coverage = sumCols(jacobian)/max; pg.show(mesh, model,
    coverage=coverage) or mask cells where coverage < 0.1'
  severity: silent
