# format_spec.yaml — Machine-readable model format specification
# Used by debug_framework.py Level 1 (input validation) and Level 3 (output validation)
# Part of KDT Knowledge Infrastructure Tier B documentation
#
# Aligns with UNIVERSAL_BOUNDS and DOMAIN_CHECKS in debug_framework.py:
#   - Input ranges map to Level 1 check_value_range() calls
#   - Output ranges map to Level 3 DOMAIN_CHECKS["hydrology"]
#   - known_issues map to diagnostic triplets (triplets.yaml)

model:
  name: "VIC 5.1.0"
  domain: "hydrology"
  binary: "vic_classic.exe"
  binary_path: "KISSPATH_BINARIES/VIC-5.1.0/vic/drivers/classic/vic_classic.exe"
  language: "C"
  working_directory: "./"
  invocation: "vic_classic.exe -g global_param.txt"

# =========================================================================
# INPUTS
# =========================================================================
inputs:

  forcing:
    - name: "air_temperature"
      file: "forcing_{lat}_{lon}"
      column: 0
      unit: "degC"
      valid_range: [-60.0, 60.0]
      format: "space-delimited ASCII, one file per grid cell"
      missing_value: -9999
      conversion_from_cmfd: "K -> degC: subtract 273.15; mean of 8 3-hourly timesteps"

    - name: "precipitation"
      file: "forcing_{lat}_{lon}"
      column: 1
      unit: "mm/timestep"
      valid_range: [0.0, 500.0]
      format: "space-delimited ASCII"
      missing_value: -9999
      conversion_from_cmfd: "kg/m2/s -> mm/3hr: multiply by 10800"

    - name: "air_pressure"
      file: "forcing_{lat}_{lon}"
      column: 2
      unit: "kPa"
      valid_range: [50.0, 110.0]
      conversion_from_cmfd: "Pa -> kPa: divide by 1000"

    - name: "shortwave_radiation"
      file: "forcing_{lat}_{lon}"
      column: 3
      unit: "W/m2"
      valid_range: [0.0, 1400.0]
      conversion_from_cmfd: "W/m2 -> W/m2: no conversion needed"

    - name: "longwave_radiation"
      file: "forcing_{lat}_{lon}"
      column: 4
      unit: "W/m2"
      valid_range: [0.0, 600.0]

    - name: "vapor_pressure"
      file: "forcing_{lat}_{lon}"
      column: 5
      unit: "kPa"
      valid_range: [0.0, 10.0]

    - name: "wind_speed"
      file: "forcing_{lat}_{lon}"
      column: 6
      unit: "m/s"
      valid_range: [0.0, 80.0]

  parameters:
    critical:
      - name: "FROZEN_SOIL"
        file: "global_param.txt"
        description: "Frozen soil flag — must be TRUE or FALSE, not a path"
        valid_range: ["TRUE", "FALSE"]
        default: "FALSE"
        bug_history: >
          config_paths.py regex substitution can corrupt this line,
          replacing the boolean with a file path. VIC errors with
          'is neither TRUE nor FALSE'. Always verify after running config_paths.py.

      - name: "LAI_SRC"
        file: "global_param.txt"
        description: "LAI source flag — must be FROM_VEGPARAM or FROM_VEGLIB"
        valid_range: ["FROM_VEGPARAM", "FROM_VEGLIB"]
        default: "FROM_VEGPARAM"
        bug_history: >
          config_paths.py can append extra path text to this line.
          Must be exactly FROM_VEGPARAM with no trailing path.

      - name: "FORCING1 prefix"
        file: "global_param.txt"
        description: "Forcing file name prefix — must match actual filenames"
        bug_history: >
          Mismatch between FORCING1 prefix and actual forcing file names
          causes 'Unable to open File' error. Check with ls forcing_final/.

      - name: "MODEL_STEPS_PER_DAY"
        file: "global_param.txt"
        description: "Number of model timesteps per day"
        valid_range: [1, 24]
        default: 8
        notes: "Must match FORCE_STEPS_PER_DAY and the forcing temporal resolution"

      - name: "infilt (binfilt)"
        file: "SOIL_PARAM_COMPLETE.txt"
        description: "Variable infiltration curve parameter"
        valid_range: [0.0, 0.4]
        default: 0.2
        sensitivity: "very high"
        notes: "Primary calibration parameter. Controls surface vs subsurface runoff partition."

    calibration:
      - name: "binfilt"
        file: "SOIL_PARAM_COMPLETE.txt"
        description: "Variable infiltration curve parameter"
        valid_range: [0.001, 0.4]
        sensitivity: "very high"
        notes: "Lower values produce more baseflow, higher values more surface runoff"

      - name: "Ds"
        file: "SOIL_PARAM_COMPLETE.txt"
        description: "Fraction of Dsmax where non-linear baseflow begins"
        valid_range: [0.0, 1.0]
        default: 0.001
        sensitivity: "high"

      - name: "Dsmax"
        file: "SOIL_PARAM_COMPLETE.txt"
        description: "Maximum baseflow velocity (mm/day)"
        valid_range: [0.0, 30.0]
        default: 10.0
        sensitivity: "high"

      - name: "Ws"
        file: "SOIL_PARAM_COMPLETE.txt"
        description: "Fraction of max soil moisture where non-linear baseflow begins"
        valid_range: [0.5, 1.0]
        default: 0.9
        sensitivity: "high"

      - name: "soil_depth"
        file: "SOIL_PARAM_COMPLETE.txt"
        description: "Soil layer depths (3 layers)"
        valid_range: [0.01, 3.0]
        unit: "meters"
        sensitivity: "moderate"

  files:
    required:
      - name: "global_param.txt"
        description: "Master control file with all paths, time settings, physics options"
        format: "key-value text"
        notes: "All paths must be absolute. Time range must match forcing data."

      - name: "SOIL_PARAM_COMPLETE.txt"
        description: "Soil parameters for all grid cells"
        format: "space-delimited; one row per grid cell, ~50+ columns"
        notes: "Column 1 = run flag (1=active). Lat/lon must match forcing filenames."

      - name: "vic_veg_param_final.txt"
        description: "Vegetation parameters per grid cell"
        format: "multi-line records: header + N vegetation types per cell"
        notes: "Root zone fractions may sum to >1 (VIC normalizes internally, warning only)"

      - name: "forcing files"
        description: "One ASCII file per grid cell with 7 meteorological variables"
        format: "space-delimited, 3-hourly or daily, columns match OUTVAR order"

# =========================================================================
# OUTPUTS
# =========================================================================
outputs:

  primary:
    - name: "runoff"
      file: "huaihe_fluxes_{lat}_{lon}.txt"
      variable: "OUT_RUNOFF"
      unit: "mm/timestep"
      valid_range: [0, null]
      notes: "Surface runoff per grid cell per timestep"

    - name: "baseflow"
      file: "huaihe_fluxes_{lat}_{lon}.txt"
      variable: "OUT_BASEFLOW"
      unit: "mm/timestep"
      valid_range: [0, null]
      notes: "Subsurface baseflow per grid cell per timestep"

    - name: "evapotranspiration"
      file: "huaihe_fluxes_{lat}_{lon}.txt"
      variable: "OUT_EVAP"
      unit: "mm/timestep"
      valid_range: [0, 20.0]

    - name: "soil_moisture"
      file: "huaihe_fluxes_{lat}_{lon}.txt"
      variable: "OUT_SOIL_MOIST"
      unit: "mm"
      valid_range: [0, null]

    - name: "precipitation"
      file: "huaihe_fluxes_{lat}_{lon}.txt"
      variable: "OUT_PREC"
      unit: "mm/timestep"
      valid_range: [0, 500.0]

  netcdf_postprocessed:
    - name: "total_runoff"
      file: "{basin}_runoff_1d_YYYY.nc"
      variable: "Runoff"
      unit: "mm/day"
      dimensions: ["time", "lat", "lon"]
      notes: "OUT_RUNOFF + OUT_BASEFLOW combined for CaMa-Flood input"

# =========================================================================
# KNOWN ISSUES
# =========================================================================
known_issues:
  - id: "frozen_soil_corrupted"
    description: "FROZEN_SOIL line corrupted by config_paths.py regex substitution"
    affected_output: "Model fails to start"
    detection: "Error message 'is neither TRUE nor FALSE'"
    fix: "Manually set FROZEN_SOIL to FALSE in global_param.txt"

  - id: "lai_src_corrupted"
    description: "LAI_SRC line has trailing path appended by config_paths.py"
    affected_output: "Model fails to start or wrong LAI source"
    detection: "Check global_param.txt for extra text after FROM_VEGPARAM"
    fix: "Manually correct to exactly FROM_VEGPARAM"

  - id: "forcing_prefix_mismatch"
    description: "FORCING1 prefix in global_param.txt does not match actual forcing filenames"
    affected_output: "Fatal: Unable to open File"
    detection: "Compare FORCING1 prefix with ls forcing_final/ | head -1"
    fix: "Update FORCING1 to match actual file naming pattern"

  - id: "time_range_mismatch"
    description: "Simulation time range exceeds forcing data availability"
    affected_output: "Fatal: Not enough records in forcing file"
    detection: "Compare STARTYEAR/ENDYEAR with forcing file content"
    fix: "Synchronize time range in three places: forcing_1d.py, process_forcing.py, global_param.txt"

  - id: "path_inconsistency"
    description: "Output files scattered across vic_temp vs basin/vic_temp directories"
    affected_output: "File not found errors at various stages"
    detection: "Check all paths in global_param.txt resolve correctly"
    fix: "Unify all paths under outputs/{basin_name}/"

  - id: "root_zone_sum_warning"
    description: "Root zone fractions sum to more than 1"
    affected_output: "Warning only — VIC auto-normalizes"
    severity: "warning"

# =========================================================================
# EXPECTED RANGES (Huai River reference)
# =========================================================================
expected_ranges:
  bengbu_huai_river:
    basin_area_km2: 121330
    mean_annual_precip_mm: 800-1000
    mean_discharge_m3s: 800-1500

    hydrology:
      mean_runoff_mm_yr: 300-500
      runoff_ratio: 0.3-0.5
      notes: "VIC raw runoff (OUT_RUNOFF + OUT_BASEFLOW) before routing"

# =========================================================================
# CALIBRATION REFERENCE
# =========================================================================
calibration_reference:
  recommended_sequence:
    - "binfilt (0.001-0.4, primary runoff partition)"
    - "Ds (0.0-1.0, baseflow shape)"
    - "Dsmax (0.0-30.0, max baseflow rate)"
    - "Ws (0.5-1.0, soil moisture threshold)"
    - "soil_depth layers 1-3 (storage capacity)"

  target_metrics:
    - "NSE > 0.5"
    - "KGE > 0.5"
    - "PBIAS < 25%"

  notes: "VIC requires external routing (Lohmann, CaMa-Flood, mizuRoute) for discharge comparison with observed data."

# =========================================================================
# UNIT CONVERSION TABLE
# =========================================================================
unit_conversions:
  - variable: "precipitation"
    source: "CMFD (kg/m2/s)"
    target: "VIC (mm/3hr)"
    factor: 10800
    operation: "multiply"
    trap_if_wrong: "Runoff 10800x too high (raw kg/m2/s) or near zero"

  - variable: "temperature"
    source: "CMFD (K)"
    target: "VIC (degC)"
    offset: -273.15
    operation: "subtract"
    trap_if_wrong: "Values ~300 = still in Kelvin; wrong ET, wrong snow"

  - variable: "pressure"
    source: "CMFD (Pa)"
    target: "VIC (kPa)"
    factor: 0.001
    operation: "multiply"
    trap_if_wrong: "Pressure ~101325 instead of ~101.3"

  - variable: "shortwave_radiation"
    source: "CMFD (W/m2)"
    target: "VIC (W/m2)"
    operation: "none"
    notes: "VIC uses W/m2 natively — no conversion needed"
