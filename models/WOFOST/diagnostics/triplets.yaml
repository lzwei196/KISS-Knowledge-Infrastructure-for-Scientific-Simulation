      (RAIN = loader precip_mm) and trust create_csv_weather_file.py's docstring as ground
      truth.
  format_spec_violated: 'docs/format_spec.yaml: weather CSV RAIN column unit = mm/day (CSVWeatherDataProvider
    internal /10)'
  added_by_run: WOFOST_retry1
- id: dt_010_hwsd_adapter_missing
  symptom:
    description: convert_hwsd_to_pcse_soil.py logs HWSD adapter failed (No module named skills, Using
