# ============================================================================
# Model Coupling Registry -- WRF-Hydro v5.2.0 Standalone
# ============================================================================
# Documents data flows between WRF-Hydro and other HydroCraft models.
# ============================================================================

couplings:

  # --- CMFD -> WRF-Hydro LDASIN (read straight from the source) ---
  - id: "coupling_002"
    name: "CMFD direct to WRF-Hydro LDASIN"
    source_model: "CMFD (China Meteorological Forcing Dataset)"
    target_model: "WRF-Hydro v5.2.0"
    direction: "CMFD -> WRF-Hydro"
    description: >
      Convert CMFD 0.1-degree 3-hourly NetCDF forcing directly to LDASIN files,
      read straight from the CMFD store by this KI's own tool.
    tool: "cmfd_to_ldasin"
    tool_path: "tools/s8_forcing/cmfd_to_ldasin.py"

    variables:
      - source_variable: "temp (CMFD)"
        source_unit: "K"
        target_variable: "T2D"
        target_unit: "K"
        transformation: "Direct (CMFD is already in K)"
        silent_failure: "If converted to C first then back to K, round-trip error"

      - source_variable: "prec (CMFD)"
        source_unit: "kg/m^2/s (a rate; = mm/s)"
        target_variable: "RAINRATE"
        target_unit: "mm/s"
        transformation: "Direct (CMFD prec is already a rate in kg/m^2/s = mm/s)"
        silent_failure: "Dividing or multiplying the CMFD rate (by 3600 or 10800) makes rainfall wrong by that factor"

      - source_variable: "pres (CMFD)"
        source_unit: "Pa"
        target_variable: "PSFC"
        target_unit: "Pa"
        transformation: "Direct"

      - source_variable: "srad (CMFD)"
        source_unit: "W/m^2"
        target_variable: "SWDOWN"
        target_unit: "W/m^2"
        transformation: "Direct"

      - source_variable: "lrad (CMFD)"
        source_unit: "W/m^2"
        target_variable: "LWDOWN"
        target_unit: "W/m^2"
        transformation: "Direct"

      - source_variable: "shum (CMFD)"
        source_unit: "kg/kg"
        target_variable: "Q2D"
        target_unit: "kg/kg"
        transformation: "Direct (CMFD provides specific humidity directly)"

      - source_variable: "wind (CMFD)"
        source_unit: "m/s"
        target_variable: "U2D, V2D"
        target_unit: "m/s"
        transformation: "U2D = wind * 0.7071; V2D = wind * 0.7071"

  # --- WRF-Hydro -> CaMa-Flood ---
  - id: "coupling_003"
    name: "WRF-Hydro runoff to CaMa-Flood"
    source_model: "WRF-Hydro v5.2.0"
    target_model: "CaMa-Flood v4.20"
    direction: "WRF-Hydro -> CaMa-Flood"
    description: >
      Use WRF-Hydro LDASOUT surface/subsurface runoff as input to CaMa-Flood
      for higher-fidelity flood routing (floodplain inundation, river-floodplain
      exchange). Alternative to WRF-Hydro's built-in diffusive wave routing.
    tool: "(future tool: wrfhydro_to_cama.py)"
    tool_path: "N/A (not yet implemented)"

    variables:
      - source_variable: "SFCRNOFF (LDASOUT)"
        source_unit: "mm"
        target_variable: "surface_runoff"
        target_unit: "mm/s or m3/s"
        transformation: "Divide by output_timestep_seconds, aggregate to CaMa grid resolution"

      - source_variable: "UGDRNOFF (LDASOUT)"
        source_unit: "mm"
        target_variable: "subsurface_runoff"
        target_unit: "mm/s or m3/s"
        transformation: "Divide by output_timestep_seconds, aggregate to CaMa grid resolution"

    spatial:
      source_grid: "Lambert Conformal Conic (WRF-Hydro LSM grid, e.g., 1000 m)"
      target_grid: "Regular lat/lon (CaMa-Flood, typically 0.25 or 15-arc-min)"
      method: "Area-weighted aggregation via input matrix (inpmat), same approach as VIC->CaMa coupling"

    justification: >
      WRF-Hydro's diffusive wave gridded routing is adequate for channel flow but
      does not simulate floodplain inundation dynamics. For flood mapping, coupling
      WRF-Hydro runoff to CaMa-Flood provides flood depth, inundation fraction, and
      river-floodplain exchange that WRF-Hydro alone cannot produce.

  # --- WRF-Hydro vs VIC output comparison ---
  - id: "coupling_004"
    name: "WRF-Hydro vs VIC comparison"
    source_model: "WRF-Hydro v5.2.0"
    target_model: "VIC 5.1.0"
    direction: "comparison (bidirectional)"
    description: >
      Compare WRF-Hydro and VIC outputs for the same basin and period to
      evaluate model differences. Key comparison variables: runoff, ET, soil
      moisture, discharge.
    tool: "(future tool: compare_wrfhydro_vic.py)"
    tool_path: "N/A (not yet implemented)"

    comparison_variables:
      - wrfhydro_variable: "SFCRNOFF + UGDRNOFF (LDASOUT)"
        vic_variable: "OUT_RUNOFF + OUT_BASEFLOW (fluxes)"
        unit: "mm/day"
        notes: "WRF-Hydro is hourly, VIC is daily -> aggregate WRF-Hydro to daily"

      - wrfhydro_variable: "ETRAN + EDIR + ECAN (LDASOUT)"
        vic_variable: "OUT_EVAP (fluxes)"
        unit: "mm/day"
        notes: "WRF-Hydro separates ET components; VIC reports total"

      - wrfhydro_variable: "SOIL_M (LDASOUT, 4 layers)"
        vic_variable: "OUT_SOIL_MOIST (fluxes, 3 layers)"
        unit: "mm or m3/m3"
        notes: "Different layer definitions: WRF-Hydro 0.1/0.3/0.6/1.0 m; VIC user-defined"

      - wrfhydro_variable: "streamflow (CHRTOUT at outlet)"
        vic_variable: "discharge (routing output)"
        unit: "m3/s"
        notes: "Different routing methods: WRF-Hydro diffusive wave vs Lohmann unit hydrograph"
