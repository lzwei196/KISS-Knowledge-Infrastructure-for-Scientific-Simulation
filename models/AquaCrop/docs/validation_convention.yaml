    doi: 10.2134/agronj2008.0139s
    needed_for: [harvest_index, harvest_index_adj, gdd_cum]
  - ref: "AquaCrop - The FAO Crop Model to Simulate Yield Response to Water: II. Main Algorithms and Software Description"
    doi: 10.2134/agronj2008.0140s
    needed_for: [DeepPerc, z_root, Runoff]
