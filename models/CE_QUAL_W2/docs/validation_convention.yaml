validation:
  - dag_variable: water temperature
    obs_shape: point_time_series
    headline_metrics:
      - metric: rmse
        direction: minimize
        unit: degC
        bands: {very_good: 1.0, good: 1.23, satisfactory: 1.5}
        pass_band: satisfactory
        band_note: "Temperature convention is RMSE-centered: Mi 2019 says RMSE <1 K indicates high accuracy; Shatwell 2019 says RMSE generally <1.5 degC showed good precision; Shabani 2021 reports CE-QUAL-W2 benchmark RMSE 0.7-1.23 degC."
        cites: [mi2019, shatwell2019, shabani2021]
    secondary_metrics:
      - metric: nse
        direction: maximize
        status: supportive
        ceiling_reason: "The DAG determining metric is nse, but the fetched CE-QUAL-W2 temperature studies use RMSE and R2 as the performance statistics, not NSE."
        cites: [shabani2021, mi2019]
      - metric: r2
        direction: maximize
        status: supportive
        ceiling_reason: "Shabani 2021 co-reports R2 = 0.98 for CE-QUAL-W2 water temperature calibration and validation."
        cites: [shabani2021]
    validated_when: "Water-temperature time series are validated when RMSE <= 1.5 degC, with graphical profile/seasonality agreement checked as supporting evidence."
    evidence_strength: strong
    confidence: 0.8
    notes: >-
      Field practice for reservoir temperature supersedes the DAG nse choice: Shabani 2021 states RMSE is a
      standard measure of CE-QUAL-W2 performance, Mi 2019 used RMSE for calibration, and Shatwell 2019
      treats RMSE generally less than 1.5 degC as good precision for lake temperatures.

  - dag_variable: water temperature
    obs_shape: point_snapshot
    headline_metrics:
      - metric: rmse
        direction: minimize
        unit: degC
        bands: {very_good: 1.0, good: 1.23, satisfactory: 1.5}
        pass_band: satisfactory
        band_note: "Transferred from fetched lake/reservoir temperature RMSE convention; snapshot-specific PBIAS tiers were not found."
        cites: [mi2019, shatwell2019, shabani2021]
    secondary_metrics:
      - metric: pbias
        direction: zero_centered
        status: supportive
        ceiling_reason: "The DAG snapshot metric is pbias, but fetched temperature papers judge snapshots/profiles by absolute error or RMSE rather than a temperature PBIAS tier."
        cites: [basso2021, shabani2021]
    validated_when: "A cast/profile snapshot is validated when layer-matched temperature RMSE <= 1.5 degC."
    evidence_strength: moderate
    confidence: 0.6
    notes: "Basso 2021 compared observed and modeled temperature profiles through depth, while the numeric band is transferred from fetched time-series/profile RMSE conventions."

  - dag_variable: dam release temperature
    obs_shape: point_time_series
    headline_metrics:
      - metric: rmse
        direction: minimize
        unit: degC
        bands: {very_good: 1.0, good: 1.23, satisfactory: 1.5}
        pass_band: satisfactory
        band_note: "Transferred from reservoir water-temperature RMSE benchmarks because no fetched paper gives a separate release-temperature validation tier."
        cites: [mi2019, shabani2021]
    secondary_metrics:
      - metric: nse
        direction: maximize
        status: supportive
        ceiling_reason: "Fetched release/withdrawal-elevation studies evaluate water temperature by RMSE and operational constraints rather than NSE."
        cites: [mi2019]
    validated_when: "Dam-release temperature is validated when outlet/release temperature RMSE <= 1.5 degC and the withdrawal-elevation comparison is depth/time aligned."
    evidence_strength: moderate
    confidence: 0.55
    notes: "Mi 2019 is directly about withdrawal elevation and CE-QUAL-W2/GLM water temperature, but it does not provide a separate numeric release-temperature pass band."

  - dag_variable: dissolved oxygen
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched CE-QUAL-W2 dissolved-oxygen paper gives a numeric NSE validation tier."
        cites: []
      - metric: rmse
        direction: minimize
        unit: mg/L
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "Fetched studies report DO RMSE/AME examples, but not a reusable numeric pass band."
        cites: []
    secondary_metrics:
      - metric: pbias
        direction: zero_centered
        status: supportive
        ceiling_reason: "Basso 2021 reports DO PBIAS and RMSE, and says water-quality calibration was data-limited; this supports contextual review but not an auto-validation band."
        cites: [basso2021]
    validated_when: "UNRESOLVED - use observed DO time series/profile comparison, but do not auto-validate without a fetched numeric DO threshold."
    evidence_strength: weak
    confidence: 0.35
    notes: "Basso 2021 reports oxygen RMSE 0.37 mg/L and PBIAS 5%; Hanjaniamin 2023 reports DO AME 1.762/1.389 and calls performance acceptable. Neither source defines a general DO pass tier."

  - dag_variable: dissolved oxygen
