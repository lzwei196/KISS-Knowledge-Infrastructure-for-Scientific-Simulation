safety:
  hazards:
    - id: "temperature_perturbation_theta_base_state"
      kind: "parser_semantic"
      description: "wrfout 3-D T is perturbation potential temperature (theta-300); reading it directly without adding 300 K and applying the Exner function gives temperatures ~300 K too cold."
      severity: "critical"
    - id: "pressure_total_vs_perturbation"
      kind: "parser_semantic"
      description: "Total pressure = P + PB (Pa); using perturbation P alone or treating hPa as Pa yields values ~100x too small."
      severity: "critical"
    - id: "mixing_ratio_units"
      kind: "weather_file_semantic"
      description: "Input specific humidity/mixing ratio must be kg/kg; g/kg input is 1000x too large, causing unreal precipitation or crash."
      severity: "critical"
    - id: "geopotential_units"
      kind: "weather_file_semantic"
      description: "ERA5 geopotential is m2/s2 but the GHT input field expects metres; missing the /9.81 factor makes heights ~9.81x too large."
      severity: "critical"
    - id: "precip_accumulation_semantics"
      kind: "parser_semantic"
      description: "RAINC and RAINNC accumulate from start; interval precip requires differencing consecutive times, and total precip = RAINC+RAINNC (omitting either gives wrong/zero rates)."
      severity: "warning"
    - id: "radiation_flux_units"
      kind: "weather_file_semantic"
      description: "Radiation forcing must be W/m2; MJ/m2/day input is off by ~86400 (multiply by 11.574)."
      severity: "warning"
    - id: "cfl_timestep_violation"
      kind: "numerical_instability"
      description: "time_step exceeding the CFL bound (~6*dx_km) causes immediate blow-up with 'cfl' errors in rsl.error within the first steps."
      severity: "fatal"
    - id: "num_soil_layers_lsm_mismatch"
      kind: "control_semantic"
      description: "num_soil_layers not matching sf_surface_physics (Noah=4, RUC=6, Noah-MP=4, CLM4=10) causes a segfault in the land-surface module."
      severity: "fatal"
    - id: "cumulus_on_convection_permitting"
      kind: "control_semantic"
      description: "Enabling cu_physics on a domain with dx<5 km double-counts convection, producing precipitation 2-3x too high."
      severity: "degraded"
    - id: "even_parent_grid_ratio"
      kind: "control_semantic"
      description: "Even parent_grid_ratio (must be odd 3/5/7 for real-data) produces checkerboard interpolation artifacts at nest boundaries."
      severity: "degraded"
    - id: "interval_seconds_forcing_mismatch"
      kind: "control_semantic"
      description: "interval_seconds not matching met_em forcing frequency causes boundary discontinuities or crash at each update."
      severity: "fatal_or_silent"
    - id: "nan_propagation"
      kind: "numerical_instability"
      description: "A NaN from division-by-zero, corrupt ICs, or too-large dt over steep terrain infects the whole domain within ~10-20 timesteps; mitigate with w_damping, epssm, reduced dt."
      severity: "fatal"
    - id: "missing_soil_fields_in_metem"
      kind: "initial_condition_semantic"
      description: "met_em lacking soil moisture/temperature (Vtable or source GRIB missing soil) makes real.exe crash or emit all-zero / 0 K soil fields."
      severity: "fatal_or_silent"
    - id: "sst_not_extracted"
      kind: "initial_condition_semantic"
      description: "SST not extracted/mismapped in the Vtable makes real.exe fall back to SKINTEMP over water, giving constant SST and wrong ocean fluxes."
      severity: "silent"
    - id: "wrong_vtable_field_mapping"
      kind: "weather_file_semantic"
      description: "Using the wrong Vtable for the GRIB source (e.g. GFS Vtable for ERA5) silently maps the wrong fields."
      severity: "silent"
    - id: "metem_temporal_gap"
      kind: "initial_condition_semantic"
      description: "A gap in met_em temporal coverage makes WRF extrapolate or hold stale boundaries, producing periodic boundary-forcing pulse artifacts."
      severity: "degraded"
    - id: "grid_relative_wind_rotation"
      kind: "parser_semantic"
      description: "U10/V10 are grid-relative; comparing direction without COSALPHA/SINALPHA rotation gives a 10-30 deg directional bias on Lambert/polar-stereographic projections."
      severity: "warning"
    - id: "staggered_grid_destagger"
      kind: "parser_semantic"
      description: "3-D U/V/W live on staggered C-grid faces; plotting/comparing against mass points without destaggering gives a half-cell spatial offset."
      severity: "warning"
    - id: "model_top_off_top"
      kind: "numerical_instability"
      description: "Strong updrafts pushing parcels above a too-low model top ('WOULD GO OFF TOP') crash the run unless ztop/p_top is raised and Rayleigh damping enabled."
      severity: "fatal"
    - id: "restart_precision_mismatch"
      kind: "initial_condition_semantic"
      description: "Restart files created with different precision or physics than the continuing run silently corrupt the state."
      severity: "silent"
  validation_limits:
    - "Limited-area model: real-data cases require external global driving data and lateral boundary file (wrfbdy_d01); not a global model."
    - "Physics scheme suites are validated for particular scale regimes (cumulus parameterization for coarse grids vs explicit convection/LES at dx<5 km); applying a suite outside its regime is unsupported."
    - "Surface-layer, PBL, and LSM schemes must be chosen from mutually compatible combinations."
    - "Sub-grid convection at coarse resolution and grid-resolved convection at fine resolution are mutually exclusive; neither resolves the transitional 'grey zone' (~3-9 km) cleanly."
  warnings:
    - "history_interval larger than total simulation duration, frames_per_outfile=0, or invalid io_form_history produces no wrfout files despite normal timestep progress."
    - "radt (radiation call interval) should be <= ~30 min to capture the diurnal cycle; larger values degrade the surface radiation/temperature diurnal signal."
    - "When use_adaptive_time_step=.true., the runtime CFL-based timestep supersedes the namelist time_step and the dt<=6*dx_km guidance."
    - "Spectral-bin microphysics (mp_physics=30/32) and per-timestep radiation are ~100x / large slowdowns; not a correctness issue but a tractability limit."
  assumptions:
    - statement: "The dynamical core conserves dry-air mass and the coupled (mu-weighted) scalar variables in flux form; this is mass conservation of the solver, not a closed surface energy budget."
      scope: "Whole-model conservation properties"
      source: "ARW Technical Note governing-equations / mass-coordinate description (NCAR TN series) and WRF User's Guide v4 Chapter 5"
      status: "adopted"
    - statement: "The Earth is treated as a 6370 km-radius sphere (reradius from 6370.0e3 m in module_model_constants.F), not WGS84; a fixed geometric assumption."
      scope: "Grid geometry / map factors"
      source: "share/module_model_constants.F (WRF source)"
      status: "adopted"
    - statement: "Default integration is fully compressible nonhydrostatic; the hydrostatic formulation is a run-time switch (non_hydrostatic)."
      scope: "Dynamical-core formulation"
      source: "WRF User's Guide v4 Chapter 5 and namelist &dynamics"
      status: "adopted"
    - statement: "Radiation receives microphysics-supplied cloud effective radii when available, otherwise hardcoded background/clamp radii (RE_QC_BG and RE_*_MAX in module_model_constants.F) are used silently."
      scope: "Radiation-microphysics coupling"
      source: "share/module_model_constants.F and radiation_driver behavior in WRF source"
      status: "adopted"
