  symptom: BOD decay rate kd calibrates to boundary value (0.01 or 0.5 1/d); DO model shows no oxygen
    sag
  diagnosis: 'BOD decay rate kd and reaeration rate ka initialized too close together (ka ~ kd); The Streeter-Phelps
