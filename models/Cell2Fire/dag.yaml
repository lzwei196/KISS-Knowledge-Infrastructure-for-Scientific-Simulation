template_version: "3.5"

identity:
  model_id: "Cell2Fire"
  scientific_reference_version: "Cell2Fire W (C2F-W) — unified Scott&Burgan / Canadian FBP / Kitral cellular fire-spread simulator; FBP lineage per Pais et al. 2021 (Front. For. Glob. Change 4:692706) and arXiv:1905.09317"
  implementation:
    id: "hydrocraft-cell2fire-w"
    version: "hydrocraft-cell2fire-wildfire v1.0.0"
    provenance: "C++ with OpenMP; fire2a C2F-W fork (github.com/fire2a/C2F-W) of the Pais/Carrasco/Weintraub Cell2Fire object-oriented core."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "Research use only; no warranty (model docs disclaimer)"
  repo_url: "https://github.com/fire2a/C2F-W"

boundary:
  scope_in:
    - "Grid-based wildfire spread (propagation) across a gridded landscape from one or more ignition points"
    - "Per-cell rate of spread and elliptical fire propagation via a selectable fire-behavior model (Scott&Burgan, Canadian FBP, Kitral, Portugal)"
    - "Per-cell surface fire behavior outputs (rate of spread, fireline intensity, flame length) and crown-fire state"
    - "Monte Carlo ensembles over random ignition points and/or weather scenarios to estimate burn probability"
  scope_out:
    - "Fire suppression action (not modelled)"
    - "Sub-cell heterogeneity of fuel and terrain (each cell assumed homogeneous)"
    - "Sub-minute precise fire timing (deliberately approximated for computational efficiency)"
    - "Computation of Canadian FWI System indices (FFMC/DMC/DC/ISI/BUI/FWI must be supplied externally for the FBP model)"
  spatial: "2-D grid"
  temporal: "event"
  closure: "none"
  notes: "Cellular-automaton landscape model with no conserved mass/energy budget; cells evolve through discrete burn states over fire periods. Fire propagates center-to-center between 8-connected cells; a receiver cell ignites when the incoming elliptically-allocated ROS exceeds the ROS-Threshold (default 0.1 m/min). Event duration is bounded by available fuel (available cells remaining), weather-record length, and the optional --max-fire-periods horizon. Weather is uniform across the grid (single station, hourly). The fire period length is silently clamped to the weather period length if larger."

inputs:
  forcing:
    - category: "weather"
      name: "wind speed (WS)"
      unit: "km/h (at 10 m)"
      source_kind: "forcing"
      model_input_format: "Weather.csv hourly row (WS column)"
      notes: "ROS scales approximately linearly with wind speed; wind also sets ellipse eccentricity. Expected in km/h; m/s input is ~3.6x too low."
    - category: "weather"
      name: "wind direction (WD)"
      unit: "degrees (meteorological, FROM; north=0)"
      source_kind: "forcing"
      model_input_format: "Weather.csv hourly row (WD column)"
      notes: "Sets spread direction (head of the ellipse). FROM convention; math (TO) convention reverses spread by 180 degrees."
    - category: "weather"
      name: "air temperature (TMP)"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "Weather.csv hourly row (TMP column)"
      notes: "FBP (--sim C) only; feeds fine-fuel moisture. Kelvin input produces nonsensical FBP indices."
    - category: "weather"
      name: "relative humidity (RH)"
      unit: "% (0-100)"
      source_kind: "forcing"
      model_input_format: "Weather.csv hourly row (RH column)"
      notes: "FBP only; fraction (0-1) input drives FFMC/ISI to extreme values."
    - category: "weather"
      name: "precipitation (APCP)"
      unit: "mm"
      source_kind: "forcing"
      model_input_format: "Weather.csv hourly row (APCP column)"
      notes: "FBP only; affects moisture codes."
    - category: "weather"
      name: "Canadian FWI System indices (FFMC, DMC, DC, ISI, BUI, FWI)"
      unit: "dimensionless (FFMC 0-101; others CFFDRS scale)"
      source_kind: "forcing"
      model_input_format: "Weather.csv hourly rows (FFMC/DMC/DC/ISI/BUI/FWI columns)"
      notes: "FBP (--sim C) only. Cell2Fire does NOT compute these; they must be derived externally via CFFDRS equations and supplied per weather row. Missing indices crash or silently default."
  parameters:
    - category: "fuel"
      name: "per-cell fuel type"
      unit: "integer fuel code"
      source_kind: "dataset_lookup"
      model_input_format: "fuels.asc/.tif raster of integer codes"
      notes: "Selects fire-behavior parameters via a lookup table. S&B codes 0,91-99 (non-burnable) and 101-204; FBP codes 1-20. Codes 0 and 91-99 act as non-burnable firebreaks."
    - category: "fuel"
      name: "fuel lookup table"
      unit: "table"
      source_kind: "dataset_lookup"
      model_input_format: "spain_lookup_table.csv (S/K/P) or fbp_lookup_table.csv (C)"
      notes: "Maps integer fuel codes to descriptive fuel type / behavior parameters."
    - category: "fuel"
      name: "per-fueltype FBP coefficients (p1,p2,p3,q,bui0,cfl,cbh,fmc)"
      unit: "mixed"
      source_kind: "default"
      model_input_format: "hardcoded in FuelModelFBP setup_const (coefs[18])"
      notes: "The 18-fueltype FBP coefficient table is baked into the binary, NOT read from input files. Spain/Kitral/Portugal models similarly carry built-in coefficient initializers selected by --scenario."
    - category: "topography"
      name: "slope"
      unit: "degrees (0-90)"
      source_kind: "dataset_lookup"
      model_input_format: "slope.asc/.tif (optional; can be derived from elevation)"
      notes: "Enters a polynomial slope-on-spread correction. Percent-rise input is ~2x too large."
    - category: "topography"
      name: "slope aspect (saz)"
      unit: "degrees (0-360, compass, north=0)"
      source_kind: "dataset_lookup"
      model_input_format: "saz.asc/.tif (optional)"
      notes: "Sets upslope direction for the directional slope effect."
    - category: "topography"
      name: "elevation"
      unit: "m ASL"
      source_kind: "dataset_lookup"
      model_input_format: "elevation.asc/.tif (optional)"
      notes: "Used for slope derivation and (in FBP) foliar moisture content. Feet input exaggerates derived slope ~3.28x."
    - category: "canopy"
      name: "crown base height (cbh)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "cbh.asc/.tif (required when crown fire enabled)"
      notes: "Crown-fire initiation. Optional unless --cros set with S&B."
    - category: "canopy"
      name: "crown bulk density (cbd)"
      unit: "kg/m3"
      source_kind: "dataset_lookup"
      model_input_format: "cbd.asc/.tif (required when crown fire enabled)"
      notes: "Active crown spread threshold. lb/ft3 input is ~16x too low."
    - category: "canopy"
      name: "crown closure fraction (ccf) / foliar canopy cover (fcc)"
      unit: "percent (0-100)"
      source_kind: "dataset_lookup"
      model_input_format: "ccf.asc/.tif, fcc.asc/.tif (optional)"
      notes: "Canopy descriptors for crown fire."
    - category: "fuel"
      name: "curing percentage (cur)"
      unit: "percent"
      source_kind: "dataset_lookup"
      model_input_format: "cur.asc/.tif (FBP grass curing only)"
      notes: "Grass-fuel curing multiplier in FBP."
    - category: "ros_tuning"
      name: "ROS adjustment / ellipse factors (HFactor/FFactor/BFactor/EFactor, ROS10Factor, CBDFactor/CCFFactor)"
      unit: "dimensionless multipliers"
      source_kind: "calibrated"
      model_input_format: "CLI flags; defaults HFactor/FFactor/BFactor/EFactor=1.0, ROS10Factor=3.34, CBDFactor/CCFFactor=0.0"
      notes: "Head/flank/back/eccentricity ROS multipliers (the calibration levers of Carrasco et al. 2019). Default 1.0 = untuned. ROS10Factor=3.34 is a Spain/Kitral ROS-at-10min magic scaling constant."
  initial_conditions:
    - category: "ignition"
      name: "ignition point(s)"
      unit: "cell id(s)"
      source_kind: "user_provided"
      model_input_format: "Ignitions.csv (1-based, row-major from top-left) or random sampling"
      notes: "Fixed cells or sampled per simulation; can be weighted by probabilityMap. Ignition on a non-burnable cell yields zero burned cells."
    - category: "state"
      name: "initial cell states"
      unit: "categorical"
      source_kind: "derived"
      model_input_format: "derived from fuels grid (Available / Non-Fuel from non-burnable codes)"
      notes: "All burnable cells start Available; non-burnable codes start Non-Fuel."
  boundary_conditions:
    - category: "ignition_probability"
      name: "ignition probability map"
      unit: "probability per cell"
      source_kind: "user_provided"
      model_input_format: "probabilityMap.asc (optional)"
      notes: "Spatial distribution from which random ignition cells are sampled."
    - category: "control"
      name: "fire-behavior model selector (--sim {S,C,K,P})"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "CLI flag"
      notes: "Selects Scott&Burgan / Canadian FBP / Kitral / Portugal. Must match the fuel-code scheme; mixing FBP codes with the S&B model gives wrong behavior."
    - category: "control"
      name: "ensemble / stochastic controls (--nsims, --seed, --weather {rows,random}, ROS-CV)"
      unit: "count / integer / enum"
      source_kind: "user_provided"
      model_input_format: "CLI flags / instance config"
      notes: "Number of Monte Carlo simulations, RNG seed, deterministic vs randomized weather selection, and the ROS coefficient-of-variation perturbation level driving probabilistic scars."
    - category: "control"
      name: "time-stepping controls (--Weather-Period-Length, --Fire-Period-Length, --max-fire-periods)"
      unit: "minutes / count"
      source_kind: "user_provided"
      model_input_format: "CLI flags; defaults 60 min, 1.0 min, -1 (weather-bound)"
      notes: "Fire-Period-Length silently clamped to Weather-Period-Length if larger; too-large fire period skips cells (checkerboard scars)."
    - category: "control"
      name: "spread / crown thresholds and switches (--ROS-Threshold, --cros, --fmc, --scenario)"
      unit: "m/min / flag / percent / enum"
      source_kind: "user_provided"
      model_input_format: "CLI flags; defaults ROS-Threshold=0.1 m/min, fmc=100%, scenario=3, CROSThreshold=0.5"
      notes: "ROS-Threshold is the per-cell ignition floor. --cros enables crown fire. --fmc is S&B foliar moisture; low values inflate crown fire. --scenario (1-3) sets S&B fire-weather severity and can shift burned area ~10x."

processes:
  modules:
    - name: "SurfaceFireSpreadEngine"
      role: "process_solver"
      brief: "Per-cell fire dynamics (Cells/manageFire): computes elliptical ROS allocation to each of up to 8 neighbors (ros_distr_V2), accumulates fireProgress toward neighbor centers, applies the polynomial slope effect, and emits a fire message to a neighbor when fire reaches its center; the receiver ignites when its computed ROS exceeds ROS-Threshold."
    - name: "FuelModelScottBurgan"
      role: "process_solver"
      applicability: "--sim S"
      brief: "Scott&Burgan / Spain surface fire-behavior model (40 NFDRS fuel models): computes ROS, intensity and flame length from wind, slope and fuel moisture; uses Spain-specific CBDFactor/CCFFactor/ROS10Factor adjustments and --scenario coefficient initialization."
    - name: "FuelModelFBP"
      role: "process_solver"
      applicability: "--sim C"
      brief: "Canadian FBP surface fire-behavior model (18 fuel types): rate_of_spread with ffmc_effect, bui_effect, wind function and slope effect from the supplied FWI System indices; also computes head-fire intensity and flame length. Coefficient table baked into setup_const."
    - name: "FuelModelKitral"
      role: "process_solver"
      applicability: "--sim K"
      brief: "Kitral Chilean fire-behavior model: ROS and intensity for South American vegetation fuel types."
    - name: "FuelModelPortugal"
      role: "process_solver"
      applicability: "--sim P (experimental)"
      brief: "Portuguese fire-behavior model: ROS and intensity via initialize_coeff_p(scenario); documented as experimental."
    - name: "CrownFireModule"
      role: "optional_module"
      applicability: "--cros enabled"
      brief: "Crown-fire initiation and active crown spread: critical surface intensity, critical ROS, and crown fraction burned from crown base height, crown bulk density and foliar moisture content."
    - name: "SpottingModule"
      role: "optional_module"
      applicability: "spotting enabled"
      brief: "Ember/spotting transport producing non-adjacent ignitions ahead of the fire front. (Absent from the original 2019 paper scope; present in the C2F-W code.)"
    - name: "IgnitionModule"
      role: "process_solver"
      brief: "Selects ignition cell(s) each simulation: fixed (Ignitions.csv) or random, optionally weighted by probabilityMap; includes the Lightning ignition driver."
    - name: "MonteCarloDriver"
      role: "driver"
      brief: "Physics ensemble loop: runs N independent simulations with random ignition points and/or weather scenarios (OpenMP-parallelized) and aggregates per-simulation final grids into a burn-probability field."
    - name: "TimeStepIntegrator"
      role: "integrator"
      brief: "Advances the simulation over discrete fire periods (Step): sends messages from burning cells, delivers them to receivers (flipping cell status Available->Burning->Burned), updates the weather row, and tests termination (no available cells, weather exhausted, or max-fire-periods reached)."
  internal_edges:
    - from: "Inputs"
      to: "FuelModelFBP"
      kind: "consumes_input"
      brief: "FBP reads weather (FWI indices, wind), fuel type and terrain to compute ROS"
    - from: "Inputs"
      to: "FuelModelScottBurgan"
      kind: "consumes_input"
      brief: "S&B reads wind, slope, fuel moisture and scenario to compute ROS"
    - from: "FuelModelFBP"
      to: "SurfaceFireSpreadEngine"
      kind: "invokes"
      brief: "manageFire calls the active fuel model for ROS, intensity and ellipse axes"
    - from: "FuelModelScottBurgan"
      to: "SurfaceFireSpreadEngine"
      kind: "invokes"
      brief: "S&B ROS/intensity feed the elliptical allocation"
    - from: "FuelModelKitral"
      to: "SurfaceFireSpreadEngine"
      kind: "invokes"
      brief: "Kitral ROS/intensity feed the elliptical allocation"
    - from: "FuelModelPortugal"
      to: "SurfaceFireSpreadEngine"
      kind: "invokes"
      brief: "Portugal ROS/intensity feed the elliptical allocation"
    - from: "SurfaceFireSpreadEngine"
      to: "ROSAngleDir"
      kind: "writes_state"
      brief: "ros_distr_V2 fills per-neighbor ROS allocation and accumulates fireProgress"
    - from: "SurfaceFireSpreadEngine"
      to: "CrownFireModule"
      kind: "invokes"
      brief: "surface intensity feeds crown-fire initiation when --cros is set"
    - from: "IgnitionModule"
      to: "cell burn state"
      kind: "writes_state"
      brief: "sets the initial burning cell(s) per simulation"
    - from: "SpottingModule"
      to: "cell burn state"
      kind: "writes_state"
      brief: "ember transport ignites non-adjacent cells"
    - from: "TimeStepIntegrator"
      to: "SurfaceFireSpreadEngine"
      kind: "invokes"
      brief: "Step drives SendMessages over burning cells each fire period"
    - from: "TimeStepIntegrator"
      to: "cell burn state"
      kind: "writes_state"
      brief: "GetMessages flips statusCells Available->Burning->Burned and updates the front sets"
    - from: "TimeStepIntegrator"
      to: "cell burn state"
      kind: "reads_state"
      brief: "Step reads remaining available/burning cells and fire period to test termination"
    - from: "SurfaceFireSpreadEngine"
      to: "Outputs"
      kind: "produces_output"
      brief: "appends per-cell ROS, intensity, flame length and propagation messages"
    - from: "MonteCarloDriver"
      to: "TimeStepIntegrator"
      kind: "invokes"
      brief: "runs N independent fire simulations with sampled ignition/weather"
    - from: "MonteCarloDriver"
      to: "Outputs"
      kind: "produces_output"
      brief: "aggregates per-simulation final grids into the burn-probability field"

states:
  variables:
    - name: "cell burn state"
      unit: "categorical (Available / Burning / Burned / Non-Fuel / Harvested)"
      role: "prognostic"
    - name: "crown fire state"
      unit: "0=surface, 1=passive/active crown"
      role: "prognostic"
    - name: "fireProgress"
      unit: "fraction of inter-cell distance (per neighbor)"
      role: "accumulator"
    - name: "ROSAngleDir"
      unit: "m/min (per neighbor angle)"
      role: "diagnostic"
    - name: "fire period"
      unit: "discrete count"
      role: "accumulator"
    - name: "cell ignition time"
      unit: "fire period / minutes"
      role: "diagnostic"
    - name: "front bookkeeping sets (available / burning / burnt cells)"
      unit: "cell-id sets"
      role: "prognostic"
  provenance: "populated"

outputs:
  - var: "FinalGrid (burned/unburned)"
    validation_rank: 1
    unit: "0=unburned, 1=burned"
    description: "Final per-cell burn state grid (fire scar) for one simulation."
    emitted_in: "Grids/Grids{sim}/FinalGrid.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "event_detection"]
          determining_metric: "csi"
          caveats:
            - "Compare against an observed final fire perimeter/scar rasterized to the model grid; a single deterministic run depends strongly on ignition point and ROS adjustment factors."
            - "Cell-level agreement is a categorical burned/unburned classification (F1/CSI), not a continuous field."
      detrending_options: ["none"]
  - var: "burn probability"
    validation_rank: 2
    unit: "0.0-1.0"
    description: "Fraction of Monte Carlo simulations in which each cell burned; derived by averaging final grids."
    emitted_in: "burn_probability.csv / .asc (post-processing of FinalGrid ensemble)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Meaningful only for an ensemble (nsims >> 1); compares the spatial probability field, not a single scar."
            - "Observed counterpart is typically a multi-fire burn-frequency map over the same domain."
      detrending_options: ["none"]
  - var: "fire propagation messages"
    validation_rank: 3
    unit: "(sender_cell, receiver_cell, fire_period, ROS)"
    description: "Cell-to-cell fire propagation records; the spread network / arrival-time graph."
    emitted_in: "Messages/MessagesFile{sim}.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["timing_accuracy", "spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Derived per-cell arrival time can be compared to observed fire-arrival-time/isochrone maps; arrival-time error is the canonical calibration target for the ROS adjustment factors."
      detrending_options: ["none"]
  - var: "rate of spread (ROS)"
    validation_rank: 4
    unit: "m/min"
    description: "Per-cell rate of spread emitted by the active fire-behavior model."
    emitted_in: "RateOfSpread/ROSFile{sim}.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Direct ROS observations are rare; usually validated indirectly via fire-front arrival time rather than as a standalone field."
      detrending_options: ["none"]
  - var: "fireline intensity"
    validation_rank: 5
    unit: "kW/m (Byram intensity)"
    description: "Per-cell surface (and, with --cros, crown) fireline intensity."
    emitted_in: "Intensity/IntensityFile{sim}.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Field intensity observations are scarce; commonly compared against fire-behavior-model reference values rather than measurements."
      detrending_options: ["none"]
  - var: "flame length"
    validation_rank: 6
    unit: "m"
    description: "Per-cell flame length (surface and crown)."
    emitted_in: "FlameLength/FLFile{sim}.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Validated against reference fire-behavior estimates; direct measurements rare."
      detrending_options: ["none"]
  - var: "crown fire state / crown fraction burned"
    validation_rank: 7
    unit: "0/1 ; fraction"
    description: "Per-cell crown-fire activation and crown fraction burned (--cros)."
    emitted_in: "CrownFire/CrownFile{sim}.csv ; CrownFractionBurn/CFBFile{sim}.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "csi"
          caveats:
            - "Compared against observed crown-fire vs surface-fire classification where available; strongly sensitive to --fmc and crown inputs."
      detrending_options: ["none"]

influence:
  edges:
    - from: "HROS adjustment factor (x1)"
      to: "fire scar / burned area"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "calibration via ROS adjustment factors"
      citations: ["carrasco2019_dfo_ros_factors", "cell2fire2025_synthetic_real_landscapes", "pais2021_cell2fire_model"]
    - from: "FROS adjustment factor (x2)"
      to: "fire scar / burned area"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["carrasco2019_dfo_ros_factors"]
    - from: "BROS adjustment factor (x3)"
      to: "fire scar / burned area"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["carrasco2019_dfo_ros_factors"]
    - from: "eccentricity adjustment factor (x4 / ECC)"
      to: "fire scar shape / fire perimeter"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["carrasco2019_dfo_ros_factors", "cell2fire2025_synthetic_real_landscapes"]
    - from: "fuel type"
      to: "rate of spread (HROS/FROS/BROS)"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["pais2021_cell2fire_model", "carrasco2019_dfo_ros_factors", "cardil2019_realtime_ros_adjustment", "cell2fire2025_synthetic_real_landscapes"]
    - from: "wind speed"
      to: "rate of spread / fire scar"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      citations: ["pais2021_cell2fire_model", "cell2fire2025_synthetic_real_landscapes", "carrasco2019_dfo_ros_factors"]
    - from: "relative humidity"
      to: "rate of spread / fire scar"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      citations: ["cell2fire2025_synthetic_real_landscapes"]
    - from: "temperature"
      to: "rate of spread / fire scar"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      citations: ["cell2fire2025_synthetic_real_landscapes"]
    - from: "fuel moisture"
      to: "rate of spread"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      citations: ["pais2021_cell2fire_model", "pais2019_cell2fire_arxiv"]
    - from: "topography (slope / aspect / elevation)"
      to: "rate of spread / fire scar direction"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      citations: ["pais2021_cell2fire_model", "cell2fire2025_synthetic_real_landscapes"]
    - from: "ignition point location"
      to: "fire scar / burned area"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      citations: ["pais2019_cell2fire_arxiv", "cell2fire2025_synthetic_real_landscapes", "pais2021_cell2fire_model"]
    - from: "ROS coefficient of variation (stochastic perturbation level)"
      to: "fire scar probability / burned-area variance"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      citations: ["pais2019_cell2fire_arxiv", "cell2fire2025_synthetic_real_landscapes"]
    - from: "per-fuel ROS adjustment factor"
      to: "fire arrival time"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "real-time arrival-time calibration"
      citations: ["cardil2019_realtime_ros_adjustment"]
  citation_index:
    pais2021_cell2fire_model:
      short_citation: "Pais et al. 2021"
      doi: "10.3389/ffgc.2021.692706"
      note: "Canonical Cell2Fire journal paper; fire-scar realism driven primarily by ROS (fuel, weather, moisture, topography, ignition)."
    carrasco2019_dfo_ros_factors:
      short_citation: "Carrasco et al. 2019"
      doi: ""
      note: "arXiv:1909.05949 — derivative-free optimization of four ROS adjustment factors (HROS x1, FROS x2, BROS x3, eccentricity x4) to minimize fire-scar error; the factors multiply FBP-predicted ROS and reshape the ellipse."
    pais2019_cell2fire_arxiv:
      short_citation: "Pais et al. 2019"
      doi: ""
      note: "arXiv:1905.09317 — original model description; probabilistic scars from ignition, ROS-CV and weather-scenario uncertainty."
    cell2fire2025_synthetic_real_landscapes:
      short_citation: "Cell2Fire team 2025 (Sci. Rep.)"
      doi: "10.1038/s41598-025-05706-6"
      note: "SHAP-based sensitivity/uncertainty analysis ranking fuel type, weather, elevation, ignition and the four ROS factors; 1000 perturbed weather streams; F1 0.65-0.75 baseline rising to 0.74-0.83 with BBO of the ROS factors. Full-text numeric SHAP values not recoverable, so non-x1/fuel/wind feature grades remain qualitative."
    cardil2019_realtime_ros_adjustment:
      short_citation: "Cardil et al. 2019"
      doi: "10.1016/j.ecolmodel.2019.01.017"
      note: "Per-fuel ROS adjustment factors minimize fire arrival-time error (cut MAPE ~71% to ~14%). Concerns Wildfire Analyst, used as the cross-family real-time analogue of the Cell2Fire DFO calibration."

safety:
  hazards:
    - id: "weather_WS_units_mps_not_kmh"
      kind: "weather_file_semantic"
      description: "Wind speed supplied in m/s instead of km/h is ~3.6x too low; ROS scales ~linearly with wind so fire barely spreads."
      severity: "silent"
      triplet: "dt_001"
    - id: "weather_WD_math_not_meteorological"
      kind: "weather_file_semantic"
      description: "Wind direction in math (blowing-TO) convention instead of meteorological (FROM) reverses spread direction ~180 degrees; fix is (WD+180)%360."
      severity: "silent"
      triplet: "dt_002"
    - id: "weather_RH_fraction_not_percent"
      kind: "weather_file_semantic"
      description: "Relative humidity as fraction (0-1) instead of percent (0-100) drives FFMC/ISI to extremes; extreme fire behavior even in mild weather (FBP only)."
      severity: "silent"
      triplet: "dt_003"
    - id: "weather_TMP_kelvin_not_celsius"
      kind: "weather_file_semantic"
      description: "Temperature in Kelvin instead of Celsius yields nonsensical/negative FBP indices (FBP only)."
      severity: "silent"
      triplet: "dt_004"
    - id: "topo_slope_percent_not_degrees"
      kind: "soil_semantic"
      description: "Slope in percent-rise instead of degrees gives ~2x slope factor and unrealistic uphill acceleration."
      severity: "silent"
      triplet: "dt_005"
    - id: "topo_elevation_feet_not_meters"
      kind: "soil_semantic"
      description: "Elevation in feet instead of meters exaggerates derived slope ~3.28x."
      severity: "silent"
      triplet: "dt_006"
    - id: "raster_dimension_mismatch"
      kind: "soil_semantic"
      description: "fuels/elevation/slope rasters with differing ncols/nrows/cellsize/corner cause out-of-bounds access and a segfault at startup."
      severity: "fatal"
      triplet: "dt_007"
    - id: "ignition_on_nonburnable_cell"
      kind: "initial_condition_semantic"
      description: "Ignition cells landing on non-burnable fuel codes (0 or 91-99) produce zero burned cells and no messages."
      severity: "silent"
      triplet: "dt_008"
    - id: "fuel_code_scheme_mismatch"
      kind: "coefficient_runtime_silent_fallback"
      description: "Mixing FBP fuel codes (1-20) with the S&B model (or vice versa) selects wrong coefficients and produces incorrect fire behavior."
      severity: "silent"
    - id: "scenario_severity_mismatch"
      kind: "control_semantic"
      description: "Wrong --scenario (1/2/3) for the Scott&Burgan model shifts burned area by ~10x (mild vs extreme fire-weather severity)."
      severity: "degraded"
      triplet: "dt_011"
    - id: "fmc_too_low_excess_crown_fire"
      kind: "control_semantic"
      description: "--fmc foliar moisture set too low (e.g. 30 vs 130) makes crown-fire initiation too easy, inflating intensity."
      severity: "degraded"
      triplet: "dt_012"
    - id: "fire_period_clamp_or_skip"
      kind: "control_semantic"
      description: "Fire-Period-Length larger than Weather-Period-Length is silently clamped; too-large fire period relative to cell size skips cells, yielding checkerboard/discontinuous burn maps."
      severity: "silent"
      triplet: "dt_013, dt_014"
    - id: "ignition_cell_numbering_convention"
      kind: "parser_semantic"
      description: "Ignitions.csv cell IDs must be 1-based row-major (cell = row*ncols + col + 1); 0-based or column-major IDs place ignitions at wrong locations."
      severity: "silent"
      triplet: "dt_015"
    - id: "missing_fwi_indices"
      kind: "weather_file_semantic"
      description: "FBP (--sim C) requires externally-computed FWI System indices (FFMC/DMC/DC/ISI/BUI/FWI); missing columns crash or silently default."
      severity: "fatal_or_silent"
  validation_limits:
    - "FBP empirical spread models are valid only for the Canadian FBP fuel types; per-cell fuel and terrain are assumed homogeneous (sub-cell heterogeneity not represented)."
    - "Time step must be small enough that fire cannot spread beyond the 8 adjacent cells in one step; for ~100 m cells, sub-minute steps give almost no change in final scar."
    - "Minute-by-minute fire status is approximate by design; intended for strategic fire-scar/landscape planning, not operational real-time prediction."
    - "Fire suppression is not modelled; simulated scars overestimate extent where suppression occurred."
    - "No conserved mass/energy budget; outputs are spread geometry and behavior fields, not a closed balance."
  warnings:
    - "Each burning cell becomes an independent new ignition source; as fire enters a cell from a neighbor, the NEIGHBOR's cell characteristics govern spread until fire reaches the destination cell center, then the destination cell's characteristics take over."
    - "A receiver cell ignites only when its incoming elliptically-allocated ROS exceeds ROS-Threshold (default 0.1 m/min); raising the threshold suppresses moderate-ROS spread."
    - "Kitral (K) and Portugal (P) fire-behavior models are documented at high level only; Portugal is explicitly experimental."
    - "Crown-fire raster inputs (cbh, cbd, ccf, fcc) are optional but become required when --cros is set with the S&B model."
  assumptions:
    - statement: "Fire growth is driven by Rate of Spread from a burning cell toward at most 8 neighbors; a cell ignites when fire reaches its center and burning conditions are met."
      scope: "core propagation (assumption A1, Pais et al. 2019)"
      source: "Cell2Fire model description, arXiv:1905.09317 section 3.2 (assumptions A1-A5)"
      status: "adopted"
    - statement: "Principal-axis rates of spread are computed by the selected fire-behavior model (Canadian FBP by default; S&B/Kitral/Portugal substitutable) with the ellipse major axis aligned to wind (HROS), BROS opposite and FROS on the flanks."
      scope: "ROS computation and ellipse geometry (assumption A2)"
      source: "Cell2Fire model description, arXiv:1905.09317 section 3.2; Pais et al. 2021 (10.3389/ffgc.2021.692706)"
      status: "adopted"
    - statement: "The model carries no conserved mass or energy budget; closure is 'none' and termination is governed by available fuel, weather-record length and the optional fire-period horizon (assumption A5)."
      scope: "boundary closure"
      source: "Cell2Fire model description, arXiv:1905.09317 section 3.2 (burn-out / termination conditions)"
      status: "adopted"
    - statement: "The HydroCraft C2F-W binary extends the original FBP-only paper with selectable Scott&Burgan, Kitral and Portugal fuel models and a spotting/ember module; these are treated as part of this implementation's scientific scope."
      scope: "implementation vs reference-paper scope"
      source: "C2F-W source (FuelModelSpain/Kitral/Portugal, Spotting modules) and KI SKILL.md fire_behavior_models table"
      status: "tentative"
