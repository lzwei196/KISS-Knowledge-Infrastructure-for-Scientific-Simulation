    description: "Noah-MP FATAL ERROR: emitted longwave <0 — ground temperature explodes to 630K+ on cells
      with SHDFAC=0 and VAI=0 (water/barren cells in summer cold start). TG at cell (126,428) reached 9272K."
    error_pattern: "emitted longwave <0|FATAL ERROR.*STOP in Noah-MP|TG=.*[5-9][0-9][0-9]"
    detection_method: log_match
  diagnosis:
    root_cause: Water/barren cells have SHDFAC=0 and VAI=0 in cold start. With no canopy shading,
      unrestricted solar absorption causes runaway ground heating. Most severe in summer (high SWDOWN).
    explanation: In cold-start mode, cells with zero vegetation (IVGTYP=water/barren) get SHDFAC=0
      and VAI=0. Noah-MP's energy balance computes unrestricted solar absorption at these cells.
      Ground temperature (TG) rises unconstrained until longwave emission exceeds floating-point limits.
      This is most severe for summer starts with high solar radiation. The Chaohe 7-day January test
      did not hit this because SWDOWN was low.
    affected_components:
    - wrfinput_d01.nc SHDFAC/VAI
    - Noah-MP energy balance
  resolution:
    action: Set minimum SHDFAC=0.01 and VAI=0.01 for all land cells in build_wrfinput.py. For water
      cells, set XLAND=2 for proper water surface treatment.
    files_changed:
    - tools/s3_wrfinput/build_wrfinput.py
    prevention: build_wrfinput.py sets minimum non-zero SHDFAC/LAI for all land cells
  severity: fatal
  promoted: true
  promoted_as: dt_v005
