template_version: "3.5"

identity:
  model_id: "SNOWPACK"
  scientific_reference_version: "SNOWPACK 3.7.1 (SLF Davos; Bartelt & Lehning 2002 / Lehning et al. 2002 Parts II–III numerical formulation)"
  implementation:
    id: "snowpack-371"
    version: "3.7.1"
    provenance: "C++; WSL Institute for Snow and Avalanche Research SLF standalone 1D snowpack binary (libsnowpack), forcing read via MeteoIO."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "LGPL-3.0-or-later"
  repo_url: "https://github.com/snowpack-model/snowpack"

boundary:
  scope_in:
    - "1D vertical snowpack evolution from meteorological forcing through a winter season"
    - "Mass and energy exchange between atmosphere, snow, optional vegetation canopy, and underlying soil"
    - "Instationary heat conduction and viscous settlement (finite-element column)"
    - "Snow microstructure and stratigraphy (grain size, bond radius, dendricity, sphericity)"
    - "Phase change (melt/refreeze), liquid water percolation, and water-vapour transport"
    - "Snow metamorphism (temperature-gradient, equitemperature, pressure sintering)"
    - "Wind-driven snow erosion/drift and densification"
    - "Avalanche stability indices and hazard diagnostics"
    - "Optional sea-ice / superimposed-ice thermodynamics with salinity transport"
  scope_out:
    - "Lateral transfers and spatial/distributed 3D simulation (handled by the separate Alpine3D wrapper, not this binding)"
    - "Catchment routing or runoff concentration beyond the snowpack base lysimeter flux"
  spatial: "1-D column"
  temporal: "sub-hourly"
  closure: "both"
  notes: "Three-phase porous-medium energy balance (ice / liquid water / water vapour): solar absorption, sublimation/deposition, melt/refreeze, and conduction are closed via the finite-element temperature solve; mass is conserved across precipitation input, phase change, vapour transport, evaporation/sublimation, wind erosion, and basal runoff. Calculation timestep (CALCULATION_STEP_LENGTH) is read internally in MINUTES and the explicit/adaptive solver sub-steps below it; output intervals (TS_DAYS_BETWEEN/PROF_DAYS_BETWEEN) are independent of the calculation timestep."

inputs:
  forcing:
    - category: "atmospheric"
      name: "TA"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "SMET 1.1 ASCII (.smet) column TA"
      notes: "Air temperature; must be MKSA Kelvin. Drives the surface energy balance and Monin-Obukhov turbulent fluxes."
    - category: "atmospheric"
      name: "RH"
      unit: "fraction (0-1)"
      source_kind: "forcing"
      model_input_format: "SMET column RH"
      notes: "Relative humidity as a 0-1 fraction (not percent); enters latent-heat / sublimation computation."
    - category: "atmospheric"
      name: "VW"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "SMET column VW"
      notes: "Wind speed; scales turbulent exchange coefficients and drives saltation/erosion and drifting-snow compaction."
    - category: "atmospheric"
      name: "DW"
      unit: "degrees (0-360)"
      source_kind: "forcing"
      model_input_format: "SMET column DW"
      notes: "Wind direction; optional, used by drift bookkeeping."
    - category: "radiative"
      name: "ISWR / RSWR / NET_SW"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "SMET column(s) ISWR and/or RSWR"
      notes: "Shortwave radiation; at least one form required. SW_MODE selects whether incoming, reflected, or both are provided (BOTH derives albedo = RSWR/ISWR)."
    - category: "radiative"
      name: "ILWR"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "SMET column ILWR (or TSS as alternative upper-boundary surface temperature)"
      notes: "Incoming longwave; if absent under FORCING=ATMOS the model assumes zero incoming longwave (severe cold bias)."
    - category: "mass"
      name: "PSUM"
      unit: "kg/m^2 per timestep (mm w.e.)"
      source_kind: "forcing"
      model_input_format: "SMET column PSUM"
      notes: "Incremental precipitation per timestep (rain+snow); phase split internal. Either PSUM or measured HS must be supplied as the mass driver."
    - category: "mass"
      name: "HS"
      unit: "m"
      source_kind: "forcing"
      model_input_format: "SMET column HS"
      notes: "Measured snow depth; optional driver/assimilation source for snow-depth-based precipitation correction (do not combine with PSUM correction, double-count risk). NB: the .smet HS forcing is in metres, but the .met HS output column is emitted in centimetres - see safety.conflicts."
    - category: "thermal_boundary"
      name: "TSG"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "SMET column TSG"
      notes: "Ground/soil surface temperature; lower-boundary forcing alternative to a prescribed geothermal flux."
    - category: "atmospheric"
      name: "P"
      unit: "Pa"
      source_kind: "forcing"
      model_input_format: "SMET column P"
      notes: "Atmospheric pressure; optional, affects vapour pressure and air density."
  parameters:
    - category: "site_geometry"
      name: "slope angle / azimuth"
      unit: "degrees"
      source_kind: "user_provided"
      model_input_format: ".sno header SlopeAngle / SlopeAzi"
      notes: "Station slope and aspect; below Constants::min_slope_angle (3 deg) the site is treated as flat for precip routing."
    - category: "site_geometry"
      name: "latitude / longitude / altitude"
      unit: "deg / deg / m"
      source_kind: "user_provided"
      model_input_format: "SMET header lat/lon/altitude"
    - category: "turbulence"
      name: "ROUGHNESS_LENGTH"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "[Snowpack] ROUGHNESS_LENGTH"
      notes: "Aerodynamic roughness length entering Monin-Obukhov surface-layer fluxes."
    - category: "turbulence"
      name: "HEIGHT_OF_METEO_VALUES / HEIGHT_OF_WIND_VALUE"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "[Snowpack] sensor heights"
      notes: "Must match real sensor install heights or stability extrapolation biases turbulent fluxes."
    - category: "soil"
      name: "soil layer properties (Rho_S, Conduc_S, HeatCapac_S, Vol_Frac_S)"
      unit: "kg/m^3, W/m/K, J/kg/K, fraction"
      source_kind: "user_provided"
      model_input_format: ".sno per-soil-layer fields"
      notes: "Soil thermal/hydraulic properties supplied inside the initial profile file."
    - category: "discretization"
      name: "MINIMUM_L_ELEMENT / REDUCE_N_ELEMENTS"
      unit: "m / count"
      source_kind: "calibrated"
      model_input_format: "[SnowpackAdvanced]"
      notes: "Control finite-element layer thickness and merging; too-small values cause zero-thickness layers and ill-conditioned matrices."
    - category: "soil_albedo"
      name: "soil albedo"
      unit: "fraction"
      source_kind: "user_provided"
      model_input_format: ".sno header SoilAlbedo"
  initial_conditions:
    - category: "snow_profile"
      name: "initial layered stratigraphy"
      unit: "per-layer (see states)"
      source_kind: "user_provided"
      model_input_format: ".sno data rows (soil bottom-to-top then snow bottom-to-top, 18 fields/row)"
      notes: "Per-layer Layer_Thick, T, Vol_Frac_I/W/V/S, grain microstructure (rg, rb, dd, sp, mk), mass_hoar, CDot, metamo. Volume fractions per layer must sum to exactly 1.0. ProfileDate must be <= first forcing timestamp."
    - category: "soil_state"
      name: "soil temperature and moisture profile (spun-up)"
      unit: "K / fraction"
      source_kind: "user_provided"
      model_input_format: ".sno soil layers"
      notes: "Requires spinup (>= ~2 annual cycles; permafrost 10+ years) to equilibrate before production, or a restart .sno from a prior run."
  boundary_conditions:
    - category: "forcing_mode"
      name: "FORCING"
      unit: "enum (ATMOS | MASSBAL)"
      source_kind: "user_provided"
      model_input_format: "[Snowpack] FORCING"
      notes: "ATMOS drives the full surface energy balance from radiation/wind/humidity; MASSBAL uses precipitation+temperature only (use when radiation absent)."
    - category: "radiation_mode"
      name: "SW_MODE"
      unit: "enum (INCOMING | REFLECTED | BOTH)"
      source_kind: "user_provided"
      model_input_format: "[Snowpack] SW_MODE"
      notes: "Selects which shortwave fields are present and how albedo is obtained."
    - category: "upper_boundary"
      name: "CHANGE_BC"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "[Snowpack] CHANGE_BC"
      notes: "Toggles the surface thermal boundary between Neumann (flux) and Dirichlet (measured TSS)."
    - category: "lower_boundary"
      name: "GEO_HEAT"
      unit: "W/m^2"
      source_kind: "user_provided"
      model_input_format: "[Snowpack] GEO_HEAT"
      notes: "Geothermal/basal heat flux at the column base (alternative to prescribed TSG)."
    - category: "physics_variant"
      name: "VARIANT"
      unit: "enum (DEFAULT | POLAR | NIED | ANTARCTICA | SEAICE)"
      source_kind: "user_provided"
      model_input_format: "[SnowpackAdvanced] VARIANT"
      notes: "Selects climate-regime presets that switch hardcoded new-snow microstructure, RH limits, and bond-strength factors; SEAICE force-enables coupled phase changes."
    - category: "scheme_selector"
      name: "WATERTRANSPORTMODEL_SNOW"
      unit: "enum (BUCKET | NIED | RICHARDSEQUATION)"
      source_kind: "user_provided"
      model_input_format: "[SnowpackAdvanced]"
      notes: "Selects the liquid-water percolation scheme; structurally controls meltwater timing and runoff."
    - category: "scheme_selector"
      name: "ALBEDO_PARAMETERIZATION"
      unit: "enum (e.g. LEHNING_2 | NIED)"
      source_kind: "user_provided"
      model_input_format: "[SnowpackAdvanced]"
      notes: "Selects snow-albedo evolution scheme."
    - category: "scheme_selector"
      name: "METAMORPHISM_MODEL"
      unit: "enum (DEFAULT | NIED)"
      source_kind: "user_provided"
      model_input_format: "[SnowpackAdvanced]"
    - category: "scheme_selector"
      name: "ATMOSPHERIC_STABILITY"
      unit: "enum (Monin-Obukhov scheme)"
      source_kind: "user_provided"
      model_input_format: "[Snowpack] ATMOSPHERIC_STABILITY"
      notes: "Turbulence/stability correction scheme for the surface-layer flux computation."
    - category: "timestep_control"
      name: "CALCULATION_STEP_LENGTH"
      unit: "minutes"
      source_kind: "user_provided"
      model_input_format: "[Snowpack] CALCULATION_STEP_LENGTH"
      notes: "Read internally as minutes; the explicit/adaptive solver diverges or floods the hazard-interval logic with overly large steps."

processes:
  modules:
    - name: "Snowpack"
      role: "driver"
      brief: "Master per-timestep orchestrator (runSnowpackModel): sets boundary conditions, calls snowfall, drift, FE temperature solve with adaptive sub-timestepping, phase change, water/vapour transport, creep, metamorphism, and remeshing."
    - name: "Meteo"
      role: "process_solver"
      brief: "Atmospheric stability / Monin-Obukhov surface-layer fluxes; computes friction velocity, sensible/latent exchange coefficients, and sensor-height adjustment."
    - name: "compTemperatureProfile"
      role: "process_solver"
      brief: "Implicit finite-element heat-conduction solve over snow+soil nodes; assembles element conductivity matrices and applies Neumann/Dirichlet surface boundary conditions."
    - name: "Solver"
      role: "integrator"
      brief: "Sparse symmetric linear-system assembler/solver (Gauss elimination) backing the FE temperature and creep solutions."
    - name: "SnLaws"
      role: "process_solver"
      brief: "Constitutive laws: new-snow density, snow viscosity (settlement), thermal conductivity, albedo, and latent/sensible flux parameterizations."
    - name: "compSnowFall"
      role: "allocator"
      brief: "Adds new-snow elements when precip/measured-HS criteria are met, assigning initial microstructure (dd, sp, rg, rb) and mass-weighted new-snow density; grows the mesh."
    - name: "PhaseChange"
      role: "process_solver"
      brief: "Sub-surface melt/freeze: converts excess/deficit energy to ice<->water content change per element, updates density and heat capacity, accumulates melt/refreeze mass."
    - name: "WaterTransport"
      role: "process_solver"
      brief: "Liquid-water movement (BUCKET, or RICHARDSEQUATION via ReSolver1d), surface evaporation, residual water content, and runoff/lysimeter mass."
    - name: "ReSolver1d"
      role: "process_solver"
      brief: "Richards-equation 1D unsaturated-flow solver using van Genuchten retention; optional preferential-flow and salinity transport."
      applicability: "WATERTRANSPORTMODEL_SNOW=RICHARDSEQUATION"
    - name: "VapourTransport"
      role: "process_solver"
      brief: "Water-vapour diffusion/transport between layers; updates element/nodal vapour density and the resulting density-change rate and latent heat."
    - name: "Metamorphism"
      role: "process_solver"
      brief: "Snow microstructure evolution: grain radius, bond radius, dendricity, sphericity, and coordination number under temperature-gradient and wind-slab forcing."
    - name: "SnowDrift"
      role: "process_solver"
      brief: "Wind-driven snow erosion/redeposition: friction-velocity-based drift index, layer erosion, and (REDEPOSIT mode) recompaction; invokes Saltation."
    - name: "Saltation"
      role: "process_solver"
      brief: "Saltation flux feeding the drift/erosion computation."
    - name: "compSnowCreep"
      role: "integrator"
      brief: "Settlement (viscous strain) integration and remeshing via combineElements/splitElements, maintaining element count and thickness thresholds."
    - name: "Canopy"
      role: "optional_module"
      brief: "Forest-canopy energy and mass balance: interception, sublimation, canopy radiation/turbulent fluxes; modifies surface forcing reaching the snow."
      applicability: "vegetation canopy present"
    - name: "SeaIce"
      role: "optional_module"
      brief: "SEAICE variant: sea-ice growth, flooding, and salinity-dependent melting temperature; forces coupled phase changes and brine-pocket equilibrium."
      applicability: "VARIANT=SEAICE"
    - name: "Stability"
      role: "process_solver"
      brief: "Snow-stability indices (natural S_n, skier S_s, structural SSI, RTA, critical cut length) computed from the layered profile."
    - name: "Hazard"
      role: "process_solver"
      brief: "Avalanche-hazard outputs: surface-hoar index and 3h/24h new-snow and drift indices aggregated over hazard timesteps."
  internal_edges:
    - from: "Snowpack"
      to: "Meteo"
      kind: "invokes"
      brief: "Driver dispatches the per-step Monin-Obukhov surface-flux / stability update."
    - from: "Snowpack"
      to: "compSnowFall"
      kind: "invokes"
      brief: "Driver dispatches new-snow element creation when precip/measured-HS criteria are met."
    - from: "Snowpack"
      to: "compTemperatureProfile"
      kind: "invokes"
      brief: "Driver dispatches the FE heat-conduction solve with adaptive sub-timestepping."
    - from: "Snowpack"
      to: "PhaseChange"
      kind: "invokes"
      brief: "Driver dispatches sub-surface melt/freeze (coupled-phase-change path when enabled)."
    - from: "Snowpack"
      to: "WaterTransport"
      kind: "invokes"
      brief: "Driver dispatches liquid-water percolation, evaporation, and runoff."
    - from: "Snowpack"
      to: "VapourTransport"
      kind: "invokes"
      brief: "Driver dispatches inter-layer water-vapour diffusion/transport."
    - from: "Snowpack"
      to: "Metamorphism"
      kind: "invokes"
      brief: "Driver dispatches grain/bond microstructure evolution."
    - from: "Snowpack"
      to: "SnowDrift"
      kind: "invokes"
      brief: "Driver dispatches wind-driven erosion/redeposition (and saltation)."
    - from: "Snowpack"
      to: "compSnowCreep"
      kind: "invokes"
      brief: "Driver dispatches viscous settlement and combine/split remeshing."
    - from: "Snowpack"
      to: "Canopy"
      kind: "invokes"
      brief: "Driver dispatches the optional forest-canopy energy/mass balance when a canopy is present."
    - from: "Snowpack"
      to: "SeaIce"
      kind: "invokes"
      brief: "Driver dispatches the optional SEAICE thermodynamics under VARIANT=SEAICE."
    - from: "Inputs"
      to: "Meteo"
      kind: "consumes_input"
      brief: "TA/RH/VW/ISWR/ILWR drive stability and surface-flux computation."
    - from: "Meteo"
      to: "compTemperatureProfile"
      kind: "invokes"
      brief: "Surface sensible/latent/longwave fluxes form the Neumann/Dirichlet boundary entering the FE heat-equation."
    - from: "compTemperatureProfile"
      to: "Solver"
      kind: "invokes"
      brief: "Assembled element matrices solved for nodal temperatures."
    - from: "Solver"
      to: "temperature"
      kind: "writes_state"
      brief: "Updated nodal temperatures written back to the column."
    - from: "compTemperatureProfile"
      to: "PhaseChange"
      kind: "invokes"
      brief: "Per-node phase-change heat sources (Qph) set during the solve are consumed by coupled phase change."
    - from: "PhaseChange"
      to: "ice_content"
      kind: "writes_state"
      brief: "Updates ice/water volumetric contents; recomputes density and heat capacity."
    - from: "PhaseChange"
      to: "liquid_water_content"
      kind: "writes_state"
      brief: "Excess energy converted to layer liquid water."
    - from: "PhaseChange"
      to: "Outputs"
      kind: "produces_output"
      brief: "Accumulated melt/refreeze mass and phase-change energy reported."
    - from: "Inputs"
      to: "compSnowFall"
      kind: "consumes_input"
      brief: "Precipitation / measured-HS criteria trigger new-snow element creation."
    - from: "SnLaws"
      to: "compSnowFall"
      kind: "invokes"
      brief: "New-snow density parameterization supplies rho_hn."
    - from: "compSnowFall"
      to: "snow_height"
      kind: "writes_state"
      brief: "New-snow depth/mass appended; SWE and column height grow."
    - from: "compSnowFall"
      to: "grain_size"
      kind: "writes_state"
      brief: "New elements seeded with initial microstructure (dd, sp, rg, rb)."
    - from: "Saltation"
      to: "SnowDrift"
      kind: "invokes"
      brief: "Saltation flux feeds the drift/erosion computation."
    - from: "SnowDrift"
      to: "snow_water_equivalent"
      kind: "writes_state"
      brief: "Wind erosion removes/flags surface mass; drift index computed."
    - from: "SnowDrift"
      to: "Outputs"
      kind: "produces_output"
      brief: "Drifting-snow surface flux and 24h drift index reported."
    - from: "WaterTransport"
      to: "liquid_water_content"
      kind: "writes_state"
      brief: "Redistributes liquid water through the layers; sets residual water content."
    - from: "WaterTransport"
      to: "ReSolver1d"
      kind: "invokes"
      brief: "RICHARDSEQUATION mode delegates unsaturated flow to the Richards solver."
    - from: "WaterTransport"
      to: "Outputs"
      kind: "produces_output"
      brief: "Snowmelt runoff (virtual lysimeter, MS_SNOWPACK_RUNOFF) accumulated at the base."
    - from: "VapourTransport"
      to: "density"
      kind: "writes_state"
      brief: "Updates vapour density and the resulting per-element density-change rate."
    - from: "temperature"
      to: "Metamorphism"
      kind: "reads_state"
      brief: "Temperature gradient drives kinetic-growth metamorphism."
    - from: "Metamorphism"
      to: "grain_size"
      kind: "writes_state"
      brief: "Evolves grain radius, bond radius, dendricity, sphericity under gradT and wind."
    - from: "Metamorphism"
      to: "SnLaws"
      kind: "invokes"
      brief: "Grain microstructure feeds the albedo and viscosity constitutive laws."
    - from: "SnLaws"
      to: "compSnowCreep"
      kind: "invokes"
      brief: "Snow viscosity law supplies the strain rate for settlement."
    - from: "compSnowCreep"
      to: "density"
      kind: "writes_state"
      brief: "Viscous settlement reduces layer thickness and increases density; remeshing merges/splits layers."
    - from: "Canopy"
      to: "Inputs"
      kind: "consumes_input"
      brief: "Canopy intercepts radiation/precip, modifying surface forcing reaching the snow."
    - from: "Soil"
      to: "PhaseChange"
      kind: "invokes"
      brief: "Soil heat/geothermal flux at the lower boundary drives basal melt."
    - from: "SeaIce"
      to: "PhaseChange"
      kind: "invokes"
      brief: "Brine-salinity-dependent melting temperature forces coupled phase change."
    - from: "snow_height"
      to: "Stability"
      kind: "reads_state"
      brief: "Layered profile (density, grain type, strength) feeds stability indices."
    - from: "Stability"
      to: "Hazard"
      kind: "invokes"
      brief: "Per-node stability indices aggregated into hazard diagnostics."
    - from: "Hazard"
      to: "Outputs"
      kind: "produces_output"
      brief: "Surface-hoar, drift, and new-snow hazard indices written to the .haz/.pro outputs."

states:
  variables:
    - name: "temperature"
      unit: "K"
      role: "prognostic"
    - name: "density"
      unit: "kg/m^3"
      role: "prognostic"
    - name: "ice_content"
      unit: "volume fraction"
      role: "prognostic"
    - name: "liquid_water_content"
      unit: "volume fraction"
      role: "prognostic"
    - name: "air_content"
      unit: "volume fraction"
      role: "diagnostic"
    - name: "soil_content"
      unit: "volume fraction"
      role: "prognostic"
    - name: "grain_size"
      unit: "mm"
      role: "prognostic"
    - name: "bond_radius"
      unit: "mm"
      role: "prognostic"
    - name: "dendricity"
      unit: "0-1"
      role: "prognostic"
    - name: "sphericity"
      unit: "0-1"
      role: "prognostic"
    - name: "grain_marker"
      unit: "category"
      role: "diagnostic"
    - name: "mass_of_hoar"
      unit: "kg/m^2"
      role: "prognostic"
    - name: "layer_thickness"
      unit: "m"
      role: "prognostic"
    - name: "viscous_strain"
      unit: "1"
      role: "accumulator"
    - name: "snow_height"
      unit: "m"
      role: "diagnostic"
    - name: "snow_water_equivalent"
      unit: "kg/m^2"
      role: "diagnostic"
    - name: "cold_content"
      unit: "J/m^2"
      role: "diagnostic"
    - name: "surface_albedo"
      unit: "0-1"
      role: "diagnostic"
    - name: "soil_temperature_profile"
      unit: "K"
      role: "prognostic"
    - name: "soil_moisture_profile"
      unit: "volume fraction"
      role: "prognostic"
    - name: "salinity"
      unit: "PSU"
      role: "prognostic"
    - name: "vapour_density"
      unit: "kg/m^3"
      role: "prognostic"
    - name: "erosion_mass"
      unit: "kg/m^2"
      role: "accumulator"
    - name: "stability_indices"
      unit: "various"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "HS"
    validation_rank: 1
    unit: "cm"
    description: "Total snow height (vertical) of the modeled column."
    emitted_in: ".met"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "The .met HS output column is emitted in centimetres (vertical), even though the .smet HS forcing input is in metres; converters comparing to obs must not assume metres."
            - "Maritime/humid sites can over-accumulate (positive PBIAS) from longwave-parameterization cold bias even when correlation r is high."
            - "Compare seasonal accumulation/ablation shape; HS returns to ~0 in summer at seasonal sites."
      detrending_options:
        - "none"
  - var: "SWE"
    validation_rank: 2
    unit: "kg/m^2"
    description: "Snow water equivalent of the snowpack column."
    emitted_in: ".met"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "Peak SWE magnitude and melt-out timing are the diagnostic targets; precipitation forcing error dominates accumulation-season SWE variance."
      detrending_options:
        - "none"
  - var: "TSS"
    validation_rank: 4
    unit: "degC"
    description: "Modeled snow surface temperature."
    emitted_in: ".met"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "The .met TSS output column is emitted in degrees Celsius; converters must not assume Kelvin (the .smet TSS forcing alternative is in Kelvin)."
            - "Under CHANGE_BC=true / Dirichlet, TSS is partly prescribed and not an independent prediction."
      detrending_options:
        - "none"
  - var: "MS_SNOWPACK_RUNOFF"
    validation_rank: 3
    unit: "kg/m^2 per output interval"
    description: "Liquid-water runoff (virtual lysimeter) leaving the base of the snowpack."
    emitted_in: ".met"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "timing_accuracy"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Accumulated over the output interval, not the calculation timestep; meltwater timing depends on the WATERTRANSPORTMODEL_SNOW scheme."
      detrending_options:
        - "none"
  - var: "energy_balance_fluxes (qs, ql, qg, OLWR, lw_net, qw)"
    validation_rank: 5
    unit: "W/m^2"
    description: "Surface sensible, latent, ground, longwave, and net energy-balance flux terms."
    emitted_in: ".met"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Eddy-covariance flux observations carry large measurement uncertainty; closure residual is sensitive to sensor-height parameters and ILWR bias."
      detrending_options:
        - "none"
  - var: "RHO_mean"
    validation_rank: 6
    unit: "kg/m^3"
    description: "Mean (bulk) snowpack density."
    emitted_in: ".met"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Near-surface/firn density is dominated by wind-driven compaction; bulk mean smooths layer detail."
      detrending_options:
        - "none"
  - var: "layer_profile (T, Rho, rg, grain type, stability indices)"
    validation_rank: 7
    unit: "per-layer (K, kg/m^3, mm, category, index)"
    description: "Per-layer stratigraphy and microstructure of the modeled snowpack column."
    emitted_in: ".pro"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "ranking_quality"
          determining_metric: "pbias"
          caveats:
            - "Compared against manual snow-pit profiles at a single date; layer matching (grain type, hardness, weak-layer depth) is partly categorical and depth-aligned, not a continuous time series."
      detrending_options:
        - "none"
  - var: "avalanche_hazard_indices"
    validation_rank: 8
    unit: "index"
    description: "Stability/hazard diagnostics (skier stability index, critical crack length, natural stability, surface-hoar and drift indices)."
    emitted_in: ".haz"
    observability:
      comparable_obs_shapes:
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families:
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Evaluated against recorded avalanche activity / stability-test classes; a diagnostic index, not a direct physical observable."
      detrending_options:
        - "none"

