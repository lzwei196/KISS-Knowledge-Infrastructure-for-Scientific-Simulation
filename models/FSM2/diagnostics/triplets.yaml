# Comments preserved from the previous file:
# FSM2 Diagnostic Triplets
# Format: symptom → diagnosis → remedy
# Each entry targets a specific failure mode encountered when running FSM2

- id: T01
  symptom: No snow accumulates despite snowfall in forcing data
  diagnosis: Air temperature in °C instead of K. Ta drives the surface energy balance, the saturation
    vapour pressure and (through T19's converter ramp) the rain/snow split, so a value of -5 read as
    -5 K instead of 268.15 K is wildly wrong everywhere at once. NOTE — this entry used to say "FSM2
    partitions precipitation internally"; it does NOT. For DRIV1D=1 FSM2_DRIVE.F90 reads Sf and Rf as
    two independent columns and the only phase split in the source is the `#if ENSMBL == 1` branch,
    which compil.sh never defines. See T19.
  remedy: 'Convert temperature to Kelvin: Ta_K = Ta_C + 273.15. Verify that Ta values in met file are
    in range 200-330.'
- id: T02
  symptom: Specific humidity is near zero, latent heat flux negligible
  diagnosis: Surface pressure in hPa or kPa instead of Pa. FSM2 computes Qa = (RH/100)*eps*es/Ps. If Ps
    is 880 instead of 88000, Qa becomes ~100× too large or the ratio breaks.
  remedy: 'Convert pressure to Pa: Ps_Pa = Ps_hPa * 100 or Ps_Pa = Ps_kPa * 1000. Valid range: 40000-110000
    Pa.'
- id: T03
  symptom: Atmosphere appears extremely dry, unrealistic evaporation
  diagnosis: Relative humidity provided as fraction (0-1) instead of percent (0-100). FSM2 expects RH
    in percent.
  remedy: Multiply RH by 100 if max(RH) ≤ 1. Verify RH range is 0-100 in met file.
- id: T04
  symptom: Snow depth grows to unrealistic values (>10 m) within days
  diagnosis: Precipitation rate in mm/h or mm/day instead of kg/m²/s. Factor of 3600 or 86400 error.
  remedy: 'Convert: Sf_kgm2s = Sf_mmh / 3600.0 or Sf_kgm2s = Sf_mmday / 86400.0. Typical hourly snowfall
    rate < 0.001 kg/m²/s.'
- id: T05
  symptom: 'Fortran runtime error on first timestep: ''end of file'' or parse error'
  diagnosis: Met file has a header row. FSM2 reads the first line expecting year/month/day/hour integers.
  remedy: Remove any header row from the met forcing file. First line must be data.
- id: T06
  symptom: 'Namelist read error: ''invalid input for namelist'''
  diagnosis: Namelist blocks are in wrong order or a block is missing. FSM2 reads namelists sequentially
    from stdin in fixed order.
  remedy: 'Ensure all 6 blocks are present in order: &params, &gridpnts, &gridlevs, &drive, &veg, &initial,
    &outputs. Empty blocks still needed: `&gridlevs /`'
- id: T07
  symptom: Array bounds error or segfault during run
  diagnosis: Npnts in &gridpnts doesn't match the number of values in &veg arrays (alb0, vegh, VAI).
  remedy: Provide exactly Npnts values for each variable in &veg. E.g., Npnts=2 requires `alb0 = 0.15,
    0.15`.
- id: T08
  symptom: No canopy effects despite setting vegh > 0
  diagnosis: VAI (vegetation area index) is set to 0. FSM2 uses VAI to determine canopy presence — vegh
    alone is not sufficient.
  remedy: 'Set VAI > 0 for forested points. Typical values: conifer 3-6, deciduous 2-5.'
- id: T09
  symptom: Solar radiation partitioning wrong — all SW is diffuse
  diagnosis: Compiled with SWPART=0 (default), which assigns all incoming SW as diffuse and sets solar
    elevation to 0.
  remedy: Recompile with SWPART=1 to enable solar position calculation and diffuse/direct partitioning.
    Set lat correctly in &drive.
- id: T10
  symptom: Snow density stays constant, no compaction
  diagnosis: Compiled with DENSTY=0 (fixed density). Snow density remains at rfix (default 300 kg/m³).
  remedy: Recompile with DENSTY=1 (age-dependent) or DENSTY=2 (overburden compaction) for more physical
    density evolution.
- id: T11
  symptom: 'Compilation error: ''undefined reference to nf90_create'''
  diagnosis: Compiled with PROFNC=1 (NetCDF output) but NetCDF-Fortran library not linked.
  remedy: Install libnetcdff-dev and use compil_nc.sh, or set PROFNC=0 for ASCII output.
- id: T12
  symptom: 'Runtime error: ''NetCDF output only available for Npnts = 1'''
  diagnosis: Compiled with PROFNC=1 but namelist sets Npnts > 1. NetCDF mode only supports single-point
    runs.
  remedy: Set Npnts=1 in &gridpnts, or recompile with PROFNC=0 for multi-point ASCII output.
- id: T13
  symptom: Surface temperature exceeds 273.15 K when snow is present
  diagnosis: This can happen briefly during melt but sustained values above Tm indicate excessive incoming
    energy or a bug in the energy balance solver.
  remedy: Check incoming radiation values (SW, LW). Verify albedo parameters (asmn, asmx). Ensure dt matches
    forcing interval.
- id: T14
  symptom: Snow disappears too early compared to observations
  diagnosis: 'Multiple possible causes: (1) fresh snow density too high (rhof), (2) albedo decays too
    fast (tmlt too small), (3) positive temperature bias in forcing.'
  remedy: 'Check: rhof (default 100 kg/m³), tmlt (default 100*3600 s), asmn (default 0.5). Compare forcing
    Ta against station data. Consider if Tadd offset is needed.'
- id: T15
  symptom: Model output files are empty (0 bytes)
  diagnosis: Model ran but produced no output. Likely the met file was empty or had only the header, causing
    immediate EOF.
  remedy: Check that met file has data rows. Verify the path in &drive met_file points to the correct
    file relative to the working directory.
- id: T16
  symptom: Latitude in namelist causes wrong sunrise/sunset times
  diagnosis: Latitude entered in radians instead of degrees in the namelist. FSM2 converts degrees to
    radians internally (lat = pi/180 * lat_deg).
  remedy: Enter latitude in degrees in the namelist &drive block. E.g., lat = 47.05 for Alptal, Switzerland.
- id: T17
  symptom: Stale .mod files cause type mismatch on recompilation
  diagnosis: Old compiled module files from a previous build with different options conflict with new
    source.
  remedy: 'Delete all .mod files in src/ before recompiling: `rm src/*.mod`. The build script does this
    automatically.'
- id: T18
  symptom: Snow SWE is negative
  diagnosis: Sublimation or transport removing more mass than available. Can occur with very high wind
    speeds or extreme sublimation rates.
  remedy: Check wind speed values (should be m/s, not km/h — divide by 3.6 if needed). Verify Ua is reasonable
    (typical < 20 m/s).
- id: T19
  symptom: Snowpack never melts (or never forms) even though the forcing has plenty of precipitation
  diagnosis: Total precipitation was written into ONE of the Sf/Rf columns. FSM2 does NOT partition
    precipitation for DRIV1D=1 — FSM2_DRIVE.F90 reads Sf and Rf as two independent columns and the only
    phase split in the whole source tree lives in the `#if ENSMBL == 1` branch, which compil.sh never
    defines. (Triplet T01's diagnosis text used to claim FSM2 "partitions precipitation internally";
    it does not.) Everything in Sf gives a snowpack that only ever grows; everything in Rf gives no
    snow at all, with no error and a clean exit code 0.
  remedy: Partition BEFORE writing the met file. `tools/convert_forcing_to_fsm2.py --precip-col <col>`
    applies FSM2's own ramp, copied from that ENSMBL branch — fs = clip(1 - 0.5*(Ta-273.15), 0, 1),
    i.e. all snow at or below 0 degC and all rain at or above +2 degC. Ménard et al. (2019, ESSD 11,
    865-880, Fig. 4) fit the same near-linear 0-2 degC ramp to the ESM-SnowMIP reference sites.
- id: T20
  symptom: No RH column in the forcing — every reanalysis publishes specific humidity instead
  diagnosis: FSM2 DRIV1D=1 wants column 10 as RELATIVE humidity in percent, but CMFD, MSWX, ERA5 and
    NASA POWER all publish SPECIFIC humidity. Converting with a generic Magnus/Tetens formula introduces
    an error, because FSM2_DRIVE.F90 immediately inverts RH back to Qa with its OWN saturation formula
    (e0 = 611.213 Pa, es = e0*exp(17.5043*Tc/(241.3+Tc)), Qa = (RH/100)*eps*es/Ps, eps = 0.622).
  remedy: Use `tools/convert_forcing_to_fsm2.py --shum-col <col>`. It inverts that exact formula with
    those exact constants, so the q -> RH -> q round trip through FSM2 is exact rather than approximate.
    RH is clipped to 0-100 because FSM2 has no super-saturation branch.
- id: T21
  symptom: Turbulent fluxes are tiny and the snowpack melts far too slowly when forced by NASA POWER
  diagnosis: NASA POWER's WS2M is derived with a fixed surface-roughness assumption and collapses over
    rough/forested cells — at Sodankyla (67.36N, 26.63E) its 2010 annual mean is 0.51 m/s against
    2.30 m/s for WS10M at the same cell. Feeding 0.5 m/s into FSM2 starves the sensible/latent exchange
    whatever zU says. `ki_tools_common.load_forcing.load_hourly_forcing` used to request WS2M only
    (the DAILY loader already preferred WS10M for exactly this reason).
  remedy: The hourly loader now requests both and returns the 10 m wind in `wind_ms`, the 2 m wind in
    `wind2_ms`, and the height in `wind_height_m`. Set the namelist `zU` to `wind_height_m` (10, not
    the FSM2 default that happens to also be 10 only by luck) so the wind and its height agree.
- id: T22
  symptom: FSM2 stops with a file-not-found on the met file even though the path is correct and readable
  diagnosis: The met_file namelist string is declared character(len=70) in FSM2.F90. A longer absolute path is silently
    TRUNCATED at 70 characters by the namelist read, so FSM2 opens a path that does not exist. The same
    70-character limit applies to `runid`, `dump_file`, `alb0_file`, `vegh_file` and `VAI_file`.
  remedy: Put the met file in the run directory and give `met_file` a short RELATIVE name ('met.txt'),
    running FSM2 with cwd = the run directory. Never pass a long absolute path.
- id: T23
  symptom: 'xarray/netCDF4 raises "OSError: [Errno -101] NetCDF: HDF error" on Snow_cci or MSWX files'
  diagnosis: The bundled netCDF4/HDF5 build in KISSPATH_PYTHON_ENV cannot open these
    files at all. It is a reader problem, not a corrupt file — the same file opens fine through h5netcdf
    or h5py.
  remedy: Open with `xr.open_dataset(path, engine='h5netcdf')`, or read the array directly with h5py.
    For a single point out of many daily files h5py is also much faster, because it decompresses only
    the chunk containing the cell.
- id: T24
  symptom: Snow_cci SWE looks like it has impossible negative snow, or the whole summer is missing
  diagnosis: In snowcci_swe_nh (ESA CCI Snow L3C SWE v2.0) the negative values are FLAGS, not data —
    -30 glacier, -20 mountain, -10 water, -1 no_data (see the `swe` variable's flag_values /
    flag_meanings attributes). 0 means no_snow and is a VALID observation. The product is also produced
    for the snow season only (roughly Sep-May, ~215 files per year), so there is no summer at all.
  remedy: Mask values < 0 to NaN and KEEP the zeros; never treat 0 as a gap. Do not fabricate summer
    zeros to "complete" the series — pair only on the days the product actually ships, and say so.
    Pick a cell where the mountain flag does not fire, because over complex terrain the product is all -20.

# --- appended by KDT promote (run FSM2_retry2) at 2026-08-23T13:32:28.818633+00:00 ---
- id: T25
  symptom:
    description: Simulated peak SWE is 20-30% too high with a large positive PBIAS,
      but r is high (~0.89), NSE is positive and melt-out timing is within a few days
      — the surplus is already fully built by December and held flat through deep
      winter
  diagnosis:
    root_cause: 'This is a FORCING precipitation bias passing through to the metric
      at roughly 1:1, not a snow-parameter problem. At a cold open site FSM2 retains
      essentially all cold-season snowfall (<10% lost to sublimation + midwinter melt),
      so simulated peak SWE tracks cumulative Oct-Apr Sf almost exactly (measured
      at Sodankyla 2003-2019 with NASA POWER hourly: Sf 271-294 mm -> peak SWE 281
      kg m-2 against 225 observed). Menard et al. 2019 (ESSD 11, 865-880) Sect. 3
      applied a site-specific precipitation multiplier at ALL TEN ESM-SnowMIP reference
      sites, including the low-relief boreal/Arctic ones sitting at their grid-cell
      elevation, and FSM2 is benchmarked against that bias-corrected forcing. A KI
      recipe that goes reanalysis -> converter -> run with no bias-correction step
      inherits the full reanalysis wet bias. Do NOT reach for the canopy at an open
      site: Menard Table 2 records SOD as ''Clearing (short heather)'', so vegh=0.0,
      VAI=0.0 is correct there.'
  remedy:
    action: 'Print the forcing''s annual precipitation AND cold-season snowfall before
      scoring and compare against a site climatology. Then either apply the multiplier
      with `tools/convert_forcing_to_fsm2.py --precip-scale <m>` and record its source,
      or leave the forcing raw and report the PBIAS explicitly as a FORCING bias.
      Correct against an UNDERCATCH-CORRECTED reference, never a raw gauge normal:
      at Sodankyla, POWER 777 mm/yr against the raw FMI normal 527 mm/yr looks like
      +47%, but the multiplier that actually lands peak SWE on the observation is
      0.80 (~622 mm/yr) — the true bias is ~+25%, and scaling by 527/777 = 0.678 overshoots
      to about -15%. At an ESM-SnowMIP reference site use its published Table 4 logistic
      phase factors via `--phase-logistic T0 T1` (SOD 2.52 1.16). Judge the run on
      docs/validation_convention.yaml''s snw band (NSE >= 0 and nRMSE <= 1.0), NOT
      on PBIAS, and do not route this residual to parameter calibration — tuning rhof/asmn/tmlt
      to absorb a forcing surplus is compensating-error tuning that will not transfer.'
  format_spec_violated: none — this is a forcing-provenance decision rule, not a file-format
    rule; it is documented at SKILL.md:562 'Forcing a point column from a reanalysis
    grid cell (MANDATORY check)'
  canonical_intent: ki_local_if_pass
  added_by_run: FSM2_retry2
