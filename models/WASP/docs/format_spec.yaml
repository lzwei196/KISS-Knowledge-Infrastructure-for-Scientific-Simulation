    (depleti
  remedy: 'Set SOD depletion rate based on TSI: oligotrophic 0.02, mesotrophic 0.05, eutrophic 0.10; convert_parameters_to_wasp;
    [''Compute TSI from available Chl-a, Secchi, or TP data'', ''TSI < 30 (oligotrophic): depletion_rate
