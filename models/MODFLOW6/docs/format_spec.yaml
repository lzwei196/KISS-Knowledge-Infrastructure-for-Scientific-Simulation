  remedy: 'Set IDOMAIN=0 for cells outside the basin boundary.; create_grid_from_basin; [''Intersect grid
    cells with basin shapefile'', ''Set IDOMAIN=0 for cells whose centroid is outside the basin'', ''Or
    use cell area overlap: IDOMAIN=0 if overlap < 50%'', ''Apply to all layers: IDOMAIN[:, i, j] = 0 if
