validation:
- obs_shape: spatial_snapshot
  headline_metrics:
  - metric: sorensen
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.8
      good: 0.6
      satisfactory: 0.4
    pass_band: satisfactory
    band_note: 'Landis-&-Koch agreement tier reproduced by Giannaros 2020 for fire burned areas: "(0.4,
      0.6] values indicate moderate agreement, (0.6, 0.8] ... substantial agreement, and (0.8, 1] ...
      near-perfect agreement"; the operational acceptance was "KC and SC ... exceed the threshold value
      of 0.40, which indicates at least moderate agreement". Peterson (HFire) corroborates: SC<0.8 "relatively
      poor", SC>0.9 high agreement.'
    cites:
    - giannaros2020
    - peterson_hfire
  - metric: kappa
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.8
      good: 0.6
      satisfactory: 0.4
    pass_band: satisfactory
    band_note: Same Landis-&-Koch tier applied to KC by Giannaros 2020 (>=0.40 = at least moderate). Jahdi
      2015 calibrated FARSITE achieved kappa 0.75-0.91 on best fuel-model fits across 4 wildfires.
    cites:
    - giannaros2020
    - jahdi2015
  secondary_metrics:
  - metric: csi
    direction: maximize
    status: supportive
    ceiling_reason: CSI (threat score) is mathematically identical to the Jaccard/IoU index TP/(TP+FP+FN);
      it is the Dice-equivalent of the Sorensen headline (Dice = 2*Jaccard/(1+Jaccard)). The fire-spread
      literature (FARSITE, HFire, operational WRF-Fire) reports Sorensen + Cohen's kappa, not CSI, for
      perimeter agreement, so CSI is retained as informative only. Zhou 2024 full-input FARSITE on two
      real fires reached Jaccard 0.42-0.44 (Sorensen 0.59-0.61), the realistic operational ceiling under
      complete, correct input.
    cites:
    - zhou2024
  - metric: commission_error
    direction: minimize
    status: supportive
    ceiling_reason: null
    cites:
    - jahdi2015
  - metric: omission_error
    direction: minimize
    status: supportive
    ceiling_reason: null
    cites:
    - jahdi2015
  validated_when: Sorensen >= 0.4 AND Cohen's kappa >= 0.4 (at least moderate spatial agreement vs the
    observed perimeter, Giannaros 2020 operational threshold); good = 0.6 (substantial), very_good = 0.8
    (near-perfect).
  evidence_strength: strong
  confidence: 0.8
  notes: Headline supersedes the dag determining_metric (csi) with its Dice-equivalent Sorensen coefficient
    plus Cohen's kappa, which ARE SimFire's native validation metrics and the field standard for fire-perimeter
    agreement (Jahdi 2015; Peterson HFire; Giannaros 2020). Compared maps must share grid size and georeferencing
    (dag caveat) — a size mismatch is a hard failure, not a score. fire_perimeter_length (dag var, has_obs_binding=false)
    is intentionally NOT given a block.
  dag_variable: fire_map
- obs_shape: categorical_event
  headline_metrics:
  - metric: sorensen
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.8
      good: 0.6
      satisfactory: 0.4
    pass_band: satisfactory
    band_note: 'Per-pixel burned/not-burned confusion matrix vs an observed perimeter; same Sorensen/kappa
      agreement tier as the spatial_snapshot block (Giannaros 2020: SC/KC>=0.40 = at least moderate).'
    cites:
    - giannaros2020
    - peterson_hfire
  secondary_metrics:
  - metric: csi
    direction: maximize
    status: supportive
    ceiling_reason: CSI == Jaccard == IoU; Zhou 2024 full-input FARSITE Jaccard 0.42-0.44 on two real
      fires is the operational ceiling. Reported as informative; the graded convention is Sorensen/kappa.
    cites:
    - zhou2024
  - metric: pod
    direction: maximize
    status: supportive
    ceiling_reason: null
    cites:
    - gale2025
  - metric: far
    direction: minimize
    status: supportive
    ceiling_reason: null
    cites:
    - gale2025
  validated_when: Sorensen >= 0.4 (at least moderate per-pixel agreement vs the observed perimeter, Giannaros
    2020); POD/FAR reported as supporting hit/miss diagnostics (Gale & Cary 2025 definitions, no cited
    numeric target).
  evidence_strength: strong
  confidence: 0.75
  notes: Same underlying comparison as fire_extent/spatial_snapshot; kept as a distinct block because
    the dag declares a categorical_event obs_shape. Sensitive to ignition placement and pixel_scale (dag
    caveat). No cited POD/FAR numeric threshold exists, so those stay supportive.
  dag_variable: fire_map
- obs_shape: point_snapshot
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      satisfactory: null
    pass_band: satisfactory
    band_note: No fetched paper gives a numeric percent tolerance for TOTAL burned-area magnitude. The
      field reports over/under-estimation via the Overestimation Index (OI, range -1..+1; Giannaros 2020,
      "positive (negative) values indicating overestimation (underestimation)") but sets no acceptance
      band; area agreement is judged jointly with the Sorensen/kappa spatial-overlap metrics.
    cites: []
  secondary_metrics:
  - metric: overestimation_index
    direction: zero_centered
    status: supportive
    ceiling_reason: OI quantifies burned-area over/under-prediction (range -1..+1); operational fires
      are typically overestimated (OI>0, e.g. 0.06-0.45 in Giannaros 2020) because suppression is not
      modelled. Documented but NOT numerically bounded by any fetched paper.
    cites:
    - giannaros2020
  validated_when: UNRESOLVED numeric threshold — total burned-area magnitude has no cited percent tolerance;
    use the Sorensen/kappa spatial-overlap block as the graded convention, with OI as a bias diagnostic.
  evidence_strength: weak
  confidence: 0.4
  notes: 'Total area is derived as burned_pixels x pixel_scale^2 and is acutely sensitive to a correct
    pixel_scale and ft2->acres conversion (dag caveat: an unmatched pixel_scale biases area 2-10x). Band
    is null per the no-fabrication rule and MUST NOT be used to loosen the gate; a cited burned-area percent-error
    convention would be needed to raise this above weak.'
  dag_variable: burned_area
- obs_shape: point_time_series
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      satisfactory: 35
    pass_band: satisfactory
    band_note: 'Gale & Cary 2025: "we also calculated the proportion of predictions within +/-35% of observed
      values, which is considered a reasonable standard for ROS model accuracy (Cruz and Alexander, 2013)".
      Cited +/-35% agreement interval (primary source Cruz & Alexander 2013, paywalled).'
    cites:
    - gale2025
  secondary_metrics:
  - metric: nse
    direction: maximize
    status: supportive
    ceiling_reason: The head-fire ROS literature evaluates skill with MAE, MBE, MBPE, RMSE and the +/-35%
      agreement proportion (Gale & Cary 2025), not NSE. NSE is not a reported ROS validation metric; retained
      as informative only. SimFire has no calibrated/validated ROS series of its own.
    cites:
    - gale2025
  - metric: rmse
    direction: minimize
    unit: km/hr
    status: supportive
    ceiling_reason: Best-performing empirical model (Vesta Mk2) RMSE 1.26 km/hr, MAE 0.90, MBPE 32.4%
      vs 102 VIIRS-inferred ROS observations (Gale & Cary 2025); WRF-SFIRE reproduced the FireFlux head-fire
      ROS exactly (1.61 m/s) (Kochanski 2013). Magnitude context; no cited RMSE acceptance tier.
    cites:
    - gale2025
    - kochanski2013
  validated_when: '|PBIAS| (mean bias percent error of head-fire ROS) <= 35% (Gale & Cary 2025 / Cruz
    & Alexander 2013 reasonable-standard interval); NSE not required (superseded — not the ROS convention).'
  evidence_strength: moderate
  confidence: 0.55
  notes: Supersedes the dag determining_metric (nse) with the field's magnitude/bias convention, per the
    GLM-AED precedent for a superseding headline. Defensible only where an observed/reference head-fire
    ROS series exists (dag caveat). Kochanski 2013 (WRF-SFIRE/FireFlux) corroborates that a Rothermel
    spread rate can match observations point-for-point; Gale & Cary 2025 supplies the cited error band.
  dag_variable: rate_of_spread
- obs_shape: point_snapshot
  headline_metrics:
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      satisfactory: 35
    pass_band: satisfactory
    band_note: Same +/-35% ROS-accuracy standard as the time-series block (Gale & Cary 2025, after Cruz
      & Alexander 2013). Applied to a representative head-fire ROS vs a measured spread rate.
    cites:
    - gale2025
  secondary_metrics:
  - metric: rmse
    direction: minimize
    unit: km/hr
    status: supportive
    ceiling_reason: Benchmark absolute error for good ROS models is ~0.9-1.3 km/hr (Gale & Cary 2025);
      WRF-SFIRE matched the FireFlux ROS exactly (Kochanski 2013). No cited RMSE acceptance tier.
    cites:
    - gale2025
    - kochanski2013
  validated_when: '|PBIAS| of a representative head-fire ROS <= 35% vs a measured spread rate (Gale &
    Cary 2025 / Cruz & Alexander 2013).'
  evidence_strength: moderate
  confidence: 0.6
  notes: Sensitive to wind/moisture unit conventions and to the ft/min -> m/s or chains/hr conversions
    (dag caveat). The +/-35% interval is the single cited numeric ROS-accuracy convention available.
  dag_variable: rate_of_spread
