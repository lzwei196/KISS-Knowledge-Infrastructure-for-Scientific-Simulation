# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: PCR_GLOBWB_2
  language: python
  implementation:
    id: pcr-globwb-2
    version: 2 (Python 3, develop branch)
    provenance: Python with PCRaster Python (DynamicModel/DynamicFramework); Utrecht University UU-Hydro.
  scientific_reference_version: PCR-GLOBWB 2 (Sutanudjaja et al. 2018, GMD 11:2429-2453) — 5 arcmin global
    hydrology & water resources spec
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/PCR_GLOBWB_2/miniconda/envs/pcrglobwb_python3/bin/python
    type: work_dir
pipeline:
  stages:
  - s1_configuration
  - s2_forcing_preparation
  - s3_soil_parameters
  - s4_water_demand
  - s5_execution
  - s7_output_analysis
tools:
  count: 6
  files:
  - tools/convert_forcing_to_pcrglobwb.py
  - tools/convert_soil_params.py
  - tools/fetch_pcrglobwb_inputs.py
  - tools/make_clone_map.py
  - tools/parse_pcrglobwb_output.py
  - tools/run_pcrglobwb.py
inputs:
  forcing:
  - name: precipitation
    unit: m/day
  - name: air temperature
    unit: degC
  - name: reference potential evapotranspiration
    unit: m/day
  parameters:
  - name: land cover classification (forest, grassland, irrPaddy, irrNonPaddy)
    unit: '-'
  - name: saturated hydraulic conductivity per layer (KSat1/KSat2)
    unit: m/day
  - name: saturated & residual volumetric water content (satVolWC, resVolWC)
    unit: m3/m3
  - name: air entry value and pore-size distribution (airEntryValue, poreSizeBeta)
    unit: m, -
  - name: soil storage capacity / depth per layer
    unit: m
  - name: tangent slope, hillslope length, orographic correction (tanslope, slopeLength, orographyBeta)
    unit: -, m, -
  - name: aquifer conductivity, specific yield, recession coefficient (kSatAquifer, specificYield, recessionCoeff)
    unit: m/day, fraction 0-1, day-1
  - name: Manning's roughness (manningsN)
    unit: '-'
  - name: reservoir characteristics (GRanD) and lake/water-body extents (GLWD)
    unit: mixed
  initial_conditions:
  - name: snow water equivalent and interception storage
    unit: m
  - name: upper/lower soil storage (storUpp, storLow)
    unit: m
  - name: groundwater storage (storGroundwater)
    unit: m
  - name: channel and water-body storage
    unit: m3
  boundary_conditions:
  - name: clone map (resolution and spatial extent)
    unit: '-'
  - name: landmask (area of interest restriction)
    unit: '-'
  - name: local drainage direction network (LDD, from HydroSHEDS)
    unit: '-'
  - name: human-influence toggles (includeIrrigation / includeDomestic / includeIndustry / includeLivestock
      WaterDemand)
    unit: '-'
  - name: 'soil layering (numberOfUpperSoilLayers: 2 vs 3) and routing method (accuTravelTime vs kinematic
      wave)'
    unit: '-'
  - name: 'reference ET method (referenceETPotMethod: input vs Hamon) and dynamicFloodPlain toggle'
    unit: '-'
  - name: water demand by sector (domestic, industry, livestock)
    unit: m/day depth
  - name: irrigation area, irrigation efficiency, desalination supply, pumping capacity
    unit: ha, fraction 0-1, m/day, billion m3/year
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - discharge
  - totalRunoff
  - actualET
  - gwRecharge
  - storGroundwater
  - totalWaterStorageThickness
  - snowCoverSWE
  other: []
validation:
  tier: tested
  tier_justification: 'measured: NSE=0.779, KGE=0.865, R=0.887, 2 scorecard(s)'
  metrics:
    best_nse: 0.779
    best_kge: 0.865
    best_r: 0.887
summary:
  total_tools: 6
  total_stage_docs: 6
  total_diagnostic_triplets: 32
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
