        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gave a numeric source-trace percentage validation threshold."
        cites: []
    secondary_metrics:
      - metric: tracer_match
        direction: maximize
        status: supportive
        ceiling_reason: "Blokker 2008 describes tracer studies as relevant validation evidence for distribution-network water quality models, but no numeric source-provenance band is given."
        cites: [blokker2008]
    validated_when: "UNRESOLVED - validate source trace only against tracer/blending observations after a cited metric band is fetched."
    evidence_strength: weak
    confidence: 0.25
    notes: "Source trace percentage is an EPANET diagnostic/provenance output; cached papers did not provide an automatic pass threshold."

  - dag_variable: Pump energy and cost
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gave a numeric pump-energy/cost time-series validation threshold against metered billing or SCADA energy observations."
