  - id: dt_v005
    stage: "s3_wrfinput"
    failure_domain: "silent_error"
    symptom:
      description: "Noah-MP FATAL ERROR: emitted longwave <0 — ground temperature explodes to 600+ K"
      error_pattern: "emitted longwave <0|FATAL ERROR.*STOP in Noah-MP|TG=.*[5-9][0-9][0-9]"
      detection_method: "log_match"
    diagnosis:
      root_cause: "Water/barren cells have SHDFAC=0 and VAI=0 in cold start, causing runaway ground heating"
      explanation: >
        In cold-start mode (no restart file), cells with zero vegetation (water bodies, barren land)
        have SHDFAC=0 and VAI=0 (no shading). Noah-MP's energy balance computes unrestricted
        solar absorption → ground temperature explodes beyond 600K → longwave emission goes negative.
        This is most severe in summer (high solar radiation) for large domains with many non-vegetated cells.
        The Chaohe 7-day January test did not hit this because solar radiation was low.
      affected_components: ["s3_wrfinput", "s10_execution"]
    remedy:
      action: "Set minimum SHDFAC=0.01 and VAI=0.01 for all cells. Or set XLAND=2 (water) for water cells with proper water surface treatment."
      tool_to_run: "build_wrfinput"
      manual_steps:
        - "In wrfinput_d01.nc: ensure no cell has BOTH SHDFAC=0 AND VAI=0"
        - "For water cells (LU_INDEX=16): set XLAND=2 (water treatment uses SST, not energy balance)"
        - "For barren cells: set minimum SHDFAC=0.01, LAI=0.01"
        - "Or: use a spinup period with reduced solar (start in winter, run 1 year, use restart)"
      prevention: "build_wrfinput.py sets minimum non-zero SHDFAC/LAI for all land cells"
    severity: "fatal"
    cross_references: ["dt_009"]
    verified: "2026-03-20"

  - id: dt_v006
    stage: "s8_forcing"
    failure_domain: "dependency_mismatch"
    symptom:
      description: "OOM killed (signal 9) when running WRF-Hydro on large domains with many MPI processes"
      error_pattern: "EXIT CODE: 9|signal 9|Killed"
      detection_method: "exit_code"
    diagnosis:
      root_cause: "Large routing grid (2140×1768 = 3.8M cells) with 8+ MPI processes exceeds available memory"
      explanation: >
        Each MPI process holds a full copy of several routing grid arrays in memory.
        For Bengbu (121,330 km², 535×442 LSM, 2140×1768 routing at 250m), 8 processes
        need ~16 GB total. Systems with limited free memory get OOM-killed.
        Reduce nproc or increase AGGFACTRT (coarser routing grid).
      affected_components: ["s10_execution"]
    remedy:
      action: "Reduce MPI processes (nproc=2-4) or increase AGGFACTRT from 4 to 8 or 10"
      tool_to_run: "run_wrfhydro"
      manual_steps:
        - "Try: mpirun -np 2 ./wrf_hydro.exe"
        - "Or change AGGFACTRT from 4 to 8 (500m routing instead of 250m)"
      prevention: "run_wrfhydro.py auto-detects memory and recommends nproc"
    severity: "fatal"
    cross_references: []
    verified: "2026-03-20"

  - id: dt_v007
    stage: "s4_fulldom"
    failure_domain: "silent_error"
    symptom:
      description: "50% of routing cells flow uphill, 95% cannot reach outlet, 39K circular 2-cell cycles"
      error_pattern: "Apparent error in network topology|uphill flow|circular"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "WhiteboxTools D8 encoding documentation is WRONG — actual encoding differs from docs"
      explanation: >
        WBT documentation says: 1=E, 2=NE, 4=N, 8=NW, 16=W, 32=SW, 64=S, 128=SE.
        ACTUAL WBT output (verified by empirical test): 1=NE, 2=E, 4=SE, 8=S, 16=SW, 32=W, 64=NW, 128=N.
        ArcGIS/WRF-Hydro convention: 1=E, 2=SE, 4=S, 8=SW, 16=W, 32=NW, 64=N, 128=NE.
        Using the documented WBT encoding produces 8/9 WRONG direction mappings,
        causing half of all cells to flow uphill and creating thousands of circular paths.
        This is THE primary root cause of WRF-Hydro routing crashes.
      affected_components: ["s4_fulldom"]
    remedy:
      action: "Use VERIFIED WBT→ArcGIS mapping: {0:0, 1:128, 2:1, 4:2, 8:4, 16:8, 32:16, 64:32, 128:64}"
      tool_to_run: "build_fulldom_hires"
      manual_steps:
        - "The correct mapping was derived by creating a simple test DEM and observing actual WBT output"
        - "build_fulldom_hires.py WBT_TO_ARCGIS table has been corrected"
      prevention: "Always verify D8 encoding empirically — never trust documentation alone"
    severity: "silent"
    cross_references: ["dt_010"]
    verified: "2026-03-20"

  - id: dt_v008
    stage: "s8_forcing"
    failure_domain: "unit_conversion"
    symptom:
      description: "PSFC flat across domain despite 0-1955m elevation range — mountain cells 20% overpressured"
      error_pattern: "emitted longwave <0|FATAL ERROR.*Noah-MP"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Forcing PSFC and T2D spatially interpolated without elevation correction"
      explanation: >
        VIC 0.25° forcing is interpolated to 1km LCC grid using scipy.griddata without
        adjusting for elevation difference between source (25km average ~300m) and target
        (1km cells, 0-1955m). Mountain cells at 1955m receive sea-level pressure (101 kPa)
        instead of correct ~80 kPa. T2D is 10.7°C too warm at mountaintops.
        This causes 20% overestimation of air density → amplified heat fluxes → energy divergence.
      affected_components: ["s8_forcing"]
    remedy:
      action: "After spatial interpolation, apply: T2D -= 0.0065*Δz, PSFC *= exp(-g*Δz/(R*Tv))"
      tool_to_run: "convert_forcing_to_ldasin"
      manual_steps:
        - "Compute Δz = HGT_1km - HGT_vic_interpolated"
        - "T2D_corrected = T2D - 0.0065 * Δz (lapse rate 6.5 K/km)"
        - "PSFC_corrected = PSFC * exp(-9.80665 * Δz / (287 * Tv))"
      prevention: "convert_forcing_to_ldasin.py now applies elevation correction automatically"
    severity: "silent"
    cross_references: []
    verified: "2026-03-20"

  - id: dt_v009
    stage: "s11_output"
    failure_domain: "silent_error"
    symptom:
      description: "Basin-mean SFCRNOFF+UGDRNOFF gives 2-3× higher discharge than VIC or observations"
      error_pattern: "runoff ratio > 0.8|Q/P > 1"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "LDASOUT SFCRNOFF/UGDRNOFF accumulators include routed upstream flow, not just local runoff"
      explanation: >
        With overland routing (OVRTSWCRT=1) and subsurface routing (SUBRTSWCRT=1) enabled,
        water routed from upstream cells accumulates in downstream cells' SFCRNOFF/UGDRNOFF.
        Basin-averaging these values double/triple counts the same water as it passes through
        multiple cells. Headwater cells show correct Q/P=0.35-0.38, but channel cells show
        Q/P=0.96 due to upstream contributions. The correct way to get outlet discharge is
        from CHRTOUT (channel routing output), not from LDASOUT SFCRNOFF averaging.
      affected_components: ["s11_output"]
    remedy:
      action: "Use CHRTOUT_DOMAIN=1 in hydro.namelist to get true routed discharge at outlet"
      tool_to_run: ""
      manual_steps:
        - "Set CHRTOUT_DOMAIN=1 in hydro.namelist"
        - "Read outlet discharge from CHRTOUT files"
        - "Do NOT average SFCRNOFF across grid for basin discharge"
      prevention: "Always use CHRTOUT for discharge comparison, not LDASOUT SFCRNOFF"
    severity: "silent"
    cross_references: []
    verified: "2026-03-20"

