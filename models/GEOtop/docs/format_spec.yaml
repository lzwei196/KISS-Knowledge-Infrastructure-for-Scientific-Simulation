- id: dt_021
  symptom: 'Forcing lands at the wrong time: all weather one day early (output rain and air temperature
    match the meteo file shifted by exactly 1 day), or, with a fractional offset, daytime skin temperature
    ~5-10 K too cold and SWin out of phase.'
  diagnosis: 'The JDfrom0 column does not equal GEOtop''s own clock (Python days since 0001-01-01 + 367);
    GEOtop''s clock is convert_dateeur12_JDfrom0 (times.cc:130-138): days = 1 + 366 + (year-1)*365 + leap
    days, i.e. Python (date - datetime(1,1,1)).days + 367 + hour/24 for every date. When the meteo file
    has a JDfrom0 column it is used AS IS to place the records and Date is ignored (fixing_dates, meteodata.cc:589-607).
    The sun follows the model clock (energy.balance.cc:117), not this column. History: the KI used +366.25
    (records 1 day + 6 h early against the sun, fixed 2026-06-23), then +366, copied from the shipped
    Matsch_B2_Ref_007 meteo (734047.0 for 02/10/2009 00:00), which is itself one day off (its own output
    prints 02/10/2009 01:00 = 734048.041667; 9 of 12 shipped meteo files match the clock). +366 kept the
    daily shape, so it stayed hidden until 2026-10-19.; [''meteodata'', ''radiation'', ''energy.balance'',
    ''water.balance'']'
  remedy: 'JDfrom0 = (date - datetime(1,1,1)).days + 367 + seconds/86400, written with 6 decimals (or
    drop the JDfrom0 column so GEOtop builds it from Date); convert_forcing.py; [''Check a row: 01/11/2017
    00:00 must be 737000.000000; 02/10/2009 01:00 must be 734048.041667'', ''run_and_score.py check_meteo
    compares the whole JDfrom0 against the clock, not only its fraction'', ''Do not anchor on the Matsch_B2/P2
    or Muntatschini shipped meteo files: they are one day off'']; convert_forcing.py date_to_jd_from0
    uses +367 since 2026-10-19; tests/test_forcing_timing.py checks it 1900-2100 and with the binary'
  severity: silent
- id: dt_022
  symptom: After changing the record spacing (--dt different from the input step) total precipitation
    is an exact small-integer multiple (3x, 8x, 24x) of the true amount, or state variables lag by half
    a step. No error is raised.
  diagnosis: 'Iprec was linearly INTERPOLATED when the record spacing changed, instead of being redistributed
    as a depth; or interval means were interpolated between interval ends; Inside convert_forcing.py the
    record at t holds the depth over (t-dt, t] (GEOtop uses a record stamped t for (t-dt, t], meteodata.cc:137-245).
    Interpolating the depth copies the same depth into each sub-record (native_step / target_step too
    much). For state columns each record is a mean over its interval, so it sits at the interval centre
    t - step/2; interpolating between interval ends lags by (native - dt)/2. (Correction 2026-10-19: this
    entry used to say fill_Pint divides Iprec by the record spacing. It does not; see dt_004.); [''meteodistr'',
    ''water.balance'', ''pedo.funct'']'
  remedy: 'Resample Iprec depth-conservingly (split on upsample, sum on downsample) and interpolate state
    columns between interval centres. Best: set --dt to the forcing''s NATIVE step so no resampling happens
    at all.; convert_forcing.py; ["Compare the meteo file''s depth (Iprec x dt/3600, rows 2..) against
    the source dataset total for the same period", ''For CMFD 3-hourly use --dt 10800; for MSWX 3-hourly
    --dt 10800; for a daily source --dt 86400'', ''The written Iprec is mm/h (dt_004); the division by
    dt/3600 happens once, when writing'']; convert_forcing.py to_grid splits/sums Iprec by depth and interpolates
    state columns at interval centres (2026-10-19)'
  severity: silent
- id: dt_023
  symptom: Soil profile layer 1 is a constant 1.0 at every timestep (temperature, water content and ice
    content all exactly 1.0); the profile has one more layer than the soil file declares; depth-weighted
    storage sums and depth-matched profile validations are wrong.
  diagnosis: 'parse_output.read_soil_profile counted the IDpoint column as the first soil layer; GEOtop
    point profile files (soilTz/thetaliq/thetaice/psiz) carry SIX leading metadata columns: Date12, JulianDayFromYear0,
    TimeFromStart, Simulation_Period, Run, IDpoint. The skip filter matched only the first five, so IDpoint
    (the constant point id, 1) was emitted as layer 1 and every real layer was shifted one index deeper.
    A validation against a 5 cm probe then silently read the 15 cm model layer, and any storage sum picked
    up a bogus 1.0*Dz term. Related: the layer column HEADERS are the layer mid-point depths in mm (5.0,
    15.0, 30.0, ...) and were being discarded, forcing downstream code to guess the depth mapping.; [''output'']'
  remedy: 'Skip IDpoint/IDbasin, and carry the header depth through as depth_mm; parse_output.py; [''Check
    the parsed profile: layer 1 must vary in time. A constant 1.0 means IDpoint was captured'', ''Cross-check
    the layer count against the row count of soilXXXX.txt'', ''Derive layer thickness from consecutive
    mid-point depths, not from the requested layer list -- GEOtop may re-discretize'']; parse_output.read_soil_profile
    now skips IDpoint/IDbasin and emits a depth_mm column'
  severity: silent
- id: dt_024
  symptom: A surface/soil temperature validation reports a wildly negative PBIAS (e.g. -97%) and a poor
    or negative KGE while NSE and r are good (0.6 / 0.97). Metrics disagree violently about the same series.
  diagnosis: 'Ratio-based metrics (PBIAS, KGE) computed on a temperature series in CELSIUS whose mean
    sits near zero; PBIAS = 100*sum(sim-obs)/sum(obs) and KGE''s bias term beta = mean(sim)/mean(obs)
    both divide by the mean of the observations. Celsius has an ARBITRARY zero, so a winter day/night
    LST series straddling freezing has a mean near 0 and the denominator collapses: at this NCP pixel
    a +1.0 K mean bias produced PBIAS = -96.7% and KGE = -0.12 in Celsius versus PBIAS = +0.62% and KGE
    = +0.45 in Kelvin -- same series, same model. NSE and r are translation-invariant and are unaffected,
    which is the tell-tale signature. This is a measurement artifact, not model error: switching cultivar/forcing/parameters
    cannot fix it.; [''output'']'
  remedy: Score temperature on the ABSOLUTE scale (Kelvin) whenever a magnitude_accuracy metric (PBIAS/KGE)
    is required; read_modis_lst.py; ['Convert both obs and sim to Kelvin before calling ki_tools_common.metrics.all_metrics',
    'MOD11A2 LST is natively Kelvin (raw x 0.02) -- convert the MODEL to K rather than the observation
    to C', 'If a Celsius comparison is required anyway, report only NSE/r/RMSE and state that PBIAS/KGE
    are undefined near the zero crossing']; run_and_score.py scores the paired LST series in Kelvin; the
    meaningless Celsius PBIAS is not reported
  severity: silent
- id: dt_025
  symptom: Simulated diurnal LST amplitude is much smaller than an 8-day MODIS composite (e.g. 5 K modelled
    vs 13 K observed), day too cold and night too warm, while r stays high.
  diagnosis: 'The model was averaged over ALL days of the 8-day window, but MOD11A2 is a CLEAR-SKY-ONLY
    composite; MOD11A2 averages LST only over the days the pixel was cloud-free; the granule states how
    many in Clear_sky_days / Clear_sky_nights. Averaging the model over all 8 days mixes in cloudy days,
    whose diurnal amplitude is strongly damped, so the modelled day/night contrast is biased low by construction.
    A second, independent contributor at vegetated pixels: GEOtop Tsurface is the GROUND skin temperature
    beneath the canopy, whereas MODIS sees the effective radiometric temperature of the canopy+soil mixture
    -- with CanopyFraction>0 the ground term is damped relative to what the satellite observes.; [''output'',
    ''vegetation'', ''radiation'']'
  remedy: 'Match the model average to the granule''s own clear-day count, picking the clearest days of
    each window; read_modis_lst.py; [''Read Clear_sky_days / Clear_sky_nights from the granule (read_modis_lst.py
    emits clear_sky_count)'', ''Rank the days of the window: day = largest daily total Swglobal; night
    = lowest effective emissivity LWin/(sigma*Tair^4)'', ''Average the model only over the n_clear clearest
    days at the SAME overpass instant'', ''If an amplitude deficit survives clear-sky matching, suspect
    the canopy/soil radiometric mixing, not the clock (a clock error would also depress r -- see dt_021)''];
    read_modis_lst.py emits clear_sky_count; run_and_score.py pair() does clear-sky matching'
  severity: degraded
- id: dt_026
  symptom: 'Forcing is shifted by part of a step against the model: rain or the diurnal cycle arrives
    1-3 h (sub-daily) or a whole day (daily) early, while totals are right.'
  diagnosis: 'A record was not stamped at the END of the interval it covers; GEOtop uses a record stamped
    t for the interval (t-dt, t] (time_interp_constant, meteodata.cc:137-245). Sources stamp differently
    (checked 2026-10-19 at 36N 116E, Nov 2017, models/GEOtop/verify_forcing_bugs_20261019/): CMFD prec
    = mean over (t-3, t] (right); CMFD srad/lrad = centred on t; CMFD temp/pres/shum/wind = instant at
    t; MSWX P = [t, t+3) (strong: corr 0.964 with CMFD prec at t+3); MSWX Tair = [t, t+3) (WEAK: RMSE
    1.20 K vs 1.39 as an instant, mixed by hour); MSWX SWd = centred on t (checked 2026-10-20 against
    the sun at 6 points over all of 2017, stamp_check/swd_envelope.json: corr 0.91-0.98 centred vs 0.89-0.94
    [t, t+3); the clear-sky envelope leans least when centred; the best fit is about 0.5 h after t, so
    ''pair'' is ~0.5 h off); MSWX LWd, wind, humidity and pressure not checked (kept as [t, t+3)); NASA
    POWER hourly = [HH, HH+1) (only shortwave checked; T2M, wind and humidity are ASSUMED to follow it);
    every daily loader = day D stamped D 00:00. CMFD srad is NOT settled: the sun test (TOA) says centred
    (corr 0.914 vs 0.83 start, 0.73 end), but a review check against NASA POWER hourly fits interval end
    better; the two references disagree. CMFD lrad was never checked against data (it follows the manual).
    Left as is, MSWX is up to 3 h early, NASA POWER 1 h, CMFD state values 1.5 h, and daily records a
    whole day. The rule assumes GEOtop''s default LinearInterpolation = 0 (each record held over (t-dt,
    t], parameters.cc:2166, meteo.cc:54).; [''meteodata'', ''radiation'', ''energy.balance'', ''water.balance'']'
  remedy: 'Re-stamp each source to interval end before gridding; convert_forcing.py; [''load_forcing sources:
    stamp_rules + align_to_interval_end do it (end = keep; start = stamp t+step; pair = mean of the records
    at t-step and t)'', ''CSV: pass --csv-stamp end (means/totals over (t-step, t]), start (over [t, t+step))
    or instant (state values measured at t; rain = total since the row before). With end/start the state
    columns must be interval means, or they are used step/2 late'', ''Check: the first output hour with
    a rain pulse stamped t must lie in (t-step, t]'']; convert_forcing.py read_via_load_forcing re-stamps
    every source since 2026-10-19; tests/test_forcing_timing.py runs the binary'
  severity: silent
- id: dt_027
  symptom: A GEOtop KI result made before 2026-10-19 used forcing one day early and, at 3-hourly records,
    3x the rain (24x at daily records).
  diagnosis: 'convert_forcing.py before 2026-10-19 wrote JDfrom0 with +366 (dt_021), wrote the Iprec depth
    under HeaderIPrec (dt_004) and did not re-stamp sources to interval end (dt_026); Affected (DB test_runs):
    3909 (NCP, CMFD 3-hourly, NSE 0.601) and its 2026-10-19 re-run: 1 day early and rain 3x. 3578 (MOD11A2,
    hourly) and verify_1 (Jilin, NASA POWER hourly): 1 day early, rain amount right, hourly stamps start-labelled.
    721/1907 (Bengbu) and 789/1908 (Wangjiaba), written by auto_dissect validate_bengbu.py/validate_wangjiaba.py:
    daily records about 1.4 days early, rain amount right. 855/1906 (Matsch_B2 self-test): shipped meteo,
    itself one day off. Any --dt 86400 KI run between 2026-07-21 and 2026-10-19: 24x rain and 2 days early
    (none in test_runs). Evidence: models/GEOtop/verify_forcing_bugs_20261019/VERIFY.md.; [''meteodata'',
    ''water.balance'']'
  remedy: 'Re-make the meteo file with the fixed convert_forcing.py and re-run before quoting such a result;
    convert_forcing.py; [''Check an old meteo file: 01/11/2017 00:00 = 736999.0 means +366 (old)'', ''Treat
