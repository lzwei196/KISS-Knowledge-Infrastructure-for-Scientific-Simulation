schema_version: 1
model_id: DHSVM
domain: hydrology
generated_by: "Step-B validation-convention agent (Codex GPT-5)"
generated_at: 2026-08-14

# Grounded in locally fetched OA/manual texts listed in the DHSVM Step-B skeleton.
# Blocks are keyed by the model's own dag.yaml output names. Numeric bands cite
# fetched text only; uncited or only mechanism-level conventions remain null and
# low confidence.

