[project]
name = "kiss-ki"
version = "0.1.0"
description = "Installer and agent handoff for KISS Knowledge Infrastructure packages"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
license = { text = "MIT" }

[project.scripts]
kiss = "kiss_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kiss_cli"]

[tool.setuptools.package-data]
kiss_cli = ["web/*.html"]
