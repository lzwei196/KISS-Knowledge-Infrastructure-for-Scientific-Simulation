# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: SuperflexPy
  language: python
  implementation:
    id: superflexpy
    version: 1.3.2
    provenance: Python; SuperflexPy (Dal Molin / Fenicia / Kavetski, Eawag-WUR) component-based framework
      implementing the SUPERFLEX reservoir/lag/connector elements.
  scientific_reference_version: SUPERFLEX conceptual framework (Fenicia/Kavetski/Savenije 2011) as realized
    by SuperflexPy 1.3.x
inputs:
  forcing:
  - name: Precipitation (P)
    unit: mm/d
    category: meteorology
    source_kind: forcing
    model_input_format: numpy array of length n_timesteps passed via set_input(); flux order is element-specific
    notes: Total rainfall flux. Framework is unit-agnostic; mm/d is the operational convention. Input
      array order differs by entry element (GR4J InterceptionFilter expects [PET, P]; HBV UnsaturatedReservoir
      expects [P, PET]) — wrong order silently produces nonsense.
  - name: Potential evapotranspiration (PET)
    unit: mm/d
    category: meteorology
    source_kind: forcing
    model_input_format: numpy array of length n_timesteps via set_input()
    notes: Drives interception, production store, and unsaturated/upper-zone reservoir AET demand.
  - name: Temperature (T)
    unit: degC
    category: meteorology
    source_kind: forcing
    model_input_format: numpy array via set_input()
    notes: Consumed only by the Snow Reservoir element; required only when a snow module is present in
      the assembled structure.
  parameters:
  - name: x1 (GR4J production-store capacity)
    unit: mm
    category: production_store
    source_kind: calibrated
    model_input_format: hierarchically-prefixed parameter dict key (e.g. model_ps_x1)
    notes: Production store size; partitions precipitation between storage and percolation. Very high
      calibration sensitivity. KI documents conflicting defaults (SKILL table 50.0 vs tool/example 350.0).
  - name: x2 (GR4J groundwater exchange coefficient)
    unit: mm/d
    category: routing_store
    source_kind: calibrated
    model_input_format: prefixed parameter dict key
    notes: 'Exchange flux magnitude. SuperflexPy sign convention: positive x2 = EXPORT/loss from the catchment
      (losing stream), negative = import (gaining stream) — per gr4j.py docstring ''Exchange flux (F),
      positive if loss'' (CORRECTED 2026-08-22; this note previously taught the inverted sign).'
  - name: x3 (GR4J routing-store capacity)
    unit: mm
    category: routing_store
    source_kind: calibrated
    model_input_format: prefixed parameter dict key
    notes: Routing store size, controls baseflow depletion. KI default conflicts (table 20.0 vs tool 90.0).
  - name: x4 (GR4J unit-hydrograph base time)
    unit: d
    category: lag
    source_kind: calibrated
    model_input_format: prefixed parameter dict key
    notes: UH base time; controls peak timing. KI default conflicts (table 3.5 vs tool 1.7).
  - name: GR4J fixed shape exponents (alpha=2.0, beta=5.0, ni=4/9, gamma=5.0, omega=3.5)
    unit: '-'
    category: production_store
    source_kind: default
    model_input_format: hardcoded element defaults in gr4j.py flux equations
    notes: Canonical GR4J shape constants baked into the production-store, routing-store, and exchange
      flux equations; not normally calibrated.
  - name: HBV/HYMOD soil parameters (Smax, Ce, m, beta)
    unit: mm (Smax); - (Ce, m, beta)
    category: unsaturated_reservoir
    source_kind: calibrated
    model_input_format: prefixed parameter dict keys
    notes: Smax = storage capacity (high sensitivity), beta = runoff partitioning exponent (high sensitivity),
      Ce = ET correction, m = smoothing coefficient. Smax/beta may be derived from soil databases (HWSD)
      via pedotransfer.
  - name: Power/linear reservoir parameters (k, alpha)
    unit: 1/d (k); - (alpha)
    category: power_reservoir
    source_kind: calibrated
    model_input_format: prefixed parameter dict keys
    notes: k = recession rate coefficient, alpha = power-law outflow exponent (Q = k*S^alpha). KI default
      for k conflicts (table 0.01 vs tool/example 0.05).
  - name: Snow reservoir parameters (T0, m, k)
    unit: degC (T0); mm/degC/d (m); 1/d (k)
    category: snow
    source_kind: calibrated
    model_input_format: prefixed parameter dict keys
    notes: Temperature-threshold snowmelt; applicable only when a Snow Reservoir is in the structure.
  - name: Catchment area
    unit: km2
    category: geometry
    source_kind: dataset_lookup
    model_input_format: scalar float at Node setup
    notes: Used for Node/Network volumetric routing conversion (Q_m3s = Q_mm_d * area_km2 / 86.4); area
      in m2 instead of km2 breaks routing by ~1e6.
  initial_conditions:
  - name: Reservoir initial storage (S0)
    unit: mm
    category: reservoir_state
    source_kind: user_provided
    model_input_format: 'dict {''S0'': value} per reservoir element'
    notes: Typically 0-500 mm, often set ~0.5*Smax with a 1-2 yr warmup. Wrong units (m/cm) produce a
      long initial transient.
  - name: Lag-element initial state
    unit: convolution array
    category: lag_state
    source_kind: user_provided
    model_input_format: 'dict {''lag'': None} per LagElement'
    notes: MUST be None; the framework auto-sizes the lag-bin array from the lag-time parameter. A pre-allocated
      wrong-length array crashes the convolution.
  boundary_conditions:
  - name: HRU weights (Node)
    unit: fraction [0,1]
    category: structure
    source_kind: user_provided
    model_input_format: list of floats per Node, must sum to 1.0
    notes: Fractional weights of parallel Units. Framework does not enforce normalization; weights as
      percentages (0-100) scale output ~100x.
  - name: Network topology
    unit: '-'
    category: structure
    source_kind: user_provided
    model_input_format: node-to-downstream-node mapping (tree)
    notes: Must be an acyclic tree (each node at most one downstream, outlet downstream=None); a cycle
      hangs the topological solver.
  - name: ODE approximator choice
    unit: '-'
    category: numerical
    source_kind: user_provided
    model_input_format: approximator object (ImplicitEuler | ExplicitEuler | RungeKutta4)
    notes: Implicit Euler is the recommended/stable choice; Explicit Euler can produce negative storage
      and NaN for large timesteps.
  - name: Root finder choice
    unit: '-'
    category: numerical
    source_kind: user_provided
    model_input_format: root-finder object (Pegasus | Newton | Explicit)
    notes: Pegasus (bracketing) is the default robust choice. Root-finder architecture (python/numba)
      must match the approximator architecture, validated at construction.
  - name: Timestep (dt)
    unit: d
    category: numerical
    source_kind: user_provided
    model_input_format: set_timestep(dt) float in days
    notes: Must match the forcing temporal resolution (1.0 daily, 1/24 hourly); a mismatch silently corrupts
      storage dynamics.
outputs:
  primary:
  - name: Q_sim
    unit: mm/d
    description: Simulated total streamflow at the catchment / Unit outlet; model.get_output() returns
      a list of numpy arrays (one per output flux).
    validation_rank: 1
    emitted_in: model.get_output()
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compute metrics on the evaluation period only, after a 1-2 yr warmup.
        - Compare in consistent units; convert mm/d to m3/s via area only after matching the gauge support
          area.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-instant flow comparison is weak for a storage model; prefer the time series.
      detrending_options:
      - none
  - name: Network_Q
    unit: mm/d
    description: Per-node routed streamflow for a semi-distributed Network; network.get_output() returns
      a dict mapping node IDs to output arrays, enabling internal-location prediction.
    validation_rank: 2
    emitted_in: network.get_output()
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Each node maps to an interior gauge; routing area (km2) must be correct or fluxes scale by ~1e6.
      detrending_options:
      - none
  - name: AET
    unit: mm/d
    description: Actual water evapotranspiration flux from the production store / unsaturated reservoir;
      via get_aet()/get_AET().
    validation_rank: 3
    emitted_in: element.get_aet() / get_AET()
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Conceptual AET is a demand-limited bucket flux, not an energy-balance ET; expect structural
          bias against eddy-covariance ET.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Only meaningful when many Units/Nodes give spatial coverage; lumped runs cannot be compared
          as a field.
      detrending_options:
      - none
  - name: S
    unit: mm
    description: Reservoir water storage state trajectory over time per reservoir element; model.get_states().
    validation_rank: 4
    emitted_in: model.get_states()
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Conceptual storage is not directly observable; at best correlated with relative soil-moisture
          or piezometric dynamics (pattern, not magnitude).
      detrending_options:
      - none
  - name: F
    unit: mm/d
    description: 'GR4J groundwater exchange (loss/gain) flux F = (x2/x3^omega)*S^omega; positive x2 =
      EXPORT/loss from the catchment, negative = import (CORRECTED 2026-08-22, rank audit: superflexpy/implementation/elements/gr4j.py
      docstring ''Exchange flux (F), positive if loss'' and _flux_function_python emits -(x2*(S/x3)**omega);
      the flux is applied in both the routing store and the lag branch).'
    validation_rank: 5
    emitted_in: model.get_output() (GR4J routing store flux)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Exchange flux is rarely observed directly; usually only inferable through water-balance closure.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Simulated streamflow is 1000x larger than observed; reservoir storage grows unboundedly
  diagnosis: 'Precipitation supplied in meters/day instead of mm/day; SuperflexPy expects all fluxes in
    mm/d. If precipitation is in m/d (e.g., from ERA5 native units), the model receives 1000x too much
    water. All storage and flux calculations scale linearly with input, so Q_sim will be ~1000x too large.

    ; [''all '
  remedy: 'Multiply precipitation by 1000 to convert m/d to mm/d; convert_forcing.py --p-unit m/d; [''Check
    source data documentation for native units'', ''Apply conversion: P_mm = P_m * 1000'', ''Verify mean
    daily P is 1-15 mm/d for the region'']; Always use convert_forcing.py which validates magnitudes'
  severity: silent
- id: dt_002
  symptom: Model dries out quickly; actual ET far exceeds precipitation; storage drops to near-zero
  diagnosis: 'PET supplied in mm/month instead of mm/d; If monthly PET (typically 50-200 mm/month) is
    passed as mm/d, the model sees 50-200 mm/d of potential ET demand. This exceeds any realistic precipitation,
    causing storage to deplete rapidly and streamflow to drop to near zero.

    ; [''UnsaturatedReservoir'', ''Pro'
  remedy: 'Divide PET by 30.44 to convert mm/month to mm/d; convert_forcing.py --pet-unit mm/month; [''Check
    PET source: monthly totals vs daily values'', ''Apply: PET_daily = PET_monthly / days_in_month'',
    ''Verify PET is 0-10 mm/d'']; Validate PET < 15 mm/d before running model'
  severity: silent
- id: dt_003
  symptom: Water balance doesn't close; storage dynamics are too fast or too slow relative to forcing
  diagnosis: 'Timestep (dt) doesn''t match forcing temporal resolution; The ODE solver uses dt in the
    finite difference equation: dS/dt ≈ (S^{n+1} - S^n) / dt. If forcing is hourly but dt=1.0 (day), the
    solver treats each hourly value as a full day''s worth of input. This creates a 24x error in water
    volume per ste'
  remedy: 'Set model.set_timestep(dt) to match forcing resolution; ; [''For daily data: set_timestep(1.0)'',
    ''For hourly data: set_timestep(1.0/24.0)'', ''For sub-daily: dt = hours / 24.0'']; Include timestep
    metadata in forcing file and validate at load time'
  severity: silent
- id: dt_004
  symptom: Large initial transient spike or dip in first ~50 timesteps; model then stabilizes
  diagnosis: Initial storage state (S0) in wrong units (m or cm instead of mm); If S0 is set to 0.01 (thinking
    meters) instead of 10 (mm), the reservoir starts nearly empty and must fill up from precipitation,
    causing an artificial initial transient. The model eventually equilibrates but the warmup period may
    be
  remedy: Ensure S0 is in mm; typical values are 0-500 mm; ; ['Set S0 relative to storage capacity (e.g.,
    S0 = 0.5 * Smax)', 'Run sufficient warmup period (1-2 years)', 'Exclude warmup from metric calculation'];
    Validate S0 is same order of magnitude as Smax
  severity: silent
- id: dt_005
  symptom: Model runs but produces physically implausible Q; hydrograph shape bears no relation to forcing
  diagnosis: Input array order is swapped (P and PET positions exchanged); SuperflexPy elements have different
    input order conventions. InterceptionFilter (GR4J) expects [PET, P] but UnsaturatedReservoir (HBV)
    expects [P, PET]. If swapped, precipitation is treated as ET demand and vice versa, producing nonsensic
  remedy: 'Check the first element''s set_input() docstring for correct order; ; [''GR4J: model.set_input([PET,
    P])'', ''HBV:  model.set_input([P, PET])'', "Always verify via model''s first layer element documentation"];
    Add explicit input order to model config; verify with a 1-timestep test'
  severity: silent
- id: dt_006
  symptom: KeyError when calling set_parameters() or parameter changes have no effect
  diagnosis: 'Parameter name doesn''t include hierarchical prefix; SuperflexPy automatically prefixes
    parameter names through the hierarchy: unit_id + ''_'' + element_id + ''_'' + param_name. Calling
    set_parameters({''x1'': 300}) fails because the actual key is ''model_ps_x1''. Without the prefix,
    set_parameters silently '
  remedy: 'Use model.get_parameters_name() to discover full prefixed names; ; [''names = model.get_parameters_name()'',
    "print(names)  # Shows [''model_ps_x1'', ...]", "model.set_parameters({''model_ps_x1'': 300.0})"];
    Always discover names before setting; build parameter dict programmatically'
  severity: fatal
- id: dt_007
  symptom: Crash during model.get_output() with array length or shape mismatch in lag function
  diagnosis: 'LagElement state initialized with array instead of None; UnitHydrograph1/2 states must be
    initialized as {''lag'': None}. The framework dynamically creates the lag array based on the lag-time
    parameter and the number of input fluxes. Pre-allocating an array of wrong size causes broadcast errors
    when t'
  remedy: 'Set states={''lag'': None} when creating lag elements; ; ["uh1 = UnitHydrograph1(parameters={''lag-time'':
    2.0}, states={''lag'': None}, id=''uh1'')", ''After reset, re-set lag states to None if needed''];
    Never manually set lag state arrays'
  severity: fatal
- id: dt_008
  symptom: IndexError or wrong flux routing in models with Splitter elements
  diagnosis: Splitter weight or direction matrix dimensions don't match element topology; The Splitter's
    weight matrix shape must be [n_downstream][n_upstream_fluxes] and direction must be [n_downstream][n_upstream_fluxes].
    If the upstream element produces 1 flux but weight has 2 columns, or if there are 2 downs
  remedy: 'Verify matrix dimensions match the number of upstream fluxes and downstream elements; ; [''Count
    upstream fluxes: n_up = len(upstream_element.get_output())'', ''Count downstream elements in the next
    layer'', ''weight shape: [n_downstream][n_up]'', ''direction shape: [n_downstream][n_up]'']; Test
    with a 1-ti'
  severity: fatal
- id: dt_009
  symptom: First model run takes 5-30 seconds; subsequent runs are fast
  diagnosis: Numba JIT compilation triggered on first call; When using Numba-accelerated solvers (ImplicitEulerNumba,
    PegasusNumba), the first invocation triggers just-in-time compilation of the decorated functions.
    This is a one-time cost per Python session. The delay is proportional to the number of JIT-compil
  remedy: Wait for compilation to complete; this is normal behavior; ; ['Run a short warmup simulation
    first to trigger compilation', 'Or use Python variants (ImplicitEulerPython) for quick tests', 'Numba
    compilation caches persist across runs in __pycache__']; Use Python variants during development; Numba
    fo
  severity: degraded
- id: dt_010
  symptom: Negative storage values; streamflow oscillates or diverges; NaN in output
  diagnosis: Explicit Euler solver produces negative storage for large timesteps or fluxes; The Explicit
    Euler method S^{n+1} = S^n + dt * f(S^n) can produce negative S when outflow exceeds storage within
    one timestep. This causes NaN when computing S^alpha (negative base, fractional exponent). The implicit
    Eule
  remedy: Switch to ImplicitEuler solver with Pegasus root finder; ; ['Replace ExplicitEulerPython with
    ImplicitEulerPython', 'Add root_finder=PegasusPython() to ImplicitEuler', 'Or reduce timestep (dt)
    to improve explicit stability']; Default to ImplicitEuler for production; ExplicitEuler only for debugging
  severity: fatal
- id: dt_011
  symptom: Model hangs indefinitely during get_output(); infinite loop in network solver
  diagnosis: 'Network topology contains a cycle; The Network class solves nodes from headwater to outlet
    using topological ordering. If the topology dict creates a cycle (A→B→C→A), the solver never terminates
    because it always finds unsolved upstream nodes.

    ; [''Network'']'
  remedy: 'Fix topology to be a tree (DAG): each node has at most one downstream, no cycles; ; ["Draw
    the network on paper; verify it''s a tree", ''Check topology dict: no node should appear as both upstream
    and downstream of another'', ''Outlet node must have None as downstream'']; Validate topology for
    cycles bef'
  severity: silent
- id: dt_012
  symptom: Node output is systematically too high or too low; doesn't match individual unit runs
  diagnosis: 'Node unit weights don''t sum to 1.0; A Node combines parallel Unit outputs with fractional
    weights. If weights sum to 0.8 instead of 1.0, 20% of the catchment is unaccounted for. If they sum
    to 1.5, output is amplified by 50%. The framework does not enforce normalization.

    ; [''Node'']'
  remedy: 'Ensure weights sum to 1.0; normalize if derived from area fractions; ; [''weights = [0.3, 0.5,
    0.2]  # Must sum to 1.0'', ''Or: weights = [w / sum(weights) for w in raw_weights]'']; Assert sum(weights)
    ≈ 1.0 before Node construction'
  severity: silent
- id: dt_013
  symptom: Network routing produces fluxes that are 1e6 too large or too small
  diagnosis: 'Node area specified in m² instead of km²; The Node''s area parameter is used in network
    routing to convert between specific discharge (mm/d) and volumetric flow (m³/s). If area is 1.5e8
    m² instead of 150 km², routing calculations are wrong by a factor of 1e6.

    ; [''Node'', ''Network'']'
  remedy: 'Express area in km²; ; [''Convert: area_km2 = area_m2 / 1e6'', "Node(units=[...], weights=[...],
    area=150.0, id=''node1'')"]; Validate area is in range 0.01-1e6 km²'
  severity: silent
- id: dt_014
  symptom: Node output is ~100x too large; sum of weighted unit outputs clearly wrong
  diagnosis: 'Node weights specified as percentages (0-100) instead of fractions (0-1); If weights are
    [30, 50, 20] (percentages) instead of [0.3, 0.5, 0.2] (fractions), the weighted sum is 100x too large.
    The framework treats weights as multipliers without validation.

    ; [''Node'']'
  remedy: 'Divide weights by 100 to convert from percentages to fractions; ; [''weights = [w / 100 for
    w in percentage_weights]'', ''Verify: sum(weights) = 1.0'']; Validate 0 < weight < 1 and sum ≈ 1.0'
  severity: silent
- id: dt_015
  symptom: Implicit solver warning about non-convergence; output has subtle errors
  diagnosis: Pegasus root finder fails to converge for extreme parameter combinations; The implicit Euler
    scheme requires finding S^{n+1} such that S^{n+1} - S^n - dt*f(S^{n+1}) = 0. For very large k or alpha
    values, the root function becomes extremely steep, and the Pegasus bracketing algorithm may not converge
  remedy: Reduce timestep, check parameter ranges, or increase root finder iterations; ; ['Check k * S^alpha
    is not producing huge values', 'Reduce dt to improve solver conditioning', 'Try Runge-Kutta 4 as alternative'];
    Validate parameters are within documented ranges before running
  severity: degraded
- id: dt_016
  symptom: IndexError during model solve; array length mismatch
  diagnosis: 'Time-varying parameter array length doesn''t match number of timesteps; SuperflexPy supports
    time-varying parameters as numpy arrays. If a parameter array has 100 elements but forcing has 365
    timesteps, the solver crashes when accessing parameter[ind] for ind >= 100.

    ; [''all ParameterizedElement subc'
  remedy: Ensure time-varying parameter arrays match forcing length; ; ['param_array = np.full(n_timesteps,
    param_value)', 'Or use scalar value for constant parameters']; Validate array lengths match before
    model.set_input()
  severity: fatal
- id: dt_017
  symptom: Import error or compilation failure when using Numba solvers
  diagnosis: 'Numba version incompatible with numpy version; SuperflexPy requires numba==0.57.1 and numpy==1.24.3.
    Newer numpy versions may change the C-level array API that Numba depends on, causing TypingError or
    compilation failures in JIT-decorated functions.

    ; [''all Numba variants'']'
  remedy: 'Install pinned dependency versions: pip install numpy==1.24.3 numba==0.57.1; ; [''pip install
    numpy==1.24.3 numba==0.57.1'', ''Or use Python-only solvers as fallback'']; Use requirements.txt with
    pinned versions; test in clean venv'
  severity: fatal
- id: dt_018
  symptom: GR4J exchange flux (F) has wrong sign; water balance doesn't close for networks
  diagnosis: 'x2 sign convention inverted: in SuperflexPy, positive x2 = groundwater LOSS; CORRECTED 2026-08-21
    against the source. This entry previously asserted the opposite and would have made an agent read
    every calibrated x2 backwards. Read the code, not the convention you remember: superflexpy/implementatio'
  remedy: 'Check x2 sign: positive = EXPORT (loss), negative = IMPORT (gain); run_superflexpy.py --diagnostics   #
    emits the F series and the exchange total; [''For gaining streams: x2 < 0 (typical: -5.0 to -0.1)'',
    ''For losing streams: x2 > 0 (typical: 0.1-3.0)'', ''For neutral: x2 ~ 0'', ''Verify with diagnostics.'
  severity: silent
- id: dt_019
  symptom: Calibration converges to nonsense, or the same parameter vector scores differently on repeat
    evaluation; the optimiser's best score cannot be reproduced by re-running with its best parameters
  diagnosis: get_output() called repeatedly without model.reset_states() in between; SuperflexPy components
    CARRY STATE FORWARD. Each get_output() call leaves reservoir storage at the last timestep's value
    and leaves the LagElement convolution memory partially filled, and the next call starts from there.
    In a ca
  remedy: 'Call model.reset_states() before EVERY get_output() in any loop; run_superflexpy.py --calibrate   #
    its run_once() already does this; [''Do not hand-roll the calibration loop; use run_superflexpy.py
    --calibrate'', ''If you must loop manually, follow examples/02_calibrate_a_model.ipynb exactly'',
    ''Self-c'
  severity: silent
- id: dt_020
  symptom: Model cannot reach the observed runoff volume however it is calibrated; PBIAS stuck strongly
    negative and NSE plateaus, while the internal water balance closes perfectly
  diagnosis: Reanalysis potential-evaporation product far exceeds the PET demand a conceptual structure
    is calibrated against; Caravan / ERA5-Land potential_evaporation_sum is a well-watered-surface potential
    and in humid maritime catchments it exceeds precipitation. GR4J's InterceptionFilter removes min(P,
    PET)
  remedy: 'Calibrate a PET correction coefficient alongside the structural parameters; run_superflexpy.py
    --calibrate --free-params x1 x3 x4 x2 cpet; [''GR4J has no internal PET coefficient: add cpet to --free-params
    (bounds 0.2-2.0)'', ''HBV already has one: put Ce in --free-params instead; do NOT also use cpet'''
  severity: silent
- id: dt_021
  symptom: A handful of days show precipitation the forcing file does not contain; the conservation check
    is off by a few mm
  diagnosis: Negative daily PET values from a reanalysis product passed through unfiltered; Reanalysis
    daily potential evaporation goes slightly negative on condensation days (34 of 4383 days across the
    Irish Caravan gauges, minimum -0.45 mm/d). GR4J's InterceptionFilter computes remove = min(PET, P)
    and returns
  remedy: Floor PET at zero when converting the forcing; convert_forcing.py --pet-min 0; ['Always pass
    --pet-min 0 for ERA5 / ERA5-Land / Caravan / MSWX PET', 'Check conversions_applied.PET_floor in the
    forcing JSON for how many days were clipped', 'An ALL-negative PET series is a different bug -- the
    sign wa
  severity: silent
