  severity: fatal
- id: dt_015
  symptom: Velocities qualitatively wrong (pattern correct but magnitude off). Missing vertical shear
    effects.
  diagnosis: Wrong flow equation for the domain type (e.g., SSA for slow grounded interior); SSA (Shallow
    Shelf Approximation) neglects vertical shear — it works for ice shelves and fast ice streams but underestimates
    velocity in slow grounded regions where internal deformation (vertical shear) dominates. SIA ca
  remedy: 'Use SIA for slow grounded ice, SSA for fast streams/shelves, HO/FS for complex regions; None;
    [''For ice shelves: use SSA'', ''For grounded interiors: use SIA or HO'', ''For transition zones:
    use HO or FS'', ''When in doubt: start with SSA, compare to observations'']; Compare simulated vs
    observed velocity '
  severity: degraded
- id: dt_016
  symptom: 'Error: PETSc library not found. Or: issm binary crashes with shared library error.'
  diagnosis: 'PETSc not installed or not in LD_LIBRARY_PATH; ISSM''s C++ solver requires PETSc for all
    matrix operations. If PETSc is not compiled or its libraries are not in the linker path, the issm
    binary cannot start. This is the most common build-related failure.

    ; [''issm_binary'', ''petsc'', ''environment'']'
  remedy: 'Install PETSc and source ISSM environment script; None; [''cd externalpackages/petsc && ./install-3.22-linux64.sh'',
    ''source etc/environment.sh'', ''Verify: ldd bin/issm | grep petsc'']; Always source etc/environment.sh
    before running ISSM'
  severity: fatal
- id: dt_017
  symptom: Transient simulation produces oscillating or exploding thickness. Results diverge after few
    timesteps.
  diagnosis: 'Time step too large — violates CFL condition for mass transport; The mass transport equation
    has a CFL stability condition: dt < dx / max(vel). For fast-flowing glaciers (vel ~ 10 km/yr) with
    fine mesh (dx ~ 5 km), dt must be < 0.5 yr. Using dt = 1 yr or larger produces numerical oscillations
    that g'
  remedy: 'Reduce time step: dt < min(dx) / max(vel); None; [''Estimate CFL: dt_max = min_element_size
    / max_velocity'', ''Set md.timestepping.time_step = 0.5 * dt_max for safety margin'', ''Typical values:
    0.01-1.0 years depending on mesh and velocity'']; Start with small dt and increase gradually'
