safety:
  hazards:
    - id: "unsolvable_hydraulics_error110"
      kind: "numerical_instability"
      description: "Disconnected network, no fixed-grade node (reservoir/tank), or zero-diameter pipe creates a singular hydraulic matrix (Error 110)."
      severity: "fatal"
    - id: "dda_negative_pressures"
      kind: "control_semantic"
      description: "Demand-driven analysis forces full demand regardless of pressure; insufficient supply yields physically impossible negative pressures."
      severity: "degraded"
    - id: "diameter_unit_mismatch"
      kind: "soil_semantic"
      description: "Pipe diameters in mm under a US-unit model (or vice versa) yield unrealistic head losses; pipes use in (US) / mm (SI), tanks use ft (US) / m (SI)."
      severity: "silent"
    - id: "elevation_unit_mismatch"
      kind: "soil_semantic"
      description: "Elevations in the wrong length unit shift every node pressure by the ~3.28x ft/m factor since head = elevation + pressure/gamma."
      severity: "silent"
    - id: "roughness_formula_mismatch"
      kind: "coefficient_runtime_silent_fallback"
      description: "Roughness entered on the wrong scale for the selected head-loss formula (D-W height vs H-W C-factor vs C-M n) produces silently wrong head losses; no internal roughness-vs-formula validation."
      severity: "silent"
    - id: "tank_init_out_of_range"
      kind: "initial_condition_semantic"
      description: "Tank initial level outside MinLevel/MaxLevel, or tank diameter in wrong units (near-zero volume), causes immediate overflow/empty at simulation start."
      severity: "degraded"
    - id: "pump_xhead_xflow"
      kind: "control_semantic"
      description: "Mis-specified or out-of-range pump curve yields XHEAD (insufficient head) or XFLOW (flow above rated max) and no delivered flow."
      severity: "degraded"
    - id: "quality_stays_zero"
      kind: "control_semantic"
      description: "Constituent stays zero everywhere when quality analysis is not enabled, initial quality is zero, or no source is defined; single-period (Duration=0) runs silently force Quality to NONE."
      severity: "silent"
    - id: "wrong_reaction_sign"
      kind: "coefficient_runtime_silent_fallback"
      description: "Bulk/wall reaction coefficient with the wrong sign grows the constituent instead of decaying it (negative = decay, positive = growth)."
      severity: "silent"
    - id: "wall_reaction_unit_error"
      kind: "coefficient_runtime_silent_fallback"
      description: "First-order wall reaction coefficient in the wrong unit system (ft/day US vs m/day SI) offsets wall decay by the ft/m factor."
      severity: "silent"
    - id: "concen_source_no_inflow"
      kind: "control_semantic"
      description: "A CONCEN source only sets concentration of external inflow at a node; with no external inflow it has no downstream effect (use SETPOINT or FLOWPACED)."
      severity: "silent"
    - id: "pattern_timestep_mismatch"
      kind: "control_semantic"
      description: "Pattern Timestep not equal to Duration/n_multipliers, or a missing pattern ID, leaves demand effectively constant."
      severity: "silent"
    - id: "control_oscillation"
      kind: "numerical_instability"
      description: "Simple controls without hysteresis toggle a pump/valve open/closed every timestep (oscillation); mitigated by hysteresis, DAMPLIMIT, or rules."
      severity: "degraded"
    - id: "flow_unit_mismatch"
      kind: "control_semantic"
      description: "Demand magnitudes in a flow unit inconsistent with [OPTIONS] Units (e.g., LPS data under a GPM model) are off by the unit-conversion factor (1 LPS = 15.85 GPM)."
      severity: "silent"
    - id: "binary_out_parse_error"
      kind: "parser_semantic"
      description: "The 4-byte-aligned binary .out file mis-parses on wrong offset, endianness, or truncation; validity is bracketed by magic number 516114521 at start and end."
      severity: "fatal_or_silent"
  validation_limits:
    - "No open-channel/free-surface, rainfall-runoff, or groundwater representation; pressurized pipe networks only."
    - "No hydraulic transient / water-hammer (surge) analysis."
    - "No longitudinal dispersion in pipes; advective transport with complete instantaneous junction mixing only."
    - "Reservoirs are infinite source/sinks; their head and quality are unaffected by the network."
    - "Requires at least one fixed-grade node (reservoir or tank) as a hydraulic boundary."
  warnings:
    - "Quality timestep must be <= hydraulic timestep (default Hstep/10); a quality step longer than the hydraulic step is invalid."
    - "The actual hydraulic step is event-limited: tank fill/empty, control activation, and rule firing can shorten it below the nominal Hstep, coupling results to time discretization."
    - "Convergence path depends on iteration count (CHECKFREQ/MAXCHECK status checks), so results can shift if those controls change even with the same network."
    - "Status checks during the GGA loop change link status mid-iteration; non-convergence (UNBALANCED) at a timestep produces a warning exit code (1-99) but results may still be usable."
    - "By default EPANET reports no node/link results unless [REPORT] specifies Nodes/Links and a Report Timestep."
  assumptions:
    - statement: "Hydraulics are solved as a coupled mass + energy balance via Todini's Global Gradient Algorithm (Newton-Raphson with sparse Cholesky and minimum-degree reordering)."
      scope: "all hydraulic solves"
      source: "EPANET 2.2 manual, Analysis Algorithms — Hydraulics (usepa.github.io/EPANET2.2/12_analysis_algorithms.html)"
      status: "adopted"
    - statement: "Water-quality transport is advective with complete instantaneous mixing at junctions and no longitudinal dispersion in pipes (Lagrangian time-based segment transport)."
      scope: "chemical, age, and trace analyses"
      source: "EPANET 2.2 manual, Analysis Algorithms — Water Quality"
      status: "adopted"
    - statement: "The spatial grain is the user-defined network graph; the model is point-network, not gridded or 1-D water body, and is parameter/topology-driven, not weather-forced."
      scope: "model geometry and inputs"
      source: "EPANET 2.2 manual, Network Model — Physical Components"
      status: "adopted"
    - statement: "Flow-unit selection cascades to fix the unit system of all other inputs and outputs; US vs SI is determined solely by the chosen flow unit."
      scope: "all dimensional inputs/outputs"
      source: "EPANET 2.2 manual, Units of Measurement (back_matter.html); input1.c initunits/convertunits"
      status: "adopted"
    - statement: "Mass-balance closure covers water (flow continuity) and, when quality is active, constituent mass; the energy-balance closure is mechanical/hydraulic head-loss energy only — there is no surface-energy or thermal closure."
      scope: "conservation properties"
      source: "EPANET 2.2 manual, Network Model — Computational Methods; quality MassBalance accounting in source"
      status: "adopted"
