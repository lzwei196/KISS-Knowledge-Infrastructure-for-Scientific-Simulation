  - id: dt_v010
    stage: "s4_fulldom"
    failure_domain: "parameter_format"
    symptom:
      description: "CHANNELGRID built with 0/1 encoding (0=non-channel, 1=channel) but WRF-Hydro expects -9999/0 (-9999=non-channel, 0=channel). Channels not recognized, discharge=0."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "build_fulldom_hires.py originally used 0/1 binary encoding for CHANNELGRID, but WRF-Hydro convention is 0=channel and -9999=non-channel."
      explanation: >
        WRF-Hydro's routing module checks CHANNELGRID==0 to identify channel cells. With the
        original 0/1 encoding: non-channel cells had value 0 (treated as channels) and actual
        channel cells had value 1 (ignored). This is a silent error — the model runs but
        routing topology is completely wrong. The fix is channel=0, non-channel=-9999.
      affected_components:
        - "Fulldom_hires.nc CHANNELGRID"
        - "build_fulldom_hires.py"
    remedy:
      action: "Use WRF-Hydro CHANNELGRID convention: channel=0, non-channel=-9999"
      tool_to_run: "build_fulldom_hires"
      manual_steps:
        - "In Fulldom_hires.nc: CHANNELGRID[is_channel] = 0, CHANNELGRID[not_channel] = -9999"
      prevention: "build_fulldom_hires.py now uses correct -9999/0 encoding"
    severity: "silent"
    cross_references: ["dt_001", "dt_v007"]
    verified: "2026-03-20"

  - id: dt_v011
    stage: "s8_forcing"
    failure_domain: "unit_conversion"
    symptom:
      description: "CMFD precip units documentation misleading — raw CMFD is kg/m2/s (rate), but VIC pipeline multiplies by 10800 to get mm/3hr, creating false impression that CMFD native units are mm/3hr."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "CMFD precipitation is an instantaneous rate in kg/m2/s. The VIC forcing pipeline multiplies by 10800 to produce mm/3hr accumulation. When converting VIC forcing to WRF-Hydro LDASIN, the mm/3hr must be divided back by 10800 to get mm/s for RAINRATE."
      explanation: >
        Unit chain: CMFD (kg/m2/s) x 10800 -> VIC (mm/3hr) / 10800 -> LDASIN (mm/s).
        If one skips the second division, RAINRATE is 10800x too high. The cmfd_to_ldasin.py
        tool avoids this confusion by reading CMFD rate directly.
      affected_components:
        - "convert_forcing_to_ldasin.py"
        - "cmfd_to_ldasin.py"
        - "LDASIN RAINRATE"
    remedy:
      action: "Divide VIC mm/3hr by 10800 for RAINRATE. Or use cmfd_to_ldasin.py for direct conversion."
      tool_to_run: "convert_forcing_to_ldasin"
      manual_steps:
        - "Verify: RAINRATE < 0.01 mm/s for normal conditions"
        - "If RAINRATE > 0.1 everywhere, the /10800 division was missed"
      prevention: "Both forcing converters handle the division correctly"
    severity: "silent"
    cross_references: ["dt_011"]
    verified: "2026-03-20"

  - id: dt_v012
    stage: "s2_geo_em"
