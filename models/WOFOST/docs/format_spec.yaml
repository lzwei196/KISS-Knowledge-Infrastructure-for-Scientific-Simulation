# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: WOFOST
  language: python
  implementation:
    id: pcse-wofost72
    version: PCSE 6.0.12 / WOFOST 7.2
    provenance: Python; PCSE (Allard de Wit / WUR) wraps WOFOST 7.2 numerics; engine classes Wofost72_PP
      / Wofost72_WLP_FD / Wofost72_WLP_CWB.
  scientific_reference_version: WOFOST 7.2 (Wageningen / WUR, PCSE 6.0 lineage)
inputs:
  forcing:
  - name: IRRAD
    unit: J m-2 day-1
    category: forcing
    source_kind: forcing
    model_input_format: Daily global shortwave radiation; engine-internal unit is Joules (not kJ or MJ)
    notes: Spring/summer values typically 1e7-3.5e7 J m-2 d-1; winter 2e6-8e6. IRRAD drives photosynthesis
      through the Spitters 3-point Gauss integration; an order-of-magnitude unit error silently zeroes
      yield.
  - name: TMIN
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: Daily minimum air temperature
  - name: TMAX
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: Daily maximum air temperature; TMIN <= TMAX required every day
  - name: VAP
    unit: hPa
    category: forcing
    source_kind: forcing
    model_input_format: Mean daily vapour pressure (engine-internal hPa)
  - name: WIND
    unit: m s-1
    category: forcing
    source_kind: forcing
    model_input_format: Mean daily wind speed at 2 m height
  - name: RAIN
    unit: cm day-1
    category: forcing
    source_kind: forcing
    model_input_format: Daily precipitation, engine-internal unit cm/day (consumed by WaterbalanceFD)
  - name: SNOWDEPTH
    unit: cm
    category: forcing
    source_kind: forcing
    model_input_format: Optional daily snow cover depth; required (non-NaN) under PCSE 6.0 when frost-damage
      / SnowMAUS path is active; otherwise set to 0.0
  - name: CO2
    unit: ppm
    category: forcing
    source_kind: forcing
    model_input_format: Atmospheric CO2 concentration; in PCSE 6.0 WOFOST 7.2 path it is handled via crop
      CO2 tables rather than as a site parameter, but it is a time-varying atmospheric driver of the assimilation
      submodel
    notes: Acts on AMAX and on the CO2 factor in assimilation; only the CO2-aware assimilation path consumes
      it explicitly.
  parameters:
  - name: TSUM1
    unit: degC d
    category: parameter
    source_kind: calibrated
    model_input_format: Crop YAML parameter (TSUM1); thermal time emergence -> anthesis
  - name: TSUM2
    unit: degC d
    category: parameter
    source_kind: calibrated
    model_input_format: Crop YAML parameter (TSUM2); thermal time anthesis -> maturity
  - name: TBASEM
    unit: degC
    category: parameter
    source_kind: calibrated
    model_input_format: Base temperature for emergence thermal-time accumulation
  - name: TDWI
    unit: kg ha-1
    category: parameter
    source_kind: calibrated
    model_input_format: Initial total dry-matter weight at emergence; partitioned into TWLV/TWST/TWRT
      at init within 1e-4 tolerance
  - name: SPAN
    unit: d
    category: parameter
    source_kind: calibrated
    model_input_format: Maximum leaf lifespan at 35 degC; controls leaf-cohort senescence in WOFOST_Leaf_Dynamics
  - name: AMAXTB
    unit: kg CH2O ha-1 hr-1 vs DVS
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; maximum leaf gross assimilation rate as a function of DVS
  - name: EFFTB
    unit: kg CH2O J-1 vs degC
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; light-use efficiency of single leaves vs temperature
  - name: SLATB
    unit: ha kg-1 vs DVS
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; specific leaf area vs DVS; multiplies leaf biomass to give LAI
  - name: KDIFTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; extinction coefficient for diffuse PAR
  - name: FRTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN table; fraction of total dry matter partitioned to roots
  - name: FLTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN above-ground partitioning fraction to leaves; FRTB+(FLTB+FSTB+FOTB)(1-FRTB)=1
      within 1e-4
  - name: FSTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN above-ground partitioning fraction to stems
  - name: FOTB
    unit: '- vs DVS'
    category: parameter
    source_kind: calibrated
    model_input_format: AFGEN above-ground partitioning fraction to storage organs
  - name: CVO
    unit: kg DM kg-1 CH2O
    category: parameter
    source_kind: calibrated
    model_input_format: Conversion efficiency assimilates -> storage organ dry matter
  - name: Q10
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: Temperature sensitivity of maintenance respiration; TEFF = Q10**((TEMP-25)/10)
  - name: VERNSAT
    unit: d
    category: parameter
    source_kind: calibrated
    model_input_format: Cold-day requirement for full vernalisation; only active when IDSL>=2
  - name: VERNBASE
    unit: degC
    category: parameter
    source_kind: calibrated
    model_input_format: Base temperature for vernalisation accumulation
  - name: VERNDVS
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: Safety-cutoff DVS at which vernalisation is force-completed even if VERNSAT not
      reached
  - name: RDMSOL
    unit: cm
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Maximum rootable soil depth; soil-side cap on rooting
  - name: RDMCR
    unit: cm
    category: parameter
    source_kind: calibrated
    model_input_format: Maximum crop rooting depth; effective RDM = min(RDMSOL, RDMCR)
  - name: SMW
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Wilting point (pF 4.2)
  - name: SMFCF
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Field capacity (pF 2.0); ordering constraint SMW < SMFCF < SM0
  - name: SM0
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Soil porosity / saturation moisture; SM0 <= 0.65
  - name: CRAIRC
    unit: cm3 cm-3
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Critical air content for oxygen stress; CRAIRC < SM0 - SMFCF
  - name: K0
    unit: cm d-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Saturated hydraulic conductivity
  - name: SOPE
    unit: cm d-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Maximum percolation rate root zone
  - name: KSUB
    unit: cm d-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: Maximum percolation rate subsoil
  - name: DEPNR
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: Crop group number for SWEAF easily-available-water curve in evapotranspiration
  initial_conditions:
  - name: WAV
    unit: cm
    category: initial_condition
    source_kind: user_provided
    model_input_format: Initial available soil water in the profile; >= 0
  - name: SSI
    unit: cm
    category: initial_condition
    source_kind: user_provided
    model_input_format: Initial surface storage
  - name: SMLIM
    unit: cm3 cm-3
    category: initial_condition
    source_kind: user_provided
    model_input_format: Maximum initial topsoil moisture for water-balance initialization
  - name: DVS_initial
    unit: '-'
    category: initial_condition
    source_kind: default
    model_input_format: Hardcoded -0.1 at sowing (CROP_START_TYPE='sowing') so pre-emergence DVR = 0.1*DTSUME/TSUMEM
      advances to 0 at emergence
  boundary_conditions:
  - name: production_level
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Selector between Wofost72_PP (potential), Wofost72_WLP_FD (water-limited, free
      drainage), and Wofost72_WLP_CWB (water-limited, classic water balance with groundwater); choice
      activates / bypasses the soil water balance and changes which soil parameters are required
    notes: Misusing PP where WLP is intended silently inflates yields 2-5x; the choice is a model-form
      switch, not a parameter.
  - name: crop_start_type
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Enum 'sowing' | 'emergence'; controls whether the pre-emergence thermal-time submodel
      (TSUMEM) is exercised
  - name: crop_end_type
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Enum 'maturity' | 'harvest' | 'earliest'; controls termination criterion
  - name: crop_start_date
    unit: date
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Sowing or emergence date in agromanagement YAML; campaign_start_date <= crop_start_date
  - name: max_duration
    unit: d
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Maximum number of days the campaign is allowed to run; truncates silently if reached
      before DVS=2
  - name: irrigation_events
    unit: cm event-1
    category: boundary_condition
    source_kind: user_provided
    model_input_format: 'TimedEvents ''irrigate'' in agromanagement YAML; events_table of {date: {amount:
      cm, efficiency: 0-1}}; consumed by WaterbalanceFD via AgroManager signal'
  - name: IFUNRN
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Infiltration flag (0 = no runoff, 1 = USDA curve-number reduction via NINFTB)
  - name: NOTINF
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Fraction of rainfall that does not infiltrate when IFUNRN=0
  - name: SSMAX
    unit: cm
    category: boundary_condition
    source_kind: user_provided
    model_input_format: Maximum surface storage
outputs:
  primary:
  - name: DVS
    unit: '-'
    description: Crop development stage (0=emergence, 1=anthesis, 2=maturity)
    validation_rank: 4
    emitted_in: daily _saved_output (OUTPUT_VARS)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - DVS itself is rarely observed; comparison is usually via derived phenology dates (DOE/DOA/DOM)
          below
      detrending_options:
      - none
  - name: DOA
    unit: date
    description: Crop day of anthesis (summary)
    validation_rank: 5
    emitted_in: _saved_summary_output (SUMMARY_OUTPUT_VARS)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Best compared as DOY bias against observed heading/anthesis dates; weather quality dominates
          skill
      detrending_options:
      - none
  - name: DOM
    unit: date
    description: Crop day of maturity (summary)
    validation_rank: 6
    emitted_in: _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Sensitive to TSUM2 and to whether the campaign max_duration truncated the run before DVS=2
      detrending_options:
      - none
  - name: LAI
    unit: m2 m-2
    description: Crop canopy leaf area index
    validation_rank: 2
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Compare to ground LAI campaigns or satellite-retrieved LAI at the point; rise/peak/decline shape
          is the primary signal
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Requires running the point model on a grid; satellite LAI products have their own retrieval
          errors
      detrending_options:
      - none
  - name: LAIMAX
    unit: m2 m-2
    description: Maximum LAI over the season (summary)
    validation_rank: 7
    emitted_in: _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - LAIMAX > 15 indicates SLATB error rather than skill
      detrending_options:
      - none
  - name: TAGP
    unit: kg ha-1
    description: Total above-ground crop biomass dry-matter production
    validation_rank: 8
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Best compared at sampled harvest dates within the season; daily values rarely observed
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Field-level end-of-season biomass weighings
      detrending_options:
      - none
  - name: TWSO
    unit: kg ha-1
    description: Total crop storage-organ biomass (harvestable yield)
    validation_rank: 1
    emitted_in: daily _saved_output and _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Field-trial yields under known management are the cleanest comparison; PP vs WLP choice changes
          the expected magnitude by 2-5x
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National / regional yield aggregates carry a technology trend that a weather-only WOFOST run
          cannot reproduce; compare detrended residuals or decadal means, not raw inter-annual r
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Requires gridded ensemble runs; SPAM-style yield maps have their own disaggregation uncertainty
      detrending_options:
      - none
      - first_difference
      - linear_residual
      - decadal_mean
  - name: TWLV
    unit: kg ha-1
    description: Total crop leaf dry-matter biomass
    validation_rank: 9
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Usually destructive sampling at intervals
      detrending_options:
      - none
  - name: TWST
    unit: kg ha-1
    description: Total crop stem dry-matter biomass
    validation_rank: 10
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  - name: TWRT
    unit: kg ha-1
    description: Total crop root dry-matter biomass
    validation_rank: 11
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Root biomass is hard to observe; comparisons are typically scarce and noisy
      detrending_options:
      - none
  - name: TRA
    unit: cm day-1
    description: Daily actual crop transpiration
    validation_rank: 12
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare to eddy-covariance latent-heat partitioning or sap-flow; canopy energy balance is not
          closed
      detrending_options:
      - none
  - name: CTRAT
    unit: cm
    description: Cumulative crop transpiration over the season
    validation_rank: 13
    emitted_in: _saved_summary_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
  - name: SM
    unit: cm3 cm-3
    description: Volumetric root-zone soil moisture
    validation_rank: 3
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Single-bucket / two-bucket layering cannot resolve depth-specific probes; compare to a depth-integrated
          average over RD
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - temporal_pattern_match
        determining_metric: r
        caveats:
        - Satellite root-zone soil moisture (e.g., SMAP L4) has its own retrieval / DA depth conventions
      detrending_options:
      - none
  - name: RD
    unit: cm
    description: Crop rooting depth in the soil profile
    validation_rank: 14
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: pbias
        caveats:
        - Rooting depth is rarely observed continuously; one or two profile observations per season is
          typical
      detrending_options:
      - none
  - name: WWLOW
    unit: cm
    description: Total profile water (root-zone + subsoil)
    validation_rank: 15
    emitted_in: daily _saved_output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: PCSE raises yaml.scanner.ScannerError or yaml.parser.ParserError when loading crop parameter
    YAML files. The error message references a specific line and column with 'mapping values are not allowed
    here' or 'expected <block end>'.
  diagnosis: 'The YAML crop parameter file has an indentation error, a missing colon, or mixed tabs and
    spaces. YAML is extremely sensitive to whitespace — a single misplaced space can silently change the
    document structure or cause a parse error.; PCSE crop parameter YAML files use a hierarchical structure
    with YAML anchors and aliases (<<: *GenericC3) for parameter inheritance. If a parameter line has
    incorrect indentation, it may be parsed as belonging to a different parent block, causing either a
    parse error (if the structure becomes invalid) or a silent misconfiguration (if the structure is valid
    but semantically wrong). Tabs are NOT valid YAML whitespace — only spaces are allowed. Many editors
    silently insert tabs, which look like spaces but cause parse errors.

    ; [''YAMLCropDataProvider'', ''Crop parameter YAML files'']'
  remedy: 'Fix the YAML indentation and syntax at the reported line.; ; [''Read the error message — it
    reports the exact line and column of the error.'', ''Open the YAML file and check the reported line
    for indentation issues.'', "Ensure ALL indentation uses spaces (not tabs). Run: cat -A file.yaml |
    grep ''\\^I'' to find tabs.", ''Validate the file with: python -c "import yaml; yaml.safe_load(open(\''file.yaml\''))"'',
    ''If editing custom parameters, use the built-in PCSE YAML files as a template.'']; Always use yaml.dump()
    to generate YAML from Python dicts instead of manual formatting. Use a YAML linter (e.g., yamllint)
    on custom files.'
  severity: fatal
- id: dt_002
  symptom: Agromanagement YAML loads without error, but the CropCalendar or TimedEvents are None/empty
    even though they were defined in the file. The simulation starts but no crop is planted.
  diagnosis: 'The CropCalendar block is indented at the wrong level in the YAML file. It becomes a sibling
    of the campaign date dict instead of a child. YAML parses successfully (it is valid YAML) but the
    structure is semantically wrong.; PCSE agromanagement YAML has a specific nested structure: - Level
    0: list item (dash) - Level 1: campaign date key (e.g., 2000-10-01:) - Level 2: CropCalendar, TimedEvents,
    StateEvents keys - Level 3: individual parameters (crop_name, variety_name, etc.) If CropCalendar
    is at Level 1 instead of Level 2, it becomes a separate dict entry rather than a value under the date
    key. The parser sees an empty campaign (no CropCalendar) and a floating CropCalendar dict that is
    ignored. This is a valid YAML document, so no parse error occurs.

    ; [''AgroManager'', ''Agromanagement YAML file'']'
  remedy: 'Fix the indentation so CropCalendar is nested under the campaign date.; validate_agromanagement;
    ["Load the YAML and inspect the structure: agro = yaml.safe_load(open(''agro.yaml''))", ''Check: agro[0]
    should be a dict with ONE key (a datetime.date)'', "The value of that key should be a dict with ''CropCalendar''
    as a key", ''If CropCalendar is at the top level or a sibling of the date, fix indentation'', ''Use
    Python dict construction + yaml.dump() to regenerate correct YAML'']; Always generate agromanagement
    YAML programmatically using the generate_agromanagement_yaml tool. Never hand-edit YAML indentation.'
  severity: silent
- id: dt_003
  symptom: WOFOST simulation completes without error but yield (TWSO) is near zero or unreasonably low
    (<100 kg/ha). LAI stays very low (<0.5) throughout the season. No error messages in output.
  diagnosis: 'Solar radiation (IRRAD) is provided in MJ/m2/day instead of J/m2/day. Values like 15.0 (MJ)
    should be 15000000 (J). With radiation 1e6x too low, photosynthesis produces negligible assimilates,
    and the crop barely grows.; PCSE/WOFOST uses J/m2/day for irradiance (Joules, NOT kiloJoules — the
    PCSE documentation says kJ but the internal DB stores Joules, confirmed by a real-case run that gave
    normal wheat and maize yields with J/m2/day). DSSAT uses MJ/m2/day. A W/m2 daily mean needs ×86400
    to get J/m2/day. NASA POWER API uses MJ/m2/day. This is the #1 silent error in PCSE — the model runs
    perfectly fine with wrong units because it just computes very low photosynthesis. Typical J/m2/day
    values: winter=2e6-8e6, summer=15e6-35e6. Typical MJ/m2/day values: winter=2-8, summer=15-35. If your
    max IRRAD is < 100000, you almost certainly have MJ or kJ units.

    ; [''WeatherDataProvider'', ''Assimilation module (pcse.crop.assimilation)'']'
  remedy: 'Multiply all IRRAD values by 1e6 to convert from MJ/m2/day to J/m2/day.; validate_weather_data;
    [''Check: print(max(IRRAD)). If < 100000, it is in MJ or kJ — convert to J.'', ''If converting from
    a W/m2 daily mean (shared loader srad_wm2): IRRAD_J = SW_Wm2 * 86400 (CSV column: kJ = W/m2 * 86.4,
    written by build_pcse_weather_from_source)'', ''If converting from DSSAT MJ: IRRAD_J = SRAD_MJ * 1e6'',
    ''If using NASAPowerWeatherDataProvider: conversion is automatic (no fix needed)'', ''Re-run the simulation
    after fixing IRRAD values'']; Always run validate_weather_data tool before simulation. Check IRRAD
    range: 2e6-35e6 J/m2/day.'
  severity: silent
- id: dt_004
  symptom: WOFOST water-limited simulation shows permanent waterlogging. Soil moisture (SM) stays near
    saturation (SM0). Crop suffers oxygen stress. Yield is low but not zero. No error messages.
  diagnosis: 'Precipitation (RAIN) is provided in mm/day instead of cm/day. Values like 5.0 (mm) are interpreted
    as 5.0 (cm) = 50 mm. Rainfall is 10x too high, keeping the soil permanently saturated.; PCSE/WOFOST
    uses cm/day for precipitation, which is non-standard. The weather products (shared loader precip_mm)
    use mm, DSSAT uses mm, most meteorological datasets use mm. If you pass mm values directly, every
    rain event is 10x too large. The soil water balance overflows, SM stays at SM0 (saturation), CRAIRC
    is exceeded (waterlogging), and crop growth is stunted by oxygen stress. The simulation still completes
    because the crop is stressed but alive. Typical cm/day values: 0-5 for most events, rarely >10.

    ; [''WeatherDataProvider'', ''Classic water balance (pcse.soil.classic_waterbalance)'']'
  remedy: 'Divide all RAIN values by 10 to convert from mm/day to cm/day.; validate_weather_data; [''Check:
    print(max(RAIN)). If > 30, it is likely in mm — divide by 10.'', ''For a hand-built WeatherDataContainer
    only: RAIN_cm = precip_mm / 10.0. A CSVWeatherDataProvider CSV keeps mm (dt_016).'', ''If converting
    from DSSAT mm: RAIN_cm = RAIN_mm / 10.0'', ''Re-run the simulation after fixing RAIN values'']; Always
    check RAIN units before simulation. Typical daily rainfall in cm: 0-5, rarely >10.'
  severity: silent
- id: dt_005
  symptom: 'Winter wheat simulation runs to max_duration but DVS never exceeds 0.3-0.5. The crop never
    reaches anthesis (DVS=1). Yield is zero or near-zero. A warning may appear in PCSE logs: ''Vernalization
    requirements not met.'''
  diagnosis: 'VERNSAT (required vernalization days) is too high for the climate, or the simulation starts
    in spring (missing the winter cold period). The crop needs a certain number of cold days (TMIN < VERNBASE)
    to satisfy vernalization. If the winter is too mild or too short, vernalization is never satisfied
    and DVS accumulation stalls.; WOFOST models vernalization as a gradual process: each day with temperature
    between VERNBASE and an upper limit contributes to a vernalization counter. When the counter reaches
    VERNSAT, vernalization is complete and DVS can progress past the vernalization-sensitive phase. VERNDVS
    is a safety cutoff: when DVS reaches VERNDVS, vernalization is forced to complete (preventing permanent
    stalling). However, if VERNDVS is not set or is too high (>0.5), the crop may still stall in warm
    climates. Common scenarios: (1) Using a European winter wheat variety in a subtropical location (2)
    Starting simulation in January instead of October (missing autumn/winter) (3) VERNSAT=70 days in a
    region with only 30 cold days

    ; [''pcse.crop.phenology (Vernalisation class)'', ''Crop parameter YAML (vernalization section)'']'
  remedy: 'Reduce VERNSAT to match the available cold days, or switch to a spring variety.; validate_crop_params;
    [''Check the weather data: count days where TMIN < 8C (approximate VERNBASE)'', ''If cold days < VERNSAT:
    reduce VERNSAT to match, or use a spring variety'', ''Ensure VERNDVS is set (default ~0.30) — this
    prevents permanent stalling'', ''For tropical/subtropical locations: use spring wheat, not winter
    wheat'', ''Ensure the simulation starts before winter (e.g., October for NH winter wheat)'']; Match
    crop variety (winter vs spring) to the sowing season and climate. Check cold-day count before running
    winter crop simulations.'
  severity: silent
- id: dt_006
  symptom: DVS progresses very slowly but never reaches 2.0 (maturity) within the simulation period. The
    crop flowers (DVS>1) but does not mature. Final DVS is between 1.0 and 1.9.
  diagnosis: 'TSUM2 (thermal time from anthesis to maturity) is too high for the climate, or the growing
    season is too short (max_duration too low). The crop needs more heat units to mature than the remaining
    growing season provides.; After anthesis (DVS=1), development rate depends on daily effective temperature
    and TSUM2. If TSUM2=1500 C.d but the post-anthesis period only accumulates 1000 C.d (due to cool autumn
    or early end of season), DVS will reach ~1.67 instead of 2.0. This produces incomplete grain filling
    and low yield, but the simulation terminates normally at max_duration with no error. Similarly, TSUM1
    can be too high for the pre-anthesis period, but this usually shows as DVS < 1.

    ; [''pcse.crop.phenology'', ''Crop parameters TSUM1, TSUM2'']'
  remedy: 'Reduce TSUM2 to match the available growing season heat, or increase max_duration.; check_simulation_status;
    [''Calculate post-anthesis thermal time: sum(max(0, Tavg - TBASE)) for days after anthesis'', ''Compare
    with TSUM2. If available < TSUM2, reduce TSUM2 or use a shorter-season variety'', ''If max_duration
    is limiting: increase to 365+ days'', ''Consider using a variety calibrated for the target region''];
    Before running, estimate thermal time from weather data and compare with TSUM1+TSUM2. Choose varieties
    with thermal time requirements matching the local climate.'
  severity: degraded
- id: dt_007
  symptom: WOFOST simulation completes with exit code 0. DVS may or may not reach 2.0. But TWSO (yield)
    is exactly 0 or very close to 0 (<10 kg/ha). No error messages. All other outputs look structurally
    correct.
  diagnosis: 'Multiple possible causes, in order of likelihood: (1) IRRAD in MJ instead of J — photosynthesis
    negligible, (2) DVS never reached the storage-organ partitioning phase — FOTB table starts partitioning
    at DVS>1 but DVS<1 due to vernalization/thermal time, (3) Severe water stress killed all leaves —
    LAI→0 means no photosynthesis, (4) Temperature consistently below TBASE — no thermal time accumulation.;
    WOFOST produces zero yield silently because zero is a valid physical outcome (e.g., complete crop
    failure due to drought). The model cannot distinguish between ''crop failed due to real stress'' and
    ''crop failed due to input error''. This is the most dangerous failure mode because the simulation
    looks correct: it ran to completion, produced output files, and the data has the right format. Only
    by checking TWSO > 0 can the agent detect this.

    ; [''pcse.crop.assimilation'', ''pcse.crop.partitioning'', ''pcse.crop.phenology'', ''WeatherDataProvider'']'
  remedy: 'Diagnose by checking IRRAD units first, then DVS progression, then LAI, then temperature.;
    check_simulation_status; [''Step 1: Check IRRAD max. If < 100000, it is in MJ or kJ → convert to J
    (see dt_003)'', ''Step 2: Check RAIN max. If > 50, it is in mm → divide by 10 (see dt_004)'', ''Step
    3: Check final DVS. If < 1.0, crop never flowered (see dt_005, dt_006)'', ''Step 4: Check LAI time
    series. If LAI always 0, emergence failed'', ''Step 5: Check temperature. If Tavg always < TBASE,
    no thermal time accumulates'', ''Step 6: Check soil moisture. If SM always = SMW, crop died from drought''];
    Always validate weather units (dt_003, dt_004) AND check TWSO > 0 after every simulation.'
  severity: silent
- id: dt_008
  symptom: WOFOST yields are 2-5x higher than expected literature values or DSSAT comparison. Yields of
    12000-20000 kg/ha for wheat or 18000-25000 kg/ha for maize. No water stress visible in output.
  diagnosis: 'The simulation is running in Potential Production mode (Wofost72_PP) instead of Water-Limited
    mode (Wofost72_WLP_FD). PP mode assumes unlimited water — no drought stress, no waterlogging. This
    gives the theoretical maximum yield, which is much higher than actual field yields.; PCSE offers three
    engine classes, and using the wrong one is a common mistake: - Wofost72_PP: potential production (no
    water stress, no soil needed) - Wofost72_WLP_FD: water-limited, free drainage (realistic water stress)
    - Wofost72_WLP_CWB: water-limited, classic water balance (groundwater included) PP mode is useful
    for computing theoretical yield potential but should never be compared with observed yields or DSSAT
    water-limited runs. The yield difference between PP and WLP can be 2-5x depending on climate aridity.

    ; [''Engine class selection'', ''pcse.models'']'
  remedy: 'Switch from Wofost72_PP to Wofost72_WLP_FD for realistic water-limited simulation.; configure_pcse_engine;
    [''Check current engine: print(type(engine).__name__)'', "If it says ''Wofost72_PP'', switch to Wofost72_WLP_FD",
    ''Ensure soil parameters are provided (required for WLP modes)'', ''Re-run the simulation with the
    correct engine class'']; Always verify the engine class matches the intended simulation purpose. For
    real-world yield estimation, always use WLP_FD.'
  severity: silent
- id: dt_009
  symptom: PCSE raises ValueError or produces physically impossible water balance results. Soil moisture
    oscillates between extreme values. Error message may mention 'SMFCF must be > SMW' or 'SM0 must be
    > SMFCF'.
  diagnosis: 'Soil water limits are in wrong order: field capacity (SMFCF) is less than or equal to wilting
    point (SMW), or saturation (SM0) is less than or equal to field capacity. This is physically impossible
    and indicates a pedotransfer function error or unit mismatch.; WOFOST requires a strict ordering:
    SMW < SMFCF < SM0, where: - SMW = soil moisture at wilting point (pF 4.2, ~-1500 kPa) - SMFCF = soil
    moisture at field capacity (pF 2.0, ~-10 kPa) - SM0 = soil moisture at saturation (porosity) Additionally:
    CRAIRC < SM0 - SMFCF (critical air content must be less than available air at field capacity). Common
    causes: (1) Pedotransfer functions given wrong inputs (sand/clay percentages swapped) (2) Using DSSAT
    soil layer values directly (different parameter definitions) (3) Using cm3/cm3 vs percentage (SMW=0.10
    vs SMW=10.0)

    ; [''Soil parameter dictionary'', ''pcse.soil.classic_waterbalance'']'
  remedy: 'Recalculate soil parameters ensuring SMW < SMFCF < SM0.; validate_soil_params; [''Print current
    values: SMW, SMFCF, SM0'', ''If values > 1.0: they are in percentage, divide by 100 (should be cm3/cm3,
    range 0-0.65)'', ''If SMW > SMFCF: swap them (or recalculate from raw texture)'', ''Ensure SM0 = 1
    - bulk_density/2.65 (porosity from particle density)'', ''Ensure CRAIRC = min(0.04, SM0 - SMFCF -
    0.01)'']; Always use the convert_hwsd_to_pcse_soil tool which enforces the ordering constraint.'
  severity: fatal
- id: dt_010
  symptom: 'PCSE raises KeyError when trying to set the active crop or during engine initialization. Error
    message shows the crop_name or variety_name but it looks correct at first glance. Example: KeyError:
    ''Wheat'' or KeyError: ''winter_wheat_101''.'
  diagnosis: 'crop_name and variety_name in PCSE are case-sensitive. ''Wheat'' is not ''wheat''. ''winter_wheat_101''
    is not ''Winter_wheat_101''. The YAML crop parameter files define exact names with specific capitalization.;
    PCSE uses Python dictionary lookups internally for crop and variety names. Dictionary keys are case-sensitive
    strings. The built-in crop names are all lowercase (wheat, maize, rice, soybean, barley, sunflower,
    sugarbeet, etc.). Variety names use mixed case with specific patterns (Winter_wheat_101, Maize_VanHeemst_1988,
    Spring_barley_301). The error message shows the attempted key but does not suggest the correct case
    or list alternatives.

    ; [''YAMLCropDataProvider'', ''AgroManager'', ''Agromanagement YAML'']'
  remedy: 'Use the exact case for crop_name and variety_name as listed by the data provider.; ; [''List
    available crops: print(cropdata.get_crop_types())'', "List available varieties: print(cropdata.get_variety_names(''wheat''))",
    ''Copy the exact name (case included) into your agromanagement YAML'', "Double-check: ''wheat'' not
    ''Wheat'', ''Winter_wheat_101'' not ''winter_wheat_101''"]; Always query get_crop_types() and get_variety_names()
    before setting names. Never type names from memory.'
  severity: fatal
- id: dt_011
  symptom: PCSE raises WeatherDataProviderError during simulation with message 'No weather data for date
    YYYY-MM-DD' or similar. Simulation crashes mid-run.
  diagnosis: 'The weather data has gaps (missing days) within the simulation period, or the weather data
    period does not fully cover the agromanagement campaign dates. PCSE requests weather data daily and
    crashes if any day is missing.; PCSE calls the weather data provider for every simulation day. If
    a day is missing (gap in CSV, API failure, etc.), the provider raises an exception. Common scenarios:
    (1) Weather CSV has Feb 29 missing in leap years (2) Weather data ends on Dec 31, 2009 but simulation
    runs to Jun 30, 2010 (3) NASAPower API returns partial data due to network error (4) Campaign starts
    Oct 1, 2000 but weather CSV starts Jan 1, 2001 For winter crops, weather must cover autumn of the
    sowing year.

    ; [''WeatherDataProvider'', ''CSVWeatherDataProvider'', ''Engine daily loop'']'
  remedy: 'Fill weather data gaps or extend the coverage period.; validate_weather_data; [''Check weather
    coverage: print first and last date in the weather data'', ''Check agromanagement: campaign starts
    on what date?'', ''Ensure weather first date <= campaign start date'', ''Ensure weather last date
    >= expected simulation end (sowing + max_duration)'', ''Fill gaps with interpolation or fetch additional
    data'', ''For leap year gaps: interpolate Feb 28 and Mar 1'']; Always validate weather date completeness
    before starting simulation. Use validate_weather_data tool.'
  severity: fatal
- id: dt_012
  symptom: ImportError or AttributeError when importing PCSE classes. 'cannot import name Wofost72_WLP_FD
    from pcse.models' or 'module pcse has no attribute fileinput'. Code that worked in PCSE 5.x fails
    in 6.0.
  diagnosis: 'PCSE 6.0 reorganized its module structure compared to 5.x. Import paths changed: pcse.fileinput
    → pcse.input, some model class names changed, and the weather data provider API was updated.; Key
    PCSE 5.x → 6.0 changes: - pcse.fileinput.CSVWeatherDataProvider → pcse.input.CSVWeatherDataProvider
    - pcse.fileinput.ExcelWeatherDataProvider → pcse.input.ExcelWeatherDataProvider - pcse.fileinput.YAMLCropDataProvider
    → pcse.input.YAMLCropDataProvider - pcse.fileinput.CABOFileReader → pcse.input.CABOFileReader - Engine
    classes remained in pcse.models but some were renamed - Some utility functions moved between modules
    Tutorials and StackOverflow answers often reference PCSE 5.x imports.

    ; [''All import statements'', ''Module structure'']'
  remedy: 'Update import statements to PCSE 6.0 paths.; ; ["Check PCSE version: python -c ''import pcse;
    print(pcse.__version__)''", ''If 6.x: use pcse.input (not pcse.fileinput) for data providers'', ''If
    5.x: use pcse.fileinput for data providers'', ''Replace old imports: pcse.fileinput.X → pcse.input.X'',
    ''If unsure, check: dir(pcse.input) or dir(pcse.models)'']; Pin PCSE version in requirements.txt.
    This infrastructure targets PCSE 6.0 — use pcse.input for all data providers.'
  severity: fatal
- id: dt_013
  symptom: PCSE raises PCSEError or ValueError during engine initialization with message mentioning 'AFGEN'
    or 'interpolation' or 'x values not monotonically increasing'. Alternatively, crop growth shows discontinuous
    jumps.
  diagnosis: 'An AFGEN interpolation table (e.g., AMAXTB, SLATB, FOTB) has non-monotonically increasing
    x-values. PCSE uses piecewise linear interpolation that requires strictly increasing x-values.; WOFOST
    uses AFGEN tables extensively for parameters that vary with development stage (DVS) or temperature.
    Tables are stored as flat lists: [x1,y1,x2,y2,...]. If x-values are not strictly increasing (e.g.,
    [0.0, 1.5, 0.5, 2.0, 1.0, 1.0]), the interpolation either fails with an error (if PCSE validates)
    or produces wrong interpolated values (if it does not validate). Custom parameter files created by
    manual editing are the most common source of this error.

    ; [''AFGEN interpolation engine'', ''Crop parameter YAML tables'']'
  remedy: 'Sort AFGEN table x-values in strictly increasing order.; validate_crop_params; [''Identify
    which table has the error (from the error message)'', "Print the table values: print(cropdata[''AMAXTB''])",
    ''Check x-values (even indices: 0, 2, 4, ...): they must strictly increase'', ''Sort or fix duplicates.
    Two entries at the same x-value: remove one'', ''If editing YAML: ensure x-values are numerically
    increasing: 0.0, 0.5, 1.0, 1.5, 2.0'']; When creating custom AFGEN tables, always verify monotonicity.
    Use validate_crop_params tool after any parameter modification.'
  severity: fatal
- id: dt_014
  symptom: Simulation terminates before crop reaches maturity (DVS < 2.0). TWSO is partial (lower than
    expected). The simulation ran for exactly max_duration days and stopped, regardless of DVS.
  diagnosis: 'max_duration in the agromanagement is too short for the crop to complete its growth cycle.
    Winter wheat needs 250-350 days, maize needs 120-200 days. If max_duration=150 for winter wheat, the
    simulation terminates mid-growth.; PCSE''s AgroManager terminates the crop when any of three conditions
    is met: (1) DVS >= 2.0 (crop reached maturity), (2) crop_end_date is reached, or (3) max_duration
    days have elapsed since crop_start_date. If max_duration is too short, condition (3) triggers before
    condition (1). The simulation produces partial results — some yield from incomplete grain filling
    — with no error. This is a design feature (safety limit) not a bug, but misconfiguring it truncates
    the simulation.

    ; [''AgroManager'', ''Agromanagement YAML (max_duration field)'']'
  remedy: 'Increase max_duration to cover the full growing season.; validate_agromanagement; [''Check
    the agromanagement YAML: what is max_duration?'', ''Set max_duration based on crop type:'', ''  Winter
    wheat: 300-365 days'', ''  Spring wheat: 150-200 days'', ''  Maize: 150-220 days'', ''  Rice: 120-180
    days'', ''  Soybean: 120-180 days'', ''Setting max_duration=365 is safe — the simulation stops at
    maturity anyway'']; Default max_duration to 365 for winter crops, 250 for spring crops. Prefer crop_end_type=''maturity''
    so the simulation stops when the crop is done, not on a timer.'
  severity: degraded
- id: dt_015
  symptom: NASAPowerWeatherDataProvider raises ConnectionError, Timeout, or returns incomplete data. Error
    message mentions 'NASA POWER API' or 'requests.exceptions'.
  diagnosis: 'The NASA POWER API is temporarily unavailable, rate-limited, or the network connection is
    down. NASAPowerWeatherDataProvider makes HTTP requests to power.larc.nasa.gov on instantiation.; NASAPowerWeatherDataProvider
    fetches all weather data during __init__(). If the API is slow, the request may time out. If running
    many grid cells, you may hit rate limits. The provider caches data locally after first fetch, but
    the initial request must succeed. For batch runs with many cells, this means many sequential API calls,
    each of which can fail.

    ; [''NASAPowerWeatherDataProvider'', ''Network connectivity'']'
  remedy: 'Retry after delay, or switch to local CSV weather data.; create_csv_weather_file; [''Wait 30
    seconds and retry — API may be temporarily overloaded'', ''Check internet connectivity: ping power.larc.nasa.gov'',
    ''If persistent: download NASA POWER data manually via the web interface'', ''Convert to CSV format
    and use CSVWeatherDataProvider instead'', ''For batch runs: build the CSV files with build_pcse_weather_from_source
    (--source mswx or cmfd are local; --source nasa_power goes around the proxy)'']; For production runs,
    always use CSV weather files built by build_pcse_weather_from_source. Reserve NASAPowerWeatherDataProvider
    for quick tests and demos only.'
  severity: fatal
- id: dt_v001
  symptom: 'ImportError: cannot import name ''WOFOST72SiteDataProvider'' from ''pcse.util'''
  diagnosis: 'PCSE 6.0 moved WOFOST72SiteDataProvider from pcse.util to pcse.input; Pre-6.0 code uses
    `from pcse.util import WOFOST72SiteDataProvider`. In PCSE 6.0.12 this fails. The class is now at pcse.input.

    ; [''s5_engine_config'']'
  remedy: 'Change import to: from pcse.input import WOFOST72SiteDataProvider; ; [''Replace: from pcse.util
    import WOFOST72SiteDataProvider'', ''With: from pcse.input import WOFOST72SiteDataProvider'']; Always
    check pcse.__version__ and use pcse.input for all data providers in v6.0+'
  severity: fatal
- id: dt_v002
  symptom: 'PCSEError: Unknown parameter values provided to WOFOST72SiteDataProvider: {''CO2'': 400}'
  diagnosis: 'PCSE 6.0 removed CO2 from WOFOST72SiteDataProvider accepted parameters; In PCSE 5.x, CO2
    was a site parameter. In 6.0, it is handled elsewhere. WOFOST72SiteDataProvider now only accepts:
    IFUNRN, NOTINF, SSI, SSMAX, WAV, SMLIM.

    ; [''s5_engine_config'']'
  remedy: 'Remove CO2 from WOFOST72SiteDataProvider() call. Use WAV only.; ; [''Change: WOFOST72SiteDataProvider(WAV=20,
    CO2=400)'', ''To: WOFOST72SiteDataProvider(WAV=20)'']; Check _defaults attribute of SiteDataProvider
    for accepted parameters'
  severity: fatal
- id: dt_v003
  symptom: 'PCSEError: Duplicate parameter found: IFUNRN (or SSMAX, SSI, WAV, NOTINF, SMLIM)'
  diagnosis: 'Same parameters defined in both soildata dict and WOFOST72SiteDataProvider; In PCSE 6.0,
    WOFOST72SiteDataProvider provides default values for IFUNRN, NOTINF, SSI, SSMAX, WAV, SMLIM. If these
    also appear in soildata dict, ParameterProvider raises a duplicate error. In 5.x these were only in
    soildata.

    ; [''s5_engine_config'']'
  remedy: 'Remove IFUNRN, NOTINF, SSI, SSMAX, SMLIM from soildata dict — keep only hydraulic properties
    (SMW, SMFCF, SM0, CRAIRC, K0, SOPE, KSUB, RDMSOL); ; [''soildata should contain ONLY: SMW, SMFCF,
    SM0, CRAIRC, K0, SOPE, KSUB, RDMSOL'', ''WOFOST72SiteDataProvider handles: WAV, IFUNRN, NOTINF, SSI,
    SSMAX, SMLIM'']; Always separate soil-hydraulic from soil-site parameters for PCSE 6.0'
  severity: fatal
- id: dt_v004
  symptom: Vapour pressure in the weather file is > 100 kPa or < 0.06 kPa; pcse rejects VAP
  diagnosis: 'The humidity column was taken as the wrong quantity (specific humidity written as kPa, or
    a vapour pressure converted a second time); The shared loader gives specific humidity (shum_kgkg,
    0.0005-0.025) and pressure (pres_pa). PCSE needs vapour pressure in kPa (0.1-4.2): e = q*p/(0.622+0.378*q),
    Pa / 1000. Writing q straight into VAP gives values far below 0.06; applying the formula to a value
    that is already a vapour pressure gives nonsense.

    ; [''s3_weather_prep'']'
  remedy: 'Build the weather file with build_pcse_weather_from_source; it computes VAP from the source''s
    own specific humidity and pressure.; build_pcse_weather_from_source; [''Check the VAP column: 0.1-4.2
    is kPa (right)'', ''If the values are 0.0005-0.025 they are specific humidity in kg/kg'', ''For your
    own station table in hPa: set WX_VAP_IS_HPA=1 for create_csv_weather_file'']; validate_weather_data
    tool checks the VAP range'
  severity: silent
- id: dt_v005
  symptom: WOFOST produces zero or near-zero yield despite correct temperature and rain. LAI stays below
    0.2.
  diagnosis: 'IRRAD must be in J/m²/d (Joules), not kJ/m²/d. PCSE SKILL.md says kJ but DB stores J.; The
    PCSE documentation and SKILL.md state IRRAD is in kJ/m²/d, but the internal DB (pcse.db) stores radiation
    in J/m²/d. Spain example: IRRAD=15,657,000 J/m²/d  = 15.7 MJ/m²/d. If you pass 15,657 kJ/m²/d (same
    number), it''s 1000x too low and photosynthesis produces near-zero biomass. The crop reaches maturity
    (DVS=2.0) via temperature accumulation but never builds enough biomass for grain fill. THIS IS THE
    #1 REASON WOFOST PRODUCES ZERO YIELD WITH CUSTOM WEATHER DATA.

    ; [''s3_weather_prep'', ''s6_execution'']'
  remedy: 'Convert: IRRAD_J = shortwave_W_m2 * 86400 (NOT * 86.4); build_pcse_weather_from_source; [''From
    a W/m² daily mean: internal IRRAD = SW_mean * 86400 (J/m²/d); CSV column = SW_mean * 86.4 (kJ/m²/d)'',
    ''From MJ/m²/d (DSSAT): IRRAD = SRAD * 1e6 (J/m²/d)'', ''Validate: spring day should be 10-25 million
    J/m²/d (10-25 MJ)'', ''If IRRAD < 100,000, it is likely in kJ — multiply by 1000'']; build_pcse_weather_from_source
    writes the CSV column in kJ (W/m2 * 86.4) and the provider multiplies by 1000, which gives W/m2 *
    86400 J inside the model'
  severity: silent
- id: dt_v006
  symptom: ET0 values unrealistically high (>1.5 cm/d) causing extreme water stress
  diagnosis: 'ET0 must be in cm/day, not mm/day. Spain DB values: 0.08-0.88 cm/d.; PCSE WeatherDataContainer
    expects E0, ES0, ET0 in cm/day. If computed in mm/day (typical output of Penman-Monteith), values
    are 10x too high. This causes extreme water stress in WLP mode — the model thinks the atmosphere demands
    10x more water than available, shutting down transpiration.

    ; [''s3_weather_prep'']'
  remedy: 'Divide ET0 by 10 if computed in mm/day: ET0_cm = ET0_mm / 10; validate_weather_data; [''Validate:
    ET0 should be 0.01-1.5 cm/day for most climates'', ''If ET0 > 2.0, it is likely in mm — divide by
    10'']; CSVWeatherDataProvider computes E0/ES0/ET0 itself in cm/day; only a hand-built WeatherDataContainer
    needs this check'
  severity: silent
- id: dt_016
  symptom: 'WOFOST yields are low / the crop is chronically water-stressed when weather was supplied through
    a CSVWeatherDataProvider CSV, even though older docs said RAIN is cm/day. No error is raised.

    '
  diagnosis: 'The CSV RAIN column was authored in cm. PCSE 6.0 CSVWeatherDataProvider DIVIDES the RAIN
    column by 10 to obtain the model''s internal cm/day (csvweatherdataprovider.py: RAIN -> mm_to_cm,
    i.e. value/10). So a cm-authored column is delivered to the soil water balance 10x too low (100x if
    mm was first divided to cm per the old docs). The crop is drought-stressed, LAI/biomass and yield
    are depressed. Distinct from dt_004, which concerns a directly-built WeatherDataContainer where you
    DO provide cm/day (and passing mm there makes rain 10x too HIGH -> waterlogging).

    ; The CSVWeatherDataProvider columns are SOURCE units that the provider rescales: IRRAD kJ (x1000
    -> J), VAP kPa (x10 -> hPa), RAIN mm (/10 -> cm). The docstring of create_csv_weather_file.py is the
    canonical contract ("RAIN: mm/day (provider divides /10 -> cm internally)"). Authoring the CSV in
    cm double-converts.

    ; [''CSVWeatherDataProvider'', ''build_pcse_weather_from_source'', ''Classic water balance (pcse.soil.classic_waterbalance)'']'
  remedy: 'Author the CSVWeatherDataProvider RAIN column in mm/day; let the provider do the /10 -> cm.;
    validate_weather_data; [''Use build_pcse_weather_from_source (RAIN = loader precip_mm, no division).'',
    ''Trust create_csv_weather_file.py docstring as ground truth (RAIN column = mm/day).'', ''Sanity probe:
    CSVWeatherDataProvider on a row with RAIN=10.0 yields internal RAIN=1.0 cm/day.'', ''Re-run the simulation
    after fixing RAIN values.'']; CSV columns are SOURCE units (mm/kJ/kPa); the provider rescales. Do
