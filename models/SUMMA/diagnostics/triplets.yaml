- id: dt_027
  stage: s1_domain_setup
  failure_domain: parameter_format
  symptom:
    description: 'Large negative discharge bias (PBIAS -40% to -70%) with a GOOD correlation (r > 0.7)
      and a water balance that CLOSES. Routing changes, gamma-scale sweeps and soil calibration all fail
      to move PBIAS. scalarTotalET exceeds (basin precipitation - observed runoff).

      '
    error_pattern: PBIAS.*-[4-9][0-9]|scalarTotalET.*exceed
    detection_method: metric_check
  diagnosis:
    root_cause: 'vegTypeIndex was invented (uniform value, or a rule keyed on elevation) rather than sourced
      from a land-cover raster, giving the basin a taller canopy and a higher, less seasonal LAI than
      it has.

      '
    explanation: 'vegTypeIndex indexes MPTABLE.TBL''s HVT (canopy top height) and LAIM (monthly LAI) rows,
      which set aerodynamic conductance, interception capacity and transpiring leaf area. Under MODIFIED_IGBP_MODIS_NOAH,
      Evergreen Broadleaf Forest (2) is HVT 20 m with LAI 4.5 in EVERY month, while Closed Shrubland (6)
      is HVT 1.1 m with LAI 0.0 in Dec-Feb. Mislabelling shrubland as forest therefore evaporates water
      all dry season. At Jinghong (Lancang, 142,695 km2) an elevation rule did exactly this to 42% of
      basin area -- the wettest 42% -- producing scalarTotalET 766.8 mm/yr against a P - Q_obs ceiling
      of 555 mm/yr and PBIAS -66.5%. Routing is a mass-conserving redistribution in time and can NEVER
      repair this; three rounds of routing work were spent before the vegetation was checked. The tell
      is that r stays high (the model gets the monsoon timing right) while PBIAS stays stuck and the water
      balance closes: the water is not lost by the numerics, it is genuinely evaporated.

      '
    affected_components:
    - gru_hru_mapping.csv / attributes.nc vegTypeIndex column
    - MPTABLE.TBL HVT and LAIM rows
    - scalarTotalET, scalarCanopyEvaporation, scalarCanopyTranspiration
  remedy:
    action: 'Source vegTypeIndex from land cover, and check the ET ceiling BEFORE calibrating or routing.

      '
    tool_to_run: tools/s8_routing/build_river_network.py --landcover_tif ... --veg_scheme modis
    manual_steps:
    - 'Compute the ceiling: ET_max = P_basin_mean - Q_obs (both mm/yr). Compare scalarTotalET.'
    - If scalarTotalET > ET_max, discharge is structurally under-predictable. Stop tuning.
    - Re-run build_river_network.py with --landcover_tif <AVHRR IGBP tif> --veg_scheme <usgs|modis>.
    - Set the vegeParTbl decision to match --veg_scheme (SKILL.md Sec 2c). They are NOT independent.
    - 'Pass --veg_scheme to set_trial_parameters.py --from_hwsd too: heightCanopyTop/Bottom are PARAMETERS
      (popMetadat.f90:212), not table lookups, and default to a 20 m / 2 m forest on EVERY HRU. Its legacy
      canopy dict is hard-coded USGS-27, so MODIS class 1 (ENF, 20 m) lands on USGS 1 (Urban, height 0)
      -> fatal paramCheck.'
    - Emit scalarLAI and confirm winter basin-mean LAI is near 0 for a shrub/grass basin.
    prevention: 'build_river_network.py now takes --landcover_tif and emits veg_area_fraction; its --veg_index
      path warns that vegetation is an assumption. Read that JSON.

      '
  severity: high
  cross_references:
  - dt_022
  - dt_028
  - cm_029
- id: dt_028
  stage: s6_execution
  failure_domain: output_interpretation
  symptom:
    description: 'Canopy interception loss computed as (pptrate - scalarThroughfallRain - scalarThroughfallSnow)
      reads an implausible 35-45% of precipitation, leading to a "canopy parameter problem / requires_calibration"
      verdict.

      '
    error_pattern: interception.*(3[5-9]|4[0-9])%|interception_loss_frac
    detection_method: metric_check
  diagnosis:
    root_cause: 'P minus throughfall is the interception RATE, not the interception LOSS. It counts intercepted
      water that later reaches the ground as if it had evaporated.

      '
    explanation: "SUMMA defines scalarThroughfallRain as \"rain that reaches the ground without ever touching\
      \ the canopy\" (vegLiqFlux.f90:62). Water the canopy DOES intercept leaves the canopy store by four\
      \ paths, only two of which are vapour:\n  vapour : scalarCanopyEvaporation, scalarCanopySublimation\n\
      \  to ground: scalarCanopyLiqDrainage (vegLiqFlux.f90:63), scalarCanopySnowUnloading\nSubtracting\
      \ only throughfall therefore attributes drainage and snow unloading to the atmosphere. In a snowy\
      \ or high-LAI basin the overcount is large: at Jinghong the statistic read 42.9% of P while the\
      \ true interception loss was a fraction of that. The bogus ratio survived three diagnostic rounds\
      \ and drove a requires_calibration verdict, because a canopy that \"loses\" 43% of P looks like\
      \ a parameter problem.\n"
    affected_components:
    - scalarThroughfallRain / scalarThroughfallSnow
    - scalarCanopyLiqDrainage / scalarCanopySnowUnloading
    - outputControl.txt variable selection
  remedy:
    action: Compute interception loss as canopy evaporation + canopy sublimation.
    tool_to_run: ''
    manual_steps:
    - Add scalarCanopyEvaporation, scalarCanopySublimation, scalarCanopyTranspiration, scalarGroundEvaporation,
      scalarCanopyLiqDrainage, scalarCanopySnowUnloading to outputControl.txt.
    - interception_loss = |scalarCanopyEvaporation| + |scalarCanopySublimation|
    - 'Cross-check: those two plus transpiration, ground evaporation and snow sublimation must sum to
      |scalarTotalET|.'
    - Attribute the ET excess to a component before blaming a parameter.
    prevention: 'Never infer a vapour flux by differencing two mass fluxes when the model emits the vapour
      flux directly.

      '
  severity: medium
  cross_references:
  - dt_027
- id: dt_029
  stage: s4_parameters
  failure_domain: parameter_format
  symptom:
    description: 'SUMMA aborts immediately with "FATAL ERROR: summa_paramSetup/paramCheck/height of canopy
      top is less than the height of the canopy bottom", typically right after switching vegeParTbl or
      after writing a short-canopy (shrub/grass/barren) vegTypeIndex.

      '
    error_pattern: height of canopy top is less than the height of the canopy bottom
    detection_method: log_match
  diagnosis:
    root_cause: 'set_trial_parameters.py --from_hwsd wrote heightCanopyTop/heightCanopyBottom from a hard-coded
      USGS-27 dict (ZTOPV/ZBOTV) while vegTypeIndex was written against a different table, or for a class
      whose ZTOPV is 0.

      '
    explanation: 'heightCanopyTop and heightCanopyBottom are ordinary SUMMA parameters (popMetadat.f90:212),
      NOT values SUMMA looks up from MPTABLE.TBL''s HVT/HVB. Unwritten they take localParamInfo.txt''s
      20.0 m / 2.0 m -- a forest on every HRU. The legacy ZTOPV dict is USGS-only and sets 0 for Urban
      (1) and Water (16); ZBOTV then floors the bottom at 0.01, so top(0.0) < bottom(0.01) and paramCheck.f90:128
      aborts. Under MODIFIED_IGBP_MODIS_NOAH the same dict is simply the wrong table: MODIS 1 is Evergreen
      Needleleaf Forest (HVT 20 m) but USGS 1 is Urban (ZTOPV 0).

