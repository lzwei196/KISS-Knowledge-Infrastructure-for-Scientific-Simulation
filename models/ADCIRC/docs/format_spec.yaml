model:
  name: "ADCIRC"
  version: "56.2.1"
  domain: "coastal_ocean"
  description: "2D/3D finite element hydrodynamic model for time-dependent free surface circulation and transport"
  binary_path: "/home/server/knowledge-dissection-toolkit/auto_dissect/_work/ADCIRC/source/repo/build/adcirc"
  coordinate_system: "unstructured triangular finite element mesh"

inputs:
  forcing:
    - name: "wind_velocity"
      unit: "m/s"
      valid_range: [0, 100]
      format: "OWI fort.22 (NWS=12)"
    - name: "atmospheric_pressure"
      unit: "m H2O"
      valid_range: [9.5, 10.5]
      format: "OWI fort.22 (NWS=12)"
      note: "Convert from Pa: P_mH2O = P_Pa / 9806.65"
    - name: "tidal_elevation"
      unit: "m"
      valid_range: [-5, 5]
      format: "fort.19 (time-varying elevation BC)"
    - name: "river_discharge"
      unit: "m3/s"
      valid_range: [0, 100000]
      format: "fort.20 (normal flux BC)"

  mesh:
    - name: "fort.14"
      description: "Unstructured triangular mesh: nodes (x, y, depth), elements, boundaries"
      format: "ASCII"
      required: true
    - name: "fort.13"
      description: "Nodal attributes (Manning's n, friction, directional roughness)"
      format: "ASCII"
      required: false

  parameters:
    critical:
      - name: "DTDP"
        unit: "seconds"
        valid_range: [0.5, 10]
        description: "Timestep — must satisfy CFL: DTDP < dx_min / sqrt(g * h_max)"
      - name: "TAU0"
        valid_range: [-5, 0.1]
        description: "GWCE weighting factor. Use -3 for automatic spatially-varying values"
      - name: "G"
        unit: "m/s2"
        valid_range: [9.80, 9.82]
        description: "Gravitational acceleration. Must be 9.81 for spherical coords (ICS=2)"
      - name: "Manning_n"
        unit: "s/m^(1/3)"
        valid_range: [0.01, 0.20]
        description: "Bottom friction coefficient — primary calibration parameter"
      - name: "H0"
        unit: "m"
        valid_range: [0.01, 1.0]
        description: "Wetting/drying threshold. Typical: 0.05 (storm surge), 0.01 (tidal)"
      - name: "ESLM"
        unit: "m2/s"
        valid_range: [1, 50]
        description: "Lateral viscosity/diffusion"
      - name: "FFACTOR"
        valid_range: [0.001, 0.01]
        description: "Quadratic friction coefficient"

outputs:
  primary:
    - name: "water_elevation"
      unit: "m"
      valid_range: [-15, 15]
      file: "fort.63"
      description: "Surface elevation at all nodes"
    - name: "velocity"
      unit: "m/s"
      valid_range: [0, 10]
      file: "fort.64"
      description: "Depth-averaged velocity (u,v) at all nodes"
    - name: "max_elevation"
      unit: "m"
      valid_range: [-15, 15]
      file: "maxele.63"
      description: "Maximum water surface elevation"
    - name: "max_velocity"
      unit: "m/s"
      valid_range: [0, 10]
      file: "maxvel.63"
      description: "Maximum velocity magnitude"
    - name: "wind_velocity_output"
      unit: "m/s"
      valid_range: [0, 100]
      file: "fort.73"
      description: "Wind speed (u,v) at all nodes"
    - name: "atmospheric_pressure_output"
      unit: "m H2O"
      valid_range: [9.5, 10.5]
      file: "fort.74"
      description: "Atmospheric pressure at all nodes"

  station:
    - name: "station_elevation"
      unit: "m"
      file: "fort.61"
    - name: "station_velocity"
      unit: "m/s"
      file: "fort.62"

  formats:
    - "ASCII (NOUT* = 1)"
    - "Sparse ASCII (NOUT* = 4)"
    - "netCDF3/4 (NOUT* = 5)"
    - "XDMF (for ParaView)"

known_issues:
  - id: "dt_001"
    description: "Depth sign convention: positive = below geoid. Invert DEM elevations."
    severity: "silent"
  - id: "dt_002"
    description: "G must be 9.81 m/s2 with spherical coordinates (ICS=2)"
    severity: "silent"
  - id: "dt_003"
    description: "Atmospheric pressure must be in meters of water, not Pa or mb"
    severity: "silent"
  - id: "dt_006"
    description: "DTDP timestep must satisfy CFL condition or oscillations grow"
    severity: "silent"
  - id: "dt_007"
    description: "OWI wind files require exact header format — off-by-one causes wrong wind locations"
    severity: "silent"
  - id: "dt_009"
    description: "Hot start files are binary and not portable between compilers"
    severity: "crash"
