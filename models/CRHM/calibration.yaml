      both stay in the pool.
    type: continuous
    units: "d"
    default: 0.0
    range: [0.0, 40.0]
    hard_bounds: [0.0, 200.0]
    model_declared_range: [0, 200]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "uniform_all_hru"
    activation: always
    confidence: low
    cite: >
      No dag influence edge — retained UNPRUNED (same SKILL.md s4 "Fang
      section 14" source). RANGE: 0-40 d inside the declared <0 to 200>.
      Measured max|Δ| 0.009 m3/s at the DEFAULT soil drainage — conditionally
      live only, which is exactly what the kit's screen is for.
      confidence: low.
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^Netroute ssrKstorage <[^>]*>\\n(\\S+)"

  - name: gwKstorage
    description: >
      Groundwater routing storage constant — the slow store's outflow damping
      and, with gwLag, the control on how flat the winter recession is.
      Measured LIVE here (max|Δ| 0.73 m3/s — small but nonzero, unlike
      Yingluoxia).
    type: continuous
    units: "d"
    default: 50.0
    range: [5.0, 150.0]
    hard_bounds: [0.0, 200.0]
    model_declared_range: [0, 200]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "uniform_all_hru"
    activation: always
    confidence: medium
    cite: >
      No dag influence edge — retained UNPRUNED as a KI-documented lever.
      SKILL.md "GW parameters: gwKstorage = 50-80 ... for sustained winter
      baseflow"; every validated mountain basin uses 50. RANGE: 5-150 d — from
      an almost-undamped store to twice the documented maximum — inside the
      declared <0 to 200>, no clamping.
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^Netroute gwKstorage <[^>]*>\\n(\\S+)"

  - name: gwLag
    description: >
      Groundwater lag — the delay between recharge and baseflow arrival at the
      outlet, i.e. how far into winter the previous melt season's water is
      still being released. Measured live (max|Δ| 0.55 m3/s).
    type: continuous
    units: "h"
    default: 500.0
    range: [24.0, 2000.0]
    hard_bounds: [0.0, 10000.0]
    model_declared_range: [0, 10000]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "uniform_all_hru"
    activation: always
    confidence: medium
    cite: >
      No dag influence edge — retained UNPRUNED as a KI-documented lever.
      SKILL.md "GW parameters: gwLag = 500-1000" for sustained winter
      baseflow. RANGE: 24 h (effectively no lag) to 2000 h (~83 d), inside
      <0 to 10000>. NOTE (SKILL.md, and the dag's own caveat on basinflow_s):
      the Netroute lag stores carry NO output state variable, so a large gwLag
      leaves a structural ~4-5% un-closable storage residual in decadal
      water-balance checks — a documented diagnostic artefact, not a mass
      error.
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^Netroute gwLag <[^>]*>\\n(\\S+)"

# -----------------------------------------------------------------------------
# HARD FEASIBILITY — checked BEFORE a run, so an infeasible vector costs
# nothing.
# -----------------------------------------------------------------------------
constraints:
  # CRHM ITSELF hard-errors on the first ("rechr_max cannot be greater than
  # soil_moist_max in hru = 1", verified live at this site); the calibrated
  # scalars are the Valley-HRU values and both profiles keep every other HRU's
  # ratio weaker than this one, so the scalar inequality covers all 3 HRUs.
  - "soil_rechr_max <= soil_moist_max"
  # Ordering of the rain/snow mixing band. CRHM tolerates the inversion
  # numerically (verified live) but an all-snow threshold above the all-rain
  # threshold is physically meaningless — the mixing band degenerates.
  - "tmax_allsnow <= tmax_allrain"

# -----------------------------------------------------------------------------
# HOW TO RUN + SCORE ONE CANDIDATE
#
# runner mode: the kit writes the candidate vector to kdt_params.json in the
# eval workdir and sets KDT_CALIB_PARAMS. tools/calib_run.py reads it, injects
# it into a byte-pinned copy of the validated Dore deck, reads every value
# back out of the generated .prj, runs the real CRHM binary via
# s5_execution/run_crhm.py, parses via s5_execution/parse_crhm_output.py,
# scores with ki_tools_common.metrics.all_metrics against the
# contract-enforced HYDAT 08KA001 series and writes {nse, kge, pbias, rmse,
# r, ..., "__kdt__": {applied_params, case_id, scored_obs, ...}}. One eval is
# ~2.2 s wall clock (11 simulated years, 3 HRUs, hourly) because the DEM /
# delineation / deck template / 11-year hourly NASA POWER dore.obs / HYDAT
# CSV are all staged once under outputs/crhm_08ka001_dore/ and reused
# read-only.
# -----------------------------------------------------------------------------
runner:
  kind: subprocess
  command: ["python3", "tools/calib_run.py", "--workdir", "{workdir}",
            "--out", "{metrics_json}"]
  metrics_file: "{metrics_json}"
  cwd: "{ki_path}"
  timeout: 900          # soft hint only; the kit runs unbounded by default

# -----------------------------------------------------------------------------
strategy:
  cost_class: cheap                 # ~2.2 s per evaluation, fully staged inputs
  default_algorithm: dds
  algorithm_rationale: >
    Single-objective search (one target var, basinflow_s, determining metric
    NSE — no Pareto trade-off, so nsga2 does not apply) over a 26-parameter
    pool with CHEAP ~2.2 s evaluations, run through the kit's staged
    screen-then-calibrate protocol so the active dimension per stage stays
    small. DDS (Tolson & Shoemaker 2007) is purpose-built for exactly this
    shape — high-dimensional watershed-model calibration under a bounded
    evaluation budget, self-scaling its perturbation neighbourhood from
    global to local as the budget is spent — and commissioning shows a
    response surface with one sharp basin per lever (Kstorage collapses
    symmetrically at both bounds) rather than the many-basin ruggedness that
    would demand sceua's population complexes. Posterior parameter intervals
    are not this capability's goal, so dream's ~10x budget premium buys
    nothing the gate scores.
  max_evaluations: 500
  staged: true                      # sensitivity screen -> calibrate few -> escalate
  staged_start: 6
  staged_step: 4

  holdout:
    kind: years
    protocol: blocked_temporal
    grouping_key: water_year
    generalization_axis: temporal
    fraction: 0.5
    calibration_window: ["2006-01-01", "2010-12-31"]
    holdout_window: ["2011-01-01", "2015-12-31"]
    rationale: >
      A contiguous blocked-temporal split is the default for a single-gauge
      point_time_series streamflow obs (no site or region axis exists), and
      these two windows are EXACTLY the validated real_case's own cal/val
      split (cal NSE 0.7000 / val NSE 0.7116 at the default vector), so a
      calibrated result is directly comparable to the prior metric. The
      record is complete (1826 valid days in each block, no gaps — both
      populations asserted exactly by count, first/last date,
      min/max/range/mean and a sha256 of the scored (date, value) pairs in
      tools/calib_run.py before any metric is computed), so an even 0.5
      fraction maximises held-out power; the holdout block spans both the
      wettest (2012, obs max 132 m3/s) and driest years, giving the split
      genuine differential character.
    cite: >
      Blocked (contiguous) temporal hold-out for a single-gauge daily
      streamflow series follows the split-sample tradition of Klemes 1986
      (doi 10.1080/02626668609491024) and the calibration/validation guidance
      of Moriasi et al. 2015 "Hydrologic and Water Quality Models: Use,
      Calibration, and Validation" (doi 10.13031/trans.58.10715), in this
      KI's gathered papers. The window boundaries are inherited from the
      validated real_case CRHM_20260629T124938Z.
    confidence: high
