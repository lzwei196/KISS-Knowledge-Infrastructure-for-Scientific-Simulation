    affected_components:
    - set_trial_parameters.py ZTOPV / ZBOTV
    - trialParams.nc heightCanopyTop / heightCanopyBottom
    - paramCheck.f90:128
  remedy:
    action: Pass --veg_scheme so canopy heights are read from MPTABLE.TBL HVT/HVB for the table vegTypeIndex
      actually uses.
    tool_to_run: tools/s4_parameters/set_trial_parameters.py --from_hwsd --veg_scheme <usgs|modis>
    manual_steps:
    - python tools/s4_parameters/set_trial_parameters.py --attributes_nc settings/attributes.nc --output_nc
      settings/trialParams.nc --from_hwsd --veg_scheme modis
    - 'Confirm: ncdump -v heightCanopyTop,heightCanopyBottom settings/trialParams.nc  # top > bottom on
      EVERY hru'
    - --veg_scheme must equal the vegeParTbl decision (SKILL.md Sec 2c).
    prevention: 'set_trial_parameters.py now raises with this explanation when the legacy ZTOPV/ZBOTV
