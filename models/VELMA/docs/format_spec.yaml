    not 50-75'', ''Check WP fraction: should be 0.15-0.30, not 15-30'', ''Apply: fraction = percent /
    100'']; Vali'
  severity: silent
- id: dt_velma_007
  symptom: '[SURROGATE only: tools/run_velma.py, NOT EPA VELMA] Simulated discharge (m3/s) is orders of
    magnitude different from observed gauge data even though the hydrograph shape looks reasonable. NSE
    is strongly negative despite good timing of peaks and recessions.

    '
  diagnosis: 'Basin area in hectares instead of km2 in the mm/d-to-m3/s conversion; VELMA converts runoff
    depth (mm/d) to discharge (m3/s) using: Q_m3s = runoff_mmd * area_km2 * 1e6 / 86400 / 1000. If area
    is provided in hectares (1 km2 = 100 ha), the conversion factor is 100x too large, inflating simulated
    disch'
  remedy: 'Ensure basin area is in km2; divide by 100 if provided in hectares; parse_output_velma.py;
    [''Verify basin area units: --basin-area-km2 should be in km2'', ''Cross-check with GIS shapefile
    area'', ''If area in ha, divide by 100; if in m2, divide by 1e6'']; Always cross-validate basin area
    against shapefil'
  severity: silent
- id: dt_velma_008
  symptom: '[SURROGATE only: tools/run_velma.py, NOT EPA VELMA] Model crashes with a JSON parsing error
    or KeyError when reading forcing data. Error message references missing keys such as ''precip_mm'',
    ''temp_K'', or ''srad_Wm2'' in the forcing JSON file.

    '
  diagnosis: 'Forcing JSON file uses wrong key names or has corrupted structure; The VELMA Python tools
    expect forcing data as a JSON file with specific keys: ''dates'', ''precip_mm'' (array of daily mm/d),
    ''temp_K'' (array of daily K), and ''srad_Wm2'' (array of daily W/m2). If keys are misspelled (e.g.,
    ''precipitation'
  remedy: 'Verify forcing JSON keys match expected schema and all arrays have equal length; [''Open forcing.json
    and check for keys: dates, precip_mm, temp_K, srad_Wm2'', ''Verify all arrays have the same length
    (one entry per day)'', ''Check for trailing commas, BOM characters, or non-UTF8 encoding'', ''Rerun
    conver'
  severity: fatal
- id: dt_velma_009
  symptom: '[SURROGATE only: tools/run_velma.py, NOT EPA VELMA] NetCDF read fails with ''variable not
    found'' error when extracting CMFD forcing data. The error references variable names like ''prec'',
    ''tmp'', or ''dswrf'' that do not exist in the file.

