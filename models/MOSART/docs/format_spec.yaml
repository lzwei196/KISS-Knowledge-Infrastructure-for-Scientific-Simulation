# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: MOSART
  language: python
  implementation:
    id: mosartwmpy
    version: 1.0.x (mosartwmpy, PyPI/conda-forge)
    provenance: Python; IMMM-SFA / PNNL (Thurber, Xu, Vernon) numba-JIT translation of the Fortran MOSART-WM
      routing + water-management science, with BMI interface.
  scientific_reference_version: MOSART-WM (MOSART routing of Li et al. 2013 + Voisin et al. 2013 water
    management, with ISTARF reservoir release)
inputs:
  forcing:
  - name: surface_runoff (QOVER)
    unit: mm/s
    category: forcing
    source_kind: forcing
    model_input_format: gridded NetCDF runoff field, or BMI surface_runoff_flux set per timestep
    notes: BMI standard name surface_runoff_flux -> state hillslope_surface_runoff. Converted mm/s ->
      m3/s (x 0.001 x land_fraction x area) -> m/s internally and back each update().
  - name: subsurface_runoff (QDRAI)
    unit: mm/s
    category: forcing
    source_kind: forcing
    model_input_format: gridded NetCDF runoff field, or BMI subsurface_runoff_flux
    notes: BMI standard name subsurface_runoff_flux -> state hillslope_subsurface_runoff; enters the subnetwork
      channel as lateral inflow.
  - name: wetland_runoff (QGWL, optional)
    unit: mm/s
    category: forcing
    source_kind: forcing
    model_input_format: gridded NetCDF runoff field (optional)
    notes: Glacier/wetland/lake runoff; negative values gated to direct-to-ocean flow when river depth
      below minimum.
  - name: total_demand (totalDemand)
    unit: m3/s
    category: forcing
    source_kind: forcing
    model_input_format: gridded NetCDF demand field with monthly time coordinate, or BMI demand_flux
    notes: BMI standard name demand_flux -> state grid_cell_demand_rate; read monthly and padded to nearest
      past month. Active only when water_management.enabled.
  parameters:
  - name: main channel geometry (rlen, rslp, rwid, rwid0, rdep)
    unit: m, m/m
    category: parameter
    source_kind: dataset_lookup
    model_input_format: grid domain NetCDF fields
    notes: Main channel length, slope, bankfull width, floodplain width, bankfull depth; missing floodplain
      width rwid0 makes flood water disappear.
  - name: subnetwork (tributary) geometry (tslp, twid)
    unit: m, m/m
    category: parameter
    source_kind: dataset_lookup
    model_input_format: grid domain NetCDF fields
  - name: hillslope geometry (hslp, gxr)
    unit: m/m, m^-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: grid domain NetCDF fields
    notes: Hillslope topographic slope and drainage density (channel length per unit area).
  - name: Manning's roughness (nr, nt, nh)
    unit: s/m^(1/3)
    category: parameter
    source_kind: calibrated
    model_input_format: grid domain NetCDF fields
    notes: Main-channel / tributary / overland roughness; the principal (and nearly only) calibrated parameter
      family in MOSART.
  - name: grid topology (ID, dnID, fdir, lat, lon, area, areaTotal, areaTotal2, frac)
    unit: -, degrees, m2, 0-1
    category: parameter
    source_kind: dataset_lookup
    model_input_format: grid domain NetCDF fields
    notes: Defines river-network connectivity (dnID=-1 marks outlet) and per-cell drainage area/fraction.
  - name: reservoir parameters (GRAND_ID, GRID_CELL_INDEX, CAP_MCM, AREA_SKM, DAM_HGT_M, ISTARF coefficients)
    unit: million m3, km2, m
    category: parameter
    source_kind: dataset_lookup
    model_input_format: reservoirs.nc
    notes: GRanD reservoir geometry + ISTARF release coefficients. CAP_MCM x 1e6 -> m3; AREA_SKM x 1e6
      -> m2 internally.
  - name: reservoir dependency database
    unit: '-'
    category: parameter
    source_kind: dataset_lookup
    model_input_format: dependency_database.parquet
    notes: Maps dependent grid cells to the reservoir(s) that supply them.
  - name: mean monthly reservoir flow and demand schedules
    unit: m3/s
    category: parameter
    source_kind: dataset_lookup
    model_input_format: mean_monthly_reservoir_flow.parquet, mean_monthly_reservoir_demand.parquet
    notes: Monthly climatological inflow/demand schedules driving ISTARF and minimum-flow release rules.
  initial_conditions:
  - name: model state restart
    unit: mixed
    category: initial_condition
    source_kind: user_provided
    model_input_format: '{name}_restart_{year}_{month}_{day}.nc'
    notes: Full snapshot of routing and reservoir state arrays; restart date reflects the day after the
      last completed output day. Absent a restart, all state arrays zero-initialize.
  boundary_conditions:
  - name: simulation.timestep
    unit: s
    category: boundary_condition
    source_kind: user_provided
    model_input_format: config.yaml
    notes: Main routing timestep (default 10800 s).
  - name: simulation.subcycles / simulation.routing_iterations
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: config.yaml
    notes: Subdivide the timestep; effective routing resolution = timestep/subcycles/routing_iterations
      (default ~720 s). Too few for large/steep basins causes CFL violation.
  - name: simulation.output_resolution / output_file_frequency
    unit: s, -
    category: boundary_condition
    source_kind: user_provided
    model_input_format: config.yaml
    notes: output_resolution must be an integer multiple of timestep (averaging window); file frequency
      monthly/yearly avoids one-timestep-per-file output.
  - name: water_management.enabled
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: config.yaml
    notes: Structural switch turning the reservoir + demand + irrigation system on/off; off gives natural
      (unregulated) flow.
  - name: water_management.reservoirs.enable_istarf
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: config.yaml
    notes: Selects ISTARF statistical target-release rules vs the simpler inflow-matching regulation.
  - name: grid.subdomain
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: config.yaml
    notes: List of lat,lon pairs subsetting basins; reduces memory/runtime versus full-domain runs.
  - name: runoff.read_from_file
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: config.yaml
    notes: When true, file runoff overwrites BMI-set runoff each timestep; set false to drive runoff via
      BMI set_value.
outputs:
  primary:
  - name: RIVER_DISCHARGE_OVER_LAND_LIQ
    unit: m3/s
    description: Main-channel outflow / basin river discharge (BMI runoff_land, outgoing_water_volume_transport_along_river_channel);
      the gauge-comparable streamflow output.
    validation_rank: 1
    emitted_in: output NetCDF
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Gauge cell must be mapped to the correct outlet cell of the river network; topology errors put
          discharge at the wrong cell.
        - With water_management.enabled, simulated flow is regulated; compare against naturalized obs
          or run unregulated for natural-flow validation.
      - obs_shape: spatial_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - spatial_pattern_match
        determining_metric: nse
        caveats:
        - Multi-gauge / gridded comparison requires consistent network construction across resolutions.
      detrending_options:
      - none
  - name: channel_outflow
    unit: m3/s
    description: Outflow from a single grid cell's main channel.
    validation_rank: 2
    emitted_in: output NetCDF
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Single-cell outflow; for basin discharge use RIVER_DISCHARGE_OVER_LAND_LIQ at the outlet.
      detrending_options:
      - none
  - name: STORAGE_LIQ
    unit: m3
    description: Total routing storage (channel + subnetwork + hillslope) on the grid; BMI surface_water_amount.
    validation_rank: 3
    emitted_in: output NetCDF
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Total-water-storage observations (e.g., gravimetric anomalies) measure a broader column than
          routing storage alone; compare anomalies, not absolute storage.
      detrending_options:
      - first_difference
  - name: WRM_STORAGE
    unit: m3
    description: Reservoir storage; BMI reservoir_water_amount.
    validation_rank: 4
    emitted_in: output NetCDF
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compared per reservoir; ISTARF release rules approximate operations and will not match individual
          dam decisions exactly.
      detrending_options:
      - none
  - name: WRM_SUPPLY
    unit: m3/s
    description: Water supply delivered to a grid cell from reservoir/channel extraction.
    validation_rank: 5
    emitted_in: output NetCDF
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - magnitude_accuracy
        - trend_match
        determining_metric: pbias
        caveats:
        - Observed water deliveries/withdrawals are aggregated and influenced by management decisions
          the model approximates; compare aggregates/trends, not cell-level instantaneous values.
      detrending_options:
      - linear_residual
  - name: WRM_DEFICIT
    unit: m3
    description: Cumulative unmet water-supply demand for a grid cell.
    validation_rank: 6
    emitted_in: output NetCDF
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - magnitude_accuracy
        - trend_match
        determining_metric: pbias
        caveats:
        - Deficit depends on the prescribed demand input; only meaningful relative to the supplied demand
          forcing.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: T001
  symptom: Discharge is approximately 86400x higher than expected values
  diagnosis: Runoff input units are mm/day but config assumes mm/s (no conversion applied)
  remedy: "Convert runoff to mm/s before use:\n  Q_mm_s = Q_mm_day / 86400.0\nOr use convert_runoff_forcing.py\
    \ with --source-units mm/day\n"
- id: T002
  symptom: Discharge is approximately 1000x higher than expected
  diagnosis: Runoff units are m/s but mosartwmpy expects mm/s
  remedy: "Convert m/s to mm/s:\n  Q_mm_s = Q_m_s * 1000.0\nOr use convert_runoff_forcing.py with --source-units\
    \ m/s\n"
- id: T003
  symptom: All output variables are zero or NaN
  diagnosis: Grid mosart_mask excludes all cells, or runoff file has zero values at grid locations
  remedy: 'Check mosart_mask: ds = xr.open_dataset(grid_path); print((ds[''fdir''].values > 0).sum())

    Check runoff has data: ds = xr.open_dataset(runoff_path); print(ds[''QOVER''].values.max())

    Verify lat/lon coordinates match exactly between grid and forcing files

    '
- id: T004
  symptom: 'ValueError: Current simulation date not within time bounds of runoff input file'
  diagnosis: Simulation period extends beyond the temporal coverage of the runoff forcing file
  remedy: 'Ensure start_date and end_date in config.yaml fall within runoff file time range.

    For multi-file input, ensure all {Y}/{M}/{D} file combinations exist on disk.

    Check: ds = xr.open_dataset(runoff_path); print(ds.time.values[[0,-1]])

    '
- id: T005
  symptom: Model appears frozen for 30-60 seconds at the start of first run
  diagnosis: Numba JIT compilation of routing kernels on first invocation (cached afterward)
  remedy: 'This is normal behavior. Numba compiles to native code on first call.

    Subsequent runs use cached .nbi files and start immediately.

    Do not kill the process during this initial compilation phase.

    '
- id: T006
  symptom: MemoryError during model initialization on full CONUS grid
  diagnosis: Full CONUS NLDAS grid has ~100k cells; each cell stores ~50 float64 state arrays
  remedy: "Use grid.subdomain in config.yaml to limit to basins of interest:\n  grid:\n    subdomain:\n\
    \      - 45.52,-122.68\nThis dramatically reduces memory and runtime.\n"
- id: T007
  symptom: Reservoir storage becomes negative
  diagnosis: Reservoir evaporation exceeds inflow + storage in regulation() function
  remedy: 'The regulation() function includes floor logic: reservoir_storage = max(0, ...).

    If negative values persist, check reservoir_potential_evaporation units.

    Evaporation uses: 1e6 * mm/s * dt * area_km2 — verify area is in km² not m².

    '
- id: T008
  symptom: NaN values propagate through discharge after several timesteps
  diagnosis: Division by zero in Manning's equation when slope or hydraulic radius is zero
  remedy: 'Verify grid file has no zero slopes (model replaces 0 with minimums but NaN bypasses this).

    Check for NaN in grid: for v in [''hslp'',''tslp'',''rslp'']: print(v, np.isnan(ds[v].values).sum())

    Replace NaN slopes with minimum values (0.005 hillslope, 0.0001 channel).

    '
- id: T009
  symptom: Reservoir capacity (CAP_MCM) in reservoir.nc seems too small — all reservoirs overflow
  diagnosis: Reservoir storage capacity is in million m³ in the input file, loaded and converted internally
  remedy: 'Verify input values: CAP_MCM=1.0 means 1 million m³ = 1e6 m³.

    If values appear to be already in m³ (very large), they will be multiplied again.

    Check: ds = xr.open_dataset(reservoir_path); print(ds[''CAP_MCM''].values[:5])

    Grand Coulee ~11,795 MCM; Hoover Dam ~36,703 MCM — these are correct in CAP_MCM'
- id: T010
  symptom: Water demand is fully met but discharge at gauge is much lower than observed
  diagnosis: Irrigation extraction removes too much water from channel; extraction fraction too high
  remedy: 'Check irrigation_extraction_maximum_fraction in Parameters (default 0.5).

    Consider reducing water_management demand values or using subdomain to isolate issues.

    Compare with water_management.enabled: false to see natural vs regulated flow.

    '
- id: T011
  symptom: TypeError or AttributeError with numpy 2.0
  diagnosis: mosartwmpy requires numpy<2.0 due to numba API compatibility
  remedy: "Downgrade numpy:\n  pip install \"numpy>=1.20,<2.0\"\nOr create a fresh virtual environment:\n\
    \  python -m venv venv && source venv/bin/activate\n  pip install mosartwmpy\n"
- id: T012
  symptom: Simulation runs but output NetCDF has only one timestep per file
  diagnosis: output_file_frequency set to 'daily' instead of 'monthly'
  remedy: "Set in config.yaml:\n  simulation:\n    output_file_frequency: monthly   # or yearly\nDaily\
    \ frequency creates one file per day with one timestep each.\n"
- id: T013
  symptom: Restart file date does not match expected simulation end date
  diagnosis: Restart file date parsed from filename pattern YYYY_MM_DD which may differ from end_date
  remedy: 'Restart files are named {name}_restart_{year}_{month}_{day}.nc.

    The date reflects the simulation state at that point, which is the day AFTER

    the last completed output day (because time advances before writing).

    This is expected behavior.

    '
- id: T014
  symptom: Runoff spikes unrealistically at monthly boundaries
  diagnosis: Multi-file runoff switching causes discontinuity; method='pad' selects closest past time
  remedy: 'Ensure runoff files overlap or have continuous time coverage.

    The ''pad'' selection method means the last available timestep in the current file

    is used until a new file provides a closer timestamp.

    Consider using single continuous runoff files spanning the full simulation period.

    '
- id: T015
  symptom: Subdomain simulation produces empty output (all NaN)
  diagnosis: Subdomain coordinates don't fall within any active basin in the grid
  remedy: "Verify coordinates are within the grid extent:\n  ds = xr.open_dataset(grid_path)\n  print(f\"\
    Lat: {ds.lat.values.min()} to {ds.lat.values.max()}\")\n  print(f\"Lon: {ds.lon.values.min()} to {ds.lon.values.max()}\"\
    )\nEnsure coordinates are in (lat, lon) order, not (lon, lat).\nCheck that the nearest grid cel"
- id: T016
  symptom: BMI set_value for runoff has no effect on simulation
  diagnosis: When runoff.read_from_file is true, file values overwrite BMI-set values each timestep
  remedy: "Set in config.yaml:\n  runoff:\n    read_from_file: false\nThen provide runoff via BMI before\
    \ each update():\n  model.set_value('surface_runoff_flux', runoff_array)  # mm/s\n  model.update()\n"
- id: T017
  symptom: Reservoir surface area (AREA_SKM) appears to be in m² — reservoirs evaporate entire storage
  diagnosis: Reservoir evaporation formula uses 1e6 * evap * dt * AREA_SKM, assuming km²
  remedy: 'If AREA_SKM is already in m², the 1e6 multiplier causes 1 million × too much evaporation.

    Convert to km² in input file: AREA_SKM = area_m2 / 1e6

    Grand Coulee area is ~324 km² — check your values are in this range.

    '
- id: T018
  symptom: Channel depth grows without bound in flat terrain
  diagnosis: Very small channel slope (approaching zero) causes very slow outflow via Manning's equation
  remedy: 'The model replaces zero slopes with minimum values (0.0001 for channels).

    If NaN slopes exist in grid file, they bypass this replacement.

    Fix: ensure no NaN values in rslp variable of grid file.

    Consider increasing channel_slope_minimum if terrain is extremely flat.

    '
- id: T019
  symptom: Farmer ABM demand calculation fails silently, falls back to file-based demand
  diagnosis: FarmerABM requires specific input files (land_water_constraints, crop_prices, etc.)
  remedy: 'Check log for: "Water demand calculation for farmer ABM failed. Defaulting to precalculated
    values."

    Ensure all ABM input files exist at configured paths.

    If not using ABM, set water_management.demand.farmer_abm.enabled: false.

    '
- id: T020
  symptom: 'output_resolution: 43200 causes Exception at initialization'
  diagnosis: output_resolution must be >= timestep and evenly divisible by timestep
  remedy: "With default timestep=10800:\n  Valid: 10800, 21600, 32400, 43200(?), 86400\n  43200 / 10800\
    \ = 4.0 — this IS valid.\nThe error may instead be that output_resolution < timestep.\nCheck: output_resolution=3600\
    \ with timestep=10800 will fail.\nUse output_resolution: 86400 for standard daily output.\n"
- id: T021
  symptom: River discharge is exactly 0 at the gauge cell, but a neighbouring cell carries the full basin
    flow
  diagnosis: The gauge cell was made the terminal outlet (dnID == -1). mosartwmpy treats a dnID==-1 cell
    as the OCEAN outlet, so its RIVER_DISCHARGE_OVER_LAND_LIQ (runoff_land) is 0 — the basin discharge
    lands in the cell one step UPSTREAM. Interior gauges (not river mouths) must be THROUGH-cells.
  remedy: 'Do NOT terminate the network at an interior gauge. Redirect the primary outlet to

    a downstream sink so the gauge cell has a valid dnID and its channel_outflow == basin

    discharge. tools/build_mosart_grid.py does this automatically (steepest-descent inactive

    neighbour becomes a frac=0 terminal sink) a'
- id: T022
  symptom: No gridded runoff / QOVER-QDRAI file for a China basin; convert_grid_parameters --source-type
    merit produces nothing new
  diagnosis: MOSART is a routing model. It has no runoff-generation tool, and convert_grid_parameters
    only VALIDATES an existing grid (the merit flag builds no topology). No ERA5-Land/GSWP3/runoff product
    ships on the server.
  remedy: 'Run the VIC KI over the basin first (its soil/veg/forcing/global param persist under

    outputs/<basin>/vic_temp/); re-run vic_classic.exe -g global_param to regenerate per-cell

    flux, grid it (cols 16=OUT_RUNOFF 17=OUT_BASEFLOW, mm/day, skiprows=3), then

    convert_runoff_forcing.py --source-units mm/day.'
