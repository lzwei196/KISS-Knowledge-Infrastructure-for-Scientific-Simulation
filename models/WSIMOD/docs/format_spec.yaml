model:
  name: WSIMOD Knowledge Infrastructure v1.0.0
  domain: urban
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: Precipitation
    unit: m/timestep
    format: ''
    source: skill_md
  - name: Radiation
    unit: "MJ/m\xB2"
    format: ''
    source: skill_md
outputs:
  primary:
  - name: ET
    unit: m/timestep
    format: ''
    source: skill_md
  - name: Flood
    unit: unknown
    format: ''
    source: skill_md
  - name: discharge
    canonical_id: discharge
    unit: m3/s
  - name: water_surface_elevation
    canonical_id: water_surface_elevation
    unit: m
  - name: surcharge_volume
    canonical_id: surcharge_volume
    unit: m3
