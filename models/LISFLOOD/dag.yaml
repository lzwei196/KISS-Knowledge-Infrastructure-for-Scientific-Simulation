template_version: "3.5"

identity:
  model_id: "LISFLOOD"
  scientific_reference_version: "EC-JRC LISFLOOD (Van Der Knijff et al. 2010; Burek et al. 2013 Revised User Manual, JRC EUR 26162 EN) — distributed rainfall-runoff core of EFAS/GloFAS"
  implementation:
    id: "hydrocraft-lisflood"
    version: "lisflood-model v1.0.0 (hydrocraft-lisflood package)"
    provenance: "Python; EC-JRC LISFLOOD on the PCRaster Environmental Modelling Framework with a Numba JIT-compiled soil loop and channel routing."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "EUPL-1.2"
  repo_url: "https://github.com/ec-jrc/lisflood-code"

boundary:
  scope_in:
    - "Spatially distributed catchment-scale water balance and rainfall-runoff simulation"
    - "Snow accumulation, melt and glacier icemelt over sub-pixel elevation zones"
    - "Rainfall interception, 3-layer Van Genuchten soil moisture, and saturation-excess runoff"
    - "Two-box groundwater (upper quick-response zone, lower baseflow zone)"
    - "Kinematic-wave channel routing with optional split routing"
    - "Lake (Modified Puls) and reservoir (rule-curve) operations"
    - "Water abstraction / water use (domestic, industrial, livestock, energy, irrigation) and rice paddy / polder management"
    - "Flood and drought forecasting; climate- and land-use-change impact on water resources"
  scope_out:
    - "Full 2-D hydrodynamic flood-inundation / floodplain depth mapping (that is the separate LISFLOOD-FP model, not this distributed hydrological core)"
    - "Explicit scope_out / non-simulated processes are not declared in the official EC-JRC documentation"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Each grid cell is partitioned into aggregated land-cover classes (forest, impervious/sealed, water, irrigated, other); ET is computed per class and fluxes are weighted by class fraction before routing. Mass-balance closure on water is checked explicitly via the total water balance residual (twb). Timestep is configuration-dependent: sub-daily (e.g. DtSec=21600, 6-hourly) for flood events or daily (DtSec=86400) for long-term water balance, with channel routing sub-stepped at DtSecChannel; the optional EPIC crop coupling hard-requires daily DtSec=86400. Snow/icemelt and infiltration gating are thermally driven but the model does not close a surface energy budget."

inputs:
  forcing:
    - category: "forcing"
      name: "Precipitation (pr / P)"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "NetCDF stack or PCRaster map series (PrecipitationMaps)"
      notes: "Total liquid+solid precipitation; PrScaling converts from input unit to mm/timestep; negative values clipped to 0. Unit confusion (m/day, mm/3hr) is silent and shifts discharge ~1000x."
    - category: "forcing"
      name: "Average air temperature (ta / T_avg)"
      unit: "°C (or K when TemperatureInKelvin=1)"
      source_kind: "forcing"
      model_input_format: "NetCDF stack or PCRaster map series (TavgMaps)"
      notes: "Drives rain/snow partitioning and frost index; the TemperatureInKelvin flag must match the input units or snow thresholds shift by 273.15."
    - category: "forcing"
      name: "Reference (potential) evapotranspiration (et0 / ET0)"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "NetCDF stack or PCRaster map series (ET0Maps); preparable with LISVAP"
      notes: "Must be POTENTIAL ET; LISFLOOD reduces it internally via soil-moisture stress. Supplying actual ET silently double-reduces evaporation."
    - category: "forcing"
      name: "Potential open-water evaporation (e0 / EW0)"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "NetCDF stack or PCRaster map series (E0Maps); preparable with LISVAP"
      notes: "Penman open-water rate (~1.05 × et0); a distinct required input."
    - category: "forcing"
      name: "Potential bare-soil evaporation (ES0)"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "NetCDF stack or PCRaster map series; preparable with LISVAP"
      notes: "Potential evaporation from bare soil; reduced internally by soil-moisture availability."
  parameters:
    - category: "parameters"
      name: "Local Drainage Direction (Ldd)"
      unit: "PCRaster flow-direction code 1-9 (5=pit/outlet)"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster map"
      notes: "MUST be PCRaster encoding, NOT ArcGIS D8 (1,2,4,…,128); wrong encoding crashes or misroutes flow."
    - category: "parameters"
      name: "Channel geometry (ChanBottomWidth, ChanGrad, ChanLength, ChanManMaps, side slope, bankfull depth)"
      unit: "m / m·m⁻¹ / m / s·m^(-1/3)"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps"
      notes: "ChanGrad in m/m (not %), ChanLength in m (not km), ChanManMaps is Manning's n modified by the CalChanMan multiplier."
    - category: "parameters"
      name: "Elevation and elevation standard deviation (Elevation, elvstd)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "NetCDF or PCRaster map"
      notes: "Elevation StD drives sub-pixel 3-zone snow partitioning (DeltaTSnow)."
    - category: "parameters"
      name: "Saturated hydraulic conductivity per layer (MapKSat1/2/3 +Forest)"
      unit: "mm/day"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps"
      notes: "mm/day, NOT cm/day (HWSD) or m/s (SoilGrids)."
    - category: "parameters"
      name: "Van Genuchten alpha per layer (MapGenuAlpha1/2/3 +Forest)"
      unit: "1/cm"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps"
      notes: "1/cm, NOT 1/m; 100x error shifts the water-retention curve."
    - category: "parameters"
      name: "Van Genuchten pore-size index Lambda per layer (MapLambda1/2/3 +Forest)"
      unit: "dimensionless (Lambda = N-1)"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps"
    - category: "parameters"
      name: "Saturated and residual water content per layer (MapThetaSat / MapThetaRes 1/2/3 +Forest)"
      unit: "m³/m³"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps"
      notes: "ThetaRes typically ~0.01; ThetaSat is porosity."
    - category: "parameters"
      name: "Soil layer depths (SoilDepth1/2/3)"
      unit: "mm"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps"
      notes: "mm, NOT m or cm; SoilDepth1 ~50-300 mm, SoilDepth2/3 ~300-1500 mm."
    - category: "parameters"
      name: "Land-use fraction maps (Forest / Sealed-impervious / Water / Irrigation / Other)"
      unit: "0-1 fraction"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps"
      notes: "Per-class ET and fluxes are area-weighted by these fractions."
    - category: "parameters"
      name: "Leaf Area Index (LAI) per land-use class"
      unit: "m²/m² (monthly)"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster / NetCDF maps + day-of-year lookup table"
      notes: "Drives canopy interception and transpiration."
    - category: "parameters"
      name: "Lake / reservoir property tables (TabLakeArea, TabTotStorage, outflow parameters)"
      unit: "table"
      source_kind: "dataset_lookup"
      model_input_format: "Tab-separated text lookup tables keyed by water-body ID"
      notes: "Every lake/reservoir ID in the spatial map must have an entry in all Tab* tables or routing produces NaN."
    - category: "parameters"
      name: "UpperZoneTimeConstant"
      unit: "days (range ~1-100)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Quick groundwater (upper-zone) residence time; HIGH-sensitivity calibration parameter."
    - category: "parameters"
      name: "LowerZoneTimeConstant"
      unit: "days (range ~10-5000)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Lower-zone baseflow recession time constant; HIGH-sensitivity calibration parameter."
    - category: "parameters"
      name: "b_Xinanjiang"
      unit: "dimensionless (range ~0.01-1.0)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Saturation-excess runoff shape; HIGH-sensitivity. Near-0 gives a flashy, no-baseflow hydrograph."
    - category: "parameters"
      name: "PowerPrefFlow"
      unit: "dimensionless (range ~1.0-4.0)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Preferential (bypass) flow nonlinearity."
    - category: "parameters"
      name: "CalChanMan"
      unit: "dimensionless multiplier (range ~0.1-10, default 1.0)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Multiplier on ChanManMaps Manning's n — NOT a raw n value; setting it to 0.03-0.05 gives near-zero effective roughness."
    - category: "parameters"
      name: "SnowMeltCoef"
      unit: "mm/°C/day (range ~1.0-10.0)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Degree-day snowmelt rate; matters in snow-influenced basins."
    - category: "parameters"
      name: "GwPercValue"
      unit: "mm/day (range ~0.1-10.0)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Maximum upper-zone → lower-zone percolation."
    - category: "parameters"
      name: "GwLoss"
      unit: "mm/day (range ~0.0-5.0, default 0)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Groundwater loss to a deep aquifer; if it exceeds percolation, baseflow depletes."
    - category: "parameters"
      name: "LZThreshold"
      unit: "mm (range ~0-100)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Lower-zone no-outflow (baseflow cutoff) threshold."
    - category: "parameters"
      name: "LakeMultiplier"
      unit: "dimensionless (range ~0.1-10.0)"
      source_kind: "calibrated"
      model_input_format: "settings XML binding"
      notes: "Lake outflow scaling; matters in lake basins."
  initial_conditions:
    - category: "initial_conditions"
      name: "Soil moisture per layer (ThetaInit1/2/3Value → theta1/2/3)"
      unit: "m³/m³ (expected ~0.1-0.5)"
      source_kind: "user_provided"
      model_input_format: "settings XML *InitValue or warm-start EndMaps NetCDF"
    - category: "initial_conditions"
      name: "Upper-zone groundwater storage (UZInitValue → uz)"
      unit: "mm (expected ~0-100)"
      source_kind: "user_provided"
      model_input_format: "settings XML *InitValue or warm-start EndMaps NetCDF"
    - category: "initial_conditions"
      name: "Lower-zone groundwater storage (LZInitValue → lz)"
      unit: "mm (expected ~0-500)"
      source_kind: "user_provided"
      model_input_format: "settings XML *InitValue or warm-start EndMaps NetCDF"
      notes: "LZInitValue == -9999 triggers steady-state lower-zone initialisation."
    - category: "initial_conditions"
      name: "Snow cover / SWE per elevation zone (SnowCoverAInitValue +B,+C → snowcov)"
      unit: "mm (expected ~0-2000)"
      source_kind: "user_provided"
      model_input_format: "settings XML *InitValue or warm-start EndMaps NetCDF"
    - category: "initial_conditions"
      name: "Channel storage and second (split-routing) channel storage"
      unit: "m³"
      source_kind: "user_provided"
      model_input_format: "warm-start EndMaps NetCDF; cold-start constrained by channel geometry"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "MaskMap (active domain mask)"
      unit: "binary (1=active, 0=outside)"
      source_kind: "user_provided"
      model_input_format: "NetCDF or PCRaster map"
      notes: "Defines the gridded simulation domain; missing path is a fatal startup error."
    - category: "boundary_conditions"
      name: "Gauges / Outlets reporting points"
      unit: "map"
      source_kind: "user_provided"
      model_input_format: "PCRaster / NetCDF point maps"
      notes: "Define discharge reporting locations for .tss time series."
    - category: "boundary_conditions"
      name: "Simulation time window (CalendarDayStart, StepStart, StepEnd, DtSec, DtSecChannel)"
      unit: "calendar dates / step numbers / seconds"
      source_kind: "user_provided"
      model_input_format: "settings XML (lfuser)"
      notes: "StepStart/StepEnd must match CalendarDayStart convention; forcing time axis must align with DtSec or precip is mis-scaled."
    - category: "boundary_conditions"
      name: "Process-module switches (simulateLakes, simulateReservoirs, wateruse, SplitRouting, dynamicWave, openwaterevapo)"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "settings XML (lfoptions)"
      notes: "Select optional physics; unset options fall back to hardcoded defaults (e.g. dynamicWave off → kinematic-only routing)."
    - category: "boundary_conditions"
      name: "Unit / IO control switches (TemperatureInKelvin, readNetcdfStack, writeNetcdfStack, writeNetcdf, gridSizeUserDefined)"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "settings XML (lfoptions)"
      notes: "TemperatureInKelvin must match the ta input units; writeNetcdfStack and writeNetcdf both off yields only .tss output, no spatial maps."
    - category: "boundary_conditions"
      name: "Initialisation / restart mode (InitLisflood)"
      unit: "0=warm start | 1=cold start (spin-up)"
      source_kind: "user_provided"
      model_input_format: "settings XML option"
      notes: "Cold start sets state from *InitValue and writes EndMaps to PathInit; warm start reads saved end-state maps. Cold start forces channel sub-stepping NoRoutSteps=1."

processes:
  modules:
    - name: "readmeteo"
      role: "driver"
      brief: "Reads pr/ta/et0/e0/es0 forcing; applies PrScaling, TemperatureInKelvin handling and temperature lapse-rate; supplies all dynamic forcing."
    - name: "leafarea"
      role: "process_solver"
      brief: "Prescribes monthly LAI per vegetation fraction (rainfed/forest/irrigated), driving canopy interception and transpiration demand."
    - name: "snow"
      role: "process_solver"
      brief: "Partitions precipitation into rain vs snow over 3 sub-pixel elevation zones; computes seasonal snowmelt and glacier icemelt; the de-facto rain/snow partitioner feeding the soil column."
    - name: "frost"
      role: "process_solver"
      brief: "Computes soil FrostIndex (degree-days) and the isFrozenSoil flag that gates infiltration in the soil column."
    - name: "soilloop"
      role: "process_solver"
      brief: "Per-vegetation-fraction soil column: canopy interception/evaporation, then infiltration, preferential (bypass) flow, percolation, and 3-layer Van Genuchten soil-moisture update; Numba JIT-compiled inner loop."
    - name: "soil"
      role: "integrator"
      brief: "Aggregates per-fraction soil fluxes to pixel level: Xinanjiang saturation-excess surface runoff generation, percolation to groundwater, and preferential flow."
    - name: "groundwater"
      role: "process_solver"
      brief: "Two linear-reservoir zones — upper (quick, UpperZoneTimeConstant) and lower (baseflow, LowerZoneTimeConstant) — with UZ→LZ percolation, LZThreshold cutoff, and GwLoss to deep aquifer."
    - name: "surface_routing"
      role: "process_solver"
      brief: "Routes pixel surface runoff (overland) and upper-zone quick flow across the grid to the channel network."
    - name: "evapowater"
      role: "process_solver"
      brief: "Open-water and bare/sealed-soil evaporation using e0/es0; removes water from soil, open-water and sealed surfaces."
    - name: "routing"
      role: "integrator"
      brief: "Kinematic-wave channel routing (Manning) with NoRoutSteps sub-stepping at DtSecChannel; embeds lakes, reservoirs, polders, inflow inlets and transmission losses as in-channel structures; optional split routing."
    - name: "lakes"
      role: "optional_module"
      brief: "Lake outflow via the Modified Puls (level-pool) method, embedded in the channel network."
      applicability: "when simulateLakes enabled"
    - name: "reservoir"
      role: "optional_module"
      brief: "3-zone rule-curve reservoir operations (LakeMultiplier, normal/flood adjustment) interrupting the kinematic channel path."
      applicability: "when simulateReservoirs enabled"
    - name: "transmission"
      role: "optional_module"
      brief: "Channel transmission losses to the subsurface along the routed reach."
    - name: "waterabstraction"
      role: "optional_module"
      brief: "Surface/groundwater/lake-reservoir abstraction for domestic, industrial, livestock, energy and irrigation demand."
      applicability: "when wateruse enabled"
    - name: "riceirrigation"
      role: "optional_module"
      brief: "Rice paddy irrigation and polder water management."
      applicability: "when irrigation/rice enabled"
    - name: "waterlevel"
      role: "process_solver"
      brief: "Converts channel cross-section area / storage to water level and depth."
    - name: "waterbalance"
      role: "integrator"
      brief: "Computes the cumulative catchment mass-balance error (total water balance residual, twb) each timestep as a conservation check."
  internal_edges:
    - from: "Inputs"
      to: "readmeteo"
      kind: "consumes_input"
      brief: "Forcing maps and unit/scaling switches read each timestep."
    - from: "readmeteo"
      to: "snow"
      kind: "invokes"
      brief: "Precipitation and Tavg supplied to rain/snow partitioning."
    - from: "snow"
      to: "snowcov"
      kind: "writes_state"
      brief: "Snow water equivalent per elevation zone accumulated/melted."
    - from: "snow"
      to: "soilloop"
      kind: "invokes"
      brief: "Rain + snowmelt become available water for infiltration after interception."
    - from: "leafarea"
      to: "soilloop"
      kind: "invokes"
      brief: "LAI drives canopy interception and transpiration."
    - from: "frost"
      to: "soilloop"
      kind: "invokes"
      brief: "isFrozenSoil flag gates infiltration in the soil column."
    - from: "soilloop"
      to: "theta1/2/3"
      kind: "writes_state"
      brief: "Updates 3-layer Van Genuchten soil moisture states."
    - from: "soilloop"
      to: "soil"
      kind: "invokes"
      brief: "Per-fraction infiltration/percolation/preferential-flow passed up for pixel aggregation."
    - from: "soil"
      to: "groundwater"
      kind: "invokes"
      brief: "Percolation (gwperc) and GwLoss flux feed the 2-box groundwater."
    - from: "soil"
      to: "surface_routing"
      kind: "invokes"
      brief: "Saturation-excess surface runoff routed overland."
    - from: "groundwater"
      to: "uz"
      kind: "writes_state"
      brief: "Upper-zone quick storage updated via recession constant."
    - from: "groundwater"
      to: "lz"
      kind: "writes_state"
      brief: "Lower-zone baseflow storage updated via recession constant."
    - from: "groundwater"
      to: "surface_routing"
      kind: "invokes"
      brief: "Upper-zone quick outflow adds to overland routing."
    - from: "groundwater"
      to: "routing"
      kind: "invokes"
      brief: "Lower-zone baseflow outflow enters the channel network."
    - from: "surface_routing"
      to: "routing"
      kind: "invokes"
      brief: "Overland-routed runoff delivered to channel cells."
    - from: "evapowater"
      to: "routing"
      kind: "invokes"
      brief: "Open-water evaporation removes water from channel/lake/reservoir storage."
    - from: "lakes"
      to: "routing"
      kind: "invokes"
      brief: "Lake outflow modifies in-channel discharge."
    - from: "reservoir"
      to: "routing"
      kind: "invokes"
      brief: "Reservoir operations alter downstream channel discharge."
    - from: "transmission"
      to: "routing"
      kind: "invokes"
      brief: "Transmission losses remove water from the routed channel reach."
    - from: "waterabstraction"
      to: "groundwater"
      kind: "reads_state"
      brief: "Abstraction can draw the lower zone below LZThreshold, stopping channel outflow."
    - from: "waterabstraction"
      to: "routing"
      kind: "invokes"
      brief: "Abstraction removes water from channel sources."
    - from: "routing"
      to: "waterlevel"
      kind: "invokes"
      brief: "Channel cross-section area converted to water level/depth."
    - from: "routing"
      to: "Outputs"
      kind: "produces_output"
      brief: "Channel discharge (dis) at every channel pixel and gauge .tss are the primary outputs."
    - from: "waterbalance"
      to: "Outputs"
      kind: "produces_output"
      brief: "Total water balance residual (twb) emitted as a mass-conservation check."

states:
  variables:
    - name: "theta1/2/3"
      unit: "m³/m³"
      role: "prognostic"
    - name: "W1a/W1b/W2"
      unit: "mm"
      role: "prognostic"
    - name: "uz"
      unit: "mm"
      role: "prognostic"
    - name: "lz"
      unit: "mm"
      role: "prognostic"
    - name: "snowcov"
      unit: "mm"
      role: "prognostic"
    - name: "FrostIndex"
      unit: "degree-days"
      role: "prognostic"
    - name: "Interception (CumInterception)"
      unit: "mm"
      role: "prognostic"
    - name: "DSLR (days since last rain)"
      unit: "days"
      role: "prognostic"
    - name: "ChanM3 / ChanM3Kin / Chan2M3Kin"
      unit: "m³"
      role: "prognostic"
    - name: "ChanQ / ChanQKin"
      unit: "m³/s"
      role: "diagnostic"
    - name: "TotalCrossSectionArea"
      unit: "m²"
      role: "diagnostic"
    - name: "DischargeM3Out (cumulative outlet outflow)"
      unit: "m³"
      role: "accumulator"
    - name: "LZInflowCUM / GwLossCUM"
      unit: "mm"
      role: "accumulator"
    - name: "TotalPrecipitationWB / twb (water-balance residual)"
      unit: "mm"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "dis"
    validation_rank: 1
    unit: "m³/s"
    description: "River channel discharge at every channel pixel (primary product); also written as gauge-point .tss time series."
    emitted_in: "dis.nc / *.tss"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - temporal_pattern_match
            - magnitude_accuracy
            - timing_accuracy
          determining_metric: "nse"
          caveats:
            - "Gauge-point discharge vs a routed pixel; ensure the model gauge pixel maps to the correct upstream area."
            - "Acceptance thresholds (NSE/KGE >0.7 good, 0.5-0.7 acceptable; |PBIAS| <10% good, <25% acceptable) are run-time scoring policy, not model knowledge."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - spatial_pattern_match
            - magnitude_accuracy
          determining_metric: "csi"
          caveats:
            - "Distributed discharge fields are typically only sparsely observed; comparison is usually at gauged sub-reaches."
      detrending_options:
        - none
  - var: "snowcov"
    validation_rank: 3
    unit: "mm"
    description: "Snow water equivalent (snow cover) aggregated over sub-pixel elevation zones."
    emitted_in: "snowcov.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - spatial_pattern_match
            - timing_accuracy
          determining_metric: "csi"
          caveats:
            - "Remote-sensing SWE/snow-cover-area products differ in definition (SCA fraction vs SWE depth); match the quantity before scoring."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - temporal_pattern_match
            - timing_accuracy
          determining_metric: "nse"
          caveats:
            - "Point SWE (e.g. snow pillow) is sub-pixel; sub-pixel elevation-zone aggregation limits exact magnitude match."
      detrending_options:
        - none
  - var: "theta1/2/3"
    validation_rank: 2
    unit: "m³/m³"
    description: "Volumetric soil moisture per Van Genuchten layer."
    emitted_in: "theta1.nc / theta2.nc / theta3.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - spatial_pattern_match
            - temporal_pattern_match
          determining_metric: "nse"
          caveats:
            - "Satellite soil-moisture (e.g. surface ~5 cm) maps mainly to the topsoil layer, not subsoil; depth support must be matched."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - temporal_pattern_match
          determining_metric: "nse"
          caveats:
            - "In-situ probes are point-depth specific; anomaly/temporal correlation is more defensible than absolute volumetric match."
      detrending_options:
        - none
        - linear_residual
  - var: "twb"
    unit: "mm"
    description: "Total water balance residual over the catchment — a mass-conservation diagnostic, not a physical observable."
    emitted_in: "twb.nc"
    observability:
      comparable_obs_shapes: []
      detrending_options:
        - none

