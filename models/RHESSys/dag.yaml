      short_citation: "Mengistu et al. 2016"
      doi: "10.4236/ojmh.2016.62007"
      note: "Monte-Carlo calibration; Ksat0 (k) exerts stronger control on NSE than m; calibrated k, m and streamflow strongly depend on patch resolution."
    tague2004_rhessys_model:
      short_citation: "Tague & Band 2004"
      doi: "10.1175/1087-3562(2004)8<1:RRHSSO>2.0.CO;2"
      note: "Foundational RHESSys description; establishes Ksat0, m, soil depth and groundwater bypass/recession coefficients as primary streamflow controls."
    garcia2013_rhessys_temperature:
      short_citation: "Garcia et al. 2013"
      doi: "10.1002/wrcr.20140"
      note: "Five temperature interpolation/lapse-rate methods; snowmelt and rain-snow-zone streamflow sensitive to temperature input, transpiration/NPP modest."
    tague2012_rhessys_param_input_uncertainty:
      short_citation: "Tague et al. 2012"
      doi: "10.1007/s10021-012-9545-z"
      note: "Precipitation extrapolation and soil parameters strongly shape runoff and ET in a semi-arid urbanizing catchment."

safety:
  hazards:
    - id: "precip_units_m_per_day"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in mm/day instead of m/day inflates all water fluxes ~1000x."
      severity: "silent"
    - id: "temperature_kelvin_not_celsius"
      kind: "weather_file_semantic"
      description: "Temperature in Kelvin instead of Celsius causes catastrophic ET and instant soil drying."
      severity: "silent"
    - id: "kdown_direct_without_diffuse_clearsky_fallback"
      kind: "weather_file_semantic"
      description: "Kdown_direct supplied without Kdown_diffuse makes RHESSys zero both and recompute clear-sky radiation, giving every day maximum radiation and collapsing vegetation in 3-5 yr in humid climates."
      severity: "degraded"
    - id: "constant_tmax_tmin_range_breaks_cloud_correction"
      kind: "weather_file_semantic"
      description: "tmax/tmin built as tavg +/- fixed offset gives constant diurnal range, disabling MTCLIM/Bristow-Campbell cloud correction (same clear-sky fraction daily)."
      severity: "degraded"
    - id: "missing_daytime_rain_duration_zeros_transpiration"
      kind: "weather_file_semantic"
      description: "Without a daytime_rain_duration sequence, rain_duration defaults to 86400 s (all day) for any precip, zeroing transpiration on every rainy day (3-10x low annual transpiration in monsoon climates)."
      severity: "silent"
    - id: "soil_depth_cm_not_m"
      kind: "soil_semantic"
      description: "Soil depth in cm instead of m gives unrealistically deep soil; model never saturates and baseflow dominates for decades."
      severity: "silent"
    - id: "ksat_cmhr_not_mday"
      kind: "soil_semantic"
      description: "Ksat in cm/hr instead of m/day (factor 0.24) produces a flashy hydrograph with no baseflow."
      severity: "silent"
    - id: "porosity_percent_gt_one_crash"
      kind: "soil_semantic"
      description: "Porosity in percent (>1.0) instead of fraction causes division errors / NaN crash."
      severity: "fatal"
    - id: "psi_air_entry_kpa_not_m"
      kind: "soil_semantic"
      description: "psi_air_entry in kPa instead of m head (factor 9.81) distorts the water-retention curve."
      severity: "silent"
    - id: "slope_aspect_radians_not_degrees"
      kind: "soil_semantic"
      description: "Slope/aspect in radians (<6.28) instead of degrees wrecks radiation partitioning and lateral routing (dt_007)."
      severity: "silent"
    - id: "area_km2_not_m2"
      kind: "soil_semantic"
      description: "Patch/zone area in km^2 instead of m^2 makes all area-weighted fluxes 1e6 too small (dt_008)."
      severity: "silent"
    - id: "cn_pools_g_not_kg_per_m2"
      kind: "initial_condition_semantic"
      description: "Initial C/N pools in g/m^2 instead of kg/m^2 cause 1000x runaway growth or enormous soil carbon."
      severity: "silent"
    - id: "missing_bgc_spinup"
      kind: "initial_condition_semantic"
      description: "BGC mode (-g) without 200-500 yr spin-up: vegetation dies (LAI=0) or allocation crashes in the first year."
      severity: "silent"
    - id: "deciduous_dormant_start_no_leafc_transfer"
      kind: "initial_condition_semantic"
      description: "Deciduous dormant-season start with only cs.leafc_store set (not cs.leafc_transfer) gives no leaves in Year 1 because annual allocation has not yet run."
      severity: "silent"
    - id: "worldfile_value_name_misalignment"
      kind: "parser_semantic"
      description: "Worldfile value/name ordering, blank lines or tab/space issues misalign the value-name parser, causing wrong parameter assignment or segfault; fixed per-level variable counts must match."
      severity: "fatal_or_silent"
    - id: "flowtable_patch_id_mismatch_segfault"
      kind: "control_semantic"
      description: "Flow table (-r) patch IDs not matching worldfile patch IDs cause a segfault during routing initialization."
      severity: "fatal"
    - id: "tec_print_events_before_start_date_no_output"
      kind: "control_semantic"
      description: "TEC print events scheduled before the -st start date are ignored, producing empty or no output files."
      severity: "silent"
    - id: "zero_sensitivity_multiplier_div_by_zero"
      kind: "control_semantic"
      description: "Sensitivity multiplier set to 0 via -s/-sv zeros Ksat or m, causing division-by-zero / infinite loop in drainage routines."
      severity: "fatal"
    - id: "canopy_cover_fraction_sum_gt_one"
      kind: "control_semantic"
      description: "Canopy stratum cover fractions summing >1.0 per patch over-count interception and break the water balance (dt_017)."
      severity: "silent"
    - id: "inconsistent_soil_params_negative_sat_deficit"
      kind: "numerical_instability"
      description: "Inconsistent soil params (high Ksat with low porosity, small m with deep soil) cause negative saturation deficit / NaN propagation and growing water-balance residual (dt_018)."
      severity: "fatal"
    - id: "rhessys74_canopy_stratum_line1160_trans_zero_bug"
      kind: "numerical_instability"
      description: "RHESSys 7.4 source bug in canopy_stratum_daily_F.c (zeros the wrong rnet_evap term) drives transpiration to exactly zero on any day with negative daytime net radiation; requires a source patch and recompile."
      severity: "degraded"
  validation_limits:
    - "Daily forcing timestep cannot resolve sub-daily storm or diurnal-flux processes."
    - "Comparing a small RHESSys domain against a large full-basin gauge via specific discharge assumes uniform runoff generation over the full gauge drainage area; calibrating to a full-basin gauge corrects basin-average response, not sub-basin physics."
    - "Without -g the model runs hydrology only with static vegetation; carbon/nitrogen outputs are not meaningful."
    - "NetCDF gridded forcing is unavailable unless the binary was compiled with the NetCDF reader (otherwise only ASCII forcing)."
  warnings:
    - "Hydrologic stores reach equilibrium quickly, but BGC pools (soil C, litter C, plant N) require centuries of spin-up; trust C/N outputs only from a spun-up state saved via the TEC output_current_state event."
    - "Lateral subsurface routing overwrites each patch's vertical-cycle saturation-deficit state after patch_daily_F runs; debugging patch water balance must account for this within-day ordering."
    - "Plant-microbe mineral-N competition (resolve_sminn_competition) couples canopy N-uptake demand across strata to patch-level soil N; isolated stratum analysis can mislead."
  assumptions:
    - statement: "RHESSys is point/quasi-distributed over a nested World > Basin > Hillslope > Zone > Patch > Stratum hierarchy of arbitrarily-shaped surface elements, not a regular grid."
      scope: "spatial discretization"
      source: "Tague & Band 2004 (Earth Interactions) and RHESSys wiki Spatial-Input-Requirements"
      status: "adopted"
    - statement: "Lateral hydrology uses TOPMODEL wetness-index redistribution by default and explicit DHSVM-style patch-to-patch flow-table routing when -r is supplied."
      scope: "subsurface/overland routing"
      source: "RHESSys wiki About-RHESSys (Beven & Kirkby 1979; Wigmosta et al. 1994)"
      status: "adopted"
    - statement: "Mass-balance closure holds for water and for C/N pools; the daily ET path is a demand-side flux calculation, so no global surface energy budget is conserved as a closure term despite snowpack/canopy energy computations."
      scope: "conservation / closure"
      source: "WBAL/ET and snowpack module behavior in RHESSys source and docs"
      status: "adopted"
    - statement: "Ecophysiology (photosynthesis, respiration, allocation, decomposition) is adapted from Biome-BGC with CENTURY-style soil organic-matter pools."
      scope: "carbon/nitrogen process representation"
      source: "Tague & Band 2004; Running & Coughlan 1988 / Running & Hunt 1993 (cited in RHESSys docs)"
      status: "adopted"
    - statement: "Several physical constants (SOIL1-4 C:N ratios, RAD2PAR=0.5, growth-respiration coefficients, KELVIN=273.16, Green-Ampt wetting-front = 0.76 x psi_air_entry) are compiled in and not exposed in .def files."
      scope: "hardcoded coefficients"
      source: "include/phys_constants.h and hydro/compute_infiltration.c in RHESSys source"
      status: "adopted"
