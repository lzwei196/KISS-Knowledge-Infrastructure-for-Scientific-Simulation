safety:
  hazards:
    - id: "precip_units_m_we_per_year"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in m w.e./year instead of kg m-2 s-1/year-1; ~1000x too little accumulation, rapid ice loss."
      severity: "fatal"
    - id: "smb_units_m_we_per_year"
      kind: "weather_file_semantic"
      description: "climatic_mass_balance in m w.e./year instead of kg m-2 flux; surface mass balance 1000x too small."
      severity: "fatal"
    - id: "air_temp_degC_not_kelvin"
      kind: "weather_file_semantic"
      description: "air_temp / ice_surface_temp in degC without a correct units attribute; negative-kelvin crash or no ice forms."
      severity: "fatal"
    - id: "bheatflx_mW_not_W"
      kind: "weather_file_semantic"
      description: "Geothermal flux in mW m-2 read as W m-2 (~1000x too high); basal temps pinned at pressure-melting, excessive basal melt — no crash."
      severity: "silent"
    - id: "ocean_melt_per_day_not_year"
      kind: "weather_file_semantic"
      description: "Ocean/sub-shelf melt rate in m/day instead of m/year (365x); all ice shelves disappear within a few steps."
      severity: "silent"
    - id: "theta_ocean_kelvin_not_degC"
      kind: "weather_file_semantic"
      description: "PICO theta_ocean supplied in kelvin; PICO expects degC, biasing sub-shelf melt."
      severity: "silent"
    - id: "delta_T_double_converted"
      kind: "weather_file_semantic"
      description: "Anomaly delta_T converted degC->K by adding 273.15; anomalies are unit-equivalent, producing a ~273 K offset."
      severity: "silent"
    - id: "thk_or_grid_km_not_m"
      kind: "soil_semantic"
      description: "Thickness or x/y/projection coordinates in km read as m; CFL violation (thk) or 1000x wrong domain (coords)."
      severity: "fatal"
    - id: "missing_proj_metadata"
      kind: "soil_semantic"
      description: "Missing/incorrect PROJ attribute; PISM cannot recompute lon/lat, geometry shifted/distorted."
      severity: "degraded"
    - id: "grid_registration_mismatch"
      kind: "soil_semantic"
      description: "Corner vs center registration disagrees with input data; half-cell geometry offset."
      severity: "degraded"
    - id: "variable_name_not_pism_convention"
      kind: "parser_semantic"
      description: "Input variables not named to PISM conventions (topg/thk/precipitation/air_temp) or identified by CF standard_name; variable not found or defaults silently used."
      severity: "fatal_or_silent"
    - id: "calendar_mismatch"
      kind: "control_semantic"
      description: "Forcing-file calendar differs from PISM -calendar (e.g. standard vs 365_day); seasonal cycle shifted, accumulating offset."
      severity: "silent"
    - id: "forcing_axis_does_not_cover_run"
      kind: "control_semantic"
      description: "Forcing time axis does not span the run period; PISM cannot interpolate the forcing."
      severity: "fatal"
    - id: "Lz_below_max_thickness"
      kind: "soil_semantic"
      description: "Vertical ice-domain top Lz below maximum ice thickness; simulation crashes."
      severity: "fatal"
    - id: "cfl_dt_collapse"
      kind: "numerical_instability"
      description: "Adaptive dt shrinks to seconds (CFL) from extreme velocities / thin ice on steep bed, often a downstream symptom of wrong input units."
      severity: "fatal"
    - id: "ssa_solver_divergence"
      kind: "numerical_instability"
      description: "SSA SNES/KSP fails to converge at shelf fronts / grounding lines under extreme velocity gradients."
      severity: "fatal"
    - id: "infinite_sliding_zero_yield_stress"
      kind: "control_semantic"
      description: "pseudo_plastic_q=0 with no topg_to_phi parameterization collapses basal yield stress to zero (runaway sliding)."
      severity: "silent"
    - id: "ice_free_smb_zero_not_negative"
      kind: "control_semantic"
      description: "SMB set to 0 in ice-free regions instead of strongly negative; transported ice spuriously accumulates and ice area grows."
      severity: "silent"
    - id: "spinup_too_short_drift"
      kind: "initial_condition_semantic"
      description: "Spinup shorter than thermal equilibration (~10,000+ yr) or starting transient from bootstrap instead of restart; persistent ice-volume drift contaminates forward runs."
      severity: "degraded"
    - id: "restart_missing_submodel_state"
      kind: "initial_condition_semantic"
      description: "Restart file omits sub-model state (enthalpy/basal temperatures); affected sub-models re-thermalize, breaking continuity."
      severity: "silent"
  validation_limits:
    - "Uses shallow / first-order stress balances (SIA, SSA, Blatter), not full Stokes; steep-topography outlet detail is approximate."
    - "Default -hydrology null is not map-plane mass-conserving (till water above threshold is permanently lost); use -hydrology routing where subglacial mass conservation matters."
    - "Atmosphere and ocean are not dynamically simulated; skill is bounded by the prescribed surface/ocean forcing and parameterizations (PDD, PICO)."
    - "Equilibrium fields require an adequate (10k-200k yr) spinup; absolute volume comparisons are spinup-conditioned."
  warnings:
    - "air_temp (PDD forcing) and ice_surface_temp ('surface given' boundary) are distinct; supplying the wrong one for the chosen surface model is a silent error."
    - "Bed deformation defaults to none; for runs >1000 yr a fixed bed (-bed_def none) is physically unrealistic (no GIA)."
    - "Volume/mass-change observations are the defensible target; absolute total volume reflects spinup state, not just forcing skill."
  assumptions:
    - statement: "PISM is a 3-D thermomechanically-coupled model whose state is 3D enthalpy plus 2D geometry/hydrology; comparisons treat the ice sheet as a gridded spatial field, not a point."
      scope: "all outputs"
      source: "https://www.pism.io/docs/manual/highlevelview/model-hierarchy.html"
      status: "adopted"
    - statement: "Mass closure is enforced in geometry evolution and energy is conserved across ice/subglacial/bedrock layers, but map-plane subglacial mass conservation holds only under -hydrology routing (the default null model loses excess till water)."
      scope: "closure / subglacial hydrology"
      source: "https://www.pism.io/docs/manual/modeling-choices/subglacier/hydrology.html"
      status: "adopted"
    - statement: "The model's own SIA flow-enhancement default is E=1.0 (pism_config.cdl); any E=3.0 seen in run wrappers is tooling, not the model default."
      scope: "stress_balance.sia.enhancement_factor"
      source: "PISM src/pism_config.cdl (stress_balance.sia.enhancement_factor)"
      status: "adopted"
    - statement: "Temperature inputs are treated as kelvin unless a correct UDUNITS units attribute marks degC; degC is conditionally accepted, not freely interchangeable, and anomaly fields (delta_T) must not be offset by 273.15."
      scope: "air_temp, ice_surface_temp, delta_T"
      source: "https://www.pism.io/docs/manual/initialization/bootstrapping.html and PISM surface forcing docs"
      status: "adopted"
