  - sediment
- ref: 'Moriasi et al. 2015 — Hydrologic and water quality models: performance measures and evaluation
    criteria (updated discharge/sediment/N-P tier tables)'
  doi: 10.13031/trans.58.10715
  needed_for:
  - discharge
  - sediment
- ref: A dedicated wflow_sbm SWE / snow-cover evaluation reporting point or spatial SWE NSE/RMSE/CSI tiers
    (fetched snow papers cover other models only)
  doi: unknown_not_fetched
  needed_for:
  - swe
- ref: A wflow_sbm actual-ET / soil-moisture spatial-pattern benchmark reporting a SPAEF or correlation
    pass-band
  doi: unknown_not_fetched
  needed_for:
