safety:
  hazards:
    - id: "weather_temperature_kelvin"
      kind: "weather_file_semantic"
      description: "Temperature supplied in Kelvin instead of degC; PyAEZ reads 290 K as 290 degC -> exponential vapor-pressure overflow -> NaN or >1e6 kg/ha yields."
      severity: "fatal_or_silent"
    - id: "weather_rh_percent_not_fraction"
      kind: "weather_file_semantic"
      description: "Relative humidity in 0-100 percent instead of 0-1 fraction; extreme saturation deficit -> ETo explodes -> LGP=0 everywhere."
      severity: "silent"
    - id: "weather_precip_monthly_not_daily"
      kind: "weather_file_semantic"
      description: "Precipitation in mm/month (or m/day) instead of mm/day; rainfall appears 28-31x too high -> LGP=365 / per-humid everywhere (or 1000x too low)."
      severity: "silent"
    - id: "weather_axis_order"
      kind: "weather_file_semantic"
      description: "Climate 3-D array supplied as (time, lat, lon); PyAEZ indexes time on the last axis (lat, lon, time), so each pixel reads the wrong time series -> spatial noise with correct means."
      severity: "silent"
    - id: "weather_radiation_units"
      kind: "weather_file_semantic"
      description: "Shortwave radiation in MJ/m^2/day instead of W/m^2 (~11.6x too low) -> depressed biomass and yield."
      severity: "silent"
    - id: "weather_wind_height"
      kind: "weather_file_semantic"
      description: "Wind at 10 m instead of the assumed 2 m reference height -> ETo ~20% high, fc2 over-stressed, LGP slightly short."
      severity: "degraded"
    - id: "lat_extent_swapped"
      kind: "control_semantic"
      description: "lat_min/lat_max swapped or wrong -> inverted ETo north-south gradient and wrong solar day lengths."
      severity: "silent"
    - id: "soil_smu_code_mismatch"
      kind: "soil_semantic"
      description: "SMU integer codes in the soil raster absent from the soil-characteristics table (e.g. HWSD v1 vs v2) -> fc4=0, soil-constrained yield zeroed over large areas."
      severity: "silent"
    - id: "slope_units_degrees"
      kind: "soil_semantic"
      description: "Slope supplied in degrees instead of percent -> terrain factor fc5 mis-classified, penalizing gentle terrain."
      severity: "degraded"
    - id: "spline_negative_overshoot"
      kind: "numerical_instability"
      description: "Cubic-spline interpolation of 12 monthly to 365 daily values can overshoot negative for precipitation/radiation/ETo and is not auto-clamped."
      severity: "degraded"
    - id: "default_soil_water_uniform"
      kind: "initial_condition_semantic"
      description: "Default Sa=100 mm/m and D=1.0 m used in place of site-specific values -> uniform fc2 and yield insensitive to precipitation; over-large Sa x D gives implausible LGP in arid regions."
      severity: "degraded"
    - id: "crop_param_sheet_mismatch"
      kind: "coefficient_runtime_silent_fallback"
      description: "Crop parameter table missing required columns or crop_name not matching a sheet -> KeyError/IndexError in Module II parameter read."
      severity: "fatal"
    - id: "lgp_not_imported_before_sim"
      kind: "control_semantic"
      description: "Module I LGP/lgpt5/lgpt10 not injected before the crop-cycle sweep -> fallback values give spatially uniform yield regardless of climate."
      severity: "silent"
    - id: "study_mask_excludes_all"
      kind: "control_semantic"
      description: "Mask/mask_value configured so every pixel is excluded or mask shape != climate (H, W) -> zero pixels processed, empty output, instant run."
      severity: "silent"
    - id: "yield_unit_kg_vs_ton_module6"
      kind: "control_semantic"
      description: "Module V emits kg/ha but Module VI economics expects ton/ha; caller must divide by 1000 or revenue is 1000x off."
      severity: "degraded"
  validation_limits:
    - "Not a daily mechanistic crop-growth model; cannot resolve field-scale management or sub-seasonal stress dynamics (GAEZ biomass approach)."
    - "Outputs are attainable (potential-envelope) yields and suitability classes, structurally above observed farm yields."
    - "Static long-term-climatology zoning: no inter-annual state memory; not intended for year-to-year yield time-series reproduction."
    - "7-soil-layer inputs and Excel-based soil/terrain suitability factors are newer/experimental in v2.2."
  warnings:
    - "ETo above ~15 mm/day or LGP pinned at 0 or 365 across the whole domain is a near-certain input-unit error, not a physical result."
    - "Physical ordering must hold: lgpt0 >= lgpt5 >= lgpt10, tsum0 >= tsum5 >= tsum10, all fc factors in 0-1, irrigated yield >= rainfed yield, and each constrained yield <= the prior module's yield."
  assumptions:
    - statement: "PyAEZ is a 2-D per-pixel static zoning model; each grid cell is evaluated independently with no lateral exchange and no inter-timestep state evolution."
      scope: "whole-model geometry"
      source: "GAEZ v4 model documentation (Fischer et al. 2021) and PyAEZ module structure"
      status: "adopted"
    - statement: "Mass-balance closure is asserted only for the reference-crop soil water balance that defines LGP; the biomass/yield chain is a GAEZ response model with multiplicative fc1..fc5 reductions, not a closed energy or carbon budget."
      scope: "closure semantics"
      source: "PyAEZ ClimateRegime/LGPCalc/BioMassCalc behavior and GAEZ methodology (Fischer et al. 2002)"
      status: "adopted"
    - statement: "fc1 is treated as a binary thermal screening factor (0 or 1), not a continuous 0-1 reduction, despite the KI describing it both ways."
      scope: "Module II thermal screening output"
      source: "PyAEZ ThermalScreening / getThermalReductionFactor behavior"
      status: "tentative"
    - statement: "Model-internal yields are kg/ha throughout Modules II-V; conversion to ton/ha for Module VI economics is the caller's responsibility and is assumed applied."
      scope: "yield units across the suitability-to-economics handoff"
      source: "PyAEZ EconomicSuitability.getNetRevenue input expectation"
      status: "adopted"
