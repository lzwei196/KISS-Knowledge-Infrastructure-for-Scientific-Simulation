template_version: "3.5"

identity:
  model_id: "ISSM"
  scientific_reference_version: "ISSM (Ice-sheet and Sea-level System Model) v2026.x finite-element ice-sheet/sea-level formulation"
  implementation:
    id: "issm-core"
    version: "2026.2"
    provenance: "C++/Fortran computational core (FemModel::Solve dispatch over *_core solvers) with Python/MATLAB model-object APIs; NASA JPL / UC Irvine (ISSMteam)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "BSD-3-Clause"
  repo_url: "https://github.com/ISSMteam/ISSM"

boundary:
  scope_in:
    - "Ice flow / stress balance (Full-Stokes, Higher-Order/Blatter-Pattyn, SSA/MacAyeal, SIA, L1L2, MOLHO)"
    - "Thermal state of ice (temperature or enthalpy formulation; basal melting)"
    - "Mass transport (depth-integrated thickness evolution, free-surface evolution)"
    - "Grounding-line migration (flotation criterion, sub-element parameterization)"
    - "Ice-front migration / calving (level-set method)"
    - "Subglacial hydrology (Shreve, SHAKTI, GlaDS, DC, PISM)"
    - "Surface mass balance parameterizations (forced SMB, components, PDD, gradients)"
    - "Basal friction / sliding laws (Budd and others)"
    - "Damage mechanics"
    - "Glacial isostatic adjustment / solid-earth deformation and sea-level fingerprints"
    - "Transient coupled forward simulation of the above"
  scope_out:
    - "Atmospheric / climate dynamics (SMB and surface temperature are prescribed forcings, not computed)"
    - "Full ocean circulation (ice/ocean heat flux uses simple parameterizations, e.g. Holland & Jenkins 1999)"
    - "Gridded hydrological basin runoff / streamflow"
  spatial: "3-D"
  temporal: "annual"
  closure: "both"
  notes: "Mass conservation via the depth-integrated thickness equation dH/dt = -div(H v_bar) + Mdot_s - Mdot_b; momentum conservation as Stokes flow with gravity-only body force; internal energy balance in the thermal solve. Operates on unstructured triangular (2-D) or prismatic (3-D extruded) finite-element meshes over projected (meter) domains, NOT a gridded grid; the dimensionality is 2-D or 3-D depending on the chosen flow approximation (SSA is 2-D depth-integrated; HO/FS require a 3-D extruded mesh). Internal time unit is years (all rates per-year); the sea-level equation additionally enforces global mass conservation."

inputs:
  forcing:
    - category: "forcing"
      name: "md.smb.mass_balance"
      unit: "m/yr ice equivalent"
      source_kind: "forcing"
      model_input_format: "per-vertex field on the mesh (or SMBcomponents: accumulation/runoff/evaporation)"
      notes: "Prescribed surface mass balance; SMBgradients variant is in mm/yr water equivalent. Common unit trap: datasets in kg/m^2/yr or mm w.e./yr must be converted via division by rho_ice (917)."
    - category: "forcing"
      name: "md.thermal.spctemperature"
      unit: "K"
      source_kind: "forcing"
      model_input_format: "per-vertex Dirichlet surface-temperature constraint (NaN = free node)"
      notes: "Surface temperature boundary forcing for the thermal solve; must be in Kelvin."
    - category: "forcing"
      name: "md.basalforcings.geothermalflux"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "per-vertex field (Neumann basal flux for thermal solve)"
      notes: "Common trap: geothermal datasets in mW/m^2 are off by 1000x."
    - category: "forcing"
      name: "md.basalforcings.groundedice_melting_rate / floatingice_melting_rate"
      unit: "m/yr"
      source_kind: "forcing"
      model_input_format: "per-vertex basal melt-rate fields"
      notes: "Floating-ice melt enters the shelf thickness budget; can also be computed by a basal-melt parameterization (linear/quadratic/PICO/ISMIP6)."
  parameters:
    - category: "parameters"
      name: "md.materials.rheology_B"
      unit: "Pa s^(1/n)"
      source_kind: "calibrated"
      model_input_format: "per-element ice-hardness field; default 1e8, typically set via paterson(T_in_K)"
      notes: "Glen's flow-law ice hardness (B convention). Trap: Glen's fluidity A must be converted as B = A^(-1/n), not used directly. Units reduce to Pa s^(1/3) only when n=3."
    - category: "parameters"
      name: "md.materials.rheology_n"
      unit: "-"
      source_kind: "default"
      model_input_format: "per-element Glen exponent (default 3)"
    - category: "parameters"
      name: "md.materials.rho_ice / rho_water / rho_freshwater"
      unit: "kg/m^3"
      source_kind: "default"
      model_input_format: "scalar densities (defaults 917 / 1023 / 1000)"
      notes: "rho_ice and rho_water set flotation and hydrostatic base; using freshwater 1000 instead of seawater 1023 for marine ice sheets shifts the grounding line."
    - category: "parameters"
      name: "md.materials.heatcapacity / latentheat / thermalconductivity / meltingpoint / beta"
      unit: "J/kg/K, J/kg, W/m/K, K, K/Pa"
      source_kind: "default"
      model_input_format: "scalar thermal constants (2093 / 3.34e5 / 2.4 / 273.15 / 9.8e-8)"
      notes: "Clausius-Clapeyron beta sets pressure-dependence of the melting point; meltingpoint is the 1-atm pressure-melting reference."
    - category: "parameters"
      name: "md.friction.coefficient"
      unit: "law-dependent (e.g. (Pa m^-1 s)^(1/2) for the default law)"
      source_kind: "calibrated"
      model_input_format: "per-vertex basal drag coefficient"
      notes: "MUST be 0 on floating ice (ocean_levelset < 0), else artificial drag slows shelves. Dimensional meaning depends on the configured friction law (p/q exponents)."
    - category: "parameters"
      name: "md.friction.p / md.friction.q"
      unit: "-"
      source_kind: "default"
      model_input_format: "per-element friction-law exponents"
    - category: "parameters"
      name: "md.geometry.bed"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "per-vertex bedrock topography (e.g. BedMachine)"
      notes: "Static substrate; consumed by the flotation criterion."
  initial_conditions:
    - category: "initial_conditions"
      name: "md.geometry.surface / base / thickness"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "per-vertex geometry fields; surface = base + thickness must hold"
      notes: "Initial ice geometry; thickness evolves prognostically in transient runs. Inconsistent surface/base/thickness causes solver instability. Trap: thickness in km is off by 1000x."
    - category: "initial_conditions"
      name: "md.initialization.vx / vy / vz"
      unit: "m/yr"
      source_kind: "user_provided"
      model_input_format: "per-vertex initial velocity (initial guess; transient flux)"
      notes: "For transient runs, seed from a prior Stressbalance solve; zero/NaN initial velocity gives a spurious first-step jump. Trap: m/s input is off by ~3.15e7."
    - category: "initial_conditions"
      name: "md.initialization.temperature"
      unit: "K"
      source_kind: "user_provided"
      model_input_format: "per-vertex initial temperature"
      notes: "Trap: Celsius input shifts by 273.15 and corrupts paterson()-derived rheology."
    - category: "initial_conditions"
      name: "md.initialization.pressure"
      unit: "Pa"
      source_kind: "derived"
      model_input_format: "per-vertex initial pressure (preferably computed from geometry)"
    - category: "initial_conditions"
      name: "md.initialization.waterfraction"
      unit: "0-1"
      source_kind: "user_provided"
      model_input_format: "per-vertex temperate-ice liquid water fraction (enthalpy formulation)"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "domain outline / ice-front contour"
      unit: "m (projected)"
      source_kind: "user_provided"
      model_input_format: "closed .exp Argus contour polygon in projected meters (read by expread)"
      notes: "Defines the meshed domain; Front contour sets the ice-shelf / marine boundary. Trap: degree (lat/lon) coordinates give a microscopic mesh; reproject to polar stereographic (EPSG:3031/3413)."
    - category: "boundary_conditions"
      name: "mesh resolution / hmin / hmax / gradation"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "triangle()/bamg() meshing controls in meters"
      notes: "Trap: resolution in km yields too-fine or too-coarse meshes."
    - category: "boundary_conditions"
      name: "md.mask.ocean_levelset / ice_levelset"
      unit: "- (signed distance)"
      source_kind: "user_provided"
      model_input_format: "per-vertex signed-distance levelsets; negative = inside (ocean_levelset<0 floating, ice_levelset<0 ice present)"
      notes: "Partitions grounded/floating and ice/no-ice. Inverted sign convention inverts the velocity pattern."
    - category: "boundary_conditions"
      name: "md.stressbalance.spcvx / spcvy"
      unit: "m/yr"
      source_kind: "user_provided"
      model_input_format: "per-vertex Dirichlet velocity constraint (NaN = free node)"
      notes: "Use NaN, not 0, for free nodes; 0 constrains the node and creates artificial frozen interiors/divides."
    - category: "boundary_conditions"
      name: "md.flowequation (approximation choice)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "flow-equation selector: SIA / SSA / L1L2 / MOLHO / HO / FS, assigned by setflowequation()"
      notes: "Structural switch selecting the momentum approximation; wrong choice for the regime degrades magnitudes (e.g. SSA on slow grounded interior)."
    - category: "boundary_conditions"
      name: "md.groundingline.migration / md.masstransport.stabilization / md.thermal.isenthalpy / md.friction.coupling"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "method/scheme selectors (migration scheme; stabilization 0-5; enthalpy on/off; effective-pressure coupling 0-4)"
      notes: "Numerical-scheme and formulation switches. Advection-dominated thermal/mass-transport equations require stabilization (artificial diffusion or SUPG)."
    - category: "boundary_conditions"
      name: "md.timestepping.start_time / final_time / time_step / time_adapt / cfl_coefficient"
      unit: "year"
      source_kind: "user_provided"
      model_input_format: "transient time-control fields"
      notes: "Time step must satisfy the CFL condition dt < dx/max(vel); too-large steps make transient thickness oscillate or diverge."

processes:
  modules:
    - name: "CorePointerFromSolutionEnum"
      role: "driver"
      brief: "Dispatch table mapping SolutionType (Stressbalance/Thermal/Masstransport/Transient/Hydrology/Damage/Esa/Love/Sampling/...) to the appropriate *_core entry."
    - name: "transient_core"
      role: "integrator"
      brief: "Master time-stepping driver: advances Time/Step, calls transient_step each dt, handles output/checkpoint/AMR and fixed vs CFL-adaptive timestepping."
    - name: "transient_step"
      role: "driver"
      brief: "Per-timestep physics orchestrator selecting and ordering active cores (thermal -> smb -> hydrology -> stressbalance -> damage -> movingfront -> bmb -> masstransport -> groundingline -> esa/slc -> sampling) via TransientIs* flags."
    - name: "stressbalance_core"
      role: "process_solver"
      brief: "Momentum/velocity solver; dispatches by flow approximation (SIA/SSA/L1L2/MOLHO/HO/FS), computing Vx,Vy,Vz,Vel,Pressure; pulls surface/bed slopes and basal melt as needed."
    - name: "StressbalanceAnalysis"
      role: "process_solver"
      brief: "Finite-element assembly and nonlinear/Newton solve of the ice-momentum equations using Glen's flow law (Matice rheology_B, rheology_n) and the basal Friction sliding law."
    - name: "thermal_core"
      role: "process_solver"
      brief: "Temperature/enthalpy solver; computes geothermal flux at entry, solves Temperature (or Enthalpy), then runs a coupled MeltingAnalysis for basal melt."
    - name: "smb_core"
      role: "process_solver"
      brief: "Surface mass balance module (SmbAnalysis); forced SMB or PDD-type models (SMBpdd / SMBd18opdd / SMBpddSicopolis) feeding the upper-surface boundary."
    - name: "masstransport_core"
      role: "process_solver"
      brief: "Geometry evolution; depth-averages velocity, solves the depth-integrated thickness/free-surface transport equation, updates Thickness/Surface/Base and triggers mesh-vertex repositioning."
    - name: "bmb_core"
      role: "process_solver"
      brief: "Basal mass balance / melt-rate computation; invoked standalone and re-entrantly from stressbalance_core (vertical velocity) and Full-Stokes shelf setup."
    - name: "groundingline_core"
      role: "process_solver"
      brief: "Migrates the grounding line via hydrostatic flotation on MaskOceanLevelset, updating the grounded/floating partition and geometry."
    - name: "movingfront_core"
      role: "process_solver"
      brief: "Calving-front / ice-front evolution via Levelset (MaskIceLevelset) advection (LevelsetAnalysis); calving module partly under construction."
    - name: "hydrology_core"
      role: "optional_module"
      brief: "Subglacial hydrology with model choices (Shreve, SHAKTI, GlaDS, DC efficient/inefficient, PISM, Tws, Armapw) and dedicated nonlinear solution sequences."
    - name: "damage_core"
      role: "optional_module"
      brief: "Damage-mechanics evolution (DamageEvolutionAnalysis) modifying effective ice rheology."
    - name: "esa_sealevelchange_love_cores"
      role: "optional_module"
      applicability: "when GIA/sea-level coupling enabled"
      brief: "Solid-earth and sea-level/GIA solvers (elastic adjustment, sea-level fingerprints, viscoelastic Love numbers) for coupled ice-Earth runs."
    - name: "depthaverage_extrude_cores"
      role: "allocator"
      brief: "3D<->2D field operators: depth-average velocity for transport, and extrude-from-base/top to rebuild 3D fields after free-surface solves."
    - name: "solutionsequences"
      role: "integrator"
      brief: "Shared linear/nonlinear/Newton/FCT/Schur-CG and model-specific (thermal, shakti, glads, stokes-coupling) iterative solvers used by all analyses."
  internal_edges:
    - from: "CorePointerFromSolutionEnum"
      to: "transient_core"
      kind: "invokes"
      brief: "TransientSolution dispatches to transient_core."
    - from: "transient_core"
      to: "transient_step"
      kind: "invokes"
      brief: "Called once per timestep within the time loop."
    - from: "transient_step"
      to: "thermal_core"
      kind: "invokes"
      brief: "Runs first when isthermal and 3-D domain."
    - from: "transient_step"
      to: "smb_core"
      kind: "invokes"
      brief: "Computes surface mass balance before geometry update."
    - from: "transient_step"
      to: "stressbalance_core"
      kind: "invokes"
      brief: "Runs only when step % sb_coupling_frequency == 0 or step == 1 (staggered coupling; velocity otherwise held constant)."
    - from: "transient_step"
      to: "bmb_core"
      kind: "invokes"
      brief: "Computes basal melt before mass transport."
    - from: "transient_step"
      to: "masstransport_core"
      kind: "invokes"
      brief: "Evolves geometry after velocity and melt are known."
    - from: "transient_step"
      to: "groundingline_core"
      kind: "invokes"
      brief: "Migrates the grounding line after mass transport."
    - from: "transient_step"
      to: "movingfront_core"
      kind: "invokes"
      brief: "Advects the calving front when ismovingfront is enabled."
    - from: "transient_step"
      to: "hydrology_core"
      kind: "invokes"
      brief: "Runs subglacial hydrology before stress balance when enabled."
    - from: "stressbalance_core"
      to: "StressbalanceAnalysis"
      kind: "invokes"
      brief: "Assembles and solves the momentum balance."
    - from: "stressbalance_core"
      to: "bmb_core"
      kind: "invokes"
      brief: "Undocumented re-entrant call: basal melt needed for vertical velocity and Full-Stokes shelf dampening."
    - from: "Inputs"
      to: "StressbalanceAnalysis"
      kind: "consumes_input"
      brief: "Glen flow-law viscosity from the ice-hardness field rheology_B and exponent n via Matice."
    - from: "Inputs"
      to: "StressbalanceAnalysis"
      kind: "consumes_input"
      brief: "Basal sliding law consumes the friction coefficient (md.friction.coefficient) at the grounded base."
    - from: "StressbalanceAnalysis"
      to: "velocity field (Vx, Vy, Vz, Vel)"
      kind: "writes_state"
      brief: "Produces velocity components and magnitude."
    - from: "StressbalanceAnalysis"
      to: "Pressure"
      kind: "writes_state"
      brief: "Produces the ice pressure field."
    - from: "thermal_core"
      to: "GeothermalFlux"
      kind: "writes_state"
      brief: "GeothermalFluxx computes basal heat flux at core entry."
    - from: "thermal_core"
      to: "Temperature"
      kind: "writes_state"
      brief: "Solves the ice temperature field (temperature formulation)."
    - from: "thermal_core"
      to: "Enthalpy"
      kind: "writes_state"
      brief: "Solves the ice enthalpy field (enthalpy formulation)."
    - from: "thermal_core"
      to: "BasalforcingsGroundediceMeltingRate / FloatingiceMeltingRate"
      kind: "writes_state"
      brief: "Coupled MeltingAnalysis produces basal melt from the thermal solution."
    - from: "Temperature"
      to: "StressbalanceAnalysis"
      kind: "reads_state"
      brief: "paterson()/Arrhenius rheology law makes ice hardness B temperature-dependent (Matice)."
    - from: "velocity field (Vx, Vy, Vz, Vel)"
      to: "masstransport_core"
      kind: "reads_state"
      brief: "Depth-averaged velocity drives the thickness transport equation."
    - from: "smb_core"
      to: "masstransport_core"
      kind: "invokes"
      brief: "SMB sets the upper-surface accumulation/ablation term in the thickness budget."
    - from: "bmb_core"
      to: "masstransport_core"
      kind: "invokes"
      brief: "Basal melt under shelves enters the thickness budget."
    - from: "masstransport_core"
      to: "Thickness"
      kind: "writes_state"
      brief: "Updates geometry (Thickness/Surface/Base); caches *Old fields and moves mesh vertices for all subsequent cores."
    - from: "groundingline_core"
      to: "MaskOceanLevelset (grounding-line levelset)"
      kind: "writes_state"
      brief: "Updates the grounded/floating partition via hydrostatic flotation."
    - from: "movingfront_core"
      to: "MaskIceLevelset (ice-front levelset)"
      kind: "writes_state"
      brief: "Advects the ice-front levelset (calving)."
    - from: "Inputs"
      to: "groundingline_core"
      kind: "consumes_input"
      brief: "Flotation criterion compares Base/Thickness against the bedrock (md.geometry.bed) and densities."
    - from: "transient_core"
      to: "Outputs"
      kind: "produces_output"
      brief: "Writes md.results.<SolutionType> at output frequency / final step."

states:
  variables:
    - name: "velocity field (Vx, Vy, Vz, Vel)"
      unit: "m/yr"
      role: "diagnostic"
    - name: "VxAverage, VyAverage"
      unit: "m/yr"
      role: "diagnostic"
    - name: "Pressure"
      unit: "Pa"
      role: "diagnostic"
    - name: "Thickness"
      unit: "m"
      role: "prognostic"
    - name: "Surface"
      unit: "m"
      role: "prognostic"
    - name: "Base"
      unit: "m"
      role: "prognostic"
    - name: "Temperature"
      unit: "K"
      role: "prognostic"
    - name: "Enthalpy"
      unit: "J/kg"
      role: "prognostic"
    - name: "Waterfraction"
      unit: "-"
      role: "prognostic"
    - name: "BasalforcingsGroundediceMeltingRate / FloatingiceMeltingRate"
      unit: "m/yr"
      role: "diagnostic"
    - name: "GeothermalFlux"
      unit: "W/m^2"
      role: "diagnostic"
    - name: "MaskOceanLevelset (grounding-line levelset)"
      unit: "- (signed distance)"
      role: "prognostic"
    - name: "MaskIceLevelset (ice-front levelset)"
      unit: "- (signed distance)"
      role: "prognostic"
    - name: "Damage / DamageDbar"
      unit: "-"
      role: "prognostic"
    - name: "Sealevel / Esa deformations"
      unit: "m"
      role: "prognostic"
    - name: "Time / Step / dt"
      unit: "yr"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "Vel (and Vx, Vy, Vz)"
    validation_rank: 3
    unit: "m/yr"
    description: "Ice velocity magnitude and components from the stress-balance solution."
    emitted_in: "md.results.StressbalanceSolution (or TransientSolution[i])"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Observed surface velocities (e.g. InSAR/feature-tracking) are surface fields; compare against modeled surface velocity, mind m/yr vs m/s unit convention."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Point/fluxgate velocity time series only meaningful for transient runs."
      detrending_options: ["none"]
  - var: "Thickness"
    validation_rank: 4
    unit: "m"
    description: "Evolved ice thickness from the depth-integrated mass-transport solution."
    emitted_in: "md.results.MasstransportSolution / TransientSolution[i].Thickness"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Compare against radar-sounding thickness; surface = base + thickness consistency required."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none", "linear_residual"]
  - var: "Surface (and Base)"
    validation_rank: 5
    unit: "m"
    description: "Free-surface elevation and floating-ice base elevation."
    emitted_in: "md.results.MasstransportSolution / TransientSolution[i].Surface"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Altimetry surface-elevation-change time series suit transient validation."
      detrending_options: ["none", "linear_residual"]
  - var: "Temperature"
    validation_rank: 2
    unit: "K"
    description: "Ice temperature field from the thermal solution."
    emitted_in: "md.results.ThermalSolution.Temperature"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Borehole temperature profiles are sparse point observations; bounded by surface T and the pressure-melting point."
      detrending_options: ["none"]
  - var: "grounding-line position (MaskOceanLevelset)"
    validation_rank: 6
    unit: "- (signed distance)"
    description: "Grounded/floating partition from the flotation criterion H = H_f."
    emitted_in: "md.results.TransientSolution[i] (MaskOceanLevelset)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Grounding-line location compared as a contour against InSAR-derived grounding lines; sensitive to rho_ice/rho_water and bed."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["timing_accuracy", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Grounding-line retreat/advance over time for transient runs."
      detrending_options: ["none"]
  - var: "IceVolume / GroundedArea / TotalSmb"
    validation_rank: 1
    unit: "m^3 / m^2 / m^3 ice eq"
    description: "Integrated transient diagnostics: total ice volume, grounded area, total surface mass balance per timestep."
    emitted_in: "md.results.TransientSolution[i]"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Basin/ice-sheet integrated mass change (e.g. gravimetry-derived) compared as an aggregate trend; evaluate trend match + magnitude of decadal-mean rather than raw r/NSE; mass-conservation diagnostics apply."
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["decadal_mean", "linear_residual", "none"]
  - var: "relative sea level (S)"
    validation_rank: 7
    unit: "m"
    description: "Gravitationally and deformationally self-consistent relative sea-level change (sea-level fingerprints)."
    emitted_in: "md.results (Slr / sea-level-change solution)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Sea-level fingerprint fields; only meaningful when GIA/sea-level coupling is active."
      detrending_options: ["none"]

