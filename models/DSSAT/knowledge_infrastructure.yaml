inputs:
  forcing:
  - name: SRAD (solar radiation)
    unit: MJ/m2/day
  - name: TMAX (max air temperature)
    unit: deg C
  - name: TMIN (min air temperature)
    unit: deg C
  - name: RAIN (precipitation)
    unit: mm/day
  - name: WIND
    unit: km/day
  - name: TDEW / DEWP (dew-point temperature)
    unit: deg C
  - name: RHUM (relative humidity)
    unit: '%'
  - name: PAR (photosynthetically active radiation)
    unit: moles/m2/day
  - name: CO2 (atmospheric CO2 concentration)
    unit: ppm
  parameters:
  - name: SALB (bare/dry surface albedo)
    unit: fraction
  - name: SLU1 (stage-1 soil evaporation upper limit U)
    unit: mm
  - name: SLDR (drainage rate SWCON)
    unit: fraction/day
  - name: SLRO (SCS runoff curve number CN)
    unit: dimensionless
  - name: SLNF (N mineralization factor)
    unit: fraction
  - name: SLPF (photosynthesis/growth factor)
    unit: fraction
  - name: SLB (layer bottom depth)
    unit: cm
  - name: SLLL (lower limit / wilting point LL)
    unit: cm3/cm3
  - name: SDUL (drained upper limit / field capacity DUL)
    unit: cm3/cm3
  - name: SSAT (saturated water content SAT)
    unit: cm3/cm3
  - name: SRGF (relative root growth factor)
    unit: fraction
  - name: SSKS (saturated hydraulic conductivity)
    unit: cm/hr
  - name: SBDM (bulk density)
    unit: g/cm3
  - name: SLOC (organic carbon)
    unit: '%'
  - name: SLCL/SLSI/SLCF (clay/silt/coarse-fragment fractions)
    unit: '%'
  - name: SLNI (total N)
    unit: '%'
  - name: SLHW/SLHB (pH in water / buffer)
    unit: pH units
  - name: SCEC (cation exchange capacity)
    unit: cmol/kg
  - name: TAV (annual mean air temperature)
    unit: deg C
  - name: AMP / TAMP (annual amplitude of monthly mean T)
    unit: deg C
  - name: LAT, LONG, ELEV, REFHT, WNDHT (station geometry)
    unit: degrees / m
  - name: CERES grain coefficients (e.g., P1, P2/P2O, P2R, P5, G1, G2, G3, PHINT, P1D, P1V, VEFF, THOT)
    unit: mixed (GDD, hours, GDD/h, count, g, dimensionless)
  - name: CROPGRO photothermal coefficients (CSDL, PPSEN, EM-FL, FL-SD, SD-PM, LFMAX, SLAVR, WTPSD, etc.)
    unit: mixed (h, 1/h, photothermal days, mg CO2/m2/s, cm2/g, g)
  - name: Ecotype coefficients
    unit: mixed
  - name: Species coefficients (cardinal temperatures, RUE, partitioning rules, MINIMA/MAXIMA bounds)
    unit: mixed
  initial_conditions:
  - name: SH2O (initial volumetric soil water by layer)
    unit: cm3/cm3
  - name: SNO3 (initial soil nitrate by layer)
    unit: ppm
  - name: SNH4 (initial soil ammonium by layer)
    unit: ppm
  - name: ICRES (initial surface residue mass)
    unit: kg/ha
  - name: ICREN, ICREP, ICRIP, ICRID (residue %N, %P, % incorporated, incorporation depth)
    unit: '% / cm'
  - name: PCR (previous crop code)
    unit: 2-char code
  - name: ICRT, ICND, ICRN, ICRE (initial root weight, nodules, root N, root growth params)
    unit: kg/ha / mixed
  - name: ICWD (water-table depth)
    unit: cm (-99 if none)
  - name: ICDAT (initial-conditions date)
    unit: YYDDD Julian
  boundary_conditions:
  - name: SDATE (simulation start date)
    unit: YYDDD Julian
  - name: NYERS (number of simulated years)
    unit: count
  - name: SMODEL (8-char crop model identifier)
    unit: code
  - name: WATER, NITRO, SYMBI, PHOSP, POTAS, DISES, CHEM, TILL (process toggles ISWWAT/ISWNIT/ISWSYM/ISWPHO/ISWPOT/ISWDIS/ISWCHE/ISWTIL)
    unit: Y/N
  - name: MEEVP / EVAPO (ET method)
    unit: code (R/P/F/Z/D/M/H/T)
  - name: MESEV (soil evaporation method)
    unit: code (S/R)
  - name: MEINF / INFIL (infiltration method)
    unit: code (S/N/R)
  - name: MEPHO / PHOTO (photosynthesis method)
    unit: code (L/C/R)
  - name: MEHYD / HYDRO (hydrology method)
    unit: code (R)
  - name: MESOM (SOM engine)
    unit: code (G/P)
  - name: MESOL (soil-layer redistribution)
    unit: code (1/2/3)
  - name: METMP (soil temperature method)
    unit: code (D/E)
  - name: MEGHG (greenhouse-gas method)
    unit: code (0/1)
  - name: MEWTH / WTHER (weather source)
    unit: code (M/G/S)
  - name: ICO2 (CO2 source switch)
    unit: code (M/D/W)
  - name: INCON (initial-conditions source)
    unit: code (M/S)
  - name: NSWIT (N routine selector)
    unit: code (1)
  - name: 'IPLTI, IIRRI, IFERI, IHARI (planting/irrigation/fertilizer/harvest mode: R reported, A automatic,
      N none, F/D variants)'
    unit: code
  - name: PDATE (planting date)
    unit: YYDDD Julian
  - name: PPOP (plant population)
    unit: plants/m2
  - name: PLRS (row spacing)
    unit: cm
  - name: PLDP (planting depth)
    unit: cm
  - name: INGENO (cultivar code)
    unit: 6-char code
  - name: Irrigation events {IDATE, IRVAL amount, IROP method, EFIR efficiency}
    unit: YYDDD / mm / code / fraction
  - name: Fertilizer events {FDATE, FAMN N rate, FAMP P rate, FAMK K rate, FMCD method code, FDEP depth}
    unit: YYDDD / kg/ha / code / cm
  - name: Organic-residue events
    unit: mixed
  - name: Tillage events
    unit: mixed
  - name: Chemical/pesticide events
    unit: mixed
  - name: Harvest events {HDATE, HPC harvest %, HBPC by-product %, HSTG harvest stage}
    unit: YYDDD / %
  - name: Automatic-management thresholds (PWDINF/PWDINL window, soil-moisture/temperature criteria, irrigation/fertilizer
      triggers)
    unit: mixed
  - name: WSTA (4-char weather-station code linking to .WTH)
    unit: code
  - name: ID_SOIL (10-char soil-profile code linking to .SOL pedon)
    unit: code
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
