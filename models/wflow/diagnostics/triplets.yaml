- id: dt_w032
  stage: s10_reservoir
  failure_domain: silent_error
  symptom:
    description: Reservoir flag is true but discharge is identical to no-reservoir
      run
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Reservoir location not on a river cell -- wflow silently ignores it
    explanation: 'wflow only activates reservoirs at cells where wflow_reservoirlocs
      > 0 AND the cell is on the river network (wflow_river = 1). If the reservoir
      location falls on a non-river cell (e.g., due to coordinate rounding on a coarse
      grid), the reservoir has zero effect on discharge. configure_reservoirs.py snaps
      to nearest river cell, but manual placement may miss this requirement.

      '
    affected_components:
    - wflow_reservoirlocs in staticmaps.nc
    - wflow_river in staticmaps.nc
  remedy:
    action: Verify reservoir locations overlap with river cells
    tool_to_run: configure_reservoirs
    manual_steps:
    - python -c "import xarray as xr; ds=xr.open_dataset('staticmaps.nc'); locs=ds.wflow_reservoirlocs;
      riv=ds.wflow_river; print('Res on river:', int((locs.where(riv==1)>0).sum()))"
    - If 0, rerun configure_reservoirs.py which snaps to river
    prevention: Always use configure_reservoirs.py to place reservoirs.
  severity: silent
  cross_references:
  - dt_w013
- id: dt_w033
  stage: s10_reservoir
  failure_domain: silent_error
  symptom:
    description: Reservoir evaporation is wrong or reservoir area much larger than
      grid cell
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Reservoir area in km^2 instead of m^2 -- 1e6 too small
    explanation: 'GRanD area_ori is in km^2. wflow reservoir_area expects m^2. If
      km^2 values are used directly, the reservoir area is 1e6 too small, causing
      evaporation to be negligible and the linear storage curve (S = A*H) to produce
      unrealistic water levels. Also, on coarse grids (0.25 deg ~ 625 km^2 per cell),
      very large reservoirs (>1000 km^2) are represented as a single point, which
      underestimates evaporation.

      '
    affected_components:
    - reservoir_area in staticmaps.nc
    - GRanD area_ori unit
  remedy:
    action: Multiply GRanD area (km^2) by 1e6 to get m^2
    tool_to_run: lookup_dams
    manual_steps:
    - 'Check: python -c "import xarray; print(xarray.open_dataset(''staticmaps.nc'').reservoir_area.max())"'
    - 'Expected range: 1e6 to 1e11 m^2 for typical reservoirs'
    - If max < 1e5, values are likely in km^2
    prevention: Always use lookup_dams.py which converts km^2 to m^2 automatically.
  severity: silent
  cross_references:
  - dt_w031
- id: dt_w036
  stage: s1_hydromt
  failure_domain: parameter_format
  symptom:
    description: 'Basin has MANY outlets (LDD == 5) instead of one. wflow runs with
      no error, but discharge at the gauge is far too low because most of the catchment
      drains into fabricated internal pits instead of reaching the outlet.

      '
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'The routing domain was rasterised from a basin SHAPEFILE while the
      LDD was derived from the coarse-grid DEM. The two disagree cell-for-cell, and
      dt_w014''s "target outside the mask -> set LDD = 5" rule then turns every misaligned
      edge cell into a pit.

      '
    explanation: 'dt_w014''s pit fallback is correct only when the mask already agrees
      with the flow network. A shapefile built from a finer DEM does not agree, so
      the fallback shatters the basin. At Xixian (0.1 deg) this produced 20 outlets
      in a 128-cell basin. The domain must instead be DELINEATED FROM the same network
      the model routes on -- trace upstream from the snapped outlet -- which makes
      it upstream-closed by construction, so the only pit is the true outlet.

      '
    affected_components:
    - wflow_subcatch in staticmaps.nc
    - wflow_ldd in staticmaps.nc
  remedy:
    action: Delineate the domain by upstream tracing on the model's own flow network
    tool_to_run: run_hydromt_build.py
    manual_steps:
    - 'Check the s1 build output: n_outlets MUST be 1'
    - python -c "import xarray,numpy; d=xarray.open_dataset('staticmaps.nc'); print(int(numpy.nansum(d.wflow_ldd.values==5)))"
    - If > 1, rebuild -- do NOT hand-edit individual pits
    - Also check basin_area_km2 against the gauge's published area
    prevention: 'run_hydromt_build.py now traces the domain from the flow network
      and FAILS when n_outlets != 1 rather than returning a fragmented basin.

      '
  severity: silent
  cross_references:
  - dt_w014
  - dt_w027
  - dt_w015
  - dt_w037
- id: dt_w037
  stage: s1_hydromt
  failure_domain: parameter_format
  symptom:
    description: 'On a flat/floodplain basin the delineated area is far off the published
      catchment area, and the snapped outlet sits tens of km from the gauge.

      '
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: D8 derived from a nearest-neighbour-resampled DEM on low-relief terrain
    explanation: 'Neighbouring coarse cells on a floodplain differ by only a few metres,
      so resampling noise -- not terrain -- decides the drainage direction. At Xixian
      the coarse-DEM network snapped the outlet ~30 km away and got the area +13%
      wrong; MERIT-Hydro''s corrected D8 gave -0.2%.

      '
    affected_components:
    - wflow_ldd in staticmaps.nc
    - delineated basin area
  remedy:
    action: Upscale MERIT-Hydro's corrected 3-arcsec D8 instead of resampling a raw
      DEM
    tool_to_run: run_hydromt_build.py --merit_hydro_dir <dir>
    manual_steps:
    - Extract the 5x5 deg tile from /mnt/datasets/MERIT_Hydro/v1.0.1/{dir,upa}_<block>.tar
    - Pass --merit_hydro_dir and --expected_area_km2 (published gauge area)
    - Verify area_error_pct is within a few percent
    prevention: Use MERIT-Hydro for ANY basin without strong relief.
  severity: silent
  cross_references:
  - dt_w036
  - dt_w027
- id: dt_w038
  stage: s3_parameters
  failure_domain: silent_error
  symptom:
    description: 'The CSV discharge series does not match the gauge cell -- it tracks
      a different channel, or jumps between cells during flood peaks.

      '
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: '[[output.csv.column]] used reducer = "maximum" instead of a coordinate'
    explanation: 'A domain-wide maximum of river_water__volume_flow_rate equals outlet
      discharge only by accident. If the padded window contains a larger neighbouring
      channel, or a tributary peaks above the outlet, the reported series silently
      comes from the wrong cell.

      '
    affected_components:
    - '[[output.csv.column]] in wflow_sbm.toml'
  remedy:
    action: Sample the gauge cell explicitly with coordinate.x / coordinate.y
    tool_to_run: generate_wflow_toml.py --outlet_lat <lat> --outlet_lon <lon>
    manual_steps:
    - grep -A3 'output.csv.column' wflow_sbm.toml
    - Prefer coordinate.x/coordinate.y over reducer
    prevention: Always pass --outlet_lat/--outlet_lon from the s1 build result.
  severity: silent
  cross_references:
  - dt_w015
  - dt_w036
- id: dt_w039_gridded_discharge_var_order
  symptom:
    description: Discharge extraction from output_grid.nc picks the wrong variable,
      or scores unrouted runoff (q_land) as discharge when the routed variable is
      absent/renamed
  diagnosis:
    root_cause: "Gridded discharge variable discovery must follow q_river, q_av, discharge,\
      \ Q \u2014 q_river is this KI's TOML-declared output name, q_av is Wflow.jl's\
      \ native averaged-discharge name; q_land/run are UNROUTED runoff (mm/timestep)\
      \ and must never be silently substituted for discharge on the gridded path (see\
      \ dt_w025)"
  remedy:
    action: extract_discharge.py extract_from_gridded searches exactly [q_river, q_av,
      discharge, Q] and hard-fails listing available variables when none is present;
      unrouted names remain acceptable only on the scalar-gauge path where the user
      explicitly targeted that file
  format_spec_violated: wflow.outputs.primary.discharge.variable (q_river, m3/s) vs
    outputs.primary.runoff (unrouted, dt_w025)
  canonical_intent: ki_local_if_pass
  added_by_run: wflow_retry7
- id: dt_w040
  stage: s1_hydromt
  failure_domain: silent_error
  symptom:
    description: 'Any basin OUTSIDE China: s1 prints "WARNING: DEM sampling failed
      ... using 500m placeholder" (or a DEM range of exactly 500-500 m), and the
      resulting staticmaps has Slope == RiverSlope == 1e-4 everywhere. wflow then
      runs without error but kinematic-wave routing has no terrain gradient.

      '
    error_pattern: 'DEM sampling failed|using 500m placeholder'
    detection_method: value_comparison
  diagnosis:
    root_cause: run_hydromt_build.py defaulted dem_path to china_dem_90m.tif, which
      returns nodata for every cell outside China
    explanation: 'The DEM default was the China 90 m tile. Outside China every sample
      is nodata, the nearest-neighbour gap fill has no valid donor, and the except
      branch substituted a FLAT 500 m placeholder. Slope is computed as the drop to
      the downstream cell, so a flat DEM collapses Slope and RiverSlope to the 1e-4
      floor: peak timing and celerity are then set by the floor, not the terrain.
      Nothing errors — this is a dt_w015-class magnitude/timing failure.

      '
    affected_components:
    - staticmaps.nc Slope
    - staticmaps.nc RiverSlope
    - staticmaps.nc wflow_dem
  remedy:
    action: Resolve the DEM per basin; never fall back to a flat placeholder
    tool_to_run: run_hydromt_build.py --dem_path <GeoTIFF or MERIT DEM tile dir>
    manual_steps:
    - Leave --dem_path unset to auto-select (China 90 m DEM inside China, the global
      MERIT DEM tile directory /mnt/datasets/MERIT_DEM elsewhere)
    - A directory of MERIT 5x5-deg <tile>_dem.tif files is merged over the window
    - Check the s1 line "DEM sampled from <path>: N/M cells valid, lo - hi m"
    prevention: s1 now FAILS when the DEM covers none of the window instead of
      substituting a placeholder.
  severity: silent
  cross_references:
  - dt_w015
  - dt_w037
  canonical_intent: ki_local_if_pass
  added_by_run: wflow_grdc_caravan_pelotas
- id: dt_w041
  stage: s1_hydromt
  failure_domain: parameter_format
  symptom:
    description: 'MERIT-Hydro mode reports a correct domain and then deletes it:
      "Domain: 80 cells, 8,726 km2 (+4.3%)" followed by "Pruned 79 cell(s) that do
      not drain to the outlet" and "Domain after prune: 1 cells". The build then
      fails with "only 1 river cell(s)".

      '
    error_pattern: 'Pruned \d+ cell\(s\) that do not drain to the outlet'
    detection_method: value_comparison
  diagnosis:
    root_cause: the gauge cell was activated AFTER the coarse LDD was built, so no
      upstream cell routed to it
    explanation: 'The outlet sits at the downstream tip of the basin, so its coarse
      cell is usually well below the --merit_cell_fraction (0.5) in-basin threshold
      — 24% at Rio Pelotas. The upscaling loop skips inactive cells when walking the
      fine network downstream, so with the outlet still inactive every trace ran PAST
      the gauge and attached to the first active cell DOWNSTREAM of it. Nothing then
      drains to the outlet and the reachability prune deletes the whole basin. This
      is order-of-operations, not a bad network: the same tiles give a correct domain
      once the gauge cell is activated first.

      '
