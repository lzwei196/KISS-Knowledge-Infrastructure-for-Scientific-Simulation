  symptom: 'A headlessly generated PIHM TIN loads but the run is wrong or dies: negative/zero element
    storage, hillslope fluxes going to the wrong neighbour, the river never exchanging with the aquifer,
    or CVODE failing on the very first step with NaN discharge at the outlet segment.'
  diagnosis: 'Four geometric contracts MM-PIHM enforces implicitly. (a) InitTopo computes a SIGNED element
    area 0.5*((x1-x0)(y2-y0)-(y1-y0)(x2-x0)); clockwise node order gives a NEGATIVE area (verified: 0/535
