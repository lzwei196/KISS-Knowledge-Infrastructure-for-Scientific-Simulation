# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: PHREEQC
  language: c++
  implementation:
    id: phreeqc-3
    version: 3.8.9
    provenance: C++ (C++11); USGS public-domain PHREEQC version 3 command-line executable, evolved from
      the Fortran PHREEQE lineage, with an embedded Basic interpreter for user-defined rate equations.
  scientific_reference_version: PHREEQC version 3 (USGS Techniques and Methods 6-A43, Parkhurst & Appelo
    2013)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/PHREEQC/source/repo/build/phreeqc
    type: ELF
pipeline:
  stages:
  - s1_solution_definition
  - s2_database_selection
  - s3_reaction_setup
  - s4_execution
  - s5_output_analysis
tools:
  count: 4
  files:
  - tools/convert_soil_params.py
  - tools/convert_solution_input.py
  - tools/parse_output.py
  - tools/run_phreeqc.py
inputs:
  forcing:
  - name: Influent boundary solution composition (TRANSPORT cell 0)
    unit: mol/kgw
  - name: Flow/velocity field (coupled mode)
    unit: m/s
  parameters:
  - name: Thermodynamic database (log_k, delta_h, activity-model parameters)
    unit: log_k dimensionless; delta_h kJ/mol
  - name: Mineral/phase log_k
    unit: dimensionless
  - name: Kinetic rate constant
    unit: mol/m2/s (rate-expression dependent)
  - name: Cation exchange capacity / selectivity coefficients
    unit: mol/kgw; selectivity dimensionless
  - name: Surface site density and area; intrinsic surface-complexation constants
    unit: site density mol/kgw; area m2/g; log_k dimensionless
  - name: Dispersivity, diffusion coefficient, porosity, cell length, number of cells
    unit: dispersivity m; diffusion m2/s; porosity fraction; length m; cells count
  initial_conditions:
  - name: Initial domain solution composition (TRANSPORT cells 1..N)
    unit: mol/kgw
  - name: Initial mineral/phase moles in EQUILIBRIUM_PHASES
    unit: mol
  - name: Initial exchanger / surface / gas / solid-solution / kinetic reactant amounts
    unit: mol or mol/kgw
  boundary_conditions:
  - name: Solution temperature, pH, pe (or Eh), pressure, density, concentration units
    unit: temp C; pH/pe dimensionless; pressure atm; density kg/L; units mg/L|ug/L|mmol/kgw|mol/kgw
  - name: Element total concentrations with oxidation-state and reporting-basis qualifiers
    unit: per units keyword
  - name: Reaction/temperature/pressure sweeps, mixing, charge-balance target
    unit: dimensionless / per-block
  - name: Thermodynamic database selector
    unit: n/a
  - name: Transport time step, shifts, boundary condition type, stagnant-zone options
    unit: time step s; shifts count
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - pH
  - pe
  - element_totals
  - species_distribution
  - saturation_index
  - ionic_strength
  - specific_conductance
  - phase_amounts
  - transport_profiles
  other: []
validation:
  tier: tested
  tier_justification: 'measured: R=1.000'
  metrics:
    best_r: 0.9995
summary:
  total_tools: 4
  total_stage_docs: 5
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
