  assumptions:
    - statement: "The model represents a 0-D single-column point ecosystem with no lateral exchange."
      scope: "all fluxes and states"
      source: "Thum et al. 2019 (GMD 12, 4781-4802), standalone site application"
      status: adopted
    - statement: "NEE follows the micrometeorological sign convention, NEE = Reco - GPP (positive = net source)."
      scope: "NEE output and obs comparison"
      source: "FLUXNET convention; parse_quincy_engine_output.py"
      status: adopted
    - statement: "Spin-up cycles the leading forcing years of the site record from bare ground."
      scope: "initial state of every site run"
      source: "QUINCY transient forcing_mode (quincy_qs_model_driver.f90)"
      status: adopted

