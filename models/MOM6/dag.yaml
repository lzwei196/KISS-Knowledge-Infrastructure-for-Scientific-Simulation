      doi: "10.1029/2019MS001726"
      note: "GFDL OM4.0 (MOM6) description; sensitivity to submesoscale MLE restratification and MEKE/GM mesoscale closure for MLD, SST and heat uptake (reported as parameter-swap / necessity, not a variance-based SA index)."
