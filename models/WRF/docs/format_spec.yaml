model:
  name: WRF (Weather Research and Forecasting) Model
  domain: atmosphere
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: Temperature
    unit: "K (perturbation \u03B8)"
    format: ''
    source: skill_md
  - name: Pressure
    unit: Pa
    format: ''
    source: skill_md
  - name: Precipitation
    unit: mm (accumulated)
    format: ''
    source: skill_md
  - name: Radiation
    unit: unknown
    format: ''
    source: skill_md
outputs:
  primary:
  - name: Temperature
    unit: "K (perturbation \u03B8)"
    format: ''
    source: skill_md
  - name: Soil_moisture
    unit: "m\xB3 m\u207B\xB3"
    format: ''
    source: skill_md
  - name: precipitation_rate
    canonical_id: precipitation_rate
    unit: mm/day
  - name: air_temperature
    canonical_id: air_temperature
    unit: degC
  - name: wind_speed
    canonical_id: wind_speed
    unit: m/s
  - name: surface_pressure
    canonical_id: surface_pressure
    unit: Pa
known_issues:
- id: dt_001
  description: 'Surface temperatures in wrfout are ~300 K too cold (e.g., T2 shows
    -27 C when expecting +25 C), or downstream analysis reports temperatures near
    0 K.

    '
  affected_output: The 3D temperature variable T in wrfout is perturbation potential
    temperature (theta - 300 K). Code is reading T directly without adding the 300
    K base state. For actual temperature, one must also app
  detection: The 3D temperature variable T in wrfout is perturbation potential temperature
    (theta - 300 K). Code is reading T directly without adding the 300 K base state.
    For actual temperature, one must also app
  fix: 'Always add 300 to T before any use: theta = T + 300. For actual temperature,
    compute T_actual = theta * ((P + PB) / 100000.0)^(R_d/c_p). For 2-m temperature,
    use the T2 variable directly (already in K'
- id: dt_002
  description: 'Surface pressure values are ~100x too small (e.g., 1013 instead of
    101300). Downstream calculations using pressure give nonsensical results.

    '
  affected_output: 'Pressure was read in hPa (millibars) but WRF expects and outputs
    Pa internally. Alternatively, only the perturbation pressure P was used instead
    of total pressure P + PB.

    '
  detection: 'Pressure was read in hPa (millibars) but WRF expects and outputs Pa
    internally. Alternatively, only the perturbation pressure P was used instead of
    total pressure P + PB.

    '
  fix: 'For input data: multiply hPa by 100 to get Pa. For wrfout data: total pressure
    is P + PB (perturbation + base state). P alone is only ~100-1000 Pa. PSFC is total
    surface pressure in Pa.

    '
- id: dt_003
  description: 'Mixing ratios (qv, qc, qr) are 1000x too large, causing unrealistic
    precipitation or model crash. Total column water exceeds 200 kg/m2.

    '
  affected_output: 'Input specific humidity or mixing ratio was provided in g/kg instead
    of the WRF-required kg/kg. A value of 15 g/kg should be 0.015 kg/kg.

    '
  detection: 'Input specific humidity or mixing ratio was provided in g/kg instead
    of the WRF-required kg/kg. A value of 15 g/kg should be 0.015 kg/kg.

    '
  fix: 'Divide g/kg values by 1000 before ingestion. Check that qv values are in range
    0 to ~0.04 kg/kg (0 to 40 g/kg is extreme tropical).

    '
- id: dt_004
  description: 'Geopotential height values are ~9.81x too large. Model produces unrealistic
    pressure gradients or crashes during initialization.

    '
  affected_output: 'ERA5 provides geopotential in m2/s2, but WRF GHT field expects
    height in meters. The conversion factor is g = 9.81 m/s2.

    '
  detection: 'ERA5 provides geopotential in m2/s2, but WRF GHT field expects height
    in meters. The conversion factor is g = 9.81 m/s2.

    '
  fix: 'Divide ERA5 geopotential (z) by 9.81 to get geopotential height in meters:
    GHT = z / 9.81.

    '
- id: dt_005
  description: 'Precipitation totals are always zero or always accumulating without
    reset. Hourly rainfall rates appear as multi-day totals.

    '
  affected_output: WRF RAINC and RAINNC are accumulated from simulation start. To
    get interval precipitation, you must difference consecutive output times. Additionally,
    total precipitation requires RAINC + RAINNC (conv
  detection: WRF RAINC and RAINNC are accumulated from simulation start. To get interval
    precipitation, you must difference consecutive output times. Additionally, total
    precipitation requires RAINC + RAINNC (conv
  fix: 'Compute interval precip: P(t) = (RAINC(t) + RAINNC(t)) - (RAINC(t-1) + RAINNC(t-1)).
    For the first output time, the accumulation is from simulation start.

    '
- id: dt_006
  description: 'Radiation flux values are wrong by factor of ~86400 or 1e6. Solar
    radiation appears as 0.005 W/m2 when expecting 500 W/m2.

    '
  affected_output: 'Input radiation data was in MJ/m2/day but WRF expects W/m2 (1
    W = 1 J/s). Conversion: W/m2 = MJ/m2/day * 1e6 / 86400.

    '
  detection: 'Input radiation data was in MJ/m2/day but WRF expects W/m2 (1 W = 1
    J/s). Conversion: W/m2 = MJ/m2/day * 1e6 / 86400.

    '
  fix: 'Multiply MJ/m2/day by 11.574 to get W/m2. Alternatively, W/m2 = MJ/m2/day
    * 1000000 / 86400.

    '
- id: dt_007
  description: 'Model crashes within first few timesteps with "cfl" errors in rsl.error.0000.
    Simulation immediately aborts.

    '
  affected_output: 'Time step violates the CFL (Courant-Friedrichs-Lewy) stability
    condition. The rule of thumb is dt <= 6 * dx(km). For dx=12 km, dt must be <=
    72 s.

    '
  detection: 'Time step violates the CFL (Courant-Friedrichs-Lewy) stability condition.
    The rule of thumb is dt <= 6 * dx(km). For dx=12 km, dt must be <= 72 s.

    '
  fix: 'Reduce time_step in namelist.input. Start conservative (dt = 4*dx_km) and
    increase if stable. Also check parent_time_step_ratio for nested domains.

    '
- id: dt_008
  description: 'real.exe or wrf.exe crashes with segmentation fault. No useful error
    message. Core dump shows crash in land surface module.

    '
  affected_output: 'num_soil_layers does not match the land surface model selection:
    Noah LSM (sf_surface_physics=2) requires 4, RUC (3) requires 6, Noah-MP (4) requires
    4, CLM4 (5) requires 10.

    '
  detection: 'num_soil_layers does not match the land surface model selection: Noah
    LSM (sf_surface_physics=2) requires 4, RUC (3) requires 6, Noah-MP (4) requires
    4, CLM4 (5) requires 10.

    '
  fix: "Set num_soil_layers to match sf_surface_physics: sf_surface_physics=1\u2192\
    5, =2\u21924, =3\u21926, =4\u21924, =5\u219210.\n"
- id: dt_009
  description: 'Precipitation is unrealistically high (2-3x observed). Domain 2 (4
    km) shows much more rain than observations.

    '
  affected_output: 'cu_physics (cumulus parameterization) is enabled on a domain with
    dx < 5 km. At convection-permitting resolution, convection is explicitly resolved,
    so parameterized + resolved = double-counted.

    '
  detection: 'cu_physics (cumulus parameterization) is enabled on a domain with dx
    < 5 km. At convection-permitting resolution, convection is explicitly resolved,
    so parameterized + resolved = double-counted.

    '
  fix: 'Set cu_physics = 0 for all domains with dx < 5 km. For the parent domain (dx
    > 10 km), keep cu_physics = 1 (Kain-Fritsch) or 16 (New Tiedtke).

    '
- id: dt_010
  description: 'Nesting interpolation produces checkerboard patterns at nest boundaries.
    Temperature or wind fields show regular oscillations.

    '
  affected_output: 'parent_grid_ratio is an even number (2, 4, 6). WRF requires odd
    ratios (3, 5, 7) for real-data simulations to properly center the interpolation
    stencil.

    '
  detection: 'parent_grid_ratio is an even number (2, 4, 6). WRF requires odd ratios
    (3, 5, 7) for real-data simulations to properly center the interpolation stencil.

    '
  fix: "Change parent_grid_ratio to an odd number. Common: 3:1 (12km\u21924km) or\
    \ 5:1 (25km\u21925km).\n"
- id: dt_011
  description: 'Boundary condition update causes sharp discontinuities or model crash.
    Temperature jumps every 6 hours at domain boundaries.

    '
  affected_output: interval_seconds in namelist.input does not match the temporal
    resolution of the forcing data (met_em files). If interval_seconds=3600 but met_em
    files are 6-hourly, WRF expects files that don't exist
  detection: interval_seconds in namelist.input does not match the temporal resolution
    of the forcing data (met_em files). If interval_seconds=3600 but met_em files
    are 6-hourly, WRF expects files that don't exist
  fix: 'Set interval_seconds to match the forcing data frequency: ERA5 hourly=3600,
    GFS/FNL 6-hourly=21600, 3-hourly=10800.

    '
- id: dt_012
  description: 'Model produces NaN values that spread through the domain within 10-20
    timesteps, eventually crashing or filling output with NaN.

    '
  affected_output: 'NaN injection from: (1) division by zero in physics (e.g., near-zero
    pressure or density), (2) corrupt initial conditions, (3) extreme topography gradient
    with too-large time step, or (4) inconsistent'
  detection: 'NaN injection from: (1) division by zero in physics (e.g., near-zero
    pressure or density), (2) corrupt initial conditions, (3) extreme topography gradient
    with too-large time step, or (4) inconsistent'
  fix: '(1) Check wrfinput for NaN: ncdump -v T wrfinput_d01 | grep -i nan. (2) Reduce
    time_step by 30%. (3) Enable w_damping=1 and epssm=0.1 for steep terrain. (4)
    Ensure restart uses same precision.

    '
- id: dt_013
  description: 'wrf.exe runs but produces no wrfout files. Log shows normal timestep
    progress but no output is written.

    '
  affected_output: 'history_interval is set larger than the total simulation duration,
    or frames_per_outfile is set to 0, or io_form_history is invalid.

    '
  detection: 'history_interval is set larger than the total simulation duration, or
    frames_per_outfile is set to 0, or io_form_history is invalid.

    '
  fix: 'Verify history_interval (minutes) < total simulation time (minutes). Ensure
    frames_per_outfile >= 1. Set io_form_history = 2 for netCDF.

    '
- id: dt_014
  description: 'Model crashes with "WOULD GO OFF TOP" error after several hours. Log
    shows extreme vertical velocities.

    '
  affected_output: 'Strong updrafts (from steep terrain or intense convection) push
    air parcels above the model top. The model domain top (ztop or p_top_requested)
    is too low, or the upper-level damping is insufficient.

    '
  detection: 'Strong updrafts (from steep terrain or intense convection) push air
    parcels above the model top. The model domain top (ztop or p_top_requested) is
    too low, or the upper-level damping is insufficient.

    '
  fix: '(1) Increase ztop (or decrease p_top_requested to lower pressure, e.g., 1000
    Pa). (2) Enable Rayleigh damping: damp_opt=3, zdamp=5000, dampcoef=0.2. (3) Reduce
    time_step if over steep terrain.

    '
- id: dt_015
  description: 'Simulation is extremely slow. Wall-clock time per timestep is 10x
    longer than expected for the grid size.

    '
  affected_output: (1) MPI decomposition inefficient (too few or too many cores).
    (2) I/O bottleneck from writing too-frequent output. (3) Spectral bin microphysics
    (mp_physics=30/32) is 100x slower than bulk schemes. (
  detection: (1) MPI decomposition inefficient (too few or too many cores). (2) I/O
    bottleneck from writing too-frequent output. (3) Spectral bin microphysics (mp_physics=30/32)
    is 100x slower than bulk schemes. (
  fix: '(1) Optimal MPI: ~25x25 grid points per process. (2) Increase history_interval
    or frames_per_outfile. (3) Use bulk microphysics (mp_physics=8 Thompson) for production.
    (4) Set radt=15 (minutes) for ra'
- id: dt_016
  description: 'real.exe crashes with "not enough levels" or produces wrfinput with
    all-zero soil fields. Soil temperature shows 0 K.

    '
  affected_output: 'met_em files are missing soil moisture and temperature fields.
    This happens when the Vtable doesn''t include soil variables, or the source GRIB
    data doesn''t contain soil fields.

    '
  detection: 'met_em files are missing soil moisture and temperature fields. This
    happens when the Vtable doesn''t include soil variables, or the source GRIB data
    doesn''t contain soil fields.

    '
  fix: '(1) Verify Vtable includes SM and ST fields. (2) Check met_em: ncdump -h met_em.d01.*
    | grep SM (3) If source data lacks soil, use a separate soil dataset (e.g., ERA5
    soil separate from pressure-level'
- id: dt_017
  description: 'SST is constant at 0 or 300 K everywhere. Ocean surface fluxes are
    unrealistic. Coastal temperature gradients are wrong.

    '
  affected_output: 'SST field was not extracted from GRIB data, or the Vtable doesn''t
    map the SST variable correctly. real.exe falls back to using SKINTEMP over water,
    which may be wrong.

    '
  detection: 'SST field was not extracted from GRIB data, or the Vtable doesn''t map
    the SST variable correctly. real.exe falls back to using SKINTEMP over water,
    which may be wrong.

    '
  fix: '(1) Ensure Vtable includes SST mapping. (2) For ERA5, SST is a separate dataset
    from pressure levels. (3) Verify: ncdump -v SST met_em.d01.* shows realistic ocean
    temps. (4) For time-varying SST, use '
- id: dt_018
  description: 'Temporal interpolation artifacts appear as 6-hourly pulses in temperature
    or wind. Boundary forcing shows step changes.

    '
  affected_output: 'Gap in met_em temporal coverage. One or more intermediate times
    are missing, causing WRF to extrapolate or use stale boundaries.

    '
  detection: 'Gap in met_em temporal coverage. One or more intermediate times are
    missing, causing WRF to extrapolate or use stale boundaries.

    '
  fix: '(1) List all met_em files and verify continuous temporal coverage. (2) Rerun
    ungrib/metgrid to fill gaps. (3) Ensure GRIB data covers full simulation period
    including end time.

    '
- id: dt_019
  description: 'Wind direction comparison with observations shows systematic bias
    of 10-30 degrees. Wind speed is correct but direction is offset.

    '
  affected_output: 'U10 and V10 in wrfout are grid-relative, not earth-relative. For
    Lambert conformal or polar stereographic projections, the grid north differs from
    true north by the convergence angle.

    '
  detection: 'U10 and V10 in wrfout are grid-relative, not earth-relative. For Lambert
    conformal or polar stereographic projections, the grid north differs from true
    north by the convergence angle.

    '
  fix: 'Rotate winds using COSALPHA and SINALPHA variables from wrfout: u_earth =
    U10*COSALPHA - V10*SINALPHA v_earth = V10*COSALPHA + U10*SINALPHA

    '
- id: dt_020
  description: 'Spatial plots show half-grid-cell offset between wind and temperature
    fields. Wind vectors appear shifted relative to the temperature contours.

    '
  affected_output: 3D wind components (U, V, W) are on staggered grid faces (Arakawa
    C-grid). U has an extra point in X, V in Y, W in Z. Plotting raw staggered data
    against unstaggered mass-point data causes spatial off
  detection: 3D wind components (U, V, W) are on staggered grid faces (Arakawa C-grid).
    U has an extra point in X, V in Y, W in Z. Plotting raw staggered data against
    unstaggered mass-point data causes spatial off
  fix: 'Destagger before analysis: u_mass = 0.5 * (U[:,:,:-1] + U[:,:,1:]) v_mass
    = 0.5 * (V[:,:-1,:] + V[:,1:,:])

    '
- id: dt_021
  description: 'Vertical profile of pressure shows only small perturbation values
    (~100-1000 Pa) instead of full atmospheric pressure (~100000 Pa).

    '
  affected_output: 'Only the perturbation pressure variable P was read, ignoring the
    base-state pressure PB. Total pressure is P + PB.

    '
  detection: 'Only the perturbation pressure variable P was read, ignoring the base-state
    pressure PB. Total pressure is P + PB.

    '
  fix: 'Always compute total pressure: pressure = P + PB. Similarly, total geopotential:
    ph_total = PH + PHB.

    '
unit_conversions: []
