- id: dt_c02
  symptom: HYPE discharge much lower than VIC for same basin and period
  diagnosis: Precipitation averaged instead of summed when converting 3-hourly to daily; If mean() is
    used instead of sum() for daily P aggregation, HYPE receives 1/8th of the actual precipitation. VIC
    processes the 3-hourly data directly. Annual P comparison will show HYPE receiving ~100 mm/yr vs VIC's
    ~800 mm/
  remedy: '3-hourly precip must be SUMMED for daily total. Cross-check: annual P in Pobs.txt should match
    VIC.; convert_forcing_to_hype; [''Compare annual precipitation between VIC forcing and HYPE Pobs.txt''];
    convert_forcing_to_hype.py uses .sum() explicitly for precipitation'
