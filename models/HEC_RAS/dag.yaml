          metric_families:
            - "event_detection"
            - "spatial_pattern_match"
          determining_metric: "csi"
          caveats:
            - "Wet/dry classification per pixel against satellite-derived flood extent (e.g., SAR-based)."
            - "Hit-rate / critical-success-index families are appropriate; spatial-pattern correlation supplements but does not replace contingency-table metrics."
        - obs_shape: "spatial_time_series"
          comparison_mode: "categorical_event_comparison"
          metric_families:
            - "event_detection"
            - "spatial_pattern_match"
            - "timing_accuracy"
          determining_metric: "csi"
          caveats:
            - "Time-resolved inundation snapshots; timing metrics target arrival and recession of the flood wave."
      detrending_options:
        - "none"
  - var: "froude_number"
    validation_rank: 7
    unit: "dimensionless"
    description: "Channel Froude number Fr = V/sqrt(gD). Identifies sub/critical/super-critical regime and locates hydraulic jumps."
    emitted_in: "<prj>.pNN.tmp.hdf at /Results/.../Froude # Channel (derived as V/sqrt(gD) if absent; g = 32.174 ft/s^2 English, 9.81 m/s^2 SI)"
