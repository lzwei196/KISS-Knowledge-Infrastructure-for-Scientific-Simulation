safety:
  hazards:
    - {id: "flow_units_mismatch", kind: "control_semantic", description: "FLOW_UNITS (CFS vs CMS) inconsistent with pipe dimensions/areas/rainfall/elevations; SWMM trusts numbers with no dimension check, giving order-of-magnitude-wrong results.", severity: "silent"}
    - {id: "rainfall_intensity_vs_volume", kind: "weather_file_semantic", description: "Rain-gage FORMAT (INTENSITY vs VOLUME) not matching the data encoding; runoff scaled by intervals-per-hour with no warning.", severity: "silent"}
    - {id: "subcatchment_width_too_large", kind: "control_semantic", description: "Width set via sqrt(Area)/Area shortcut shortens overland flow length L=Area/Width, artificially peaking the hydrograph; volume may stay correct.", severity: "silent"}
    - {id: "infiltration_method_column_mismatch", kind: "control_semantic", description: "[INFILTRATION] column layout not matching the [OPTIONS] INFILTRATION method; SWMM silently misreads columns, biasing runoff.", severity: "degraded"}
    - {id: "manning_n_typo", kind: "control_semantic", description: "Manning's n with a dropped/added zero; no range check, velocity and peak timing off by ~10-13x.", severity: "silent"}
    - {id: "lid_soil_ordering_violation", kind: "soil_semantic", description: "LID soil layer with Wilting Point >= Field Capacity or Field Capacity >= Porosity gives negative available water capacity; layer never retains or never drains. Not validated by SWMM.", severity: "degraded"}
    - {id: "lid_area_exceeds_subcatchment", kind: "soil_semantic", description: "Sum of Number*Area in [LID_USAGE] exceeds subcatchment area; clipping/negative-remainder behavior is version-dependent.", severity: "fatal_or_silent"}
    - {id: "ponding_mass_sink", kind: "control_semantic", description: "ALLOW_PONDING=NO (default) or Aponded=0 removes flooded-node water from the system, producing a negative continuity error that worsens over continuous runs.", severity: "degraded"}
    - {id: "courant_routing_instability", kind: "numerical_instability", description: "ROUTING_STEP too large for the dynamic-wave Courant condition (dt <= dx/sqrt(g*h)); routing continuity error climbs above 5%.", severity: "degraded"}
    - {id: "adverse_slope_oscillation", kind: "numerical_instability", description: "Conduit with outlet invert higher than inlet makes the dynamic-wave solver oscillate forward/reverse flow; high continuity error, NaN, possible crash. Kinematic wave cannot represent adverse slopes at all.", severity: "fatal_or_silent"}
    - {id: "surcharge_transition_oscillation", kind: "numerical_instability", description: "Repeated free-surface <-> pressurized transition (many pipes filling near-simultaneously) drives routing oscillation and adaptive-step slowdown.", severity: "degraded"}
    - {id: "zero_length_conduit", kind: "control_semantic", description: "Conduit length=0 (coincident nodes) makes slope/velocity/friction divisions undefined; division-by-zero/NaN crash (ERROR 141).", severity: "fatal"}
    - {id: "subcatchment_outlet_undefined", kind: "control_semantic", description: "Subcatchment Outlet references a nonexistent node (ERROR 142); simulation will not start.", severity: "fatal"}
    - {id: "no_outfall_defined", kind: "control_semantic", description: "No outfall in the network (ERROR 143); inflow accumulates and every node floods.", severity: "fatal"}
    - {id: "outfall_timeseries_undefined", kind: "control_semantic", description: "Outfall Type=TIMESERIES references a series absent from [TIMESERIES] or not spanning the simulation period; fatal error or a constant (wrong) boundary.", severity: "fatal_or_silent"}
    - {id: "dwf_missing_combined_sewer", kind: "control_semantic", description: "Missing [DWF] on a combined sewer yields zero dry-weather base flow and underestimated CSO frequency.", severity: "degraded"}
    - {id: "inp_encoding_parse_failure", kind: "parser_semantic", description: "INP with a UTF-8 BOM, non-ASCII characters, or tabs mixed with spaces cannot be parsed by the SWMM C engine.", severity: "fatal"}
  validation_limits:
    - "Intended primarily for urban areas (0.01-100 km2); not calibrated for watershed/basin-scale rural hydrology or basin river-channel routing."
    - "Over 150 user-supplied parameters; many require calibration, and groundwater (14 params/subcatchment) is meaningful only when explicitly enabled."
    - "Hargreaves evaporation requires temperatures averaged over >=5 days (SWMM uses a 7-day running average); pan-to-actual conversion uses approximate monthly coefficients (~0.7)."
    - "Steady-flow and kinematic-wave routing cannot represent backwater, surcharging, or reverse flow; kinematic wave additionally cannot represent adverse slopes."
    - "Reference-manual disclaimer: the programs are experimental and EPA assumes no liability for results."
  warnings:
    - "Routing continuity error should be <5% (<1% for dynamic wave) and runoff continuity error <5%; larger values mean results are numerically unreliable."
    - "Manning's n outside ~[0.005, 0.100] for overland flow, or pipe roughness outside material tables, is almost always an input error rather than a real value."
    - "Default ALLOW_PONDING=NO silently violates mass conservation at flooded nodes; for flood-volume analysis set ALLOW_PONDING=YES with Aponded>0."
    - "Precipitation and infiltration are held constant within a runoff timestep (no interpolation); other reported quantities are linearly interpolated."
  assumptions:
    - statement: "Each subcatchment is idealized as a rectangular surface of uniform slope and characteristic width draining to a single outlet, with overland flow treated as uniform flow in a wide rectangular channel (Manning's equation), so cross-section area A_x = W(d-d_s) and hydraulic radius R_x = d-d_s."
      scope: "Surface runoff generation on all subcatchments"
      source: "EPA SWMM Reference Manual Vol I Hydrology, Ch.3 Governing Equations (EPA/600/R-15/162A)"
      status: "adopted"
    - statement: "Runoff occurs only when ponded depth d exceeds depression storage d_s (else q=0 and dd/dt = i - e - f), and impervious subareas have infiltration f=0 by definition."
      scope: "Surface runoff mass balance"
      source: "EPA SWMM Reference Manual Vol I Hydrology, Ch.3.2-3.3"
      status: "adopted"
    - statement: "Closure is mass-balance on water (and pollutant mass when active); evaporation is a demand-side flux, not a closed surface energy budget, so there is no energy-balance closure."
      scope: "Whole-model conservation semantics"
      source: "EPA SWMM Reference Manual Vol I Hydrology, Ch.1.4 / Ch.2.5 Evaporation"
      status: "adopted"
    - statement: "This dag describes the EPA SWMM5 C engine as driven through pyswmm; pyswmm bundles (does not reimplement) the compiled engine, so the science is the EPA engine's, not the Python wrapper's."
      scope: "Implementation binding"
      source: "USEPA Stormwater-Management-Model engine + pyswmm API"
      status: "adopted"
    - statement: "Conveyance flow-routing detail (Vol II) and water-quality/LID detail (Vol III) are represented at the structural level documented in Vol I cross-references; per-process Vol II/III equations were not independently re-derived."
      scope: "Hydraulic routing and water-quality/LID modules"
      source: "EPA SWMM Reference Manual Vol I (cross-references to Vols II and III)"
      status: "tentative"

medium_evidence:
  - var: "node_flooding"
    source: "dag.yaml"
    quote: "Urban flooding: node surcharging, flooding volumes, and surface ponding"
    note: "scope_in identifies flooded node water as urban surface ponding."
  - var: "link_flow"
    source: "dag.yaml"
    quote: "Conveyance hydraulic routing through pipes, channels, storage units, pumps, and regulators (steady / kinematic-wave / dynamic-wave)"
    note: "scope_in places link flow in the drainage-network conveyance medium."
  - var: "link_depth_velocity"
    source: "dag.yaml"
    quote: "Conveyance hydraulic routing through pipes, channels, storage units, pumps, and regulators (steady / kinematic-wave / dynamic-wave)"
    note: "scope_in places conduit depth and velocity in the drainage-network conveyance medium."
  - var: "continuity_error"
    source: "dag.yaml"
    quote: "Mass-balance closure on water (and on pollutant mass when water quality is active) is the governing principle: surface runoff is a nonlinear-reservoir mass balance on ponded depth d (dd/dt = i - e - f - q), and node/link/groundwater balances are tracked as separate continuity errors (runoff, flow-routing, groundwater, quality)."
    note: "boundary notes identify continuity as water mass balance across surface runoff and node/link routing media."
