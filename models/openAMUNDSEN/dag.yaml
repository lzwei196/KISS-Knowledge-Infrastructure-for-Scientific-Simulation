safety:
  hazards:
    - {id: "temp_celsius_filtered_to_nan", kind: "weather_file_semantic", description: "Air temperature in Celsius is outside the 200-330 K filter and is silently replaced with NaN; snow never forms and SWE is zero everywhere.", severity: "silent"}
    - {id: "precip_unit_timescale_mismatch", kind: "weather_file_semantic", description: "Precipitation as rate vs accumulation or wrong timescale (mm/day, kg m-2 s-1 in CSV) inflates or deflates SWE by 24x-3600x.", severity: "silent"}
    - {id: "rel_hum_fraction_filtered_to_nan", kind: "weather_file_semantic", description: "Relative humidity supplied as fraction (0-1) is rejected by the min=1 filter, zeroing vapor pressure and corrupting latent-heat/sublimation fluxes.", severity: "silent"}
    - {id: "sw_in_energy_units", kind: "weather_file_semantic", description: "Shortwave supplied in energy units (J/MJ) instead of W m-2 is 1000-86400x too high, distorting the radiation budget and melt timing.", severity: "silent"}
    - {id: "wind_kmh_overscales_undercatch", kind: "weather_file_semantic", description: "Wind speed in km/h (3.6x) overscales WMO/Kochendorfer undercatch correction, inflating accumulation at exposed sites; 50 km/h still passes the 50 m/s filter.", severity: "degraded"}
    - {id: "netcdf_precip_missing_units_attr", kind: "weather_file_semantic", description: "NetCDF precipitation flux without a units='kg m-2 s-1' attribute is treated as accumulation, making precip ~3600x too low.", severity: "silent"}
    - {id: "lapse_rate_per_km", kind: "weather_file_semantic", description: "Temperature lapse rate entered in K/km instead of K/m (e.g. 6.5 -> 6500 K/km) produces wildly wrong elevation-interpolated temperatures.", severity: "silent"}
    - {id: "station_altitude_wrong_unit", kind: "weather_file_semantic", description: "Station altitude in feet/km instead of meters corrupts elevation-difference lapse-rate interpolation.", severity: "silent"}
    - {id: "soil_thickness_cm", kind: "soil_semantic", description: "Soil layer thickness in cm instead of meters makes soil heat flux ~100x off.", severity: "silent"}
    - {id: "snow_density_g_cm3", kind: "initial_condition_semantic", description: "Initial snow density in g/cm3 instead of kg m-3 creates effectively massless layers and snow depth 1000x too large.", severity: "silent"}
    - {id: "dem_filename_mismatch", kind: "weather_file_semantic", description: "DEM filename not matching dem_{domain}_{resolution}.asc causes a fatal FileNotFoundError at init.", severity: "fatal"}
    - {id: "resolution_in_km", kind: "control_semantic", description: "Resolution given in km instead of meters collapses the grid to 1-2 cells or produces an OOM-sized grid.", severity: "fatal"}
    - {id: "station_crs_mismatch", kind: "control_semantic", description: "Station coordinate CRS mismatch (UTM coords declared as epsg:4326) places stations outside the grid; fatal 'no stations within grid extent'.", severity: "fatal"}
    - {id: "timestep_not_pandas_freq", kind: "control_semantic", description: "Timestep given as seconds/minutes/integer instead of a pandas frequency string is a fatal parse error.", severity: "fatal"}
    - {id: "no_stations_in_grid", kind: "control_semantic", description: "All stations outside the grid extent (wrong CRS, too-small grid, or bounds='grid' excluding all) yields a fatal empty station dataset at init.", severity: "fatal"}
    - {id: "snowmodel_switch_invalidates_calibration", kind: "control_semantic", description: "Switching snow scheme (multilayer <-> cryolayers) makes albedo/thermal-conductivity/compaction parameters non-transferable; accuracy degrades without recalibration.", severity: "degraded"}
    - {id: "canopy_without_landcover", kind: "control_semantic", description: "Canopy module enabled without a land-cover grid silently treats all pixels as open terrain, zeroing forest interception.", severity: "degraded"}
    - {id: "cloud_fraction_autoconversion_fragile", kind: "weather_file_semantic", description: "Cloud-fraction 0-1 -> 0-100 auto-conversion only triggers when max<=1 and len>10, otherwise misclassifies clear vs cloudy sky and lowers longwave.", severity: "silent"}
  validation_limits:
    - "Designed for mountain regions; applicability is point-to-regional scale (up to hundreds-thousands of km2) at 10-100 m and 1-3 h resolution."
    - "No native channel/streamflow routing; catchment runoff comparison requires an external routing model."
    - "Glacier mass balance is experimental (delta-h); not a substitute for a dynamic ice-flow model."
    - "Lateral redistribution is a static terrain parameterization, not dynamic wind-transport; sub-1 km resolution is needed to resolve snow-cover duration in complex terrain."
  warnings:
    - "The input filter silently replaces out-of-range forcing with NaN and raises no error; most unit mistakes run to completion but produce physically wrong results (often zero SWE)."
    - "degree_day_factor only affects temperature-index / enhanced-temperature-index melt, not the energy_balance default; tuning it under energy_balance has no effect."
    - "Precipitation unit semantics are format-dependent: CSV = kg m-2 per timestep (accumulation), NetCDF = kg m-2 s-1 (rate); treat 'precip unit' as format-conditional."
    - "The grid/DEM CRS (projected) and station CRS (input_data.meteo.crs, often WGS84) are distinct; conflating them is the dominant 'no stations in grid' failure."
  assumptions:
    - statement: "openAMUNDSEN is fully distributed on a 2-D projected grid; each cell is a 1-D vertical snow/soil column with no inter-cell lateral mass exchange except the static terrain-based snow redistribution applied to precipitation."
      scope: "spatial geometry"
      source: "openAMUNDSEN model structure and lateral-redistribution documentation (doc.openamundsen.org/des/structure, /des/lateral)"
      status: "adopted"
    - statement: "Mass balance closes on snow water (SWE, ice/liquid content) and energy balance closes on the surface/snow energy budget under the energy_balance melt scheme; temperature-index and enhanced-temperature-index melt are demand-side flux parameterizations without a closed surface energy budget."
      scope: "conservation / closure"
      source: "openAMUNDSEN snow and energy balance description (doc.openamundsen.org/des/energy) and surface.py / snow module energy-balance solve"
      status: "adopted"
    - statement: "The cryolayers scheme assumes melting whenever air temperature exceeds 0 degC and otherwise iterates surface temperature; this differs in internal representation from the multilayer scheme, so calibrated parameters are scheme-specific."
      scope: "melt-method interpretation"
      source: "openAMUNDSEN energy-balance method documentation and cryolayermodel.py / surface.py iteration behavior"
      status: "adopted"
    - statement: "Default snowfall longwave emissivity (0.99), heat/moisture roughness ratio (0.1), and the Anderson-1976 compaction/fresh-snow-density coefficients are hardcoded model internals, not config-exposed parameters."
      scope: "fixed internal parameterization"
      source: "openamundsen/surface.py and openamundsen/modules/snow/snow.py source"
      status: "adopted"
