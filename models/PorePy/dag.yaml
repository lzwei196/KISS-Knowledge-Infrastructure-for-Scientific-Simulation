template_version: "3.5"

identity:
  model_id: "PorePy"
  scientific_reference_version: "PorePy multiphysics fractured-porous-media framework (Keilegavlen et al. 2021 formulation; mixed-dimensional FV/FE with contact mechanics)"
  implementation:
    id: "porepy"
    version: "1.12.0"
    provenance: "Python; Porous Media Group (University of Bergen) PorePy library; Python-API model mixins solved via run_stationary_model / run_time_dependent_model."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "GPL-3.0-or-later"
  repo_url: "https://github.com/pmgbergen/porepy"

boundary:
  scope_in:
    - "Single-phase Darcy fluid mass balance in mixed-dimensional fractured media"
    - "Linear-elastic momentum balance with frictional fracture contact mechanics"
    - "Energy balance (advective + conductive heat transport, local thermal equilibrium)"
    - "Biot poromechanics (coupled flow + mechanics)"
    - "Thermoporomechanics (coupled THM)"
    - "Automatic mixed-dimensional mesh generation for 2D/3D fracture networks"
  scope_out:
    - "Stand-alone energy balance (requires an externally coupled flow field)"
    - "Non-unitary time-unit scaling (only s == 1 supported)"
    - "Native land-surface / watershed / climate forcing (coupling is via external models)"
  spatial: "3-D"
  temporal: "event"
  closure: "both"
  notes: "Mixed-dimensional geometry: nd-matrix subdomains, (nd-1) fracture subdomains, lower-dimensional intersections, and codimension-one mortar interfaces. Mass-balance closure holds for fluid mass (and inorganic transport in reactive setups); momentum/energy give a coupled poro-thermo-elastic balance. Spatial grain is 2-D or 3-D depending on the domain; temporal grain is steady (elliptic) OR transient via implicit-Euler time stepping (all times in seconds). Contact mechanics enforces non-penetration and Coulomb friction at fracture interfaces."

inputs:
  forcing:
    - category: "boundary_driver"
      name: "Transient boundary pressure / flux schedule"
      unit: "Pa or m^3/s over s"
      source_kind: "user_provided"
      model_input_format: "Time-indexed Dirichlet/Neumann boundary values applied via pp.TimeManager schedule"
      notes: "Time-varying boundary forcing (e.g., recharge, prescribed pressure) consumed each timestep in time-dependent runs; all times in seconds."
    - category: "boundary_driver"
      name: "Recharge rate"
      unit: "m/s"
      source_kind: "user_provided"
      model_input_format: "Neumann flux boundary on the relevant boundary faces"
      notes: "Volumetric recharge intensity; designated uncertain forcing in density-driven-flow UQ."
  parameters:
    - category: "solid_material"
      name: "permeability"
      unit: "m^2"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 5e-18 m^2)"
      notes: "Highest calibration sensitivity for the flow field; natural rock 1e-22 to 1e-10 m^2."
    - category: "solid_material"
      name: "normal_permeability"
      unit: "m^2"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants"
      notes: "Interface/normal permeability governing inter-dimensional (mortar) flux."
    - category: "solid_material"
      name: "porosity"
      unit: "dimensionless (0-1)"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 0.013)"
      notes: "Fraction, not percentage; couples to permeability via Kozeny-Carman in some setups."
    - category: "solid_material"
      name: "biot_coefficient"
      unit: "dimensionless (0<alpha<=1)"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 0.47)"
    - category: "solid_material"
      name: "shear_modulus"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 1.485472e10 Pa)"
    - category: "solid_material"
      name: "lame_lambda"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 7.020826e9 Pa)"
    - category: "solid_material"
      name: "specific_storage"
      unit: "1/Pa"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 4.74e-10 1/Pa)"
    - category: "solid_material"
      name: "friction_coefficient"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 0.6)"
    - category: "solid_material"
      name: "dilation_angle"
      unit: "radians"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants"
    - category: "solid_material"
      name: "density (solid)"
      unit: "kg/m^3"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 2683 kg/m^3)"
    - category: "solid_material"
      name: "specific_heat_capacity (solid)"
      unit: "J/(kg*K)"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 720.7 J/(kg*K))"
    - category: "solid_material"
      name: "thermal_conductivity (solid)"
      unit: "W/(m*K)"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 3.1 W/(m*K))"
    - category: "solid_material"
      name: "thermal_expansion (solid)"
      unit: "1/K"
      source_kind: "calibrated"
      model_input_format: "pp.SolidConstants (granite default 9.66e-6 1/K)"
    - category: "fluid_material"
      name: "viscosity"
      unit: "Pa*s"
      source_kind: "calibrated"
      model_input_format: "pp.FluidComponent (water default 1.002e-3 Pa*s)"
    - category: "fluid_material"
      name: "density (fluid)"
      unit: "kg/m^3"
      source_kind: "calibrated"
      model_input_format: "pp.FluidComponent (water default 998.2 kg/m^3)"
    - category: "fluid_material"
      name: "compressibility"
      unit: "1/Pa"
      source_kind: "calibrated"
      model_input_format: "pp.FluidComponent (water default 4.559e-10 1/Pa)"
    - category: "fluid_material"
      name: "specific_heat_capacity (fluid)"
      unit: "J/(kg*K)"
      source_kind: "calibrated"
      model_input_format: "pp.FluidComponent (water default 4182 J/(kg*K))"
    - category: "fluid_material"
      name: "thermal_conductivity (fluid)"
      unit: "W/(m*K)"
      source_kind: "calibrated"
      model_input_format: "pp.FluidComponent (water default 0.5975 W/(m*K))"
    - category: "fluid_material"
      name: "thermal_expansion (fluid)"
      unit: "1/K"
      source_kind: "calibrated"
      model_input_format: "pp.FluidComponent (water default 2.068e-4 1/K)"
    - category: "geometry"
      name: "fracture_gap"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "pp.SolidConstants fracture_gap; reference aperture for contact"
    - category: "numerical"
      name: "Newton convergence tolerances (inc/res atol)"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "NewtonSolver params; model default 1e-10 absolute, relative tolerances default np.inf (disabled)"
      notes: "Convergence is absolute-only by default; relative criteria off unless overridden."
    - category: "numerical"
      name: "nl_max_iterations"
      unit: "count"
      source_kind: "default"
      model_input_format: "NewtonSolver param; model default 10"
    - category: "numerical"
      name: "characteristic_displacement"
      unit: "m"
      source_kind: "default"
      model_input_format: "numerical constant; model default 0.2 m; sets contact-mechanics penalty c_num = 1/characteristic_displacement"
      notes: "Drives conditioning of the fracture contact-mechanics complementarity formulation; only relevant in ContactMechanics/poromechanical runs with fractures."
    - category: "numerical"
      name: "mesh cell_size / cell_size_fracture / cell_size_boundary / cell_size_min"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "meshing_arguments dict passed to the Gmsh interface"
      notes: "Should scale to domain (~domain_length/20 to /100); fracture cells ~1/10 fracture length."
    - category: "reference_state"
      name: "reference_pressure / reference_temperature"
      unit: "Pa / K"
      source_kind: "default"
      model_input_format: "pp.reference_values (defaults 101325 Pa, 293.15 K)"
      notes: "Used by linearized constitutive laws (density, enthalpy)."
  initial_conditions:
    - category: "state_init"
      name: "Initial pressure field"
      unit: "Pa"
      source_kind: "user_provided"
      model_input_format: "initial_condition() sets pressure state on subdomains"
    - category: "state_init"
      name: "Initial displacement field"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "initial_condition() sets u state (mechanics models)"
    - category: "state_init"
      name: "Initial temperature field"
      unit: "K"
      source_kind: "user_provided"
      model_input_format: "initial_condition() sets temperature state (energy/THM models)"
  boundary_conditions:
    - category: "bc_type"
      name: "Pressure boundary condition (Dirichlet)"
      unit: "Pa"
      source_kind: "user_provided"
      model_input_format: "BoundaryCondition is_dir faces carry prescribed pressure; >=1 Dirichlet required to avoid singular system"
    - category: "bc_type"
      name: "Flux boundary condition (Neumann)"
      unit: "m^3/s"
      source_kind: "user_provided"
      model_input_format: "BoundaryCondition is_neu faces carry prescribed flux"
    - category: "bc_type"
      name: "Robin boundary condition"
      unit: "mixed"
      source_kind: "user_provided"
      model_input_format: "BoundaryCondition / BoundaryConditionVectorial; vectorial form sigma*n + alpha*u = G"
    - category: "bc_type"
      name: "Displacement / traction boundary condition"
      unit: "m / Pa"
      source_kind: "user_provided"
      model_input_format: "BoundaryConditionVectorial Dirichlet (displacement) or Neumann (traction) for mechanics"
    - category: "bc_type"
      name: "Temperature boundary condition"
      unit: "K"
      source_kind: "user_provided"
      model_input_format: "BoundaryCondition for energy balance (Dirichlet/Neumann)"
    - category: "geometry"
      name: "Domain bounding box"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "pp.Domain dict (xmin/xmax, ymin/ymax, zmin/zmax)"
    - category: "geometry"
      name: "Fracture network (line / plane / elliptic fractures, wells)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "pp.LineFracture (2D), pp.PlaneFracture / pp.EllipticFracture (3D coplanar polygons), pp.WellNetwork3d"
      notes: "Fracture points must lie within the domain; 3D fractures must be planar and non-degenerate."
    - category: "structural"
      name: "Grid type selection"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "grid_type: cartesian (built-in) | simplex (Gmsh) | tensor_grid (built-in)"
    - category: "structural"
      name: "Discretization method selection"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "MPFA / MPSA / TPFA / VEM(MVEM) / RT0 chosen via model mixins"
    - category: "control"
      name: "Time schedule and dt"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "pp.TimeManager(schedule, dt_init, constant_dt); monotonic schedule in seconds"
    - category: "control"
      name: "Linear solver selection"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "linear_solver: pypardiso (if installed) or scipy_sparse direct"

processes:
  modules:
    - name: "FractureNetwork"
      role: "allocator"
      brief: "Constructs 2D/3D fracture networks and meshes them with Gmsh (gmsh_interface); produces matrix, fracture, and intersection subdomains. Degenerate or domain-exceeding fractures cause mesh failures."
    - name: "ModelGeometry"
      role: "driver"
      brief: "Builds the MixedDimensionalGrid from the fracture network; defines subdomains, codimension-one mortar interfaces, and meshing arguments (cell_size)."
    - name: "ConstitutiveLaws"
      role: "process_solver"
      brief: "Physics closures: DarcysLaw, FouriersLaw, AdvectiveFlux, LinearElasticity (Hooke), BiotCoefficient, SpecificStorage, Constant/CubicLawPermeability, PoroMechanicsPorosity, DisplacementJumpAperture/DimensionReduction, and FracturedSolid friction/dilation laws."
    - name: "FluidMassBalance (SinglePhaseFlow)"
      role: "process_solver"
      brief: "Assembles single-phase Darcy mass-balance equation; primary variable pressure; FV (TPFA/MPFA) discretization, Darcy-type flux across interfaces."
    - name: "MomentumBalance"
      role: "process_solver"
      brief: "Linear-elastic / TPSA momentum balance; primary variable displacement (u); MPSA discretization; supports rotation_stress/total_pressure mixed formulation."
    - name: "ContactMechanics"
      role: "process_solver"
      brief: "Non-penetration plus Coulomb-friction complementarity at fracture interfaces via contact_traction and interface displacement; penalty constant c_num = 1/characteristic_displacement."
    - name: "EnergyBalance"
      role: "process_solver"
      applicability: "Thermoporomechanics (THM) only; not stand-alone"
      brief: "Temperature transport with Fourier conduction + advective enthalpy under local thermal equilibrium; requires a flow field."
    - name: "Poromechanics"
      role: "integrator"
      brief: "Biot coupling of FluidMassBalance + MomentumBalance into one monolithic system (effective stress + flux-from-deformation)."
    - name: "Thermoporomechanics"
      role: "integrator"
      applicability: "THM runs only"
      brief: "Adds EnergyBalance to Poromechanics (thermal expansion, ThermoPressureStress); full THM coupling."
    - name: "Discretization (MPFA/MPSA/TPFA/VEM/RT0)"
      role: "process_solver"
      brief: "Finite-volume (TPFA/MPFA flow, MPSA mechanics, Biot, upwind), virtual-element (MVEM), and Raviart-Thomas RT0 spatial operators."
    - name: "EquationSystem"
      role: "integrator"
      brief: "Forward-mode automatic-differentiation (AD) operator tree; EquationSystem assembles the global residual and Jacobian from variables and constitutive operators."
    - name: "SolutionStrategy"
      role: "driver"
      brief: "Orchestrates prepare_simulation ordering (set_materials -> set_geometry -> create_variables -> initial_condition -> set_equations -> discretize); assembles and solves each Newton iteration."
    - name: "NewtonSolver"
      role: "integrator"
      brief: "Newton nonlinear loop with absolute increment/residual convergence (default 1e-10) and nl_max_iterations (default 10); NaN/max-iteration stopping criteria."
    - name: "LinearSolver"
      role: "process_solver"
      brief: "Solves the linearized system each Newton step; pypardiso if installed else scipy sparse direct solver."
    - name: "TimeManager"
      role: "driver"
      brief: "Manages schedule, dt_init, constant_dt, and optional adaptive time stepping (TimeStepControl) based on Newton iteration counts (all times in seconds)."
    - name: "Exporter"
      role: "optional_module"
      brief: "Writes per-subdomain VTU and PVD time-series in SI units; exports primary variables plus derived aperture/specific_volume; secondary vars need explicit registration in data_to_export()."
  internal_edges:
    - from: "FractureNetwork"
      to: "ModelGeometry"
      kind: "produces_output"
      brief: "Gmsh meshing yields the MixedDimensionalGrid consumed by geometry."
    - from: "ModelGeometry"
      to: "EquationSystem"
      kind: "produces_output"
      brief: "Subdomains/interfaces define the DOFs and operator domains."
    - from: "ConstitutiveLaws"
      to: "FluidMassBalance (SinglePhaseFlow)"
      kind: "invokes"
      brief: "DarcysLaw + permeability + storage supply the mass-balance flux/accumulation terms."
    - from: "ConstitutiveLaws"
      to: "MomentumBalance"
      kind: "invokes"
      brief: "LinearElasticity (Hooke) + friction/dilation supply the stress operator."
    - from: "FluidMassBalance (SinglePhaseFlow)"
      to: "Poromechanics"
      kind: "invokes"
      brief: "Pressure equation enters the monolithic poromechanical system."
    - from: "MomentumBalance"
      to: "Poromechanics"
      kind: "invokes"
      brief: "Displacement equation enters the monolithic poromechanical system."
    - from: "pressure"
      to: "MomentumBalance"
      kind: "reads_state"
      brief: "PressureStress (effective stress) reads pressure to modify total stress (Biot coupling)."
    - from: "displacement"
      to: "FluidMassBalance (SinglePhaseFlow)"
      kind: "reads_state"
      brief: "PoroMechanicsPorosity reads displacement divergence to update porosity/storage source (Biot coupling)."
    - from: "temperature"
      to: "MomentumBalance"
      kind: "reads_state"
      brief: "ThermoPressureStress / ThermalExpansion read temperature for thermal stress (THM)."
    - from: "FluidMassBalance (SinglePhaseFlow)"
      to: "EnergyBalance"
      kind: "produces_output"
      brief: "Energy balance requires the Darcy flow field; flux feeds advective enthalpy transport."
    - from: "interface_displacement"
      to: "ContactMechanics"
      kind: "reads_state"
      brief: "DisplacementJump uses interface displacement to evaluate non-penetration/sliding."
    - from: "fracture_gap"
      to: "ConstitutiveLaws"
      kind: "reads_state"
      brief: "CubicLawPermeability reads mechanical aperture so fracture permeability depends on opening."
    - from: "contact_traction"
      to: "ContactMechanics"
      kind: "reads_state"
      brief: "Coulomb friction bound and complementarity functions evaluate on contact traction."
    - from: "Poromechanics"
      to: "Thermoporomechanics"
      kind: "invokes"
      brief: "Thermoporomechanics extends poromechanics with the energy balance."
    - from: "ConstitutiveLaws"
      to: "EquationSystem"
      kind: "produces_output"
      brief: "Constitutive operators are AD operators assembled into the global residual/Jacobian."
    - from: "Discretization (MPFA/MPSA/TPFA/VEM/RT0)"
      to: "EquationSystem"
      kind: "invokes"
      brief: "Discretization operators provide the matrices entering the assembled equation system."
    - from: "EquationSystem"
      to: "SolutionStrategy"
      kind: "produces_output"
      brief: "assemble_linear_system builds the sparse matrix + residual for the solver."
    - from: "SolutionStrategy"
      to: "NewtonSolver"
      kind: "invokes"
      brief: "run_*_model drives Newton iterations calling assemble/solve each step."
    - from: "NewtonSolver"
      to: "LinearSolver"
      kind: "invokes"
      brief: "Each Newton iteration solves the linearized system (pypardiso/scipy)."
    - from: "TimeManager"
      to: "SolutionStrategy"
      kind: "invokes"
      brief: "Drives the time loop; adaptive control reads Newton iteration counts to adjust dt."
    - from: "SolutionStrategy"
      to: "Exporter"
      kind: "produces_output"
      brief: "after_nonlinear_convergence calls save_data_time_step -> Exporter writes VTU/PVD."
    - from: "Exporter"
      to: "Outputs"
      kind: "produces_output"
      brief: "Per-subdomain VTU (cell data at cell centers, SI units) collected by a .pvd time series."
    - from: "Inputs"
      to: "ConstitutiveLaws"
      kind: "consumes_input"
      brief: "Material defaults (granite/water) feed permeability, moduli, Biot coefficient, etc."

states:
  variables:
    - name: "pressure"
      unit: "Pa"
      role: "prognostic"
    - name: "displacement"
      unit: "m"
      role: "prognostic"
    - name: "interface_displacement"
      unit: "m"
      role: "prognostic"
    - name: "temperature"
      unit: "K"
      role: "prognostic"
    - name: "contact_traction"
      unit: "Pa"
      role: "prognostic"
    - name: "interface_darcy_flux"
      unit: "m^3/s"
      role: "prognostic"
    - name: "interface_fourier_flux"
      unit: "W"
      role: "prognostic"
    - name: "interface_enthalpy_flux"
      unit: "W"
      role: "prognostic"
    - name: "enthalpy"
      unit: "J/kg"
      role: "diagnostic"
    - name: "rotation_stress"
      unit: "Pa*m"
      role: "diagnostic"
    - name: "total_pressure"
      unit: "Pa"
      role: "diagnostic"
    - name: "component_fractions"
      unit: "dimensionless"
      role: "prognostic"
    - name: "aperture"
      unit: "m"
      role: "diagnostic"
    - name: "specific_volume"
      unit: "m^k"
      role: "diagnostic"
    - name: "fracture_gap"
      unit: "m"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "pressure"
    validation_rank: 2
    unit: "Pa"
    description: "Fluid pressure field at cell centers across matrix, fracture, and intersection subdomains."
    emitted_in: "<file_name>_<subdomain>.vtu (collected in <file_name>.pvd)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Observation well head must be converted to pressure with a consistent reference datum and fluid density."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Mixed-dimensional cell-center values must be sampled to the observation grid; fracture vs matrix cells differ in dimension."]
      detrending_options: ["none"]
  - var: "displacement"
    validation_rank: 3
    unit: "m"
    description: "Mechanical displacement vector field at cell centers (matrix subdomains)."
    emitted_in: "<file_name>_<subdomain>.vtu"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Compare against surface/borehole deformation (e.g., tiltmeter/InSAR-derived) at matching support."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Sign/reference-frame conventions must match the observation."]
      detrending_options: ["none"]
  - var: "temperature"
    validation_rank: 1
    unit: "K"
    description: "Temperature field at cell centers (energy / THM models)."
    emitted_in: "<file_name>_<subdomain>.vtu"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Valid only in coupled THM runs; energy balance is not stand-alone."]
      detrending_options: ["none"]
  - var: "darcy_flux"
    validation_rank: 4
    unit: "m^3/s"
    description: "Darcy / interface flux on faces and codimension-one mortar interfaces."
    emitted_in: "<file_name>_<interface>.vtu (interface_darcy_flux mortar data)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Secondary/flux variables require explicit registration in data_to_export() or columns are missing."]
      detrending_options: ["none"]
  - var: "stress"
    validation_rank: 5
    unit: "Pa"
    description: "Mechanical stress field derived from the displacement solution (cell centers)."
    emitted_in: "<file_name>_<subdomain>.vtu (when registered)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Effective vs total stress convention must match the observation."]
      detrending_options: ["none"]
  - var: "fracture_aperture"
    validation_rank: 6
    unit: "m"
    description: "Derived fracture aperture (DisplacementJumpAperture / dimension-reduction state) on fracture cells."
    emitted_in: "<file_name>_<subdomain>.vtu (secondary/derived, via data_to_export)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Aperture is a derived state; direct field observation is rare and usually inferred from transmissivity."]
      detrending_options: ["none"]
  - var: "contact_traction"
    validation_rank: 7
    unit: "Pa"
    description: "Contact traction on fracture interfaces (normal + tangential Coulomb-friction components)."
    emitted_in: "<file_name>_<interface>.vtu"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Rarely directly observed; typically validated against manufactured-solution / benchmark cases rather than field data."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "fracture aperture"
      to: "fracture permeability"
