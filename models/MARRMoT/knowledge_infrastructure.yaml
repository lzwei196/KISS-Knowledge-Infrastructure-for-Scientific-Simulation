# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: MARRMoT
  language: matlab
  implementation:
    id: marrmot-octave-v212
    version: 2.1.2
    provenance: MATLAB/Octave; wknoben/Trotter MARRMoT toolbox driven from Python via an oct2py/BMI bridge.
  scientific_reference_version: MARRMoT v2.1.x (47 conceptual rainfall-runoff structures; object-oriented
    state-space reformulation, GMD 15:6359, 2022; numerics trace to v1.2 GMD 12:2463, 2019)
  binary:
    path: /usr/bin/octave
    type: work_dir
pipeline:
  stages:
  - s1_forcing_preparation
  - s2_parameter_estimation
  - s3_model_selection
  - s5_execution
  - s6_output_analysis
tools:
  count: 5
  files:
  - tools/calib_run.py
  - tools/convert_forcing.py
  - tools/convert_parameters.py
  - tools/parse_output.py
  - tools/run_marrmot.py
inputs:
  forcing:
  - name: Precipitation
    unit: mm/d
  - name: Potential evapotranspiration (Ep)
    unit: mm/d
  - name: Temperature
    unit: deg C
  parameters:
  - name: theta (model parameter vector)
    unit: mixed
  - name: Maximum soil/production store capacity (Smax; e.g. GR4J x1, HYMOD Cmax)
    unit: mm
  - name: Soil-moisture distribution / saturation-variability shape (e.g. HYMOD b/Bexp)
    unit: '-'
  - name: Reservoir rate constants / residence times (e.g. HYMOD kf, ks; GR4J x3 routing-store capacity)
    unit: 1/d or mm
  - name: Unit-hydrograph time base (e.g. GR4J x4, HBV maxbas)
    unit: d
  initial_conditions:
  - name: S0 (initial storage vector)
    unit: mm
  boundary_conditions:
  - name: Model structure selection (m_01..m_47)
    unit: '-'
  - name: delta_t (time step)
    unit: d
  - name: Solver options (resnorm_tolerance, resnorm_maxiter)
    unit: mm / count
  - name: Calibration objective function selection
    unit: '-'
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - Q
  - Ea
  - S
  - waterBalance
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.872, KGE=0.910, R=0.938, 2 scorecard(s)'
  metrics:
    best_nse: 0.8718
    best_kge: 0.9104
    best_r: 0.9376
summary:
  total_tools: 5
  total_stage_docs: 5
  total_diagnostic_triplets: 20
  generated: '2026-08-15'
