validation:
  - dag_variable: n2o_emission
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a daily N2O NSE acceptance band; Laub 2024 reports daily EF -0.44 to -0.03 by site, i.e. poor daily timing skill."
        cites: []
    secondary_metrics:
      - metric: nse
        direction: maximize
        status: structurally_limited
        ceiling_reason: "Daily N2O is pulse dominated: Laub reports a 'poor match' for daily N2O and attributes timing difficulty to microbial processes, tipping-bucket soil water, and missing gas diffusivity; Necpalova reports DayCent missed fertilization-event N2O spikes."
        cites: [laub2024, necpalova2015, brilli2017]
    validated_when: "UNRESOLVED for daily point fluxes; use cumulative/seasonal N2O where possible, not daily NSE alone."
    evidence_strength: weak
    confidence: 0.35
    notes: "Daily flux validation is structurally limited by pulse timing; no numeric daily NSE threshold was found in the fetched texts."

  - dag_variable: n2o_emission
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: null, good: null, satisfactory: 8.74}
        pass_band: satisfactory
        band_note: "Benchmark-achieved annual N2O relative mean deviation from Cui 2014 Table 3; not a universal tier."
        cites: [cui2014]
    secondary_metrics:
      - metric: nse
        direction: maximize
        status: supportive
        ceiling_reason: "Laub 2024 reports cumulative seasonal N2O EF 0.06 to 0.69 by site, much better than daily N2O EF."
        cites: [laub2024]
    validated_when: "|PBIAS| no worse than the fetched annual/cumulative benchmark, and daily pulse mismatch is not used alone to reject regional totals."
    evidence_strength: moderate
    confidence: 0.55
    notes: "Cui reports annual N2O RMSE 19.45%, RMD 8.74%, ME 0.57; Laub reports cumulative seasonal DayCent N2O is more accurate than daily fluxes."

  - dag_variable: no_emission
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched DayCent NO point-time-series NSE convention; DNDC annual NO benchmarks do not justify a daily DayCent NSE gate."
        cites: []
    secondary_metrics:
      - metric: annual_pbias
        direction: zero_centered
        status: supportive
        ceiling_reason: "Cui 2014 reports annual NO RMD 0.32% and ME 0.53 in a crop biogeochemistry benchmark."
        cites: [cui2014]
    validated_when: "UNRESOLVED for daily NO; annual magnitude agreement may contextualize but cannot auto-validate daily NSE."
    evidence_strength: weak
    confidence: 0.3
    notes: "NO has even thinner fetched DayCent validation literature than N2O; keep the dag nse metric but leave its band null."

