- id: dt_lpjguess_001
  description: '{''description'': ''GPP and respiration unrealistically high (~300
    degC regime). Temperature-dependent scalars saturated. Parabolic temperature response
    returns zero but Q10 respiration explodes.''}'
  affected_output: '{''root_cause'': ''Air temperature forcing supplied in Kelvin
    instead of degrees Celsius. CMFD and MSWX provide temperature in K, but LPJ-GUESS
    expects deg C.''}'
  detection: '{''root_cause'': ''Air temperature forcing supplied in Kelvin instead
    of degrees Celsius. CMFD and MSWX provide temperature in K, but LPJ-GUESS expects
    deg C.''}'
  fix: '{''action'': ''Subtract 273.15 from all temperature values before passing
    to LPJ-GUESS. Validate that TA values fall within -50 to +55 deg C range.''}'
- id: dt_lpjguess_002
  description: '{''description'': ''Precipitation effectively zero. Vegetation dies
    from permanent drought. Water balance shows no input despite using CMFD data.''}'
  affected_output: '{''root_cause'': ''Precipitation left in kg/m2/s (CMFD native
    unit) instead of converted to mm/day. A typical value of 1.15e-5 kg/m2/s (1 mm/day)
    is interpreted as near-zero mm/day.''}'
  detection: '{''root_cause'': ''Precipitation left in kg/m2/s (CMFD native unit)
    instead of converted to mm/day. A typical value of 1.15e-5 kg/m2/s (1 mm/day)
    is interpreted as near-zero mm/day.''}'
  fix: '{''action'': ''Multiply CMFD precipitation by 86400 to convert from kg/m2/s
    to mm/day. For MSWX (mm/3hr), sum 8 timesteps per day. Validate daily P is in
    the 0-300 mm/day range.''}'
