package:
  name: wflow
  language: julia
  implementation:
    id: wflow-jl
    version: 1.1.0-dev
    provenance: Julia; Deltares Wflow.jl package (github.com/Deltares/Wflow.jl), CSDMS standard-name TOML
      configuration.
  scientific_reference_version: Wflow.jl v1.x (CSDMS standard-name TOML era); wflow_sbm SBM concept per
    van Verseveld et al. 2024 GMD
  binary:
    path: KISSPATH_KI_ROOT/wflow/knowledge_infrastructure/julia/wflow_runner.jl
    type: Julia
pipeline:
  stages:
  - s0_configuration_skill
  - s10_reservoir_skill
  - s1_hydromt_setup_skill
  - s2_forcing_skill
  - s3_parameters_skill
  - s4_execution_skill
  - s5_output_skill
  - s6_s8_sediment_skill
  - s9_coupling_skill
tools:
  count: 24
  files:
  - tools/run_wflow_full_pipeline.py
  - tools/s0_config/setup_wflow_config.py
  - tools/s10_reservoir/configure_reservoirs.py
  - tools/s10_reservoir/lookup_dams.py
  - tools/s1_hydromt/build_data_catalog.py
  - tools/s1_hydromt/derive_landsurface_params.py
  - tools/s1_hydromt/fetch_merit_hydro_tiles.py
  - tools/s1_hydromt/run_hydromt_build.py
  - tools/s2_forcing/calculate_pet.py
  - tools/s2_forcing/convert_forcing_to_wflow.py
  - tools/s3_parameters/adjust_parameters.py
  - tools/s3_parameters/generate_wflow_toml.py
  - tools/s4_execution/run_wflow.py
  - tools/s5_postprocess/compare_with_vic.py
  - tools/s5_postprocess/extract_discharge.py
  - tools/s5_postprocess/extract_spatial_output.py
  - tools/s5_postprocess/water_balance.py
  - tools/s6_sediment/build_sediment_model.py
  - tools/s6_sediment/derive_usle_c.py
  - tools/s6_sediment/derive_usle_k.py
  - tools/s6_sediment/run_wflow_sediment.py
  - tools/s8_sediment_post/analyze_sediment.py
  - tools/s9_coupling/wflow_recharge_to_modflow.py
  - tools/s9_coupling/wflow_to_cama.py
inputs:
  forcing:
  - name: precipitation
    unit: mm Δt⁻¹
  - name: air temperature
    unit: °C
  - name: potential (reference) evapotranspiration
    unit: mm Δt⁻¹
  parameters:
  - name: vertical saturated hydraulic conductivity (KsatVer)
    unit: mm Δt⁻¹
  - name: horizontal conductivity fraction (KsatHorFrac)
    unit: dimensionless
  - name: Ksat exponential decay parameter (f)
    unit: m⁻¹ (mm⁻¹ in KI parameter table)
  - name: soil thickness (SoilThickness)
    unit: mm
  - name: Brooks-Corey exponent (c)
    unit: dimensionless
  - name: saturated / residual water content (θS, θR)
    unit: dimensionless
  - name: compacted infiltration capacity (InfiltCapSoil)
    unit: mm Δt⁻¹
  - name: rooting depth (RootingDepth)
    unit: mm
  - name: canopy/LAI parameters (max canopy storage, LAI, light extinction, canopy gap fraction, crop
      coefficient)
    unit: mm / m² m⁻² / dimensionless
  - name: snow degree-day and threshold parameters (degree-day coefficient, snowfall/melt thresholds,
      liquid water holding capacity)
    unit: mm °C⁻¹ Δt⁻¹ / °C / fraction
  - name: glacier parameters (initial ice equivalent, melting threshold, degree-day coefficient, accumulation
      fraction, glacier area fraction)
    unit: mm / °C / mm °C⁻¹ Δt⁻¹ / dimensionless
  - name: river Manning roughness (N_River) and overland Manning roughness
    unit: s m⁻¹ᐟ³
  - name: river/land geometry (slope, river width, bankfull depth, river length)
    unit: m m⁻¹ / m
  - name: paved/impervious fraction (PathFrac)
    unit: dimensionless
  - name: USLE C cover-management factor
    unit: dimensionless
  - name: USLE K soil-erodibility factor
    unit: t·ha·h·ha⁻¹·MJ⁻¹·mm⁻¹ (SI)
  - name: grain-size fractions (clay/silt/sand/small-agg/large-agg) and river-bed D50
    unit: fraction / mm
  initial_conditions:
  - name: initial model states (soil/snow/glacier/interception/surface/river storages)
    unit: mm / m / m³ s⁻¹
  - name: initial reservoir water level (waterlevel_reservoir)
    unit: m
  boundary_conditions:
  - name: DEM / elevation (wflow_dem)
    unit: m
  - name: local drain direction (wflow_ldd)
    unit: dimensionless (D8 code)
  - name: subcatchment mask (wflow_subcatch) and river mask (wflow_river)
    unit: dimensionless
  - name: model configuration switches (variant sbm/sbm_gwf/sediment, routing method kinematic vs local_inertial,
      reservoir__flag, lake__flag, glacier toggle, cold_start__flag)
    unit: dimensionless
  - name: simulation window and timestep (starttime, endtime, timestepsecs)
    unit: datetime / s
  - name: lateral/external inflows and abstractions
    unit: m³ s⁻¹ (routing) / mm Δt⁻¹ (land)
  - name: reservoir operating parameters (ResMaxVolume, reservoir_area, ResDemand, ResMaxRelease, ResTargetFullFrac,
      ResTargetMinFrac, outflowfunc, storfunc)
    unit: m³ / m² / m³ s⁻¹ / dimensionless
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - river discharge (q_river / river_water__volume_flow_rate)
  - unrouted runoff (runoff)
  - actual evapotranspiration (actevap)
  - soil moisture / saturated water depth (satwaterdepth)
  - snow water equivalent (SWE)
  - groundwater recharge
  - reservoir storage (storage_reservoir / reservoir_water__volume)
  - soil loss / erosion rate (soilloss)
  - sediment yield / specific yield at outlet
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.634, KGE=0.743, R=0.838, 5 scorecard(s)'
  metrics:
    best_nse: 0.6337277917712852
    best_kge: 0.7432536807622891
    best_r: 0.838
summary:
  total_tools: 24
  total_stage_docs: 9
  total_diagnostic_triplets: 39
  generated: '2026-08-15'
