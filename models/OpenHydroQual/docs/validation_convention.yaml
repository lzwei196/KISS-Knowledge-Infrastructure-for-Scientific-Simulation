validation:
- obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
      very_good: 0.8
      good: 0.7
      satisfactory: 0.5
    pass_band: satisfactory
    cites:
    - moriasi2015
    - moriasi2007
  - metric: pbias
    direction: zero_centered
    unit: percent
    bands:
      very_good: 5.0
      good: 10.0
      satisfactory: 15.0
    pass_band: satisfactory
    cites:
    - moriasi2015
  secondary_metrics:
  - metric: r2
    direction: maximize
    status: supportive
    ceiling_reason: Moriasi 2015 co-reports R2 for flow (monthly R2 > 0.85 very good, satisfactory > 0.70);
      informative, not the decision metric.
    cites:
    - moriasi2015
  validated_when: monthly/daily NSE >= 0.50 (satisfactory) AND |PBIAS| <= 15% (Moriasi flow tiers)
  evidence_strength: strong
  confidence: 0.85
  notes: 'Moriasi 2015 recommended flow criteria (D-M-A): "NSE > 0.80 [very good], 0.70 < NSE <= 0.80
    [good], 0.50 < NSE <= 0.70 [satisfactory], NSE <= 0.50 [unsatisfactory]" and "PBIAS < +/-5 [very good]
    ... 10 <= PBIAS < +/-15 [satisfactory], PBIAS >= +/-15 [unsatisfactory]". Moriasi 2007 corroborates
    the general satisfactory boundary "NSE > 0.50 and RSR < 0.70". dag determining_metric (nse) retained
    as headline; PBIAS added as a co-headline per the standard.'
  dag_variable: flow
- obs_shape: point_time_series
  headline_metrics:
  - metric: nse
    direction: maximize
    unit: dimensionless
    bands:
