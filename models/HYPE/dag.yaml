  citation_index:
    lindstrom2010_hype_development:
      short_citation: "Lindstrom et al. 2010"
      doi: "10.2166/nh.2010.007"
      note: "Foundational HYPE development/testing; stepwise calibration identifies wcep, wcfc, rrcs1/rrcs2, cevp, rivvel as controlling soil runoff, recession, ET and discharge."
    pechlivanidis2015_indiahype_pub:
      short_citation: "Pechlivanidis & Arheimer 2015"
      doi: "10.5194/hess-19-4559-2015"
      note: "India-HYPE modified-PUB stepwise calibration; cevp, rrcs and soil-water capacity dominate discharge across climates."
    bajracharya2020_hype_tvsa:
      short_citation: "Bajracharya et al. 2020"
      doi: "10.3390/w12040961"
      note: "Time-variant VARS sensitivity analysis (Nelson-Churchill, cold region); snowmelt (ttmp, cmlt) and frozen-soil parameters highly influential in seasonal windows."
    brendel2023_hype_multiobjective:
      short_citation: "Brendel et al. 2023"
      doi: "10.1016/j.ejrh.2023.101544"
      note: "Pan-European multi-objective PEST calibration; wcep (rank 1), rivvel and cevp most sensitive for discharge and sediments."
    fuentesandino2022_hype_paramtransfer:
      short_citation: "Fuentes-Andino et al. 2022"
      doi: "10.1080/02626667.2022.2121165"
      note: "Daily-to-hourly parameter transfer over Sweden; recession (rrcs1/rrcs2) and routing parameters most time-step-sensitive for hydrograph shape."

safety:
  hazards:
    - id: "slc_fractions_not_summing_to_one"
      kind: "soil_semantic"
      description: "SLC class fractions in GeoData.txt not summing to 1.0 per subbasin silently lose the deficit fraction of precipitation, corrupting the water balance with no warning (exit 0)."
      severity: "silent"
    - id: "area_unit_km2_vs_m2"
      kind: "soil_semantic"
      description: "GeoData.txt AREA entered in km^2 instead of m^2 scales simulated discharge by ~1e6 (discharge scales linearly with area)."
      severity: "silent"
    - id: "soil_retention_ordering_violation"
      kind: "soil_semantic"
      description: "Soil parameters violating wcwp < wcfc < wcep (or pore-volume sum >= 1) suppress percolation, yielding zero discharge while the model still runs."
      severity: "silent"
    - id: "par_value_count_mismatch"
      kind: "coefficient_runtime_silent_fallback"
      description: "par.txt value count must equal the MAX land-use/soil ID in GeoClass.txt (by highest ID, not unique count); too few values is fatal, too many are ignored."
      severity: "fatal_or_silent"
    - id: "geoclass_numlayers_mismatch"
      kind: "soil_semantic"
      description: "GeoClass numlayers (col 11) outside 1-3 or with a mismatched count of soildepth columns is fatal or silently shifts column parsing."
      severity: "fatal_or_silent"
    - id: "water_class_missing_special_code"
      kind: "control_semantic"
      description: "A lake/water SLC class not flagged with the lake special code is treated as normal land, so lake regulation is silently ignored (or a zero-volume lake traps all water)."
      severity: "silent"
    - id: "streamdepth_zero"
      kind: "control_semantic"
      description: "GeoClass streamdepth (col 10) = 0 makes soil-runoff generation return early, producing zero discharge while the model runs (undocumented)."
      severity: "silent"
    - id: "rivlen_zero_no_routing_delay"
      kind: "control_semantic"
      description: "RIVLEN ~0 in GeoData.txt eliminates channel translation time, producing an unrealistically peaky hydrograph."
      severity: "degraded"
    - id: "maindown_cyclic_topology"
      kind: "control_semantic"
      description: "MAINDOWN references forming a cycle, or no outlet (MAINDOWN=0), cause an infinite routing loop / crash."
      severity: "fatal"
    - id: "forcing_date_gaps"
      kind: "weather_file_semantic"
      description: "Pobs/Tobs not covering the full bdate-edate range is fatal ('date not equal'); HYPE performs no interpolation or gap-fill."
      severity: "fatal"
    - id: "forcing_tab_separator_or_comment_rows"
      kind: "weather_file_semantic"
      description: "Non-TAB separators, or !! comment rows displacing the line-1 header, silently misparse forcing to zeros."
      severity: "silent"
    - id: "forckey_subid_mismatch"
      kind: "weather_file_semantic"
      description: "ForcKey.txt SUBIDs (forcing-station mapping) not matching GeoData.txt SUBIDs leave the unmatched subbasins running with zero precipitation, silently dropping upstream contribution to outlet discharge (exit 0)."
      severity: "silent"
    - id: "nutrient_params_missing"
      kind: "coefficient_runtime_silent_fallback"
      description: "info.txt enabling N/P substances without the required nutrient parameters in par.txt leaves nutrient output all zero while the model still runs."
      severity: "silent"
    - id: "directory_path_no_trailing_slash"
      kind: "control_semantic"
      description: "Directory paths in info.txt without a trailing slash yield mis-concatenated 'dirfilename' paths and silent file-not-found at startup."
      severity: "fatal"
  validation_limits:
    - "Daily default timestep cannot resolve sub-daily processes; PET models 3-5 and some equations are of uncertain validity at sub-daily steps."
    - "Lumped (1-subbasin) setups of large (>10,000 km^2) basins have no inter-subbasin routing attenuation, biasing peak discharge (e.g. PBIAS ~+20%)."
    - "Lumped setups produce unrealistic dissolved IN/SP nutrient concentrations (accumulate without downstream export); use 3+ subbasins for water quality."
    - "Recharge-discharge (regional groundwater) model excludes glacier/surface-water classes and rootzone-leakage/travel-time soil-model classes."
    - "Conceptual (not purely physical) algorithms requiring basin-specific calibration; uncalibrated transfer degrades performance."
    - "subid must be an integer < 10^7; sequence number integer 0-999; path argument <= 200 characters."
  warnings:
    - "Generated lake rating curves and DamData monthly natural inflows are estimates needing calibration."
    - "Use modelled-concentration outputs (c1*) for simulated values and recorded (re*/r*) variables only where observed nutrient data exist."
    - "Nutrient pools require multi-year warmup (3-5 yr) before seasonal patterns stabilize; report only post-warmup periods."
    - "Regulated-lake constant-area-with-depth assumption can make simulated water-level variation differ from observed; mitigate via wamp."
  assumptions:
    - statement: "Subbasin is a 1-D vertical soil column (up to 3 layers, root zone = upper 2 layers) per SLC class, aggregated by fractional area; land classes compute in parallel with no inter-class interaction unless the recharge-discharge model is enabled."
      scope: "soil and land-routine geometry"
      source: "SMHI HYPE wiki Land routines (hype.smhi.net) and soilmodel0.f90 / modvar.f90 (maxsoillayers=3, nrootzone=2)"
      status: "adopted"
    - statement: "Water balance is mass-conservative across subbasins and SLC classes; substances are carried as concentrations following each water flux plus immobile soil/sediment pools, with no surface energy-balance closure."
      scope: "conservation / closure"
      source: "SMHI HYPE wiki model description (mass-conservative balance, wb* files) and general_wc.f90 add_water/remove_water primitives"
      status: "adopted"
    - statement: "PET model enumeration follows the canonical SMHI wiki (options 0-5: temperature-index, Jensen-Haise/McGuiness, Hargreaves, Hargreaves-Samani, Priestley-Taylor, FAO Penman-Monteith); models 3-5 require additional radiation/humidity/wind forcing."
      scope: "potential-evapotranspiration option codes"
      source: "SMHI HYPE wiki Processes above ground / Potential evaporation (hype.smhi.net)"
      status: "adopted"
    - statement: "Default river/stream exists in every subbasin with length = sqrt(subbasin land area) unless RIVLEN is given (RIVLEN=0 => no river); each subbasin receives upstream main-river inflow in downstream row order via MAINDOWN."
      scope: "routing topology and channel geometry"
      source: "SMHI HYPE wiki Rivers and lakes (hype.smhi.net) and sw_proc.f90 routing"
      status: "adopted"
    - statement: "Modelled nutrient concentration outputs (c1*) are reported in ug/L for the 5.35.0 build, distinct from areal nutrient loads (kg/ha/yr)."
      scope: "nutrient output units"
      source: "HYPE 5.35.0 SKILL.md output table and SMHI HYPE wiki variable reference"
      status: "tentative"

medium_evidence:
  - var: "evap"
    source: "CAPABILITY_INVENTORY.md"
    quote: "Reduces PET based on soil moisture (lp parameter), splits between soil layers, handles snow evaporation option."
    note: "Actual evapotranspiration is a subbasin soil-water and land-surface flux, not a surface-water concentration or temperature."
  - var: "c1TN"
    source: "dag.yaml"
    quote: "Nitrogen cycle (inorganic N, organic N) in soil and surface water"
    note: "The fixed c1TN output is the computed main-flow concentration; the model scope declares nitrogen as present in surface water."
  - var: "c1TP"
    source: "dag.yaml"
    quote: "Phosphorus cycle (soluble P, particulate P) in soil and surface water"
    note: "The fixed c1TP output is the computed main-flow concentration; the model scope declares phosphorus as present in surface water."
