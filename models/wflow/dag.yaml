safety:
  hazards:
    - id: "forcing_precip_wrong_unit"
      kind: "weather_file_semantic"
      description: "Precipitation in mm/s or mm/3hr instead of mm/timestep silently scales runoff by up to 86400x; no internal unit check (dt_w001)."
      severity: "silent"
    - id: "forcing_temp_in_kelvin"
      kind: "weather_file_semantic"
      description: "Temperature left in Kelvin breaks the snow phase split and degree-day melt and corrupts PET; snow never accumulates or accumulates in the tropics (dt_w002, dt_w004)."
      severity: "silent"
    - id: "forcing_pet_missing_or_zero"
      kind: "weather_file_semantic"
      description: "Missing/zero PET (or mm/s vs mm/day) makes all precipitation become runoff, or ET extreme (dt_w003)."
      severity: "silent"
    - id: "ksat_cross_model_unit_mismatch"
      kind: "soil_semantic"
      description: "KsatVer transferred from another model without unit conversion (VIC mm/s, MODFLOW m/day) makes soil up to 86400x too permeable (dt_w026)."
      severity: "silent"
    - id: "brooks_corey_c_missing_layer_dim"
      kind: "soil_semantic"
      description: "Brooks-Corey 'c' stored 2D (y,x) instead of 3D (layer,y,x) raises a misleading 'type InputEntries has no field' error (dt_w031_brooks_corey)."
      severity: "fatal"
    - id: "f_decay_too_low_flat_hydrograph"
      kind: "soil_semantic"
      description: "f (Ksat decay) too low keeps conductivity high with depth; nearly all water becomes baseflow → flat, peakless hydrograph (dt_w017)."
      severity: "silent"
    - id: "inactive_cells_zero_not_nan"
      kind: "soil_semantic"
      description: "Inactive staticmaps cells set to 0 instead of NaN are treated as active zero-parameter cells, silently corrupting the simulation (dt_w029)."
      severity: "silent"
    - id: "missing_state_mappings_cold_start"
      kind: "initial_condition_semantic"
      description: "All 11 state variables must be declared in TOML [state.variables] even for cold start, or the run crashes (dt_w030)."
      severity: "fatal"
    - id: "ldd_cycles_or_boundary_pits"
      kind: "control_semantic"
      description: "LDD cycles or boundary cells not marked as pits in both numpy- and wflow-space cause 'cycles detected in flow graph' / BoundsError (dt_w014, dt_w027)."
      severity: "fatal"
    - id: "grid_dim_mismatch"
      kind: "control_semantic"
      description: "staticmaps.nc and forcing.nc with mismatched spatial dimensions raise DimensionMismatch (dt_w008)."
      severity: "fatal"
    - id: "toml_version_mismatch"
      kind: "control_semantic"
      description: "v1.0 CSDMS-name TOML on pre-v1.0 Wflow.jl (or vice versa) raises MethodError/KeyError on startup (dt_w006, dt_w010, dt_w022)."
      severity: "fatal"
    - id: "toml_scale_zero_zeroes_map"
      kind: "control_semantic"
      description: "TOML scale=0 silently overrides a NetCDF spatial parameter map, making the parameter uniformly zero (dt_w012)."
      severity: "silent"
    - id: "river_mask_all_zero_or_one"
      kind: "control_semantic"
      description: "wflow_river mask all-zeros → zero flow; all-ones (placeholder) → unphysically fast routing, silently (dt_w013)."
      severity: "silent"
    - id: "grid_y_axis_ascending"
      kind: "control_semantic"
      description: "staticmaps y-axis ascending instead of descending inverts the LDD (dt_w034 in KI listing)."
      severity: "silent"
    - id: "usle_k_us_units"
      kind: "soil_semantic"
      description: "USLE K factor in US-customary units instead of SI gives ~7.6x wrong sediment yield (USLE K SI = US × 0.1317) (dt_w005)."
      severity: "silent"
    - id: "usle_c_near_zero"
      kind: "soil_semantic"
      description: "USLE C factor near-zero everywhere (wrong land cover) → silent zero erosion (dt_w018)."
      severity: "silent"
    - id: "grain_fractions_not_unit_sum"
      kind: "soil_semantic"
      description: "The five grain-size fractions not summing to 1.0 per cell leave the sediment budget unclosed (dt_w019)."
      severity: "silent"
    - id: "reservoir_maxvolume_mcm"
      kind: "control_semantic"
      description: "ResMaxVolume in MCM instead of m³ (1e6 too small) → immediate overflow, no regulation (dt_w031_reservoir)."
      severity: "silent"
    - id: "reservoir_area_km2"
      kind: "control_semantic"
      description: "reservoir_area in km² instead of m² (1e6 too small) → negligible evaporation, unrealistic levels (dt_w033)."
      severity: "silent"
    - id: "reservoir_off_river_cell"
      kind: "control_semantic"
      description: "Reservoir not located on a river cell is silently ignored; discharge identical to a no-reservoir run (dt_w032)."
      severity: "silent"
    - id: "glacier_frac_all_zero"
      kind: "control_semantic"
      description: "GlacierFrac all-zeros with the glacier flag on → silent zero glacier melt (dt_w016)."
      severity: "silent"
    - id: "placeholder_river_geometry"
      kind: "control_semantic"
      description: "Placeholder (non-DEM-derived) upstream area / river width / slope → discharge magnitude 2-3x off with correct timing (dt_w015)."
      severity: "silent"
  validation_limits:
    - "Kinematic-wave routing assumes flow controlled by bed slope and cannot represent backwater effects; use local inertial routing where backwater matters."
    - "Built-in glacier is degree-day only; not suitable for detailed glacier-dynamics studies (delegate to a dedicated glacier model and avoid double-counting melt)."
    - "wflow already routes internally; feeding routed q_river into an external router (e.g. CaMa-Flood) double-counts routing → ~2x discharge."
    - "wflow loads the entire spatial grid into memory; large fine-resolution domains exceed RAM (OutOfMemoryError) (dt_w007)."
    - "Daily-default timestep cannot resolve sub-daily processes unless run sub-daily (which also switches interception Gash → modified Rutter)."
  warnings:
    - "A 30-60 s silence on the first run is Julia JIT compilation, NOT a hang — do not kill the process (dt_w009)."
    - "wflow vs another model (e.g. VIC) discharge differing 3-5x for the same basin/forcing is structural uncertainty (different infiltration physics, snow, PET), not a validation failure (dt_w020)."
    - "Vertical hydraulic conductivity profile must be chosen explicitly (exponential default, exponential_constant, layered, layered_exponential)."
    - "KsatHorFrac is applied as a multiplier on KsatVer; lateral subsurface conductivity = KsatHorFrac × KsatVer."
  assumptions:
    - statement: "Snow and glacier melt use a temperature-index (degree-day) approach with precipitation phase split by temperature thresholds; no surface energy-balance melt."
      scope: "snow and glacier modules"
      source: "Wflow.jl SBM land-hydrology docs (deltares.github.io/Wflow.jl model_docs/land/landhydrology_sbm.html)"
      status: "adopted"
    - statement: "Interception scheme is timestep-dependent: Gash at daily Δt, modified Rutter at sub-daily Δt."
      scope: "rainfall-interception module"
      source: "Wflow.jl SBM land-hydrology docs and rainfall_interception module"
      status: "adopted"
    - statement: "Mass-balance closure is for water (per-timestep land/river/reservoir storage diagnostics); there is no closed surface energy budget."
      scope: "whole-model conservation"
      source: "Wflow.jl mass_balance documentation section"
      status: "adopted"
    - statement: "Several rate parameters (e.g. cfmax, kh, recharge, cf_soil) are internally rescaled by dt/BASETIMESTEP (86400 s); this daily-reference rescaling is an undocumented unit-conversion assumption."
      scope: "timestep handling of rate parameters"
      source: "BASETIMESTEP constant and update_model! coupling in Wflow.jl src (utils.jl, sbm_model.jl)"
      status: "tentative"
