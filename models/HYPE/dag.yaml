    - from: "wcep (effective porosity)"
      to: "cout (computed discharge)"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["brendel2023_hype_multiobjective", "lindstrom2010_hype_development"]
    - from: "wcep (effective porosity)"
      to: "soil_runoff"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
      citations: ["brendel2023_hype_multiobjective", "lindstrom2010_hype_development"]
    - from: "rivvel (river velocity)"
      to: "cout (discharge peak timing)"
      sensitivity_grade: HIGH
      basis: literature_quantitative
