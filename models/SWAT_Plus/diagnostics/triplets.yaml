# ========================================================================
# SWAT+ Diagnostic Triplets
# ========================================================================
# 56 triplets. Converted 2026-08-12 from the `triplets:` mapping to the
# canonical TOP-LEVEL LIST. Content is byte-verified identical — this changes the
# container only. The two-shape ambiguity is what let the self-improve overlay read
# a corpus as empty and overwrite it.
# ========================================================================

# Comments preserved from the previous file:
# ============================================================================
# Diagnostic Triplets — SWAT+ Knowledge Infrastructure
# ============================================================================
# Each triplet encodes one piece of operational debugging knowledge:
#   symptom  -> what the agent observes
#   diagnosis -> why it happened
#   remedy   -> what to do about it
#
# Failure domains: path_resolution, parameter_format, unit_conversion,
#   dependency_mismatch, compilation, runtime, silent_error, environment
#
# Severity: fatal, degraded, warning, silent
# ============================================================================
  # --- PATH AND FILE REFERENCE ERRORS ---
  # --- WEATHER FORMAT ERRORS ---
  # --- SILENT WEATHER ERRORS ---
  # --- HRU THRESHOLD BIAS ---
  # --- FORTRAN RUNTIME ERRORS ---
  # --- SOIL FORMAT ERRORS ---
  # --- COMPILATION ERRORS ---
  # --- WRONG WATERSHED ---
  # --- OBJECT COUNT MISMATCH ---
  # --- NUTRIENT MASS BALANCE ---
  # --- MANAGEMENT SEQUENCE ERROR ---
  # --- SOLAR RADIATION UNIT ERROR ---
  # --- CALIBRATION PARAMETER ERRORS ---
  # --- EXECUTION CRASH GENERIC ---
  # --- WATER BALANCE NOT CLOSING ---
  # ===========================================================================
  # VERIFIED ERRORS (found during HydroCraft integration testing 2026-03-19)
  # ===========================================================================
  # ---- ADDED 2026-03-20 FROM SESSION FINDINGS ----
  # --- WATER QUALITY: ZERO NUTRIENT OUTPUT ---
  # --- WATER QUALITY: EXTREME SEDIMENT YIELD ---
  # --- WATER QUALITY: NEGATIVE NUTRIENT BALANCE ---
  # --- WATER QUALITY CHANNEL ROUTING ISSUES ---
  # ============================================================================
  # SILENT PARAMETER ERRORS (dt_023 -- dt_030)
  # Added 2026-04-03: Known silent-error triplets from testing campaigns
  # ============================================================================
  # ============================================================================
  # OUTPUT CONFIGURATION AND CALIBRATION DIAGNOSTICS (dt_031 -- dt_037)
  # ============================================================================

- id: dt_001
  stage: s7_simulation_config
  failure_domain: path_resolution
  symptom:
    description: SWAT+ crashes immediately at startup with a Fortran 'file not found' or 'cannot open
      file' error. The binary exits with a non-zero code within the first second of execution.
    error_pattern: 'Error: Cannot open file|STOP|open.*status.*old.*err'
    detection_method: log_match
  diagnosis:
    root_cause: A file listed in file.cio does not exist in the TxtInOut directory.
    explanation: 'file.cio lists all required input files by category. SWAT+ opens every referenced file
      at initialization. If any file is missing, the Fortran OPEN statement fails and the program stops.
      This commonly happens when optional files are listed without ''null'' (e.g., reservoir files when
      no reservoirs exist), or when files were renamed after file.cio was generated.

      '
    affected_components:
    - file.cio
    - TxtInOut directory
  remedy:
    action: Run validate_txtinout to identify the missing file(s). Either create the file or replace the
      reference with 'null' in file.cio.
    tool_to_run: validate_txtinout
    manual_steps:
    - Parse file.cio and list all referenced filenames
    - 'Check each filename exists in TxtInOut: ls TxtInOut/<filename>'
    - 'For missing files: replace filename with ''null'' in file.cio if optional, or generate the file
      if required'
    prevention: Always run validate_txtinout before every simulation.
  severity: fatal
  cross_references:
  - dt_009
- id: dt_002
  stage: s3_weather_preparation
  failure_domain: parameter_format
  symptom:
    description: SWAT+ crashes during initialization when reading weather files. Error message references
      weather file parsing or unexpected data format. May also manifest as NaN values in output.
    error_pattern: Error reading|format error|NaN|end-of-file during read
    detection_method: log_match
  diagnosis:
    root_cause: Weather input files (.pcp, .tmp, .slr, .hmd, .wnd) have wrong number of header lines or
      incorrect column format.
    explanation: 'SWAT+ expects exactly 3 header lines in each weather file: (1) title, (2) column headers,
      (3) station metadata (nbyr, tstep, lat, lon, elev). Data starts on line 4. If header lines are missing,
      SWAT+ reads header text as numeric data (producing NaN). If extra blank lines exist, data rows are
      offset. The file is space-delimited — tab characters can also cause parsing failures.

      '
    affected_components:
    - '*.pcp, *.tmp, *.slr, *.hmd, *.wnd files'
    - weather-sta.cli
  remedy:
    action: Verify each weather file has exactly 3 header lines. Check for tabs (replace with spaces).
      Validate column count matches expected format.
    tool_to_run: validate_weather_data
    manual_steps:
    - head -5 TxtInOut/<station>.pcp — line 4 should be first data row
    - 'Check for tab characters: cat -A TxtInOut/<station>.pcp | head -5'
    - 'Verify column count: awk ''{print NF}'' TxtInOut/<station>.pcp | sort -u'
    prevention: Always use prepare_weather_files tool which enforces correct format.
  severity: fatal
  cross_references:
  - dt_003
  - dt_012
- id: dt_003
  stage: s3_weather_preparation
  failure_domain: silent_error
  symptom:
    description: SWAT+ runs to completion but ET is unreasonably high or low, snowmelt timing is wrong,
      or hydrograph shape does not match observations. No error messages.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Temperature file has Tmax < Tmin for some or all days, or temperature is in wrong units
      (K vs C).
    explanation: 'SWAT+ does not validate that Tmax >= Tmin. If they are swapped, the model computes negative
      temperature range, which produces wrong PET (Hargreaves method uses Tmax-Tmin), wrong snowmelt (depends
      on mean T), and wrong crop growth (heat units depend on daily mean T). The model still produces
      plausible-looking output. Similarly, temperature in Kelvin (~300) instead of Celsius (~25) makes
      all temperature-dependent processes wildly wrong.

      '
    affected_components:
    - '*.tmp files'
    - ET calculation
    - Snow processes
    - Crop growth
  remedy:
    action: 'Validate all .tmp files: check Tmax >= Tmin for every row. If mean temperature > 200, data
      is likely in Kelvin — subtract 273.15.'
    tool_to_run: validate_weather_data
    manual_steps:
    - 'python -c "import pandas as pd; df=pd.read_csv(''station.tmp'', skiprows=3, delim_whitespace=True,
      names=[''yr'',''jday'',''tmax'',''tmin'']); print(f''Tmax<Tmin: {(df.tmax<df.tmin).sum()} rows'');
      print(f''Mean T: {df[[''tmax'',''tmin'']].mean().mean():.1f}'')"'
    - 'If Tmax < Tmin: swap columns in the source data'
    - 'If mean T > 200: subtract 273.15 from both columns'
    prevention: Always run validate_weather_data after generating weather files.
  severity: silent
  cross_references:
  - dt_012
- id: dt_004
  stage: s2_hru_definition
  failure_domain: silent_error
  symptom:
    description: Simulated water yield or nutrient loads are significantly biased compared to observations,
      despite reasonable weather and soil inputs. Model runs without errors.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: HRU thresholds are too aggressive (>20%), removing significant land use or soil types
      and biasing the basin-average properties.
    explanation: 'When HRU thresholds eliminate land uses that occupy <20% of a subbasin, the redistributed
      area changes the effective land use distribution. Agricultural land (often small patches in mixed-use
      basins) may be entirely removed, eliminating nutrient source areas. Thin soils on hillslopes may
      be replaced by deep valley soils, changing runoff generation. The total area is conserved, but the
      land use/soil/slope distribution is altered. This is a silent error — the model runs normally with
      the biased inputs.

      '
    affected_components:
    - hru-data.hru
    - All hydrological and water quality outputs
  remedy:
    action: Reduce HRU thresholds to 5-10% for land use and soil, 10-20% for slope. For water quality
      studies, use 0% threshold (all HRUs).
    tool_to_run: apply_hru_threshold
    manual_steps:
    - 'Compare land use distribution before and after threshold: does any land use type lose >50% of its
      original area?'
    - Regenerate HRUs with lower thresholds
    - Verify total area is conserved within 0.1%
    prevention: Default to 5%/5%/10% thresholds. Document threshold choice in project metadata.
  severity: silent
  cross_references: []
- id: dt_005
  stage: s8_model_execution
  failure_domain: runtime
  symptom:
    description: SWAT+ crashes during simulation with a segmentation fault, Fortran runtime error 'Index
      N is out of bounds', or 'STOP' message with a line reference.
    error_pattern: Segmentation fault|out of bounds|STOP|Fortran runtime error
    detection_method: log_match
  diagnosis:
    root_cause: Array dimensions in compiled binary are too small for the number of HRUs, subbasins, channels,
      or soil layers in the model.
    explanation: 'Some SWAT+ versions have hardcoded array dimensions (PARAMETER statements in Fortran
      source). If the model setup has more objects than the compiled limit (e.g., >2000 HRUs when the
      binary was compiled for 2000), array access goes out of bounds. With bounds checking enabled (-fcheck=all),
      you get an error message. Without it, you get a segfault or silently corrupted results.

      '
    affected_components:
    - SWAT+ binary (compiled Fortran)
    - object.cnt
  remedy:
    action: Reduce HRU count via thresholds, or recompile SWAT+ with larger array dimensions.
    tool_to_run: compile_swatplus
    manual_steps:
    - Check object.cnt for total HRU/subbasin/channel counts
    - 'If counts exceed compiled limits: either reduce via thresholds or edit Fortran source PARAMETER
      statements and recompile'
    - Recompile with -fcheck=all to get specific error location
    prevention: Compile SWAT+ with generous array limits. Use threshold filtering to keep HRU count under
      5000.
  severity: fatal
  cross_references:
  - dt_007
- id: dt_006
  stage: s4_soil_database
  failure_domain: parameter_format
  symptom:
    description: SWAT+ crashes when reading soils.sol, or produces obviously wrong soil water content
      values. Error may reference soil reading routines.
    error_pattern: Error reading soil|format error|NaN.*soil
    detection_method: log_match
  diagnosis:
    root_cause: soils.sol has mismatched layer count — the nly value in the profile line does not match
      the actual number of layer lines that follow.
    explanation: 'soils.sol uses a multi-line record format: one profile line (with nly=N) followed by
      exactly N layer lines. If nly says 3 but only 2 layer lines follow, SWAT+ reads the NEXT soil''s
      profile line as a layer line. This corrupts all subsequent soil data. The error cascades silently
      — soils after the mismatched one all have wrong properties. If the total line count is wrong, SWAT+
      may crash at end-of-file.

      '
    affected_components:
    - soils.sol
    - All HRUs referencing the affected soils
  remedy:
    action: Verify nly matches actual layer line count for every soil in soils.sol.
    tool_to_run: validate_soil_properties
    manual_steps:
    - 'Parse soils.sol: for each profile line, count subsequent lines until next profile line'
    - Compare count to nly value
    - Fix mismatches by adding/removing layer lines or correcting nly
    prevention: Always use build_soils_database tool which enforces nly/layer consistency.
  severity: fatal
  cross_references: []
- id: dt_007
  stage: s8_model_execution
  failure_domain: compilation
  symptom:
    description: SWAT+ Fortran source fails to compile with gfortran. Errors about non-standard Fortran
      syntax, missing modules, or undefined references.
    error_pattern: 'Error: .*gfortran|undefined reference|Unclassifiable statement|Syntax error'
    detection_method: log_match
  diagnosis:
    root_cause: SWAT+ source code contains Intel Fortran extensions or non-standard constructs that gfortran
      does not support, or the gfortran version is too old.
    explanation: 'SWAT+ is primarily developed with Intel Fortran (ifort). Some code uses Intel-specific
      features or relies on behavior that gfortran handles differently. Common issues: non-standard STRUCTURE/RECORD
      syntax (pre-F90), assumed-length character returns, or module dependency ordering in the Makefile.
      Additionally, gfortran < 9.0 lacks support for some F2008 features used in newer SWAT+ revisions.

      '
    affected_components:
    - SWAT+ source code (*.f90, *.f)
    - CMakeLists.txt or Makefile
  remedy:
    action: Upgrade gfortran to >= 9.0. Apply known patches for gfortran compatibility. Use the CMake
      build system from the official repository.
    tool_to_run: ''
    manual_steps:
    - 'Check gfortran version: gfortran --version (need >= 9.0)'
    - 'Clone official repo: git clone https://github.com/swat-model/swatplus.git'
    - 'Use CMake: mkdir build && cd build && cmake .. -DCMAKE_Fortran_COMPILER=gfortran && make'
    - If specific files fail, check GitHub issues for patches
    prevention: Use the official GitHub repository with CMake. Pin gfortran version >= 9.0.
  severity: fatal
  cross_references:
  - dt_005
- id: dt_008
  stage: s1_watershed_delineation
  failure_domain: silent_error
  symptom:
    description: Delineated watershed area is much larger (>2x) or smaller (<0.5x) than expected. Model
      runs successfully but discharge is completely wrong.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Outlet point snapped to the wrong stream — typically a larger river at a confluence, or
      a smaller tributary.
    explanation: 'The pour-point snapping algorithm finds the highest-accumulation cell within a search
      radius. If the outlet is near a confluence, the algorithm snaps to the larger river (higher accumulation),
      delineating the entire upstream mega-basin. Conversely, if coordinates are imprecise and snap to
      a small tributary, only a fraction of the basin is delineated. The model still runs — it just simulates
      the wrong watershed.

      '
    affected_components:
    - Watershed boundary
    - All downstream analyses
  remedy:
    action: Compare delineated area to known/published area. If wrong, adjust outlet coordinates or manually
      specify the snap point.
    tool_to_run: delineate_watershed
    manual_steps:
    - Check delineated area against published basin area
    - 'If >2x expected: outlet snapped to larger river — move coordinates upstream of confluence'
    - 'If <0.5x expected: outlet snapped to tributary — move coordinates to main channel'
    - Re-run delineation with adjusted coordinates
    prevention: Always verify delineated area immediately after delineation. Place outlet upstream of
      confluences.
  severity: silent
  cross_references: []
- id: dt_009
  stage: s7_simulation_config
  failure_domain: dependency_mismatch
  symptom:
    description: SWAT+ crashes during initialization with array index errors, or produces wrong results
      because it reads too few or too many objects from data files.
    error_pattern: Index.*out of bounds|array subscript|dimension
    detection_method: log_match
  diagnosis:
    root_cause: object.cnt specifies wrong counts that do not match actual records in data files (hru-data.hru,
      chandeg.con, aquifer.aqu, etc.).
    explanation: 'SWAT+ allocates arrays based on object.cnt counts. If object.cnt says 245 HRUs but hru-data.hru
      has 250, the binary either crashes (if compiled with bounds checking) or reads incorrect data (without
      bounds checking). This happens when files are regenerated after object.cnt was created, or when
      HRU filtering changes the count without updating object.cnt.

      '
    affected_components:
    - object.cnt
    - hru-data.hru, chandeg.con, aquifer.aqu, rout_unit.con
  remedy:
    action: Regenerate object.cnt by counting actual records in each data file.
    tool_to_run: validate_txtinout
    manual_steps:
    - 'Count records: wc -l TxtInOut/hru-data.hru (subtract header lines)'
    - Update object.cnt to match actual counts
    - 'Verify all object types: hru, lsu, aqu, cha, res, rec, exco, dr, ru'
    prevention: Always regenerate object.cnt after any change to spatial data files.
  severity: fatal
  cross_references:
  - dt_001
- id: dt_010
  stage: s9_output_parsing
  failure_domain: silent_error
  symptom:
    description: Basin nutrient balance does not close — total N/P inputs significantly exceed outputs
      + storage change, or vice versa. Water balance may be acceptable but nutrient loads are wrong.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Nutrient sources or sinks are not properly configured — commonly missing atmospheric deposition
      (atmo.cli), point sources (recall.rec), or initial nutrient pools.
    explanation: 'SWAT+ tracks N and P through 5+ pools each. If atmospheric deposition is not configured
      (atmo.cli = null in file.cio), wet and dry deposition are zero. For basins with significant atmospheric
      N input, this removes a major source. Similarly, if point source discharges exist but are not included
      in recall.rec, nutrients from wastewater treatment plants are missing. The model runs normally —
      it just underestimates nutrient loads.

      '
    affected_components:
    - basin_nb output
    - atmo.cli
    - recall.rec
  remedy:
    action: Check that all nutrient sources are configured. Enable atmospheric deposition. Add point sources
      if applicable.
    tool_to_run: check_mass_balance
    manual_steps:
    - 'Check atmo.cli: is it ''null'' in file.cio? If the basin has >5 kg N/ha/yr expected deposition,
      enable it'
    - 'Check recall.rec: are all known point sources included?'
    - 'Compare nutrient balance: inputs (fert + fixation + deposition) vs outputs (crop uptake + loss)'
    prevention: Always configure atmospheric deposition for nutrient studies.
  severity: silent
  cross_references:
  - dt_015
- id: dt_011
  stage: s5_landuse_management
  failure_domain: parameter_format
  symptom:
    description: Crop yields are zero or unreasonably low. Biomass does not accumulate. No harvest output
      in management output file.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Management schedule has missing or misordered operations — planting after harvest, missing
      kill operation, or crop name not matching plants.plt.
    explanation: 'SWAT+ processes management operations sequentially. If harvest is scheduled before planting,
      no crop exists to harvest. If the crop name in the plant operation does not match any entry in plants.plt
      (case- sensitive), SWAT+ silently skips the planting. Without a kill operation after harvest, the
      crop continues growing into the next season, preventing the next planting. All of these produce
      zero or wrong yields with no error message.

      '
    affected_components:
    - management.sch
    - plants.plt
    - Crop growth output
  remedy:
    action: 'Verify management sequence: plant -> fertilize -> harvest -> kill. Verify crop names match
      plants.plt entries exactly.'
    tool_to_run: build_management_schedules
    manual_steps:
    - 'Check management.sch: is plant operation before harvest?'
    - Check crop name in plant operation matches plants.plt (case-sensitive)
    - Ensure kill operation follows harvest
    - Verify heat unit fraction for harvest (1.0-1.2 recommended)
    prevention: Use build_management_schedules tool which enforces correct operation ordering.
  severity: degraded
  cross_references: []
- id: dt_012
  stage: s3_weather_preparation
  failure_domain: unit_conversion
  symptom:
    description: SWAT+ runs successfully but ET is 3-12x higher than expected. Water yield is near zero
      despite normal precipitation. No error messages.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Solar radiation input is in W/m2 instead of MJ/m2/day. W/m2 values (100-400) are ~12x
      higher than MJ/m2/day values (8-30).
    explanation: 'CMFD and many reanalysis products provide solar radiation as instantaneous power (W/m2).
      SWAT+ expects daily total energy (MJ/m2/day). The conversion is: MJ/m2/day = W/m2 * 86400 / 1e6
      = W/m2 * 0.0864. If W/m2 is used directly (e.g., 250 instead of 21.6), SWAT+ computes ~12x too much
      PET, which consumes nearly all precipitation as ET, leaving minimal water for runoff. The model
      runs without error.

      '
    affected_components:
    - '*.slr files'
    - PET calculation
    - Water balance
  remedy:
    action: 'Check solar radiation values in .slr files. If daily mean > 50, they are likely in W/m2.
      Convert: MJ/m2/day = W/m2 * 0.0864.'
    tool_to_run: validate_weather_data
    manual_steps:
    - 'Check .slr file: awk ''NR>3{sum+=$3;n++}END{print sum/n}'' station.slr'
    - 'If mean > 50: data is in W/m2, multiply all values by 0.0864'
    - 'Expected range after conversion: 5-30 MJ/m2/day depending on latitude and season'
    prevention: Always verify solar radiation units when converting from gridded forcing products.
  severity: silent
  cross_references:
  - dt_003
- id: dt_013
  stage: s6_calibration_parameters
  failure_domain: parameter_format
  symptom:
    description: Calibration has no effect — results identical to uncalibrated run. Or calibration produces
      physically impossible parameter values (e.g., CN2 > 100).
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Parameter name misspelled in calibration.cal (SWAT+ silently ignores unknown names), or
      absval used for cn2/awc destroying spatial variability, or pctchg value produces out-of-range results.
    explanation: 'SWAT+ reads calibration.cal and applies adjustments at runtime. If a parameter name
      is misspelled (e.g., ''cn_2'' instead of ''cn2''), SWAT+ does not recognize it and silently skips
      it. Using absval for spatially variable parameters like cn2 overwrites all HRUs to the same value,
      removing the land use signal. Using pctchg with too-large values (e.g., pctchg 50 on CN2=85 gives
      CN2=127.5, which exceeds the physical maximum of 98) produces invalid parameters.

      '
    affected_components:
    - calibration.cal
    - Internal parameter arrays
  remedy:
    action: Verify parameter names against SWAT+ documentation. Use pctchg for cn2/awc. Check that resulting
      values stay within physical bounds.
    tool_to_run: apply_calibration
    manual_steps:
    - Cross-check parameter names with SWAT+ variable list
    - 'For pctchg: verify that original_value * (1 + chg_val/100) stays in valid range'
    - 'Compare calibrated output to uncalibrated: if identical, parameter name is wrong'
    prevention: Always use generate_calibration_file which validates parameter names. Test calibration
      effect by comparing two runs.
  severity: degraded
  cross_references: []
- id: dt_014
  stage: s8_model_execution
  failure_domain: runtime
  symptom:
    description: SWAT+ crashes partway through simulation (not at startup). Output files are partially
      written. Error may be 'Floating point exception', 'Division by zero', or generic STOP.
    error_pattern: Floating point exception|division by zero|STOP|Arithmetic exception
    detection_method: log_match
  diagnosis:
    root_cause: Numerical instability from extreme parameter values, missing data (-99 not handled properly),
      or zero-area HRUs/channels.
    explanation: 'SWAT+ can crash mid-simulation if: (1) a soil parameter is zero (e.g., SOL_K=0 causes
      division by zero in infiltration), (2) weather data has -99 (missing) values not caught by the weather
      generator, (3) a channel has zero length or zero width, (4) extreme calibration values push parameters
      outside stable ranges. The crash happens when the model reaches the problematic date/HRU combination.

      '
    affected_components:
    - SWAT+ simulation engine
    - Soil parameters
    - Weather data
    - Channel geometry
  remedy:
    action: Identify the crash date from partial output. Check weather data for that date. Check soil/channel
      parameters for zero or extreme values.
    tool_to_run: ''
    manual_steps:
    - 'Find last date in partial output: tail -1 TxtInOut/basin_wb_day.txt'
    - 'Check weather data for crash date: any -99 values? any extreme values?'
    - Check soils.sol for zero SOL_K, zero SOL_BD, zero SOL_AWC
    - Check channel geometry for zero length/width
    - Recompile with -g -fbacktrace for detailed crash location
    prevention: Validate all inputs with S4 and S3 validation tools. Use bounds checking during initial
      runs.
  severity: fatal
  cross_references:
  - dt_005
  - dt_006
- id: dt_015
  stage: s9_output_parsing
  failure_domain: silent_error
  symptom:
    description: Basin water balance error exceeds 5% — precipitation does not equal ET + runoff + percolation
      + storage change. Model ran without errors.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Time period mismatch between water balance components, or deep aquifer loss not accounted,
      or irrigation from external source not tracked.
    explanation: 'The SWAT+ water balance includes a deep aquifer loss term (recharge that exits the system
      permanently) and potentially irrigation from an external source. If deep percolation is significant
      and not tracked, the balance appears to lose water. If irrigation imports water from outside the
      basin, the balance gains water. Additionally, computing the balance over a period that includes
      warmup years (when storage is changing rapidly) inflates the error.

      '
    affected_components:
    - basin_wb output
    - Deep aquifer parameters
    - Irrigation configuration
  remedy:
    action: Exclude warmup years from balance calculation. Include deep aquifer loss. Account for irrigation
      imports.
    tool_to_run: check_mass_balance
    manual_steps:
    - Recalculate balance excluding warmup period (first nyskip years)
    - 'Check deep aquifer: revap_co and flo_min parameters — deep percolation is a legitimate loss'
    - 'Check irrigation: is water imported from outside the basin?'
    - 'If error still > 5%: check for numerical issues (recompile with -fcheck=all)'
    prevention: Always exclude warmup from balance calculations. Include all water balance terms including
      deep aquifer.
  severity: silent
  cross_references:
  - dt_010
- id: dt_v001
  stage: s8_model_execution
  failure_domain: runtime
  symptom:
    description: 'Fortran runtime error in sd_hydsed_init: Index ''1'' of dimension 1 of array ''om_init_water''
      above upper bound of 0'
    error_pattern: Index.*of dimension.*of array.*above upper bound|sd_hydsed_init
    detection_method: log_match
  diagnosis:
    root_cause: TxtInOut test data is incompatible with the compiled SWAT+ binary version
    explanation: 'SWAT+ input file formats change between versions. The bundled refdata/Osu_1hru test
      case was created for an older SWAT+ version. The latest source code expects additional fields in
      channel initialization files that the old test data lacks, causing zero-length array allocation
      and out-of-bounds access.

      '
    affected_components:
    - s8_model_execution
  remedy:
    action: Generate fresh TxtInOut files using SWAT+ Editor or QSWAT+ for the compiled version
    tool_to_run: ''
    manual_steps:
    - Do NOT use bundled refdata — it is version-mismatched
    - Use SWAT+ Editor (Python) to generate new TxtInOut from watershed data
    - Or use QSWAT+ (QGIS plugin) for full watershed setup
    - Match TxtInOut version to the compiled binary version
    prevention: Always generate TxtInOut files with SWAT+ Editor matching the binary version
  severity: fatal
  cross_references: []
  verified: '2026-03-19'
- id: dt_v002
  stage: s8_model_execution
  failure_domain: runtime
  symptom:
    description: SIGSEGV Segmentation fault in time_control_ during SWAT+ execution
    error_pattern: SIGSEGV|Segmentation fault.*time_control
    detection_method: log_match
  diagnosis:
    root_cause: Version mismatch between TxtInOut data and compiled SWAT+ binary
    explanation: 'The Ames_sub1 refdata test case also causes segfault due to incompatible file formats.
      SWAT+ reads array dimensions from input files and allocates memory accordingly. If the file format
