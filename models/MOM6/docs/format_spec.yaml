model:
  name: "MOM6"
  full_name: "Modular Ocean Model, version 6"
  domain: "ocean"
  developer: "NOAA-GFDL"
  language: "Fortran 90/95 + C (FMS infrastructure)"
  binary_path: "KISSPATH_BINARIES/MOM6/validation_run/MOM6"
  build_system: "Autoconf + Make (with FMS dependency)"
  parallelism: "MPI domain decomposition + optional OpenMP"
  io_format: "NetCDF4 (via FMS I/O layer)"

inputs:
  grid:
    - name: "ocean_hgrid.nc"
      description: "Supergrid defining horizontal coordinates"
      location: "INPUT/"
    - name: "topog.nc"
      description: "Ocean bathymetry (depth variable, positive-down, meters)"
      location: "INPUT/"
    - name: "vcoord.nc"
      description: "Vertical coordinate interfaces"
      location: "INPUT/"

  forcing:
    - name: "wind_stress"
      unit: "Pa"
      valid_range: [-2.0, 2.0]
      description: "Surface wind stress (zonal and meridional)"
    - name: "heat_flux"
      unit: "W/m2"
      valid_range: [-500.0, 500.0]
      description: "Net surface heat flux (positive into ocean)"
    - name: "freshwater_flux"
      unit: "kg/m2/s"
      valid_range: [-1.0e-3, 1.0e-3]
      description: "Precipitation minus evaporation"
    - name: "shortwave_radiation"
      unit: "W/m2"
      valid_range: [0.0, 500.0]
      description: "Downwelling shortwave radiation"

  initial_conditions:
    - name: "temperature"
      unit: "degC"
      valid_range: [-2.0, 40.0]
      description: "Initial potential/conservative temperature"
    - name: "salinity"
      unit: "PSU"
      valid_range: [0.0, 42.0]
      description: "Initial practical/absolute salinity"

  parameters:
    critical:
      - name: "DT"
        unit: "seconds"
        valid_range: [1.0, 86400.0]
        description: "Baroclinic dynamics timestep"
      - name: "DT_THERM"
        unit: "seconds"
        valid_range: [1.0, 86400.0]
        description: "Thermodynamics timestep"
      - name: "NK"
        unit: "count"
        valid_range: [1, 200]
        description: "Number of vertical layers"
      - name: "NIGLOBAL"
        unit: "count"
        valid_range: [1, 10000]
        description: "Global grid points in x-direction"
      - name: "NJGLOBAL"
        unit: "count"
        valid_range: [1, 10000]
        description: "Global grid points in y-direction"
      - name: "EQUATION_OF_STATE"
        valid_range: ["WRIGHT", "TEOS10", "UNESCO", "LINEAR"]
        description: "Equation of state for seawater density"
      - name: "RHO_0"
        unit: "kg/m3"
        valid_range: [1000.0, 1100.0]
        description: "Reference density for Boussinesq approximation"
      - name: "KH"
        unit: "m2/s"
        valid_range: [0.0, 100000.0]
        description: "Horizontal viscosity"
      - name: "KD"
        unit: "m2/s"
        valid_range: [0.0, 1.0e-2]
        description: "Background diapycnal diffusivity"
      - name: "CDRAG"
        unit: "nondim"
        valid_range: [0.001, 0.01]
        description: "Quadratic bottom drag coefficient"

  config_files:
    - name: "MOM_input"
      description: "Primary parameter file"
    - name: "MOM_override"
      description: "Parameter overrides (takes precedence)"
    - name: "input.nml"
      description: "Fortran namelists (run length, I/O, FMS config)"
    - name: "diag_table"
      description: "Diagnostic output specification"

outputs:
  primary:
    - name: "temp"
      unit: "degC"
      valid_range: [-2.0, 40.0]
      description: "Potential/conservative temperature"
    - name: "salt"
      unit: "PSU"
      valid_range: [0.0, 42.0]
      description: "Practical/absolute salinity"
    - name: "ssh"
      unit: "m"
      valid_range: [-10.0, 10.0]
      description: "Sea surface height"
    - name: "u"
      unit: "m/s"
      valid_range: [-5.0, 5.0]
      description: "Zonal velocity"
    - name: "v"
      unit: "m/s"
      valid_range: [-5.0, 5.0]
      description: "Meridional velocity"
    - name: "h"
      unit: "m"
      valid_range: [0.0, 8000.0]
      description: "Layer thickness"
  diagnostics:
    - name: "KE"
      unit: "m2/s2"
      valid_range: [0.0, 10.0]
      description: "Kinetic energy per unit mass"
    - name: "MLD_003"
      unit: "m"
      valid_range: [0.0, 5000.0]
      description: "Mixed layer depth (0.03 kg/m3 criterion)"
    - name: "ocean.stats"
      description: "Timestep-level energy, CFL, mass, T/S conservation"
    - name: "ocean.stats.nc"
      description: "NetCDF version of ocean.stats"

known_issues:
  - id: "dt_002"
    description: "TEOS10 EOS requires conservative temperature, not potential temperature — 0.2 degC bias accumulates over decades"
  - id: "dt_005"
    description: "Depth/topography must be positive-down (meters); negative values indicate land"
  - id: "dt_008"
    description: "Heat flux sign convention: positive INTO ocean; some reanalyses use positive OUT"
