    need lower values.; ['s2_ecophysiology']
  remedy: 'Reduce SLA in .epc file (typical ranges: ENF=8-12, DBF=20-35, grass=25-45 m2/kgC); select_ecophysiology;
    [''Check SLA value in .epc (line 35)'', ''Compare with published values for the specific species'',
    ''Use --override sla=<value> with select_ecophysiology.py'']; Calibrate SLA against MODIS LAI or FLUX'
