# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: ParFlow
  language: c
  implementation:
    id: parflow-c-v3
    version: v3.13+ (manual served at 3.14/3.15; parflow.org stable v3.12.0)
    provenance: C; ParFlow simulator (LLNL / Colorado School of Mines / Juelich et al.), optional Common
      Land Model (CLM 4.5) land-surface component in Fortran 90/95.
  scientific_reference_version: ParFlow integrated surface-subsurface hydrology (Richards + free-surface
    overland flow; Kollet & Maxwell 2006, Maxwell 2013, Kuffour et al. 2020)
  binary:
    path: KISSPATH_BINARIES/parflow/install/bin/parflow
    type: ELF
pipeline:
  stages:
  - s1_domain_skill
  - s2_subsurface_skill
  - s3_topography_skill
  - s4_clm_skill
  - s5_forcing_skill
  - s6_ic_bc_skill
  - s7_solver_skill
  - s8_execution_skill
  - s9_output_skill
tools:
  count: 12
  files:
  - tools/s10_coupling/parflow_to_cama.py
  - tools/s1_domain/build_domain_mask.py
  - tools/s1_domain/define_parflow_domain.py
  - tools/s2_subsurface/build_mannings.py
  - tools/s2_subsurface/build_subsurface_properties.py
  - tools/s3_topography/build_slopes.py
  - tools/s4_clm/setup_clm_driver.py
  - tools/s5_forcing/convert_forcing_to_pfb.py
  - tools/s6_ic_bc/generate_initial_conditions.py
  - tools/s7_solver/generate_parflow_script.py
  - tools/s8_execution/run_parflow.py
  - tools/s9_output/parse_parflow_output.py
inputs:
  forcing:
  - name: APCP (precipitation rate)
    unit: mm/s (= kg/m2/s)
  - name: DSWR (downward shortwave radiation)
    unit: W/m2
  - name: DLWR (downward longwave radiation)
    unit: W/m2
  - name: Tmp (air temperature)
    unit: K
  - name: UGRD (u-wind)
    unit: m/s
  - name: VGRD (v-wind)
    unit: m/s
  - name: Press (surface pressure)
    unit: Pa
  - name: SPFH (specific humidity)
    unit: kg/kg
  parameters:
  - name: permeability / saturated conductivity K (perm_x/y/z, anisotropic)
    unit: m/hr
  - name: porosity (phi)
    unit: dimensionless
  - name: van Genuchten alpha
    unit: 1/m
  - name: van Genuchten n
    unit: dimensionless
  - name: specific storage Ss
    unit: 1/m
  - name: Kz/Kx anisotropy ratio
    unit: dimensionless
  - name: Manning's roughness n
    unit: s/m^(1/3)
  - name: slope_x, slope_y (terrain slopes)
    unit: dimensionless
  - name: CLM vegetation maps (IGBP type, LAI/SAI/z0 per PFT)
    unit: IGBP class 1-17 / dimensionless
  initial_conditions:
  - name: initial pressure-head field
    unit: m of water
  boundary_conditions:
  - name: domain mask / indicator field
    unit: 0/1
  - name: Overland flow boundary condition (top patch)
    unit: n/a
  - name: lateral/bottom boundary conditions
    unit: n/a (pressure m or flux)
  - name: Solver mode selection (Richards vs Impes vs Diffusion)
    unit: n/a
  - name: terrain-following grid + variable-dz (dz_mult / nzList)
    unit: dimensionless
  - name: PhaseSources / KnownSolution
    unit: n/a
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - pressure_head
  - saturation
  - soil_moisture
  - water_table_depth
  - discharge_at_outlet
  - surface_runoff
  - subsurface_storage
  - qflx_evap_tot (CLM total ET)
  - eflx_lh_tot (CLM latent heat flux)
  - swe_out (CLM snow water equivalent)
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=-1.160, KGE=-0.051, R=0.370, 5 scorecard(s)'
  metrics:
    best_nse: -1.1597
    best_kge: -0.0505
    best_r: 0.37
summary:
  total_tools: 12
  total_stage_docs: 9
  total_diagnostic_triplets: 36
  generated: '2026-08-24'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
