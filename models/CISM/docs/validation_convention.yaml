# CISM validation practice in the fetched literature is mostly benchmark-RMSE and
# observation-envelope based, not universal pass/fail tier tables. Numeric bands
# below are used only where a fetched paper reports a benchmark value, target, or
# observational uncertainty that the field uses for judging agreement. Null bands
# are intentional: they mean no fetched numeric threshold was found.

