# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: TopoFlow
  language: python
  implementation:
    id: topoflow36
    version: '3.6'
    provenance: Python (Python 3.7+); Scott D. Peckham (INSTAAR / CSDMS, University of Colorado Boulder);
      plug-and-play BMI components coupled at runtime via the EMELI framework.
  scientific_reference_version: TopoFlow 3.6 (Peckham et al. 2017, Earth and Space Science, doi:10.1002/2016EA000237;
    component-based D8 distributed hydrology)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/TopoFlow/venv/bin/python
    type: work_dir
pipeline:
  stages:
  - s1_domain_setup
  - s2_met_forcing
  - s3_soil_parameters
  - s4_channel_geometry
  - s5_execution
  - s6_output_analysis
tools:
  count: 4
  files:
  - tools/convert_forcing.py
  - tools/convert_soil_params.py
  - tools/parse_output.py
  - tools/run_topoflow.py
inputs:
  forcing:
  - name: precipitation
    unit: mm/hr
  - name: air_temperature
    unit: degC
  - name: relative_humidity
    unit: fraction 0-1
  - name: wind_speed
    unit: m/s
  - name: atmospheric_pressure
    unit: mbar
  - name: shortwave_radiation
    unit: W/m^2
  parameters:
  - name: saturated_hydraulic_conductivity (Ks)
    unit: m/s
  - name: initial_hydraulic_conductivity (Ki)
    unit: m/s
  - name: saturated_water_content (theta_s)
    unit: dimensionless 0-1
  - name: residual_water_content (theta_r)
    unit: dimensionless 0-1
  - name: capillary_length_scale (G)
    unit: m
  - name: bubbling_pressure_head (psi_b)
    unit: m
  - name: pore_size_distribution_index (lambda)
    unit: dimensionless
  - name: brooks_corey_c
    unit: dimensionless
  - name: smith_parlange_gamma
    unit: dimensionless
  - name: manning_n
    unit: s/m^(1/3)
  - name: roughness_height (z0)
    unit: m
  - name: channel_bed_width (w)
    unit: m
  - name: bank_angle
    unit: degrees
  - name: sinuosity
    unit: dimensionless
  - name: bankfull_depth (d_bankfull)
    unit: m
  - name: degree_day_coefficient (c0)
    unit: mm/day/degC
  - name: threshold_temperature (T0)
    unit: degC
  - name: priestley_taylor_alpha
    unit: dimensionless
  - name: albedo
    unit: 0-1
  - name: surface_emissivity
    unit: 0-1
  - name: dust_attenuation
    unit: 0-0.3
  - name: DEM
    unit: m
  - name: D8_flow_codes
    unit: codes 0-128
  - name: slope_grid
    unit: m/m
  - name: contributing_area_grid
    unit: km^2 (or cell count)
  initial_conditions:
  - name: initial_flow_depth (d0)
    unit: m
  - name: initial_water_content (theta_i)
    unit: dimensionless 0-1
  - name: initial_snow_depth / snow_water_equivalent (h_snow / h_swe)
    unit: m
  boundary_conditions:
  - name: outlet_pixels
    unit: row/col index
  - name: component_provider_map
    unit: '-'
  - name: channel_wave_method
    unit: '-'
  - name: stopping_criteria
    unit: '-'
  - name: channel_timestep (dt)
    unit: s
  - name: save_intervals (save_grid_dt, save_pixels_dt)
    unit: s
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - outlet_discharge (Q_outlet)
  - peak_time_of_flow (T_peak)
  - peak_discharge (Q_peak)
  - outlet_depth (d_outlet)
  - outlet_velocity (u_outlet)
  - channel_discharge_grids (Q)
  - depth_grids (d)
  - infiltration_rate_grids (v0 / IN)
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.793, KGE=0.709, R=0.910, 2 scorecard(s)'
  metrics:
    best_nse: 0.7926
    best_kge: 0.7085
    best_r: 0.9096
summary:
  total_tools: 4
  total_stage_docs: 6
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
