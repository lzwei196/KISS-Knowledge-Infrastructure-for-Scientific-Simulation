schema_version: 1
model_id: GemPy
domain: geologic_modeling
generated_by: "Step-B validation convention agent"
generated_at: 2026-08-14

# GemPy/geological-model validation is mostly convention-by-comparison rather than
# universal threshold tables. Numeric bands below are used only where a fetched paper
# gives an explicit match/misfit criterion. Otherwise bands stay null and low confidence.

references:
