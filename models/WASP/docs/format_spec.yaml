  severity: silent
- id: dt_wasp_027
  symptom: 'A value written with wasptool (e.g. PCONSTPARAM seg 32 1 0.5 for SOD, PCONSTVALUEBYISC 57
    1 174 for elevation) echoes back correctly and reads back with G..., but the run behaves as if it
    was never set: BMD2 ''Described Sediment Oxygen Demand'' stays 0, and the .OUT ''Segment Parameters''
    / ''Constants &'
  diagnosis: Each segment parameter, constant and time function in a .wif carries a 'used' flag. The engine
    only reads items whose flag is 1. In EPA's SteadyState.wif params 8, 9, 11, 13, 24, 32, constants
    2, 3, 57, 58, 52, 56 and cloud time function 25 have used=0. The API stores the value but the engine
    ignore
  remedy: 'Set the flag with the value: PPARAMISUSED <isc> 1 1, PCONSTISUSED <isc> <inst> 1, PTFISUSED
    <isc> 1 1 (build_wasp_lake_case.py does this). Then confirm the item appears in the .OUT echo of the
    run.'
  severity: silent
- id: dt_wasp_028
  symptom: Simulated DO of a high-altitude water body is biased high by roughly the pressure ratio (about
    +38 % at 2700 m) while the timing (r) is good.
  diagnosis: 'WASP 8.5 does correct DO saturation for elevation (constant 57 ''Elevation above Sea Level''
    and segment parameter 24): a 1-year test gave DO x 0.724 at 2700 m vs 0 m, matching p/p0 = 0.72. But
    both items are ''used = 0'' in the EPA template (dt_wasp_027), so a copied deck silently runs at sea
    level. (T'
  remedy: Pass --elev to build_wasp_lake_case.py (sets constant 57 and param 24 with used flags) and check
    '57 ... Elevation above Sea Level' in the .OUT echo.
  severity: silent
- id: dt_wasp_029
  symptom: Water temperature climbs to 45-70 C with cloud cover given in tenths (0-10); with percent (0-100)
    waspccli spins at 100 % CPU and never closes out.
  diagnosis: 'The engine''s database (epa.sqlite) defines Cloud Cover Function as ''unitless or fraction'';
    EPA''s heat-module guide says ''percent''. Tested on WASP 8.5: only a 0-1 fraction gives physical
    results (Lake Erie 12 m box peaks near 25 C in August).'
  remedy: Write cloud_frac in [0,1] (build_wasp_weather_from_source.py) and keep build_wasp_lake_case.py
    --cloud-scale 1.
  severity: silent
- id: dt_wasp_030
  symptom: After PSEEDDATE, GNOQFUNC/GBOUNDFUNC/GPRINTFUNC show days like 2738.0 at point 1; the template's
    flows and boundaries now start years after the run start.
  diagnosis: Breakpoints are stored as absolute dates and displayed/written as days relative to the CURRENT
    seed date (2738 d = 2005-01-01 to 2012-07-01). Weather written before the seed change is shifted.
  remedy: Put PSEEDDATE first, then rewrite every flow, boundary, print and time-function series with
    days relative to the new start (build_wasp_lake_case.py orders commands this way).
  severity: silent
- id: dt_wasp_031
  symptom: 'ERROR: wasptool rejected a command: ERROR while processing command: Unrecognized command:
    G...  (exit 1), or ''returned N result blocks for M commands''.'
  diagnosis: Keyword misspelt, wrong number of arguments, or wasptool crashed (WINE page fault) part way;
    e.g. PNUMSEG 1 on the 10-segment template followed by GNOQS crashed (flows still point at segments
    2-10).
  remedy: Use only keywords listed in docs/s2_parameter_setup.md; never shrink the segment count of a
    template - isolate unused segments instead (tiny flows), as build_wasp_lake_case.py does.
  severity: fatal
- id: dt_wasp_032
  symptom: wine waspccli.exe returns exit code 2 although the run printed 'WASP8 run successfully closed
    out' and wrote .OUT and .BMD2.
  diagnosis: waspccli's exit status is not meaningful under WINE (2 on the official EPA example, 0 after
    a killed hang).
  remedy: 'Judge success like run_wasp_engine.py: close-out line + fresh .OUT + valid .BMD2 header + no
    ERROR line other than the known ''Failed to locate time function''.'
  severity: warning
- id: dt_wasp_033
