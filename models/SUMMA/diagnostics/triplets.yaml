- id: dt_023
  stage: s2_forcing_prep
  failure_domain: unit_conversion
  symptom:
    description: 'All forcing values are physically wrong: precip ~100 mm/day, temperature ~50°C, pressure
      ~2500 Pa, wind ~160 m/s. SUMMA may still run but output is meaningless.'
    error_pattern: unrealistic forcing|pptrate mean > 10|airtemp mean > 320
    detection_method: output_check
  diagnosis:
    root_cause: VIC forcing column order mismatch. HydroCraft VIC uses AIR_TEMP,PREC,PRESSURE,SWDOWN,LWDOWN,VP,WIND
      (7 cols) but converter assumed PREC,TMAX,TMIN,WIND,SW,LW,PRESSURE,QAIR (8 cols).
    explanation: 'HydroCraft''s forcing_1d.py + process_forcing.py produce VIC forcing in the order defined
      by the global_param FORCE_TYPE directives. The standard HydroCraft order is AIR_TEMP(°C), PREC(mm/3hr),
      PRESSURE(kPa), SWDOWN(W/m²), LWDOWN(W/m²), VP(kg/kg), WIND(m/s). The SUMMA converter originally
      assumed the "classic" 8-column VIC order which puts PREC first. This caused every column to be misassigned:
      temperature was treated as precip, pressure as temperature (then +273.15), etc. The resulting forcing
      looked structurally valid (correct NetCDF format, correct units attributes) but the VALUES were
      wrong by factors of 40-200x. This is a SILENT error because SUMMA still runs to completion with
      garbage forcing.

      '
    affected_components:
    - convert_vic_forcing_to_summa.py column mapping
    - VIC global_param FORCE_TYPE order
  remedy:
    action: Use --column_order hydrocraft (default) for HydroCraft VIC forcing. Always verify forcing
      with a sanity check after conversion.
    tool_to_run: ''
    manual_steps:
    - 'Check: python3 -c "from netCDF4 import Dataset; import numpy as np; ds=Dataset(''forcing_YYYY.nc'');
      print(''P='', np.nanmean(ds[''pptrate''][:])*86400, ''mm/day, T='', np.nanmean(ds[''airtemp''][:])-273.15,
      ''°C'')"'
    - 'Expected: P=1-5 mm/day, T=10-20°C (temperate), P=99000-103000 Pa, SW=100-250 W/m², LW=250-400 W/m²'
    - If values are far off, the column order is wrong
    prevention: Converter now defaults to 'hydrocraft' column order. Added --column_order flag. Always
      run sanity check on forcing after conversion.
  severity: silent
  cross_references:
  - dt_003
  - cm_001
- id: dt_026
  stage: s4_parameters
  failure_domain: parameter_format
  symptom:
    description: SUMMA crashes with 'critSoilWilting parameter is out of range' or 'critSoilTranspire
      out of range' even though values look reasonable.
    error_pattern: critSoilWilting.*out of range|critSoilTranspire.*out of range|fieldCapacity.*out of
      range
    detection_method: log_match
  diagnosis:
    root_cause: Soil parameters from different pedotransfer functions (Saxton-Rawls vs ROSETTA) are inconsistent.
    explanation: 'SUMMA requires theta_res < critSoilWilting < critSoilTranspire < fieldCapacity < theta_sat.
      Saxton-Rawls gives wilting_point=0.025 for sandy soil, but ROSETTA gives theta_res=0.068 for the
      same soil — wilting point is BELOW residual moisture, which is physically impossible. This happens
      because Saxton-Rawls and ROSETTA use different calibration datasets and definitions. The fix: use
      ONE framework for ALL soil parameters. ROSETTA provides self-consistent theta_res/theta_sat/alpha/n/Ksat,
      and FC/WP can be derived from the vGn curve at standard pressure heads (-33 kPa for FC, -1500 kPa
      for WP).

      '
    affected_components:
    - set_trial_parameters.py
    - Any script that mixes Saxton-Rawls hydraulics with ROSETTA vGn parameters
  remedy:
    action: Use set_trial_parameters.py --from_hwsd which derives ALL parameters from ROSETTA consistently.
    tool_to_run: python tools/s4_parameters/set_trial_parameters.py --from_hwsd --attributes_nc ... --output_nc
      ...
    manual_steps:
    - Do NOT mix saxton_rawls() with ROSETTA_VGN table
    - FC = vgn_theta(psi=-3.36m), WP = vgn_theta(psi=-152.9m) from same alpha/n
    prevention: --from_hwsd mode ensures self-consistency. Manual mode (--parameters) bypasses this.
  severity: fatal
  cross_references:
  - dt_019
- id: dt_025
  stage: s6_execution
  failure_domain: unit_conversion
  symptom:
    description: SUMMA appears to produce zero runoff (PBIAS=-99.9%) despite correct precipitation and
      ET. Water balance appears to have a 1000 mm/yr gap.
    error_pattern: PBIAS.*-99|runoff.*0 mm|RainPlusMelt.*1 mm
    detection_method: output_check
  diagnosis:
    root_cause: 'SUMMA output variables use MIXED UNITS: some in kg/m²/s (=mm/s), others in m/s. A factor
      of 1000 difference.'
    explanation: "SUMMA's computFlux.f90 divides throughfall (kg/m²/s) by iden_water (1000 kg/m³) to get\
      \ RainPlusMelt in m/s. Other variables like scalarThroughfallRain and scalarTotalET remain in kg/m²/s.\
      \ When computing discharge Q=runoff×area, the correct formula is Q(m³/s) = scalarTotalRunoff(m/s)\
      \ × HRUarea(m²) — NO division by 1000. If you divide by 1000 (assuming kg/m²/s), Q is 1000x too\
      \ low.\nVariables in m/s:  scalarTotalRunoff, scalarRainPlusMelt, scalarInfiltration,\n        \
      \           scalarSoilDrainage, scalarSurfaceRunoff, averageRoutedRunoff\nVariables in kg/m²/s:\
      \ scalarThroughfallRain, scalarThroughfallSnow, scalarTotalET,\n                      scalarCanopyEvaporation,\
      \ scalarGroundEvaporation, pptrate\n\nThis cost 2 days of debugging (2026-04-11 to 2026-04-12).\
      \ The model was producing realistic runoff (508 mm/yr) the entire time.\n"
    affected_components:
    - parse_summa_output.py discharge calculation
    - Any post-processing that converts runoff to m³/s
  remedy:
    action: Check the 'units' attribute of each output variable. Use Q = scalarTotalRunoff(m/s) × area(m²).
      Do NOT divide by 1000.
    tool_to_run: ''
    manual_steps:
    - ncdump -h output.nc | grep 'units' to see m s-1 vs kg m-2 s-1
    - 'For Q: Q_m3s = scalarTotalRunoff * HRUarea (both in SI, result is m³/s)'
    - 'For water balance: convert all to mm/yr using the correct factor per unit'
    - '  kg/m²/s → mm/yr: multiply by 86400 × 365'
    - '  m/s → mm/yr: multiply by 86400 × 365 × 1000'
    prevention: Always check units attribute before computing. Add unit check to parse_summa_output.py.
  severity: silent
  cross_references:
  - cm_001
- id: dt_024
  stage: s1_domain_setup
  failure_domain: classification_mismatch
  symptom:
    description: SUMMA crashes with 'canopySnow/failed to converge [mass]' for ALL GRUs at first freezing
      event. nrg_flux fails universally on subtropical basins.
    error_pattern: canopySnow.*failed to converge.*mass
    detection_method: log_match
  diagnosis:
    root_cause: AVHRR IGBP-DIS class 11 (Wetland/Cropland) mapped directly as USGS class 11 (Deciduous
      Broadleaf Forest, 20m canopy).
    explanation: 'AVHRR 1km uses IGBP-DIS classification. SUMMA VEGPARM.TBL uses USGS 27-class scheme.
      Class 11 means completely different things: IGBP=Wetland (flat cropland/paddy in China), USGS=Deciduous
      Broadleaf Forest (ZTOPV=20m, LAI=1.85-3.31, high interception). In Bengbu, 74% of the basin is AVHRR
      class 11 (rice paddies). Without crosswalk, 74% of HRUs get treated as 20m tall deciduous forest.
      The tall canopy interception capacity combined with winter freezing creates numerically stiff equations
      in canopySnow that fail to converge. This is a silent setup error — SUMMA processes the wrong veg
      type without warning.

      '
    affected_components:
    - create_gru_hru.py IGBP→USGS crosswalk
    - canopySnow.f90 convergence (convTolerMass=0.0001)
    - VEGPARM.TBL canopy height/LAI lookup
  remedy:
    action: 'Apply IGBP→USGS crosswalk table in create_gru_hru.py. Key mapping: IGBP 11→USGS 3 (Irrigated
      Cropland).'
    tool_to_run: ''
    manual_steps:
    - 'Check veg types: ncdump -v vegTypeIndex attributes.nc'
    - 'If subtropical basin has many type 11 (Deciduous Broadleaf): wrong classification'
    - 'Apply crosswalk: IGBP_TO_USGS = {11:3, 12:2, 10:7, 7:9, 6:8, ...}'
    - Rebuild attributes.nc with corrected veg types
    prevention: create_gru_hru.py now includes IGBP_TO_USGS crosswalk table (added 2026-04-12).
