template_version: "3.3"

identity:
  model_id: "DSSAT"
  scientific_reference_version: "DSSAT 4.8.5 cropping-system shell (Jones et al. 2003 modular CSM architecture; Hoogenboom et al. 2019)"
  implementation:
    id: "dssat-csm-485"
    version: "4.8.5 Build 41"
    provenance: "DSSAT-CSM Fortran source build 41 from github.com/DSSAT/dssat-csm-os; CMake + gfortran/Intel IFort; binary dscsm048."
  ki_class: "forward_model"
  language: "fortran"
  license: "BSD-3-Clause"
  repo_url: "https://github.com/DSSAT/dssat-csm-os"

boundary:
  scope_in:
    - "Daily simulation of crop growth, development, and yield for 45+ crops as a function of soil-plant-atmosphere dynamics"
    - "Daily soil water balance across a multi-layer 1-D soil column (Ritchie cascading tipping-bucket)"
    - "Daily soil nitrogen, phosphorus, potassium, and carbon balances with selectable SOM engine (CERES/Godwin or CENTURY/Parton)"
    - "Genotype x Environment x Management (GxExM) interactions on a single homogeneous land unit"
    - "Greenhouse gas emissions (N2O, CO2-C from SOM decomposition; CH4 for paddy rice)"
  scope_out:
    - "Lateral surface or subsurface hydrology / channel routing between fields"
    - "Spatial / gridded simulation (no built-in spatial mode; one weather station + one soil profile per simulation)"
    - "Sub-daily atmospheric forcing (model is forced at daily timestep; only specific processes like hourly canopy photosynthesis compute sub-daily internally)"
    - "Closed surface energy budget at the canopy (default ET options are demand-side flux methods, not full energy closure)"
  spatial: "1-D column"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-balance closure applies to water, inorganic and organic N, P, K, and the C pools of the selected SOM engine across the soil column and plant. Default daily ET options (Ritchie/Priestley-Taylor/FAO-56 Penman-Monteith/ASCE) are demand-side flux calculations rather than a closed surface energy budget; canopy energy-balance closure appears only when the optional hourly canopy photosynthesis path (PHOTO=C / ETPHOT) is active. Some processes (radiation/temperature inside ETPHOT and PETPTH) discretize the day into 24 hourly steps internally."

inputs:
  forcing:
    - {category: "weather", name: "SRAD (solar radiation)", unit: "MJ/m2/day", source_kind: "forcing", model_input_format: ".WTH FileW (DSSAT fixed-width)", notes: "Range-checked 0-100; <0.1 silently clamped to 0.1 with WARNING; W/m2 must be converted (x0.0864)."}
    - {category: "weather", name: "TMAX (max air temperature)", unit: "deg C", source_kind: "forcing", model_input_format: ".WTH FileW", notes: "Must satisfy TMAX >= TMIN every day."}
    - {category: "weather", name: "TMIN (min air temperature)", unit: "deg C", source_kind: "forcing", model_input_format: ".WTH FileW"}
    - {category: "weather", name: "RAIN (precipitation)", unit: "mm/day", source_kind: "forcing", model_input_format: ".WTH FileW"}
    - {category: "weather", name: "WIND", unit: "km/day", source_kind: "forcing", model_input_format: ".WTH FileW", notes: "Required if MEEVP=F (FAO-56 PM) or Z (ASCE); DSSAT expects km/day not m/s (x86.4)."}
    - {category: "weather", name: "TDEW / DEWP (dew-point temperature)", unit: "deg C", source_kind: "forcing", model_input_format: ".WTH FileW", notes: "Required for FAO-56 PM and ASCE ET options."}
    - {category: "weather", name: "RHUM (relative humidity)", unit: "%", source_kind: "forcing", model_input_format: ".WTH FileW"}
    - {category: "weather", name: "PAR (photosynthetically active radiation)", unit: "moles/m2/day", source_kind: "forcing", model_input_format: ".WTH FileW"}
    - {category: "atmospheric", name: "CO2 (atmospheric CO2 concentration)", unit: "ppm", source_kind: "forcing", model_input_format: "ICO2 switch selects M=measured CO2xxx.WDA per year, D=static default ~380 ppm, W=from .WTH file", notes: "Time-varying atmospheric driver; affects photosynthesis via CO2 fertilization."}
  parameters:
    - {category: "soil_surface", name: "SALB (bare/dry surface albedo)", unit: "fraction", source_kind: "calibrated", model_input_format: ".SOL profile header"}
    - {category: "soil_surface", name: "SLU1 (stage-1 soil evaporation upper limit U)", unit: "mm", source_kind: "calibrated", model_input_format: ".SOL profile header"}
    - {category: "soil_surface", name: "SLDR (drainage rate SWCON)", unit: "fraction/day", source_kind: "calibrated", model_input_format: ".SOL profile header"}
    - {category: "soil_surface", name: "SLRO (SCS runoff curve number CN)", unit: "dimensionless", source_kind: "calibrated", model_input_format: ".SOL profile header"}
    - {category: "soil_surface", name: "SLNF (N mineralization factor)", unit: "fraction", source_kind: "calibrated", model_input_format: ".SOL profile header", notes: "Silently clamped to 1.0 if outside [0,1]."}
    - {category: "soil_surface", name: "SLPF (photosynthesis/growth factor)", unit: "fraction", source_kind: "calibrated", model_input_format: ".SOL profile header"}
    - {category: "soil_layer", name: "SLB (layer bottom depth)", unit: "cm", source_kind: "dataset_lookup", model_input_format: ".SOL per-layer", notes: "Strictly monotonic; max NL=20 layers; layer 1 top fixed at 0 cm."}
    - {category: "soil_layer", name: "SLLL (lower limit / wilting point LL)", unit: "cm3/cm3", source_kind: "calibrated", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SDUL (drained upper limit / field capacity DUL)", unit: "cm3/cm3", source_kind: "calibrated", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SSAT (saturated water content SAT)", unit: "cm3/cm3", source_kind: "calibrated", model_input_format: ".SOL per-layer", notes: "Must satisfy SLLL < SDUL < SSAT in every layer."}
    - {category: "soil_layer", name: "SRGF (relative root growth factor)", unit: "fraction", source_kind: "calibrated", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SSKS (saturated hydraulic conductivity)", unit: "cm/hr", source_kind: "calibrated", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SBDM (bulk density)", unit: "g/cm3", source_kind: "dataset_lookup", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SLOC (organic carbon)", unit: "%", source_kind: "dataset_lookup", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SLCL/SLSI/SLCF (clay/silt/coarse-fragment fractions)", unit: "%", source_kind: "dataset_lookup", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SLNI (total N)", unit: "%", source_kind: "dataset_lookup", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SLHW/SLHB (pH in water / buffer)", unit: "pH units", source_kind: "dataset_lookup", model_input_format: ".SOL per-layer"}
    - {category: "soil_layer", name: "SCEC (cation exchange capacity)", unit: "cmol/kg", source_kind: "dataset_lookup", model_input_format: ".SOL per-layer"}
    - {category: "weather_climatology", name: "TAV (annual mean air temperature)", unit: "deg C", source_kind: "calibrated", model_input_format: ".WTH station header", notes: "Defaults silently to 20 deg C if missing/<=0; controls soil temperature seasonality."}
    - {category: "weather_climatology", name: "AMP / TAMP (annual amplitude of monthly mean T)", unit: "deg C", source_kind: "calibrated", model_input_format: ".WTH station header", notes: "Defaults silently to 5 deg C if missing/<=0."}
    - {category: "weather_station", name: "LAT, LONG, ELEV, REFHT, WNDHT (station geometry)", unit: "degrees / m", source_kind: "dataset_lookup", model_input_format: ".WTH station header"}
    - {category: "cultivar", name: "CERES grain coefficients (e.g., P1, P2/P2O, P2R, P5, G1, G2, G3, PHINT, P1D, P1V, VEFF, THOT)", unit: "mixed (GDD, hours, GDD/h, count, g, dimensionless)", source_kind: "calibrated", model_input_format: ".CUL (e.g., MZCER048.CUL, WHCER048.CUL, RICER048.CUL)", notes: "Range bounds in .SPE MINIMA/MAXIMA are documentation only; out-of-range values run silently."}
    - {category: "cultivar", name: "CROPGRO photothermal coefficients (CSDL, PPSEN, EM-FL, FL-SD, SD-PM, LFMAX, SLAVR, WTPSD, etc.)", unit: "mixed (h, 1/h, photothermal days, mg CO2/m2/s, cm2/g, g)", source_kind: "calibrated", model_input_format: ".CUL (e.g., SBGRO048.CUL)"}
    - {category: "ecotype", name: "Ecotype coefficients", unit: "mixed", source_kind: "calibrated", model_input_format: ".ECO (e.g., SBGRO048.ECO; not used for some CERES crops like rice)"}
    - {category: "species", name: "Species coefficients (cardinal temperatures, RUE, partitioning rules, MINIMA/MAXIMA bounds)", unit: "mixed", source_kind: "calibrated", model_input_format: ".SPE (e.g., MZCER048.SPE)"}
  initial_conditions:
    - {category: "soil_state", name: "SH2O (initial volumetric soil water by layer)", unit: "cm3/cm3", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS layer fields (ICBL must match .SOL SLB)", notes: "Silently clamped to [LL, SAT] at initialization."}
    - {category: "soil_state", name: "SNO3 (initial soil nitrate by layer)", unit: "ppm", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS layer fields", notes: "Defaults to 0.1 ppm when ISWNIT=N; no upper bound enforced; unit confusion (kg/ha vs ppm) silently inflates yield."}
    - {category: "soil_state", name: "SNH4 (initial soil ammonium by layer)", unit: "ppm", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS layer fields"}
    - {category: "residue_state", name: "ICRES (initial surface residue mass)", unit: "kg/ha", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS header"}
    - {category: "residue_state", name: "ICREN, ICREP, ICRIP, ICRID (residue %N, %P, % incorporated, incorporation depth)", unit: "% / cm", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS header"}
    - {category: "legacy_crop", name: "PCR (previous crop code)", unit: "2-char code", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS header"}
    - {category: "soil_state", name: "ICRT, ICND, ICRN, ICRE (initial root weight, nodules, root N, root growth params)", unit: "kg/ha / mixed", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS header"}
    - {category: "soil_state", name: "ICWD (water-table depth)", unit: "cm (-99 if none)", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS header"}
    - {category: "soil_state", name: "ICDAT (initial-conditions date)", unit: "YYDDD Julian", source_kind: "user_provided", model_input_format: "FileX *INITIAL CONDITIONS header", notes: "Must be <= SDATE."}
  boundary_conditions:
    - {category: "control", name: "SDATE (simulation start date)", unit: "YYDDD Julian", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS GENERAL", notes: "Must satisfy SDATE <= PDATE (earliest management event)."}
    - {category: "control", name: "NYERS (number of simulated years)", unit: "count", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS GENERAL"}
    - {category: "control", name: "SMODEL (8-char crop model identifier)", unit: "code", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS GENERAL", notes: "Blank defaults to DSSATPRO mapping; wrong code silently misinterprets cultivar coefficients."}
    - {category: "control_switch", name: "WATER, NITRO, SYMBI, PHOSP, POTAS, DISES, CHEM, TILL (process toggles ISWWAT/ISWNIT/ISWSYM/ISWPHO/ISWPOT/ISWDIS/ISWCHE/ISWTIL)", unit: "Y/N", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS OPTIONS", notes: "WATER=N forces NITRO and PHOSP to N; SYMBI valid only for legumes."}
    - {category: "method_switch", name: "MEEVP / EVAPO (ET method)", unit: "code (R/P/F/Z/D/M/H/T)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS", notes: "R=Ritchie (default), P=Priestley-Taylor, F=FAO-56 Penman-Monteith, Z=ASCE."}
    - {category: "method_switch", name: "MESEV (soil evaporation method)", unit: "code (S/R)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS", notes: "S=Suleiman-Ritchie (recommended); R=old Ritchie two-stage (code default when section absent)."}
    - {category: "method_switch", name: "MEINF / INFIL (infiltration method)", unit: "code (S/N/R)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS"}
    - {category: "method_switch", name: "MEPHO / PHOTO (photosynthesis method)", unit: "code (L/C/R)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS", notes: "L=leaf-level daily (required for CROPGRO crops), C=hourly canopy (ETPHOT), R=RUE radiation-use-efficiency (CERES default)."}
    - {category: "method_switch", name: "MEHYD / HYDRO (hydrology method)", unit: "code (R)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS"}
    - {category: "method_switch", name: "MESOM (SOM engine)", unit: "code (G/P)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS", notes: "G=Godwin/CERES single-pool; P=Parton/Century multi-pool (requires mesic spin-up)."}
    - {category: "method_switch", name: "MESOL (soil-layer redistribution)", unit: "code (1/2/3)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS"}
    - {category: "method_switch", name: "METMP (soil temperature method)", unit: "code (D/E)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS", notes: "D=DSSAT-Kimball improved (v4.8+); E=EPIC."}
    - {category: "method_switch", name: "MEGHG (greenhouse-gas method)", unit: "code (0/1)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS", notes: "0=DSSAT original denitrification; 1=DayCent N2O."}
    - {category: "method_switch", name: "MEWTH / WTHER (weather source)", unit: "code (M/G/S)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS"}
    - {category: "method_switch", name: "ICO2 (CO2 source switch)", unit: "code (M/D/W)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS"}
    - {category: "method_switch", name: "INCON (initial-conditions source)", unit: "code (M/S)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS"}
    - {category: "method_switch", name: "NSWIT (N routine selector)", unit: "code (1)", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS METHODS"}
    - {category: "management_mode", name: "IPLTI, IIRRI, IFERI, IHARI (planting/irrigation/fertilizer/harvest mode: R reported, A automatic, N none, F/D variants)", unit: "code", source_kind: "user_provided", model_input_format: "FileX *SIMULATION CONTROLS MANAGEMENT"}
    - {category: "management_planting", name: "PDATE (planting date)", unit: "YYDDD Julian", source_kind: "user_provided", model_input_format: "FileX *PLANTING DETAILS"}
    - {category: "management_planting", name: "PPOP (plant population)", unit: "plants/m2", source_kind: "user_provided", model_input_format: "FileX *PLANTING DETAILS"}
    - {category: "management_planting", name: "PLRS (row spacing)", unit: "cm", source_kind: "user_provided", model_input_format: "FileX *PLANTING DETAILS"}
    - {category: "management_planting", name: "PLDP (planting depth)", unit: "cm", source_kind: "user_provided", model_input_format: "FileX *PLANTING DETAILS"}
    - {category: "management_planting", name: "INGENO (cultivar code)", unit: "6-char code", source_kind: "user_provided", model_input_format: "FileX *CULTIVARS (must match VAR# in .CUL for selected crop model)"}
    - {category: "management_irrigation", name: "Irrigation events {IDATE, IRVAL amount, IROP method, EFIR efficiency}", unit: "YYDDD / mm / code / fraction", source_kind: "user_provided", model_input_format: "FileX *IRRIGATION AND WATER MANAGEMENT"}
    - {category: "management_fertilizer", name: "Fertilizer events {FDATE, FAMN N rate, FAMP P rate, FAMK K rate, FMCD method code, FDEP depth}", unit: "YYDDD / kg/ha / code / cm", source_kind: "user_provided", model_input_format: "FileX *FERTILIZERS (INORGANIC)", notes: "Invalid FMCD silently reset to '001' broadcast."}
    - {category: "management_residue", name: "Organic-residue events", unit: "mixed", source_kind: "user_provided", model_input_format: "FileX *RESIDUES"}
    - {category: "management_tillage", name: "Tillage events", unit: "mixed", source_kind: "user_provided", model_input_format: "FileX *TILLAGE"}
    - {category: "management_chemical", name: "Chemical/pesticide events", unit: "mixed", source_kind: "user_provided", model_input_format: "FileX *CHEMICAL"}
    - {category: "management_harvest", name: "Harvest events {HDATE, HPC harvest %, HBPC by-product %, HSTG harvest stage}", unit: "YYDDD / %", source_kind: "user_provided", model_input_format: "FileX *HARVEST"}
    - {category: "management_auto", name: "Automatic-management thresholds (PWDINF/PWDINL window, soil-moisture/temperature criteria, irrigation/fertilizer triggers)", unit: "mixed", source_kind: "user_provided", model_input_format: "FileX @AUTOMATIC MANAGEMENT"}
    - {category: "linkage", name: "WSTA (4-char weather-station code linking to .WTH)", unit: "code", source_kind: "user_provided", model_input_format: "FileX *FIELDS"}
    - {category: "linkage", name: "ID_SOIL (10-char soil-profile code linking to .SOL pedon)", unit: "code", source_kind: "user_provided", model_input_format: "FileX *FIELDS", notes: "SLNO='-99' or blank silently substitutes a 1-layer generic default soil."}

processes:
  modules:
    - {name: "CSM (driver)", role: "driver", brief: "Top-level PROGRAM CSM in CSM_Main/CSM.for. Parses runlist, reads FileX, opens FILEIO, loops over treatments and DYNAMIC phases."}
    - {name: "LAND (sequencer)", role: "driver", brief: "CSM_Main/LAND.for orchestrates the daily state machine WEATHR -> SOIL -> SPAM -> PLANT -> MGMTOPS across DYNAMIC phases RUNINIT, SEASINIT, RATE, INTEGR, OUTPUT, SEASEND, ENDRUN."}
    - {name: "WEATHR", role: "driver", brief: "Weather/weathr.for reads observed .WTH (IPWTH) or generates stochastic weather (WGEN); computes hourly fluxes (HMET, SOLAR); applies WTHMOD adjustments; sets CO2 (CO2VAL)."}
    - {name: "Phenology (PHENOL / crop-specific variants MZ_PHENOL, IpPhenol)", role: "process_solver", brief: "Tracks thermal-time / GDD accumulation, daylength, vernalization; advances VSTAGE, RSTAGE, EDAT, ADAT, MDAT."}
    - {name: "CROPGRO", role: "process_solver", brief: "Plant/CROPGRO/CROPGRO.for. Leaf-level CO2/light/N/water-limited photosynthesis (PHOTO=L), DEMAND-driven C/N partitioning (DEMAND, MOBIL), cohort-based PODS/SDCOMP, RESPIR maintenance/growth respiration; legumes, vegetables, fiber crops, perennial forages.", applicability: "CROPGRO crops only (soybean, peanut, cotton, dry bean, tomato, etc.)"}
    - {name: "CERES (CERES-Maize MZCER, CERES-Wheat WHCER, CERES-Rice RICER, CERES-Sorghum SGCER, CERES-Millet MLCER, CERES-Barley BACER, CERES-Sugarbeet BSCER)", role: "process_solver", brief: "Radiation-use-efficiency (RUE) biomass accumulation; staged grain filling (MZ_GROSUB, RI_GROSUB); root growth (MZ_ROOTS); N balance (MZ_NFACTO, MZ_NUPTAK).", applicability: "CERES grain cereals"}
    - {name: "IXIM (MZIXM)", role: "process_solver", brief: "Alternative maize growth engine (more mechanistic canopy than CERES-Maize).", applicability: "MODEL=MZIXM048"}
    - {name: "CropSim / APSIM-Wheat (CSCER, WHCRP, WHAPS)", role: "process_solver", brief: "Alternative wheat/barley templates."}
    - {name: "SUBSTOR (PTSUB, TR_SUBSTOR)", role: "process_solver", brief: "Tuber crops (potato, taniers).", applicability: "Tuber crops"}
    - {name: "Specialized crop engines (CANEGRO, CASUPRO, SAMUCA, CSYCA/CSCAS, ALOHA, TEFF, AROIDS, Forage)", role: "process_solver", brief: "Sugarcane, cassava, pineapple, tef, root crops, forages."}
    - {name: "WATBAL (Ritchie cascading soil water)", role: "process_solver", brief: "Soil/SoilWater/WATBAL.for. Daily tipping-bucket water balance with DUL/LL/SAT/SWCON; runoff via SCS curve number (RNOFF); infiltration (INFIL S/N=SCS or R=Ritchie); saturated drainage (SATFLO); tile drainage; water table; capillary fringe upward flow. Writes SWDELTS."}
    - {name: "SPAM (Soil-Plant-Atmosphere)", role: "process_solver", brief: "SPAM/SPAM.for. Computes potential ET via PET dispatcher (PETPT/PETPEN/PETASCE/PETDYN/PETPNO/PETMEY/PETPTH), partitions EO into EOS soil evaporation (PSE + SOILEV or ESR_SoilEvap two-stage) and EOP transpiration (TRANS), invokes root water uptake (ROOTWU), computes soil temperature (STEMP / STEMP_EPIC), mulch and flood evaporation."}
    - {name: "ETPHOT", role: "optional_module", brief: "Hourly canopy photosynthesis and energy balance for PHOTO=C path; supplies EOP to SPAM with sub-daily resolution.", applicability: "MEPHO=C"}
    - {name: "SoilNi (inorganic N)", role: "process_solver", brief: "Soil/Inorganic_N. Nitrification, denitrification, NH4/NO3 transport, urea hydrolysis, oxidized-layer dynamics for paddy (OXLAYER); NFLUX, EQUIL2."}
    - {name: "SoilOrg / CENTURY (alternative SOM engines)", role: "process_solver", brief: "Soil/CERES_OrganicMatter/SoilOrg.for (Godwin/Jones single-pool) vs Soil/CENTURY_OrganicMatter/CENTURY.for (Parton three-pool). Both decompose litter, mineralize N/P/C, write SoilOrg.OUT/SOMLITC.OUT.", applicability: "MESOM=G selects Godwin; MESOM=P selects Century"}
    - {name: "SoilPi / SoilKi (inorganic P, K)", role: "optional_module", brief: "Sorption, mineralization, plant-available pool dynamics for P and K.", applicability: "ISWPHO=Y for P; ISWPOT=Y for K"}
    - {name: "FloodN / Paddy_Mgmt", role: "optional_module", brief: "Flood-water layer state (FLOOD, FLOODWAT), paddy N dynamics in floodwater, auto-irrigation to maintain bund depth.", applicability: "Paddy rice"}
    - {name: "GHG (Greenhouse-gas module)", role: "optional_module", brief: "Methane (CH4) emissions from paddy; N2O emissions from soil; writes GHG.OUT.", applicability: "MEGHG=1 enables DayCent N2O; CH4 enabled for paddy"}
    - {name: "Mulch", role: "optional_module", brief: "Surface-mulch layer state (MULCHMASS, MULCHWAT, MULCHALB); evaporation and decay; coupled to SPAM (MULCH_EVAP) and WATBAL (initial abstraction)."}
    - {name: "Symbiotic N fixation (SYMBI / NFIX)", role: "optional_module", brief: "Daily N fixation NFIXN; cumulative NFXM; legumes only.", applicability: "ISWSYM=Y and legume crop"}
    - {name: "Disease / Chemical / Tillage modules (DISES, CHEM, TILL)", role: "optional_module", brief: "Optional perturbations on plant, soil, and management state."}
    - {name: "MGMTOPS (management driver)", role: "driver", brief: "Management/MgmtOps.for orchestrates planting (AUTPLT), harvest (AUTHAR), irrigation (IRRIG, PADDY_MGMT, Flood_Irrig), fertilizer placement (Fert_Place), tillage (TILLAGE), organic-matter placement (OM_Place), chemicals (Chemical)."}
    - {name: "LAND/SEQ integrator (INTEGR phase)", role: "integrator", brief: "Inside LAND.for INTEGR: integrates SW(L) = SW(L) + SWDELTS(L) + SWDELTU(L) + SWDELTX(L) per layer, updates plant DM pools from daily increments, advances DAS/DAP and soil temperature."}
    - {name: "OPSUM / OPVIEW / OPHARV (output aggregators)", role: "integrator", brief: "Utilities/OPSUM.for + OPVIEW.for plus crop-specific OPHARV. Aggregate end-of-season scalars (HWAM yield, ADAT, MDAT, CWAM, GNAM, ETCM, ROCM) and emit Summary.OUT and Overview.OUT."}
  internal_edges:
    - {from: "CSM", to: "LAND", kind: "invokes", brief: "PROGRAM CSM calls LAND once per RUNINIT/SEASINIT and once per simulated day."}
    - {from: "LAND", to: "WEATHR", kind: "invokes", brief: "Daily first call; supplies SRAD/TMAX/TMIN/RAIN/TDEW/WINDSP/CO2 via the WEATHER type."}
    - {from: "WEATHR", to: "SPAM", kind: "produces_output", brief: "Daily weather drives PET and ET partitioning."}
    - {from: "WEATHR", to: "Phenology (PHENOL / crop-specific variants MZ_PHENOL, IpPhenol)", kind: "produces_output", brief: "TMAX/TMIN drive thermal-time accumulator and photoperiod calculation."}
    - {from: "WEATHR", to: "WATBAL (Ritchie cascading soil water)", kind: "consumes_input", brief: "RAIN drives infiltration and runoff."}
    - {from: "LAND", to: "SOIL", kind: "invokes", brief: "Daily call; SOIL dispatches to SOILDYN, WATBAL, CENTURY or SoilOrg, SoilNi, SoilPi, SoilKi."}
    - {from: "LAND", to: "MGMTOPS (management driver)", kind: "invokes", brief: "Daily call after PLANT; MGMTOPS dispatches planting (AUTPLT), irrigation (IRRIG/PADDY_MGMT), fertilizer placement (Fert_Place), tillage (TILLAGE), organic-matter placement (OM_Place), chemicals (Chemical), and harvest (AUTHAR)."}
    - {from: "WATBAL (Ritchie cascading soil water)", to: "SW (soil water state)", kind: "writes_state", brief: "Computes SWDELTS(NL) - drainage + infiltration + redistribution - added to SW in INTEGR phase."}
    - {from: "WATBAL (Ritchie cascading soil water)", to: "WINF (water available for infiltration)", kind: "writes_state", brief: "Williams-SCS curve-number RNOFF inside WATBAL determines RUNOFF; WINF = RAIN + irrigation - RUNOFF passed to INFIL; initial-abstraction ratio capped at 0.6."}
    - {from: "Mulch", to: "WATBAL (Ritchie cascading soil water)", kind: "reads_state", brief: "Mulch state modifies initial abstraction in RNOFF."}
    - {from: "SOIL", to: "SPAM", kind: "produces_output", brief: "SOILPROP (BD, DUL, LL, SAT, OC, SWCN) and ST passed to SPAM for ET partitioning and root uptake."}
    - {from: "LAND", to: "SPAM", kind: "invokes", brief: "After SOIL; SPAM consumes EORATIO, KSEVAP, KTRANS, RLV, XHLAI from PLANT (previous-day state)."}
    - {from: "SPAM", to: "ETPHOT", kind: "invokes", brief: "Sub-daily canopy energy balance and photosynthesis path."}
    - {from: "SPAM", to: "EO (potential evapotranspiration)", kind: "writes_state", brief: "PET dispatch (Ritchie/Priestley-Taylor/FAO-56 PM/ASCE) produces EO; ET_ALB silently overridden to 0.05 when FLOOD>0."}
    - {from: "SPAM", to: "EOS (potential soil evaporation)", kind: "writes_state", brief: "PSE partitions EO into EOS using XLAI and KSEVAP; SOILEV / ESR_SoilEvap computes ES with two-stage soil evaporation limited by SLU1."}
    - {from: "SPAM", to: "EOP (potential transpiration)", kind: "writes_state", brief: "TRANS computes potential transpiration EOP; actual EP capped at MIN(EOP, TRWUP*10) where TRWUP is potential root uptake."}
    - {from: "SPAM", to: "RWU(NL), TRWUP, TRWU (potential and actual root water uptake)", kind: "writes_state", brief: "ROOTWU computes per-layer potential root water uptake from RLV, SW, LL, SAT, PORMIN, RWUMX."}
    - {from: "SW(NL) (volumetric soil water content per layer)", to: "SWFAC, TURFAC (water stress on photosynthesis / expansion)", kind: "writes_state", brief: "SWFAC reduces photosynthesis below threshold; TURFAC reduces expansive growth earlier (expansion more water-sensitive)."}
    - {from: "LAND", to: "PLANT", kind: "invokes", brief: "Daily call; PLANT dispatches to CROPGRO / CERES variant / SUBSTOR / specialized engine per MODEL code."}
    - {from: "PLANT", to: "CROPGRO", kind: "invokes", brief: "Dispatch when MODEL is a CROPGRO crop code (e.g., CRGRO048 for soybean, peanut, cotton, dry bean, tomato)."}
    - {from: "PLANT", to: "CERES (CERES-Maize MZCER, CERES-Wheat WHCER, CERES-Rice RICER, CERES-Sorghum SGCER, CERES-Millet MLCER, CERES-Barley BACER, CERES-Sugarbeet BSCER)", kind: "invokes", brief: "Dispatch for CERES grain-cereal MODEL codes (MZCER048, WHCER048, RICER048, SGCER048, MLCER048, BACER048, BSCER048)."}
    - {from: "PLANT", to: "SUBSTOR (PTSUB, TR_SUBSTOR)", kind: "invokes", brief: "Dispatch for tuber-crop MODEL codes (PTSUB048 potato, TRSUB taniers)."}
    - {from: "PLANT", to: "IXIM (MZIXM)", kind: "invokes", brief: "Dispatch when MODEL=MZIXM048 (alternative maize, more mechanistic canopy than CERES-Maize)."}
    - {from: "PLANT", to: "CropSim / APSIM-Wheat (CSCER, WHCRP, WHAPS)", kind: "invokes", brief: "Dispatch for CSCER048/WHCRP048/WHAPS048 wheat/barley templates."}
    - {from: "PLANT", to: "Specialized crop engines (CANEGRO, CASUPRO, SAMUCA, CSYCA/CSCAS, ALOHA, TEFF, AROIDS, Forage)", kind: "invokes", brief: "Dispatch for CANEGRO/CASUPRO/SAMUCA (sugarcane), CSYCA/CSCAS (cassava), ALOHA (pineapple), TEFF (tef), AROIDS (root crops), Forage by MODEL code."}
    - {from: "Phenology (PHENOL / crop-specific variants MZ_PHENOL, IpPhenol)", to: "C/N partitioning", kind: "produces_output", brief: "After ADAT partitioning shifts to grain; grain-filling duration controlled by P5; HIAM accumulates."}
    - {from: "PLANT", to: "PG (gross photosynthesis)", kind: "writes_state", brief: "Daily gross assimilation computed via either the PHOTO=R RUE path (SRAD x RUE x f(XHLAI)) or the PHOTO=L leaf-level CROPGRO path; SRAD supplied by WEATHR and XHLAI is the previous-day PLANT state."}
    - {from: "PG (gross photosynthesis)", to: "WTLF, STMWT, RTWT, SDWT, PODWT (leaf/stem/root/seed/pod dry weights)", kind: "writes_state", brief: "Daily DM accumulation = PG x (1 - respiration losses) multiplicatively scaled by stress factors SWFAC, NSTRES, KSTRES, PSTRS1; allocated to organ pools by partitioning rules."}
    - {from: "CROPGRO", to: "WTLF, STMWT, RTWT, SDWT, PODWT (leaf/stem/root/seed/pod dry weights)", kind: "writes_state", brief: "GROW updates dry-weight pools each INTEGR call."}
    - {from: "CROPGRO", to: "RLV(NL) (root length density)", kind: "writes_state", brief: "ROOTS distributes root growth to RLV(NL); consumed next day by ROOTWU."}
    - {from: "PLANT", to: "XLAI / XHLAI (total / healthy leaf area index)", kind: "produces_output", brief: "Leaf area state fed back to SPAM for next-day energy partition."}
    - {from: "SoilNi (inorganic N)", to: "PLANT", kind: "produces_output", brief: "Available NH4/NO3 per layer consumed by crop N uptake routines (NUPTAK / MZ_NUPTAK)."}
    - {from: "PLANT", to: "NSTRES (nitrogen stress factor)", kind: "writes_state", brief: "NSTRES = N_supply / N_demand computed from plant N demand vs SoilNi-supplied uptake; <1 reduces growth."}
    - {from: "NSTRES (nitrogen stress factor)", to: "PG (gross photosynthesis)", kind: "reads_state", brief: "Feedback into PHOTO and DEMAND partitioning."}
    - {from: "SoilOrg / CENTURY (alternative SOM engines)", to: "SoilNi (inorganic N)", kind: "writes_state", brief: "Surface residue (ICRES) plus SOM pool decomposition drive mineralization; MESOM=G (Godwin) or P (Century) selects pool structure; T-sensitive via soil temperature."}
    - {from: "ST(NL) (soil temperature per layer)", to: "SoilOrg / CENTURY (alternative SOM engines)", kind: "reads_state", brief: "Soil-T (METMP=D Kimball-improved or E EPIC) modulates SOM decomposition and nitrification rates; soil-T pool itself is initialized from TAV+TAMP at SEASINIT."}
    - {from: "WEATHR", to: "ST(NL) (soil temperature per layer)", kind: "consumes_input", brief: "Station-header TAV (annual mean) and TAMP (annual amplitude) set the seasonal soil-T profile at SEASINIT before STEMP/STEMP_EPIC begins daily updates."}
    - {from: "Symbiotic N fixation (SYMBI / NFIX)", to: "WTNFX (cumulative N fixation)", kind: "writes_state", brief: "Daily NFIXN accumulated to NFXM; gated by legume crop AND ISWSYM=Y - non-legumes force the switch off regardless of FileX setting."}
    - {from: "MGMTOPS (management driver)", to: "SoilNi (inorganic N)", kind: "writes_state", brief: "Fert_Place adds NH4/NO3/Urea to soil-layer pools at scheduled FERT events; FDEP and FMCD control depth/method."}
    - {from: "MGMTOPS (management driver)", to: "WINF (water available for infiltration)", kind: "writes_state", brief: "IRRIG irrigation amount added to daily WINF before RNOFF/INFIL."}
    - {from: "MGMTOPS (management driver)", to: "FLOOD (floodwater depth)", kind: "writes_state", brief: "PADDY_MGMT auto-irrigation maintains paddy bund depth via FLOODWAT; can override IRRIG when CROP=RI."}
    - {from: "SoilOrg / CENTURY (alternative SOM engines)", to: "SoilNi (inorganic N)", kind: "writes_state", brief: "Mineralization writes NH4 source term to inorganic N pools."}
    - {from: "PLANT", to: "Summary.OUT yield (HWAM/HWAH/HIAM)", kind: "produces_output", brief: "End-of-season harvest scalars written through OPSUM/OPHARV."}
    - {from: "WEATHR", to: "PG (gross photosynthesis)", kind: "consumes_input", brief: "ICO2 switch routes CO2 source (M=measured CO2xxx.WDA, D=static ~380 ppm, W=from .WTH) into CO2VAL, which modulates photosynthesis (CO2 fertilization) and transpiration efficiency."}
    - {from: "PLANT", to: "PlantGro.OUT / PlantN.OUT / PlantC.OUT", kind: "produces_output", brief: "Daily plant-state scalars written via Opgrow."}
    - {from: "WATBAL (Ritchie cascading soil water)", to: "SoilWat.OUT", kind: "produces_output", brief: "Daily soil-water output (SWXD, SWTD, per-layer SW)."}
    - {from: "SoilNi (inorganic N)", to: "SoilNi.OUT", kind: "produces_output", brief: "Daily inorganic-N output (NH4D, NO3D per layer)."}
    - {from: "LAND (sequencer)", to: "OPSUM / OPVIEW / OPHARV (output aggregators)", kind: "invokes", brief: "SEASEND phase aggregates SUMVALS registrations from all modules into Summary.OUT and Overview.OUT."}

states:
  variables:
    - {name: "YRDOY (current simulation date, YYYYDDD)", unit: "Julian", role: "diagnostic"}
    - {name: "DAS (days after simulation start)", unit: "days", role: "accumulator"}
    - {name: "DAP (days after planting)", unit: "days", role: "accumulator"}
    - {name: "DYNAMIC (state-machine phase: RUNINIT/SEASINIT/RATE/INTEGR/OUTPUT/SEASEND/ENDRUN)", unit: "enum", role: "diagnostic"}
    - {name: "SW(NL) (volumetric soil water content per layer)", unit: "cm3/cm3", role: "prognostic"}
    - {name: "SWDELTS(NL) (water-balance increment from WATBAL)", unit: "cm3/cm3/d", role: "diagnostic"}
    - {name: "SWDELTU(NL) (unsaturated-flow increment)", unit: "cm3/cm3/d", role: "diagnostic"}
    - {name: "SWDELTX(NL) (ET-driven increment from SPAM)", unit: "cm3/cm3/d", role: "diagnostic"}
    - {name: "ST(NL) (soil temperature per layer)", unit: "deg C", role: "prognostic"}
    - {name: "SRFTEMP (surface soil temperature)", unit: "deg C", role: "prognostic"}
    - {name: "NH4(NL) (per-layer ammonium pool)", unit: "ppm", role: "prognostic"}
    - {name: "NO3(NL) (per-layer nitrate pool)", unit: "ppm", role: "prognostic"}
    - {name: "FLOOD (floodwater depth)", unit: "mm", role: "prognostic"}
    - {name: "MULCH (mulch state: mass, cover, water, albedo)", unit: "mixed", role: "prognostic"}
    - {name: "WINF (water available for infiltration)", unit: "mm", role: "diagnostic"}
    - {name: "RUNOFF (daily runoff)", unit: "mm", role: "diagnostic"}
    - {name: "EO (potential evapotranspiration)", unit: "mm/d", role: "diagnostic"}
    - {name: "EOP (potential transpiration)", unit: "mm/d", role: "diagnostic"}
    - {name: "EOS (potential soil evaporation)", unit: "mm/d", role: "diagnostic"}
    - {name: "EP (actual transpiration)", unit: "mm/d", role: "diagnostic"}
    - {name: "ES (actual soil evaporation)", unit: "mm/d", role: "diagnostic"}
    - {name: "ET (actual evapotranspiration)", unit: "mm/d", role: "diagnostic"}
    - {name: "XLAI / XHLAI (total / healthy leaf area index)", unit: "m2/m2", role: "prognostic"}
    - {name: "CANHT (canopy height)", unit: "m", role: "prognostic"}
    - {name: "WTLF, STMWT, RTWT, SDWT, PODWT (leaf/stem/root/seed/pod dry weights)", unit: "kg/ha", role: "prognostic"}
    - {name: "TOPWT (aboveground biomass)", unit: "kg/ha", role: "prognostic"}
    - {name: "TOTWT (total plant dry weight)", unit: "kg/ha", role: "prognostic"}
    - {name: "GROWTH (daily biomass increment)", unit: "kg/ha/d", role: "diagnostic"}
    - {name: "PG (gross photosynthesis)", unit: "g CH2O/m2/d", role: "diagnostic"}
    - {name: "GRWRES, MAINR (growth and maintenance respiration)", unit: "g CH2O/m2/d", role: "diagnostic"}
    - {name: "VSTAGE (vegetative stage), RSTAGE (reproductive stage), GSTD", unit: "stage / Zadoks", role: "prognostic"}
    - {name: "MDATE (maturity date)", unit: "YRDOY", role: "prognostic"}
    - {name: "YRPLT (planting date)", unit: "YRDOY", role: "prognostic"}
    - {name: "RLV(NL) (root length density)", unit: "cm root / cm3 soil", role: "prognostic"}
    - {name: "RTDEP (root depth)", unit: "cm", role: "prognostic"}
    - {name: "RWU(NL), TRWUP, TRWU (potential and actual root water uptake)", unit: "cm/d", role: "diagnostic"}
    - {name: "WTNCAN, WTNLF, WTNST, WTNSD, WTNRT, WTNSH (canopy/leaf/stem/seed/root/shell N)", unit: "kg/ha", role: "prognostic"}
    - {name: "WTNUP (cumulative N uptake)", unit: "kg/ha", role: "accumulator"}
    - {name: "WTNFX (cumulative N fixation)", unit: "kg/ha", role: "accumulator"}
    - {name: "NFIXN (daily N fixation)", unit: "kg/ha/d", role: "diagnostic"}
    - {name: "PCNL, PCNST, PCNRT, PCNSD, PCNSH (% N in tissues)", unit: "%", role: "diagnostic"}
    - {name: "SWFAC, TURFAC (water stress on photosynthesis / expansion)", unit: "0-1", role: "diagnostic"}
    - {name: "NSTRES (nitrogen stress factor)", unit: "0-1", role: "diagnostic"}
    - {name: "KSTRES (potassium stress factor)", unit: "0-1", role: "diagnostic"}
    - {name: "PSTRES1, PSTRES2 (phosphorus stress on photo / vegetative)", unit: "0-1", role: "diagnostic"}
    - {name: "EWSD (excess-water / waterlogging stress)", unit: "0-1", role: "diagnostic"}
    - {name: "SOM pools (CERES single-pool or CENTURY three-pool C/N/P)", unit: "kg/ha", role: "prognostic"}
    - {name: "Cumulative water balance (PRCM, ETCM, EPCM, ESCM, IRCM, ROCM, DRCM)", unit: "mm", role: "accumulator"}
    - {name: "Cumulative N balance (NICM, NUCM, NFXM, NLCM)", unit: "kg N/ha", role: "accumulator"}
    - {name: "Cumulative GHG (N2OEM, CO2EM, CH4EM, TCEQM)", unit: "kg N/ha or kg C/ha or kg CO2eq/ha", role: "accumulator"}
  provenance: "populated"

outputs:
  - var: "HWAM (harvested grain yield at maturity, dry)"
    validation_rank: 1
    unit: "kg/ha"
    description: "Dry grain/seed yield at physiological maturity per treatment - the canonical end-of-season yield variable."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single-year/single-site comparison: only a magnitude check is meaningful; r/NSE/KGE are structurally undefined for a single (sim, obs) pair."]
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "ranking_quality"]
          determining_metric: "pbias"
          caveats: ["Multi-year same-site requires NYERS >= 2 and consistent cultivar/management; inter-annual signal is weather-driven."]
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["National/sub-national yield aggregates carry a technology/cultivar-improvement trend that a weather-only point process model cannot reproduce; detrend before comparing temporal patterns."]
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single-year aggregate yield (e.g., FAOSTAT one year, national); scalar check only."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["DSSAT has no built-in spatial mode; a 'field' is constructed by running many point simulations on a grid; per-pixel comparison only makes sense if cultivar/management/soil are spatially varied consistently with the obs."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Requires a gridded ensemble of DSSAT point runs over multiple seasons; per-pixel comparison only valid where cultivar/management/soil vary consistently with the obs."]
      detrending_options: ["none", "first_difference", "linear_residual", "decadal_mean"]
  - var: "HWAH (harvested yield, dry, at harvest date)"
    validation_rank: 2
    unit: "kg/ha"
    description: "Yield actually harvested = HWAM * HPC/100; zero when crop never matured or HPC=0."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["National/sub-national harvested yield aggregates carry a technology/cultivar-improvement trend that a weather-only point process model cannot reproduce; detrend before comparing temporal patterns; HPC must be set or HWAH=0."]
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single-year aggregate; one point comparison only."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["DSSAT has no built-in spatial mode; construct a gridded ensemble."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Gridded ensemble of point runs; align cultivar/management/soil spatially."]
      detrending_options: ["none", "first_difference", "linear_residual", "decadal_mean"]
  - var: "CWAM (aboveground biomass at maturity)"
    validation_rank: 3
    unit: "kg/ha"
    description: "Tops dry weight at physiological maturity."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["National/sub-national biomass aggregates carry a technology/cultivar-improvement trend that a weather-only point process model cannot reproduce; detrend before comparing temporal patterns."]
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single-year aggregate biomass; scalar check only."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["DSSAT has no built-in spatial mode; construct a gridded ensemble for biomass fields."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Gridded ensemble of point runs over multiple seasons; align cultivar/management/soil spatially."]
      detrending_options: ["none", "first_difference", "linear_residual", "decadal_mean"]
  - var: "HIAM (harvest index at maturity)"
    validation_rank: 10
    unit: "fraction"
    description: "Grain / aboveground biomass ratio at maturity."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "ADAT (anthesis date)"
    validation_rank: 11
    unit: "YRDOY"
    description: "Day of year of anthesis/flowering for the simulated season."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["timing_accuracy"]
          determining_metric: "day_bias"
          caveats: ["Compare as DOY (after stripping YYYY); year-boundary issues if YRDOY is treated as raw integer."]
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["timing_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "MDAT (physiological maturity date)"
    validation_rank: 12
    unit: "YRDOY"
    description: "Day of year when the simulated crop reaches physiological maturity."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["timing_accuracy"]
          determining_metric: "day_bias"
          caveats: ["ADAT > MDAT is biologically impossible and indicates a YRDOY parsing bug, not a model error."]
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["timing_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "EDAT (emergence date)"
    validation_rank: 13
    unit: "YRDOY"
    description: "Day of year of crop emergence."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["timing_accuracy"]
          determining_metric: "day_bias"
          caveats: []
      detrending_options: ["none"]
  - var: "LAIX (maximum LAI during season)"
    validation_rank: 6
    unit: "m2/m2"
    description: "Peak leaf area index attained during the simulated season."
    emitted_in: "Summary.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "LAID / XLAI (daily leaf area index)"
    validation_rank: 14
    unit: "m2/m2"
    description: "Daily crop canopy leaf area index trajectory."
    emitted_in: "PlantGro.OUT"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Remote-sensing LAI products carry their own retrieval bias and view-angle/cloud gaps; align on simulation calendar before comparing."]
        - obs_shape: "spatial_time_series"
