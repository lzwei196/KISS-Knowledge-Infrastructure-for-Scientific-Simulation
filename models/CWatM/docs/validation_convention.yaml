schema_version: 1
model_id: CWatM
domain: hydrology
generated_by: "self-improve session (Claude Opus 4.8, 1M) — Step-B validation-convention build, general schema"
generated_at: 2026-07-09

# HOW THIS WAS GROUNDED (honesty note) --------------------------------------------------------------
# DISCHARGE is the primary, well-grounded quantity. Numeric NSE/PBIAS bands are the Moriasi 2007/2015
# hydrology tiers, quoted from OPEN-ACCESS papers that REPRODUCE those tables verbatim (Arnold et al.
# 2012 SWAT calibration; Bouregreg SWAT 2011; Pan-Arctic GHM evaluation 2020) — the primary Moriasi
# papers are paywalled (see deferred_paywalled). CWatM's own model paper (Burek et al. 2020) confirms
# KGE' is the model's primary calibration objective and tabulates the global 1366-GRDC-station skill
# distribution; Knoben et al. 2019 supplies the KGE mean-flow benchmark caveat. Net: discharge = STRONG.
#
# TWS (GRACE) and GROUNDWATER STORAGE have real obs bindings in model_obs_map (tws_anomaly_cm /
# lwe_thickness_cm; groundwater_level_m) so blocks are emitted, but the fetched set contains NO paper
# giving a numeric model-vs-GRACE r threshold or a groundwater-level skill tier -> those bands are null
# with confidence <= 0.35 (they may CONTEXTUALIZE but NEVER loosen the gate). Scanlon et al. 2018 (PNAS)
# documents a genuine STRUCTURAL ceiling: global models systematically underestimate GRACE decadal TWS
# trends, so TWS trend/amplitude magnitude is a data/structure ceiling, not a KI defect.
#
# EVAPOTRANSPIRATION and SWE/snow are declared in the dag but have NO obs binding in model_obs_map
# (has_obs_binding: false; no ET or snow observation row) -> no gradeable convention, no block emitted
# (per schema: no obs, no convention). See notes in the discharge block.
# Bands are plain numbers read via `direction` (see VALIDATION_CONVENTION_SCHEMA.md).

