template_version: "3.5"

identity:
  model_id: "AquaCrop"
  scientific_reference_version: "FAO AquaCrop 7.1 (Reference Manual lineage; Chapter 3 algorithmic spec)"
  implementation:
    id: "aquacrop-ospy"
    version: "3.0.12"
    provenance: "Python; AquaCrop-OSPy (Foster et al. 2017) wraps FAO AquaCrop 7.1 numerics in a pure-Python in-memory engine."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "Apache-2.0 (AquaCrop-OSPy GitHub repo LICENSE file; PyPI metadata lists MIT — discrepancy noted); BSD-3-Clause for upstream KUL-RSDA Fortran release"
  repo_url: "https://github.com/aquacropos/aquacrop"

boundary:
  scope_in:
    - "Yield response of herbaceous crops to water"
    - "Daily soil water balance of the root zone (drainage, runoff, infiltration, capillary rise)"
    - "Soil evaporation (FAO two-stage: energy-limited then falling-rate)"
    - "Crop transpiration with stress modulation (water, aeration, temperature, CO2)"
    - "Green canopy cover dynamics (CGC expansion, CCx plateau, CDC decline)"
    - "GDD-based or calendar-day phenology"
    - "Effective rooting depth expansion"
    - "Biomass accumulation via normalized water productivity WP*"
    - "Harvest-Index-based yield formation with pollination/heat/cold stress adjustments"
    - "Irrigation management (rainfed, SMT, interval, schedule, net, constant)"
    - "Field management (mulches, bunds, curve-number adjustment, runoff inhibition)"
    - "Optional shallow-groundwater coupling (capillary rise, waterlogging aeration stress)"
  scope_out:
    - "Nitrogen, phosphorus, and potassium nutrient cycling (no explicit nutrient dynamics)"
    - "Woody / perennial tree crops"
    - "Pest, disease, and weed biology beyond a relative-cover canopy share"
    - "Explicit salinity / salt balance (omitted in aquacrop-ospy implementation despite reference manual coverage)"
    - "Per-organ source/sink partitioning beyond biomass to HI"
  spatial: "0-D point"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Closure is over the root-zone soil-water reservoir (Precip + Irrigation ~ ET + Runoff + DeepPerc + delta(Storage)) and the cumulative biomass integral B = Sigma(WP* x Tr/ET0). No surface energy-balance closure: ET0 is supplied externally (FAO-56 Penman-Monteith) rather than computed. The aquacrop-ospy implementation drops the reference-manual salinity / salt balance, so salt conservation is NOT enforced in this binding."

inputs:
  forcing:
    - category: "atmospheric"
      name: "Daily minimum air temperature (MinTemp)"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "daily MinTemp at the simulated point"
    - category: "atmospheric"
      name: "Daily maximum air temperature (MaxTemp)"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "daily MaxTemp at the simulated point"
      notes: "Engine requires MaxTemp >= MinTemp on every day."
    - category: "atmospheric"
      name: "Daily precipitation"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "daily total precipitation at the simulated point"
    - category: "atmospheric"
      name: "Reference evapotranspiration (ET0)"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "daily ET0 at the simulated point"
      notes: "AquaCrop does NOT compute ET internally; ET0 must be pre-computed (FAO-56 Penman-Monteith preferred, Hargreaves-Samani if only T available). Values must be > 0."
    - category: "atmospheric"
      name: "Atmospheric CO2 concentration"
      unit: "ppm"
      source_kind: "forcing"
      model_input_format: "annual CO2 value driving the WP* CO2-fertilization multiplier (Crop.fCO2)"
  parameters:
    - category: "crop"
      name: "Tbase (GDD base temperature)"
      unit: "deg C"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "Tupp (GDD upper threshold)"
      unit: "deg C"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "WP* (normalized water productivity)"
      unit: "g/m^2"
      source_kind: "calibrated"
      model_input_format: "crop parameter; conservative across climates after CO2 + ET0 normalization"
    - category: "crop"
      name: "HI0 (reference harvest index)"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "CCx (maximum canopy cover)"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "CGC (canopy growth coefficient)"
      unit: "1/day or 1/GDD"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "CDC (canopy decline coefficient)"
      unit: "1/day or 1/GDD"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "Kc,Tr (basal crop transpiration coefficient at full canopy)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "Stress-response thresholds (p_up1..p_up4 for canopy expansion, stomatal closure, senescence, harvest index)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "crop parameter set"
    - category: "crop"
      name: "Zr,max / Zr,min (maximum and minimum effective rooting depth)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "Plant population density (PlantPop)"
      unit: "plants/ha"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "crop"
      name: "Pollination temperature thresholds (heat / cold)"
      unit: "deg C"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
    - category: "soil"
      name: "Layer wilting-point water content (thWP)"
      unit: "m^3/m^3"
      source_kind: "dataset_lookup"
      model_input_format: "per-layer soil hydraulic parameter; thWP < thFC < thS required"
    - category: "soil"
      name: "Layer field-capacity water content (thFC)"
      unit: "m^3/m^3"
      source_kind: "dataset_lookup"
      model_input_format: "per-layer soil hydraulic parameter"
    - category: "soil"
      name: "Layer saturation water content (thS)"
      unit: "m^3/m^3"
      source_kind: "dataset_lookup"
      model_input_format: "per-layer soil hydraulic parameter"
    - category: "soil"
      name: "Saturated hydraulic conductivity (Ksat)"
      unit: "mm/day"
      source_kind: "dataset_lookup"
      model_input_format: "per-layer soil hydraulic parameter"
    - category: "soil"
      name: "SCS Curve Number (CN)"
      unit: "-"
      source_kind: "default"
      model_input_format: "soil-level runoff parameter (default 61 unless calc_cn enabled)"
    - category: "soil"
      name: "Readily Evaporable Water (REW)"
      unit: "mm"
      source_kind: "default"
      model_input_format: "soil-level Stage-I evaporation depth (default 9 mm)"
  initial_conditions:
    - category: "soil_state"
      name: "Initial soil water content per layer"
      unit: "m^3/m^3 or % TAW or proportion of FC/WP/SAT"
      source_kind: "user_provided"
      model_input_format: "per-layer initial soil water specified as proportion of FC/WP/SAT, absolute volumetric content, or % TAW; layer-wise or depth-wise indexing"
      notes: "If specified-layer count != soil.nLayer, all layers silently default to FC."
    - category: "crop_state"
      name: "Initial canopy cover at germination (CCo)"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "derived from plant population and seedling canopy"
    - category: "crop_state"
      name: "Effective rooting depth at planting (Zn)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "crop parameter"
  boundary_conditions:
    - category: "simulation_control"
      name: "Simulation start / end dates"
      unit: "date"
      source_kind: "user_provided"
      model_input_format: "'YYYY/MM/DD' string (slash separators mandatory)"
    - category: "simulation_control"
      name: "Off-season flag"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "off_season switch; True carries soil moisture across fallow periods, False skips them"
    - category: "management"
      name: "Planting date"
      unit: "MM/DD"
      source_kind: "user_provided"
      model_input_format: "Crop.planting_date"
    - category: "management"
      name: "Irrigation method"
      unit: "enum {Rainfed, SMT, Interval, Schedule, Net, Constant}"
      source_kind: "user_provided"
      model_input_format: "irrigation method enum (rainfed, SMT thresholds per growth stage, fixed interval days, predefined date+depth schedule, net irrigation %TAW target, or constant daily depth)"
    - category: "management"
      name: "Irrigation system efficiency / wetted surface fraction"
      unit: "% / %"
      source_kind: "user_provided"
      model_input_format: "application efficiency (AppEff) and wetted-surface fraction (WetSurf); defaults are 100% (optimistic for drip/sprinkler)"
    - category: "management"
      name: "Field management options (mulches, bunds, curve-number adjustment, runoff inhibition)"
      unit: "mixed"
      source_kind: "user_provided"
      model_input_format: "z_bund supplied in METERS (engine internally multiplies by 1000 to mm); mulches/bunds/sr_inhb/curve-number-adjustment flags"
    - category: "boundary_driver"
      name: "Groundwater table depth (optional)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "time-varying water-table depth time series; sentinel -999 means no water table"

processes:
  modules:
    - name: "RootZoneWaterReservoir"
      role: "integrator"
      brief: "Integrates per-compartment soil water over the current rooting depth to produce stored water Wr, depletion Dr, and Total Available Water TAW (Reference Manual Section 3.1)."
    - name: "StressResponseFunctions"
      role: "process_solver"
      brief: "Linear / convex / logistic Ks shapes that convert depletion, temperature, or fertility deviation into stress coefficients consumed by canopy, transpiration, senescence, and HI (Section 3.2)."
    - name: "GDD_Phenology"
      role: "process_solver"
      brief: "Accumulates growing degree days between Tbase and Tupp, advances growth stages (1-4), and gates germination against top-layer water (Section 3.3)."
    - name: "CanopyCover_CGC_CDC"
      role: "process_solver"
      brief: "Logistic canopy expansion at CGC to plateau CCx, then decline at CDC; emits stressed CC and no-stress CC_ns trajectories (Sections 3.4 and 3.5)."
    - name: "EffectiveRootingDepth"
      role: "process_solver"
      brief: "Expansion of z_root under well-watered, water-stressed, restrictive-horizon, and dry-subsoil regimes, bounded by Zr,max (Section 3.6)."
    - name: "SoilWaterBalance"
      role: "process_solver"
      brief: "Time-depth-grid redistribution: tau-based drainage between compartments, SCS-CN runoff partitioning, Ksat-limited infiltration cascade, and capillary rise from a shallow water table (Section 3.7)."
    - name: "SoilEvaporation_TwoStage"
      role: "process_solver"
      brief: "FAO two-stage scheme: Stage-I energy-limited Es followed by Stage-II falling-rate; Ke adjusted for withered canopy (fwcc), mulches, and partial wetting (Section 3.9)."
    - name: "CropTranspiration"
      role: "process_solver"
      brief: "Tr = Kc,Tr_adj x ET0 with stress coefficients for stomatal closure, aeration, cold stress, and CO2 effect; provides feedback on canopy development (Section 3.10)."
    - name: "BiomassAccumulation_WP"
      role: "process_solver"
      brief: "Daily biomass increment B += WP*_adj x (Tr/ET0), with WP*_adj reflecting reproductive-phase WPy reduction and the per-crop CO2 multiplier fCO2 (Section 3.11)."
    - name: "HarvestIndex_Adjusted"
      role: "process_solver"
      brief: "Builds reference HIo over time and applies adjustments for inadequate photosynthesis, pre-anthesis water stress, pollination heat/cold failure, post-anthesis water stress, and combined temperature/water stress to obtain harvest_index_adj (Section 3.12)."
    - name: "Yield_DryFresh"
      role: "allocator"
      brief: "DryYield = biomass x harvest_index_adj; FreshYield = DryYield / (YldWC/100); YieldPot = biomass_ns x harvest_index (reported in t/ha)."
    - name: "IrrigationManagementSolver"
      role: "process_solver"
      brief: "Selects daily irrigation depth from one of six methods (rainfed, SMT thresholds per growth stage, fixed interval, predefined schedule, net irrigation to %TAW, constant depth) and enforces MaxIrr / MaxIrrSeason / AppEff."
    - name: "FieldManagement"
      role: "optional_module"
      brief: "Modifies SCS-CN runoff partitioning, infiltration / surface storage (bunds), and soil evaporation (mulches) based on user-supplied FieldMngt; default is no-op."
      applicability: "active when any FieldMngt option is set (default: inactive)"
    - name: "GroundWaterTable"
      role: "optional_module"
      brief: "Time-varying water table depth z_gw; recomputes per-compartment th_fc_Adj daily, drives capillary rise into the root zone, and triggers aeration stress when the table reaches the surface (Section 3.7.6)."
      applicability: "active when GroundWater(water_table='Y'); otherwise z_gw stays at sentinel -999"
  internal_edges:
    - from: "Inputs"
      to: "SoilWaterBalance"
      kind: "consumes_input"
      brief: "Daily precipitation and irrigation supply flow into the time-depth grid for runoff / infiltration partitioning."
    - from: "Inputs"
      to: "CropTranspiration"
      kind: "consumes_input"
      brief: "Reference ET0 sets the upper bound on potential transpiration; Tmin/Tmax drive cold-stress Ks."
    - from: "Inputs"
      to: "SoilEvaporation_TwoStage"
      kind: "consumes_input"
      brief: "ET0 sets the upper bound on potential soil evaporation EsPot."
    - from: "Inputs"
      to: "GDD_Phenology"
      kind: "consumes_input"
      brief: "Daily Tmin/Tmax drive GDD accumulation between Tbase and Tupp."
    - from: "Inputs"
      to: "BiomassAccumulation_WP"
      kind: "consumes_input"
      brief: "Annual CO2 concentration enters the per-crop fCO2 multiplier applied to WP*."
    - from: "Inputs"
      to: "HarvestIndex_Adjusted"
      kind: "consumes_input"
      brief: "Daily Tmax/Tmin drive pollination heat- and cold-stress coefficients."
    - from: "SoilWaterBalance"
      to: "Wr"
      kind: "writes_state"
      brief: "Drainage, infiltration, capillary rise, runoff updates per-compartment th and the root-zone integral Wr."
    - from: "RootZoneWaterReservoir"
      to: "Wr"
      kind: "writes_state"
      brief: "Recomputes Wr, Dr, and TAW each day by integrating th over the current rooting depth."
    - from: "RootZoneWaterReservoir"
      to: "StressResponseFunctions"
      kind: "produces_output"
      brief: "Root-zone depletion Dr feeds the water-stress Ks shapes (Section 3.2.2)."
    - from: "StressResponseFunctions"
      to: "CanopyCover_CGC_CDC"
      kind: "invokes"
      brief: "Water-stress Ks for canopy expansion and senescence modulates CGC and triggers early senescence."
    - from: "StressResponseFunctions"
      to: "CropTranspiration"
      kind: "invokes"
      brief: "Stomatal-closure Ks scales potential transpiration down to actual Tr."
    - from: "StressResponseFunctions"
      to: "HarvestIndex_Adjusted"
      kind: "invokes"
      brief: "Stress Ks for pre- and post-anthesis water stress reduce harvest_index_adj."
    - from: "GDD_Phenology"
      to: "CanopyCover_CGC_CDC"
      kind: "produces_output"
      brief: "Cumulative GDD drives CGC/CDC switching and senescence onset in GDD calendar mode."
    - from: "GDD_Phenology"
      to: "EffectiveRootingDepth"
      kind: "produces_output"
      brief: "Cumulative GDD drives the rooting-depth expansion curve."
    - from: "GDD_Phenology"
      to: "HarvestIndex_Adjusted"
      kind: "produces_output"
      brief: "Cumulative GDD advances HIstart and the yield-formation window."
    - from: "EffectiveRootingDepth"
      to: "RootZoneWaterReservoir"
      kind: "writes_state"
      brief: "Expanding z_root extends the depth over which soil water and depletion are integrated."
    - from: "CanopyCover_CGC_CDC"
      to: "CropTranspiration"
      kind: "produces_output"
      brief: "Canopy cover sets the upper bound on basal Kc,Tr and intercepts the soil-evaporation share."
    - from: "CanopyCover_CGC_CDC"
      to: "SoilEvaporation_TwoStage"
      kind: "produces_output"
      brief: "CC and CCx_w enter the fwcc canopy-shelter reduction term for Es."
    - from: "CropTranspiration"
      to: "Wr"
      kind: "writes_state"
      brief: "Tr withdraws water from root-zone compartments weighted by root density."
    - from: "CropTranspiration"
      to: "BiomassAccumulation_WP"
      kind: "produces_output"
      brief: "Daily Tr/ET0 multiplied by WP*_adj is the biomass increment."
    - from: "CropTranspiration"
      to: "CanopyCover_CGC_CDC"
      kind: "invokes"
      brief: "Sustained low Tr/TrPot triggers early senescence feedback on canopy (Section 3.10.8)."
    - from: "SoilEvaporation_TwoStage"
      to: "Wr"
      kind: "writes_state"
      brief: "Es removes water from upper compartments and updates Stage-I / Stage-II bookkeeping."
    - from: "BiomassAccumulation_WP"
      to: "HarvestIndex_Adjusted"
      kind: "produces_output"
      brief: "Cumulative biomass interacts with HI build-up over the yield-formation window."
    - from: "BiomassAccumulation_WP"
      to: "Yield_DryFresh"
      kind: "produces_output"
      brief: "Final biomass multiplied by harvest_index_adj produces DryYield."
    - from: "HarvestIndex_Adjusted"
      to: "Yield_DryFresh"
      kind: "produces_output"
      brief: "harvest_index_adj sets the achievable yield fraction of biomass."
    - from: "RootZoneWaterReservoir"
      to: "IrrigationManagementSolver"
      kind: "produces_output"
      brief: "TAW and root-zone depletion Dr drive SMT and Net-irrigation decisions."
    - from: "IrrigationManagementSolver"
      to: "SoilWaterBalance"
      kind: "produces_output"
      brief: "Irrigation depth (with AppEff applied) is added to infiltration; WetSurf changes the evaporative wetted fraction."
    - from: "IrrigationManagementSolver"
      to: "SoilEvaporation_TwoStage"
      kind: "produces_output"
      brief: "WetSurf changes the effective Ke wetted-surface fraction used in soil evaporation."
    - from: "FieldManagement"
      to: "SoilWaterBalance"
      kind: "invokes"
      brief: "Bunds, sr_inhb, and curve-number adjustment alter runoff partitioning and surface storage."
    - from: "FieldManagement"
      to: "SoilEvaporation_TwoStage"
      kind: "invokes"
      brief: "Mulches reduce Es via the mulch_pct / f_mulch factors."
    - from: "GroundWaterTable"
      to: "SoilWaterBalance"
      kind: "consumes_input"
      brief: "z_gw drives capillary-rise flux and updates per-compartment th_fc_Adj."
    - from: "GroundWaterTable"
      to: "CropTranspiration"
      kind: "invokes"
      brief: "Persistent saturation triggers aeration-stress Ks after crop.LagAer days."
    - from: "Yield_DryFresh"
      to: "Outputs"
      kind: "produces_output"
      brief: "DryYield, FreshYield, and YieldPot are emitted to final_stats."

