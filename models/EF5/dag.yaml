states:
  variables:
    - name: "CREST_SM"
      unit: "mm"
      role: "prognostic"
    - name: "SAC_UZTWC"
      unit: "mm"
      role: "prognostic"
    - name: "SAC_UZFWC"
      unit: "mm"
      role: "prognostic"
    - name: "SAC_LZTWC"
      unit: "mm"
      role: "prognostic"
    - name: "SAC_LZFSC"
      unit: "mm"
      role: "prognostic"
    - name: "SAC_LZFPC"
      unit: "mm"
      role: "prognostic"
    - name: "SAC_ADIMC"
      unit: "mm"
      role: "prognostic"
    - name: "HYMOD_XHuz"
      unit: "mm"
      role: "prognostic"
      notes: "Upper-zone storage height. Kept in memory only; no HyMOD state grid is saved or restored."
    - name: "HYMOD_XCuz"
      unit: "mm"
      role: "prognostic"
      notes: "Upper-zone storage contents. Kept in memory only."
    - name: "HYMOD_Xs"
      unit: "mm"
      role: "prognostic"
      notes: "Slow-flow reservoir. Kept in memory only."
    - name: "HYMOD_Xq"
      unit: "mm"
      role: "prognostic"
      notes: "Quick-flow reservoirs in series, one per NQ. Kept in memory only."
    - name: "fastFlow"
      unit: "mm/s"
      role: "diagnostic"
      notes: "Water-balance to routing rate buffer, zeroed by KW each step; not a saved state."
    - name: "slowFlow"
      unit: "mm/s"
      role: "diagnostic"
      notes: "Water-balance to routing rate buffer, zeroed by KW each step; not a saved state."
    - name: "KW_PQ"
      unit: "m3/s (channel) or m2/s (hillslope unit flow)"
      role: "prognostic"
    - name: "KW_PO"
      unit: "m2/s"
      role: "prognostic"
      notes: "Unit inferred from the hillslope unit-flow form; the source does not state it."
    - name: "KW_IR"
      unit: "mm/s-scaled store"
      role: "prognostic"
      notes: "Rate-scaled, not a depth: each step the code adds the water-balance rate (mm/s) to this store and releases a LEAK fraction of it per step as a rate, with no time-step conversion (KinematicRoute.cpp:246-250, 419; LinearRoute.cpp:78-99, 162-165). Saved and restored as kwr_IR state grids in the same units, so a saved state is only valid for the same time step."
    - name: "LR_reservoirs"
      unit: "mm/s-scaled store"
      role: "prognostic"
      notes: "Same rate-scaled convention as KW_IR (LinearRoute.cpp:78-99). Never saved."
    - name: "SNOW17_WI"
      unit: "mm"
      role: "prognostic"
    - name: "SNOW17_WQ"
      unit: "mm"
      role: "prognostic"
    - name: "SNOW17_ATI"
      unit: "degC"
      role: "prognostic"
    - name: "SNOW17_DEFICIT"
      unit: "mm"
      role: "prognostic"
    - name: "discharge"
      unit: "m3/s"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "discharge"
    unit: "m3/s"
    description: "Routed discharge at the gauge cell each step (channel cells: routed channel Q; hillslope cells: overland plus pending interflow)."
    emitted_in: "ts.<gauge>.<model>.csv (Discharge column)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "NSE"
          caveats:
            - "Score only after the warm-up end time."
            - "The gauge must snap to the right cell (basin area, FAM self-count switch); a tributary cell gives a different hydrograph."
            - "Flash-flood peaks need hourly or finer steps; daily means hide peak timing."
            - "With linear-reservoir routing this source copy leaves discharge at 0."
            - "At a gauge on a hillslope (non-channel) cell, interflow is under-counted about 3600x (hazard kw_hillslope_interflow_conversion); snap gauges to channel cells."
            - "With HyMOD (lumped) the Discharge value comes from a different code path, see hazard hymod_lumped_mode; treat it as unverified."
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "CSI"
          caveats:
            - "Events defined by a flow threshold or return period at the gauge."
      detrending_options: ["none"]
  - var: "discharge_grid"
    unit: "m3/s"
    description: "Gridded routed river/channel water discharge per cell (and run-maximum discharge)."
    emitted_in: "q.<time>.<model>.tif, maxq.<time>.tif"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "R"
          caveats:
            - "Gridded Q is rounded to 0.1 m3/s before writing."
            - "Only cells draining to a gauge with parameters are simulated."
            - "maxq.<time>.tif is the maximum over the run, not one point in time; compare it with an observed peak field, not a single-time snapshot."
      detrending_options: ["none"]
  - var: "unit_discharge_grid"
    unit: "m3/s per km2"
    description: "Gridded unit river/channel water discharge per cell: Q divided by the cell's upstream contributing area (km2), rounded to 0.1, and its run maximum."
    emitted_in: "unitq.<time>.<model>.tif, maxunitq.<time>.tif"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "R"
          caveats:
            - "Units are m3/s per km2, not m3/s; multiply by contributing area before comparing with discharge."
            - "Rounding to 0.1 m3/s/km2 hides small values in large basins."
            - "maxunitq.<time>.tif is the run maximum, not one point in time."
      detrending_options: ["none"]
  - var: "soil_moisture"
    unit: "% (CREST: of WM; SAC-SMA: of upper-zone capacity)"
    description: "Relative soil water saturation of the water-balance store. The gauge-file SM column is the area-weighted average over all cells draining to the gauge; the sm grid is per cell."
    emitted_in: "ts.<gauge>.<model>.csv (SM column); sm.<time>.<model>.tif"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match"]
          determining_metric: "R"
          caveats:
            - "Percent of a conceptual store, not volumetric soil water at a fixed depth; compare pattern or anomaly, not magnitude."
            - "magnitude_accuracy deliberately omitted: SM is % of WM (CREST) or of upper-zone capacity (SAC-SMA), not volumetric water content."
            - "SAC-SMA value covers the upper zone only."
            - "HP always writes 100; HyMOD (lumped mode) writes no SM value at all. SM is not usable with those models."
        - obs_shape: "spatial_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "spatial_pattern_match"]
          determining_metric: "R"
          caveats:
            - "Satellite soil moisture is a thin surface layer; the CREST store is the whole conceptual soil column."
      detrending_options: ["none", "linear_residual"]
  - var: "swe"
    unit: "mm"
    description: "Snow water equivalent from Snow-17. The gauge-file SWE column is the area-weighted average over all cells draining to the gauge; the swe grid is per cell."
    emitted_in: "ts.<gauge>.<model>.csv (SWE column); swe.<time>.<model>.tif"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "NSE"
          caveats:
            - "Only when Snow-17 is on and the water balance is distributed (not HyMOD, which skips Snow-17)."
            - "Grid-cell SWE vs point station is a scale mismatch in complex terrain."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "R"
          caveats:
            - "Snow-cover masks compare presence (SWE > 0), not depth."
      detrending_options: ["none"]
  - var: "inundation_depth"
    unit: "m"
    description: "Water depth above ground from discharge: rating relation (simple inundation) or volume fill of upslope cells (VC inundation). Computed only when depth grids are requested as gridded output."
    emitted_in: "depth.<time>.simpleinundation.tif or depth.<time>.vcinundation.tif (suffix is the inundation module name, not the water-balance model)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["event_detection", "spatial_pattern_match"]
          determining_metric: "CSI"
          caveats:
            - "Only when an inundation module is on."
            - "Not a hydraulic solution; compare wet/dry extent (depth > 0) rather than depth magnitude."
      detrending_options: ["none"]
  - var: "return_period"
    unit: "years"
    description: "Return period of the current river water discharge from LP3 statistic grids."
    emitted_in: "ts.<gauge>.<model>.csv (Return Period column); rp.<time>.<model>.tif, maxrp.<time>.tif"
    observability:
      comparable_obs_shapes:
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "CSI"
          caveats:
            - "Only when RP_AVGGRID, RP_STDGRID and RP_CSGRID are set and load (grids made by an earlier SIMU_RP run); SIMU_RP alone writes the LP3 grids, not return periods. The LP3 fit needs a long enough simulated record."
            - "Compare against flood reports or threshold exceedances, not raw values."
      detrending_options: ["none"]
  - var: "fast_flow"
    unit: "mm/s x 1000"
    description: "Overland (fast) runoff water generated by the water balance this step, area-weighted average over all cells draining to the gauge (taken before routing). The file header says 'mm*1000' but the value is the routing input rate. With linear-reservoir routing the buffer also carries water routed in from upstream cells in the previous step (LinearRoute.cpp:62-67), so the value is not only this step's locally generated runoff; do not add it to a water budget as new runoff."
    emitted_in: "ts.<gauge>.<model>.csv (Fast Flow column)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "PBIAS"
          caveats:
            - "Only against quickflow separated from observed discharge; the separation method dominates the result."
            - "Units are a basin-average rate in mm/s x 1000, not m3/s; convert before comparing."
            - "Written only by the distributed models (CREST, SAC-SMA, HP); HyMOD lumped rows have no Fast Flow value."
      detrending_options: ["none"]
  - var: "slow_flow"
    unit: "mm/s x 1000"
    description: "Interflow / ground (slow) subsurface runoff water generated by the water balance this step, area-weighted average over all cells draining to the gauge (taken before routing). The file header says 'mm*1000' but the value is the routing input rate. With linear-reservoir routing the buffer also carries water routed in from upstream cells in the previous step (LinearRoute.cpp:62-67), so the value is not only this step's locally generated runoff; do not add it to a water budget as new runoff."
    emitted_in: "ts.<gauge>.<model>.csv (Slow Flow column)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "PBIAS"
          caveats:
            - "Only against baseflow separated from observed discharge; the separation method dominates the result."
            - "Units are a basin-average rate in mm/s x 1000, not m3/s; convert before comparing with separated baseflow."
            - "Written only by the distributed models (CREST, SAC-SMA, HP); HyMOD lumped rows have no Slow Flow value."
      detrending_options: ["none"]

influence:
  _caveat: "No Sobol/Morris/FAST study of the EF5 C++ code exists. The only ranked results are from CREST-iMAP (Li 2021, 2022), a separate code with the same CREST water balance, and they come from abstracts only because the full texts could not be fetched (403). The mapping antecedent soil moisture -> IWU and Ksat -> FC is an assumption. HydroAgent (arXiv 2605.17792, preprint) is qualitative. No sensitivity literature exists for EF5's SAC-SMA, HyMOD, HP, Snow-17 or linear-reservoir parameters (COEM, RIVER, LEAKO, TH, ISO, ISU), so missing edges for those modules mean no evidence, not low sensitivity."
  edges:
    - from: "CREST IWU (initial / antecedent soil water)"
      to: "discharge"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "CREST water balance"
      citations: ["li2021_crest_imap_sensitivity", "li2022_crest_imap_reinfiltration"]
      notes: "Rank 1 (antecedent soil moisture) in the CREST-iMAP abstract; Hurricane Harvey abstract names it a main driver. Mapping to EF5 IWU is assumed."
    - from: "CREST FC (saturated hydraulic conductivity)"
      to: "discharge"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "CREST water balance"
      citations: ["li2022_crest_imap_reinfiltration"]
      notes: "Ksat named with antecedent soil moisture as a main driver of performance differences (CREST-iMAP abstract). Mapping Ksat -> FC is assumed."
    - from: "CREST land-surface characteristics (exact parameters not checked; assumed WM, B, IM)"
      to: "discharge"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "CREST water balance"
      citations: ["li2021_crest_imap_sensitivity"]
      notes: "Rank 2 in the CREST-iMAP abstract; parameter mapping assumed from abstract wording. Separate evidence for the same parameter group as the HydroAgent WM, B, IM edge below."
    - from: "CREST WM, B, IM (rainfall-runoff split)"
      to: "event peak discharge"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "CREST + kinematic wave"
      citations: ["li2026_hydroagent_ef5_crest_calibration"]
      notes: "Qualitative only, no index ('dominate event-peak magnitude'). Separate evidence for the same parameter group as the CREST-iMAP land-surface edge above."
    - from: "CREST FC, KW UNDER, KW LEAKI"
      to: "discharge recession limb and low-flow tail"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "CREST + kinematic wave"
      citations: ["li2026_hydroagent_ef5_crest_calibration"]
      notes: "Qualitative only, no index ('jointly shape the recession limb and the long tail')."
    - from: "KW ALPHA, BETA, ALPHA0"
      to: "discharge time-to-peak and peak attenuation"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "kinematic wave routing"
      citations: ["li2026_hydroagent_ef5_crest_calibration", "vergara2016_kw_alpha_beta_regionalization"]
      notes: "Sensitivity claim rests on li2026 only; vergara2016 cited for the a-priori alpha/beta parameter source."
    - from: "CREST KE, IWU"
      to: "long-term runoff volume (discharge bias)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "CREST water balance"
      citations: ["li2026_hydroagent_ef5_crest_calibration"]
      notes: "Qualitative only, no index ('primarily shift the long-term water balance and antecedent state')."
    - from: "precipitation forcing (radar QPE quality)"
      to: "discharge skill in mountain basins"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "uncalibrated CONUS runs with a-priori parameters, mountain basins"
      citations: ["flamig2020_ef5_gmd"]
      notes: "Attribution of skill loss in an uncalibrated run, not a sensitivity experiment; the snow part of that attribution reflects Snow-17 being off in that case study."
  citation_index:
    li2021_crest_imap_sensitivity:
      short_citation: "Li et al. 2021"
      doi: "10.1016/j.envsoft.2021.105051"
      note: "CREST-iMAP v1.0 (same CREST water balance, separate code); parameter sensitivity ranks antecedent soil moisture first, land-surface characteristics second (abstract only)."
    li2022_crest_imap_reinfiltration:
      short_citation: "Li et al. 2022"
      doi: "10.1016/j.envsoft.2022.105450"
      note: "CREST-iMAP v1.1 re-infiltration, Hurricane Harvey; Ksat and antecedent soil moisture drive performance differences (abstract only)."
    li2026_hydroagent_ef5_crest_calibration:
      short_citation: "Li et al. 2026 (arXiv 2605.17792, preprint)"
      note: "Calibrates EF5 CREST + kinematic wave; describes which parameter groups control peak, recession and volume; no sensitivity index."
    vergara2016_kw_alpha_beta_regionalization:
      short_citation: "Vergara et al. 2016"
      doi: "10.1016/j.jhydrol.2016.06.011"
      note: "A-priori EF5 kinematic-wave alpha/beta from regionalization across CONUS; parameter estimation, no sensitivity index."
    flamig2020_ef5_gmd:
      short_citation: "Flamig, Vergara & Gourley 2020"
      doi: "10.5194/gmd-13-4943-2020"
      note: "EF5 v1.2 description and uncalibrated CONUS case study; weaker skill in mountains linked to radar QPE and snow."

safety:
  hazards:
    - id: "precip_unit_rescale_silent"
      kind: "weather_file_semantic"
      description: "Precipitation is rescaled to mm/h by the time part of the declared UNIT only; mm/3h or mm/d values declared as mm/h inflate rain 3x-24x and give extreme floods with no error, and a length unit other than mm (m/h, cm/h) is ignored, so such values are used as if they were mm (dt_001)."
      severity: "silent"
    - id: "pet_unit_rescale_silent"
      kind: "weather_file_semantic"
      description: "Monthly PET declared as mm/h is about 720x too high; all water evaporates and flow is near zero (dt_002)."
      severity: "silent"
    - id: "temperature_kelvin_breaks_snow17"
      kind: "weather_file_semantic"
      description: "Temperature must be degC; Kelvin input means no snow (all rain above 1 degC) or broken melt, and wrong Hamon PET (dt_004)."
      severity: "silent"
    - id: "missing_forcing_assumed_zero"
      kind: "weather_file_semantic"
      description: "A missing forcing file for a step is logged and replaced by zeros (precip, PET, temperature); the run completes with zero-rain output. Date tokens in file names finer than the forcing FREQ stay literal, so every file can be missed (dt_009, dt_030_daily_forcing_name_hhuu_silent_zeros)."
      severity: "silent"
    - id: "timestep_month_vs_minute"
      kind: "control_semantic"
      description: "Time unit 'm' is month and 'u' is minute; TIMESTEP=5m runs 5-month steps (dt_003)."
      severity: "silent"
    - id: "ddm_coding_mismatch"
      kind: "control_semantic"
      description: "DDM coding switch (ESRI 1-128 vs TauDEM 1-8) not matching the grid routes water to the wrong neighbour cells (dt_007)."
      severity: "silent"
    - id: "fam_selfcount_gauge_snap"
      kind: "control_semantic"
      description: "FAM self-count switch not matching the FAM minimum (0 vs 1) can snap a gauge to a tributary cell (dt_010)."
      severity: "silent"
    - id: "gauge_outside_domain_skipped"
      kind: "control_semantic"
      description: "A gauge with swapped LAT/LON or a location outside the DEM extent does not land in the domain and is silently skipped, so its output is empty (dt_008)."
      severity: "silent"
    - id: "grid_origin_corner_vs_center"
      kind: "control_semantic"
      description: "EF5 always reads the raster origin as a cell corner (GeoTIFF tiepoint = upper-left corner; ESRI ASCII xll/yll = lower-left corner, label not checked); cell-centre (PixelIsPoint / xllcenter) grids shift every node by half a cell."
      severity: "silent"
    - id: "grid_dimension_mismatch_crash"
      kind: "control_semantic"
      description: "DEM, DDM, FAM and forcing grids with different size, origin or cell size cause out-of-bounds access and a crash (dt_016)."
      severity: "fatal"
    - id: "dem_in_feet"
      kind: "soil_semantic"
      description: "DEM in feet makes slopes 3.28x too steep and routing too fast; flat cells get a forced 1 m drop (dt_011)."
      severity: "silent"
    - id: "crest_im_grid_scalar_scaling"
      kind: "coefficient_runtime_silent_fallback"
      description: "Scalar IM is divided by 100, but a gridded IM is scalar x grid with no /100 and grid zeros set to 0.01; wrong scaling gives no impervious effect or fully impervious cells (dt_005)."
      severity: "silent"
    - id: "param_grid_zero_to_001"
      kind: "coefficient_runtime_silent_fallback"
      description: "Any zero cell in a parameter grid is replaced by 0.01 before multiplying the scalar (CREST, HP, KW, LR, Snow-17, simple and VC inundation; SAC-SMA does not do this)."
      severity: "silent"
    - id: "param_nodata_not_checked"
      kind: "coefficient_runtime_silent_fallback"
      description: "Parameter grid NoData values are not checked and are used as real numbers (all modules except SAC-SMA, which skips NoData cells)."
      severity: "silent"
    - id: "crest_negative_param_fallbacks"
      kind: "coefficient_runtime_silent_fallback"
      description: "Negative CREST WM, B, FC fall back silently to 100 mm, 1.0, 1.0 (B NaN to 0.0); negative KW ALPHA/ALPHA0 become 1.0 and BETA 0.6."
      severity: "silent"
    - id: "kw_alpha_zero_no_flow"
      kind: "coefficient_runtime_silent_fallback"
      description: "KW ALPHA = 0 removes the channel storage term, so flood waves pass with no attenuation (too fast and too peaky), not zero flow; NaN or NoData values in routing parameter grids are not checked and can give NaN flow (dt_014)."
      severity: "degraded"
    - id: "channel_threshold_extremes"
      kind: "coefficient_runtime_silent_fallback"
      description: "TH too low makes every cell a channel; TH larger than the basin FAM gives no channel cells, changing routing and inundation (dt_015)."
      severity: "degraded"
    - id: "sac_grid_multiplier_partial"
      kind: "coefficient_runtime_silent_fallback"
      description: "SAC-SMA parameter grids are applied only to the first six parameters (loop bound uses the CREST count), and initial stores use ungridded capacities."
      severity: "silent"
    - id: "sac_initial_store_fraction_vs_mm"
      kind: "initial_condition_semantic"
      description: "SAC-SMA initial UZTWC, UZFWC, LZTWC, LZFSC and LZFPC are multiplied by their capacities in code (fractions), while the manual gives them in mm; mm values give starting stores far above capacity with no error."
      severity: "silent"
    - id: "crest_initial_sm_exceeds_wm"
      kind: "initial_condition_semantic"
      description: "IWU high or very low WM cells can give initial soil water above WM, with startup warnings and possible instability (dt_020)."
      severity: "warning"
    - id: "lr_state_not_saved"
      kind: "initial_condition_semantic"
      description: "Linear-reservoir routing states are never saved or restored; warm starts reset them to ISO/ISU."
      severity: "degraded"
    - id: "kw_newton_nonconvergence"
      kind: "numerical_instability"
      description: "Kinematic-wave Newton solver stops after 10 iterations or residual < 0.01 with no warning if it has not converged."
      severity: "silent"
    - id: "timestep_too_large_routing"
      kind: "numerical_instability"
      description: "Too large a time step for the cell size causes routing oscillations."
      severity: "degraded"
    - id: "lr_routing_no_discharge"
      kind: "control_semantic"
      description: "In this source copy linear-reservoir routing never writes the discharge vector, so discharge outputs stay 0 with routing = linear reservoir."
      severity: "silent"
    - id: "no_routing_zero_discharge"
      kind: "control_semantic"
      description: "With no routing model chosen, generated runoff is zeroed and discharge stays 0."
      severity: "silent"
    - id: "kw_hillslope_interflow_conversion"
      kind: "control_semantic"
      description: "On hillslope (non-channel) cells, KW discharge adds incoming interflow as rate x area_km2 / 3.6, the factor for mm/h, while the interflow store is mm/s-scaled (KinematicRoute.cpp:163-166, 246-250); interflow reaching a hillslope cell is under-counted by about 3600x in that cell's discharge (gauges snapped to hillslope cells and gridded Q there). Engine defect in this source; channel cells are not affected."
      severity: "silent"
    - id: "hymod_lumped_mode"
      kind: "control_semantic"
      description: "HyMOD is lumped (IsLumped() = true): the routing model, Snow-17, inundation, return period and all gridded outputs are skipped with no warning, even if they are configured. Gauge CSV rows hold only Time, Discharge, Observed, Precip, PET although the header lists SM, Fast Flow, Slow Flow. Lumped discharge is (quick + slow outflow, mm per step) x area / 3.6, which is m3/s only for 1-hour steps, and it indexes the per-gauge flow vectors and the cell area by the gauge's grid-cell index, so the value is not trustworthy until checked on a real run."
      severity: "silent"
    - id: "snow17_seasonal_phase"
      kind: "numerical_instability"
      description: "Snow-17 seasonal melt factor uses sin((jday - 81*2*pi)/366) instead of the usual (jday-81)*2*pi/366, shifting the seasonal melt-factor cycle."
      severity: "silent"
    - id: "ts_nan_column_shift"
      kind: "parser_semantic"
      description: "When simulated discharge is not finite, the gauge series writes the observed value in the Discharge column and 'nan' in the Observed column."
      severity: "silent"
  validation_limits:
    - "No groundwater aquifer, reservoir or dam operation: baseflow-dominated or regulated basins are outside the model's design."
    - "Kinematic wave ignores acceleration and backwater; tidal, flat or backwater-affected reaches are not resolved."
    - "Snow-17 is temperature-index with a fixed 1 degC rain/snow threshold; snow-dominated mountain basins showed weak skill in the uncalibrated CONUS case study."
    - "Inundation is a rating-relation depth, not a hydraulic flood solution."
    - "Data assimilation works only with kinematic-wave routing."
    - "Cells that drain to no gauge get no parameters and are not simulated."
    - "Flash-flood peaks need sub-hourly to hourly steps; daily steps cannot resolve them."
  warnings:
    - "Parameters are set per independent gauge and copied upstream; a scalar plus a grid means scalar x grid, not a replacement."
    - "Hillslope kinematic wave always uses beta = 0.6; the BETA parameter affects channel cells only."
    - "Soil moisture output is percent of a conceptual store (SAC-SMA: upper zone only), not volumetric water content."
    - "PET derived from temperature depends on cell latitude from the chosen projection."
    - "When Snow-17 is on, the water balance sees rain+melt, not raw precipitation."
    - "CREST WM outside about 20-1000 mm or IM above about 30% gives a flat or a flashy hydrograph (dt_012, dt_013)."
  assumptions:
    - statement: "Run order per step is snow, then water balance, then routing, then inundation / return period."
      scope: "process ordering"
      source: "Simulator.cpp step loop in github.com/HyDROSLab/EF5"
      status: "adopted"
    - statement: "Kinematic wave assumes gravity and friction balance with acceleration terms neglected."
      scope: "KinematicWaveRouting"
      source: "EF5 manual (manual.html, Routing Models - Kinematic Wave)"
      status: "adopted"
    - statement: "IM handling follows source: scalar-only IM is percent (/100); gridded IM is scalar x grid; result clamped 0-1."
      scope: "CREST IM"
      source: "CRESTModel.cpp parameter initialisation"
      status: "adopted"
    - statement: "SAC-SMA initial stores UZTWC, UZFWC, LZTWC, LZFSC and LZFPC are fractions of capacity and ADIMC is a depth in mm, following the code rather than the manual's mm."
      scope: "SAC-SMA initial conditions"
      source: "SAC.cpp InitializeParameters in github.com/HyDROSLab/EF5; EF5 manual SAC-SMA section"
      status: "adopted"
    - statement: "HP is a no-store pass-through that splits precipitation into fast and slow flow by SPLIT, not strictly 100% surface runoff."
      scope: "HP water balance"
      source: "HPModel.cpp; EF5 manual HP section"
      status: "tentative"
    - statement: "This dag describes the EF5 1.2.x C++ code; CREST-iMAP sensitivity results are used only as cross-family evidence."
      scope: "influence block"
      source: "doi:10.5194/gmd-13-4943-2020; doi:10.1016/j.envsoft.2021.105051"
      status: "adopted"
    - statement: "Linear-reservoir routing is treated as not producing discharge in this source copy until a real run shows otherwise."
      scope: "LinearReservoirRouting"
      source: "LinearRoute.cpp Route() in github.com/HyDROSLab/EF5"
      status: "under_review"
    - statement: "HyMOD runs lumped per gauge with no external routing, snow or grid output; its discharge formula is treated as unverified until a real run checks it."
      scope: "HyMOD lumped mode"
      source: "HyMOD.h IsLumped(); Simulator.cpp lumped set-up (rModel = NULL) and SimulateLumped(), in github.com/HyDROSLab/EF5"
      status: "under_review"
