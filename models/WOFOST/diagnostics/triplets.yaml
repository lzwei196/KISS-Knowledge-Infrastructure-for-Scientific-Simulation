- id: dt_faostat_obs_shape
  symptom:
    description: WOFOST-vs-FAOSTAT-national run reports raw NSE/r/KGE as the headline and the pre-retry
      gate rejects the comparison as REJECT_WRONG_METRIC, OR the run loops retrying cultivar/forcing swaps
      trying to lift a structurally-negative raw NSE.
  diagnosis:
    root_cause: A point or few-point WOFOST sim compared to a FAOSTAT NATIONAL yield series is the obs_shape
      regional_aggregate_time_series (dag.yaml outputs.TWSO.observability). The ONLY valid metric_families
      are [trend_match, magnitude_accuracy]. Raw inter-annual NSE/r/KGE are temporal_pattern_match metrics,
      INVALID here -- the national aggregate is spatially smoothed, partly irrigated, and rides a multi-decade
      technology trend a fixed-parameter weather-driven model cannot reproduce, so raw NSE/KGE are structurally
      very negative and raw r is low regardless of model quality. Swapping cultivar/forcing/parameters
      cannot rescue a structurally invalid measurement.
  remedy:
    action: Run tools/s8_yield_analysis/validate_against_faostat.py SIM_CSV CROP COUNTRY OUT_JSON [UNITS].
      It classifies obs_shape=regional_aggregate_time_series and reports magnitude_accuracy (pbias, decadal_mean_pbias,
      mean_abs_pct_err) plus trend_match (detrended r, first-difference r, trend-slope ratio) as the verdict,
      with raw NSE/r/KGE relegated to invalid_for_obs_shape. Report obs_shape in the run JSON so the gate
      uses the right family. Reference PASS for USA maize PP 1991-2023 -- pbias +6.6 pct, decadal +3.4
      pct, detrended r 0.506, first-diff r 0.611.
  added_by_run: WOFOST_real_case_20260608_obs_shape
  verified: '2026-06-08'
- id: dt_v007
  stage: s2_soil_params
  failure_domain: silent_error
  symptom:
    description: 'WLP/WLP_CWB runs are more water-stressed than they should be: low LAI, low transpiration,
      depressed yield, and simulated soil moisture (0.07-0.11) that cannot be matched to any observed
      SM product. No error is raised; validate_soil_params.py passes.'
  diagnosis:
    root_cause: 'convert_hwsd_to_pcse_soil.py::pedotransfer_wosten() is documented as ''Wosten et al.
      (1999)'' but implements three ad-hoc linear forms, not Wosten''s van Genuchten regressions. Output
      is biased low across the texture triangle: WP and FC ~0.4-0.6x published values, PAW 0.53-0.97x
      depending on texture. The tool already imports ki_tools_common.soil_utils.lookup_hwsd, which RETURNS
      result[''hydraulics''], and discards them, keeping only the raw texture. validate_soil_params.py
      cannot catch it because it only checks ordering (SMW < SMFCF < SM0) and a porosity ceiling — all
      of which hold at half scale.'
  remedy:
    action: 'FIRST map lookup_hwsd''s returned hydraulics onto SMW/SMFCF/SM0 (wilting_point/field_capacity/saturation)
      and correct the citation — measured effect on C01 rainfed yield: +10.5%/+42.1%/0% across three seasons.
      SEPARATELY and non-blocking, upgrade the canonical function itself (worth a further 3-5%): it is
      a Rawls 1982 texture-class lookup, not Saxton-Rawls, its om argument is a no-op, and it discards
      measured bulk density; a genuine continuous Saxton-Rawls 2006 already exists in the library (DSSAT
      convert_hwsd_to_sol.py, SWAT+ hwsd_to_swatplus_soil.py). Do NOT fix the om no-op alone: soil_utils.py:269
      passes oc into a parameter named om (1.724x), so making om live would silently split EPIC from lookup_hwsd.
      Add a range check against texture class to validate_soil_params.py — ordering checks cannot detect
      a uniform bias. PP runs are unaffected (no water balance); WLP runs and anything derived from SMW/SMFCF
      (e.g. irrigation triggers) must be re-run.'
  severity: critical
- id: dt_017
  stage: s3_weather_prep
  failure_domain: input_format
  symptom:
    description: 'A PCSE weather CSV made from VIC forcing files will not load (ValueError: malformed
      node or string), or it loads after a hand fix and holds the wrong variable in a column. An old
      note or script calls tools/s3_weather_prep/convert_vic_to_pcse_weather.py, which is no longer
      in the KI.'
    error_pattern: malformed node or string|convert_vic_to_pcse_weather
    detection_method: log_match
  diagnosis:
    root_cause: 'The KI used to make WOFOST weather out of another model''s input (VIC forcing files
      + the VIC basin_grid.nc). That tool read the columns as PREC TMAX TMIN WIND SW LW VP PRESS, which
      is not the column order of this server''s VIC forcing files, and it wrote a header with unquoted
      text and trailing comments ("Country = VIC_grid_cell", "Longitude = -93.5; decimal degrees"), DAY
      as YYYY-MM-DD and SNOWDEPTH -999. pcse 6.0.12 runs ast.literal_eval on each header value and stops
      on the first unquoted word (checked 2026-10-03 with a file in that header style).'
    explanation: 'Owner rule 2026-10-02: a model KI builds its input straight from the data source with
      its own tool; it must not turn another model''s input files into its own. The tool was moved to
      models/WOFOST/_removed_vic_input_tools_20261002/ on 2026-10-03. It is not to be restored.

      '
    affected_components:
    - s3_weather_prep
    - CSVWeatherDataProvider
  remedy:
    action: Build the weather file from the data source with build_pcse_weather_from_source (--source
      cmfd|mswx|nasa_power). Do not read VIC forcing files for WOFOST.
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - 'python tools/s3_weather_prep/build_pcse_weather_from_source.py --source <cmfd|mswx|nasa_power>
      --lat <lat> --lon <lon> --elev <m> --start_year <y0> --end_year <y1> [--forcing_dir <dir>] --output
      weather_pcse_<lat>_<lon>.csv'
    - Read <output>.summary.json and check annual rain and mean temperature for the site.
    - Load it with CSVWeatherDataProvider (run_wofost_simulation does this).
    prevention: Weather for WOFOST comes only from build_pcse_weather_from_source (products) or create_csv_weather_file
      (your own station table). Both write the file through write_pcse_csv.
  severity: fatal
  cross_references:
  - dt_018
  - dt_021
  verified: '2026-10-03'
- id: dt_018
  stage: s3_weather_prep
  failure_domain: protocol_gap
