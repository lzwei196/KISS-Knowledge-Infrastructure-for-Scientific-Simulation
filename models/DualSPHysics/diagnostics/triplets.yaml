# ============================================================================
# DualSPHysics Diagnostic Triplets
# ============================================================================
# 18 diagnostic triplets covering 5 failure domains.
# Generated during DualSPHysics knowledge dissection for HydroCraft platform.
# ============================================================================

# --- Unit Conversion (HIGHEST PRIORITY — Silent Errors) ---

- id: dt_001
  stage: s1_case_definition
  failure_domain: unit_conversion
  symptom:
    description: "Billions of particles generated by GenCase. System runs out of memory."
    error_pattern: "bad_alloc|out of memory|Cannot allocate"
    detection_method: particle_count_check
  diagnosis:
    root_cause: "dp specified in mm instead of meters (e.g., dp=10 meaning 10mm, but interpreted as 10m)"
    explanation: >
      DualSPHysics expects dp in meters. If dp is given in mm (e.g., 5mm as 0.005 is correct,
      but if user writes 5 meaning mm), the particle count changes by dp^-3. A 1m^3 domain with
      dp=0.001m (1mm) produces 10^9 particles — certain OOM. Conversely dp=5 (5m) for a 1m domain
      produces zero particles.
    affected_components: [generate_case_xml, gencase]
  remedy:
    action: "Verify dp is in meters. Typical values: 0.001-0.1m"
    tool_to_run: generate_case_xml
    manual_steps:
      - "Check dp value in XML — should be 0.001-0.1 for typical cases"
      - "Estimate particle count: N = Volume / dp^3"
      - "If N > 10M, consider increasing dp"
    prevention: "validate_inputs() checks dp range and warns if outside 0.0005-0.5m"
  severity: critical
  cross_references: [dt_002]

- id: dt_002
  stage: s1_case_definition
  failure_domain: unit_conversion
  symptom:
    description: "Pressure values are 1000x too high or too low. Density oscillations."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "rhop0 in g/cm^3 (1.0) instead of kg/m^3 (1000)"
    explanation: >
      DualSPHysics expects density in kg/m^3. Water is 1000 kg/m^3, not 1.0.
      If rhop0=1.0 is used, the equation of state computes wrong pressure
      (P = B * ((rho/rhop0)^gamma - 1)), and the speed of sound is wrong.
      Particles will either explode outward or collapse inward.
    affected_components: [convert_parameters, constantsdef]
  remedy:
    action: "Use rhop0=1000 for fresh water, 1025 for seawater"
    tool_to_run: convert_parameters
    manual_steps:
      - "Check rhop0 in XML constantsdef — must be in kg/m^3"
      - "Fresh water: 998-1000, Seawater: 1025, Oil: 800-920"
    prevention: "validate_inputs() warns if rhop0 < 10 (likely g/cm^3)"
  severity: critical
  cross_references: [dt_001]

- id: dt_003
  stage: s1_case_definition
  failure_domain: unit_conversion
  symptom:
    description: "Fluid is extremely viscous (moves like honey) or has zero viscosity (inviscid chaos)."
    error_pattern: ""
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Visco value doesn't match ViscoTreatment type"
    explanation: >
      Artificial viscosity (ViscoTreatment=1) uses a dimensionless coefficient (0.01-0.1).
      Laminar viscosity (ViscoTreatment=2,3) uses kinematic viscosity in m^2/s (~1e-6 for water).
      If you switch from artificial to laminar without changing Visco from 0.01 to 1e-6,
      the viscosity is 10,000x too high. The fluid will barely move.
    affected_components: [convert_parameters, execution_parameters]
  remedy:
    action: "Match Visco value to treatment: 0.01-0.1 for artificial, ~1e-6 for laminar"
    tool_to_run: convert_parameters
    manual_steps:
      - "Check ViscoTreatment and Visco in XML"
      - "Artificial (1): Visco = 0.01-0.1 (dimensionless)"
      - "Laminar+SPS (2): Visco = 1e-6 m^2/s (water at 20C)"
      - "Laminar (3): Visco = 1e-6 m^2/s"
    prevention: "convert_parameters.py auto-selects correct viscosity for known fluids"
  severity: silent
  cross_references: []

- id: dt_004
  stage: s3_forcing_setup
  failure_domain: unit_conversion
  symptom:
    description: "Waves are invisible (too small) or cause immediate instability (too large)."
    error_pattern: ""
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Wave height in cm instead of meters"
    explanation: >
      DualSPHysics expects wave height in meters. Significant wave height Hs=1.5m is typical
      for coastal waves. If input is Hs=150 (cm) but interpreted as 150m, the simulation
      explodes. If Hs=0.015 (already in meters but treated as cm/100), waves are invisible.
    affected_components: [convert_forcing_to_dsph, wavepaddles]
  remedy:
    action: "Ensure all wave heights are in meters"
    tool_to_run: convert_forcing_to_dsph
    manual_steps:
      - "Check wave height values — typical ocean: 0.5-5m, lab: 0.01-0.3m"
      - "If values are 50-500, they are likely in cm — divide by 100"
    prevention: "convert_forcing_to_dsph validates wave height range"
  severity: high
  cross_references: [dt_005]

- id: dt_005
  stage: s3_forcing_setup
  failure_domain: unit_conversion
  symptom:
    description: "Inlet velocity is orders of magnitude wrong. Flow is barely moving or supersonic."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Velocity in cm/s or knots instead of m/s"
    explanation: >
      DualSPHysics expects velocity in m/s. A current of 1 m/s is typical for rivers.
      If input is 100 cm/s entered as 100 m/s, the flow is supersonic for the artificial
      speed of sound, causing massive instability. If 1 knot entered as 1 m/s, it's
      approximately correct but 2x too fast.
    affected_components: [convert_forcing_to_dsph, inout]
  remedy:
    action: "Convert all velocities to m/s before input"
    tool_to_run: convert_forcing_to_dsph
    manual_steps:
      - "cm/s -> m/s: divide by 100"
      - "knots -> m/s: multiply by 0.5144"
      - "km/h -> m/s: divide by 3.6"
      - "ft/s -> m/s: multiply by 0.3048"
    prevention: "convert_forcing_to_dsph --vel_unit flag handles conversion"
  severity: high
  cross_references: [dt_004]

# --- Numerical Stability ---

- id: dt_006
  stage: s4_execution
  failure_domain: numerical_stability
  symptom:
    description: "Simulation produces NaN values. Particles fly to infinity. Immediate crash."
    error_pattern: "nan|NaN|inf|exception"
    detection_method: runtime_check
  diagnosis:
    root_cause: "CFL number too large or coefsound too small"
    explanation: >
      The timestep dt = CFL * h / (c + v_max). If CFL is too large (>0.5) or
      coefsound is too small (<10), the timestep exceeds stability limits.
      Particles move further than one kernel support per step, breaking
      the neighbor search and causing NaN propagation.
    affected_components: [execution_parameters, constantsdef]
  remedy:
    action: "Reduce CFL to 0.1-0.2, increase coefsound to 15-20"
    tool_to_run: convert_parameters
    manual_steps:
      - "Set cflnumber to 0.2 (default)"
      - "Set coefsound to 20 (default)"
      - "If still unstable, try cfl=0.1"
    prevention: "Default values are stable for most cases"
  severity: critical
  cross_references: [dt_007]

- id: dt_007
  stage: s4_execution
  failure_domain: numerical_stability
  symptom:
    description: "Pressure field is very noisy. Density fluctuations > 1%. Unphysical oscillations."
    error_pattern: ""
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Density Diffusion Term (DDT) not enabled"
    explanation: >
      Weakly compressible SPH is prone to pressure noise without DDT.
      DensityDT=0 (None) is the default but produces noisy pressure.
      DDT modes 2 or 3 (Fourtakas) correct density errors and smooth
      the pressure field without excessive dissipation.
    affected_components: [execution_parameters]
  remedy:
    action: "Enable DDT mode 2 with DDTvalue=0.1"
    tool_to_run: convert_parameters
    manual_steps:
      - "Set DensityDT=2 in XML parameters"
      - "Set DensityDTvalue=0.1"
      - "For mDBC boundaries, use mode 3 (full)"
    prevention: "convert_parameters sets DDT=2 by default"
  severity: medium
  cross_references: [dt_006]

- id: dt_008
  stage: s4_execution
  failure_domain: numerical_stability
  symptom:
    description: "Many particles are excluded. PartsOutMax exceeded. Simulation terminates early."
    error_pattern: "PartsOutMax|particles excluded"
    detection_method: runtime_check
  diagnosis:
    root_cause: "RhopOutMin/Max too tight, or genuine instability"
    explanation: >
      Particles with density outside [RhopOutMin, RhopOutMax] are removed.
      Default is 700-1300 kg/m^3. If the simulation has density fluctuations
      (e.g., near boundaries with DBC), many particles get excluded. If >100%
      of fluid is excluded, the simulation stops.
    affected_components: [execution_parameters]
  remedy:
    action: "Widen RhopOut range or fix underlying instability"
    tool_to_run: convert_parameters
    manual_steps:
      - "Try RhopOutMin=500, RhopOutMax=1500"
      - "If still losing particles, check boundary completeness"
      - "Enable DDT, reduce CFL, switch to mDBC"
    prevention: "Monitor excluded particle count in RUN.out"
  severity: high
  cross_references: [dt_006, dt_007]

# --- Geometry and Boundary ---

- id: dt_009
  stage: s2_case_generation
  failure_domain: geometry
  symptom:
    description: "Particles leak through walls. Fluid escapes the domain."
    error_pattern: ""
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Gaps in boundary particle layer"
    explanation: >
      Boundary particles must form a continuous layer at least 2*dp thick.
      If boxfill is missing a face (e.g., 'bottom|left|right' without 'front|back'),
      there's a gap where fluid can escape. Also occurs if geometry commands
      create intersecting regions that cancel out.
    affected_components: [case_definition, geometry]
  remedy:
    action: "Add missing boundary faces, visualize initial particles"
    tool_to_run: generate_case_xml
    manual_steps:
      - "Check boxfill includes all needed faces"
      - "Visualize GenCase VTK output in ParaView"
      - "Look for gaps in boundary particle layer"
    prevention: "Always use -save:all with GenCase to check VTK"
  severity: high
  cross_references: []

- id: dt_010
  stage: s1_case_definition
  failure_domain: geometry
  symptom:
    description: "GenCase produces zero particles or unexpected counts."
    error_pattern: "Total particles: 0|Fluid particles: 0"
    detection_method: stdout_check
  diagnosis:
    root_cause: "Geometry extends outside pointmin/pointmax domain"
    explanation: >
      GenCase only creates particles within the box defined by pointmin and pointmax
      in the geometry definition. If the fluid or boundary geometry extends beyond
      these limits, particles are clipped. If entirely outside, zero particles.
    affected_components: [case_definition, geometry]
  remedy:
    action: "Expand pointmin/pointmax to encompass all geometry plus margin"
    tool_to_run: generate_case_xml
    manual_steps:
      - "Check that pointmin is smaller than all geometry points"
      - "Check that pointmax is larger than all geometry points + sizes"
      - "Add margin of 5*dp on each side"
    prevention: "generate_case_xml.py auto-calculates domain from geometry"
  severity: high
  cross_references: [dt_009]

- id: dt_011
  stage: s1_case_definition
  failure_domain: geometry
  symptom:
    description: "Unphysical pressure gap between fluid and boundary. DBC artifact."
    error_pattern: ""
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Using DBC instead of mDBC for quantitative pressure"
    explanation: >
      Dynamic Boundary Condition (DBC) creates an artificial gap between fluid
      and boundary particles where pressure is not accurately computed. For
      quantitative pressure measurements near walls, mDBC (Modified DBC)
      is required. DBC gives qualitatively correct flow but wrong wall pressure.
    affected_components: [execution_parameters]
  remedy:
    action: "Switch to mDBC boundary condition"
    tool_to_run: convert_parameters
    manual_steps:
      - "Set Boundary=2 in XML or use -mdbc CLI flag"
      - "For no-slip: -mdbc_noslip"
      - "For free-slip: -mdbc_freeslip"
    prevention: "Use mDBC for any case requiring pressure accuracy near walls"
  severity: medium
  cross_references: []

# --- Configuration Errors ---

- id: dt_012
  stage: s4_execution
  failure_domain: configuration
  symptom:
    description: "Solver exits immediately with 'file not found' error."
    error_pattern: "file.*not found|Cannot open|No such file"
    detection_method: runtime_check
  diagnosis:
    root_cause: "Case.bi4 file path incorrect or GenCase was not run"
    explanation: >
      DualSPHysics requires the bi4 file from GenCase as first argument.
      Common errors: wrong path, forgetting to run GenCase first, or
      the XML name not matching the GenCase output name.
    affected_components: [run_dualsphysics]
  remedy:
    action: "Verify GenCase was run and bi4 file exists at specified path"
    tool_to_run: run_dualsphysics
    manual_steps:
      - "Check that GenCase completed successfully"
      - "Verify bi4 file exists: ls output/CaseName.bi4"
      - "Make sure path matches solver argument"
    prevention: "run_dualsphysics.py checks file existence before running"
  severity: critical
  cross_references: []

- id: dt_013
  stage: s4_execution
  failure_domain: configuration
  symptom:
    description: "Solver crashes with shared library error on startup."
    error_pattern: "libChronoEngine|libdsphchrono|GLIBC|cannot open shared"
    detection_method: runtime_check
  diagnosis:
    root_cause: "LD_LIBRARY_PATH not set to bin/linux directory"
    explanation: >
      DualSPHysics uses shared libraries (libChronoEngine.so, libdsphchrono.so).
      These must be discoverable via LD_LIBRARY_PATH. Without this, the binary
      fails at startup even before reading any input.
    affected_components: [run_dualsphysics]
  remedy:
    action: "Export LD_LIBRARY_PATH to include bin/linux"
    tool_to_run: run_dualsphysics
    manual_steps:
      - "export LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:/path/to/bin/linux"
      - "Or copy .so files to /usr/local/lib and run ldconfig"
    prevention: "run_dualsphysics.py auto-sets LD_LIBRARY_PATH"
  severity: critical
  cross_references: []

- id: dt_014
  stage: s4_execution
  failure_domain: configuration
  symptom:
    description: "GPU version fails with CUDA error. Falls back to CPU or crashes."
    error_pattern: "CUDA error|cudaGetDevice|no CUDA-capable device"
    detection_method: runtime_check
  diagnosis:
    root_cause: "CUDA not installed or no compatible GPU"
    explanation: >
      The GPU binary requires CUDA runtime and a compatible NVIDIA GPU.
      If the system has no GPU or wrong CUDA version, the binary crashes.
      The CPU binary works on any system without CUDA.
    affected_components: [run_dualsphysics]
  remedy:
    action: "Use CPU binary (DualSPHysics5.4CPU_linux64) with -cpu flag"
    tool_to_run: run_dualsphysics
    manual_steps:
      - "Check GPU: nvidia-smi"
      - "If no GPU, use CPU binary"
      - "If GPU exists, check CUDA version matches binary"
    prevention: "run_dualsphysics.py falls back to CPU if GPU fails"
  severity: medium
  cross_references: []

# --- Post-Processing ---

- id: dt_015
  stage: s5_output_analysis
  failure_domain: post_processing
  symptom:
    description: "MeasureTool produces zero or NaN values for all measurement points."
    error_pattern: "nan|0.000000"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Measurement points are outside the fluid domain"
    explanation: >
      MeasureTool interpolates particle data at specified points. If points
      are in the boundary region, in air (above free surface), or outside
      the domain entirely, interpolation returns zero or NaN. Points must
      be inside the fluid volume for valid results.
    affected_components: [parse_dsph_output, measuretool]
  remedy:
    action: "Move measurement points inside the fluid domain"
    tool_to_run: parse_dsph_output
    manual_steps:
      - "Visualize particle distribution and point locations"
      - "Ensure points are at least 2*dp from boundaries"
      - "Check points are below the free surface"
    prevention: "Use -kcusedummy:0 -kclimit:0.5 for robust interpolation"
  severity: medium
  cross_references: []

- id: dt_016
  stage: s5_output_analysis
  failure_domain: post_processing
  symptom:
    description: "CSV output from MeasureTool has semicolons, not commas. Pandas read fails."
    error_pattern: "ParserError|unexpected separator"
    detection_method: runtime_check
  diagnosis:
    root_cause: "DualSPHysics default CSV separator is semicolon (;), not comma"
    explanation: >
      DualSPHysics uses semicolon as default CSV separator (configurable via
      DsphConfig.xml or -csvsep flag). Python pandas.read_csv defaults to comma.
      This causes either read failure or all data in one column.
    affected_components: [parse_dsph_output]
  remedy:
    action: "Use sep=';' in pandas.read_csv, or set -csvsep:1 for comma output"
    tool_to_run: parse_dsph_output
    manual_steps:
      - "Open CSV and check separator character"
      - "Use pandas.read_csv(file, sep=';') for semicolon files"
      - "Or re-run tool with -csvsep:1 flag"
    prevention: "parse_dsph_output auto-detects separator"
  severity: low
  cross_references: []

- id: dt_017
  stage: s5_output_analysis
  failure_domain: post_processing
  symptom:
    description: "Pressure values are offset from expected. Hydrostatic component included."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "DualSPHysics pressure includes hydrostatic component"
    explanation: >
      The pressure output from DualSPHysics is total pressure (hydrostatic + dynamic).
      For comparison with pressure transducers or dynamic pressure analysis, the
      hydrostatic component (rho*g*z) must be subtracted. This offset depends on
      the probe depth below the free surface.
    affected_components: [parse_dsph_output, analysis]
  remedy:
    action: "Subtract hydrostatic pressure: P_dynamic = P_total - rho*g*(SWL-z)"
    tool_to_run: parse_dsph_output
    manual_steps:
      - "Get probe depth: h = SWL - z_probe"
      - "Hydrostatic: P_h = rhop0 * g * h"
      - "Dynamic: P_d = P_measured - P_h"
    prevention: "Document whether analysis needs total or dynamic pressure"
  severity: medium
  cross_references: []

- id: dt_018
  stage: s1_case_definition
  failure_domain: numerical_stability
  symptom:
    description: "Simulation is extremely slow. Timestep dt is tiny (< 1e-6 s)."
    error_pattern: ""
    detection_method: performance_check
  diagnosis:
    root_cause: "coefsound set too high, making speed of sound unrealistically large"
    explanation: >
      The timestep is limited by dt = CFL * h / (c + v_max). If coefsound is
      too large (e.g., 100 instead of 20), the speed of sound c is 5x higher,
      making dt 5x smaller. The simulation takes 5x longer with no benefit.
      Default coefsound=20 is usually optimal.
    affected_components: [constantsdef, convert_parameters]
  remedy:
    action: "Reduce coefsound to 10-20"
    tool_to_run: convert_parameters
    manual_steps:
      - "Check coefsound in constantsdef — default is 20"
      - "Values above 30 are rarely needed"
      - "If density fluctuations > 1%, increase coefsound"
      - "If dt is too small, decrease coefsound"
    prevention: "convert_parameters uses coefsound=20 by default"
  severity: medium
  cross_references: [dt_006]
