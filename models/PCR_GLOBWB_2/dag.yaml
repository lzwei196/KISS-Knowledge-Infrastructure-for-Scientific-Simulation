template_version: "3.5"

identity:
  model_id: "PCR_GLOBWB_2"
  scientific_reference_version: "PCR-GLOBWB 2 (Sutanudjaja et al. 2018, GMD 11:2429-2453) — 5 arcmin global hydrology & water resources spec"
  implementation:
    id: "pcr-globwb-2"
    version: "2 (Python 3, develop branch)"
    provenance: "Python with PCRaster Python (DynamicModel/DynamicFramework); Utrecht University UU-Hydro."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "GPL-3.0-or-later"
  repo_url: "https://github.com/UU-Hydro/PCR-GLOBWB_model"

boundary:
  scope_in:
    - "grid-based terrestrial hydrology (snow, interception, two-layer soil moisture, groundwater, runoff)"
    - "river/channel routing along an LDD network including lakes and reservoirs"
    - "integrated human water use (irrigation, domestic, industry, livestock demand, withdrawal, consumption, return flows)"
    - "dynamic floodplain inundation (optional)"
  scope_out:
    - "lateral groundwater flow between cells (single vertical linear reservoir per cell)"
    - "glacier/ice dynamics (snow accumulates indefinitely in polar regions)"
    - "backwater effects (kinematic wave assumes friction slope equals bed slope)"
    - "sector-priority water allocation under scarcity (allocation is proportional to demand)"
    - "sub-daily hydrology and full surface energy-balance closure"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Water-balance closure is enforced per grid cell and timestep over the two soil layers (S1, S2), the groundwater linear reservoir (S3), and channel/water-body storage. Hydrology and water use run on a daily step; kinematic-wave channel routing is internally sub-daily. There is no closed surface energy budget — reference potential ET is supplied (or derived via Hamon from temperature) rather than solved from an energy balance. All depth-based quantities are in meters internally."

inputs:
  forcing:
    - category: "meteorology"
      name: "precipitation"
      unit: "m/day"
      source_kind: "forcing"
      model_input_format: "daily NetCDF variable named exactly 'precipitation'"
      notes: "Model expects m/day; most global datasets ship mm/day (1000x trap, dt_001)."
    - category: "meteorology"
      name: "air temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "daily NetCDF variable named exactly 'temperature'"
      notes: "Celsius required; Kelvin forcing (ERA5/W5E5) silently kills snow and inflates ET (dt_002)."
    - category: "meteorology"
      name: "reference potential evapotranspiration"
      unit: "m/day"
      source_kind: "forcing"
      model_input_format: "daily NetCDF variable named 'referencePotET' (alias 'evapotranspiration')"
      notes: "Required unless referenceETPotMethod=Hamon, which derives refET internally from temperature; m/day expected (mm/day is a 1000x trap, dt_003)."
  parameters:
    - category: "land_cover"
      name: "land cover classification (forest, grassland, irrPaddy, irrNonPaddy)"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "per-cover-type PCRaster maps / NetCDF"
    - category: "soil"
      name: "saturated hydraulic conductivity per layer (KSat1/KSat2)"
      unit: "m/day"
      source_kind: "calibrated"
      model_input_format: "PCRaster maps / NetCDF"
    - category: "soil"
      name: "saturated & residual volumetric water content (satVolWC, resVolWC)"
      unit: "m3/m3"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster maps / NetCDF"
    - category: "soil"
      name: "air entry value and pore-size distribution (airEntryValue, poreSizeBeta)"
      unit: "m, -"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster maps / NetCDF"
    - category: "soil"
      name: "soil storage capacity / depth per layer"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster maps; meters expected (mm saturates soil in one step, dt_004)"
    - category: "topography"
      name: "tangent slope, hillslope length, orographic correction (tanslope, slopeLength, orographyBeta)"
      unit: "-, m, -"
      source_kind: "dataset_lookup"
      model_input_format: "topography NetCDF; zero tanslope zeros interflow (dt_019)"
    - category: "groundwater"
      name: "aquifer conductivity, specific yield, recession coefficient (kSatAquifer, specificYield, recessionCoeff)"
      unit: "m/day, fraction 0-1, day-1"
      source_kind: "calibrated"
      model_input_format: "PCRaster maps; specificYield as fraction not percent (dt_007)"
    - category: "routing"
      name: "Manning's roughness (manningsN)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "PCRaster map / scalar (default 0.04)"
    - category: "routing"
      name: "reservoir characteristics (GRanD) and lake/water-body extents (GLWD)"
      unit: "mixed"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster maps / NetCDF"
  initial_conditions:
    - category: "state"
      name: "snow water equivalent and interception storage"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "NetCDF state files; spin-up convergence used if absent"
    - category: "state"
      name: "upper/lower soil storage (storUpp, storLow)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "NetCDF state files; else spin-up"
    - category: "state"
      name: "groundwater storage (storGroundwater)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "NetCDF state file; zero/low initial store gives zero baseflow (dt_018)"
    - category: "state"
      name: "channel and water-body storage"
      unit: "m3"
      source_kind: "user_provided"
      model_input_format: "NetCDF state files; else spin-up"
  boundary_conditions:
    - category: "domain"
      name: "clone map (resolution and spatial extent)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "PCRaster .map; MUST be local, corners aligned to integer cell multiples (dt_010, dt_011)"
    - category: "domain"
      name: "landmask (area of interest restriction)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "PCRaster .map; None falls back to LDD extent"
    - category: "routing_topology"
      name: "local drainage direction network (LDD, from HydroSHEDS)"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "PCRaster .map defining flow routing topology"
    - category: "control_switch"
      name: "human-influence toggles (includeIrrigation / includeDomestic / includeIndustry / includeLivestock WaterDemand)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "INI flags selecting natural-only vs non-natural run"
    - category: "control_switch"
      name: "soil layering (numberOfUpperSoilLayers: 2 vs 3) and routing method (accuTravelTime vs kinematic wave)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "INI structural selectors"
    - category: "control_switch"
      name: "reference ET method (referenceETPotMethod: input vs Hamon) and dynamicFloodPlain toggle"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "INI selectors; floodplain off gives zero inundation (dt_017)"
    - category: "management"
      name: "water demand by sector (domestic, industry, livestock)"
      unit: "m/day depth"
      source_kind: "user_provided"
      model_input_format: "NetCDF maps; m/day depth not mm/day or m3/day (dt_005)"
    - category: "management"
      name: "irrigation area, irrigation efficiency, desalination supply, pumping capacity"
      unit: "ha, fraction 0-1, m/day, billion m3/year"
      source_kind: "user_provided"
      model_input_format: "NetCDF/maps; missing/zero irrigation area yields no irrigation (dt_016)"

processes:
  modules:
    - name: "meteo"
      role: "process_solver"
      brief: "Reads daily precipitation, temperature and reference potential ET; derives Hamon refET from temperature when selected."
    - name: "landSurface"
      role: "driver"
      brief: "Orchestrates the vertical water balance over the four land-cover types (forest, grassland, irrPaddy, irrNonPaddy) and the soil/topography parameterization."
    - name: "landCover"
      role: "process_solver"
      brief: "Per-cover-type snow (degree-day), interception, evaporation/transpiration, two-layer Improved-Arno soil moisture, infiltration- and saturation-excess runoff, interflow."
    - name: "parameterSoilAndTopo"
      role: "allocator"
      brief: "Supplies soil hydraulic and topographic parameters to the Improved-Arno soil-water scheme."
    - name: "groundwater"
      role: "process_solver"
      brief: "Single linear-reservoir groundwater store (S3): recharge, capillary rise, baseflow recession, abstraction limits; no lateral inter-cell flow."
    - name: "routing"
      role: "process_solver"
      brief: "Channel routing via accumulation, travel-time, or kinematic-wave approximation along the LDD; optional dynamic floodplain inundation."
    - name: "waterBodies"
      role: "process_solver"
      brief: "Lake and reservoir storage dynamics solved within the routing network."
    - name: "waterUse"
      role: "process_solver"
      brief: "Sector water demand (irrigation paddy/non-paddy, domestic, industry, livestock), surface- and groundwater withdrawal allocation, consumption and return flows, coupled to hydrology each timestep."
    - name: "spinUp"
      role: "optional_module"
      brief: "Cyclic spin-up that integrates the model over the period until soil/groundwater/channel/total storage deltas converge, seeding the transient run's initial state."
  internal_edges:
    - from: "Inputs"
      to: "meteo"
      kind: "consumes_input"
      brief: "Daily forcing NetCDF read by the meteo module."
    - from: "meteo"
      to: "landSurface"
      kind: "produces_output"
      brief: "Precipitation, temperature and reference potential ET drive the land-surface balance."
    - from: "parameterSoilAndTopo"
      to: "landCover"
      kind: "produces_output"
      brief: "Soil hydraulic and topographic parameters configure the Improved-Arno scheme."
    - from: "landSurface"
      to: "landCover"
      kind: "invokes"
      brief: "Orchestrator delegates per-cover-type processing for forest/grassland/irrPaddy/irrNonPaddy."
    - from: "landCover"
      to: "groundwater"
      kind: "writes_state"
      brief: "Deep percolation / groundwater recharge from the lower soil store."
    - from: "groundwater"
      to: "landCover"
      kind: "writes_state"
      brief: "Capillary rise returns water to the soil store."
    - from: "landCover"
      to: "routing"
      kind: "produces_output"
      brief: "Direct runoff plus interflow feed the channel."
    - from: "groundwater"
      to: "routing"
      kind: "produces_output"
      brief: "Baseflow contributes to channel discharge."
    - from: "routing"
      to: "waterBodies"
      kind: "invokes"
      brief: "Lake/reservoir storage dynamics solved within routing along the LDD."
    - from: "routing"
      to: "waterUse"
      kind: "reads_state"
      brief: "Surface-water availability read for demand allocation."
    - from: "groundwater"
      to: "waterUse"
      kind: "reads_state"
      brief: "Groundwater availability read for withdrawal allocation."
    - from: "waterUse"
      to: "routing"
      kind: "writes_state"
      brief: "Surface-water withdrawals and return flows update channel storage."
    - from: "waterUse"
      to: "groundwater"
      kind: "writes_state"
      brief: "Groundwater abstraction depletes the groundwater store."
    - from: "spinUp"
      to: "groundwater"
      kind: "reads_state"
      brief: "Cyclic spin-up reads storage state to test area-weighted convergence before the transient run."
    - from: "routing"
      to: "Outputs"
      kind: "produces_output"
      brief: "Discharge and channel storage emitted to NetCDF."
    - from: "landCover"
      to: "Outputs"
      kind: "produces_output"
      brief: "Actual ET, snow water equivalent and soil storage emitted."
    - from: "groundwater"
      to: "Outputs"
      kind: "produces_output"
      brief: "Groundwater storage and recharge emitted."

states:
  variables:
    - name: "snowCoverSWE"
      unit: "m"
      role: "prognostic"
    - name: "interceptionStorage"
      unit: "m"
      role: "prognostic"
    - name: "storUpp (upper soil store S1)"
      unit: "m"
      role: "prognostic"
    - name: "storLow (lower soil store S2)"
      unit: "m"
      role: "prognostic"
    - name: "storGroundwater (groundwater reservoir S3)"
      unit: "m"
      role: "prognostic"
    - name: "channelStorage"
      unit: "m3"
      role: "prognostic"
    - name: "waterBodyStorage (lakes/reservoirs)"
      unit: "m3"
      role: "prognostic"
    - name: "totalWaterStorageThickness"
      unit: "m"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "discharge"
    validation_rank: 1
    unit: "m3/s"
    description: "River channel discharge at each cell."
    emitted_in: "discharge_dailyTot_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Default global run is uncalibrated; gauge-scale skill is modest (median gauge-network correlation ~0.60)."
            - "Cell discharge must be matched to the gauge's contributing cell on the LDD."
      detrending_options: ["none"]
  - var: "totalRunoff"
    validation_rank: 2
    unit: "m/day"
    description: "Total runoff (surface plus subsurface) generated per cell."
    emitted_in: "totalRunoff_dailyTot_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Gridded runoff products carry their own model structure; treat as soft reference."]
      detrending_options: ["none"]
  - var: "actualET"
    validation_rank: 3
    unit: "m/day"
    description: "Actual evapotranspiration — water flux from the land surface to the atmosphere."
    emitted_in: "actualET_monthTot_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Satellite ET products are themselves model-derived; compare patterns and seasonal magnitude."]
      detrending_options: ["none", "linear_residual"]
  - var: "gwRecharge"
    validation_rank: 4
    unit: "m/day"
    description: "Groundwater recharge flux from the lower soil store."
    emitted_in: "gwRecharge_dailyTot_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Direct recharge observations are scarce; usually evaluated against other model/reanalysis estimates."]
      detrending_options: ["none"]
  - var: "storGroundwater"
    validation_rank: 5
    unit: "m"
    description: "Groundwater reservoir storage (S3)."
    emitted_in: "storGroundwater_monthAvg_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Comparison to observed groundwater-head series is via storage anomaly, not absolute head (single linear reservoir, no lateral flow)."]
      detrending_options: ["linear_residual"]
  - var: "totalWaterStorageThickness"
    validation_rank: 6
    unit: "m"
    description: "Total water storage (snow + interception + soil + groundwater + surface water), comparable to satellite total-water-storage-anomaly retrievals."
    emitted_in: "totalWaterStorageThickness_monthAvg_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Satellite TWS products provide total-storage anomalies; compare detrended/de-meaned anomalies, not absolute storage."
            - "Inter-annual anomaly skill is weak and can be negative in some basins (e.g. Amazon, Niger)."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Basin-averaged TWS anomaly; seasonal storage is poorly captured in cold regions."]
      detrending_options: ["linear_residual", "first_difference"]
  - var: "snowCoverSWE"
    validation_rank: 7
    unit: "m"
    description: "Snow water equivalent."
    emitted_in: "snowCoverSWE_dailyTot_output.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Degree-day snow with indefinite polar accumulation; avoid permanent-ice cells."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "precipitation (forcing)"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["spernaweiland2015_uncertainty", "lopezlopez2017_calibration"]
    - from: "saturated hydraulic conductivity (kSat)"
      to: "groundwater storage / head"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "groundwater-coupled basins"
      citations: ["sutanudjaja2014_gwcalibration"]
    - from: "groundwater recession coefficient (recessionCoeff)"
      to: "discharge (baseflow / low flow)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["spernaweiland2015_uncertainty", "sutanudjaja2018_pcrglobwb2"]
    - from: "Manning's roughness coefficient (manningsN)"
      to: "discharge (timing / peak)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["spernaweiland2015_uncertainty", "sutanudjaja2018_pcrglobwb2"]
    - from: "soil storage capacity / depth partitioning"
      to: "discharge"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["spernaweiland2015_uncertainty"]
    - from: "infiltration / preferential-flow partitioning parameter"
      to: "discharge (storm / surface runoff)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["spernaweiland2015_uncertainty"]
    - from: "degree-day snowmelt factor (degreeDayFactor)"
      to: "discharge (snow-influenced timing)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "snow-influenced basins"
      citations: ["sutanudjaja2018_pcrglobwb2", "spernaweiland2015_uncertainty"]
    - from: "crop / vegetation factor"
      to: "evapotranspiration"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["sutanudjaja2018_pcrglobwb2", "lopezlopez2017_calibration"]
    - from: "saturated hydraulic conductivity / soil storage"
      to: "soil moisture"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["sutanudjaja2014_gwcalibration", "lopezlopez2017_calibration"]
  citation_index:
    sutanudjaja2018_pcrglobwb2:
      short_citation: "Sutanudjaja et al. 2018"
      doi: "10.5194/gmd-11-2429-2018"
      note: "Canonical PCR-GLOBWB 2 model-description paper; defines parameterization and which states/fluxes each parameter governs."
    spernaweiland2015_uncertainty:
      short_citation: "Sperna Weiland et al. 2015"
      doi: "10.1016/j.jhydrol.2015.08.061"
      note: "OAT screening of 29 parameters (12 retained as sensitive, >=1% mean-annual-discharge change) + Latin Hypercube parameter uncertainty; precipitation-forcing error dominates discharge uncertainty over all parameters."
    sutanudjaja2014_gwcalibration:
      short_citation: "Sutanudjaja et al. 2014"
      doi: "10.1002/2013WR013807"
      note: "Rhine-Meuse coupled groundwater-land-surface calibration; saturated hydraulic conductivity has the largest impact on simulated groundwater levels."
    lopezlopez2017_calibration:
      short_citation: "López López et al. 2017"
      doi: "10.5194/hess-21-3125-2017"
      note: "Oum Er-Rbia calibration with satellite ET (GLEAM) and soil moisture (ESA CCI); precipitation input affects discharge more than parameter calibration."

safety:
  hazards:
    - id: "precip_mm_not_m_silent_1000x"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in mm/day instead of m/day causes silent 1000x over-input (extreme flooding/runoff) (dt_001)."
      severity: "silent"
    - id: "temperature_kelvin_not_celsius"
      kind: "weather_file_semantic"
      description: "Temperature in Kelvin instead of Celsius silently kills snow accumulation and inflates ET (dt_002)."
      severity: "silent"
    - id: "refet_mm_not_m_silent_1000x"
      kind: "weather_file_semantic"
      description: "Reference ET in mm/day instead of m/day silently over-evaporates 1000x, depleting soil/groundwater (dt_003)."
      severity: "silent"
    - id: "forcing_varname_mismatch_reads_zeros"
      kind: "weather_file_semantic"
      description: "NetCDF forcing variable name not matching exactly (precipitation/temperature/referencePotET) makes the model silently read zeros (dt_009)."
      severity: "silent"
    - id: "soil_depth_mm_not_m"
      kind: "soil_semantic"
      description: "Soil water capacity/depth in mm instead of m saturates soil in one timestep and forces extreme surface runoff (dt_004)."
      severity: "silent"
    - id: "specific_yield_percent_not_fraction"
      kind: "soil_semantic"
      description: "Specific yield given as percent (0-100) instead of fraction (0-1) makes the groundwater store 100x too large (dt_007)."
      severity: "silent"
    - id: "ksataquifer_cmhr_not_mday"
      kind: "soil_semantic"
      description: "kSatAquifer in cm/hr instead of m/day (~0.24x) skews baseflow recession (dt_008)."
      severity: "silent"
    - id: "demand_units_not_mday_depth"
      kind: "control_semantic"
      description: "Water demand / groundwater abstraction in mm/day or m3/day instead of m/day depth (cells ~1e8 m2) over-drains rivers and aquifers (dt_005, dt_006)."
      severity: "silent"
    - id: "clone_corner_misalignment"
      kind: "control_semantic"
      description: "Clone-map corner coordinates not at integer cell-size multiples cause half-cell shift / checkerboard misalignment between forcing and parameters (dt_011)."
      severity: "degraded"
    - id: "non_daily_timestep_fatal"
      kind: "control_semantic"
      description: "timeStep/timeStepUnit not daily triggers fatal 'model runs only on daily time step' error (PCR-GLOBWB 2 is daily-only) (dt_012)."
      severity: "fatal"
    - id: "missing_refet_key_under_hamon"
      kind: "parser_semantic"
      description: "refETPotFileNC key absent from [meteoOptions] crashes the configuration parser even when Hamon ET is selected; must be set (to None) (dt_022)."
      severity: "fatal"
    - id: "zero_baseflow_low_recession_or_zero_init_gw"
      kind: "initial_condition_semantic"
      description: "Recession coefficient below ~1e-6 or zero initial groundwater storage yields permanently zero baseflow until spin-up establishes the store (dt_018)."
      severity: "degraded"
    - id: "zero_tanslope_zeros_interflow"
      kind: "control_semantic"
      description: "Zero or missing topographic slope (tanslope) makes interflow / lateral subsurface flow zero (dt_019)."
      severity: "degraded"
    - id: "missing_irrigation_area_no_use"
      kind: "control_semantic"
      description: "Missing/zero/wrong-unit historicalIrrigationArea yields zero irrigation water use despite includeIrrigation=True (dt_016)."
      severity: "degraded"
    - id: "float32_allocation_reporting_diff"
      kind: "numerical_instability"
      description: "PCRaster float32 precision causes small (<0.1%) differences in surface-water allocation reporting (actSurfaceWaterAbstract vs allocSurfaceWaterAbstract); accept it (dt_020)."
      severity: "warning"
  validation_limits:
    - "Default global run is uncalibrated; calibration is basin-specific."
    - "Validated against 3597 GRDC discharge stations (5 arcmin): median correlation ~0.60; KGE>0.6 in only ~12% of catchments."
    - "Best skill in Europe and North America; poorest in Africa (e.g. Niger River); inter-annual anomaly skill is weak."
    - "GRACE total-storage comparison can be negatively correlated in some basins (Amazon, Niger); seasonal storage poorly resolved in cold regions."
    - "Underestimates groundwater and industrial/domestic withdrawals in non-irrigated areas due to the demand-proportional allocation scheme."
    - "No lateral inter-cell groundwater flow, no glacier dynamics, no backwater effects; daily timestep cannot resolve sub-daily hydrology."
  warnings:
    - "Run spin-up (or supply converged initial-state NetCDFs) before evaluating baseflow; cold-start groundwater gives spuriously low baseflow."
    - "Overly strict spin-up convergence thresholds (minConv*) can prevent convergence and loop indefinitely; loosen them or raise maxSpinUpsInYears."
  assumptions:
    - statement: "All depth-based quantities (precipitation, ET, soil storage, demand, abstraction) are expressed in meters."
      scope: "all forcing, soil, and water-use inputs/outputs"
      source: "Sutanudjaja et al. 2018 (GMD 11:2429) model description and PCR-GLOBWB unit conventions"
      status: "adopted"
    - statement: "Kinematic-wave routing assumes friction slope equals bed slope, so backwater effects are not represented."
      scope: "channel routing"
      source: "Sutanudjaja et al. 2018 (GMD 11:2429), routing section / limitations"
      status: "adopted"
    - statement: "Groundwater is a single vertical linear reservoir per cell with no lateral inter-cell flow."
      scope: "groundwater module (S3)"
      source: "Sutanudjaja et al. 2018 (GMD 11:2429), groundwater description"
      status: "adopted"
    - statement: "No glacier/ice dynamics; snow accumulates indefinitely in polar/permanent-ice regions."
      scope: "snow / land-cover module"
      source: "Sutanudjaja et al. 2018 (GMD 11:2429), discussion / limitations"
      status: "adopted"
    - statement: "Water allocation is proportional to demand and does not encode sector priorities under scarcity."
      scope: "water-use / demand module"
      source: "Sutanudjaja et al. 2018 (GMD 11:2429), water-use description"
      status: "adopted"
    - statement: "Mass-balance closure holds per cell over the two soil layers, groundwater reservoir, and channel/water-body storage; there is no surface energy-balance closure (reference potential ET is prescribed or Hamon-derived)."
      scope: "whole-model water balance"
      source: "Sutanudjaja et al. 2018 (GMD 11:2429), model overview"
      status: "adopted"
