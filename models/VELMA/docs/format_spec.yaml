# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: VELMA
  language: java
  implementation:
    id: epa-velma-2.1-java
    version: VELMA_2.1.1.0 (JVelma.jar, gov.epa.velmasimulator.VelmaSimulatorCmdLine)
    provenance: 'Official EPA release VELMA2.1-PROGRAM-MAR2022.ZIP (EPA Science Inventory deid=354355);
      launcher KISSPATH_HOME/engine_builds_20261006/VELMA/run_velma_headless.sh (java -Djava.awt.headless=true
      -cp jars/JVelma.jar gov.epa.velmasimulator.VelmaSimulatorCmdLine); build log KISSPATH_HOME/engine_builds_20261006/VELMA/BUILD_LOG.md.
      Official BlueRiver_Example (HJA WS10, 1969-2008) reproduced through tools/run_velma_engine.py: engine
      NSE 0.7954119608437563, DailyResults.csv byte-identical to the build-log run.'
    run_tool: tools/run_velma_engine.py
    surrogate:
      id: velma-python-4layer
      tool: tools/run_velma.py
      contract: docs/surrogate_velma_4layer_dag.yaml
      status: SURROGATE - not EPA VELMA; never report its output as VELMA
  scientific_reference_version: EPA VELMA 2.1 (JVelma.jar VELMA_2.1.1.0, EPA VELMA2.1-PROGRAM-MAR2022);
    process science per the VELMA 2.0 User Manual (McKane et al., US EPA 2014), its 2.1 supplement (MAR2022)
    and Abdelnour et al. 2011 (WRR, doi:10.1029/2010WR010165), 2013 (WRR, doi:10.1029/2012WR012994)
inputs:
  forcing:
  - name: precipitation
    unit: mm/d
    category: forcing
    source_kind: forcing
    model_input_format: 'DefaultWeatherModel rainDriverDataFileName (and VelmaInputs input_rain): text
      file, one value per line, no header, exactly one line per day from forcing_start-01-01; built by
      tools/build_velma_weather_from_source.py'
    notes: 'Applied uniformly to every cell of the delineated watershed; the snow model splits it into
      rain and snow. Never fill or invent days: the builder stops on a missing day, and run_velma_engine.py
      refuses a file with fewer rows than forcing_start..eyear or values outside 0..1000 mm/day.'
  - name: air temperature
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: 'DefaultWeatherModel airTemperatureDriverDataFileName (and VelmaInputs input_at):
      daily mean air temperature, one value per line, no header, one line per day from forcing_start-01-01'
    notes: Degrees Celsius, NOT Kelvin (the Kelvin JSON of convert_forcing_to_velma.py belongs to the
      surrogate only). run_velma_engine.py refuses values outside -60..50.
  parameters:
  - name: simulation configuration (VELMA xml)
    unit: per key (mm, mm/day, fractions, degC, gC/m2, gN/m2)
    category: parameters
    source_kind: user_provided
    model_input_format: <configuration>.xml (groups startups, calibration, cover, disturbance, soil, weather,
      cellDataWriter); read by VelmaSimulatorCmdLine; every change is passed as --kv=/group/props/key,value
      and the xml is never edited
    notes: The KI runs an existing configuration (the EPA BlueRiver_Example for HJA WS10). A VELMA 2.0
      configuration needs the 2.1 humus migration (dt_velma_025), which run_velma_engine.py does by default.
  - name: digital elevation model (input_dem) and grid geometry (cell, ncol, nrow, outx, outy)
    unit: m
    category: parameters
    source_kind: dataset_lookup
    model_input_format: flat-processed ESRI ASCII grid named by VelmaInputs input_dem; cell size `cell`
      (m); outlet cell outx/outy
    notes: Must be flat-processed (JPDEM) before the run. The outlet cell defines the delineated watershed
      whose average every DailyResults.csv column reports.
  - name: soil parameters per soil type (/soil/<name>) and soil map
    unit: surfaceKs mm/d; decay factors 1/mm; porosityFraction, fieldCapacity, wiltPoint m3/m3; soilColumnDepth
      mm; initialHumusCarbon gC/m2
    category: parameters
    source_kind: calibrated
    model_input_format: xml /soil/<name>/<key> (surfaceKs, ksLateralExponentialDecayFactor, ksVerticalExponentialDecayFactor,
      porosityFraction, fieldCapacity, wiltPoint, soilColumnDepth, setSoilLayerWeights or setSoilLayerThicknesses,
      humusCtoN, initialHumusCarbon, humusNmaxDecay, nitrification keys); map soilParametersIndexMapFileName
      (ASCII grid of soil ids)
    notes: In VELMA 2.1 humusCtoN, initialHumusCarbon and humusNmaxDecay are SOIL keys; humusCtoN = 0
      gives NaN on day 1 (run_velma_engine.py refuses it).
  - name: cover parameters per cover type (/cover/<name>) with cover and age maps
    unit: per key (PET coefficients, gC/m2 pools, C:N ratios, day-of-year)
    category: parameters
    source_kind: calibrated
    model_input_format: xml /cover/<name>/<key> (petParam1, petParam2, temperaturePetOff, noTranspirationPetFraction,
      initial biomass/detritus pools, C:N ratios, mortality and uptake keys); maps coverSpeciesIndexMapFileName
      and coverAgeMapFileName
  - name: snow model parameters (snowFormationTemperature, snowMeltTemperature, snowMeltRate, rainOnSnowEffect)
    unit: degC, degC, mm/degC/d, fraction
    category: parameters
    source_kind: calibrated
    model_input_format: xml /weather/DefaultWeatherModel/<key>
    notes: Below snowFormationTemperature all of the day's precipitation is snow; above snowMeltTemperature
      melt = snowMeltRate x (airT - snowMeltTemperature) + rainOnSnowEffect x rain (VELMA 2.0 User Manual
      sec. 6).
  initial_conditions:
  - name: start state spatial maps (spin-up end state)
    unit: per map (mm, m3/m3, gC/m2, gN/m2)
    category: initial_conditions
    source_kind: derived
    model_input_format: folder of .asc state maps given by /startups/VelmaStartups.properties/setStartStateSpatialDataLocationName
      (run_velma_engine.py --start-state-dir), written by an earlier run's setEndStateSpatialDataLocationName
      (--end-state-dir)
    notes: Without a start state the run starts from the xml initial values (soil water starts at porosity).
      Use a spin-up run that carries the site history (e.g. the 1975 WS10 clearcut) and discard the first
      year after any change of weather source.
  boundary_conditions:
  - name: simulation and forcing years (syear, eyear, forcing_start, forcing_end)
    unit: year
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: xml /calibration/VelmaInputs.properties/<key> or run_velma_engine.py --syear/--eyear/--forcing-start
    notes: Driver row 1 is forcing_start-01-01; syear must be >= forcing_start.
  - name: observed runoff for the engine's own Nash-Sutcliffe (input_runoff)
    unit: mm/d
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: one value per line from forcing_start-01-01 (run_velma_engine.py --observed-runoff);
      used only for NashSutcliffeCoefficients.txt
    notes: Read BY ROW from forcing_start; cut the file when forcing_start moves (dt_velma_028). It does
      not change the simulation.
  - name: disturbance schedule (/disturbance/<name>)
    unit: year / day-of-year / fractions
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: xml disturbance blocks, e.g. HarvestLsrDisturbanceModel with initializeActiveYears,
      initializeActiveJdays and harvest fractions
outputs:
  primary:
  - name: Q_sim_m3s
    unit: m3/s
    description: Daily outlet discharge = Runoff_All(mm/day)_Delineated_Average x area / 86400 s, written
      by run_velma_engine.py; area = --area-km2 (pass the gauged drainage area when comparing with a gauge)
      or else the engine's delineated area.
    validation_rank: 1
    emitted_in: <output-root>/<run_index>/velma_daily_runoff.csv (column Q_sim_m3s), from the engine's
      DailyResults.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Score only after spin-up, and drop at least the first year after a change of weather source
          (e.g. station weather -> MSWX).
        - 'Use the same area on both sides (gauged area); the delineated area can differ (WS10: 14.58
          ha delineated vs 10.2 ha gauged, dt_velma_030).'
        - A single outlet hydrograph; interior gauges need a cell or reach output (CellDataWriter, ReachFlowResults.csv).
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-instant comparison only meaningful for peak/low-flow magnitude checks.
      detrending_options:
      - none
  - name: mean_runoff_mm_d
    unit: mm/d
    description: Daily outlet runoff depth averaged over the delineated watershed (Runoff_All(mm/day)_Delineated_Average);
      the series the engine itself compares with input_runoff.
    validation_rank: 2
    emitted_in: DailyResults.csv column Runoff_All(mm/day)_Delineated_Average; velma_daily_runoff.csv
      column runoff_mm_d
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Compare with observed runoff depth over the same watershed (gauge discharge / gauged area).
      detrending_options:
      - none
  - name: mean_et_mm_d
    unit: mm/d
    description: Daily actual evapotranspiration averaged over the delineated watershed (ET(mm/day)_Delineated_Average);
      PET is in PET(mm/day)_Delineated_Average.
    validation_rank: 3
    emitted_in: DailyResults.csv column ET(mm/day)_Delineated_Average
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Hamon PET is temperature based; expect bias against flux-tower ET where radiation or humidity
          controls ET.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Watershed average; compare only with watershed-aggregated ET products.
      detrending_options:
      - none
  - name: final_sw_mm[4]
    unit: m3/m3
    description: Soil water of layers 1-4 averaged over the delineated watershed (Soil_Moisture(mm)_Delineated_Average_Layer_1..4).
      The values are a volumetric FRACTION despite the '(mm)' header; mm = fraction x layer thickness
      (dt_velma_029). The name is kept for the validation convention.
    validation_rank: 4
    emitted_in: DailyResults.csv columns Soil_Moisture(mm)_Delineated_Average_Layer_1..4 (daily; the last
      row is the end state)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Watershed-average layer water; only loosely comparable to point soil-moisture probes, and only
          as a volumetric fraction.
      detrending_options:
      - none
  - name: final_swe_mm
    unit: mm
    description: 'Snow store (mm of water) averaged over the delineated watershed (Snow_Depth(mm)_Delineated_Average):
      the snow model adds the day''s snow precipitation and removes melt (VELMA 2.0 User Manual sec. 6).'
    validation_rank: 5
    emitted_in: DailyResults.csv column Snow_Depth(mm)_Delineated_Average (daily; the last row is the
      end state)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Temperature-index snow with weather uniform over the watershed; no elevation lapse in the DefaultWeatherModel.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_velma_001
  symptom: '[SURROGATE + REAL engine drivers] Simulated streamflow is near zero for the entire simulation
    period. Annual runoff ratio is far below 1%. Precipitation in the forcing file has mean daily values
    around 0.01-0.05 instead of the expected 1-5 mm/d range.

    '
  diagnosis: Precipitation left in kg/m2/s (CMFD native) instead of mm/d; CMFD precipitation is in kg/m2/s,
    which equals mm/s. VELMA expects mm/d. The conversion factor is 86400 (seconds per day). Without this
    multiplication, a real 2.7 mm/d rain event enters the model as 0.000031 mm/d, producing negligible
    infi
  remedy: 'Multiply CMFD precipitation by 86400 to convert kg/m2/s to mm/d; convert_forcing_to_velma.py;
    [''Check forcing file: mean daily precip should be 1-10 mm/d for most basins'', ''If values are ~1e-5,
    apply: precip_mmd = precip_kgm2s * 86400.0'', ''Rerun convert_forcing_to_velma.py with corrected unit
    handli'
  severity: silent
- id: dt_velma_002
  symptom: '[SURROGATE + REAL engine drivers] Simulated streamflow is approximately 8x higher than observed.
    Flooding events appear far too frequently. Water balance shows precipitation greatly exceeding realistic
    values.

    '
  diagnosis: CMFD 3-hourly precipitation (mm/3h) summed incorrectly or passed as mm/d directly; Some CMFD
    products provide precipitation in mm/3h. There are 8 three-hour intervals per day, so 8 values must
    be summed per day. If each 3-hourly value is incorrectly treated as a daily value, the effective precipitat
  remedy: 'Sum 8 three-hourly precipitation values per day to get mm/d BEFORE convert_forcing_to_velma.py
    (it reads already-daily NetCDF only and does not aggregate); convert_forcing_to_velma.py; [''Inspect
    CMFD temporal resolution: check if files have 8 records per day'', ''Sum daily: precip_mmd = sum(precip_mm3'
  severity: silent
- id: dt_velma_003
  symptom: '[SURROGATE only: tools/run_velma.py, NOT EPA VELMA] PET is always zero. Actual ET is zero
    across all four soil layers. Snow never melts even in summer. Model output shows perpetual snow accumulation
    with SWE growing indefinitely.

    '
  diagnosis: Temperature passed in Celsius instead of Kelvin; The legacy Python adapter expects temperature
    in Kelvin. EPA Java weather files require Celsius. Internally (line 454 of run_validation.py), the
    model converts to Celsius via T_C = temp_K - 273.15. If temperature is already in Celsius (e.g., 15
    C), th
  remedy: Confirm runtime units. Legacy Python JSON requires Kelvin; convert Celsius with +273.15. EPA
    Java weather files require Celsius; convert JSON Kelvin with -273.15 exactly once.; convert_forcing_to_velma.py
  severity: silent
- id: dt_velma_004
  symptom: '[SURROGATE only: tools/run_velma.py, NOT EPA VELMA] PET is unrealistically high (>50 mm/d).
    Soil layers L1-L3 are depleted within days of simulation start. Streamflow is dominated by surface
    runoff with no subsurface contribution.

    '
  diagnosis: 'Solar radiation in MJ/m2/d instead of W/m2; VELMA expects solar radiation in W/m2 for the
    Hargreaves PET equation. The conversion from MJ/m2/d to W/m2 is: divide by 0.0864. If MJ/m2/d values
    (typically 5-30) are passed as W/m2 directly, they are ~100x too low. However, if the error goes the
    other wa'
  remedy: 'Ensure solar radiation is in W/m2; if in MJ/m2/d, divide by 0.0864; convert_forcing_to_velma.py;
    [''Check srad values: typical W/m2 range is 50-400 for daily mean'', ''If values are 5-30, they are
    likely MJ/m2/d: divide by 0.0864'', ''If values are 5000-30000, they are likely kJ/m2/d: divide by
    86.4'']; V'
  severity: silent
- id: dt_velma_005
  symptom: '[SURROGATE only: tools/run_velma.py, NOT EPA VELMA] Percolation from Layer 1 to Layer 2 is
    extremely slow. Water accumulates in the top 10 cm layer, causing excessive surface runoff. Hydrograph
    is overly flashy with no baseflow recession.

    '
  diagnosis: Hydraulic conductivity (Ksat) in mm/h instead of mm/d; HWSD and many soil databases report
    Ksat in mm/h. VELMA requires mm/d for percolation rate calculations. Using mm/h values directly makes
    Ksat 24x too low, severely limiting gravity-driven percolation from each layer to the one below. The
    percol
  remedy: 'Multiply Ksat by 24 to convert mm/h to mm/d; convert_soil_to_velma.py; [''Check Ksat source
    units in the soil database documentation'', ''If in mm/h, apply: Ksat_mmd = Ksat_mmh * 24'', ''If
    in cm/h, apply: Ksat_mmd = Ksat_cmh * 240'', ''Typical VELMA Ksat range: 10-500 mm/d depending on
    soil texture'']; Alw'
  severity: silent
- id: dt_velma_006
  symptom: '[SURROGATE only: tools/run_velma.py, NOT EPA VELMA] Soil layer capacities are 100x too large.
    Layers never fill to field capacity. Model produces zero runoff and zero lateral flow for years because
    all precipitation is absorbed into enormous soil storage.

    '
  diagnosis: Porosity specified as percent (e.g., 45) instead of fraction (0.45); VELMA computes layer
    capacity as porosity * thickness (mm). If porosity is entered as 45 instead of 0.45, L1 capacity becomes
    45 * 100 = 4500 mm instead of 45 mm. This creates physically impossible storage volumes. The same
    error a
  remedy: 'Divide porosity (and FC, WP fractions) by 100 if they are in percent; convert_soil_to_velma.py;
