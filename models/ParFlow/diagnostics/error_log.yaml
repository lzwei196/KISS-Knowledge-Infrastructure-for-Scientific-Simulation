  recorded_by: server
  run_context:
    basin: chaohe
    model: ParFlow
    run_name: chaohe_cmfd_july2005
  stage: s7_solver
  failure_domain: domain_setup
  symptom:
    description: Variable dz with nzList + Box geometry only activates bottom layer (layer 0); layers 1-NZ show fill values
      -3.4e38 in pressure and saturation output
    error_pattern: ''
    detection_method: file_check
  diagnosis:
    root_cause: Box geometry with dzScale nzList creates a mask that is active=1 only in layer 0. ParFlow only solves Richards
      equation for layer 0, ignoring layers 1-NZ. Uniform dz (no nzList) correctly activates all layers.
    explanation: ''
    affected_components:
    - dzScale
    - nzList
    - mask
    - Box_geometry
  resolution:
    action: Use uniform DZ layers (ComputationalGrid.DZ = layer_thickness) instead of dzScale nzList with Box geometry. For
      variable thickness layers, use indicator file geometry instead of Box.
    files_changed: []
    prevention: Never use dzScale.Type=nzList with Box input geometry. Use uniform DZ or indicator files for multi-layer setups.
  severity: fatal
  promoted: true
  promoted_as: dt_pf_v005
