model:
  name: VELMA Knowledge Infrastructure
  domain: hydrology
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: Precipitation
    unit: '**mm/d**'
    format: ''
    source: skill_md
  - name: Temperature
    unit: '**K** (internal)'
    format: ''
    source: skill_md
  - name: Precip
    unit: mm/d
    format: ''
    source: skill_md
  - name: Snow
    unit: unknown
    format: ''
    source: skill_md
outputs:
  primary:
  - name: Temperature
    unit: '**K** (internal)'
    format: ''
    source: skill_md
  - name: pet
    unit: --
    format: ''
    source: skill_md
  - name: Baseflow
    unit: k_base
    format: ''
    source: skill_md
  - name: Discharge
    unit: m3/s
    format: ''
    source: skill_md
  - name: Snow
    unit: unknown
    format: ''
    source: skill_md
  - name: Evapotranspiration
    unit: Hargreaves/Priestley-Taylor hybrid
    format: ''
    source: skill_md
  - name: runoff
    unit: unknown
    format: ''
    source: skill_md
