template_version: "3.5"

identity:
  model_id: "HYPE"
  scientific_reference_version: "HYPE 5.35.0 (SMHI HYdrological Predictions for the Environment; conceptual semi-distributed water + N/P/OC/sediment model). SMHI versions the line continuously (5-10 releases/year); this dag pins the 5.35.0 numerics."
  implementation:
    id: "hype-5350"
    version: "5.35.0"
    provenance: "Fortran 90; SMHI HYPE 5.35.0 source (PROGRAM HYSS in main.f90, MODELMODULE.model in model_hype.f90)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "LGPL-3.0-only"
  repo_url: "https://sourceforge.net/projects/hype/files/release_hype_5_35_0/"

boundary:
  scope_in:
    - "Subbasin water balance: snow accumulation/melt, soil water (up to 3 layers), evapotranspiration, runoff generation"
    - "Soil temperature, ground frost, frozen-soil water fraction"
    - "Infiltration, percolation, macropore flow, tile drainage, surface and groundwater runoff recession"
    - "Glacier mass balance (optional glacier soil class)"
    - "Internal river and lake routing (local river, main river, ilake, olake) via MAINDOWN topology"
    - "Regulated lakes and dams (rating-curve and production-flow outflow)"
    - "Nitrogen cycle (inorganic N, organic N) in soil and surface water"
    - "Phosphorus cycle (soluble P, particulate P) in soil and surface water"
    - "Organic carbon, tracers, sediment, silica transport"
    - "Water management: irrigation, point/non-point sources, regional groundwater/aquifers"
  scope_out:
    - "Sub-daily process resolution (daily default; sub-daily steps supported but some equations of uncertain validity)"
    - "External/grid-based routing (routing is internal via MAINDOWN)"
    - "Standing water as a separate storage pool"
    - "Direct land runoff to lakes (all land runoff routes through local river first)"
    - "Purely physically-based formulation (algorithms are conceptual; calibration-dependent)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-conservative water balance across subbasins and SLC classes; dedicated wb* water-balance output files audit all flows. Substances are carried as concentrations following each water flux plus immobile soil/sediment pools (N, P, organic C, sediment, tracers, silica), conserving substance mass alongside water. No surface energy-balance closure; PET options 0-5 are demand-side flux formulations (temperature-index for 0-2, radiation-based for 3-4, FAO Penman-Monteith for 5)."

inputs:
  forcing:
    - category: "forcing"
      name: "Pobs (precipitation)"
      unit: "mm/time step"
      source_kind: "forcing"
      model_input_format: "Pobs.txt — TAB-separated, header row of subbasin/forcing IDs, daily rows keyed by date"
      notes: "Mandatory every timestep; no missing/negative values; must cover the full bdate-edate range (no interpolation/fill). Header must be line 1 (no !! comment rows)."
    - category: "forcing"
      name: "Tobs (air temperature)"
      unit: "degree Celsius"
      source_kind: "forcing"
      model_input_format: "Tobs.txt — TAB-separated, per forcing/subbasin ID, daily"
      notes: "Mandatory every timestep; assumed valid at the subbasin's mean elevation unless lapse-rate adjusted."
    - category: "forcing"
      name: "TMINobs / TMAXobs (daily min/max temperature)"
      unit: "degree Celsius"
      source_kind: "forcing"
      model_input_format: "TMINobs.txt / TMAXobs.txt"
      notes: "Required by radiation-based PET models (3-5)."
    - category: "forcing"
      name: "SWobs (shortwave radiation)"
      unit: "MJ/m^2/day"
      source_kind: "forcing"
      model_input_format: "SWobs.txt"
      notes: "Required by PET models 3-5 (Hargreaves-Samani, Priestley-Taylor, Penman-Monteith)."
    - category: "forcing"
      name: "RHobs (relative humidity)"
      unit: "fraction"
      source_kind: "forcing"
      model_input_format: "RHobs.txt"
      notes: "Required by PET model 5 (FAO Penman-Monteith)."
    - category: "forcing"
      name: "Uobs (wind speed)"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "Uobs.txt"
      notes: "Required by PET model 5 (FAO Penman-Monteith)."
  parameters:
    - category: "parameter"
      name: "lp (potential-evap reduction limit)"
      unit: "fraction"
      source_kind: "calibrated"
      model_input_format: "par.txt general parameter (single value)"
      notes: "Default 0.8; limits PET draw as soil moisture declines toward field capacity."
    - category: "parameter"
      name: "cevp (PET coefficient)"
      unit: "mm/degC/day"
      source_kind: "calibrated"
      model_input_format: "par.txt land-use-dependent (one value per land-use ID)"
    - category: "parameter"
      name: "cevpam / cevpph (PET seasonal amplitude / phase)"
      unit: "- / days"
      source_kind: "calibrated"
      model_input_format: "par.txt general parameters"
      notes: "Impose a seasonal cycle on potential evapotranspiration."
    - category: "parameter"
      name: "ttmp (snow threshold temperature)"
      unit: "degree Celsius"
      source_kind: "calibrated"
      model_input_format: "par.txt land-use-dependent"
    - category: "parameter"
      name: "cmlt (degree-day snowmelt factor)"
      unit: "mm/degC/day"
      source_kind: "calibrated"
      model_input_format: "par.txt land-use-dependent"
    - category: "parameter"
      name: "wcwp / wcfc / wcep (wilting point / field capacity / effective porosity)"
      unit: "fraction of soil"
      source_kind: "calibrated"
      model_input_format: "par.txt soil-type-dependent (optionally per layer wc*1-3)"
      notes: "Must satisfy wcwp < wcfc and pore-volume sum (wcwp+wcfc+wcep) < 1; define soil-water retention and runoff thresholds."
    - category: "parameter"
      name: "rrcs1 / rrcs2 / rrcs3 (upper/lower/deep recession coefficients)"
      unit: "1/day"
      source_kind: "calibrated"
      model_input_format: "par.txt (rrcs1/rrcs2 soil-type-dependent; rrcs3 general)"
    - category: "parameter"
      name: "srrcs (surface-runoff recession coefficient)"
      unit: "1/day"
      source_kind: "calibrated"
      model_input_format: "par.txt land-use-dependent"
    - category: "parameter"
      name: "rivvel (river velocity) / damp (river attenuation)"
      unit: "m/s / -"
      source_kind: "calibrated"
      model_input_format: "par.txt general parameters"
      notes: "Set channel translation time (transtime = rivlen/(rivvel*86400)) and attenuation."
    - category: "parameter"
      name: "Lake rating / depth parameters (gratk, gratefk, gldepi, gldepol)"
      unit: "mixed"
      source_kind: "calibrated"
      model_input_format: "par.txt general lake parameters; per-lake overrides in LakeData.txt (rate, exp, w0ref, regvol)"
      notes: "General rating-curve fallback; per-lake/dam rate-exp-w0ref-regvol come from LakeData.txt/DamData.txt dataset lookup."
    - category: "parameter"
      name: "Nutrient pool / transformation parameters (fastn0, humusn0, denitrlu, denitwr, denitwl, minerfn, sedon, sedpp, soilcoh, soilerod)"
      unit: "mixed (kg/km2, kg/m2/day, 1/day)"
      source_kind: "calibrated"
      model_input_format: "par.txt (genpar/landpar/soilpar grouping) plus CropData.txt management"
      notes: "Active only when N/P substances are enabled in info.txt."
    - category: "parameter"
      name: "GeoData subbasin physiography (AREA, RIVLEN, latitude, elevation, slope, lake_depth, SLC fractions)"
      unit: "m^2, m, degrees, m, %, m, fraction"
      source_kind: "dataset_lookup"
      model_input_format: "GeoData.txt — TAB-separated, time-invariant per subbasin"
      notes: "AREA in m^2 (discharge scales linearly with area); SLC fractions per subbasin must sum to 1.0; slope_mean mandatory for nutrient modelling."
    - category: "parameter"
      name: "GeoClass SLC definitions (land use, soil, crop, vegtype, special code, tiledepth, streamdepth, numlayers, soildepth 1-3)"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "GeoClass.txt / ClassData.txt"
      notes: "numlayers 1-3 with exactly that many soildepth columns; special code marks lake/water classes."
  initial_conditions:
    - category: "initial_condition"
      name: "Initial soil water"
      unit: "mm"
      source_kind: "default"
      model_input_format: "Computed at start as wp+fc (optionally to saturation wp+fc+ep) per layer/class, or restored from state_save file"
    - category: "initial_condition"
      name: "Initial lake water stage"
      unit: "m"
      source_kind: "default"
      model_input_format: "Outlet-lake stage initialized at threshold; ilake at gldepi/illdepth, or restored from state_save"
    - category: "initial_condition"
      name: "Initial nutrient / organic pools (fast and humus N/P, organic C)"
      unit: "kg/km2"
      source_kind: "default"
      model_input_format: "Initialized from fastn0/humusn0/fastp0/humusp0 parameters; require multi-year warmup (3-5 yr) to stabilize"
    - category: "initial_condition"
      name: "Model state restore"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "state_save / reset_state_save files; data-assimilation ensemble state (ensastates.bin/ensfstates.bin/ensxstates.bin)"
  boundary_conditions:
    - category: "boundary_condition"
      name: "PET model selection (petmodel 0-5)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "info.txt modeloption petmodel"
      notes: "0 temperature-index default; 1-2 temperature-only (Jensen-Haise/McGuiness, Hargreaves); 3 Hargreaves-Samani; 4 Priestley-Taylor; 5 FAO Penman-Monteith. Models 3-5 require additional radiation / humidity / wind forcing."
    - category: "boundary_condition"
      name: "Snowmelt model selection (snowmeltmodel)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "info.txt modeloption snowmeltmodel"
      notes: "Degree-day vs degree-day-with-radiation index."
    - category: "boundary_condition"
      name: "Substance activation (substance N P ...)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "info.txt 'substance' directive enabling N/P/OC/SS/T1/T2 transport"
    - category: "boundary_condition"
      name: "Simulation period and warmup (bdate, cdate, edate)"
      unit: "date"
      source_kind: "user_provided"
      model_input_format: "info.txt; warmup spans bdate..cdate before criteria/output start"
    - category: "boundary_condition"
      name: "MAINDOWN routing topology"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "GeoData.txt MAINDOWN column; subbasins ordered downstream, outlet MAINDOWN=0"
      notes: "Must be acyclic with a single outlet; cycles cause an infinite routing loop."
    - category: "boundary_condition"
      name: "Upstream subbasin inflow"
      unit: "m^3/s"
      source_kind: "derived"
      model_input_format: "Internal — each subbasin receives upstream main-river flow in downstream row order"
    - category: "boundary_condition"
      name: "Atmospheric deposition and external sources"
      unit: "mixed"
      source_kind: "dataset_lookup"
      model_input_format: "AtmdepData.txt, PointSourceData.txt, NonPointSourceData.txt, AquiferData.txt"
      notes: "Wet/dry N/P deposition and anthropogenic loads for water-quality simulation."
    - category: "boundary_condition"
      name: "Lake/dam regulation configuration"
      unit: "mixed"
      source_kind: "dataset_lookup"
      model_input_format: "LakeData.txt / DamData.txt — rating curves, regvol, production flows, minflow, seasonal inflows"

processes:
  modules:
    - name: "AtmosphericProcesses"
      role: "process_solver"
      brief: "atm_proc.f90 — elevation correction of T/P per class, rain/snow partitioning, extraterrestrial and shortwave radiation, daylength/cloudiness, and potential evapotranspiration (PET options 0-5)."
    - name: "SoilProcesses"
      role: "process_solver"
      brief: "soil_proc.f90 — snowpack accumulation/melt (degree-day, optional radiation index), snow density/depth/cover, infiltration, surface runoff, percolation, macropore flow, tile drainage, soil-layer recession runoff, soil temperature, frost depth, frozen/unfrozen fraction, actual ET, groundwater table."
    - name: "SoilModelDefault"
      role: "driver"
      brief: "soilmodel0.f90 — default per-class soil column driver sequencing snow, infiltration, ET, percolation, runoff and nutrient processes for a land class within the subbasin/class loop."
    - name: "GlacierSoilModel"
      role: "optional_module"
      brief: "glacier_soilmodel.f90 — glacier-class soil model adding glacier mass balance and melt to the default soil routines."
      applicability: "glacier classes only (modeloption glacier)"
    - name: "FloodplainSoilModel"
      role: "optional_module"
      brief: "soilmodel4.f90 — soil model for the non-flooded part of a floodplain class, coupling the soil column with floodplain surface-water dynamics."
      applicability: "floodplain classes only (modeloption p_floodplain>=2)"
    - name: "NPC_SoilProcesses"
      role: "process_solver"
      brief: "npc_soil_proc.f90 — soil N/P/organic-carbon pool dynamics: mineralization, plant uptake/growing season, denitrification, sorption, crop-rotation pool averaging, soil leakage."
      applicability: "when N/P/OC substances enabled"
    - name: "SurfaceWaterProcesses"
      role: "process_solver"
      brief: "sw_proc.f90 — rivers and lakes: river characteristics, translation/damping routing, evaporation, water temperature/T2 heat, lake/river ice, outlet-lake rating-curve outflow, regulated outflow, branched flow, water stage, floodplain interflow, abstraction/transfer."
    - name: "NPC_SurfaceWaterProcesses"
      role: "process_solver"
      brief: "npc_sw_proc.f90 — substance (N/P/SS/OC) transformation, sedimentation/resuspension, point sources, atmospheric deposition and wetland processes in rivers and lakes."
      applicability: "when N/P/OC substances enabled"
    - name: "LayeredLakeProcesses"
      role: "optional_module"
      brief: "ll_proc.f90 — vertically-layered (stratified) lake model: layer volumes/concentrations, mixing, depth-resolved temperature (requires T2)."
      applicability: "when layered-lake option enabled"
    - name: "RegionalGroundwater"
      role: "process_solver"
      brief: "regional_groundwater.f90 — aquifer/regional groundwater: removes water from soil profiles at timestep start, explicit aquifer storage with delayed outflow and recharge, flow to rivers/olakes and out of the domain."
      applicability: "when regional-groundwater/aquifer option enabled"
    - name: "IrrigationModule"
      role: "process_solver"
      brief: "irrigation.f90 — irrigation demand per class and withdrawal from groundwater, lakes, rivers and external/aquifer sources with one-timestep application delay."
      applicability: "when irrigation enabled"
    - name: "GeneralWaterConcentration"
      role: "integrator"
      brief: "general_wc.f90 — mass-conserving add_water / remove_water / error_remove_water primitives that update water volumes and mixed concentrations; invoked by every process module to move water+substances between stores."
    - name: "ModelCore"
      role: "driver"
      brief: "model_hype.f90 SUBROUTINE model — per-timestep orchestrator: regional GW removal -> atmospheric forcing -> snowfall distribution -> subbasin loop -> class loop (dispatch to soilmodel 0/3/4) -> river/lake routing in downstream flow order -> output accumulation."
    - name: "COMPOUT"
      role: "integrator"
      brief: "compout.f90 — output-variable computation and period accumulation (initiate_outvar/revise_outvar/compute_mapoutput) plus performance-criteria calculation."
  internal_edges:
    - from: "ModelCore"
      to: "RegionalGroundwater"
      kind: "invokes"
      brief: "At top of timestep, regional GW removal subtracts aquifer flow from soil before the subbasin loop."
    - from: "RegionalGroundwater"
      to: "soilstate_water"
      kind: "writes_state"
      brief: "Removes regional groundwater outflow from soil profiles."
    - from: "RegionalGroundwater"
      to: "aquiferstate_water"
      kind: "writes_state"
      brief: "Aquifer recharge/discharge updates aquifer volume with delayed outflow."
    - from: "ModelCore"
      to: "AtmosphericProcesses"
      kind: "invokes"
      brief: "Per timestep computes subbasin temp/precip correction, radiation, cloudiness, snowfall distribution and PET."
    - from: "Inputs"
      to: "AtmosphericProcesses"
      kind: "consumes_input"
      brief: "Reads Pobs/Tobs (and radiation/humidity/wind for PET 3-5)."
    - from: "AtmosphericProcesses"
      to: "SoilModelDefault"
      kind: "invokes"
      brief: "Per-class corrected temp, precip, rain/snow split, radiation and PET feed the soil column."
    - from: "ModelCore"
      to: "SoilModelDefault"
      kind: "invokes"
      brief: "Class loop calls the default soil model for each land class in each subbasin."
    - from: "ModelCore"
      to: "GlacierSoilModel"
      kind: "invokes"
      brief: "Glacier classes dispatched to the glacier soil model with glacier mass balance."
    - from: "ModelCore"
      to: "FloodplainSoilModel"
      kind: "invokes"
      brief: "Floodplain classes dispatched to the floodplain soil model when enabled."
    - from: "SoilModelDefault"
      to: "SoilProcesses"
      kind: "invokes"
      brief: "Calls snow, infiltration, percolation, ET, runoff and soil-temperature routines."
    - from: "SoilProcesses"
      to: "snow"
      kind: "writes_state"
      brief: "calculate_snow updates SWE, snow depth, cover and age."
    - from: "SoilProcesses"
      to: "soilstate_water"
      kind: "writes_state"
      brief: "Infiltration, percolation, runoff and ET update soil moisture per layer."
    - from: "SoilProcesses"
      to: "soiltemp"
      kind: "writes_state"
      brief: "calculate_soiltemp updates soil-layer temperature, driving frost depth and frozen-water fraction."
    - from: "SoilModelDefault"
      to: "NPC_SoilProcesses"
      kind: "invokes"
      brief: "Soil nutrient/OC pool transformation and plant uptake within the class loop."
    - from: "NPC_SoilProcesses"
      to: "soil_nutrient_pools"
      kind: "writes_state"
      brief: "Updates humusN/fastN/partP/fastP/humusC/fastC soil pools."
    - from: "SoilProcesses"
      to: "IrrigationModule"
      kind: "invokes"
      brief: "Soil-moisture deficit drives irrigation-demand calculation."
    - from: "IrrigationModule"
      to: "soilstate_water"
      kind: "writes_state"
      brief: "Queued irrigation (one-timestep delay) is applied to soil moisture."
    - from: "SoilModelDefault"
      to: "riverstate_water"
      kind: "writes_state"
      brief: "Class soil runoff aggregates to local stream / main-river inflow."
    - from: "ModelCore"
      to: "SurfaceWaterProcesses"
      kind: "invokes"
      brief: "Routing of local river, ilake, main river and olake in downstream flow order."
    - from: "SurfaceWaterProcesses"
      to: "riverstate_water"
      kind: "writes_state"
      brief: "Translation/damping routing updates river volume and routing queue."
    - from: "SurfaceWaterProcesses"
      to: "lakestate_water"
      kind: "writes_state"
      brief: "Outlet-lake rating-curve and regulated outflow update lake water stage."
    - from: "SurfaceWaterProcesses"
      to: "riverstate_temp"
      kind: "writes_state"
      brief: "Water-temperature and ice processes update river/lake temperature and ice state."
    - from: "ModelCore"
      to: "NPC_SurfaceWaterProcesses"
      kind: "invokes"
      brief: "Substance transformation, sedimentation/resuspension, point sources and deposition in river/lake."
    - from: "NPC_SurfaceWaterProcesses"
      to: "river_lake_sediment_pools"
      kind: "writes_state"
      brief: "Updates river sediment/P/T1 pools and lake sediment pool."
    - from: "ModelCore"
      to: "LayeredLakeProcesses"
      kind: "invokes"
      brief: "When enabled, stratified-lake layer volumes/concentrations are updated."
    - from: "SurfaceWaterProcesses"
      to: "RegionalGroundwater"
      kind: "invokes"
      brief: "River-aquifer exchange couples rivers to aquifer storage."
    - from: "GeneralWaterConcentration"
      to: "soilstate_water"
      kind: "writes_state"
      brief: "Mass-conserving add_water/remove_water primitives mediate every water+substance transfer between stores."
    - from: "SurfaceWaterProcesses"
      to: "Outputs"
      kind: "produces_output"
      brief: "Olake/subbasin outflow (cout) and water stage emitted after routing."
    - from: "ModelCore"
      to: "COMPOUT"
      kind: "invokes"
      brief: "initiate_outvar/revise_outvar accumulate per-timestep output variables and map output."
    - from: "COMPOUT"
      to: "Outputs"
      kind: "produces_output"
      brief: "Computed output variables written to time/map/subbasin/water-balance files."

states:
  variables:
    - name: "snow"
      unit: "mm SWE"
      role: "prognostic"
    - name: "snowdepth_cover_age"
      unit: "m / fraction / days"
      role: "prognostic"
    - name: "glacvol"
      unit: "m^3"
      role: "prognostic"
    - name: "soilstate_water"
      unit: "mm"
      role: "prognostic"
    - name: "soiltemp"
      unit: "degree Celsius"
      role: "prognostic"
    - name: "deeptemp"
      unit: "degree Celsius"
      role: "prognostic"
    - name: "frostdepth"
      unit: "cm"
      role: "diagnostic"
    - name: "groundwater_table"
      unit: "m"
      role: "prognostic"
    - name: "aquiferstate_water"
      unit: "m^3"
      role: "prognostic"
    - name: "riverstate_water"
      unit: "m^3"
      role: "prognostic"
    - name: "river_translation_queue"
      unit: "m^3 / mg/L"
      role: "prognostic"
    - name: "riverstate_temp"
      unit: "degree Celsius"
      role: "prognostic"
    - name: "lakestate_water"
      unit: "mm / m"
      role: "prognostic"
    - name: "lakestate_temp"
      unit: "degree Celsius"
      role: "prognostic"
    - name: "river_lake_ice"
      unit: "m (thickness) / fraction (cover)"
      role: "prognostic"
    - name: "soil_nutrient_pools"
      unit: "kg/km2"
      role: "prognostic"
    - name: "dissolved_substance_conc"
      unit: "mg/L (model-internal)"
      role: "prognostic"
    - name: "river_lake_sediment_pools"
      unit: "kg"
      role: "prognostic"
    - name: "TPmean_365d"
      unit: "ug/L"
      role: "accumulator"
    - name: "air_temp_moving_averages"
      unit: "degree Celsius"
      role: "accumulator"
    - name: "Q365_Qmean"
      unit: "m^3/s"
      role: "accumulator"
    - name: "nextirrigation_nexttransfer"
      unit: "mm / m^3/s"
      role: "prognostic"
  provenance: "populated"

outputs:
  - var: "cout"
    validation_rank: 1
    unit: "m^3/s"
    description: "Simulated outflow (discharge) from the outlet lake / subbasin, positive flow only."
    emitted_in: "timeCOUT.txt / subbasin output files"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Gauged-subbasin discharge; compare at the gauge's SUBID outlet over the matching period after warmup."
            - "Lumped (1-subbasin) setups of large basins lack subbasin-to-subbasin routing attenuation and over-predict peaks."
      detrending_options: ["none"]
  - var: "snow"
    validation_rank: 3
    unit: "mm"
    description: "Snow water equivalent, subbasin land-area average."
    emitted_in: "timeSNOW.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "SWE is an areal subbasin average; point snow-course/SNOTEL comparison is approximate."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Use mapSNOW periodic averages against gridded SWE products at subbasin aggregation."
      detrending_options: ["none"]
  - var: "evap"
    validation_rank: 2
    unit: "mm/day"
    description: "Actual evapotranspiration from subbasin soil water and land surface."
    emitted_in: "timeEVAP.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Conceptual ET (no surface energy closure); flux-tower comparison is indicative, not energy-budget-closed."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
