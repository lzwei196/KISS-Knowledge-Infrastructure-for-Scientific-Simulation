triplets:
- id: dt_001
  domain: unit_conversion
  severity: critical
  symptom: 'Surface temperatures in wrfout are ~300 K too cold (e.g., T2 shows -27
    C when expecting +25 C), or downstream analysis reports temperatures near 0 K.

    '
  diagnosis: 'The 3D temperature variable T in wrfout is perturbation potential temperature
    (theta - 300 K). Code is reading T directly without adding the 300 K base state.
    For actual temperature, one must also apply the Exner function: T_actual = (T
    + 300) * (P_total / 100000)^(287/1003.5).

    '
  remedy: 'Always add 300 to T before any use: theta = T + 300. For actual temperature,
    compute T_actual = theta * ((P + PB) / 100000.0)^(R_d/c_p). For 2-m temperature,
    use the T2 variable directly (already in K, not perturbation).

    '
  prevention: 'Add assertion: assert (T + 300).min() > 150, "T not converted from
    perturbation"

    '
- id: dt_002
  domain: unit_conversion
  severity: critical
  symptom: 'Surface pressure values are ~100x too small (e.g., 1013 instead of 101300).
    Downstream calculations using pressure give nonsensical results.

    '
  diagnosis: 'Pressure was read in hPa (millibars) but WRF expects and outputs Pa
    internally. Alternatively, only the perturbation pressure P was used instead of
    total pressure P + PB.

    '
  remedy: 'For input data: multiply hPa by 100 to get Pa. For wrfout data: total pressure
    is P + PB (perturbation + base state). P alone is only ~100-1000 Pa. PSFC is total
    surface pressure in Pa.

    '
  prevention: 'Validate: assert pressure.mean() > 50000, "Pressure likely in hPa,
    not Pa"

    '
- id: dt_003
  domain: unit_conversion
  severity: critical
  symptom: 'Mixing ratios (qv, qc, qr) are 1000x too large, causing unrealistic precipitation
    or model crash. Total column water exceeds 200 kg/m2.

    '
  diagnosis: 'Input specific humidity or mixing ratio was provided in g/kg instead
    of the WRF-required kg/kg. A value of 15 g/kg should be 0.015 kg/kg.

    '
  remedy: 'Divide g/kg values by 1000 before ingestion. Check that qv values are in
    range 0 to ~0.04 kg/kg (0 to 40 g/kg is extreme tropical).

    '
  prevention: 'Validate: assert qv.max() < 0.1, "Mixing ratio likely in g/kg, not
    kg/kg"

    '
- id: dt_004
  domain: unit_conversion
  severity: critical
  symptom: 'Geopotential height values are ~9.81x too large. Model produces unrealistic
    pressure gradients or crashes during initialization.

    '
  diagnosis: 'ERA5 provides geopotential in m2/s2, but WRF GHT field expects height
    in meters. The conversion factor is g = 9.81 m/s2.

    '
  remedy: 'Divide ERA5 geopotential (z) by 9.81 to get geopotential height in meters:
    GHT = z / 9.81.

    '
  prevention: 'Check range: 500 hPa GHT should be ~5000-6000 m, not 50000-60000.

    '
- id: dt_005
  domain: unit_conversion
  severity: high
  symptom: 'Precipitation totals are always zero or always accumulating without reset.
    Hourly rainfall rates appear as multi-day totals.

    '
  diagnosis: 'WRF RAINC and RAINNC are accumulated from simulation start. To get interval
    precipitation, you must difference consecutive output times. Additionally, total
    precipitation requires RAINC + RAINNC (convective plus grid-scale).

    '
  remedy: 'Compute interval precip: P(t) = (RAINC(t) + RAINNC(t)) - (RAINC(t-1) +
    RAINNC(t-1)). For the first output time, the accumulation is from simulation start.

    '
  prevention: 'Always check both RAINC and RAINNC. If RAINC is all zeros, cu_physics
    may be off.

    '
- id: dt_006
  domain: unit_conversion
  severity: high
  symptom: 'Radiation flux values are wrong by factor of ~86400 or 1e6. Solar radiation
    appears as 0.005 W/m2 when expecting 500 W/m2.

    '
  diagnosis: 'Input radiation data was in MJ/m2/day but WRF expects W/m2 (1 W = 1
    J/s). Conversion: W/m2 = MJ/m2/day * 1e6 / 86400.

    '
  remedy: 'Multiply MJ/m2/day by 11.574 to get W/m2. Alternatively, W/m2 = MJ/m2/day
    * 1000000 / 86400.

    '
  prevention: 'Validate: SWDOWN should be 0-1200 W/m2 (clear-sky tropical max ~1100).

    '
- id: dt_007
  domain: configuration
  severity: critical
  symptom: 'Model crashes within first few timesteps with "cfl" errors in rsl.error.0000.
    Simulation immediately aborts.

    '
  diagnosis: 'Time step violates the CFL (Courant-Friedrichs-Lewy) stability condition.
    The rule of thumb is dt <= 6 * dx(km). For dx=12 km, dt must be <= 72 s.

    '
  remedy: 'Reduce time_step in namelist.input. Start conservative (dt = 4*dx_km) and
    increase if stable. Also check parent_time_step_ratio for nested domains.

    '
  prevention: 'Automated check: assert time_step <= 6 * dx / 1000

    '
- id: dt_008
  domain: configuration
  severity: critical
  symptom: 'real.exe or wrf.exe crashes with segmentation fault. No useful error message.
    Core dump shows crash in land surface module.

    '
  diagnosis: 'num_soil_layers does not match the land surface model selection: Noah
    LSM (sf_surface_physics=2) requires 4, RUC (3) requires 6, Noah-MP (4) requires
    4, CLM4 (5) requires 10.

    '
  remedy: "Set num_soil_layers to match sf_surface_physics: sf_surface_physics=1\u2192\
    5, =2\u21924, =3\u21926, =4\u21924, =5\u219210.\n"
  prevention: 'Add lookup validation in preprocessing script.

    '
- id: dt_009
  domain: configuration
  severity: high
  symptom: 'Precipitation is unrealistically high (2-3x observed). Domain 2 (4 km)
    shows much more rain than observations.

    '
  diagnosis: 'cu_physics (cumulus parameterization) is enabled on a domain with dx
    < 5 km. At convection-permitting resolution, convection is explicitly resolved,
    so parameterized + resolved = double-counted.

    '
  remedy: 'Set cu_physics = 0 for all domains with dx < 5 km. For the parent domain
    (dx > 10 km), keep cu_physics = 1 (Kain-Fritsch) or 16 (New Tiedtke).

    '
  prevention: 'Assert: if dx < 5000 then cu_physics must be 0.

    '
- id: dt_010
  domain: configuration
  severity: high
  symptom: 'Nesting interpolation produces checkerboard patterns at nest boundaries.
    Temperature or wind fields show regular oscillations.

    '
  diagnosis: 'parent_grid_ratio is an even number (2, 4, 6). WRF requires odd ratios
    (3, 5, 7) for real-data simulations to properly center the interpolation stencil.

    '
  remedy: "Change parent_grid_ratio to an odd number. Common: 3:1 (12km\u21924km)\
    \ or 5:1 (25km\u21925km).\n"
  prevention: 'Assert: parent_grid_ratio % 2 == 1 for all domains.

    '
- id: dt_011
  domain: configuration
  severity: high
  symptom: 'Boundary condition update causes sharp discontinuities or model crash.
    Temperature jumps every 6 hours at domain boundaries.

    '
  diagnosis: 'interval_seconds in namelist.input does not match the temporal resolution
    of the forcing data (met_em files). If interval_seconds=3600 but met_em files
    are 6-hourly, WRF expects files that don''t exist.

    '
  remedy: 'Set interval_seconds to match the forcing data frequency: ERA5 hourly=3600,
    GFS/FNL 6-hourly=21600, 3-hourly=10800.

    '
  prevention: 'Count met_em files and compare with expected count from interval_seconds.

    '
- id: dt_012
  domain: runtime
  severity: critical
  symptom: 'Model produces NaN values that spread through the domain within 10-20
    timesteps, eventually crashing or filling output with NaN.

    '
  diagnosis: 'NaN injection from: (1) division by zero in physics (e.g., near-zero
    pressure or density), (2) corrupt initial conditions, (3) extreme topography gradient
    with too-large time step, or (4) inconsistent restart file precision.

    '
  remedy: '(1) Check wrfinput for NaN: ncdump -v T wrfinput_d01 | grep -i nan. (2)
    Reduce time_step by 30%. (3) Enable w_damping=1 and epssm=0.1 for steep terrain.
    (4) Ensure restart uses same precision.

    '
  prevention: 'Add NaN check after first output time. Enable epssm for steep terrain.

    '
- id: dt_013
  domain: runtime
  severity: high
  symptom: 'wrf.exe runs but produces no wrfout files. Log shows normal timestep progress
    but no output is written.

    '
  diagnosis: 'history_interval is set larger than the total simulation duration, or
    frames_per_outfile is set to 0, or io_form_history is invalid.

    '
  remedy: 'Verify history_interval (minutes) < total simulation time (minutes). Ensure
    frames_per_outfile >= 1. Set io_form_history = 2 for netCDF.

    '
  prevention: 'Check: history_interval * frames_per_outfile < run_time_minutes.

    '
- id: dt_014
  domain: runtime
  severity: high
  symptom: 'Model crashes with "WOULD GO OFF TOP" error after several hours. Log shows
    extreme vertical velocities.

    '
  diagnosis: 'Strong updrafts (from steep terrain or intense convection) push air
    parcels above the model top. The model domain top (ztop or p_top_requested) is
    too low, or the upper-level damping is insufficient.

    '
  remedy: '(1) Increase ztop (or decrease p_top_requested to lower pressure, e.g.,
    1000 Pa). (2) Enable Rayleigh damping: damp_opt=3, zdamp=5000, dampcoef=0.2. (3)
    Reduce time_step if over steep terrain.

    '
  prevention: 'Set damp_opt=3 with adequate dampcoef for mountainous domains.

    '
- id: dt_015
  domain: runtime
  severity: medium
  symptom: 'Simulation is extremely slow. Wall-clock time per timestep is 10x longer
    than expected for the grid size.

    '
  diagnosis: '(1) MPI decomposition inefficient (too few or too many cores). (2) I/O
    bottleneck from writing too-frequent output. (3) Spectral bin microphysics (mp_physics=30/32)
    is 100x slower than bulk schemes. (4) Radiation called every timestep instead
    of every 15 min.

    '
  remedy: '(1) Optimal MPI: ~25x25 grid points per process. (2) Increase history_interval
    or frames_per_outfile. (3) Use bulk microphysics (mp_physics=8 Thompson) for production.
    (4) Set radt=15 (minutes) for radiation call frequency.

    '
  prevention: 'Monitor timing in rsl.error.0000 to identify bottleneck phase.

    '
- id: dt_016
  domain: input_data
  severity: critical
  symptom: 'real.exe crashes with "not enough levels" or produces wrfinput with all-zero
    soil fields. Soil temperature shows 0 K.

    '
  diagnosis: 'met_em files are missing soil moisture and temperature fields. This
    happens when the Vtable doesn''t include soil variables, or the source GRIB data
    doesn''t contain soil fields.

    '
  remedy: '(1) Verify Vtable includes SM and ST fields. (2) Check met_em: ncdump -h
    met_em.d01.* | grep SM (3) If source data lacks soil, use a separate soil dataset
    (e.g., ERA5 soil separate from pressure-level data).

    '
  prevention: 'After metgrid, check: ncks -v SM000010 met_em.d01.* should show non-zero.

    '
- id: dt_017
  domain: input_data
  severity: high
  symptom: 'SST is constant at 0 or 300 K everywhere. Ocean surface fluxes are unrealistic.
    Coastal temperature gradients are wrong.

    '
  diagnosis: 'SST field was not extracted from GRIB data, or the Vtable doesn''t map
    the SST variable correctly. real.exe falls back to using SKINTEMP over water,
    which may be wrong.

    '
  remedy: '(1) Ensure Vtable includes SST mapping. (2) For ERA5, SST is a separate
    dataset from pressure levels. (3) Verify: ncdump -v SST met_em.d01.* shows realistic
    ocean temps. (4) For time-varying SST, use wrflowinp with sst_update=1.

    '
  prevention: 'Check SST range in met_em: should be 270-305 K over ocean.

    '
- id: dt_018
  domain: input_data
  severity: high
  symptom: 'Temporal interpolation artifacts appear as 6-hourly pulses in temperature
    or wind. Boundary forcing shows step changes.

    '
  diagnosis: 'Gap in met_em temporal coverage. One or more intermediate times are
    missing, causing WRF to extrapolate or use stale boundaries.

    '
  remedy: '(1) List all met_em files and verify continuous temporal coverage. (2)
    Rerun ungrib/metgrid to fill gaps. (3) Ensure GRIB data covers full simulation
    period including end time.

    '
  prevention: 'After metgrid, count files: n_expected = (end - start) / interval +
    1.

    '
- id: dt_019
  domain: post_processing
  severity: high
  symptom: 'Wind direction comparison with observations shows systematic bias of 10-30
    degrees. Wind speed is correct but direction is offset.

    '
  diagnosis: 'U10 and V10 in wrfout are grid-relative, not earth-relative. For Lambert
    conformal or polar stereographic projections, the grid north differs from true
    north by the convergence angle.

    '
  remedy: 'Rotate winds using COSALPHA and SINALPHA variables from wrfout: u_earth
    = U10*COSALPHA - V10*SINALPHA v_earth = V10*COSALPHA + U10*SINALPHA

    '
  prevention: 'Always rotate winds before comparison with observations.

    '
- id: dt_020
  domain: post_processing
  severity: medium
  symptom: 'Spatial plots show half-grid-cell offset between wind and temperature
    fields. Wind vectors appear shifted relative to the temperature contours.

    '
  diagnosis: '3D wind components (U, V, W) are on staggered grid faces (Arakawa C-grid).
    U has an extra point in X, V in Y, W in Z. Plotting raw staggered data against
    unstaggered mass-point data causes spatial offset.

    '
  remedy: 'Destagger before analysis: u_mass = 0.5 * (U[:,:,:-1] + U[:,:,1:]) v_mass
    = 0.5 * (V[:,:-1,:] + V[:,1:,:])

    '
  prevention: 'Use parse_wrfout.py which handles destaggering automatically.

    '
- id: dt_021
  domain: post_processing
  severity: medium
  symptom: 'Vertical profile of pressure shows only small perturbation values (~100-1000
    Pa) instead of full atmospheric pressure (~100000 Pa).

    '
  diagnosis: 'Only the perturbation pressure variable P was read, ignoring the base-state
    pressure PB. Total pressure is P + PB.

    '
  remedy: 'Always compute total pressure: pressure = P + PB. Similarly, total geopotential:
    ph_total = PH + PHB.

    '
  prevention: 'Document in extraction code: "WRF splits fields into base + perturbation."

    '
- id: dt_022_nasa_power_lst_vs_utc_and_climatology_proxy
  symptom:
    description: WRF T2 (or any sub-daily field) scored against NASA POWER hourly
      appears anti-correlated (r~-0.05, NSE~-0.9) despite a physically reasonable
      simulation; OR a deterministic weather snapshot scored against a multi-year
      monthly climatology gives structurally poor NSE (-7..-10) with a large warm/cold
      bias and near-circular spatial CSI.
  diagnosis:
    root_cause: 'Two compounding errors: (1) NASA POWER hourly defaults to LST (local
      solar time) while wrfout Times are UTC, so pairing shifts the diurnal cycle
      by the lon offset and anti-correlates it; (2) comparing a single 48-h weather
      realization against a 2015-2022 climatological mean is not time-matched and
      not compatible support, so RMSE/NSE are dominated by the weather-vs-climate
      offset and spatial pattern skill is dominated by shared static terrain.'
  remedy:
    action: Score WRF T2 as the dag rank-1 point_time_series against a time-matched,
      valid-time, independent obs (NASA POWER hourly T2M at the domain centre) requested
      with time-standard=UTC, paired to the wrfout frames by UTC timestamp. Never
      score a deterministic snapshot against a multi-year climatology. See run_and_score_realcase_t2_pointts.py.
  format_spec_violated: none
  canonical_intent: ki_local_if_pass
  added_by_run: WRF_retry1
- id: dt_wrf_snapshot_vs_climatology_spatial_csi
  symptom:
    description: WRF T2 spatial_field_comparison gives CSI ~0.50 with a large uniform
      warm/cool bias (e.g. +3.8 K) and the pre-retry gate REJECTS with wrong-metric-for-obs-shape
      (nse/kge/r reported for obs_shape=spatial_time_series).
  diagnosis:
    root_cause: A single short WRF weather realization was scored against a multi-year
      monthly CLIMATOLOGY (temporal-support mismatch), CSI used one ABSOLUTE threshold
      on both fields so the uniform anomaly dominated it, no spin-up was dropped,
      and NSE/KGE (temporal families) were reported for a spatial obs shape.
  remedy:
    action: Score against a CONTEMPORANEOUS obs field for the actual sim window (fetch
      ERA5-Land hourly 2m_temperature via cdsapi, average over the post-spin-up window
      >= start+12h); compute CSI with each field's OWN median as threshold (bias-robust
      spatial_pattern_match); report only spatial_pattern_match (csi, spatial_r) +
      magnitude_accuracy (rmse, bias, pbias), never NSE/KGE (dag.yaml:226-230).
  format_spec_violated: 'dag.yaml observability for T2 spatial_time_series: metric_families=[spatial_pattern_match,
    magnitude_accuracy]'
  canonical_intent: ki_local_if_pass
  added_by_run: WRF_retry1
