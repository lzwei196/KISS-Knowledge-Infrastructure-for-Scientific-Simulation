# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: ELMFIRE
  language: fortran
  implementation:
    id: elmfire-2025.1002
    version: '2025.1002'
    provenance: Fortran (F2008/MPI); ELMFIRE simulator from github.com/lautenberger/elmfire, with companion
      elmfire_post ensemble aggregator.
  scientific_reference_version: ELMFIRE 2025.1002 (Eulerian level-set fire-spread formulation, Lautenberger
    2013)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/ELMFIRE/source/repo/build/linux/bin/elmfire_2025.1002
    type: work_dir
pipeline:
  stages: []
tools:
  count: 4
  files:
  - tools/convert_landscape_to_elmfire.py
  - tools/convert_weather_to_elmfire.py
  - tools/parse_elmfire_output.py
  - tools/run_elmfire.py
inputs:
  forcing:
  - name: wind speed (20-ft)
    unit: mph
  - name: wind direction
    unit: degrees (meteorological FROM)
  - name: 1-hr dead fuel moisture
    unit: percent
  - name: 10-hr dead fuel moisture
    unit: percent
  - name: 100-hr dead fuel moisture
    unit: percent
  - name: weather update interval (DT_METEOROLOGY)
    unit: seconds
  parameters:
  - name: elevation (DEM)
    unit: m
  - name: slope
    unit: degrees (0-90)
  - name: aspect
    unit: degrees (0=N,90=E)
  - name: fuel model (FBFM40)
    unit: FBFM40 code (0-303)
  - name: canopy cover
    unit: percent (0-100)
  - name: canopy height
    unit: m (x10 integer when CH_TIMES_10)
  - name: canopy base height
    unit: m (x10 integer when CBH_TIMES_10)
  - name: canopy bulk density
    unit: kg/m3 (x100 integer when CBD_TIMES_100)
  - name: live herbaceous moisture
    unit: percent (30-300)
  - name: live woody moisture
    unit: percent (60-200)
  - name: foliar moisture content
    unit: percent
  - name: spread-rate adjustment factor
    unit: dimensionless (default 1.0)
  - name: L/W maximum ellipse ratio
    unit: dimensionless (default 8)
  initial_conditions:
  - name: initial level-set field (phi0)
    unit: dimensionless
  boundary_conditions:
  - name: computational domain & CRS
    unit: UTM meters
  - name: time control
    unit: seconds
  - name: ignition specification
    unit: UTM meters / seconds
  - name: crown fire options
    unit: mixed
  - name: Monte Carlo ensemble control
    unit: mixed
  - name: diurnal adjustment
    unit: mixed
  - name: spotting control
    unit: boolean
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - time_of_arrival
  - spread_rate
  - fireline_intensity
  - flame_length
  - crown_fire
  - fire_size
  - burn_probability
  other: []
validation:
  tier: validated
  tier_justification: 'measured: R=1.000, 2 scorecard(s)'
  metrics:
    best_r: 1.0
summary:
  total_tools: 4
  total_stage_docs: 0
  total_diagnostic_triplets: 20
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
