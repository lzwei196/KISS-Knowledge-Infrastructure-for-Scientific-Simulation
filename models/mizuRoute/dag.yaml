safety:
  hazards:
    - id: "runoff_unit_mm_per_s"
      kind: "weather_file_semantic"
      description: "Runoff supplied in mm/timestep rather than the required mm/s yields discharge off by the timestep ratio (8x/24x/86400x) with no error; max(RUNOFF) > 1.0 mm/s signals the conversion was skipped."
      severity: "silent"
    - id: "vname_mismatch"
      kind: "weather_file_semantic"
      description: "control-file vname_* mappings not matching the actual NetCDF variable names (COMID vs seg_id, Length vs seg_length) cause a fatal 'variable not found'."
      severity: "fatal"
    - id: "remap_crs_mismatch"
      kind: "soil_semantic"
      description: "CRS mismatch between the runoff grid and HRU polygons gives zero spatial overlap, so all remap weights are zero and discharge is near-zero despite valid runoff."
      severity: "silent"
    - id: "edge_hru_uncovered"
      kind: "soil_semantic"
      description: "At coarse runoff-grid resolution, edge HRUs overlap no grid cell and contribute zero runoff to their segments even in wet seasons."
      severity: "silent"
    - id: "dangling_tosegment"
      kind: "soil_semantic"
      description: "A reach's tosegment pointing to a non-existent seg_id (DEM clipping artifact) creates infinite loops or crashes in topological routing."
      severity: "fatal"
    - id: "multiple_outlets"
      kind: "soil_semantic"
      description: "Multiple reaches with tosegment==0 route water to several independent outlets, reducing main-outlet discharge; verify a single outlet or sum all outlets."
      severity: "silent"
    - id: "zero_reach_slope"
      kind: "soil_semantic"
      description: "Zero/near-zero reach slope (flat DEM) drives infinite wave speed / division-by-zero in the celerity-Manning relation, producing unrealistic peaks; apply a slope floor (max(slope,1e-4))."
      severity: "degraded"
    - id: "cfl_violation_kw_dw"
      kind: "numerical_instability"
      description: "Routing dt too large for the conditionally stable Euler kinematic-wave and diffusive-wave schemes (dt < dx/c) causes a CFL/Courant crash; IRF and KWT are unconditionally stable."
      severity: "fatal"
    - id: "lake_flags_missing"
      kind: "control_semantic"
      description: "is_lake_sim=.True. with no lake attributes flagged in the network makes lake routing silently fail / drop lake outflow."
      severity: "degraded"
    - id: "basinroute_double_count"
      kind: "control_semantic"
      description: "doesBasinRoute=1 applies a hillslope IRF that a driver-side unit hydrograph (e.g. Lohmann) already includes, double-counting the hillslope delay and shifting hydrograph timing."
      severity: "warning"
    - id: "leopold_width_wrong_region"
      kind: "coefficient_runtime_silent_fallback"
      description: "Default temperate Leopold-Maddock width coefficients (a=2.7,b=0.35) produce unrealistic channel widths in arid/tropical regions, biasing celerity/attenuation in non-IRF schemes."
      severity: "silent"
  validation_limits:
    - "Does not generate runoff; requires runoff input from an external land-surface/hydrologic model."
    - "Reduced-form routing (kinematic/diffusive wave); full Saint-Venant momentum and unsteady backwater are not resolved."
    - "No floodplain inundation; only channel/storage routing."
    - "KW-Euler and DW are conditionally stable and impractical on steep mountain basins without very small dt — use IRF or KWT there."
    - "Routing impact is strongest at sub-daily/daily scales and diminishes at monthly/annual aggregation."
  warnings:
    - "Omitting baseflow from the runoff input loses roughly 30-70% of total flow with no error."
    - "KW-Euler/MC/DW can represent channel transmission losses that unit-hydrograph schemes (IRF) ignore, giving systematically lower discharge in arid basins."
    - "Solver constants are hardcoded and not control-file tunable: Muskingum Y=0.5, KW/DW nodes=20, MC nodes=2, KWT particle cap=20 (limits KWT resolution)."
    - "An undocumented per-step outflow cap (99.9% of available storage+inflow) acts as a mass-conservation guard in MC/KW/DW."
  assumptions:
    - statement: "The model is point/reach-vector in space and routes in upstream-to-downstream topological order; HRUs map one-to-one or via remap weights onto reaches."
      scope: "spatial structure of the whole model"
      source: "mizuRoute technical note (reach_routing) and Mizukami et al. 2016 (DOI 10.5194/gmd-9-2223-2016)"
      status: "adopted"
    - statement: "Closure is mass-balance on routed runoff volume; the lake module closes a separate storage water balance, and there is no surface energy budget."
      scope: "conservation properties"
      source: "mizuRoute lake-routing technical note and KI mass-conservation (basRunoff ratio ~1.0) guidance"
      status: "adopted"
    - statement: "Routing methods are reduced Saint-Venant forms; Euler kinematic wave is the diffusive-wave solution with diffusivity D=0."
      scope: "routing-method physics"
      source: "mizuRoute reach-routing technical note (river routing methods section)"
      status: "adopted"
    - statement: "Canonical routing-method enumeration follows the source/docs framing (accumulation=0, IRF, KWT, KW-Euler, MC, DW), not the KI's offset route_opt 0=IRF..4=DW numbering."
      scope: "route_opt method identifiers"
      source: "ESCOMP mizuRoute source (public_var method IDs) and readthedocs reach_routing tech note"
      status: "tentative"
