  remedy: 'Increase time_to_train to 2000+ for complex terrain.; None; [''In config: wind.cfd.time_to_train:
    2000'', ''For very rugged terrain: try 5000'', ''Visually inspect wind field: sim.wind_speed, sim.wind_direction''];
