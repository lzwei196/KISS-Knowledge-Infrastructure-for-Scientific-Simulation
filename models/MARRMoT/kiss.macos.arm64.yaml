agent_hint: Read docs/install.macos.md. Native Octave and its optim/statistics/struct
  packages must be installed genuinely in the scoped workspace; interpreter --version
  is not enough. Keep exact source ref and original model bytes. Expected runtime
  is binaries/octave/bin/octave-cli with OCTAVE_HOME and OCTAVE_EXEC_HOME set to binaries/octave.
  Preserve isolated octave_packages registry. test_installation loads all47 class
  definitions and optim native module. The supplied tools/load_marrmot_installation.m
  is the exact trusted setup probe; do not run scientific model helpers. Never brew-install
  Octave during concurrent jobs because its MPI/shared-library changes can disrupt
  them.
