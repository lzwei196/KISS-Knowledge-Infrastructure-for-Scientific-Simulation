# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: ParFlow
  language: c
  implementation:
    id: parflow-c-v3
    version: v3.13+ (manual served at 3.14/3.15; parflow.org stable v3.12.0)
    provenance: C; ParFlow simulator (LLNL / Colorado School of Mines / Juelich et al.), optional Common
      Land Model (CLM 4.5) land-surface component in Fortran 90/95.
  scientific_reference_version: ParFlow integrated surface-subsurface hydrology (Richards + free-surface
    overland flow; Kollet & Maxwell 2006, Maxwell 2013, Kuffour et al. 2020)
inputs:
  forcing:
  - name: APCP (precipitation rate)
    unit: mm/s (= kg/m2/s)
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector prcp_forc
    notes: Always required as CLM forcing or top-BC flux. Unit is mm/s, NOT mm/hr.
  - name: DSWR (downward shortwave radiation)
    unit: W/m2
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector sw_forc
    notes: CLM enabled only.
  - name: DLWR (downward longwave radiation)
    unit: W/m2
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector lw_forc
    notes: CLM enabled only.
  - name: Tmp (air temperature)
    unit: K
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector tas_forc
    notes: CLM enabled only. Kelvin, not Celsius.
  - name: UGRD (u-wind)
    unit: m/s
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector u_forc
    notes: CLM enabled only.
  - name: VGRD (v-wind)
    unit: m/s
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector v_forc
    notes: CLM enabled only.
  - name: Press (surface pressure)
    unit: Pa
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector patm_forc
    notes: CLM enabled only. Pa, not hPa/kPa.
  - name: SPFH (specific humidity)
    unit: kg/kg
    category: atmospheric
    source_kind: forcing
    model_input_format: PFB forcing field / CLM met vector qatm_forc
    notes: CLM enabled only.
  parameters:
  - name: permeability / saturated conductivity K (perm_x/y/z, anisotropic)
    unit: m/hr
    category: subsurface
    source_kind: dataset_lookup
    model_input_format: PFB field per cell (ProblemData permeability tensor)
    notes: Unit is m/hr in ParFlow (not m/day MODFLOW, not m/s SI). Use physical matrix Ksat from soil
      texture, not VIC-calibrated Ksat (includes macropores, 100-500x too high).
  - name: porosity (phi)
    unit: dimensionless
    category: subsurface
    source_kind: dataset_lookup
    model_input_format: PFB field (ProblemDataPorosity)
    notes: Typical 0.2-0.6.
  - name: van Genuchten alpha
    unit: 1/m
    category: subsurface
    source_kind: dataset_lookup
    model_input_format: Phase.Saturation/RelPerm VanGenuchten key
    notes: Unit is 1/m (not 1/cm as in Rosetta/Carsel-Parrish; factor 100). Typical 0.5 (clay) to 15 (sand).
  - name: van Genuchten n
    unit: dimensionless
    category: subsurface
    source_kind: dataset_lookup
    model_input_format: Phase.Saturation/RelPerm VanGenuchten key
    notes: Drives BOTH the saturation curve and the relative-permeability curve. m is derived as m=1-1/n
      (Mualem); user cannot set m independently. Typical 1.05-4.0.
  - name: specific storage Ss
    unit: 1/m
    category: subsurface
    source_kind: calibrated
    model_input_format: PFB field (specific_storage)
    notes: Elastic storage in saturated zone; typical 1e-5 to 1e-3.
  - name: Kz/Kx anisotropy ratio
    unit: dimensionless
    category: subsurface
    source_kind: calibrated
    model_input_format: permeability tensor ratio
    notes: Vertical-to-horizontal conductivity ratio; typical 0.01-1.0 (default ~0.1).
  - name: Manning's roughness n
    unit: s/m^(1/3)
    category: surface
    source_kind: dataset_lookup
    model_input_format: PFB field (ProblemDataMannings)
    notes: Typical 0.01 (urban) to 0.4 (dense forest); values < 0.01 cause CFL instability.
  - name: slope_x, slope_y (terrain slopes)
    unit: dimensionless
    category: topography
    source_kind: derived
    model_input_format: PFB slope fields (TSlopeX/TSlopeY), derived from sink-filled DEM
    notes: 'Sign convention: positive slope in positive coordinate direction. Min slope ~0.0001 in flat
      terrain.'
  - name: CLM vegetation maps (IGBP type, LAI/SAI/z0 per PFT)
    unit: IGBP class 1-17 / dimensionless
    category: vegetation
    source_kind: dataset_lookup
    model_input_format: drv_vegm.dat, drv_vegp.dat
    notes: CLM enabled only. All-barren/water (type 16/17) gives zero ET.
  initial_conditions:
  - name: initial pressure-head field
    unit: m of water
    category: subsurface
    source_kind: user_provided
    model_input_format: constant, hydrostatic from water-table depth, or PFB file (e.g. global WTD / MODFLOW
      steady state)
    notes: Negative = unsaturated suction, positive = saturated, zero = water table. Spinup of 10-100
      yr (or less if seeded from steady state) needed to equilibrate; equilibrium when inter-annual water-balance
      residual < 1% of precipitation. HydroStaticPatch with bottom RefPatch sets pressure at the BOTTOM
      (surface = Value - total_depth).
  boundary_conditions:
  - name: domain mask / indicator field
    unit: 0/1
    category: domain
    source_kind: user_provided
    model_input_format: 3D active/inactive cell field
    notes: Defines basin extent.
  - name: Overland flow boundary condition (top patch)
    unit: n/a
    category: top_bc
    source_kind: user_provided
    model_input_format: Patch.top.BCPressure.Type = OverlandFlow / OverlandKinematic / OverlandDiffusive
    notes: Always present at the top; couples surface and subsurface via pressure continuity. Selecting
      the kinematic vs diffusive overland scheme is set through the top-patch BC TYPE, not a standalone
      Solver boolean.
  - name: lateral/bottom boundary conditions
    unit: n/a (pressure m or flux)
    category: lateral_bc
    source_kind: user_provided
    model_input_format: FluxConst / DirEquilRefPatch / PressureConst / Dirichlet / Neumann per patch
    notes: Bottom no-flow by default; sides no-flow by default. At least one outflow boundary (e.g. DirEquilRefPatch
      seepage face) required, otherwise the domain is a closed box with no drainage.
  - name: Solver mode selection (Richards vs Impes vs Diffusion)
    unit: n/a
    category: solver_mode
    source_kind: user_provided
    model_input_format: Solver key
    notes: Defaults to Impes (two-phase) if omitted; integrated surface-subsurface hydrology requires
      Solver=Richards. CLM coupling requires Solver=Richards plus Solver.LSM=CLM (compiled --with-clm;
      defaults to NOT calling CLM).
  - name: terrain-following grid + variable-dz (dz_mult / nzList)
    unit: dimensionless
    category: grid
    source_kind: user_provided
    model_input_format: TerrainFollowingGrid flag + dzScale (ProblemDataZmult)
    notes: With TerrainFollowingGrid=True, dz values are FRACTIONS of total depth summing to 1.0, not
      absolute thicknesses. dz_mult silently rescales vertical cell thickness in accumulation/flux terms.
  - name: PhaseSources / KnownSolution
    unit: n/a
    category: phase_source
    source_kind: user_provided
    model_input_format: PhaseSources.water.Type/GeomNames/Geom.Value; KnownSolution
    notes: Mandatory volumetric source-term keys; absence aborts the run before computation.
outputs:
  primary:
  - name: pressure_head
    unit: m of water
    description: 3D subsurface pressure-head field, the primary solved Richards state across vadose and
      saturated zones (per output timestep).
    validation_rank: 1
    emitted_in: <run>.out.press.*.pfb
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Pressure head is in meters of water; compare against piezometric/observation-well heads at matched
          depth, not raw output indices.
      detrending_options:
      - none
  - name: saturation
    unit: fraction 0-1
    description: 3D subsurface relative saturation field, derived from pressure head via the van Genuchten
      retention curve.
    validation_rank: 2
    emitted_in: <run>.out.satur.*.pfb
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Per nominal layer; physical depths depend on dz_mult.
      detrending_options:
      - none
  - name: soil_moisture
    unit: m3/m3
    description: Volumetric soil moisture per layer = saturation * porosity.
    validation_rank: 4
    emitted_in: derived from <run>.out.satur.*.pfb and porosity
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Match the observation sensor depth to the model layer; volumetric, not saturation fraction.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Reproject from UTM grid with area-weighted remapping when comparing to lat/lon products.
      detrending_options:
      - none
  - name: water_table_depth
    unit: m below surface
    description: Depth to the water table, diagnosed from the saturation >= 0.99 surface (NOT the pressure=0
      contour).
    validation_rank: 3
    emitted_in: derived from <run>.out.satur.*.pfb
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Diagnose from saturation>=0.99 threshold; pressure=0 interpolation gives spurious depths.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Comparable to gridded WTD products after UTM-to-geographic reprojection.
      detrending_options:
      - none
  - name: discharge_at_outlet
    unit: m3/s
    description: Discharge at outlet cells from overland flow velocity * depth (outlet must lie on the
      slope-determined flow path).
    validation_rank: 5
    emitted_in: derived from overland flow output (overlandsum / obf)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Overland-flow routing is physically valid only at hillslope scale (dx ~10-1000 m); basin-scale
          dx (~25 km) gives unrealistically long travel times. Aggregate hourly->daily with MEAN (flux),
          not SUM.
      detrending_options:
      - none
  - name: surface_runoff
    unit: mm/day
    description: Surface runoff flux for downstream routing coupling.
    validation_rank: 6
    emitted_in: derived/aggregated from overland output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - 'Flux: aggregate hourly->daily with MEAN, not SUM (SUM gives 24x). Do not supply both ParFlow
          and VIC runoff for the same basin to a downstream router (double-counting).'
      detrending_options:
      - none
  - name: subsurface_storage
    unit: m3
    description: Domain-integrated subsurface storage = saturation * porosity * cell volume.
    validation_rank: 7
    emitted_in: derived from <run>.out.satur.*.pfb
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Anomaly-comparable to basin-integrated storage-change products (e.g. GRACE-type TWS anomalies);
          use storage change, not absolute storage.
      detrending_options:
      - first_difference
  - name: qflx_evap_tot (CLM total ET)
    unit: mm/s
    description: CLM total evapotranspiration flux (latent-heat-equivalent water flux).
    validation_rank: 8
    emitted_in: <run>.out.clm_output.*.C.pfb
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - CLM-enabled runs only. Flux aggregation uses MEAN.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Comparable to gridded ET products after reprojection.
      detrending_options:
      - none
  - name: eflx_lh_tot (CLM latent heat flux)
    unit: W/m2
    description: CLM latent heat flux (surface energy balance).
    validation_rank: 9
    emitted_in: <run>.out.clm_output.*.C.pfb
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - CLM-enabled runs only; comparable to eddy-covariance flux-tower latent heat.
      detrending_options:
      - none
  - name: swe_out (CLM snow water equivalent)
    unit: mm
    description: CLM snow water equivalent.
    validation_rank: 10
    emitted_in: <run>.out.clm_output.*.C.pfb
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - CLM-enabled runs only; timing of accumulation/ablation matters as much as peak SWE.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_pf_001
  symptom: Flow rates are 24x too high or low compared to expected
  diagnosis: 'ParFlow permeability (K) units are m/hr, not m/day (MODFLOW) or m/s (SI); ParFlow default
    permeability unit is meters per hour. MODFLOW uses m/day (24x larger),

    SI convention uses m/s (3600x smaller). Using m/day values directly in ParFlow gives

    24x too much flow. Using m/s values gives 3600x too li'
  remedy: 'Convert K values to m/hr before writing PFB files; build_subsurface_properties.py; [''Verify
    K units in input data (m/day from MODFLOW, m/s from literature)'', ''Apply conversion: K_m_hr = K_m_day
    / 24.0'', ''Check: typical K_m_hr range is 1e-6 (clay) to 0.03 (sand)'']; build_subsurface_properties.py
    incl'
  severity: silent
- id: dt_pf_002
  symptom: Precipitation floods the model instantly or produces no runoff
  diagnosis: 'CLM precipitation must be in mm/s (= kg/m2/s), not mm/hr or mm/3hr; CLM expects precipitation
    rate in mm/s. CMFD stores mm/hr, MSWX may have mm/3hr.

    Using mm/hr directly in CLM gives 3600x too much precipitation.

    Using mm/3hr gives 10800x too much.

    Conversion: mm/s = mm/hr / 3600.0 = mm/3hr / 10800.'
  remedy: 'Divide precipitation by 3600 when converting from mm/hr; convert_forcing_to_pfb.py; [''Identify
    source precipitation units (mm/hr for CMFD, mm/3hr for MSWX)'', ''Apply: precip_mm_s = precip_mm_hr
    / 3600.0'', ''Sanity check: typical precip rate 0-0.01 mm/s (0-36 mm/hr)'']; convert_forcing_to_pfb.py
    applies'
  severity: silent
- id: dt_pf_003
  symptom: ET unreasonably high or low, thermal regime wrong
  diagnosis: 'CLM radiation units are W/m2, not kJ/m2/day or MJ/m2/day; CLM DSWR and DLWR must be in W/m2.
    WOFOST uses kJ/m2/day (factor of 86.4).

    Some climate datasets use MJ/m2/day (factor of 86400).

    Wrong units cause systematic temperature and ET bias.

    ; [''DSWR_forcing'', ''DLWR_forcing'']'
  remedy: 'Verify radiation is in W/m2 before writing forcing PFB; [''CMFD radiation is in W/m2 -- no
    conversion needed'', ''If converting from kJ/m2/day: divide by 86.4'', ''Sanity check: DSWR 0-1200
    W/m2, DLWR 100-500 W/m2'']; Check CMFD units documentation before processing'
  severity: silent
- id: dt_pf_004
  symptom: Pressure head values make no physical sense
  diagnosis: 'Pressure head units are meters of water, not Pa or kPa; ParFlow solves for pressure head
    h in meters of water.

    Negative h = unsaturated (suction/tension).

    Positive h = saturated (positive pore pressure).

    h = 0 is the water table.

    Do NOT use Pa (h_m = P_Pa / 9810) or kPa (h_m = P_kPa / 9.81).

    ; [''ini'
  remedy: 'Ensure all pressure values are in meters of water; [''If input is Pa: divide by 9810 (rho_w
    * g)'', ''If input is kPa: divide by 9.81'', ''Typical range: -100m (very dry) to +50m (deep saturated)''];
    generate_initial_conditions.py works in meters natively'
  severity: silent
- id: dt_pf_005
  symptom: Soil retention curve is completely wrong, saturation responds incorrectly
  diagnosis: 'van Genuchten alpha units are 1/m in ParFlow, not 1/cm as in many databases; ParFlow uses
    alpha in 1/m. Many soil databases (Rosetta raw output, Carsel & Parrish)

    report alpha in 1/cm. Factor of 100 difference.

    Example: sandy loam alpha = 0.075 (1/cm) = 7.5 (1/m).

    Using 1/cm values directly makes so'
  remedy: 'Multiply alpha by 100 if converting from 1/cm to 1/m; [''Check source database units for alpha'',
    ''If 1/cm: multiply by 100 to get 1/m'', ''Typical 1/m values: 0.5 (clay) to 15 (sand)'']; build_subsurface_properties.py
    uses pre-converted 1/m values'
  severity: silent
- id: dt_pf_006
  symptom: CLM temperature calculations all wrong, freezing in summer
  diagnosis: 'CLM temperature must be in Kelvin (K), not degrees Celsius; CLM expects air temperature
    in Kelvin. Passing Celsius values (e.g., 25)

    makes CLM think it is 25K = -248C. The model may still run (CLM handles cold)

    but produces physically meaningless results.

    Conversion: K = C + 273.15

    CMFD already stor'
  remedy: 'Verify temperature is in Kelvin; [''CMFD: already in K, no conversion'', ''If input is C: add
    273.15'', ''Sanity check: 230-320 K is reasonable range'']'
  severity: silent
- id: dt_pf_007
  symptom: Surface pressure seems fine but humidity calculations are wrong
  diagnosis: 'CLM pressure must be in Pa, not hPa or kPa; CLM expects surface pressure in Pa. hPa (mbar)
    is 100x smaller,

    kPa is 1000x smaller. Wrong pressure affects humidity mixing ratio,

    vapor pressure deficit, and ET calculations.

    CMFD stores Pa -- no conversion needed.

    ; [''Press_forcing'']'
  remedy: 'Verify pressure is in Pa; [''If hPa: multiply by 100'', ''If kPa: multiply by 1000'', ''Sanity
    check: 50000-110000 Pa is reasonable'']'
  severity: silent
- id: dt_pf_010
  symptom: Model crashes with negative saturation or NaN pressure
  diagnosis: 'Unfilled DEM sinks create extreme pressure gradients; DEM depressions (sinks) cause water
    to accumulate in artificial ponds.

    The steep pressure gradients at sink edges cause the nonlinear solver to

    diverge, producing NaN values. Always fill sinks before computing slopes.

    ; [''elevation'', ''slope_x'', '''
  remedy: Fill DEM sinks before computing slopes; build_slopes.py; ['Run build_slopes.py with fill_sinks=True
    (default)', 'Check sinks_filled count in output', 'If still crashing, increase smoothing (--smooth
    3)']; build_slopes.py fills sinks by default
  severity: fatal
- id: dt_pf_011
  symptom: Overland flow goes in wrong direction, water accumulates uphill
  diagnosis: 'Slope sign convention inverted; ParFlow expects positive slope in the positive coordinate
    direction.

    slope_x[j,i] = (elev[j,i+1] - elev[j,i]) / dx.

    If signs are flipped, water flows uphill.

    ; [''slope_x'', ''slope_y'']'
  remedy: Verify slope sign convention matches ParFlow expectations; ['Check that water flows from high
    to low elevation', 'Positive slope_x means elevation increases in +x direction', 'If flow is reversed,
    negate all slope values']
  severity: silent
- id: dt_pf_012
  symptom: Water ponds everywhere, no drainage to outlet
  diagnosis: 'All slopes are zero or below minimum threshold; Zero slopes produce zero overland flow velocity
    (Manning''s equation).

    This happens with coarse DEMs in flat terrain, or when resampling

    smooths out all topographic gradients.

    ; [''slope_x'', ''slope_y'']'
  remedy: Set minimum slope ~0.0001 for flat terrain; build_slopes.py; ['Run with --min_slope 0.0001',
    'Check flat_cells_adjusted count', 'For very flat basins, consider 0.001']
  severity: degraded
- id: dt_pf_013
  symptom: Grid domain is offset from basin, cells don't align with real geography
  diagnosis: 'CRS mismatch: grid origin in meters (UTM) but coordinates in degrees; ParFlow uses Cartesian
    (meter) coordinates. The basin shapefile must be

    projected to UTM before computing grid extent. If lat/lon values are used

    as the origin (e.g., origin_x=116.8), the domain is centered at 116.8 meters

    from th'
  remedy: Always project shapefile to UTM before computing domain; define_parflow_domain.py; ['Check that
    origin_x and origin_y are in meters (> 100000 for UTM)', 'Verify UTM zone matches basin location']
  severity: fatal
- id: dt_pf_014
  symptom: Terrain-following grid crashes with zero or negative cell volume
  diagnosis: 'TFG dz values should be fractions summing to 1.0, not absolute thicknesses; When TerrainFollowingGrid=True,
    ParFlow interprets dz values as fractions

    of the total column depth (DZ in ComputationalGrid). If you pass absolute

    thicknesses (e.g., 20m, 10m) as fractions, cells will have enormous or

    incor'
  remedy: 'Convert absolute dz to fractions: frac_k = dz_k / total_depth; generate_parflow_script.py;
    [''Check sum of dz fractions == 1.0'', ''Each fraction = layer_thickness / total_depth'']'
  severity: fatal
- id: dt_pf_020
  symptom: Nonlinear solver fails to converge, MaxIter reached
  diagnosis: 'Timestep too large for sharp wetting fronts or intense rainfall; Richards equation is highly
    nonlinear across saturation fronts.

    Large timesteps during intense rainfall or rapid infiltration cause

    the Newton solver to diverge. The kinsol.log shows increasing

    iteration counts approaching MaxIter.

    ; ['
  remedy: Reduce timestep or increase MaxIter; ['Reduce TimeStep.Value (e.g., 1.0 -> 0.5 -> 0.1 hours)',
    'Or increase Nonlinear.MaxIter (300 -> 1000)', 'Check kinsol.log for the timestep where convergence
    fails', 'Consider adaptive timestepping if available']
  severity: fatal
- id: dt_pf_021
  symptom: Simulation extremely slow, >100 nonlinear iterations per timestep
  diagnosis: 'Poor initial condition far from equilibrium; If the initial pressure field is far from the
    equilibrium state,

    the solver must work very hard at each timestep to reach convergence.

    This is especially common with uniform initial conditions (e.g., -5m everywhere)

    in complex terrain. Spinup (10-100 year'
  remedy: Improve initial conditions or run spinup; ['Use hydrostatic IC from Reinecke water table depth',
    'Or run a 10-year spinup with recycled forcing', 'Or use MODFLOW steady-state results as initial pressure']
  severity: degraded
- id: dt_pf_022
  symptom: PFMG convergence failure in HYPRE preconditioner
  diagnosis: 'Extreme K contrasts (>6 orders of magnitude) cause ill-conditioning; HYPRE''s PFMG multigrid
    preconditioner struggles with extreme permeability

    contrasts (e.g., clay K=1e-7 next to sand K=0.03 m/hr). The linear system

    becomes ill-conditioned, and PFMG cannot reduce the residual sufficiently.

    ; [''perm'
  remedy: Reduce K contrast or switch preconditioner; ['Cap minimum K at 1e-5 m/hr (accept less accuracy
    in tight clays)', 'Or switch to MGSemi preconditioner', 'Or increase PFMG.MaxIter to 5-10']
  severity: fatal
- id: dt_pf_023
  symptom: 'MPI error: wrong number of processes'
  diagnosis: 'Number of MPI processes must exactly equal P*Q*R topology; ParFlow requires mpirun -np N
    where N = P*Q*R exactly.

    Also, NX must be divisible by P, NY by Q, NZ by R.

    ParFlow does NOT auto-detect or redistribute.

    ; [''Process.Topology.P'', ''Q'', ''R'']'
  remedy: 'Set nprocs = P*Q*R and verify NX/P, NY/Q, NZ/R are integers; [''Choose P, Q, R such that NX%P==0
