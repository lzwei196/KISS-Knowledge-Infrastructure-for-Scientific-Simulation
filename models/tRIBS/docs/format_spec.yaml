model:
  name: "tRIBS"
  version: "5.3.1"
  full_name: "TIN-based Real-time Integrated Basin Simulator"
  domain: "distributed watershed hydrology"
  binary_path: "KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/tRIBS/source/repo/build/tRIBS"
  binary_parallel: "tRIBSpar (MPI)"
  language: "C++17"
  build_system: "CMake >= 3.20"
  repository: "https://github.com/tribshms/tRIBS"
  spatial_representation: "TIN mesh (Delaunay triangulation / Voronoi tessellation)"

inputs:
  control_file:
    format: ".in keyword-value pairs"
    description: "Master configuration file with all parameters and file paths"

  forcing:
    - name: "rainfall_rate"
      unit: "mm/hr"
      valid_range: [0.0, 300.0]
      trap: "dt_001 — common sources give mm/day (÷24) or m/s (×3.6e6)"
    - name: "air_temperature"
      unit: "°C"
      valid_range: [-50.0, 60.0]
      trap: "dt_002 — reanalysis in K, subtract 273.15"
    - name: "relative_humidity"
      unit: "fraction (0–1)"
      valid_range: [0.0, 1.0]
      trap: "dt_003 — many sources give % (0–100), divide by 100"
    - name: "atmospheric_pressure"
      unit: "mb (hPa)"
      valid_range: [300.0, 1100.0]
      trap: "dt_004 — reanalysis in Pa, divide by 100"
    - name: "wind_speed"
      unit: "m/s"
      valid_range: [0.0, 50.0]
    - name: "shortwave_radiation"
      unit: "W/m²"
      valid_range: [0.0, 1400.0]
    - name: "dew_point_temperature"
      unit: "°C"
      valid_range: [-60.0, 40.0]
    - name: "vapor_pressure"
      unit: "mb (hPa)"
      valid_range: [0.0, 80.0]
      trap: "dt_011 — kPa sources need ×10"

  parameters:
    critical:
      - name: "Ks"
        unit: "mm/hr"
        valid_range: [0.1, 100.0]
        description: "Saturated hydraulic conductivity"
        trap: "dt_006 — HWSD gives m/s, multiply by 3.6e6"
      - name: "ThetaS"
        unit: "dimensionless"
        valid_range: [0.3, 0.6]
        description: "Soil porosity"
        trap: "dt_007 — if source is %, divide by 100"
      - name: "ThetaR"
        unit: "dimensionless"
        valid_range: [0.01, 0.15]
        description: "Residual soil moisture"
      - name: "PsiB"
        unit: "mm"
        valid_range: [10.0, 1000.0]
        description: "Air entry (bubbling) pressure"
      - name: "DEPTHTOBEDROCK"
        unit: "mm"
        valid_range: [500.0, 5000.0]
        description: "Depth to bedrock"
        trap: "dt_005 — HWSD gives m, multiply by 1000"
      - name: "SURFACESOILDEPTH"
        unit: "mm"
        valid_range: [50.0, 500.0]
        description: "Surface soil layer depth (default 100)"
        trap: "dt_005"
      - name: "ROOTZONEDEPTH"
        unit: "mm"
        valid_range: [100.0, 3000.0]
        description: "Root zone depth (default 1000)"
        trap: "dt_005"
      - name: "METSTEP"
        unit: "hours"
        valid_range: [0.1, 24.0]
        description: "Meteorological data time step"
        trap: "dt_010 — NOT minutes; setting 60 means 60 hours"
      - name: "LAI"
        unit: "m²/m²"
        valid_range: [0.5, 8.0]
        description: "Leaf area index"
    routing:
      - name: "HILLSLOPE_KSE"
        unit: "m/s"
        valid_range: [0.001, 0.1]
        description: "Hillslope routing velocity"
      - name: "STREAM_KSE"
        unit: "m/s"
        valid_range: [0.5, 5.0]
        description: "Stream routing velocity"
      - name: "Manning_n"
        unit: "dimensionless"
        valid_range: [0.01, 0.1]
        description: "Channel roughness coefficient"

outputs:
  primary:
    - name: "discharge"
      unit: "m³/s"
      valid_range: [0.0, 100000.0]
      file: ".qout (outlet hydrograph)"
    - name: "soil_moisture"
      unit: "dimensionless (0–1)"
      valid_range: [0.0, 1.0]
      file: ".pixel (node time series)"
    - name: "evapotranspiration"
      unit: "mm/hr"
      valid_range: [0.0, 2.0]
      file: ".pixel"
    - name: "water_table_depth"
      unit: "mm"
      valid_range: [0.0, 10000.0]
      file: ".pixel (Nwt variable)"
    - name: "snow_water_equivalent"
      unit: "mm"
      valid_range: [0.0, 5000.0]
      file: ".pixel"
      trap: "dt_012"
  spatial:
    - name: "voronoi_snapshots"
      description: "Spatial output at specified intervals (OPTSPATIAL=1)"
  basin_average:
    - name: "mean_response_file"
      file: ".mrf"
      description: "Basin-averaged water balance variables over time"

execution:
  serial: "./tRIBS <input_file.in>"
  parallel: "mpirun -np <N> ./tRIBSpar <input_file.in>"
  options:
    - flag: "-A"
      description: "Automatic listing of rainfall files"
    - flag: "-K"
      description: "Validate input file"
    - flag: "-V"
      description: "Verbose mode"

known_issues:
  - id: "dt_001"
    description: "Rainfall unit mismatch (mm/day or m/s instead of mm/hr) produces plausible but wrong hydrographs"
  - id: "dt_005"
    description: "Soil depths in m instead of mm cause instant saturation and unrealistic runoff"
  - id: "dt_006"
    description: "Ks in m/s instead of mm/hr causes infiltration failure"
  - id: "dt_008"
    description: "Coordinates in lat/lon degrees instead of UTM meters produce ~1m domain"
  - id: "dt_010"
    description: "METSTEP in minutes instead of hours causes massive data gaps"
