safety:
  hazards:
    - id: "wrong_units_silent_wrong_results"
      kind: "control_semantic"
      description: "Model performs NO unit conversion; inconsistent length/time units (e.g. recharge in mm/day where m/day expected) produce silently wrong heads with no error. [dt_mf6_004]"
      severity: "silent"
    - id: "recharge_is_rate_not_volume"
      kind: "control_semantic"
      description: "RCH RATE is LENGTH/TIME, not a volume; supplying volumetric recharge over-/under-drives the water table without error. [dt_mf6_004, dt_mf6_008]"
      severity: "silent"
    - id: "hdry_sentinel_unmasked"
      kind: "parser_semantic"
      description: "Dry-cell head sentinel HDRY=1e30 (SFR dry-reach DNODATA=-1e30); unmasked in statistics/plots, one dry cell corrupts array means. [dt_mf6_006, dt_mf6_002]"
      severity: "fatal_or_silent"
    - id: "budget_discrepancy_loose_solver"
      kind: "numerical_instability"
      description: "Loose DVCLOSE/RCLOSE yields >0.1% volumetric budget discrepancy (well-posed models <0.01%); results quantitatively unreliable even when convergence is reported. [dt_mf6_003]"
      severity: "silent"
    - id: "simple_cg_solver_on_asymmetric_matrix"
      kind: "numerical_instability"
      description: "SIMPLE/CG solver with Newton formulation or convertible layers oscillates and fails to converge ('ASYMMETRIC COEFFICIENT MATRIX'); GWT advection also requires BICGSTAB. [dt_v003, dt_mf6_009]"
      severity: "fatal"
    - id: "failed_to_converge"
      kind: "numerical_instability"
      description: "Insufficient solver settings or ill-posed problem (conflicting BCs, K contrast >100x, DVCLOSE too tight, initial heads far from solution) cause 'FAILED TO CONVERGE'. [dt_mf6_001]"
      severity: "fatal"
    - id: "strt_below_botm_cells_start_dry"
      kind: "initial_condition_semantic"
      description: "Starting head STRT below cell BOTM makes cells start dry at t=0 and possibly never rewet. [dt_mf6_011]"
      severity: "fatal_or_silent"
    - id: "nonmonotonic_botm"
      kind: "soil_semantic"
      description: "Layer BOTM not monotonically decreasing (thicknesses supplied instead of absolute elevations, or reversed order) aborts at init ('BOTM above TOP'); zero-thickness layers produce NaN heads. [dt_mf6_005]"
      severity: "fatal"
    - id: "riv_rbot_below_cell_botm"
      kind: "control_semantic"
      description: "RIV rbot below cell BOTM aborts with 'RIVER BOTTOM IS LESS THAN CELL BOTTOM'; SFR rtp-rbth must be above BOTM and rgrd>0. [dt_mf6_016]"
      severity: "fatal"
    - id: "rch_into_deep_layer"
      kind: "control_semantic"
      description: "List-based RCH cellid with layer>0 injects recharge into a deep layer instead of the top active cell, leaving the water table unresponsive with no error. [dt_mf6_008]"
      severity: "silent"
    - id: "idomain_all_active"
      kind: "control_semantic"
      description: "IDOMAIN all-1s keeps out-of-basin cells active, diluting recharge and lowering in-basin heads. [dt_mf6_014]"
      severity: "silent"
    - id: "drn_sign_convention"
      kind: "parser_semantic"
      description: "MODFLOW DRN/RIV flux is negative for outflow; exporting un-negated baseflow gives wrong-sign discharge downstream. [dt_mf6_015]"
      severity: "silent"
    - id: "constant_head_went_dry_abort"
      kind: "numerical_instability"
      description: "A constant-head cell that goes dry triggers a hard stop ('CONSTANT-HEAD CELL WENT DRY')."
      severity: "fatal"
  validation_limits:
    - "GWT has no steady-state transport solution; steady concentration must be approximated by long transient runs."
    - "Daily (or coarser) stress-period structure cannot resolve sub-daily flow transients; per-period boundary conditions are piecewise-constant."
    - "Transport uses finite-difference schemes only (UPSTREAM/CENTRAL/TVD); sharp fronts incur numerical dispersion (UPSTREAM) or oscillation (CENTRAL)."
    - "No unsaturated-zone physics unless the optional UZF package is active."
  warnings:
    - "Newton-Raphson (NEWTON UNDER_RELAXATION) is essential for stable unconfined drying/rewetting and requires the MODERATE/COMPLEX solver; without under-relaxation the head can oscillate across the wet/dry threshold."
    - "When VSC or TVK is active, the working K used in the solve is recomputed from the stored pristine user K each timestep and is not the input K array."
    - "Package fill order (NPF before STO before boundaries) into the shared solution matrix is load-bearing; all packages write the same AMAT/RHS."
  assumptions:
    - statement: "The dag describes the MODFLOW 6 GWF flow model (with optional GWT transport and SFR routing) as the primary capability; GWE thermal and PRT particle-tracking models in the framework are out of scope for this binding."
      scope: "model capability coverage"
      source: "MODFLOW 6 framework docs (TM 6-A57) and src/Model directory structure"
      status: "adopted"
    - statement: "Spatial dimensionality is 3-D regardless of structured (DIS) vs unstructured (DISV/DISU) grid choice; the grid-type selection is a model-form option, not a change in dimensionality."
      scope: "boundary.spatial"
      source: "MODFLOW 6 GWF docs (TM 6-A55), CVFD discretization"
      status: "adopted"
    - statement: "Closure is mass-balance (water for GWF, solute mass for GWT); there is no surface energy-balance closure in this binding."
      scope: "boundary.closure"
      source: "MODFLOW 6 GWF/GWT model documentation; OC volumetric budget output"
      status: "adopted"
