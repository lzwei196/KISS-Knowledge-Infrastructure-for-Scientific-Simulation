- id: dt_v012
  symptom: MeTrX solver crashes mid-run with mass balance error. o2_liq_sl reaches tiny negative value
    (~1e-20). 38 cells affected.
  diagnosis: Floating-point rounding artifact in the MeTrX solver produces epsilon-negative O2 concentration.
    The solver's physical bounds check rejects this as an error despite it being numerically insignificant.;
    Not a real physical error. The solver lacks tolerance for machine-epsilon deviations. Typically cr
  remedy: Use nearest-neighbor temporal fill for missing years. Or set balance_check='no' in config (if
    supported). The 17+ complete years before the crash are valid and usable.; ; ['Check how many complete
    years exist before crash', 'Find nearest valid cell in same scenario', 'Append missing years from
    neigh
  severity: degraded
