template_version: "3.5"

# Revised 2026-10-06 for the REAL engine (USDA-ARS K2shell). The previous dag described the Python
# lumped daily surrogate; it is kept as dag.yaml.bak.surrogate.20261006. Influence edges and their
# citations are about the canonical KINEROS2 and were carried over unchanged.

identity:
  model_id: "KINEROS2"
  scientific_reference_version: "KINEROS2 (Kinematic Runoff and Erosion model, USDA-ARS Southwest Watershed Research Center; Woolhiser, Smith & Goodrich 1990; Smith et al. 1995; Goodrich et al. 2012), K2shell version 25-Oct-2019"
  implementation:
    id: "ars-swrc-kineros2-k2shell"
    version: "25-Oct-2019 (ARS-SWRC/KINEROS2 commit f0bbae2a19238fe98d5b42fbc9e55a993bfbba41)"
    provenance: "Fortran 77/90; official USDA-ARS source (github.com/ARS-SWRC/KINEROS2) compiled with gfortran 13.3; output matches the official ARS Windows k2_x64.exe to the 6th-7th digit on both ARS sample cases. A separate Python lumped daily SURROGATE that predates this engine is NOT this implementation and its results are not KINEROS2 results."
    surrogate_not_this_model: "tools/run_kineros2.py -- Python lumped daily Green-Ampt + two-reservoir stand-in (Hamon PET); kept for history only"
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "MIT (ARS-SWRC/KINEROS2 LICENSE); USDA-ARS public software"
  repo_url: "https://github.com/ARS-SWRC/KINEROS2"

boundary:
  scope_in:
    - "Single storm events at minute time steps on small watersheds (hectares to a few km2)"
    - "Rainfall interception (depth + canopy cover) and multi-gage rainfall interpolation to each element"
    - "Infiltration with the Smith-Parlange 3-parameter / Green-Ampt family (Brooks-Corey soil), one or two soil layers, small-scale Ks variability (CV), redistribution during rain hiatus"
    - "Infiltration-excess (Hortonian) overland flow on cascades of planes by 1-D kinematic wave"
    - "Channel flow by 1-D kinematic wave in trapezoidal (simple or compound) channels with transmission losses into the bed (Woolhiser effective wetted perimeter option)"
    - "Detention ponds (storage-discharge rating, seepage), circular conduits, urban mixed-surface elements, flow injection, adders and diverters"
    - "Rain splash and hydraulic erosion, deposition and transport of up to 5 particle classes (Smith method; RHEM and DWEPP alternatives)"
  scope_out:
    - "Continuous simulation, evapotranspiration and between-storm soil moisture accounting (antecedent state is an input)"
    - "Snow, frozen soil and groundwater / baseflow dynamics (a constant channel baseflow may be specified)"
    - "Saturation-excess and subsurface stormflow generation"
    - "Backwater, diffusive or dynamic-wave channel hydraulics"
    - "Automatic watershed discretisation from a DEM (done outside the model, e.g. AGWA)"
  spatial: "distributed: cascade of 1-D elements (planes, channels, ponds, pipes, urban)"
  temporal: "event, minutes (user step; optional Courant-adapted compute step)"
  closure: "mass-balance"
  notes: "Event water volume balance: rainfall = interception + infiltration (planes, channel beds, ponds) + storage on the surface and in channels at the end + outflow at the last element; the engine reports the relative error (< 1 percent on both ARS samples). Sediment mass balance per element (in, deposited, soil loss, out). No energy balance."

inputs:
  forcing:
    - category: "atmospheric"
      name: "rainfall_depth_cumulative"
      unit: "mm (UNITS=METRIC) or in (UNITS=ENGLISH) vs minutes"
      source_kind: "forcing"
      model_input_format: "rainfall file: one block per rain gage with N breakpoints of TIME (min) and cumulative DEPTH, or INTENSITY (mm/hr or in/hr); optional gage X, Y and SAT"
      notes: "Breakpoint data from recording gages at minute resolution. Depth is read in the parameter file's unit system with no conversion. Intensity is interpolated in space from the three gages enclosing each element centroid."
  parameters:
    - category: "infiltration"
      name: "KS"
      unit: "mm/hr or in/hr"
      source_kind: "calibrated"
      model_input_format: "per pervious element (1 or 2 layers); global multiplier"
      notes: "Saturated hydraulic conductivity; zero = impervious. Rawls et al. 1982 class values are a starting point; ARS WG11 uses 0.40-0.52 in/hr on planes with a 0.5 multiplier."
    - category: "infiltration"
      name: "G"
      unit: "mm or in"
      source_kind: "calibrated"
      model_input_format: "per pervious element (1 or 2 layers); global multiplier"
      notes: "Net capillary drive (Brooks-Corey integral); zero = constant infiltration at KS. Manual Table 1 (Rawls 1982) gives 5-41 cm by texture."
    - category: "infiltration"
      name: "DIST"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "per pervious element"
      notes: "Brooks-Corey pore size distribution index; used for redistribution; must be <= 1.5."
    - category: "infiltration"
      name: "POR"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "per pervious element"
      notes: "Soil porosity; with SAT and SMAX sets the initial moisture deficit."
    - category: "infiltration"
      name: "ROCK"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "per pervious element"
      notes: "Volumetric rock fraction; reduces storage. Texture-based KS should be multiplied by (1 - ROCK)."
    - category: "infiltration"
      name: "CV"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "per pervious element; global multiplier"
      notes: "Coefficient of variation of KS within an element (log-normal small-scale variability)."
    - category: "overland_flow"
      name: "MANNING"
      unit: "s m^-1/3 (Manning n) or Chezy C"
      source_kind: "calibrated"
      model_input_format: "per plane and channel; global multiplier"
      notes: "Hydraulic roughness of planes and channels; second calibration lever after KS."
    - category: "geometry"
      name: "element_geometry"
      unit: "m or ft; slope m/m"
      source_kind: "dataset_lookup"
      model_input_format: "LENGTH, WIDTH (or AREA), SLOPE per plane; LENGTH, WIDTH, SLOPE, SS1, SS2 per channel; UPSTREAM/LATERAL topology"
      notes: "From DEM discretisation (AGWA) or survey. CLEN (global) sets the spatial resolution."
    - category: "interception"
      name: "INTER"
      unit: "mm or in"
      source_kind: "dataset_lookup"
      model_input_format: "per plane, with CANOPY fraction; global multiplier"
      notes: "Interception storage depth filled at a rate reduced by the canopy cover fraction."
    - category: "erosion"
      name: "sediment_parameters"
      unit: "SPLASH, COH dimensionless; DIAMS mm or in; DENSITY g/cc; FRACT fraction"
      source_kind: "calibrated"
      model_input_format: "GLOBAL DIAMS/DENSITY/TEMP; per plane SPLASH, COH, FRACT; per channel COH, FRACT; optional PAV"
      notes: "Smith method by default; RHEM or DWEPP selected per element by their own tags."
  initial_conditions:
    - category: "soil_state"
      name: "SAT"
      unit: "dimensionless (relative saturation of pore space)"
      source_kind: "user_provided"
      model_input_format: "per element (SA), per rain gage (SAT, interpolated, overrides element SA) or global SAT"
      notes: "Antecedent soil moisture; the most sensitive input after rainfall and KS for most flow responses. The engine stops if a pervious element has none."
    - category: "pond_state"
      name: "STORAGE"
      unit: "m3 or ft3"
      source_kind: "user_provided"
      model_input_format: "per pond element"
      notes: "Initial pond storage volume (default 0)."
  boundary_conditions:
    - category: "inflow"
      name: "injected_inflow"
      unit: "m3/s or ft3/s vs minutes (+ optional sediment concentrations)"
      source_kind: "user_provided"
      model_input_format: "INJECT element with a data file"
      notes: "Measured flow or another model's output entering the cascade."
    - category: "inflow"
      name: "QB"
      unit: "m3/s or ft3/s"
      source_kind: "user_provided"
      model_input_format: "per channel"
      notes: "Constant channel baseflow at the channel outlet."

processes:
  modules:
    - name: "RainfallInterpolation"
      role: "process_solver"
      brief: "Interpolates gage accumulated depth to each element centroid from the three enclosing gages (or two / nearest), giving element rainfall intensity per step; also interpolates gage SAT."
    - name: "Interception"
      role: "process_solver"
      brief: "Reduces rainfall by the canopy fraction until the interception depth is filled."
    - name: "SmithParlangeInfiltration"
      role: "process_solver"
      brief: "Computes infiltration capacity from KS, G, DIST, POR, ROCK and the moisture deficit (one or two layers, small-scale KS variability via CV), including rewetting and redistribution during rainfall hiatus; acts on rain and on water in transit."
    - name: "PlaneKinematicWave"
      role: "process_solver"
      brief: "Solves 1-D kinematic wave overland flow on each plane (finite differences), with micro-topography and laminar/turbulent options, producing plane outflow to the receiving element."
    - name: "ChannelKinematicWave"
      role: "process_solver"
      brief: "Routes upstream and lateral inflows through trapezoidal (or compound) channels by 1-D kinematic wave, with bed infiltration (transmission losses)."
    - name: "PondRouting"
      role: "process_solver"
      brief: "Level-pool routing through a storage-discharge-surface rating table with seepage."
    - name: "ErosionSedimentTransport"
      role: "process_solver"
      brief: "Rain splash and hydraulic erosion, deposition and transport by particle class on planes and channels; sediment routed through all elements."
    - name: "VolumeAccounting"
      role: "integrator"
      brief: "Accumulates element and event water/sediment balances and the outlet hydrograph."
  internal_edges:
    - from: "rainfall_depth_cumulative"
      to: "RainfallInterpolation"
      kind: "consumes_input"
      brief: "Gage breakpoints are interpolated to each element."
    - from: "RainfallInterpolation"
      to: "Interception"
      kind: "invokes"
      brief: "Element rainfall first fills interception storage."
    - from: "Interception"
      to: "SmithParlangeInfiltration"
      kind: "invokes"
      brief: "Net rainfall reaches the soil surface."
    - from: "SmithParlangeInfiltration"
      to: "soil_moisture_deficit"
      kind: "writes_state"
      brief: "Infiltrated depth updates the wetting front and the remaining deficit."
    - from: "SmithParlangeInfiltration"
      to: "PlaneKinematicWave"
      kind: "invokes"
      brief: "Rainfall excess becomes overland flow."
    - from: "PlaneKinematicWave"
      to: "surface_water_depth"
      kind: "writes_state"
      brief: "Flow depth along each plane."
    - from: "PlaneKinematicWave"
      to: "ChannelKinematicWave"
      kind: "invokes"
      brief: "Plane outflow enters channels as lateral or upstream inflow."
    - from: "ChannelKinematicWave"
      to: "PondRouting"
      kind: "invokes"
      brief: "Channel outflow may pass through a pond."
    - from: "PlaneKinematicWave"
      to: "ErosionSedimentTransport"
      kind: "invokes"
      brief: "Flow depth/velocity and rain drive erosion and transport."
    - from: "ChannelKinematicWave"
      to: "VolumeAccounting"
      kind: "invokes"
      brief: "Element outflows and losses are accumulated."
    - from: "VolumeAccounting"
      to: "Outputs"
      kind: "produces_output"
      brief: "Outlet hydrograph, event volumes, peaks and sediment yield."

states:
  variables:
    - name: "surface_water_depth"
      unit: "m or ft"
      role: "prognostic"
    - name: "soil_moisture_deficit"
      unit: "dimensionless"
      role: "prognostic"
    - name: "cumulative_infiltration"
      unit: "m or ft"
      role: "accumulator"
    - name: "channel_flow_area"
      unit: "m2 or ft2"
      role: "prognostic"
    - name: "pond_storage"
      unit: "m3 or ft3"
      role: "prognostic"
    - name: "suspended_sediment_concentration"
      unit: "m3/m3 by particle class"
      role: "prognostic"
  provenance: "structural"

outputs:
  - var: "discharge"
    validation_rank: 1
    unit: "m3/s"
    description: "Surface water discharge (stream / channel flow) at the watershed outlet element, as an event hydrograph at the user time step in minutes."
    emitted_in: "output report hydrograph table for elements with PRINT=2 (cu m/s METRIC, cu ft/s ENGLISH) or the PRINT=3 CSV; peak on the 'Peak flow' line"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Event scale: compare one storm at minute steps against a flume/weir hydrograph, not daily gauge flow."
            - "Put observed and simulated series on the same clock (rain-file origin vs gauge local time)."
            - "Compare in absolute units (m3/s): a gauge's depth series uses its nominal drainage area, which may differ from the modelled contributing area."
            - "Peaks from the compute steps exceed the dt-sampled table maximum slightly; report the engine's peak line for peaks."
      detrending_options:
        - "none"
  - var: "runoff_volume"
    validation_rank: 2
    unit: "m3"
    description: "Event total surface runoff water volume leaving the watershed outlet channel."
    emitted_in: "output report 'Event Volume Summary' Outflow (cu m or cu ft; depth over the modelled area in mm or in)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "One value per storm; skill needs several events."
            - "Use volume, not depth, when the gauge's nominal area differs from the modelled area."
      detrending_options:
        - "none"
  - var: "peak_discharge"
    validation_rank: 3
    unit: "m3/s"
    description: "Event peak surface water discharge (stream / channel flow) at the watershed outlet and its time."
    emitted_in: "output report 'Peak flow = ... at ... min' line of the outlet element"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "One value per storm; report time-to-peak error alongside."
      detrending_options:
        - "none"
  - var: "sediment_yield"
    validation_rank: 4
    unit: "t/ha"
    description: "Event sediment yield: eroded soil and sediment mass delivered at the watershed outlet per unit watershed area."
    emitted_in: "output report 'Sediment yield =' (tons/ha METRIC, short tons/ac ENGLISH) and by particle class; only with sediment routing on"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Needs measured event sediment (flume samplers or pond surveys); ENGLISH runs report short tons per acre (x2.2417 to t/ha)."
      detrending_options:
        - "none"
  - var: "infiltration"
    unit: "mm"
    description: "Event infiltration depth into the soil of planes and into channel beds (transmission losses), over the watershed area."
    emitted_in: "output report 'Event Volume Summary' Plane/Channel infiltration and the tabular element summary"
  - var: "sediment_discharge"
    unit: "kg/s"
    description: "Total suspended sediment discharge in water leaving an element, per user time step."
    emitted_in: "hydrograph table column (PRINT=2) or PRINT=3 CSV with per-class columns (kg/s METRIC, lb/s ENGLISH)"

influence:
  edges:
    - from: "KS"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "infiltration-excess runoff volume and peak"
      citations:
        - "hantush2005_kineros2_uncertainty_sensitivity"
        - "alqurashi2008_kineros2_oman_arid"
        - "korgaonkar2020_kineros2_starvars_gsa"
        - "goodrich2012_kineros2_agwa_calibration"
        - "kennedy2013_kineros2_residential_runoff"
    - from: "G"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "net capillary drive; second only to Ks for flow-discharge uncertainty"
      citations:
        - "hantush2005_kineros2_uncertainty_sensitivity"
        - "alqurashi2008_kineros2_oman_arid"
    - from: "SAT"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "initial relative saturation; most sensitive for most flow responses except peak arrival time"
      citations:
        - "hantush2005_kineros2_uncertainty_sensitivity"
    - from: "rainfall_depth_cumulative"
      to: "discharge"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      applicability: "rainfall was the single most sensitive factor in STAR-VARS GSA; controls peak flow and reorders all other parameter rankings"
      citations:
        - "korgaonkar2020_kineros2_starvars_gsa"
    - from: "MANNING"
      to: "peak_discharge"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "overland/channel roughness shapes peak and timing more than volume"
      citations:
        - "alqurashi2008_kineros2_oman_arid"
        - "goodrich2012_kineros2_agwa_calibration"
  citation_index:
    hantush2005_kineros2_uncertainty_sensitivity:
      short_citation: "Hantush & Kalin 2005"
      doi: "10.1623/hysj.2005.50.6.1151"
      note: "Monte Carlo uncertainty/sensitivity of KINEROS2 runoff and sediment in a small agricultural watershed; Ks, net capillary drive, and initial relative saturation dominate flow; median particle size and cohesion dominate sediment."
    alqurashi2008_kineros2_oman_arid:
      short_citation: "Al-Qurashi et al. 2008"
      doi: "10.1016/j.jhydrol.2008.03.006"
      note: "27-event Monte Carlo SA (20,000 runs/event, 11 params) in an arid Oman catchment; Ks most sensitive, then net capillary drive G and overland Manning's n."
    korgaonkar2020_kineros2_starvars_gsa:
      short_citation: "Korgaonkar et al. 2020"
      doi: "10.1016/j.envsoft.2020.104814"
      note: "STAR-VARS variance-based global SA of 15-17 KINEROS2 (green-infrastructure) parameters; rainfall most sensitive, then Ks, rock fraction, surface roughness."
    goodrich2012_kineros2_agwa_calibration:
      short_citation: "Goodrich et al. 2012"
      doi: "10.13031/2013.42072"
      note: "KINEROS2/AGWA use, calibration and validation; Ks and Manning's roughness identified as the dominant calibration parameters for runoff peaks and volumes."
    kennedy2013_kineros2_residential_runoff:
      short_citation: "Kennedy et al. 2013"
      doi: "10.1061/(ASCE)HE.1943-5584.0000655"
      note: "KINEROS2 residential-development runoff study; a 53% decrease in Ks of pervious areas accounted for ~17% of modeled runoff increase, confirming Ks as the dominant runoff control."

safety:
  hazards:
    - id: "rain_units_follow_parameter_file"
      kind: "weather_file_semantic"
      description: "Rainfall depths are read in the parameter file's unit system (mm METRIC, inches ENGLISH) with no conversion; the other unit gives 25.4x too little or too much rain."
      severity: "silent"
    - id: "gage_sat_overrides_element_sa"
      kind: "initial_condition_semantic"
      description: "When rain gages carry SAT, interpolated gage saturation replaces every element's own SA; edits to element SA then have no effect."
      severity: "silent"
    - id: "gridded_rain_smears_intensity"
      kind: "weather_file_semantic"
      description: "Hourly or 3-hourly grid-cell rainfall averages convective bursts away; infiltration-excess runoff is strongly under-predicted."
      severity: "degraded"
    - id: "depth_vs_area_mismatch"
      kind: "parser_semantic"
      description: "Event depths are over the modelled area; gauge depth series use the gauge's nominal area. Comparing depths when the two areas differ biases volume."
      severity: "silent"
    - id: "unreferenced_element_water_lost"
      kind: "control_semantic"
      description: "An element that no downstream element lists as upstream or lateral contributes nothing to the outlet; the event outflow is the last element only."
      severity: "silent"
    - id: "user_step_violates_courant"
      kind: "numerical_instability"
      description: "Without Courant adjustment the user step is used for computation; a step much larger than the reported 100% level damps and distorts hydrographs."
      severity: "degraded"
    - id: "texture_ks_vs_field_ks"
      kind: "soil_semantic"
      description: "Texture-class Ks (Rawls 1982) can be several times below field-calibrated values in rocky semi-arid soils, over-predicting runoff."
      severity: "degraded"
  validation_limits:
    - "Event model for small watersheds; not for daily or continuous simulation of large basins."
    - "Single-event comparisons are in-sample when parameters or multipliers were set on that event."
    - "Hortonian runoff only; catchments dominated by saturation excess or baseflow are outside scope."
  warnings:
    - "Initial relative saturation must be supplied per event; there is no spin-up."
    - "CLEN-based 'numerical increment too large' and channel 'rating exceeded' messages appear on correct runs (both ARS samples); they are not failures."
  assumptions:
    - statement: "The runnable entity is the official USDA-ARS KINEROS2 K2shell program; the Python lumped daily surrogate is a different model and is excluded."
      scope: "whole model"
      source: "ARS-SWRC/KINEROS2 source and ARS sample reproduction (2026-10-06)"
      status: "adopted"
    - statement: "Published KINEROS2 sensitivity analyses govern the influence edges."
      scope: "influence edges"
      source: "Hantush & Kalin 2005; Al-Qurashi et al. 2008; Korgaonkar et al. 2020; Goodrich et al. 2012"
      status: "adopted"
