  severity: silent
- id: dt_v001
  symptom: 'OSError: [Errno 22] Invalid argument when reading .hds or .cbc binary files with FloPy'
  diagnosis: 'FloPy HeadFile/CellBudgetFile defaults to single precision but MODFLOW 6 writes double precision;
    MODFLOW 6 writes binary output in double precision by default. FloPy''s HeadFile() and CellBudgetFile()
