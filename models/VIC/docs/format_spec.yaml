# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: VIC
  language: c
  implementation:
    id: vic-classic-510
    version: 5.1.0
    provenance: C; UW-Hydro / Computational Hydrology Group VIC-5.1.0 classic driver (per-cell ASCII forcing
      and flux output).
  scientific_reference_version: VIC-5 (Hamman et al. 2018, GMD; original Liang et al. 1994 JGR formulation)
inputs:
  forcing:
  - name: AIR_TEMP
    unit: degC
    category: atmospheric
    source_kind: forcing
    model_input_format: per-cell ASCII forcing file column at FORCE_STEPS_PER_DAY cadence (classic driver)
    notes: Subgrid-band lapse uses default LAPSE_RATE = -0.0065 C/m unless overridden.
  - name: PREC
    unit: mm per forcing step
    category: atmospheric
    source_kind: forcing
    model_input_format: per-cell ASCII forcing file column at FORCE_STEPS_PER_DAY cadence
    notes: Total precipitation (rain + snow); rain/snow split inside the model. GAUGE_HEIGHT default 1.0
      m governs optional undercatch correction.
  - name: PRESSURE
    unit: kPa
    category: atmospheric
    source_kind: forcing
    model_input_format: per-cell ASCII forcing file column
  - name: SWDOWN
    unit: W/m^2
    category: radiation
    source_kind: forcing
    model_input_format: per-cell ASCII forcing file column
  - name: LWDOWN
    unit: W/m^2
    category: radiation
    source_kind: forcing
    model_input_format: per-cell ASCII forcing file column
  - name: VP
    unit: kPa
    category: atmospheric
    source_kind: forcing
    model_input_format: per-cell ASCII forcing file column
  - name: WIND
    unit: m/s
    category: atmospheric
    source_kind: forcing
    model_input_format: per-cell ASCII forcing file column
  - name: LAI (optional time-varying)
    unit: m2/m2
    category: vegetation
    source_kind: forcing
    model_input_format: per-cell forcing column when VEGPARAM_LAI / daily LAI forcing enabled
    notes: When inactive, LAI is read as a static monthly schedule from the vegetation parameter / library
      file.
  - name: CO2 (optional, CARBON mode)
    unit: ppm
    category: atmospheric
    source_kind: forcing
    model_input_format: per-cell forcing column when CARBON option is on
    notes: Drives the photosynthesis module (Ci, GPP).
  parameters:
  - name: binfilt (b_infilt)
    unit: '-'
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: soil parameter file row
    notes: Shape parameter of the VIC subgrid infiltration-capacity distribution; main lever for the surface-runoff
      partition.
  - name: Ds
    unit: fraction of Dsmax
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: soil parameter file row
  - name: Dsmax
    unit: mm/day
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: soil parameter file row
  - name: Ws
    unit: fraction of max soil moisture
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: soil parameter file row
  - name: c (baseflow curve exponent)
    unit: '-'
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: soil parameter file row
  - name: expt (Brooks-Corey exponent per layer)
    unit: '-'
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: soil parameter file row
  - name: Ksat (saturated hydraulic conductivity per layer)
    unit: mm/day
    category: soil_hydraulic
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: phi_s (soil moisture diffusion per layer)
    unit: mm/mm
    category: soil_hydraulic
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: depth (layer thickness per soil layer)
    unit: m
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: soil parameter file row
    notes: MAX_LAYERS = 3 is a compile-time cap (vic_def.h); requesting more than 3 layers silently fails.
      Calibration constraint d3 > d2 is conventional but enforced by the calibration tool, not the model.
  - name: bubble (bubbling pressure per layer)
    unit: cm
    category: soil_hydraulic
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: quartz (per layer)
    unit: '-'
    category: soil_thermal
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: bulk_density (per layer)
    unit: kg/m^3
    category: soil_thermal
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: soil_density (per layer)
    unit: kg/m^3
    category: soil_thermal
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: Wcr_FRACT (critical-point soil moisture fraction per layer)
    unit: fraction
    category: soil_hydraulic
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: Wpwp_FRACT (wilting-point soil moisture fraction per layer)
    unit: fraction
    category: soil_hydraulic
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: resid_moist (residual moisture fraction per layer)
    unit: fraction
    category: soil_hydraulic
    source_kind: default
    model_input_format: soil parameter file row
    notes: Default SOIL_RESID_MOIST = 0.0 (initialize_parameters.c); layers drain to bone-dry if not explicitly
      overridden.
  - name: avg_T (long-term mean soil temperature at damping depth)
    unit: degC
    category: soil_thermal
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: dp (soil thermal damping depth)
    unit: m
    category: soil_thermal
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: rough (bare-soil surface roughness)
    unit: m
    category: soil_aerodynamic
    source_kind: default
    model_input_format: soil parameter file row
  - name: snow_rough (snowpack surface roughness)
    unit: m
    category: soil_aerodynamic
    source_kind: default
    model_input_format: soil parameter file row
  - name: annual_prec (long-term mean annual precipitation)
    unit: mm
    category: climatology
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: elev / lat / lon / off_gmt
    unit: m, deg, deg, hours
    category: geometry
    source_kind: dataset_lookup
    model_input_format: soil parameter file row
  - name: Nveg / veg_class / Cv
    unit: count, id, fraction
    category: vegetation_structure
    source_kind: dataset_lookup
    model_input_format: vegetation parameter file
    notes: Cv values across all tiles must sum to 1 over the cell.
  - name: root_depth / root_fract (per root zone)
    unit: m, fraction
    category: vegetation_structure
    source_kind: calibrated
    model_input_format: vegetation parameter file
    notes: Root-fraction sums may exceed 1; the model auto-normalizes per tile (benign warning).
  - name: LAI / FCANOPY / ALBEDO (monthly schedule)
    unit: m2/m2, fraction, fraction
    category: vegetation_canopy
    source_kind: dataset_lookup
    model_input_format: vegetation parameter or vegetation library file (per veg_class)
    notes: Used when LAI_SRC=FROM_VEGPARAM and time-varying forcing of these fields is disabled.
  - name: displacement / roughness / trunk_ratio / rad_atten / wind_atten / rmin / Rgl / overstory
    unit: varies
    category: vegetation_aerodynamic
    source_kind: dataset_lookup
    model_input_format: vegetation library file (per veg_class)
    notes: 'Defaults from vic_def.h when veg library omits a field: trunk_ratio=0.2, rad_atten=0.5, wind_atten=0.5.'
  - name: sigma_slope / lag_one / fetch
    unit: -, -, m
    category: blowing_snow
    source_kind: dataset_lookup
    model_input_format: vegetation parameter file (required when BLOWING_SNOW enabled)
  - name: lake parameters (basin depth/area curve, depth_in, mindepth, maxdepth, ...)
    unit: varies
    category: lake
    source_kind: dataset_lookup
    model_input_format: lake parameter file (required when LAKES enabled)
  initial_conditions:
  - name: init_moist (initial layer soil moisture)
    unit: mm
    category: soil_state
    source_kind: user_provided
    model_input_format: soil parameter file column
  - name: state file (soil moisture and ice per layer; soil-node temperatures; snowpack SWE/temperatures/density/cold-content;
      canopy snow and dew; lake state; optional carbon pools)
    unit: varies
    category: warm_start
    source_kind: user_provided
    model_input_format: VIC state file (binary or ASCII per options)
    notes: Lake areai is restarted from the previous step's new_ice_area; if new_ice_area is not saved,
      the restart silently begins with areai=0.
  boundary_conditions:
  - name: Lower soil thermal boundary
    unit: degC
    category: lower_thermal
    source_kind: dataset_lookup
    model_input_format: soil parameter file (avg_T at damping depth dp)
  - name: AreaFract / Elevation / Pfactor per band
    unit: fraction, m, fraction
    category: elevation_band
    source_kind: user_provided
    model_input_format: snow-band file (required only when number of snow bands > 1)
    notes: AreaFract and Pfactor each must sum to 1 across bands within a cell.
  - name: FULL_ENERGY (water+energy vs water-only mode)
    unit: boolean
    category: structural_option
    source_kind: user_provided
    model_input_format: global parameter file flag
  - name: FROZEN_SOIL (enable frozen-soil and permafrost module)
    unit: boolean
    category: structural_option
    source_kind: user_provided
    model_input_format: global parameter file flag
    notes: Must be a TRUE/FALSE token, not a path.
  - name: QUICK_FLUX (analytical vs finite-difference soil thermal solver)
    unit: boolean
    category: structural_option
    source_kind: user_provided
    model_input_format: global parameter file flag
  - name: LAKES / CARBON / BLOWING / SPATIAL_FROST / SPATIAL_SNOW / ORGANIC_FRACT
    unit: boolean
    category: structural_option
    source_kind: user_provided
    model_input_format: global parameter file flags (and supporting parameter files when on)
  - name: LAI_SRC (FROM_VEGPARAM | FROM_VEGLIB | FROM_VEGHIST)
    unit: enum
    category: structural_option
    source_kind: user_provided
    model_input_format: global parameter file
  - name: MODEL_STEPS_PER_DAY / FORCE_STEPS_PER_DAY / SNOW_STEPS_PER_DAY / RUNOFF_STEPS_PER_DAY
    unit: steps/day
    category: timestep_control
    source_kind: user_provided
    model_input_format: global parameter file
    notes: Bounded by MIN_SUBDAILY_STEPS_PER_DAY=4 and MAX_SUBDAILY_STEPS_PER_DAY=1440 (vic_def.h).
  - name: STARTYEAR/STARTMONTH/STARTDAY and ENDYEAR/ENDMONTH/ENDDAY
    unit: date
    category: simulation_window
    source_kind: user_provided
    model_input_format: global parameter file
outputs:
  primary:
  - name: OUT_RUNOFF
    unit: mm
    description: Surface runoff generated by the variable infiltration capacity partition (per timestep
      total).
    validation_rank: 2
    emitted_in: per-cell ASCII flux file (classic driver); column position controlled by OUTVAR list in
      the global parameter file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - VIC has no internal routing; gauge streamflow requires post-hoc routing of OUT_RUNOFF+OUT_BASEFLOW
          before comparison.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats: []
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Cells are independent; aggregating to basin scale requires routing to be meaningful for hydrograph
          comparisons.
      detrending_options:
      - none
      - first_difference
      - linear_residual
  - name: OUT_BASEFLOW
    unit: mm
    description: Subsurface drainage from the bottom soil layer via the ARNO / non-linear baseflow function.
    validation_rank: 6
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Baseflow comparison is typically against hydrograph separation of observed streamflow; direct
          gauge observations of baseflow are rare.
      detrending_options:
      - none
      - linear_residual
  - name: OUT_DISCHARGE
    unit: m^3/s
    description: River discharge from the RVIC routing extension (rout_rvic), available only in the image
      driver built with ROUT_RVIC; the classic driver used here does not write it.
    validation_rank: 1
    emitted_in: image-driver history output (ROUT_RVIC builds only); not in the classic per-cell ASCII
      flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - timing_accuracy is the WINDOWED peak-day error day_bias = |day of the simulated maximum within
          ±30 d of the observed annual peak − observed annual peak day| (days, mean over the declared
          years); it is not the plain annual-argmax difference. The plain annual-argmax error is reported
          beside it as day_bias_annual_argmax, and years whose simulated annual peak lies outside the
          ±30 d window are flagged (peak_outside_window, n_peak_outside_window). Only day_bias enters
          the calibration objective.
        - In this KI the discharge series is produced by the external Lohmann routing binary (model/route_1.0/src/rout,
          routed .day file), not by VIC itself.
        - The classic driver used here does not produce OUT_DISCHARGE; basin-scale discharge against a
          gauge requires an external routing model (e.g. CaMa-Flood).
      detrending_options:
      - none
  - name: OUT_EVAP
    unit: mm
    description: Total evapotranspiration (canopy interception + transpiration + bare soil + sublimation,
      per timestep).
    validation_rank: 3
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance comparison requires conversion between mm and W/m^2 and energy-balance closure
          adjustment of the observation.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Remote-sensing ET products carry their own model assumptions; not an independent benchmark in
          the strict sense.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
      - linear_residual
  - name: OUT_SOIL_MOIST
    unit: mm
    description: Per-layer soil moisture (liquid + ice) integrated over the layer.
    validation_rank: 7
    emitted_in: per-cell ASCII flux file (one column per soil layer)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - In-situ probes measure volumetric moisture over a narrow depth range; convert VIC layer-integrated
          mm to volumetric and align depths.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - ranking_quality
        determining_metric: csi
        caveats:
        - Satellite soil moisture senses only the top ~5 cm; map to VIC top-layer with a representative-depth
          caveat.
      detrending_options:
      - none
      - first_difference
  - name: OUT_SWE
    unit: mm
    description: Total snow water equivalent of the ground snowpack.
    validation_rank: 4
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: pbias
        caveats:
        - SNOTEL / pillow observations are point measurements; subgrid heterogeneity within the VIC cell
          is not resolved.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats: []
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - timing_accuracy
        determining_metric: csi
        caveats:
        - Passive-microwave SWE retrievals saturate above ~150-200 mm and degrade in forested cells.
      detrending_options:
      - none
  - name: OUT_SNOW_MELT
    unit: mm
    description: Snowmelt flux from the ground snowpack.
    validation_rank: 8
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Direct melt observations are scarce; lysimeter or differenced-SWE proxies typical.
      detrending_options:
      - none
  - name: OUT_SOIL_TEMP
    unit: degC
    description: Soil temperature per layer (and OUT_SOIL_TNODE per thermal node).
    validation_rank: 9
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Match observation depth to the VIC layer or interpolate between nearest thermal nodes.
      detrending_options:
      - none
  - name: OUT_LATENT
    unit: W/m^2
    description: Surface latent heat flux.
    validation_rank: 10
    emitted_in: per-cell ASCII flux file (full-energy mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance non-closure typically requires Bowen-ratio adjustment of the observation.
      detrending_options:
      - none
  - name: OUT_SENSIBLE
    unit: W/m^2
    description: Surface sensible heat flux.
    validation_rank: 11
    emitted_in: per-cell ASCII flux file (full-energy mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  - name: OUT_R_NET
    unit: W/m^2
    description: Net all-wave radiation at the surface.
    validation_rank: 12
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  - name: OUT_ALBEDO
    unit: fraction
    description: Surface broadband albedo (snow + canopy + bare soil composite).
    validation_rank: 13
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Satellite albedo (MODIS MCD43) is narrow-to-broadband; account for spectral conversion.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Flux-tower pyranometer pairs measure broadband albedo at point scale; subgrid heterogeneity
          within the VIC cell is not resolved.
      detrending_options:
      - none
  - name: OUT_ZWT
    unit: cm
    description: 'Water table position (lowest unsaturated soil layer), positive upward: negative values
      are below the soil surface, 0 at the surface.'
    validation_rank: 5
    emitted_in: per-cell ASCII flux file
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - VIC water table is derived from layer moisture; comparison to well levels is qualitative.
      detrending_options:
      - none
      - linear_residual
  - name: OUT_GPP
    unit: g C/m^2/day
    description: Vegetation gross primary production from the optional CARBON module.
    validation_rank: 14
    emitted_in: per-cell ASCII flux file (CARBON mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance NEE partitioning into GPP/Reco carries partitioning uncertainty.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats: []
      detrending_options:
      - none
  - name: OUT_LAKE_VOLUME
    unit: m^3
    description: Composite within-cell lake volume (LAKES mode).
    validation_rank: 15
    emitted_in: per-cell ASCII flux file (LAKES mode)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - 'Composite-lake assumption: multiple lakes in one cell are not resolved.'
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_vic_001
  symptom: VIC crashes with `FROZEN_SOIL value is neither TRUE nor FALSE` — the field contains a file
    path instead of a boolean.
  diagnosis: '`config_paths.create_global_param()` substituted paths with the UNANCHORED pattern `r''SOIL\s+.*''`.
    `re.sub` matches anywhere in a line, so it also matched the `SOIL             FALSE` substring inside


    ```

    FROZEN_SOIL             FALSE

    ```


    rewriting that line to `FROZEN_SOIL   /path/SOIL_PARAM_COMPLETE.txt`. It was never the template''s
    fault — the generator corrupted its own output on every run. Reproduce with:

    `re.sub(r''SOIL\s+.*'', ''SOIL  /new'', ''FROZEN_SOIL             FALSE'')`'
  remedy: FIXED IN PLACE. All patterns in `create_global_param()` are now anchored (`r'^SOIL\s+.*$'` with
    `flags=re.MULTILINE`), and the function asserts post-hoc that `FROZEN_SOIL` / `FULL_ENERGY` still
    hold `TRUE`/`FALSE`, raising `RuntimeError` otherwise. No hand-editing is needed. The same hazard
    applies to any config key that is a suffix of another key — always anchor.
- id: dt_vic_002
  symptom: Simulated runoff is systematically 8x too high or 8x too low. No error message.
  diagnosis: CMFD precipitation is in mm/s (kg/m2/s). Converting to mm/3hr requires multiplying by 10800
    (seconds in 3 hours). Using 86400 (seconds in a day) produces 8x overestimate. The model runs without
    error but produces vastly inflated runoff.
  remedy: 'Verify that process_forcing.py uses 10800 (not 86400) as the precipitation conversion factor
    for 3-hourly CMFD/MSWX data. Always validate one forcing file against CMFD raw data: pick a cell,
    compare daily total precip (sum of 8 timesteps) against CMFD daily total.'
- id: dt_vic_003
  symptom: VIC error `Unable to open forcing file` — the FORCING1 prefix in global_param does not match
    actual forcing filenames.
  diagnosis: 'VIC constructs forcing file paths by concatenating: FORCING1 prefix + latitude + `_` + longitude.
    If process_forcing.py generated files with a different prefix or different decimal precision, VIC
    cannot find them.'
  remedy: Check the actual filename prefix in `forcing_final/` and update the FORCING1 line in global_param
    to match exactly. After process_forcing.py completes, always compare its output filenames against
    the FORCING1 prefix.
- id: dt_vic_004
  symptom: VIC error `Not enough records in forcing file` or `insufficient forcing records`.
  diagnosis: 'STARTYEAR/ENDYEAR in global_param extends beyond the time range of the forcing files, or
    FORCEYEARFIRST/FORCEYEARLAST do not match. The time range must be synchronized across four locations:
    (1) forcing_1d.py YEAR_START/YEAR_END, (2) process_forcing.py START_YEAR/END_YEAR, (3) global_param
    STARTYEAR/ENDYEAR, (4) global_param FORCEYEARFIRST/FORCEYEARLAST.'
  remedy: Synchronize all four time-range variables. Always verify time range consistency before running
    VIC.
- id: dt_vic_005
  symptom: Running sed -i on skill scripts empties the files completely — 0 bytes after sed.
  diagnosis: Shell expansion in sed -i commands corrupts Python script files. The sed command expands
    special characters in the replacement string (particularly `/` in file paths and `$` in Python f-strings),
    producing an invalid command that truncates the file to 0 bytes.
  remedy: 'NEVER use sed -i on skill scripts. Use Python `str.replace()` or the Edit tool instead. If
    a file was emptied, restore from backup: `cp <script>.bak <script>`.'
- id: dt_vic_006
  symptom: Passing --basin_name or --year_start on the command line has no effect.
  diagnosis: config_paths.py reads configuration from hardcoded variables at the top of the file, not
    from argparse or sys.argv. Passing CLI arguments is silently ignored.
  remedy: Edit the variables directly at the top of config_paths.py (BASIN_NAME, YEAR_START, YEAR_END,
    RESOLUTION, shp_file) instead of passing CLI arguments.
- id: dt_vic_007
  symptom: VIC error parsing soil file — `Error in soil file` or `Invalid number of soil`.
  diagnosis: fill_parameters2.py interpolation failed for some cells, producing rows with missing or extra
    columns. VIC expects exactly N columns per row (~53 for a 3-layer configuration). If some cells have
    no coverage in global reference data, rows may be incomplete.
  remedy: 'Check column count consistency: `awk ''{print NF}'' SOIL_PARAM_COMPLETE.txt | sort -u` should
    show exactly one number. Re-run fill_parameters2.py or manually pad/trim problematic rows.'
- id: dt_vic_008
  symptom: Forcing files from a previous basin are mixed with the current basin's files. No error — model
    runs with wrong meteorological data.
  diagnosis: forcing_1d.py uses BASIN_TAG as a suffix in output filenames. If old files with a different
    BASIN_TAG remain in the output directory, both old and new files coexist, and process_forcing.py may
    read the wrong ones.
  remedy: 'Delete all files in forcing_1d/ before running forcing_1d.py for a new basin: `rm -f forcing_1d/*.nc`.
    Verify the directory is empty before re-running.'
- id: dt_vic_009
  symptom: make_basin_grid_nc.py produces a NetCDF with no cells — `0 grid cells`.
  diagnosis: The basin shapefile does not intersect any grid cell centers at the chosen resolution. At
    0.25 deg resolution, each cell is ~625 km2, so basins under ~1000 km2 may have 0-2 cells. A missing/wrong
    CRS (projected instead of geographic) will also cause zero intersection.
  remedy: Switch to 0.1 deg resolution for small basins, or check and fix the shapefile CRS. Use 0.1 deg
    for basins < 5000 km2.
- id: dt_vic_010
  symptom: '`FileNotFoundError: SOIL_PARAM_COMPLETE.txt` — soil parameters must be generated before forcing.'
  diagnosis: 'process_forcing.py reads grid cell coordinates from SOIL_PARAM_COMPLETE.txt. The dependency
    is: Grid (s2) -> Soil (s3) -> Forcing (s5). This is not obvious because forcing is logically about
    meteorological data, not soil. However, process_forcing.py needs the exact grid cell coordinates from
    the soil file.'
  remedy: 'Run soil parameter generation (fill_parameters1.py + fill_parameters2.py) before process_forcing.py.
    Always follow the dependency order: Grid -> Soil -> Forcing.'
- id: dt_vic_011
  symptom: VIC runs successfully but simulated discharge is physically unreasonable — NSE < 0.3, PBIAS
    > 50%.
  diagnosis: 'Default VIC soil parameters (binfilt, Ds, Dsmax, Ws, soil depths) are not tuned for the
    specific basin. Typical uncalibrated results show NSE 0.0-0.3 and PBIAS 30-60%. Key parameters: binfilt
    (infiltration curve), Ds/Dsmax (baseflow), Ws (soil moisture threshold), soil_d2/soil_d3 (layer depths).'
  remedy: Run AI-assisted calibration using the vic_cali_ai skill if observed discharge data is available.
    Calibration can improve NSE from ~0.3 to 0.8+. If no observed data, report results as uncalibrated.
- id: dt_vic_012
  symptom: Mean air temperature is ~273 K too high or too low. No error message.
  diagnosis: CMFD stores temperature in Kelvin. VIC expects Celsius. If the conversion (-273.15) is missing,
    VIC sees temperatures of ~273-310 K interpreted as Celsius, producing extreme ET. If applied twice,
    temperatures become ~-273 C, causing zero ET.
  remedy: 'Check first forcing file: column 1 is AIR_TEMP, values should be -40 to +50 (Celsius). If values
    are 230-320: add -273.15 conversion. If values are -300 to -230: remove one of the two conversions.'
- id: dt_vic_013
  symptom: VIC error `Not enough records in forcing file` — same as dt_vic_004 but different root cause.
  diagnosis: forcing_1d.py or process_forcing.py produced incomplete data — some timesteps are missing,
    typically at year boundaries or due to interrupted processing. VIC expects exactly n_days * 8 lines
    per forcing file for 3-hourly data.
  remedy: 'Check line count: `wc -l <forcing_file>`. Expected: n_days * 8 (e.g., 365*8=2920 per non-leap
    year). If too few lines, delete forcing_1d/ and forcing_final/ contents and re-run.'
- id: dt_vic_014
  symptom: forcing_1d.py fails with FileNotFoundError — MSWX data path has moved.
  diagnosis: MSWX forcing data was originally at `KISSPATH_DATA/新加卷/msxw/` (auto-mounted external drive)
    and has been moved to `KISSPATH_FORCING/`. Scripts referencing the old path will fail.
  remedy: Update INPUT_DATA_DIR in forcing_1d.py to `KISSPATH_FORCING/`. Verify the path exists with `ls
    KISSPATH_FORCING/`.
- id: dt_vic_015
  symptom: VIC runs successfully but simulated discharge is physically unreasonable — forcing_1d.py used
    CMFD (China-only) for a basin outside China.
  diagnosis: CMFD only covers mainland China (17.5-55N, 72.5-140E). For basins outside this domain, forcing_1d.py
    must use MSWX (`KISSPATH_FORCING/`). The script does NOT auto-detect this. When CMFD is used out-of-domain,
    xarray clips to nearest China border cells, producing completely wrong forcing. Dangerous silent failure.
  remedy: 'Check basin coordinates: if lat/lon is outside China (17.5-55N, 72.5-140E), MUST use MSWX.
    Change INPUT_DATA_DIR in forcing_1d.py to `KISSPATH_FORCING/`. Also cap max_workers to 4 for MSWX.'
- id: dt_vic_016
  symptom: forcing_1d.py hangs with zero output files for minutes when using MSWX — all workers stuck
    in disk I/O wait state.
  diagnosis: MSWX yearly files are 3-9 GB each (global coverage). Default max_workers uses all CPU cores
    (e.g., 113 workers). When 100+ workers each try to read multi-GB files from the same disk, I/O hits
    100% and all workers enter D (uninterruptible sleep) state.
  remedy: 'Cap max_workers to 4 when using MSWX data. Kill stuck workers: `pkill -9 -f forcing_1d.py`.
    Add auto-detection: `if ''msxw'' in str(INPUT_DATA_DIR): max_workers = 4`.'
- id: dt_vic_017
  symptom: Agent used CMFD (China-only) forcing for a basin outside China (e.g. in Canada) — produced
    meaningless forcing data that was silently wrong.
  diagnosis: forcing_1d.py INPUT_DATA_DIR defaulted to CMFD; agent did not check basin location vs forcing
    coverage. This is the case that led to dt_vic_015.
  remedy: Added FORCING DATASET SELECTION section to CLAUDE.md. CLAUDE.md now has mandatory forcing check
    before any simulation.
- id: dt_vic_018
  symptom: forcing_1d.py with MSWX hung for 15+ minutes producing zero output — 113 workers saturated
    disk I/O on 3-9 GB files.
  diagnosis: Default max_workers uses all CPU cores; MSWX files are 100x larger than CMFD files. This
    is the discovered instance that led to dt_vic_016.
  remedy: Capped max_workers to 4 for MSWX. Auto-detect MSWX and cap workers.
- id: dt_vic_019
  symptom: You need daily discharge (m3/s) at a gauge, but the flux files only contain `OUT_RUNOFF` /
    `OUT_BASEFLOW` in mm. `OUT_DISCHARGE` is all zeros (or absent).
  diagnosis: '`dag.yaml` states it plainly: "The classic driver used here does not produce OUT_DISCHARGE;
    basin-scale discharge against a gauge requires an external routing model (e.g. CaMa-Flood)." Summing
    runoff+baseflow over the basin and calling it discharge is wrong — it has no travel time, so the hydrograph
    has no lag and no attenuation. Comparing that to a gauge produces a plausible-looking but meaningless
    NSE.'
  remedy: Run the Lohmann routing binary `model/route_1.0/src/rout` after VIC. Its 5 parameter files are
    built by the KI tool `s5_routing/build_routing_param.py` (added 2026-07-09). Preprocess each VIC flux
    file to 7 columns — `year month day prec evap runoff baseflow`, i.e. `df.iloc[:, [0,1,2,3,18,16,17]]`
    for the standard OUTVAR list — into `routing_param/vic_in/fluxes_<LAT>_<LON>`, then `cd routing_param
    && rout rout_global.txt`. Daily m3/s lands in `rout_out/<STA>.day`.
- id: dt_vic_020
  symptom: '`build_routing_param` reports a nonsensical outlet, low initial connectivity (e.g. "initial
    connectivity: 51/251") and needs dozens of "repair" iterations. The station cell''s flow accumulation
    is SMALLER than that of cells upstream of it.'
  diagnosis: The original `skills/routing-run/s5_routing_param/run_build_routing_new.py` resampled the
    DEM to 0.05° (~5.5 km) with an AVERAGE resample and ran `fill_depressions` + `d8_flow_accumulation`
    on that, over a **bbox-cropped** (not basin-masked) DEM. Averaging obliterates incised gorges, so
    `fill_depressions` floods the plateau and reroutes the network. And because the crop is a bbox, a
    boundary VIC cell's footprint straddles the *downstream* river, whose huge accumulation is then imported
    by the `max()` aggregation. At Tangnaihai the gauge cell drained 1,122 units while a cell 300 km upstream
    drained 3,891 — physically impossible.
  remedy: 'FIXED. `s5_routing/build_routing_param.py` now reuses the NATIVE-resolution `flow_accum.tif`
    + `basin.tif` from `ki_tools_common.terrain_ops.delineate_basin` (pass them via `VIC_FLOW_ACCUM` /
    `VIC_BASIN_RASTER` / `VIC_FILLED_DEM`, or let the tool call `delineate_basin` itself) and masks accumulation
    to the basin before aggregating. The outlet is then the arg-max accumulation cell, and `VIC_OUTLET_LON/LAT`
    is used to ASSERT that cell is the gauge''s own cell (raises if >1 cell away). Sanity check: `max_accum
    * pixel_area` must equal the delineated basin area. At Tangnaihai this gives 122,982 km2 and connectivity
    251/251 with zero repair iterations.'
- id: dt_vic_021
  symptom: '`compute_calval_metrics` returns NaN, or n=0, or a validation NSE computed from a handful
    of days.'
  diagnosis: The KDT standard split (spinup 1980, cal 1981-85, val 1986-90) assumes a Bengbu-like continuous
    record. Many Chinese gauge files are sparse and pad missing days with `-99`. 唐乃亥 (Yellow R.) has valid
    daily Q ONLY for {1985, 1987, 2007-2020, 2022, 2023} — 1986 and 1988-2006 are entirely `-99`. Running
    the standard window yields 2 years of calibration data and ZERO validation days.
  remedy: 'ALWAYS profile obs coverage before choosing the simulation period:

    `v = q[q > -90]; v.groupby(v.index.year).size()`

    Pick the first contiguous fully-observed decade, keep a >=1-year spinup ahead of it, confirm the forcing
    dataset covers it (CMFD spans 1951-2024), and record the deviation from the standard split in `notes`.
    For 唐乃亥: spinup 2005-06, cal 2007-11, val 2012-16.'
- id: dt_vic_022
  symptom: You run `python config_paths.py`, it prints "✓ 已更新脚本", yet the stage scripts still point at
    the previous basin and write to the old `outputs/<old_basin>/` tree.
  diagnosis: '`SCRIPTS_DIR` was hard-coded to `WORKSPACE_ROOT/"skills"/"vic-auto-run"`, a *copy* of the
    stage scripts living outside `knowledge_infrastructure/`. The documented workflow then executed the
    untouched KI copies, so the configuration step did nothing.'
  remedy: 'FIXED — `SCRIPTS_DIR = Path(__file__).resolve().parent`. Better still, do not rely on the in-place
    regex rewriting at all: every stage script (`s1_grid`, `s2_forcing`, `s3_soil`, `s4_veg`, `s5_routing`)
    now reads its configuration from the environment. Export `VIC_BASIN_NAME`, `VIC_BASIN_SHP`, `VIC_OUT_ROOT`,
    `VIC_CMFD_DIR`, `VIC_YEAR_START/END`, `VIC_START_DATE/END_DATE`, `VIC_FORCING_PREFIX` and run the
    scripts unmodified. This also removes the `_xixian` NetCDF suffix and the `huai_01dy_025deg_` forcing
    prefix that were hard-coded into `forcing_1d.py` / `process_forcing.py` and silently made a new basin
    find zero input files.'
- id: dt_vic_023
  symptom: 'A stage script prints its full success banner ("成功率: 100.0%", all N cells written), every
    expected output file is on disk and correct, yet the driver reports the stage failed. `run.log` ends
    with:


    ```

    STDERR: .../xarray/backends/plugins.py:109: RuntimeWarning: Engine ''gmt'' loading failed:

    Error loading GMT shared library at ''libgmt.so''.

    ```


    and the shell/subprocess return code is `139` (SIGSEGV) or `-11`. A driver that does `if p.returncode
    != 0: sys.exit(1)` then aborts the whole run at a stage that actually SUCCEEDED. A detached run can
    die exactly here: `state.json` records `returncode: 1` at s6 `process_forcing.py`, all forcing files
    are correct, and the orchestrator captures **null metrics** for a run whose physics were fine.'
  diagnosis: 'Two independent conditions must both hold.


    1. `pygmt` 0.18.0 is installed on this server but the GMT C library is **not** (`ldconfig -p | grep
    gmt` → nothing; there is no `libgmt.so` anywhere on disk). Its `xarray.backends` entrypoint `pygmt.xarray:GMTBackendEntrypoint`
    therefore fails to import.

    2. A **bare** `xr.open_dataset(path)` — no `engine=` — makes xarray enumerate *every* installed backend
    entrypoint (`plugins.list_engines()`). That probe imports `rex` → `h5py`, dlopening h5py''s bundled
    `libhdf5` first. `netCDF4`''s C calls then bind to that foreign HDF5, and the interpreter dies with
    SIGSEGV during HDF5 teardown — **after** the data has been read and written correctly.


    The crash is at interpreter *exit*, so it is invisible in the script''s own stdout. It is nondeterministic
    across stages: whichever library wins the global symbol table first decides whether that stage survives.
    `forcing_1d.py` survived while `process_forcing.py` died in the same run.


    Minimal reproduction (any NetCDF file):


    ```

    python3 -c ''import xarray as xr; xr.open_dataset("grid.nc").close()''          # rc=139  SIGSEGV

    python3 -c ''import netCDF4, xarray as xr; xr.open_dataset("grid.nc", engine="netcdf4").close()''  #
    rc=0

    ```'
  remedy: 'FIXED in every stage script. Two rules, both required — pinning alone is sufficient in isolation,
    but import order is the cheap insurance when a third-party import (`rioxarray`, `rasterstats`) pulls
    HDF5 in behind your back:


    1. `import netCDF4` **before** `import xarray` (`# isort:skip`, `# noqa: F401`).

    2. **Never** call `xr.open_dataset()` without `engine=`. Use the shared `open_nc()` helper — present
    in `s2_forcing/forcing_1d.py`, `s2_forcing/process_forcing.py`, `s3_soil/fill_parameters1.py`, `s4_veg/process_vegetation_detailed.py`
    — which pins `netcdf4` and falls back to `h5netcdf`.


    Guard against regression:


    ```

    grep -rn "open_dataset(" --include=*.py s1_grid s2_forcing s3_soil s4_veg s5_routing | grep -v "engine="

    ```


    must return nothing. Do **not** "fix" this by making the driver tolerate a nonzero return code: a
    real crash and a teardown crash are then indistinguishable, and the next genuine failure will be silently
    scored.'
- id: dt_vic_024
  symptom: 'step s7 prints `✗ 模板文件不存在: .../outputs/pearl_river_calibration_ai/best_run/global_param.txt`,

    no `global_param_<basin>.txt` is produced, and the run dies much later at

    `vic_classic.exe -g <missing file>` with an unrelated-looking I/O error.'
  diagnosis: '`config_paths.PATH_CONFIG["global_param_template"]` defaulted to a path under

    `outputs/` — an *output* directory of an old calibration run, not a KI asset. That directory

    does not exist on this server. Worse, `create_global_param()` handled the miss with

    `return False`; no caller checked the return value, so the failure was silent at the point it

    occurred. A KI must never depend on `outputs/` for an input.'
  remedy: "FIXED (2026-07-10).\n* The template now ships inside the KI: `docs/vic_param/global_param_template.txt`,\
    \ and is the\n  default value of `VIC_GLOBAL_PARAM_TEMPLATE`.\n* A missing template now raises `FileNotFoundError`\
    \ instead of returning `False`.\n* The template's header documents that its 21 `OUTVAR` lines are\
    \ order-critical: `s5_routing`\n  and SKILL.md slice the flux file as `df.iloc[:, [0,1,2,3,18,16,17]]`\n\
    \  (`year month day OUT_PREC OUT_EVAP OUT_RUNOFF OUT_BASEFLOW`). Reorder an OUTVAR and `rout`\n  is\
    \ silently fed the wrong columns."
- id: dt_vic_025
  symptom: '`s5_routing/build_routing_param.py` raises

    `RuntimeError: No VIC_FLOW_ACCUM/VIC_BASIN_RASTER/VIC_FILLED_DEM supplied and no

    VIC_OUTLET_LON/LAT to delineate with`, or `KeyError: ''VIC_BASIN_SHP''`.'
  diagnosis: 'SKILL.md''s "Server quickstart" env table stops at `VIC_GLOBAL_PARAM_TEMPLATE`,

    but the s9 routing stage additionally reads `VIC_STATION_NAME`, `VIC_OUTLET_LON`,

    `VIC_OUTLET_LAT` and `VIC_DEM`. The outlet coordinates are not optional for a new basin: they

    are both the delineation pour point and the assertion that the max-accumulation cell really is

    the gauge cell.'
  remedy: 'export all of them. Working Harbin/Songhua invocation (866 cells, 384,411 km² at the

    outlet vs ~391,000 km² published, connectivity 866/866):


    ```bash

    export VIC_BASIN_NAME=harbin_songhua_1980_1987

    export VIC_BASIN_SHP=KISSPATH_DATA/shp/harbin_songhua_shp/harbin_songhua_boundary_shp/harbin_songhua_boundary.shp

    export VIC_CMFD_DIR=KISSPATH_FORCING/Data_forcing_03hr_010deg

    export VIC_YEAR_START=1980 VIC_YEAR_END=1987

    export VIC_START_DATE=1980-01-01 VIC_END_DATE=1987-12-31

    export VIC_FORCING_PREFIX=harbin_025deg_

    export VIC_STATION_NAME=HRB

    export VIC_OUTLET_LON=126.6 VIC_OUTLET_LAT=45.75

    export VIC_DEM=KISSPATH_STATIC/china_dem_90m/china_dem_90m.tif

    export VIC_STREAM_THRESHOLD=200000 VIC_SNAP_DIST_M=5000   # scale threshold with basin size

    ```


    `VIC_STREAM_THRESHOLD` is in **native DEM cells**, so it must grow with the basin: 20,000 cells

    (~160 km² at 90 m) is right for a 10³-km² headwater but leaves a 4×10⁵-km² basin''s snap target

    ambiguous. 200,000 worked at Harbin.


    **Note on `delineate_basin` cost**: it runs `fill_depressions` on whatever raster it is handed,

    with no internal bbox crop. Never pass the 3.5 GB `china_dem_90m.tif` directly —

    `build_routing_param.py` crops to the basin bbox + 0.5° first (`crop_dem_to_basin`). Harbin''s

    crop was 10.4° × 10.9° and the whole delineation took ~2 minutes.'
- id: dt_vic_026
  symptom: 'the KDT standard split (spinup 1980 / cal 1981-85 / val 1986-90) appears to work,

    but `nse_val` is computed on ~730 days instead of ~1826.'
  diagnosis: '`KISSPATH_DATA/china_water_level/松辽txt/哈尔滨.txt` is complete daily

    1980-1987, then `-99` for **1988-2000** inclusive, then 2001-2003, 2005-2019, 2021-2023.

    This is the exact trap dt_vic_021 warns about, at a second basin.'
  remedy: 'profile first (`v = q[q > -90]; v.groupby(v.index.year).size()`), then either

    truncate the validation window to 1986-1987 (keeping the

    standard spinup/cal periods intact) or move the whole experiment to the 2005-2019 block.

    Do not silently accept a 5-year `period_validation` string that only 2 years of data back.'
- id: dt_vic_027
  symptom: 'the model finished (`vic rc=0`, `rout rc=0`, routed `.day` on disk) but the

    orchestrator recorded `nse: null`. The runner''s tail shows

    `KeyError: ''nse''` at `cv["calibration"]["nse"]`.'
  diagnosis: '`ki_tools_common.metrics.all_metrics` returns

    `{''NSE'',''KGE'',''PBIAS'',''RMSE'',''r''}` and `validators.standard_calval.compute_calval_metrics`

    returns `{''NSE'',''KGE'',''PBIAS'',''r'',''n''}` per period — UPPERCASE for every metric except

    `r`. A runner that indexes `[''nse'']` dies AFTER the expensive part has succeeded, and

    `kdt_detached_run.py` still writes `DONE`, so the failure looks like "the model produced

    nothing". For example, one run burned 13 min of VIC + routing and was

    discarded. The same casing is latent in any new runner.'
  remedy: 'index `m["NSE"]`, `m["KGE"]`, `m["PBIAS"]`, `m["RMSE"]`, `m["r"]`. Do not

    "fix" `ki_tools_common` — every other KI depends on the current casing. Always write

    `result.json` from a `try/except` that emits `status:"failed"` with the traceback, so a

    scoring bug can never masquerade as a null-metrics model failure.'
- id: dt_vic_028
  symptom: 'routed hydrograph has a plausible volume but poor NSE; `r` is stuck around

    0.5-0.6 no matter which soil parameter is calibrated.'
  diagnosis: "`s5_routing/build_routing_param.py` hard-codes `VELOCITY = 1.5` m/s and\n`DIFFUSIVITY =\
    \ 800` m²/s (env `VIC_ROUT_VELOCITY` / `VIC_ROUT_DIFF`, undocumented in\nSKILL.md). Those reproduce\
    \ Bengbu (121,330 km²). At 哈尔滨 (398,330 km², flat Songnen\nPlain) the resulting basin-mean unit-hydrograph\
    \ lag is **6.2 d** while the observed lag\nis **28 d**. Two consequences that are easy to misread:\n\
    \n* `NSE <= r**2`. With a zero-lag r of about 0.6 the NSE ceiling is only about **0.35** — the target\n\
    \  NSE >= 0.5 was arithmetically unreachable, and no soil parameter could have fixed it.\n* `rout`\
    \ renormalises UH_S (`unit_hyd_routines.f`, `MAKE_UHM` and `MAKE_GRID_UH` both\n  divide by their\
    \ sum), so routing is mass-conserving at ANY velocity. **A velocity\n  error moves timing and can\
    \ NEVER move PBIAS.** A wet bias is therefore never evidence\n  that the routing is right."
  remedy: "before scoring, measure both numbers with `s5_routing/run_routing.py`:\n`observed_lag_days(obs,\
    \ sim)` (lag-correlation) and `basin_mean_uh_lag(uh_s)` (read from\nthe `.uh_s` rout itself writes).\
    \ If the observed lag exceeds the UH lag, IDENTIFY the\nvelocity by bisecting until they agree — on\
    \ the CALIBRATION window only. Do not fit\nvelocity to NSE. At 哈尔滨 this gives v = 0.15 m/s (UH lag\
    \ 27.8 d) and lifts the zero-lag r\nand the NSE ceiling a lot.\n\nRead the identified value as an\
    \ **effective basin residence time, not a channel\ncelerity**: Lohmann's linearised Saint-Venant scheme\
    \ lumps hillslope, floodplain,\nwetland and reservoir storage into (velocity, diffusivity). Where\
    \ that storage dominates\n(large flat basins), prefer a routing scheme with explicit storage — CaMa-Flood\
    \ 4.20 is\non this server (`cama_maps_15min_extracted`). Note `rout.f` caps the routed response at\n\
    `UH_DAY = 96` days and the within-cell `UH.all` at `KE = 12` days, so `UH.all` alone can\nnever supply\
    \ more than ~12 d of lag.\n\n**VELOCITY SATURATES — below a basin-dependent threshold it is an INERT\
    \ knob.**\n`MAKE_UHM` (`unit_hyd_routines.f`) builds each cell's impulse response on\n`t ∈ (0, LE*DT]\
    \ = (0, 48 h]` and then **renormalises it to unit mass**. Once\n`xmask / velocity` exceeds 48 h the\
    \ clipped kernel stops changing shape, so its mean\ntravel time freezes at ~1.3 d per cell no matter\
    \ how small `velocity` gets. The\nbasin-mean UH lag therefore asymptotes to\n\n    uh_lag_max  ≈ \
    \ mean(UH.all)  +  mean_flow_path_in_cells × ~1.3 d\n\nAt 哈尔滨 (mean path 20.4 cells) that ceiling\
    \ is **29.8 d**, measured directly by routing\nat `v = 0.002`. Observed demand was ~33 d. Consequence:\
    \ dropping `v` from 0.15 to 0.002\nbuys only 2 d of lag and moves held-out NSE only a little, and\
    \ a 5-7 day\nresidual lead survives at EVERY attainable velocity.\n\nSo a velocity optimiser will\
    \ happily walk to its lower bound and report \"success\" while\nthe model has stopped responding.\
    \ **Always probe `v → 0` first** (one 7 s `rout` call)\nto learn the ceiling, then:\n\n* if `target_lag\
    \ < uh_lag_max` → identify `velocity` by bisection (the honest case);\n* if `target_lag >= uh_lag_max`\
    \ → the scheme is **structurally insufficient** for this\n  basin. Pin `velocity` to a pre-declared\
    \ constant (the `rout_velocity` `range` lower\n  bound in `calibration.yaml`, 0.10 m/s), report the\
    \ plateau's NSE spread so the reader\n  can see the parameter is unidentifiable, and say so. Do NOT\
    \ tune inside the plateau,\n  and do NOT report the plateau optimum as an identified value."
- id: dt_vic_029
  symptom: 'a second `rout` run in the same directory dies on the OPEN of

    `HRB  .uh_s`; or worse, an operator copies the old `.uh_s` in, `rout` takes the

    `UH_STRING(1:4) .ne. ''NONE''` branch, and silently routes with the PREVIOUS velocity''s

    unit hydrograph — the new velocity has no effect at all and the hydrograph is unchanged.'
  diagnosis: '`unit_hyd_routines.f` `MAKE_GRID_UH` does

    `open(98, file = NAME5//''.uh_s'', status=''new'')`. `status=''new''` requires the file to be

    absent. The station file''s second line is the UH_S filename; `NONE` means "build it".

    `NAME5` is the station name padded to 5 characters, so the file is literally `HRB  .uh_s`

    (two spaces).'
  remedy: 'run every `rout` invocation in a FRESH scratch directory —

    `s5_routing/run_routing.route()` does exactly this and never mutates `routing_param/`,

    which also makes a (velocity, diffusivity) sweep safe to parallelise. One call is ~7 s

    for 866 cells because velocity and diffusivity affect ONLY the routing stage: **no VIC

    re-run is needed to change them.**'
- id: dt_vic_030
  symptom: '`nse_cal` >> `nse_val` and PBIAS grows steadily through the record. Looks

    exactly like overfitting; it is not.'
  diagnosis: '`fill_parameters1.py` writes `init_moist` = 66.79 mm for every layer, i.e.

    ~10-14% saturation, and the KI''s soil column is 0.1 + 0.3 + 1.5 = 1.9 m. SKILL.md''s

    standard split gives it ONE spin-up year (1980). At 哈尔滨 the column takes ~5-6 years to

    equilibrate. From the model''s own flux output, basin-sampled annual means:


    | year | 1980 | 1981 | 1982 | 1983 | 1984 | 1985 | 1986 | 1987 |

    |---|---|---|---|---|---|---|---|---|

    | baseflow (mm/yr) | 22.5 | 38.3 | 48.9 | 72.2 | 70.7 | 78.0 | 111.3 | 87.9 |

    | storage on 31 Dec (mm) | 320 | 397 | 391 | 460 | 484 | 504 | 492 | 499 |


    Baseflow quintuples; the baseflow index climbs 0.31 → 0.54. Because the still-filling

    store absorbs water, PBIAS *rises* steadily as the model equilibrates (by many percentage

    points from the first to the last years). The calibration window is the least equilibrated

    part of the record, so any cal-vs-val gap is a spin-up transient.'
  remedy: 'before scoring, check the storage trend

    (`OUT_SOIL_MOIST_*` + `OUT_SWE` on 31 Dec of each year) and the baseflow trend. If either

    is still climbing at the start of the calibration window, extend the spin-up. CMFD covers

    1951-2024, so starting the simulation ~5-10 years before `CAL_START` costs only VIC time

    (~95 s per simulated year for 866 cells in water-balance mode). Do NOT read a

    `nse_cal > nse_val` gap as overfitting until this check is clean.'
- id: dt_vic_031
  symptom: 'two failures in sequence when enabling the frozen-soil module on a cold basin.

    First, VIC reads sentinel values into `estimate_layer_ice_content()`. Then, once the soil

    file is fixed, VIC aborts with

    `read_soilparam.c:770 ... The number of soil thermal nodes (N) is too small for the supplied

    damping depth (4.000000) with EXP_TRANS set to TRUE ... 5*ln(dp+1)<Nnodes-1`.'
  diagnosis: '(a) `fill_parameters1.py:213-214` writes `bubble` (cols 28-30) = -9999 and

    `fs_active` (col 53) = 0. Both are inert while `FULL_ENERGY` and `FROZEN_SOIL` are FALSE, so

    no reference basin ever noticed — but they make `FROZEN_SOIL TRUE` unusable.

    (b) `FROZEN_SOIL TRUE` makes VIC set `QUICK_FLUX = FALSE`

    (`drivers/classic/src/get_global_param.c:111`), which leaves `EXP_TRANS` at its TRUE default.

    `EXP_TRANS` then demands `5*ln(dp+1) < NODES-1`. The KI''s `dp` is 4.0 m, so

    `5*ln(5) = 8.05` and **NODES must be >= 10**. `NODES 3` (the water-balance default) and

    `NODES 7` both abort.'
  remedy: '`fill_parameters2.py` now derives `bubble = 0.32*expt + 4.3` (VIC''s own texture

    relation, the one used to build the Maurer/Livneh CONUS soil files; gives 7.3-8.4 cm here)

    and sets `fs_active = 1`. Use the shipped

    `docs/vic_param/global_param_template_frozen.txt` (`FULL_ENERGY FALSE`, `FROZEN_SOIL TRUE`,

    `NODES 10`) via `VIC_GLOBAL_PARAM_TEMPLATE`. Cost: ~9.5x the water-balance run

    (75 s per simulated month for 866 cells, vs 8 s). Verify the run with `OUT_SOIL_TEMP_0`

    (-18.6 degC at 哈尔滨 in January — if it is ~0 the thermal solution is not running).'
