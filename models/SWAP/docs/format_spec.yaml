# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: SWAP
  language: fortran
  implementation:
    id: swap-4.2.0
    version: 4.2.0
    provenance: Fortran; Wageningen University & Research (WUR/WENR) SWAP 4 executable, reads free-format
      ASCII input via the TTUTIL library.
  scientific_reference_version: SWAP version 4 (WENR Report 2780, 2017; doi:10.18174/416321) — vadose-zone
    Richards/MvG ecohydrology spec
inputs:
  forcing:
  - name: Rad
    unit: kJ/m2/d
    category: forcing
    source_kind: forcing
    model_input_format: .met meteorological file column
    notes: Global solar radiation; SWAP expects kJ/m2/d (~2000-30000), NOT W/m2.
  - name: Tmin
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: .met column
    notes: Minimum air temperature; Celsius, not Kelvin.
  - name: Tmax
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: .met column
  - name: Hum
    unit: kPa
    category: forcing
    source_kind: forcing
    model_input_format: .met column
    notes: Actual vapour pressure, NOT relative humidity.
  - name: Wind
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: .met column
    notes: Wind speed at the ALTW measurement height.
  - name: Rain
    unit: mm/d
    category: forcing
    source_kind: forcing
    model_input_format: .met column
    notes: Daily precipitation; optional sub-daily rainfall intensities for runoff/macropore studies.
  - name: ETref
    unit: mm/d
    category: forcing
    source_kind: forcing
    model_input_format: .met column
    notes: Reference ET, used only when SWETR=1 (otherwise ET computed internally by Penman-Monteith).
  - name: Wet
    unit: fraction
    category: forcing
    source_kind: forcing
    model_input_format: .met column
    notes: Wet duration fraction of day.
  parameters:
  - name: ORES (theta_r)
    unit: cm3/cm3
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: Residual water content; must be strictly < OSAT.
  - name: OSAT (theta_s)
    unit: cm3/cm3
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: Saturated water content (typ 0.35-0.55).
  - name: ALFA (alpha)
    unit: 1/cm
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: van Genuchten shape parameter; must be positive.
  - name: NPAR (n)
    unit: '-'
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: van Genuchten n; must be > 1.001.
  - name: KSATFIT
    unit: cm/d
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: Fitted saturated hydraulic conductivity (sand 100-1000, clay 0.1-10 cm/d).
  - name: LEXP
    unit: '-'
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: Exponent in Mualem K function.
  - name: ALFAW
    unit: 1/cm
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: Wetting-curve alpha for hysteresis scaling.
  - name: H_ENPR
    unit: cm
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: Air-entry pressure head (near-saturation modification).
  - name: KSATEXM
    unit: cm/d
    category: soil_hydraulic
    source_kind: calibrated
    model_input_format: .swp soil-water section
    notes: Measured Ksat.
  - name: BDENS
    unit: mg/cm3 (=kg/m3)
    category: soil_thermal
    source_kind: dataset_lookup
    model_input_format: .swp soil-water section
    notes: Dry bulk density (typ 1000-1800); controls heat capacity. mg/cm3, not g/cm3.
  - name: Crop parameters (.crp)
    unit: various
    category: crop
    source_kind: dataset_lookup
    model_input_format: .crp file (CROPTYPE 1 simple, 2 WOFOST general, 3 WOFOST grass)
    notes: Development/DVS, LAI tables, assimilation, partitioning, senescence, root growth, water/oxygen/salt
      stress, interception.
  - name: omega_c
    unit: '-'
    category: root_uptake
    source_kind: calibrated
    model_input_format: .crp root water uptake section
    notes: Critical stress index for compensatory root water uptake (de Jong van Lier).
  - name: Solute transport parameters
    unit: various
    category: solute
    source_kind: calibrated
    model_input_format: .swp solute section
    notes: Diffusion, dispersion, Freundlich adsorption, first-order decomposition, root solute uptake
      TSCF; salinity-stress onset Pi and decline SSF.
  - name: Drainage formula parameters
    unit: various
    category: drainage
    source_kind: user_provided
    model_input_format: .dra file
    notes: Hooghoudt/Ernst resistances, tabulated flux-vs-GWL, or multi-level resistances (DRAMET 1/2/3).
  - name: LAT / ALT / ALTW / Angstrom coefficients
    unit: deg / m / m / -
    category: site
    source_kind: user_provided
    model_input_format: .swp general/meteorology section
    notes: Latitude, altitude, wind-measurement height (default 10 m), Angstrom coefficients used when
      ET computed from basic weather.
  - name: ISUBLAY / ISOILLAY / HSUBLAY / HCOMP / NCOMP
    unit: '- / - / cm / cm / -'
    category: discretization
    source_kind: user_provided
    model_input_format: .swp vertical-discretization section
    notes: Profile/compartment discretization; NCOMP x HCOMP must equal HSUBLAY per sub-layer.
  - name: DTMIN / DTMAX / MAXIT / GWLCONV / CRITDEVH1CP / CRITDEVMASBAL
    unit: d / d / - / cm / - / -
    category: numerics
    source_kind: default
    model_input_format: .swp Richards-numerics section
    notes: Adaptive-timestep bounds, max iterations, max GWL change per step (use 1-10 cm for shallow
      GWL), and water/mass-balance deviation criteria.
  initial_conditions:
  - name: Initial pressure heads / soil moisture profile
    unit: cm / cm3/cm3
    category: initial_condition
    source_kind: user_provided
    model_input_format: .swp soil-water section or OUTFIL.END restart
    notes: Negative pressure heads in the unsaturated zone.
  - name: Initial solute concentrations
    unit: mg/cm3
    category: initial_condition
    source_kind: user_provided
    model_input_format: .swp solute section or OUTFIL.END
  - name: Initial soil temperatures
    unit: degC
    category: initial_condition
    source_kind: user_provided
    model_input_format: .swp heat section or OUTFIL.END
  - name: Initial snow and ponding layer storage
    unit: cm
    category: initial_condition
    source_kind: user_provided
    model_input_format: OUTFIL.END restart
  boundary_conditions:
  - name: TSTART / TEND
    unit: date
    category: control
    source_kind: user_provided
    model_input_format: .swp general section
    notes: Simulation period; TSTART must lie within forcing coverage and TSTART <= CROPSTART.
  - name: SWETR
    unit: switch
    category: control
    source_kind: user_provided
    model_input_format: .swp meteorology section
    notes: 0 = compute Penman-Monteith ET from weather; 1 = use supplied ETref.
  - name: SWBOTB (bottom boundary type)
    unit: switch
    category: control
    source_kind: user_provided
    model_input_format: .swp / .bbc
    notes: One of 8 lower-boundary options controlled by head, flux, or head-flux relation (1 GWL, 2 flux,
      3 aquifer head, 4 GWL-flux, 5 pressure head, 6 zero flux, 7 free drainage, 8 free outflow).
  - name: DRAMET (drainage method)
    unit: switch
    category: control
    source_kind: user_provided
    model_input_format: .dra
    notes: 1 flux-GWL table, 2 Hooghoudt/Ernst, 3 multi-level resistance.
  - name: SWCROP / CROPTYPE / CROPSTART / CROPEND / CROPFIL
    unit: switch / date / file
    category: control
    source_kind: user_provided
    model_input_format: .swp crop section
    notes: Crop rotation schedule and crop-file binding; rotation periods must not overlap.
  - name: Output switches (SWBLC / SWINC / SWVAP / SWCSV / SWBAL / SWWBA / SWSBA / SWATE / SWMETDETAIL)
    unit: switch
    category: control
    source_kind: user_provided
    model_input_format: .swp general section
    notes: Select which balance/profile/CSV output files are written; SWCSV=1 with INLIST_CSV selects
      custom variables.
  - name: Irrigation schedule
    unit: various
    category: management
    source_kind: user_provided
    model_input_format: .crp / .swp irrigation section
    notes: Fixed date/depth/quality or scheduled/optimized (allowable stress/depletion, critical head/water
      content).
  - name: Surface-water / weir management
    unit: various
    category: management
    source_kind: user_provided
    model_input_format: .swp surface-water section
    notes: Imposed or simulated surface-water levels controlled by weir and soil-moisture criteria.
  - name: Solute top-boundary concentration
    unit: mg/cm3
    category: boundary
    source_kind: user_provided
    model_input_format: .swp solute section
outputs:
  primary:
  - name: actual_transpiration
    unit: cm
    description: Actual crop transpiration (root water uptake) after water/oxygen/salt stress reduction.
    validation_rank: 6
    emitted_in: .inc / .wba / .csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Field-scale point quantity; flux-tower ET partitioning into T/E carries its own uncertainty.
      detrending_options:
      - none
  - name: actual_soil_evaporation
    unit: cm
    description: Actual bare-soil evaporation from the surface compartment.
    validation_rank: 1
    emitted_in: .inc / .wba
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Only separable from transpiration when the obs provides partitioned ET.
      detrending_options:
      - none
  - name: evapotranspiration
    unit: cm/d
    description: Total actual evapotranspiration (transpiration + soil evaporation + interception).
    validation_rank: 2
    emitted_in: .inc / .wba
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Field-scale single-column; compare to eddy-covariance or lysimeter at the same site.
      detrending_options:
      - none
  - name: soil_water_content_profile
    unit: cm3/cm3
    description: Depth-resolved volumetric water content theta per compartment.
    validation_rank: 3
    emitted_in: .vap
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Compare at the specific sensor depth; representativeness of a point probe vs a model compartment
          matters.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single profile measurement at one time.
      detrending_options:
      - none
  - name: pressure_head_profile
    unit: cm
    description: Depth-resolved vadose-zone soil matric pressure head h per compartment.
    validation_rank: 4
    emitted_in: .vap
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Compare against tensiometer at matching depth.
      detrending_options:
      - none
  - name: groundwater_level
    unit: cm
    description: Simulated groundwater (phreatic) level below surface.
    validation_rank: 5
    emitted_in: .wba
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Sensitive to bottom-boundary choice; only meaningful when SWBOTB represents a real water table.
      detrending_options:
      - none
  - name: drainage_flux
    unit: cm
    description: Net lateral soil-water drainage discharge from the subsurface column (and per-level drainage
      in .blc).
    validation_rank: 7
    emitted_in: .inc / .wba / .blc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare to measured tile/ditch discharge; lumped analytical drainage, not mechanistic lateral
          flow.
      detrending_options:
      - none
  - name: bottom_flux
    unit: cm
    description: Net vertical soil-water flux across the lower boundary of the soil column.
    validation_rank: 8
    emitted_in: .inc / .wba
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Rarely directly observed; usually inferred, so comparison is indirect.
      detrending_options:
      - none
  - name: solute_concentration_output
    unit: mg/cm3
    description: Soil pore-water solute concentration / cumulative solute balance components in the soil
      profile.
    validation_rank: 9
    emitted_in: .sba / .vap
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - 'Unit care: mg/cm3 vs mg/L differ by 1000x; salinity/leaching obs at matching depth.'
      detrending_options:
      - none
  - name: soil_temperature_profile
    unit: degC
    description: Depth-resolved soil temperature per node.
    validation_rank: 10
    emitted_in: .ate / .vap
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare against soil-temperature probe at matching depth.
      detrending_options:
      - none
  - name: crop_yield
    unit: kg/ha
    description: Storage-organ / total dry weight at harvest (WOFOST detailed crop modules).
    validation_rank: 11
    emitted_in: .crp
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Only meaningful with CROPTYPE=2/3; simple module prescribes development and does not predict
          yield.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/regional yield aggregates carry a technology trend a single weather-driven field column
          cannot reproduce; detrend before comparing.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: leaf_area_index
    unit: m2/m2
    description: Potential and actual leaf area index over the growing season.
    validation_rank: 12
    emitted_in: .crp
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Phenology timing (DVS) bias shows up as LAI lag; WOFOST modules only.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Extreme evapotranspiration, soil dries to wilting point immediately. ET values 100+ mm/d.
  diagnosis: Radiation input in W/m² instead of kJ/m²/d — radiation approximately 200× too low or too
    high depending on direction; SWAP expects solar radiation in kJ/m²/d in the .met file. CMFD and MSWX
    provide radiation in W/m² (instantaneous). The correct conversion is W/m² × 86400/1000 = kJ/m²/d.
    If W/m² valu
  remedy: Multiply W/m² by 86.4 (= 86400/1000) to get kJ/m²/d; convert_forcing_to_swap; ['Check max Rad
    in .met file — should be 5000-35000 kJ/m²/d for mid-latitudes', 'If max Rad < 500, values are likely
    in W/m² — multiply by 86.4', 'If max Rad > 100000, values may be in J/m²/d — divide by 1000']; validate_o
  severity: silent
- id: dt_002
  symptom: Extreme evaporation, no soil moisture left. ET dominated by soil evaporation.
  diagnosis: 'Humidity column contains relative humidity (0-1 or 0-100) instead of vapor pressure (kPa);
    SWAP .met Hum column expects actual vapor pressure in kPa (typically 0.3-5 kPa). If relative humidity
    fraction (0-1) is used, SWAP interprets 0.7 as 0.7 kPa, far below actual (~1.5 kPa), creating a huge
    vapor '
  remedy: 'Convert specific humidity to vapor pressure: e = q * P / (0.622 + 0.378*q); convert_forcing_to_swap;
    [''Check Hum values in .met file — should be 0.1-7 kPa for most climates'', ''If all Hum < 1.0 and
    > 0, likely relative humidity fraction — convert'', ''If all Hum 30-100, likely RH percentage — convert
    v'
  severity: silent
- id: dt_003
  symptom: Soil always waterlogged, continuous runoff, groundwater at surface.
  diagnosis: MSWX 3-hourly rainfall passed as daily without aggregation — 8× too much rain per record;
    MSWX provides precipitation in mm/3hr. There are 8 records per day. SWAP expects mm/day in the .met
    Rain column. If each 3-hourly value is written as a daily record, the model receives 8 separate days
    of rainfa
  remedy: Sum all 8 three-hourly MSWX precipitation values to get daily total; convert_forcing_to_swap;
    ['Check mean annual rainfall — should match climate normals for the site', 'If annual total is 8×
    expected, MSWX records not aggregated']; convert_forcing_to_swap sums sub-daily records before writing
  severity: silent
- id: dt_004
  symptom: Temperature sum for crop development never reached. Crops never emerge or mature.
  diagnosis: Temperature in Kelvin instead of Celsius — values ~293 instead of ~20; SWAP expects temperature
    in °C. CMFD/MSWX provide temperature in K. If not converted, Tmin/Tmax of ~280-300 K cause crop temperature
    sums to accumulate at extreme rates (or SWAP crashes). The Penman-Monteith calculation also uses
  remedy: Subtract 273.15 from temperature values; convert_forcing_to_swap; ['Check Tmin/Tmax in .met
    file — should be -50..50°C', 'If values are 230-320, they are in Kelvin — subtract 273.15']; validate_outputs()
    checks temperature range
  severity: fatal
- id: dt_005
  symptom: All water drains instantly, no retention. Soil moisture drops to residual immediately.
  diagnosis: Ksat in m/s instead of cm/d — value thousands of times too high; SWAP KSATFIT and KSATEXM
    expect saturated hydraulic conductivity in cm/day. If values from databases in m/s (e.g., 1e-5 m/s)
    are entered without conversion, they are interpreted as 1e-5 cm/d, which is far too low. Conversely,
    if m/d is
  remedy: 'Convert to cm/d: m/s × 8640000, m/d × 100, cm/hr × 24; convert_soil_to_swap; [''Check KSATFIT
    values — sand: 100-1000 cm/d, clay: 0.1-10 cm/d'', ''If all KSATFIT < 0.001, values likely in m/s
    — multiply by 8.64e6'']; validate_outputs() checks Ksat against texture-typical ranges'
  severity: silent
- id: dt_006
  symptom: SWAP crashes or produces NaN. Error in soil hydraulic calculations.
  diagnosis: ORES >= OSAT — residual water content exceeds or equals saturated content; The van Genuchten
    water retention function requires ORES < OSAT strictly. If parameters are entered in wrong order or
    from different sources with inconsistent values, ORES >= OSAT causes division by zero in the retention
    curv
  remedy: 'Verify ORES < OSAT for every soil layer; typical: ORES=0.01-0.10, OSAT=0.35-0.55; convert_soil_to_swap;
    [''Check MvG parameter table in .swp file'', ''Ensure column order matches: ORES OSAT ALFA NPAR KSATFIT
    LEXP ALFAW H_ENPR KSATEXM BDENS'']; convert_soil_to_swap validates ORES < OSAT before writing'
  severity: fatal
- id: dt_007
  symptom: Bulk density out of range warning or physically impossible soil properties.
  diagnosis: 'Bulk density in g/cm³ instead of mg/cm³ (= kg/m³); SWAP BDENS range is 100-10000 mg/cm³
    (equivalent to kg/m³). Common soil bulk density is 1200-1600 kg/m³. If entered as g/cm³ (1.2-1.6),
    SWAP clips to minimum 100, producing wrong heat capacity calculations.

    ; [''convert_soil_to_swap'']'
  remedy: If values in g/cm³, multiply by 1000 to get mg/cm³; convert_soil_to_swap; ['Check BDENS values
    — should be 1000-1800 for most soils', 'If BDENS < 10, values are in g/cm³ — multiply by 1000']; validate_outputs()
    checks BDENS range
  severity: silent
- id: dt_008
  symptom: SWAP crashes with file-not-found error on Linux. Works on Windows.
  diagnosis: 'Uppercase characters in filenames or paths — Linux is case-sensitive; SWAP on Windows is
    case-insensitive, so ''283.MET'' matches ''283.met''. On Linux, filenames must match exactly. The
    .swp file may reference ''METFIL'' with different casing than the actual file on disk.

    ; [''run_swap'', ''readswap.f90'']'
  remedy: 'Rename all files and references to lowercase; run_swap; ["Run: ls -la *.* | grep -E ''[A-Z]''
    to find uppercase files", ''Rename: for f in *; do mv "$f" "$(echo $f | tr \''A-Z\'' \''a-z\'')";
    done'', ''Update all filename references in .swp to lowercase'']; run_swap preflight checks for case
    mismatches'
  severity: fatal
- id: dt_009
  symptom: SWAP cannot find swap.swp file. Immediate crash on startup.
  diagnosis: 'SWAP not run from the correct working directory; SWAP always reads ''swap.swp'' from the
    current working directory (CWD). It does not accept command-line arguments for the config file path.
    If run from the wrong directory, it cannot find the input file.

    ; [''run_swap'']'
  remedy: 'cd to the directory containing swap.swp before running the binary; run_swap; [''cd /path/to/case/directory/'',
    ''ls swap.swp  # verify file exists'', ''/path/to/swap  # run from case directory'']; run_swap wrapper
    handles cd automatically'
  severity: fatal
- id: dt_010
  symptom: SWAP takes extremely long or appears to hang. Timestep becomes tiny.
  diagnosis: Convergence failure in Richards' equation solver — DTMAX too large for soil type; For clay
    soils with steep retention curves (low NPAR), the Richards' equation solver requires small timesteps.
    If DTMAX is too large (e.g., 0.1d), the solver backtracks repeatedly, reducing dt to DTMIN and iterating
    sl
  remedy: 'Reduce DTMAX to 0.01 or 0.005 for clay soils; None; [''In .swp: set DTMAX = 0.01'', ''Increase
    MAXIT to 50 if needed'', ''For extreme cases: DTMAX = 0.001'']; Set DTMAX based on soil texture: sand=0.04,
    loam=0.02, clay=0.01'
  severity: degraded
- id: dt_011
  symptom: Oscillating groundwater level, water table jumps between high and low values.
  diagnosis: 'GWLCONV convergence criterion too loose; GWLCONV specifies the maximum allowed GWL change
    between timesteps (cm). Default 100 cm is very loose. For cases with shallow water tables or drainage,
    this allows the water table to jump unrealistically between steps.

    ; [''calcgwl.f90'', ''soilwater.f90'']'
  remedy: 'Reduce GWLCONV to 1-10 cm; None; [''In .swp: set GWLCONV = 10.0 (or 1.0 for high precision)'',
    ''May need to also reduce DTMAX'']; Use GWLCONV = 10.0 as standard for all new cases'
  severity: degraded
- id: dt_012
  symptom: 'Fortran read error: ''list-directed I/O syntax error'' during input parsing.'
  diagnosis: 'Wrong format in .met or .swp file — mismatched columns or delimiters; SWAP uses Fortran
    list-directed read (READ *,) for .met files. This expects comma-separated or space-separated values
    with consistent column count. Extra columns, missing values, or tab characters can cause parse failures.

    ; [''rea'
  remedy: 'Verify .met file format: comma-delimited, consistent column count per row; None; [''Check .met
    file: head -15 file.met'', ''Verify 12 columns per data row'', "Remove any tab characters: sed -i
