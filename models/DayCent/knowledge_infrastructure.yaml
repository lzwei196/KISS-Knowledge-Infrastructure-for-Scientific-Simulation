# DayCent Knowledge Infrastructure (KDT v5.1)
# Generated by auto-dissect for DDcentEVI rev 491 (trunk, 2023-07-10)

package:
  name: hydrocraft-daycent-soil
  version: "1.0.0"
  description: "Knowledge infrastructure for the DayCent ecosystem and trace-gas model"
  target_model: "DayCent (DDcentEVI rev 491)"
  domain: "soil organic matter, plant production, trace-gas (N2O/NO/CH4) fluxes"
  authors:
    - "Knowledge Dissection Toolkit (auto-generated)"
  license: "model: CSU NREL DayCent; KI scripts: GPL-3.0"

binary:
  path: "KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect_multi_agent/_work_v2/DayCent/source/repo/Linux_Version_491/DDcentEVI_rev491"
  type: "ELF 64-bit, statically linked, x86-64"
  companion: "DDlist100_rev491"
  build_required: false
  build_notes: "Precompiled by upstream (CSU NREL); source not bundled in public release."

pipeline:
  stages:
    - id: s1_site_setup
      name: "Site setup"
      description: "Build <site>.100, sitepar.in, soils.in, outfiles.in"
      order: 1
      depends_on: []
      skill_document: "docs/s1_site_setup_skill.md"
      tools: [convert_soil_to_daycent]
      milestones:
        - id: m1_site_files_present
          description: "<site>.100, sitepar.in, soils.in, outfiles.in exist"
          verification: "test -f sitepar.in && test -f soils.in && test -f outfiles.in"

    - id: s2_weather
      name: "Weather forcing"
      description: "Build daily .wth file from CMFD/MSWX/NASA-POWER"
      order: 2
      depends_on: []
      skill_document: "docs/s2_weather_skill.md"
      tools: [convert_forcing_to_daycent]
      milestones:
        - id: m2_wth_present
          description: ".wth file exists with 7 columns and reasonable annual precip"
          verification: "awk '{print NF}' *.wth | sort -u | grep -q 7"

    - id: s3_equilibrium
      name: "Equilibrium spin-up"
      description: "ACEQ-driven steady-state spin-up; produces eq.bin"
      order: 3
      depends_on: [s1_site_setup, s2_weather]
      skill_document: "docs/s3_equilibrium_skill.md"
      tools: [run_daycent]
      milestones:
        - id: m3_eq_bin_present
          description: "eq.bin exists and is > 30 KB"
          verification: "test -s eq.bin"

    - id: s4_treatment
      name: "Base history and treatment"
      description: "Chain base history (-e eq) and treatment (-e base)"
      order: 4
      depends_on: [s3_equilibrium]
      skill_document: "docs/s4_treatment_skill.md"
      tools: [run_daycent]
      milestones:
        - id: m4_treat_bin_present
          description: "treatment binary exists and is > 30 KB"
          verification: "test -s treat.bin || test -s cb_nt.bin"

    - id: s5_extraction
      name: "Extraction and analysis"
      description: "DDlist100 extracts variables; parser tidies and computes metrics"
      order: 5
      depends_on: [s4_treatment]
      skill_document: "docs/s5_extraction_skill.md"
      tools: [parse_daycent_output]
      milestones:
        - id: m5_lis_parsed
          description: "tidy CSV exists with at least one data row"
          verification: "test -s *_tidy.csv || test -s *.lis"

tools:
  - id: convert_forcing_to_daycent
    name: "Forcing → DayCent .wth"
    description: "Convert CMFD/MSWX/NASA-POWER daily forcing to DayCent .wth (cm/day, °C)"
    stage: s2_weather
    script_path: "tools/convert_forcing_to_daycent.py"
    language: python
    inputs:
      - {name: source, type: string, required: true, example: "cmfd"}
      - {name: lat, type: number, required: true, example: "40.78"}
      - {name: lon, type: number, required: true, example: "-81.93"}
      - {name: year-start, type: integer, required: true, example: "1981"}
      - {name: year-end, type: integer, required: true, example: "2010"}
      - {name: out, type: file, required: true, example: "wooster.wth"}
    outputs:
      - {name: wth, type: file, path_pattern: "*.wth"}
    preconditions:
      - "ki_tools_common.load_forcing importable"
    postconditions:
      - "annual precipitation 5-500 cm/yr"
      - "mean Tmin < mean Tmax"

  - id: convert_soil_to_daycent
    name: "HWSD → DayCent soils.in"
    description: "Build a 13-layer soils.in from HWSD + ROSETTA at lat/lon"
    stage: s1_site_setup
    script_path: "tools/convert_soil_to_daycent.py"
    language: python
    inputs:
      - {name: lat, type: number, required: true, example: "40.78"}
      - {name: lon, type: number, required: true, example: "-81.93"}
      - {name: out, type: file, required: true, example: "soils.in"}
    outputs:
      - {name: soils, type: file, path_pattern: "soils.in"}
    preconditions:
      - "ki_tools_common.soil_utils importable"
    postconditions:
      - "FC > WP for every layer"
      - "sand + clay <= 1"
      - "root fraction column sums to ~1.0"

  - id: run_daycent
    name: "DayCent execution wrapper"
    description: "Three-step (eq -> base -> treatment) DayCent runner"
    stage: s3_equilibrium
    script_path: "tools/run_daycent.py"
    language: python
    inputs:
      - {name: run-dir, type: directory, required: true}
      - {name: eq-sched, type: string, required: true, example: "wooster_eq"}
      - {name: base-sched, type: string, required: false, example: "wooster_base"}
      - {name: treat-sched, type: string, required: false, example: "wooster_cb_nt_blk1"}
    outputs:
      - {name: eq_bin, type: file, path_pattern: "eq.bin"}
      - {name: treat_bin, type: file, path_pattern: "treat.bin"}
    preconditions:
      - "DDcentEVI_rev491 binary exists and is executable"
      - "schedule, sitepar.in, soils.in, outfiles.in all present in run-dir"
    postconditions:
      - "DDcentEVI exits with rc=0"
      - "eq.bin (and base.bin/treat.bin) > 30 KB"

  - id: parse_daycent_output
    name: "DayCent .lis parser"
    description: "Parse .lis/.out/.csv outputs and compute metrics vs observed"
    stage: s5_extraction
    script_path: "tools/parse_daycent_output.py"
    language: python
    inputs:
      - {name: lis, type: file, required: true}
      - {name: out, type: file, required: false}
      - {name: var, type: string, required: false}
      - {name: observed, type: file, required: false}
      - {name: metrics-out, type: file, required: false}
    outputs:
      - {name: tidy_csv, type: file, path_pattern: "*_tidy.csv"}
      - {name: metrics, type: file, path_pattern: "*metrics*.json"}
    preconditions:
      - ".lis file exists and was produced by matching DDlist100 revision"
    postconditions:
      - "parser reports n_rows > 0"

skill_documents:
  - {id: sd_s1, stage: s1_site_setup,  path: "docs/s1_site_setup_skill.md"}
  - {id: sd_s2, stage: s2_weather,     path: "docs/s2_weather_skill.md"}
  - {id: sd_s3, stage: s3_equilibrium, path: "docs/s3_equilibrium_skill.md"}
  - {id: sd_s4, stage: s4_treatment,   path: "docs/s4_treatment_skill.md"}
  - {id: sd_s5, stage: s5_extraction,  path: "docs/s5_extraction_skill.md"}

diagnostic_triplets:
  count: 20
  path: "diagnostics/triplets.yaml"
  failure_domains:
    - unit_conversion
    - parameter_format
    - dependency_mismatch
    - runtime
    - silent_error

validation:
  tier: real
  benchmark: "Wooster, OH long-term Corn-Soy no-till SOC (Lal et al.)"
  observation_source: "wooster_run_rev491_Linux.R shipped with DayCent v491"
  variable: "somsc"
  unit: "g C / m^2"
  observed_years: [1962, 1971, 1980, 1992]
  observed_values: [3402.0, 4789.45, 3885.0, 4266.28]
  metric_basis: "Pearson r and RMSE between simulated somsc and observed SOC"
  notes: |
    Validation uses the actual measured SOC at the Wooster long-term tillage
    experiment, embedded in the canonical DayCent run script. The model is
    executed as the precompiled ELF binary (no Python reimplementation).

summary:
  total_tools: 4
  total_skill_documents: 5
  total_diagnostic_triplets: 20
  pipeline_stages: 5
  pipeline_milestones: 5
