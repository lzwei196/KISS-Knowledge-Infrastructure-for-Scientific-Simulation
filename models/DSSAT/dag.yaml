      short_citation: "Chen et al. 2025"
      doi: "10.1038/s41598-025-95260-y"
      note: "EFAST SA + uncertainty of CERES-Wheat cultivar parameters across factorial water/N treatments; G2, G1, P1D dominate yield; P5/P1D dominate biomass; P1V/P1D dominate LAI."
    zhang2021_ceres_rice_gsa:
      short_citation: "Zhang et al. 2021"
      doi: "10.3390/agronomy11122446"
      note: "EFAST SA of CERES-Rice across cultivars and stage-specific climate perturbations; P2O dominates across outputs; grain yield most sensitive to THOT, then P1, G2, P2O, G1, PHINT."
    jiang2017_dssat_soilwater_n:
      short_citation: "Jiang et al. 2017"
      doi: "10.1007/s10705-016-9800-3"
      note: "OAT + global SA of CERES-Wheat and CERES-Maize in semi-arid and humid Canadian sites; yield highly sensitive to SDUL, N fertilizer rate, precipitation; N leaching to SDUL, SLLL, SLDR, precipitation, N rate."
    thorp2020_dssat_et_gsa:
      short_citation: "Thorp et al. 2020"
      doi: "10.1016/j.compag.2020.105837"
      note: "Morris GSA of seven ET options in DSSAT-CSM CROPGRO-Cotton at Bushland TX lysimeter; SDUL, SLLL, SLDR, SRGF and ET method choice (Priestley-Taylor vs FAO-56 PM vs ASCE) drive 14/23 agroecosystem metrics; sensitivity to initial soil water and SLLL increases under reduced irrigation."

safety:
  hazards:
    - id: "weather_SRAD_unit_or_range_error"
      kind: "weather_file_semantic"
      description: "SRAD outside 0-100 MJ/m2/day raises ErrCode 2 from DailyWeatherCheck; W/m2 values (50-350) trigger fatal error or, after silent <0.1 clamp, severely distort photosynthesis."
      severity: "fatal_or_silent"
      triplet_id: "dt_005,dt_009,dt_013"
    - id: "weather_TMAX_lt_TMIN"
      kind: "weather_file_semantic"
      description: "TMAX < TMIN on any day triggers ErrCode 6; typically caused by swapped columns or mixed F/C units."
      severity: "fatal"
      triplet_id: "dt_006"
    - id: "weather_nonsequential_dates"
      kind: "weather_file_semantic"
      description: "YRDOY out of chronological order or with missing/duplicated days triggers ErrCode 8 from IpWRec; affected by unsorted merges, Y2K errors, leap-year DOY 366 handling."
      severity: "fatal"
      triplet_id: "dt_007"
    - id: "weather_NaN_silent_to_missing"
      kind: "weather_file_semantic"
      description: "NaN values silently converted to -99 by IpWRec; downstream defaults can cause subtle errors with no warning."
      severity: "silent"
      triplet_id: "dt_008"
    - id: "weather_TAV_TAMP_silent_default"
      kind: "weather_file_semantic"
      description: "Missing TAV silently defaults to 20 C; missing TAMP silently defaults to 5 C; wrong defaults distort soil temperature seasonality, germination, root growth, OM decomposition."
      severity: "silent"
      triplet_id: "dt_010,dt_011"
    - id: "weather_WIND_unit_confusion"
      kind: "weather_file_semantic"
      description: "DSSAT expects WIND in km/day; m/s values are ~86x too low; no range check enforced; affects FAO-56 PM and ASCE ET options."
      severity: "silent"
      triplet_id: "dt_012"
    - id: "weather_WSTA_not_found"
      kind: "weather_file_semantic"
      description: "WSTA code in FileX *FIELDS does not match any available .WTH file; IPWTH_alt.for constructs FILEWW from WSTA+year+seq+.WTH and INQUIRE returns FALSE, raising ErrCode 29 (OPEN failed) or 30 (file missing). Common after weather-file rename, year-suffix mismatch, or NYEAR header drift."
      severity: "fatal"
      triplet_id: "dt_004"
    - id: "soil_SAT_lt_DUL_or_LL_gt_DUL"
      kind: "soil_semantic"
      description: "Water-ordering violation in any layer raises fatal Error 7 (SAT<DUL) or Error 8 (LL>DUL) from IPSOIL_Inp; typically from column misalignment or bad pedotransfer estimates."
      severity: "fatal"
      triplet_id: "dt_014,dt_015"
    - id: "soil_NLAYR_exceeds_NL"
      kind: "soil_semantic"
      description: "More than NL=20 layers triggers fatal Error 2; NL is compile-time fixed in ModuleDefs.for."
      severity: "fatal"
      triplet_id: "dt_016"
    - id: "soil_profile_not_found"
      kind: "soil_semantic"
      description: "Soil profile code in FileX *FIELDS not found in any searched .SOL triggers fatal Error 4 from IPSOIL."
      severity: "fatal"
      triplet_id: "dt_017"
    - id: "soil_SLNO_blank_silent_default"
      kind: "soil_semantic"
      description: "SLNO='-99' or blank in FileX *FIELDS causes IPSOIL_Inp to silently set SLPF=1.0, NLAYR=1 and skip the soil-file read; generic 1-layer default soil runs with no warning."
      severity: "silent"
      triplet_id: "dt_003"
    - id: "soil_SALB_nonpositive"
      kind: "soil_semantic"
      description: "SALB<=0 (often left at -99) raises fatal Error 12; SALB is required for energy balance and soil temperature."
      severity: "fatal"
      triplet_id: "dt_021"
    - id: "soil_SLNF_silent_clamp"
      kind: "soil_semantic"
      description: "SLNF outside [0,1] silently clamped to 1.0 with WARNING only; intended N-mineralization reduction silently lost."
      severity: "silent"
      triplet_id: "dt_020"
    - id: "soil_layer1_thick_unstable"
      kind: "soil_semantic"
      description: "First soil layer thicker than 5 cm triggers a WARNING that explicit numerical integration in WATBAL/SOILEV may become unstable."
      severity: "warning"
      triplet_id: "dt_019"
    - id: "soil_shallow_profile_SOC_40CM_zero"
      kind: "numerical_instability"
      description: "Soil profiles thinner than ~20 cm cause SOIL_40CM=0 leading to division-by-zero SIGFPE in CENTURY OPSOMLIT_C output (pre-fix); recent guard added but legacy builds still affected."
      severity: "fatal"
      triplet_id: "dt_018"
    - id: "ic_SH2O_clamped_to_SAT"
      kind: "initial_condition_semantic"
      description: "Initial volumetric soil water above SAT in any layer is silently clamped to [LL, SAT] at initialization; less water than specified, no warning."
      severity: "silent"
      triplet_id: "dt_029"
    - id: "ic_excessive_NO3_silent_yield_inflation"
      kind: "initial_condition_semantic"
      description: "No upper bound enforced on initial NO3/NH4 (ppm); unit confusion (kg/ha vs ppm) silently inflates early-season uptake and yield."
      severity: "silent"
      triplet_id: "dt_030"
    - id: "ic_layer_depth_misalignment"
      kind: "initial_condition_semantic"
      description: "IC layer depths (ICBL) not matching .SOL SLB trigger LMATCH interpolation; mismatched layers produce unexpected initial SH2O/SNO3/SNH4 distributions with no warning."
      severity: "silent"
      triplet_id: "dt_028"
    - id: "cultivar_code_not_found"
      kind: "coefficient_runtime_silent_fallback"
      description: "Cultivar INGENO in FileX not found in the .CUL raises fatal Error 2 from IPVAR; commonly from typo, wrong .CUL for selected MODEL, or version mismatch."
      severity: "fatal"
      triplet_id: "dt_022"
    - id: "cultivar_out_of_range_SPE"
      kind: "coefficient_runtime_silent_fallback"
      description: "Cultivar coefficients outside .SPE MINIMA/MAXIMA are not enforced - silently produce wrong phenology/yield; .SPE bounds are documentation only."
      severity: "silent"
      triplet_id: "dt_024"
    - id: "wrong_MODEL_silent_misinterpretation"
      kind: "coefficient_runtime_silent_fallback"
      description: "Wrong SMODEL code (e.g., MZCER vs MZIXM, CSCRP vs CRGRO) still parses with IOSTAT and silently misinterprets cultivar coefficients."
      severity: "silent"
      triplet_id: "dt_023"
    - id: "control_SDATE_after_PDATE"
      kind: "control_semantic"
      description: "Simulation start date after planting date raises fatal Error 4; events are processed chronologically from SDATE."
      severity: "fatal"
      triplet_id: "dt_025"
    - id: "control_ISWNIT_Y_ISWWAT_N"
      kind: "control_semantic"
      description: "Many N routines return early when ISWWAT='N' (OPSOILNI etc.); ISWNIT=Y with ISWWAT=N silently produces -99/zero N outputs despite fertilizer applications."
      severity: "silent"
      triplet_id: "dt_026"
    - id: "control_invalid_method_switch_silent_default"
      kind: "control_semantic"
      description: "Invalid MEWTH/MESOM/MEEVP/MEINF/MEPHO/MESOL/MESEV/METMP/MEGHG codes are silently replaced by IPSIM defaults (e.g., MEWTH='M', MESOM='G', MEEVP='R'); wrong method runs with no validation."
      severity: "silent"
      triplet_id: "dt_027"
    - id: "control_FMCD_silent_default"
      kind: "control_semantic"
      description: "Invalid fertilizer method code FMCD silently reset to '001' (broadcast); valid-but-unintended codes accepted; changes N volatilization/loss markedly."
      severity: "silent"
      triplet_id: "dt_034"
    - id: "control_NAPPL_silent_drop"
      kind: "control_semantic"
      description: "Management operations above NAPPL=9000 (fertilizer/irrigation/residue/harvest combined) silently dropped after IPFERT exits the read loop; long-term runs lose events with no error."
      severity: "silent"
      triplet_id: "dt_033"
    - id: "control_fertilizer_date_before_SDATE"
      kind: "control_semantic"
      description: "Fertilizer date before YRSIM with IFERI='R' raises fatal Error 3 from IPFERT; common after SDATE moved but fertilizer dates unchanged."
      severity: "fatal"
      triplet_id: "dt_031"
    - id: "control_harvest_date_before_SDATE"
      kind: "control_semantic"
      description: "Harvest dates before YRSIM are silently skipped by IPMAN/IPHAR (GO TO 50) under IHARI='R'; if no HDATE>=SDATE remains the season ends with no harvest event. Y4K_DOY raises Error 6 for invalid YRDOY."
      severity: "fatal_or_silent"
      triplet_id: "dt_032"
    - id: "control_auto_planting_no_window_met"
      kind: "control_semantic"
      description: "With IPLTI='A', AUTPLT checks soil-moisture/temperature criteria (TSDEP/AVGSW vs PTTN/PTX/SWPLTL/SWPLTH) each day in [PWDINF, PWDINL]; if criteria never satisfied, YRPLT stays 9999999 and the run steps days without planting (apparent hang). CropStatus=11 in Summary.OUT."
      severity: "fatal"
      triplet_id: "dt_039"
    - id: "phenology_TT_collapse_high_altitude"
      kind: "numerical_instability"
      description: "Persistent daily mean T below crop base temperature (e.g., >3000 m altitude) collapses thermal-time accumulation to zero; phenology routines divide by accumulated TT producing SIGFPE."
      severity: "fatal"
      triplet_id: "dt_036"
    - id: "ratephase_SIGFPE"
      kind: "numerical_instability"
      description: "Division by zero during RATE subroutines (zero PAW = DUL-LL, zero LAI denominator, zero soil mass for shallow soils) terminates the Fortran runtime with no DSSAT-level error message; output files truncated."
      severity: "fatal"
      triplet_id: "dt_035,dt_044"
    - id: "summary_OUT_yrdoy_parsing"
      kind: "parser_semantic"
      description: "Summary.OUT uses fixed-width FORMAT with 25-char TNAME; whitespace splitting misaligns columns and can map SDAT into HWAM position (huge fake yields); YRDOY treated as plain int produces apparent ADAT>MDAT."
      severity: "silent"
      triplet_id: "dt_050,dt_043"
    - id: "all_minus99_summary"
      kind: "parser_semantic"
      description: "Summary.OUT initialized to -99 by OPSUM (lines 362-459) at SEASINIT; early-season failure (weather error, crop failure, RATE crash) leaves -99 defaults that must never be averaged as data."
      severity: "silent"
      triplet_id: "dt_041"
    - id: "output_HWAH_zero_silent"
      kind: "parser_semantic"
      description: "HWAH = HWAM * HPC/100 is zero whenever the crop never matured, HPC=0, or grain filling was terminated by frost/drought; Summary.OUT reports HWAH=0 with no error, easily mistaken for a tool/parsing failure. Inspect MDAT, SWFAC, NSTRES to disambiguate."
      severity: "silent"
      triplet_id: "dt_042"
    - id: "PHOTO_R_for_CROPGRO_crop_zero_yield"
      kind: "control_semantic"
      description: "Setting PHOTO=R (RUE) for CROPGRO crops collapses leaf-level photosynthesis - AGEFAC drops to 0, plants die, yield is zero, OVERVIEW.OUT reports 'Plant died due to extreme stress'."
      severity: "critical"
      triplet_id: "dt_051"
  validation_limits:
    - "Single-point (one weather station + one soil profile) per run; no built-in distributed/spatial mode."
    - "Daily timestep at the forcing boundary; cannot resolve sub-daily atmospheric drivers (storms, sub-daily temperature peaks) - some processes compute hourly internally but the forcing is daily."
    - "Single-season simulation yields only one (sim, obs) pair; temporal NSE/KGE/r against time series require NYERS >= 2."
    - "Crops outside the calibrated cultivar library require new cultivar calibration before defensible use; .SPE MINIMA/MAXIMA are documentation, not enforced."
    - "Pre-v4.8 cultivar coefficients require recalibration after v4.8 soil-temperature changes."
    - "Long-term climate-change / risk applications recommend >= 30 years of weather records."
  warnings:
    - "PHOTO method is hardcoded by crop-model dispatch inside PLANT; LAND and CSM never see the switch but it can change biomass >5x by selecting ETPHOT vs PSE/TRANS for EOP supply."
    - "FLOOD>0 silently overrides MSALB to 0.05 inside SPAM, mutating effective albedo seen by PET without WEATHR/SOILDYN being aware."
    - "Module SAVE state on SPAM (and most CSM subroutines) persists across calls; multi-treatment runs that fail to reinitialize on SEASINIT can leak state from the previous treatment."
    - "OPSUM registers Summary.OUT columns by sentinel LABEL strings with no schema enforcement; any module can register/overwrite columns by name."
    - "WATBAL writes SWDELTS, SPAM writes SWDELTX, unsaturated flow writes SWDELTU; SW integration in LAND.for is order-dependent (SOIL then SPAM then PLANT)."
    - "Cultivar (.CUL), ecotype (.ECO), species (.SPE) data live as MODULE-scope SAVE state for the entire run after IPVAR/IPECO."
    - "MgmtOps.PADDY_MGMT can override MgmtOps.IRRIG amounts when CROP=RI without warning."
  assumptions:
    - statement: "Land unit is spatially uniform (single point / homogeneous field); a single (lat, lon) carries one soil profile, one cultivar choice, and one management schedule."
      scope: "All forward-model runs"
      source: "DSSAT component docs (Land Unit Module description; dssat.net/models-overview/components/) and Jones et al. 2003 Eur. J. Agronomy 18(3-4):235-265 (DOI 10.1016/S1161-0301(02)00107-7)"
      status: "adopted"
    - statement: "Mass is conserved for water across the soil column (Ritchie cascading WATBAL) and for inorganic and organic N, P, K and C in the active soil and plant pools; surface energy is not closed by default."
      scope: "Default ET options (MEEVP in {R, P, F, Z}); not the ETPHOT hourly canopy path"
      source: "WATBAL.for, RNOFF.for, SPAM.for, PET.for, CENTURY.for and SoilOrg.for module behavior in DSSAT-CSM source; Reynolds & Acock (1997) modular design criteria cited at dssat.net/development/model-development/"
      status: "adopted"
    - statement: "Inter-module communication is exclusively through defined I/O variables (and the shared ModuleData PUT/GET store); modules can be validated independently."
      scope: "All primary modules (WEATHR, SOIL, SPAM, PLANT, MGMTOPS)"
      source: "Reynolds & Acock 1997 design criteria documented at dssat.net/development/model-development/; SPAM.for PUT('SPAM', ...) and ModuleData GET pattern observed in DSSAT-CSM source"
      status: "adopted"
    - statement: "MESEV defaults to 'R' (old Ritchie two-stage) when *SIMULATION CONTROLS is absent, even though the recommended choice for v4.8+ is 'S' (Suleiman-Ritchie)."
      scope: "Soil evaporation calculation"
      source: "IPSIM.for default initialization in DSSAT-CSM source; SKILL/docs recommendation discrepancy noted in DSSAT user materials"
      status: "tentative"
    - statement: "MEEVP code 'R' is Ritchie/Priestley-Taylor as implemented in PETPT; 'F' is FAO-56 Penman-Monteith and requires WIND + DEWP/RHUM in the .WTH; 'Z' is ASCE."
      scope: "ET method dispatch"
      source: "SPAM.for PET dispatcher and PETPT/PETPEN/PETASCE module behavior in DSSAT-CSM source; dssat.net components page"
      status: "adopted"
    - statement: "CO2 is a time-varying atmospheric forcing (handled as a single concept and emitted once under forcing); ICO2 switch only selects its source (measured CO2xxx.WDA, static default ~380 ppm, or .WTH file column)."
      scope: "Inputs routing"
      source: "WEATHR/CO2VAL behavior in DSSAT-CSM source"
      status: "adopted"
    - statement: "Symbiotic N fixation is active only for legume crops with ISWSYM=Y; for non-legumes the switch is forced N regardless of FileX setting."
      scope: "N balance"
      source: "IPSIM.for control-switch validation and CROPGRO NFIX module behavior in DSSAT-CSM source"
      status: "adopted"

medium_evidence:
  - var: "MDAT (physiological maturity date)"
    source: "dag.yaml"
    quote: "Daily simulation of crop growth, development, and yield for 45+ crops as a function of soil-plant-atmosphere dynamics"
    note: "boundary.scope_in declares this DAG as crop growth and development, so physiological maturity is a crop development date."
  - var: "LAID / XLAI (daily leaf area index)"
    source: "docs/s9_output_parsing_skill.md"
    quote: "PlantGro.OUT contains daily plant growth variables for each treatment."
    note: "PlantGro.OUT is the daily plant-growth output; LAI is a crop canopy plant variable."
  - var: "CWAD (daily aboveground dry weight)"
    source: "docs/s9_output_parsing_skill.md"
    quote: "PlantGro.OUT contains daily plant growth variables for each treatment."
    note: "PlantGro.OUT is the daily plant-growth output; CWAD is aboveground crop-plant tops dry matter."
  - var: "GWAD (daily grain dry weight)"
    source: "docs/s9_output_parsing_skill.md"
    quote: "PlantGro.OUT contains daily plant growth variables for each treatment."
    note: "PlantGro.OUT is the daily plant-growth output; GWAD is dry matter in the crop grain pool."
  - var: "ET (daily actual evapotranspiration)"
    source: "KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1515_johh-2017-0055.txt"
    quote: "Coupling DSSAT and HYDRUS-1D for simulations of soil water dynamics in the soil-plant-atmosphere system"
    note: "DSSAT ET is a soil-plant-atmosphere water-flux output, not a generic open-water flux."
  - var: "GNAM (grain N content at maturity)"
    source: "docs/s9_output_parsing_skill.md"
    quote: "GNAM     | kg N/ha    | Grain N content at maturity                        | 5-150"
    note: "The output parsing table identifies GNAM as grain N, so the description specifies the crop grain pool."
