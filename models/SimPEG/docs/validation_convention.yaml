# Grounded in fetched OA/manual texts only. SimPEG/geophysical inversion validation is
# primarily noise-weighted data fit plus geologic/model-resolution judgment, not a
# universal NSE/CSI convention. Null bands mark places where the fetched field
# literature does not provide a numeric pass gate.

references:
  heagy2017:
    doi: 10.1016/j.cageo.2017.06.018
    title: "A framework for simulation and inversion in electromagnetics"
    venue: "Computers & Geosciences"
    year: 2017
    oa: manual
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1016_j.cageo.2017.06.018.txt
  heagy2019_aem:
    doi: 10.1080/08123985.2019.1583538
    title: "Open-source software for simulations and inversions of airborne electromagnetic data"
    venue: "Exploration Geophysics"
    year: 2019
    oa: green
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1080_08123985.2019.1583538.txt
  caterina2022_tlert:
    doi: 10.1007/s10712-022-09731-2
    title: "A Review on Applications of Time-Lapse Electrical Resistivity Tomography Over the Last 30 Years"
    venue: "Surveys in Geophysics"
    year: 2022
    oa: gold
