  diagnosis: Met data has extreme drought/wet years that alternately build/deplete pools; Short met records
    (5-10 years) with high interannual variability cause soil C to oscillate when recycled. The cycle
    length matches the met record length.; ['s5_spinup']
  remedy: Use longer met record (20+ years) for spinup cycling; ['Increase the met record to 20+ years
    if possible', 'Or smooth extreme precipitation years', 'Or increase max_spinup_years to allow more
    cycles']; Always use at least 10-year met records for spinup
