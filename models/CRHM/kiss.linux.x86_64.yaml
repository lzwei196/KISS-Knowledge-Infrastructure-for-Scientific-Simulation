kiss_manifest_version: 1
model: CRHM
binary_type: ELF
verified: unverified
install_dir: crhm
acquire:
  strategy: build
  repo: https://github.com/srlabUsask/crhmcode.git
  ref: master
  produces: bin/crhm.exe
python_deps:
- numpy
- pandas
- netcdf4
system_deps:
- cmake
- c++ compiler
- boost
reference_case: crhm.exe --help
notes: 'LINUX x86_64 port of the windows recipe (kiss.windows.yaml): same source pin
  and product path; binary_type/system_deps adapted. Not yet verified on Linux. Native
  Windows build observed on 2026-09-05. A shallow CMake build directory is required
  on hosts where the legacy MAX_PATH limit breaks spdlog''s nested ExternalProject
  compiler probe.'
agent_hint: Clone the official crhmcode source and initialise its spdlog submodule.
  On Windows configure in a shallow directory such as workspace/bld, then place the
  resulting crhm.exe at binaries/crhm/bin/crhm.exe. The help command exits 1 by design
  after printing usage; printed usage proves startup.
