# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: MODFLOW6
  language: fortran
  implementation:
    id: mf6-661
    version: 6.6.1
    provenance: Fortran; USGS-distributed mf6 command-line executable, control-volume finite-difference
      groundwater flow/transport solver.
  scientific_reference_version: MODFLOW 6 Groundwater Flow (GWF) Model — USGS TM 6-A55 (Langevin et al.
    2017) on the TM 6-A57 framework (Hughes et al. 2017); GWT transport per TM 6-A61 (Langevin et al.
    2022)
inputs:
  forcing:
  - name: Areal recharge (RCH RATE)
    unit: m/day
    category: forcing
    source_kind: forcing
    model_input_format: RCH package; array-based applied to highest active cell per column, or list-based
      per cellid
    notes: A RATE in LENGTH/TIME, NOT a volume. Primary inflow driving head/water-table elevation. List-based
      cellid with layer>0 silently injects recharge into a deep layer and leaves the water table unresponsive.
  - name: Evapotranspiration demand (EVT)
    unit: m/day
    category: forcing
    source_kind: forcing
    model_input_format: EVT package (surface elevation, max rate, extinction depth)
    notes: Optional head-dependent sink representing ET withdrawal from the saturated zone.
  parameters:
  - name: Hydraulic conductivity tensor (K11/K22/K33)
    unit: m/day
    category: parameters
    source_kind: calibrated
    model_input_format: NPF package; K (horizontal), K33 (vertical), optional angle1/2/3 rotation
    notes: Material-dependent (gravel 100-1000 to clay 1e-4..0.01 m/day); K33/K typically ~0.1 for layered
      sediments. NPF stores a pristine copy (k11input) so TVK/VSC can recompute working K each step.
  - name: Cell type (ICELLTYPE)
    unit: dimensionless
    category: parameters
    source_kind: user_provided
    model_input_format: NPF package; 0=confined (full thickness), 1=convertible (saturated thickness varies
      with head)
  - name: Specific storage (Ss)
    unit: 1/m
    category: parameters
    source_kind: calibrated
    model_input_format: STO package
    notes: Confined transient storage term.
  - name: Specific yield (Sy)
    unit: dimensionless
    category: parameters
    source_kind: calibrated
    model_input_format: STO package
    notes: Water-table drainable porosity, 0.01-0.35 for natural materials (>0.5 physically impossible).
  - name: Grid geometry (TOP/BOTM, DELR/DELC)
    unit: m
    category: parameters
    source_kind: user_provided
    model_input_format: DIS/DISV/DISU package; TOP (2-D), BOTM (3-D), DELR/DELC cell spacing
    notes: BOTM must be monotonically decreasing; zero-thickness layers (TOP==BOTM) produce NaN heads.
  - name: Active-domain mask (IDOMAIN)
    unit: dimensionless
    category: parameters
    source_kind: user_provided
    model_input_format: DIS package; 1=active, 0=inactive, -1=vertical pass-through
  - name: GWT dispersivity (ALH/ATH1/ATV) and diffusion
    unit: m (dispersivity); m2/s (diffusion)
    category: parameters
    source_kind: calibrated
    model_input_format: DSP package; ALH longitudinal (~L/10), ATH1 transverse (~ALH/10), ATV vertical
      (~ALH/100), diffc
  - name: GWT mobile-storage / sorption / decay (porosity, bulk_density, distcoef, decay)
    unit: porosity [-]; rho_b kg/L; Kd L/kg; lambda 1/day
    category: parameters
    source_kind: calibrated
    model_input_format: MST package
  - name: SFR reach geometry and roughness (rlen, rwid, rgrd, rtp, rbth, rhk, man)
    unit: m (length/width/thickness); dimensionless (gradient); m/day (rhk); s/m^(1/3) (Manning n)
    category: parameters
    source_kind: user_provided
    model_input_format: SFR package per-reach connection data
    notes: rgrd must be > 0; rtp - rbth must lie above the cell BOTM.
  initial_conditions:
  - name: Starting hydraulic head (STRT)
    unit: m
    category: initial_conditions
    source_kind: user_provided
    model_input_format: IC package
    notes: Must be >= BOTM and within layer bounds, else cells start dry and may never rewet. Also seeds
      NPF saturated-thickness initialization (THICKSTRT), not only the head vector.
  - name: Initial solute concentration
    unit: mg/L
    category: initial_conditions
    source_kind: user_provided
    model_input_format: IC package (GWT), typically 0
  boundary_conditions:
  - name: Constant head (CHD)
    unit: m
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: CHD package; (cellid, head) — acts as infinite source/sink
  - name: Well pumping/injection (WEL)
    unit: m3/day
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: WEL package; volumetric rate, negative=pumping, positive=injection
  - name: Drain (DRN)
    unit: elevation m; conductance m2/day
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: DRN package; (cellid, elevation, conductance) — removes water when head > elevation
  - name: River (RIV)
    unit: stage m; conductance m2/day; rbot m
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: RIV package; (cellid, stage, conductance, rbot) — rbot must be > cell BOTM and
      < stage
  - name: General head boundary (GHB)
    unit: head m; conductance m2/day
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: GHB package; head-dependent flux boundary
  - name: Temporal discretization (TDIS)
    unit: dimensionless
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: TDIS package; TIME_UNITS, NPER stress periods, PERLEN, NSTP, TSMULT
    notes: Per-period boundary conditions held constant; steady-state vs transient set per period via
      the STO iss flag.
  - name: Solver configuration (IMS complexity preset)
    unit: dimensionless
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: IMS package; COMPLEXITY SIMPLE/MODERATE/COMPLEX selecting linear method (CG vs
      BICGSTAB), under-relaxation, backtracking, DVCLOSE/RCLOSE
    notes: 'Structural switch. SIMPLE/CG fails on the asymmetric matrix produced by Newton or convertible
      layers; GWT must use BICGSTAB. Default SIMPLE preset: DVCLOSE=1e-3, MXITER=25, no under-relaxation.'
  - name: Newton-Raphson formulation switch (NEWTON UNDER_RELAXATION)
    unit: dimensionless
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: GWF model NEWTON option
    notes: Structural switch enabling stable drying/rewetting of unconfined cells; requires MODERATE/COMPLEX
      solver.
  - name: Output control (OC) save/print settings
    unit: dimensionless
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: OC package; HEAD/BUDGET SAVE/PRINT directives
    notes: Required to write .hds/.cbc spatial output; without it mf6 runs but emits no spatial output.
  - name: Advection scheme (ADV)
    unit: dimensionless
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: ADV package; UPSTREAM (stable), CENTRAL, or TVD (accurate)
outputs:
  primary:
  - name: hydraulic_head
    unit: m
    description: Hydraulic head per active cell; water table is the head in the topmost active non-dry
      cell per column.
    validation_rank: 1
    emitted_in: .hds (binary head file)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Compare at observation-well screen depth/layer, not the column top.
        - Dry cells carry HDRY=1e30; mask heads>0.9e30 before any comparison.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Steady-state or single-period head; verify the cell did not go dry.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Interpolated water-table surface; mask HDRY before contouring.
      detrending_options:
      - none
      - linear_residual
  - name: water_table_elevation
    unit: m
    description: Head in the topmost active non-dry cell per column; the simulated water-table surface.
    validation_rank: 2
    emitted_in: derived from .hds (flopy get_water_table; nodata 1e30)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Depth-to-water observations must be referenced to the same datum as TOP.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats: []
      detrending_options:
      - none
      - linear_residual
  - name: cell_budget_flux_terms
    unit: m3/day
    description: Groundwater cell-by-cell flow terms (STO-SS, STO-SY, FLOW-JA-FACE, CHD, RCH, DRN, RIV,
      WEL) with sign convention positive=inflow, negative=outflow.
    validation_rank: 3
    emitted_in: .cbc (binary cell-by-cell budget file)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - DRN/RIV baseflow is negative (outflow); negate before comparing to stream-gauge baseflow.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Sum the relevant budget term over the comparison domain (basin/zone).
      detrending_options:
      - none
  - name: solute_concentration
    unit: mg/L
    description: Groundwater (GWT) solute concentration per cell from advection-dispersion-reaction.
    validation_rank: 4
    emitted_in: .ucn (binary concentration file)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Breakthrough timing is sensitive to advection scheme (numerical dispersion in UPSTREAM).
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Plume extent depends on scale-dependent dispersivity (ALH).
      detrending_options:
      - none
  - name: stream_stage
    unit: m
    description: SFR stream stage per reach per timestep from Manning's equation.
    validation_rank: 5
    emitted_in: .sfr.stg (binary)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Dry reaches carry DNODATA=-1e30; filter before statistics.
      detrending_options:
      - none
  - name: stream_aquifer_exchange
    unit: m3/day
    description: SFR stream-aquifer exchange (gaining/losing) and reach inflow/outflow.
    validation_rank: 6
    emitted_in: .sfr.cbc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Compare against gauge-derived baseflow/seepage estimates, mind sign convention.
      detrending_options:
      - none
  - name: volumetric_budget_discrepancy
    unit: percent
    description: Listing-file volumetric groundwater-budget summary (numerical solver diagnostic, not
      a field observable); PERCENT DISCREPANCY is the primary convergence/balance diagnostic.
    validation_rank: 7
    emitted_in: .lst (gwf.lst / mfsim.lst)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Internal self-consistency diagnostic, not an observation; |discrepancy| > 1% indicates unreliable
          results.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_mf6_001
  symptom: MODFLOW 6 fails to converge within the maximum number of outer iterations for one or more stress
    periods. Listing file shows 'FAILED TO CONVERGE' messages.
  diagnosis: Solver settings are insufficient for the problem nonlinearity, or the problem itself is ill-posed
    (e.g., conflicting boundary conditions, extreme parameter contrasts).; MODFLOW 6 uses an iterative
    solver (IMS) that must converge within OUTER_MAXIMUM iterations. For nonlinear problems (unconfined
    flo
  remedy: 'Increase solver iterations and enable advanced convergence aids.; build_ims_package; [''Switch
    to COMPLEX complexity: set COMPLEXITY=COMPLEX in IMS'', ''Increase OUTER_MAXIMUM to 500'', ''Enable
    Newton: add NEWTON UNDER_RELAXATION to GWF OPTIONS'', ''Check K contrasts: ratio between adjacent
    cells should b'
  severity: fatal
- id: dt_mf6_002
  symptom: Many cells go dry during simulation. Listing file shows large numbers of 'DRY' cells. Heads
    in affected cells are set to HDRY (1e30). May lead to convergence failure.
  diagnosis: Water table drops below cell bottom, typically due to insufficient recharge, excessive pumping,
    or incorrect layer geometry.; When head in a convertible cell (ICELLTYPE=1) drops below the cell bottom,
    the cell goes dry. In the standard formulation, dry cells are removed from the solution and can cau
  remedy: 'Address the physical cause (insufficient recharge or excessive extraction) and use Newton formulation.;
    ; [''Enable Newton formulation: NEWTON UNDER_RELAXATION in GWF OPTIONS'', ''Check recharge: is RCH
    rate realistic? Compare to precipitation'', ''Check pumping: are WEL rates sustainable for the aquifer'
  severity: degraded
- id: dt_mf6_003
  symptom: Water budget percent discrepancy exceeds 0.1%. Listing file shows high PERCENT DISCREPANCY
    values. Total inflow and outflow do not balance.
  diagnosis: Solver did not achieve sufficient accuracy, or convergence criteria (DVCLOSE, RCLOSE) are
    too loose for the problem.; MODFLOW 6 computes a volumetric water budget at each timestep. In a perfectly
    converged solution, IN = OUT + STORAGE_CHANGE. A nonzero discrepancy indicates the iterative solution
    st
  remedy: Tighten solver convergence criteria.; build_ims_package; ['Reduce DVCLOSE by 10x (e.g., 0.001
    -> 0.0001)', 'Reduce RCLOSE by 10x (e.g., 0.1 -> 0.01)', 'Increase OUTER_MAXIMUM and INNER_MAXIMUM',
    'Check if specific stress periods have high discrepancy (transient vs steady)', 'If discrepancy is
    in sto
  severity: silent
- id: dt_mf6_004
  symptom: Water table rises unrealistically high, possibly above land surface. Heads are much higher
    than expected. No error message from MODFLOW.
  diagnosis: Recharge rate passed in mm/day instead of m/day (1000x too high). VIC deep percolation is
    in mm/day; MODFLOW RCH expects m/day.; VIC's OUT_BASEFLOW (deep percolation / baseflow) is output
    in mm/day. MODFLOW 6 RCH package expects recharge in the model's length/time units (typically m/day).
    If the use
  remedy: 'Divide VIC baseflow by 1000 before passing to MODFLOW RCH.; build_rch_package; [''Verify VIC
    output units: OUT_BASEFLOW is in mm/day'', ''Convert: recharge_m_day = vic_baseflow_mm_day / 1000.0'',
    ''Sanity check: typical recharge 0.0001 to 0.01 m/day'', ''Re-run with corrected values'']; Always
    include unit '
  severity: silent
- id: dt_mf6_005
  symptom: MODFLOW 6 aborts during initialization with error about layer bottom elevation being above
    layer top or the layer above it.
  diagnosis: 'Layer bottom elevations are not monotonically decreasing with depth. BOTM[k] must be < BOTM[k-1]
    (or TOP for k=0).; MODFLOW 6 requires that each layer''s bottom elevation is below the bottom of the
    layer above it (or below TOP for the first layer). This ensures positive layer thickness everywhere.
    A '
  remedy: 'Fix layer bottom elevation ordering.; build_dis_package; [''Verify: TOP > BOTM[0] > BOTM[1]
    > ... > BOTM[nlay-1] for all cells'', ''If using relative depths: BOTM[k] = TOP - sum(thicknesses[0:k+1])'',
    ''Check for cells where DEM (TOP) is very low — may invert layer order'', ''Ensure minimum layer thickness'
  severity: fatal
- id: dt_mf6_006
  symptom: Statistics or contour plots show extreme values (near 1e30). Mean head is unrealistically high.
    Contour map colorbar spans from realistic values to 1e30.
  diagnosis: Dry cell sentinel value (HDRY = 1e30) included in analysis without masking. MODFLOW sets
    head to 1e30 for cells that go dry.; When a convertible cell goes dry, MODFLOW 6 assigns the HDRY
    sentinel value (1.0e30) to that cell's head. This is not a real head value — it is a flag. If included
    in numpy o
  remedy: 'Mask HDRY values before any analysis.; extract_heads; [''Apply mask: heads_masked = np.where(heads
    > 0.9e30, np.nan, heads)'', ''Or use: heads_masked = np.ma.masked_where(heads > 0.9e30, heads)'',
    ''Verify: np.nanmax(heads_masked) < 1e6 (reasonable head range)'', ''Report dry cell count: (heads
    > 0.9e30).s'
  severity: fatal
- id: dt_mf6_007
  symptom: FloPy raises AttributeError or TypeError when creating MODFLOW 6 packages. Package classes
    may be missing or have changed signatures.
  diagnosis: FloPy version is too old for the MODFLOW 6 version being used, or too new and has deprecated
    APIs.; FloPy's MODFLOW 6 support evolved significantly between versions 3.2 and 3.5. Package class
    names, constructor arguments, and data handling changed. Using FloPy 3.2 with MODFLOW 6.5+ will fail
    because
  remedy: 'Upgrade FloPy to latest version.; verify_mf6_installation; [''pip install --upgrade flopy'',
    ''Verify: python -c "import flopy; print(flopy.__version__)"'', ''Minimum recommended: FloPy >= 3.4.0'',
    ''Check MODFLOW 6 compatibility notes in FloPy changelog'']; Pin FloPy version in requirements.txt.
    Test with '
  severity: fatal
- id: dt_mf6_008
  symptom: Recharge has no visible effect on water table. Water table does not respond to changes in recharge
    rate. Budget shows recharge entering a deep layer.
  diagnosis: 'List-based RCH package with explicit cellid specifying a deep layer instead of the top active
    cell. Or READASARRAYS RCH with IRCH pointing to wrong layer.; MODFLOW 6 has two RCH implementations:
    array-based (READASARRAYS, applies to highest active cell automatically) and list-based (cellid specified'
  remedy: 'Use array-based RCH (ModflowGwfrcha) which auto-applies to top active cell.; build_rch_package;
    [''Replace ModflowGwfrch with ModflowGwfrcha (array-based)'', ''Or ensure all cellid tuples in list-based
    RCH have layer=0'', ''Verify: check budget term — RCH flux should affect layer 1 in listing file''];
    Alw'
  severity: silent
- id: dt_mf6_009
  symptom: Solver oscillates without converging. Outer iteration count hits maximum every timestep. Head
    changes alternate between positive and negative between iterations.
  diagnosis: Using SIMPLE solver complexity (CG, no under-relaxation) for a nonlinear problem with convertible
    layers or Newton formulation.; The CG (Conjugate Gradient) linear solver used in SIMPLE complexity
    works well for linear (all confined) problems. For nonlinear problems where transmissivity depends
    on h
  remedy: 'Switch to MODERATE or COMPLEX solver complexity.; build_ims_package; [''Change COMPLEXITY from
    SIMPLE to COMPLEX'', ''This enables BICGSTAB solver, DBD under-relaxation, and backtracking'', ''If
    using Newton: COMPLEX is mandatory'', ''Increase OUTER_MAXIMUM to at least 100'']; Always use MODERATE
    or COMPLEX'
  severity: degraded
- id: dt_mf6_010
  symptom: Groundwater flow velocities are unrealistically fast. Water table responds too quickly to recharge.
    Heads equilibrate almost instantly. No error from MODFLOW.
  diagnosis: Hydraulic conductivity from VIC soil parameters used without unit conversion. VIC Ksat is
    in mm/day; MODFLOW expects m/day (1000x smaller).; VIC's Ksat parameter is stored in mm/day in the
    soil parameter file. MODFLOW expects K in the model's length/time units (m/day if LENGTH_UNITS=meters).
    Using V
  remedy: 'Divide VIC Ksat by 1000 to convert mm/day to m/day.; build_npf_package; [''K_m_day = VIC_Ksat_mm_day
    / 1000.0'', ''Verify K range: sand 1-100 m/day, silt 0.01-1, clay 0.0001-0.01'', ''If K > 100 m/day
    for non-gravel materials, units are likely wrong'']; Include unit conversion in all VIC-to-MODFLOW
    parame'
  severity: silent
- id: dt_mf6_011
  symptom: Many cells are immediately dry at simulation start. Model may converge but with large areas
    of no-data. Or Newton solver has difficulty converging in early timesteps.
  diagnosis: Initial conditions (IC) specify starting heads below layer bottom elevations. These cells
    start as dry and may never rewet.; If STRT < BOTM for a convertible cell, that cell is immediately
    dry at time 0. In standard formulation, dry cells cannot rewet. With Newton, they can potentially
    rewet but req
  remedy: 'Set starting heads above layer bottom for all active cells.; build_ic_package; [''Compute safe
    starting head: STRT = max(BOTM[layer] + 1.0, TOP - 5.0)'', ''Or use a spatially varying STRT: interpolate
    from known water levels'', ''Or run a steady-state simulation first and use those heads as STRT'',
