# format_spec.yaml — Machine-readable model format specification
# Generated by KDT generate_format_spec.py
# Source: /mnt/disk1/Hydrocraft_server/models/DayCent/knowledge_infrastructure

model:
  name: DayCent (Daily Century Soil Organic Matter, Plant Production, and Trace-Gas Model)
  domain: biogeochemistry
  secondary_domains:
  - ghg_emissions
  - soil_carbon
  - crop_yield
  binary: DD18centEVI_rev491
  binary_path: /mnt/disk1/Hydrocraft_server/model/daycent/bin/DD18centEVI_rev491
  language: Fortran77
  execution: ./DD18centEVI_rev491 -s schedule.sch -n run_root
  notes: USDA/IPCC reference model for cropland N2O inventory.
inputs:
  forcing:
  - name: precipitation
    file: <root>.wth
    column: 7
    unit: cm/day
    valid_range: [0.0, 50.0]
    format: ASCII column-aligned daily weather (.wth file)
    silent_error: precipitation in mm/day (the global default) instead of cm/day → soil saturated daily, runoff > 100 cm/yr. Convert with ÷10.
  - name: temperature_max
    file: <root>.wth
    column: 5
    unit: degC
    valid_range: [-50.0, 60.0]
    silent_error: temperature in Kelvin (CMFD raw) → all rates wrong. Subtract 273.15.
  - name: temperature_min
    file: <root>.wth
    column: 6
    unit: degC
    valid_range: [-70.0, 50.0]
  - name: solar_radiation
    file: <root>.wth
    column: 4
    unit: langleys/day
    valid_range: [0.0, 800.0]
    notes: 1 langley = 41.84 kJ/m². If MJ/m²/day input, convert × 23.9.
  static:
  - name: soil_layers
    file: site.100
    parameter: SOIL.LYRS
    notes: Soil profile depth + texture per layer
  - name: schedule
    file: <root>.sch
    notes: Management events (planting, harvest, fertilization, tillage) on a daily-event timeline
  - name: cultivation_events
    file: <root>.sch
    notes: Crop type, planting date, harvest date per year
outputs:
  primary:
  - name: n2o_emission
    canonical_id: n2o_emission
    file: nflux.out
    unit: gN/m2/day
    valid_range: [0.0, 0.5]
    aggregation: sum daily values for annual total
    notes: Primary trace-gas output. USDA/IPCC reference for cropland N₂O inventory. Convert × 10 for kg N/ha.
  - name: nitrification_n2o
    canonical_id: n2o_emission
    file: nflux.out
    unit: gN/m2/day
    notes: Component of n2o_emission, nitrification pathway
  - name: denitrification_n2o
    canonical_id: n2o_emission
    file: nflux.out
    unit: gN/m2/day
    notes: Component of n2o_emission, denitrification pathway
  - name: no_emission
    canonical_id: no_emission
    file: nflux.out
    unit: gN/m2/day
    valid_range: [0.0, 0.2]
  - name: ch4_emission
    canonical_id: ch4_emission
    file: nflux.out
    unit: gC/m2/day
    valid_range: [0.0, 5.0]
    notes: CH4 oxidation/emission; usually small for upland soils, large for paddy/wetland
  - name: co2_heterotrophic
    canonical_id: co2_flux
    file: summary.out
    unit: gC/m2/day
    valid_range: [0.0, 30.0]
    notes: Soil heterotrophic respiration (decomposition of soil organic matter)
  - name: aboveground_biomass
    canonical_id: biomass
    file: bio.out
    unit: gC/m2
    valid_range: [0.0, 5000.0]
  - name: belowground_biomass
    canonical_id: biomass
    file: bio.out
    unit: gC/m2
  - name: crop_yield
    canonical_id: yield
    file: harvest.csv
    unit: gC/m2
    notes: Convert × 10 ÷ 0.45 for kg dry-matter/ha (assuming 45% C content)
  - name: soil_organic_carbon
    canonical_id: soil_carbon
    file: <root>.lis
    unit: gC/m2
    valid_range: [0.0, 50000.0]
    notes: Total soil organic C stock; primary state variable.
  - name: soil_moisture_layers
    canonical_id: soil_moisture
    file: vswc.out
    unit: m3/m3
    valid_range: [0.0, 0.6]
    aggregation: per-layer daily volumetric water content
  - name: soil_temperature_layers
    canonical_id: soil_temperature
    file: soiltavg.out
    unit: degC
    aggregation: per-layer daily average temperature
  - name: water_balance
    canonical_id: evapotranspiration
    file: watrbal.out
    unit: cm/day
    notes: ET, runoff, drainage components
  annual:
  - name: annual_n2o
    canonical_id: n2o_emission
    file: year_summary.out
    unit: gN/m2/year
    aggregation: annual sum of daily nflux values
known_issues:
- id: 1
  description: Soil moisture saturated every day; runoff in summary.out > 100 cm/yr.
  affected_output: Precipitation in the .wth file is in mm/day instead of cm/day.
  detection: Precipitation in the .wth file is in mm/day instead of cm/day.
  fix: Re-run convert_forcing_to_daycent.py — its validate_outputs() checks annual precip is 5–500 cm/yr. Manually verify
    column 7 of the .wth file is in cm/day, not mm/day.
- id: 2
  description: All daily Tmin and Tmax appear ~270 in summary.out.
  affected_output: Temperature columns 5/6 of the .wth file are in Kelvin (CMFD raw).
  detection: Temperature columns 5/6 of the .wth file are in Kelvin (CMFD raw).
  fix: Subtract 273.15 from columns 5 and 6. The converter does this automatically when mean(T) > 150.
- id: 3
  description: DayCent runs but Tmin > Tmax in stdout summary.
  affected_output: Columns 5 and 6 in the .wth file are swapped (Tmax in col 5, Tmin in col 6).
  detection: Columns 5 and 6 in the .wth file are swapped (Tmax in col 5, Tmin in col 6).
  fix: 'Check the load_daily_forcing dict keys: ''tmin'' must go to col 5, ''tmax'' to col 6. The converter validates mean(Tmin)
    < mean(Tmax).'
- id: 4
  description: DayCent stops with 'unable to read line N of weather file'.
  affected_output: A .wth row has wrong number of columns or non-numeric content.
  detection: A .wth row has wrong number of columns or non-numeric content.
  fix: 'Run `awk ''{print NF}'' wooster.wth | sort -u` — every row should have 7 fields. Check for stray header lines or comma
    decimal separators (locale issue: run with LC_ALL=C).'
- id: 5
  description: DayCent crashes during initialisation with 'cannot find <site>.100'.
  affected_output: The schedule file's third line names a site .100 file that is not in the run directory or library path.
  detection: The schedule file's third line names a site .100 file that is not in the run directory or library path.
  fix: Either copy <site>.100 into the run directory or run with `-l /path/to/100/lib`. Check the third line of the .sch file
    matches your filename exactly (case-sensitive).
- id: 6
  description: soils.in column 3 (bulk density) values are 1230, 1300, 1340.
  affected_output: Bulk density was written in kg/m³ instead of g/cm³.
  detection: Bulk density was written in kg/m³ instead of g/cm³.
  fix: Divide by 1000. convert_soil_to_daycent.py auto-detects values > 100 and converts.
- id: 7
  description: DayCent runs but ANPP is 0 every year.
  affected_output: soils.in root-fraction column (col 7) sums to 0, so no roots can extract water.
  detection: soils.in root-fraction column (col 7) sums to 0, so no roots can extract water.
  fix: Check sum(col 7) ~ 1.0. The convert_soil_to_daycent.py validator warns when out of [0.95, 1.05].
- id: 8
  description: Wilting point > field capacity in soils.in.
  affected_output: Column 4 (FC) and column 5 (WP) are swapped or ROSETTA returned absurd values for a sandy soil.
  detection: Column 4 (FC) and column 5 (WP) are swapped or ROSETTA returned absurd values for a sandy soil.
  fix: Validator raises 'FC <= WP' before the file is used. Re-check the ROSETTA inputs (sand+clay should be ≤ 1).
- id: 9
  description: ACEQ run reaches the maximum block count without convergence.
  affected_output: Climate cycle in the .wth file is too short or has unrepresentative trend; SOM cannot stabilise.
  detection: Climate cycle in the .wth file is too short or has unrepresentative trend; SOM cannot stabilise.
  fix: Provide a 30+ year detrended climate cycle. Increase the +N value on the ACEQ line in the schedule. Re-check soils.in
    for unrealistic Ksat or root distribution.
- id: 10
  description: Equilibrium produces SOM C of 1500 g/m² in a temperate humid site.
  affected_output: Initial SOM pools in <site>.100 (som1ci, som2ci, som3ci) were not adjusted from a desert template.
  detection: Initial SOM pools in <site>.100 (som1ci, som2ci, som3ci) were not adjusted from a desert template.
  fix: Use 100_Files/site_template_rev491.100 as the base and edit only what you need. Check that strucc, metabc, som1c, som2c,
    som3c are non-zero and sum to a plausible total.
- id: 11
  description: Treatment run fails immediately with 'cannot read binary file base'.
  affected_output: Base history was not run before treatment, or `-e base` does not match the actual filename produced by
    the previous step.
  detection: Base history was not run before treatment, or `-e base` does not match the actual filename produced by the previous
    step.
  fix: Check that base.bin exists in the run directory and is non-empty. Run `ls -la *.bin` between steps. The run_daycent.py
    wrapper enforces the correct order.
- id: 12
  description: Treatment harvest.csv is empty.
  affected_output: outfiles.in still has `harvest.csv` set to 0, OR there are no HARV events in the schedule.
  detection: outfiles.in still has `harvest.csv` set to 0, OR there are no HARV events in the schedule.
  fix: Set the harvest.csv toggle to 1 in outfiles.in before the treatment run. Verify the .sch file has HARV lines for the
    period you care about.
- id: 13
  description: Treatment run uses the wrong climate years.
  affected_output: The .sch file's `Weather choice` line points to a .wth file that does not span the treatment period; DayCent
    silently recycles the available years.
  detection: The .sch file's `Weather choice` line points to a .wth file that does not span the treatment period; DayCent
    silently recycles the available years.
  fix: Make sure the .wth file covers Schedule Start..Schedule End. The wrapper run_daycent.py does not check this — verify
    manually.
- id: 14
  description: DDlist100 produces a .lis file with fewer columns than requested.
  affected_output: One or more variable names in the var-list file are misspelled; DDlist100 silently drops unknown names.
  detection: One or more variable names in the var-list file are misspelled; DDlist100 silently drops unknown names.
  fix: 'Compare your varlist against the canonical names in DayCent_Manual_full_02.06.2024.pdf (search for ''List of Output
    Variables''). Common typos: aglivec instead of aglivc, somc instead of somsc.'
- id: 15
  description: parse_daycent_output.py says 'too few lines for .lis format'.
  affected_output: DDlist100 was given the wrong bin root (e.g. 'eq' instead of 'cb_nt') and produced an almost-empty .lis.
  detection: DDlist100 was given the wrong bin root (e.g. 'eq' instead of 'cb_nt') and produced an almost-empty .lis.
  fix: Check that the bin_root passed to DDlist100 corresponds to the .bin file you actually want to extract. Run `file *.bin`
    to see what you have.
- id: 16
  description: metrics.json shows pearson_r ~ 0 with very large RMSE.
  affected_output: 'Time matching mismatch: observed series uses calendar year but the simulated ''time'' column is decimal
    year, so nearest-year matching is picking the wrong rows.'
  detection: 'Time matching mismatch: observed series uses calendar year but the simulated ''time'' column is decimal year,
    so nearest-year matching is picking the wrong rows.'
  fix: Check both 'time' columns in head -2 of the .lis and the obs CSV. parse_daycent_output.py uses ±1 year tolerance —
    narrow this if your obs are mid-year.
- id: 17
  description: DDlist100 segfaults or 'cannot open binary file'.
  affected_output: Trying to extract from a .bin produced by a different revision of DDcentEVI; binary format is not stable
    across revisions.
  detection: Trying to extract from a .bin produced by a different revision of DDcentEVI; binary format is not stable across
    revisions.
  fix: Use the matching DDlist100 version (rev 491 binary needs DDlist100_rev491). The two ship together in Linux_Version_491/.
- id: 18
  description: Annual precipitation in summary.out is exactly 1/10 of expected.
  affected_output: Converter divided cm/day inputs by 10 a second time. The auto-detect heuristic flagged a unit conversion
    that wasn't needed.
  detection: Converter divided cm/day inputs by 10 a second time. The auto-detect heuristic flagged a unit conversion that
    wasn't needed.
  fix: 'Bypass the heuristic: pre-divide your inputs to cm/day yourself, or use a forcing source whose units are unambiguous
    (NASA POWER returns mm/day reliably).'
- id: 19
  description: DDcentEVI reports 'Negative pool detected, simulation aborted'.
  affected_output: A SOM or N pool went negative due to a parameter inconsistency — usually epnfa/epnfs (atmospheric N inputs)
    too low, or fix.100 mismatched with site.100.
  detection: A SOM or N pool went negative due to a parameter inconsistency — usually epnfa/epnfs (atmospheric N inputs) too
    low, or fix.100 mismatched with site.100.
  fix: Verify fix.100 is the rev 491 version (in 100_Files/). Increase epnfa to 0.05–0.10 g N/m²/yr if your site is N-limited.
- id: 20
  description: Crop yield (cgrain) is reasonable but cumulative SOC drops faster than expected.
  affected_output: OMAD (organic amendment) lines in the schedule reference an event name not present in omad.100, so the
    model adds zero amendment but does not warn.
  detection: OMAD (organic amendment) lines in the schedule reference an event name not present in omad.100, so the model
    adds zero amendment but does not warn.
  fix: grep the OMAD event name from the schedule against omad.100 — every OMAD line must reference an omad.100 entry by name.
