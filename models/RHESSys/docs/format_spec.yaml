# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: RHESSys
  language: c
  implementation:
    id: rhessys-7.4
    version: 7.4 (binary rhessys7.4)
    provenance: C implementation of RHESSys 7.4 shipped from github.com/RHESSys/RHESSys; couples TOPMODEL-concept
      hydrology with Biome-BGC ecophysiology.
  scientific_reference_version: RHESSys 7.4 (Tague & Band 2004 Earth Interactions object-oriented C/water/N
    cycling framework)
inputs:
  forcing:
  - name: rain (precipitation, rain+snow)
    unit: m/day
    category: atmosphere
    source_kind: forcing
    model_input_format: .rain ASCII daily series referenced by base-station file
    notes: MUST be m/day, not mm/day; mm/day silently inflates all water fluxes ~1000x (dt_001).
  - name: tmax (daily maximum temperature)
    unit: degC
    category: atmosphere
    source_kind: forcing
    model_input_format: .tmax ASCII daily series
    notes: Celsius, not Kelvin (dt_003). Day-to-day tmax-tmin range drives MTCLIM/Bristow-Campbell cloud
      correction; a constant range disables it (dt_020).
  - name: tmin (daily minimum temperature)
    unit: degC
    category: atmosphere
    source_kind: forcing
    model_input_format: .tmin ASCII daily series
  - name: relative_humidity
    unit: fraction (0-1)
    category: atmosphere
    source_kind: forcing
    model_input_format: .relative_humidity ASCII daily series (optional)
    notes: Fraction not percent; % input must be divided by 100.
  - name: wind
    unit: m/s
    category: atmosphere
    source_kind: forcing
    model_input_format: .wind ASCII daily series (optional)
  - name: Kdown_direct
    unit: W/m^2 (direct-beam shortwave)
    category: atmosphere
    source_kind: forcing
    model_input_format: base-station daily sequence (optional)
    notes: Must be supplied together with Kdown_diffuse; supplying only one makes RHESSys zero both and
      recompute clear-sky radiation, causing vegetation collapse in humid climates (dt_019).
  - name: Kdown_diffuse
    unit: W/m^2 (diffuse shortwave)
    category: atmosphere
    source_kind: forcing
    model_input_format: base-station daily sequence, paired with Kdown_direct
  - name: daytime_rain_duration
    unit: hours (internally x3600 to seconds)
    category: atmosphere
    source_kind: forcing
    model_input_format: base-station non-critical daily sequence (optional)
    notes: If absent, rain_duration defaults to 86400 s (all day) for any precip, zeroing transpiration
      on every rainy day (dt_022).
  - name: CO2 / N deposition (NO3, NH4) / atmospheric transmissivity / cloud fraction
    unit: varies (ppm; kgN/m^2; fraction)
    category: atmosphere
    source_kind: forcing
    model_input_format: optional base-station daily sequences
    notes: Optional atmospheric drivers when corresponding climate sequences are provided.
  parameters:
  - name: Ksat_0 (surface saturated hydraulic conductivity)
    unit: m/day
    category: soil
    source_kind: calibrated
    model_input_format: soil_*.def
    notes: Range 0.001-100; cm/hr input must be x0.24 (dt_005). Very-high calibration sensitivity.
  - name: m (transmissivity decay parameter)
    unit: m
    category: soil
    source_kind: calibrated
    model_input_format: soil_*.def
    notes: Range 0.01-20; controls exponential decay of transmissivity with depth (TOPMODEL).
  - name: porosity_0
    unit: m^3/m^3
    category: soil
    source_kind: calibrated
    model_input_format: soil_*.def
    notes: Range 0.2-0.7; >1.0 (percent) crashes the model (dt_006).
  - name: porosity_decay
    unit: 1/m
    category: soil
    source_kind: calibrated
    model_input_format: soil_*.def
  - name: pore_size_index (Brooks-Corey)
    unit: dimensionless
    category: soil
    source_kind: calibrated
    model_input_format: soil_*.def
    notes: Range 0.1-0.8.
  - name: psi_air_entry (air-entry pressure)
    unit: m head
    category: soil
    source_kind: calibrated
    model_input_format: soil_*.def
    notes: Range 0.01-3.0; kPa input must be /9.81 (dt_010).
  - name: soil_depth
    unit: m
    category: soil
    source_kind: calibrated
    model_input_format: soil_*.def
    notes: Range 0.5-5.0; cm input gives unrealistically deep soil (dt_004).
  - name: epc.max_lai
    unit: m^2/m^2
    category: vegetation
    source_kind: calibrated
    model_input_format: veg_*.def
    notes: Range 1-12; maximum leaf area index.
  - name: epc.proj_sla (specific leaf area)
    unit: m^2/kgC
    category: vegetation
    source_kind: calibrated
    model_input_format: veg_*.def
  - name: epc.leaf_turnover
    unit: 1/day
    category: vegetation
    source_kind: calibrated
    model_input_format: veg_*.def
    notes: Range 0.0001-0.01.
  - name: epc.livewood_turnover
    unit: 1/day
    category: vegetation
    source_kind: calibrated
    model_input_format: veg_*.def
  - name: epc.height_to_stem_coef
    unit: m/(kgC/m^2)
    category: vegetation
    source_kind: calibrated
    model_input_format: veg_*.def
  - name: epc.allocation_flag
    unit: integer 1-3
    category: vegetation
    source_kind: calibrated
    model_input_format: veg_*.def
    notes: Carbon allocation strategy selector.
  - name: epc.veg_type
    unit: integer (1=tree,2=grass)
    category: vegetation
    source_kind: calibrated
    model_input_format: veg_*.def
  - name: sat_to_gw_coeff (gw1, saturation-to-groundwater fraction)
    unit: fraction 0-0.5
    category: groundwater
    source_kind: calibrated
    model_input_format: hillslope/groundwater def, -gw mode
  - name: gw_loss_coeff (gw2, groundwater recession)
    unit: fraction 0-0.5
    category: groundwater
    source_kind: calibrated
    model_input_format: hillslope/groundwater def, -gw mode
  - name: lapse_rate / atm_trans_lapse_rate / dewpoint_lapse_rate
    unit: C/m (temperature); dimensionless
    category: climate
    source_kind: calibrated
    model_input_format: zone.def
    notes: Temperature/transmissivity lapse rates for topographic downscaling.
  - name: impervious_fraction / irrigation / fertilizer_NO3 / fertilizer_NH4
    unit: 0-1; m/day; kgN/m^2/yr
    category: landuse
    source_kind: dataset_lookup
    model_input_format: lu_*.def
    notes: Land-use management parameters; fertilizer/irrigation only when landuse layer active.
  initial_conditions:
  - name: sat_deficit / unsat_storage / rz_storage / detention_store
    unit: m
    category: hydrologic_state
    source_kind: user_provided
    model_input_format: .world per-patch object values
    notes: Hydrologic stores reach equilibrium quickly relative to BGC.
  - name: snowpack.water_equivalent_depth
    unit: m
    category: hydrologic_state
    source_kind: user_provided
    model_input_format: .world per-patch object value
  - name: initial soil/litter/canopy C and N pools (soil_cs.*, litter_cs.*, cs.leafc, cs.frootc, leafn,
      frootn)
    unit: kgC/m^2 or kgN/m^2
    category: carbon_nitrogen_state
    source_kind: user_provided
    model_input_format: .world per-stratum/patch object values
    notes: g/m^2 instead of kg/m^2 causes 1000x runaway growth (dt_009). BGC pools require 200-500 yr
      spin-up to steady state (dt_012).
  - name: cs.leafc_transfer / cs.leafc_store (leaf expansion budgets)
    unit: kgC/m^2
    category: carbon_nitrogen_state
    source_kind: user_provided
    model_input_format: .world per-stratum object values
    notes: For deciduous dormant-season start, cs.leafc_transfer (=max_lai/proj_sla) must be set, not
      only leafc_store, else Year 1 has no leaves.
  boundary_conditions:
  - name: worldfile (.world)
    unit: n/a
    category: domain_structure
    source_kind: user_provided
    model_input_format: hierarchical text; 'value variable_name' pairs per object
    notes: Whitespace/ordering-sensitive; misalignment causes silent misassignment or segfault (dt_011).
      Fixed per-level variable counts (17/18/22/47/71 for basin/hillslope/zone/patch/stratum).
  - name: worldfile header (.hdr)
    unit: n/a
    category: domain_structure
    source_kind: user_provided
    model_input_format: maps definition IDs to .def files and lists base-station filenames
    notes: Every base-station filename used must be listed here.
  - name: flow table (.flow)
    unit: gamma fraction; edge length m
    category: routing
    source_kind: user_provided
    model_input_format: patch-to-patch connectivity (used with -r)
    notes: Every worldfile patch must appear; ID mismatch segfaults during routing init (dt_015).
  - name: TEC file (temporal event control)
    unit: n/a
    category: control
    source_kind: user_provided
    model_input_format: 'scheduled events: print_*_on/off, redefine_world, output_current_state'
    notes: Events scheduled before -st start date are ignored, producing empty output (dt_014).
  - name: base station file
    unit: n/a
    category: control
    source_kind: user_provided
    model_input_format: links climate files; base_station_ID, x/y/z elevation, effective_lai, screen_height,
      daily sequences
    notes: Defines which optional daily climate sequences are present.
  - name: run mode flags (-r explicit routing, -g C/N cycling, -gw groundwater, -b basin output, -p patch
      output, -DLIU_NETCDF_READER compile-time NetCDF)
    unit: n/a
    category: mode_switch
    source_kind: user_provided
    model_input_format: command-line / compile-time switches
    notes: Without -g only hydrology runs and vegetation is static; without -r TOPMODEL hillslope redistribution
      is used; NetCDF forcing requires the compile-time reader flag (dt_016).
  - name: sensitivity multipliers (-s m_mult Ksat_mult, -sv vertical, -svalt pore_size/psi_air_entry)
    unit: dimensionless scalars
    category: calibration
    source_kind: user_provided
    model_input_format: command-line multipliers on soil parameters
    notes: Never set to 0 (zeros Ksat or m -> division-by-zero / infinite loop, dt_013).
outputs:
  primary:
  - name: streamflow
    unit: m/day (depth per unit basin area)
    description: Total basin streamflow as water depth per area; convert to m^3/s via Q = streamflow *
      basin_area / 86400.
    validation_rank: 1
    emitted_in: basin daily output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Output is m/day/m^2 not m^3/s; must convert with basin area before gauge comparison (dt_002).
        - Comparing a small RHESSys domain against a large-basin gauge via specific discharge assumes
          uniform runoff generation over the full gauge drainage area.
      detrending_options:
      - none
  - name: evaporation
    unit: m/day
    description: Total surface/soil/litter evaporation.
    validation_rank: 3
    emitted_in: basin/patch daily output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - ET partitioning (evap vs transpiration) is model-specific; total ET is more robustly comparable
          than the partition.
      detrending_options:
      - none
  - name: transpiration (sat + unsat zone)
    unit: m/day
    description: Canopy transpiration drawn from saturated and unsaturated zones.
    validation_rank: 5
    emitted_in: basin/patch daily output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Known forcing-config failure modes (dt_019, dt_021, dt_022) can drive transpiration to zero
          on rainy/cloudy days; verify forcing before trusting low transpiration.
      detrending_options:
      - none
  - name: snowpack.water_equivalent_depth
    unit: m
    description: Snow water equivalent per patch.
    validation_rank: 4
    emitted_in: patch daily output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Snowmelt timing is sensitive to the temperature interpolation / lapse-rate choice.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Patch-level SWE compares to gridded SWE only where the patch tessellation aligns with the product
          footprint.
      detrending_options:
      - none
  - name: lai (proj_lai / effective_lai)
    unit: m^2/m^2
    description: Projected / effective leaf area index of the canopy stratum.
    validation_rank: 6
    emitted_in: stratum/patch daily output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Requires multi-century BGC spin-up; un-spun-up runs give LAI=0 or runaway growth (dt_012).
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Compare against remote-sensing LAI only where stratum tessellation aligns with the gridded product.
      detrending_options:
      - none
  - name: cs.net_psn (net photosynthesis / NPP proxy)
    unit: kgC/m^2/day
    description: Net photosynthesis at the canopy stratum.
    validation_rank: 7
    emitted_in: stratum daily growth output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance GPP/NEE comparison requires matching the model's net-photosynthesis definition
          to the flux-tower partitioning.
      detrending_options:
      - none
  - name: streamflow_NO3 / streamflow_DON
    unit: kgN/m^2/day
    description: Nitrate and dissolved organic nitrogen export in streamflow.
    validation_rank: 2
    emitted_in: basin daily output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Dissolved-N export depends on spun-up BGC pools and on N-deposition/fertilizer forcing being
          supplied.
      detrending_options:
      - none
  - name: soil_cs.totalc / litter_cs.totalc
    unit: kgC/m^2
    description: Total soil and litter carbon pools.
    validation_rank: 8
    emitted_in: patch daily/yearly output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Soil carbon is a slow pool reflecting 200-500 yr spin-up state, not weather-driven inter-annual
          variability.
      detrending_options:
      - none
  - name: sat_deficit / unsat_storage / rz_storage / theta (soil moisture)
    unit: m (storage) or dimensionless (relative saturation)
    description: Patch-level subsurface water storage / relative saturation state.
    validation_rank: 9
    emitted_in: patch daily output
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Point soil-moisture sensors sample a depth/volume that may not match the patch root-zone definition.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: 'Streamflow is approximately 1000x larger than expected. Annual runoff ratio exceeds 100% or
    total water yield is orders of magnitude above precipitation.

    '
  diagnosis: 'Precipitation input is in mm/day instead of m/day; RHESSys expects precipitation in meters
    per day (m/day). Most global datasets (ERA5, CMFD, NASA POWER, station data) report precipitation
    in mm/day. Forgetting to divide by 1000 inflates all water fluxes by 3 orders of magnitude.

    ; [''climate forcing'
  remedy: Divide precipitation values by 1000 before writing .rain file; convert_forcing.py --precip-unit
    mm; ['Open the .rain file', 'Divide all values by 1000', 'Verify max daily precip is reasonable (<
    0.3 m/day = 300 mm/day)']; Always use convert_forcing.py which handles mm->m conversion
  severity: silent
- id: dt_002
  symptom: 'Simulated streamflow appears extremely small or large when compared to observed gauge data
    (m^3/s). NSE and other metrics are meaningless.

    '
  diagnosis: 'Streamflow output is in m/day per m^2 basin area, not m^3/s; RHESSys reports streamflow
    as depth per time per unit area (m/day/m^2). To compare with observed discharge in m^3/s: Q_m3s =
    streamflow * basin_area_m2 / 86400. Skipping this conversion gives dimensionally incorrect comparisons.

    ; [''output'
  remedy: 'Apply conversion: Q_m3s = streamflow * basin_area / 86400; parse_output.py --basin-area <area_m2>;
    [''Determine total basin area in m^2'', ''Multiply streamflow values by basin area'', ''Divide by
    86400 (seconds per day)'']; Always specify --basin-area when parsing output for comparison'
  severity: silent
- id: dt_003
  symptom: 'Extreme evapotranspiration values; soil dries out instantly. Temperature values in output
    appear around 270-300 instead of -10 to 30.

    '
  diagnosis: 'Temperature input is in Kelvin instead of Celsius; ERA5 and some reanalysis datasets report
    temperature in Kelvin. RHESSys expects degrees Celsius. A 293 K input is treated as 293 C, causing
    catastrophic evaporation.

    ; [''climate forcing files (.tmax, .tmin)'', ''evapotranspiration, snow processes'']'
  remedy: Subtract 273.15 from all temperature values; convert_forcing.py --temp-unit K; ['Check if max
    values in .tmax file exceed 60', 'If so, subtract 273.15 from all values']; Always verify temperature
    range after conversion
  severity: silent
- id: dt_004
  symptom: 'Extremely deep water table; model never saturates; baseflow dominates streamflow for decades.

    '
  diagnosis: 'Soil depth is in cm instead of m; Most soil databases (HWSD, SoilGrids) report depth in
    cm. RHESSys expects meters. A 150 cm soil column entered as 150 m creates unrealistically deep soil.

    ; [''soil definition files (.def)'', ''saturation dynamics, water table depth'']'
  remedy: Divide soil depth by 100; convert_soil_params.py; ['Check soil_depth value in .def file', 'Divide
    by 100 if > 10']; Use convert_soil_params.py which handles cm->m
  severity: silent
- id: dt_005
  symptom: 'Soil drains too fast; very flashy hydrograph with no baseflow. Saturation deficit drops to
    zero immediately after rain.

    '
  diagnosis: 'Ksat is in cm/hr instead of m/day; HWSD and some databases report Ksat in cm/hr. RHESSys
    expects m/day. Conversion: m/day = cm/hr * 0.24. Without conversion, a typical Ksat of 10 cm/hr becomes
    10 m/day (should be 2.4 m/day).

    ; [''soil definition files (.def)'', ''lateral drainage, vertical infiltration'
  remedy: Multiply Ksat by 0.24 (cm/hr -> m/day); convert_soil_params.py; ['Check Ksat_0 value in .def
    file', 'If originally from cm/hr source, multiply by 0.24']; Use convert_soil_params.py which handles
    unit conversion
  severity: silent
- id: dt_006
  symptom: 'Model crashes or produces NaN values. Porosity values > 1.0 in .def file.

    '
  diagnosis: 'Porosity is in percent instead of fraction (m^3/m^3); Some databases report porosity as
    percentage (e.g., 45% instead of 0.45). RHESSys requires volumetric fraction. Porosity > 1.0 is physically
    impossible and causes division errors.

    ; [''soil definition files (.def)'', ''water storage calculations'']'
  remedy: Divide porosity by 100; convert_soil_params.py; ['Check porosity_0 in .def file', 'If > 1.0,
    divide by 100']; Always verify porosity is between 0.2 and 0.7
  severity: fatal
- id: dt_007
  symptom: 'Lateral water routing gives unexpected patterns. Aspect-based radiation calculations are wrong
    (north slopes warm, south slopes cold).

    '
  diagnosis: 'Slope and/or aspect in radians instead of degrees; RHESSys expects slope and aspect in degrees.
    GIS tools sometimes output radians. A 45-degree slope in radians is 0.785, which RHESSys interprets
    as nearly flat (0.785 degrees).

    ; [''worldfile (patch slope, aspect)'', ''radiation partitioning, water rou'
  remedy: 'Multiply by 180/pi (57.2958); [''Check slope/aspect values in worldfile'', ''If all < 6.28,
    they are likely in radians'', ''Convert: degrees = radians * 180 / pi'']; Always verify slope range
    matches DEM (typical: 0-60 degrees)'
  severity: silent
- id: dt_008
  symptom: 'All fluxes (streamflow, ET) are extremely small. Total basin area in model is 1e-6 of reality.

    '
  diagnosis: 'Area is in km^2 instead of m^2; RHESSys expects patch and zone areas in m^2. If areas are
    specified in km^2, all area-weighted fluxes will be 1e6 too small.

    ; [''worldfile (patch area, zone area)'', ''all flux calculations'']'
  remedy: Multiply areas by 1e6; ['Check area values in worldfile', 'If << 1 for typical watersheds, likely
    in km^2', 'Multiply by 1,000,000']; Verify sum of patch areas matches known basin area in m^2
  severity: silent
- id: dt_009
  symptom: 'Vegetation grows unrealistically fast; LAI reaches maximum within days. Or soil carbon pools
    are enormous, dominating respiration.

    '
  diagnosis: 'Carbon/nitrogen pool values in g/m^2 instead of kg/m^2; RHESSys stores all carbon and nitrogen
    pools in kg/m^2. Literature and some databases report g/m^2. Initializing with g/m^2 values gives
    1000x excess, leading to unrealistic growth and respiration.

    ; [''worldfile initial C/N pools'', ''BGC cycling'
  remedy: 'Divide all C/N pool values by 1000 in worldfile; [''Check leafc, stemc, rootc, litr1c, soil1c
    values in worldfile'', ''If they seem very large, divide by 1000'', ''Typical leafc: 0.01-0.5 kg C/m^2''];
    Verify carbon pool units match kg/m^2 before running'
  severity: silent
- id: dt_010
  symptom: 'Soil water retention curve behaves unexpectedly. Soil either holds too much or too little
    water at field capacity.

    '
  diagnosis: 'Psi air entry in kPa instead of m (head of water); RHESSys expects psi_air_entry in meters
    of water head. Some databases report in kPa. Conversion: m = kPa / 9.81. A typical value of 3 kPa
    should be 0.306 m, not 3 m.

    ; [''soil definition files (.def)'', ''water retention, drainage'']'
  remedy: 'Divide psi_air_entry by 9.81 (kPa -> m); [''Check psi_air_entry in .def file'', ''If from kPa
    source, divide by 9.81'']; Typical range: 0.01 to 3.0 m for most soils'
  severity: silent
- id: dt_011
  symptom: 'Model reads wrong parameter values; parameters assigned to wrong objects. Model may crash
    with obscure array index errors.

    '
  diagnosis: 'Worldfile formatting error — wrong value/name ordering or extra whitespace; The worldfile
    parser reads value-name pairs line by line. Each line must be ''value    variable_name''. Extra blank
    lines, wrong ordering, or tab/space issues cause the parser to misalign, reading values for wrong
    parameters.

    '
  remedy: 'Regenerate worldfile with correct formatting; [''Check worldfile line by line against template'',
    ''Ensure no extra blank lines between parameter blocks'', ''Ensure each line is: value<whitespace>variable_name''];
    Use worldfile generation tools (CreateWorldfile) rather than manual editing'
  severity: fatal
- id: dt_012
  symptom: 'In BGC mode (-g), vegetation dies within first year. Or LAI is zero and no photosynthesis
    occurs. Alternatively, soil respiration overwhelms productivity.

    '
  diagnosis: 'Carbon/nitrogen pools not spun up to steady state; BGC pools (soil C, litter C, plant N)
    require 200-500 years of cycling to reach equilibrium. Without spin-up, initial pools from the worldfile
    are far from steady state, causing crashes in carbon allocation.

    ; [''vegetation carbon/nitrogen pools'', ''s'
  remedy: Perform multi-century spin-up before production run; ['Create spin-up TEC file with repeated
    climate', 'Run 200-500 years with -g flag', 'Use -vegspinup flag for acceleration', 'Save final state
    with output_current_state TEC event', 'Use saved state for production worldfile']; Always spin up
    BGC poo
  severity: silent
- id: dt_013
  symptom: 'Model crashes immediately or hangs in infinite loop. Division by zero errors in soil drainage
    routines.

    '
  diagnosis: 'Sensitivity multiplier set to 0 via -s or -sv flags; The -s and -sv flags multiply default
    soil parameters (m, Ksat). Setting a multiplier to 0 zeros out Ksat or m, causing division by zero
    in transmissivity and drainage calculations.

    ; [''command line -s, -sv flags'', ''soil drainage routines'']'
