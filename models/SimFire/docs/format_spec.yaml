- id: dt_014
  symptom: MemoryError or process killed during GIF save. Large simulation data.
  diagnosis: Recording frames in memory for GIF creation exceeds available RAM.; When record=true, SimFire
    stores every rendered frame as a PIL Image in memory. For long simulations (>6h) on large grids (>200×200),
