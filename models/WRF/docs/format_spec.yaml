  diagnosis: A single short WRF weather realization was scored against a multi-year monthly CLIMATOLOGY
    (temporal-support mismatch), CSI used one ABSOLUTE threshold on both fields so the uniform anomaly
    dominated it, no spin-up was dropped, and NSE/KGE (temporal families) were reported for a spatial
    obs shape.
