# format_spec.yaml — Machine-readable model format specification
# Used by debug_framework.py Level 1 (input validation) and Level 3 (output validation)
# Part of KDT Knowledge Infrastructure Tier B documentation
#
# Aligns with UNIVERSAL_BOUNDS and DOMAIN_CHECKS in debug_framework.py:
#   - Input ranges map to Level 1 check_value_range() calls
#   - Output ranges map to Level 3 DOMAIN_CHECKS["flood"]
#   - known_issues map to diagnostic triplets (triplets.yaml)

model:
  name: "SFINCS v2.3.2"
  domain: "flood"
  secondary_domains: ["coastal"]
  binary: "sfincs"
  binary_path: "KISSPATH_BINARIES/sfincs/bin/sfincs"
  language: "Fortran 90"
  working_directory: "directory containing sfincs.inp (binary reads from CWD only)"
  notes: "Reduced-complexity 2D shallow water solver for rapid flood inundation. No command-line arguments."

# =========================================================================
# INPUTS
# =========================================================================
inputs:

  forcing:
    - name: "precipitation"
      file: "sfincs.precip (ASCII) or NetCDF"
      unit: "mm/hr"
      valid_range: [0.0, 200.0]
      format: "ASCII preferred: time_seconds precip_mmhr (two columns)"
      conversion_from_cmfd: "CMFD mm/3hr / 3 -> mm/hr"
      notes: "ALWAYS use ASCII precipfile, NOT netprecipfile. NetCDF may silently fail."

    - name: "river_discharge"
      file: "sfincs.src + sfincs.dis"
      unit: "m3/s"
      valid_range: [0.0, 1e6]
      format: "sfincs.src: source cell locations; sfincs.dis: time series (seconds, Q)"
      conversion_from_cama: "CaMa-Flood outflw (m3/s) direct"

    - name: "water_level_boundary"
      file: "sfincs.bnd + sfincs.bzs"
      unit: "m"
      valid_range: [-10.0, 100.0]
      format: "sfincs.bnd: boundary cell locations; sfincs.bzs: time series (seconds, WL)"
      conversion_from_cama: "CaMa-Flood sfcelv (m) direct"
      notes: "Datum must match DEM vertical datum."

  parameters:
    critical:
      - name: "manning_n"
        file: "sfincs.man (grid) or manning_n in sfincs.inp"
        description: "Manning roughness coefficient"
        valid_range: [0.01, 0.20]
        default: 0.04
        unit: "s/m^(1/3)"

      - name: "dt"
        file: "sfincs.inp"
        description: "Computational timestep"
        valid_range: [0.1, 60.0]
        unit: "seconds"
        bug_history: >
          Must satisfy CFL: dt <= dx / sqrt(g * h_max). For dx=100m, h_max=10m:
          dt_max = 10.1s. Use 0.75 * dt_max for safety. Triplet dt_009.

      - name: "mask_values"
        file: "sfincs.msk"
        description: "Cell status: 0=inactive, 1=closed boundary, 2=outflow, 3=active"
        valid_range: [0, 3]
        unit: "integer flag"
        bug_history: >
          Edge cells MUST be mask=2 (outflow) for coastal domains. But for inland
          mountainous terrain, mask=2 defaults to WL=0 (sea level) creating massive
          hydraulic gradient. Use mask=1 (closed) if min_elevation > 10m, or provide
          explicit bzs water levels. Triplet dt_v005.

      - name: "outputformat"
        file: "sfincs.inp"
        description: "Output format selector"
        valid_range: ["net"]
        default: "net"
        bug_history: >
          Must be 'net' for NetCDF output. Without it, output may be binary and
          post-processing tools (expecting sfincs_map.nc) will fail. Triplet dt_018.

  files:
    required:
      - name: "sfincs.inp"
        description: "Master configuration file"
        format: "Key-value pairs, one per line"

      - name: "sfincs.dep"
        description: "DEM / bathymetry grid"
        format: "Binary (NX*NY float32)"

      - name: "sfincs.msk"
        description: "Active domain mask"
        format: "Binary (NX*NY int8)"

      - name: "sfincs.ind"
        description: "Index file for active cells"
        format: "Binary: [n_active int32] [n_active 1-based indices int32]"
        notes: "#1 trap. Wrong format gives single-cell domain silently."

    optional:
      - name: "sfincs.man"
        description: "Spatially varying Manning's n"
        format: "Binary (NX*NY float32)"

      - name: "sfincs.precip"
        description: "Uniform precipitation time series"
        format: "ASCII: time_seconds precip_mmhr"

      - name: "sfincs.src / sfincs.dis"
        description: "Point source locations and discharge time series"

      - name: "sfincs.bnd / sfincs.bzs"
        description: "Water level boundary locations and time series"

      - name: "sfincs.thd"
        description: "Thin dam (levee) locations"

# =========================================================================
# OUTPUTS
# =========================================================================
outputs:

  primary:
    - name: "flood_depth"
      file: "sfincs_map.nc"
      unit: "m"
      valid_range: [0.0, 20.0]
      key_columns: ["hmax"]
      format: "NetCDF (NX x NY, time dimension)"
      notes: "Use hmax (water DEPTH above bed), NOT zsmax (water SURFACE elevation)."

    - name: "flood_velocity"
      file: "sfincs_map.nc"
      unit: "m/s"
      valid_range: [0.0, 15.0]
      key_columns: ["vmax"]
      format: "NetCDF"

    - name: "water_surface_elevation"
      file: "sfincs_map.nc"
      unit: "m"
      valid_range: null
      key_columns: ["zsmax"]
      notes: "DO NOT use for flood depth mapping — gives terrain + water depth."

  diagnostics:
    - name: "mass_balance"
      check: "rain volume ~ stored volume (ratio 0.9-1.1)"
      reference: "Bengbu test: ratio 1.03 (excellent)"
      notes: "Compute: rain_vol = precip_total * active_area; stored_vol = sum(hmax * cell_area)"

    - name: "flood_depth_range"
      check: "Max flood depth < 20m for typical fluvial events"
      notes: "Depths > 20m indicate boundary condition or DEM errors."

    - name: "flooded_area"
      check: "Non-zero flood extent with depth > 0.3m"
      notes: "Zero flooding despite rainfall means precipitation not loaded (check sfincs.log for 'Precipitation: no')."

    - name: "no_nan"
      check: "No NaN values in hmax or zsmax"

# =========================================================================
# KNOWN ISSUES (maps to diagnostics/triplets.yaml)
# =========================================================================
known_issues:
  - id: "precip_unit_error"
    triplet: "dt_001"
    description: "Precipitation not in mm/hr — flood depths 3x too high or zero"
    affected_output: "hmax, flood extent"
    detection: "Flood depths unrealistic or zero flooding"
    fix: "CMFD mm/3hr / 3 = mm/hr"

  - id: "ind_format_trap"
    triplet: "dt_v001"
    description: "sfincs.ind wrong format — reads as single-cell domain silently"
    affected_output: "Entire domain (model runs on 1 cell)"
    detection: "Read first 4 bytes as int32, check it equals active cell count"
    fix: "Write as [n_active int32] [n_active flat 1-based indices int32]"

  - id: "vic_forcing_column_order"
    triplet: "dt_v002"
    description: "VIC forcing column 0 is temperature, NOT precipitation"
    affected_output: "Precipitation input (wrong data)"
    detection: "Precipitation values look like temperature (-20 to 40)"
    fix: "VIC columns: TEMP(0), PREC(1), PRESSURE(2), SW(3), LW(4), VP(5), WIND(6)"

  - id: "netprecipfile_silent_fail"
    triplet: "dt_v004"
    description: "NetCDF precipitation silently fails — simulation runs without rainfall"
    affected_output: "Zero flooding"
    detection: "sfincs.log shows 'Precipitation: no'"
    fix: "Use ASCII precipfile instead of netprecipfile"

  - id: "inland_mask2_drain"
    triplet: "dt_v005"
    description: "Mask=2 (outflow) for inland terrain defaults to WL=0 (sea level)"
    affected_output: "All water drains instantly, no flooding"
    detection: "Zero flood depth despite rainfall"
    fix: "Use mask=1 for inland, or provide explicit bzs matching bed elevation"

  - id: "gfortran_sigabrt"
    triplet: "dt_v006"
    description: "gfortran cleanup SIGABRT (exit code -6) after successful simulation"
    affected_output: "None — output is valid"
    detection: "Exit code -6 but 'Simulation finished' in log"
    fix: "Check success by: (1) 'Simulation finished' in log AND (2) sfincs_map.nc exists"

  - id: "hmax_vs_zsmax"
    triplet: "dt_v007"
    description: "Using zsmax instead of hmax for flood depth — values equal terrain+depth"
    affected_output: "Flood depth map shows 310m instead of 7m"
    detection: "Flood depth values match terrain elevation"
    fix: "Always use hmax (depth above bed), not zsmax (water surface elevation)"

  - id: "precipfile_keyword"
    triplet: "dt_v008"
    description: "Config writes netprecipfile when file is ASCII — no rainfall loaded"
    affected_output: "Zero flooding"
    detection: "sfincs.log shows 'Precipitation: no'"
    fix: "Write precipfile = sfincs.precip for ASCII format"

  - id: "double_counting_precip"
    triplet: "dt_014"
    description: "VIC/CaMa runoff + SFINCS precipitation for same area = double counting"
    affected_output: "2x expected flood volume"
    detection: "Flood volume much larger than expected"
    fix: "Choose either SFINCS precipitation OR VIC/CaMa runoff, not both"

# =========================================================================
# EXPECTED RANGES (validated basins)
# =========================================================================
expected_ranges:
  chaohe_basin:
    grid: "174x171 cells, 100m resolution"
    event: "Aug 2-12 2008, 88.7mm total rainfall"
    max_flood_depth_m: 7.29
    flood_volume_m3: 37.9e6
    runtime_seconds: 5.7

  bengbu_basin:
    grid: "384x455 cells, 100m resolution"
    event: "July 2003, 390mm total rainfall"
    max_flood_depth_m: 6.99
    flood_volume_m3: 701e6
    mass_balance_ratio: 1.03
    runtime_seconds: 397
    cama_cross_validation: "CaMa max depth 8.17m at same location — consistent"
