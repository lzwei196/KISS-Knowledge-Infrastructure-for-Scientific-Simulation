template_version: "3.5"

identity:
  model_id: "VIC"
  scientific_reference_version: "VIC-5 (Hamman et al. 2018, GMD; original Liang et al. 1994 JGR formulation)"
  implementation:
    id: "vic-classic-510"
    version: "5.1.0"
    provenance: "C; UW-Hydro / Computational Hydrology Group VIC-5.1.0 classic driver (per-cell ASCII forcing and flux output)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c"
  license: "MIT"
  repo_url: "https://github.com/UW-Hydro/VIC"

boundary:
  scope_in:
    - "Land-surface water balance at large grid cells"
    - "Land-surface energy balance (in full-energy mode)"
    - "Snowpack accumulation and melt (quasi 2-layer ground pack + canopy interception + partial cover)"
    - "Multi-layer soil moisture dynamics"
    - "Evapotranspiration (canopy interception, transpiration, bare-soil, with Jarvis stomatal control)"
    - "Surface runoff via variable infiltration capacity and baseflow via ARNO/non-linear drainage"
    - "Frozen soil / ground ice dynamics (optional, gated by fs_active)"
    - "Within-cell lake/wetland dynamics (optional)"
    - "Carbon cycling: photosynthesis and autotrophic+heterotrophic respiration (optional CARBON)"
    - "Blowing-snow sublimation (optional)"
    - "Sub-grid orography via elevation bands; sub-grid land cover via vegetation tiles"
  scope_out:
    - "Inter-cell lateral surface or subsurface flow (cells are independent)"
    - "Channel-to-soil return: once water reaches the channel network it does not re-enter the soil column"
    - "Integrated streamflow routing (must be performed post-hoc by an external routing model)"
    - "Dynamic vegetation phenology and biomass growth (LAI/cover prescribed)"
    - "Geographic arrangement of land-cover patches and elevation bands within a cell (lumped into tiles/bands)"
    - "True multi-lake bathymetry within a cell (collapsed to one composite lake)"
  spatial: "2-D grid"
  temporal: "sub-hourly"
  closure: "both"
  notes: "Per-cell water-balance closure (P = ET + runoff + baseflow + delta storage in soil/snow/canopy/lake) holds always. Per-cell energy-balance closure (Rnet = H + LE + G + delta cold content) holds in full-energy mode; water-balance-only mode skips the explicit surface-energy solver. Cells are closed to lateral exchange. Time step is configurable via MODEL_STEPS_PER_DAY with hard bounds MIN_SUBDAILY_STEPS_PER_DAY=4 (no coarser than 6 h) and MAX_SUBDAILY_STEPS_PER_DAY=1440 (no finer than 1 min)."

inputs:
  forcing:
    - category: "atmospheric"
      name: "AIR_TEMP"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "per-cell ASCII forcing file column at FORCE_STEPS_PER_DAY cadence (classic driver)"
      notes: "Subgrid-band lapse uses default LAPSE_RATE = -0.0065 C/m unless overridden."
    - category: "atmospheric"
      name: "PREC"
      unit: "mm per forcing step"
      source_kind: "forcing"
      model_input_format: "per-cell ASCII forcing file column at FORCE_STEPS_PER_DAY cadence"
      notes: "Total precipitation (rain + snow); rain/snow split inside the model. GAUGE_HEIGHT default 1.0 m governs optional undercatch correction."
    - category: "atmospheric"
      name: "PRESSURE"
      unit: "kPa"
      source_kind: "forcing"
      model_input_format: "per-cell ASCII forcing file column"
    - category: "radiation"
      name: "SWDOWN"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "per-cell ASCII forcing file column"
    - category: "radiation"
      name: "LWDOWN"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "per-cell ASCII forcing file column"
    - category: "atmospheric"
      name: "VP"
      unit: "kPa"
      source_kind: "forcing"
      model_input_format: "per-cell ASCII forcing file column"
    - category: "atmospheric"
      name: "WIND"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "per-cell ASCII forcing file column"
    - category: "vegetation"
      name: "LAI (optional time-varying)"
      unit: "m2/m2"
      source_kind: "forcing"
      model_input_format: "per-cell forcing column when VEGPARAM_LAI / daily LAI forcing enabled"
      notes: "When inactive, LAI is read as a static monthly schedule from the vegetation parameter / library file."
    - category: "atmospheric"
      name: "CO2 (optional, CARBON mode)"
      unit: "ppm"
      source_kind: "forcing"
      model_input_format: "per-cell forcing column when CARBON option is on"
      notes: "Drives the photosynthesis module (Ci, GPP)."
  parameters:
    - category: "soil_hydraulic"
      name: "binfilt (b_infilt)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "soil parameter file row"
      notes: "Shape parameter of the VIC subgrid infiltration-capacity distribution; main lever for the surface-runoff partition."
    - category: "soil_hydraulic"
      name: "Ds"
      unit: "fraction of Dsmax"
      source_kind: "calibrated"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "Dsmax"
      unit: "mm/day"
      source_kind: "calibrated"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "Ws"
      unit: "fraction of max soil moisture"
      source_kind: "calibrated"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "c (baseflow curve exponent)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "expt (Brooks-Corey exponent per layer)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "Ksat (saturated hydraulic conductivity per layer)"
      unit: "mm/day"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "phi_s (soil moisture diffusion per layer)"
      unit: "mm/mm"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "depth (layer thickness per soil layer)"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "soil parameter file row"
      notes: "MAX_LAYERS = 3 is a compile-time cap (vic_def.h); requesting more than 3 layers silently fails. Calibration constraint d3 > d2 is conventional but enforced by the calibration tool, not the model."
    - category: "soil_hydraulic"
      name: "bubble (bubbling pressure per layer)"
      unit: "cm"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_thermal"
      name: "quartz (per layer)"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_thermal"
      name: "bulk_density (per layer)"
      unit: "kg/m^3"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_thermal"
      name: "soil_density (per layer)"
      unit: "kg/m^3"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "Wcr_FRACT (critical-point soil moisture fraction per layer)"
      unit: "fraction"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "Wpwp_FRACT (wilting-point soil moisture fraction per layer)"
      unit: "fraction"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_hydraulic"
      name: "resid_moist (residual moisture fraction per layer)"
      unit: "fraction"
      source_kind: "default"
      model_input_format: "soil parameter file row"
      notes: "Default SOIL_RESID_MOIST = 0.0 (initialize_parameters.c); layers drain to bone-dry if not explicitly overridden."
    - category: "soil_thermal"
      name: "avg_T (long-term mean soil temperature at damping depth)"
      unit: "degC"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_thermal"
      name: "dp (soil thermal damping depth)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "soil_aerodynamic"
      name: "rough (bare-soil surface roughness)"
      unit: "m"
      source_kind: "default"
      model_input_format: "soil parameter file row"
    - category: "soil_aerodynamic"
      name: "snow_rough (snowpack surface roughness)"
      unit: "m"
      source_kind: "default"
      model_input_format: "soil parameter file row"
    - category: "climatology"
      name: "annual_prec (long-term mean annual precipitation)"
      unit: "mm"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "geometry"
      name: "elev / lat / lon / off_gmt"
      unit: "m, deg, deg, hours"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file row"
    - category: "vegetation_structure"
      name: "Nveg / veg_class / Cv"
      unit: "count, id, fraction"
      source_kind: "dataset_lookup"
      model_input_format: "vegetation parameter file"
      notes: "Cv values across all tiles must sum to 1 over the cell."
    - category: "vegetation_structure"
      name: "root_depth / root_fract (per root zone)"
      unit: "m, fraction"
      source_kind: "calibrated"
      model_input_format: "vegetation parameter file"
      notes: "Root-fraction sums may exceed 1; the model auto-normalizes per tile (benign warning)."
    - category: "vegetation_canopy"
      name: "LAI / FCANOPY / ALBEDO (monthly schedule)"
      unit: "m2/m2, fraction, fraction"
      source_kind: "dataset_lookup"
      model_input_format: "vegetation parameter or vegetation library file (per veg_class)"
      notes: "Used when LAI_SRC=FROM_VEGPARAM and time-varying forcing of these fields is disabled."
    - category: "vegetation_aerodynamic"
      name: "displacement / roughness / trunk_ratio / rad_atten / wind_atten / rmin / Rgl / overstory"
      unit: "varies"
      source_kind: "dataset_lookup"
      model_input_format: "vegetation library file (per veg_class)"
      notes: "Defaults from vic_def.h when veg library omits a field: trunk_ratio=0.2, rad_atten=0.5, wind_atten=0.5."
    - category: "blowing_snow"
      name: "sigma_slope / lag_one / fetch"
      unit: "-, -, m"
      source_kind: "dataset_lookup"
      model_input_format: "vegetation parameter file (required when BLOWING_SNOW enabled)"
    - category: "lake"
      name: "lake parameters (basin depth/area curve, depth_in, mindepth, maxdepth, ...)"
      unit: "varies"
      source_kind: "dataset_lookup"
      model_input_format: "lake parameter file (required when LAKES enabled)"
  initial_conditions:
    - category: "soil_state"
      name: "init_moist (initial layer soil moisture)"
      unit: "mm"
      source_kind: "user_provided"
      model_input_format: "soil parameter file column"
    - category: "warm_start"
      name: "state file (soil moisture and ice per layer; soil-node temperatures; snowpack SWE/temperatures/density/cold-content; canopy snow and dew; lake state; optional carbon pools)"
      unit: "varies"
      source_kind: "user_provided"
      model_input_format: "VIC state file (binary or ASCII per options)"
      notes: "Lake areai is restarted from the previous step's new_ice_area; if new_ice_area is not saved, the restart silently begins with areai=0."
  boundary_conditions:
    - category: "lower_thermal"
      name: "Lower soil thermal boundary"
      unit: "degC"
      source_kind: "dataset_lookup"
      model_input_format: "soil parameter file (avg_T at damping depth dp)"
    - category: "elevation_band"
      name: "AreaFract / Elevation / Pfactor per band"
      unit: "fraction, m, fraction"
      source_kind: "user_provided"
      model_input_format: "snow-band file (required only when number of snow bands > 1)"
      notes: "AreaFract and Pfactor each must sum to 1 across bands within a cell."
    - category: "structural_option"
      name: "FULL_ENERGY (water+energy vs water-only mode)"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "global parameter file flag"
    - category: "structural_option"
      name: "FROZEN_SOIL (enable frozen-soil and permafrost module)"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "global parameter file flag"
      notes: "Must be a TRUE/FALSE token, not a path."
    - category: "structural_option"
      name: "QUICK_FLUX (analytical vs finite-difference soil thermal solver)"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "global parameter file flag"
    - category: "structural_option"
      name: "LAKES / CARBON / BLOWING / SPATIAL_FROST / SPATIAL_SNOW / ORGANIC_FRACT"
      unit: "boolean"
      source_kind: "user_provided"
      model_input_format: "global parameter file flags (and supporting parameter files when on)"
    - category: "structural_option"
      name: "LAI_SRC (FROM_VEGPARAM | FROM_VEGLIB | FROM_VEGHIST)"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "global parameter file"
    - category: "timestep_control"
      name: "MODEL_STEPS_PER_DAY / FORCE_STEPS_PER_DAY / SNOW_STEPS_PER_DAY / RUNOFF_STEPS_PER_DAY"
      unit: "steps/day"
      source_kind: "user_provided"
      model_input_format: "global parameter file"
      notes: "Bounded by MIN_SUBDAILY_STEPS_PER_DAY=4 and MAX_SUBDAILY_STEPS_PER_DAY=1440 (vic_def.h)."
    - category: "simulation_window"
      name: "STARTYEAR/STARTMONTH/STARTDAY and ENDYEAR/ENDMONTH/ENDDAY"
      unit: "date"
      source_kind: "user_provided"
      model_input_format: "global parameter file"

processes:
  modules:
    - name: "ForcingDisaggregation"
      role: "driver"
      brief: "Reads per-cell forcing at FORCE_STEPS_PER_DAY, applies lapse-rate correction across snow bands, and produces sub-daily atmospheric fields at MODEL_STEPS_PER_DAY (correct_precip, calc_rainonly)."
    - name: "VariableInfiltrationCapacity"
      role: "process_solver"
      brief: "Liang 1994 statistical subgrid distribution of soil moisture capacity that partitions liquid water input into infiltration vs surface runoff; controlled by binfilt."
    - name: "MultiLayerSoilWaterBalance"
      role: "process_solver"
      brief: "Tracks moisture and ice in up to MAX_LAYERS=3 soil layers via Richards-like fluxes (compute_runoff_and_asat, calc_Q12, compute_zwt); feeds runoff, baseflow, ET, and the thermal solver."
    - name: "ARNO_Baseflow"
      role: "process_solver"
      brief: "Two-regime (linear below Ws, non-linear above) drainage from the bottom soil layer parameterized by Ds, Dsmax, Ws, c."
    - name: "CanopyEvapAndStomatalControl"
      role: "process_solver"
      brief: "Canopy interception, dew (Wdew up to Wdmax=LAI*VEG_LAI_WATER_FACTOR), and transpiration with Jarvis-style stomatal resistance responding to T, VPD, PAR, soil moisture; calls canopy_evap -> penman / calc_rc."
    - name: "BareSoilEvaporation"
      role: "process_solver"
      brief: "ARNO-style bare-soil evaporation (arno_evap) over the bare tile; uses SOIL_RARC architectural resistance default 100 s/m."
    - name: "Snowpack"
      role: "process_solver"
      brief: "Quasi 2-layer ground snowpack with partial cover (solve_snow, snow_melt, snow_albedo, new_snow_density, calc_snow_coverage); melt feeds the infiltration partition."
    - name: "CanopySnowInterception"
      role: "process_solver"
      brief: "Snow stored on vegetation (snow_intercept) with interception, sublimation, drip; coupled to the canopy energy balance."
    - name: "BlowingSnowSublimation"
      role: "optional_module"
      applicability: "BLOWING enabled"
      brief: "Sub-grid wind transport and sublimation losses (CalcBlowingSnow) using sigma_slope, lag_one, fetch."
    - name: "SurfaceEnergyBalance"
      role: "process_solver"
      brief: "Root-Brent iteration of the surface energy balance (calc_surf_energy_bal -> func_surf_energy_bal -> root_brent) producing Tsurf, sensible/latent/ground fluxes; bracket widths SNOW_DT/SURF_DT/SOIL_DT/CANOPY_DT shape convergence."
    - name: "AtmosphericEnergyBalance"
      role: "process_solver"
      brief: "calc_atmos_energy_bal solves canopy/atmosphere energy exchange with StabilityCorrection."
    - name: "SoilThermalSolver"
      role: "process_solver"
      brief: "Finite-difference soil temperature profile to damping depth (soil_conduction -> solve_T_profile / solve_T_profile_implicit -> tridiag); up to MAX_NODES=50 thermal nodes."
    - name: "FrozenSoil"
      role: "optional_module"
      applicability: "FROZEN_SOIL enabled (fs_active)"
      brief: "Splits each layer's moisture into liquid and ice phases, updates hydraulic and thermal properties; tracks up to MAX_FRONTS=3 freezing/thawing fronts."
    - name: "ElevationBands"
      role: "driver"
      brief: "Per-band invocation of snow + soil columns with lapsed forcing; band fluxes weighted by AreaFract."
    - name: "VegetationTiles"
      role: "driver"
      brief: "Per-tile invocation of canopy + root + snow interception; tile fluxes weighted by Cv."
    - name: "LakeWetland"
      role: "optional_module"
      applicability: "LAKES enabled"
      brief: "Composite within-cell lake with thermal stratification, ice dynamics, and water exchange with surrounding upland soil (solve_lake -> alblake, lakeice, water_energy_balance, ...)."
    - name: "CarbonCycle"
      role: "optional_module"
      applicability: "CARBON enabled"
      brief: "Photosynthesis (photosynth -> faparl, darkinhib, hiTinhib), autotrophic respiration, and heterotrophic respiration via compute_soil_resp; updates litter/intermediate/slow C pools."
    - name: "GridcellAggregator"
      role: "allocator"
      brief: "calc_gridcell_avg_albedo and put_data aggregate per-tile, per-band fluxes and states to grid-cell outputs."
    - name: "WaterBalanceClosure"
      role: "integrator"
      brief: "water_balance computes residuals and OUT_WATER_ERROR / OUT_ENERGY_ERROR; also handles advect_soil_veg_storage / advect_snow_storage / advect_carbon_storage when lake area changes."
  internal_edges:
    - from: "Inputs"
      to: "ForcingDisaggregation"
      kind: "consumes_input"
      brief: "Sub-daily atmospheric forcing read from per-cell ASCII files."
    - from: "ForcingDisaggregation"
      to: "ElevationBands"
      kind: "invokes"
      brief: "Lapsed forcing dispatched to each elevation band."
    - from: "ElevationBands"
      to: "VegetationTiles"
      kind: "invokes"
      brief: "Each band invokes per-tile canopy/snow columns."
    - from: "VegetationTiles"
      to: "CanopySnowInterception"
      kind: "invokes"
      brief: "Per-tile snow-on-canopy energy/mass balance."
    - from: "VegetationTiles"
      to: "CanopyEvapAndStomatalControl"
      kind: "invokes"
      brief: "Per-tile transpiration and interception evaporation."
    - from: "CanopySnowInterception"
      to: "Snowpack"
      kind: "writes_state"
      brief: "Drip and unloading from canopy snow augments ground snow water equivalent."
    - from: "Snowpack"
      to: "VariableInfiltrationCapacity"
      kind: "produces_output"
      brief: "Snowmelt + rain-through-snow becomes the liquid input to the infiltration partition."
    - from: "BlowingSnowSublimation"
      to: "Snowpack"
      kind: "writes_state"
      brief: "Sublimation losses reduce SWE when BLOWING is on."
    - from: "VariableInfiltrationCapacity"
      to: "MultiLayerSoilWaterBalance"
      kind: "writes_state"
      brief: "Infiltrated water enters the top soil layer; surface excess becomes runoff."
    - from: "VariableInfiltrationCapacity"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_RUNOFF (surface runoff)."
    - from: "MultiLayerSoilWaterBalance"
      to: "ARNO_Baseflow"
      kind: "reads_state"
      brief: "Bottom-layer moisture drives the non-linear baseflow function."
    - from: "ARNO_Baseflow"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_BASEFLOW."
    - from: "MultiLayerSoilWaterBalance"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_SOIL_MOIST, OUT_SOIL_LIQ, OUT_SOIL_ICE, OUT_ROOTMOIST, OUT_ZWT."
    - from: "CanopyEvapAndStomatalControl"
      to: "MultiLayerSoilWaterBalance"
      kind: "reads_state"
      brief: "Transpiration draws from layer moisture weighted by root_fract per zone."
    - from: "BareSoilEvaporation"
      to: "MultiLayerSoilWaterBalance"
      kind: "reads_state"
      brief: "Bare-soil ET draws from the top soil layer."
    - from: "CanopyEvapAndStomatalControl"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_EVAP, OUT_TRANSP_VEG, OUT_EVAP_CANOP."
    - from: "BareSoilEvaporation"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_EVAP_BARE."
    - from: "SurfaceEnergyBalance"
      to: "Atmosphere"
      kind: "produces_output"
      brief: "OUT_SENSIBLE, OUT_LATENT, OUT_GRND_FLUX, OUT_R_NET, OUT_LWNET, OUT_SWNET; root-Brent iteration on Tsurf."
    - from: "AtmosphericEnergyBalance"
      to: "SurfaceEnergyBalance"
      kind: "invokes"
      brief: "Canopy/atmosphere coupling supplies Tcanopy, Tfoliage feedback to the surface balance."
    - from: "SoilThermalSolver"
      to: "MultiLayerSoilWaterBalance"
      kind: "writes_state"
      brief: "Soil node temperatures update layer T, kappa, Cs used in the water-balance step."
    - from: "SoilThermalSolver"
      to: "FrozenSoil"
      kind: "reads_state"
      brief: "Node temperatures drive the liquid/ice partition update each step."
    - from: "FrozenSoil"
      to: "MultiLayerSoilWaterBalance"
      kind: "writes_state"
      brief: "Layer ice content modifies effective hydraulic conductivity and water available for flow."
    - from: "LakeWetland"
      to: "MultiLayerSoilWaterBalance"
      kind: "writes_state"
      brief: "Lake fraction exchanges water with surrounding upland soil; lake-veg-tile runoff and baseflow are re-routed and other tiles' values are scaled by (1 - lake rpercent)."
    - from: "LakeWetland"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_LAKE_VOLUME, OUT_LAKE_DEPTH, OUT_LAKE_AREA_FRAC, OUT_LAKE_ICE, OUT_LAKE_SURF_TEMP and related lake variables."
    - from: "CarbonCycle"
      to: "CanopyEvapAndStomatalControl"
      kind: "reads_state"
      brief: "GPP shares stomatal conductance, Ci, PAR, and Tcanopy state with transpiration."
    - from: "CarbonCycle"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_GPP, OUT_NPP, OUT_RAUT, OUT_RHET, OUT_NEE, OUT_CLITTER, OUT_CINTER, OUT_CSLOW."
    - from: "Snowpack"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_SWE, OUT_SNOW_DEPTH, OUT_SNOW_MELT, OUT_SNOW_COVER, OUT_SNOW_SURF_TEMP, OUT_SUB_SNOW."
    - from: "GridcellAggregator"
      to: "Outputs"
      kind: "produces_output"
      brief: "Per-tile / per-band fluxes weighted by Cv and AreaFract into grid-cell averages."
    - from: "WaterBalanceClosure"
      to: "Outputs"
      kind: "produces_output"
      brief: "OUT_WATER_ERROR, OUT_ENERGY_ERROR diagnostics."

states:
  variables:
    - name: "cell.layer[*].moist"
      unit: "mm"
      role: "prognostic"
    - name: "cell.layer[*].ice[MAX_FROST_AREAS]"
      unit: "mm"
      role: "prognostic"
    - name: "cell.layer[*].T"
      unit: "degC"
      role: "prognostic"
    - name: "cell.layer[*].kappa"
      unit: "W/m/K"
      role: "diagnostic"
    - name: "cell.layer[*].Cs"
      unit: "J/m^3/K"
      role: "diagnostic"
    - name: "cell.layer[*].zwt"
      unit: "cm"
      role: "diagnostic"
    - name: "cell.asat"
      unit: "fraction"
      role: "diagnostic"
    - name: "cell.zwt / cell.zwt_lumped"
      unit: "cm"
      role: "diagnostic"
    - name: "cell.rootmoist"
      unit: "mm"
      role: "diagnostic"
    - name: "cell.wetness"
      unit: "fraction"
      role: "diagnostic"
    - name: "cell.CLitter / CInter / CSlow"
