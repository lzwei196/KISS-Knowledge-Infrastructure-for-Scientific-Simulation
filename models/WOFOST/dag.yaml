template_version: "3.5"

identity:
  model_id: "WOFOST"
  scientific_reference_version: "WOFOST 7.2 (Wageningen / WUR, PCSE 6.0 lineage)"
  implementation:
    id: "pcse-wofost72"
    version: "PCSE 6.0.12 / WOFOST 7.2"
    provenance: "Python; PCSE (Allard de Wit / WUR) wraps WOFOST 7.2 numerics; engine classes Wofost72_PP / Wofost72_WLP_FD / Wofost72_WLP_CWB."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "EUPL-1.2"
  repo_url: "https://github.com/ajwdewit/pcse"

boundary:
  scope_in:
    - "Daily crop growth and development from sowing/emergence to maturity at field/point scale"
    - "Phenological development on a DVS scale 0 (emergence) - 1 (anthesis) - 2 (maturity), including optional vernalisation for winter cereals"
    - "Daily gross CO2 assimilation (Spitters 3-point Gauss integration over daytime and canopy depth)"
    - "Maintenance and growth respiration"
    - "Assimilate partitioning to roots, leaves, stems, and storage organs via DVS-indexed tables"
    - "Leaf, stem, storage-organ, and root dynamics including leaf-cohort senescence"
    - "Crop evapotranspiration (potential transpiration TRA, soil evaporation EVSMX, open-water evaporation EVWMX)"
    - "Single-bucket / two-layer free-drainage soil water balance with surface storage and oxygen-stress accounting"
    - "Three production levels: Potential (PP), Water-limited Free Drainage (WLP_FD), Water-limited Classic Water Balance with groundwater (WLP_CWB)"
    - "Agromanagement signalling: sowing, harvest, timed irrigation events"
  scope_out:
    - "Sub-daily processes (fixed 1-day Euler timestep)"
    - "Lateral spatial processes; multi-cell domains are built by looping the point model"
    - "Nitrogen, phosphorus, and potassium limitation (WOFOST 7.2 standard ignores fertilization events)"
    - "Multi-layer Richards-style soil water flow (introduced only in 7.3+ WaterBalanceLayered, out of scope here)"
    - "Pests, diseases, and frost damage in the baseline 7.2 configuration"
  spatial: "0-D point"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-balance closure applies to soil water (root-zone + subsoil two-bucket WaterbalanceFD checks WBALRT/WBALTT at finalize within 1e-4 cm; carbon partitioning checksum FR+(FL+FS+FO)*(1-FR)=1 enforced within 1e-4). Daily evapotranspiration is a Penman / Penman-Monteith demand-side flux calculation, not a closed surface energy balance. Nitrogen and carbon-pool dynamics are NOT closed in WOFOST 7.2 (no N limitation in this version)."

inputs:
  forcing:
    - category: "forcing"
      name: "IRRAD"
      unit: "J m-2 day-1"
      source_kind: "forcing"
      model_input_format: "Daily global shortwave radiation; engine-internal unit is Joules (not kJ or MJ)"
      notes: "Spring/summer values typically 1e7-3.5e7 J m-2 d-1; winter 2e6-8e6. IRRAD drives photosynthesis through the Spitters 3-point Gauss integration; an order-of-magnitude unit error silently zeroes yield."
    - category: "forcing"
      name: "TMIN"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "Daily minimum air temperature"
    - category: "forcing"
      name: "TMAX"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "Daily maximum air temperature; TMIN <= TMAX required every day"
    - category: "forcing"
      name: "VAP"
      unit: "hPa"
      source_kind: "forcing"
      model_input_format: "Mean daily vapour pressure (engine-internal hPa)"
    - category: "forcing"
      name: "WIND"
      unit: "m s-1"
      source_kind: "forcing"
      model_input_format: "Mean daily wind speed at 2 m height"
    - category: "forcing"
      name: "RAIN"
      unit: "cm day-1"
      source_kind: "forcing"
      model_input_format: "Daily precipitation, engine-internal unit cm/day (consumed by WaterbalanceFD)"
    - category: "forcing"
      name: "SNOWDEPTH"
      unit: "cm"
      source_kind: "forcing"
      model_input_format: "Optional daily snow cover depth; required (non-NaN) under PCSE 6.0 when frost-damage / SnowMAUS path is active; otherwise set to 0.0"
    - category: "forcing"
      name: "CO2"
      unit: "ppm"
      source_kind: "forcing"
      model_input_format: "Atmospheric CO2 concentration; in PCSE 6.0 WOFOST 7.2 path it is handled via crop CO2 tables rather than as a site parameter, but it is a time-varying atmospheric driver of the assimilation submodel"
      notes: "Acts on AMAX and on the CO2 factor in assimilation; only the CO2-aware assimilation path consumes it explicitly."
  parameters:
    - category: "parameter"
      name: "TSUM1"
      unit: "degC d"
      source_kind: "calibrated"
      model_input_format: "Crop YAML parameter (TSUM1); thermal time emergence -> anthesis"
    - category: "parameter"
      name: "TSUM2"
      unit: "degC d"
      source_kind: "calibrated"
      model_input_format: "Crop YAML parameter (TSUM2); thermal time anthesis -> maturity"
    - category: "parameter"
      name: "TBASEM"
      unit: "degC"
      source_kind: "calibrated"
      model_input_format: "Base temperature for emergence thermal-time accumulation"
    - category: "parameter"
      name: "TDWI"
      unit: "kg ha-1"
      source_kind: "calibrated"
      model_input_format: "Initial total dry-matter weight at emergence; partitioned into TWLV/TWST/TWRT at init within 1e-4 tolerance"
    - category: "parameter"
      name: "SPAN"
      unit: "d"
      source_kind: "calibrated"
      model_input_format: "Maximum leaf lifespan at 35 degC; controls leaf-cohort senescence in WOFOST_Leaf_Dynamics"
    - category: "parameter"
      name: "AMAXTB"
      unit: "kg CH2O ha-1 hr-1 vs DVS"
      source_kind: "calibrated"
      model_input_format: "AFGEN table; maximum leaf gross assimilation rate as a function of DVS"
    - category: "parameter"
      name: "EFFTB"
      unit: "kg CH2O J-1 vs degC"
      source_kind: "calibrated"
      model_input_format: "AFGEN table; light-use efficiency of single leaves vs temperature"
    - category: "parameter"
      name: "SLATB"
      unit: "ha kg-1 vs DVS"
      source_kind: "calibrated"
      model_input_format: "AFGEN table; specific leaf area vs DVS; multiplies leaf biomass to give LAI"
    - category: "parameter"
      name: "KDIFTB"
      unit: "- vs DVS"
      source_kind: "calibrated"
      model_input_format: "AFGEN table; extinction coefficient for diffuse PAR"
    - category: "parameter"
      name: "FRTB"
      unit: "- vs DVS"
      source_kind: "calibrated"
      model_input_format: "AFGEN table; fraction of total dry matter partitioned to roots"
    - category: "parameter"
      name: "FLTB"
      unit: "- vs DVS"
      source_kind: "calibrated"
      model_input_format: "AFGEN above-ground partitioning fraction to leaves; FRTB+(FLTB+FSTB+FOTB)(1-FRTB)=1 within 1e-4"
    - category: "parameter"
      name: "FSTB"
      unit: "- vs DVS"
      source_kind: "calibrated"
      model_input_format: "AFGEN above-ground partitioning fraction to stems"
    - category: "parameter"
      name: "FOTB"
      unit: "- vs DVS"
      source_kind: "calibrated"
      model_input_format: "AFGEN above-ground partitioning fraction to storage organs"
    - category: "parameter"
      name: "CVO"
      unit: "kg DM kg-1 CH2O"
      source_kind: "calibrated"
      model_input_format: "Conversion efficiency assimilates -> storage organ dry matter"
    - category: "parameter"
      name: "Q10"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "Temperature sensitivity of maintenance respiration; TEFF = Q10**((TEMP-25)/10)"
    - category: "parameter"
      name: "VERNSAT"
      unit: "d"
      source_kind: "calibrated"
      model_input_format: "Cold-day requirement for full vernalisation; only active when IDSL>=2"
    - category: "parameter"
      name: "VERNBASE"
      unit: "degC"
      source_kind: "calibrated"
      model_input_format: "Base temperature for vernalisation accumulation"
    - category: "parameter"
      name: "VERNDVS"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "Safety-cutoff DVS at which vernalisation is force-completed even if VERNSAT not reached"
    - category: "parameter"
      name: "RDMSOL"
      unit: "cm"
      source_kind: "dataset_lookup"
      model_input_format: "Maximum rootable soil depth; soil-side cap on rooting"
    - category: "parameter"
      name: "RDMCR"
      unit: "cm"
      source_kind: "calibrated"
      model_input_format: "Maximum crop rooting depth; effective RDM = min(RDMSOL, RDMCR)"
    - category: "parameter"
      name: "SMW"
      unit: "cm3 cm-3"
      source_kind: "dataset_lookup"
      model_input_format: "Wilting point (pF 4.2)"
    - category: "parameter"
      name: "SMFCF"
      unit: "cm3 cm-3"
      source_kind: "dataset_lookup"
      model_input_format: "Field capacity (pF 2.0); ordering constraint SMW < SMFCF < SM0"
    - category: "parameter"
      name: "SM0"
      unit: "cm3 cm-3"
      source_kind: "dataset_lookup"
      model_input_format: "Soil porosity / saturation moisture; SM0 <= 0.65"
    - category: "parameter"
      name: "CRAIRC"
      unit: "cm3 cm-3"
      source_kind: "dataset_lookup"
      model_input_format: "Critical air content for oxygen stress; CRAIRC < SM0 - SMFCF"
    - category: "parameter"
      name: "K0"
      unit: "cm d-1"
      source_kind: "dataset_lookup"
      model_input_format: "Saturated hydraulic conductivity"
    - category: "parameter"
      name: "SOPE"
      unit: "cm d-1"
      source_kind: "dataset_lookup"
      model_input_format: "Maximum percolation rate root zone"
    - category: "parameter"
      name: "KSUB"
      unit: "cm d-1"
      source_kind: "dataset_lookup"
      model_input_format: "Maximum percolation rate subsoil"
    - category: "parameter"
      name: "DEPNR"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "Crop group number for SWEAF easily-available-water curve in evapotranspiration"
  initial_conditions:
    - category: "initial_condition"
      name: "WAV"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: "Initial available soil water in the profile; >= 0"
    - category: "initial_condition"
      name: "SSI"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: "Initial surface storage"
    - category: "initial_condition"
      name: "SMLIM"
      unit: "cm3 cm-3"
      source_kind: "user_provided"
      model_input_format: "Maximum initial topsoil moisture for water-balance initialization"
    - category: "initial_condition"
      name: "DVS_initial"
      unit: "-"
      source_kind: "default"
      model_input_format: "Hardcoded -0.1 at sowing (CROP_START_TYPE='sowing') so pre-emergence DVR = 0.1*DTSUME/TSUMEM advances to 0 at emergence"
  boundary_conditions:
    - category: "boundary_condition"
      name: "production_level"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Selector between Wofost72_PP (potential), Wofost72_WLP_FD (water-limited, free drainage), and Wofost72_WLP_CWB (water-limited, classic water balance with groundwater); choice activates / bypasses the soil water balance and changes which soil parameters are required"
      notes: "Misusing PP where WLP is intended silently inflates yields 2-5x; the choice is a model-form switch, not a parameter."
    - category: "boundary_condition"
      name: "crop_start_type"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Enum 'sowing' | 'emergence'; controls whether the pre-emergence thermal-time submodel (TSUMEM) is exercised"
    - category: "boundary_condition"
      name: "crop_end_type"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Enum 'maturity' | 'harvest' | 'earliest'; controls termination criterion"
    - category: "boundary_condition"
      name: "crop_start_date"
      unit: "date"
      source_kind: "user_provided"
      model_input_format: "Sowing or emergence date in agromanagement YAML; campaign_start_date <= crop_start_date"
    - category: "boundary_condition"
      name: "max_duration"
      unit: "d"
      source_kind: "user_provided"
      model_input_format: "Maximum number of days the campaign is allowed to run; truncates silently if reached before DVS=2"
    - category: "boundary_condition"
      name: "irrigation_events"
      unit: "cm event-1"
      source_kind: "user_provided"
      model_input_format: "TimedEvents 'irrigate' in agromanagement YAML; events_table of {date: {amount: cm, efficiency: 0-1}}; consumed by WaterbalanceFD via AgroManager signal"
    - category: "boundary_condition"
      name: "IFUNRN"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Infiltration flag (0 = no runoff, 1 = USDA curve-number reduction via NINFTB)"
    - category: "boundary_condition"
      name: "NOTINF"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Fraction of rainfall that does not infiltrate when IFUNRN=0"
    - category: "boundary_condition"
      name: "SSMAX"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: "Maximum surface storage"

processes:
  modules:
    - name: "DVS_Phenology"
      role: "process_solver"
      brief: "Accumulates daily thermal-time DTSUM from DTSMTB(TEMP) and advances DVS from -0.1 (pre-emergence) through 0 (emergence), 1 (anthesis), to 2 (maturity) via TSUMEM, TSUM1, TSUM2; switches STAGE among emerging/vegetative/reproductive/mature and emits crop_finish at maturity."
    - name: "Vernalisation"
      role: "optional_module"
      applicability: "winter cereals (IDSL>=2); active only during vegetative stage"
      brief: "Sub-object of DVS_Phenology that accumulates VERN via VERNRTB(TEMP) starting near VERNBASE; publishes VERNFAC which multiplies DTSUM during vegetative stage; force-completes when DVS>VERNDVS (safety cutoff)."
    - name: "WOFOST72_Assimilation"
      role: "process_solver"
      brief: "Daily gross canopy assimilation via Spitters 3-point Gauss integration over daytime and canopy depth; partitions PAR into diffuse and direct using KDIFTB and KGLOB=0.75*KDIFTB(DVS); applies AMAXTB, EFFTB, TMPFTB temperature factor and CO2 factor on AMAX; returns PGASS (potential gross assimilation, kg CH2O ha-1 d-1)."
    - name: "WOFOST_Maintenance_Respiration"
      role: "process_solver"
      brief: "Computes potential maintenance respiration as the organ-weighted sum of RMR*W*Q10**((TEMP-25)/10); the Wofost72 caller caps MRES at GASS to enforce respiration <= assimilation."
    - name: "Evapotranspiration"
      role: "process_solver"
      brief: "Computes potential crop transpiration TRAMX, potential soil evaporation EVSMX, and open-water evaporation EVWMX from Penman E0/ES0/ET0 via Beer-Lambert canopy extinction; applies water-stress reducer RFWS from the Doorenbos-Kassam SWEAF curve (DEPNR, ET0) and oxygen-stress reducer RFOS from DSOS and CRAIRC; publishes actual TRA = TRAMX*RFWS*RFOS and RFTRA reducer."
    - name: "DVS_Partitioning"
      role: "allocator"
      brief: "Maps DVS to dry-matter partitioning fractions FR (root) and FL/FS/FO (above-ground leaf/stem/storage) via AFGEN tables FRTB/FLTB/FSTB/FOTB; enforces FR+(FL+FS+FO)*(1-FR)=1 within 1e-4 (PartitioningError otherwise)."
    - name: "WOFOST_Leaf_Dynamics"
      role: "integrator"
      brief: "Tracks a deque of daily leaf cohorts (GRLV, FYSAGE) and prunes them at SPAN; computes leaf death DSLV from combined water-stress, temperature, and self-shading drivers; integrates WLV/DWLV/TWLV; publishes LAI (exponential pre-LAIEXP plus canopy LAI from leaf biomass via SLATB)."
    - name: "WOFOST_Stem_Dynamics"
      role: "integrator"
      brief: "Integrates stem biomass WST/DWST/TWST with growth GRST=ADMI*FS and death DRST via RDRSTB; stem area index SAI=TWST*SSATB(DVS)."
    - name: "WOFOST_Storage_Organ_Dynamics"
      role: "integrator"
      brief: "Integrates storage-organ biomass WSO/DWSO/TWSO with growth GRSO=ADMI*FO; storage organs do not die in WOFOST 7.2; pod area index PAI=TWSO*SPA."
    - name: "WOFOST_Root_Dynamics"
      role: "integrator"
      brief: "Integrates root biomass WRT/DWRT/TWRT and rooting depth RD up to RDM=min(RDMSOL, RDMCR); RR=RRI until RD reaches RDM; publishes RD which controls the soil water balance's root-zone depth."
    - name: "WaterbalancePP"
      role: "optional_module"
      applicability: "Wofost72_PP production level"
      brief: "Potential-production 'fake' water balance: holds SM=SMFCF every day and only accumulates EVS via a days-since-last-rain heuristic and WTRA from the crop transpiration kiosk; supplies no soil-moisture stress to the crop."
    - name: "WaterbalanceFD"
      role: "process_solver"
      applicability: "Wofost72_WLP_FD and WLP_CWB production levels"
      brief: "Classic free-drainage two-bucket (root-zone + subsoil) water balance; rates RIN (infiltration), RIRR (irrigation), EVS (soil evap), EVW (open-water evap), PERC (root-zone -> subsoil), LOSS (subsoil -> deep), TSR (surface runoff); integrates SM, W (root-zone water), WLOW (subsoil), SS (surface storage); tracks consecutive oxygen-stress days DSOS; verifies WBALRT/WBALTT within 1e-4 cm at finalize."
  internal_edges:
    - from: "Climate"
      to: "WOFOST72_Assimilation"
      kind: "consumes_input"
      brief: "IRRAD drives gross photosynthesis through the Spitters Gauss integration"
    - from: "Climate"
      to: "DVS_Phenology"
      kind: "consumes_input"
      brief: "TMIN/TMAX accumulate daily thermal time DTSUM"
    - from: "Climate"
      to: "Vernalisation"
      kind: "consumes_input"
      brief: "Daily temperature relative to VERNBASE accumulates VERN for winter cereals"
    - from: "Climate"
      to: "WaterbalanceFD"
      kind: "consumes_input"
      brief: "RAIN is the principal water input to the two-bucket soil water balance"
    - from: "Climate"
      to: "Evapotranspiration"
      kind: "consumes_input"
      brief: "TMIN/TMAX/VAP/WIND and derived E0/ES0/ET0 drive the Penman demand calculation"
    - from: "Vernalisation"
      to: "DVS_Phenology"
      kind: "writes_state"
      brief: "Publishes VERNFAC which multiplies DTSUM during vegetative stage"
    - from: "DVS_Phenology"
      to: "DVS"
      kind: "writes_state"
      brief: "Updates DVS prognostic state consumed throughout the model as a DVS-indexing key"
    - from: "DVS_Phenology"
      to: "DVS_Partitioning"
      kind: "invokes"
      brief: "DVS indexes the FRTB/FLTB/FSTB/FOTB partitioning AFGEN tables"
    - from: "DVS_Phenology"
      to: "WOFOST_Leaf_Dynamics"
      kind: "invokes"
      brief: "DVS drives SLATB (specific leaf area) and senescence triggers"
    - from: "WOFOST72_Assimilation"
      to: "WOFOST_Maintenance_Respiration"
      kind: "produces_output"
      brief: "PGASS feeds the daily carbon budget; MRES is capped at GASS"
    - from: "WOFOST_Maintenance_Respiration"
      to: "DVS_Partitioning"
      kind: "produces_output"
      brief: "Net assimilate (GASS - MRES) converted to dry matter via CVF is what gets partitioned"
    - from: "DVS_Partitioning"
      to: "WOFOST_Leaf_Dynamics"
      kind: "writes_state"
      brief: "ADMI*FL is the leaf growth rate GRLV"
    - from: "DVS_Partitioning"
      to: "WOFOST_Stem_Dynamics"
      kind: "writes_state"
      brief: "ADMI*FS is the stem growth rate GRST"
    - from: "DVS_Partitioning"
      to: "WOFOST_Storage_Organ_Dynamics"
      kind: "writes_state"
      brief: "ADMI*FO is the storage-organ growth rate GRSO"
    - from: "DVS_Partitioning"
      to: "WOFOST_Root_Dynamics"
      kind: "writes_state"
      brief: "DMI*FR is the root growth rate GRRT"
    - from: "WOFOST_Leaf_Dynamics"
      to: "LAI"
      kind: "writes_state"
      brief: "Updates LAI prognostic state from leaf biomass and SLATB"
    - from: "LAI"
      to: "WOFOST72_Assimilation"
      kind: "reads_state"
      brief: "Canopy LAI sets light interception in the Spitters canopy integration"
    - from: "LAI"
      to: "Evapotranspiration"
      kind: "reads_state"
      brief: "Beer-Lambert exp(-KGLOB*LAI) determines TRAMX vs EVSMX split"
    - from: "WOFOST_Root_Dynamics"
      to: "RD"
      kind: "writes_state"
      brief: "Updates rooting-depth prognostic state up to RDM = min(RDMSOL, RDMCR)"
    - from: "RD"
      to: "WaterbalanceFD"
      kind: "reads_state"
      brief: "Root depth defines the boundary between the root-zone bucket W and the subsoil bucket WLOW"
    - from: "Evapotranspiration"
      to: "WaterbalanceFD"
      kind: "produces_output"
      brief: "TRA, EVSMX, EVWMX are the evaporative sinks of the soil water balance"
    - from: "WaterbalanceFD"
      to: "SM"
      kind: "writes_state"
      brief: "Updates volumetric root-zone soil moisture SM"
    - from: "SM"
      to: "Evapotranspiration"
      kind: "reads_state"
      brief: "RFWS = (SM-SMW)/(SMCR-SMW) is the water-stress reducer; SM also controls the SWEAF easily-available-water curve"
    - from: "WaterbalanceFD"
      to: "WOFOST72_Assimilation"
      kind: "writes_state"
      brief: "RFTRA = TRA/TRAMX (published via the inter-module bus by Evapotranspiration using SM from WaterbalanceFD) scales GASS = PGASS*RFTRA under water-limited production"
    - from: "WaterbalancePP"
      to: "SM"
      kind: "writes_state"
      brief: "Under PP production level, SM is forced to SMFCF every day so no water stress is ever applied"
    - from: "WOFOST_Storage_Organ_Dynamics"
      to: "TWSO"
      kind: "writes_state"
      brief: "TWSO is the harvestable yield state used to derive HI = TWSO/TAGP at finalize"
    - from: "WOFOST_Leaf_Dynamics"
      to: "Outputs"
      kind: "produces_output"
      brief: "LAI, TWLV, LAIMAX written to the daily and summary output series"
    - from: "WOFOST_Storage_Organ_Dynamics"
      to: "Outputs"
      kind: "produces_output"
      brief: "TWSO written to daily and summary output series"
    - from: "DVS_Phenology"
      to: "Outputs"
      kind: "produces_output"
      brief: "Summary dates DOS, DOE, DOA, DOM, DOH, DOV written on phenological transitions"
    - from: "WaterbalanceFD"
      to: "Outputs"
      kind: "produces_output"
      brief: "SM, WWLOW, CTRAT, CEVST written to daily and summary series"

states:
  variables:
    - name: "DVS"
      unit: "-"
      role: "prognostic"
    - name: "TSUM"
      unit: "degC d"
      role: "accumulator"
    - name: "TSUME"
      unit: "degC d"
      role: "accumulator"
    - name: "STAGE"
      unit: "-"
      role: "diagnostic"
    - name: "VERN"
      unit: "d"
      role: "accumulator"
    - name: "ISVERNALISED"
      unit: "bool"
      role: "diagnostic"
    - name: "LAI"
      unit: "m2 m-2"
      role: "prognostic"
    - name: "LAIMAX"
      unit: "m2 m-2"
      role: "accumulator"
    - name: "LAIEXP"
      unit: "m2 m-2"
      role: "prognostic"
    - name: "LASUM"
      unit: "m2 m-2"
      role: "diagnostic"
    - name: "WLV"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "DWLV"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "TWLV"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "WST"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "DWST"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "TWST"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "SAI"
      unit: "-"
      role: "diagnostic"
    - name: "WSO"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "DWSO"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "TWSO"
      unit: "kg ha-1"
      role: "prognostic"
    - name: "PAI"
      unit: "-"
      role: "diagnostic"
