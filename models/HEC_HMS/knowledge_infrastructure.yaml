    provenance: Python; HydroCraft reimplementation of the public-domain SCS-CN / SCS-UH / Muskingum /
      Linear-Reservoir algorithms, producing equivalent results for lumped/semi-distributed basins.
  scientific_reference_version: HEC-HMS public-domain rainfall-runoff method set (USACE HEC; SCS Curve
    Number loss, SCS dimensionless Unit Hydrograph transform, Muskingum channel routing, Linear Reservoir
    baseflow)
  binary:
    path: KISSPATH_KI_ROOT/HEC_HMS/knowledge_infrastructure/tools/run_hec_hms.py
    type: Python
pipeline:
