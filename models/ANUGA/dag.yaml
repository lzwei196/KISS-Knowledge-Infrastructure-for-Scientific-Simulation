template_version: "3.5"

identity:
  model_id: "ANUGA"
  scientific_reference_version: "ANUGA 2D nonlinear shallow-water (Saint-Venant) finite-volume solver, DE0 discontinuous-elevation flow algorithm"
  implementation:
    id: "anuga-py"
    version: "3.3.2"
    provenance: "Python with compiled C core flux kernels; community-maintained ANUGA (Geoscience Australia / ANU MSI), github.com/anuga-community/anuga_core."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "Apache-2.0"
  repo_url: "https://github.com/anuga-community/anuga_core"

boundary:
  scope_in:
    - "2D depth-averaged hydrodynamic inundation (riverine flooding, dam-break, storm surge, tsunami runup)"
    - "Water surface elevation (stage) and depth-integrated horizontal momentum over time"
    - "Wetting and drying of cells as water advances onto dry land / recedes"
    - "Manning bed friction; rainfall/inflow source forcing; hydraulic-structure operators (culverts, weirs, internal boundaries)"
  scope_out:
    - "Vertical convection, breaking waves, and fully 3D turbulence (depth-averaged shallow-water assumption)"
    - "Physical turbulence closure (flow is inviscid unless numerical kinematic-viscosity smoothing is applied)"
    - "Areas spanning more than ~1.5 UTM zones (projected-coordinate assumption)"
    - "Forecasting/calibration as a model role — ANUGA is a physics solver; only Manning's n and mesh resolution are practically tuned"
  spatial: "2-D grid"
  temporal: "event"
  closure: "both"
  notes: "Mass and momentum are conserved by the Godunov-type finite-volume scheme over unstructured triangular cells. Timestepping is adaptive and CFL-constrained (dt <= CFL * min(dx/sqrt(g*h)) across all triangles); the user-set yieldstep only governs output cadence, not the stable inner timestep. Wetting/drying clips depth to zero where stage < bed elevation; the balance_deep_and_shallow / protect_against_infinitesimal_and_negative_heights limiters redistribute momentum and clamp negative heights outside the explicit flux step."

inputs:
  forcing:
    - category: "forcing"
      name: "rainfall"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "volumetric rate per unit area applied via Rate_operator each step"
      notes: "Rate_operator expects a rate in m/s; it adds (or, when negative for evaporation/abstraction, removes) water to the continuity equation. Negative rates also scale xmomentum/ymomentum by the local factors, so the rainfall operator can modify momentum, not only stage."
    - category: "forcing"
      name: "inflow discharge"
      unit: "m^3/s"
      source_kind: "forcing"
      model_input_format: "prescribed total discharge via Inlet_operator, optional velocity direction"
  parameters:
    - category: "parameters"
      name: "DEM / bed elevation"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "terrain fitted to mesh as the 'elevation' quantity (per-cell under discontinuous-elevation DE methods)"
      notes: "ANUGA uses raw elevation values without vertical-datum awareness; DEM and any prescribed boundary water levels must share the same vertical datum."
    - category: "parameters"
      name: "Manning's n (friction)"
      unit: "s/m^(1/3)"
      source_kind: "calibrated"
      model_input_format: "domain.set_quantity('friction', n) field; default 0.03"
      notes: "Typical 0.02-0.15 by land cover; 0.0 only for analytical benchmarks. manning_friction_semi_implicit is auto-appended to forcing_terms in Domain.__init__, so friction is always active."
    - category: "parameters"
      name: "maximum_triangle_area"
      unit: "m^2"
      source_kind: "user_provided"
      model_input_format: "mesh-generation constraint (Triangle); optional interior_regions for local refinement"
      notes: "Controls spatial resolution: ~100-1000 m^2 for real-world domains up to 10 km; 1-10 m^2 for benchmark accuracy."
    - category: "parameters"
      name: "g (gravitational acceleration)"
      unit: "m/s^2"
      source_kind: "default"
      model_input_format: "config.py hardcoded default 9.8 (not 9.81)"
      notes: "Baked into the flux kernels; affects all wave-speed/celerity terms."
    - category: "parameters"
      name: "minimum_storable_height"
      unit: "m"
      source_kind: "default"
      model_input_format: "config default 1e-3 m; cells shallower stored as dry in SWW (affects reported wet area)"
    - category: "parameters"
      name: "minimum_allowed_height (H0)"
      unit: "m"
      source_kind: "default"
      model_input_format: "algorithm-dependent: DE0/DE3 use 1e-12, DE1/DE2 use 1e-5; config global default 1e-5"
      notes: "Effective value is set by the flow_algorithm method switch (DE0 forces H0=1e-12), not by config.py default."
    - category: "parameters"
      name: "CFL (Courant number)"
      unit: "-"
      source_kind: "default"
      model_input_format: "set_CFL(); config default 1.0, DE0 effective 0.9"
      notes: "Effective value is set by the flow_algorithm method switch (DE0 forces CFL=0.9), not by config.py default."
  initial_conditions:
    - category: "initial_conditions"
      name: "initial stage"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "set_quantity('stage', ...); for dry bed set stage=elevation so depth=0 everywhere"
      notes: "Constant initial stage where bed varies produces a spurious startup shock; dry-bed requires stage=elevation at every vertex."
    - category: "initial_conditions"
      name: "initial xmomentum"
      unit: "m^2/s"
      source_kind: "user_provided"
      model_input_format: "set_quantity('xmomentum', ...); default 0.0"
    - category: "initial_conditions"
      name: "initial ymomentum"
      unit: "m^2/s"
      source_kind: "user_provided"
      model_input_format: "set_quantity('ymomentum', ...); default 0.0"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "flow_algorithm"
      unit: "-"
      source_kind: "default"
      model_input_format: "set_flow_algorithm(); DE0 default (discontinuous elevation), DE1 higher order, 1_5 legacy"
      notes: "Numerical-method / discretization switch (not a tuned physical parameter). DE0 silently overrides config-module defaults (cfl->0.9, beta limiters, minimum_allowed_height->1e-12, compute_fluxes_method->DE); the effective configuration is algorithm-derived, not config.py-derived."
    - category: "boundary_conditions"
      name: "Reflective_boundary"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "solid wall: interior quantities returned with normal momentum negated"
      notes: "Use on upslope/lateral edges; all-Reflective traps water and grows total volume unbounded."
    - category: "boundary_conditions"
      name: "Transmissive boundary"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "weakly-reflective open/free-outflow boundary at outlet/downstream"
      notes: "Required at catchment outlet so water can exit; oscillating boundary depth can spuriously inject/remove water and break mass balance."
    - category: "boundary_conditions"
      name: "Dirichlet_boundary"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "fixed constant stage / momenta at the edge"
      notes: "Preferred for strict mass conservation at a prescribed-stage outlet."
    - category: "boundary_conditions"
      name: "Time_boundary"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "conserved quantities prescribed as a function of simulation time (tides, gate schedules)"
    - category: "boundary_conditions"
      name: "File_boundary / Field_boundary"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "stage/momentum time series read from an SWW file, space/time interpolated (nesting); Field_boundary adds a mean_stage offset"
    - category: "boundary_conditions"
      name: "boundary_tags"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "dict mapping tag names to 0-based polygon edge indices (e.g. {bottom:[0],right:[1],top:[2],left:[3]})"
      notes: "Wrong or untagged edge indices fail domain creation or misapply boundary conditions."
    - category: "boundary_conditions"
      name: "finaltime"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "evolve endpoint (or duration); yieldstep controls SWW save cadence independently"

processes:
  modules:
    - name: "ShallowWaterFiniteVolumeSolver"
      role: "process_solver"
      brief: "Solves the 2D depth-averaged shallow-water (Saint-Venant) equations for stage and depth-integrated momentum via DE Godunov-type Riemann fluxes (compute_fluxes) on the unstructured triangular mesh."
    - name: "EvolveDriver"
      role: "driver"
      brief: "Generic_Domain.evolve time-stepping loop: advances the solution over inner adaptive timesteps and yields at user yieldsteps."
    - name: "VertexEdgeExtrapolation"
      role: "allocator"
      brief: "distribute_to_vertices_and_edges with slope limiters (beta_* / tight_slope_limiters) reconstructs cell-face states for the flux computation."
    - name: "ManningFrictionSemiImplicit"
      role: "process_solver"
      brief: "Semi-implicit Manning bed-friction sink reading the 'friction' quantity and updating xmomentum/ymomentum each sub-step; auto-active via forcing_terms."
    - name: "WettingDryingScheme"
      role: "allocator"
      brief: "balance_deep_and_shallow + protect_against_infinitesimal_and_negative_heights clip negative depths and redistribute momentum between deep and shallow regimes using alpha_balance."
    - name: "AdaptiveCFLTimestepping"
      role: "integrator"
      brief: "Computes the stable timestep dt <= CFL * min(dx/sqrt(g*h)) over all triangles and guards against degenerate sub-steps (max_smallsteps)."
    - name: "RateOperator"
      role: "optional_module"
      brief: "Applies rainfall/evaporation/infiltration as an m/s volumetric source via fractional steps; negative rates also scale momentum."
    - name: "InletOperator"
      role: "optional_module"
      brief: "Injects a prescribed total discharge (m^3/s) at an inlet region with optional velocity direction."
    - name: "StructureOperators"
      role: "optional_module"
      brief: "Boyd_box / Boyd_pipe / Weir_orifice_trapezoid / Internal_boundary operators transfer water by head-discharge relations (culverts, pipes, weirs)."
    - name: "KinematicViscosityOperator"
      role: "optional_module"
      brief: "Parabolic smoothing/diffusion of depth-averaged velocity for numerical stabilization (not physical turbulence)."
    - name: "MeshGenerator"
      role: "driver"
      brief: "Builds the unstructured triangular mesh (Triangle) from the bounding polygon with maximum_triangle_area and optional interior_regions refinement."
    - name: "BoundaryConditions"
      role: "driver"
      brief: "Reflective / Transmissive / Dirichlet / Time / File boundary objects supply edge states each step, controlling in/outflow at domain edges."
    - name: "CrossSectionDischargeIntegrator"
      role: "optional_module"
      brief: "get_flow_through_cross_section integrates momentum (uh, vh) across a polyline to derive discharge in post-processing."
  internal_edges:
    - from: "MeshGenerator"
      to: "ShallowWaterFiniteVolumeSolver"
      kind: "invokes"
      brief: "Triangular mesh defines the finite-volume computational cells."
    - from: "AdaptiveCFLTimestepping"
      to: "EvolveDriver"
      brief: "Sets the stable inner timestep for the evolve loop."
      kind: "invokes"
    - from: "EvolveDriver"
      to: "ShallowWaterFiniteVolumeSolver"
      kind: "invokes"
      brief: "Each timestep evaluates Riemann fluxes and updates conserved quantities."
    - from: "VertexEdgeExtrapolation"
      to: "ShallowWaterFiniteVolumeSolver"
      kind: "invokes"
      brief: "Limited vertex/edge reconstruction feeds the flux computation."
    - from: "RateOperator"
      to: "stage"
      kind: "writes_state"
      brief: "Rainfall enters continuity as a volume source raising the water surface."
    - from: "Inputs"
      to: "RateOperator"
      kind: "consumes_input"
      brief: "m/s rainfall rate consumed from inputs as the source term."
    - from: "InletOperator"
      to: "stage"
      kind: "writes_state"
      brief: "Prescribed discharge injected at the inlet region."
    - from: "ShallowWaterFiniteVolumeSolver"
      to: "ManningFrictionSemiImplicit"
      kind: "invokes"
      brief: "Momentum is updated then damped semi-implicitly by Manning friction each sub-step."
    - from: "ManningFrictionSemiImplicit"
      to: "xmomentum"
      kind: "writes_state"
      brief: "Friction sink decelerates x-momentum."
    - from: "ManningFrictionSemiImplicit"
      to: "ymomentum"
      kind: "writes_state"
      brief: "Friction sink decelerates y-momentum."
    - from: "ShallowWaterFiniteVolumeSolver"
      to: "WettingDryingScheme"
      kind: "invokes"
      brief: "Depths clipped and momentum redistributed at the wet/dry interface each step."
    - from: "WettingDryingScheme"
      to: "stage"
      kind: "writes_state"
      brief: "Negative-height protection clamps stage to bed where dry."
    - from: "BoundaryConditions"
      to: "stage"
      kind: "writes_state"
      brief: "Edge boundary states set stage/momentum fluxes at domain edges."
    - from: "elevation"
      to: "ShallowWaterFiniteVolumeSolver"
      kind: "reads_state"
      brief: "Bed topography gradient drives the gravity (pressure) source term."
    - from: "StructureOperators"
      to: "stage"
      kind: "writes_state"
      brief: "Head-discharge structures transfer water between regions."
    - from: "ShallowWaterFiniteVolumeSolver"
      to: "CrossSectionDischargeIntegrator"
      kind: "invokes"
      brief: "Stage/momentum fields integrated across a polyline to derive discharge."
    - from: "CrossSectionDischargeIntegrator"
      to: "Outputs"
      kind: "produces_output"
      brief: "Emits cross-section discharge Q."
    - from: "EvolveDriver"
      to: "Outputs"
      kind: "produces_output"
      brief: "Writes stage/momentum/elevation fields to the SWW file at each yieldstep."

states:
  variables:
    - name: "stage"
      unit: "m"
      role: "prognostic"
    - name: "xmomentum"
      unit: "m^2/s"
      role: "prognostic"
    - name: "ymomentum"
      unit: "m^2/s"
      role: "prognostic"
    - name: "elevation"
      unit: "m"
      role: "diagnostic"
    - name: "friction"
      unit: "s/m^(1/3)"
      role: "diagnostic"
    - name: "height (depth)"
      unit: "m"
      role: "diagnostic"
    - name: "xvelocity"
      unit: "m/s"
      role: "diagnostic"
    - name: "yvelocity"
      unit: "m/s"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "stage"
    validation_rank: 3
    unit: "m"
    description: "Water surface elevation (bed elevation + water depth); primary conserved quantity stored over the mesh."
    emitted_in: "SWW (NetCDF) dynamic variable"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Gauge must report stage on the same vertical datum as the DEM; ANUGA carries no datum awareness."
            - "Confirm whether the gauge records stage (water surface elevation) or depth before comparing."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single peak-stage mark; sensitive to local mesh resolution."]
      detrending_options: ["none"]
  - var: "depth"
    validation_rank: 5
    unit: "m"
    description: "Water depth = stage - elevation (clipped at 0); flood thickness above the bed."
    emitted_in: "derived from SWW (stage - elevation)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Must use depth = stage - elevation; never report raw stage as depth."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Peak inundation-depth field; sensitive to DEM/elevation uncertainty and mesh resolution at the wetting front."]
      detrending_options: ["none"]
  - var: "inundation_extent"
    validation_rank: 1
    unit: "km^2 (or boolean wet/dry field)"
    description: "Surface-water flooded area, derived by thresholding water depth over the mesh at peak inundation."
    emitted_in: "derived from SWW depth field"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "event_detection"]
          determining_metric: "csi"
          caveats:
            - "Compared against observed flood masks (satellite/aerial) via hit-rate / CSI; threshold-dependent."
            - "Extent governed strongly by DEM/elevation uncertainty (Issermann & Chang 2020)."
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection"]
          determining_metric: "csi"
          caveats: ["Flooded/not-flooded classification at points or cells."]
      detrending_options: ["none"]
  - var: "xmomentum"
    validation_rank: 6
    unit: "m^2/s"
    description: "Depth-integrated surface-water momentum in x (uh); conserved quantity."
    emitted_in: "SWW (NetCDF) dynamic variable"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Velocity/momentum observations are rare; usually validated indirectly via discharge."]
      detrending_options: ["none"]
  - var: "ymomentum"
    validation_rank: 7
    unit: "m^2/s"
    description: "Depth-integrated surface-water momentum in y (vh); conserved quantity."
    emitted_in: "SWW (NetCDF) dynamic variable"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Velocity/momentum observations are rare; usually validated indirectly via discharge."]
      detrending_options: ["none"]
  - var: "discharge"
    validation_rank: 2
    unit: "m^3/s"
    description: "Surface-water flow through a cross-section: integral of water momentum (uh, vh) normal to a polyline."
    emitted_in: "derived via get_flow_through_cross_section()"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Cross-section polyline must intersect wet triangles and be perpendicular to flow, else Q is zero or wrong-signed."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Peak-discharge magnitude at a gauging cross-section."]
      detrending_options: ["none"]
  - var: "stage (analytical-benchmark centerline)"
    validation_rank: 4
    unit: "m"
    description: "1D centerline stage profile at final time, compared against exact shallow-water solutions (dam-break, parabolic basin, runup)."
    emitted_in: "derived from SWW along the channel centerline"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Validation is against analytical/closed-form solutions (Stoker/Ritter, Carrier-Greenspan, Thacker), not gauge NSE/KGE."
            - "Metrics (NSE, Pearson r, KGE) are computed on the numerical-vs-analytical stage profile at fixed x."
      detrending_options: ["none"]

medium_evidence:
  - var: inundation_extent
    source: dag.yaml
    quote: "Wetting and drying of cells as water advances onto dry land / recedes"
    note: "scope_in declares wet/dry advancement by water over land; inundation_extent thresholds that water depth."
  - var: xmomentum
    source: dag.yaml
    quote: "Water surface elevation (stage) and depth-integrated horizontal momentum over time"
    note: "scope_in declares horizontal momentum as part of the water-surface/depth-integrated hydrodynamic state."
  - var: ymomentum
    source: dag.yaml
    quote: "Water surface elevation (stage) and depth-integrated horizontal momentum over time"
    note: "scope_in declares horizontal momentum as part of the water-surface/depth-integrated hydrodynamic state."
  - var: discharge
    source: SKILL.md
    quote: "**Type:** 2D depth-averaged shallow-water hydrodynamics (finite-volume, unstructured triangular mesh)"
    note: "SKILL.md declares ANUGA's physical medium; discharge is derived from that shallow-water hydrodynamic state."

influence:
  edges:
    - from: "ground elevation / DEM"
      to: "depth"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "flood inundation"
      citations: ["issermann2020_anuga_pem"]
    - from: "ground elevation / DEM"
      to: "inundation_extent"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "flood inundation"
      citations: ["issermann2020_anuga_pem"]
    - from: "Manning's n (friction)"
      to: "depth"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["mungkasi2013_anuga_validation"]
    - from: "mesh resolution (maximum_triangle_area)"
      to: "depth"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "near wetting/drying fronts and shocks"
      citations: ["mungkasi2013_anuga_validation"]
    - from: "numerical flux scheme / flow_algorithm"
      to: "xvelocity"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      applicability: "always"
      citations: ["mungkasi2013_anuga_validation"]
  citation_index:
    issermann2020_anuga_pem:
      short_citation: "Issermann & Chang 2020"
      doi: "10.3390/w12010229"
      note: "Point Estimate Method uncertainty propagation through ANUGA (Glasgow case): DEM/ground-elevation uncertainty dominates the first/second moments of maximal flood inundation depth and extent."
    mungkasi2013_anuga_validation:
      short_citation: "Mungkasi & Roberts 2013"
      doi: "10.1088/1742-6596/423/1/012029"
      note: "Validation of ANUGA against exact shallow-water solutions; depth/velocity accuracy depends on flux scheme, mesh resolution, and variable timestep. Manning-formula friction confirmed but no quantitative ANUGA SA index."

safety:
  hazards:
    - id: "rainfall_rate_units_mm_per_hr_overflood"
      kind: "weather_file_semantic"
      description: "Rainfall passed to Rate_operator in mm/hr or kg/m2/s instead of m/s floods the domain ~1000-3600x too deep; the operator expects m/s."
      severity: "fatal"
    - id: "rainfall_rate_double_divided_no_flood"
      kind: "weather_file_semantic"
      description: "Rainfall already in m/s but divided by 1000 again yields ~1e-8 m/s, producing no flooding at all despite heavy rain."
      severity: "silent"
    - id: "vertical_datum_mismatch_elevation_offset"
      kind: "soil_semantic"
      description: "ANUGA uses raw elevation without datum awareness; DEM (e.g. EGM96 geoid) vs boundary water levels (e.g. WGS84) offset stage by 20-40 m and corrupt flood extent."
      severity: "silent"
    - id: "all_reflective_boundaries_trap_water"
      kind: "control_semantic"
      description: "All boundaries Reflective act as solid walls; the catchment outlet must be Transmissive or Dirichlet, else total volume grows unbounded."
      severity: "degraded"
    - id: "manning_n_too_low_fast_flood_wave"
      kind: "control_semantic"
      description: "Manning's n set to 0.0-0.001 yields unrealistically fast flow; peak discharge arrives too high and too early."
      severity: "degraded"
    - id: "constant_initial_stage_startup_shock"
      kind: "initial_condition_semantic"
      description: "Initial stage set to a constant over varying bed generates a spurious startup shock; dry-bed requires stage=elevation everywhere."
      severity: "degraded"
    - id: "cfl_violation_degenerate_triangles_nan"
      kind: "numerical_instability"
      description: "Tiny or degenerate (thin/long) triangles with deep water force dt toward zero, producing NaN/Inf in stage/momentum or a zero-timestep crash."
      severity: "fatal"
    - id: "wet_dry_checkerboard_oscillation"
      kind: "numerical_instability"
      description: "On coarse meshes or abrupt topography the wetting front oscillates into a checkerboard wet/dry pattern; DE0 is more robust but not immune."
      severity: "degraded"
    - id: "transmissive_boundary_mass_imbalance"
      kind: "control_semantic"
      description: "Oscillating Transmissive boundary depth spuriously injects/removes water, breaking mass conservation by 5-10% on coarse meshes or large yieldsteps."
      severity: "degraded"
    - id: "boundary_tags_wrong_edge_indices"
      kind: "control_semantic"
      description: "boundary_tags mapping tag names to wrong/untagged 0-based polygon edge indices fails domain creation or misapplies boundary conditions."
      severity: "fatal_or_silent"
    - id: "stage_reported_as_depth"
      kind: "parser_semantic"
      description: "Stage (bed + depth) confused with depth gives physically impossible 150-300 m flood depths; depth must be computed as stage - elevation (clipped at 0)."
      severity: "silent"
    - id: "cross_section_orientation_zero_discharge"
      kind: "parser_semantic"
      description: "Cross-section polyline parallel to flow, outside the mesh, or not intersecting wet triangles yields zero or wrong-signed discharge."
      severity: "silent"
  validation_limits:
    - "Depth-averaged: cannot resolve vertical convection, breaking waves, or 3D turbulence."
    - "Inviscid unless a numerical kinematic-viscosity operator is applied; no physical turbulence closure."
    - "Projected-coordinate assumption restricts domains to roughly 1.5 UTM zones."
    - "Physics solver validated against analytical/closed-form solutions (dam-break, Carrier-Greenspan, Thacker), not gauge NSE/KGE as a primary mode."
    - "max_triangle_area too small relative to the domain makes cost (O(N*T/dt)) and memory prohibitive; effective resolution is bounded by tractable triangle count."
  warnings:
    - "Friction is always active: manning_friction_semi_implicit is auto-appended to forcing_terms in Domain.__init__ even when no friction is explicitly configured."
    - "set_flow_algorithm('DE0') silently overrides config defaults (CFL->0.9, beta limiters, minimum_allowed_height, compute_fluxes_method->DE); the effective configuration is algorithm-derived."
    - "balance_deep_and_shallow and protect_against_infinitesimal_and_negative_heights clamp negative heights and redistribute momentum outside the explicit flux step, altering conserved quantities."
    - "Default gravity is g=9.8 m/s^2 (not 9.81), affecting all wave-speed/celerity terms."
  assumptions:
    - statement: "Flow is governed by the 2D depth-averaged nonlinear shallow-water (Saint-Venant) equations with Manning bed friction; horizontal scales are assumed much larger than water depth."
      scope: "all simulations"
      source: "ANUGA background docs (anuga.readthedocs.io/en/latest/background.html) and shallow_water_domain solver"
      status: "adopted"
    - statement: "Mass and momentum are conserved by the Godunov-type finite-volume scheme over triangular cells; the adaptive inner timestep (CFL-constrained), not the user yieldstep, governs stability."
      scope: "numerical closure and timestepping"
      source: "ANUGA evolve docs and generic_domain.evolve timestepping"
      status: "adopted"
    - statement: "DE0 (discontinuous-elevation) is the operative flow algorithm with effective CFL 0.9; elevation is treated as a per-cell evolving quantity under DE methods."
      scope: "numerical configuration"
      source: "set_flow_algorithm('DE0') overrides in ANUGA shallow_water_domain solver (config CFL->0.9, beta limiters, compute_fluxes_method->DE)"
      status: "adopted"
    - statement: "Elevation is interpreted as raw values in the DEM's own vertical datum; the model performs no datum reconciliation, so DEM and boundary water levels are assumed to share one datum."
      scope: "terrain and boundary-stage inputs"
      source: "ANUGA elevation/Quantity handling docs (anuga.readthedocs.io) — model carries no vertical-datum awareness"
      status: "adopted"
