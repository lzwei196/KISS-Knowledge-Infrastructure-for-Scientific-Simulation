        required: true
        example: ""
      - name: "dssat_yield_csv"
        type: "file"
        description: "DSSAT gridded yield CSV"
        required: true
        example: ""
    outputs:
      - name: "comparison_csv"
        type: "file"
        description: "Side-by-side comparison with ensemble mean"
        path_pattern: ""
    preconditions:
      - "Both CSVs have lat/lon/yield columns"
    postconditions:
