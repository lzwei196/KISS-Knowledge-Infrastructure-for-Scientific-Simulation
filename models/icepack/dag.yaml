template_version: "3.5"

identity:
  model_id: "icepack"
  scientific_reference_version: "icepack glacier-flow package (Shapero et al. 2021, GMD 14, 4593-4616, doi:10.5194/gmd-14-4593-2021), version 1.x"
  implementation:
    id: "icepack-firedrake"
    version: "1.1.0"
    provenance: "Python; Daniel Shapero (University of Washington) finite-element glacier-flow library built on Firedrake/PETSc/UFL with pyadjoint/ROL for inverse problems."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "GPL-3.0-or-later"
  repo_url: "https://github.com/icepack/icepack"

boundary:
  scope_in:
    - "Ice momentum balance / velocity diagnostic solve (SSA, SIA, hybrid)"
    - "Ice thickness evolution via mass continuity (prognostic)"
    - "Glen's flow law viscosity and Weertman basal friction"
    - "Hydrostatic surface elevation from thickness and bed"
    - "Mesh generation from glacier outlines and interpolation of gridded rasters onto the FEM mesh"
    - "Parameter inference (ice fluidity, basal friction) via adjoint optimization"
    - "3D enthalpy (heat) transport and continuum-damage transport (optional)"
  scope_out:
    - "Atmospheric / climate forcing (surface mass balance supplied as an input field)"
    - "Subglacial hydrology"
    - "Calving physics beyond the terminus stress term"
    - "Standalone CLI / namelist execution (the Python API is the only interface)"
  spatial: "2-D grid"
  temporal: "annual"
  closure: "mass-balance"
  notes: >
    Domain is an unstructured triangular FEM mesh of a single glacier/ice-shelf
    footprint in a projected CRS (meters, e.g. EPSG:3031); HybridModel uses a
    2D footprint extruded with a vertical dimension. The velocity solve is a
    diagnostic (elliptic) momentum balance with no time integration; only
    thickness is time-integrated, conserving mass via the continuity equation
    (total volume change equals integral of accumulation x dt). Internally the
    package uses a non-SI MPa-meter-year unit system (stress in MPa, time in
    years, velocity in m/yr), not SI.

inputs:
  forcing:
    - category: "surface_mass_balance"
      name: "accumulation"
      unit: "m ice/yr"
      source_kind: "forcing"
      model_input_format: "firedrake.Function (scalar CG) on the mesh"
      notes: "Surface mass-balance source term in the mass-continuity equation; positive = accumulation. If supplied as m w.e./yr it must be scaled by rho_w/rho_i ~= 1.09 to m ice/yr."
  parameters:
    - category: "rheology"
      name: "fluidity (A)"
      unit: "MPa^-3 yr^-1"
      source_kind: "derived"
      model_input_format: "firedrake.Function or Constant"
      notes: "Glen's-law rate factor; normally computed from temperature via icepack.rate_factor(T). Typical 1-100 over T in [-30,0] degC. Can instead be inferred via the inverse problem."
    - category: "rheology"
      name: "temperature (T)"
      unit: "K"
      source_kind: "dataset_lookup"
      model_input_format: "firedrake.Function or Constant"
      notes: "Bulk ice temperature, converted to fluidity A; valid 243-273 K. rate_factor switches Arrhenius branch at 263.15 K (cold Q=60 kJ/mol vs warm Q=139 kJ/mol)."
    - category: "basal_boundary"
      name: "friction (C)"
      unit: "MPa yr^(1/m) m^(-1/m)"
      source_kind: "calibrated"
      model_input_format: "firedrake.Function or Constant"
      notes: "Weertman basal friction coefficient for grounded models; must be non-negative, typical 0.01-0.1. Can be inferred via the inverse problem. m = Weertman exponent (default 3)."
    - category: "geometry"
      name: "bed (b)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "firedrake.Function (scalar CG)"
      notes: "Bed elevation (negative below sea level); used to compute hydrostatic surface for grounded models."
    - category: "rheology"
      name: "Glen flow-law exponent (n)"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "constant (constants.py)"
      notes: "Default n = 3.0."
    - category: "basal_boundary"
      name: "Weertman sliding exponent (m)"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "constant (constants.py)"
      notes: "Default m = 3.0."
  initial_conditions:
    - category: "geometry"
      name: "thickness (h)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "firedrake.Function (scalar CG)"
      notes: "Primary prognostic state; must be > 0 everywhere (min_thickness default 10 m). Negative thickness makes the action functional ill-defined and crashes the Newton solve."
    - category: "velocity"
      name: "velocity initial guess (u)"
      unit: "m/yr"
      source_kind: "dataset_lookup"
      model_input_format: "firedrake.Function (VectorFunctionSpace CG)"
      notes: "Initial guess for the diagnostic solve; using observed velocity as the guess greatly improves Newton convergence."
  boundary_conditions:
    - category: "model_selector"
      name: "model_type"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "selection of IceShelf | IceStream | ShallowIce | HybridModel"
      notes: "Selects the momentum-balance physics (floating SSA, grounded SSA+friction, SIA, or 3D hybrid)."
    - category: "mesh_boundary"
      name: "dirichlet_ids"
      unit: "boundary-id list"
      source_kind: "user_provided"
      model_input_format: "list of mesh boundary segment IDs"
      notes: "Boundary segments where velocity is prescribed (Dirichlet). Must be inflow only; assigning all boundaries forces u=0 everywhere."
    - category: "mesh_boundary"
      name: "side_wall_ids"
      unit: "boundary-id list"
      source_kind: "user_provided"
      model_input_format: "list of mesh boundary segment IDs"
      notes: "Boundary segments with zero normal flow (fjord side walls)."
    - category: "numerics"
      name: "timestep (dt)"
      unit: "yr"
      source_kind: "user_provided"
      model_input_format: "float passed to prognostic_solve"
      notes: "Prognostic timestep, typically 0.01-0.5 yr; CFL-constrained (Courant < 1, dt < dx/max|u|) for Lax-Wendroff stability."
    - category: "mesh"
      name: "glacier_outline"
      unit: "GeoJSON"
      source_kind: "user_provided"
      model_input_format: "GeoJSON FeatureCollection of LineString/MultiLineString with labeled boundary segments"
      notes: "Mesh-generation input; must form a single orientable closed loop with inner features as holes."
    - category: "mesh"
      name: "mesh_resolution (lcar)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "characteristic element length passed to the mesher"
      notes: "~500 m local to ~10 km continental; too small a value explodes element count and OOM-kills meshing."

processes:
  modules:
    - name: "IceShelf"
      role: "driver"
      brief: "Floating-ice diagnostic model; depth-averaged Shallow Shelf Approximation (SSA). Action = viscosity (membrane) + side_friction - gravity (buoyant spreading rho(1-rho_i/rho_w)) - terminus + penalty; no bed interaction."
      applicability: "floating ice shelves"
    - name: "IceStream"
      role: "driver"
      brief: "Grounded fast-flow diagnostic model; SSA plus Weertman basal friction and surface-gradient driving stress. Requires surface elevation."
      applicability: "grounded fast ice / ice streams"
    - name: "ShallowIce"
      role: "driver"
      brief: "Slow grounded interior ice using the Shallow Ice Approximation (SIA); driving stress from local surface slope with (n+2) closure."
      applicability: "slow grounded interior ice"
    - name: "HybridModel"
      role: "driver"
      brief: "Full 3D velocity on an extruded footprint mesh; horizontal membrane stress plus vertical shear (Blatter-Pattyn-style)."
      applicability: "3D hybrid flow regimes"
    - name: "viscosity"
      role: "process_solver"
      brief: "Glen's-law membrane viscous stress / depth-averaged viscous action; rate_factor(T) Arrhenius fluidity (cold/warm branch at 263.15 K), n=3, strain-rate regularization 1e-5/yr."
    - name: "friction"
      role: "process_solver"
      brief: "Weertman basal friction tau = -C|u|^(1/m-1)u plus side-wall and normal-flow penalty terms; sliding exponent m=3."
    - name: "rate_factor"
      role: "process_solver"
      brief: "Arrhenius A = A0*exp(-Q/(R*T)) mapping temperature (K) to Glen's-law fluidity; branches at 263.15 K."
    - name: "compute_surface"
      role: "allocator"
      brief: "Hydrostatic/flotation-consistent surface s = max(h+b, (1-rho_i/rho_w)h) from thickness and bed."
    - name: "Continuity"
      role: "integrator"
      brief: "Conservative mass-continuity flux+source forms (field=thickness, source=accumulation) feeding the prognostic solve."
    - name: "FlowSolver"
      role: "driver"
      brief: "Top-level orchestrator dispatching diagnostic_solve and prognostic_solve; owns the mutable _fields cache and selects diagnostic/prognostic backends."
    - name: "PETScSolver"
      role: "process_solver"
      brief: "Default diagnostic backend; derivative of the action functional assembled into a NonlinearVariationalProblem solved with PETSc SNES (newtonls/nleqerr, gmres, lu/mumps)."
    - name: "LaxWendroff"
      role: "integrator"
      brief: "Default 2nd-order implicit prognostic timestepper for thickness; adds flowline diffusion relative to ImplicitEuler."
    - name: "ImplicitEuler"
      role: "integrator"
      brief: "1st-order backward-Euler prognostic timestepper, more diffusive; retained for backward compatibility."
    - name: "HeatTransport3D"
      role: "optional_module"
      brief: "3D enthalpy advection-diffusion recovering temperature and meltwater fraction; surface_exchange_coefficient default 9."
      applicability: "when heat transport is solved (extruded/3D)"
    - name: "DamageTransport"
      role: "optional_module"
      brief: "Scalar continuum-damage advection built on the generic transport equation."
      applicability: "when damage mechanics enabled"
    - name: "icepack.meshing"
      role: "process_solver"
      brief: "GeoJSON outline -> triangular FEM mesh via gmsh/Triangle/pygmsh; normalize() flattens, snaps, reorients, and reorders the outline."
    - name: "icepack.interpolate"
      role: "process_solver"
      brief: "Gridded raster -> FEM function space via scipy RegularGridInterpolator."
    - name: "icepack.statistics"
      role: "optional_module"
      brief: "Inverse problem: StatisticsProblem + MaximumProbabilityEstimator; adjoint-based optimization (ROL/pyadjoint, trust-region/BFGS) minimizing data misfit + smoothness regularization."
      applicability: "parameter inference runs"
  internal_edges:
    - from: "Inputs"
      to: "icepack.meshing"
      kind: "consumes_input"
      brief: "GeoJSON glacier outline triangulated into the FEM mesh."
    - from: "Inputs"
      to: "icepack.interpolate"
      kind: "consumes_input"
      brief: "Gridded rasters (velocity, thickness, bed) interpolated onto the mesh function spaces."
    - from: "rate_factor"
      to: "fluidity A"
      kind: "writes_state"
      brief: "Temperature (K) mapped to Arrhenius fluidity, branch at 263.15 K."
    - from: "fluidity A"
      to: "viscosity"
      kind: "reads_state"
      brief: "Fluidity enters the membrane viscous stress."
    - from: "viscosity"
      to: "IceShelf"
      kind: "invokes"
      brief: "Viscous term assembled into the shelf action functional."
    - from: "viscosity"
      to: "IceStream"
      kind: "invokes"
      brief: "Viscous term assembled into the stream action functional."
    - from: "friction"
      to: "IceStream"
      kind: "invokes"
      brief: "Basal friction term in the grounded stream action."
    - from: "friction"
      to: "IceShelf"
      kind: "invokes"
      brief: "Side-wall friction term in the shelf action."
    - from: "thickness h"
      to: "IceShelf"
      kind: "reads_state"
      brief: "Buoyant driving stress ~ rho(1-rho_i/rho_w) grad h^2."
    - from: "surface s"
      to: "IceStream"
      kind: "reads_state"
      brief: "Grounded gravitational driving stress ~ rho_i g h grad s."
    - from: "thickness h"
      to: "ShallowIce"
      kind: "reads_state"
      brief: "SIA driving stress derives from the local surface slope set by thickness over bed."
    - from: "viscosity"
      to: "HybridModel"
      kind: "invokes"
      brief: "Depth-resolved viscous term assembled into the 3D hybrid action functional."
    - from: "Inputs"
      to: "compute_surface"
      kind: "consumes_input"
      brief: "Bed elevation (bathymetry) sets grounded vs floating in the surface computation."
    - from: "thickness h"
      to: "compute_surface"
      kind: "reads_state"
      brief: "Surface recomputed each step from current thickness."
    - from: "compute_surface"
      to: "surface s"
      kind: "writes_state"
      brief: "s = max(h+b, flotation)."
    - from: "IceShelf"
      to: "PETScSolver"
      kind: "invokes"
      brief: "F = derivative(action, u) handed to the SNES nonlinear solve."
    - from: "IceStream"
      to: "PETScSolver"
      kind: "invokes"
      brief: "Stream action differentiated and solved for velocity."
    - from: "ShallowIce"
      to: "PETScSolver"
      kind: "invokes"
      brief: "SIA action differentiated and handed to the SNES diagnostic solve."
    - from: "HybridModel"
      to: "PETScSolver"
      kind: "invokes"
      brief: "3D hybrid action differentiated and handed to the SNES diagnostic solve."
    - from: "FlowSolver"
      to: "PETScSolver"
      kind: "invokes"
      brief: "diagnostic_solve dispatches to the default PETSc backend."
    - from: "PETScSolver"
      to: "velocity u"
      kind: "writes_state"
      brief: "diagnostic_solve returns the solved velocity into _fields."
    - from: "FlowSolver"
      to: "LaxWendroff"
      kind: "invokes"
      brief: "prognostic_solve dispatches to the default Lax-Wendroff timestepper."
    - from: "velocity u"
      to: "Continuity"
      kind: "reads_state"
      brief: "Advective thickness flux uses the diagnostic velocity."
    - from: "Inputs"
      to: "Continuity"
      kind: "consumes_input"
      brief: "Surface mass-balance (accumulation) source term."
    - from: "Continuity"
      to: "LaxWendroff"
      kind: "invokes"
      brief: "Flux + source forms assembled into the prognostic residual."
    - from: "LaxWendroff"
      to: "thickness h"
      kind: "writes_state"
      brief: "Advances thickness by dt and returns the updated field."
    - from: "velocity u"
      to: "Outputs"
      kind: "produces_output"
      brief: "Solved velocity field emitted to post-processing."
    - from: "thickness h"
      to: "Outputs"
      kind: "produces_output"
      brief: "Updated thickness emitted after each prognostic step."
    - from: "velocity u"
      to: "icepack.statistics"
      kind: "invokes"
      brief: "Forward diagnostic solve embedded in the inverse-problem simulation function."
    - from: "icepack.statistics"
      to: "fluidity A"
      kind: "writes_state"
      brief: "Inverse problem infers fluidity by minimizing model-data velocity misfit."
    - from: "icepack.statistics"
      to: "friction"
      kind: "writes_state"
      brief: "Inverse problem can instead infer the basal friction field."

states:
  variables:
    - name: "velocity u"
      unit: "m/yr"
      role: "diagnostic"
    - name: "thickness h"
      unit: "m"
      role: "prognostic"
    - name: "surface s"
      unit: "m"
      role: "diagnostic"
    - name: "fluidity A"
      unit: "MPa^-3 yr^-1"
      role: "diagnostic"
    - name: "energy_density E"
      unit: "MPa/m^3"
      role: "prognostic"
    - name: "damage D"
      unit: "dimensionless"
      role: "prognostic"
    - name: "thickness_old h_0"
      unit: "m"
      role: "prognostic"
  provenance: "populated"

outputs:
  - var: "velocity"
    validation_rank: 1
    unit: "m/yr"
    description: "Solved depth-averaged (or 3D) ice velocity field satisfying the momentum balance; typical 0-4000 m/yr for Antarctic ice streams."
    emitted_in: "diagnostic_solve return (firedrake.Function); time series exported to CSV by post-processing"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Compare against gridded surface-velocity products (e.g. InSAR-derived) reprojected to the model CRS; remap FEM field to the obs grid first."
            - "Diagnostic velocity reflects the prescribed geometry/material fields; mismatch may indicate fluidity/friction error rather than dynamics error."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "At GPS/station points; transient signal arises only through the coupled prognostic loop."
      detrending_options: ["none"]
  - var: "thickness"
    validation_rank: 2
    unit: "m"
    description: "Ice thickness after a prognostic time step, evolved by mass continuity; must remain > 0."
    emitted_in: "prognostic_solve return (firedrake.Function); time series exported to CSV"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Compare against radar/altimetry thickness products (e.g. BedMachine) on the model footprint."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Thickness-change time series; sensitive to dt/CFL stability and the accumulation forcing."
      detrending_options: ["none", "first_difference"]
  - var: "surface"
    validation_rank: 3
    unit: "m"
    description: "Hydrostatic-consistent surface elevation recomputed from updated thickness and bed for grounded models."
    emitted_in: "compute_surface return (firedrake.Function)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Compare against surface DEMs; derived deterministically from thickness+bed, so it inherits those fields' errors."
      detrending_options: ["none"]
  - var: "optimized_control"
    validation_rank: 4
    unit: "varies (A in MPa^-3 yr^-1, or C in Weertman units)"
    description: "Best-fit fluidity or basal-friction field inferred from observed velocity via the inverse problem."
    emitted_in: "icepack.statistics MaximumProbabilityEstimator result"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "An inferred (not directly observed) field; verify via the simulated-velocity misfit, not by direct comparison to a control 'truth'."
            - "Regularization weight controls smoothness: too large yields a near-uniform field, too small overfits noise."
      detrending_options: ["none"]
  - var: "simulated_velocity"
    validation_rank: 5
    unit: "m/yr"
    description: "Model velocity at the inverse-problem optimum, for comparison against the observed velocity used in inversion."
    emitted_in: "icepack.statistics simulation at optimum"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Misfit here is the inverse-problem objective itself; near-zero misfit can indicate overfitting if regularization is too weak."
      detrending_options: ["none"]

influence:
  edges: []
  citation_index: {}
  _reason: >
    No sensitivity literature was found for the Shapero glacier-flow icepack
    (Firedrake FEM package) that this dag describes. The lit_reader stream
    returned CICE/Icepack SEA-ICE column-physics sensitivity studies
    (Hunke 2010; Urrego-Blanco 2016; Driscoll 2024; Kochanski 2020;
    Miller 2006) for an UNRELATED model that merely shares the name
    'Icepack'; those snow-conductivity / melt-pond / ridging / sea-ice-albedo
    sensitivities are NOT applicable to a glacier momentum/mass-transport
    model and are deliberately excluded. Edges left empty pending
    glacier-icepack-specific sensitivity literature.

safety:
  hazards:
    - id: "velocity_units_ms_not_myr"
      kind: "weather_file_semantic"
      description: "Velocity left in m/s instead of m/yr yields ~1e-8 m/yr; solver converges but flow is negligibly small."
      severity: "silent"
    - id: "velocity_double_converted"
      kind: "weather_file_semantic"
      description: "Velocity already in m/yr double-converted (>1e8 m/yr) diverges immediately with ConvergenceError."
      severity: "fatal"
    - id: "temperature_celsius_not_kelvin"
      kind: "coefficient_runtime_silent_fallback"
      description: "Temperature passed in Celsius not Kelvin to rate_factor() corrupts the Arrhenius rate factor; ice becomes rigid or inviscid."
      severity: "silent"
    - id: "thickness_km_not_m"
      kind: "soil_semantic"
      description: "Thickness in km instead of meters gives ~0.5 m where hundreds of meters are expected; silent thin-ice behavior."
      severity: "silent"
    - id: "fluidity_SI_not_MPa_yr"
      kind: "coefficient_runtime_silent_fallback"
      description: "Fluidity A computed in SI (Pa^-3 s^-1) rather than icepack's MPa^-3 yr^-1 is off by ~1e60, giving unphysical velocities; always use rate_factor(T)."
      severity: "silent"
    - id: "negative_thickness_or_friction"
      kind: "initial_condition_semantic"
      description: "Negative thickness or friction makes the action functional ill-defined; Newton solve raises 'invalid search direction'."
      severity: "fatal"
    - id: "poor_initial_velocity_guess"
      kind: "numerical_instability"
      description: "Poor or zero initial velocity guess causes 'Newton search did not converge after 50 iterations'; use observed velocity as the guess."
      severity: "fatal"
    - id: "inconsistent_bc_extreme_AC"
      kind: "control_semantic"
      description: "Inconsistent boundary conditions or extreme fluidity/friction fields cause PETSc DIVERGED_LINE_SEARCH."
      severity: "fatal"
    - id: "missing_surface_zero_driving_stress"
      kind: "control_semantic"
      description: "Omitting the 'surface' argument to a grounded (IceStream) solve zeros the driving stress rho*g*h*grad(s), silently yielding u=0."
      severity: "silent"
    - id: "courant_too_large_negative_thickness"
      kind: "numerical_instability"
      description: "Timestep dt too large (Courant > 1) makes Lax-Wendroff unstable, driving thickness negative and violating mass conservation."
      severity: "silent"
    - id: "raster_nan_outside_extent"
      kind: "weather_file_semantic"
      description: "Raster not covering the full mesh extent yields NaN interpolated fields and a 'nan in residual' solver crash."
      severity: "fatal"
    - id: "crs_mismatch_constant_field"
      kind: "weather_file_semantic"
      description: "CRS mismatch between mesh and raster (e.g. EPSG:3031 vs EPSG:4326) gives silently constant/zero interpolated fields."
      severity: "silent"
    - id: "geojson_not_orientable"
      kind: "parser_semantic"
      description: "Non-orientable or non-enclosing GeoJSON outline crashes meshing ('Input collection is not orientable' / 'No polygon contains all other polygons')."
      severity: "fatal"
    - id: "lcar_too_small_oom_meshing"
      kind: "numerical_instability"
      description: "mesh_resolution (lcar) too small for the domain explodes the triangle count (~(L/lcar)^2) and OOM-kills mesh generation (process Killed); estimate the element count or start at lcar = domain_size/100 (dt_010)."
      severity: "fatal"
    - id: "all_dirichlet_zero_flow"
      kind: "control_semantic"
      description: "Assigning all boundaries to dirichlet_ids with zero-velocity BC (no free Neumann ice front) silently forces u=0 everywhere."
      severity: "silent"
    - id: "dirichlet_on_outflow_reversed_flow"
      kind: "control_semantic"
      description: "Dirichlet BC applied to an outflow rather than inflow boundary silently reverses the flow direction."
      severity: "silent"
    - id: "inverse_regularization_too_strong"
      kind: "control_semantic"
      description: "Inverse-problem regularization weight too large suppresses spatial variability, returning a near-uniform parameter field with poor data fit."
      severity: "degraded"
  validation_limits:
    - "Diagnostic velocity solve is not time-integrated; only thickness is prognostic. Transients in velocity arise only through the coupled diagnostic-prognostic loop."
    - "Requires a projected CRS in meters; geographic lat/lon meshes give ~1-degree element sizes and the solver fails."
    - "Single-glacier footprint scope; no atmospheric/climate forcing (accumulation is an externally supplied field) and no subglacial hydrology or full calving physics."
    - "Inverse problem requires firedrake adjoint annotation to be enabled (firedrake.adjoint.continue_annotation()); otherwise the adjoint fails silently."
  warnings:
    - "Surface mass balance supplied as m w.e./yr must be converted to m ice/yr (x rho_w/rho_i ~= 1.09) before the prognostic solve."
    - "rate_factor switches Arrhenius branch at 263.15 K (-10 degC); temperatures must be within 243-273 K for physically meaningful fluidity."
    - "Lax-Wendroff (default) adds streamline diffusion relative to ImplicitEuler; the timestepper choice affects results, not just stability."
    - "FlowSolver caches passed fields in a mutable _fields dict and only re-assigns known field names on subsequent solves; passing a new field name on a re-solve silently has no effect."
  assumptions:
    - statement: "The model uses an internal MPa-meter-year (non-SI) unit system; all inputs must be converted to these units before entering the solver."
      scope: "all velocity, stress, fluidity, density, gravity, and time quantities"
      source: "icepack constants.py and Shapero et al. 2021 (GMD 14, 4593-4616)"
      status: "adopted"
    - statement: "Geometry is a 2-D depth-averaged FEM problem (extruded to 3D only for HybridModel); the velocity solve is a diagnostic elliptic momentum balance, not a time-integrated state."
      scope: "IceShelf / IceStream / ShallowIce momentum solve"
      source: "icepack model module structure (ice_shelf.py, ice_stream.py, shallow_ice.py) and docs s4 diagnostic solve"
      status: "adopted"
    - statement: "Mass-balance closure applies to thickness (water/ice volume conservation via the continuity equation); there is no surface energy-balance closure in the flow solve, and heat/damage transport are optional add-ons."
      scope: "prognostic thickness evolution"
      source: "icepack transport.py / Continuity forms and docs s5 prognostic solve"
      status: "adopted"
    - statement: "Surface elevation is derived hydrostatically (s = max(h+b, (1-rho_i/rho_w)h)) and is not an independent input for grounded models."
      scope: "IceStream / ShallowIce / HybridModel"
      source: "icepack.compute_surface (utilities.py) and docs s4"
      status: "adopted"
