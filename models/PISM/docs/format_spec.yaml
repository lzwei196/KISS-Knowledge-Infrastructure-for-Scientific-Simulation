    SWE, seasonal snowpack, streamflow at a gauge). The metric is structurally UNCOMPUTABLE, not merely
    wrong-valued.

    '
  diagnosis: 'Wrong-variable / wrong-model case assignment. PISM''s declared outputs (dag.yaml outputs[])
    are ice-sheet state ONLY: thk, usurf, velsurf_mag, velbase_mag, mask, ice_volume_glacierized, tendency_of_ice_mass(+_due_to_discharge),
    tillwat, temppabase. There is NO SWE / seasonal-snowpack / discharge outp'
  remedy: 'Do NOT enter the retry loop. Report STRUCTURAL_MISMATCH with metric = null and the reason.
    Re-route SWE@<site> to a snow/hydrology model. For a PISM-VALID test at the same site, compare a declared
    output instead: thk (spatial_snapshot vs a glacier-thickness product) or ice_volume_glacierized (region'
  severity: structural
- id: dt_022
  symptom: 'A snow/hydrology observable (snow_water_equivalent, snowmelt) is requested of PISM and appears
    valid because docs/format_spec.yaml listed it under outputs[], yet the run yields metric=null / ''Variable
    not found''.

    '
  diagnosis: docs/format_spec.yaml outputs[] advertised observables (snow_water_equivalent, snowmelt)
    that are NOT in the authoritative dag.yaml outputs[] and cannot be physically emitted by an ice-sheet-dynamics
    model. The spec drifted out of sync with the dag observability contract, causing wrong-variable case
  remedy: 'Keep docs/format_spec.yaml outputs[] a strict subset of dag.yaml outputs[]; remove non-emittable
    snow observables. Route SWE/snowmelt requests to snow/ hydrology models (CRHM/SUMMA/SNOWPACK/SnowModel/VIC).
    See dt_021 for the structural-mismatch handling.

    '
- id: dt_023
  symptom: 'Bootstrapping PISM from a real ice-geometry product (BedMachine Greenland/ Antarctica) crashes
    or refuses to run. Three distinct failures appear in sequence: (1) signal 6/SIGSEGV during context/Time
    init with an HDF5 ''header (1.10.10) vs library (1.14.3) version mismatched'' banner; (2) ''PISM ERROR: '
  diagnosis: (1) This PISM build links an HDF5 whose compile-time headers disagree with the runtime library,
    so NetCDF4 (HDF5-backed) input reads corrupt/segfault. (2) The build has NO PROJ (-version shows no
    PROJ line), yet PISM by default recomputes lon/lat from the projection at bootstrap. (3) BedMachine
    stor
  remedy: 'In convert_geometry.py: write NETCDF3_64BIT_OFFSET (default now), block-mean coarsen 150 m
    BedMachine to a runnable grid (--coarsen N), flip descending axes to strictly increasing, and optionally
    inject constant climate (--const-smb, --const-ice-temp) so a self-contained `-surface given` run needs
    n'
  severity: fatal
- id: dt_024
  symptom: 'Validating PISM surface speed (velsurf_mag) against a gridded velocity mosaic (MEaSUREs Antarctica/Greenland
    ice velocity, spatial_snapshot) gives a near-zero or NEGATIVE raw Pearson r (e.g. -0.02) even though
    the model clearly puts fast flow on the right outlets. Two confounders: (1) velsurf spans '
  diagnosis: (a) The dag declares velsurf_mag determining_metric=csi with an explicit caveat that fast
    flow spans orders of magnitude and "log-space or rank metrics [are] often more informative" — RAW
    Pearson r is the wrong metric family for this obs_shape. (b) PISM 2.3 retired the `-topg_to_phi LIST`
    option; th
  remedy: Score velsurf_mag in LOG10 space (and report rank/Spearman + log-space r), not raw Pearson.
    Exclude non-converged cells (model speed >> regional obs max, e.g. >3000 m/yr) as numerical artifacts
    and log the excluded count. Run hybrid ssa+sia with the shelf preserved (-pik -ocean constant), a
    bed-keye
  severity: degraded
