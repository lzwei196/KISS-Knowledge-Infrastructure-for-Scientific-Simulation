  cross_references:
  - dt_003
- id: dt_021
  stage: s5_execution
  failure_domain: silent_error
  symptom:
    description: 'Water-balance check FAILs with a 5-10% residual (here 8.3%, ~100 mm/yr) EVEN ON a run
      with excellent skill (NSE 0.73, r 0.86, KGE 0.82, PBIAS -1.3%). Units are clean (runoff coef < 1).
      Residual was wrongly blamed on "Netroute routing-storage (gwKstorage/gwLag have no output state)".

      '
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'Netroute groundwater cascade diverts gw discharge to a SINK. With gwwhereto = 3 3 0,
      gw_flow from Soil enters Netroute (gwcumdiverted in crhmRun.log ~= the entire residual, 1225 mm
      here) but never reaches the outlet: gwcumoutflow = 0 and basin gw outflow (basingw) ~= 0, while
      basinflow (the simulated Q) carries only surface+ssr. The diverted groundwater (~100 mm/yr) is dropped.
      The run still matches observed Q only because precip was inflated (here x1.52) so surface runoff
      alone reproduces discharge -- gw loss and precip inflation are COMPENSATING ERRORS. NOT a routing-reservoir-storage
      artifact: terminal *Delay_in_storage in crhmRun.log is only ~50 mm. NOT missing Sd (11 mm) or sublimation
      (Subl=0, intcp_evap=0, ebsm cumQe_subl=0).

      '
    explanation: 'Verified on Kaslo 08NH005 by outputting hru_p/Sd/intcp_evap/Subl and parsing crhmRun.log
      Netroute/Soil/ebsm/crack cumulative reports. Closure terms (basin-mm over 2005-2015): P(hru_p)=14590,
      ET(hru_actet)=3077, Q(basinflow)=9826, dS(SWE+soil_moist+soil_rechr+gw+Sd)=500, routing_storage=52
      -> residual 1135. gwcumdiverted=1225 ~= residual.

      '
    affected_components:
    - Netroute gwwhereto / whereto cascade (create_prj_file.py, derive_parameters.py)
    - water-balance accounting (was hand-rolled; now check_water_balance.py)
    - precip scaling (build_obs --precip_scale)
  remedy:
    action: '(1) Use tools/s5_execution/check_water_balance.py to compute a closed balance from model
      output (hru_p for P, ALL storage states incl Sd, and terminal routing storage from crhmRun.log)
      and to read gwcumdiverted -- it diagnoses the gw-sink leak instead of guessing. (2) The leak itself
      is a CALIBRATION coupling: routing gw to the outlet (so it joins basinflow) AND reducing precip_scale
      must be done together, or discharge skill regresses. Do NOT change gwwhereto alone -- it breaks
      the Q match.

      '
    tool_to_run: check_water_balance.py
    manual_steps:
    - 'Output complete WB set in .prj Display_Variable: obs hru_p; evap hru_actet; Netroute basinflow;
      pbsm SWE; Soil soil_moist soil_rechr gw Sd'
    - Run check_water_balance.py --csv parsed/crhm_results.csv --hru_area <km2 list> --log crhmRun.log
    - If residual ~= gwcumdiverted (crhmRun.log), groundwater is being diverted to a sink
    prevention: 'Treat a clean-units WB FAIL on a high-skill run as a gw-routing/precip compensating-error
      pair, not a unit bug or a storage artifact.

      '
  severity: degraded
  verified: 2026-06-08 (Kaslo 08NH005)
  cross_references:
  - dt_010
  - dt_015
- id: dt_022
  symptom:
    description: Self-improve/verifier reports water_balance FAIL (5-10% residual) on a CRHM run with
      excellent discharge skill (r>=0.8, NSE>0.6, PBIAS<2%), but the WB check was run with the generic
      ki_tools_common.validation.validate_water_balance.
  diagnosis:
    root_cause: The generic validator uses a 50mm absolute / annual-calibrated tolerance and is blind
      to terminal Netroute routing-reservoir storage (*Delay_in_storage), so it false-FAILs decadal cold-regions
      runs whose residual is unobserved routing storage. It also cannot distinguish this benign artifact
      from a gwwhereto gw-sink leak.
  remedy:
    action: Validate CRHM water balance with tools/s5_execution/check_water_balance.py (--csv parsed/crhm_results.csv
      --hru_area <km2 list> --log crhmRun.log), which folds terminal *Delay_in_storage routing storage
      into dS and reads gwcumdiverted to flag gw-sink leaks. Do not retry the model on a generic-validator
      WB FAIL when r>=0.5 and units are clean.
  format_spec_violated: none (KI-local verification-routing gap)
  canonical_intent: ki_local_if_pass
  added_by_run: CRHM_retry1
- id: dt_023
  symptom:
    description: Every parameter configuration scores NSE ~= -1.0 with PBIAS ~= -100%; simulated basin
      discharge is basin-area-fold too small (e.g. 9908 km2 Heihe basin gave basinflow ~0.035 m3/s vs
      obs ~60 m3/s, ~1700x under). Per-HRU outputs (SWE, hru_t, soil_moist) are IDENTICAL across elevation
      bands despite different hru_elev, and water "vanishes" in the water balance (P - ET - Q - dS >>
      0) because upstream re-infiltration + ET consume the unrouted trickle.
    error_pattern: NSE -1\.0|PBIAS -99|basinflow.*(too small|near zero)|identical.*(HRU|band)
  diagnosis:
    root_cause: The .prj declared basin geometry as "basin hru_area"/"basin hru_elev" etc. CRHM resolves
      each module's parameters as "<Module> <param>" FIRST, then "Shared <param>" (ClassModule.cpp declparam
      readNC) -- a "basin hru_area" line is visible ONLY to the basin module. Netroute silently falls
      back to its default hru_area=[1] km2, so runinflow = soil_runoff * 1 instead of * (real km2), and
      the obs module never sees hru_elev, so no lapse-rate elevation banding is applied. Both shipped
      examples (crhmcode/prj/badlake.prj, in the CRHM SOURCE tree, not in the KI) and every validated basin .prj declare basin_area, hru_area, hru_elev,
      hru_lat, hru_GSL, hru_ASL under "Shared".
  remedy:
    action: create_prj_file.py now emits all "basin"-module geometry params with the "Shared" prefix (and
      writes the true summed basin_area, not the 100.0 default). If you see this symptom on a hand-built
      .prj, move basin_area/hru_area/hru_elev/ hru_lat/hru_GSL/hru_ASL into a Shared declaration.
    tool_to_run: tools/s4_parameter_config/create_prj_file.py
    prevention: Quick check on any .prj -- "grep 'Shared hru_area'" must hit; verify Netroute uses real
      areas by confirming runinflow ~= soil_runoff * hru_area_km2 in a flux-diagnostic run.
  format_spec_violated: CRHM .prj parameter namespacing (Shared vs module-local)
  canonical_intent: canonical
  severity: fatal
  verified: 2026-07-23 (Yingluoxia/upper Heihe 01521400; CAL NSE -1.0 -> 0.38 on first fixed un-tuned
    trial)
  added_by_run: CRHM_real_case_20260723
- id: dt_024
  symptom:
    description: run_crhm.py validate_outputs (or parse_crhm_output.py) crashes with UnicodeDecodeError
      "'utf-8' codec can't decode byte 0xba" as soon as the output variable list includes an air-temperature
      variable (obs hru_t).
    error_pattern: UnicodeDecodeError.*0xba|invalid start byte
  diagnosis:
    root_cause: CRHM writes the units header row with a Latin-1 masculine-ordinal degree sign for temperature
      ("(\xBAC)", byte 0xBA), which a strict-UTF-8 Python open() cannot decode. Runs whose Display_Variable
      set contains no temperature column never hit it, so the trap looks intermittent.
  remedy:
    action: Both tools now open CRHM output with encoding="utf-8", errors="replace".
    tool_to_run: tools/s5_execution/run_crhm.py
    prevention: Any new reader of raw CRHM output.txt must use errors="replace".
  format_spec_violated: none (CRHM writes non-UTF-8 output)
  canonical_intent: canonical
  severity: blocking
  verified: 2026-07-23 (Yingluoxia flux-diagnostic run)
  added_by_run: CRHM_real_case_20260723
- id: dt_v006
  symptom:
    description: 'CRHM prints its banner (Project file / Time of model run / Program Version 4.7_16) and
      then dies with a SEGMENTATION FAULT ("core dumped"), leaving a header-only output file (~70 bytes:
      the time+variable row and the units row, no data). No missing-variable error is reported. Seen when
      a canopy module (intcp / CRHMCanopy / CRHMCanopyClearing) is dropped from the chain - the natural
      thing to try on treeless prairie, steppe or tundra, where interception is physically nil.'
    error_pattern: Segmentation fault|core dumped|output file contains only the header rows after a run
      that printed the banner
  diagnosis:
    root_cause: 'pbsm/PBSM, albedo, ebsm, netall and crack all declgetvar the CANOPY-ADJUSTED precipitation
      net_rain / net_snow, which is declared ONLY by a canopy module. With no canopy module in the chain
      the variable is never declared and CRHM dereferences the unresolved pointer instead of raising -
      the same class of failure as the wildcard-SWE crash in dt_v002. "Treeless landscape therefore no
      canopy module" is the wrong inference: intcp is the net-precipitation PROVIDER, not merely a forest
      process.'
  remedy:
    action: Keep intcp in the chain for open landscapes too. With a short canopy (Ht ~0.3 m, no LAI) it
      passes precipitation through essentially untouched, and it is exactly what every validated .prj
      in SKILL.md does. select_modules.py now FAILS CLOSED on any chain that has a net_rain/net_snow consumer
      and no canopy provider, instead of emitting a chain that core-dumps inside a detached run.
    tool_to_run: tools/s3_module_selection/select_modules.py
    prevention: Use the 'prairie_reduced' preset for flat/open cold domains - it is the validated 13-module
      chain. Never hand-assemble a chain without re-running select_modules.py validate_chain.
  format_spec_violated: CRHM module dependency contract (declvar/declgetvar)
  canonical_intent: canonical
  severity: fatal
  verified: 2026-07-25 (Hulunbuir steppe SWE case; chain basin>global>obs>calcsun>pbsm>albedo>ebsm>netall>crack>evap>Soil>Netroute
    core-dumped with a 70-byte output; the same chain WITH intcp ran a full year cleanly)
  added_by_run: CRHM_real_case_20260725_hulunbuir
- id: dt_025
  stage: s2_observation_data
  failure_domain: silent_error
  symptom:
    description: 'CRHM is scored against a satellite (passive-microwave) SWE product and NSE sits near
      0.3-0.4 while r is 0.75-0.80 and PBIAS is near zero. Raising the score seems to require cutting
      ClimChng_precip below 1.0 and/or lifting obs_elev well above the forcing source elevation. Nothing
      errors.

      '
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Daily passive-microwave SWE scored as truth in a shallow-snow regime; forcing knobs then
      bent to absorb the retrieval error
    explanation: 'PMW SWE retrievals carry error comparable to the whole signal where snow is shallow,
      and their day-to-day variability is brightness-temperature noise, not snow mass. At Hulunbuir (obs
      mean 12.3 mm, max 42.0 mm) 4.3 percent of DJF obs days violate the forcing-implied mass budget outright
      -- +19.7 mm/d with 0.02 mm of precipitation at Tmax -21.8 C, reversed the next day by -19.6 mm/d
      at -20.2 C. The model cannot and must not reproduce that. Diagnostic separation: corr(water-year
      cold-season P(T<0), sim peak SWE) = 0.910 while corr(same snowfall, obs peak SWE) = 0.602, i.e.
      the simulated snowpack tracks its forcing better than the retrieval tracks the region precipitation.
      The damage comes next: because SWE is a MASS STATE, ClimChng_precip and obs_elev write the scored
      quantity directly, so tuning them lifts NSE from -0.70 to 0.35 while silently falsifying the forcing
      (a 20 percent precipitation cut and every HRU warmed ~1 C). This is the compensating-errors calibration
      hazard in dag.yaml.

      '
    affected_components:
    - obs selection / model_obs_map
    - obs module ClimChng_precip, obs_elev
    - scoring temporal aggregation
  remedy:
    action: Screen the SWE obs for mass consistency, score at the aggregation it supports, and lock the
      forcing knobs
    tool_to_run: screen_swe_obs
    manual_steps:
    - Run tools/s2_observation_data/screen_swe_obs.py --obs_csv <swe.csv> --forcing_obs <obs/*.obs>
    - 'If mass_inconsistent_pct > 2: daily scoring is INADMISSIBLE -- report monthly-mean NSE/KGE/r/PBIAS
      plus peak-SWE and snow-season mean. Hulunbuir reference values at LOCKED knobs (held out 2009-2014):
      monthly NSE -0.488 / KGE 0.065 / r 0.828 / PBIAS +59.9 (n=47 months); daily NSE -0.680 / r 0.781
      (diagnostic only). The earlier "daily 0.36 -> monthly 0.50" figures came from the FORBIDDEN swept
      configuration -- do not reproduce them.'
    - Set ClimChng_precip = 1.0 and obs_elev = the derive_parameters.py forcing-source elevation, and
      leave them there for the whole SWE run
    - Report any remaining large bias as an unresolved forcing-vs-retrieval attribution needing in-situ
      snow depth -- do NOT tune it away
    prevention: Never sweep obs_elev or ClimChng_precip when the scored variable is a mass state; those
      are discharge-timing knobs only
  severity: silent
  cross_references:
  - dt_016
  - dt_021
- id: dt_v008
  symptom:
    description: 'Run is scientifically ACCEPTED but the recorded metric stays provisional / evidence_level=series_only:
      the reported held-out number cannot be re-derived from any series in the run archive.'
    error_pattern: 'evidence_level: series_only|best candidate recomputes .* vs recorded|distinct series
      reproduce the metric - link is ambiguous|no paired obs/sim series in the archive'
    detection_method: log_match
  diagnosis:
    root_cause: Reported metric and dumped headline series came from different scoring calls, in a manifest
      flooded with calibration-trial headline candidates
    explanation: 'Two independent record defects, both seen together on CRHM Hulunbuir run 885e6696. (1)
      HEADLINE MISMATCH -- the reported number and the dumped headline series came from different scoring
      calls. Here the archive held the swept DAILY series (NSE 0.350) while the value that survived review
      was the locked-knob MONTHLY score (NSE -0.488), because the corrected protocol lived in a separate
      retest script instead of the runner, so the run that produced the number and the run that produced
      the evidence were not the same run. (2) TRIAL FLOODING -- every parameter-search evaluation was
      scored through the shared scorer at its default headline_candidate=True, leaving 22 cal_trial dumps
      marked as headline candidates in _series/manifest.jsonl, so the real headline could not be bound
      unambiguously. Neither defect touches the physics: the model was fine (r 0.83) and the run was still
      untrustable.

      '
    affected_components:
    - runner scoring block / all_metrics label and meta
    - ki_tools_common.metrics dump manifest (_series/manifest.jsonl)
    - record layer binding (record_evidence.build_evidence)
  remedy:
    action: One protocol, one run, one headline dump -- and assert the reproduction before writing the
      result
    tool_to_run: null
    manual_steps:
    - 'Wire the corrective protocol INTO the runner (here: screen_swe_obs.py decides both the scoring
      aggregation and the knob lock) instead of leaving it in a side script, so the reported number and
      the dumped evidence are produced by the same execution'
    - Emit exactly ONE all_metrics(..., label="headline") call, on the held-out frame, at the protocol
      aggregation, dumped LAST; report ITS values as metrics.nse/r/kge/pbias
    - 'Score every calibration trial with meta={"headline_candidate": False} (dump_scored_series reads
      the key straight out of meta -- no scorer change needed); under a knob lock, skip the sweep entirely
      so the count is zero'
    - 'Before writing result.json: re-read the dumped headline CSV, recompute the metric with ki_tools_common.metrics.nse,
      and RAISE if it differs; also assert exactly one dump carries the "headline" label and no cal_trial
      dump is a headline candidate'
    - Put scored_series.paths[0] = the headline CSV, inside the run archive
    prevention: Treat the record contract as part of the run, not as reporting -- a number that cannot
      re-derive from its own dumped series is not a result, however good the model is
  severity: silent
  stage: s5_execution
  failure_domain: silent_error
  cross_references:
  - dt_025
- id: dt_v009
  symptom:
    description: 'Detached runner exits with returncode -11 (SIGSEGV) AFTER it has already logged "WROTE
      result.json": result.json is complete and valid, every scored_series CSV is on disk, but the launcher
      records the run as crashed and the result is discarded. No Python traceback is printed -- the crash
      is after main() returned.'
    error_pattern: '"returncode": -11|rc=-11 after WROTE|Segmentation fault.*(python|python3)$'
    detection_method: log_match
  diagnosis:
    root_cause: CPython finalisation SIGSEGVs because GDAL/PROJ (rasterio) and HDF5/netCDF (xarray/netCDF4)
      are torn down in an uncoordinated order in the same process
    explanation: 'A CRHM runner links two independent C stacks into one address space: rasterio (GDAL/PROJ)
      through the s1 terrain/land-cover tools, and xarray/netCDF4 (HDF5) through the CMFD elevation lookup
      and the Snow_cci reader. Their atexit handlers and dlclose order are not coordinated, so the segfault
      lands during interpreter finalisation -- strictly after main() has returned and every artifact is
      durable on disk. The work is 100% complete and correct; only the exit status is wrong. Observed
      on CRHM Hulunbuir 2026-07-26, where a fully clean run (record audit passed, headline reproduced
      to 4e-16) came back as returncode -11. This is NOT the CRHM binary segfaulting (dt_v006 / the Basin_Group
      case) -- the model exited long before, and the .obs/.prj are fine. Distinguishing the two costs
      an hour if the KI does not say so: check whether "WROTE result.json" is in the log. If it is, the
      model ran and the crash is Python teardown.

      '
    affected_components:
    - runner __main__ exit path
    - kdt_detached_run.py returncode capture (state.json)
    - rasterio/GDAL + xarray/netCDF4 in one process
  remedy:
    action: Exit the runner without running interpreter finalisation
    tool_to_run: null
    manual_steps:
    - Flush sys.stdout/sys.stderr explicitly, then call os._exit(0) at the end of __main__ -- never fall
      off the end of the script and never sys.exit() out of it
    - Apply the same treatment to the failure branch (os._exit(1)), or a clean "failed" verdict is misreported
      as a crash and the retry loop enters the wrong diagnosis
    - 'Do NOT "fix" this by removing the netCDF or rasterio import: both are load-bearing (CMFD cell elevation,
      land-cover HRU build) and the crash is in teardown, not in use'
    - If a run is already sitting at returncode -11, check the log for "WROTE result.json" before re-running
      anything -- the result is valid and only needs re-launching under the clean exit
    prevention: A detached runner owns its exit status as much as its output; treat a nonzero rc after
      a complete result.json as an exit-path bug, not as a modelling failure
  severity: silent
  stage: s5_execution
  failure_domain: silent_error
  cross_references:
  - dt_v006
  - dt_v008
- id: dt_v010
  stage: s5_execution
  failure_domain: environment
  symptom:
    description: 'A tool or runner dies with OSError [Errno -101] NetCDF: HDF error on a file that ncdump,
      h5py and a bare netCDF4.Dataset all open fine. Deterministic, 5/5. Under /usr/bin/python3 the SAME
      code passes, so it looks like data corruption or a flaky disk.

      '
    error_pattern: 'OSError.*Errno -101.*NetCDF: HDF error'
    detection_method: log_match
  diagnosis:
    root_cause: Two bundled libhdf5 copies; h5py's initialises before netCDF4's
    explanation: 'Under the canonical interpreter python_env, h5py 3.16.0 and netCDF4 1.7.4 each ship
      their own bundled libhdf5 (both 1.14.6). `import xarray` runs a backend-entrypoint scan that imports
      h5netcdf -> h5py, so h5py''s libhdf5 initialises FIRST and netCDF4''s nc_open then fails inside
      the second HDF5 instance. Import ORDER decides it. /usr/bin/python3 has one shared system libhdf5,
      hence no conflict -- which is why the 17:41 real_case run passed and the retest crashed on byte-identical
      code. ki_tools_common.load_forcing is immune because load_forcing.py:414-420 already tries engine="h5netcdf"
      before the default; the exposure is bare xr.open_dataset() with no engine ladder. A .nc that xarray
      itself just wrote is also unreadable unguarded.

      '
    affected_components:
    - any bare xr.open_dataset() under python_env
    - run_and_score_hulunbuir.py / _retest.py cmfd_cell_elevation
    - docs/s5_execution_skill.md "xarray-readable" verification step
  remedy:
    action: Import netCDF4 before anything that can reach xarray/h5py; read cells netCDF4-direct
    tool_to_run: netcdf_safe
    manual_steps:
    - 'Entry points: `import netcdf_safe` (tools/s2_observation_data/) at the TOP of the file, above every
      import that reaches xarray or h5py -- importing it IS the guard'
    - 'Cell reads: netcdf_safe.cell_value(path, lat, lon) / cmfd_cell_elevation(lat, lon)'
    - 'Dataset opens: netcdf_safe.open_dataset(path) -- engine ladder None -> netcdf4 -> h5netcdf'
    - 'All three entry points (open_dataset / cell_value / cmfd_cell_elevation) enforce ONE grid contract
      via two shared helpers: a lat/lon pair that IS present must be 1-D, and the data array must reduce
      to exactly (lat.size, lon.size) resolved by dim NAME, not position. Curvilinear/2-D coords raise
      UnsupportedGridError (a KeyError) rather than return an arbitrary cell -- including from open_dataset,
      which closes the dataset before raising. A file with NO lat/lon pair still opens (that is what keeps
      the time-only parsed CRHM output readable). open_dataset(path, require_rectilinear=False) is the
      ONE explicit way to obtain a Dataset for a geometry the module will not index; no cell read uses
      it.'
    - 'If netCDF4 is not importable the guard is INACTIVE and EVERY entry point says so on stderr on EVERY
      call -- the reads then ride h5py''s libhdf5 via engine="h5netcdf" (verified with netCDF4 shadowed
      out: CMFD elev still 663.0). Never read silence as "the guard is on". A single call can emit up
      to THREE of these lines (cmfd_cell_elevation -> cell_value -> open_dataset each name THEMSELVES
      rather than letting a callee speak for them); that is duplication, not three separate failures.'
    - 'Confirm: python_env/bin/python tools/s2_observation_data/netcdf_safe.py --lat 49.4 --lon 120.4
      must print 663.0'
    prevention: Never call bare xr.open_dataset() in KI code under the canonical interpreter.
  severity: fatal
  cross_references:
  - dt_v009
- id: dt_v011
  stage: s4_parameter_config
  failure_domain: silent_error
  symptom:
    description: 'CRHM runs to completion with no error, but PBSM transports and sublimates almost nothing
      on an open wind-exposed domain: area-weighted cumSubl/cumhru_snow is ~1-3% of snowfall instead of
      the 15-40% the dag requires for prairie. Simulated SWE over-accumulates; the headline shows a large
      positive PBIAS (+50 to +70%) at a HIGH correlation (r > 0.8), i.e. the timing is right and only
      the mass is wrong. Verified at Hulunbuir steppe 2002-2014: cumSubl 13.75 mm, cumDrift 3.83 mm, cumhru_snow
      980.72 mm; sim monthly mean SWE 21.4 mm vs obs 13.4 mm, NSE -0.48.

      '
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: pbsm Ht set from the growing-season land-cover canopy height, so the vegetation is never
      buried and CRHM keeps blowing snow switched OFF
    explanation: 'Classpbsm.cpp:529 computes E_StubHt = Ht - DepthofSnow(SWE). When E_StubHt > 0.01 m
      (line 534) the branch sets Uten_Prob = log(10/Znod)/KARMAN * min(0.0, Ustar-Ustn), and Ustn is always
      <= Ustar, so that min() is identically 0 and Uten_Prob == 0. ProbabilityThresholdNew only accumulates
      probability inside "while ((Wind <= Uten_Prob) && (Uten_Prob >= 3.0))", so Prob == 0, the "if (Prob[hh]
      > 0.001)" block at line 548 never runs, and Drift and Subl are exactly zero. Ht is therefore an
      ON/OFF SWITCH: blowing snow starts only once snow depth reaches Ht - 0.01 m. In a shallow-snow regime
      (steppe, tundra, grazed grassland; obs mean SWE ~12 mm) an Ht of 0.15-0.3 m taken from a land-cover
      canopy table means the switch is off 78-98% of snow-covered timesteps. Every blowing-snow SOURCE
      HRU in the shipped prairie projects is 0.001-0.12 m (badlake.prj:51-52 = 0.05 0.25 0.6; smithcreek.prj:447
      = 0.001 0.12 0.4 0.7 0.001 6 1.5). A second, independent instance of the same class: inhibit_bs
      is never written, so PBSM also runs inside 15 m forest HRUs where the dag declares it invalid (smithcreek.prj:457
      sets inhibit_bs=1 on its Ht=6 m HRU). N_S and A_S are NOT implicated: their decldiagparam defaults
      320 and 0.003 (Classpbsm.cpp:122-124) are exactly what badlake.prj:172-183 writes.

      '
    affected_components:
    - derive_parameters.py (pbsm Ht / inhibit_bs derivation)
    - create_hru_config.py veg_height_m table (growing-season canopy height)
    - PBSM module (Drift, Subl)
    - any SWE-scored run on flat/open shallow-snow terrain
  remedy:
    action: Set pbsm Ht to the WINTER EXPOSED vegetation height, set inhibit_bs=1 on canopy HRUs, and
      gate the score on the sublimation fraction BEFORE any metric is emitted
    tool_to_run: derive_parameters
    manual_steps:
    - pbsm Ht = winter exposed stubble/grass height (0.02-0.10 m for grazed or dormant steppe), NOT the
      growing-season veg_height_m used for evap Ht
    - Set pbsm inhibit_bs = 1 on every HRU with has_canopy true; shortening fetch is not a substitute
    - Do not tune N_S/A_S -- defaults 320 / 0.003 match the validated Badlake project
    - Compute area-weighted cumSubl/cumhru_snow from the run output and REFUSE to score outside the dag
      band (0.15-0.40 prairie/steppe, 0.30-0.50 boreal forest)
    - 'Never route an out-of-band run to requires_calibration: the mass sink is off, not mistuned'
    prevention: SKILL.md section "PBSM PROCESS-ACTIVITY GATE" -- RULE 1 (Ht semantics), RULE 2 (inhibit_bs),
      RULE 4 (mandatory pre-score gate)
  severity: silent
  cross_references:
  - dt_016
  - dt_006
  verified: 2026-07-27 (Hulunbuir steppe SWE case; cumSubl/cumhru_snow = 1.40%, E_StubHt<=0.01 on 2.18%
    of snow-covered steps for the Ht=0.3 m HRUs)
- id: dt_v012
  stage: s3_module_selection
  failure_domain: dependency_mismatch
  symptom:
    description: 'CRHM prints its banner (Project file / Observation file / Program Version 4.7_16), then
      "Running simulation..." and "0% complete.", and dies with a SEGMENTATION FAULT: exit code -11 (139
      from a shell), empty stderr, and an output file holding only the two header rows (112-124 bytes for
      a one-HRU project, ~6 kB for 15 HRUs). No missing-variable message. The chain contains SnobalCRHM
      together with plain pbsm (or with no blowing-snow module at all). The shipped example badlake.prj
      runs fine on the same binary, so it looks like a forcing, date or build problem - it is none of those.

      '
    error_pattern: exit -11|Segmentation fault|0% complete\.|output file contains only the two header rows
    detection_method: exit_code
  diagnosis:
    root_cause: SnobalCRHM is paired with plain pbsm. SnobalCRHM reads hru_drift and hru_subl, which only
      pbsmSnobal declares; the unresolved pointers stay NULL and the first timestep dereferences them
    explanation: 'ClassSnobalCRHM.cpp:170-171 declgetvar("*", "hru_drift", ...) and ("*", "hru_subl", ...)
      and uses both every timestep at :316-317 (ClassSnobalX.cpp:158-159 does the same). The only modules
      that DECLARE those two names are pbsmSnobal (ClasspbsmSnobal.cpp:74,76) and WQ_pbsmSnobal. Plain pbsm
      declares Subl and Drift instead (Classpbsm.cpp:76,78). A declgetvar that finds no declarer leaves the
      pointer at its initial NULL (ClassSnobalCRHM.h:57-58) and CRHM reports nothing. Second fault in the
      same pairing: pbsm and SnobalCRHM each declare their own SWE (Classpbsm.cpp:74, ClassSnobalCRHM.cpp:95),
      so even if it ran the chain would carry two snowpacks fed the same snowfall. pbsmSnobal keeps no pack:
      it writes into the Snobal SWE / z_s / rho (ClasspbsmSnobal.cpp:130-132), which is also why pbsmSnobal
      without SnobalCRHM cannot run. CRHM''s own registered model "Prairie using Qsi and Snobal" (NewModules.cpp:278)
      is basin, global, obs, calcsun, intcp, longVt, netall, pbsmSnobal, albedo, evap, SnobalCRHM#2, ...
      History: the prairie_reduced preset was switched from ebsm to SnobalCRHM on 2026-07-26 with pbsm left
      in place, on the false note "pbsm still supplies hru_drift/hru_subl"; a retest the same day showed
      the crash (Hulunbuir RETEST_A, header-only output) and a clean run with pbsmSnobal (RETEST_B), but
      the preset was not corrected until 2026-10-02. select_modules.py did not catch it because its dependency
      check skips every hru_* name as "provided by obs". Not the same as dt_v006 (missing canopy module):
      same symptom, different missing variable.

      '
    affected_components:
    - select_modules.py LANDSCAPE_CHAINS["prairie_reduced"] (auto-selected for flat, open sites)
    - select_modules.py validate_chain (hru_* names were never checked)
    - any hand-built chain that puts SnobalCRHM next to pbsm / PBSM
  remedy:
    action: Use pbsmSnobal, never plain pbsm, whenever SnobalCRHM is the snowpack. Re-run select_modules.py;
      the prairie_reduced preset is now basin > global > obs > calcsun > intcp > pbsmSnobal > albedo > SnobalCRHM
      > netall > crack > evap > Soil > Netroute and validate_chain refuses the bad pairings
    tool_to_run: tools/s3_module_selection/select_modules.py
    manual_steps:
    - In a hand-edited .prj change the Modules line "pbsm CRHM 11/20/17" to "pbsmSnobal CRHM 01/05/17" AND
      rename the parameter lines "pbsm fetch / Ht / distrib" to "pbsmSnobal fetch / Ht / distrib"; lines
      left under the pbsm prefix are not read by pbsmSnobal, which then runs on its built-in defaults
    - Key overrides as "pbsmSnobal <param>"; create_prj_file.py rejects "pbsm <param>" on this chain
    - Keep albedo BEFORE SnobalCRHM in the Modules list, as in CRHM's registered model; the .prj order
      is the execution order and SnobalCRHM-before-albedo gives a different result
    - Output variables differ from pbsm - ask for "pbsmSnobal hru_subl", "pbsmSnobal hru_drift", "pbsmSnobal
      Drift_out", "pbsmSnobal cumSubl"; the pack is "SnobalCRHM SWE" and its own sublimation is "SnobalCRHM
      E_s_int" (negative = loss)
    - A blowing-snow sublimation of exactly 0 on this chain is usually dt_v011 (Ht above the snow depth
      keeps blowing snow switched off), not a wiring fault - check Prob and z_s before anything else
    - To stay on the old melt-only physics instead, select prairie_ebsm_legacy (pbsm + ebsm); it runs but
      has no mid-winter sublimation sink
    prevention: Never hand-assemble a Snobal chain; select_modules.py validate_chain now fails closed on SnobalCRHM
      without pbsmSnobal, on pbsm next to SnobalCRHM, on pbsmSnobal without SnobalCRHM, and on module names
      the binary does not register
  format_spec_violated: CRHM module dependency contract (declvar/declgetvar)
  canonical_intent: canonical
  severity: fatal
  cross_references:
  - dt_v006
  - dt_v011
  verified: '2026-10-02 on the server (crhmcode b6f7e70, Program Version 4.7_16), one-HRU crop-stubble site
    at 49.17 N 125.23 E, NASA POWER 2003-2004: pbsm + SnobalCRHM -> exit -11, 2 rows, 112 bytes; pbsmSnobal
    + SnobalCRHM -> exit 0, 17,522 rows. pbsmSnobal reads its own parameter lines: with Ht 0.001 m, fetch
    300 / 1000 / 5000 m gave hru_subl 1.86 / 2.99 / 4.31 mm and Drift_out 3.71 / 1.54 / 0.29 mm; with the
    land-cover Ht 0.15 m (snow depth never above 0.054 m) blowing snow stayed off and hru_subl was 0, while
    SnobalCRHM E_s_int removed 20.9 mm of 110 mm snowfall. Also seen 2026-07-26 at Hulunbuir (RETEST_A crash,
    RETEST_B ran; SWE score of RETEST_B NSE -0.46, KGE 0.20 - the chain runs, it is not a validated pass).
    Same crash reported from a Mac build (crhmcode 5fe48ed) on 2026-10-02.'
  added_by_run: CRHM_handoff_20261002_nenjiang_single_hru
- id: dt_v013
  stage: s2_observation_data
  failure_domain: unit_conversion
  symptom:
    description: 'A .obs built from NASA POWER HOURLY data has a precipitation total about 24 times too
      small (41 mm in two years at 49.17 N 125.23 E instead of ~990 mm). Every tool exits 0. CRHM runs
      and produces almost no snow, soil recharge or flow.

      '
    error_pattern: P_total=\d{1,2} mm
    detection_method: value_comparison
  diagnosis:
    root_cause: The NASA POWER hourly API changed the unit of PRECTOTCORR from a mm/day rate to mm/hour,
      and the shared loader still divided every hourly value by 24
    explanation: 'ki_tools_common/load_forcing.py divided hourly PRECTOTCORR by 24 ("mm/day rate -> mm
      per hour"). That was right when it was written: a .obs built on 2026-06-08 for the Bow basin point
      (51.1722 N, -115.5718 E) starts 2005-01-01 with 0.045, 0.050, 0.033 mm, i.e. raw values 1.08, 1.20,
      0.79, and the validated basins got realistic yearly totals (Bow 917 mm in 2005). On 2026-10-02 the
      API (v2.10.2) returns 0.05, 0.05, 0.03 for the same hours, labels them "mm/hour", and the January
      2005 hourly sum (66.42) equals the daily product''s sum (66.24). Dividing by 24 now loses 96% of
      the precipitation.

      '
    affected_components:
    - ki_tools_common/load_forcing.py _load_nasa_power_hourly (shared by about 40 KI tools)
    - build_obs.py --source nasa_power
  remedy:
    action: The loader now takes the divisor from the unit the response declares (mm/hour -> 1, mm/day
      -> 24), refuses an unknown unit, and compares the first year's hourly total with the daily product
    tool_to_run: tools/s2_observation_data/build_obs.py
    manual_steps:
    - Rebuild any NASA POWER hourly .obs made between about 2026-06 and 2026-10-02 and check its yearly
      precipitation total against the daily product or a gauge
    - Do NOT pass --precip_scale 24 to repair it; the tool refuses a scale of 10 or more
    - Forcing files of the validated basins built before the change are correct as stored; rebuilding
      them before this fix would have given 24 times less precipitation
    prevention: Read units from the data, not from memory of what the service used to return; the loader
      fails closed on an unknown unit and on an hourly/daily total mismatch
  severity: silent
  verified: '2026-10-02: API units field mm/hour; Bow point raw values compared with the 2026-06-08 stored
    .obs; Nenjiang 2003 hourly/daily total ratio 0.997 after the fix.'
  added_by_run: CRHM_handoff_20261002_nenjiang_single_hru
- id: dt_v014
  stage: s2_observation_data
  failure_domain: silent_error
  symptom:
    description: 'A basin run finishes cleanly, but its precipitation (and so its runoff volume) is that
      of ONE grid cell, not of the basin: the .obs was built with --lat/--lon at the basin centre. Nothing
      looks wrong in the file. The meta file says "mode: point".

      '
    error_pattern: '"mode": "point"'
    detection_method: value_comparison
  diagnosis:
    root_cause: One forcing grid cell was used to stand for a whole basin
    explanation: 'CRHM takes ONE weather series and spreads it over the HRUs by elevation (obs_elev, lapse_rate).
      For a basin much larger than a forcing cell, the centre cell is a sample of one. Measured on the
      Yarlung Tsangpo at Nuxia (205,000 km2): the centre CMFD cell had 550 mm in 1970, the area mean of
      the 1,944 cells inside the basin 660 mm (cells range 321 to 3,067 mm); centre cell elevation 5,103
      m, mean cell elevation 4,870 m. The elevation matters as much as the amount: obs_elev must be the
      elevation the series stands for, or every HRU is lapsed from the wrong height.

      '
    affected_components:
    - tools/s2_observation_data/build_obs.py (--lat/--lon versus --basin_shp)
    - derive_parameters.py --forcing_elev_m (obs_elev)
  remedy:
    action: Build the .obs as the basin mean and pass its forcing elevation on
    tool_to_run: tools/s2_observation_data/build_obs.py
    manual_steps:
    - 'build_obs.py --source cmfd --basin_shp <basin polygon> --start_year .. --end_year .. --output_path
      basin.obs (mean over every grid cell whose centre is inside the polygon)'
    - Read basin.obs.meta.json - check precip_mm_by_year against what is known for the basin
    - Pass forcing_elev_m from the meta file to derive_parameters.py --forcing_elev_m
    - Use --lat/--lon only for a plot, a station, or a basin no larger than a cell or two
    prevention: The meta file records the mode (point / basin_mean / table), the number of cells and the
      forcing elevation; read it before stage s4
  severity: silent
  cross_references:
  - dt_002
  verified: '2026-10-02, CMFD 1970, Yarlung Tsangpo at Nuxia: centre cell 550 mm, basin mean of 1,944 cells
    660 mm. Basin-mean .obs checked row by row against the weighted mean of single-cell reads (6-cell
    box).'
  added_by_run: CRHM_direct_forcing_20261002

- id: dt_utc_solar_clock_20261003
  stage: s4_parameter_config
  failure_domain: silent_error
  symptom:
    description: UTC forcing runs without an error, but global solar geometry is centered on clock noon
      rather than solar noon.
  diagnosis:
    root_cause: Legacy observation files have no clock metadata and legacy projects omit global Time_Offset
      or leave it zero. This is independent of module-chain compatibility and of VIC.
  remedy:
    action: For new inputs keep build_obs.py metadata with the observations. For an existing project with
      a known observation clock, use tools/s4_parameter_config/migrate_project_clock.py with explicit
      --obs_utc_offset and --longitudes, and rerun the new project. The helper preserves all other parameters
      and weather data, rejects incompatible module chains and invalid weather, and never overwrites old
      projects. Unknown station time must not be assumed UTC.
    verification: At longitude 90 E, UTC Time_Offset is -6 h; the actual binary shifts the solar peak
      six clock hours earlier. Ten existing multiyear projects were migrated and rerun with finite data
      on 2026-10-03.
  added_by_run: ki_fully_resolve_20261003
