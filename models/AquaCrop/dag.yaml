safety:
  hazards:
    - id: "weather_missing_ET0_column"
      kind: "weather_file_semantic"
      description: "AquaCropModel construction fails when weather lacks a positive ReferenceET column; AquaCrop does not compute ET0 internally."
      severity: "fatal"
    - id: "weather_column_name_mismatch"
      kind: "weather_file_semantic"
      description: "Weather column names must be exactly Date / MinTemp / MaxTemp / Precipitation / ReferenceET (case sensitive); mismatch raises ValueError."
      severity: "fatal"
    - id: "weather_units_kelvin_or_subdaily_precip"
      kind: "weather_file_semantic"
      description: "Temperatures supplied in Kelvin (values > 200) or precipitation expressed as a sub-daily rate are silently misinterpreted as daily Celsius and mm/day."
      severity: "silent"
    - id: "soil_layer_hydraulic_ordering"
      kind: "soil_semantic"
      description: "Every layer must satisfy thWP < thFC < thS and Ksat > 0; violation raises an assertion at construction."
      severity: "fatal"
    - id: "soil_custom_without_layer"
      kind: "soil_semantic"
      description: "Soil('custom') leaves an empty profile; add_layer / add_layer_from_texture must be called before initialization or hydraulics are NaN."
      severity: "fatal"
    - id: "soil_total_depth_below_root_zmax"
      kind: "soil_semantic"
      description: "Soil profile shallower than crop.Zmax silently truncates rooting and biases water uptake."
      severity: "silent"
    - id: "initial_water_layer_count_mismatch"
      kind: "initial_condition_semantic"
      description: "InitialWaterContent with fewer layers than soil.nLayer silently defaults all layers to field capacity (no warning)."
      severity: "silent"
    - id: "initial_water_below_germination_threshold"
      kind: "initial_condition_semantic"
      description: "Initial top-zone water below GermThr (default 0.2 of TAW) leaves germination_flag False; canopy never develops and yield is zero with no error."
      severity: "silent"
    - id: "wrong_planting_season_or_hemisphere"
      kind: "control_semantic"
      description: "Planting date in the wrong season for the hemisphere keeps temperatures near or below Tbase; GDD accumulation stalls and yield collapses silently."
      severity: "silent"
    - id: "wrong_Tbase_for_crop"
      kind: "coefficient_runtime_silent_fallback"
      description: "Tbase mismatched to the actual crop (e.g. wheat 0 C vs maize 8 C) shifts the entire phenology calendar without raising an error."
      severity: "silent"
    - id: "simulation_date_format_dashes"
      kind: "control_semantic"
      description: "sim_start_time / sim_end_time using 'YYYY-MM-DD' dashes raise ValueError; slashes 'YYYY/MM/DD' are mandatory."
      severity: "fatal"
    - id: "off_season_flag_false_multiyear"
      kind: "control_semantic"
      description: "Default off_season=False jumps from harvest to next planting and resets soil moisture; multi-year continuity is lost without warning."
      severity: "degraded"
    - id: "irrigation_schedule_dataframe_shape"
      kind: "control_semantic"
      description: "Irrigation method=3 requires Schedule DataFrame with Date (pd.Timestamp) and Depth (float) columns; missing or mistyped columns raise TypeError at run."
      severity: "fatal"
    - id: "z_bund_meters_vs_mm_confusion"
      kind: "control_semantic"
      description: "z_bund must be supplied in METERS (engine multiplies by 1000); passing 150 thinking mm creates a 150 m bund and breaks the surface water balance."
      severity: "silent"
    - id: "persistent_waterlogging_aeration_stress"
      kind: "numerical_instability"
      description: "Saturated profile sustained beyond crop.LagAer days triggers aeration-stress death of roots; canopy declines and transpiration collapses with no explicit error."
      severity: "silent"
    - id: "missing_ET0_clip_engine_side"
      kind: "weather_file_semantic"
      description: "The engine itself does not clip ReferenceET; values <= 0 propagate into transpiration and biomass calculations and can blow up Tr/ET0 ratios."
      severity: "silent"
    - id: "irrigation_default_AppEff_WetSurf_100pct"
      kind: "coefficient_runtime_silent_fallback"
      description: "IrrigationManagement defaults AppEff = 100% and WetSurf = 100% even when method implies drip or sprinkler; biases applied water and evaporative losses optimistically."
      severity: "silent"
    - id: "default_curve_number_unreset"
      kind: "coefficient_runtime_silent_fallback"
      description: "Soil.cn defaults to 61 and is NOT reset when a different built-in soil type is selected unless calc_cn=1; runoff partitioning may not match the chosen texture."
      severity: "silent"
    - id: "date_dtype_seconds_precision"
      kind: "parser_semantic"
      description: "weather_df Date column with datetime64[s] precision (rather than [us]) triggers TypeError in GDD comparison; convert via pd.to_datetime(...).astype('datetime64[us]') first."
      severity: "fatal"
    - id: "output_column_name_drift_across_versions"
      kind: "parser_semantic"
      description: "AquaCrop-OSPy output DataFrame column names change across major versions; hardcoded column-name lookups break on upgrade. Pin the package version."
      severity: "fatal"
    - id: "yield_zero_with_run_success"
      kind: "control_semantic"
      description: "run_model returning True with DryYield = 0 is a multi-cause silent failure (germination, water stress, waterlogging, HI0 = 0, simulation ending before maturity); diagnose via canopy_cover, gdd_cum, water_storage, Tr, harvest_index trajectories."
      severity: "silent"
  validation_limits:
    - "Point/field scale only; the standalone model has no native distributed routing or lateral exchange between cells."
    - "Daily timestep; sub-daily process resolution (e.g., diurnal stomatal dynamics) is not represented."
    - "Herbaceous crops only; woody perennial trees are out of scope."
    - "No explicit nitrogen / phosphorus / potassium cycling — fertility stress is represented only by a calibrated KsWP / canopy / HI response."
    - "AquaCrop-OSPy implementation omits the salt balance present in the reference Fortran code; salinity-stressed environments are not directly modeled in this binding."
    - "Hargreaves-Samani ET0 with fixed solar radiation produces wildly biased ET0 and silently degrades yield realism; full FAO-56 Penman-Monteith is required for defensible runs."
  warnings:
    - "WP* and CCx defaults are calibrated against potential-production trials; in humid regions or low-input systems where water stress rarely activates and AquaCrop-OSPy cannot represent N limitation, yields collapse upward to the potential envelope. Down-calibrate WP* and CCx to the local production regime."
    - "Crop.fCO2 silently scales WP* each day from the supplied CO2 forcing; large CO2 perturbations enter biomass through a per-crop fertilization multiplier not exposed in the daily timestep signature."
    - "HI adjustment uses Tmax/Tmin directly (pollination heat / cold stress) in addition to GDD, so temperature couples into yield through two paths and a single bad Tmin/Tmax day during flowering can have outsized yield impact."
    - "outputs_when_model_is_finished reshapes water_flux / water_storage / crop_growth from numpy to DataFrame only on the final timestep; mid-run inspection returns raw numpy arrays without column labels."
    - "AquaCrop-OSPy repository license metadata is inconsistent between sources: the GitHub LICENSE file declares Apache-2.0 while the current PyPI package metadata (aquacrop 3.0.12, Oct 2025) lists MIT. Downstream redistribution / integration tooling should treat the GitHub LICENSE file as authoritative until upstream resolves the discrepancy."
  assumptions:
    - statement: "Soil-water mass balance over the root-zone reservoir is exact (Precip + Irrigation = ET + Runoff + DeepPerc + delta(Storage)); no surface energy-balance closure is enforced because ET0 is supplied externally rather than computed."
      scope: "All AquaCrop-OSPy runs"
      source: "FAO AquaCrop Reference Manual Chapter 3, Section 3.1 (root zone reservoir) and Section 3.7 (soil water balance)"
      status: "adopted"
    - statement: "Biomass is computed from a single normalized water productivity WP* (with C3/C4 classes and a CO2 multiplier) assumed conservative across climates after normalization; no per-organ source-sink partitioning is performed."
      scope: "Biomass and yield calculations"
      source: "FAO AquaCrop Reference Manual Chapter 3, Section 3.11"
      status: "adopted"
    - statement: "Yield is biomass times a time-built Harvest Index adjusted for pollination heat / cold stress and pre- and post-anthesis water stress; no explicit organ-level reproductive allocation is modeled."
      scope: "Yield formation"
      source: "FAO AquaCrop Reference Manual Chapter 3, Section 3.12"
      status: "adopted"
    - statement: "Soil fertility stress is represented through a calibrated KsWP / canopy / HI response selected by the user, not by explicit nutrient cycling; nitrogen limitation is therefore not mechanistically simulated."
      scope: "All fertility-limited regimes"
      source: "FAO AquaCrop Reference Manual Chapter 3, Section 3.14"
      status: "adopted"
    - statement: "AquaCrop-OSPy uses a point/0-D soil column with a single climate station; gridded application requires external orchestration (e.g. a coupling layer) outside the model itself."
      scope: "Spatial domain"
      source: "FAO AquaCrop Reference Manual Chapter 1 (scope) and aquacrop-ospy package documentation"
      status: "adopted"
    - statement: "The aquacrop-ospy binding drops the reference-manual salt balance (Chapter 3 Section 3.8) and the explicit salinity-stress chain (Sections 3.15-3.16); this dag describes only the water/biomass/yield subset that the Python engine implements."
      scope: "Salinity and combined fertility-salinity stress"
      source: "Comparison of FAO AquaCrop Reference Manual Chapter 3 Sections 3.8/3.15/3.16 with aquacrop-ospy module inventory"
      status: "adopted"
    - statement: "The Fallow_Crop slot used between growing seasons substitutes Aer=5 and Zmin=0.3 in the soil-evaporation and root-zone computations; this is a silent in-place mutation that affects warm-up windows before the first season starts."
      scope: "Pre-first-season simulation window"
      source: "aquacrop/timestep/run_single_timestep.py (Fallow_Crop substitution)"
      status: "adopted"

