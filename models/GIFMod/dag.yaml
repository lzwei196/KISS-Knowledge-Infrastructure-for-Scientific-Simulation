template_version: "3.5"

identity:
  model_id: "GIFMod"
  scientific_reference_version: "GIFMod (Massoudieh et al. 2017 framework; block-connector variably-saturated flow + ADR reactive transport)"
  implementation:
    id: "gifmod-usepa"
    version: "0.1.26"
    provenance: "C++ (Qt5 GUI); US EPA / Catholic University of America GIFMod, driven by .GIFMod project files and an embedded JavaScript scripting engine."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL-3.0"
  repo_url: "https://github.com/USEPA/GIFMod"

boundary:
  scope_in:
    - "Hydraulic and water-quality performance of stormwater green infrastructure and urban/agricultural BMPs (bioretention, green roofs, permeable pavement, infiltration basins/trenches, cisterns, vegetated swales)"
    - "Variably-saturated flow from surface water through the vadose zone to groundwater across an interconnected block-connector network"
    - "Particle/colloid transport across mobile and attached phases"
    - "Dissolved and particle-bound reactive constituent fate and transport with user-defined biogeochemical transformations"
  scope_out:
    - "Full 2-D/3-D spatial domains (each block is 0-D or 1-D; no domain decomposition)"
    - "Fixed spatial/temporal grain (user defines block discretization; time step is adaptive)"
    - "Native GIS geometry handling"
  spatial: "1-D column"
  temporal: "sub-hourly"
  closure: "mass-balance"
  notes: "Mass-balance closure applies to water (Richards-equation soil columns, Manning/diffusive-wave surface and channel flow) and to each transported constituent (advection-dispersion-reaction with linear-isotherm sorption). A cumulative mass-balance error output > 1e-6 flags non-closure. ET is computed as a demand-side flux (Penman / Priestley-Taylor / aerodynamic methods), not a closed surface energy budget. Constituent and mass-balance units are user-defined and must be kept consistent across blocks; the solver does not enforce a canonical concentration unit."

inputs:
  forcing:
    - {category: forcing, name: "Precipitation", unit: "m/day", source_kind: forcing, model_input_format: "CSV time series (Time, Precipitation, ...)", notes: "Time-varying driver of infiltration and surface runoff; routine events should be < ~0.5 m/day."}
    - {category: forcing, name: "Temperature", unit: "Celsius", source_kind: forcing, model_input_format: "CSV time series column", notes: "Drives ET and temperature-dependent reaction kinetics (theta correction)."}
    - {category: forcing, name: "Humidity", unit: "fraction (0-1)", source_kind: forcing, model_input_format: "CSV time series column", notes: "Used by ET methods."}
    - {category: forcing, name: "Wind speed", unit: "m/s", source_kind: forcing, model_input_format: "CSV time series column", notes: "Used by aerodynamic/Penman ET methods."}
    - {category: forcing, name: "Solar radiation", unit: "W/m^2", source_kind: forcing, model_input_format: "CSV time series column", notes: "Used by Penman/Priestley-Taylor ET methods."}
    - {category: forcing, name: "External inflow", unit: "m^3/day", source_kind: forcing, model_input_format: "Prescribed-flow connector time series Q(t)", notes: "User-prescribed inflow to a block (e.g., upstream drainage)."}
  parameters:
    - {category: parameter, name: "Saturated hydraulic conductivity (Ks)", unit: "m/day", source_kind: calibrated, model_input_format: ".GIFMod block property", notes: "Soil/Darcy blocks; typical 0.001-100 m/day; controls infiltration and exfiltration."}
    - {category: parameter, name: "Porosity", unit: "fraction (0-1)", source_kind: calibrated, model_input_format: ".GIFMod block property", notes: "Soil/Darcy blocks; valid 0.20-0.65; values > 1 destabilize the Richards solver."}
    - {category: parameter, name: "Residual moisture content (theta_r)", unit: "fraction", source_kind: dataset_lookup, model_input_format: ".GIFMod block property", notes: "van Genuchten-Mualem retention curve."}
    - {category: parameter, name: "Saturated moisture content (theta_s)", unit: "fraction", source_kind: dataset_lookup, model_input_format: ".GIFMod block property", notes: "van Genuchten-Mualem retention curve."}
    - {category: parameter, name: "van Genuchten-Mualem retention parameters (alpha, n)", unit: "1/m, dimensionless", source_kind: calibrated, model_input_format: ".GIFMod block property", notes: "Soil-water characteristic curve controlling unsaturated infiltration timing."}
    - {category: parameter, name: "Bulk density", unit: "kg/m^3", source_kind: dataset_lookup, model_input_format: ".GIFMod block property", notes: "Typical 800-2000 kg/m^3; scales sorbed-phase mass."}
    - {category: parameter, name: "Dispersivity", unit: "m", source_kind: calibrated, model_input_format: ".GIFMod block/connector property", notes: "Longitudinal dispersivity; scale-dependent 0.01-10 m."}
    - {category: parameter, name: "Manning roughness (n)", unit: "s/m^(1/3)", source_kind: calibrated, model_input_format: ".GIFMod connector property", notes: "Pipe/Stream connectors; 0.010-0.035; controls flow velocity."}
    - {category: parameter, name: "Partition coefficient (Kd)", unit: "L/kg", source_kind: calibrated, model_input_format: ".GIFMod reaction/block property", notes: "Linear-isotherm sorption S = Kd*C; 0.1-1000 L/kg."}
    - {category: parameter, name: "Reaction rate constants", unit: "1/day", source_kind: calibrated, model_input_format: "Petersen-matrix reaction network", notes: "User-defined transformation kinetics (e.g., denitrification, nitrification); 0.001-100 1/day."}
    - {category: parameter, name: "Particle settling velocity", unit: "m/day", source_kind: calibrated, model_input_format: ".GIFMod block property", notes: "Gravity settling for particle classes; fine silt 1-10, sand 100-1000 m/day."}
    - {category: parameter, name: "Particle attachment/release coefficients", unit: "1/day", source_kind: calibrated, model_input_format: ".GIFMod block property", notes: "Mobile <-> attached phase exchange for colloid transport."}
    - {category: parameter, name: "Block geometry (Area, Depth, Bottom elevation)", unit: "m^2, m, m", source_kind: user_provided, model_input_format: ".GIFMod block property", notes: "Defines block volume and head datum."}
    - {category: parameter, name: "Evaporation/transpiration coefficients", unit: "dimensionless", source_kind: calibrated, model_input_format: ".GIFMod block property", notes: "0.5-1.5; scales ET water loss (Pond/Soil/Plant blocks)."}
  initial_conditions:
    - {category: initial_condition, name: "Initial head / water storage", unit: "m / m^3", source_kind: user_provided, model_input_format: ".GIFMod block initial condition", notes: "Block state at simulation start."}
    - {category: initial_condition, name: "Initial soil moisture", unit: "fraction", source_kind: user_provided, model_input_format: ".GIFMod block initial condition", notes: "Initial theta in Soil blocks."}
    - {category: initial_condition, name: "Initial constituent concentration", unit: "user-defined", source_kind: user_provided, model_input_format: ".GIFMod block initial condition", notes: "Per-block starting concentration; unit must be consistent across all blocks."}
  boundary_conditions:
    - {category: boundary_condition, name: "Block-connector network topology", unit: "n/a", source_kind: user_provided, model_input_format: ".GIFMod block + connector definitions", notes: "User-defined blocks (Soil/Pond/Storage/Catchment/Manhole/Darcy/Stream/Plant) and connectors (Pipe/Porous/Non-Porous/Rating Curve/Prescribed Flow/Controlled) defining the simulated GI system."}
    - {category: boundary_condition, name: "ET method selection", unit: "n/a", source_kind: user_provided, model_input_format: ".GIFMod project option", notes: "Penman vs Priestley-Taylor vs aerodynamic."}
    - {category: boundary_condition, name: "Rating-curve / prescribed-flow boundaries", unit: "stage-discharge or Q(t)", source_kind: user_provided, model_input_format: "Connector property (Q=f(H) table or time series)", notes: "External hydraulic boundary on the network."}
    - {category: boundary_condition, name: "Bottom groundwater-head boundary", unit: "m", source_kind: user_provided, model_input_format: "Block bottom boundary condition", notes: "Prescribed lower head (e.g., from an external groundwater model)."}
    - {category: boundary_condition, name: "Process-inclusion switches", unit: "n/a", source_kind: user_provided, model_input_format: ".GIFMod project option", notes: "Per-model inclusion/exclusion of hydraulics, particle transport, and reactive transport levels."}

processes:
  modules:
    - {name: "RichardsFlow", role: process_solver, brief: "Solves dtheta/dt = d/dz[K(theta)(dh/dz+1)] - S(z) for variably-saturated Soil/Darcy blocks using van Genuchten-Mualem retention."}
    - {name: "SurfaceChannelFlow", role: process_solver, brief: "Manning / diffusive-wave routing Q = (1/n)A R^(2/3) S^(1/2) for Pipe/Stream/overland connectors."}
    - {name: "Evapotranspiration", role: process_solver, brief: "Penman / Priestley-Taylor / aerodynamic ET as a demand-side flux; supplies the root/surface sink."}
    - {name: "ParticleColloidTransport", role: process_solver, brief: "Mass-balance transport of particle classes with settling, attachment/release among mobile and attached phases.", applicability: "particle-transport level enabled"}
    - {name: "ADRTransport", role: process_solver, brief: "Advection-Dispersion-Reaction d(thetaC)/dt = d/dz[thetaD dC/dz] - d(qC)/dz + r(C,T) for dissolved and particle-bound constituents.", applicability: "reactive-transport level enabled"}
    - {name: "ReactionNetwork", role: process_solver, brief: "User-defined Petersen-matrix biogeochemical transformations r(C,T); rate constants in 1/day; multi-phase species.", applicability: "reactive-transport level enabled"}
    - {name: "SorptionIsotherm", role: allocator, brief: "Linear isotherm S = Kd*C partitioning dissolved and sorbed phases.", applicability: "reactive-transport level enabled"}
    - {name: "PlantUptake", role: optional_module, brief: "Root water uptake S(z) sink and constituent plant uptake for Plant blocks.", applicability: "Plant block present"}
    - {name: "NewtonRaphsonSolver", role: integrator, brief: "Semi-implicit damped Newton-Raphson with Jacobian iteration and adaptive time step; couples flow and transport across the block network."}
    - {name: "InverseModeling", role: optional_module, brief: "Deterministic genetic-algorithm and probabilistic Bayesian MCMC parameter estimation against observed data.", applicability: "calibration runs only"}
  internal_edges:
    - {from: "Inputs", to: "RichardsFlow", kind: consumes_input, brief: "Precipitation and ET forcing drive infiltration/soil water."}
    - {from: "Inputs", to: "Evapotranspiration", kind: consumes_input, brief: "Temperature, humidity, wind, solar drive ET demand."}
    - {from: "Evapotranspiration", to: "RichardsFlow", kind: invokes, brief: "ET supplies the surface/root sink term S(z)."}
    - {from: "RichardsFlow", to: "head", kind: writes_state, brief: "Updates block head/pressure."}
    - {from: "RichardsFlow", to: "moisture", kind: writes_state, brief: "Updates volumetric water content."}
    - {from: "head", to: "SurfaceChannelFlow", kind: reads_state, brief: "Head differences across connectors drive inter-block flow."}
    - {from: "SurfaceChannelFlow", to: "storage", kind: writes_state, brief: "Routed flow updates block water storage."}
    - {from: "SurfaceChannelFlow", to: "ParticleColloidTransport", kind: invokes, brief: "Darcy/connector flux advects particles."}
    - {from: "SurfaceChannelFlow", to: "ADRTransport", kind: invokes, brief: "Flow field drives constituent advection-dispersion."}
    - {from: "ParticleColloidTransport", to: "ADRTransport", kind: invokes, brief: "Mobile particle concentrations carry particle-bound constituents."}
    - {from: "ADRTransport", to: "ReactionNetwork", kind: invokes, brief: "Transport hands concentrations to the reaction network."}
    - {from: "ReactionNetwork", to: "concentration", kind: writes_state, brief: "Biogeochemical transformation r(C,T) updates concentrations."}
    - {from: "ReactionNetwork", to: "SorptionIsotherm", kind: invokes, brief: "Partitions transformed mass between phases."}
    - {from: "SorptionIsotherm", to: "sorbed_concentration", kind: writes_state, brief: "Updates sorbed-phase concentration via Kd."}
    - {from: "PlantUptake", to: "RichardsFlow", kind: invokes, brief: "Transpiration sink feeds the Richards equation."}
    - {from: "NewtonRaphsonSolver", to: "RichardsFlow", kind: invokes, brief: "Integrator iterates the coupled flow system to convergence."}
    - {from: "NewtonRaphsonSolver", to: "ADRTransport", kind: invokes, brief: "Integrator iterates the coupled transport system to convergence."}
    - {from: "RichardsFlow", to: "Outputs", kind: produces_output, brief: "Head, moisture, storage written to output."}
    - {from: "SurfaceChannelFlow", to: "Outputs", kind: produces_output, brief: "Flow, velocity, area written to output."}
    - {from: "ADRTransport", to: "Outputs", kind: produces_output, brief: "Concentration and mass-balance written to output."}

states:
  variables:
    - {name: "head", unit: "m", role: prognostic}
    - {name: "moisture", unit: "fraction", role: prognostic}
    - {name: "storage", unit: "m^3", role: prognostic}
    - {name: "concentration", unit: "user-defined", role: prognostic}
    - {name: "sorbed_concentration", unit: "mg/kg", role: prognostic}
    - {name: "particle_phase_concentration", unit: "user-defined", role: prognostic}
    - {name: "mass_balance_error", unit: "user-defined", role: accumulator}
  provenance: "structural"

outputs:
  - var: "head"
    validation_rank: 2
    unit: "m"
    description: "Water level / pressure head in a block."
    emitted_in: "GIFMod time-series output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "r"
          caveats: ["Observed water level must be referenced to the same datum as the block bottom elevation."]
      detrending_options: [none]
  - var: "flow"
    validation_rank: 3
    unit: "m^3/day"
    description: "Flow between blocks through a connector (outflow / underdrain / overflow hydrograph)."
    emitted_in: "GIFMod time-series output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy, timing_accuracy]
          determining_metric: "nse"
          caveats: ["Hydrograph falling-limb fit is dominated by soil Ks; event timing depends on adaptive time-step resolution."]
      detrending_options: [none]
  - var: "moisture"
    validation_rank: 4
    unit: "fraction"
    description: "Volumetric water content in soil/porous-media blocks."
    emitted_in: "GIFMod time-series output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "nse"
          caveats: ["Sensor depth must align with the modeled block/layer."]
      detrending_options: [none]
  - var: "storage"
    validation_rank: 5
    unit: "m^3"
    description: "Water storage in a block; basis for runoff-volume reduction metrics."
    emitted_in: "GIFMod time-series output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "nse"
          caveats: []
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: [magnitude_accuracy]
          determining_metric: "pbias"
          caveats: ["Event-total or period-total runoff-reduction comparisons."]
      detrending_options: [none]
  - var: "concentration"
    validation_rank: 6
    unit: "user-defined"
    description: "Dissolved or particle-bound constituent concentration in a block or outflow (e.g., nitrate, total nitrogen, sediment)."
    emitted_in: "GIFMod time-series output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "nse"
          caveats: ["Constituent unit is user-defined and must match the observation unit; water-quality kinetic parameters are often weakly identifiable from outflow data alone."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: [magnitude_accuracy]
          determining_metric: "pbias"
          caveats: ["Event-mean or load-based concentration / removal-efficiency comparison."]
      detrending_options: [none]
  - var: "velocity"
    validation_rank: 1
    unit: "m/day"
    description: "Flow velocity within a connector."
    emitted_in: "GIFMod time-series output"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "nse"
          caveats: []
      detrending_options: [none]
  - var: "mass_balance_error"
    unit: "user-defined"
    description: "Cumulative mass-balance error; a diagnostic of numerical closure rather than a physical observable."
    emitted_in: "GIFMod time-series output"
    observability:
      comparable_obs_shapes: []
      detrending_options: [none]

influence:
  edges:
    - from: "saturated hydraulic conductivity (Ks)"
      to: "flow"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "bioretention / variably-saturated infiltration"
      citations: ["alikhani2020_cincinnati_bioretention", "lisenbee2021_bioretention_review"]
    - from: "native soil hydraulic conductivity"
      to: "storage"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "exfiltration / runoff-volume reduction"
      citations: ["alikhani2020_cincinnati_bioretention"]
    - from: "van Genuchten-Mualem retention parameters"
      to: "flow"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "unsaturated infiltration timing"
      citations: ["lisenbee2021_bioretention_review", "massoudieh2017_gifmod_framework"]
    - from: "denitrification rate"
      to: "concentration"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "nitrate / total-nitrogen removal"
      citations: ["wang2021_nitrogen_removal"]
    - from: "internal water storage depth"
      to: "concentration"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: structural
      applicability: "total-nitrogen removal via saturated-zone residence time"
      citations: ["wang2021_nitrogen_removal", "alikhani2020_transit_time"]
    - from: "residence / transit time"
      to: "concentration"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: structural
      applicability: "unsteady reactive pollutant removal"
      citations: ["alikhani2020_transit_time"]
    - from: "nitrification rate"
      to: "concentration"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "ammonium effluent"
      citations: ["wang2021_nitrogen_removal", "alikhani2020_cincinnati_bioretention"]
    - from: "organic-nitrogen mineralization rate"
      to: "concentration"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "total-nitrogen source term"
      citations: ["wang2021_nitrogen_removal", "alikhani2020_cincinnati_bioretention"]
    - from: "evapotranspiration coefficients"
      to: "storage"
      sensitivity_grade: LOW
      basis: literature_qualitative
      lever_type: parameter
      applicability: "event-scale water balance (secondary to Ks)"
      citations: ["alikhani2020_cincinnati_bioretention"]
  citation_index:
    massoudieh2017_gifmod_framework:
      short_citation: "Massoudieh et al. 2017"
      doi: "10.1016/j.envsoft.2017.02.013"
      note: "Foundational GIFMod framework paper; governing equations, four demonstration cases, calibration (bioretention R^2=0.86, NSE=0.83); defers a systematic global sensitivity analysis."
    alikhani2020_cincinnati_bioretention:
      short_citation: "Alikhani et al. 2020"
      doi: "10.1061/JSWBAY.0000903"
      note: "MCMC calibration of a GIFMod bioretention model; topsoil/engineered/native-soil Ks dominate the outflow hydrograph (NSE 0.68-0.86); WQ kinetic parameters poorly identifiable."
    wang2021_nitrogen_removal:
      short_citation: "Wang et al. 2021"
      doi: "10.1016/j.envsoft.2021.105042"
      note: "GIFMod nitrogen-transformation modeling; residence time / internal water storage and denitrification rate are primary controls on N removal. Prior EMS-2021 DOI collision now resolved: 105042 = Wang nitrogen-removal paper, 105146 = Lisenbee review (Codex fact_check)."
    alikhani2020_transit_time:
      short_citation: "Alikhani et al. 2020 (transit time)"
      doi: "10.1061/JSWBAY.0000900"
      note: "Couples GIFMod-style simulation with transit-time distribution theory; residence/transit time governs unsteady reactive pollutant removal."
    lisenbee2021_bioretention_review:
      short_citation: "Lisenbee et al. 2021"
      doi: "10.1016/j.envsoft.2021.105146"
      note: "Independent bioretention-model review; identifies Ks and van Genuchten retention as key controls on Richards-equation flow predictions in GIFMod. EMS-2021 DOI collision resolved (Codex fact_check): 105146 = this Lisenbee review (EMS vol. 144, art. 105146), 105042 = Wang nitrogen paper."

safety:
  hazards:
    - id: "ks_unit_cm_s_vs_m_day"
      kind: soil_semantic
      description: "Hydraulic conductivity authored in cm/s instead of m/day is ~864x too low, yielding near-zero infiltration and unrealistic surface ponding; runs without error."
      severity: silent
    - id: "precip_unit_mm_day_vs_m_day"
      kind: weather_file_semantic
      description: "Precipitation authored in mm/day (or mm/hr) instead of m/day is ~1000x too high, causing every block to overflow."
      severity: silent
    - id: "area_unit_ft2_vs_m2"
      kind: soil_semantic
      description: "Block area in ft^2 instead of m^2 (~10.76x) corrupts block volumes and water-balance closure."
      severity: silent
    - id: "depth_unit_cm_vs_m"
      kind: soil_semantic
      description: "Depth/elevation in cm instead of m produces 100x-deep soil columns and unrealistic storage."
      severity: silent
    - id: "bulk_density_unit_gcm3_vs_kgm3"
      kind: soil_semantic
      description: "Bulk density in g/cm^3 instead of kg/m^3 (1000x) underestimates sorbed mass and inflates dissolved concentrations."
      severity: silent
    - id: "dispersivity_unit_cm_vs_m"
      kind: soil_semantic
      description: "Dispersivity in cm instead of m gives 100x-wrong solute dispersion (sharp fronts or excessive mixing)."
      severity: silent
    - id: "diffusion_coeff_unit_m2s_vs_m2day"
      kind: coefficient_runtime_silent_fallback
      description: "Molecular/vapor diffusion coefficient in m^2/s instead of m^2/day is 86400x off."
      severity: silent
    - id: "temperature_unit_F_vs_C"
      kind: weather_file_semantic
      description: "Temperature in Fahrenheit instead of Celsius distorts ET and temperature-dependent reaction kinetics."
      severity: degraded
    - id: "mixed_concentration_units_across_blocks"
      kind: control_semantic
      description: "Concentration units are user-defined; mixing mg/L and ug/L across blocks causes silent ~1000x inter-block mass-transfer errors and a growing mass-balance error."
      severity: silent
    - id: "reaction_rate_unit_per_hr_vs_per_day"
      kind: coefficient_runtime_silent_fallback
      description: "Petersen-matrix reaction rate constants in 1/hr instead of 1/day make reactions 24x too slow."
      severity: silent
    - id: "settling_velocity_unit_ms_vs_mday"
      kind: coefficient_runtime_silent_fallback
      description: "Particle settling velocity in m/s instead of m/day (86400x) deposits all particles in a single timestep."
      severity: silent
    - id: "porosity_percent_vs_fraction"
      kind: soil_semantic
      description: "Porosity entered as percent (40) instead of fraction (0.40) makes porosity > 1, immediately destabilizing the Richards solver (NaN/divergence in the first timestep)."
      severity: fatal
    - id: "nonpositive_ks_jacobian_divergence"
      kind: numerical_instability
      description: "Negative or zero Ks (e.g., from bad pedotransfer inputs) causes division-by-zero in the Darcy flux; the Newton-Raphson solver cannot form a valid Jacobian and stalls at dt_min."
      severity: fatal
  validation_limits:
    - "Each block is 0-D or 1-D; no full 2-D/3-D spatial resolution or domain decomposition, so lateral heterogeneity within a practice is not resolved."
    - "Water-quality kinetic parameters (denitrification, oxygen transfer) are often weakly identifiable from outflow monitoring data alone, limiting confidence in WQ predictions."
    - "No real-basin validation case is established in the KI (validation is synthetic); quantitative parameter ranges and limits are not declared in the public documentation."
  warnings:
    - "A cumulative mass-balance error > 1e-6 signals numerical non-closure; loosening the Newton-Raphson tolerance beyond ~1e-3 yields poor mass balance."
    - "Adaptive time step must satisfy dt_min < dt_initial < dt_max, with dt_max <= ~0.1 day, or rapid wet events are skipped."
    - "Constituent and mass-balance units are user-defined; the solver enforces no canonical unit, so consistency across all block ICs, inflows, and rate constants is the user's responsibility."
  assumptions:
    - statement: "Each block is treated as a 0-D or 1-D control volume; the simulated domain is a network of such blocks with no within-block lateral resolution."
      scope: "spatial geometry"
      source: "GIFMod block-connector architecture (gifmod.com/about) and Massoudieh et al. 2017"
      status: adopted
    - statement: "Mass-balance closure is enforced for water and for each transported constituent; ET is a demand-side flux, not a closed surface energy budget."
      scope: "conservation / closure"
      source: "GIFMod hydraulics and reactive-transport formulation (Massoudieh et al. 2017; gifmod.com/about)"
      status: adopted
    - statement: "Unsaturated flow follows Richards with van Genuchten-Mualem retention, saturated media follow Darcy, and surface/channel flow follows Manning/diffusive-wave."
