      root_cause: "Coarse resolution smooths precipitation and terrain, reducing runoff generation"
      explanation: >
        Chaohe at 0.1° gives Q=17.8 m³/s (ratio 0.77 to VIC) vs 0.25° Q=5.8 (ratio 0.25).
        Resolution affects VOLUME (3× more at finer grid) but NOT event timing (r still near 0).
        Noah-MP absorbs all rainfall into soil at both resolutions — the missing storm peaks
        are a physics issue (Schaake infiltration), not resolution. The baseflow envelope
        rises with finer resolution because more precipitation is captured, but individual
        storm events are still damped by the infiltration scheme.
      affected_components: ["s1_domain", "s9_namelists"]
    remedy:
      action: "Use 0.1° for Chinese basins < 50,000 km². For storm peaks, tune REFKDT parameter in soil_properties.nc"
      tool_to_run: ""
      manual_steps:
        - "Resolution: --dx_deg 0.1 for basins < 50,000 km²"
        - "Storm response: reduce REFKDT from 3.0 to 0.5-1.0 (increases surface runoff)"
        - "Or: increase slope parameter (currently 0.1 everywhere)"
      prevention: "Default to 0.1° for all Chinese basins in pipeline"
    severity: "silent"
    cross_references: ["dt_v015", "dt_v018"]
    verified: "2026-03-20"

  - id: dt_v021
    stage: "s4_fulldom"
    failure_domain: "parameter_format"
    symptom:
      description: "Fixed stream_threshold doesn't work across resolutions — too many channels at coarse, too few at fine"
      error_pattern: "channels.*100%|channels.*0"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "NCAR default (200 cells) and USGS 1-cfs both fail at extreme resolutions"
      explanation: >
        NCAR default 200 cells: at 7km routing (0.25° AGGFACTRT=4), basin with 170 cells
        gets zero channels. At 250m routing, 200 is too few for large basins.
        USGS 1-cfs: at 7km cells, every cell has flow > 1 cfs (all become channels).
        At 250m cells, 1 cfs needs ~115 cells (reasonable).
        Solution: hybrid approach using Budyko runoff ratio for fine grids (<500m),
        scale-aware 2% density for coarse grids (>=500m).
      affected_components: ["s4_fulldom"]
    remedy:
      action: "Use --stream_threshold 0 (auto) in build_fulldom_hires.py"
      tool_to_run: "build_fulldom_hires"
      manual_steps:
        - "Default is now 0 (auto): uses USGS/Budyko for fine grids, 2% for coarse"
        - "Override with --stream_threshold N for manual control"
        - "smart_stream_threshold() function handles all resolutions"
      prevention: "build_fulldom_hires.py defaults to auto threshold (0)"
    severity: "silent"
    cross_references: ["dt_v016"]
    verified: "2026-03-21"

  # ===========================================================================
  # ADDITIONAL ERRORS (audit 2026-03-21)
  # ===========================================================================

  - id: dt_v022
    stage: "s8_forcing"
    failure_domain: "unit_conversion"
    symptom:
      description: "SWDOWN extrapolated to 1026+ W/m2 at grid edges by scipy.griddata — exceeds solar constant (1361 W/m2). Combined with 3-hour step-function temporal interpolation, causes sustained overheating and Noah-MP energy balance instability."
      error_pattern: "SWDOWN.*1[0-9]{3}"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "scipy.griddata extrapolates beyond input range at domain edges where VIC grid does not fully cover the WRF-Hydro LCC domain"
      explanation: >
        When the WRF-Hydro LCC domain extends beyond the VIC grid coverage, scipy.griddata
        with method='linear' extrapolates, producing SWDOWN values exceeding the physical
        maximum. For Bengbu 1km domain, edge cells received SWDOWN=1026 W/m2 when
        surrounding cells were 200-400 W/m2. Combined with 3-hour constant blocks
        (not truly hourly interpolation), sustained high radiation caused Noah-MP TG
        to exceed 600K. Physical max is 1361 W/m2 (solar constant at top of atmosphere).
      affected_components:
        - "convert_forcing_to_ldasin.py"
        - "LDASIN_DOMAIN1 SWDOWN"
    remedy:
      action: "Cap SWDOWN at 1361 W/m2 after spatial interpolation"
      tool_to_run: "convert_forcing_to_ldasin"
      manual_steps:
        - "After griddata interpolation: swdown = np.clip(swdown, 0, 1361.0)"
        - "Check edge cells specifically: if any SWDOWN > 800 at high latitudes, likely extrapolation"
      prevention: "convert_forcing_to_ldasin.py and cmfd_to_ldasin.py both clip SWDOWN post-interpolation"
    severity: "degraded"
    cross_references: ["dt_v005", "dt_v008"]
    verified: "2026-03-20"

  - id: dt_v023
    stage: "s3_wrfinput"
    failure_domain: "runtime"
    symptom:
      description: "Noah-MP crash 'SMCRT fully depleted upon disaggregation' during January cold start — all soil moisture is frozen (SICE=SMC, no liquid water)"
      error_pattern: "SMCRT fully depleted"
      detection_method: "log_match"
    diagnosis:
      root_cause: "January cold start initializes soil moisture uniformly, but in continental winter climates all moisture freezes. Noah-MP soil layer disaggregation requires non-zero liquid water."
      explanation: >
        In cold-start mode, soil moisture (SMC) is initialized at reference moisture (REFSMC).
        For January in continental basins (Bengbu at 33°N), soil temperature (TSLB) is below
        freezing. Noah-MP's freeze/thaw routine converts all liquid water to ice (SICE=SMC,
        SH2O=0). When the vertical disaggregation step tries to redistribute liquid water
        across sub-layers, it encounters SMCRT=0 and fails with a fatal assertion.
        Starting in a warmer month (Apr-Jul) avoids this because some liquid water remains.
      affected_components:
        - "wrfinput_d01.nc SMOIS/TSLB"
        - "Noah-MP module_sf_noahmplsm.F"
    remedy:
      action: "Start cold-start simulations in summer months (Apr-Jul). For winter analysis, first run a summer-start spinup, save RESTART file, then use that for the winter run."
      tool_to_run: ""
      manual_steps:
        - "Change start date in namelist.hrldas to July 1 of the preceding year"
        - "Or: manually set SH2O > 0 in wrfinput_d01.nc for cold cells"
        - "Or: use RESTART file from a prior warm-month spinup"
      prevention: "Pipeline wrapper warns if cold-start month is Nov-Feb for basins north of 25°N"
    severity: "fatal"
    cross_references: ["dt_v014"]
    verified: "2026-03-20"

  - id: dt_v024
    stage: "s9_namelists"
    failure_domain: "dependency_mismatch"
    symptom:
      description: "CHRTOUT_DOMAIN silently reverts to 0 when pipeline wrapper regenerates namelists, causing no CHRTOUT output files to be written despite manual fix"
      error_pattern: "CHRTOUT_DOMAIN.*=.*0"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "run_wrfhydro_full_pipeline.py calls generate_namelists.py which overwrites hydro.namelist with default CHRTOUT_DOMAIN=0 AFTER manual edits"
      explanation: >
        The pipeline wrapper calls generate_namelists.py as a late-stage step, overwriting
        any manual edits to hydro.namelist. If a user (or automated fix) sets CHRTOUT_DOMAIN=1
        before running the pipeline, the pipeline regenerates the file with the default value
        (CHRTOUT_DOMAIN=0), silently undoing the fix. The model runs successfully but produces
        no CHRTOUT files, making discharge extraction impossible. The user explicitly reported
        this: "CHRTOUT_DOMAIN = 0 this requires a permanent fix". sed-based fixes are also
        unreliable because they modify the file before the pipeline overwrites it.
      affected_components:
        - "run_wrfhydro_full_pipeline.py"
        - "tools/s9_namelists/generate_namelists.py"
        - "hydro.namelist CHRTOUT_DOMAIN"
    remedy:
      action: "Fix generate_namelists.py to default CHRTOUT_DOMAIN=1. Apply post-pipeline verification using Python str.replace()."
      tool_to_run: "generate_namelists"
      manual_steps:
        - "After pipeline: verify CHRTOUT_DOMAIN=1 in hydro.namelist"
        - "If 0: python -c \"f='hydro.namelist'; c=open(f).read(); open(f,'w').write(c.replace('CHRTOUT_DOMAIN = 0','CHRTOUT_DOMAIN = 1'))\""
        - "NEVER use sed -i on pipeline scripts (empties files on this system)"
      prevention: "generate_namelists.py now defaults CHRTOUT_DOMAIN=1; pipeline wrapper verifies after generation"
    severity: "silent"
    cross_references: ["dt_015"]
    verified: "2026-03-20"

  - id: dt_v035
    stage: "s4_fulldom"
    failure_domain: "missing_variable"
    symptom:
      description: "WRF-Hydro crashes with MPI_Abort after reading GWBUCKPARM.nc. Log shows 'WARNING: get2d_real: failed to find the variables: CHAN_DEPTH'."
      error_pattern: "failed to find the variables: CHAN_DEPTH"
      detection_method: "log_match"
    diagnosis:
      root_cause: "Fulldom_hires.nc was built without CHAN_DEPTH variable. WRF-Hydro requires channel bankfull depth for Muskingum-Cunge routing. This bug is RESOLUTION-DEPENDENT: at coarse grids (0.25°, ~25 cells) WRF-Hydro falls back to defaults silently. At fine grids (0.1°, 100+ cells) it crashes with MPI_Abort. The fix is always needed for correct channel geometry."
      explanation: >
        The build_fulldom_hires.py tool originally did not generate CHAN_DEPTH.
        WRF-Hydro reads it after GWBUCKPARM.nc and crashes if missing.
        Channel depth should be estimated from Strahler stream order.
      affected_components:
        - "Fulldom_hires.nc"
        - "build_fulldom_hires.py"
    remedy:
      action: "Add CHAN_DEPTH variable to Fulldom_hires.nc based on stream order: order 1=0.5m, 2=1.0m, 3=1.5m, 4=2.0m, 5+=3.0m"
      tool_to_run: "build_fulldom_hires.py (updated version adds CHAN_DEPTH automatically)"
      manual_steps:
        - "python -c \"from netCDF4 import Dataset; import numpy as np; ds=Dataset('Fulldom_hires.nc','r+'); ...\""
    severity: "fatal"
    cross_references: ["dt_003"]

  - id: dt_wrfh_harmless_01
    stage: s8_execution
    symptom:
      description: "WARNING: LDASIN file has a perverse version identifier ldasin_version = 0"
    diagnosis:
      root_cause: "LDASIN forcing files were created without version metadata. This is cosmetic."
    remedy:
      action: "Ignore. This warning does not affect simulation results."
    severity: harmless

  - id: dt_wrfh_harmless_02
    stage: s8_execution
    symptom:
      description: "SNOW HEIGHT NOT FOUND - VALUE DEFINED IN LSMINIT"
    diagnosis:
      root_cause: "No snow initialization file provided. WRF-Hydro uses default values from LSMINIT."
    remedy:
      action: "Ignore for warm-start basins (spring/summer start). For winter starts, provide RESTART file."
    severity: harmless

  - id: dt_wrfh_refkdt_location
    stage: s9_calibration
    symptom:
      description: "IndexError: REFKDT not found when trying to read/modify geo_em.d01.nc"
    diagnosis:
      root_cause: "REFKDT is in soil_properties.nc, NOT geo_em.d01.nc. This is the #1 parameter location confusion."
    remedy:
      action: "Read/write REFKDT from DOMAIN/soil_properties.nc, not geo_em.d01.nc"
    severity: critical

  - id: dt_v036
    stage: "s4_fulldom"
    failure_domain: "silent_error"
    symptom:
      description: "WRF-Hydro segfaults silently after 3-20 days. No error message in diag_hydro. MPI process exits with code 1. Common in coastal or arid basins."
      error_pattern: "Process name: ... Exit code: 1 (no diag error)"
      detection_method: "process_exit_code"
    diagnosis:
      root_cause: "TOPOGRAPHY=0 cells in Fulldom_hires.nc and/or HGT_M=0 in geo_em/wrfinput. Occurs when basin grid extends beyond DEM coverage (coastal cells, ocean). Zero elevation causes division-by-zero in routing slope calculations, leading to segfault."
      explanation: >
        The DEM does not cover ocean/coastal cells. build_fulldom_hires.py fills these
        with 0 elevation. During routing, slope = elevation_drop / distance becomes 0/0
        or produces NaN, causing floating point exception on specific MPI processes.
        Also SMOIS=0 at these cells triggers SMCRT depletion crash.
      affected_components:
        - "Fulldom_hires.nc TOPOGRAPHY"
        - "wrfinput_d01.nc SMOIS"
        - "geo_em.d01.nc HGT_M"
    remedy:
      action: >
        1. Set minimum TOPOGRAPHY > 1m for all land cells in Fulldom_hires.nc
        2. Set minimum SMOIS > 0.15 for all cells in wrfinput_d01.nc
        3. Mask out ocean cells using LU_INDEX=16 (water)
        4. For coastal basins, ensure DEM covers the full grid extent
      tool_to_run: "build_fulldom_hires.py + manual post-processing"
    severity: "fatal"
    cross_references: ["dt_v023", "dt_v012"]

  # === Arid Basin Trap Cascade (Spain GRDC_6217140 test, 2026-04-03) ===
  # These 3 crashes occur IN SEQUENCE — each masks the next.
  # Must fix ALL THREE simultaneously for arid/semi-arid basins.

  - id: dt_v037
    stage: "s6_groundwater"
    failure_domain: "parameter_format"
    symptom:
      description: "WRF-Hydro crashes with 'ERROR: Unable to create LDASOUT NetCDF file' or 'ERROR: Unable to create RT_DOMAIN NetCDF file' at the second output timestep."
      error_pattern: "Unable to create LDASOUT NetCDF file"
      detection_method: "log_match"
    diagnosis:
      root_cause: "GEOGRID_LDASOUT_Spatial_Metadata.nc missing 'resolution' attribute on x and y variables. The NetCDF output writer uses this attribute to construct the output grid dimensions."
      explanation: >
        build_groundwater.py creates the metadata file but may not add the 'resolution'
        attribute to x/y coordinate variables. The first output file is created from
        in-memory dimensions, but subsequent files fail when reading spatial metadata.
        This is the FIRST crash in the arid basin cascade — it masks dt_v038 and dt_v036.
      affected_components:
        - "GEOGRID_LDASOUT_Spatial_Metadata.nc"
        - "build_groundwater.py"
    remedy:
      action: "Add resolution attribute to x/y variables in metadata file, OR disable LDASOUT output"
      tool_to_run: "Post-processing: ds['x'].resolution = float(dx); ds['y'].resolution = float(dx)"
      manual_steps:
        - "Quick fix: set OUTPUT_TIMESTEP = 0 in namelist.hrldas to disable LDASOUT"
        - "Proper fix: add resolution attribute after build_groundwater.py runs"
    severity: "fatal"
    cross_references: ["dt_002", "dt_003", "dt_v038", "dt_v036"]

  - id: dt_v038
    stage: "s10_execution"
    failure_domain: "parameter_format"
    symptom:
      description: "WRF-Hydro crashes with 'In RESTART_OUT_nc() - Problem nf90_create' when writing restart files."
      error_pattern: "RESTART_OUT_nc.*nf90_create"
      detection_method: "log_match"
    diagnosis:
      root_cause: "Restart file writer fails due to spatial metadata issues or file system constraints. With rst_dt=1440 (daily) and RESTART_FREQUENCY_HOURS=-9999, the model writes restart files every output step, amplifying the failure."
      explanation: >
        This is the SECOND crash in the arid basin cascade. After fixing dt_v037
        (LDASOUT creation), the model runs further but crashes when trying to write
        restart files. The restart writer has similar spatial metadata requirements.
        This crash masks dt_v036 (the soil moisture depletion crash).
      affected_components:
        - "hydro.namelist rst_dt"
        - "namelist.hrldas RESTART_FREQUENCY_HOURS"
    remedy:
      action: "Disable restart file writing entirely for test runs"
      manual_steps:
        - "Set rst_dt = -99999 in hydro.namelist"
        - "Set RESTART_FREQUENCY_HOURS = 0 in namelist.hrldas"
        - "For production runs, fix the metadata file instead (see dt_v037)"
    severity: "fatal"
    cross_references: ["dt_v037", "dt_v036"]

  # ===========================================================================
  # PHYSICS OPTIONS AUDIT (2026-03-31)
  # ===========================================================================

  - id: dt_v039
    stage: "s9_namelists"
    failure_domain: "silent_error"
    symptom:
      description: "rt_option=2 (CASC2D multi-directional overland flow) produces wrong routing results or does not function. The option exists in the namelist but is NOT ACTIVE in WRF-Hydro v5.2.0."
      error_pattern: "rt_option.*2|CASC2D"
      detection_method: "config_review"
    diagnosis:
      root_cause: "CASC2D multi-directional overland flow routing is listed as an option (rt_option=2) in the hydro.namelist documentation but is explicitly marked 'not active' in the WRF-Hydro source code. The code path may compile but does not produce physically correct routing."
      explanation: >
        The WRF-Hydro appendix states: 'rt_option: 1=Steepest Descent (D8), 2=CASC2D (not active)'.
        Only rt_option=1 (steepest descent D8) is supported. Setting rt_option=2 may not crash
        but will silently produce incorrect overland flow routing. Always use rt_option=1.
      affected_components:
        - "hydro.namelist rt_option"
    remedy:
      action: "Set rt_option=1 (steepest descent D8) in hydro.namelist. Do not use rt_option=2."
      tool_to_run: "generate_namelists"
      manual_steps:
        - "In hydro.namelist: rt_option = 1"
        - "generate_namelists.py already defaults to rt_option=1"
      prevention: "generate_namelists.py should reject rt_option=2 with a clear error message"
    severity: "silent"
    cross_references: []

  - id: dt_v040
    stage: "s6_groundwater"
    failure_domain: "silent_error"
    symptom:
      description: "GWBASESWCRT=0 causes water to silently leave the system — all subsurface drainage from the bottom soil layer is discarded, creating a water balance sink with no error message."
      error_pattern: "GWBASESWCRT.*=.*0|water_balance.*not.*close"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "When GWBASESWCRT=0, the groundwater bucket model is disabled entirely. Water draining from the bottom of Noah-MP's soil column exits the system with no pathway back to the channel network. This breaks mass conservation."
      explanation: >
        The WRF-Hydro documentation states: 'Option 0 creates a sink at the bottom of the soil
        column (water draining from the bottom of the soil column leaves the system, so note
        that this option will not have water balance closure).' This is a silent error because
        the model runs without any error or warning, but the water budget will not close and
        baseflow will be zero. Use GWBASESWCRT=1 (exponential bucket) or GWBASESWCRT=2
        (pass-through) to maintain mass conservation.
      affected_components:
        - "hydro.namelist GWBASESWCRT"
        - "GWBASINS.nc"
        - "GWBUCKPARM.nc"
    remedy:
      action: "Set GWBASESWCRT=1 (exponential bucket) or GWBASESWCRT=2 (pass-through) instead of 0"
      tool_to_run: "generate_namelists"
      manual_steps:
        - "In hydro.namelist: GWBASESWCRT = 1"
        - "Ensure GWBASINS.nc and GWBUCKPARM.nc exist in DOMAIN/"
      prevention: "generate_namelists.py should warn if GWBASESWCRT=0"
    severity: "silent"
    cross_references: ["dt_v013", "dt_v017"]

  - id: dt_v041
    stage: "s4_fulldom"
    failure_domain: "silent_error"
    symptom:
      description: "lake_option=0 with gridded channel routing (channel_option=3) where lake cells mask out channel cells in Fulldom_hires.nc produces disconnected channel network and wrong discharge."
      error_pattern: "lake_option.*=.*0.*channel|streamflow.*zero.*lake"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "When Fulldom_hires.nc has lake cells that overlay and mask channel grid cells, setting lake_option=0 (lakes off) prevents the lake routing module from passing water through these cells. The channel network becomes disconnected at lake locations, blocking upstream flow from reaching the outlet."
      explanation: >
        In gridded routing domains that include lakes, the Fulldom_hires.nc CHANNELGRID and
        LAKEGRID variables interact. Lake cells in Fulldom typically replace channel cells at
        lake locations. With lake_option=1 (level pool), the lake module handles water storage
        and release, maintaining continuity. With lake_option=0, these cells are neither channel
        nor lake — they become dead zones that block flow. The symptom is zero or very low
        discharge downstream of any lake location, with no error message. If your domain has
        lakes in the channel network, you MUST use lake_option >= 1 with a valid LAKEPARM.nc.
        If no lakes exist in the domain, lake_option=0 is safe.
      affected_components:
        - "hydro.namelist lake_option"
        - "Fulldom_hires.nc LAKEGRID"
        - "LAKEPARM.nc"
    remedy:
      action: "Set lake_option=1 and provide LAKEPARM.nc if lakes exist in routing domain. Or rebuild Fulldom without lake masking."
      tool_to_run: ""
      manual_steps:
        - "Check if lakes exist: python -c \"import netCDF4 as nc; ds=nc.Dataset('DOMAIN/Fulldom_hires.nc'); print('Lake cells:', (ds['LAKEGRID'][:]>0).sum() if 'LAKEGRID' in ds.variables else 'No LAKEGRID variable')\""
        - "If lake cells > 0: set lake_option=1 and provide route_lake_f='./DOMAIN/LAKEPARM.nc'"
        - "If no LAKEGRID variable or zero lake cells: lake_option=0 is safe"
      prevention: "generate_namelists.py should check for LAKEGRID in Fulldom and warn if lake_option=0 with lake cells present"
    severity: "silent"
    cross_references: []


  - id: dt_v042
    stage: "s10_execution"
    failure_domain: "silent_error"
    symptom:
      description: "Any RUNOFF_OPTION other than 3, any channel_option other than 3, or any GWBASESWCRT other than 1 crashes within 0-7 days on global basins. SMCRT fully depleted or silent segfault."
      error_pattern: "SMCRT fully depleted|MPI_Abort|Exit code: 1"
      detection_method: "matrix_test"
    diagnosis:
      root_cause: "Noah_distr_routing.F:1143 crashes when SMCRT<=0 (dry soil). Only Schaake96 (RUNOFF_OPTION=3) maintains high enough soil moisture to prevent depletion. TOPMODEL, BATS, and passthrough GW all drain faster, triggering the crash. Reach-based routing (ch_opt 1,2) has additional GWBUCKPARM/UDMP format requirements."
      explanation: >
        Matrix test of 24 configurations (8 physics combos × 3 global basins) showed
        ONLY Config A (RO=3, ch=3, GW=1) is production-ready. All other combinations crash
        identically across mountain (Kettle), tropical (Balsas), and oceanic (Clutha) basins.
        The WRF-Hydro source has a frozen-soil workaround at line 1154 but NO dry-soil
        workaround. Until the Fortran source is patched, only Config A should be used.
      affected_components:
        - "Noah_distr_routing.F disaggregateDomain()"
        - "RUNOFF_OPTION in namelist.hrldas"
        - "channel_option, GWBASESWCRT in hydro.namelist"
    remedy:
      action: "Use ONLY Config A: RUNOFF_OPTION=3, channel_option=3, GWBASESWCRT=1. For other options, patch Noah_distr_routing.F line 1159 to set SMCRT=0.001 instead of calling hydro_stop()."
      manual_steps:
        - "In namelist.hrldas: RUNOFF_OPTION = 3"
        - "In hydro.namelist: channel_option = 3, GWBASESWCRT = 1, UDMP_OPT = 0"
        - "To enable other options: edit Noah_distr_routing.F, add dry-soil workaround, recompile"
    severity: "fatal"
    cross_references: ["dt_v036"]
