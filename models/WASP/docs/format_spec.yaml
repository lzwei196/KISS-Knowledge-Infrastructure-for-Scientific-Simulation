- id: dt_wasp_006
  symptom: Lake area is 100x too large; volume and residence time calculations are wrong
  diagnosis: Lake area provided in hectares instead of km2; HydroLAKES reports lake area in km2, but some
    auxiliary datasets (e.g., national lake registries) use hectares. 1 km2 = 100 ha. If area in hectares
