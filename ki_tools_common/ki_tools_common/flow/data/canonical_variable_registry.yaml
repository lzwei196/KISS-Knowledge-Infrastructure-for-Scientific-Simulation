      severity: critical
      detection: automatable
      fix: Use transform_semantic with cell area, NOT convert_units
    - trap_id: discharge_area_mismatch
      description: Wrong cell area for discharge↔runoff conversion. Use SOURCE cell area for discharge→runoff.
