package:
  name: GIFMod
  version: 0.1.0
  description: >
    Knowledge infrastructure for GIFMod (Green Infrastructure Flexible Model),
    a physically-based block-structured water quality and hydrodynamic modeling
    system for green infrastructure components including bioretention cells,
    constructed wetlands, porous pavements, and urban drainage networks.
  target_model: GIFMod 0.1.26
  domain: urban
  authors:
    - US EPA
  license: GPL-3.0
  created: '2026-03-28'

pipeline:
  stages:
    - id: s0_config
      name: Configuration
      description: Set simulation period, solver settings, output paths
      order: 0
      depends_on: []
      skill_document: docs/s0_configuration.md
      tools: [configure_gifmod]
      milestones:
        - id: m0_config_defined
          description: Project configuration defined with valid solver parameters
          verification: dt_initial < dt_max and simulation_duration > 0

    - id: s1_domain
      name: Domain Setup
      description: Define block layout, types, and connectivity in GUI or via script
      order: 1
      depends_on: [s0_config]
      skill_document: null
      tools: []
      milestones:
        - id: m1_blocks_defined
          description: All blocks and connectors placed with valid topology
          verification: Each block has at least one connection

    - id: s2_soil
      name: Soil Parameters
      description: Convert HWSD/SoilGrids soil data to GIFMod Soil block properties
      order: 2
      depends_on: [s1_domain]
      skill_document: docs/s2_soil_parameters.md
      tools: [convert_soil_params]
      milestones:
        - id: m2_soil_assigned
          description: All Soil blocks have valid hydraulic properties in m/day units
          verification: Ks > 0 and porosity in [0.2, 0.65] for all layers

    - id: s3_vegetation
      name: Vegetation / Land Cover
      description: Assign vegetation properties (LAI, root depth) to Plant blocks
      order: 3
      depends_on: [s1_domain]
      skill_document: null
      tools: []
      milestones:
        - id: m3_veg_assigned
          description: Plant blocks have valid LAI and root depth values
          verification: LAI >= 0 and root_depth > 0

    - id: s4_forcing
      name: Meteorological Forcing
      description: Convert met data to GIFMod CSV time series with correct units
      order: 4
      depends_on: [s1_domain]
      skill_document: docs/s4_forcing.md
      tools: [convert_forcing]
      milestones:
        - id: m4_forcing_ready
          description: Forcing CSV with precip in m/day, temp in C, humidity as fraction
          verification: Precip < 0.5 m/day for routine events, humidity in [0,1]

    - id: s5_parameters
      name: Model Parameters
      description: Set reaction rates, partition coefficients, and remaining properties
      order: 5
      depends_on: [s2_soil, s3_vegetation]
      skill_document: null
      tools: []
      milestones:
        - id: m5_params_set
          description: All block and connector properties set with consistent units
          verification: No missing required properties

    - id: s6_run
      name: Model Execution
      description: Build and run GIFMod binary
      order: 6
      depends_on: [s4_forcing, s5_parameters]
      skill_document: docs/s6_execution.md
      tools: [run_gifmod]
      milestones:
        - id: m6_run_complete
          description: Simulation completed without solver divergence
          verification: Output files exist and mass balance error < 1e-4

    - id: s7_postprocess
      name: Output Parsing
      description: Extract time series from GIFMod output to CSV
      order: 7
      depends_on: [s6_run]
      skill_document: docs/s7_output_parsing.md
      tools: [parse_gifmod_output]
      milestones:
        - id: m7_csv_ready
          description: Clean CSV with head, flow, concentration columns
          verification: CSV has header row and monotonically increasing time

    - id: s8_routing
      name: River Routing (optional)
      description: Route outflow through downstream network if needed
      order: 8
      depends_on: [s7_postprocess]
      skill_document: null
      tools: []
      milestones:
        - id: m8_routing_done
          description: Downstream routing completed or skipped
          verification: Outflow time series available

tools:
  - id: convert_forcing
    name: convert_forcing.py
    description: Convert meteorological forcing to GIFMod CSV format with unit conversions
    stage: s4_forcing
    script_path: tools/convert_forcing.py
    language: python
    inputs:
      - name: input
        type: file
        description: Input meteorological CSV with datetime and met variables
        required: true
        example: weather_station.csv
      - name: precip_unit
        type: string
        description: Precipitation unit in input data
        required: false
        example: mm/hr
      - name: temp_unit
        type: string
        description: Temperature unit in input data
        required: false
        example: celsius
      - name: start_date
        type: string
        description: Simulation start date (YYYY-MM-DD)
        required: true
        example: "2020-01-01"
    outputs:
      - name: output
        type: file
        description: GIFMod-format CSV with Time, Precipitation, Temperature, Humidity, WindSpeed
        path_pattern: "gifmod_forcing.csv"
    preconditions:
      - Input CSV has datetime column
      - Valid unit specifications
    postconditions:
      - Precipitation in m/day
      - Temperature in Celsius
      - Humidity as fraction [0,1]

  - id: convert_soil_params
    name: convert_soil_params.py
    description: Convert HWSD/SoilGrids soil data to GIFMod block properties
    stage: s2_soil
    script_path: tools/convert_soil_params.py
    language: python
    inputs:
      - name: input
        type: file
        description: Soil data CSV with sand/clay/bulk_density columns
        required: true
        example: hwsd_extract.csv
      - name: format
        type: string
        description: Input format (hwsd, soilgrids, usda, generic)
        required: false
        example: hwsd
    outputs:
      - name: output
        type: file
        description: JSON with Ks (m/day), porosity (fraction), bulk_density (kg/m^3)
        path_pattern: "soil_params.json"
    preconditions:
      - Input has sand and clay percentage columns
    postconditions:
      - Ks > 0 in m/day
      - Porosity in [0.2, 0.65]
      - Bulk density in [800, 2000] kg/m^3

  - id: run_gifmod
    name: run_gifmod.py
    description: Build and execute GIFMod from source
    stage: s6_run
    script_path: tools/run_gifmod.py
    language: python
    inputs:
      - name: source_dir
        type: directory
        description: Path to GIFMod source repository
        required: true
        example: /path/to/GIFMod/source/repo
      - name: mode
        type: string
        description: Operation mode (build, run, build-and-run)
        required: false
        example: build
    outputs:
      - name: binary_path
        type: file
        description: Path to compiled GIFMod executable
        path_pattern: "build/GIFMod"
    preconditions:
      - Qt5 development libraries installed
      - LAPACK/BLAS installed
      - GCC with C++14 support
    postconditions:
      - Binary exists and is executable

  - id: parse_gifmod_output
    name: parse_gifmod_output.py
    description: Parse GIFMod columnar output to CSV
    stage: s7_postprocess
    script_path: tools/parse_gifmod_output.py
    language: python
    inputs:
      - name: input
        type: file
        description: GIFMod raw output file
        required: true
        example: model_output.txt
      - name: variables
        type: string
        description: Comma-separated variable filter
        required: false
        example: Head,Flow,Concentration
    outputs:
      - name: output
        type: file
        description: Clean CSV with selected variables
        path_pattern: "results.csv"
    preconditions:
      - GIFMod output file exists and is non-empty
    postconditions:
      - CSV has header row
      - Time column is monotonically increasing

