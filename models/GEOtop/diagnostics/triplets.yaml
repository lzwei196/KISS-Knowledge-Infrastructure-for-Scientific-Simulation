# GEOtop Diagnostic Triplets
# Symptom -> Diagnosis -> Remedy entries for common failures
# Entries (20 when this header was written; current count: the SKILL.md KI map) covering unit conversions, parameter format, file structure, runtime, initialization

- id: dt_001
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Richards equation solver diverges within first few time steps. Model crashes or produces NaN."
    error_pattern: "not converging|diverge|NaN"
    detection_method: log_match
  diagnosis:
    root_cause: "Soil layer thickness Dz provided in meters instead of millimeters"
    explanation: "GEOtop expects Dz in mm. A 10cm layer should be 100, not 0.1. Sub-millimeter layers cause the solver to fail."
    affected_components: [water.balance, Richards3D]
  remedy:
    action: "Multiply Dz values by 1000 if currently in meters, or by 10 if in centimeters"
    tool_to_run: "convert_soil.py"
    manual_steps:
      - "Open soilXXXX.txt"
      - "Check Dz column: values should be 10-500 (mm), not 0.01-0.5 (m)"
      - "Multiply all Dz values by the appropriate factor"
    prevention: "convert_soil.py validates that Dz >= 1 mm"
  severity: fatal
  cross_references: [dt_002, dt_003]

- id: dt_002
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Unrealistically fast or slow infiltration. Soil drains instantly or stays permanently saturated."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Hydraulic conductivity Kh/Kv in cm/day or m/s instead of mm/s"
    explanation: "HWSD reports Ksat in cm/day. GEOtop expects mm/s (source constants.h jKn/jKl [mm/s]; shipped test B2_BeG_017 Kh=0.021). cm/day is 8640x too big; m/s is 1000x too small. A typical loam Ksat of 25 cm/day = 2.89E-03 mm/s."
    affected_components: [water.balance, Richards3D, Richards1D]
  remedy:
    action: "Convert Ksat from cm/day to mm/s: multiply by 10 then divide by 86400"
    tool_to_run: "convert_soil.py"
    manual_steps:
      - "Check Kh/Kv values in soilXXXX.txt"
      - "Should be in range about 1E-5 to 1 mm/s"
      - "If values are 1-1000, they are likely in cm/day"
      - "Divide cm/day by 8640 (= 86400 / 10); multiply m/s by 1000"
    prevention: "convert_soil.py flags Kh > 10 mm/s or < 1E-7 mm/s as a likely unit error"
  severity: silent
  cross_references: [dt_001, dt_003]

- id: dt_003
  stage: s2_soil
  failure_domain: unit_conversion
  symptom:
    description: "Soil moisture dynamics look wrong. Retention curve too flat or too steep."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Van Genuchten alpha in 1/cm instead of 1/mm"
    explanation: "Literature and Rosetta report alpha in 1/cm. GEOtop expects 1/mm. Factor is 10x. Typical alpha for loam: 0.011 (1/cm) = 0.0011 (1/mm)."
    affected_components: [water.balance, pedo.funct]
  remedy:
    action: "Divide alpha by 10 to convert from 1/cm to 1/mm"
    tool_to_run: "convert_soil.py"
    manual_steps:
      - "Check alpha column in soilXXXX.txt"
      - "Should be in range 0.0001 to 0.01 (1/mm)"
      - "If values are 0.001 to 0.1, they are likely in 1/cm"
      - "Divide by 10"
    prevention: "convert_soil.py warns if alpha > 0.1"
  severity: silent
  cross_references: [dt_001, dt_002]

- id: dt_004
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Total precipitation over the simulation is a clean multiple too high (3x at 3-hourly records, 24x at daily records) or 1000x off."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "The Iprec column read through HeaderIPrec holds the wrong unit: GEOtop reads it as an INTENSITY in mm/h (keywords.h:437), whatever the record spacing"
    explanation: "HeaderIPrec = precipitation intensity [mm/h]; HeaderPrec = precipitation in the meteo time step [mm/timestep] (keywords.h:437-438). fill_Pint (meteodata.cc:854-895) only converts a HeaderPrec column, and only when no intensity column is given; it never touches HeaderIPrec. A depth per record written under HeaderIPrec is applied in every hour of the record, so a 3-hourly depth is 3x and a daily depth 24x too big. Hourly records are right only by luck (mm per hour = mm/h). m/s or kg/m2/s sources are 1000x or 3600x off if not converted. Correction 2026-10-19: until then this entry said Iprec is the total mm accumulated in each time step (convert rates to mm per model step); that was wrong for HeaderIPrec, see dt_022 and dt_027."
    affected_components: [meteodata, snow, water.balance]
  remedy:
    action: "Write Iprec as mm/h: depth per record / (record length in hours)"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Determine the source precipitation unit and pass it with --precip-unit (csv)"
      - "Check the written file: Iprec x (dt/3600) summed over rows 2.. must equal the source depth for the window"
      - "Check GEOtop's output: point Prain_over_canopy + Psnow_over_canopy summed must equal that depth"
      - "Alternative (not used by the KI): keep mm per step but name the column with HeaderPrec; this is fatal with LinearInterpolation = 1 (input.cc:458-467)"
    prevention: "convert_forcing.py keeps a depth inside and writes depth/(dt/3600) since 2026-10-19; tests/test_forcing_timing.py runs the binary at dt 3600/10800/86400"
  severity: silent
  cross_references: [dt_005, dt_006, dt_022, dt_027]

- id: dt_005
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Evapotranspiration is near zero. Latent heat flux is negligible. Sensible heat unrealistically high."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Relative humidity provided as fraction (0-1) instead of percent (0-100)"
    explanation: "GEOtop expects RelHum as 0-100 (percent). A value of 0.5 is interpreted as 0.5% humidity, making the atmosphere extremely dry."
    affected_components: [energy.balance, vegetation, meteodata]
  remedy:
    action: "Multiply RelHum by 100 to convert from fraction to percent"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Check RelHum column in meteoXXXX.txt"
      - "If max value is ~1.0, it is in fraction"
      - "Multiply all values by 100"
    prevention: "convert_forcing.py warns if RelHum max <= 1.0"
  severity: silent
  cross_references: [dt_004, dt_007]

- id: dt_006
  stage: s4_forcing
  failure_domain: parameter_format
  symptom:
    description: "Simulation runs but results shifted in time. Seasonal patterns misaligned."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Date format is MM/DD/YYYY instead of DD/MM/YYYY"
    explanation: "GEOtop uses European date format (day first). Using American format causes months to be parsed as days and vice versa. Dates like 05/03/2009 become March 5 instead of May 3."
    affected_components: [meteodata, times]
  remedy:
    action: "Reformat dates to DD/MM/YYYY hh:mm"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Check date column in meteoXXXX.txt"
      - "Verify day comes before month"
      - "Reformat using: datetime.strftime('%d/%m/%Y %H:%M')"
    prevention: "convert_forcing.py always writes DD/MM/YYYY format"
  severity: silent
  cross_references: [dt_019]

- id: dt_007
  stage: s4_forcing
  failure_domain: parameter_format
  symptom:
    description: "Temperature or radiation is zero when it should not be. Flat forcing curves."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Missing values encoded as NaN, -999, or blank instead of -9999"
    explanation: "GEOtop only recognizes -9999 as nodata. Other missing value representations are parsed as literal values (NaN may become 0, -999 is treated as a real value)."
    affected_components: [meteodata, import_ascii]
  remedy:
    action: "Replace all missing values with -9999"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Open meteoXXXX.txt"
      - "Replace NaN, nan, -999, empty cells with -9999"
      - "Ensure no blank cells in the CSV"
    prevention: "convert_forcing.py replaces all NaN with -9999 on output"
  severity: silent
  cross_references: [dt_005, dt_016]

- id: dt_008
  stage: s3_vegetation
  failure_domain: unit_conversion
  symptom:
    description: "Canopy interception negligible or vegetation has no effect on energy balance."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "VegHeight provided in meters instead of millimeters"
    explanation: "GEOtop expects VegHeight in mm. A 4 m tree should be 4000 mm. If set to 4, GEOtop treats it as 4 mm (effectively bare ground)."
    affected_components: [vegetation, turbulence]
  remedy:
    action: "Multiply VegHeight by 1000 to convert from meters to millimeters"
    tool_to_run: ""
    manual_steps:
      - "Check VegHeight in geotop.inpts"
      - "Meadow: 300-600 mm, shrub: 1000-3000 mm, forest: 5000-30000 mm"
      - "If values are < 10, likely in meters"
    prevention: ""
  severity: silent
  cross_references: [dt_001]

- id: dt_009
  stage: s5_parameters
  failure_domain: parameter_format
  symptom:
    description: "Model fails to parse geotop.inpts. Error on first keyword or parameters have wrong values."
    error_pattern: "error reading|unknown keyword"
    detection_method: log_match
  diagnosis:
    root_cause: "Tab characters in geotop.inpts replaced by spaces"
    explanation: "GEOtop's parser expects TAB characters between key, =, and value. Some text editors auto-convert tabs to spaces."
    affected_components: [input, parameters]
  remedy:
    action: "Ensure geotop.inpts uses TAB characters for separation"
    tool_to_run: ""
    manual_steps:
      - "Open geotop.inpts in editor that shows whitespace"
      - "Verify tabs exist between key = value"
      - "Use: sed -i 's/  */ /g' then manually re-add tabs, or use a template"
    prevention: "Use the test case geotop.inpts as a template"
  severity: fatal
  cross_references: []

- id: dt_010
  stage: s1_domain
  failure_domain: file_structure
  symptom:
    description: "Solar radiation too high. No topographic shading effects visible."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Horizon file missing or not found at configured path"
    explanation: "When FlagSkyViewFactor=1 and HorizonMeteoStationFile is set, GEOtop expects horizon files. If missing, horizon angles default to 0 (no obstruction), over-predicting direct beam radiation."
    affected_components: [radiation, energy.balance]
  remedy:
    action: "Generate horizon files or set FlagSkyViewFactor=0"
    tool_to_run: ""
    manual_steps:
      - "Check if horizonXXXX.txt exists in sim directory"
      - "If not needed, set FlagSkyViewFactor = 0"
      - "If needed, generate from DEM using r.horizon in GRASS GIS"
    prevention: "run_geotop.py checks for horizon files when FlagSkyViewFactor=1"
  severity: silent
  cross_references: [dt_011]

- id: dt_011
  stage: s1_domain
  failure_domain: unit_conversion
  symptom:
    description: "Runoff too fast on steep slopes or too slow on gentle slopes."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Slope map in percent instead of degrees"
    explanation: "GEOtop expects slope in degrees (0-90). A 100% slope = 45 degrees. Using percent values directly overpredicts slopes for steep terrain."
    affected_components: [water.balance, supflow]
  remedy:
    action: "Convert slope from percent to degrees: atan(percent/100) * 180/pi"
    tool_to_run: ""
    manual_steps:
      - "Check slope.txt values"
      - "Degrees: 0-90 range; Percent: 0-inf range"
      - "Convert: slope_deg = atan(slope_pct / 100) * 57.2958"
    prevention: ""
  severity: silent
  cross_references: [dt_012, dt_013]

- id: dt_012
  stage: s1_domain
  failure_domain: unit_conversion
  symptom:
    description: "Radiation pattern completely wrong. Shadows in wrong direction."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Aspect map in radians instead of degrees"
    explanation: "GEOtop expects aspect in degrees from north clockwise (0-360). Using radians (0-2*pi) makes all aspects appear nearly flat."
    affected_components: [radiation, energy.balance]
  remedy:
    action: "Convert from radians to degrees: multiply by 180/pi"
    tool_to_run: ""
    manual_steps:
      - "Check aspect.txt values"
      - "Should be 0-360 (degrees)"
      - "If 0-6.28, multiply by 57.2958"
    prevention: ""
  severity: silent
  cross_references: [dt_011]

- id: dt_013
  stage: s1_domain
  failure_domain: file_structure
  symptom:
    description: "Segmentation fault or array bounds error on startup."
    error_pattern: "segfault|SIGSEGV|array bounds"
    detection_method: log_match
  diagnosis:
    root_cause: "Input maps have different grid dimensions (ncols, nrows, cellsize)"
    explanation: "All ESRI ASCII maps must have identical grid specs. If dem.txt is 100x100 but slope.txt is 99x100, array indexing fails."
    affected_components: [input, geomorphology]
  remedy:
    action: "Ensure all maps share identical ncols, nrows, xllcorner, yllcorner, cellsize"
    tool_to_run: ""
    manual_steps:
      - "Compare headers of all .txt map files"
      - "Re-derive slope/aspect from the same DEM"
      - "Use same GDAL processing chain for all maps"
    prevention: ""
  severity: fatal
  cross_references: [dt_010]

- id: dt_014
  stage: s2_soil
  failure_domain: parameter_format
  symptom:
    description: "Model crashes immediately with soil-related error."
    error_pattern: "theta|water content"
    detection_method: log_match
  diagnosis:
    root_cause: "Residual water content (vwc_r) greater than or equal to saturated content (vwc_s)"
    explanation: "Van Genuchten model requires theta_r < theta_s. If values are swapped or incorrect, the retention curve is undefined."
    affected_components: [water.balance, pedo.funct]
  remedy:
    action: "Verify vwc_r < vwc_w < vwc_fc < vwc_s for all layers"
    tool_to_run: "convert_soil.py"
    manual_steps:
      - "Check soil file columns are in correct order"
      - "Verify no copy-paste errors in parameter values"
    prevention: "convert_soil.py validates theta ordering"
  severity: fatal
  cross_references: [dt_001, dt_015]

- id: dt_015
  stage: s2_soil
  failure_domain: parameter_format
  symptom:
    description: "Floating point exception in soil hydraulic calculations."
    error_pattern: "FPE|floating point|division by zero"
    detection_method: log_match
  diagnosis:
    root_cause: "Van Genuchten n parameter less than 1.0"
    explanation: "The Van Genuchten model requires n > 1. The m parameter is computed as m = 1 - 1/n. If n <= 1, m is non-positive, causing division by zero or undefined behavior."
    affected_components: [water.balance, pedo.funct]
  remedy:
    action: "Ensure n > 1.0 for all soil layers"
    tool_to_run: "convert_soil.py"
    manual_steps:
      - "Check n column in soilXXXX.txt"
      - "Typical range: 1.1 to 3.0"
      - "If n = 1.0 or less, use a minimum of 1.05"
    prevention: "convert_soil.py enforces n > 1.0"
  severity: fatal
  cross_references: [dt_014]

- id: dt_016
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Shortwave radiation values unrealistically high (>2000 W/m2) or always zero."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Accumulated radiation (J/m2) not converted to instantaneous (W/m2)"
    explanation: "ERA5 provides radiation as accumulated J/m2 over the forecast step. GEOtop expects instantaneous W/m2. Dividing by the time step in seconds converts correctly."
    affected_components: [radiation, energy.balance]
  remedy:
    action: "Divide accumulated radiation by time step in seconds"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Check if radiation values exceed 1400 W/m2 (solar constant)"
      - "If values are in J/m2 (e.g., millions), divide by dt_seconds"
      - "ERA5: divide by 3600 for hourly data"
    prevention: "convert_forcing.py warns if Swglobal > 1400"
  severity: silent
  cross_references: [dt_004, dt_005]

- id: dt_017
  stage: s6_run
  failure_domain: file_structure
  symptom:
    description: "Model cannot find input files despite them existing in the directory."
    error_pattern: "cannot open|file not found"
    detection_method: log_match
  diagnosis:
    root_cause: "Simulation directory path is relative, not absolute"
    explanation: "GEOtop resolves file paths relative to the simulation directory. If the sim dir path is relative, the working directory at execution time affects path resolution."
    affected_components: [input, import_ascii]
  remedy:
    action: "Always use absolute paths for the simulation directory"
    tool_to_run: "run_geotop.py"
    manual_steps:
      - "Use: ./geotop /absolute/path/to/sim_dir"
      - "Not: ./geotop sim_dir or ./geotop ../sim_dir"
    prevention: "run_geotop.py converts paths to absolute before execution"
  severity: fatal
  cross_references: [dt_018]

- id: dt_018
  stage: s6_run
  failure_domain: runtime
  symptom:
    description: "Model runs but produces no output files."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Output file paths in geotop.inpts point to non-existent directory"
    explanation: "GEOtop does not create output directories automatically. If PointOutputFile = 'output-tabs/point' but output-tabs/ doesn't exist, output is silently skipped."
    affected_components: [output]
  remedy:
    action: "Create output directories before running"
    tool_to_run: "run_geotop.py"
    manual_steps:
      - "Read geotop.inpts for all output file paths"
      - "Create the directories: mkdir -p output-tabs output-maps"
    prevention: "run_geotop.py creates output directories before execution"
  severity: fatal
  cross_references: [dt_017]

- id: dt_019
  stage: s7_postprocess
  failure_domain: parameter_format
  symptom:
    description: "Parsed output dates are wrong. Time series alignment with observations fails."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Output date parsing assumes MM/DD instead of DD/MM"
    explanation: "GEOtop outputs dates in DD/MM/YYYY format. Pandas default parse assumes MM/DD. For ambiguous dates (e.g., 05/03/2009), the wrong month is assigned."
    affected_components: [parse_output]
  remedy:
    action: "Use dayfirst=True when parsing dates with pandas"
    tool_to_run: "parse_output.py"
    manual_steps:
      - "Use pd.to_datetime(dates, format='%d/%m/%Y %H:%M')"
      - "Or: pd.to_datetime(dates, dayfirst=True)"
    prevention: "parse_output.py uses explicit DD/MM/YYYY format string"
  severity: silent
  cross_references: [dt_006]

- id: dt_020
  stage: s4_forcing
  failure_domain: runtime
  symptom:
    description: "Energy balance not closing. Large residual between Rn and H+LE+G."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Both LWin and CloudTrans provided, causing double parameterization of longwave"
    explanation: "When LWinParameterization > 0 and both LWin and CloudTrans are provided (not -9999), GEOtop may use LWin directly but also adjust it via cloud transmissivity, causing inconsistency."
    affected_components: [radiation, energy.balance, clouds]
  remedy:
    action: "Provide either LWin OR CloudTrans, set the other to -9999"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "If measured LWin is available, set CloudTrans to -9999 for all rows"
      - "If only CloudTrans is available, remove LWin column or set to -9999"
      - "Set LWinParameterization = 4 for Brutsaert with Kimball correction"
    prevention: "convert_forcing.py warns if both LWin and CloudTrans are present"
  severity: degraded
  cross_references: [dt_016]

- id: dt_021
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Forcing lands at the wrong time: all weather one day early (output rain and air temperature match the meteo file shifted by exactly 1 day), or, with a fractional offset, daytime skin temperature ~5-10 K too cold and SWin out of phase."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "The JDfrom0 column does not equal GEOtop's own clock (Python days since 0001-01-01 + 367)"
    explanation: "GEOtop's clock is convert_dateeur12_JDfrom0 (times.cc:130-138): days = 1 + 366 + (year-1)*365 + leap days, i.e. Python (date - datetime(1,1,1)).days + 367 + hour/24 for every date. When the meteo file has a JDfrom0 column it is used AS IS to place the records and Date is ignored (fixing_dates, meteodata.cc:589-607). The sun follows the model clock (energy.balance.cc:117), not this column. History: the KI used +366.25 (records 1 day + 6 h early against the sun, fixed 2026-06-23), then +366, copied from the shipped Matsch_B2_Ref_007 meteo (734047.0 for 02/10/2009 00:00), which is itself one day off (its own output prints 02/10/2009 01:00 = 734048.041667; 9 of 12 shipped meteo files match the clock). +366 kept the daily shape, so it stayed hidden until 2026-10-19."
    affected_components: [meteodata, radiation, energy.balance, water.balance]
  remedy:
    action: "JDfrom0 = (date - datetime(1,1,1)).days + 367 + seconds/86400, written with 6 decimals (or drop the JDfrom0 column so GEOtop builds it from Date)"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Check a row: 01/11/2017 00:00 must be 737000.000000; 02/10/2009 01:00 must be 734048.041667"
      - "run_and_score.py check_meteo compares the whole JDfrom0 against the clock, not only its fraction"
      - "Do not anchor on the Matsch_B2/P2 or Muntatschini shipped meteo files: they are one day off"
    prevention: "convert_forcing.py date_to_jd_from0 uses +367 since 2026-10-19; tests/test_forcing_timing.py checks it 1900-2100 and with the binary"
  severity: silent
  cross_references: [dt_006, dt_007, dt_027]

- id: dt_022
  stage: s4_forcing
  failure_domain: unit_conversion
  symptom:
    description: "After changing the record spacing (--dt different from the input step) total precipitation is an exact small-integer multiple (3x, 8x, 24x) of the true amount, or state variables lag by half a step. No error is raised."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Iprec was linearly INTERPOLATED when the record spacing changed, instead of being redistributed as a depth; or interval means were interpolated between interval ends"
    explanation: "Inside convert_forcing.py the record at t holds the depth over (t-dt, t] (GEOtop uses a record stamped t for (t-dt, t], meteodata.cc:137-245). Interpolating the depth copies the same depth into each sub-record (native_step / target_step too much). For state columns each record is a mean over its interval, so it sits at the interval centre t - step/2; interpolating between interval ends lags by (native - dt)/2. (Correction 2026-10-19: this entry used to say fill_Pint divides Iprec by the record spacing. It does not; see dt_004.)"
    affected_components: [meteodistr, water.balance, pedo.funct]
  remedy:
    action: "Resample Iprec depth-conservingly (split on upsample, sum on downsample) and interpolate state columns between interval centres. Best: set --dt to the forcing's NATIVE step so no resampling happens at all."
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Compare the meteo file's depth (Iprec x dt/3600, rows 2..) against the source dataset total for the same period"
      - "For CMFD 3-hourly use --dt 10800; for MSWX 3-hourly --dt 10800; for a daily source --dt 86400"
      - "The written Iprec is mm/h (dt_004); the division by dt/3600 happens once, when writing"
    prevention: "convert_forcing.py to_grid splits/sums Iprec by depth and interpolates state columns at interval centres (2026-10-19)"
  severity: silent
  cross_references: [dt_004, dt_026]

- id: dt_023
  stage: s7_output
  failure_domain: file_structure
  symptom:
    description: "Soil profile layer 1 is a constant 1.0 at every timestep (temperature, water content and ice content all exactly 1.0); the profile has one more layer than the soil file declares; depth-weighted storage sums and depth-matched profile validations are wrong."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "parse_output.read_soil_profile counted the IDpoint column as the first soil layer"
    explanation: "GEOtop point profile files (soilTz/thetaliq/thetaice/psiz) carry SIX leading metadata columns: Date12, JulianDayFromYear0, TimeFromStart, Simulation_Period, Run, IDpoint. The skip filter matched only the first five, so IDpoint (the constant point id, 1) was emitted as layer 1 and every real layer was shifted one index deeper. A validation against a 5 cm probe then silently read the 15 cm model layer, and any storage sum picked up a bogus 1.0*Dz term. Related: the layer column HEADERS are the layer mid-point depths in mm (5.0, 15.0, 30.0, ...) and were being discarded, forcing downstream code to guess the depth mapping."
    affected_components: [output]
  remedy:
    action: "Skip IDpoint/IDbasin, and carry the header depth through as depth_mm"
    tool_to_run: "parse_output.py"
    manual_steps:
      - "Check the parsed profile: layer 1 must vary in time. A constant 1.0 means IDpoint was captured"
      - "Cross-check the layer count against the row count of soilXXXX.txt"
      - "Derive layer thickness from consecutive mid-point depths, not from the requested layer list -- GEOtop may re-discretize"
    prevention: "parse_output.read_soil_profile now skips IDpoint/IDbasin and emits a depth_mm column"
  severity: silent
  cross_references: [dt_001]

- id: dt_024
  stage: s8_validation
  failure_domain: parameter_format
  symptom:
    description: "A surface/soil temperature validation reports a wildly negative PBIAS (e.g. -97%) and a poor or negative KGE while NSE and r are good (0.6 / 0.97). Metrics disagree violently about the same series."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Ratio-based metrics (PBIAS, KGE) computed on a temperature series in CELSIUS whose mean sits near zero"
    explanation: "PBIAS = 100*sum(sim-obs)/sum(obs) and KGE's bias term beta = mean(sim)/mean(obs) both divide by the mean of the observations. Celsius has an ARBITRARY zero, so a winter day/night LST series straddling freezing has a mean near 0 and the denominator collapses: at this NCP pixel a +1.0 K mean bias produced PBIAS = -96.7% and KGE = -0.12 in Celsius versus PBIAS = +0.62% and KGE = +0.45 in Kelvin -- same series, same model. NSE and r are translation-invariant and are unaffected, which is the tell-tale signature. This is a measurement artifact, not model error: switching cultivar/forcing/parameters cannot fix it."
    affected_components: [output]
  remedy:
    action: "Score temperature on the ABSOLUTE scale (Kelvin) whenever a magnitude_accuracy metric (PBIAS/KGE) is required"
    tool_to_run: "read_modis_lst.py"
    manual_steps:
      - "Convert both obs and sim to Kelvin before calling ki_tools_common.metrics.all_metrics"
      - "MOD11A2 LST is natively Kelvin (raw x 0.02) -- convert the MODEL to K rather than the observation to C"
      - "If a Celsius comparison is required anyway, report only NSE/r/RMSE and state that PBIAS/KGE are undefined near the zero crossing"
    prevention: "run_and_score.py scores the paired LST series in Kelvin; the meaningless Celsius PBIAS is not reported"
  severity: silent
  cross_references: []

- id: dt_025
  stage: s8_validation
  failure_domain: initialization
  symptom:
    description: "Simulated diurnal LST amplitude is much smaller than an 8-day MODIS composite (e.g. 5 K modelled vs 13 K observed), day too cold and night too warm, while r stays high."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "The model was averaged over ALL days of the 8-day window, but MOD11A2 is a CLEAR-SKY-ONLY composite"
    explanation: "MOD11A2 averages LST only over the days the pixel was cloud-free; the granule states how many in Clear_sky_days / Clear_sky_nights. Averaging the model over all 8 days mixes in cloudy days, whose diurnal amplitude is strongly damped, so the modelled day/night contrast is biased low by construction. A second, independent contributor at vegetated pixels: GEOtop Tsurface is the GROUND skin temperature beneath the canopy, whereas MODIS sees the effective radiometric temperature of the canopy+soil mixture -- with CanopyFraction>0 the ground term is damped relative to what the satellite observes."
    affected_components: [output, vegetation, radiation]
  remedy:
    action: "Match the model average to the granule's own clear-day count, picking the clearest days of each window"
    tool_to_run: "read_modis_lst.py"
    manual_steps:
      - "Read Clear_sky_days / Clear_sky_nights from the granule (read_modis_lst.py emits clear_sky_count)"
      - "Rank the days of the window: day = largest daily total Swglobal; night = lowest effective emissivity LWin/(sigma*Tair^4)"
      - "Average the model only over the n_clear clearest days at the SAME overpass instant"
      - "If an amplitude deficit survives clear-sky matching, suspect the canopy/soil radiometric mixing, not the clock (a clock error would also depress r -- see dt_021)"
    prevention: "read_modis_lst.py emits clear_sky_count; run_and_score.py pair() does clear-sky matching"
  severity: degraded
  cross_references: [dt_021, dt_024]

- id: dt_026
  stage: s4_forcing
  failure_domain: temporal_alignment
  symptom:
    description: "Forcing is shifted by part of a step against the model: rain or the diurnal cycle arrives 1-3 h (sub-daily) or a whole day (daily) early, while totals are right."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "A record was not stamped at the END of the interval it covers"
    explanation: "GEOtop uses a record stamped t for the interval (t-dt, t] (time_interp_constant, meteodata.cc:137-245). Sources stamp differently (checked 2026-10-19 at 36N 116E, Nov 2017, models/GEOtop/verify_forcing_bugs_20261019/): CMFD prec = mean over (t-3, t] (right); CMFD srad/lrad = centred on t; CMFD temp/pres/shum/wind = instant at t; MSWX P = [t, t+3) (strong: corr 0.964 with CMFD prec at t+3); MSWX Tair = [t, t+3) (WEAK: RMSE 1.20 K vs 1.39 as an instant, mixed by hour); MSWX SWd = centred on t (checked 2026-10-20 against the sun at 6 points over all of 2017, stamp_check/swd_envelope.json: corr 0.91-0.98 centred vs 0.89-0.94 [t, t+3); the clear-sky envelope leans least when centred; the best fit is about 0.5 h after t, so 'pair' is ~0.5 h off); MSWX LWd, wind, humidity and pressure not checked (kept as [t, t+3)); NASA POWER hourly = [HH, HH+1) (only shortwave checked; T2M, wind and humidity are ASSUMED to follow it); every daily loader = day D stamped D 00:00. CMFD srad is NOT settled: the sun test (TOA) says centred (corr 0.914 vs 0.83 start, 0.73 end), but a review check against NASA POWER hourly fits interval end better; the two references disagree. CMFD lrad was never checked against data (it follows the manual). Left as is, MSWX is up to 3 h early, NASA POWER 1 h, CMFD state values 1.5 h, and daily records a whole day. The rule assumes GEOtop's default LinearInterpolation = 0 (each record held over (t-dt, t], parameters.cc:2166, meteo.cc:54)."
    affected_components: [meteodata, radiation, energy.balance, water.balance]
  remedy:
    action: "Re-stamp each source to interval end before gridding"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "load_forcing sources: stamp_rules + align_to_interval_end do it (end = keep; start = stamp t+step; pair = mean of the records at t-step and t)"
      - "CSV: pass --csv-stamp end (means/totals over (t-step, t]), start (over [t, t+step)) or instant (state values measured at t; rain = total since the row before). With end/start the state columns must be interval means, or they are used step/2 late"
      - "Check: the first output hour with a rain pulse stamped t must lie in (t-step, t]"
    prevention: "convert_forcing.py read_via_load_forcing re-stamps every source since 2026-10-19; tests/test_forcing_timing.py runs the binary"
  severity: silent
  cross_references: [dt_021, dt_022, dt_027]

- id: dt_027
  stage: s8_validation
  failure_domain: known_issue
  symptom:
    description: "A GEOtop KI result made before 2026-10-19 used forcing one day early and, at 3-hourly records, 3x the rain (24x at daily records)."
    error_pattern: ""
    detection_method: provenance
  diagnosis:
    root_cause: "convert_forcing.py before 2026-10-19 wrote JDfrom0 with +366 (dt_021), wrote the Iprec depth under HeaderIPrec (dt_004) and did not re-stamp sources to interval end (dt_026)"
    explanation: "Affected (DB test_runs): 3909 (NCP, CMFD 3-hourly, NSE 0.601) and its 2026-10-19 re-run: 1 day early and rain 3x. 3578 (MOD11A2, hourly) and verify_1 (Jilin, NASA POWER hourly): 1 day early, rain amount right, hourly stamps start-labelled. 721/1907 (Bengbu) and 789/1908 (Wangjiaba), written by auto_dissect validate_bengbu.py/validate_wangjiaba.py: daily records about 1.4 days early, rain amount right. 855/1906 (Matsch_B2 self-test): shipped meteo, itself one day off. Any --dt 86400 KI run between 2026-07-21 and 2026-10-19: 24x rain and 2 days early (none in test_runs). Evidence: models/GEOtop/verify_forcing_bugs_20261019/VERIFY.md."
    affected_components: [meteodata, water.balance]
  remedy:
    action: "Re-make the meteo file with the fixed convert_forcing.py and re-run before quoting such a result"
    tool_to_run: "convert_forcing.py"
    manual_steps:
      - "Check an old meteo file: 01/11/2017 00:00 = 736999.0 means +366 (old)"
      - "Treat the old score as made with wrong forcing; it is not a check of the model"
    prevention: "run_and_score.py check_meteo stops on a JDfrom0 that differs from the clock"
  severity: silent
  cross_references: [dt_004, dt_021, dt_026]
