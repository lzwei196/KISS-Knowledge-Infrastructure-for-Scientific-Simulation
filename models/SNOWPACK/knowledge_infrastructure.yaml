# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: SNOWPACK
  language: c++
  implementation:
    id: snowpack-371
    version: 3.7.1
    provenance: C++; WSL Institute for Snow and Avalanche Research SLF standalone 1D snowpack binary (libsnowpack),
      forcing read via MeteoIO.
  scientific_reference_version: SNOWPACK 3.7.1 (SLF Davos; Bartelt & Lehning 2002 / Lehning et al. 2002
    Parts II–III numerical formulation)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/Alpine3D/local_install/bin/snowpack
    type: ELF
pipeline:
  stages:
  - s1_forcing_preparation
  - s2_profile_setup
  - s3_configuration
  - s4_spinup
  - s5_production_run
  - s6_output_extraction
tools:
  count: 5
  files:
  - tools/build_sno_profile.py
  - tools/convert_forcing.py
  - tools/generate_config.py
  - tools/parse_output.py
  - tools/run_snowpack.py
inputs:
  forcing:
  - name: TA
    unit: K
  - name: RH
    unit: fraction (0-1)
  - name: VW
    unit: m/s
  - name: DW
    unit: degrees (0-360)
  - name: ISWR / RSWR / NET_SW
    unit: W/m^2
  - name: ILWR
    unit: W/m^2
  - name: PSUM
    unit: kg/m^2 per timestep (mm w.e.)
  - name: HS
    unit: m
  - name: TSG
    unit: K
  - name: P
    unit: Pa
  parameters:
  - name: slope angle / azimuth
    unit: degrees
  - name: latitude / longitude / altitude
    unit: deg / deg / m
  - name: ROUGHNESS_LENGTH
    unit: m
  - name: HEIGHT_OF_METEO_VALUES / HEIGHT_OF_WIND_VALUE
    unit: m
  - name: soil layer properties (Rho_S, Conduc_S, HeatCapac_S, Vol_Frac_S)
    unit: kg/m^3, W/m/K, J/kg/K, fraction
  - name: MINIMUM_L_ELEMENT / REDUCE_N_ELEMENTS
    unit: m / count
  - name: soil albedo
    unit: fraction
  initial_conditions:
  - name: initial layered stratigraphy
    unit: per-layer (see states)
  - name: soil temperature and moisture profile (spun-up)
    unit: K / fraction
  boundary_conditions:
  - name: FORCING
    unit: enum (ATMOS | MASSBAL)
  - name: SW_MODE
    unit: enum (INCOMING | REFLECTED | BOTH)
  - name: CHANGE_BC
    unit: boolean
  - name: GEO_HEAT
    unit: W/m^2
  - name: VARIANT
    unit: enum (DEFAULT | POLAR | NIED | ANTARCTICA | SEAICE)
  - name: WATERTRANSPORTMODEL_SNOW
    unit: enum (BUCKET | NIED | RICHARDSEQUATION)
  - name: ALBEDO_PARAMETERIZATION
    unit: enum (e.g. LEHNING_2 | NIED)
  - name: METAMORPHISM_MODEL
    unit: enum (DEFAULT | NIED)
  - name: ATMOSPHERIC_STABILITY
    unit: enum (Monin-Obukhov scheme)
  - name: CALCULATION_STEP_LENGTH
    unit: minutes
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - HS
  - SWE
  - TSS
  - MS_SNOWPACK_RUNOFF
  - energy_balance_fluxes (qs, ql, qg, OLWR, lw_net, qw)
  - RHO_mean
  - layer_profile (T, Rho, rg, grain type, stability indices)
  - avalanche_hazard_indices
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.992, KGE=0.883, R=0.996, 2 scorecard(s)'
  metrics:
    best_nse: 0.992
    best_kge: 0.8829
    best_r: 0.996
summary:
  total_tools: 5
  total_stage_docs: 6
  total_diagnostic_triplets: 28
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
