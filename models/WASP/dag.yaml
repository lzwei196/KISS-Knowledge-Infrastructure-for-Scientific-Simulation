template_version: '3.5'
identity:
  model_id: WASP
  scientific_reference_version: US EPA WASP 8.5.0 (Water Quality Analysis Simulation Program), Advanced Eutrophication
    model (multi-algae.dll) with the WASP heat module; runtime banner 'Wasp suite version 8.5.0, Gui develop af12325
    dirty, Model master e86fb43'
  implementation:
    id: usepa-wasp-8.5.0
    version: 8.5.0
    provenance: EPA WASP 8.5.0 Windows binaries (waspccli.exe engine, wasptool.exe data API, BMD2_Extract.exe) from
      the official installer wasp-version-8.5.0-install-64-bit-10-25-2025.exe (sha256 2bb410b59ead76d5ba3681f05f61c4b1193a1be8b5393ab7a33f234957b293d4),
      run headless under WINE 9.0 for surface-water (river, lake and reservoir) water quality. The older Python
      tools run_wasp.py/convert_*_to_wasp.py/parse_output_wasp.py are an analytic SURROGATE, not this implementation
      and not described by this dag; their own contract is docs/surrogate/surrogate_wasp_analytic_dag.yaml.
  ki_class: forward_model
  is_family_dag: false
  language: fortran/c++ (closed-source EPA Windows binaries)
  license: Public-Domain
  repo_url: ''
  notes: 'Hand-updated 2026-10-07 (real-engine wiring, case wasp_real_engine_wiring_20261006): the 2026-06 auto
    dag described the analytic surrogate. Output names and validation ranks are kept so the obs map and validation_convention.yaml
    stay bound; descriptions now state what the real engine emits and through which KI tool. Previous version (the
    surrogate''s contract): docs/surrogate/surrogate_wasp_analytic_dag.yaml.'
boundary:
  scope_in:
  - Water temperature from a full surface heat balance (short-wave, long-wave, evaporation, conduction, optional
    ice) driven by weather time functions
  - 'Dissolved oxygen: reaeration (hydraulic and wind-driven), CBOD decay, sediment oxygen demand, DO saturation
    with elevation (pressure) correction'
  - CBOD (ultimate) first-order decay with temperature correction
  - Segment networks with flow routing options (stream routing, kinematic wave, flow routing, ponded weir, Lake
    1D-vertical, dynamic) - the KI builds well-mixed constant-volume boxes (Flow Routing) only
  - Nutrients, phytoplankton, solids, pH/alkalinity, bacteria, tracer (Advanced Eutrophication systems) - available
    in the engine, NOT configured by the KI builder yet
  scope_out:
  - Hydrodynamics in the box case (no current; Flow Routing keeps volume/depth fixed)
  - Vertical stratification in the KI lake-box case (one well-mixed layer; a layered or Lake 1D-vertical deck is
    needed)
  - Building a new segment network from nothing (the API can edit counts but shrinking segments crashes; copy-first
    only)
  spatial: 0-D well-mixed box per segment (KI case) | 1-D network of segments (engine)
  temporal: engine time step <= max dt (KI default 0.05 d); daily weather breakpoints; BMD2 output about every 0.02
    d
  closure: mass-balance
  notes: Mass balance per segment for every simulated system; heat balance for water temperature. The KI's Lake
    Erie case uses 10 hydraulically isolated identical boxes (flow 1e-4 m3/s) and scores segment 1.
inputs:
  forcing:
  - category: forcing
    name: solar_radiation
    unit: W/m2
    source_kind: forcing
    model_input_format: time function Solar Radiation - 1 (ISC 4), daily-mean breakpoints, days relative to the
      seed date
    notes: from load_daily_forcing srad_wm2
  - category: forcing
    name: air_temperature
    unit: deg C
    source_kind: forcing
    model_input_format: time function Air Temperature Function 1 (ISC 17)
  - category: forcing
    name: dew_point_temperature
    unit: deg C
    source_kind: derived
    model_input_format: time function Dew Point Function 1 (ISC 29)
    notes: Magnus inverse of specific humidity and surface pressure
  - category: forcing
    name: wind_speed
    unit: m/s
    source_kind: forcing
    model_input_format: time function Wind Speed Function 1 (ISC 21); 10 m wind from the loader
  - category: forcing
    name: cloud_cover
    unit: fraction 0-1
    source_kind: derived
    model_input_format: time function Cloud Cover Function 1 (ISC 25); a 0-1 FRACTION (tenths gives 70 C water,
      percent hangs the engine)
    notes: Kasten-Czeplak inverse of shortwave / FAO-56 clear-sky shortwave
  parameters:
  - category: parameters
    name: segment_depth
    unit: m
    source_kind: user_provided
    model_input_format: DMULT with DEXP 0 and INITIALDEPTH under Flow Routing (flow option 7)
  - category: parameters
    name: segment_volume
    unit: m3
    source_kind: derived
    model_input_format: VOLUME = area x depth
  - category: parameters
    name: elevation
    unit: m a.s.l.
    source_kind: dataset_lookup
    model_input_format: constant 57 and segment parameter 24 (DO saturation pressure); needs the 'used' flag
  - category: parameters
    name: latitude_longitude
    unit: degrees
    source_kind: user_provided
    model_input_format: constants 2 and 3
  - category: parameters
    name: sediment_oxygen_demand
    unit: g O2/m2/d
    source_kind: calibrated
    model_input_format: segment parameter 32 (temperature-corrected with constant 61)
  - category: parameters
    name: cbod_decay_rate
    unit: 1/d at 20 C
    source_kind: calibrated
    model_input_format: constant 47, one instance per CBOD system
  - category: parameters
    name: global_reaeration_rate
    unit: 1/d at 20 C
    source_kind: calibrated
    model_input_format: constant 55; 0 = engine computes hydraulic/wind reaeration
  - category: parameters
    name: ice_switch
    unit: 0/1/2
    source_kind: user_provided
    model_input_format: constant 501
  initial_conditions:
  - category: initial_conditions
    name: initial_concentrations
    unit: system units (mg/L, deg C)
    source_kind: user_provided
    model_input_format: INITC per system and segment
  boundary_conditions:
  - category: boundary_conditions
    name: boundary_concentrations_and_flows
    unit: system units; m3/s
    source_kind: user_provided
    model_input_format: BOUNDFUNC per system/boundary, NOQFUNC per flow function; in the KI box case flows are 1e-4
      m3/s and boundaries equal the initial values
processes:
  modules:
  - name: HeatModule
    role: process_solver
    brief: 'Surface heat balance (CE-QUAL-W2 lineage): solar, Brunt long-wave with cloud cover, evaporation and
      conduction with a wind function, bottom exchange, optional ice.'
  - name: DissolvedOxygen
    role: process_solver
    brief: Reaeration (Covar/O'Connor/Owens/Churchill/Tsivoglou/Zappa; wind-driven for lakes) toward a temperature-
      and pressure-dependent saturation; CBOD decay; SOD.
  - name: CBOD
    role: process_solver
    brief: First-order decay of ultimate CBOD with theta correction and oxygen half-saturation.
  - name: Transport
    role: process_solver
    brief: Segment advection/dispersion; Flow Routing keeps volume, depth and velocity fixed.
  internal_edges:
  - from: Inputs
    to: HeatModule
    kind: consumes_input
    brief: weather time functions
  - from: HeatModule
    to: water_temperature
    kind: writes_state
    brief: segment water temperature
  - from: water_temperature
    to: DissolvedOxygen
    kind: reads_state
    brief: saturation and rate temperature correction
  - from: CBOD
    to: DissolvedOxygen
    kind: invokes
    brief: oxygen consumed by CBOD decay
  - from: DissolvedOxygen
    to: Outputs
    kind: produces_output
    brief: BMD2 'Dissolved Oxygen'
  - from: HeatModule
    to: Outputs
    kind: produces_output
    brief: BMD2 'Water Temperature'
states:
  variables:
  - name: water_temperature
    unit: deg C
    role: prognostic
  - name: dissolved_oxygen
    unit: mg/L
    role: prognostic
  - name: cbod_ultimate
    unit: mg O2/L
    role: prognostic
  - name: inorganic_solids
    unit: mg/L
    role: prognostic
  - name: segment_volume
    unit: m3
    role: diagnostic
  provenance: structural
outputs:
- var: temperature_timeseries
  validation_rank: 4
  unit: deg C
  description: Lake/river surface-water temperature time series per segment (WASP 8.5 heat balance), daily mean
    of the BMD2 variable 'Water Temperature'.
  emitted_in: <model>.BMD2 'Water Temperature' (deg C) via run_wasp_engine.py --extract; daily means by parse_wasp_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - Engine output; in the KI lake-box case it is the temperature of a 12 m well-mixed surface layer - compare
        with surface (<= 5 m) samples, not whole-column means.
    detrending_options:
    - none
- var: do_timeseries
  validation_rank: 1
  unit: mg/L
  description: Dissolved-oxygen concentration time series in lake/river surface water per segment (WASP 8.5), daily
    mean of the BMD2 variable 'Dissolved Oxygen'.
  emitted_in: <model>.BMD2 'Dissolved Oxygen' (mg/L) via run_wasp_engine.py --extract; daily means by parse_wasp_engine_output.py
  observability:
    comparable_obs_shapes:
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - 'The KI box case has no phytoplankton or nutrients configured (no photosynthetic supersaturation, no algal
        respiration) and no stratification: simulated DO stays near saturation (Lake Erie: 1.03 x). Not configured
        yet - a scope limit, not an engine fault (dt_wasp_042).'
      - 'Obs: whole GLNPO CTD cruises can have a failed DO sensor (dt_wasp_041). The headline is ALL data
        (do_all, station-day rows); the cruise-QC subset (do_sensor_qc, only proven sensor faults left out) is
        reported next to it, never instead.'
    detrending_options:
    - none
- var: temperature_profile
  validation_rank: 5
  unit: deg C
  description: Vertical lake/reservoir water-column temperature profile vs depth (WASP 8.5 layered segments or Lake
    1D-vertical flow option).
  emitted_in: NOT produced by the current KI builder (single well-mixed box); needs a layered deck (surface/subsurface
    segments) or flow option 5 Lake (1D-Vertical)
  observability:
    comparable_obs_shapes:
    - obs_shape: point_snapshot
      comparison_mode: scalar_comparison
      metric_families:
      - magnitude_accuracy
      determining_metric: pbias
      caveats:
      - No KI tool emits this yet; do not score until a layered deck exists.
    detrending_options:
    - none
- var: do_profile
  validation_rank: 2
  unit: mg/L
  description: Vertical lake/reservoir water-column dissolved-oxygen profile vs depth (WASP 8.5 layered segments
    or Lake 1D-vertical flow option).
  emitted_in: NOT produced by the current KI builder (single well-mixed box); needs a layered deck or flow option
    5 Lake (1D-Vertical)
  observability:
    comparable_obs_shapes:
    - obs_shape: point_snapshot
      comparison_mode: scalar_comparison
      metric_families:
      - magnitude_accuracy
      determining_metric: pbias
      caveats:
      - No KI tool emits this yet; hypolimnetic hypoxia (Lake Erie Central Basin, Aug) needs a bottom layer with
        SOD.
    detrending_options:
    - none
- var: do_saturation
  validation_rank: 3
  unit: mg/L
  description: Dissolved-oxygen saturation concentration in lake/river surface water at the simulated water temperature
    and site pressure.
  emitted_in: computed by parse_wasp_engine_output.py (APHA 1992 fresh-water equation x standard-atmosphere pressure
    ratio) from the engine's 'Water Temperature'; the engine's own saturation is not written to the BMD2 by the
    KI case
  observability:
    comparable_obs_shapes:
    - obs_shape: point_snapshot
      comparison_mode: scalar_comparison
      metric_families:
      - magnitude_accuracy
      determining_metric: pbias
      caveats:
      - Diagnostic of the temperature output; the engine's DO in the box case sits ~2.5 % above this value on average.
    detrending_options:
    - none
- var: TSI
  validation_rank: 6
  unit: dimensionless
  description: Carlson Trophic State Index for lake/reservoir water from chlorophyll-a, Secchi depth and/or total
    phosphorus.
  emitted_in: 'NOT produced: the KI case deck has no phytoplankton/phosphorus systems; would be post-processed from
    Advanced Eutrophication chlorophyll and TP output'
  observability:
    comparable_obs_shapes:
    - obs_shape: point_snapshot
      comparison_mode: scalar_comparison
      metric_families:
      - magnitude_accuracy
      - ranking_quality
      determining_metric: spearman
      caveats:
      - No KI tool emits this from the real engine; the old value came from the SURROGATE.
    - obs_shape: point_time_series
      comparison_mode: time_series_comparison
      metric_families:
      - temporal_pattern_match
      - magnitude_accuracy
      determining_metric: nse
      caveats:
      - When TSI is tracked across a season.
    detrending_options:
    - none
influence:
  edges: []
  _reason: Sensitivity literature stream (lit_reader.json) returned null; no citation-backed sensitivity edges could
    be established. Mechanistic dependencies (temperature->DO_sat, BOD->DO, reaeration->DO, T(z)->DO_profile, Chl-a/Secchi/TP->TSI)
    are captured in processes.internal_edges, not here.
  citation_index: {}
safety:
  hazards:
  - id: param_used_flag_off
    kind: coefficient_runtime_silent_fallback
    description: 'A segment parameter, constant or time function whose ''used'' flag is 0 is ignored by the engine
      even though the API PUT echoes the new value (EPA template: params 8/9/11/24/32, constants 2/3/57, cloud TF
      25 are off) - e.g. elevation then stays 0 m.'
    severity: silent
  - id: cloud_cover_units
    kind: weather_file_semantic
    description: Cloud cover must be a 0-1 fraction; tenths gave 70 C water, percent made waspccli spin forever.
    severity: silent
  - id: time_axis_relative_to_seed
    kind: weather_file_semantic
    description: Time-function, flow, boundary and print breakpoints are days relative to the seed date but stored
      as absolute dates; changing the seed after writing series shifts them.
    severity: silent
  - id: wine_exit_code
    kind: numerical_instability
    description: waspccli returns 2 on good runs and can spin forever on a bad deck; success = close-out line +
      fresh .OUT/.BMD2 (run_wasp_engine.py).
    severity: silent
  - id: surrogate_confusion
    kind: coefficient_runtime_silent_fallback
    description: run_wasp.py is an analytic surrogate; its results are not WASP results.
    severity: silent
  validation_limits:
  - 'The KI lake-box case is one well-mixed 12 m layer: no stratification, no hypolimnion, no algae, no nutrients
    (not configured yet), so simulated DO is about 1.03 x saturation.'
  - WQP 'Lake_Erie_Central' folder is mostly tributary streams; only 'Great Lake' stations are lake water.
  - GLNPO cruises are April and August only, so scores are dominated by the seasonal contrast.
  warnings:
  - Use EPA's official Steady State example as the regression test after any engine or tool change.
  - Score every simulated variable in test_runs (not only in notes).
  assumptions:
  - statement: 'A 12 m well-mixed box represents the Central Basin summer epilimnion (August GLNPO profiles: 23.8
      C to 10-12 m, thermocline 12-18 m).'
    scope: Lake Erie real case
    source: GLNPO profile depths parsed from ResultCommentText
    status: adopted
  - statement: NASA POWER 0.5 deg weather over the lake represents over-water forcing.
    scope: Lake Erie real case
    source: case choice
    status: tentative
