validation:
  tier: "real"
  basin: "Bengbu (station 51080)"
  period: "1981-1990"
  observation_path: "/mnt/disk1/Hydrocraft_server/data/obs/BB/51080_bengbu.txt"
  metrics:
    NSE: 0.208
    KGE: 0.496
    PBIAS: 33.9
    r: 0.749

summary:
  total_tools: 4
  total_tool_lines: 2000
  total_skill_documents: 6
  total_diagnostic_triplets: 18
  failure_domains:
    - unit_conversion
    - parameter_format
    - path_resolution
    - runtime
    - silent_error
  pipeline_stages: 7
  pipeline_milestones: 7
