model:
  name: pySTEPS
  domain: atmosphere
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: precipitation
    unit: nowcast grid cells
    format: ''
    source: skill_md
outputs:
  primary:
  - name: precipitation_rate
    canonical_id: precipitation_rate
    unit: mm/day
  - name: air_temperature
    canonical_id: air_temperature
    unit: degC
  - name: wind_speed
    canonical_id: wind_speed
    unit: m/s
  - name: surface_pressure
    canonical_id: surface_pressure
    unit: Pa
