  _caveat: "No formal global sensitivity analysis (Sobol/Morris/EFAST indices) of COSIPY exists. Grades derive from forcing-perturbation experiments (Arndt 2023: -0.55 to -3.4 m w.e. per +1 K; Arndt 2021) and a Monte-Carlo parameter/forcing uncertainty ensemble (Krampe 2022: model params +/-0.25, forcing +/-0.73, lapse/gradient +/-0.31 m w.e.). HIGH grades reflect cross-paper dominance of temperature, albedo and net shortwave rather than a variance-based ranking; albedo HIGH in particular rests partly on qualitative dominance statements (Blau 2021, Arndt 2021), not a quantified index."
  citation_index:
    sauter2020_cosipy_model:
      short_citation: "Sauter, Arndt & Schneider 2020"
      doi: "10.5194/gmd-13-5645-2020"
      note: "COSIPY v1.3 model description; identifies albedo (snow/firn/ice), albedo decay timescale, roughness length, thermal conductivity and densification as the physically important tunable parameters."
    arndt2023_hma_sensitivity:
      short_citation: "Arndt & Schneider 2023"
      doi: "10.1017/jog.2023.46"
      note: "COSIPY forcing-perturbation over 16 High Mountain Asia glaciers; MB response -0.55 to -3.4 m w.e. per +1 K (temperature dominant, strongest in summer) and +0.38 to +1.96 m w.e. per +20% precipitation; both non-linear."
    krampe2022_fuerkele_uncertainty:
      short_citation: "Krampe, Arndt & Schneider 2022"
      doi: "10.3389/feart.2022.814027"
      note: "Monte-Carlo uncertainty experiment at Fuerkeleferner: 10 model parameters +/-0.25 m w.e.; forcing variables +/-0.73 m w.e. (temperature, cloud cover, solar radiation dominant); lapse/gradient +/-0.31 m w.e."
    arndt2021_halji_sensitivity:
      short_citation: "Arndt, Scherer & Schneider 2021"
      doi: "10.3390/atmos12040426"
      note: "COSIPY 40-yr Halji Glacier run; MB most sensitive to summer temperature and monsoon precipitation, strongly correlated with albedo."
    blau2021_79n_albedo:
      short_citation: "Blau, Turton, Sauter & Moelg 2021"
      doi: "10.1017/jog.2021.56"
      note: "COSIPY + Polar WRF on 79N Glacier; net shortwave / albedo feedback dominate interannual MB variability; roughness length controls turbulent fluxes."

safety:
  hazards:
    - id: "T2_celsius_silent_all_rain"
      kind: "weather_file_semantic"
      description: "T2 supplied in Celsius instead of Kelvin makes the tanh snow/rain transfer return 100% rain, so snowfall and snow height stay zero."
      severity: "silent"
    - id: "RH2_fraction_zero_latent_heat"
      kind: "weather_file_semantic"
      description: "RH2 given as a 0-1 fraction instead of 0-100% drives specific humidity ~100x too low, collapsing latent heat flux and sublimation."
      severity: "silent"
    - id: "PRES_pa_turbulent_fluxes_100x"
      kind: "weather_file_semantic"
      description: "PRES in Pa instead of hPa makes air density ~100x too high and turbulent fluxes ~100x too large (crash or non-physical)."
      severity: "fatal_or_silent"
    - id: "RRR_per_day_not_per_timestep"
      kind: "weather_file_semantic"
      description: "Precipitation in mm/day rather than mm/timestep is off by the steps-per-day factor; COSIPY uses the raw value and never divides by dt."
      severity: "silent"
    - id: "G_accumulated_joules"
      kind: "weather_file_semantic"
      description: "Shortwave G supplied as accumulated J/m^2 instead of instantaneous W/m^2 is ~3600x too high and blows the model up to NaN."
      severity: "fatal_or_silent"
    - id: "N_percent_inflates_longwave"
      kind: "weather_file_semantic"
      description: "Cloud cover N in percent (0-100) instead of fraction (0-1) inflates parametrized incoming longwave above 500 W/m^2 and forces winter melt."
      severity: "silent"
    - id: "snowfall_units_max_layers"
      kind: "weather_file_semantic"
      description: "SNOWFALL given in mm or m w.e. instead of m snow height creates hundreds of layers per step and hits max_layers (200)."
      severity: "fatal"
    - id: "dt_mismatch_mass_scaling"
      kind: "control_semantic"
      description: "dt in constants.toml not equal to the input forcing resolution mis-scales every flux-to-mass conversion (melt, runoff, sublimation, MB)."
      severity: "silent"
    - id: "nan_in_masked_cells_abort"
      kind: "weather_file_semantic"
      description: "Any NaN in a forcing variable at a MASK=1 cell aborts the run with 'There are NaNs in the dataset'."
      severity: "fatal"
    - id: "empty_mask_or_time_slice"
      kind: "control_semantic"
      description: "All-zero MASK (DEM/shapefile extent mismatch) or a simulation period outside the input time range yields empty / all-NaN output without an error."
      severity: "silent"
    - id: "sfc_temp_solver_nonconvergence"
      kind: "numerical_instability"
      description: "Extreme forcing (bad G/PRES/LWin units) makes the surface-temperature root-find non-convergent, producing oscillation or NaN; TS>273.5 K signals a numerical issue."
      severity: "fatal_or_silent"
    - id: "zero_snowheight_albedo_stuck_ice"
      kind: "initial_condition_semantic"
      description: "Zero initial snowheight with no early snowfall leaves the surface as bare ice with albedo pinned at 0.30, producing excess melt during spinup."
      severity: "silent"
  validation_limits:
    - "1-D vertical column with no lateral exchange; cannot represent horizontal redistribution, avalanching or basin routing of runoff."
    - "No glacier ice dynamics/flow; geometry evolution beyond surface/internal mass balance is out of scope."
    - "No soil scheme; applicable only to frozen (snow/ice) surfaces."
    - "Snowdrift / wind redistribution not represented; snowfall treated as effective accumulation."
    - "Surface skin temperature cannot exceed the melting point (273.16 K), so the model cannot represent a warm/wet surface above freezing."
  warnings:
    - "Surface-temperature solver choice matters: L-BFGS-B and SLSQP can give different (potentially wrong) results since a Feb 2024 code change; Secant is the recommended default."
    - "Initial conditions strongly bias the first ~3-6 months; production runs should start from a >=1-year spinup restart file with the same forcing."
    - "Sublimation is a mass loss typically 5-20% of total ablation and is suppressed when humidity input is mis-scaled."
    - "Wind expected at the 2-m measurement height; using 10-m reanalysis wind without a log-profile correction overestimates turbulent fluxes by ~30-50%."
    - "Input SNOWFALL is snow height while output SNOWFALL is water-equivalent — the same name carries different units across the model boundary."
  assumptions:
    - statement: "Each grid cell is an independent 1-D vertical column with no lateral energy or mass exchange."
      scope: "Whole-domain spatial structure"
      source: "COSIPY v1.3 model description (Sauter et al. 2020, GMD 13:5645) and readthedocs Resources"
      status: "adopted"
    - statement: "The model carries coupled mass and energy closure: per-layer theta_i + theta_w + theta_a = 1, and surface skin temperature is iterated to a consistent value constrained to T_s <= 273.16 K."
      scope: "Subsurface continuity and surface energy-balance closure"
      source: "COSIPY v1.3 model description (Sauter et al. 2020, GMD 13:5645), subsurface continuity and numerical-solution sections"
      status: "adopted"
    - statement: "Default daily/hourly dt must equal the input forcing temporal resolution because flux-to-mass conversions use raw per-step values without dividing by dt."
      scope: "Time discretization of all mass fluxes"
      source: "COSIPY constants.toml dt definition and cosipy_core flux-to-mass conversion"
      status: "adopted"
    - statement: "Default surface-temperature solver is taken to be Secant; the L-BFGS-B / SLSQP optimizer paths are treated as potentially divergent after the Feb 2024 change."
      scope: "Surface energy-balance numerical solution"
      source: "cosipy/modules/surfaceTemperature.py solver options and COSIPY changelog"
      status: "tentative"

