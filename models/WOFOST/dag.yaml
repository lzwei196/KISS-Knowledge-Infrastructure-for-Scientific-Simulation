      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["wang2013_wofost_efast", "li2023_wofost_efast_spring_wheat"]
    - from: "AMAXTB"
      to: "TWSO"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["wang2013_wofost_efast", "gilardelli2018_wofost_climate_sensitivity"]
    - from: "EFFTB (light-use efficiency at low light)"
