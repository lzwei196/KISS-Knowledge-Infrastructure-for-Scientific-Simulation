template_version: "3.5"

identity:
  model_id: "CISM"
  scientific_reference_version: "CISM 2.1 (Lipscomb et al. 2019, GMD; documentation dated 2018-06-17)"
  implementation:
    id: "cism-driver-v21"
    version: "2.1"
    provenance: "Fortran 90/95; CESM Land Ice Working Group cism_driver executable (Glide SIA + Glissade higher-order dycores), netCDF/CF I/O."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "LGPL-3.0-or-later"
  repo_url: "https://github.com/ESCOMP/CISM"

boundary:
  scope_in:
    - "Ice thickness evolution via mass continuity (incremental remapping / upwind transport / pseudo-diffusion)"
    - "Ice velocity via shallow-ice (Glide) or higher-order (Glissade: Blatter-Pattyn, SSA, L1L2, DIVA) momentum balance"
    - "Prognostic internal ice temperature / enthalpy evolution"
    - "Basal sliding/traction and basal hydrology (till water, effective pressure)"
    - "Marine-margin calving and grounding-line dynamics"
    - "Isostatic bedrock adjustment (elastic lithosphere + relaxing asthenosphere)"
    - "Surface mass balance via internal PDD scheme or externally supplied acab/artm"
  scope_out:
    - "Atmosphere, ocean, sea-ice, and land-surface processes (separate ESM components)"
    - "Direct precipitation/evaporation forcing of the ice core (surface mass balance is the driver, not P-E)"
    - "Hydrological-timescale processes (CISM operates on glaciological timescales)"
    - "Parallel execution of the Glide (SIA) dycore (single-processor only; Glissade is the parallel core)"
  spatial: "3-D"
  temporal: "annual"
  closure: "both"
  notes: "Solves conservation of mass, energy, and momentum on a structured x/y grid with vertical sigma layers. Mass-balance closure governs ice thickness; energy closure governs the prognostic temperature/enthalpy field; momentum is solved diagnostically each step via a stress-balance approximation (SIA in Glide; Blatter-Pattyn/SSA/L1L2/DIVA in Glissade). Internal state uses SI units (m/s) while netCDF output applies a seconds-per-year scaling (scyr) to emit m/yr."

inputs:
  forcing:
    - category: "climate"
      name: "acab (surface mass balance)"
      unit: "m/yr ice equivalent"
      source_kind: "forcing"
      model_input_format: "netCDF (CF), 2-D field on scalar grid (y1,x1)"
      notes: "Accumulation minus ablation; must be m/yr ICE equivalent, not mm/yr and not water equivalent. Can be supplied externally or generated by the internal PDD scheme."
    - category: "climate"
      name: "artm (annual mean surface air temperature)"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "netCDF (CF), 2-D field on scalar grid (y1,x1)"
      notes: "Degrees Celsius, NOT Kelvin. Sets the upper thermal boundary condition; with temperature=0 it overwrites the column each step."
    - category: "climate"
      name: "Glint climate fields (temp, prcp, arng)"
      unit: "deg C; m water/yr; deg C"
      source_kind: "forcing"
      model_input_format: "global lat-lon climate fields via the Glint interface"
      notes: "Daily-mean 2 m air temperature, precipitation, and air-temperature half-range that drive the internal PDD mass-balance schemes; downscaled to the ice grid by Glint."
  parameters:
    - category: "rheology"
      name: "default_flwa (Glen flow-law rate factor A)"
      unit: "Pa^-n s^-1"
      source_kind: "calibrated"
      model_input_format: "[parameters] default_flwa in .config"
      notes: "Ice softness; sane range 1e-18..1e-15, default 1e-16. Used when flow_law=0 (constant); with flow_law=2 (Paterson-Budd) A is temperature-dependent."
    - category: "rheology"
      name: "flow_enhancement_factor"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "[parameters] flow_enhancement_factor in .config"
      notes: "Multiplier on flwa; range 0.5..5.0, default 1.0."
    - category: "basal"
      name: "beta (basal traction coefficient)"
      unit: "Pa yr/m"
      source_kind: "calibrated"
      model_input_format: "netCDF 2-D field on staggered velocity grid (y0,x0)"
      notes: "Higher-order bed-stress coefficient (tau_b = beta * u_b). Required when which_ho_babc=5 (beta from input)."
    - category: "basal"
      name: "btrac_const (uniform basal friction)"
      unit: "Pa yr/m"
      source_kind: "calibrated"
      model_input_format: "[parameters] btrac_const in .config"
      notes: "Spatially uniform basal friction; range 0..1e6, default 0.0."
    - category: "basal"
      name: "tauf / mintauf (basal yield stress)"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "netCDF / [parameters], used with which_ho_babc=15"
      notes: "Higher-order basal yield stress for plastic (Coulomb / pseudo-plastic) sliding."
    - category: "thermal"
      name: "geothermal / bheatflx (basal geothermal heat flux)"
      unit: "W/m^2"
      source_kind: "dataset_lookup"
      model_input_format: "[parameters] geothermal (scalar) or netCDF 2-D bheatflx field"
      notes: "CISM sign convention: NEGATIVE = upward heat flux into the ice base. Default -42e-3 W/m^2; range -100e-3..-20e-3."
    - category: "numerics"
      name: "ice_limit (minimum ice thickness for dynamics)"
      unit: "m"
      source_kind: "default"
      model_input_format: "[parameters] ice_limit in .config"
      notes: "Cells thinner than this are treated as ice-free; range 0.1..100, default 1.0."
    - category: "thermal"
      name: "lapse_rate (atmospheric temperature lapse rate)"
      unit: "deg C / m"
      source_kind: "calibrated"
      model_input_format: "[GLINT climate] / [parameters] in .config"
      notes: "Vertical lapse rate used to reference surface air temperature to elevation for the PDD scheme."
  initial_conditions:
    - category: "geometry"
      name: "thk (initial ice thickness)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "netCDF 2-D field on scalar grid (y1,x1); must be >= 0"
    - category: "geometry"
      name: "topg (bedrock topography)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "netCDF 2-D field on scalar grid (y1,x1)"
      notes: "Negative = below sea level. Sign convention error produces false floating ice (dt_012)."
    - category: "geometry"
      name: "usurf (initial upper surface elevation)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "netCDF 2-D field on scalar grid (y1,x1)"
    - category: "thermal"
      name: "temp (initial 3-D ice temperature)"
      unit: "deg C"
      source_kind: "user_provided"
      model_input_format: "netCDF 3-D field on sigma levels (level,y1,x1)"
    - category: "geometry"
      name: "relx (relaxed bedrock topography)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "netCDF 2-D field; reference bed for isostatic adjustment"
    - category: "dynamics"
      name: "uvel/vvel (restart velocity fields)"
      unit: "m/yr"
      source_kind: "user_provided"
      model_input_format: "netCDF 3-D fields on staggered grid (level,y0,x0); restart only"
  boundary_conditions:
    - category: "control_switch"
      name: "dycore"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[options] dycore (0=Glide SIA, 2=Glissade HO)"
      notes: "Selects the dynamical core. Hard-coupled to the evolution option (Glissade requires evolution=3 or 4; dt_007)."
    - category: "control_switch"
      name: "which_ho_approx"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[ho_options] which_ho_approx (-1=local SIA, 1=SSA, 2=BP, 3=L1L2, 4=DIVA)"
      notes: "Higher-order momentum approximation, Glissade only."
    - category: "control_switch"
      name: "which_ho_babc (basal boundary condition)"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[ho_options] which_ho_babc (4=no-slip, 5=beta from input, 15=till yield stress)"
    - category: "control_switch"
      name: "which_ho_sparse (linear solver)"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[ho_options] which_ho_sparse (1=SLAP, 3=Glissade PCG, 4=Trilinos)"
      notes: "Value 4 requires a Trilinos-linked build, else runtime failure (dt_005)."
    - category: "control_switch"
      name: "which_ho_nonlinear (nonlinear iteration)"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[ho_options] which_ho_nonlinear (0=Picard, 1=JFNK)"
    - category: "control_switch"
      name: "temperature (thermal mode)"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[options] temperature (0=hold to artm, 1=prognostic, 2=hold initial, 3=enthalpy)"
    - category: "control_switch"
      name: "flow_law"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[options] flow_law (0=constant flwa, 2=Paterson-Budd temperature-dependent)"
    - category: "control_switch"
      name: "evolution (thickness scheme)"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[options] evolution (0=pseudo-diffusion, 3=incremental remapping, 4=FO upwind)"
    - category: "control_switch"
      name: "marine_margin (calving scheme)"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[options] marine_margin (0=none, 3=threshold calving)"
    - category: "control_switch"
      name: "isostasy"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[options] isostasy (0=off, 1=on)"
    - category: "control_switch"
      name: "basal_water"
      unit: "enum"
      source_kind: "user_provided"
      model_input_format: "[options] basal_water (0=off, 1=local balance)"
    - category: "grid"
      name: "grid geometry (ewn, nsn, upn, dew, dns)"
      unit: "count; m"
      source_kind: "user_provided"
      model_input_format: "[grid] section in .config; dew/dns in METERS"
      notes: "Grid spacing in km instead of m shrinks the domain 1000x and corrupts velocities (dt_006)."
    - category: "time"
      name: "time control (tstart, tend, dt, ntem)"
      unit: "yr; yr; yr; count"
      source_kind: "user_provided"
      model_input_format: "[time] section in .config"
      notes: "dt is CFL-limited: dt < dew^2/(2*D_max) for diffusive stability (dt_004)."
    - category: "boundary_mask"
      name: "kinbcmask (velocity Dirichlet mask)"
      unit: "0/1"
      source_kind: "user_provided"
      model_input_format: "netCDF 2-D mask on staggered grid (y0,x0)"
      notes: "Marks cells where uvel/vvel are held as Dirichlet boundary conditions; zero velocity is imposed where mask=1 if uvel/vvel absent."
    - category: "climate"
      name: "eus (eustatic sea level)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "scalar global sea-level forcing (optional)"

processes:
  modules:
    - name: "ThicknessEvolution"
      role: "integrator"
      brief: "Advances ice thickness via mass continuity: pseudo-diffusion (evolution=0, Glide), incremental remapping (evolution=3), or first-order upwind transport (evolution=4)."
    - name: "Glide_SIA_dycore"
      role: "process_solver"
      brief: "Shallow-ice-approximation momentum solver (dycore=0); serial only; diagnoses velocity from the local driving stress for continental long-timescale runs."
    - name: "Glissade_HO_dycore"
      role: "process_solver"
      brief: "Higher-order dynamical core (dycore=2); orchestrates the HO velocity solve and requires remapping thickness evolution; MPI-capable."
    - name: "HO_velocity_solver"
      role: "process_solver"
      brief: "Solves the higher-order momentum balance (Blatter-Pattyn/SSA/L1L2/DIVA per which_ho_approx) for uvel/vvel via nonlinear iteration over effective viscosity (which_ho_efvs) and the basal BC (which_ho_babc)."
    - name: "SparseLinearSolver"
      role: "process_solver"
      brief: "Solves the assembled sparse linear system for HO velocities; Glissade built-in PCG (which_ho_sparse=3) or Trilinos (=4, build-dependent)."
    - name: "Temperature_solver"
      role: "process_solver"
      brief: "Prognostic 3-D ice temperature/enthalpy on sigma levels (temperature=1/3): vertical diffusion, horizontal advection, strain heating, with the geothermal basal BC; feeds flow-law softness."
    - name: "SurfaceMassBalance"
      role: "process_solver"
      brief: "Applies acab/artm at the surface as the thickness source/sink; internal PDD schemes (legacy Glimmer) or externally supplied acab."
    - name: "BasalTraction"
      role: "process_solver"
      brief: "Computes basal traction/sliding (power-law / Coulomb / pseudo-plastic via beta or yield stress) providing the basal boundary condition for the HO momentum solve."
    - name: "BasalHydrology"
      role: "optional_module"
      brief: "Till water and effective pressure (basal_water=1); modulates basal yield stress."
      applicability: "basal_water=1"
    - name: "GeothermalHeatFlux"
      role: "process_solver"
      brief: "Supplies the basal heat-flux boundary condition (negative=upward) to the temperature solver."
    - name: "MarineMarginCalving"
      role: "process_solver"
      brief: "Threshold-based calving and marine-margin mass loss at cells where the bed is below sea level (marine_margin=3)."
      applicability: "marine_margin=3"
    - name: "Isostasy"
      role: "optional_module"
      brief: "Glacial isostatic adjustment via elastic lithosphere + relaxing asthenosphere; updates topg under the ice load."
      applicability: "isostasy=1"
  internal_edges:
    - from: "SurfaceMassBalance"
      to: "ThicknessEvolution"
      kind: "writes_state"
      brief: "acab provides the accumulation-ablation source/sink term for the thickness continuity budget."
    - from: "Glide_SIA_dycore"
      to: "ThicknessEvolution"
      kind: "writes_state"
      brief: "SIA velocity/diffusivity field drives the pseudo-diffusion thickness update (Glide path)."
    - from: "Glissade_HO_dycore"
      to: "HO_velocity_solver"
      kind: "invokes"
      brief: "The HO core calls the velocity solver each timestep to diagnose uvel/vvel."
    - from: "HO_velocity_solver"
      to: "SparseLinearSolver"
      kind: "invokes"
      brief: "Assembles and solves the sparse linear system via PCG or Trilinos (which_ho_sparse)."
    - from: "BasalTraction"
      to: "HO_velocity_solver"
      kind: "reads_state"
      brief: "Velocity solver reads the basal traction field (beta / yield stress) as its basal boundary condition (which_ho_babc)."
    - from: "BasalHydrology"
      to: "BasalTraction"
      kind: "writes_state"
      brief: "Till water / effective pressure controls the basal yield stress."
    - from: "Temperature_solver"
      to: "HO_velocity_solver"
      kind: "reads_state"
      brief: "Ice temperature sets the Glen flow-law softness A(T*) used in the effective-viscosity solve (flow_law=2)."
    - from: "GeothermalHeatFlux"
      to: "Temperature_solver"
      kind: "consumes_input"
      brief: "Geothermal flux (negative=upward) is the basal BC of the energy equation."
    - from: "HO_velocity_solver"
      to: "ThicknessEvolution"
      kind: "writes_state"
      brief: "The HO velocity field drives the flux divergence that updates thk under remapping/upwind transport."
    - from: "ThicknessEvolution"
      to: "Temperature_solver"
      kind: "writes_state"
      brief: "Updated geometry (thk, sigma layers) is advected into the temperature solve."
    - from: "ThicknessEvolution"
      to: "MarineMarginCalving"
      kind: "writes_state"
      brief: "Thickness at marine margins is subject to threshold calving mass removal."
    - from: "ThicknessEvolution"
      to: "Isostasy"
      kind: "writes_state"
      brief: "Evolving ice load depresses the bedrock via the lithosphere/asthenosphere model."
    - from: "Isostasy"
      to: "topg"
      kind: "writes_state"
      brief: "Isostatic adjustment updates bedrock topography, altering surface slope and subsequent flow."

states:
  variables:
    - name: "thk"
      unit: "m"
      role: "prognostic"
    - name: "temp"
      unit: "deg C"
      role: "prognostic"
    - name: "enthalpy"
      unit: "J/m^3"
      role: "prognostic"
    - name: "waterfrac"
      unit: "dimensionless [0,1]"
      role: "prognostic"
    - name: "topg"
      unit: "m"
      role: "prognostic"
    - name: "relx / litho_temp"
      unit: "m; deg C"
      role: "prognostic"
    - name: "bwat"
      unit: "m"
      role: "prognostic"
    - name: "ice_age"
      unit: "yr"
      role: "prognostic"
    - name: "uvel/vvel"
      unit: "m/yr"
      role: "diagnostic"
    - name: "velnorm"
      unit: "m/yr"
      role: "diagnostic"
    - name: "usurf / lsurf"
      unit: "m"
      role: "diagnostic"
    - name: "btemp / bpmp"
      unit: "deg C"
      role: "diagnostic"
    - name: "bmlt"
      unit: "m/yr"
      role: "diagnostic"
    - name: "effecpress"
      unit: "Pa"
      role: "diagnostic"
    - name: "ivol / imass / iarea"
      unit: "km^3 (internal m^3); kg; km^2 (internal m^2)"
      role: "accumulator"
  provenance: "structural"

outputs:
  - var: "thk"
    validation_rank: 3
    unit: "m"
    description: "Ice thickness on the scalar grid"
    emitted_in: "[CF output] netCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Observed ice thickness (e.g. radar-derived) is sparse and along-track; resample to the model grid before comparison."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Thickness-change rates evolve on glaciological timescales; multi-decadal records are needed to see signal."]
      detrending_options: ["none"]
  - var: "usurf"
    validation_rank: 5
    unit: "m"
    description: "Upper ice-surface elevation"
    emitted_in: "[CF output] netCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Comparable to altimetry-derived surface DEMs; geoid/reference-ellipsoid conventions must align."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Surface-elevation change rate (dh/dt) is the observable signal; instantaneous offsets reflect initialization, not skill."]
      detrending_options: ["none", "linear_residual"]
  - var: "velnorm"
    validation_rank: 1
    unit: "m/yr"
    description: "Horizontal ice-velocity magnitude"
    emitted_in: "[CF output] netCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Comparable to InSAR/feature-tracking surface velocity mosaics; output is already scyr-scaled to m/yr (restart raw arrays are m/s)."]
      detrending_options: ["none"]
  - var: "uvel"
    validation_rank: 2
    unit: "m/yr"
    description: "x-component of ice velocity on sigma levels"
    emitted_in: "[CF output] netCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Surface (level=0) component comparable to remote-sensing velocity; sign/orientation must match the projection."]
      detrending_options: ["none"]
  - var: "temp"
    validation_rank: 4
    unit: "deg C"
    description: "Internal 3-D ice temperature on sigma levels"
    emitted_in: "[CF output] netCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Comparable to borehole temperature profiles at discrete points; vertical interpolation onto sigma levels required."]
      detrending_options: ["none"]
  - var: "bmlt"
    validation_rank: 6
    unit: "m/yr"
    description: "Basal melt rate (total / grounded / floating)"
    emitted_in: "[CF output] netCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Sub-shelf melt observations are sparse and indirect; output is m/yr (m/s SI internally, dt_008)."]
      detrending_options: ["none"]
  - var: "ivol"
    validation_rank: 7
    unit: "km^3"
    description: "Total ice volume (internally m^3)"
    emitted_in: "[CF output] netCDF scalar time series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Volume change (mass balance / SLR contribution) is the meaningful signal; absolute volume depends on initialization."]
      detrending_options: ["decadal_mean", "first_difference", "none"]
  - var: "imass / imass_above_flotation"
    validation_rank: 8
    unit: "kg"
    description: "Total ice mass and mass above flotation (sea-level-relevant mass)"
    emitted_in: "[CF output] netCDF scalar time series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Mass-change rate comparable to gravimetry (GRACE) basin totals; mass above flotation maps to sea-level contribution."]
      detrending_options: ["decadal_mean", "first_difference", "none"]
  - var: "iarea / iareag / iareaf"
    validation_rank: 9
    unit: "km^2"
    description: "Total / grounded / floating ice area (internally m^2)"
    emitted_in: "[CF output] netCDF scalar time series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Ice extent / grounding-line position comparable to remote-sensing masks."]
      detrending_options: ["decadal_mean", "first_difference", "none"]
  - var: "calving_flux / gl_flux"
    validation_rank: 10
    unit: "kg/s; kg/m/s"
    description: "Calving mass flux and grounding-line flux"
    emitted_in: "[CF output] netCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Flux-gate estimates are basin-integrated and uncertain; compare integrated discharge (a rate/trend), not per-cell flux."]
      detrending_options: ["decadal_mean", "first_difference", "none"]

influence:
  edges:
    - from: "gamma0 (ocean-melt sensitivity coefficient)"
      to: "imass / imass_above_flotation"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "marine ice sheet / Antarctic ocean-coupled runs"
      citations: ["berdahl2023_cism_sensitivity", "lipscomb2021_cism_ismip6", "vandenakker2025_waiscollapse"]
    - from: "ocean_thermal_forcing"
      to: "imass / imass_above_flotation"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "boundary_forcing"
      applicability: "marine ice sheet / Antarctic ocean-coupled runs"
