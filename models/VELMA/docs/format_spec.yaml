  remedy: 'Inspect the NetCDF file to discover actual variable names and update the converter; ["Run:
    ncdump -h forcing_file.nc | grep -E ''float|double'' to list variables", "Or in Python: import xarray;
    ds = xarray.open_dataset(''file.nc''); print(list(ds.data_vars))", ''Update variable names in convert_forcing_t'
