  severity: silent
- id: dt_wasp_015
  symptom: Thermocline depth is deeper than the lake bottom; profile shows monotonic cooling with no inflection
  diagnosis: Thermocline depth z_thermo exceeds maximum lake depth z_max; The logistic model center (z_thermo)
