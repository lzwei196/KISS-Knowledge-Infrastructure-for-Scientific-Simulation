# ============================================================================
# Diagnostic Triplets -- SUMMA Knowledge Infrastructure
# ============================================================================
# Each triplet encodes one piece of operational debugging knowledge:
#   symptom  -> what the agent observes
#   diagnosis -> why it happened
#   remedy   -> what to do about it
# ============================================================================

triplets:

  # === PATH RESOLUTION ===

  - id: dt_001
    stage: "s6_execution"
    failure_domain: "path_resolution"
    symptom:
      description: "SUMMA crashes immediately with 'STOP 10' or 'Error opening file' when starting execution."
      error_pattern: "STOP 10|Error opening file|cannot open"
      detection_method: "log_match"
    diagnosis:
      root_cause: "A file referenced in fileManager.txt does not exist at the specified path."
      explanation: >
        SUMMA Fortran reads all config file paths from fileManager.txt and opens
        them sequentially. If ANY file is missing, SUMMA calls STOP 10 but the
        error message does not always identify WHICH file is missing. This is the
        #1 SUMMA runtime error. The Fortran code uses CHARACTER(256) variables,
        and the path is constructed as settingsPath // fileName, so if settingsPath
        does not end with '/', the concatenation produces a garbled path.
      affected_components:
        - "fileManager.txt"
        - "All referenced config files"
    remedy:
      action: "Run validate_file_manager.py to check all paths before execution."
      tool_to_run: "validate_file_manager"
      manual_steps:
        - "Check that settingsPath, forcingPath, outputPath all end with '/'"
        - "Verify every file listed in fileManager.txt exists at the specified location"
        - "Check that all paths are ABSOLUTE (not relative)"
      prevention: "Always use create_file_manager.py which enforces absolute paths and trailing slashes."
    severity: "fatal"
    cross_references: ["dt_002"]

  - id: dt_002
    stage: "s6_execution"
    failure_domain: "path_resolution"
    symptom:
      description: "SUMMA silently truncates long file paths, opening the wrong file or failing with a cryptic error."
      error_pattern: "STOP 10|cannot open|file not found"
      detection_method: "log_match"
    diagnosis:
      root_cause: "File path exceeds Fortran CHARACTER(256) limit."
      explanation: >
        SUMMA Fortran source uses CHARACTER(len=256) for file paths. When
        settingsPath + fileName exceeds 256 characters, the string is truncated
        silently. The Fortran OPEN statement then tries to open a non-existent
        file. This is the same Fortran path truncation bug (cm_008) seen in
        DSSAT, VIC routing, and RZWQM2. Deep directory nesting in
        outputs/<basin>/<run>/settings/ often triggers this.
      affected_components:
        - "fileManager.txt path entries"
        - "Fortran I/O subsystem"
    remedy:
      action: "Create a symlink to shorten the path. Target total path < 200 chars."
      tool_to_run: ""
      manual_steps:
        - "ln -s /long/path/to/outputs/basin_run/settings /tmp/summa_settings"
        - "Update fileManager.txt to use the symlink path"
        - "Verify total path length: echo -n 'path' | wc -c"
      prevention: "Keep output directory paths short. Use validate_file_manager.py which checks path lengths."
    severity: "fatal"
    cross_references: ["dt_001"]

  # === UNIT CONVERSION ===

  - id: dt_003
    stage: "s2_forcing_prep"
    failure_domain: "unit_conversion"
    symptom:
      description: "SUMMA runs without error but precipitation is 8x too high or too low. Runoff is completely wrong."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "VIC precipitation units (mm/timestep) divided by wrong time interval."
      explanation: >
        VIC forcing uses mm per timestep. For 3-hourly data, the timestep is
        10800 seconds. SUMMA expects kg/m2/s (= mm/s). The correct conversion
        is: pptrate = VIC_precip / 10800. If you divide by 86400 (daily), the
        precipitation is 8x too low. If you divide by 3600 (hourly when data is
        3-hourly), precipitation is 3x too high. This is the same unit trap
        (cm_004) that hit VIC routing and CaMa-Flood.
      affected_components:
        - "convert_vic_forcing_to_summa.py"
        - "Forcing NetCDF pptrate variable"
    remedy:
      action: "Verify DATA_STEP matches the actual VIC forcing timestep (10800 for 3-hourly, 3600 for hourly)."
      tool_to_run: "convert_vic_forcing_to_summa"
      manual_steps:
        - "Check VIC forcing file: count rows per day (8 = 3-hourly, 24 = hourly)"
        - "Set DATA_STEP = 10800 for 3-hourly, 3600 for hourly"
        - "After conversion, check: mean pptrate should be ~1e-5 to 1e-4 kg/m2/s for temperate climates"
      prevention: "Always verify forcing precipitation rate after conversion. Mean annual precip ~500-2000 mm/yr = 1.6e-5 to 6.3e-5 kg/m2/s."
    severity: "silent"
    cross_references: ["dt_004"]

  - id: dt_004
    stage: "s2_forcing_prep"
    failure_domain: "unit_conversion"
    symptom:
      description: "SUMMA energy balance is wildly unstable. Soil temperatures diverge to unrealistic values (>400K or <200K)."
      error_pattern: "convergence|NaN|Inf"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Air pressure in wrong units: kPa instead of Pa."
      explanation: >
        VIC forcing stores air pressure in kPa. SUMMA expects Pa. If you forget
        the *1000 conversion, air pressure is 101.325 instead of 101325. This
        causes the energy balance to fail catastrophically because saturation
        vapor pressure, psychrometric constant, and Penman-Monteith ET all
        depend on air pressure. The error is subtle: SUMMA may run for a few
        timesteps before NaN propagates.
      affected_components:
        - "convert_vic_forcing_to_summa.py airpres variable"
        - "SUMMA energy balance solver"
    remedy:
      action: "Multiply VIC pressure by 1000 when converting to SUMMA format."
      tool_to_run: "convert_vic_forcing_to_summa"
      manual_steps:
        - "Check forcing: ncdump -v airpres forcing.nc | head -20"
        - "Values should be ~80000-105000 Pa, NOT 80-105 (kPa)"
        - "If in kPa, multiply by 1000 and regenerate"
      prevention: "The convert_vic_forcing_to_summa tool handles this automatically. Never bypass it."
    severity: "fatal"
    cross_references: ["dt_003"]

  # === DEPENDENCY MISMATCH ===

  - id: dt_005
    stage: "s2_forcing_prep"
    failure_domain: "dependency_mismatch"
    symptom:
      description: "SUMMA crashes at startup with 'hruId mismatch' or 'wrong number of HRUs in forcing'."
      error_pattern: "hruId.*mismatch|dimension.*hru.*differ"
      detection_method: "log_match"
    diagnosis:
      root_cause: "HRU IDs or count in forcing NetCDF do not match the attributes file."
      explanation: >
        SUMMA requires that hruId values in the forcing file exactly match those
        in the attributes file, in the same order. If you regenerate attributes
        (changing the GRU/HRU structure) without regenerating forcing files, or
        vice versa, the IDs will not match. Even a single missing or extra HRU
        causes a fatal error.
      affected_components:
        - "Forcing NetCDF hruId variable"
        - "Attributes NetCDF hruId variable"
    remedy:
      action: "Regenerate forcing files from scratch using the current attributes file."
      tool_to_run: "convert_vic_forcing_to_summa"
      manual_steps:
        - "ncdump -v hruId attributes.nc | tail -5"
        - "ncdump -v hruId forcing_YYYY.nc | tail -5"
        - "If different, re-run convert_vic_forcing_to_summa.py with current attributes"
      prevention: "Always regenerate forcing AFTER finalizing GRU/HRU structure. Never reuse forcing from a different domain setup."
    severity: "fatal"
    cross_references: ["dt_010"]

  # === INITIAL CONDITIONS ===

  - id: dt_006
    stage: "s5_initial_conditions"
    failure_domain: "parameter_format"
    symptom:
      description: "SUMMA crashes with 'layer dimension mismatch' or 'nSoil inconsistency' at startup."
      error_pattern: "nSoil|layer.*mismatch|dimension.*midSoil"
      detection_method: "log_match"
    diagnosis:
      root_cause: "Number of soil layers in initial conditions file does not match the model configuration."
      explanation: >
        The initial conditions (coldState) NetCDF must have exactly nSoil layers
        matching the value stored in the nSoil variable. If you change the number
        of soil layers in trial parameters but do not regenerate the coldState file,
        the dimensions will not match. SUMMA checks this at startup and aborts.
      affected_components:
        - "coldState.nc dimensions"
        - "nSoil variable in coldState.nc"
    remedy:
      action: "Regenerate coldState.nc with the correct number of soil layers."
      tool_to_run: "create_initial_conditions"
      manual_steps:
        - "Check current nSoil: ncdump -v nSoil coldState.nc"
        - "Check midSoil dimension: ncdump -h coldState.nc | grep midSoil"
        - "Regenerate with matching --n_soil_layers"
      prevention: "Always regenerate initial conditions after changing soil layer configuration."
    severity: "fatal"
    cross_references: []

  # === RUNTIME ===

  - id: dt_007
    stage: "s6_execution"
    failure_domain: "runtime"
    symptom:
      description: "SUMMA convergence failure: 'dt < dtmin' or 'failed to converge' messages, then STOP."
      error_pattern: "dt.*dtmin|convergence|failed to converge"
      detection_method: "log_match"
    diagnosis:
      root_cause: "The numerical solver cannot find a stable solution within the minimum time step."
      explanation: >
        SUMMA adaptively reduces the time step when the energy balance equation
        does not converge. If it reaches the minimum (dt_init in coldState.nc
        controls the initial step, but the internal minimum is ~0.01s), it aborts.
        Common causes: (1) unrealistic forcing data (negative SW radiation,
        extreme temperature jumps), (2) very steep terrain with thin soil layers,
        (3) incompatible decision combinations (e.g., itersurf with complex
        canopy radiation).
      affected_components:
        - "SUMMA energy balance solver"
        - "Forcing data quality"
        - "Decisions configuration"
    remedy:
      action: "Check forcing data for unrealistic values. Try switching num_method from 'itersurf' to 'itertive'. Increase dt_init."
      tool_to_run: ""
      manual_steps:
        - "Check forcing: ncdump -v SWRadAtm forcing.nc | python -c 'import sys; print(min(float(x) for x in sys.stdin.read().split() if x.replace(\".\",\"\").replace(\"-\",\"\").isdigit()))'"
        - "If forcing has negative values, clip to 0"
        - "Try: num_method itertive (most robust solver)"
        - "Try: increase dt_init from 3600 to 7200 in coldState.nc"
        - "Try: use coarser soil layers (fewer, thicker layers)"
      prevention: "Always validate forcing data (no negative radiation, no extreme jumps) before running SUMMA."
    severity: "fatal"
    cross_references: ["dt_004", "dt_009"]

  - id: dt_008
    stage: "s6_execution"
    failure_domain: "runtime"
    symptom:
      description: "SUMMA crashes with STOP 20 or 'NetCDF dimension error'."
      error_pattern: "STOP 20|dimension.*error|NetCDF"
      detection_method: "log_match"
    diagnosis:
      root_cause: "NetCDF file has wrong dimensions or variable names."
      explanation: >
        SUMMA Fortran reads NetCDF files using specific dimension and variable
        names. If ANY variable is misspelled (e.g., 'ppt_rate' instead of
        'pptrate'), or dimensions are in wrong order (hru,time instead of
        time,hru), SUMMA issues STOP 20. The Fortran NF90 error messages are
        often unhelpful ('NetCDF: Variable not found').
      affected_components:
        - "Forcing NetCDF variable names"
        - "Attributes NetCDF variable names"
        - "Initial conditions NetCDF"
    remedy:
      action: "Check NetCDF variable names and dimensions against SUMMA requirements."
      tool_to_run: "validate_file_manager"
      manual_steps:
        - "ncdump -h forcing.nc and compare variable names to SUMMA docs"
        - "Required forcing vars: pptrate, airtemp, SWRadAtm, LWRadAtm, windspd, airpres, spechum"
        - "Dimensions must be (time, hru) for forcing, (hru,) for attributes"
        - "Variable names are CASE-SENSITIVE in Fortran"
      prevention: "Use validated tools to create all NetCDF files. Never hand-edit NetCDF."
    severity: "fatal"
    cross_references: []

  # === DECISIONS ===

  - id: dt_009
    stage: "s3_decisions"
    failure_domain: "parameter_format"
    symptom:
      description: "SUMMA crashes with STOP 30 or 'unknown option' for a model decision."
      error_pattern: "STOP 30|unknown.*option|invalid.*decision"
      detection_method: "log_match"
    diagnosis:
      root_cause: "A decision keyword has an invalid option value."
      explanation: >
        Each SUMMA decision has a fixed set of valid options defined in
        mDecisions.f90. Typos (e.g., 'BallBery' instead of 'BallBerry'),
        case errors (options are case-sensitive in some versions), or using
        an option from one decision with a different decision keyword all
        cause STOP 30.
      affected_components:
        - "Decisions file"
    remedy:
      action: "Use configure_decisions.py which validates all options against the known catalog."
      tool_to_run: "configure_decisions"
      manual_steps:
        - "Check each line in decisions file against VALID_DECISIONS in configure_decisions.py"
        - "Common typo: 'itertive' (correct) vs 'iterative' (wrong)"
        - "Common typo: 'numericl' (correct) vs 'numerical' (wrong)"
      prevention: "Always use configure_decisions.py. The SUMMA decision names have intentional abbreviations."
    severity: "fatal"
    cross_references: []

  # === DOMAIN SETUP ===

  - id: dt_010
    stage: "s1_domain_setup"
    failure_domain: "dependency_mismatch"
    symptom:
      description: "GRU/HRU IDs are inconsistent across NetCDF files (attributes, forcing, coldState, trialParams)."
      error_pattern: "hruId.*mismatch|inconsistent.*ID"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Files were generated at different times with different domain configurations."
      explanation: >
        SUMMA requires ALL NetCDF files to have identical hruId values in
        identical order. The attributes file defines the master list. Forcing,
        coldState, and trialParams must match exactly. If you change the domain
        setup (add/remove an HRU, change resolution) and regenerate only some
        files, the IDs will diverge.
      affected_components:
        - "attributes.nc"
        - "forcing NetCDF files"
        - "coldState.nc"
        - "trialParams.nc"
    remedy:
      action: "Regenerate ALL NetCDF files from the same attributes file."
      tool_to_run: ""
      manual_steps:
        - "Start from create_local_attributes (defines master hruId)"
        - "Then regenerate: forcing, initial conditions, trial parameters"
        - "Run validate_file_manager to confirm consistency"
      prevention: "After ANY change to GRU/HRU structure, regenerate ALL downstream NetCDF files."
    severity: "fatal"
    cross_references: ["dt_005"]

  # === SILENT ERRORS ===

  - id: dt_011
    stage: "s6_execution"
    failure_domain: "silent_error"
    symptom:
      description: "SUMMA runs to completion but all runoff values are zero or near-zero."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Precipitation forcing is zero (unit conversion error) or all water is being stored in soil/aquifer."
      explanation: >
        Three common causes: (1) Precipitation was divided by an extra factor
        during conversion, making it effectively zero. (2) The aquifer storage
        parameter is set too high, absorbing all water. (3) The soil is
        initialized as very dry (high matric head magnitude), and all
        precipitation infiltrates to replenish soil. Check mean pptrate in
        forcing file -- it should be ~1e-5 kg/m2/s for typical climates.
      affected_components:
        - "Forcing precipitation"
        - "Aquifer parameters"
        - "Initial soil moisture"
    remedy:
      action: "Check forcing precipitation values and soil initialization."
      tool_to_run: "parse_summa_output"
      manual_steps:
        - "ncdump -v pptrate forcing.nc | tail -20  # check values are non-zero"
        - "Mean pptrate should be ~1e-5 to 1e-4 kg/m2/s"
        - "Check scalarAquiferStorage in output -- if growing continuously, aquifer is absorbing everything"
        - "Try: set initial aquifer storage = 0 in coldState.nc"
        - "Try: run for 2+ years to allow spinup equilibration"
      prevention: "Always check forcing statistics after conversion. Run at least 1 year of spinup."
    severity: "silent"
    cross_references: ["dt_003"]

  - id: dt_012
    stage: "s2_forcing_prep"
    failure_domain: "silent_error"
    symptom:
      description: "SUMMA runs but ET is unrealistically high (>10 mm/day mean) or negative."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Specific humidity or air pressure units are wrong."
      explanation: >
        SUMMA expects specific humidity in g/g (dimensionless mass ratio) and
        air pressure in Pa. If humidity is in g/kg (need to divide by 1000) or
        pressure in kPa (need to multiply by 1000), the Penman-Monteith
        equation computes wrong vapor pressure deficit, leading to unrealistic
        ET. Negative ET (condensation dominant) also indicates unit issues.
      affected_components:
        - "Forcing spechum and airpres variables"
        - "SUMMA ET computation"
    remedy:
      action: "Verify humidity and pressure units in forcing file."
      tool_to_run: ""
      manual_steps:
        - "ncdump -v spechum forcing.nc | tail -5  # should be ~0.001-0.020 g/g"
        - "ncdump -v airpres forcing.nc | tail -5  # should be ~60000-105000 Pa"
        - "If spechum > 1: divide by 1000 (was g/kg)"
        - "If airpres < 1000: multiply by 1000 (was kPa)"
      prevention: "Use convert_vic_forcing_to_summa.py which handles all unit conversions."
    severity: "silent"
    cross_references: ["dt_003", "dt_004"]

  - id: dt_013
    stage: "s6_execution"
    failure_domain: "runtime"
    symptom:
      description: "SUMMA output has NaN for some HRUs but not others."
      error_pattern: "NaN"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Partial forcing coverage -- some HRUs have missing or fill-value forcing data."
      explanation: >
        When VIC forcing files do not cover all HRUs (e.g., a coastal cell
        partially over water), the forcing conversion fills those HRUs with
        default values. If the default is the fill value (-9999), SUMMA
        propagates NaN through the energy balance. This often happens at
        basin edges where the grid intersects the basin boundary.
      affected_components:
        - "Forcing NetCDF (edge HRUs)"
        - "GRU/HRU definition (boundary cells)"
    remedy:
      action: "Check for fill values in forcing. Remove HRUs with no forcing coverage."
      tool_to_run: ""
      manual_steps:
        - "python -c \"from netCDF4 import Dataset; ds=Dataset('forcing.nc'); print(ds.variables['pptrate'][-1,:])\""
        - "If any values are -9999 or NaN, identify those HRUs"
        - "Either remove those HRUs from attributes or ensure forcing has valid data"
      prevention: "After grid generation, verify every HRU has corresponding VIC forcing data."
    severity: "degraded"
    cross_references: []

  - id: dt_014
    stage: "s4_parameters"
    failure_domain: "parameter_format"
    symptom:
      description: "Trial parameters are ignored -- SUMMA uses default values from lookup tables."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Trial parameter NetCDF variable names do not match SUMMA's internal parameter names."
      explanation: >
        SUMMA parameter names are case-sensitive and specific. For example,
        'k_soil' (correct) vs 'ksat' (wrong), 'theta_sat' (correct) vs
        'porosity' (wrong). If the variable name in trialParams.nc does not
        match, SUMMA silently ignores it and uses the default from SOILPARM.TBL.
        No warning is issued.
      affected_components:
        - "trialParams.nc variable names"
    remedy:
      action: "Verify parameter names match SUMMA's internal names exactly."
      tool_to_run: "set_trial_parameters"
      manual_steps:
        - "ncdump -h trialParams.nc to list variable names"
        - "Cross-reference with SUMMA source: build/source/engine/popMetadat.f90"
        - "Common errors: 'ksat' should be 'k_soil', 'porosity' should be 'theta_sat'"
      prevention: "Use set_trial_parameters.py which uses verified parameter names from PARAM_RANGES."
    severity: "silent"
    cross_references: []

  - id: dt_015
    stage: "s5_initial_conditions"
    failure_domain: "silent_error"
    symptom:
      description: "First 1-2 years of SUMMA output show unrealistic patterns (runoff spike or drought) before stabilizing."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Cold start initial conditions are far from equilibrium."
      explanation: >
        Cold start assumes uniform soil moisture and temperature. In reality,
        the soil profile has a characteristic moisture and temperature
        distribution. SUMMA takes 1-2 years to reach dynamic equilibrium
        (spinup). If you analyze the full output including the spinup period,
        the early data is misleading. For basins with significant groundwater,
        spinup can take 5+ years.
      affected_components:
        - "Initial conditions"
        - "Output analysis period"
    remedy:
      action: "Discard the first 1-2 years of output as spinup."
      tool_to_run: "parse_summa_output"
      manual_steps:
        - "If simulating 2000-2010, start forcing from 1998 and discard 1998-1999 in analysis"
        - "For groundwater-dominated basins, use 3-5 year spinup"
        - "Alternatively: run once, save the final state as a restart file, re-run from that state"
      prevention: "Always add 1-2 extra years at the start for spinup. Report only the post-spinup period."
    severity: "silent"
    cross_references: []

  # === ENVIRONMENT ===

  - id: dt_016
    stage: "s6_execution"
    failure_domain: "environment"
    symptom:
      description: "summa.exe fails with 'error while loading shared libraries: libnetcdff.so.7' or similar."
      error_pattern: "libnetcdff|shared library|GLIBC"
      detection_method: "log_match"
    diagnosis:
      root_cause: "NetCDF-Fortran shared library not in LD_LIBRARY_PATH."
      explanation: >
        SUMMA links dynamically to libnetcdff (NetCDF-Fortran) and liblapack.
        If the binary was compiled on a different system or the library paths
        are not set, the dynamic linker cannot find the shared objects. This
        is a common issue when moving binaries between machines.
      affected_components:
        - "summa.exe dynamic linking"
        - "System library paths"
    remedy:
      action: "Set LD_LIBRARY_PATH to include NetCDF-Fortran library directory."
      tool_to_run: ""
      manual_steps:
        - "ldd model/summa/bin/summa.exe  # check which libs are missing"
        - "locate libnetcdff.so  # find the library"
        - "export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
        - "Or recompile: cd model/summa/build && make clean && make"
      prevention: "After building SUMMA, immediately test: ./summa.exe (should print usage). If it fails, fix LD_LIBRARY_PATH before proceeding."
    severity: "fatal"
    cross_references: []

  # === PHYSICS COMPARISON ===

  - id: dt_017
    stage: "s7_physics_comparison"
    failure_domain: "dependency_mismatch"
    symptom:
      description: "Physics comparison shows identical results for different decision options."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "The modified decisions file was not actually used -- SUMMA read the original."
      explanation: >
        When running multiple physics variants, each must use a different
        decisions file. If the fileManager still points to the original
        decisions file (the modification was to a copy that was not
        referenced), all runs use the same physics and produce identical
        output. This is easy to miss because all runs succeed.
      affected_components:
        - "Modified fileManager.txt"
        - "Decisions file path in fileManager"
    remedy:
      action: "Verify each modified fileManager points to its own decisions file."
      tool_to_run: "compare_physics"
      manual_steps:
        - "For each variant, check: grep decisionsFile fileManager_runX.txt"
        - "Verify the decisions files are actually different: diff decisions_run1.txt decisions_run2.txt"
        - "Use compare_physics.py which handles this correctly"
      prevention: "Use compare_physics.py instead of manually managing multiple runs."
    severity: "silent"
    cross_references: []

  # === DOMAIN SETUP SILENT ERROR ===

  - id: dt_018
    stage: "s1_domain_setup"
    failure_domain: "silent_error"
    symptom:
      description: "All HRUs have identical elevation, slope, and area values despite being in different locations."
      error_pattern: ""
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "DEM raster does not overlap with basin shapefile due to CRS mismatch."
      explanation: >
        If the basin shapefile is in a projected CRS (e.g., UTM) but the DEM
        is in geographic CRS (WGS84), the spatial intersection returns zero
        overlap. The tool falls back to default values (elevation=0, slope=0.01)
        for all HRUs. SUMMA still runs but with meaningless terrain attributes.
        This is the same CRS mismatch trap seen in SWMM and MODFLOW coupling.
      affected_components:
        - "Basin shapefile CRS"
        - "DEM raster CRS"
        - "create_gru_hru.py spatial intersection"
    remedy:
      action: "Reproject basin shapefile and DEM to the same CRS (recommend EPSG:4326)."
      tool_to_run: ""
      manual_steps:
        - "python -c \"import geopandas as gpd; print(gpd.read_file('basin.shp').crs)\""
        - "python -c \"import rasterio; print(rasterio.open('dem.tif').crs)\""
        - "If different, reproject shapefile: gdf.to_crs('EPSG:4326').to_file('basin_4326.shp')"
      prevention: "Always verify CRS match before running create_gru_hru. The tool should assert CRS equality."
    severity: "silent"
    cross_references: []

  # === BUGS FOUND DURING WANGJIABA KI TEST (2026-04-02) ===

  - id: dt_019
    stage: "s4_parameters"
    failure_domain: "parameter_format"
    symptom:
      description: "SUMMA produces NaN for all soil moisture and runoff variables. Model runs but output is meaningless."
      error_pattern: "NaN|nan|all-zero soil moisture"
      detection_method: "output_check"
    diagnosis:
      root_cause: "vGn_alpha (van Genuchten alpha) is positive. SUMMA requires NEGATIVE values (matric head convention)."
      explanation: >
        SUMMA's van Genuchten functions in soil_utils.f90 expect alpha < 0 because matric head (psi)
        is negative for unsaturated conditions. The product alpha*psi must be positive for the
        power-law to work. With positive alpha and negative psi, (alpha*psi)^n produces NaN for
        non-integer n. The SOILPARM.TBL reference values are all negative: Sand=-3.524, Loam=-1.112,
        Clay=-1.496. Valid range: [-1.0, -0.01] from localParamInfo.txt.
      affected_components:
        - "set_trial_parameters.py PARAM_RANGES['vGn_alpha']"
        - "soil_utils.f90:volFracLiq, matricHead, hydCond_psi"
    remedy:
      action: "Use negative vGn_alpha values. Range: [-1.0, -0.01]. Typical loam: -1.1."
      tool_to_run: ""
      manual_steps:
        - "Check trialParams.nc: ncdump -v vGn_alpha trialParams.nc"
        - "If positive, negate: vGn_alpha = -abs(vGn_alpha)"
        - "Reference values by soil type in SOILPARM.TBL"
      prevention: "set_trial_parameters.py PARAM_RANGES now enforces [-1.0, -0.01] range."
    severity: "silent"
    cross_references: ["dt_013"]

  - id: dt_020
    stage: "s3_decisions"
    failure_domain: "decision_incompatibility"
    symptom:
      description: "SUMMA crashes with 'numerical derivates do not account for the cross derivatives between hydrology and thermodynamics'."
      error_pattern: "cross derivatives|numericl"
      detection_method: "log_match"
    diagnosis:
      root_cause: "fDerivMeth=numericl is completely broken in SUMMA — it cannot compute cross-derivative terms."
      explanation: >
        soilLiqFlx.f90:305-308 immediately returns err=20 when fDerivMeth=numericl is selected.
        The numerical derivative method was never fully implemented for coupled hydro-thermal
        solutions. This is NOT a bug but a design limitation: analytical derivatives are required
        for the tightly-coupled energy-water solver. The old KI DEFAULT_DECISIONS had
        fDerivMeth=numericl which crashed every run.
      affected_components:
        - "configure_decisions.py DEFAULT_DECISIONS"
        - "soilLiqFlx.f90 function soilLiqFlx()"
    remedy:
      action: "Set fDerivMeth=analytic. This is the ONLY working option."
      tool_to_run: ""
      manual_steps:
        - "Edit decisions.txt: fDerivMeth  analytic"
      prevention: "configure_decisions.py now defaults to analytic and errors on numericl."
    severity: "fatal"
    cross_references: ["dt_009"]

  - id: dt_021
    stage: "s3_decisions"
    failure_domain: "decision_incompatibility"
    symptom:
      description: "SUMMA crashes with 'lower boundary condition for soil hydology must be zeroFlux with qbaseTopmodel'."
      error_pattern: "zeroFlux.*qbaseTopmodel|qTopmodl.*bcLowrSoiH"
      detection_method: "log_match"
    diagnosis:
      root_cause: "groundwatr=qTopmodl requires bcLowrSoiH=zeroFlux AND hc_profile=pow_prof."
      explanation: >
        mDecisions.f90:660-671 enforces two hard constraints for TOPMODEL groundwater:
        (1) bcLowrSoiH must be zeroFlux (TOPMODEL handles all baseflow, no free drainage),
        (2) hc_profile must be pow_prof (power-law transmissivity profile required by theory).
        The old KI defaults had groundwatr=qTopmodl with bcLowrSoiH=drainage which crashed.
        Safe alternative: use groundwatr=noXplict with bcLowrSoiH=drainage (Reynolds default).
      affected_components:
        - "configure_decisions.py DEFAULT_DECISIONS"
        - "mDecisions.f90 decision validation"
    remedy:
      action: "Either (a) set bcLowrSoiH=zeroFlux + hc_profile=pow_prof for qTopmodl, or (b) use groundwatr=noXplict with drainage."
      tool_to_run: ""
      manual_steps:
        - "Option A: groundwatr=qTopmodl, bcLowrSoiH=zeroFlux, hc_profile=pow_prof"
        - "Option B (safer): groundwatr=noXplict, bcLowrSoiH=drainage, hc_profile=constant"
      prevention: "configure_decisions.py now validates incompatibilities before writing."
    severity: "fatal"
    cross_references: ["dt_009", "dt_020"]

  - id: dt_023
    stage: "s2_forcing_prep"
    failure_domain: "unit_conversion"
    symptom:
      description: "All forcing values are physically wrong: precip ~100 mm/day, temperature ~50°C, pressure ~2500 Pa, wind ~160 m/s. SUMMA may still run but output is meaningless."
      error_pattern: "unrealistic forcing|pptrate mean > 10|airtemp mean > 320"
      detection_method: "output_check"
    diagnosis:
      root_cause: "VIC forcing column order mismatch. HydroCraft VIC uses AIR_TEMP,PREC,PRESSURE,SWDOWN,LWDOWN,VP,WIND (7 cols) but converter assumed PREC,TMAX,TMIN,WIND,SW,LW,PRESSURE,QAIR (8 cols)."
      explanation: >
        HydroCraft's forcing_1d.py + process_forcing.py produce VIC forcing in the order
        defined by the global_param FORCE_TYPE directives. The standard HydroCraft order is
        AIR_TEMP(°C), PREC(mm/3hr), PRESSURE(kPa), SWDOWN(W/m²), LWDOWN(W/m²), VP(kg/kg), WIND(m/s).
        The SUMMA converter originally assumed the "classic" 8-column VIC order which puts PREC first.
        This caused every column to be misassigned: temperature was treated as precip, pressure as
        temperature (then +273.15), etc. The resulting forcing looked structurally valid (correct
        NetCDF format, correct units attributes) but the VALUES were wrong by factors of 40-200x.
        This is a SILENT error because SUMMA still runs to completion with garbage forcing.
      affected_components:
        - "convert_vic_forcing_to_summa.py column mapping"
        - "VIC global_param FORCE_TYPE order"
    remedy:
      action: "Use --column_order hydrocraft (default) for HydroCraft VIC forcing. Always verify forcing with a sanity check after conversion."
      tool_to_run: ""
      manual_steps:
        - "Check: python3 -c \"from netCDF4 import Dataset; import numpy as np; ds=Dataset('forcing_YYYY.nc'); print('P=', np.nanmean(ds['pptrate'][:])*86400, 'mm/day, T=', np.nanmean(ds['airtemp'][:])-273.15, '°C')\""
        - "Expected: P=1-5 mm/day, T=10-20°C (temperate), P=99000-103000 Pa, SW=100-250 W/m², LW=250-400 W/m²"
        - "If values are far off, the column order is wrong"
      prevention: "Converter now defaults to 'hydrocraft' column order. Added --column_order flag. Always run sanity check on forcing after conversion."
    severity: "silent"
    cross_references: ["dt_003", "cm_001"]

  - id: dt_025
    stage: "s6_execution"
    failure_domain: "unit_conversion"
    symptom:
      description: "SUMMA appears to produce zero runoff (PBIAS=-99.9%) despite correct precipitation and ET. Water balance appears to have a 1000 mm/yr gap."
      error_pattern: "PBIAS.*-99|runoff.*0 mm|RainPlusMelt.*1 mm"
      detection_method: "output_check"
    diagnosis:
      root_cause: "SUMMA output variables use MIXED UNITS: some in kg/m²/s (=mm/s), others in m/s. A factor of 1000 difference."
      explanation: >
        SUMMA's computFlux.f90 divides throughfall (kg/m²/s) by iden_water (1000 kg/m³) to
        get RainPlusMelt in m/s. Other variables like scalarThroughfallRain and scalarTotalET
        remain in kg/m²/s. When computing discharge Q=runoff×area, the correct formula is
        Q(m³/s) = scalarTotalRunoff(m/s) × HRUarea(m²) — NO division by 1000.
        If you divide by 1000 (assuming kg/m²/s), Q is 1000x too low.

        Variables in m/s:  scalarTotalRunoff, scalarRainPlusMelt, scalarInfiltration,
                           scalarSoilDrainage, scalarSurfaceRunoff, averageRoutedRunoff
        Variables in kg/m²/s: scalarThroughfallRain, scalarThroughfallSnow, scalarTotalET,
                              scalarCanopyEvaporation, scalarGroundEvaporation, pptrate

        This cost 2 days of debugging (2026-04-11 to 2026-04-12). The model was producing
        realistic runoff (508 mm/yr) the entire time.
      affected_components:
        - "parse_summa_output.py discharge calculation"
        - "Any post-processing that converts runoff to m³/s"
    remedy:
      action: "Check the 'units' attribute of each output variable. Use Q = scalarTotalRunoff(m/s) × area(m²). Do NOT divide by 1000."
      tool_to_run: ""
      manual_steps:
        - "ncdump -h output.nc | grep 'units' to see m s-1 vs kg m-2 s-1"
        - "For Q: Q_m3s = scalarTotalRunoff * HRUarea (both in SI, result is m³/s)"
        - "For water balance: convert all to mm/yr using the correct factor per unit"
        - "  kg/m²/s → mm/yr: multiply by 86400 × 365"
        - "  m/s → mm/yr: multiply by 86400 × 365 × 1000"
      prevention: "Always check units attribute before computing. Add unit check to parse_summa_output.py."
    severity: "silent"
    cross_references: ["cm_001"]

  - id: dt_024
    stage: "s1_domain_setup"
    failure_domain: "classification_mismatch"
    symptom:
      description: "SUMMA crashes with 'canopySnow/failed to converge [mass]' for ALL GRUs at first freezing event. nrg_flux fails universally on subtropical basins."
      error_pattern: "canopySnow.*failed to converge.*mass"
      detection_method: "log_match"
    diagnosis:
      root_cause: "AVHRR IGBP-DIS class 11 (Wetland/Cropland) mapped directly as USGS class 11 (Deciduous Broadleaf Forest, 20m canopy)."
      explanation: >
        AVHRR 1km uses IGBP-DIS classification. SUMMA VEGPARM.TBL uses USGS 27-class scheme.
        Class 11 means completely different things: IGBP=Wetland (flat cropland/paddy in China),
        USGS=Deciduous Broadleaf Forest (ZTOPV=20m, LAI=1.85-3.31, high interception). In Bengbu,
        74% of the basin is AVHRR class 11 (rice paddies). Without crosswalk, 74% of HRUs get
        treated as 20m tall deciduous forest. The tall canopy interception capacity combined with
        winter freezing creates numerically stiff equations in canopySnow that fail to converge.
        This is a silent setup error — SUMMA processes the wrong veg type without warning.
      affected_components:
        - "create_gru_hru.py IGBP→USGS crosswalk"
        - "canopySnow.f90 convergence (convTolerMass=0.0001)"
        - "VEGPARM.TBL canopy height/LAI lookup"
    remedy:
      action: "Apply IGBP→USGS crosswalk table in create_gru_hru.py. Key mapping: IGBP 11→USGS 3 (Irrigated Cropland)."
      tool_to_run: ""
      manual_steps:
        - "Check veg types: ncdump -v vegTypeIndex attributes.nc"
        - "If subtropical basin has many type 11 (Deciduous Broadleaf): wrong classification"
        - "Apply crosswalk: IGBP_TO_USGS = {11:3, 12:2, 10:7, 7:9, 6:8, ...}"
        - "Rebuild attributes.nc with corrected veg types"
      prevention: "create_gru_hru.py now includes IGBP_TO_USGS crosswalk table (added 2026-04-12)."
    severity: "fatal"
    cross_references: ["cm_001"]

  - id: dt_022
    stage: "s3_decisions"
    failure_domain: "parameter_format"
    symptom:
      description: "SUMMA crashes with 'vegTypeTable not found in MPTABLE.TBL' or similar table section error."
      error_pattern: "MPTABLE|vegTypeTable|not found in table"
      detection_method: "log_match"
    diagnosis:
      root_cause: "vegeParTbl=MODIFIED_IGBP_MODIS_NOAH selected but MPTABLE.TBL lacks that section."
      explanation: >
        MPTABLE.TBL shipped with some SUMMA case studies only contains the USGS vegetation
        section. If vegeParTbl is set to MODIFIED_IGBP_MODIS_NOAH, SUMMA looks for that
        section header in MPTABLE.TBL and crashes when it's not found. The Reynolds Mountain
        test case uses vegeParTbl=USGS. Always verify MPTABLE.TBL contains the section
        matching your vegeParTbl decision.
      affected_components:
        - "MPTABLE.TBL content"
        - "vegeParTbl decision"
        - "case_study/base_settings/MPTABLE.TBL"
    remedy:
      action: "Use vegeParTbl=USGS (always available), or copy a complete MPTABLE.TBL from case_study/base_settings/."
      tool_to_run: ""
      manual_steps:
        - "grep 'MODIFIED_IGBP_MODIS_NOAH' settings/MPTABLE.TBL"
        - "If missing: cp model/summa/case_study/base_settings/MPTABLE.TBL settings/"
        - "Or change decision: vegeParTbl  USGS"
      prevention: "Default decisions now use vegeParTbl=USGS. create_file_manager.py should verify MPTABLE.TBL sections."
    severity: "fatal"
    cross_references: []
