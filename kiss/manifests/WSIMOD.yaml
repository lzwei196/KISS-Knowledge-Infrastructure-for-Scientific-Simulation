kiss_manifest_version: 1
model: WSIMOD
binary_type: Python
verified: observed
install_dir: WSIMOD

acquire:
  strategy: pip
  package: wsimod
  produces: wsimod

python_deps: [wsimod]

reference_case: >-
  python -c "import wsimod; print(wsimod.__name__, 'importable')"

notes: >-
  OBSERVED 2026-08-18: `kiss init WSIMOD` installed wsimod 0.8.1 into a clean venv
  and the KI's own preflight_check.py passed with no hand-written recipe. The
  package name was resolved from the KI directory name and confirmed by import,
  not assumed from a PyPI name match.
