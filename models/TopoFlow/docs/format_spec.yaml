model:
  name: "TopoFlow"
  version: "3.6"
  domain: "Spatially-distributed hydrology"
  binary_path: "KISSPATH_PYTHON_ENV/bin/python"
  framework: "EMELI (Experimental Modeling Environment for Linking and Interoperability)"
  routing: "D8 steepest-descent flow grid"

inputs:
  forcing:
    - name: "P_rain"
      unit: "mm/hr"
      valid_range: [0.0, 500.0]
      description: "Precipitation rate — MUST be in mm/hr, not m/s or mm/day"
    - name: "T_air"
      unit: "deg_C"
      valid_range: [-50.0, 60.0]
      description: "Air temperature — MUST be in Celsius, not Kelvin"
    - name: "RH"
      unit: "dimensionless"
      valid_range: [0.0, 1.0]
      description: "Relative humidity as fraction 0–1"
    - name: "u_z"
      unit: "m/s"
      valid_range: [0.0, 50.0]
      description: "Wind speed at measurement height z"

  parameters:
    critical:
      - name: "Ks"
        unit: "m/s"
        valid_range: [1.0e-7, 1.0e-3]
        description: "Saturated hydraulic conductivity — MUST be in m/s, not mm/hr"
      - name: "theta_s"
        unit: "dimensionless"
        valid_range: [0.30, 0.55]
        description: "Saturated soil porosity (fraction 0–1, not percentage)"
      - name: "theta_i"
        unit: "dimensionless"
        valid_range: [0.10, 0.40]
        description: "Initial soil moisture content (fraction 0–1)"
      - name: "G"
        unit: "m"
        valid_range: [0.01, 1.0]
        description: "Capillary length / wetting front suction — MUST be in meters, not cm"
      - name: "Manning_n"
        unit: "s/m^(1/3)"
        valid_range: [0.01, 0.20]
        description: "Manning roughness coefficient — ensure not inverted (1/n != n)"
      - name: "channel_width"
        unit: "m"
        valid_range: [0.5, 50.0]
        description: "Channel width — must be > 0 everywhere"
      - name: "slope"
        unit: "m/m"
        valid_range: [1.0e-6, 1.0]
        description: "Terrain slope — must have no zero values (floor at 1e-6)"
      - name: "dt"
        unit: "s"
        valid_range: [1.0, 60.0]
        description: "Computation timestep — must satisfy CFL condition"
      - name: "alpha_PT"
        unit: "dimensionless"
        valid_range: [1.0, 1.74]
        description: "Priestley-Taylor evapotranspiration coefficient"
      - name: "c0_snow"
        unit: "mm/deg_C/day"
        valid_range: [1.0, 8.0]
        description: "Degree-day snowmelt factor"

  files:
    - name: "DEM"
      format: "RTG binary (float32, little-endian, row-major)"
      extension: ".rtg"
      companion: ".rti header with nrows, ncols, cell_size"
    - name: "D8 flow codes"
      format: "RTG binary"
      extension: ".rtg"
      note: "Must be recomputed if DEM is modified"
    - name: "slope grid"
      format: "RTG binary"
      extension: ".rtg"
    - name: "contributing area"
      format: "RTG binary"
      extension: ".rtg"
    - name: "precipitation time series"
      format: "text"
      extension: ".txt"
    - name: "provider file"
      format: "text"
      extension: "_providers.txt"
      note: "Component names are case-sensitive"
    - name: "configuration files"
      format: "pipe-delimited text"
      extension: ".cfg"
      note: "One per component (meteorology, channels, infil, snow, evap, satzone)"

outputs:
  primary:
    - name: "Q_outlet"
      unit: "m3/s"
      valid_range: [0.0, 1.0e6]
      file: "*_0D-Q.txt"
      description: "Outlet discharge hydrograph"
    - name: "depth"
      unit: "m"
      valid_range: [0.0, 50.0]
      file: "*_0D-d.txt"
      description: "Outlet water depth"
    - name: "velocity"
      unit: "m/s"
      valid_range: [0.0, 20.0]
      file: "*_0D-u.txt"
      description: "Outlet flow velocity"
  gridded:
    - name: "Q_spatial"
      unit: "m3/s"
      file: "*_2D-Q.nc"
      format: "NetCDF"
    - name: "depth_spatial"
      unit: "m"
      file: "*_2D-d.nc"
      format: "NetCDF"
    - name: "infiltration_rate"
      unit: "m/s"
      file: "*_2D-v0.nc"
      format: "NetCDF"
  reports:
    - name: "run_summary"
      file: "*_report.txt"
      description: "Peak Q, volumes, mass balance"

known_issues:
  - id: "dt_001"
    description: "Precipitation in mm/day instead of mm/hr causes 24x flood overestimate"
  - id: "dt_002"
    description: "Precipitation pre-converted to m/s causes near-zero runoff"
  - id: "dt_003"
    description: "Zero slope cells cause division-by-zero crash"
  - id: "dt_004"
    description: "Capillary length G in cm instead of m causes 100x infiltration error"
  - id: "dt_005"
    description: "Temperature in Kelvin instead of Celsius breaks snowmelt/ET"
  - id: "dt_007"
    description: "RTG/RTI dimension mismatch causes silent data corruption"
