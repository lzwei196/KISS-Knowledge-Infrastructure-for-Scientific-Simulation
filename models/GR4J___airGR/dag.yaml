template_version: "3.5"

identity:
  model_id: "GR4J___airGR"
  scientific_reference_version: "GR4J (Perrin, Michel & Andreassian 2003, J. Hydrology 279:275-289)"
  implementation:
    id: "airgr-gr4j"
    version: "airGR 1.7.8"
    provenance: "Fortran 90 water-balance core (frun_GR4J.f90) wrapped by the R package airGR (INRAE / HYCAR, Antony)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "GPL-2.0-only"
  repo_url: "https://gitlab.irstea.fr/HYCAR-Hydro/airgr"

boundary:
  scope_in:
    - "Daily lumped catchment rainfall-runoff transform (P, PE -> Qsim)"
    - "Production (soil-moisture) store with interception, evaporation, percolation"
    - "Two unit hydrographs (UH1 slow 90%, UH2 fast direct 10%)"
    - "Nonlinear routing store"
    - "Inter-catchment groundwater exchange (X2)"
  scope_out:
    - "Snow accumulation/melt (only when coupled to the separate CemaNeige module)"
    - "Physically-based soil parameters (model is conceptual; X1/X3 are calibrated, not soil-derived)"
    - "Radiation and wind drivers (model consumes PE, not radiation/wind directly)"
    - "Spatial / gridded routing within the catchment"
  spatial: "0-D point"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Water mass balance over the lumped catchment, EXCEPT the inter-catchment groundwater exchange flux (X2 term, output AExch) is an open-boundary source/sink: when AExch != 0 the closed catchment water balance is not strictly conserved. No energy balance is computed; actual ET is a demand-side draw on the production store, not an energy budget."

inputs:
  forcing:
    - category: "forcing"
      name: "Precip"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "catchment-average daily precipitation total (sum of any sub-daily values), aligned 1:1 with DatesR"
      notes: "Must be >= 0 with no NA (NA triggers a stop() at input creation). Sub-daily forcing must be SUMMED to daily, not averaged."
    - category: "forcing"
      name: "PotEvap"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "daily catchment-average potential evapotranspiration, aligned 1:1 with DatesR"
      notes: "Either observed/pre-computed or derived from the Oudin formula (PE = GE*(T+5)/100/28.5 for T >= -5 degC, GE = extraterrestrial radiation from Julian day + latitude). Must be >= 0, no NA."
    - category: "forcing"
      name: "DatesR"
      unit: "POSIXt"
      source_kind: "forcing"
      model_input_format: "continuous daily date vector (no gaps, no duplicates), same length as Precip and PotEvap"
  parameters:
    - category: "parameter"
      name: "X1 — production store capacity"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "scalar real; typical 100-1200 mm; calibrated in log space"
      notes: "Maximum capacity of the production (soil-moisture) store."
    - category: "parameter"
      name: "X2 — inter-catchment exchange coefficient"
      unit: "mm/day"
      source_kind: "calibrated"
      model_input_format: "scalar real; typical -5 to 3 mm/day; can be negative (catchment loses water to groundwater); calibrated in sinh space"
      notes: "Groundwater exchange term; sign sets water gain vs loss."
    - category: "parameter"
      name: "X3 — routing store capacity"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "scalar real; typical 20-300 mm; calibrated in log space"
      notes: "Maximum (one-day-ahead) capacity of the nonlinear routing store."
    - category: "parameter"
      name: "X4 — unit hydrograph time constant"
      unit: "day"
      source_kind: "calibrated"
      model_input_format: "scalar real; typical 1.1-2.9 d; calibrated via linear rescaling; hard physical floor 0.5 d"
      notes: "Time base of UH1 (length X4) and UH2 (length 2*X4)."
  initial_conditions:
    - category: "initial_condition"
      name: "Production store initial level"
      unit: "mm"
      source_kind: "default"
      model_input_format: "fraction of X1 (default 0.30 * X1) or supplied state vector index 1"
      notes: "Stores typically start far from equilibrium; >= 1 year warm-up advised (2-3 yr for arid catchments)."
    - category: "initial_condition"
      name: "Routing store initial level"
      unit: "mm"
      source_kind: "default"
      model_input_format: "fraction of X3 (default 0.50 * X3) or supplied state vector index 2"
    - category: "initial_condition"
      name: "UH1 / UH2 initial ordinate storages"
      unit: "mm"
      source_kind: "default"
      model_input_format: "default all-zero; or supplied at state-vector offsets 7+K (UH1) and 7+NH+K (UH2)"
  boundary_conditions:
    - category: "boundary_condition"
      name: "Warm-up period selection"
      unit: "timesteps (days)"
      source_kind: "user_provided"
      model_input_format: "warm-up index window preceding the run period; >= 1 year recommended"
      notes: "Control choice that sets how far stores are spun up before the scored run window."
    - category: "boundary_condition"
      name: "Optional CemaNeige snow coupling"
      unit: "switch"
      source_kind: "user_provided"
      model_input_format: "selection of RunModel_CemaNeigeGR4J in place of RunModel_GR4J; adds TempMean, HypsoData, CTG, Kf"
      notes: "Upstream snow module; off by default. When on, the run is no longer pure GR4J."

processes:
  modules:
    - name: "frun_gr4j"
      role: "driver"
      brief: "Top-level routine: unpacks the start-state vector, computes UH ordinates once (S-curve exponent D=2.5), runs the daily time loop calling MOD_GR4J, repacks the end-state vector."
    - name: "MOD_GR4J"
      role: "process_solver"
      brief: "Single-timestep GR4J solver orchestrating production store, percolation, rainfall split, UH convolution, exchange, routing store and runoff summation; writes the 18 MISC diagnostics."
    - name: "ProductionStore"
      role: "process_solver"
      brief: "Updates St(1): partitions P-E into net rainfall PN / net evap EN, fills (Ps) or evaporates (AE) via a tanh formulation with the WS argument clamped <= 13 to avoid overflow."
    - name: "Percolation"
      role: "process_solver"
      brief: "Drains the production store: Perc = St(1)*(1-(1+(St(1)/(9/4*X1))^4)^-0.25); adds Perc to effective rainfall PR."
    - name: "RainfallSplit"
      role: "allocator"
      brief: "Splits effective rainfall PR into PRUH1 = 0.9*PR (UH1, slow routed branch) and PRUH2 = 0.1*PR (UH2, fast direct branch); the 0.9 split is a fixed structural constant."
    - name: "SS1"
      role: "process_solver"
      brief: "S-curve for UH1: 0 for I<=0, (I/X4)^2.5 for I<X4, else 1."
    - name: "SS2"
      role: "process_solver"
      brief: "S-curve for UH2: rises 0.5*(I/X4)^2.5 up to X4, then 1-0.5*(2-I/X4)^2.5 up to 2*X4, else 1 (double-length symmetric UH)."
    - name: "UH1"
      role: "integrator"
      brief: "Builds NH=20 ordinates from successive differences of SS1 and convolves PRUH1 into StUH1 each timestep; StUH1(1) emerges as Q9."
    - name: "UH2"
      role: "integrator"
      brief: "Builds 2*NH=40 ordinates from successive differences of SS2 and convolves PRUH2 into StUH2 each timestep; StUH2(1) emerges as Q1."
    - name: "IntercatchmentExchange"
      role: "process_solver"
      brief: "Computes Exch = X2*(St(2)/X3)^3.5 from the routing-store level; this single term feeds both the routing branch (AExch1) and the direct branch (AExch2)."
    - name: "RoutingStore"
      role: "process_solver"
      brief: "Updates St(2): adds Q9 + Exch, then drains QR = St(2)*(1-(1+(St(2)/X3)^4)^-0.25)."
    - name: "RunoffSummation"
      role: "integrator"
      brief: "Combines routing outflow QR with direct flow QD = max(0, Q1 + Exch) into Qsim = QR + QD, clamped >= 0."
  internal_edges:
    - from: "Inputs"
      to: "frun_gr4j"
      kind: "consumes_input"
      brief: "Start-state vector (St levels at offsets 1,2; UH storages at 7+K and 7+NH+K) unpacked at run start."
    - from: "Inputs"
      to: "MOD_GR4J"
      kind: "consumes_input"
      brief: "Daily Precip and PotEvap read each timestep and passed to the solver."
    - from: "frun_gr4j"
      to: "UH1"
      kind: "invokes"
      brief: "Computes UH1 ordinates once (from X4, D=2.5) before the time loop."
    - from: "frun_gr4j"
      to: "UH2"
      kind: "invokes"
      brief: "Computes UH2 ordinates once (from X4, D=2.5) before the time loop."
    - from: "UH1"
      to: "SS1"
      kind: "invokes"
      brief: "OrdUH1(I) = SS1(I) - SS1(I-1)."
    - from: "UH2"
      to: "SS2"
      kind: "invokes"
      brief: "OrdUH2(I) = SS2(I) - SS2(I-1)."
    - from: "frun_gr4j"
      to: "MOD_GR4J"
      kind: "invokes"
      brief: "Calls MOD_GR4J once per daily timestep."
    - from: "ProductionStore"
      to: "Prod (St(1))"
      kind: "reads_state"
      brief: "Reads St(1) for the tanh fill/evap formulas (Sr = St(1)/X1)."
    - from: "ProductionStore"
      to: "Prod (St(1))"
      kind: "writes_state"
      brief: "Updates St(1) by Ps (fill) and AE (evaporation)."
    - from: "Percolation"
      to: "Prod (St(1))"
      kind: "reads_state"
      brief: "Reads St(1) to compute Perc via the (9/4) power law."
    - from: "Percolation"
      to: "Prod (St(1))"
      kind: "writes_state"
      brief: "Subtracts Perc from the production store."
    - from: "Percolation"
      to: "RainfallSplit"
      kind: "invokes"
      brief: "PR = PN - Ps + Perc feeds the effective-rainfall split."
    - from: "RainfallSplit"
      to: "StUH1(1:20)"
      kind: "writes_state"
      brief: "Convolution updates StUH1(K) = StUH1(K+1) + OrdUH1(K)*0.9*PR."
    - from: "RainfallSplit"
      to: "StUH2(1:40)"
      kind: "writes_state"
      brief: "Convolution updates StUH2(K) = StUH2(K+1) + OrdUH2(K)*0.1*PR."
    - from: "Rout (St(2))"
      to: "IntercatchmentExchange"
      kind: "reads_state"
      brief: "Exch = X2*(St(2)/X3)^3.5 reads the routing-store level."
    - from: "StUH1(1:20)"
      to: "RoutingStore"
      kind: "reads_state"
      brief: "StUH1(1) = Q9 added to the routing store along with Exch."
    - from: "IntercatchmentExchange"
      to: "RoutingStore"
      kind: "invokes"
      brief: "AExch1 (the routing-branch share of Exch) added to St(2)."
    - from: "RoutingStore"
      to: "Rout (St(2))"
      kind: "writes_state"
      brief: "St(2) = St(2) + Q9 + Exch - QR each timestep."
    - from: "RoutingStore"
      to: "RunoffSummation"
      kind: "invokes"
      brief: "QR (routing-store outflow) feeds total runoff."
    - from: "StUH2(1:40)"
      to: "RunoffSummation"
      kind: "reads_state"
      brief: "StUH2(1) = Q1; QD = max(0, Q1 + Exch) is the direct branch."
    - from: "RunoffSummation"
      to: "Outputs"
      kind: "produces_output"
      brief: "Qsim = QR + QD (clamped >= 0)."
    - from: "MOD_GR4J"
      to: "Outputs"
      kind: "produces_output"
      brief: "Writes 18 diagnostic variables (PE, Precip, Prod, Pn, Ps, AE, Perc, PR, Q9, Q1, Rout, Exch, AExch1, AExch2, AExch, QR, QD, Qsim)."
    - from: "MOD_GR4J"
      to: "Outputs"
      kind: "writes_state"
      brief: "Final St(1), St(2), StUH1, StUH2 repacked into the end-state vector for run continuation."

states:
  variables:
    - name: "Prod (St(1))"
      unit: "mm"
      role: "prognostic"
    - name: "Rout (St(2))"
      unit: "mm"
      role: "prognostic"
    - name: "StUH1(1:20)"
      unit: "mm"
      role: "prognostic"
    - name: "StUH2(1:40)"
      unit: "mm"
      role: "prognostic"
    - name: "OrdUH1(1:20)"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "OrdUH2(1:40)"
      unit: "dimensionless"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "Qsim"
    validation_rank: 1
    unit: "mm/day"
    description: "Simulated total catchment discharge at the outlet, QR (routing branch) + QD (direct branch)."
    emitted_in: "OutputsModel$Qsim (MISC index 18)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Observed gauge discharge must be converted to mm/day over catchment area (m3/s -> mm/day = *86.4/area_km2) before comparison; unit mismatch silently destroys NSE."
            - "Warm-up period (>= 1 yr) must be excluded from the scored window; first 6-12 months are transient."
            - "NSE is insensitive to bias/variability — pair with KGE to expose bias (beta) and variability (alpha) errors."
      detrending_options:
        - "none"
  - var: "AE"
    validation_rank: 2
    unit: "mm/day"
    description: "Actual evapotranspiration drawn from the production store."
    emitted_in: "OutputsModel$AE (MISC index 6)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Conceptual store-draw AE, not an energy-balance ET; comparison to satellite/flux ET products is structurally approximate."
      detrending_options:
        - "none"
  - var: "Prod"
    validation_rank: 3
    unit: "mm"
    description: "Production (soil-moisture) store level."
    emitted_in: "OutputsModel$Prod (MISC index 3)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Conceptual store in mm, not a physical soil-moisture depth; at most pattern/anomaly comparison to soil-moisture indices, not absolute magnitude."
            - "magnitude_accuracy deliberately omitted: the conceptual store level is not a measurable depth, so only temporal/anomaly pattern is comparable (intentional single-family deviation from the time_series_comparison default)."
      detrending_options:
        - "first_difference"
  - var: "AExch"
    validation_rank: 4
    unit: "mm/day"
    description: "Total actual inter-catchment groundwater exchange (open-boundary source/sink)."
    emitted_in: "OutputsModel$AExch (MISC index 15)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Rarely directly observed; chiefly a water-balance closure diagnostic. Persistent large magnitude can mask forcing errors."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "X4 — unit hydrograph time constant"
      to: "Qsim"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "wang2019_gr4j_six_methods_sa"
        - "shin2022_gr4j_sobol_calib_length"
        - "perrin2003_gr4j_seminal"
    - from: "X4 — unit hydrograph time constant"
      to: "high-flow peak timing"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "high-flow objective"
      citations:
        - "shin2017_gr4j_suitability_sa"
        - "water2021_gr4j_meteo_classification"
    - from: "X3 — routing store capacity"
      to: "Qsim"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "wang2019_gr4j_six_methods_sa"
        - "shin2022_gr4j_sobol_calib_length"
    - from: "X3 — routing store capacity"
      to: "low-flow / baseflow"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "low-flow objective"
      citations:
        - "shin2017_gr4j_suitability_sa"
    - from: "X2 — inter-catchment exchange coefficient"
      to: "low-flow / baseflow"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "low-flow objective"
      citations:
        - "shin2017_gr4j_suitability_sa"
        - "wang2019_gr4j_six_methods_sa"
    - from: "X2 — inter-catchment exchange coefficient"
      to: "Qsim"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations:
        - "wang2019_gr4j_six_methods_sa"
        - "perrin2003_gr4j_seminal"
    - from: "X1 — production store capacity"
      to: "Qsim"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "routed streamflow"
      citations:
        - "wang2019_gr4j_six_methods_sa"
    - from: "X1 — production store capacity"
      to: "water-balance / runoff volume"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "total volume"
      citations:
        - "shin2017_gr4j_suitability_sa"
        - "perrin2003_gr4j_seminal"
  citation_index:
    wang2019_gr4j_six_methods_sa:
      short_citation: "Wang & Solomatine 2019"
      doi: "10.3390/w11051062"
      note: "Six GSA methods (Sobol, eFAST, Morris, LH-OAT, RSA, PAWN) on GR4J; X4 most influential, then X3, then X2; X1 weak on routed streamflow."
    shin2017_gr4j_suitability_sa:
      short_citation: "Shin & Kim 2017"
      doi: "10.2166/nh.2016.129"
      note: "GR4J on seven Korean catchments; X4 sensitive to high-flow, X2/X3 to low-flow objectives."
    shin2022_gr4j_sobol_calib_length:
      short_citation: "Shin & Jung 2022"
      doi: "10.1016/j.jhydrol.2022.127546"
      note: "Sobol GSA on GR4J across three Korean dam catchments; X3 and X4 most sensitive."
    perrin2003_gr4j_seminal:
      short_citation: "Perrin, Michel & Andreassian 2003"
      doi: "10.1016/S0022-1694(03)00225-7"
      note: "Seminal GR4J paper defining the four parameters and their structural mapping to streamflow components."
    water2021_gr4j_meteo_classification:
      short_citation: "MDPI Water 2021, 13(18):2546"
      doi: "10.3390/w13182546"
      note: "GR4J case study; X4 governs hydrograph timing for high flows; corroborating source."

safety:
  hazards:
    - id: "temperature_kelvin_pe_oudin"
      kind: "weather_file_semantic"
      description: "Temperature supplied in Kelvin (not Celsius) to PE_Oudin yields PE ~300 mm/day; production store drains instantly, all precip evaporates, Qsim ~ 0. (dt_001)"
      severity: "silent"
      triplet: "dt_001"
    - id: "precip_metres_not_mm"
      kind: "weather_file_semantic"
      description: "Precipitation in m/day instead of mm/day is 1000x too small; near-zero runoff despite a wet climate (mean P < 0.01). (dt_002)"
      severity: "silent"
      triplet: "dt_002"
    - id: "subdaily_precip_averaged_not_summed"
      kind: "weather_file_semantic"
      description: "Sub-daily precipitation averaged instead of summed to a daily total (e.g. 8x 3-hourly) gives ~1/8 of the true total and too-low runoff. (dt_003)"
      severity: "silent"
      triplet: "dt_003"
    - id: "pe_monthly_used_as_daily"
      kind: "weather_file_semantic"
      description: "PE in mm/month (CRU/MODIS) used directly as daily values is ~30x too high; production store depletes and runoff collapses. (dt_007)"
      severity: "silent"
      triplet: "dt_007"
    - id: "negative_pe_truncation"
      kind: "weather_file_semantic"
      description: "Negative PE values (PE expected >= 0) raise a warning then produce truncation artifacts."
      severity: "warning"
    - id: "na_in_forcing"
      kind: "weather_file_semantic"
      description: "Any NA in Precip or PotEvap raises a stop() at input creation; airGR permits zero NAs in forcing (Qobs may contain NA). (dt_008)"
      severity: "fatal"
      triplet: "dt_008"
    - id: "x4_clipped_to_floor"
      kind: "coefficient_runtime_silent_fallback"
      description: "X4 < 0.5 d is clipped to 0.5 with a warning; X1 < 0.01 and X3 < 0.01 are clipped to 0.01 with warning. Indicates a catchment too fast for a daily timestep. (dt_011)"
      severity: "degraded"
      triplet: "dt_011"
    - id: "uninitialised_misc_sentinel"
      kind: "numerical_instability"
      description: "Output array retains the -999.999 sentinel when an output is not requested or a numerical issue occurs (MISC slots 19-30 are never filled). (dt_014)"
      severity: "warning"
      triplet: "dt_014"
    - id: "no_or_short_warmup"
      kind: "initial_condition_semantic"
      description: "No or too-short warm-up leaves the two stores far from equilibrium; the first 6-12 months of Qsim show an unphysical transient. (dt_006)"
      severity: "degraded"
      triplet: "dt_006"
    - id: "x1_pinned_upper_bound"
      kind: "control_semantic"
      description: "X1 calibrating to its upper bound (>1500 mm, absorbing all rain) usually signals precipitation that is too high (unit/averaging error), not a genuine large store. (dt_010)"
      severity: "degraded"
      triplet: "dt_010"
    - id: "large_negative_x2"
      kind: "control_semantic"
      description: "Large negative X2 (groundwater loss) is physically real in karst but can mask precipitation that is systematically too high; verify forcing before accepting. (dt_012)"
      severity: "warning"
      triplet: "dt_012"
  validation_limits:
    - "Daily timestep cannot resolve sub-daily flood dynamics; catchments <10 km2 / fast urbanized response hit the X4=0.5 d floor (use hourly GR4H instead)."
    - "Lumped single-unit: no native spatial/gridded routing within the catchment."
    - "Conceptual stores (X1, X3) are calibrated, not derived from soil physics; store levels are not directly comparable to measured soil-moisture or reservoir depths in absolute terms."
    - "Snow processes absent unless coupled with CemaNeige; snow-dominated catchments require RunModel_CemaNeigeGR4J."
  warnings:
    - "Observed discharge must be converted to mm/day over catchment area before calibration (m3/s: Qmm = Q*86.4/area_km2; l/s: Qmm = Q*0.0864/area_km2); a wrong conversion drives NSE to large negatives or pins parameters at extremes."
    - "Catchment area must be in km2 for the discharge conversion; area in m2 throws the factor off by 1e6."
    - "NSE is insensitive to bias and variability; a good NSE with poor KGE indicates hidden bias/variability — inspect KGE components r/alpha/beta."
    - "PBIAS > 50% indicates systematic forcing or discharge-conversion bias; check that annual P - PE roughly equals annual Q."
  assumptions:
    - statement: "GR4J represents the catchment as a single 0-D lumped unit; all fluxes are water-depth-equivalent (mm/day) averaged over the catchment area."
      scope: "spatial geometry of every GR4J run"
      source: "Perrin, Michel & Andreassian (2003), J. Hydrology 279:275-289; airGR RunModel_GR4J docs"
      status: "adopted"
    - statement: "Catchment water mass balance closes except for the inter-catchment groundwater exchange (X2) term, which is an open-boundary flux; no surface energy balance is computed."
      scope: "conservation properties / AExch output"
      source: "airGR RunModel_GR4J man page (intercatchment exchange) and frun_GR4J.f90 exchange formulation"
      status: "adopted"
