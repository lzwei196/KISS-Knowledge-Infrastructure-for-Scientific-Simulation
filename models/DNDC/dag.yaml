safety:
  hazards:
    - id: "precip_mm_not_cm"
      kind: weather_file_semantic
      description: "Precipitation supplied in mm instead of expected cm (10x too much water) causing near-zero yield / false drought"
      severity: silent
    - id: "srad_wm2_not_mj"
      kind: weather_file_semantic
      description: "Solar radiation given as W/m2 instantaneous instead of MJ/m2/day daily integral (~10x), distorting photosynthesis/biomass"
      severity: silent
    - id: "temperature_kelvin"
      kind: weather_file_semantic
      description: "Temperature supplied in Kelvin instead of Celsius; immediate crash / >200 deg C in logs"
      severity: fatal
    - id: "climate_not_starting_jday1"
      kind: weather_file_semantic
      description: "Climate file does not start at Julian day 1; sequential read misaligns all forcing or crashes"
      severity: fatal
    - id: "climate_shorter_than_simulation"
      kind: weather_file_semantic
      description: "Climate record shorter than n_years*365 (leap-aware); simulation silently truncated to fewer years"
      severity: silent
    - id: "climate_format_type_mismatch"
      kind: control_semantic
      description: "Climate format type does not match the actual column layout; variables silently mapped to wrong columns, producing nonsensical fluxes"
      severity: silent
    - id: "soc_percent_not_fraction"
      kind: soil_semantic
      description: "SOC entered as percent (e.g., 2.5) instead of kgC/kg mass fraction (0.025); 100x SOC/N2O overestimate"
      severity: silent
    - id: "bulk_density_units"
      kind: soil_semantic
      description: "Bulk density entered as kg/m3 instead of g/cm3 (1000x error)"
      severity: silent
    - id: "ksat_unit_confusion"
      kind: soil_semantic
      description: "Hydraulic conductivity entered in cm/min or cm/hr or um/s instead of m/hr; corrupts drainage and water-table dynamics"
      severity: silent
    - id: "fc_wp_volumetric_not_wfps"
      kind: soil_semantic
      description: "Field capacity / wilting point entered as volumetric water content instead of WFPS (= VWC/porosity); mis-sets soil-moisture state"
      severity: silent
    - id: "layers_not_summing_to_2m"
      kind: soil_semantic
      description: "Soil layer thicknesses do not sum to exactly 2.0 m (200 cm); profile error / crash at initialization"
      severity: fatal
    - id: "texture_id_out_of_range"
      kind: soil_semantic
      description: "Texture class ID outside 1-12 leaves hydraulic properties undefined; crash or silent default"
      severity: fatal_or_silent
    - id: "soc_pool_fractions_not_summing_to_one"
      kind: soil_semantic
      description: "SOC pool fractions (or biomass partition fractions) do not sum to 1.0; mass-balance error / wrong yield. GUI may silently reset pool fractions to defaults after editing a heterogeneous profile"
      severity: silent
    - id: "fertilizer_product_mass_not_elemental_N"
      kind: control_semantic
      description: "Fertilizer entered as total product mass (kgUrea/ha) instead of elemental kgN/ha per form; distorts N response"
      severity: silent
    - id: "crop_biomass_DM_not_carbon"
      kind: coefficient_runtime_silent_fallback
      description: "Crop biomass coefficients entered in kgDM/ha instead of kgC/ha (DNDC tracks carbon, DM=0.45xC); yields ~2x off"
      severity: silent
    - id: "water_table_flag_reversed"
      kind: control_semantic
      description: "Water-table flag uses reversed logic (0=dynamic WT ON, 1=free drainage); hydrology runs opposite to intent"
      severity: silent
    - id: "winter_crop_harvest_mode"
      kind: control_semantic
      description: "Harvest mode not set to 2 (next year) for fall-planted winter crops; harvest before maturity -> zero yield"
      severity: silent
    - id: "legume_nfixation_index"
      kind: coefficient_runtime_silent_fallback
      description: "N-fixation index not set to 1 for legumes; severe N stress and depressed yield"
      severity: silent
    - id: "dnd_line_order_corruption"
      kind: parser_semantic
      description: ".dnd is strictly line-ordered; inserting/deleting lines or non-chronological time blocks misaligns parameters or corrupts the file"
      severity: fatal_or_silent
    - id: "denitrification_silently_zeroed"
      kind: control_semantic
      description: "Denitrification silently skipped when soil pH is out of range or WFPS too low to form anaerobic microsites; annual N2O collapses to near-zero with no error"
      severity: silent
    - id: "management_dates_outside_record"
      kind: control_semantic
      description: "Tillage/harvest/fertilizer event dates outside Jday 1-365 or outside the climate record are silently skipped, so the management schedule is ignored"
      severity: silent
    - id: "dynamic_layer_depth_too_small"
      kind: numerical_instability
      description: "Dynamic soil-solver layer depth < ~1 cm overflows array bounds -> segfault early in the run; inconsistent Ksat/layer/tolerance makes the water solver thrash (10-100x slower)"
      severity: fatal
  validation_limits:
    - "Point / field-scale only; no native distributed or gridded simulation and no lateral routing between fields"
    - "Daily internal time step cannot resolve sub-daily (intra-day) gas-flux dynamics"
    - "Reproduces cumulative/annual N2O and yields better than daily N2O peaks (chamber daily peaks often poorly matched)"
    - "Default crop physiological/phenology parameters may be uncalibrated for a given crop/region; crops should be verified against observed yield before trusting fluxes"
    - "CH4 flux is meaningful only for water-table-driven anaerobic systems (paddy/wetland)"
  warnings:
    - "Inputs are silent on unit errors: wrong units produce no message, only physically meaningless results"
    - "Spinup is required to equilibrate C/N pools (>=10 yr cropland, 50-100 yr natural); use spinup state files only from the same DNDC version"
    - "Denitrification/N2O production is gated by soil pH and WFPS via the anaerobic-balloon scheme; out-of-range pH or low WFPS silently suppresses N2O"
  assumptions:
    - statement: "Simulation is a 1-D point/field-scale soil column run to a fixed 2 m (200 cm) depth in up to 10 layers."
      scope: "geometry / spatial structure of DNDCv.CAN 9.6.0"
      source: "DNDCv.CAN SKILL.md and docs/s2 soil-preparation documentation"
      status: adopted
    - statement: "Annual mass-balance closure is maintained for water, carbon, and nitrogen; ET (incl. the optional Penman-Monteith path) is a demand-side flux estimate, not a closed surface energy budget."
      scope: "conservation / closure"
      source: "DNDC95 User's Guide annual C/N/water budget sections; DNDCv.CAN ET documentation"
      status: adopted
    - statement: "Sub-models execute daily in fixed order: soil climate -> plant growth -> decomposition -> nitrification & denitrification -> fermentation; soil aeration is set by the anaerobic-balloon Eh partition."
      scope: "process ordering / N2O and CH4 production mechanism"
      source: "DNDC95 User's Guide section II.4 (run sequence) and I.2 (model description)"
      status: adopted
    - statement: "This dag describes DNDCv.CAN 9.6.0 (2 m profile, biochar/biosolid pools, tile drainage), not the parent DNDC95 v9.5 (0-50 cm profile) the UNH User's Guide documents."
      scope: "version / implementation identity"
      source: "DNDCv.CAN SKILL.md identity section vs UNH GuideDNDC95.pdf"
      status: adopted
