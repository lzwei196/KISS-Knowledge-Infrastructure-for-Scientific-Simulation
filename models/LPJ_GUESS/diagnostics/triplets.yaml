# ========================================================================
# LPJ-GUESS Diagnostic Triplets
# ========================================================================
# 18 triplets. Converted 2026-08-12 from the `triplets:` mapping to the
# canonical TOP-LEVEL LIST. Content is byte-verified identical — this changes the
# container only. The two-shape ambiguity is what let the self-improve overlay read
# a corpus as empty and overwrite it.
# ========================================================================

# Comments preserved from the previous file:
# ============================================================================
# LPJ-GUESS Diagnostic Triplets
# ============================================================================
# 18 diagnostic triplets covering 7 failure domains:
#   UNIT, IO_FORMAT, CONFIGURATION, PARAMETER, NUMERICAL, INITIALIZATION, OUTPUT
# Generated from LPJ-GUESS knowledge infrastructure SKILL.md.
# Domain: dynamic global vegetation model (C/N cycling, Fortran/C++)
# ============================================================================
  # =========================================================================
  # UNIT — Forcing & Flux Unit Errors (Silent)
  # =========================================================================
  # =========================================================================
  # IO_FORMAT — Instruction File, Gridlist, Driver Data Format
  # =========================================================================
  # =========================================================================
  # CONFIGURATION — PFT Selection, Spinup Length, Model Mode
  # =========================================================================
  # =========================================================================
  # PARAMETER — PFT & Soil Parameter Errors
  # =========================================================================
  # =========================================================================
  # NUMERICAL — Carbon Balance, Vegetation Dynamics Stability
  # =========================================================================
  # =========================================================================
  # INITIALIZATION — Spinup Convergence
  # =========================================================================
  # =========================================================================
  # OUTPUT — Output Variables, Monthly vs Annual, File Parsing
  # =========================================================================

- id: dt_lpjguess_001
  symptom:
    description: GPP and respiration unrealistically high (~300 degC regime). Temperature-dependent scalars
      saturated. Parabolic temperature response returns zero but Q10 respiration explodes.
  diagnosis:
    root_cause: Air temperature forcing supplied in Kelvin instead of degrees Celsius. CMFD and MSWX provide
      temperature in K, but LPJ-GUESS expects deg C.
  remedy:
    action: Subtract 273.15 from all temperature values before passing to LPJ-GUESS. Validate that TA
      values fall within -50 to +55 deg C range.
- id: dt_lpjguess_002
  symptom:
    description: Precipitation effectively zero. Vegetation dies from permanent drought. Water balance
      shows no input despite using CMFD data.
  diagnosis:
    root_cause: Precipitation left in kg/m2/s (CMFD native unit) instead of converted to mm/day. A typical
      value of 1.15e-5 kg/m2/s (1 mm/day) is interpreted as near-zero mm/day.
  remedy:
    action: Multiply CMFD precipitation by 86400 to convert from kg/m2/s to mm/day. For MSWX (mm/3hr),
      sum 8 timesteps per day. Validate daily P is in the 0-300 mm/day range.
- id: dt_lpjguess_003
  symptom:
    description: VPD scalar (f_VPD) always near 1.0 — no moisture stress on GPP. Transpiration unrealistically
      high for arid sites.
  diagnosis:
    root_cause: VPD supplied in kPa instead of hPa. LPJ-GUESS VPD parameters (VPD_0=10 hPa, VPD_1=35 hPa)
      expect hPa. A value of 1.5 kPa (= 15 hPa) appears as 1.5 hPa, far below the VPD_0 threshold.
  remedy:
    action: Multiply VPD by 10 to convert from kPa to hPa. FLUXNET provides hPa natively. If source data
      is in Pa, divide by 100. Validate that typical daytime VPD is 5-40 hPa.
- id: dt_lpjguess_004
  symptom:
    description: GPP output in gC/m2/day does not match eddy-covariance tower observations reported in
      umol CO2/m2/s. Values appear off by a factor of ~7200.
  diagnosis:
    root_cause: Failure to apply the gC-to-umol flux unit conversion. LPJ-GUESS internal GPP is in gC/m2/day
      but FLUXNET observations are in umol CO2/m2/s. The conversion factor is 1e6 / 12.011 / 86400.
  remedy:
    action: Convert GPP from gC/m2/day to umol/m2/s by multiplying by 1e6 / (12.011 * 86400) = 0.9649.
      Alternatively, convert observations to gC/m2/day by dividing by 0.9649.
- id: dt_lpjguess_005
  symptom:
    description: Model refuses to start or silently produces wrong PFT configuration. Instruction file
      (.ins) parameters appear to be ignored.
  diagnosis:
    root_cause: LPJ-GUESS instruction file (.ins) uses a strict keyword-value format. Missing quotes around
      string values, wrong section nesting (param block not closed with a closing brace), or trailing
      whitespace after values causes silent parse failure.
  remedy:
    action: 'Validate the .ins file structure: ensure all string values are double-quoted, every opening
      brace has a matching closing brace, and PFT definitions follow the ''pft "PFT_NAME" { ... }'' pattern.
      Use a reference .ins from the LPJ-GUESS distribution as template.'
- id: dt_lpjguess_006
  symptom:
    description: Model reports zero gridcells or crashes immediately. Gridlist file appears to exist but
      no sites are processed.
  diagnosis:
    root_cause: 'Gridlist file has wrong format. LPJ-GUESS expects a whitespace-delimited text file with
      columns: longitude latitude [description]. Common errors include comma-separated values, header
      rows, lat/lon in reversed order, or coordinates outside -180 to 180 / -90 to 90 range.'
  remedy:
    action: Reformat gridlist as space-separated longitude latitude per line with no header. Verify longitude
      precedes latitude. Remove any header lines or trailing blank lines.
- id: dt_lpjguess_007
  symptom:
    description: Forcing data read error. Model cannot find or parse daily meteorological driver files.
      Errors referencing 'getclimate' or input file dimensions.
  diagnosis:
    root_cause: 'Driver data NetCDF or binary files have dimension ordering or variable naming that does
      not match the LPJ-GUESS CF input specification. Common issues: time dimension not named ''time'',
      spatial dimensions not matching gridlist, or missing calendar attribute.'
  remedy:
    action: Ensure driver NetCDF files follow CF conventions with dimensions (time, lat, lon) or (time,
      land). Variable names must match the instruction file input specification. Use convert_forcing_to_lpjguess.py
      to produce correctly formatted forcing CSV with SW_IN, TA, VPD, P columns.
- id: dt_lpjguess_008
  symptom:
    description: Tropical simulation dominated by boreal/temperate PFTs. Vegetation composition unrealistic
      for the climate zone.
  diagnosis:
    root_cause: All PFTs enabled in the instruction file without bioclimatic filtering. LPJ-GUESS PFTs
      have bioclimatic limits (T_min, T_max, GDD requirements) but if the instruction file includes boreal
      PFTs for a tropical gridcell, competition dynamics can produce unrealistic assemblages during spinup.
  remedy:
    action: Enable only climatically appropriate PFTs for the study region. For tropical sites, disable
      boreal needle-leaved PFTs (BNE, BINE, BNS). For boreal sites, disable tropical broadleaved PFTs
      (TrBE, TrIBE, TrBR). Consult the bioclimatic limit table in the LPJ-GUESS documentation.
- id: dt_lpjguess_009
  symptom:
    description: Model runs in population mode but user expects individual-based (cohort) dynamics. Vegetation
      structure lacks age-class diversity. No gap dynamics or light competition.
  diagnosis:
    root_cause: Instruction file sets 'ifbgestab 0' and 'ifsme 0' or uses 'vegmode "population"' instead
      of 'vegmode "cohort"'. Population mode uses area-averaged representation without individual-level
      competition.
  remedy:
    action: Set vegmode to 'cohort' in the instruction file and enable stochastic establishment (ifbgestab
      1) and stochastic mortality (ifsme 1) for individual-based dynamics with gap model behavior. Use
      npatch >= 25 for statistical robustness.
- id: dt_lpjguess_010
  symptom:
    description: Simulation completes but vegetation carbon pools are still drifting. Soil carbon has
      not reached equilibrium. NEE has a persistent non-zero trend during the 'stable' reference period.
  diagnosis:
    root_cause: Spinup length (nyear_spinup) too short for soil carbon pools to equilibrate. Slow soil
      organic matter pools (century-scale turnover) require 500-1000+ years of spinup, especially in boreal/permafrost
      systems.
  remedy:
    action: Increase nyear_spinup to at least 500 years for temperate systems and 1000+ years for boreal/peatland
      systems. Monitor the trend in total ecosystem carbon (vegetation + soil + litter) over the last
      100 spinup years — drift should be less than 1 gC/m2/yr.
- id: dt_lpjguess_011
  symptom:
    description: GPP systematically 2-3x higher than FLUXNET observations across all sites. Temperature
      and VPD responses appear correct but absolute magnitude is wrong.
  diagnosis:
    root_cause: LUE_max (maximum light use efficiency) parameter set too high. Default range is 1.0-3.0
      gC/MJ PAR. A value at the upper end (3.0) overestimates GPP for most ecosystems. Temperate forests
      typically require 1.2-2.0 gC/MJ.
  remedy:
    action: 'Calibrate LUE_max against site-level FLUXNET GPP observations. Typical calibrated values:
      ENF 1.0-1.5, DBF 1.2-2.0, grassland 0.8-1.5 gC/MJ PAR. Use differential evolution optimization against
      the validation period.'
- id: dt_lpjguess_012
  symptom:
    description: GPP peaks at wrong time of year. Summer GPP too low relative to spring/autumn. Temperature
      response curve appears shifted.
  diagnosis:
    root_cause: T_opt (optimal photosynthesis temperature) parameter mismatched for the PFT or climate
      zone. Default T_opt=20 degC is appropriate for temperate broadleaf but too low for tropical (T_opt=28-30)
      and too high for boreal (T_opt=15-18) ecosystems.
  remedy:
    action: 'Adjust T_opt to match the PFT''s thermal niche: boreal conifers 10-18 degC, temperate deciduous
      18-25 degC, tropical evergreen 25-32 degC. Also verify T_min and T_max bracket the observed growing-season
      temperature range.'
- id: dt_lpjguess_013
  symptom:
    description: Heterotrophic respiration (Rh) far too high in winter or too low in summer. Soil respiration
      seasonal cycle has wrong amplitude.
  diagnosis:
    root_cause: Rh_Q10 parameter (Q10 for decomposition) inappropriate for the soil environment. Default
      Rh_Q10=2.0 may be too high for warm soils (amplifying summer Rh) or too low for cold soils (underestimating
      temperature sensitivity).
  remedy:
    action: 'Adjust Rh_Q10 based on soil temperature regime: use 1.5-2.0 for tropical soils, 2.0-2.5 for
      temperate, and 2.5-3.5 for boreal/permafrost soils. Also check Rh_base (default 2.0 umol/m2/s) and
      Rh_Tref (default 15 degC) for consistency.'
- id: dt_lpjguess_014
  symptom:
    description: NEE does not equal Reco - GPP. Carbon budget fails to close. Small but persistent residual
      accumulates over multi-year simulations.
  diagnosis:
    root_cause: Numerical precision loss in the daily carbon balance computation. When GPP and Reco are
      both large (~10-20 umol/m2/s) but NEE is small (~0.5 umol/m2/s), floating-point subtraction loses
      significant digits. Also check that Ra + Rh = Reco is enforced consistently.
  remedy:
    action: 'Compute NEE directly from (Ra + Rh) - GPP in a single expression rather than from separately
      stored Reco. Verify the sign convention: NEE = Reco - GPP (positive = source, negative = sink).
      Tolerance for carbon balance closure should be < 0.01 gC/m2/day.'
- id: dt_lpjguess_015
  symptom:
    description: Vegetation dynamics produce unrealistic monoculture after long simulation. A single PFT
      dominates 100% of patches despite diverse initial conditions.
  diagnosis:
    root_cause: Competitive exclusion in cohort mode without adequate disturbance. If stochastic disturbance
      (fire, windthrow) is disabled or its return interval is too long, the most competitive PFT outcompetes
      all others over centuries. The disturbance regime parameter (distinterval) controls gap creation
      frequency.
  remedy:
    action: Enable stochastic disturbance by setting 'ifdisturb 1' in the instruction file. Set distinterval
      to ecologically appropriate values (50-200 years for temperate forests, 80-400 years for boreal).
      Increase npatch to 50-100 for better sampling of stochastic dynamics.
- id: dt_lpjguess_016
  symptom:
    description: Spinup never converges. Soil organic carbon continues increasing after 1000 model years.
      Annual NEE oscillates without stabilizing.
  diagnosis:
    root_cause: Nitrogen deposition set to modern (elevated) values during spinup instead of pre-industrial
      levels. Modern N deposition (1-10 kgN/ha/yr) continuously fertilizes the ecosystem, preventing C
      pool equilibrium. Pre-industrial N deposition was 0.1-0.5 kgN/ha/yr.
  remedy:
    action: Use pre-industrial N deposition rates (0.1-0.5 kgN/ha/yr) for the spinup phase. Switch to
      transient N deposition only for the historical simulation period. Monitor total ecosystem carbon
      trend — convergence criterion is drift < 0.5 gC/m2/yr over the last 100 spinup years.
- id: dt_lpjguess_017
  symptom:
    description: Strong NEE source (positive) for the first 30-50 years of the transient run after spinup
      completes. Ecosystem appears to lose carbon despite stable climate.
  diagnosis:
    root_cause: CO2 concentration mismatch between spinup (pre-industrial ~280 ppm) and transient run
      start (modern ~370 ppm). The abrupt CO2 jump stimulates GPP, increasing N demand beyond supply,
      which causes N limitation-induced carbon pool adjustment and temporary net carbon loss.
  remedy:
    action: Run a transition period with gradually increasing CO2 from pre-industrial to the transient
      start year, or use the transient CO2 trajectory from 1850 onward. Discard the first 50 years of
      transient output as equilibration if an abrupt CO2 jump is unavoidable.
- id: dt_lpjguess_018
  symptom:
    description: Output files contain only annual values but user needs monthly or daily resolution. Monthly
      carbon flux seasonality cannot be analyzed.
  diagnosis:
    root_cause: Instruction file output section specifies only annual output tables (e.g., 'file_cmass',
      'file_anpp') without enabling monthly output files (e.g., 'file_mnpp', 'file_mgpp'). LPJ-GUESS distinguishes
      annual and monthly outputs by filename prefix convention.
  remedy:
    action: 'Add monthly output file declarations in the instruction file output section: ''file_mnpp'',
      ''file_mgpp'', ''file_mra'', ''file_mrh'', ''file_mnee'', ''file_mlai''. For daily output (if supported
      by the version), add the corresponding daily file declarations. Verify output directory has write
      permissions.'
