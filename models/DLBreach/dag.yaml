safety:
  hazards:
    - id: "time_unit_hours_vs_seconds"
      kind: "control_semantic"
      description: "Inflow/WSL/wave/wind time series and the output time column are in HOURS, while Time_Step and Simulation_Period are in SECONDS; mixing them silently corrupts breach timing with no error."
      severity: "silent"
    - id: "slope_VoverH_vs_HoverV"
      kind: "control_semantic"
      description: "Embankment and breach side slopes use the V/H convention; authoring as H/V yields impossibly steep/flat geometry and abnormal breach evolution with no error."
      severity: "silent"
    - id: "water_level_above_base_not_absolute"
      kind: "initial_condition_semantic"
      description: "Water levels are relative to the embankment base; supplying absolute/geo-referenced elevations gives wrong head and breach behavior."
      severity: "silent"
    - id: "initial_wsl_below_crest_no_overtopping"
      kind: "initial_condition_semantic"
      description: "If the initial upstream WSL is below the crest in overtopping mode, breaching never initiates and discharge is zero for the entire run."
      severity: "silent"
    - id: "piping_elevation_above_wsl"
      kind: "initial_condition_semantic"
      description: "If the initial piping conduit elevation lies above the upstream WSL, there is no head to drive flow and the piping breach produces zero discharge."
      severity: "silent"
    - id: "embankment_length_caps_breach_width"
      kind: "control_semantic"
      description: "Embankment_Length is the maximum breach BOTTOM width (dam base length), not crest length; setting it too small silently caps breach development."
      severity: "degraded"
    - id: "reservoir_curve_non_SI_units"
      kind: "control_semantic"
      description: "Reservoir elevation-area-volume curve must be SI (m3, m2, m); supplying MCM/km2 makes the reservoir ~1e6x too small, causing instant drainage and unrealistically low peak discharge."
      severity: "silent"
    - id: "timestep_too_large_instability"
      kind: "numerical_instability"
      description: "The explicit time-marching scheme goes unstable (NaN/Inf/oscillation or mid-run crash) if Time_Step is too large for the rate of breach growth, especially for very large dams."
      severity: "fatal_or_silent"
    - id: "simulation_period_too_short"
      kind: "control_semantic"
      description: "A Simulation_Period end that is too short (often hours mistakenly entered as seconds) truncates the run before the breach develops, yielding 1-2 output lines."
      severity: "degraded"
    - id: "malformed_multiline_cards"
      kind: "parser_semantic"
      description: "Comments or blank lines inside multiline data cards (reservoir curve, inflow, WSL), missing separators, or absent mandatory cards cause Fortran read errors / immediate crash / empty output, sometimes reading uninitialized values with no informative message."
      severity: "fatal"
    - id: "empty_output_missing_downstream_channel"
      kind: "control_semantic"
      description: "Omitting the Downstream_Channel_Flow_Out card produces an empty output file with no error."
      severity: "degraded"
  validation_limits:
    - "0-D lumped reservoir; does not resolve spatially distributed reservoir hydrodynamics or downstream routing/inundation."
    - "Simplified cross-sectional (trapezoidal) breach representation, not a full 2-D/3-D erosion field."
    - "Surface erosion, headcut erosion, and composite/zoned mechanisms are mutually exclusive for overtopping; the user must pick the one matching the embankment, and the wrong choice mis-models erosion."
    - "Cohesive cases hinge on kd/Tauc calibration; uncalibrated erodibility makes absolute breach rate unreliable."
    - "Coastal wave/wind forcing only applies in the coastal dike/barrier extension."
  warnings:
    - "Cohesive erodibility kd is the single most sensitive parameter for cohesive embankments (range 2.5-30 cm3/N-s); an uncalibrated value gives instant or stalled breach development."
    - "Porosity and clay content are entered as decimal fractions (0.0-1.0), not percentages."
    - "Plausibility checks: upstream level should decrease monotonically as the reservoir drains; breach invert should fall from crest toward base; failure time minutes-to-hours (overtopping) to hours (piping) — sub-minute or multi-day failure signals a parameter error."
  assumptions:
    - statement: "This dag describes the standalone Fortran DLBreach 2016.4 binary, the implementation the KI wraps and validates against, not the separate simplified Python reimplementation."
      scope: "identity.implementation and all model science"
      source: "DLBreach homepage (webspace.clarkson.edu/~wwu/DLBreach.html) and Wu 2013/2016 references; KI SKILL.md mandates the Fortran binary."
      status: "adopted"
    - statement: "Breach side slope is prognostic, evolving via the planar slope-stability (mass-wasting) model under the V/H convention, with an optional constant override."
      scope: "states.breach_side_slope and SlopeStability module"
      source: "Wu 2013 (10.1061/(ASCE)HY.1943-7900.0000741) breach side-slope and slope-stability formulation; HEC-RAS DLBreach embankment-parameter documentation."
      status: "adopted"
    - statement: "Closure is a coupled water mass balance (reservoir storage vs breach+spillway outflow) plus a non-equilibrium total-load sediment mass balance driving geometry; there is no surface-energy closure."
      scope: "boundary.closure and reservoir/sediment modules"
      source: "Wu 2016 DLBreach Technical Report (Clarkson) two-stage weir/Keulegan hydraulics with non-equilibrium total-load transport."
      status: "adopted"
    - statement: "Breach_Mode selects the failure mechanism (overtopping vs piping) and Overtopping_Mode selects the (mutually exclusive) overtopping erosion mechanism; the two are distinct switches."
      scope: "inputs.boundary_conditions Breach_Mode / Overtopping_Mode"
      source: "HEC-RAS DLBreach Overtopping Erosion Model documentation and DLBreach format spec."
      status: "adopted"

