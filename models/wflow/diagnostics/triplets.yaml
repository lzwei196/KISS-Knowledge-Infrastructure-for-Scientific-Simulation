  cross_references:
  - dt_w006
  - dt_w010
- id: dt_w023
  stage: s4_execution
  failure_domain: environment
  symptom:
    description: "LoadError during Wflow precompilation \u2014 NetCDF library conflict"
    error_pattern: LoadError.*precompil|NetCDF.*error|libnetcdf
    detection_method: log_match
  diagnosis:
    root_cause: Julia's NetCDF library conflicts with system NetCDF or Python's NetCDF4
    explanation: 'Julia installs its own copies of shared libraries (NetCDF, HDF5)
      via BinaryBuilder. If LD_LIBRARY_PATH is set (e.g., by conda or the Python venv),
      Julia may pick up the wrong libnetcdf.so, causing precompilation to fail. This
      is a Julia ecosystem challenge.

      '
    affected_components:
