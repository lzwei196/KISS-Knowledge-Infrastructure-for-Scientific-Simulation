  detection: The host firewall or proxy blocks outbound TLS to power.larc.nasa.gov. NASA POWER is unreachable from this environment
    even though other hosts (google.com) respond. This is an environmental constraint
  fix: Do not retry. Switch to --source fluxnet for FLUXNET tower tasks (works offline from the site's FULLSET_DD.csv) or
