kiss_manifest_version: 1
model: MODFLOW6
binary_type: ELF
verified: unverified
install_dir: modflow6
acquire:
  strategy: download
  url: https://github.com/MODFLOW-ORG/modflow6/releases/download/6.6.1/mf6.6.1_mac.zip
  produces: mf6.6.1_mac/bin/mf6
python_deps:
- flopy
- numpy
- pandas
system_deps: []
data:
- role: static
  name: Model-specific grid and boundary inputs
  why: MODFLOW 6 is driven entirely by its own text input files; build them with FloPy.
  optional: true
reference_case: mf6 --version
notes: 'LINUX x86_64 port of the macos recipe (kiss.macos.x86_64.yaml): same source
  pin and product path; binary_type/system_deps adapted. Not yet verified on Linux.
  Mac x86_64 asset verified present in the official MODFLOW 6.6.1 GitHub release.
  Installation test pending; Linux observed status is not inherited.'
agent_hint: Use only the architecture-specific official Mac archive. Preserve the
  complete distribution. Probe the real mf6 executable with --version; record archive
  SHA-256 and actual architecture. No simulation data is required for installation.
