  remedy: 'Set max_fire_duration to at least 4-5.; None; [''In config: fire.max_fire_duration: 5'', ''For
    slow-burning fuels (litter): may need 8-10'', ''Higher values = more concurrent sprites = more computation''];
    Default of 5 works for most fuel types at update_rate=1'
