    2275 m3.; MCM = million cubic meters = 1e6 m3. Pywr volumes are in m3. If build_reservoir_properties.py
    for'
  remedy: 'Ensure max_volume = CAP_MCM * 1e6.; build_reservoir_properties; [''Verify: max_volume_m3 =
    capacity_mcm * 1e6'', ''Sanity check: max_volume_m3 for a major dam should be > 1e8 (100 MCM)'', ''If
    storage fills in 1 day: volume is 1e6 too small'', ''If storage never fills in 10 years: volume might
    be 1e6 too l'
  severity: silent
- id: dt_pywr_015
  symptom: Inflow values are unrealistically small (< 0.001 m3/s for a large basin) or unrealistically
    large (> 100,000 m3/s for a small basin). Model runs but results are wrong.
  diagnosis: 'Unit conversion error when converting VIC runoff (mm/day) to inflow (m3/s). The correct
    formula is: Q_m3s = (runoff_mm + baseflow_mm) * cell_area_m2 / (1000 * 86400). Missing the /1000 (mm
    to m) gives values 1000x too high. Missing the /86400 (day to seconds) gives values 86400x too high.;
    VIC outpu'
  remedy: 'Verify unit conversion formula and cell area.; convert_vic_to_inflow; [''Check formula: Q =
    (R+B) * A / (1000 * 86400)'', ''Check cell area: at 0.25 deg, mid-latitudes, area ~ 600 km2 = 6e8
    m2'', ''Sanity check: 1 mm/day over 600 km2 = 6e8 * 1e-3 / 86400 = 6.94 m3/s'', ''Compare mean inflow
    to literature v'
  severity: silent
