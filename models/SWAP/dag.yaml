safety:
  hazards:
    - id: "radiation_unit_W_per_m2"
      kind: weather_file_semantic
      description: "Radiation supplied in W/m2 instead of kJ/m2/d (~86.4x low) inflates VPD-driven ET; soil dries to wilting point, ET 100+ mm/d. (dt_001)"
      severity: silent
      triplet_id: "dt_001"
    - id: "humidity_as_relative_not_vapor_pressure"
      kind: weather_file_semantic
      description: "Hum column holds relative humidity (0-1 or 0-100) instead of actual vapour pressure in kPa, creating huge VPD and runaway evaporation. (dt_002)"
      severity: silent
      triplet_id: "dt_002"
    - id: "subdaily_rain_not_aggregated"
      kind: weather_file_semantic
      description: "3-hourly precipitation records passed as daily without summing give ~8x too much rain, causing permanent waterlogging and runoff. (dt_003)"
      severity: silent
      triplet_id: "dt_003"
    - id: "temperature_in_kelvin"
      kind: weather_file_semantic
      description: "Air temperature in Kelvin (~293) instead of Celsius corrupts thermal time and Penman-Monteith ET; crops never emerge/mature. (dt_004)"
      severity: fatal
      triplet_id: "dt_004"
    - id: "ksat_wrong_units"
      kind: soil_semantic
      description: "KSATFIT/KSATEXM in m/s or m/d instead of cm/d makes all water drain instantly with no retention. (dt_005)"
      severity: silent
      triplet_id: "dt_005"
    - id: "ores_ge_osat"
      kind: soil_semantic
      description: "ORES >= OSAT (residual >= saturated water content) causes division by zero / NaN in the van Genuchten retention curve. (dt_006)"
      severity: fatal
      triplet_id: "dt_006"
    - id: "bdens_g_per_cm3"
      kind: soil_semantic
      description: "Bulk density in g/cm3 instead of mg/cm3 (=kg/m3) is clipped to the 100 minimum, giving wrong heat capacity. (dt_007)"
      severity: degraded
      triplet_id: "dt_007"
    - id: "ncomp_hcomp_hsublay_mismatch"
      kind: soil_semantic
      description: "NCOMP x HCOMP != HSUBLAY is not rigorously checked, so profile depth and compartment boundaries are silently wrong. (dt_015)"
      severity: silent
      triplet_id: "dt_015"
    - id: "richards_convergence_clay_dtmax"
      kind: numerical_instability
      description: "DTMAX too large for clay / steep-retention (low NPAR) soils makes the Richards solver backtrack to DTMIN; run hangs or is extremely slow. (dt_010)"
      severity: degraded
      triplet_id: "dt_010"
    - id: "gwlconv_too_loose"
      kind: numerical_instability
      description: "GWLCONV left at the loose default (100 cm) allows the groundwater level to oscillate / jump unrealistically between timesteps. (dt_011)"
      severity: degraded
      triplet_id: "dt_011"
    - id: "malformed_met_swp_listio"
      kind: parser_semantic
      description: "Malformed .met/.swp (mismatched columns, tabs, blank data lines) breaks the TTUTIL list-directed READ (forrtl severe 59). (dt_012)"
      severity: fatal
      triplet_id: "dt_012"
    - id: "cropstart_outside_season_or_after_tstart"
      kind: control_semantic
      description: "CROPSTART after the growing season, or TSTART after CROPSTART, misses early-season thermal time so DVS never advances and biomass is zero. (dt_013)"
      severity: silent
      triplet_id: "dt_013"
    - id: "crop_rotation_overlap"
      kind: control_semantic
      description: "Crop rotation periods overlap (CROPEND(N) > CROPSTART(N+1)) or have unintended gaps; overlap behaviour is undefined. (dt_014)"
      severity: silent
      triplet_id: "dt_014"
    - id: "altw_wind_height_mismatch"
      kind: weather_file_semantic
      description: "ALTW (wind measurement height) inconsistent with the forcing dataset's anemometer height biases the Penman-Monteith aerodynamic term and ET. (dt_016)"
      severity: degraded
      triplet_id: "dt_016"
    - id: "solute_concentration_mg_per_L"
      kind: soil_semantic
      description: "Solute concentration in mg/L instead of mg/cm3 (a solute-input unit contract) gives values 1000x too high while mass balance still appears closed. (dt_017)"
      severity: silent
      triplet_id: "dt_017"
  validation_limits:
    - "Field-scale single 1-D column: cannot resolve gridded/distributed horizontal flow; lateral flow only via lumped analytical drainage formulas."
    - "Mechanistic regional groundwater flow is out of scope; regional application requires external GIS upscaling."
    - "Advanced pesticide and nutrient transport require external coupled models (PEARL, ANIMO/Soil-N)."
    - "The simple crop module (CROPTYPE=1) only prescribes development for the upper boundary and does not respond to stress; yield prediction requires the detailed WOFOST modules."
    - "Daily meteorological driving; sub-daily runoff/macropore behaviour resolved only through the adaptive internal timestep, not from sub-daily forcing unless rainfall intensities are supplied."
  warnings:
    - "ORES must be strictly less than OSAT for every soil layer, NPAR > 1.001, and ALFA positive, or the MvG retention curve is undefined."
    - "Pressure heads must be negative in the unsaturated zone."
    - "Water-balance closure |Sum_In - Sum_Out - dStorage| should be < 0.1 cm/yr; larger deviations indicate numerical problems (CRITDEVMASBAL triggers a .dwb.csv error file)."
    - "Three run-time message classes exist (input-data errors, infeasible-combination warnings, fatal calculation errors that stop the run); a successful run logs 'Swap simulation okay!'."
    - "Under frozen-soil/frost conditions reduction factors are applied to hydraulic conductivity, root water uptake, drainage and bottom flux, and snowpack insulation adjusts the soil-temperature top boundary."
  assumptions:
    - statement: "Transport in the vadose zone is predominantly vertical; the field is represented deterministically by a single 1-D soil column (one microclimate, vegetation, soil and drainage condition)."
      scope: "spatial geometry / domain"
      source: "SWAP version 4 manual (WENR Report 2780, 2017), Section 1.1 Model domain and processes, doi:10.18174/416321"
      status: adopted
    - statement: "Soil hydraulic behaviour is described by Mualem-van Genuchten functions with a near-saturation modification; optional hysteresis via drying/wetting-curve scaling."
      scope: "soil-water closure"
      source: "SWAP version 4 manual, Chapter 2 (Soil water flow), doi:10.18174/416321"
      status: adopted
    - statement: "Lateral flow below the groundwater level is represented only via analytical drainage formulas (Hooghoudt/Ernst, tabulated, multi-level), not a mechanistic groundwater model."
      scope: "lateral drainage / boundary"
      source: "SWAP version 4 manual, Chapter 4 (Drainage), doi:10.18174/416321"
      status: adopted
    - statement: "Mass-balance closure applies to water and (when active) solute and snow/macropore sub-systems; the default daily Penman-Monteith ET path is a demand-side flux, not a closed surface energy budget."
      scope: "conservation / closure"
      source: "SWAP version 4 manual, Summary and Chapter 3 (Evapotranspiration), doi:10.18174/416321"
      status: adopted
    - statement: "This dag describes SWAP 4.2.0; the canonical process/IO grounding is the 2017 SWAP v4 manual, which the developers state applies to SWAP 4 (the official site advertises point release 4.3.0 with no separate full manual)."
      scope: "version provenance"
      source: "SWAP version 4 manual (WENR Report 2780, 2017) and www.swap.alterra.nl downloads page"
      status: tentative
