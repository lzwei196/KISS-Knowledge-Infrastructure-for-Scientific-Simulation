        type: "config"
        description: "Output from engine.get_output()"
        required: true
        example: ""
      - name: "lat"
        type: "number"
        description: "Grid cell latitude"
        required: true
        example: "52.0"
      - name: "lon"
        type: "number"
        description: "Grid cell longitude"
        required: true
        example: "5.5"
      - name: "output_file"
        type: "file"
        description: "Output CSV path"
        required: true
        example: ""
    outputs:
      - name: "output_csv"
        type: "file"
        description: "CSV with date index, lat, lon, and WOFOST variables"
        path_pattern: ""
    preconditions: []
    postconditions:
      - "CSV file created with all output variables"

  # Stage 8: Yield Analysis
  - id: "compute_gridded_yield"
    name: "Compute Gridded Yield"
    description: "Aggregate single-cell WOFOST outputs into a gridded yield CSV for spatial analysis"
    stage: "s8_yield_analysis"
    script_path: "tools/s8_yield_analysis/compute_gridded_yield.py"
    language: "python"
    inputs:
      - name: "cell_outputs_dir"
