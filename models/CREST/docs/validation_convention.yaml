validation:
  - dag_variable: "STREAMFLOW (Q)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.75, good: null, satisfactory: 0.5}
        pass_band: satisfactory
        band_note: "Moriasi-style streamflow convention reproduced in fetched OA texts: satisfactory NSE > 0.5; very good NSE 0.75 to 1."
        cites: [van_griensven2012, bouregreg2011, arnold2012]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10.0, good: null, satisfactory: 25.0}
        pass_band: satisfactory
        band_note: "Fetched sources reproduce streamflow PBIAS ranges: satisfactory within +/-25%, very good within +/-10%."
        cites: [van_griensven2012, bouregreg2011]
    secondary_metrics:
      - metric: rsr
        direction: minimize
        status: supportive
        ceiling_reason: "The same hydrology convention recommends RSR with satisfactory RSR <= 0.7 and very good RSR 0 to 0.5."
        cites: [van_griensven2012, bouregreg2011]
      - metric: cc
        direction: maximize
        status: supportive
        ceiling_reason: "The EF5 benchmark co-reports correlation coefficient and normalized bias against USGS gauges; EF5/CREST median CC was 0.40 with uncalibrated parameters."
        cites: [ef5_2020]
    validated_when: "NSE >= 0.5 and |PBIAS| <= 25% against gauge discharge; RSR and correlation are supporting diagnostics."
    evidence_strength: strong
    confidence: 0.85
    notes: >-
      This keeps the dag determining metric NSE as headline and adds PBIAS because field conventions judge streamflow with both shape and volume error. Van Griensven 2012 states model results can be judged satisfactory if "NSE > 0.5" and "PBIAS +/- 25% for stream flow"; Bouregreg 2011 states very good ranges of "0.75 to 1 for NSE" and "-10 to 10 for PBIAS." EF5 2020 reports CREST/EF5 benchmark context: uncalibrated CONUS simulations had maximum NSE 0.71 and "NSE scores up to 0.76."

  - dag_variable: "STREAMFLOW (Q)"
    obs_shape: point_snapshot
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10.0, good: null, satisfactory: 25.0}
        pass_band: satisfactory
        band_note: "Transferred from fetched streamflow volume-bias convention; no peak-snapshot-only PBIAS tier was found."
        cites: [van_griensven2012, bouregreg2011]
    secondary_metrics:
      - metric: nse
        direction: maximize
        status: supportive
        ceiling_reason: "Snapshot/event-volume validation should not rely on hydrograph NSE alone; the field convention still treats hydrographs and exceedance curves as graphical/context checks."
        cites: [van_griensven2012]
    validated_when: "|PBIAS| <= 25% for event volume or snapshot magnitude, with hydrograph/exceedance plots used as context."
    evidence_strength: moderate
    confidence: 0.6
    notes: >-
      The dag determining metric is PBIAS. The numeric band is a cautious transfer from streamflow volume evaluation rather than a snapshot-specific rule; Van Griensven 2012 also notes graphical assessment through hydrographs and percent exceedance probability curves.

  - dag_variable: "SOILMOISTURE (SM)"
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric validation threshold for CREST relative soil moisture (% of WM) against gridded observations."
        cites: []
    secondary_metrics:
      - metric: spearman
        direction: maximize
        status: supportive
        ceiling_reason: "Rank/anomaly agreement is more defensible than absolute error because CREST reports relative storage rather than volumetric water content."
        cites: [ionita2015]
    validated_when: "UNRESOLVED - require a fetched CREST/soil-moisture or satellite-soil-moisture convention before auto-validating."
    evidence_strength: weak
    confidence: 0.3
    notes: >-
      The fetched soil-moisture text is predictive rather than a model-SM validation convention: Ionita 2015 uses soil moisture as a predictor and defines stable correlations, while also noting that real-time soil moisture observations are difficult and many studies depend on reanalysis fields. Null band prevents loosening the gate.

  - dag_variable: "SOILMOISTURE (SM)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a point-time-series correlation pass band for CREST relative soil moisture."
        cites: []
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "Absolute RMSE is only informative after converting or rescaling CREST percent-of-capacity storage to the observation unit."
        cites: [ionita2015]
    validated_when: "UNRESOLVED - use point soil-moisture observations only after unit/rescaling is documented; no numeric pass band is cited."
    evidence_strength: weak
    confidence: 0.3
    notes: >-
      The dag determining metric r is retained, but the fetched corpus does not support a numeric threshold for this model output. Ionita 2015 reports soil moisture in volumetric water content and highlights observation uncertainty, which does not justify a CREST %WM band.

  - dag_variable: "SNOWWATER (SWE)"
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a spatial SWE CSI threshold for CREST/Snow-17."
        cites: []
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "EF5 2020 warns that snow processes were not considered in its CONUS benchmark, so SWE validation requires snow-specific observations and configuration."
        cites: [ef5_2020]
    validated_when: "UNRESOLVED - require snow-specific gridded SWE benchmark or Snow-17 validation text before auto-validating CSI."
    evidence_strength: weak
    confidence: 0.25
    notes: >-
      EF5 2020 states the benchmark should be used with caution where frozen precipitation is active and says snow-process parameter development is still required. That supports caution but not a numeric SWE CSI band.

  - dag_variable: "SNOWWATER (SWE)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a point SWE NSE threshold for CREST/Snow-17."
        cites: []
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "EF5 2020 notes poor mountainous performance where precipitation falls as snow and says EF5 did not consider snow processes in that study."
        cites: [ef5_2020]
    validated_when: "UNRESOLVED - require snow-course/SNOTEL or Snow-17 validation convention before auto-validating NSE."
    evidence_strength: weak
    confidence: 0.25
    notes: >-
      The dag determining metric NSE is retained with a null band. A fetched Snow-17/SWE threshold paper was not available under the capped search/fetch discipline.

  - dag_variable: "RETURNPERIOD (RP)"
    obs_shape: categorical_event
    headline_metrics:
      - metric: spearman
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: 0.6}
        pass_band: satisfactory
        band_note: "Peak-flow ranking convention from fetched Amazon benchmark: Spearman annual-maximum correlations exceeding 0.6 are considered skilful."
        cites: [towner2019]
    secondary_metrics:
      - metric: kge
        direction: maximize
        status: supportive
        ceiling_reason: "Towner 2019 co-reports KGE for peak-flow simulations and describes intermediate KGE scores as 0.75 > KGE >= 0.5."
        cites: [towner2019]
    validated_when: "Spearman rank correlation >= 0.6 for observed versus simulated annual maxima or flood-class return-period ranking."
    evidence_strength: moderate
    confidence: 0.65
    notes: >-
      This matches the dag's Spearman determining metric. Towner 2019 explicitly says values exceeding 0.6 are "considered skilful" for annual maximum discharge at 75 gauging stations including a CREST EF5 run.

  - dag_variable: "INUNDATION (depth)"
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: 0.3, satisfactory: 0.3}
        pass_band: satisfactory
        band_note: "Transferred from fetched global flood-detection benchmark: for >3 day floods without dams, CSI about 0.3 was called good at this GFMS development stage."
        cites: [wu2012, bennett2013]
    secondary_metrics:
      - metric: pod
        direction: maximize
        status: supportive
        ceiling_reason: "Flood detection benchmarks require POD together with FAR/CSI because high detection can come with many false alarms."
        cites: [wu2012]
      - metric: far
        direction: minimize
        status: supportive
        ceiling_reason: "Bennett 2013 describes FAR as sensitive to false alarms, and Wu 2012 states balanced POD and FAR are necessary for this type of system."
        cites: [wu2012, bennett2013]
      - metric: f1
        direction: maximize
        status: supportive
        ceiling_reason: "A CREST dynamic-stream-network study used precision, recall, F1, and FAR against DSWE/loggers, but it was not an inundation-depth benchmark."
        cites: [jaafar2021]
    validated_when: "CSI >= 0.3 for binary inundated/not-inundated spatial overlap, with POD and FAR reviewed to avoid a high-hit/high-false-alarm result."
    evidence_strength: moderate
    confidence: 0.55
    notes: >-
      The dag says CSI is more appropriate than depth RMSE for this optional simple inundation module. Bennett 2013 defines CSI as penalizing both misses and false alarms. Wu 2012 reports that for floods longer than 3 days in areas without large dams "POD is ~0.7, FAR is ~0.6, and CSI is ~0.3" and calls these good results; the band is therefore a flood-detection benchmark transfer, not a CREST-iMAP depth threshold.

