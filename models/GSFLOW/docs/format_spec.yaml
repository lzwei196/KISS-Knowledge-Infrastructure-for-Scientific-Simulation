model:
  name: GSFLOW
  domain: hydrology
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: Temperature
    unit: "\xB0F (default) or \xB0C"
    format: ''
    source: skill_md
  - name: Precipitation
    unit: inches/day (default) or mm/day
    format: ''
    source: skill_md
  - name: temp
    unit: Temperature distribution module
    format: ''
    source: skill_md
  - name: precip
    unit: Precipitation distribution module
    format: ''
    source: skill_md
  - name: Snow
    unit: unknown
    format: ''
    source: skill_md
  - name: Solar
    unit: unknown
    format: ''
    source: skill_md
  - name: Wind
    unit: unknown
    format: ''
    source: skill_md
outputs:
  primary:
  - name: Temperature
    unit: "\xB0F (default) or \xB0C"
    format: ''
    source: skill_md
  - name: ET
    unit: inches/day
    format: ''
    source: skill_md
  - name: Runoff
    unit: unknown
    format: ''
    source: skill_md
  - name: Snow
    unit: unknown
    format: ''
    source: skill_md
  - name: Evapotranspiration
    unit: unknown
    format: ''
    source: skill_md
  - name: Soil_moisture
    unit: unknown
    format: ''
    source: skill_md
  - name: Flood
    unit: unknown
    format: ''
    source: skill_md
known_issues:
- id: dt_001
  description: "Model runs successfully but simulated streamflow is 25\xD7 higher\
    \ than\nobserved. Massive flooding in all seasons. Basin water balance shows\n\
    precipitation far exceeding any reasonable value.\n"
  affected_output: 'Precipitation units not converted from mm/day (CMFD source) to

    inches/day (GSFLOW precip_units=0). The factor of 25.4 was missed.

    GSFLOW interprets mm values as inches, inflating precipitation by 25.4'
  detection: 'Precipitation units not converted from mm/day (CMFD source) to

    inches/day (GSFLOW precip_units=0). The factor of 25.4 was missed.

    GSFLOW interprets mm values as inches, inflating precipitation by 25.4'
  fix: 'Multiply precipitation by MM_TO_INCHES = 1/25.4 = 0.03937 before

    writing to .day or .data file. Alternatively, set precip_units=1 (mm)

    in the parameter file to keep mm units. Verify: annual precipitat'
- id: dt_002
  description: 'No snow accumulation even in winter for basins that should have snow.

    ET is unrealistically high in winter. All precipitation falls as rain

    regardless of season.

    '
  affected_output: "Temperature data in Celsius being read by GSFLOW as Fahrenheit\n\
    (temp_units=0). 0\xB0C is interpreted as 0\xB0F, which is -17.8\xB0C \u2014 but\n\
    during summer, 25\xB0C is read as 25\xB0F (-3.9\xB0C), which is still cold.\n\
    Actu"
  detection: "Temperature data in Celsius being read by GSFLOW as Fahrenheit\n(temp_units=0).\
    \ 0\xB0C is interpreted as 0\xB0F, which is -17.8\xB0C \u2014 but\nduring summer,\
    \ 25\xB0C is read as 25\xB0F (-3.9\xB0C), which is still cold.\nActu"
  fix: "Convert temperature: K\u2192\xB0F = (K-273.15)\xD79/5+32 or K\u2192\xB0C =\
    \ K-273.15.\nMatch temp_units in parameter file to actual data units.\nCheck:\
    \ winter temperatures should be near/below 32\xB0F (0\xB0C) for\nsnow-producing"
- id: dt_003
  description: 'Simulated ET is approximately half the expected value. Soil moisture

    remains too high. Streamflow is moderately overestimated due to

    insufficient ET extraction.

    '
  affected_output: "Solar radiation not converted from W/m\xB2 (CMFD source) to\n\
    Langleys/day (GSFLOW internal). The conversion factor is ~2.065.\nWithout conversion,\
    \ radiation appears ~2\xD7 too low, reducing\ncomputed potential"
  detection: "Solar radiation not converted from W/m\xB2 (CMFD source) to\nLangleys/day\
    \ (GSFLOW internal). The conversion factor is ~2.065.\nWithout conversion, radiation\
    \ appears ~2\xD7 too low, reducing\ncomputed potential"
  fix: "Convert: Langleys/day = W/m\xB2 \xD7 86400/41868 \u2248 W/m\xB2 \xD7 2.065.\n\
    Verify: peak summer solar radiation should be 400-700 Langleys/day\n(200-340 W/m\xB2\
    ). If values are < 200, likely not converted.\n"
- id: dt_004
  description: 'All precipitation is stored in soil with almost no streamflow generated.

    Soil moisture never reaches capacity. The soil acts as an infinite sponge.

    '
  affected_output: "Soil moisture capacity (soil_moist_max) computed in mm but GSFLOW\n\
    expects inches. A typical soil_moist_max of 200mm becomes 200 inches\n(5080mm)\
    \ \u2014 an impossibly large soil reservoir that never fills.\n"
  detection: "Soil moisture capacity (soil_moist_max) computed in mm but GSFLOW\n\
    expects inches. A typical soil_moist_max of 200mm becomes 200 inches\n(5080mm)\
    \ \u2014 an impossibly large soil reservoir that never fills.\n"
  fix: 'Convert soil depth/capacity from mm to inches: divide by 25.4.

    Typical soil_moist_max range: 2-20 inches (50-500 mm).

    If soil_moist_max > 30 inches, likely still in mm.

    '
- id: dt_005
  description: 'Temperature lapse rate corrections are wildly wrong. Valley HRUs

    are too cold or mountain HRUs too warm. Snow line is at wrong

    elevation. Streamflow timing is incorrect.

    '
  affected_output: 'DEM elevation units (meters) don''t match GSFLOW elevation units

    (feet, via elev_units parameter). If DEM is in meters but GSFLOW

    expects feet, lapse rate corrections are applied to wrong values.

    1 met'
  detection: 'DEM elevation units (meters) don''t match GSFLOW elevation units

    (feet, via elev_units parameter). If DEM is in meters but GSFLOW

    expects feet, lapse rate corrections are applied to wrong values.

    1 met'
  fix: 'Either convert DEM to feet before extracting hru_elev, or set

    elev_units=1 (meters) in the parameter file. Verify by checking

    hru_elev values against known basin elevations.

    '
- id: dt_006
  description: 'GSFLOW crashes immediately at startup with error about reading

    control file or "unexpected end of file" error.

    '
  affected_output: 'Missing #### delimiter between parameter blocks in control file.

    Each parameter block must start and end with ####. A single missing

    delimiter causes the parser to misalign all subsequent parameters.

    '
  detection: 'Missing #### delimiter between parameter blocks in control file.

    Each parameter block must start and end with ####. A single missing

    delimiter causes the parser to misalign all subsequent parameters.

    '
  fix: "Ensure every parameter block in the control file is bounded by\n#### lines.\
    \ Use build_control_file.py tool which handles delimiters\nautomatically. Validate\
    \ by counting #### lines: should be\n2 \xD7 (number"
- id: dt_007
  description: 'GSFLOW crashes during initialization with "dimension mismatch" or

    "array bounds exceeded" error message.

    '
  affected_output: 'Parameter array length doesn''t match declared dimension. For
    example,

    if nhru=128 but soil_moist_max has only 100 values, GSFLOW crashes

    when trying to read value 101.

    '
  detection: 'Parameter array length doesn''t match declared dimension. For example,

    if nhru=128 but soil_moist_max has only 100 values, GSFLOW crashes

    when trying to read value 101.

    '
  fix: 'Verify each parameter has exactly the declared number of values.

    Check dimension declarations in parameter files match across all

    parameter files (nhru, nsegment, nssr must be consistent).

    '
- id: dt_008
  description: 'Parameter values are all zero or all the same default value.

    Model runs but produces uniform output across all HRUs.

    '
  affected_output: 'Wrong data type code in parameter file. Using code 1 (integer)
    for

    a float parameter truncates decimal values to 0. Using code 4 (string)

    for a numeric parameter reads garbage.

    '
  detection: 'Wrong data type code in parameter file. Using code 1 (integer) for

    a float parameter truncates decimal values to 0. Using code 4 (string)

    for a numeric parameter reads garbage.

    '
  fix: 'Data type codes: 1=integer, 2=real (float), 4=character (string).

    Verify data type codes match parameter type. Most physical parameters

    are type 2 (real). soil_type and cov_type are type 1 (integer).

    '
- id: dt_009
  description: '"FAILED TO MEET SOLVER CONVERGENCE CRITERIA" repeated in MODFLOW

    listing file. Model may produce output but water budget doesn''t close.

    '
  affected_output: 'MODFLOW groundwater solver (PCG, NWT) cannot converge within the

    specified iterations. Common causes: unrealistic hydraulic conductivity,

    initial heads far from solution, dry cells with rewetting prob'
  detection: 'MODFLOW groundwater solver (PCG, NWT) cannot converge within the

    specified iterations. Common causes: unrealistic hydraulic conductivity,

    initial heads far from solution, dry cells with rewetting prob'
  fix: "1. Switch from PCG to NWT solver (more robust for unconfined flow)\n2. Increase\
    \ MXITER in solver settings (e.g., 500\u21921000)\n3. Relax convergence criteria\
    \ (HCLOSE: 0.001\u21920.01)\n4. Check hydraulic conducti"
- id: dt_010
  description: 'GSFLOW aborts with "modflow_time_zero must precede simulation

    start_time" or similar timing error.

    '
  affected_output: 'The modflow_time_zero control parameter is set to the same date
    or

    a date after start_time. GSFLOW requires modflow_time_zero to be

    at least 1 day before start_time.

    '
  detection: 'The modflow_time_zero control parameter is set to the same date or

    a date after start_time. GSFLOW requires modflow_time_zero to be

    at least 1 day before start_time.

    '
  fix: 'Set modflow_time_zero to 1 day before start_time. For example,

    if start_time = 1980,10,1, set modflow_time_zero = 1980,9,30.

    '
- id: dt_011
  description: 'No streamflow generated. basin_cfs is always 0. All water goes to

    soil and groundwater storage but never reaches streams.

    '
  affected_output: 'Cascade flow network not defined or improperly configured.

    HRUs are not connected to stream segments, so surface runoff and

    interflow have no pathway to streams. Water accumulates in HRUs.

    '
  detection: 'Cascade flow network not defined or improperly configured.

    HRUs are not connected to stream segments, so surface runoff and

    interflow have no pathway to streams. Water accumulates in HRUs.

    '
  fix: 'Verify cascade parameters are defined:

    - ncascade > 0

    - hru_up_id and hru_down_id arrays properly assigned

    - Terminal HRUs cascade to stream segments (hru_segment)

    Alternatively, use strmflow_in_out m'
- id: dt_012
  description: 'Simulated peak flows are much higher than observed, while baseflow

    is too low. Hydrograph is too flashy with rapid rise and fall.

    '
  affected_output: 'Groundwater parameters (ssr2gw_rate, gwflow_coef) are too low,

    causing insufficient groundwater recharge and baseflow. Most water

    runs off as surface flow or quick interflow.

    '
  detection: 'Groundwater parameters (ssr2gw_rate, gwflow_coef) are too low,

    causing insufficient groundwater recharge and baseflow. Most water

    runs off as surface flow or quick interflow.

    '
  fix: "Increase ssr2gw_rate (0.1-0.5) and gwflow_coef (0.01-0.05).\nAlso check soil_moist_max\
    \ \u2014 if too low, soil fills quickly and\ngenerates excess surface runoff.\n"
- id: dt_013
  description: '"File not found" errors when running on Linux. Control file was

    created on Windows and contains backslash path separators.

    '
  affected_output: 'Windows-style paths (\..\input\prms\file.params) are not valid

    on Linux. The backslashes are interpreted as escape characters

    or literal characters, not path separators.

    '
  detection: 'Windows-style paths (\..\input\prms\file.params) are not valid

    on Linux. The backslashes are interpreted as escape characters

    or literal characters, not path separators.

    '
  fix: 'Convert all backslashes to forward slashes in control file and

    MODFLOW name file: sed -i ''s|\\|/|g'' *.control *.nam

    The build_control_file.py tool always uses forward slashes.

    '
- id: dt_014
  description: 'Output directory errors. GSFLOW reports cannot open output files.

    No output files are created.

    '
  affected_output: 'Output directories specified in control file don''t exist. GSFLOW

    does NOT create directories automatically. If the control file

    specifies output/prms/ but that directory doesn''t exist, writes fail.

    '
  detection: 'Output directories specified in control file don''t exist. GSFLOW

    does NOT create directories automatically. If the control file

    specifies output/prms/ but that directory doesn''t exist, writes fail.

    '
  fix: 'Create all output directories before running:

    mkdir -p output/prms output/modflow

    Check all paths in csv_output_file, model_output_file, etc.

    '
- id: dt_015
  description: 'GSFLOW crashes during first timestep with "data file read error"

    or "wrong number of values" in data file.

    '
  affected_output: "The .day file has wrong number of values per line. GSFLOW expects\n\
    exactly nhru values after the 6 date fields. Fewer values \u2192 crash.\nMore\
    \ values \u2192 silently ignored (but usually causes alignment issues"
  detection: "The .day file has wrong number of values per line. GSFLOW expects\n\
    exactly nhru values after the 6 date fields. Fewer values \u2192 crash.\nMore\
    \ values \u2192 silently ignored (but usually causes alignment issues"
  fix: 'Verify each data line has exactly 6 + nhru columns.

    Check nhru dimension in parameter file matches .day file column count.

    Watch for inconsistent line endings (Windows CRLF vs Unix LF).

    '
- id: dt_016
  description: 'Validation metrics (NSE, KGE) are much worse than expected despite

    reasonable-looking hydrographs. NSE is strongly negative.

    '
  affected_output: 'Spinup period included in validation statistics. The first 1-3
    years

    of simulation have unrealistic initial conditions (dry soil, wrong

    groundwater heads), which dramatically inflate error statistics.'
  detection: 'Spinup period included in validation statistics. The first 1-3 years

    of simulation have unrealistic initial conditions (dry soil, wrong

    groundwater heads), which dramatically inflate error statistics.'
  fix: 'Discard first 1-3 years as spinup period. For Bengbu 1980-1990:

    start model at 1980, validate only 1981-1990 (or even 1982-1990).

    '
- id: dt_017
  description: "Simulated discharge is approximately 35\xD7 higher or lower than\n\
    observed discharge. Temporal pattern may look correct but magnitude\nis completely\
    \ wrong.\n"
  affected_output: "Output unit mismatch. GSFLOW outputs basin_cfs (cubic feet per\n\
    second) but observations are in m\xB3/s. The conversion factor is\n0.028317. Comparing\
    \ cfs to cms directly gives 35\xD7 error.\n"
  detection: "Output unit mismatch. GSFLOW outputs basin_cfs (cubic feet per\nsecond)\
    \ but observations are in m\xB3/s. The conversion factor is\n0.028317. Comparing\
    \ cfs to cms directly gives 35\xD7 error.\n"
  fix: "Convert basin_cfs to m\xB3/s: multiply by CFS_TO_CMS = 0.028317.\nOr convert\
    \ basin_stflow (inches) to m\xB3/s using basin area:\nQ_cms = stflow_in \xD7 area_km\xB2\
    \ \xD7 25.4 \xD7 1000 / 86400\n"
- id: dt_018
  description: 'Basin area in model is wrong. Water balance doesn''t close. Runoff

    volume is systematically over or underestimated by a constant factor.

    '
  affected_output: "HRU area (hru_area) is in wrong units. PRMS expects acres.\nCommon\
    \ mistake: using km\xB2 or m\xB2. 1 km\xB2 = 247.105 acres.\nIf hru_area is in\
    \ km\xB2, volumes will be off by 247\xD7.\n"
  detection: "HRU area (hru_area) is in wrong units. PRMS expects acres.\nCommon mistake:\
    \ using km\xB2 or m\xB2. 1 km\xB2 = 247.105 acres.\nIf hru_area is in km\xB2,\
    \ volumes will be off by 247\xD7.\n"
  fix: "Convert basin area to acres: km\xB2 \xD7 247.105 or m\xB2 / 4046.86.\nVerify:\
    \ sum(hru_area) should equal basin area in acres.\nBengbu basin: ~121,330 km\xB2\
    \ \u2248 29,977,000 acres.\n"
unit_conversions: []
