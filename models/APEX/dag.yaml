safety:
  hazards:
    - id: "weather_srad_units_wm2"
      kind: "weather_file_semantic"
      description: "Solar radiation authored in W/m2 instead of MJ/m2/day (expected ~10-25); silently distorts ET and water yield (multiply W/m2 by 0.0864)"
      severity: "silent"
    - id: "weather_rh_percent_not_fraction"
      kind: "weather_file_semantic"
      description: "Relative humidity supplied as percent rather than fraction (0-1), corrupting Penman PET"
      severity: "silent"
    - id: "ngn_generate_overrides_dly"
      kind: "control_semantic"
      description: "An NGN digit flagging a variable also populated in *.DLY makes APEX use the weather generator and ignore the file column"
      severity: "silent"
    - id: "site_units_elevation_slope"
      kind: "soil_semantic"
      description: "Elevation in feet not metres, channel slope CHS as percent not m/m fraction (0.05 = 5%), or southern-hemisphere latitude not negative; all silently bias hydrology"
      severity: "silent"
    - id: "apexcont_i4_free_format"
      kind: "control_semantic"
      description: "APEXCONT.DAT line 1 read as Fortran I4 fixed-width; free-format spacing concatenates fields so NBYR=6 is misread as 62 and all later fields shift"
      severity: "silent"
    - id: "opcode_version_mismatch"
      kind: "control_semantic"
      description: "Mixing APEX1501 operation codes (plant 132 / fert 580 / harvest 316 / kill 397) into an APEX0806 run silently misinterprets operations and zeroes yield; use 0806 codes 136/261/292/451"
      severity: "silent"
    - id: "fert_code_pause_92_93"
      kind: "control_semantic"
      description: "Fertilizer codes 92/93 (APEX1501-only) are absent from APEX0806 FERTCOM.DAT (entries 1-72 only) and trigger a Fortran PAUSE awaiting stdin; use elemental codes 53/54"
      severity: "fatal"
    - id: "tillage_code_absent_pause"
      kind: "control_semantic"
      description: "An operation/tillage code absent from the APEX0806 TILLCOM.DAT (e.g. 151) triggers a Fortran PAUSE that blocks indefinitely; use a code present in the table (e.g. 160)"
      severity: "fatal"
    - id: "opc_field_width_phu_shift"
      kind: "parser_semantic"
      description: "Writing the OPC operation line with 5xI5 instead of 4xI5 shifts the F-format fields one slot right so PHU is read as 0, maturing the crop on planting day with ~0 biomass"
      severity: "silent"
    - id: "missing_kill_op_carryover"
      kind: "control_semantic"
      description: "Omitting kill-crop (op 451) the day after harvest leaves residual live canopy that compounds across years, freezing HUI and zeroing YLDG from year 3 onward"
      severity: "silent"
    - id: "spinup_artificial_drought"
      kind: "initial_condition_semantic"
      description: "Texas-template soil/nutrient pools at a humid/temperate site without 20-25 year spin-up cause artificial drought (WS>50) and yields <2 t/ha for the early years"
      severity: "degraded"
    - id: "exit_zero_silent_crash"
      kind: "parser_semantic"
      description: "Binary returns exit code 0 even on Fortran severe errors; success must be verified by non-empty *.OUT/*.ACY output and a clean EPICERR.DAT, not the return code"
      severity: "fatal_or_silent"
  validation_limits:
    - "Each subarea must be relatively homogeneous in soil, land use, management, and weather (EPIC field area up to ~100 ha); intra-subarea heterogeneity is unresolved"
    - "Daily time step cannot resolve sub-daily hydrologic dynamics except where the optional Green-Ampt / rainfall-excess sub-daily path is active"
    - "Generic single crop model with crop-specific parameters; extinction coefficient 0.65 represents narrow-row crops and may be inappropriate (0.4-0.6) for tropical/wide-row crops"
    - "Long-term (100+ year) simulations may exceed the adequacy of available rainfall/temperature records, requiring weather generation"
    - "Aluminum toxicity is represented only indirectly via root growth and water-use inhibition, not as a direct shoot effect"
  warnings:
    - "Soil/nutrient pools require a 20-25 year spin-up to reach steady state for a non-template climate; filter spin-up years out of reported output"
    - "Biomass accumulation REG is the minimum of water, nutrient, temperature, and aeration stresses; a single dominant stress can cap yield"
    - "N fixation occurs only for legumes, is reduced when top-0.3 m water content is below 75% field capacity, and is prohibited when root-zone NO3-N exceeds 300 kg/ha/m"
    - "Crop water compensation across dry layers depends on the rooting parameter (UC near 1.0 allows full compensation; near 0 disables it)"
  assumptions:
    - statement: "The simulation domain is a watershed of one or more point-scale, vertically-1-D homogeneous subareas connected by 1-D channel routing"
      scope: "spatial geometry of the whole model"
      source: "APEX Theoretical Documentation v0604 (Chapter 1; epicapex.tamu.edu)"
      status: "adopted"
    - statement: "Water balance closes as PCP ~= WYLD + ET + DPRK + delta-S to within about +/-5%; N, P, C, sediment, and pesticide mass are conserved through routing"
      scope: "conservation / closure"
      source: "APEX Theoretical Documentation v0604 hydrology and routing chapters; <run>.OUT mass-balance block"
      status: "adopted"
    - statement: "ET options are demand-side flux calculations; the model does not close a surface energy budget"
      scope: "energy closure"
      source: "APEX Theoretical Documentation v0604 (2.x hydrology / ET)"
      status: "adopted"
    - statement: "This dag describes the APEX0806 binding (operation codes 136/261/292/451, fertilizer codes 53/54, FERTCOM.DAT entries 1-72); APEX1501 is a distinct binding excluded here due to a confirmed P-cycling NaN that zeroes annual-crop biomass"
      scope: "implementation identity"
      source: "APEX0806 User Guide (epicapex.tamu.edu); KI SKILL.md operation-code table"
      status: "adopted"
