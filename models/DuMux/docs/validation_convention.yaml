schema_version: 1
model_id: DuMux
domain: hydrology
generated_by: "step-b validation convention agent"
generated_at: 2026-08-14

# DuMux is a general porous-media simulator. The fetched benchmark literature mostly
# defines comparison targets and metrics, not universal pass/fail thresholds. Only the
# derived baseflow/discharge time-series block gets a numeric gate, transferred from a
# fetched SWAT calibration/validation review that reproduces the Moriasi NSE convention.
# All other headline bands remain null because the fetched DuMux/porous-media benchmark
# papers report intercomparison spread, visual agreement, Wasserstein distance, L2 norms,
# or proxy quantities, but not accepted validation tiers for these dag variables.

references:
  arnold2012_swat:
    doi: 10.13031/2013.42256
    title: "SWAT: Model Use, Calibration, and Validation"
    venue: "Transactions of the ASABE"
    year: 2012
    oa: green
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.13031_2013.42256.txt
  flemisch2024_fluidflower:
    doi: 10.1007/s11242-023-01977-7
    title: "The FluidFlower Validation Benchmark Study for the Storage of CO2"
    venue: "Transport in Porous Media"
    year: 2024
    oa: gold
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1007_s11242-023-01977-7.txt
  berre2020_fracture3d:
    doi: 10.1016/j.advwatres.2020.103759
    title: "Verification benchmarks for single-phase flow in three-dimensional fractured porous media"
    venue: "Advances in Water Resources"
    year: 2020
    oa: manual
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1016_j.advwatres.2020.103759.txt
  maxwell2014_ihmip:
    doi: 10.1002/2013WR013725
    title: "Surface-subsurface model intercomparison: A first set of benchmark results to diagnose integrated hydrology and feedbacks"
    venue: "Water Resources Research"
    year: 2014
    oa: manual
    resolves: KISSPATH_INTERNAL_NOT_SHIPPED/paper_cache/10.1002_2013wr013725.txt
  carrayrou2010_momas:
    doi: 10.1007/s10596-010-9178-2
    title: "Comparison of numerical methods for simulating strongly nonlinear and heterogeneous reactive transport problems - the MoMaS benchmark case"
    venue: "Computational Geosciences"
    year: 2010
