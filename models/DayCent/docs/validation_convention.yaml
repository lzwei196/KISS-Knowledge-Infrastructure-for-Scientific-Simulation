        bands: {very_good: 10.0, good: 20.0, satisfactory: 20.0}
        pass_band: satisfactory
        band_note: "Zhang 2020 reports 70% of corn county yields within +/-20% and 47% within +/-10%; soybean 67% within +/-20% and 58% within +/-10%; wheat 64% within +/-20%."
