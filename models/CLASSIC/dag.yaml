safety:
  hazards:
    - {id: "weather_TA_kelvin_not_celsius", kind: "weather_file_semantic", description: "Air temperature supplied in Kelvin instead of Celsius; driver re-converts to K, producing ~300 K soil temperatures and a broken energy balance.", severity: "silent"}
    - {id: "weather_PRE_depth_not_flux", kind: "weather_file_semantic", description: "Precipitation supplied as mm/day or mm/hr instead of kg m-2 s-1, scaling runoff/water balance by up to 86400x.", severity: "silent"}
    - {id: "weather_QA_gkg_not_kgkg", kind: "weather_file_semantic", description: "Specific humidity in g/kg instead of kg/kg makes the atmosphere ~1000x too moist; evapotranspiration explodes and soil dries out.", severity: "silent"}
    - {id: "weather_PRES_hpa_not_pa", kind: "weather_file_semantic", description: "Surface pressure in hPa/kPa instead of Pa gives 100-1000x wrong air density and turbulent fluxes.", severity: "degraded"}
    - {id: "weather_time_encoding_non_cf", kind: "weather_file_semantic", description: "Time axis encoded as CF 'days since' instead of CLASSIC's non-standard 'day as %Y%m%d.%f'; all dates are shifted or garbled.", severity: "fatal_or_silent"}
    - {id: "soil_texture_fraction_not_percent", kind: "soil_semantic", description: "Soil texture SAND/CLAY/ORGM as 0-1 fraction instead of 0-100 percent yields wrong hydraulic properties (sand reads as ~0).", severity: "silent"}
    - {id: "init_carbon_pools_wrong_mass_units", kind: "initial_condition_semantic", description: "Carbon pools initialized in gC/m2 or tC/ha instead of kgC/m2 make pools ~1000x too large and NEP hugely negative.", severity: "silent"}
    - {id: "init_tbar_celsius_not_kelvin", kind: "initial_condition_semantic", description: "Init-file soil temperature TBAR supplied in Celsius instead of Kelvin (note: forcing TA is the opposite convention).", severity: "degraded"}
    - {id: "shortwave_negative_after_disagg", kind: "weather_file_semantic", description: "Night-time shortwave not clipped to zero after temporal interpolation across the day-night boundary, injecting negative SW / NaN into radiation.", severity: "silent"}
    - {id: "numerics_newton_raphson_diverges", kind: "numerical_instability", description: "ITC/ITCG/ITG=2 (Newton-Raphson surface-temperature solve) diverges to NaN; bisection (=1) always converges.", severity: "fatal"}
    - {id: "control_refheight_below_canopy", kind: "control_semantic", description: "Reference height ZRFH/ZRFM set below vegetation canopy height; surface-atmosphere exchange cannot be computed (division-by-zero crash).", severity: "fatal"}
    - {id: "control_pft_count_mismatch", kind: "control_semantic", description: "ican/icc in run_parameters does not match init-file ic/icc dimensions; array-bounds segfault at startup.", severity: "fatal"}
    - {id: "control_met_not_start_day1", kind: "control_semantic", description: "Meteorological forcing does not begin at 00:00 of Jan 1 of the start year; model hangs or writes no output.", severity: "fatal_or_silent"}
    - {id: "control_coords_off_grid", kind: "control_semantic", description: "Requested lon/lat does not match any init-file grid cell; model exits with 'No valid gridcells'.", severity: "fatal"}
    - {id: "control_restart_aliases_init", kind: "control_semantic", description: "rs_file_to_overwrite points at the init file; the in-place restart write destroys the initial state.", severity: "fatal_or_silent"}
    - {id: "control_ctem_off_zero_carbon", kind: "control_semantic", description: "ctem_on=.false. (physics-only) yields all-zero GPP/NPP/NEP despite vegetation present.", severity: "degraded"}
    - {id: "control_spinfast_breaks_carbon_budget", kind: "control_semantic", description: "spinfast>1 accelerates soil-carbon decomposition (inflates Rh) and breaks NEP=GPP-Ra-Rh closure; use spinfast=1 for transient/budget runs.", severity: "degraded"}
    - {id: "control_output_window_outside_sim", kind: "control_semantic", description: "Monthly/daily output start years (JMOSTY/JDSTY) set after the simulation end produce empty monthly/daily output.", severity: "warning"}
  validation_limits:
    - "No lateral inter-cell exchange; cannot represent hillslope/lateral routing — runoff is an unrouted grid-cell diagnostic."
    - "Four CLASS PFTs are insufficient to represent shrublands."
    - "No nitrogen cycle in v1.0; nitrogen limitation on productivity is not represented."
    - "Carbon pools reach equilibrium only after repeated spin-up cycling of the forcing; transient runs require a pre-spun-up state."
    - "Single-layer snowpack cannot resolve internal snow stratigraphy."
    - "Daily CTEM biogeochemistry timestep cannot directly resolve sub-daily carbon-flux dynamics (physics runs sub-daily)."
  warnings:
    - "GPP/NPP/NEP/NBP are emitted in kgC m-2 s-1 (instantaneous) or kgC m-2 month-1 (accumulated) depending on output frequency; do not assume a single unit."
    - "Carbon-budget closure (NEP=GPP-Ra-Rh) holds only at spinfast=1."
    - "Energy-balance closure is enforced in the model; flux-tower LE+H carry a 10-30% closure residual and should not be force-closed for comparison."
  assumptions:
    - statement: "Each grid cell/tile is an independent 1-D vertical column with no lateral heat or moisture exchange (except under MESH coupling)."
      scope: "Domain geometry / spatial structure"
      source: "Melton et al. 2020, GMD 13:2825 (model framework); CCCma CLASS documentation"
      status: "adopted"
    - statement: "Surface energy budget closure is enforced by construction, unlike eddy-covariance towers which leave a 10-30% residual."
      scope: "Energy-balance closure and flux-tower comparison"
      source: "Melton et al. 2020, GMD 13:2825 (limitations); CCCma CLASS documentation"
      status: "adopted"
    - statement: "Modeled NEE/NEP is a closed carbon mass balance (sums to zero at equilibrium) only when spinfast=1; accelerated soil-carbon spin-up (spinfast>1) intentionally breaks the budget."
      scope: "Carbon mass-balance closure"
      source: "CTEM carbon-balance behavior in CLASSIC docs and diagnostics (spinfast / NEP=GPP-Ra-Rh check)"
      status: "adopted"
    - statement: "Forcing air temperature (TA) is supplied to the driver in deg C and converted to Kelvin internally, whereas the init-file soil temperature TBAR is in Kelvin."
      scope: "Temperature input unit conventions"
      source: "CLASSIC met-forcing and soil-init skill docs (s1/s2) and convert_soil_to_classic header; an internal docs contradiction is noted"
      status: "tentative"
    - statement: "Vegetation is represented at plant-functional-type level (CLASS 4 PFTs, CTEM 9 PFTs), not at species level."
      scope: "Vegetation representation"
      source: "Melton et al. 2020, GMD 13:2825 (CTEM component)"
      status: "adopted"
