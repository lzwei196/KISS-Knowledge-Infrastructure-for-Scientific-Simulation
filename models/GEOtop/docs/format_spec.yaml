  remedy: 'Always use absolute paths for the simulation directory; run_geotop.py; [''Use: ./geotop /absolute/path/to/sim_dir'',
    ''Not: ./geotop sim_dir or ./geotop ../sim_dir'']; run_geotop.py converts paths to absolute before
