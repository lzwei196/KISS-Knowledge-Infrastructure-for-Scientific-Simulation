# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: KINEROS2
  language: fortran
  implementation:
    id: ars-swrc-kineros2-k2shell
    version: 25-Oct-2019 (ARS-SWRC/KINEROS2 commit f0bbae2a19238fe98d5b42fbc9e55a993bfbba41)
    provenance: Fortran 77/90; official USDA-ARS source (github.com/ARS-SWRC/KINEROS2) compiled with gfortran
      13.3; output matches the official ARS Windows k2_x64.exe to the 6th-7th digit on both ARS sample
      cases. A separate Python lumped daily SURROGATE that predates this engine is NOT this implementation
      and its results are not KINEROS2 results.
    surrogate_not_this_model: tools/run_kineros2.py -- Python lumped daily Green-Ampt + two-reservoir
      stand-in (Hamon PET); kept for history only
  scientific_reference_version: KINEROS2 (Kinematic Runoff and Erosion model, USDA-ARS Southwest Watershed
    Research Center; Woolhiser, Smith & Goodrich 1990; Smith et al. 1995; Goodrich et al. 2012), K2shell
    version 25-Oct-2019
inputs:
  forcing:
  - name: rainfall_depth_cumulative
    unit: mm (UNITS=METRIC) or in (UNITS=ENGLISH) vs minutes
    category: atmospheric
    source_kind: forcing
    model_input_format: 'rainfall file: one block per rain gage with N breakpoints of TIME (min) and cumulative
      DEPTH, or INTENSITY (mm/hr or in/hr); optional gage X, Y and SAT'
    notes: Breakpoint data from recording gages at minute resolution. Depth is read in the parameter file's
      unit system with no conversion. Intensity is interpolated in space from the three gages enclosing
      each element centroid.
  parameters:
  - name: KS
    unit: mm/hr or in/hr
    category: infiltration
    source_kind: calibrated
    model_input_format: per pervious element (1 or 2 layers); global multiplier
    notes: Saturated hydraulic conductivity; zero = impervious. Rawls et al. 1982 class values are a starting
      point; ARS WG11 uses 0.40-0.52 in/hr on planes with a 0.5 multiplier.
  - name: G
    unit: mm or in
    category: infiltration
    source_kind: calibrated
    model_input_format: per pervious element (1 or 2 layers); global multiplier
    notes: Net capillary drive (Brooks-Corey integral); zero = constant infiltration at KS. Manual Table
      1 (Rawls 1982) gives 5-41 cm by texture.
  - name: DIST
    unit: dimensionless
    category: infiltration
    source_kind: dataset_lookup
    model_input_format: per pervious element
    notes: Brooks-Corey pore size distribution index; used for redistribution; must be <= 1.5.
  - name: POR
    unit: dimensionless
    category: infiltration
    source_kind: dataset_lookup
    model_input_format: per pervious element
    notes: Soil porosity; with SAT and SMAX sets the initial moisture deficit.
  - name: ROCK
    unit: dimensionless
    category: infiltration
    source_kind: dataset_lookup
    model_input_format: per pervious element
    notes: Volumetric rock fraction; reduces storage. Texture-based KS should be multiplied by (1 - ROCK).
  - name: CV
    unit: dimensionless
    category: infiltration
    source_kind: calibrated
    model_input_format: per pervious element; global multiplier
    notes: Coefficient of variation of KS within an element (log-normal small-scale variability).
  - name: MANNING
    unit: s m^-1/3 (Manning n) or Chezy C
    category: overland_flow
    source_kind: calibrated
    model_input_format: per plane and channel; global multiplier
    notes: Hydraulic roughness of planes and channels; second calibration lever after KS.
  - name: element_geometry
    unit: m or ft; slope m/m
    category: geometry
    source_kind: dataset_lookup
    model_input_format: LENGTH, WIDTH (or AREA), SLOPE per plane; LENGTH, WIDTH, SLOPE, SS1, SS2 per channel;
      UPSTREAM/LATERAL topology
    notes: From DEM discretisation (AGWA) or survey. CLEN (global) sets the spatial resolution.
  - name: INTER
    unit: mm or in
    category: interception
    source_kind: dataset_lookup
    model_input_format: per plane, with CANOPY fraction; global multiplier
    notes: Interception storage depth filled at a rate reduced by the canopy cover fraction.
  - name: sediment_parameters
    unit: SPLASH, COH dimensionless; DIAMS mm or in; DENSITY g/cc; FRACT fraction
    category: erosion
    source_kind: calibrated
    model_input_format: GLOBAL DIAMS/DENSITY/TEMP; per plane SPLASH, COH, FRACT; per channel COH, FRACT;
      optional PAV
    notes: Smith method by default; RHEM or DWEPP selected per element by their own tags.
  initial_conditions:
  - name: SAT
    unit: dimensionless (relative saturation of pore space)
    category: soil_state
    source_kind: user_provided
    model_input_format: per element (SA), per rain gage (SAT, interpolated, overrides element SA) or global
      SAT
    notes: Antecedent soil moisture; the most sensitive input after rainfall and KS for most flow responses.
      The engine stops if a pervious element has none.
  - name: STORAGE
    unit: m3 or ft3
    category: pond_state
    source_kind: user_provided
    model_input_format: per pond element
    notes: Initial pond storage volume (default 0).
  boundary_conditions:
  - name: injected_inflow
    unit: m3/s or ft3/s vs minutes (+ optional sediment concentrations)
    category: inflow
    source_kind: user_provided
    model_input_format: INJECT element with a data file
    notes: Measured flow or another model's output entering the cascade.
  - name: QB
    unit: m3/s or ft3/s
    category: inflow
    source_kind: user_provided
    model_input_format: per channel
    notes: Constant channel baseflow at the channel outlet.
outputs:
  primary:
  - name: discharge
    unit: m3/s
    description: Surface water discharge (stream / channel flow) at the watershed outlet element, as an
      event hydrograph at the user time step in minutes.
    validation_rank: 1
    emitted_in: output report hydrograph table for elements with PRINT=2 (cu m/s METRIC, cu ft/s ENGLISH)
      or the PRINT=3 CSV; peak on the 'Peak flow' line
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - 'Event scale: compare one storm at minute steps against a flume/weir hydrograph, not daily gauge
          flow.'
        - Put observed and simulated series on the same clock (rain-file origin vs gauge local time).
        - 'Compare in absolute units (m3/s): a gauge''s depth series uses its nominal drainage area, which
          may differ from the modelled contributing area.'
        - Peaks from the compute steps exceed the dt-sampled table maximum slightly; report the engine's
          peak line for peaks.
      detrending_options:
      - none
  - name: runoff_volume
    unit: m3
    description: Event total surface runoff water volume leaving the watershed outlet channel.
    validation_rank: 2
    emitted_in: output report 'Event Volume Summary' Outflow (cu m or cu ft; depth over the modelled area
      in mm or in)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - One value per storm; skill needs several events.
        - Use volume, not depth, when the gauge's nominal area differs from the modelled area.
      detrending_options:
      - none
  - name: peak_discharge
    unit: m3/s
    description: Event peak surface water discharge (stream / channel flow) at the watershed outlet and
      its time.
    validation_rank: 3
    emitted_in: output report 'Peak flow = ... at ... min' line of the outlet element
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - One value per storm; report time-to-peak error alongside.
      detrending_options:
      - none
  - name: sediment_yield
    unit: t/ha
    description: 'Event sediment yield: eroded soil and sediment mass delivered at the watershed outlet
      per unit watershed area.'
    validation_rank: 4
    emitted_in: output report 'Sediment yield =' (tons/ha METRIC, short tons/ac ENGLISH) and by particle
      class; only with sediment routing on
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Needs measured event sediment (flume samplers or pond surveys); ENGLISH runs report short tons
          per acre (x2.2417 to t/ha).
      detrending_options:
      - none
  secondary:
  - name: infiltration
    unit: mm
    description: Event infiltration depth into the soil of planes and into channel beds (transmission
      losses), over the watershed area.
    validation_rank: null
    emitted_in: output report 'Event Volume Summary' Plane/Channel infiltration and the tabular element
      summary
  - name: sediment_discharge
    unit: kg/s
    description: Total suspended sediment discharge in water leaving an element, per user time step.
    validation_rank: null
    emitted_in: hydrograph table column (PRINT=2) or PRINT=3 CSV with per-class columns (kg/s METRIC,
      lb/s ENGLISH)
known_issues:
- id: dt_kineros2_001
  symptom: Simulated discharge is 86400x too low; hydrograph is nearly flat with negligible runoff despite
    significant observed storm events
  diagnosis: Precipitation is supplied in kg/m2/s (CMFD raw units) but KINEROS2 expects mm/d. Since 1
    kg/m2/s equals 86400 mm/d, feeding raw CMFD values makes a 2.7 mm/d rainfall appear as 0.000031 mm/d,
    producing essentially zero infiltration excess.
  remedy: Multiply CMFD precipitation by 86400 to convert from kg/m2/s to mm/d. Verify that daily precipitation
    values are in the range 0-150 mm/d for typical basins.
- id: dt_kineros2_002
  symptom: Simulated discharge is about 8x too high; basin floods unrealistically even during moderate
    rainfall events
  diagnosis: Precipitation is supplied as mm/3h sub-daily totals summed incorrectly or used directly as
    mm/d. CMFD provides 3-hourly accumulations; directly treating each 3-hour value as a daily total effectively
    multiplies precipitation by 8.
  remedy: Sum all eight 3-hourly CMFD values within each day to compute the correct daily total in mm/d,
    rather than using individual 3-hour values as daily inputs.
- id: dt_kineros2_003
  symptom: PET is absurdly high (hundreds of mm/d); soil dries out instantly and there is no runoff because
    the Hamon method computes extreme evapotranspiration
  diagnosis: Temperature is supplied in Kelvin (CMFD/ERA5 raw units) instead of degrees Celsius. The Hamon
    PET method receives approximately 280 as input temperature, which produces physically impossible evapotranspiration
    rates.
  remedy: Subtract 273.15 from CMFD/ERA5 temperature values before passing to KINEROS2. Verify that temperature
    time series ranges between approximately -30 and +45 degrees Celsius.
- id: dt_kineros2_004
  symptom: Infiltration capacity is approximately 24x too low; nearly all rainfall becomes surface runoff
    even on sandy soils that should absorb most precipitation
  diagnosis: Saturated hydraulic conductivity (Ks) is supplied in mm/h (the unit used in HWSD and many
    soil databases) but the daily KINEROS2 model expects mm/d. A Ks of 10 mm/h should be 240 mm/d; using
    10 mm/d makes the Green-Ampt infiltration capacity far too small.
  remedy: Multiply Ks by 24 when converting from mm/h to mm/d. For cm/h sources, multiply by 240. Verify
    Ks falls within [1, 80] mm/d for the lumped daily model parameter range, or within physically realistic
    bounds for the soil texture class (e.g., sandy loam approximately 262 mm/d, clay approximately 7.2
    mm
- id: dt_kineros2_005
  symptom: Wetting front suction appears 10x too low; Green-Ampt infiltration is insensitive to soil moisture
    deficit and behaves as though the soil has minimal capillary pull
  diagnosis: Wetting front suction head (psi_f) is supplied in cm (as given in Rawls et al. 1983 tables)
    but KINEROS2 expects mm. A silt loam with psi_f of 16.68 cm should be 166.8 mm; using 16.68 mm severely
    underestimates capillary suction.
  remedy: Multiply psi_f by 10 when converting from cm to mm. Verify the value falls within the expected
    range [10, 500] mm and is consistent with the USDA soil texture class.
- id: dt_kineros2_006
  symptom: Discharge magnitude is wrong by a factor of 100; unit hydrograph conversion produces nonsensical
    flow values at the basin outlet
  diagnosis: Basin area is specified in hectares instead of km2. Since 1 km2 = 100 ha, an area of 12133000
    ha entered as 12133000 km2 (or 121330 ha entered as 121330 km2) makes the mm/d-to-m3/s conversion
    factor off by a factor of 100.
  remedy: 'Divide the area by 100 if the source data is in hectares. The mm/d to m3/s conversion is: Q_m3s
    = Q_mmd * area_km2 * 1e6 / 86400 / 1000. Verify the basin area against a known reference.'
- id: dt_kineros2_007
  symptom: Soil storage capacity is 1000x too large; soil never saturates and all rainfall is absorbed
    indefinitely with zero surface runoff
  diagnosis: Maximum soil storage (Smax) is specified in meters instead of mm. An Smax of 0.5 m should
    be entered as 500 mm; entering 0.5 makes storage negligibly small, while entering the raw meter value
    (e.g., 500) from a source that already reports mm is correct.
  remedy: Ensure Smax is in mm. If the source provides meters, multiply by 1000. Verify Smax falls within
    the physical range [100, 800] mm.
- id: dt_kineros2_008
  symptom: Model tool exits with 'KeyError' or 'missing column' when reading the forcing JSON file; run_kineros2.py
    cannot find expected precipitation or temperature arrays
  diagnosis: The forcing JSON file produced by convert_forcing_to_kineros2.py uses different key names
    than what run_kineros2.py expects. Common mismatches include 'precip' vs 'precipitation', 'temp' vs
    'temperature', or the date field is formatted differently than expected.
  remedy: Verify the forcing JSON contains the exact keys expected by run_kineros2.py (check the tool's
    argument parser and input validation). Regenerate the forcing file using the convert_forcing_to_kineros2.py
    tool with correct --output format rather than manually editing JSON.
- id: dt_kineros2_009
  symptom: Observed discharge file cannot be parsed; calibration fails at startup with a date parsing
    or CSV reading error
  diagnosis: The observed discharge CSV file uses an unexpected date format (e.g., DD/MM/YYYY instead
    of YYYY-MM-DD), has a different delimiter (semicolons or tabs instead of commas), or contains header
    lines that pandas cannot auto-detect.
  remedy: 'Ensure the observed discharge CSV has columns ''date'' (YYYY-MM-DD format) and ''discharge_m3s''
    (numeric, in m3/s). Remove any metadata header lines. Use commas as delimiters. Verify with: head
    -5 observed_Q.csv.'
- id: dt_kineros2_010
  symptom: Soil parameter JSON is rejected; convert_soil_to_kineros2.py produces an error about unrecognized
    soil texture class
  diagnosis: The soil texture string does not match one of the recognized USDA texture classes. Common
    issues include capitalization ('Sandy Loam' vs 'sandy loam'), extra whitespace, or using FAO texture
    names instead of USDA classes.
  remedy: 'Use one of the exact USDA texture class names in lowercase: sand, loamy sand, sandy loam, loam,
    silt loam, clay loam, clay. Pass via --texture argument exactly as listed. Check HWSD source data
    for the correct USDA mapping.'
- id: dt_kineros2_011
  symptom: Calibration converges to physically unrealistic parameter values (e.g., Ks near zero, alpha
    at upper bound) with poor objective function values; NSE remains below 0
  diagnosis: The calibration period is too short, includes the spinup year, or the observed discharge
    data does not overlap correctly with the forcing period. Using 1980 (the spinup year) in the calibration
    window contaminates the objective function with the initial condition transient.
  remedy: Ensure the calibration period starts after the spinup year (e.g., 1981-01-01 if spinup is 1980).
    Verify that forcing data, observed discharge, and the specified calibration window all overlap. Use
    at least 3-5 years of data for calibration.
- id: dt_kineros2_012
  symptom: Model produces constant baseflow with no response to rainfall events; the hydrograph is a flat
    line regardless of precipitation variability
  diagnosis: The slow reservoir fraction (f_slow) is set too close to 1.0, routing nearly all runoff through
    the slow baseflow reservoir. Combined with a very small k_slow recession rate, this damps out all
    event-scale response.
  remedy: Verify f_slow is within [0.1, 0.7] and k_slow is within [0.001, 0.05] 1/d. For event-responsive
    basins, f_slow should be below 0.5. If calibrating, ensure the parameter bounds in the differential
    evolution setup are correctly specified.
- id: dt_kineros2_013
  symptom: Applying KINEROS2 to a large basin (>1000 km2) produces unrealistic timing of peaks; peak flows
    arrive too early or too late compared to observations
  diagnosis: The real KINEROS2 is an EVENT model for small watersheds (hectares to a few km2; WG11 = 6.3
    km2 contributing) solved on a cascade of planes and channels at minute steps. Daily runs on large
    basins (e.g. the Huai River at Bengbu, 121330 km2) were made only with the Python SURROGATE; they
    are not a va
  remedy: Do not apply KINEROS2 to large basins or daily forcing. For a small watershed build an element
    cascade (AGWA or by hand) and run single storms with tools/run_kineros2_engine.py. Never cite surrogate
    Bengbu metrics as KINEROS2 skill.
- id: dt_kineros2_014
  symptom: Green-Ampt infiltration produces abrupt, unrealistic transitions between full absorption and
    full runoff; no gradual wetting-up behavior
  diagnosis: The saturated hydraulic conductivity (Ks) is very small while the wetting front suction (psi_f)
    is very large. When soil moisture deficit (theta_def) drops below 0.01, infiltration capacity collapses
    abruptly from a high suction-driven rate to just Ks. This threshold behavior is physically correct
    b
  remedy: Verify that the Ks and psi_f combination is physically consistent for the soil texture class
    (e.g., clay has low Ks around 7.2 mm/d and high psi_f around 316 mm, but these should not be mixed
    with values from a different texture). Check the soil texture lookup table in Section 8 of SKILL.md
    for cons
- id: dt_kineros2_015
  symptom: Routing exponent (alpha) calibrates to values outside [1.0, 2.0]; hydrograph shape is either
    too peaked or too diffuse compared to observations
  diagnosis: The kinematic wave exponent alpha should theoretically be 5/3 (1.667) for Manning's equation.
    Values outside the [1.0, 2.0] range in calibration indicate overfitting, compensating for structural
    model errors (such as the lumped approximation on a large basin), or that other parameters (Ks, Smax)
    are
  remedy: Constrain alpha to [1.0, 2.0] in the calibration bounds. If alpha consistently hits a bound,
    investigate whether the runoff generation parameters (Ks, psi_f, Smax) are physically reasonable first.
    Fix unit errors in those parameters before recalibrating.
- id: dt_kineros2_016
  symptom: Field capacity fraction (fc) calibrates to values near 0.0 or 1.0; soil moisture dynamics are
    unrealistic with either no retention or permanent saturation
  diagnosis: Field capacity as a fraction of Smax should be between 0.2 and 0.8. Values near 0 mean the
    soil retains almost no water after drainage (all water drains to reservoirs), while values near 1
    mean the soil is always near capacity and rarely generates gravity drainage.
  remedy: Constrain fc to [0.2, 0.8] in calibration. If fc hits a bound, check that Smax is physically
    reasonable (100-800 mm). An Smax that is too large or too small forces fc to compensate, pushing it
    to extreme values.
- id: dt_kineros2_017
  symptom: Simulated discharge exhibits high-frequency oscillations or ringing on the rising limb of the
    hydrograph; daily values alternate between high and low
  diagnosis: The daily timestep is too coarse relative to the kinematic wave celerity for the watershed
    size. The lumped dual-reservoir model with a nonlinear exponent (alpha > 1) can produce oscillatory
    behavior when the fast reservoir storage changes rapidly between timesteps.
  remedy: Reduce k_fast to smooth the fast reservoir response (try values in the lower half of the [0.01,
    0.5] range). If oscillation persists, check that alpha is not too large (keep below 1.8). For the
    Fortran event-based model, reduce the computational timestep to satisfy the Courant condition.
- id: dt_kineros2_018
  symptom: Real-engine run gives a ragged or clearly wrong hydrograph on steep/short elements, or the
    output 'Time step distribution (100,75,50%)' line shows steps far smaller than the dt you asked for
  diagnosis: The kinematic-wave finite-difference solution needs a step that satisfies the Courant condition.
    With the Courant flag N the engine keeps the user step and only REPORTS which step would have been
    accurate (100/75/50 % levels); it does not shorten it. There is no DTEFAC parameter in K2shell.
  remedy: 'Run with the Courant flag Y (run_kineros2_engine.py --courant): the engine then shortens the
    compute step itself and still reports at dt. Otherwise choose dt <= the 100% level printed in the
    event summary. Check the element CLEN warnings too (dt_kineros2_037).'
- id: dt_kineros2_019
  symptom: Negative discharge values appear in the output time series, which is physically impossible
    for a rainfall-runoff model
  diagnosis: Numerical instability in the nonlinear reservoir routing when storage approaches zero. The
    fast reservoir equation Q = k_fast * S^alpha can produce floating-point artifacts when S is very small
    and alpha is non-integer, especially if S becomes slightly negative due to numerical precision.
  remedy: 'Add a floor of zero to both reservoir storage and discharge computations: S = max(S, 0) and
    Q = max(Q, 0). In the Python reimplementation, verify that run_kineros2.py enforces non-negativity
    at each timestep. In the Fortran code, check the routing subroutine for missing non-negativity guards.'
- id: dt_kineros2_020
  symptom: Building KINEROS2 from source fails (missing modules, rank mismatch in kinsed_wepp.for, duplicate
    symbols) or no k2 binary exists
  diagnosis: The ARS-SWRC/KINEROS2 GitHub repo has no makefile. Modules k2mods.for and kinsed.f90 must
    compile first; fmt10_new.for, pond_dcg.for, sedbf.for and inject.for.bak are duplicates/fragments
    and must be left out; gfortran rejects a rank mismatch at kinsed_wepp.for:155 that Intel Fortran accepts.
    Source
  remedy: Use KISSPATH_HOME/engine_builds_20261006/KINEROS2/build.sh <srcdir> <outdir> on the patched copy
    src_patched/ (CRLF stripped, reshape (/5,1/)->(/5/)); flags -O2 -fno-automatic -ffixed-line-length-none
    -ffree-line-length-none -std=legacy -fallow-argument-mismatch. Then python3 preflight_check.py. Neve
- id: dt_kineros2_021
  symptom: Output (or stdout) ends with 'error - K2shell' / "Can't open <file>" and the run has no event
    summary, while the exit status is 0
  diagnosis: 'A file named in kin.fil (parameter, rainfall, multiplier) does not exist relative to the
    run folder, or the name carries a leading space (a space after a comma in kin.fil), or a FILE= name
    was upper-cased by the reader. K2shell reads three files only (parameter, rainfall, multiplier) --
    there is no '
  remedy: 'Use tools/run_kineros2_engine.py: it copies inputs under short names into the workspace and
    writes kin.fil without spaces. For PRINT=3/INJECT files make the on-disk name upper case. Check status
    in run_result.json, never the exit code (dt_kineros2_027).'
- id: dt_kineros2_022
  symptom: 'Python reimplementation crashes with ''ModuleNotFoundError: No module named scipy'' or similar
    import error during calibration'
  diagnosis: The KINEROS2 Python analytic reimplementation requires numpy, pandas, xarray, geopandas,
    scipy, and shapely. The calibration mode specifically requires scipy.optimize.differential_evolution,
    which is not available if scipy is not installed.
  remedy: 'Install all required dependencies: pip install numpy pandas xarray geopandas scipy matplotlib
    shapely. Verify installation with: python -c ''from scipy.optimize import differential_evolution;
    print("OK")''.'
- id: dt_kineros2_023
  symptom: Basin-average precipitation is zero or NaN despite valid CMFD data existing for the region;
    forcing conversion produces an empty time series
  diagnosis: The basin shapefile does not overlap with the CMFD grid, or the shapefile CRS does not match
    the CMFD coordinate system (EPSG:4326). A CRS mismatch shifts the basin mask to a wrong location,
    causing the spatial average to fall outside the data domain.
  remedy: 'Verify the basin shapefile CRS is EPSG:4326 (WGS84 geographic). Reproject if necessary using
    geopandas: gdf = gdf.to_crs(''EPSG:4326''). Visually confirm overlap by plotting the shapefile extent
    against the CMFD grid coordinates.'
- id: dt_kineros2_024
  symptom: Real-engine outlet outflow is far below rainfall minus infiltration, or some planes' runoff
    never shows up at the outlet
  diagnosis: 'KINEROS2 has no RECEIVER tag. Topology is declared by the RECEIVING element: a CHANNEL lists
    UPSTREAM (<=10) and LATERAL (<=2 planes) ids, a PLANE may list one UPSTREAM plane. An element no later
    block references is computed but its water never reaches the outlet; the event summary Outflow is
    the LA'
  remedy: 'Run tools/edit_kineros2_par.py validate case.par: it lists every element not referenced downstream
    and every reference to an undefined or later element. Add the missing id to the receiving element''s
    UPSTREAM/LATERAL list.'
- id: dt_kineros2_025
  symptom: First year of simulation produces wildly inaccurate discharge regardless of parameter values;
    subsequent years match observations much better
  diagnosis: The initial soil moisture is set to zero (dry) or to Smax (saturated), creating an unrealistic
    starting condition. The model requires a spinup period (at least one year) for soil moisture to equilibrate
    from the arbitrary initial state.
  remedy: Always include a spinup year before the analysis period. For example, use 1980 as spinup when
    calibrating on 1981-1985. Exclude the spinup year from objective function calculations. The initial
    soil moisture fraction can be set to 0.5 * Smax as a reasonable warm start.
- id: dt_kineros2_026
  symptom: Engine stops with 'error - element <id> / initial soil saturation (SA) not specified' (exit
    status 0), or simulated runoff ignores the SA values you set
  diagnosis: 'KINEROS2 never defaults SA: a pervious element with G > 0 and no saturation stops the run.
    The value comes, in order of precedence, from the GLOBAL SAT (all elements), from the rain gages''
    SAT (interpolated to the element; then the element''s own SA is IGNORED), or from the element''s SA.
    Event mode c'
  remedy: 'Give every pervious element an initial relative saturation, from antecedent rain or soil moisture
    data (WG11 4 Aug 1980 gages: 0.09-0.13). Decide where it lives: gage SAT for gage-driven antecedent
    patterns, element SA otherwise -- not both (dt_kineros2_030).'
- id: dt_kineros2_027
  symptom: A KINEROS2 run 'succeeds' (exit status 0) but there is no event summary, or downstream tools
    read an old/empty output
  diagnosis: 'errxit() in K2shell.f90 writes '' error - <id>'' and ''<message>'' then executes stop ''
    ''; other aborts are stop '' error - ...'' (sed00, rain.for, infilt). gfortran returns status 0 for
    all of them. Verified: missing SA, missing file, space in kin.fil, missing particle density, decreasing
    rain depth -> a'
  remedy: 'Judge success from the output text: ''Event Volume Summary'' present and no ''error -'', ''STOP
    error'', ''zero multiplier'', ''neg stor values'' or Fortran runtime message (tools/_k2lib.engine_failures).
    Use tools/run_kineros2_engine.py, which returns 3 on such failures.'
  severity: silent
- id: dt_kineros2_028
  symptom: Output says "error - K2shell / Can't open  EX1.PRE" (note two spaces) although the file exists
  diagnosis: 'K2shell splits each kin.fil line on commas without trimming, so '' EX1.PRE'' (leading blank)
    is the file name. Fields are character(len=150): longer paths are cut.'
  remedy: Write kin.fil as par,pre,out,"title",tfin,dt,Y|N,Y|N,mult|N,Y with no blanks; copy inputs to
    short names in the run folder (run_kineros2_engine.py does both).
  severity: fatal
- id: dt_kineros2_029
  symptom: No hydrograph table for an element whose block says 'PR = 2' or 'Plot = H' (official EX1.PAR
    has both); only event totals are printed
  diagnosis: K2shell asks for the print level with geti4('PRI', ...). A token must START with the requested
    letters, so 'PR' does not match 'PRI'; 'Plot' is not read at all. The manual's shortest abbreviation
    tables are not what the code does.
  remedy: 'Write PRINT = 2 (or 3 with FILE=) on the outlet: tools/edit_kineros2_par.py set case.par --out
    new.par --set <outlet_id>:PRINT=2. Check with edit_kineros2_par.py list (column PRI).'
  severity: silent
- id: dt_kineros2_030
  symptom: Changing an element's SA (or applying the init_sat multiplier logic you expect) has no effect
    on runoff
  diagnosis: rain.for interp() sets sat from the gages for every PLANE/CHANNEL/URBAN element whenever
    the gages carry SAT (any tag starting with S in the gage block); the element's SA is read only when
    the gages have none. A GLOBAL SAT overrides both.
  remedy: Keep antecedent saturation in ONE place. To use element SA, drop SAT from the gage blocks (build_kineros2_rainfall.py
    without --sat/--template SAT); to vary by gage, edit the gage SAT.
  severity: silent
- id: dt_kineros2_031
  symptom: Engine stops with 'volume entry (V) missing or invalid', 'depth/intensity value missing or
    invalid' or another 'missing or invalid' message for a value that is plainly there
  diagnosis: 'reader.for treats only 0-9 A-Z . - / : \ _ as token characters. ''+'' is a separator, so
    1.6e+06 becomes the tokens ''1.6E'' and ''06''; the first does not parse and every later column shifts.'
  remedy: Write plain decimals (1600000) or an exponent without '+' (1.6E6). The KI tools write numbers
    with _k2lib.fmt_num and edit_kineros2_par.py refuses values containing '+'. validate flags split exponents.
  severity: fatal
- id: dt_kineros2_032
  symptom: Runoff is near zero (or absurdly large) although the storm was large (or small); infiltration
    takes almost all rain
  diagnosis: 'The rainfall file has no unit tag: depths are read in the PARAMETER file''s UNITS (mm for
    METRIC, inches for ENGLISH) and divided by conv (1000 or 12). An inch file under METRIC is 25.4x too
    little rain; mm under ENGLISH is 25.4x too much.'
  remedy: Build the .pre with build_kineros2_rainfall.py --units equal to the parameter file's UNITS (it
    refuses a DAP export in the other unit) and check event_summary.rainfall against the gage totals.
  severity: silent
- id: dt_kineros2_033
  symptom: Event volume or depth error against a WGEW flume is large and opposite to the peak error; mm/hr
    peaks look inconsistent with cfs peaks
  diagnosis: 'WGEW DAP mm and inches are per the flume''s NOMINAL drainage area (flume 11: 2035 ac). The
    ARS WG11 model covers 1551 ac because the eastern part sits behind two stock ponds and seldom contributes
    (ARS KINEROS2 home page). The engine''s depths are over its own area.'
  remedy: 'Compare in absolute units: fetch runoff with --units cf and score m3/s and m3 (score_kineros2_event.py
    refuses a non-cfs DAP export). State both areas in any report.'
  severity: silent
- id: dt_kineros2_034
  symptom: PRINT=3 writes CHAN2.CSV instead of chan2.csv; an INJECT element stops with 'input file not
    found' although inflow.dat exists
  diagnosis: reader.for upper-cases every line before parsing, including FILE= values; Linux file names
    are case-sensitive.
  remedy: Name injection files in upper case (add_kineros2_element.py does) and look for upper-case PRINT=3
    outputs (run_kineros2_engine.py copies every *.CSV it finds).
  severity: fatal
- id: dt_kineros2_035
  symptom: A channel ignores some UPSTREAM/LATERAL ids or a 2nd FRACT value; elements disappear from the
    topology without an error
  diagnosis: The manual says list values may continue over lines, but reader.for stops a list at the end
    of its line (the line marker ends the value search).
  remedy: Keep every list on one line (<= 200 columns, dt_kineros2_045). edit_kineros2_par.py list / get
    show exactly what the engine reads.
  severity: silent
- id: dt_kineros2_036
  symptom: With rain from NASA POWER / CMFD / MSWX the model gives little or no runoff for storms that
    produced floods
  diagnosis: 'KINEROS2 runoff is infiltration-excess: it depends on minute-scale intensity exceeding infiltration
    capacity. A 0.1-0.5 degree hourly or 3-hourly product averages a convective cell over a large cell
    and many minutes (NASA POWER at Walnut Gulch, 2006: wettest hour 1.87 mm, while WGEW gages record
    ten'
  remedy: Use recording-gage breakpoints whenever they exist (fetch_wgew_dap.py precip). Gridded rain
    (build_kineros2_rainfall.py --from-gridded) is a last resort and its runs must be labelled as such.
  severity: degraded
- id: dt_kineros2_037
  symptom: Output warns 'based on length and parameter CLEN, the numerical increment of N m is too large
    for realistic numerical solution'
  diagnosis: The engine sets the number of spatial nodes from CLEN; long elements relative to CLEN get
    coarse spatial steps. Both official ARS samples print this warning (EX1 channel 34 m; WG11 planes
    169-309 ft, channels 469-504 ft) and the official Windows exe prints the same.
  remedy: Not a failure. If accuracy matters, raise CLEN-related resolution by splitting long elements
    or setting CLEN to the longest single element as the manual defines; compare peaks before/after.
  severity: warning
- id: dt_kineros2_038
  symptom: Output says 'Channel Elem. N rating exceeded at time T' for channels that clearly did not overtop
  diagnosis: channel_tab.for reads the bank DEPTH only when rain on channels (global CHR = Y) is on; otherwise
    depth stays 0 (default) and any flow sets iexceed. Both official samples print it.
  remedy: Ignore unless CHR = Y with a real DEPTH, or a rating table (tabdat) is used -- then it means
    flow above the table/bank depth and the geometry should be extended.
  severity: warning
- id: dt_kineros2_039
  symptom: Engine stops with 'rain gage <id> decreasing depth value' or 'time not increasing' (exit 0)
  diagnosis: rain.for requires strictly increasing TIME and non-decreasing cumulative DEPTH per gage.
    Hand edits, merged events or intensity values typed under a DEPTH header trigger it.
  remedy: Rebuild with build_kineros2_rainfall.py (it re-reads and checks the file) and one storm per
    file; use an INTENSITY column if you have rates.
  severity: fatal
- id: dt_kineros2_040
  symptom: '''error - element <id> initial soil saturation (SA) not specified'''
  diagnosis: infilt_test.for requires SA for every element with KS > 0 and G > 0 unless the gages or the
    GLOBAL block give SAT.
  remedy: Add SA to the element (edit_kineros2_par.py set --set PLANE:SAT=0.2) or SAT to the gages / GLOBAL
    block.
  severity: fatal
- id: dt_kineros2_041
  symptom: 'With sediment on: ''missing particle density'', ''particle classes not defined'', ''particle
    size fractions do not add to 1'', or absurd sediment yields under ENGLISH units'
  diagnosis: sed00 reads up to 5 DIAMS with one DENSITY each; FRACT per element must sum to 1 +/- 0.05
    in DIAMS order. DIAMS are inches and TEMP deg F when UNITS = ENGLISH (conv = 12), so mm values under
    ENGLISH are 25.4x too coarse.
  remedy: configure_kineros2_sediment.py --check case.par before every sediment run; set classes in the
    parameter file's unit system.
  severity: fatal
- id: dt_kineros2_042
  symptom: Outlet volume is smaller than the sum of element outflows; the volume balance error is fine
  diagnosis: Each element's outflow is stored under its id and read only by elements that name it. The
    event Outflow is the last element's outflow.
  remedy: validate lists elements that no later element references; wire them into a channel's UPSTREAM/LATERAL.
  severity: silent
- id: dt_kineros2_043
  symptom: Sediment results change drastically after adding a 'KE' (effective Ks) or 'KR' tag; RHEM/DWEPP
    parameter errors appear
  diagnosis: kinsed.f90 sed0 picks RHEM if the element has a tag starting with KE, DWEPP if it has KR,
    else Smith. infilt also reads KE before KS as the conductivity.
  remedy: Use KS for conductivity in Smith runs; add KE/KR only when you mean RHEM/DWEPP and supply their
    tags. configure_kineros2_sediment.py --check prints the method per element.
  severity: silent
- id: dt_kineros2_044
  symptom: '''error - Channel Elem. / lateral inflow not found'' (or upstream inflow not found), exit
    0'
  diagnosis: Blocks are processed top to bottom; an UPSTREAM/LATERAL id must belong to a block ABOVE (verified
    by changing EX1's LAT = 1 to LAT = 7).
  remedy: Reorder blocks so every element comes after the elements it receives; validate reports the offending
    reference.
  severity: fatal
- id: dt_kineros2_045
  symptom: Tags or values at the end of a long line are not read (missing tag errors or wrong defaults)
  diagnosis: reader.for reads each line into a 210-character buffer and scans columns 1-200 only.
  remedy: Keep lines short; split lists across tags rather than lines (lists cannot continue, dt_kineros2_035).
    validate warns on long lines.
  severity: silent
- id: dt_kineros2_046
  symptom: KINEROS2 'results' are daily discharge series for a large basin, or quote NSE 0.851 / KGE 0.882
    (Huaihe, Bengbu)
  diagnosis: tools/run_kineros2.py is a Python lumped daily stand-in (Green-Ampt + two reservoirs, Hamon
    PET) written before the real engine existed on this server. The models DB still carries its metrics.
  remedy: Use tools/run_kineros2_engine.py for every KINEROS2 result; check run_result.json 'engine' and
    'binary.sha256' (d3efaef0...). Surrogate JSON carries model_identity = PYTHON SURROGATE.
  severity: silent
- id: dt_kineros2_047
  symptom: 'validate_water_balance prints ''UNIT ERROR: Annual P = 28105 mm/yr exceeds physical maximum''
    for a correct event'
  diagnosis: ki_tools_common.validation.validate_water_balance scales the inputs to a year using period_days;
    a 77 mm storm with period_days=1 becomes 28105 mm/yr.
  remedy: For events use only residual_pct (run_kineros2_engine.py records it with a note) and the engine's
    own '< 1 percent' line.
  severity: warning
- id: dt_kineros2_048
  symptom: 'Peak discharge differs slightly between the hydrograph CSV and the ''Peak flow ='' line (WG11:
    665.28 vs 668.40 cfs; 66.0 vs 64.7 min)'
  diagnosis: The 'Peak flow' line is tracked on the compute steps (Courant-shortened); the table is sampled
    at the user dt.
  remedy: Report peaks from the 'Peak flow' line (run_result.json outlet.peak_discharge); compute NSE/volume
    from the table at dt.
  severity: warning
- id: dt_kineros2_049
  symptom: Simulated rise is consistently early or late by a fixed number of minutes; NSE poor while peak
    and volume are fine
  diagnosis: 'The .pre clock origin is arbitrary (4Aug80.pre: 12:35); WGEW flume times are local clock
    (13:27). Forgetting the 52-min offset shifts the whole curve.'
  remedy: Pass --obs-offset-min = (flume start - rain clock origin) to score_kineros2_event.py; check
    that the rising limbs start together.
  severity: silent
- id: dt_kineros2_050
  symptom: '"Can''t open" with a truncated path'
  diagnosis: kin.fil fields are character(len=150) and the line buffer is 1000 characters.
  remedy: Run in a workspace with inputs copied under short names (run_kineros2_engine.py).
  severity: fatal
- id: dt_kineros2_051
  symptom: Peaks are damped and element hydrographs look stepped; the summary line 'Time step distribution
    (100,75,50%)' shows values much smaller than dt
  diagnosis: With Courant N the engine computes at the user dt and only reports the step that would satisfy
    the criterion; with Y it adapts and warns if element volumes differ > 1% from the dt-sampled ones.
  remedy: Use --courant, or dt <= the 100% level. Keep dt 1-3 min for small catchments.
  severity: degraded
- id: dt_kineros2_052
  symptom: Run stops with 'zero multiplier'
  diagnosis: infilt reads the G multiplier and stops if it is <= 0.
  remedy: Keep every multiplier > 0; the tools reject 0 for G before running.
  severity: fatal
- id: dt_kineros2_053
  symptom: Runoff from a run parameterised from HWSD/Table 1 is much larger than observed at Walnut Gulch
  diagnosis: Rawls (1982) class Ks for HWSD's sandy clay loam at 31.72N 110.06W is 0.43 cm/hr -> 0.135
    in/hr after the 20 % gravel factor; the ARS WG11 file uses 0.40-0.52 in/hr (and then a 0.5 multiplier)
    -- the class value is a starting point, not a site value.
  remedy: Calibrate the Ks multiplier on an observed event (calibrate_kineros2_multipliers.py) or use
    field-derived values; report which.
  severity: degraded
