safety:
  hazards:
    - id: "permeability_unit_m_per_hr"
      kind: "soil_semantic"
      description: "Permeability K must be m/hr; m/day (MODFLOW) is 24x too high, m/s (SI) is 3600x too low."
      severity: "silent"
    - id: "vg_alpha_unit_per_m"
      kind: "soil_semantic"
      description: "van Genuchten alpha must be 1/m; 1/cm (Rosetta/Carsel-Parrish databases) makes the soil 100x too retentive."
      severity: "silent"
    - id: "vic_ksat_misuse"
      kind: "soil_semantic"
      description: "VIC Ksat includes macropore/calibration effects (100-500x physical matrix Ksat); using it directly blocks infiltration-excess runoff. Cosby pedotransfer from VIC's Brooks-Corey exponent (=2b+3) further mislabels clay as sand."
      severity: "silent"
    - id: "pressure_head_unit_m_water"
      kind: "soil_semantic"
      description: "Pressure head is meters of water (typical -100 to +50 m); Pa (divide 9810) or kPa (divide 9.81) makes the field nonsensical."
      severity: "silent"
    - id: "precip_unit_mm_per_s"
      kind: "weather_file_semantic"
      description: "CLM precipitation must be mm/s; mm/hr (CMFD) is 3600x, mm/3hr (MSWX) is 10800x too much rain, flooding instantly."
      severity: "silent"
    - id: "clm_temperature_kelvin"
      kind: "weather_file_semantic"
      description: "CLM temperature must be Kelvin; Celsius (25 read as 25 K = -248 C) breaks the thermal regime."
      severity: "silent"
    - id: "clm_pressure_pa"
      kind: "weather_file_semantic"
      description: "CLM surface pressure must be Pa; hPa (100x) or kPa (1000x) too low corrupts humidity/ET."
      severity: "silent"
    - id: "clm_radiation_w_per_m2"
      kind: "weather_file_semantic"
      description: "CLM radiation must be W/m2; kJ/m2/day (86.4x) or MJ/m2/day (86400x) gives systematic temperature/ET bias."
      severity: "silent"
    - id: "clm_forcing_file_numbering"
      kind: "weather_file_semantic"
      description: "CLM forcing files must be named/numbered sequentially (NLDAS.<run>.NNNNNN.pfb from IstepStart, no gaps); a mismatch makes CLM read the wrong timestep."
      severity: "fatal"
    - id: "veg_map_all_barren"
      kind: "control_semantic"
      description: "Vegetation map of all IGBP type 16 (barren) or 17 (water) yields zero CLM ET/transpiration; soil stays saturated."
      severity: "silent"
    - id: "slope_sign_inverted"
      kind: "soil_semantic"
      description: "Inverted slope sign convention (ParFlow expects positive slope in positive coordinate direction) makes overland flow run uphill."
      severity: "silent"
    - id: "zero_or_subthreshold_slopes"
      kind: "soil_semantic"
      description: "All-zero or sub-threshold slopes (coarse/flat DEMs, resampling smoothing) give zero overland velocity; water ponds with no drainage. Set min slope ~0.0001."
      severity: "degraded"
    - id: "unfilled_dem_sinks"
      kind: "numerical_instability"
      description: "Unfilled DEM sinks create extreme pressure gradients that diverge the nonlinear solver (negative saturation / NaN crash). Fill sinks before computing slopes."
      severity: "fatal"
    - id: "crs_degrees_vs_meters"
      kind: "control_semantic"
      description: "Grid origin in degrees while the model expects UTM meters offsets the whole domain from the basin (verify origin_x/y > 100000 for UTM)."
      severity: "fatal"
    - id: "tfg_dz_absolute_not_fraction"
      kind: "control_semantic"
      description: "With TerrainFollowingGrid=True, dz values must be FRACTIONS of total depth summing to 1.0; absolute thicknesses give zero/negative cell volume and crash."
      severity: "fatal"
    - id: "variable_dz_box_geometry_single_layer"
      kind: "control_semantic"
      description: "Box geometry combined with dzScale nzList activates a mask only in the bottom layer; ParFlow silently solves a single layer (upper layers carry fill values). Use uniform DZ with Box geometry or an indicator-file geometry for variable dz."
      severity: "fatal"
    - id: "timestep_too_large_nonconvergence"
      kind: "numerical_instability"
      description: "Timestep too large for sharp wetting fronts or intense rain diverges the Newton solver (KINSOL MaxIter reached). Reduce TimeStep.Value (1.0->0.5->0.1 hr) or raise Nonlinear.MaxIter."
      severity: "fatal"
    - id: "ic_far_from_equilibrium"
      kind: "initial_condition_semantic"
      description: "Initial pressure far from equilibrium (e.g. uniform -5 m in complex terrain) causes >100 nonlinear iterations/timestep. Seed with hydrostatic IC, spinup, or a steady-state field."
      severity: "degraded"
    - id: "pfmg_extreme_k_contrast"
      kind: "numerical_instability"
      description: "K contrasts > ~6 orders of magnitude ill-condition the HYPRE PFMG preconditioner. Cap min K at 1e-5 m/hr or switch to MGSemi."
      severity: "fatal"
    - id: "mpi_topology_mismatch"
      kind: "control_semantic"
      description: "MPI process count must equal P*Q*R exactly, with NX/P, NY/Q, NZ/R all integers; ParFlow does not auto-redistribute."
      severity: "fatal"
    - id: "hydrostatic_bottom_refpatch_surface_offset"
      kind: "initial_condition_semantic"
      description: "HydroStaticPatch IC with a bottom RefPatch sets pressure at the BOTTOM; surface pressure = Value - total_depth, leaving the surface far drier than intended."
      severity: "silent"
    - id: "closed_box_no_outflow"
      kind: "control_semantic"
      description: "FluxConst=0 on all lateral boundaries (no DirEquilRefPatch/seepage face) makes the domain a closed box; all rain becomes storage, runoff ratio = 0."
      severity: "silent"
    - id: "solver_defaults_to_impes"
      kind: "control_semantic"
      description: "If the Solver key is omitted, ParFlow defaults to Impes (two-phase), NOT Richards; integrated surface-subsurface hydrology requires Solver=Richards."
      severity: "fatal_or_silent"
    - id: "missing_phasesources_keys"
      kind: "control_semantic"
      description: "PhaseSources.water.Type/GeomNames/Geom.Value (and KnownSolution) are mandatory; omission aborts the run before computation."
      severity: "fatal"
    - id: "overland_bc_type_selection"
      kind: "control_semantic"
      description: "The overland-flow scheme is enabled by setting the top-patch BC TYPE (Patch.top.BCPressure.Type = OverlandKinematic/OverlandDiffusive), not via a standalone Solver overland switch."
      severity: "fatal"
    - id: "wtd_from_pressure_zero_contour"
      kind: "parser_semantic"
      description: "Diagnosing water-table depth from the pressure=0 contour instead of the saturation>=0.99 threshold gives spurious depths inconsistent with saturation."
      severity: "silent"
    - id: "flux_aggregation_sum_not_mean"
      kind: "parser_semantic"
      description: "Aggregating hourly flux output (runoff, ET) to daily with SUM instead of MEAN gives 24x too much; state variables use instantaneous snapshots."
      severity: "silent"
    - id: "distributed_pfb_not_combined"
      kind: "parser_semantic"
      description: "Per-MPI-rank distributed PFB files must be combined (pfdist / read with dist=True) before reading; a partial file gives wrong dimensions."
      severity: "fatal"
    - id: "outlet_off_flow_path"
      kind: "parser_semantic"
      description: "An outlet/pour-point cell not on the slope-derived flow path reports zero discharge despite visible runoff elsewhere; pick the lowest active boundary cell where the slope points outward."
      severity: "degraded"
    - id: "double_counted_runoff_downstream"
      kind: "control_semantic"
      description: "Routing both ParFlow (internal overland flow) and VIC surface runoff for the same basin to a downstream router double-counts discharge (~2x)."
      severity: "silent"
  validation_limits:
    - "Overland-flow routing is physically valid only at hillslope scale (dx ~10-1000 m); basin-scale dx (~25 km) gives negligible Manning velocity and unrealistically long travel times. For basin-scale, couple with a routing model."
    - "Best applied to small-medium basins (< ~50,000 km2)."
    - "Daily/sub-hourly timestep cannot resolve processes finer than the chosen dt; sharp wetting fronts require dt <= 0.1-0.5 hr."
    - "Soil-column depth must match pedology: deep columns (>5 m) over-store rainfall and suppress saturation-excess runoff; alluvial/clay plains need ~2-3 m, mountain basins 5-10 m."
    - "With CLM disabled there is no ET/snow/canopy process; the model is pure infiltration/saturation-excess runoff."
    - "Phase.RelPerm.Type='Data' and Phase.Saturation.Type='Data' are documented as currently unsupported placeholders."
  warnings:
    - "Hortonian (infiltration-excess) overland flow is impossible when K exceeds rain intensity; a runoff-free result may simply reflect that regime, not an error."
    - "Fully uniform K, slope, forcing and IC yield a spatially invariant solution that masks routing behaviour; use spatially variable fields for realistic runs."
    - "Pressure/saturation outputs are per nominal layer; physical depths depend on dz_mult, so reading outputs without the dz multiplier misrepresents depth."
    - "van Genuchten m is not independent: m = 1 - 1/n drives BOTH the saturation and relative-permeability curves, so changing n alters retention and conductivity simultaneously."
    - "specific_storage (compressible storage) and density compressibility both add to the accumulation term and can be conflated in confined/compressible runs."
    - "The realized timestep can differ from TimeStep.Value: AdvanceRichards halves dt on non-convergence and BC/well time-cycle transitions force dt down."
  assumptions:
    - statement: "Surface and subsurface are solved as one coupled nonlinear system; overland flow is a free-surface boundary condition assembled into the Richards residual on the top face, not a separately time-lagged equation."
      scope: "Integrated surface-subsurface (Solver=Richards) configuration"
      source: "Kollet & Maxwell (2006) Adv. Water Resour. 29(7):945-958; ParFlow models.html section 4.5 (Overland Flow, eqs 4.9-4.16); nl_function_eval OverlandFlowEval assembly"
      status: "adopted"
    - statement: "Water-table depth is diagnosed from the saturation >= 0.99 surface, not the pressure=0 contour."
      scope: "Derived water_table_depth output"
      source: "ParFlow output diagnostics (saturation-threshold convention; dt_pf_041)"
      status: "adopted"
    - statement: "van Genuchten m is constrained by m = 1 - 1/n (Mualem); only alpha, n, s_res, s_sat are independent inputs."
      scope: "van Genuchten retention and relative-permeability constitutive curves"
      source: "ParFlow source problem_saturation.c and problem_phase_rel_perm.c"
      status: "adopted"
    - statement: "Mass-balance closure is on water (and, with CLM, the ET source term); the CLM energy balance supplies surface flux but is not a closed coupled subsurface energy budget."
      scope: "Whole-domain conservation"
      source: "ParFlow models.html section 4 (water-balance closure) and CLM coupling description"
      status: "adopted"
    - statement: "The HydroCraft-relevant configuration is the Richards (variably-saturated, integrated surface-subsurface) solver path; Impes (two-phase) and lattice-Boltzmann solvers are out of scope for this dag."
      scope: "Solver mode"
      source: "ParFlow start.html section 2.1 (ParFlow Solvers); solver.c dispatcher"
      status: "adopted"

