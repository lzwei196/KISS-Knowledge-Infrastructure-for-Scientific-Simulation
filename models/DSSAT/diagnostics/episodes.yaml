  # =========================================================================
  - id: "ep_008"
    timestamp: "2026-03-16T16:52:00"
    model: "DSSAT-CSM v4.8.5 Build 41"
    platform: "Linux x86_64"
    stage: "s8_batch_execution"

    context:
      goal: "Run DSSAT with fixed FileX"
      action: "Passed crop model name as CLI argument"
      command: "./dscsm048 MZCER048 B DSSBatch.v48"
      working_directory: "/tmp/dssat_runs/c0001"
      input_files: ["DSSBatch.v48"]
      preceding_steps: ["ep_006 and ep_007 resolved"]

    error:
      observed_output: "Invalid model specified. Crop: MZ; Model: MZCE048"
      error_pattern: "Invalid model specified.*Model:\\s*MZCE"
      exit_code: 99
      error_file: "WARNING.OUT"
      misleading: true  # it truncated MZCER048 to MZCE048 (7 chars instead of 8)

    debugging_trace:
      - step: "Noticed model name truncated from MZCER048 to MZCE048 (missing 'R')"
        result: "CLI argument parsing truncates the model name"
        useful: true
      - step: "Tried without model argument: ./dscsm048 B DSSBatch.v48"
        result: "Works — DSSAT picks model from DSSATPRO.L48 based on crop code in FileX"
