agent_hint: Read docs/macos_build_only.md and run the trusted named build helper from
  binaries/FATES. Supply genuine ESMF/PIO/MPICH/netCDF development libraries and Python
  3.11 through workspace fates-build-config.json native_runtime/build_python keys,
  or explicit --runtime/--python arguments. Preserve exact host and FATES gitlinks;
  do not use latest master or accept a setup script as the native product. The helper
  creates a FATES compset, builds support libraries including lnd, then actual native
  components and final cesm.exe. No scientific dataset download, case execution, or
  numerical source patches. Probe only in an empty directory with bounded runtime.
