# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: AquaCrop
  language: python
  implementation:
    id: aquacrop-ospy
    version: 3.0.12
    provenance: Python; AquaCrop-OSPy (Foster et al. 2017) wraps FAO AquaCrop 7.1 numerics in a pure-Python
      in-memory engine.
  scientific_reference_version: FAO AquaCrop 7.1 (Reference Manual lineage; Chapter 3 algorithmic spec)
inputs:
  forcing:
  - name: Daily minimum air temperature (MinTemp)
    unit: deg C
    category: atmospheric
    source_kind: forcing
    model_input_format: daily MinTemp at the simulated point
  - name: Daily maximum air temperature (MaxTemp)
    unit: deg C
    category: atmospheric
    source_kind: forcing
    model_input_format: daily MaxTemp at the simulated point
    notes: Engine requires MaxTemp >= MinTemp on every day.
  - name: Daily precipitation
    unit: mm/day
    category: atmospheric
    source_kind: forcing
    model_input_format: daily total precipitation at the simulated point
  - name: Reference evapotranspiration (ET0)
    unit: mm/day
    category: atmospheric
    source_kind: forcing
    model_input_format: daily ET0 at the simulated point
    notes: AquaCrop does NOT compute ET internally; ET0 must be pre-computed (FAO-56 Penman-Monteith preferred,
      Hargreaves-Samani if only T available). Values must be > 0.
  - name: Atmospheric CO2 concentration
    unit: ppm
    category: atmospheric
    source_kind: forcing
    model_input_format: annual CO2 value driving the WP* CO2-fertilization multiplier (Crop.fCO2)
  parameters:
  - name: Tbase (GDD base temperature)
    unit: deg C
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: Tupp (GDD upper threshold)
    unit: deg C
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: WP* (normalized water productivity)
    unit: g/m^2
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter; conservative across climates after CO2 + ET0 normalization
  - name: HI0 (reference harvest index)
    unit: fraction
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: CCx (maximum canopy cover)
    unit: fraction
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: CGC (canopy growth coefficient)
    unit: 1/day or 1/GDD
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: CDC (canopy decline coefficient)
    unit: 1/day or 1/GDD
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: Kc,Tr (basal crop transpiration coefficient at full canopy)
    unit: '-'
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: Stress-response thresholds (p_up1..p_up4 for canopy expansion, stomatal closure, senescence,
      harvest index)
    unit: '-'
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter set
  - name: Zr,max / Zr,min (maximum and minimum effective rooting depth)
    unit: m
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: Plant population density (PlantPop)
    unit: plants/ha
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: Pollination temperature thresholds (heat / cold)
    unit: deg C
    category: crop
    source_kind: calibrated
    model_input_format: crop parameter
  - name: Layer wilting-point water content (thWP)
    unit: m^3/m^3
    category: soil
    source_kind: dataset_lookup
    model_input_format: per-layer soil hydraulic parameter; thWP < thFC < thS required
  - name: Layer field-capacity water content (thFC)
    unit: m^3/m^3
    category: soil
    source_kind: dataset_lookup
    model_input_format: per-layer soil hydraulic parameter
  - name: Layer saturation water content (thS)
    unit: m^3/m^3
    category: soil
    source_kind: dataset_lookup
    model_input_format: per-layer soil hydraulic parameter
  - name: Saturated hydraulic conductivity (Ksat)
    unit: mm/day
    category: soil
    source_kind: dataset_lookup
    model_input_format: per-layer soil hydraulic parameter
  - name: SCS Curve Number (CN)
    unit: '-'
    category: soil
    source_kind: default
    model_input_format: soil-level runoff parameter (default 61 unless calc_cn enabled)
  - name: Readily Evaporable Water (REW)
    unit: mm
    category: soil
    source_kind: default
    model_input_format: soil-level Stage-I evaporation depth (default 9 mm)
  initial_conditions:
  - name: Initial soil water content per layer
    unit: m^3/m^3 or % TAW or proportion of FC/WP/SAT
    category: soil_state
    source_kind: user_provided
    model_input_format: per-layer initial soil water specified as proportion of FC/WP/SAT, absolute volumetric
      content, or % TAW; layer-wise or depth-wise indexing
    notes: If specified-layer count != soil.nLayer, all layers silently default to FC.
  - name: Initial canopy cover at germination (CCo)
    unit: fraction
    category: crop_state
    source_kind: calibrated
    model_input_format: derived from plant population and seedling canopy
  - name: Effective rooting depth at planting (Zn)
    unit: m
    category: crop_state
    source_kind: calibrated
    model_input_format: crop parameter
  boundary_conditions:
  - name: Simulation start / end dates
    unit: date
    category: simulation_control
    source_kind: user_provided
    model_input_format: '''YYYY/MM/DD'' string (slash separators mandatory)'
  - name: Off-season flag
    unit: boolean
    category: simulation_control
    source_kind: user_provided
    model_input_format: off_season switch; True carries soil moisture across fallow periods, False skips
      them
  - name: Planting date
    unit: MM/DD
    category: management
    source_kind: user_provided
    model_input_format: Crop.planting_date
  - name: Irrigation method
    unit: enum {Rainfed, SMT, Interval, Schedule, Net, Constant}
    category: management
    source_kind: user_provided
    model_input_format: irrigation method enum (rainfed, SMT thresholds per growth stage, fixed interval
      days, predefined date+depth schedule, net irrigation %TAW target, or constant daily depth)
  - name: Irrigation system efficiency / wetted surface fraction
    unit: '% / %'
    category: management
    source_kind: user_provided
    model_input_format: application efficiency (AppEff) and wetted-surface fraction (WetSurf); defaults
      are 100% (optimistic for drip/sprinkler)
  - name: Field management options (mulches, bunds, curve-number adjustment, runoff inhibition)
    unit: mixed
    category: management
    source_kind: user_provided
    model_input_format: z_bund supplied in METERS (engine internally multiplies by 1000 to mm); mulches/bunds/sr_inhb/curve-number-adjustment
      flags
  - name: Groundwater table depth (optional)
    unit: m
    category: boundary_driver
    source_kind: user_provided
    model_input_format: time-varying water-table depth time series; sentinel -999 means no water table
outputs:
  primary:
  - name: DryYield
    unit: t/ha
    description: Final dry above-ground grain (or harvestable organ) yield per growing season.
    validation_rank: 1
    emitted_in: final_stats DataFrame (column 'Dry yield')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Field-trial yield assumes co-located weather, soil, and management; mismatch in any input invalidates
          the comparison.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Multi-year point yields carry a small technology trend even at one site; consider detrending
          if comparing decades.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/sub-national yield aggregates (e.g., FAOSTAT) are dominated by a technology trend a
          weather-only model cannot reproduce; raw NSE/r against the inter-annual series is scientifically
          inappropriate. Use detrended residuals or decadal-mean PBIAS.
        - AquaCrop-OSPy does not model N limitation, so aggregates from fertilizer-limited regions will
          be biased high unless WP* and CCx are calibrated down.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: FreshYield
    unit: t/ha
    description: Crop fresh-weight yield = DryYield / (YldWC/100); reflects harvest moisture content.
    validation_rank: 2
    emitted_in: final_stats DataFrame (column 'Fresh yield')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Comparable only when the obs reports fresh-weight at the same moisture basis as the model's
          YldWC parameter.
      detrending_options:
      - none
  - name: biomass
    unit: t/ha
    description: Cumulative above-ground dry biomass over the growing season.
    validation_rank: 3
    emitted_in: crop_growth DataFrame (daily; final value also in final_stats)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Destructive biomass samples are sparse; compare to interpolated obs only if intermediate values
          are documented.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
      detrending_options:
      - none
  - name: canopy_cover
    unit: fraction
    description: Daily green canopy cover from CGC expansion through CCx plateau and CDC decline.
    validation_rank: 5
    emitted_in: crop_growth DataFrame (column 'canopy_cover')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Remote-sensing fAPAR / NDVI proxies for CC require a sensor-to-CC mapping; raw NDVI is not directly
          comparable.
      - obs_shape: spatial_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Point model cannot match within-pixel spatial variability; compare to pixel-aggregated CC only.
      detrending_options:
      - none
  - name: Tr
    unit: mm/day
    description: Actual daily crop transpiration after water, aeration, temperature, and CO2 stress.
    validation_rank: 6
    emitted_in: water_flux DataFrame (column 'Tr')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Sap-flow and lysimeter Tr observations have non-trivial measurement uncertainty; magnitude-accuracy
          thresholds should reflect this.
      detrending_options:
      - none
  - name: Es
    unit: mm/day
    description: Actual daily soil evaporation from the FAO two-stage scheme.
    validation_rank: 7
    emitted_in: water_flux DataFrame (column 'Es')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Direct Es measurements are rare; ET-partitioning obs typically yield Es as a residual with high
          uncertainty.
      detrending_options:
      - none
  - name: ET_actual
    unit: mm/day
    description: Actual evapotranspiration = Es + Tr (derived sum of soil evaporation and crop transpiration).
    validation_rank: 4
    emitted_in: water_flux DataFrame (Es + Tr columns)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Eddy-covariance ET often has energy-balance closure issues; flux footprint may not match the
          point model footprint.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Remote-sensing ET products (e.g., MOD16, GLEAM) carry algorithm-specific biases; treat as a
          soft constraint.
      detrending_options:
      - none
  - name: Wr
    unit: mm
    description: Total water in the root zone, integrated over current rooting depth.
    validation_rank: 8
    emitted_in: water_flux DataFrame (column 'Wr')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - In-situ root-zone soil moisture from sensor stacks must be vertically integrated over the same
          depth as model z_root.
      detrending_options:
      - none
  - name: th_per_compartment
    unit: m^3/m^3
    description: Volumetric water content per soil compartment (th1..thN) over the simulated profile.
    validation_rank: 9
    emitted_in: water_storage DataFrame (columns th1..thN)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Sensor depth must align with compartment midpoint; calibration of sensor-to-volumetric mapping
          is non-trivial.
      - obs_shape: spatial_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Satellite surface soil moisture (e.g., SMAP) corresponds only to the topmost compartment, not
          the integrated profile.
      detrending_options:
      - none
  - name: Runoff
    unit: mm/day
    description: Surface runoff partitioned by SCS curve-number method, modified by FieldMngt options.
    validation_rank: 10
    emitted_in: water_flux DataFrame (column 'Runoff')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - event_detection
        determining_metric: csi
        caveats:
        - Field plot runoff measurements are needed; basin-scale gauges integrate signals AquaCrop does
          not simulate.
      detrending_options:
      - none
  - name: DeepPerc
    unit: mm/day
    description: Deep percolation below the soil profile from tau-based drainage.
    validation_rank: 11
    emitted_in: water_flux DataFrame (column 'DeepPerc')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Lysimeter drainage is the most direct comparison; basin-scale groundwater recharge mixes contributions
          from outside the modeled point.
      detrending_options:
      - none
  - name: z_root
    unit: m
    description: Current effective crop rooting depth in the soil profile.
    validation_rank: 12
    emitted_in: crop_growth DataFrame (column 'z_root')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: pbias
        caveats:
        - Destructive root-depth measurements are sparse; compare to envelope traces, not daily values.
      detrending_options:
      - none
  - name: harvest_index
    unit: fraction
    description: Reference crop harvest index build-up over the yield-formation window (no stress).
    validation_rank: 13
    emitted_in: crop_growth DataFrame (column 'harvest_index')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
      detrending_options:
      - none
  - name: harvest_index_adj
    unit: fraction
    description: Stress-adjusted harvest index actually used for yield (pollination heat/cold, pre- and
      post-anthesis water stress).
    validation_rank: 14
    emitted_in: crop_growth DataFrame (column 'harvest_index_adj')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
      detrending_options:
      - none
  - name: gdd_cum
    unit: deg C-day
    description: Cumulative growing degree days from planting.
    validation_rank: 15
    emitted_in: crop_growth DataFrame (column 'gdd_cum')
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Derived from weather; comparison is meaningful only as a consistency check on Tbase/Tupp.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: 'ValueError raised when constructing AquaCropModel: ''Check if all the following columns exist
    (Date MinTemp MaxTemp Precipitation ReferenceET)'''
  diagnosis: 'Weather DataFrame is missing the ReferenceET column; Unlike DSSAT which computes evapotranspiration
    internally from radiation, wind, and humidity variables, AquaCrop requires pre-computed reference
    ET0 as an input. Most raw weather data sources (VIC forcing, CMFD, MSWX, station data) do not include '
  remedy: Compute ReferenceET using FAO Penman-Monteith from available met variables (Tmin, Tmax, solar
    radiation, wind, humidity, elevation, latitude); compute_eto_penman_monteith; ['Check source data
    for available variables (at minimum need Tmin, Tmax, solar radiation)', 'If only Tmin/Tmax available,
    use Ha
  severity: fatal
- id: dt_002
  symptom: Model runs successfully but phenological timing is wrong -- crop matures too early or too late
    compared to observations. Yield may be reasonable but growth stage durations do not match field data.
  diagnosis: 'GDD base temperature (Tbase) does not match the crop''s actual thermal requirements; Each
    crop has a specific base temperature below which development does not progress. Using the wrong Tbase
    causes GDD accumulation to be too fast or too slow, shifting all phenological events. For example,
    Wheat has '
  remedy: 'Check and correct Tbase for the target crop species; validate_crop_params; [''Look up Tbase
    for the crop: Maize=8, Wheat=0, Rice=8, Soybean=5, Barley=0, Cotton=12, Sunflower=6, Potato=2'', "Override
    if needed: Crop(''MaizeGDD'', planting_date=''05/01'', Tbase=8)", ''Compare simulated phenology dates
    with f'
  severity: silent
- id: dt_003
  symptom: 'AssertionError when creating custom soil: assertion fails with ''assert 1 == 2'' and message
    ''wrong soil type'''
  diagnosis: 'Soil hydraulic parameters violate thWP < thFC < thS ordering, or an invalid soil_type name
    was used; AquaCrop requires that wilting point (thWP) < field capacity (thFC) < saturation (thS) for
    all soil layers. This is a physical constraint: WP is the driest point roots can extract water, FC
    is the wa'
  remedy: 'Verify thWP < thFC < thS for all layers and check soil_type name spelling; validate_soil_hydraulics;
    ["Print soil profile: print(soil.profile[[''Layer'',''th_wp'',''th_fc'',''th_s'']])", ''For each layer
    verify: th_wp < th_fc < th_s'', ''If using custom soil, reorder values correctly'', "If using built-in
    type,'
  severity: fatal
- id: dt_004
  symptom: Model runs but yield is zero. Canopy cover never develops beyond zero. Crop fails to germinate.
  diagnosis: Initial soil water content is below the germination threshold; AquaCrop requires a minimum
    amount of water in the top soil for germination (controlled by crop.GermThr, default 0.2 = 20% of
    TAW). If initial water content is set below wilting point or at a very low percentage of TAW, the
    seed never ge
  remedy: 'Set initial water content to at least field capacity (FC) or 50% TAW; create_initial_water_content;
    [''Check crop_growth output: if canopy_cover is always 0, germination failed'', "Set IWC to FC: InitialWaterContent(wc_type=''Prop'',
    value=[''FC''])", "Or use minimum 50% TAW: InitialWaterContent(wc_type='''
  severity: silent
- id: dt_005
  symptom: Model runs but yield is very low or zero. GDD accumulation is extremely slow because temperatures
    are below Tbase during the planting period.
  diagnosis: Planting date is set to the wrong season for the target crop and hemisphere; Planting date
    is specified as MM/DD. For Northern Hemisphere summer crops (maize, soybean), planting should be April-June.
    For Southern Hemisphere, planting should be October-December. Winter crops (wheat) are planted in
    au
  remedy: 'Adjust planting date to the correct growing season for the target location and crop; ; [''Verify
    hemisphere: Northern (lat > 0) or Southern (lat < 0)'', ''Check crop season: summer crops (maize/soybean)
    need warm months, winter crops (wheat) planted in autumn'', ''Northern summer: plant 04/01 to 06/15'', '
  severity: silent
- id: dt_006
  symptom: KeyError when accessing output DataFrame columns that worked in a previous version. Column
    names differ between aquacrop versions.
  diagnosis: AquaCrop-OSPy output column names changed between package versions; Between major versions
    of aquacrop (e.g., v2.x to v3.x), output DataFrame column names may change. For example, column naming
    conventions, capitalization, or the set of output variables may differ. Code that hardcodes column
    names f
  remedy: 'Check current column names and update references; ; [''Print column names: print(model.get_simulation_results().columns.tolist())'',
    ''Update code to use current column names'', ''Pin aquacrop version in requirements.txt to avoid unexpected
    changes'']; Pin package version: pip install aquacrop==3.0.12. Us'
  severity: fatal
- id: dt_007
  symptom: 'ValueError: ''Error in weather_df format. Check if all the following columns exist (Date MinTemp
    MaxTemp Precipitation ReferenceET).'''
  diagnosis: 'Weather DataFrame column names do not exactly match the expected names (case-sensitive);
    AquaCrop checks for exact column name matches: ''Date'', ''MinTemp'', ''MaxTemp'', ''Precipitation'',
    ''ReferenceET''. Common mismatches include ''min_temp'' instead of ''MinTemp'', ''ET0'' instead of
    ''ReferenceET'', ''Precip'' in'
  remedy: 'Rename DataFrame columns to match exact expected names; validate_weather_df; [''Print current
    columns: print(weather_df.columns.tolist())'', "Rename to match: weather_df.rename(columns={''tmin'':
    ''MinTemp'', ''tmax'': ''MaxTemp'', ''precip'': ''Precipitation'', ''et0'': ''ReferenceET'', ''date'':
    ''Date''}, inplace=True'
  severity: fatal
- id: dt_008
  symptom: Model completes but yield is unexpectedly low or zero despite adequate irrigation. Canopy cover
    declines prematurely. Soil water storage shows persistent saturation.
  diagnosis: Prolonged soil saturation causes aeration stress, killing roots and reducing transpiration;
    AquaCrop simulates aeration stress when soil water content exceeds SAT - Aer (where Aer is typically
    5% by volume). If soil drainage is poor (low Ksat, clay soils) and irrigation or rainfall is excessive,
    the
  remedy: 'Reduce irrigation, improve drainage (increase Ksat), or remove bunds; ; [''Check water_storage
    output: look for soil compartments consistently at or above th_s'', ''Check water_flux: look for high
    surface_storage values'', ''If using bunds for non-paddy crop: remove bunds (FieldMngt(bunds=False))'',
    ''If s'
  severity: silent
- id: dt_009
  symptom: 'ValueError: ''sim_start_time format must be YYYY/MM/DD'' when constructing AquaCropModel'
  diagnosis: Simulation start or end date uses dashes instead of slashes; AquaCrop-OSPy requires date
    strings in 'YYYY/MM/DD' format with forward slashes. The ISO-8601 format 'YYYY-MM-DD' with dashes,
    which is the default for pandas and most Python datetime operations, is NOT accepted. The validation
    regex speci
  remedy: 'Replace dashes with slashes in date strings; ; ["Change ''2000-01-01'' to ''2000/01/01''",
    "If using datetime objects: dt.strftime(''%Y/%m/%d'')", "If using pandas Timestamp: ts.strftime(''%Y/%m/%d'')"];
    Always use format ''YYYY/MM/DD'' for AquaCrop dates. Create a helper function that converts any date
    to th'
  severity: fatal
- id: dt_010
  symptom: Multi-year simulation only produces results for one season. Soil moisture resets between seasons
    instead of carrying over.
  diagnosis: off_season parameter is set to False (default), skipping fallow periods between growing seasons;
    With off_season=False (the default), AquaCrop jumps from harvest directly to the next planting date.
    Soil moisture is not tracked during the fallow period. For multi-year simulations where inter-season
    s
  remedy: Set off_season=True for multi-year simulations; ; ['Add off_season=True to AquaCropModel constructor',
    'Ensure weather data covers the full period including fallow seasons', 'Re-run simulation']; For multi-year
    simulations, always set off_season=True unless deliberately testing single-season respons
  severity: degraded
- id: dt_011
