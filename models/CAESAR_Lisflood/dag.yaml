safety:
  hazards:
    - id: "rainfall_units_overscale_flood"
      kind: "weather_file_semantic"
      description: "Rainfall authored in mm/day or m/s but read as mm/hr (>=24x over) floods the whole catchment within the first timesteps."
      severity: "silent"
    - id: "rainfall_units_underscale_zero_q"
      kind: "weather_file_semantic"
      description: "Rainfall in m/hr or with rain_data_time_step not matching the file resolution yields near-zero discharge for the whole run."
      severity: "silent"
    - id: "dem_units_not_metres"
      kind: "soil_semantic"
      description: "DEM in cm/feet or with NODATA read as elevation gives elevations >10000 or negative and corrupts hydraulics."
      severity: "fatal_or_silent"
    - id: "topmodel_m_units_mm_not_m"
      kind: "coefficient_runtime_silent_fallback"
      description: "topmodel_m_value supplied in mm instead of metres distorts hydrograph shape; literature mm values must be divided by 1000."
      severity: "silent"
    - id: "outlet_q_summed_over_all_edges"
      kind: "control_semantic"
      description: "Reported outlet discharge is summed over ALL DEM edge cells, so a DEM with multiple low edge cells over-reports Q."
      severity: "silent"
    - id: "interior_sink_traps_water"
      kind: "soil_semantic"
      description: "Interior depressions or a NODATA-surrounded outlet trap water so it never reaches the edge; DEM must be pit-filled with a continuous non-NODATA path to a single edge outlet."
      severity: "silent"
    - id: "max_run_duration_off_by_one"
      kind: "control_semantic"
      description: "Loop condition cycle/60 < maxcycle truncates the run by one hour unless max_run_duration is set to T-1."
      severity: "degraded"
    - id: "courant_froude_checkerboard"
      kind: "numerical_instability"
      description: "Courant/Froude limits too high for a fine DEM produce a checkerboard wet/dry pattern; courant must be 0.3 for <2 m DEMs."
      severity: "degraded"
    - id: "timestep_nan_instability"
      kind: "numerical_instability"
      description: "Too-large timestep or extreme slope gradients produce NaN in outputs; reduce max_time_step (60/30 s) and courant_number."
      severity: "fatal_or_silent"
    - id: "active_layer_vs_erode_limit"
      kind: "control_semantic"
      description: "active_layer_thickness < 4x erode_limit causes numerical instability in the grain stratigraphy."
      severity: "degraded"
    - id: "hydro_only_zero_sediment"
      kind: "control_semantic"
      description: "hydro_model_only=yes (or too-high water_depth_erosion_threshold) yields all-zero sediment output despite erosion being expected."
      severity: "silent"
    - id: "mixed_units_timeseries"
      kind: "parser_semantic"
      description: "In catchment.dat, discharge is an instantaneous rate (m3/s) while sediment columns are interval totals (m3) — a documented mixed-units trap."
      severity: "silent"
    - id: "pow_integer_division_friction"
      kind: "numerical_instability"
      description: "Manning friction term uses std::pow(hflow, 10/3) where 10/3 evaluates to integer 3 (not 3.333) at LSDCatchmentModel.cpp lines 3115/3210 — a latent friction-slope error in the LISFLOOD routing."
      severity: "silent"
  validation_limits:
    - "Soil-erosion (USLE-type) module has not been calibrated or tested against field data."
    - "Lateral/bank-erosion module is experimental and untested in this implementation."
    - "Bedrock is a hard erosion floor only; no bedrock-incision physics."
    - "Groundwater (basic/SLiM) and vegetation modules are exposed via flags but minimally parameterised in this workflow."
    - "No surface energy balance / ET; evaporation path present but not exercised."
    - "Uniform square-cell grid only; grid cell size materially affects results (documented sensitivity)."
  warnings:
    - "Default grain-size diameters/proportions (Swale catchment) are used silently if no grain data file is supplied (read_in_graindata_from_file=no)."
    - "Suspended-sediment settling velocities and grain diameters are hardcoded in source (commented 'should be read from a file') and are not user-configurable."
    - "erode() multiplies the global hydrological timestep by 1.5 each call, so enabling erosion silently changes the flow timestep relative to a hydro-only run."
    - "flow_route tests the literal -9999 NODATA while the configured no_data_value is -9999.9; a mismatched NODATA can be handled inconsistently."
  assumptions:
    - statement: "The runnable implementation is the C++ OpenMP HAIL-CAESAR port, not the C# CAESAR-Lisflood 1.9 GUI build; the science (LISFLOOD-FP routing + CAESAR LEM + TOPMODEL) is shared but this dag describes the C++ binding."
      scope: "identity / implementation selection"
      source: "HAIL-CAESAR repo (github.com/dvalters/HAIL-CAESAR) and the C++ source at src/main.cpp, LSDCatchmentModel.cpp/.hpp"
      status: "adopted"
    - statement: "Geometry is a 2-D uniform square-cell grid; each cell is a cellular-automaton element carrying its own elevation, water depth, velocity, sediment and grain state."
      scope: "spatial discretisation"
      source: "CSDMS Model:CAESAR_Lisflood page and HAIL-CAESAR documentation"
      status: "adopted"
    - statement: "Mass-balance closure holds for water and sediment; there is no surface energy-balance closure and evaporation is effectively inactive in the documented workflow."
      scope: "conservation / closure"
      source: "SourceForge CAESAR-Lisflood parameter wiki and HAIL-CAESAR source (evaporate/k_evap path)"
      status: "adopted"
    - statement: "TOPMODEL m is interpreted in metres (HAIL-CAESAR convention), distinct from mm-based literature values."
      scope: "hydrology parameter units"
      source: "HAIL-CAESAR docs/03_parameter_configuration and LSDCatchmentModel default M=0.005"
      status: "adopted"
