# pyBadlands / Badlands landscape-evolution validation is not governed by a
# universal numeric pass/fail table in the fetched literature. The field compares
# modelled elevation, erosion/deposition, drainage structure, and stratigraphic
# architecture against independent topography, DoD/denudation/sediment-volume,
# well/seismic, and drainage-network evidence, usually through RMSE, objective
# functions, uncertainty envelopes, or qualitative spatial agreement. Therefore
# all headline pass bands are null and confidence is kept <= 0.4.

