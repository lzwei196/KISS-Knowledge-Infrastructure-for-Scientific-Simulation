  secondary_metrics: []
  validated_when: constituent NSE >= 0.35 (satisfactory) AND |PBIAS| <= 30% (Moriasi 2015 N/P water-quality
    tiers)
  evidence_strength: moderate
  confidence: 0.55
  notes: 'Moriasi 2015 recommended N/P criteria (monthly): "NSE > 0.65 [very good], 0.50 < NSE <= 0.65
