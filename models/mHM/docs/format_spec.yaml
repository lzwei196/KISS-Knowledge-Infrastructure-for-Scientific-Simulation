# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: mHM
  language: fortran
  implementation:
    id: mhm-v5131
    version: 5.13.1
    provenance: Fortran 2008; UFZ (Helmholtz Centre for Environmental Research) mHM, depends on the FORCES/CHS
      Fortran library and NetCDF-Fortran.
  scientific_reference_version: mHM (mesoscale Hydrologic Model) v5.13 lineage with Multiscale Parameter
    Regionalization (MPR); Samaniego, Kumar & Attinger 2010 WRR methodology
inputs:
  forcing:
  - name: precipitation
    unit: mm/day
    category: meteorology
    source_kind: forcing
    model_input_format: NetCDF (time, lat, lon), CF conventions, variable 'pre', DOUBLE, one file per
      year, daily (hourly supported)
    notes: Valid model range ~0-500 mm/day; mHM is sensitive to sub-daily-vs-daily aggregation errors
      (mm/3hr fed as daily underestimates ~8x).
  - name: mean air temperature
    unit: degC
    category: meteorology
    source_kind: forcing
    model_input_format: NetCDF variable 'tavg', daily/hourly, DOUBLE
    notes: Model expects Celsius (-60 to 60 degC); Kelvin forcing breaks snow thresholds, degree-day melt,
      and PET silently.
  - name: potential evapotranspiration
    unit: mm/day
    category: meteorology
    source_kind: forcing
    model_input_format: NetCDF variable 'pet', daily/hourly
    notes: Consumed directly when processCase(5)=0; otherwise PET is computed internally from tmin/tmax
      (Hargreaves-Samani), net radiation (Priestley-Taylor), or radiation+vapor pressure+wind (Penman-Monteith).
  - name: minimum/maximum air temperature
    unit: degC
    category: meteorology
    source_kind: forcing
    model_input_format: NetCDF, daily
    notes: Required when processCase(5)=1 (Hargreaves-Samani); if absent mHM silently substitutes tavg,
      biasing PET.
  - name: net radiation
    unit: W m-2
    category: meteorology
    source_kind: forcing
    model_input_format: NetCDF, daily
    notes: Used by radiation-based PET (Priestley-Taylor / Penman-Monteith).
  - name: absolute vapor pressure
    unit: Pa
    category: meteorology
    source_kind: forcing
    model_input_format: NetCDF, daily
    notes: Used by Penman-Monteith PET (processCase(5)=3).
  - name: wind speed
    unit: m s-1
    category: meteorology
    source_kind: forcing
    model_input_format: NetCDF, daily
    notes: Used by Penman-Monteith PET (processCase(5)=3).
  parameters:
  - name: MPR global transfer-function parameters (gammas)
    unit: various
    category: regionalization
    source_kind: calibrated
    model_input_format: 'mhm_parameter.nml (~50-70 global parameters; per parameter: lower, upper, value,
      FLAG, SCALING)'
    notes: Transfer-function coefficients mapping L0 physiographic properties (sand%, clay%, bulk density,
      slope, LAI, geology) to effective L1 parameters (Ksat, porosity, recession k0/k1/k2/kp, degree-day
      factors, root fractions). Encode process, not location; calibrate once, transfer to ungauged basins.
      Defaults calibrated on German (Mosel) basins.
  - name: soil texture / hydraulic lookup
    unit: CLAY %, SAND %, BD g cm-3, horizon depths UD/LD mm
    category: soil
    source_kind: dataset_lookup
    model_input_format: soil_class.asc (ESRI ASCII grid) + soil_classdefinition.txt (columns MU_GLOBAL
      HORIZON UD LD CLAY SAND BD; column order load-bearing)
    notes: Feeds pedotransfer functions for Ksat/porosity; wrong column order silently corrupts soil hydraulics
      everywhere.
  - name: geology class / baseflow recession lookup
    unit: dimensionless class + GeoParam recession
    category: geology
    source_kind: dataset_lookup
    model_input_format: geology_class.asc + geology_classdefinition.txt (GeoParam ClassUnit Karstic Description)
    notes: Karstic flag drives baseflow recession behaviour.
  - name: land cover / monthly LAI lookup
    unit: LAI m2 m-2
    category: vegetation
    source_kind: dataset_lookup
    model_input_format: lc_YYYY.asc + lai_classdefinition.txt (ID LAND-USE Jan..Dec); land cover reduced
      to forest / impervious(sealed) / pervious
    notes: Monthly LAI per class drives interception and PET correction.
  - name: DEM, slope, aspect, flow direction, flow accumulation
    unit: m / degrees / D8 code / count
    category: terrain
    source_kind: dataset_lookup
    model_input_format: ESRI ASCII grids (dem.asc, slope.asc, aspect.asc, fdir.asc, facc.asc); all grids
      share identical header; fdir uses ArcGIS D8 codes (1,2,4,8,16,32,64,128)
    notes: L0 physiographic predictors; DEM/slope/aspect feed MPR and PET-aspect correction, fdir/facc
      build the L11 routing network.
  initial_conditions:
  - name: initial soil moisture (cold start)
    unit: mm
    category: soil
    source_kind: default
    model_input_format: internal cold-start default (0.5 x field capacity per horizon) unless a restart
      file is supplied
    notes: Hardcoded warm-start assumption affecting early-period results when no restart state is provided.
  - name: initial interception/snow/unsaturated/saturated storages
    unit: mm
    category: storages
    source_kind: default
    model_input_format: internal cold-start magic constants (e.g. unsat/sat storage init) or NetCDF restart
      file
    notes: Cold-start initial state/flux constants are fixed in code, not exposed in the namelist.
  boundary_conditions:
  - name: coordinate system flag (iFlag_cordinate_sys)
    unit: 0=projected meters | 1=geographic degrees
    category: grid_configuration
    source_kind: user_provided
    model_input_format: mhm.nml
    notes: Must match the grid CRS; =0 on a lat/lon grid computes cell area as cellsize^2 m^2 and collapses
      routed discharge to ~zero.
  - name: L0/L1/L11 resolutions (resolution_Hydrology, resolution_Routing)
    unit: m or degrees
    category: grid_configuration
    source_kind: user_provided
    model_input_format: mhm.nml
    notes: L1 and L11 must be exact integer multiples of L0; resolution_Routing must match the actual
      L11 cellsize or routing peak timing shifts.
  - name: PET method (processCase(5))
    unit: 0=input | 1=Hargreaves-Samani | 2=Priestley-Taylor | 3=Penman-Monteith
    category: process_switch
    source_kind: user_provided
    model_input_format: mhm.nml
  - name: routing activation (processCase(8))
    unit: 0=off | 1=mRM Muskingum | 2=adaptive-timestep celerity
    category: process_switch
    source_kind: user_provided
    model_input_format: mhm.nml
  - name: neutron module (processCase(10))
    unit: 0=off | 1=Desilets N0 | 2=COSMIC
    category: process_switch
    source_kind: user_provided
    model_input_format: mhm.nml
    notes: Diagnostic cosmic-ray neutron output; the ground-albedo-neutrons output path is flagged work-in-progress
      by the developers.
  - name: warming/evaluation periods and time stepping
    unit: dates
    category: simulation_period
    source_kind: user_provided
    model_input_format: mhm.nml (warming_Days, eval_Per, timestep)
  - name: gauge location grid + observed discharge
    unit: m3 s-1
    category: evaluation
    source_kind: user_provided
    model_input_format: idgauges.asc (gauge ID at gauge cell) + per-gauge text file (YYYY MM DD Q); gauge
      ID must match evaluation_gauges in mhm.nml
    notes: Observed discharge drives objective-function evaluation; gauge must land on a valid in-domain
      L11 cell with upstream drainage.
outputs:
  primary:
  - name: mRM_runoff (routed discharge)
    unit: m3 s-1
    description: Routed streamflow discharge on the L11 routing network, extracted at gauge cells.
    validation_rank: 1
    emitted_in: mRM_Fluxes_States.nc (and daily_discharge.out at gauges)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Gauge must map to an L11 cell with correct upstream drainage; a mis-snapped gauge yields all-zero
          discharge despite a valid routed field.
        - Routing-resolution mismatch can shift peak timing by 1-3 days independent of water-balance skill.
      detrending_options:
      - none
  - name: aET (actual evapotranspiration)
    unit: mm/timestep
    description: Actual evapotranspiration summed over canopy, soil layers, and sealed-surface evaporation.
    validation_rank: 3
    emitted_in: mHM_Fluxes_States.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - PET-method/forcing mismatch (e.g. Hargreaves selected with only tavg) systematically biases
          aET.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Spatial AET pattern is dominated by PET-correction/aspect and vegetation parameters, not by
          discharge-only calibration.
      detrending_options:
      - none
  - name: SM (soil moisture)
    unit: mm or mm/mm (per layer / mean)
    description: Multi-horizon soil water content (volumetric or depth) per L1 cell.
    validation_rank: 4
    emitted_in: mHM_Fluxes_States.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: r
        caveats:
        - Absolute magnitude depends on soil-depth configuration; anomaly/index comparison is often more
          meaningful than absolute mm.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Satellite SM products sense a shallow surface layer; compare against the corresponding model
          horizon.
      detrending_options:
      - first_difference
      - linear_residual
  - name: total_runoff (Q)
    unit: mm/timestep
    description: Total water runoff depth (direct + fast interflow + slow interflow + baseflow) generated
      per L1 cell before routing.
    validation_rank: 2
    emitted_in: mHM_Fluxes_States.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Per-cell generated runoff is pre-routing; do not compare directly to gauge hydrographs.
      detrending_options:
      - none
  - name: baseflow (QB)
    unit: mm/timestep
    description: Saturated-zone groundwater baseflow generated per cell, governed by geology-class recession
      (GeoParam).
    validation_rank: 5
    emitted_in: mHM_Fluxes_States.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Best assessed via baseflow-index (BFI) separation of observed discharge; single-geology-class
          domains silently zero baseflow.
      detrending_options:
      - none
  - name: recharge
    unit: mm/timestep
    description: Groundwater recharge (deep percolation to the saturated zone) per cell.
    validation_rank: 6
    emitted_in: mHM_Fluxes_States.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Rarely directly observed; usually inferred and weakly constrained.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_b01
  symptom: CMake fails to find FORCES library during build
  diagnosis: CPM (CMake Package Manager) cannot download FORCES from git.ufz.de; mHM uses CPM to auto-download
    the FORCES library. If behind a firewall or the UFZ server is down, the download fails.; ['build_system']
  remedy: Clone FORCES manually and point CMake to it; ['git clone https://git.ufz.de/chs/forces.git /path/to/forces',
    'cmake -B build -DCPM_forces_SOURCE=/path/to/forces']; Pre-clone FORCES repository before building
  severity: fatal
- id: dt_b02
  symptom: Undefined reference to NetCDF-Fortran symbols
  diagnosis: NetCDF-Fortran development library not found by CMake; mHM requires libnetcdff-dev for I/O.
    If not installed or not in the search path, linking fails.; ['build_system', 'netcdf']
  remedy: 'Install NetCDF-Fortran dev package and set NetCDF root; [''sudo apt install libnetcdff-dev'',
    ''If still fails: cmake -DNetCDF_ROOT=$(nf-config --prefix)'']; Verify libnetcdff-dev installed before
    building'
  severity: fatal
- id: dt_b03
  symptom: 'Fatal Error: Cannot open module file ''mo_*'''
  diagnosis: Build order dependency issue; Fortran modules must be compiled in dependency order. Parallel
    build sometimes fails.; ['build_system']
  remedy: Clean and rebuild sequentially; ['rm -rf build', 'cmake -B build -DCMAKE_BUILD_TYPE=Release',
    'cmake --build build -j1']; Use cmake --build build -j$(nproc) which usually handles dependencies
  severity: fatal
- id: dt_b04
  symptom: Rank mismatch or unsupported Fortran feature error
  diagnosis: gfortran version too old (< 9.0); mHM v5.13 requires gfortran >= 9.0 for certain Fortran
    2008/2018 features.; ['build_system', 'compiler']
  remedy: 'Upgrade gfortran; [''gfortran --version  # check current'', ''sudo apt install gfortran-11  #
    or newer'', ''export FC=gfortran-11 && cmake -B build'']; Verify gfortran >= 9.0 before building'
  severity: fatal
- id: dt_b05
  symptom: fypp preprocessor warning during CMake configure
  diagnosis: fypp not installed in the Python environment; Some FORCES source files use fypp preprocessing.
    Build may succeed with warnings but miss features.; ['build_system']
  remedy: Install fypp; ['pip install fypp']; Install fypp before building mHM
  severity: degraded
- id: dt_r01
  symptom: mHM crashes with 'Number of rows/columns do not match'
  diagnosis: ASCII grid headers are inconsistent across morphological input files; ALL ASCII grids (dem.asc,
    soil_class.asc, geology_class.asc, etc.) MUST have identical ncols, nrows, xllcorner, yllcorner, cellsize
    values. Even a difference of 0.0001 in xllcorner will crash.; ['s2_morphology', 'all_grids']
  remedy: Run validate_morph_grids.py to identify the mismatch; validate_morph_grids.py --morph_dir input/morph/;
    Generate ALL grids from the same domain_info.json header
  severity: fatal
- id: dt_r02
  symptom: mHM crashes with 'Resolution mismatch' between L0, L1, L11
  diagnosis: L1 or L11 resolution is not an exact integer multiple of L0 resolution; mHM requires L1 =
    N * L0 and L11 = M * L0 where N,M are positive integers. If L0=500m and L1=1200m, this fails because
    1200/500 = 2.4.; ['s1_domain', 'grid_setup']
  remedy: 'Adjust L1/L11 resolution to be integer multiples of L0; [''Check domain_info.json for all three
    resolutions'', ''Ensure L1/L0 and L11/L0 are integer ratios'', ''Example: L0=1000m, L1=24000m (24x),
    L11=24000m (24x)'']; setup_mhm_domain.py validates this automatically'
  severity: fatal
- id: dt_r03
  symptom: mHM crashes with 'No meteorological data found' or 'Missing forcing file'
  diagnosis: Forcing NetCDF files have wrong path, wrong variable names, or wrong time range; mHM looks
    for forcing in the directories specified in mhm.nml (dir_Precipitation, dir_Temperature, etc.). The
    files must be named correctly and cover the simulation period.; ['s4_forcing', 'namelist']
  remedy: 'Check forcing directory paths in mhm.nml and verify files exist; [''ls input/meteo/pre/  #
    check precipitation files exist'', ''ncdump -h input/meteo/pre/pre_2005.nc  # check variable names'',
    ''Verify time range covers eval_Per in mhm.nml'']; Use convert_forcing_to_mhm.py which names files
    correctly'
  severity: fatal
- id: dt_r04
  symptom: mHM crashes with 'Gauge ID not found in grid'
  diagnosis: The gauge ID in mhm.nml does not match any cell value in idgauges.asc, or the gauge falls
    on a NODATA cell; idgauges.asc must have the gauge ID (e.g., 398) at exactly the cell where the gauge
    is located. If the gauge falls on a NODATA cell (-9999), mHM cannot find it.; ['s2_morphology', 's6_namelist
  remedy: Check gauge location and idgauges.asc; ['Verify Gauge_id in mhm.nml matches value in idgauges.asc',
    'Check gauge coordinates are within the domain and on a valid cell', 'Re-run generate_gauge_grid.py
    with correct coordinates']; generate_gauge_grid.py auto-snaps gauge to nearest valid cell
  severity: fatal
- id: dt_r05
  symptom: Model runs but routed discharge is zero everywhere
  diagnosis: 'Flow direction grid uses wrong D8 convention; mHM uses ArcGIS D8: 1=E, 2=SE, 4=S, 8=SW,
    16=W, 32=NW, 64=N, 128=NE. WhiteboxTools uses a DIFFERENT convention. If the tool writes WBT D8 values,
    mHM routing breaks completely but model still runs.; [''s2_morphology'', ''fdir'']'
  remedy: 'Verify fdir.asc uses ArcGIS D8 convention; [''Check unique values in fdir.asc: should be 0,1,2,4,8,16,32,64,128'',
    ''If values are 0,1,2,3,4,5,6,7: WBT convention, must convert'', ''Use prepare_morpho_data.py which
    uses ArcGIS convention'']; Always generate fdir with prepare_morpho_data.py, never Whitebox'
  severity: fatal
- id: dt_r06
  symptom: Discharge way too high (10-100x expected)
  diagnosis: 'Precipitation units wrong: mm/3hr not aggregated to mm/day; CMFD and MSWX precipitation
    is in mm/3hr (8 timesteps per day). If not summed to daily, precip is 8x too low. But some tools sum
    all monthly files, giving ~240x too much.; [''s4_forcing'']'
  remedy: 'Check precipitation values in forcing NetCDF; [''ncdump -v pre input/meteo/pre/pre_2005.nc
    | tail -5'', ''Daily precip should be 0-100 mm/day typically'', ''If values are 0-12 mm (too low):
    not aggregated from 3-hourly'', ''If values are 0-10000 (too high): double aggregation'']; Use convert_forcing_to_mhm.'
  severity: fatal
- id: dt_r07
  symptom: Baseflow is zero despite wet climate
  diagnosis: Geology class grid has all cells mapped to a single class, or geology_classdefinition.txt
    is malformed; mHM uses GeoParam(i) for baseflow recession. If geology_class.asc has all cells as one
    class and that class has a very low recession constant, baseflow will be zero.; ['s2_morphology',
    'geology']
  remedy: Check geology class distribution and classdefinition; ['Count unique values in geology_class.asc',
    'Verify geology_classdefinition.txt has correct format', 'Check GeoParam values in mhm_parameter.nml
    for the dominant class']; Use glim_to_mhm_geology.py for realistic geology classification
  severity: degraded
- id: dt_r08
  symptom: mHM crashes with 'Parameter out of range'
  diagnosis: 'A parameter value in mhm_parameter.nml is outside its [lower, upper] bounds; Each parameter
    has format: lower, upper, value, FLAG, SCALING. If value < lower or value > upper, mHM rejects it.;
    [''s3_mpr'']'
  remedy: Check mhm_parameter.nml for out-of-range values; ['Search for parameters where value is outside
    bounds', 'Adjust value to be within [lower, upper]', 'Or widen the bounds if the calibrated value
    is physically reasonable']; transfer_mpr_params.py validates bounds during transfer
  severity: fatal
- id: dt_r09
  symptom: NaN values appear in output fields
  diagnosis: NODATA (-9999) in soil or DEM propagates through calculations; If soil_classdefinition.txt
    has a mapping unit referenced in soil_class.asc but not defined in the classdefinition, mHM may produce
    NaN for those cells.; ['s2_morphology', 'soil']
  remedy: Check that all soil/geology IDs in grids are defined in classdefinition files; ['Extract unique
    IDs from soil_class.asc', 'Verify each ID exists in soil_classdefinition.txt', 'Check for -9999 leaking
    into valid computation cells']; hwsd_to_mhm_soil.py generates consistent class + definition files
  severity: degraded
- id: dt_r10
  symptom: Model runs extremely slowly (10x expected runtime)
  diagnosis: L0 resolution too fine relative to domain size; If L0 is 100m for a 100,000 km2 basin, there
    are 10 million L0 cells. MPR must process all of them. Use L0=1000m for large basins.; ['s0_config',
    's1_domain']
  remedy: Increase L0 resolution (coarser grid); ['Check L0 resolution vs basin size', 'For basins >10,000
    km2, use L0 >= 1000m', 'For basins >100,000 km2, use L0 >= 2000m']; configure_mhm_basin.py should
    warn about excessive L0 cell counts
  severity: degraded
- id: dt_s01
  symptom: Soil parameters physically unreasonable (all cells have same Ksat)
  diagnosis: soil_classdefinition.txt has wrong column order or all soil types have identical properties;
    If clay and sand columns are swapped, MPR transfer functions produce wrong Ksat/porosity. The model
    runs fine but soil hydraulic properties are wrong everywhere.; ['s2_morphology', 'soil']
  remedy: 'Verify soil_classdefinition.txt column order; [''Check header: MU_GLOBAL HORIZON UD[mm] LD[mm]
    CLAY[%] SAND[%] BD[gcm-3]'', ''Verify some entries have different clay/sand values'', ''Compare with
    HWSD original data'']; hwsd_to_mhm_soil.py validates output column order'
  severity: silent
- id: dt_s02
  symptom: ET systematically too high or too low
  diagnosis: 'PET method mismatch: processCase(5)=1 (Hargreaves) but only tavg provided instead of tmin/tmax;
    Hargreaves requires tmin and tmax separately. If only tavg is provided, mHM may use tavg for both,
    producing wrong PET. No error message.; [''s4_forcing'', ''s6_namelist'']'
  remedy: 'Check processCase(5) matches available forcing variables; [''processCase(5)=0: needs pet/ directory'',
    ''processCase(5)=1: needs tmin/ and tmax/ directories'', ''processCase(5)=2: needs radiation data'',
    ''processCase(5)=3: needs wind, humidity, radiation, pressure'']; generate_mhm_namelists.py sets process'
  severity: silent
- id: dt_s03
  symptom: Regionalization (parameter transfer) degrades performance significantly
  diagnosis: Calibration and prediction basins used DIFFERENT L0 data sources; MPR transfer functions
    are calibrated to a specific soil/geology database. If the calibration basin used HWSD v1.2 but the
    prediction basin used FAO Digital Soil Map, the transfer functions are not valid because the classification
    sch
  remedy: 'Ensure both basins use identical L0 data sources; [''Check soil database: both must use HWSD'',
    ''Check geology: both must use GLiM'', ''Check land cover: both must use AVHRR'', ''The transfer_report.json
    documents which sources were used'']; HydroCraft uses the same global databases for all basins'
  severity: silent
- id: dt_s04
  symptom: Multi-basin calibration biased toward the largest basin
  diagnosis: Objective function not normalized by basin area or number of timesteps; When calibrating
    across multiple basins, a 100,000 km2 basin dominates the objective function over a 1,000 km2 basin
    because it has more grid cells contributing to total error.; ['s9_calibrate']
  remedy: Use per-basin KGE/NSE averaged across basins (not summed); ['Set opti_function to KGE (value
    10) which normalizes per gauge', 'Or compute weighted average of per-basin metrics']; Default opti_function=10
    (KGE) handles this correctly
  severity: silent
- id: dt_s05
  symptom: Aspect values wrong (north/south flipped)
  diagnosis: DEM is in geographic CRS but aspect was computed assuming projected CRS; In geographic CRS,
    row 0 is top (north) but gradient computation may assume row 0 is bottom. This flips the aspect, causing
    wrong PET correction from aspect.; ['s2_morphology', 'aspect']
  remedy: 'Verify aspect convention: N=0/360, E=90, S=180, W=270; [''Check a known south-facing slope
    has aspect ~180'', ''Compare with GIS software output'']; prepare_morpho_data.py handles CRS convention
    correctly'
  severity: silent
- id: dt_s06
  symptom: Interflow always zero even in steep terrain
  diagnosis: interflowStorageCapacityFactor at lower bound (75) is too low for the basin; The interflow
    storage capacity factor determines how much water can be held before interflow begins. If too low,
    all water percolates to groundwater instead.; ['s3_mpr']
  remedy: Increase interflowStorageCapacityFactor bounds or initial value; ['Check mhm_parameter.nml &interflow1
    section', 'Try value=150 (mid-range)', 'Enable FLAG=1 for calibration']; Literature-informed initial
    values help avoid this
  severity: silent
- id: dt_s07
  symptom: Routing peak timing wrong by 1-3 days
  diagnosis: resolution_Routing in mhm.nml does not match actual grid spacing; If resolution_Routing says
    24000m but the actual L11 grid has cells of 10000m, the Muskingum travel time computation is wrong.
    Peaks arrive too early or too late.; ['s6_namelist', 's1_domain']
  remedy: Verify resolution_Routing matches L11 grid cellsize; ['Check domain_info.json for resolution_L11_m',
    'Check mhm.nml resolution_Routing(1)', 'They must be identical']; generate_mhm_namelists.py sets this
    from config automatically
  severity: silent
- id: dt_s08
  symptom: Temperature in Kelvin instead of Celsius passed to mHM
  diagnosis: CMFD temperature not converted from K to C before writing mHM forcing; CMFD temperature is
    in Kelvin (273-323 range). mHM expects Celsius (-30 to 50). If not converted, snow thresholds are
