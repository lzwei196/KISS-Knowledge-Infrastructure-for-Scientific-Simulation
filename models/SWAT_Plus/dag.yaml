outputs:
  - var: "streamflow at channel outlet (flo_out)"
    validation_rank: 1
    unit: "m3/s (after conversion from ha-m/day)"
    description: "Daily channel discharge leaving each routed segment; primary calibration target for hydrology."
    emitted_in: "channel_sd_day.txt / channel_sd_mon.txt / channel_sd_yr.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "SWAT+ emits flo_out in ha-m/day; downstream consumers must convert to m3/s before comparison."
            - "Exclude warmup years (nyskip) from any goodness-of-fit calculation."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Annual or basin-aggregate gauge series carry abstraction/management trends not in the forcing; detrend before comparison."
      detrending_options: ["none", "linear_residual", "decadal_mean"]
  - var: "basin water balance components (precip, snofall, snomlt, surq_gen, latq, perc, et, qtile, wateryld, sw_final)"
    validation_rank: 3
    unit: "mm/day or mm/yr"
    description: "Closed water-balance accounting at the basin level."
    emitted_in: "basin_wb_day.txt / basin_wb_mon.txt / basin_wb_yr.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["magnitude_accuracy", "trend_match"]
          determining_metric: "pbias"
          caveats:
            - "ET and recharge observations at basin scale are typically remote-sensing or reanalysis products with their own bias structure."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Spatial comparison meaningful only when HRU output (hru_wb) is mapped back to a grid; basin_wb is a scalar series."
      detrending_options: ["none", "linear_residual"]
  - var: "HRU water balance (hru_wb: per-HRU surq, latq, perc, et, sw)"
    validation_rank: 4
    unit: "mm/yr (typical)"
    description: "Yearly per-HRU water balance components; daily writing produces multi-GB files for large basins."
    emitted_in: "hru_wb_yr.txt / hru_wb_aa.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["HRU geometry is irregular; remap to grid for raster comparison."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none"]
  - var: "basin landscape nutrient losses (basin_ls: sedorgn, surqno3, sedmin)"
    validation_rank: 7
    unit: "kgN/ha/day or kgN/ha/yr; kgP/ha/yr"
    description: "Landscape-level (pre-channel) nutrient losses from HRUs; reliable alternative to in-channel nutrient outputs when QUAL2E is unstable."
    emitted_in: "basin_ls_day.txt / basin_ls_yr.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["magnitude_accuracy", "trend_match"]
          determining_metric: "pbias"
          caveats: ["Landscape losses differ from in-stream loads by channel processing; pair with HRU export coefficients when possible."]
      detrending_options: ["none", "linear_residual"]
  - var: "basin nutrient balance (basin_nb: fertn, denit, act_nit_n, plant uptake)"
    validation_rank: 8
    unit: "kgN/ha/yr"
    description: "Closed nutrient-balance accounting per basin per year."
    emitted_in: "basin_nb_yr.txt / basin_nb_day.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Inventory-based reference loads have wide uncertainty; PBIAS is the only defensible metric in most basins."]
      detrending_options: ["none"]
  - var: "channel nutrient loads (orgn_out, no3_out, sedp_out, solp_out)"
    validation_rank: 9
    unit: "kg/day"
    description: "In-stream nutrient mass fluxes routed by QUAL2E."
    emitted_in: "channel_sd_day.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats:
            - "Rev 59.3 QUAL2E solver is numerically unstable at extreme flows (>10x bankfull); values can blow up to physically impossible magnitudes (>1e9 mg/L). Use basin_ls and basin_nb for nutrient loads instead."
            - "Compare only when wq_cha=1 and the basin is non-flashy; otherwise treat as not observable."
      detrending_options: ["none"]
  - var: "sediment yield (HRU sedyld; channel sed_in/sed_out)"
    validation_rank: 10
    unit: "t/ha; t"
    description: "MUSLE-based HRU sediment yield and routed channel sediment load."
    emitted_in: "basin_ls_day.txt, channel_sd_day.txt, channel_sdmorph_yr.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats:
            - "Gauged sediment series are typically sparse and rating-curve-derived; agreement weaker than streamflow."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "crop yield (basin yield_yr / yield_aa, hru_pw)"
    validation_rank: 11
    unit: "t/ha"
    description: "Per-crop yield at harvest, aggregated to basin or kept per-HRU."
    emitted_in: "yield_yr.txt / yield_aa.txt / hru_pw_yr.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "National/provincial yield series carry strong technology trends not represented by a weather-driven process model; detrending is required."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Yield aggregated to admin unit; per-HRU comparison requires zonal stats."]
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "pbias"
          caveats:
            - "Single-site experimental yield series; detrending typically not needed if site management is stable across years."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Single-year, single-site trial; HRU containing the trial site must be identified and management aligned."
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Admin-unit average for a single year; only meaningful when basin coverage of the admin unit is high."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy", "trend_match"]
          determining_metric: "pbias"
          caveats:
            - "Remote-sensed yield surrogates (e.g., crop-yield-from-VI products) at coarser grain than HRU; aggregate to pixel before comparison; detrending recommended."
      detrending_options: ["linear_residual", "decadal_mean"]
  - var: "aquifer state (storage, water-table depth, baseflow flo)"
    validation_rank: 6
    unit: "mm, m, mm"
    description: "Per-aquifer storage and baseflow; gwflow grid-cell head when gwflow=1."
    emitted_in: "aquifer_day.txt / aquifer_yr.txt / gwflow output files"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats: ["Lumped aquifer (aqu_1d) has one storage per aquifer object; point-well comparison only meaningful under gwflow=1."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Only meaningful under gwflow=1 distributed module."]
      detrending_options: ["none", "linear_residual"]
  - var: "snow water equivalent (hru%sno_mm; snofall, snomlt fluxes)"
    validation_rank: 5
    unit: "mm H2O"
    description: "Snowpack water equivalent per HRU and daily snowfall/melt fluxes."
    emitted_in: "hru_wb_day.txt, basin_wb_day.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "csi"
          caveats: ["Remote-sensing SWE products coarser than HRU; aggregate HRU output to pixel before comparison."]
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Peak SWE depth and ablation rate are the magnitude targets; snow-pillow / snow-course stations are the typical reference."]
      detrending_options: ["none"]
  - var: "evapotranspiration (basin et, eplant, esoil, pet)"
    validation_rank: 2
    unit: "mm/day"
    description: "Actual ET partitioned into plant transpiration and bare-soil evaporation, plus PET."
    emitted_in: "basin_wb_day.txt, hru_wb_day.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Remote-sensing ET (e.g., 8-day) requires temporal aggregation."]
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["magnitude_accuracy", "trend_match"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none", "linear_residual"]

