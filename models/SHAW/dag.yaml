safety:
  hazards:
    - id: "wind_precip_unit_flag_mismatch"
      kind: "weather_file_semantic"
      description: "IFLAGSI=0 with SI forcing silently scales wind ~2.2x (or ~53.7x daily) and precip ~25.4x, corrupting ET and energy balance."
      severity: "critical"
    - id: "weather_timestep_column_mismatch"
      kind: "weather_file_semantic"
      description: "MTSTEP not matching weather column count (9 hourly / 8 daily) mis-maps all columns; runs without error but produces wrong results."
      severity: "silent"
    - id: "weather_column_order_doy_yr"
      kind: "weather_file_semantic"
      description: "Daily format expects DOY then year; YR-first ordering makes year read as day-of-year, causing date mismatch or silently wrong data."
      severity: "fatal_or_silent"
    - id: "four_digit_year_one_day_run"
      kind: "weather_file_semantic"
      description: "4-digit year in any input file makes SHAW run exactly one day and exit with 'Normal completion' and no error."
      severity: "silent"
    - id: "solar_unit_or_convention_error"
      kind: "weather_file_semantic"
      description: "Station solar in MJ/m2/day not converted to W/m2 underestimates energy ~11.6x, causing cold/low-ET bias; SHAW expects W/m2."
      severity: "degraded"
    - id: "first_soil_node_not_surface"
      kind: "soil_semantic"
      description: "ZS(1) != 0.0 (first node must be the surface) can crash the model or corrupt the surface energy balance."
      severity: "fatal_or_silent"
    - id: "too_few_soil_nodes_freeze_thaw"
      kind: "soil_semantic"
      description: "NS too small over a deep profile cannot resolve 30-150 cm frost penetration, producing step-function frost profiles."
      severity: "degraded"
    - id: "bpar_out_of_physical_range"
      kind: "soil_semantic"
      description: "Non-physical Campbell b (BPAR) keeps soil liquid to very low temperature, disabling freeze-thaw; QUARTZ outside 0-1 is non-physical thermal parameter."
      severity: "degraded"
    - id: "van_genuchten_nonzero_air_entry"
      kind: "soil_semantic"
      description: "With IWRC=3 (van Genuchten) a non-zero psi_e applies both VG and Campbell air-entry corrections; psi_e must be 0."
      severity: "degraded"
    - id: "solute_column_shift_when_nsalt_zero"
      kind: "soil_semantic"
      description: "Leaving ASALT/DISPER columns present when NSALT=0 shifts soil-property column parsing and yields wrong soil properties."
      severity: "silent"
    - id: "moisture_profiles_insufficient"
      kind: "initial_condition_semantic"
      description: "Fewer than 2 bracketing moisture profiles (or last .tem/.moi entry before JEND) leaves the lower boundary uninterpolable; the run terminates early at 'Normal completion'."
      severity: "fatal_or_silent"
    - id: "all_sentinel_temperature_profile"
      kind: "initial_condition_semantic"
      description: "A temperature profile where all nodes are the 99999 'no-measurement' sentinel can crash or produce garbage."
      severity: "fatal_or_silent"
    - id: "initial_moisture_near_saturation"
      kind: "initial_condition_semantic"
      description: "Initial moisture near saturation (theta>0.45) causes first-timestep drainage/runoff artifacts; use field capacity plus spinup."
      severity: "degraded"
    - id: "newton_raphson_tolerance_too_large"
      kind: "numerical_instability"
      description: "TOLER>0.05 lets the Newton-Raphson solver accept inaccurate solutions where freeze-thaw latent-heat nonlinearity is strong."
      severity: "degraded"
    - id: "silent_stop_on_solver_divergence"
      kind: "numerical_instability"
      description: "SHAW may call Fortran STOP with exit code 0 and no message on solver divergence, leaving empty/incomplete output files."
      severity: "fatal_or_silent"
    - id: "jstart_no_previous_day"
      kind: "control_semantic"
      description: "JSTART equal to the first weather DOY leaves DAY2HR without previous-day data for interpolation (must be first DOY + 1)."
      severity: "fatal_or_silent"
    - id: "hrnoon_placeholder"
      kind: "control_semantic"
      description: "HRNOON set to a placeholder instead of the longitude-derived ~12.x value mis-times the diurnal cycle and can assign all precipitation to hour 0 (zero effective precip)."
      severity: "critical"
    - id: "height_below_canopy"
      kind: "control_semantic"
      description: "Measurement HEIGHT below maximum canopy height makes the wind/temperature profile extrapolation physically impossible."
      severity: "degraded"
    - id: "pondmx_zero_flat_terrain"
      kind: "control_semantic"
      description: "PONDMX=0 on flat terrain forces immediate runoff of excess water, overestimating runoff and underestimating infiltration."
      severity: "degraded"
    - id: "restkb_wrong_for_residue_type"
      kind: "control_semantic"
      description: "Residue RESTKB tuned for lying residue (~4.0) applied to standing residue (~8.5) underestimates wind exposure and keeps residue too moist."
      severity: "degraded"
  validation_limits:
    - "1-D vertical point/column only; cannot represent horizontal 2-D/3-D transport or watershed routing."
    - "Lateral subsurface flow is a lumped output term, not a resolved lateral process."
    - "Frost penetration resolution is bounded by soil-node spacing; coarse grids cannot resolve deep frost."
    - "Uncalibrated soil-temperature skill degrades where snow-insulation is mis-specified (cold bias reported over prairie sites)."
  warnings:
    - "SNODEN=0 in the weather file is valid: it instructs SHAW to compute new-snow density from air temperature."
    - "Always verify output files are non-empty and the simulated period matches the requested period, because divergence produces a silent STOP."
    - "The unfrozen-water-vs-temperature relation is governed by BPAR (Campbell b); pedotransfer-based BPAR/QUARTZ/BCAP from texture are required for physically meaningful freeze-thaw."
  assumptions:
    - statement: "The model is a single 1-D vertical soil-plant-atmosphere column; each profile is independent with no lateral coupling between columns."
      scope: "spatial geometry"
      source: "SHAW Technical Documentation (Flerchinger 2017) and USDA-ARS SHAW model overview"
      status: "adopted"
    - statement: "Heat and water (and solute) systems are solved simultaneously by an implicit finite-difference Newton-Raphson scheme to a user-prescribed tolerance, with the surface energy balance closed via the ground-heat-flux residual."
      scope: "numerical closure"
      source: "SHAW Technical Documentation - Numerical solution; Flerchinger & Saxton 1989 Part I"
      status: "adopted"
    - statement: "The lower temperature boundary is dynamic under ITMPBC=1 (Hirota damping-depth term driven by the prior-step gradient and mean annual temperature), not a fixed bottom-node temperature."
      scope: "lower boundary condition"
      source: "GOSHAW / SOILTK lower-boundary handling in SHAW v3.03 source (Shaw303.for)"
      status: "adopted"
    - statement: "Mass-balance closure applies to water and to the transported solute species; the surface energy balance is closed intrinsically every timestep."
      scope: "conservation"
      source: "SHAW Technical Documentation and WBALNC/ENERGY module behavior in SHAW source"
      status: "adopted"
    - statement: "Freeze-thaw liquid/ice partitioning is governed by salt-dependent freezing-point depression and the Campbell b (BPAR) retention exponent, coupling the heat and water systems implicitly."
      scope: "freeze-thaw physics"
      source: "FROZEN/MATVLC behavior in SHAW source (Shaw303.for) and Flerchinger & Saxton 1989 Part I"
      status: "adopted"
    - statement: "This dag describes the base SHAW v3.03 standalone implementation; the v3.03-CO2 beta carbon-flux variant (GPP/NEE/Reco) is out of scope."
      scope: "implementation boundary"
      source: "SHAW v3.03 source tree (Shaw303.for vs Shaw303-CO2Beta.for) and KI identity note"
      status: "adopted"
