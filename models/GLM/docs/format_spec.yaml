# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: GLM
  language: c
  implementation:
    id: glm-aed-333
    version: 3.3.3
    provenance: C (core) with Fortran AED2 modules; AquaticEcoDynamics (UWA) General Lake Model + AED2
      library, single compiled binary.
  scientific_reference_version: GLM 3.0 science (Hipsey et al. 2019, GMD 12:473-523); AED2 water-quality
    coupling
inputs:
  forcing:
  - name: ShortWave (incoming shortwave radiation)
    unit: W/m2
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column read per &meteorology; required for rad_mode 0-3
    notes: Must be clipped to >= 0; un-clipped night-time negatives after interpolation can drive NaN
      temperatures. Daily values internally disaggregated to an idealized diurnal cycle.
  - name: LongWave (incoming longwave radiation)
    unit: W/m2
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column; consumed when lw_type=LW_IN / rad_mode=2
    notes: 'lw_type selects handling: LW_IN reads this column, LW_CC computes longwave from cloud cover.
      Mismatch double-counts longwave and warms summer surface by 3-5 degC.'
  - name: Clouds (cloud cover fraction)
    unit: fraction (0-1)
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column; required for rad_mode 0,1,4 / lw_type=LW_CC
  - name: AirTemp (air temperature at ~10 m)
    unit: degC
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column
  - name: RelHum (relative humidity at ~10 m)
    unit: '% (0-100)'
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column
    notes: Must be percent (0-100), NOT fraction (0-1); a fractional value is read literally (0.7 -> 0.7%
      RH) and produces runaway evaporation.
  - name: WindSpeed (at ~10 m)
    unit: m/s
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column
    notes: Outliers (>30 m/s) can destabilize the mixing solver and yield NaN temperatures.
  - name: Rain (rainfall depth)
    unit: m/day
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column
    notes: Native unit is m/day, NOT mm/day; an mm/day value is 1000x too large and causes continuous
      overflow. Rain partitioned to snow below snow_threshold.
  - name: Snow (snowfall depth)
    unit: m/day
    category: meteorology
    source_kind: forcing
    model_input_format: met CSV column; consumed when snow_sw / snowice active
  - name: inflow FLOW (riverine inflow rate)
    unit: ML/day
    category: boundary_inflow
    source_kind: forcing
    model_input_format: inflow CSV column (daily); one file per configured inflow
    notes: Inflow inserted at neutral-buoyancy depth set by its density relative to the column.
  - name: inflow TEMP (inflow water temperature)
    unit: degC
    category: boundary_inflow
    source_kind: forcing
    model_input_format: inflow CSV column
    notes: Required; a missing/zero TEMP inserts 0 degC water forming an artificial cold density current
      that disrupts thermal structure.
  - name: inflow SALT (inflow salinity)
    unit: mg/L
    category: boundary_inflow
    source_kind: forcing
    model_input_format: inflow CSV column
    notes: Must be 0 for freshwater lakes; non-zero salinity raises inflow density and inserts the inflow
      too deep.
  - name: inflow WQ constituents (AED2)
    unit: mmol/m3
    category: boundary_inflow
    source_kind: forcing
    model_input_format: extra inflow CSV columns (NIT_nit, NIT_amm, PHS_frp, OGM_*, OXY_oxy, SIL_rsi,
      PHY_*) when AED2 enabled
    notes: Absent nutrient columns give zero external loading; AED2 phytoplankton then collapse to near-zero
      biomass.
  - name: outflow FLOW (withdrawal/release rate)
    unit: ML/day
    category: boundary_outflow
    source_kind: forcing
    model_input_format: outflow CSV column (daily); one column per configured outlet; or internal natural
      overflow
  parameters:
  - name: Kw (light extinction coefficient)
    unit: 1/m
    category: light
    source_kind: calibrated
    model_input_format: '&light namelist'
    notes: Controls thermocline depth and light penetration; Kw ~ 1.7/Secchi_depth_m. Too high (>3) suppresses
      stratification; too low (<0.1) gives unrealistic deep heating.
  - name: coef_wind_stir (wind stirring coefficient)
    unit: '-'
    category: mixing
    source_kind: calibrated
    model_input_format: '&mixing namelist'
    notes: Sets surface mixed-layer depth; too high prevents stratification in small sheltered lakes.
  - name: coef_mix_hyp (hypolimnetic/deep mixing coefficient)
    unit: '-'
    category: mixing
    source_kind: calibrated
    model_input_format: '&mixing namelist'
  - name: coef_mix_conv (convective mixing coefficient)
    unit: '-'
    category: mixing
    source_kind: calibrated
    model_input_format: '&mixing namelist'
  - name: ce, ch, cd (bulk transfer coefficients for latent, sensible, momentum flux)
    unit: '-'
    category: meteorology
    source_kind: calibrated
    model_input_format: '&meteorology namelist'
  - name: wind_factor, sw_factor, lw_factor, rain_factor, at_factor, rh_factor (forcing scaling factors)
    unit: '-'
    category: meteorology
    source_kind: calibrated
    model_input_format: '&meteorology namelist'
    notes: Multiplicative scalings applied to met forcing variables; wind_factor and sw_factor are dominant
      temperature calibration levers.
  - name: hypsographic curve H[] / A[] (depth-area, optionally volume)
    unit: m / m2
    category: morphometry
    source_kind: dataset_lookup
    model_input_format: '&morphometry namelist (bsn_vals points)'
    notes: H[] and A[] must be monotonically ascending bottom-to-top with A[0]~0 and crest_elev=max(H);
      >=10-15 points recommended for realistic volume.
  - name: min_layer_thick / max_layer_thick (h_min / h_max)
    unit: m
    category: layer_control
    source_kind: calibrated
    model_input_format: '&glm_setup namelist'
    notes: Bound the adaptive Lagrangian layer thickness; max_layer_thick too small triggers layer-merge
      errors/hangs.
  - name: strm_hf_angle, strmbd_slope, strmbd_drag, submerged
    unit: '-'
    category: inflow_geometry
    source_kind: calibrated
    model_input_format: '&inflow namelist (per inflow)'
  - name: outl_elevs, bsn_len_outl, bsn_wid_outl, seepage_rate
    unit: m / m / m / m/day
    category: outflow_geometry
    source_kind: calibrated
    model_input_format: '&outflow namelist'
  - name: R_growth (max phytoplankton growth rate)
    unit: 1/day
    category: aed2
    source_kind: calibrated
    model_input_format: aed2.nml (phytoplankton); AED2 enabled
    notes: Sets total phytoplankton biomass level.
  - name: I_S (light saturation)
    unit: W/m2
    category: aed2
    source_kind: calibrated
    model_input_format: aed2.nml (phytoplankton); AED2 enabled
  - name: w_p (phytoplankton sedimentation velocity)
    unit: m/day
    category: aed2
    source_kind: calibrated
    model_input_format: aed2.nml (phytoplankton); AED2 enabled
    notes: Negative sinks, positive floats.
  - name: Fsed_frp (sediment P release / internal loading)
    unit: mmol/m2/day
    category: aed2
    source_kind: calibrated
    model_input_format: aed2.nml (phosphorus); AED2 enabled
  - name: Fsed_oxy (sediment oxygen demand)
    unit: mmol/m2/day
    category: aed2
    source_kind: calibrated
    model_input_format: aed2.nml (oxygen); AED2 enabled
  initial_conditions:
  - name: initial temperature/salinity depth profiles
    unit: degC / mg/L
    category: profiles
    source_kind: user_provided
    model_input_format: '&init_profiles namelist (depth-value pairs; initial layers equal thickness)'
    notes: lake_depth must not exceed morphometry max depth (max(H)-min(H)).
  - name: initial AED2 WQ depth profiles
    unit: mmol/m3 (AED2 vars)
    category: profiles
    source_kind: user_provided
    model_input_format: '&init_profiles WQ entries; count must equal num_wq_vars * num_depths'
  boundary_conditions:
  - name: rad_mode (radiation mode selector)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: '&meteorology namelist'
    notes: Selects required shortwave/longwave/cloud combination; the supplied met columns must be consistent
      with it.
  - name: 'lw_type (longwave handling: LW_IN vs LW_CC)'
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: '&meteorology namelist'
  - name: subdaily (sub-daily forcing switch)
    unit: boolean
    category: control
    source_kind: user_provided
    model_input_format: '&meteorology namelist'
    notes: subdaily=.true. with 3-hourly forcing produces flat/unrealistic temperatures; use daily forcing
      with subdaily=.false. unless forcing is hourly.
  - name: timefmt + start/stop (simulation time configuration)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: '&time namelist'
    notes: timefmt=2 for datetime strings, timefmt=3 for integer seconds; mismatch crashes the namelist
      read.
  - name: dt_iceon_avg + min_ice_thickness (ice model enablement)
    unit: days / m
    category: control
    source_kind: user_provided
    model_input_format: '&snowice namelist'
    notes: Both must be set to enable the ice model; otherwise ice is silently disabled and surface temperature
      floors near 0.002 degC. For deep reservoirs (>50 m) dt_iceon_avg <= 0.04.
  - name: outflow mode (natural overflow / constant / scheduled / balance)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: '&outflow namelist'
  - name: num_inflows / num_outlets (inflow & outlet counts)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: '&inflow / &outflow namelist'
    notes: num_inflows must match the number of inflow files; a count of 0 with files listed silently
      ignores all inflow.
  - name: AED2 module activation list (&aed_models)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: aed2.nml
    notes: Phytoplankton requires oxygen, nitrogen, phosphorus and organic_matter modules (silica for
      diatoms) listed before it; missing dependencies crash at init.
outputs:
  primary:
  - name: temp
    unit: degC
    description: Water temperature per Lagrangian layer (depth x time profile).
    validation_rank: 2
    emitted_in: output.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare at matched depths; Lagrangian layers shift between outputs so interpolate to fixed observation
          depths.
        - Documented warm bias (~3-5 degC summer surface) driven by longwave handling.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - The 'spatial' axis here is the vertical depth-time temperature field, not a horizontal grid.
      detrending_options:
      - none
  - name: surface_temp
    unit: degC
    description: Surface (mixed-layer) water temperature.
    validation_rank: 3
    emitted_in: lake.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Satellite LSWT is a skin temperature; bulk surface-layer temperature differs slightly.
      detrending_options:
      - none
  - name: bottom_temp
    unit: degC
    description: Bottom (hypolimnetic) water temperature.
    validation_rank: 4
    emitted_in: lake.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  - name: lake_level
    unit: m
    description: Water surface elevation.
    validation_rank: 1
    emitted_in: lake.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Sensitive to the water-balance closure; check inflow/outflow gauging and seepage.
      detrending_options:
      - none
      - linear_residual
  - name: lake_volume
    unit: m3
    description: Total lake/reservoir storage volume.
    validation_rank: 5
    emitted_in: lake.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Storage usually derived from observed level via the same hypsographic curve.
      detrending_options:
      - none
  - name: ice_thickness
    unit: m
    description: Combined blue/white ice (and snow) cover thickness and duration.
    validation_rank: 6
    emitted_in: output.nc / lake.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Requires dt_iceon_avg/min_ice_thickness set or ice is silently zero; ice days tend to be underestimated.
      - obs_shape: categorical_event
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        determining_metric: csi
        caveats:
        - Ice-on/ice-off as event dates; evaluate freeze/thaw DOY timing.
      detrending_options:
      - none
  - name: evaporation
    unit: ML/day
    description: Daily lake evaporative mass flux.
    validation_rank: 7
    emitted_in: lake.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Direct evaporation observations are rare; often inferred from energy-balance or water-balance
          residual.
      detrending_options:
      - none
  - name: thermocline_depth
    unit: m
    description: Depth of the thermocline in lake/reservoir water (derived when stratified).
    validation_rank: 8
    emitted_in: derived
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Derived from the profile via a consistent definition (e.g., max density gradient) for both model
          and obs.
      detrending_options:
      - none
  - name: schmidt_stability
    unit: J/m2
    description: Schmidt stability of the water column (derived stratification strength).
    validation_rank: 9
    emitted_in: derived
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Computed from the temperature profile and hypsography; use the same algorithm (e.g., LakeAnalyzer)
          for model and obs.
      detrending_options:
      - none
  - name: PHY_tchla
    unit: ug/L
    description: Total chlorophyll-a (AED2 phytoplankton).
    validation_rank: 10
    emitted_in: output.nc (AED2 enabled)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Requires nutrient inflow loading or biomass collapses to near-zero; chlorophyll is highly parameter-sensitive.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Trophic-state comparison (e.g., seasonal mean chlorophyll) rather than instantaneous match.
      detrending_options:
      - none
  - name: OXY_oxy
    unit: mmol O2/m3
    description: Dissolved oxygen concentration in lake/reservoir water (AED2).
    validation_rank: 11
    emitted_in: output.nc (AED2 enabled)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Hypolimnetic DO depletion strongly controlled by Fsed_oxy sediment demand.
      detrending_options:
      - none
  - name: NIT_nit, NIT_amm, PHS_frp
    unit: mmol/m3
    description: 'Dissolved nutrient species in lake/reservoir water: nitrate, ammonium, filterable reactive
      phosphorus (AED2).'
    validation_rank: 12
    emitted_in: output.nc (AED2 enabled)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Depends on inflow nutrient loading and Fsed_frp internal loading.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Lake level rises continuously, overflow every day. Lake volume grows unrealistically.
  diagnosis: 'Rain in mm/day instead of m/day — 1000x too much precipitation input; GLM expects rain in
    meters per day (m/day). CMFD and MSWX provide precipitation in mm per 3-hour timestep. The correct
    conversion is: mm/3hr * 8 / 1000 = m/day. If the /1000 step is omitted, the lake receives 1000x too
    much rain.

    '
  remedy: Divide rain values by 1000 in convert_met_to_glm.py; convert_met_to_glm; ['Check max rain value
    in met CSV — should be < 0.5 m/day for most climates', 'If max rain > 1.0 m/day, values are likely
    in mm/day — divide by 1000']; validate_outputs() in convert_met_to_glm checks for unrealistic rain
    values
  severity: silent
- id: dt_002
  symptom: Lake dries up rapidly. Extreme evaporation. Lake level drops to zero.
  diagnosis: RelHum as fraction (0-1) instead of percentage (0-100); GLM expects relative humidity as
    percentage (0-100). CMFD/MSWX provide vapor pressure in kPa, which must be converted to RH%. If the
    conversion yields values in 0-1 range instead of 0-100, GLM computes enormous evaporation because
    it interprets
  remedy: Multiply RH by 100 if values are in 0-1 range; convert_met_to_glm; ['Check max RelHum in met
    CSV — should be 60-100 for most climates', 'If max RelHum < 1.0, values are fraction — multiply by
    100']; validate_outputs() checks for RH < 1.0 and warns
  severity: silent
- id: dt_003
  symptom: Negative shortwave radiation values in forcing CSV. May cause NaN in temperature.
  diagnosis: 'Night-time shortwave radiation not clipped to zero after temporal interpolation; When interpolating
    3-hourly forcing to hourly, linear interpolation can produce small negative values for shortwave radiation
    during night-time transitions. GLM may handle these as-is or produce numerical artifacts.

    ; ['
  remedy: Apply max(0, SW) after interpolation; convert_met_to_glm; ['Check min ShortWave value in met
    CSV — must be >= 0']; convert_met_to_glm applies np.maximum(sw, 0.0) by default
  severity: silent
- id: dt_004
  symptom: Inflow temperature always 0 degC or NaN. Artificial cold layer forms at insertion depth.
  diagnosis: 'Temperature column missing from inflow CSV or not estimated from air temperature; GLM reads
    TEMP from inflow CSV. If the column is missing or all zeros, the inflow water enters at 0 degC, creating
    an artificially cold density current that sinks to the bottom and disrupts the thermal structure.

    ; [''c'
  remedy: Estimate inflow temperature from air temperature using T_water = 0.9*T_air + 1.5; convert_inflow_to_glm;
    ['Verify TEMP column exists in inflow CSV', 'Check that values are physically reasonable (0-30 degC
    typically)']; convert_inflow_to_glm auto-estimates T from met CSV if available
  severity: degraded
- id: dt_005
  symptom: Fortran read error on namelist. GLM crashes at startup with parse error.
  diagnosis: 'String values use double quotes instead of single quotes in Fortran namelist; Fortran namelists
    require single-quoted strings (''value''). Double-quoted strings ("value") cause a parse error. This
    is a common mistake when generating namelists from Python, which prefers double quotes.

    ; [''generate_glm_'
  remedy: Replace all double quotes with single quotes in glm3.nml; generate_glm_nml; ['sed -i "s/\\"/\'/g"
    glm3.nml']; generate_glm_nml uses fmt_str() which always produces single quotes
  severity: fatal
- id: dt_006
  symptom: GLM crashes at startup with layer thickness or morphometry error.
  diagnosis: H[] and A[] arrays not monotonically increasing (bottom to top); GLM requires the morphometry
    arrays H[] (elevation) and A[] (area) to be in ascending order from the lake bottom to the surface.
    If they are reversed (top to bottom), or contain non-monotonic values, GLM cannot construct the Lagrangian
  remedy: Sort H[] in ascending order and ensure A[] corresponds correctly; build_morphometry; ['Verify
    H[0] < H[1] < ... < H[n]', 'Verify A[0] <= A[1] <= ... <= A[n]', 'A[0] should be 0 or near-0 (lake
    bottom)']; build_morphometry validates monotonicity in validate_outputs()
  severity: fatal
- id: dt_007
  symptom: Lake volume is unrealistic. Stratification develops at wrong depth.
  diagnosis: 'Depth-area curve has too few points (< 5); With fewer than 5 points in the hypsographic
    curve, the volume approximation is very crude. This can cause the lake to have significantly wrong
    total volume, which affects all water balance calculations and stratification dynamics.

    ; [''build_morphometry'']'
  remedy: Interpolate to at least 10-15 depth levels; build_morphometry; ['Use --num_levels 15 (default)
    when running build_morphometry']; build_morphometry defaults to 15 levels
  severity: degraded
- id: dt_008
  symptom: 'GLM crashes: bsn_vals does not match number of H/A values'
  diagnosis: 'bsn_vals manually set but does not match actual H[] and A[] array lengths; The bsn_vals
    parameter must exactly equal the number of elements in both H[] and A[] arrays. If set manually (e.g.,
    from an old namelist), it may not match the arrays generated by build_morphometry.

    ; [''generate_glm_nml'', ''mo'
  remedy: Auto-compute bsn_vals from len(H) in generate_glm_nml; generate_glm_nml; ['Count elements in
    H array and set bsn_vals to that number']; generate_glm_nml auto-computes bsn_vals = len(H)
  severity: fatal
- id: dt_009
  symptom: 'GLM crashes: lake_depth exceeds morphometry maximum depth'
  diagnosis: 'init_profiles lake_depth > max(H) - min(H); The initial lake depth cannot exceed the maximum
    depth defined by the morphometry (crest_elev - bottom_elev). If it does, GLM cannot create the initial
    layer structure.

    ; [''build_init_profiles'', ''init_profiles_block'']'
  remedy: Clip lake_depth to morphometry range; build_init_profiles; ['Set lake_depth = max(H) - min(H)
    or slightly less']; build_init_profiles clips when --max_morph_depth is provided
  severity: fatal
- id: dt_010
  symptom: num_inflows is 0 but inflow CSV files are referenced. Inflow is silently ignored.
  diagnosis: 'Inconsistency between num_inflows count and inflow file list; If num_inflows = 0, GLM ignores
    all inflow_fl entries. The lake runs without any river input, which may be incorrect. This produces
    no error message.

    ; [''generate_glm_nml'', ''inflow_block'']'
  remedy: Set num_inflows to match the number of inflow CSV files; generate_glm_nml; ['Count inflow CSV
    files and set num_inflows accordingly']; generate_glm_nml auto-sets num_inflows from inflow_csv argument
  severity: silent
- id: dt_011
  symptom: Unable to open meteo file. GLM exits immediately.
  diagnosis: 'meteo_fl path in namelist is relative but GLM run from wrong directory; GLM resolves file
    paths relative to the current working directory, not the namelist file location. If you run GLM from
    a different directory than where the namelist and data files are, all relative paths will fail.

    ; [''run_glm'','
  remedy: Use absolute paths in namelist, or ensure cd to run directory before executing; run_glm; ['cd
    to the directory containing glm3.nml before running', 'Or convert all paths in glm3.nml to absolute
    paths']; run_glm uses cwd=run_dir to ensure correct working directory
  severity: fatal
- id: dt_012
  symptom: Unable to open inflow file. GLM exits during setup.
  diagnosis: 'inflow_fl path does not match actual file location; Same as dt_011 but for inflow files.
    The inflow_fl path must be resolvable from the GLM working directory.

    ; [''run_glm'', ''inflow_block'']'
