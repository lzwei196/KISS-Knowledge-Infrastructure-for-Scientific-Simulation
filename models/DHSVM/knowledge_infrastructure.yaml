# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: DHSVM
  language: c
  implementation:
    id: dhsvm-pnnl-32
    version: '3.2'
    provenance: C; University of Washington / PNNL distributed DHSVM-PNNL 3.2 source (github.com/pnnl/DHSVM-PNNL).
  scientific_reference_version: DHSVM 3.2 (Wigmosta et al. 1994; PNNL/UW release 2018-02-23)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/DHSVM/source/repo/build/DHSVM/sourcecode/DHSVM
    type: work_dir
pipeline:
  stages:
  - s1_terrain_preparation
  - s2_met_forcing
  - s3_soil_parameters
  - s7_execution
  - s8_output_analysis
tools:
  count: 7
  files:
  - tools/build_stream_network.py
  - tools/build_terrain.py
  - tools/convert_forcing.py
  - tools/convert_soil_params.py
  - tools/generate_config.py
  - tools/parse_output.py
  - tools/run_dhsvm.py
inputs:
  forcing:
  - name: Air temperature (Tair)
    unit: deg C
  - name: Wind speed
    unit: m/s
  - name: Relative humidity
    unit: '% (0-100)'
  - name: Incoming shortwave radiation (Swin)
    unit: W/m2
  - name: Incoming longwave radiation (Lwin)
    unit: W/m2
  - name: Precipitation
    unit: m/timestep
  parameters:
  - name: Digital elevation model (DEM)
    unit: m
  - name: Slope
    unit: radians
  - name: Aspect
    unit: degrees (0=N, 90=E, 180=S, 270=W)
  - name: Soil type map
    unit: index into soil parameter table
  - name: Soil depth / per-layer depths
    unit: m
  - name: Soil hydraulic & thermal parameters
    unit: lateral conductivity m/s; exponential decrease (-); max infiltration m/s; porosity, field capacity,
      wilting point (fraction); pore-size distribution; bubbling pressure; bulk density kg/m3; vertical
      conductivity m/s; thermal conductivity & capacity (per layer)
  - name: Vegetation type map
    unit: index into vegetation parameter table
  - name: Vegetation (overstory/understory) parameters
    unit: monthly LAI; monthly albedo; height m; min/max stomatal resistance s/m; fractional & hemispheric
      coverage; trunk space; aerodynamic & radiation attenuation; snow interception capacity & efficiency;
      mass-release drip ratio; moisture threshold; VPD; Rpc; root-zone count, depths, and fractions
  - name: Channel class properties
    unit: Manning's n (-); channel geometry (m)
  - name: Lapse rates and rain/snow thresholds
    unit: temperature lapse rate C/m; precipitation lapse rate m/m; rain & snow threshold C; roughness
      m; reference height m
  initial_conditions:
  - name: Initial snow water equivalent
    unit: m
  - name: Initial soil moisture per layer
    unit: fraction
  - name: Initial interception storage (canopy rain/snow)
    unit: m
  boundary_conditions:
  - name: Basin mask
    unit: 0/1 (1 = inside basin)
  - name: Stream network topology
    unit: segment connectivity, length (m), slope, width (m)
  - name: Flow-routing method
    unit: structural switch
  - name: Grid geometry and time-stepping
    unit: rows, columns, grid spacing (m); timestep (hours); start/end dates
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - Streamflow
  - Swq
  - TotalET
  - SoilMoist
  - TableDepth
  - MassError
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=-0.435, KGE=-0.723, R=0.015, 2 scorecard(s)'
  metrics:
    best_nse: -0.4353
    best_kge: -0.7225
    best_r: 0.0155
summary:
  total_tools: 7
  total_stage_docs: 5
  total_diagnostic_triplets: 20
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
