template_version: "3.5"

identity:
  model_id: "OpenGeoSys"
  scientific_reference_version: "OpenGeoSys 6 (OGS-6) THMC finite-element multiphysics; doxygen-stable 6.5.7 lineage"
  implementation:
    id: "opengeosys-6"
    version: "6.5.7"
    provenance: "C++23; UFZ/OpenGeoSys community FEM multiphysics solver (git a5c00a5, 2026-03), optional Python bindings."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "BSD-3-Clause"
  repo_url: "https://gitlab.opengeosys.org/ogs/ogs"

boundary:
  scope_in:
    - "Coupled thermo-hydro-mechanical-chemical (THMC) processes in porous and fractured media"
    - "Single-phase saturated (Darcy) liquid flow and steady-state diffusion"
    - "Variably-saturated (Richards) and two-phase non-isothermal flow"
    - "Heat conduction and advective heat transport (incl. borehole heat exchanger / wellbore)"
    - "Solid deformation: small/large deformation, poro- and thermo-mechanics, phase-field fracture"
    - "Advective-diffusive-reactive component (solute) transport with external chemistry coupling"
  scope_out:
    - "No internal unit-management system; unit consistency is the user's responsibility"
    - "Time discretization limited to backward-Euler scheme only"
    - "No native structured-grid or geometry-based BC selection (OGS-6 uses boundary submeshes)"
  spatial: "3-D"
  temporal: "event"
  closure: "both"
  notes: "Domain is an unstructured FEM mesh (VTU), supporting 1D/2D/3D; nodes carry 3D coords even in 2D (z=0). Process equations are conservation-based: mass-balance for flow/transport and energy-balance for heat; mechanics enforces momentum balance. Closure is per-process and assembled monolithically or via staggered (operator-split) coupling selected in the project file. All quantities are strict SI; there is no internal unit conversion. 'event' temporal denotes a transient simulation over a user-defined time window (also supports steady-state single-step)."

inputs:
  forcing:
    - category: "forcing"
      name: "recharge / surface flux"
      unit: "m/s"
      source_kind: "user_provided"
      model_input_format: "Neumann BC on boundary submesh, optionally time-dependent via <curves> (time in s, SI values)"
      notes: "OGS is agnostic to the meteorological source; it consumes only SI-unit boundary time series."
    - category: "forcing"
      name: "prescribed head / pressure boundary"
      unit: "Pa"
      source_kind: "user_provided"
      model_input_format: "Dirichlet BC on boundary submesh; time-dependent via <curves> or CurveScaledParameter"
    - category: "forcing"
      name: "prescribed temperature boundary"
      unit: "K"
      source_kind: "user_provided"
      model_input_format: "Dirichlet BC / initial condition on boundary submesh"
    - category: "forcing"
      name: "well pumping / injection rate"
      unit: "m^3/s"
      source_kind: "user_provided"
      model_input_format: "nodal source_term"
  parameters:
    - category: "material"
      name: "intrinsic permeability"
      unit: "m^2"
      source_kind: "calibrated"
      model_input_format: "MPL medium property (Constant or state-dependent); per-MaterialID"
      notes: "Intrinsic permeability kappa, NOT hydraulic conductivity (m/s) nor Darcy; typical 1e-18 to 1e-8 m^2."
    - category: "material"
      name: "porosity"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "MPL medium property; may evolve (transport_porosity)"
      notes: "Must be > 0 for transient storage; typical 0.01 to 0.6."
    - category: "material"
      name: "specific storage"
      unit: "1/Pa"
      source_kind: "calibrated"
      model_input_format: "MPL 'storage' property"
      notes: "Specific storage S_s; must be > 0 for transient flow; typical 1e-12 to 1e-6."
    - category: "material"
      name: "liquid density"
      unit: "kg/m^3"
      source_kind: "dataset_lookup"
      model_input_format: "MPL AqueousLiquid phase property (Constant or T/p-dependent, e.g. IAPWS97)"
    - category: "material"
      name: "liquid dynamic viscosity"
      unit: "Pa*s"
      source_kind: "dataset_lookup"
      model_input_format: "MPL AqueousLiquid phase property (Constant or T-dependent)"
    - category: "material"
      name: "solid density"
      unit: "kg/m^3"
      source_kind: "dataset_lookup"
      model_input_format: "MPL Solid phase property"
    - category: "material"
      name: "thermal conductivity"
      unit: "W/(m*K)"
      source_kind: "calibrated"
      model_input_format: "MPL medium/phase property; may be anisotropic"
    - category: "material"
      name: "specific heat capacity"
      unit: "J/(kg*K)"
      source_kind: "dataset_lookup"
      model_input_format: "MPL phase property"
    - category: "material"
      name: "van Genuchten entry pressure"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "SaturationVanGenuchten MPL capillary-pressure model parameter p_b"
      notes: "Entry pressure in Pa, NOT alpha in 1/cm."
    - category: "material"
      name: "van Genuchten exponent"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "SaturationVanGenuchten MPL parameter (m = 1 - 1/n)"
    - category: "material"
      name: "residual liquid saturation"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "SaturationVanGenuchten / RelPermVanGenuchten MPL parameter"
    - category: "material"
      name: "Biot coefficient"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "MPL/process property; poro-mechanical coupling (per layer)"
      notes: "HydroMechanics / poromechanics; controls effective-stress computation."
    - category: "material"
      name: "Young's modulus"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "LinearElasticIsotropic solid-model parameter"
    - category: "material"
      name: "Poisson's ratio"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "LinearElasticIsotropic solid-model parameter"
    - category: "material"
      name: "thermal expansivity"
      unit: "1/K"
      source_kind: "calibrated"
      model_input_format: "MPL/solid-model parameter; ThermoMechanics"
  initial_conditions:
    - category: "initial_condition"
      name: "initial primary-variable fields"
      unit: "process-dependent (Pa, K, m, mol/m^3)"
      source_kind: "user_provided"
      model_input_format: "Per process_variable <initial_condition> in .prj (Constant, mesh field, or function)"
      notes: "Every process variable requires an initial condition; a poor IC can make the Newton solver diverge (use Picard or reduced first timestep)."
  boundary_conditions:
    - category: "control"
      name: "specific body force (gravity)"
      unit: "m/s^2"
      source_kind: "user_provided"
      model_input_format: "<specific_body_force> vector; must have exactly mesh-dimension components (2D '0 -9.81', 3D '0 0 -9.81')"
    - category: "control"
      name: "process type"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "<process><type> enum (LIQUID_FLOW, RICHARDS_FLOW, HT, HYDRO_MECHANICS, TH2M, COMPONENT_TRANSPORT, ...)"
      notes: "Selects governing equations and the set of primary variables."
    - category: "control"
      name: "coupling scheme"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "monolithic vs staggered (operator-split) selection in time_loop"
    - category: "control"
      name: "time-stepping scheme and window"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "t_initial/t_end/delta_t (SI seconds) with FixedTimeStepping / IterationNumberBased / EvolutionaryPIDcontroller / SingleStep"
      notes: "All time values in seconds (1 day = 86400 s, 1 year ~ 3.1536e7 s)."
    - category: "control"
      name: "nonlinear solver type"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "<nonlinear_solver> Newton or Picard, with damping and Jacobian-recompute interval"
    - category: "control"
      name: "convergence criterion and tolerance"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "DeltaX vs Residual criterion with per-variable abstol/reltol"
      notes: "Tolerances scale to variable magnitude (e.g. pressure DeltaX abstol ~1e-6, displacement ~1e-10)."
    - category: "control"
      name: "linear solver"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Eigen (SparseLU, BiCGSTAB+ILUT) or PETSc"
    - category: "control"
      name: "FE element order"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "<order> in process_variables (1=linear, 2=quadratic); must match mesh element order"

processes:
  modules:
    - name: "CLI_Driver"
      role: "driver"
      brief: "Parses .prj XML, builds mesh/processes/solvers, runs the Simulation; enables FP exceptions and signal handling."
    - name: "TimeLoop"
      role: "integrator"
      brief: "Time-step controller: preTimestep -> nonlinear solve (monolithic or staggered) -> postTimestep -> output; adaptive dt via computeTimeStepping (backward Euler)."
    - name: "Process_base"
      role: "process_solver"
      brief: "Abstract FEM process: assembles global matrices/residual, owns primary and secondary variables, runs computeSecondaryVariableConcrete post-solve."
    - name: "LiquidFlow"
      role: "process_solver"
      brief: "Single-phase saturated Darcy flow; primary=pressure; secondary darcy_velocity."
    - name: "RichardsFlow"
      role: "process_solver"
      brief: "Variably-saturated flow; primary=pressure (negative=suction); uses capillary-pressure-saturation + relative-permeability MPL models; secondary saturation."
    - name: "HeatConduction"
      role: "process_solver"
      brief: "Conductive heat transport; primary=temperature; secondary heat_flux."
    - name: "HT"
      role: "process_solver"
      brief: "Coupled hydro-thermal flow and heat (pressure+temperature); monolithic or staggered."
    - name: "ComponentTransport"
      role: "process_solver"
      brief: "Advective-diffusive-reactive solute transport per component; optionally couples to external chemistry (PHREEQC). Includes RichardsComponentTransport."
      applicability: "reactive transport requires external chemistry coupling"
    - name: "Mechanics"
      role: "process_solver"
      brief: "Solid deformation and poro/thermo-mechanical coupling (SmallDeformation, HydroMechanics, RichardsMechanics, ThermoMechanics); primary=displacement; IP state sigma/epsilon."
    - name: "TwoPhaseFlow"
      role: "process_solver"
      brief: "Non-isothermal two-phase (gas+liquid) flow with phase change (TH2M, TwoPhaseFlowWithPP); many constitutive secondary outputs."
      applicability: "two-phase / TH2M processes"
    - name: "MaterialPropertyLib"
      role: "allocator"
      brief: "Constitutive property models (van Genuchten, permeability, density, viscosity, thermal conductivity) evaluated per integration point via a shared VariableArray."
    - name: "NonlinearSolver"
      role: "integrator"
      brief: "Newton/Picard nonlinear solver with damping and Jacobian-recompute control; drives linear solves to convergence each timestep."
    - name: "Assembly"
      role: "allocator"
      brief: "Local-to-global FEM assembly; analytical / central / forward-difference Jacobian assemblers."
    - name: "BoundaryConditionAndSourceTerm"
      role: "optional_module"
      brief: "Applies Dirichlet/Neumann/Robin BCs and nodal source terms (incl. Python-defined BCs) by constraining/modifying the global system."
  internal_edges:
    - from: "CLI_Driver"
      to: "TimeLoop"
      kind: "invokes"
      brief: "Simulation hands assembled processes to TimeLoop.run."
    - from: "CLI_Driver"
      to: "Inputs"
      kind: "consumes_input"
      brief: "Reads .vtu mesh, optional .gml geometry, and parameters/curves from the .prj."
    - from: "TimeLoop"
      to: "Process_base"
      kind: "invokes"
      brief: "preTimestep / assemble / postTimestep for each process per step."
    - from: "TimeLoop"
      to: "NonlinearSolver"
      kind: "invokes"
      brief: "Each timestep solves the nonlinear system to convergence."
    - from: "TimeLoop"
      to: "Process_base"
      kind: "reads_state"
      brief: "Staggered scheme shares converged primary solutions between sibling processes by process_id."
    - from: "NonlinearSolver"
      to: "Assembly"
      kind: "invokes"
      brief: "Newton iteration requests residual + Jacobian assembly."
    - from: "NonlinearSolver"
      to: "Process_base"
      kind: "writes_state"
      brief: "Converged solution vector written back as updated primary variables."
    - from: "Assembly"
      to: "MaterialPropertyLib"
      kind: "invokes"
      brief: "Local assembler evaluates MPL constitutive properties at integration points."
    - from: "MaterialPropertyLib"
      to: "MaterialPropertyLib"
      kind: "reads_state"
      brief: "Property models read sibling properties via the VariableArray (rel-perm reads saturation; density reads p, T)."
    - from: "BoundaryConditionAndSourceTerm"
      to: "Process_base"
      kind: "writes_state"
      brief: "BCs modify global RHS/matrix and constrain primary variables."
    - from: "LiquidFlow"
      to: "darcy_velocity"
      kind: "produces_output"
      brief: "computeSecondaryVariableConcrete computes Darcy flux from the converged pressure field."
    - from: "RichardsFlow"
      to: "saturation"
      kind: "writes_state"
      brief: "Saturation derived from pressure via the capillary-pressure model, stored as a secondary variable."
    - from: "HeatConduction"
      to: "temperature"
      kind: "writes_state"
      brief: "Advances the nodal temperature field by implicit time integration."
    - from: "HT"
      to: "pressure"
      kind: "reads_state"
      brief: "Heat balance reads pressure-driven Darcy advection (and the flow equation reads temperature) in the coupled solve."
    - from: "ComponentTransport"
      to: "concentration"
      kind: "writes_state"
      brief: "Per-component transport equation advances the concentration field."
    - from: "TwoPhaseFlow"
      to: "gas_pressure"
      kind: "writes_state"
      brief: "Non-isothermal two-phase solve advances the gas-phase pressure primary variable."
    - from: "TwoPhaseFlow"
      to: "saturation"
      kind: "writes_state"
      brief: "Phase saturation derived from the capillary-pressure-saturation model in the two-phase solve."
    - from: "Mechanics"
      to: "displacement"
      kind: "writes_state"
      brief: "Solves momentum balance for the nodal displacement field."
    - from: "Mechanics"
      to: "stress"
      kind: "writes_state"
      brief: "Constitutive update writes integration-point stress (sigma) from strain history."
    - from: "Mechanics"
      to: "strain"
      kind: "writes_state"
      brief: "Strain (epsilon) computed from the displacement gradient at integration points."
    - from: "Mechanics"
      to: "porosity"
      kind: "reads_state"
      brief: "Poromechanical coupling: deformation updates porosity/permeability used by the flow process."
    - from: "TimeLoop"
      to: "Outputs"
      kind: "produces_output"
      brief: "outputSolutions writes selected primary/secondary fields to VTU per output timestep, collected by a PVD index."

states:
  variables:
    - name: "pressure"
      unit: "Pa"
      role: "prognostic"
    - name: "temperature"
      unit: "K"
      role: "prognostic"
    - name: "displacement"
      unit: "m"
      role: "prognostic"
    - name: "concentration"
      unit: "mol/m^3"
      role: "prognostic"
    - name: "gas_pressure"
      unit: "Pa"
      role: "prognostic"
    - name: "capillary_pressure"
      unit: "Pa"
      role: "prognostic"
    - name: "saturation"
      unit: "-"
      role: "diagnostic"
    - name: "darcy_velocity"
      unit: "m/s"
      role: "diagnostic"
    - name: "stress"
      unit: "Pa"
      role: "prognostic"
    - name: "strain"
      unit: "-"
      role: "diagnostic"
    - name: "porosity"
      unit: "-"
      role: "diagnostic"
    - name: "heat_flux"
      unit: "W/m^2"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "pressure"
    validation_rank: 2
    unit: "Pa"
    description: "Pore/liquid (or gas) pressure at FEM nodes; the primary variable of flow processes."
    emitted_in: "{prefix}_ts_{step}_t_{time}.vtu (PointData), indexed by .pvd"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Observation must be co-located with a mesh node; pressure head vs absolute pressure unit must be reconciled (SI Pa)."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "temperature"
    validation_rank: 1
    unit: "K"
    description: "Temperature field at FEM nodes; primary variable of thermal/heat-transport processes."
    emitted_in: "{prefix}_ts_{step}_t_{time}.vtu (PointData)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Observation depth/location must match a mesh node; units in K."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "displacement"
    validation_rank: 3
    unit: "m"
    description: "Nodal solid displacement vector; primary variable of mechanics processes."
    emitted_in: "{prefix}_ts_{step}_t_{time}.vtu (PointData)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Compare against extensometer/displacement-sensor records at matching location and component."]
      detrending_options: ["none"]
  - var: "darcy_velocity"
    validation_rank: 4
    unit: "m/s"
    description: "Darcy (specific discharge) flux vector derived from pressure gradient and permeability."
    emitted_in: "{prefix}_ts_{step}_t_{time}.vtu (CellData)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Cell-based secondary variable derived from the converged primary solution; direct flux observations are rare."]
      detrending_options: ["none"]
  - var: "stress"
    validation_rank: 5
    unit: "Pa"
    description: "Cauchy/effective stress tensor at integration points (mechanics)."
    emitted_in: "{prefix}_ts_{step}_t_{time}.vtu (CellData)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Effective stress depends on Biot coefficient and pore pressure; compare against in-situ stress/pressure-cell records."]
      detrending_options: ["none"]
  - var: "saturation"
    validation_rank: 6
    unit: "-"
    description: "Liquid saturation from the capillary-pressure-saturation model (Richards/two-phase)."
    emitted_in: "{prefix}_ts_{step}_t_{time}.vtu"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Compare against moisture-probe / saturation sensor; bounded in [0,1]."]
      detrending_options: ["none"]
  - var: "concentration"
    validation_rank: 7
    unit: "mol/m^3"
    description: "Solute/component concentration field (component or reactive transport)."
    emitted_in: "{prefix}_ts_{step}_t_{time}.vtu"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Breakthrough-curve comparison; sample location must match a mesh node."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Plume-extent comparison against a sampled spatial field on the mesh footprint."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "intrinsic permeability"
      to: "pressure"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "clay-rock / Richards-flow THM, pore-pressure response"
      citations: ["buchwald2024_ogs_doe_feexperiment", "simo2025_thm_benchmark_cox"]
    - from: "thermal conductivity"
      to: "temperature"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "heat-transport / THM"
      citations: ["buchwald2024_ogs_doe_feexperiment", "simo2025_thm_benchmark_cox"]
    - from: "Biot coefficient"
      to: "stress"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "poromechanics; effective stress per layer"
      citations: ["simo2025_thm_benchmark_cox"]
    - from: "Biot coefficient"
      to: "pressure"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "thermal pressurization / hydro-mechanical coupling"
      citations: ["buchwald2024_ogs_doe_feexperiment", "simo2025_thm_benchmark_cox"]
    - from: "injection temperature"
      to: "temperature"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "HT heat-transport / aquifer thermal energy storage"
      citations: ["manafi2026_htates_doe"]
    - from: "injected water volume"
      to: "temperature"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: management
      applicability: "HT-ATES recovery / thermal plume"
      citations: ["manafi2026_htates_doe"]
    - from: "geothermal gradient"
      to: "temperature"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "HT-ATES background thermal field"
      citations: ["manafi2026_htates_doe"]
    - from: "thermal dispersivity"
      to: "temperature"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "HT advective-dispersive heat transport"
      citations: ["manafi2026_htates_doe"]
    - from: "intrinsic permeability"
      to: "temperature"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "HT advective heat transport (permeability controls Darcy velocity)"
      citations: ["manafi2026_htates_doe"]
    - from: "surface-complexation selectivity"
      to: "concentration"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: parameter
      applicability: "reactive (sorption) transport; domain-transferred from sorption-chemistry GSA"
      citations: ["ayoub2020_cesium_sorption_morris_sobol"]
    - from: "mineral site density"
      to: "concentration"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: parameter
      applicability: "reactive (sorption) transport; domain-transferred"
      citations: ["ayoub2020_cesium_sorption_morris_sobol"]
  _caveat: "OGS-specific sensitivity literature is design-of-experiment / screening-based (Buchwald 2024 FE-experiment, Manafi 2026 HT-ATES) reporting heavy-hitter rankings, NOT published numerical Sobol/Morris/EFAST indices; therefore every edge is graded MEDIUM (no edge can reach HIGH from this literature per the quantitative-index rule). The surface-complexation-selectivity and mineral-site-density edges (ayoub2020) are cross-family, domain-transferred reactive-transport-chemistry GSA, not OGS-native runs. The manafi2026 DOI suffix (10.1016/j.geoen.2026.213??) is unverified (publisher page returned HTTP 403)."
  citation_index:
    buchwald2024_ogs_doe_feexperiment:
      short_citation: "Buchwald, Kolditz & Nagel 2024"
      doi: "10.1016/j.ress.2023.109903"
      note: "DoE-based history matching of a coupled Richards-flow/thermo-mechanical OGS model (FE-experiment, Mont Terri); screening identifies clay-rock permeability and thermal conductivity as heavy hitters."
    simo2025_thm_benchmark_cox:
      short_citation: "Simo et al. 2025"
      doi: "10.1007/s11440-025-02683-y"
      note: "Multi-code THM benchmark (incl. OGS) for Callovo-Oxfordian claystone; temperature/pore-pressure/stress depend on Biot coefficient, anisotropic permeability and thermal conductivity."
    manafi2026_htates_doe:
      short_citation: "Manafi et al. 2026"
      doi: "10.1016/j.geoen.2026.213"
      note: "DoE + surrogate screening of an OGS HT-ATES model; injection temperature, water volume, geothermal gradient and dispersivity are the critical heat-recovery controls. DOI suffix unverified (publisher page blocked)."
    ayoub2020_cesium_sorption_morris_sobol:
      short_citation: "Ayoub et al. 2020"
      doi: "10.1016/j.apgeochem.2020.104607"
      note: "Morris + Sobol GSA of cesium sorption chemistry for deep geological repositories; surface-complexation/cation-exchange selectivity and site density dominate Kd. Cross-family proxy for the OGS reactive-transport process class."

safety:
  hazards:
    - id: "pressure_unit_kPa_not_Pa"
      kind: "weather_file_semantic"
      description: "Pressure supplied in kPa instead of Pa gives a field 1000x too low and negligible flow; no error message."
      severity: "silent"
    - id: "temperature_celsius_not_kelvin"
      kind: "weather_file_semantic"
      description: "Temperature in Celsius instead of Kelvin computes fluid properties near absolute zero; runs without error."
      severity: "silent"
    - id: "permeability_as_conductivity_or_darcy"
      kind: "coefficient_runtime_silent_fallback"
      description: "Intrinsic permeability supplied as hydraulic conductivity (m/s) or Darcy instead of m^2 makes the medium ~1e7x too permeable; velocities physically impossible."
      severity: "silent"
    - id: "time_values_not_seconds"
      kind: "control_semantic"
      description: "t_initial/t_end/delta_t in days or years instead of seconds causes t_end to be reached almost instantly over a negligible period."
      severity: "silent"
    - id: "vangenuchten_alpha_not_entry_pressure"
      kind: "coefficient_runtime_silent_fallback"
      description: "van Genuchten alpha (1/cm) not converted to entry pressure p_b (Pa) shifts the retention curve and saturation transitions to wrong suctions."
      severity: "silent"
    - id: "recharge_flux_units"
      kind: "weather_file_semantic"
      description: "Recharge in mm/day used directly as m/s (or partially converted) is up to 86.4M x too high and floods the domain."
      severity: "silent"
    - id: "storage_zero_transient"
      kind: "initial_condition_semantic"
      description: "Specific storage = 0 in a transient simulation zeroes the mass matrix; the equation degenerates to steady-state and pressure never changes."
      severity: "silent"
    - id: "porosity_zero_transient"
      kind: "initial_condition_semantic"
      description: "Porosity = 0 eliminates storage capacity; transient response is absent though the run completes."
      severity: "silent"
    - id: "missing_boundary_submesh"
      kind: "control_semantic"
      description: "OGS-6 applies BCs on separate boundary submesh VTU files; a missing submesh crashes at startup ('Could not find mesh')."
      severity: "fatal"
    - id: "body_force_dimension_mismatch"
      kind: "control_semantic"
      description: "<specific_body_force> must have exactly mesh-dimension components; a mismatch crashes with 'wrong number of components' or applies gravity in the wrong direction."
      severity: "fatal"
    - id: "case_sensitive_xml_tag"
      kind: "parser_semantic"
      description: "Project-file XML tags are case-sensitive; a misspelled tag is fatal ('unknown tag' / 'could not find')."
      severity: "fatal"
    - id: "fe_order_mesh_mismatch"
      kind: "control_semantic"
      description: "FE <order> not matching the mesh element order (e.g. linear mesh with order=2) causes shape-function failure / wrong results for quadratic elements."
      severity: "degraded"
    - id: "zero_fluid_property_division"
      kind: "numerical_instability"
      description: "Zero viscosity, density, or permeability (e.g. from a T-dependent model at extreme T) causes division-by-zero in Darcy's law and a NaN/FPE crash mid-run."
      severity: "fatal"
    - id: "newton_diverges_poor_ic"
      kind: "numerical_instability"
      description: "Newton solver with an initial condition far from the solution produces a singular Jacobian / huge updates and diverges to NaN on the first timestep."
      severity: "degraded"
    - id: "convergence_criterion_mismatch"
      kind: "numerical_instability"
      description: "Convergence criterion type (DeltaX vs Residual) or tolerance mismatched to variable magnitude prevents convergence; the timestep is repeatedly halved."
      severity: "degraded"
  validation_limits:
    - "Only backward-Euler time discretization is available; sub-timestep transients cannot be resolved by a higher-order scheme."
    - "No internal unit system; the model cannot detect or correct unit-inconsistent inputs (strict SI assumed)."
    - "Continuum porous/fractured-media FEM assumption; not a structured-grid or discrete-particle method."
    - "Reactive transport requires external chemistry coupling (PHREEQC/MFront); chemistry is not native to the FEM core."
  warnings:
    - "Secondary variables (darcy_velocity, saturation, stress) are computed in a post-solve pass and derive from the converged primary solution via integration-point-to-nodal extrapolation; they lag the primary field."
    - "In staggered (operator-split) multi-process coupling, results depend on process ordering (process_id); monolithic vs staggered choice can change the coupled solution."
    - "Use Picard before Newton for robust early convergence when the initial guess is poor."
  assumptions:
    - statement: "All inputs and outputs are in strict SI base units; OGS performs no internal unit conversion."
      scope: "all processes and material properties"
      source: "OpenGeoSys user guide — Media block; project-file documentation (no internal unit management)"
      status: "adopted"
    - statement: "Permeability is the intrinsic permeability kappa [m^2], distinct from hydraulic conductivity [m/s] and Darcy."
      scope: "flow processes (LiquidFlow, Richards, HT, two-phase)"
      source: "OGS Media/MaterialPropertyLib permeability property documentation"
      status: "adopted"
    - statement: "Conservation closure is per-process: mass-balance for flow/transport and energy-balance for heat, assembled monolithically or via staggered coupling; mechanics enforces momentum balance."
      scope: "coupled THMC time loop"
      source: "OGS Process Introduction and Time-loop user-guide documentation; ProcessLib/TimeLoop source"
      status: "adopted"
    - statement: "Spatial geometry is an unstructured FEM mesh with 3D nodal coordinates even for 2D problems (z=0), and BCs are applied on separate boundary submeshes."
      scope: "mesh / boundary-condition setup"
      source: "OGS user guide — meshes/boundary conditions; OGS-6 boundary submesh requirement"
      status: "adopted"
