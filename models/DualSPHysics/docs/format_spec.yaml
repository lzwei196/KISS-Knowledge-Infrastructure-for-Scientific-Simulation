model:
  name: "DualSPHysics"
  version: "5.4.355"
  domain: "coastal_ocean"
  description: "3D meshless Smoothed Particle Hydrodynamics (SPH) solver for free-surface flows"
  binary_path: "/home/server/knowledge-dissection-toolkit/auto_dissect/_work/DualSPHysics/source/repo/bin/linux/DualSPHysics5.4CPU_linux64"
  auxiliary_binaries:
    gencase: "/home/server/knowledge-dissection-toolkit/auto_dissect/_work/DualSPHysics/source/repo/bin/linux/GenCase_linux64"
    partvtk: "/home/server/knowledge-dissection-toolkit/auto_dissect/_work/DualSPHysics/source/repo/bin/linux/PartVTK_linux64"
    measuretool: "/home/server/knowledge-dissection-toolkit/auto_dissect/_work/DualSPHysics/source/repo/bin/linux/MeasureTool_linux64"
    isosurface: "/home/server/knowledge-dissection-toolkit/auto_dissect/_work/DualSPHysics/source/repo/bin/linux/IsoSurface_linux64"

inputs:
  case_definition:
    format: "XML"
    description: "XML file defining geometry, physics, and simulation parameters"
    sections:
      - name: "casedef"
        description: "Case definition: constants, geometry, material markers"
      - name: "execution"
        description: "Execution parameters: time, viscosity, kernel, boundary"

  forcing:
    - name: "gravity"
      unit: "m/s^2"
      valid_range: [-20.0, 0.0]
      description: "Gravitational acceleration (z-component)"
    - name: "wave_height"
      unit: "m"
      valid_range: [0.001, 20.0]
      description: "Input wave height for wave generation cases"
    - name: "wave_period"
      unit: "s"
      valid_range: [0.5, 30.0]
      description: "Input wave period for wave generation cases"

  parameters:
    critical:
      - name: "dp"
        unit: "m"
        valid_range: [0.001, 0.1]
        description: "Particle spacing — fundamental resolution parameter. Cost scales as dp^-3 in 3D."
      - name: "rhop0"
        unit: "kg/m^3"
        valid_range: [1.0, 13600.0]
        description: "Reference density (1000 for water)"
      - name: "gamma"
        unit: "dimensionless"
        valid_range: [1.0, 10.0]
        description: "Polytropic constant for equation of state (typically 7)"
      - name: "coefsound"
        unit: "dimensionless"
        valid_range: [10.0, 40.0]
        description: "Speed of sound multiplier (10-20x max expected velocity)"
      - name: "coefh"
        unit: "dimensionless"
        valid_range: [0.8, 2.0]
        description: "Smoothing length coefficient: h = coefh * sqrt(3*dp^2)"
      - name: "CflNumber"
        unit: "dimensionless"
        valid_range: [0.001, 1.0]
        description: "Courant-Friedrichs-Lewy number"

    execution:
      - name: "StepAlgorithm"
        valid_range: [1, 2]
        description: "1=Verlet, 2=Symplectic time integration"
      - name: "Kernel"
        valid_range: [1, 2]
        description: "1=Cubic spline, 2=Wendland quintic"
      - name: "ViscoTreatment"
        valid_range: [1, 3]
        description: "1=Artificial, 2=Laminar+SPS, 3=Laminar"
      - name: "Visco"
        description: "Viscosity coefficient. TRAP: units depend on ViscoTreatment (dimensionless for artificial, m^2/s for laminar)"
      - name: "Boundary"
        valid_range: [1, 2]
        description: "1=DBC (Dynamic), 2=mDBC (Modified Dynamic)"
      - name: "DensityDT"
        valid_range: [0, 3]
        description: "Density Diffusion Term mode (0=off, 2=Fourtakas recommended)"
      - name: "DensityDTvalue"
        valid_range: [0.05, 0.2]
        description: "DDT coefficient (0.1 standard)"
      - name: "Shifting"
        valid_range: [0, 3]
        description: "Particle shifting mode"
      - name: "TimeMax"
        unit: "s"
        valid_range: [0.001, 86400.0]
        description: "Maximum simulation time"
      - name: "TimeOut"
        unit: "s"
        valid_range: [0.0001, 3600.0]
        description: "Output save interval"

    density_filters:
      - name: "RhopOutMin"
        unit: "kg/m^3"
        valid_range: [100.0, 999.0]
        description: "Minimum valid density (default 700)"
      - name: "RhopOutMax"
        unit: "kg/m^3"
        valid_range: [1001.0, 5000.0]
        description: "Maximum valid density (default 1300)"

outputs:
  primary:
    - name: "position"
      unit: "m"
      valid_range: [-1e6, 1e6]
      description: "Particle positions (x, y, z)"
    - name: "velocity"
      unit: "m/s"
      valid_range: [-100.0, 100.0]
      description: "Particle velocities (vx, vy, vz)"
    - name: "density"
      unit: "kg/m^3"
      valid_range: [700.0, 1300.0]
      description: "Particle density (rhop)"
    - name: "pressure"
      unit: "Pa"
      valid_range: [-1e6, 1e8]
      description: "Particle pressure"
    - name: "vorticity"
      unit: "1/s"
      valid_range: [-1000.0, 1000.0]
      description: "Vorticity magnitude"

  formats:
    native:
      extension: ".bi4"
      description: "Binary particle data per timestep (Part_XXXX.bi4)"
    vtk:
      extension: ".vtk"
      description: "VTK files via PartVTK post-processing"
    csv:
      extension: ".csv"
      description: "CSV time series via MeasureTool"

  log_files:
    - name: "Run.out"
      description: "Main simulation log with timing, particle counts, warnings"
    - name: "Run.csv"
      description: "Single-line CSV with execution parameters summary"
    - name: "RunPARTs.csv"
      description: "Per-timestep particle statistics"

known_issues:
  - id: "viscosity_trap"
    severity: "CRITICAL"
    description: "Switching ViscoTreatment without adjusting Visco value. Artificial uses dimensionless (0.01), laminar uses m^2/s (1e-6). Mismatch gives 10,000x error."
  - id: "dp_cost_scaling"
    severity: "HIGH"
    description: "Halving dp increases particle count 8x in 3D and runtime ~16x. Start coarse for testing."
  - id: "boundary_gaps"
    severity: "HIGH"
    description: "Gaps in boundary particle geometry cause particle leakage. Always visualize initial distribution."
  - id: "PartsOutMax_deprecated"
    severity: "LOW"
    description: "XML option 'PartsOutMax' is deprecated. Use 'MinFluidStop' instead."
