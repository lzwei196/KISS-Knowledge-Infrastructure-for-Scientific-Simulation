safety:
  hazards:
    - id: "weather_globrad_units_W_vs_MJ"
      kind: "weather_file_semantic"
      description: "GlobRad supplied as daily-total MJ/m^2/d where Daisy expects daily-mean W/m^2 (~12x too low) silently stunts growth and yield. (dt_001)"
      severity: "silent"
    - id: "weather_airtemp_kelvin"
      kind: "weather_file_semantic"
      description: "AirTemp left in Kelvin instead of dgC gives ~280 values causing crash or extreme ET. (dt_002)"
      severity: "fatal_or_silent"
    - id: "weather_precip_subdaily_as_daily"
      kind: "weather_file_semantic"
      description: "Sub-daily precipitation (mm/3h, mm/h) treated as mm/d delivers 1/8 to 1/24 of true rainfall, distorting the water balance. (dt_003)"
      severity: "silent"
    - id: "weather_range_not_spanning_sim"
      kind: "weather_file_semantic"
      description: ".dwf Begin/End dates do not cover the (time)-(stop) period, triggering 'No weather data for requested period'. (dt_018)"
      severity: "fatal"
    - id: "soil_texture_percent_vs_fraction"
      kind: "soil_semantic"
      description: "Texture given as percent (0-100) instead of fraction (0-1) makes clay+silt+sand sum >1 and crashes at startup. (dt_004)"
      severity: "fatal"
    - id: "soil_bulk_density_kgm3_vs_gcm3"
      kind: "soil_semantic"
      description: "Bulk density in kg/m^3 (e.g. 1450) used where g/cm^3 (1.45) expected yields impossibly dense soil and instant wilting. (dt_005)"
      severity: "silent"
    - id: "soil_horizon_depth_sign"
      kind: "soil_semantic"
      description: "Horizon depths given positive instead of negative (Daisy convention: below-surface depths are negative) produces a zero/negative-thickness column. (dt_006)"
      severity: "fatal"
    - id: "soil_ksat_ms_vs_cmh"
      kind: "soil_semantic"
      description: "K_sat in m/s used where cm/h expected is ~360000x too high; water drains instantly and ponding never occurs. (dt_007)"
      severity: "silent"
    - id: "soil_vg_alpha_m_vs_cm"
      kind: "soil_semantic"
      description: "van Genuchten alpha in m^-1 used where cm^-1 expected is 100x too high, distorting the retention curve / field capacity. (dt_008)"
      severity: "silent"
    - id: "crop_name_case_mismatch"
      kind: "control_semantic"
      description: "Crop name in management not matching the case-sensitive crop.dai library entry triggers an 'Unknown crop' error. (dt_009)"
      severity: "fatal"
    - id: "harvest_wait_never_satisfied"
      kind: "control_semantic"
      description: "Harvest wait condition with no date fallback (or sowing too late) never fires, producing an empty harvest.dlf. (dt_010)"
      severity: "silent"
    - id: "management_wait_no_timeout_hang"
      kind: "control_semantic"
      description: "A management wait condition with no date timeout can never be satisfied and the simulation hangs indefinitely. (dt_011)"
      severity: "fatal"
    - id: "richards_negative_dt_convergence"
      kind: "numerical_instability"
      description: "Extreme soil hydraulic conditions or irrigation >50 mm/h drive Richards-solver 'Negative dt' / convergence failures. (dt_013)"
      severity: "degraded"
    - id: "organic_n_volatilization_no_incorporation"
      kind: "control_semantic"
      description: "Surface-applied organic N with ~100% volatilization (or very high C/N slow pool) leaves fertilizer with no effect on growth. (dt_017)"
      severity: "silent"
  validation_limits:
    - "Crop parameterizations are calibrated primarily for Northern European / temperate conditions; generalization beyond that climate is not established (only temperate tutorial validation; a Canadian RISMA ON2 soil-moisture test was marginal)."
    - "1-D vertical column: no native lateral flow or catchment routing (distributed multi-column / 2-D water flow is an experimental mode; routing requires external coupling)."
    - "Largest internal timestep is one hour: sub-hourly processes are not resolved."
    - "No built-in calibration/optimization; parameter estimation requires external tools."
  warnings:
    - "Report grain yield as sorg_DM only; confusing total harvest DM with grain (sorg_DM) overstates yield — check harvest_index 0.3-0.5 for cereals."
    - "Exclude the first 1-3 spinup years from validation metrics; soil water and N pools need that long to equilibrate."
    - "With SVAT='None' the canopy and soil surface are held at free-air temperature, so a closed surface energy balance (and eddy-covariance LE comparison) is only meaningful under the PMSW/SSOC options with hourly forcing."
    - "Plausibility ranges for sanity-checking: cereal yield 2-15 Mg DM/ha, annual ET 300-600 mm, drainage 50-400 mm, N leaching <50 (≤100 on sandy soils) kg N/ha/yr, denitrification 5-30 kg N/ha/yr; water-balance residual should close to within ~10 mm/yr."
  assumptions:
    - statement: "The canonical configuration is a single 1-D vertical soil column (top of canopy to bottom of the historic root zone); lateral exchange and catchment routing are out of scope."
      scope: "spatial geometry / boundary"
      source: "daisy.ku.dk About-Daisy and DaisyDescription.pdf (bioactive-zone scope, 1-D Richards)"
      status: "adopted"
    - statement: "Coupled mass balances are maintained for water, heat, inorganic N and pesticides, and multi-pool organic C/N; the organic-matter model is an integral part of the nitrogen balance. A closed surface energy budget is solved only when an hourly SVAT option (PMSW/SSOC) is active."
      scope: "conservation / closure"
      source: "daisy.ku.dk technical-manual SVAT note and DaisyDescription.pdf"
      status: "adopted"
    - statement: "Soil-water Theta logged in soil_water.dlf may be reported either as volumetric content (m^3/m^3) or as a layer-integrated depth (mm) depending on the user's 'select' declaration; consumers must check the .dlf unit row."
      scope: "output units"
      source: "Daisy .dlf log header (unit row) and select_value/select_volume object behavior"
      status: "tentative"

