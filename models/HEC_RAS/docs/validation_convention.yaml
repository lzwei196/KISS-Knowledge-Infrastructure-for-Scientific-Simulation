  - dag_variable: bed_elevation_change
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric spatial bed-elevation-change PBIAS threshold."
        cites: []
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "Spatial scour/deposition maps should be interpreted against survey error, but no fetched numeric threshold was available."
        cites: []
    validated_when: "UNRESOLVED - compare to repeat bathymetry/DEM differencing with survey-error propagation; no universal fetched band."
