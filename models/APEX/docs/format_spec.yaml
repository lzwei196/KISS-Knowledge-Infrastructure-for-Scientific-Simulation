- id: apex0806_only_first_soil_rewritten
  symptom: 'build_soil reports success, but 3 of the 4 subareas still simulate the

    template''s Texas Houston-Black clay; only one subarea reflects HWSD.

    '
  diagnosis: 'SOILCOM.DAT lists three soils and the shipped *.SUB files reference soil

    ids 1 AND 2 (line 2 field 1 = INPS). s3_build_soil rewrote only the FIRST

    entry. The third entry ("Houston.sol") is also a dangling reference — the

    on-disk file is HOUSTON.SOL.

    '
  remedy: 's3_build_soil.build_soil(..., all_soils=True) (the new default) rewrites

    every soil in SOILCOM.DAT, resolves filenames case-insensitively and

    warns-and-skips dangling entries. Pass --first-soil-only for the old

    behaviour.

    '
- id: apex0806_wp1_rainfall_rows_shifted
  symptom: '*.WP1 written by s2 has zeros in rows 7-8 and values of 5-20 in row 9

    (PRW1), whose valid range is 0-1.

    '
  diagnosis: '_build_wp1_text wrote SDRF and SKRF as zeros and put the mean rain-day

    COUNT into the PRW1 slot. The 12-row block order is

    OBMX, OBMN, SDTMX, SDTMN, RMO, SDRF, SKRF, PRW1, PRW2, WI.

    '
  remedy: 'Fixed 2026-08-09: SDRF/SKRF are computed from wet-day daily rainfall,

    PRW1/PRW2 from the wet/dry transition counts, and the rain-day count goes

    into WI (row 10 of the block).

    '
- id: apex0806_multidecade_forcing_not_resumable
  symptom: 'A detached multi-decade run spends >2 h in s2_convert_forcing and restarts

    that work from zero after any crash, timeout or relaunch.

    '
  diagnosis: 'A CMFD 3-hourly point build costs ~150 s/year (12 monthly NetCDFs x 7

    variables); build_forcing held nothing on disk until the whole period was

    loaded.

    '
  remedy: 'Pass cache_dir= (CLI: --cache-dir) to s2_convert_forcing.build_forcing.

    Each year is memoised as <source>_<lat>_<lon>_<year>.npz via an atomic

    temp-then-replace, so a relaunch resumes at the first missing year.

    '
