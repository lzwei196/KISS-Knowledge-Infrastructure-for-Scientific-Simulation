        series_sha256: "11aa381366085db9b3cafdd74f23341c84743555339fa44e10b68014a34bdd59"
      full:
        window: ["2006-01-01", "2015-12-31"]
        n_valid_days: 3652
        first_valid: "2006-01-01"
        last_valid: "2015-12-31"
