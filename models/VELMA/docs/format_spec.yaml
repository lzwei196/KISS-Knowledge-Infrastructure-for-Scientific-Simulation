    too frequently. Water balance shows precipitation greatly exceeding realistic values.

    '
  diagnosis: CMFD 3-hourly precipitation (mm/3h) summed incorrectly or passed as mm/d directly; Some CMFD
    products provide precipitation in mm/3h. There are 8 three-hour intervals per day, so 8 values must
    be summed per day. If each 3-hourly value is incorrectly treated as a daily value, the effective precipitat
  remedy: 'Sum 8 three-hourly precipitation values per day to get mm/d; convert_forcing_to_velma.py; [''Inspect
    CMFD temporal resolution: check if files have 8 records per day'', ''Sum daily: precip_mmd = sum(precip_mm3h[0:8])
    for each day'', ''Verify result: annual total 300-2000 mm for most basins'']; Check CMFD p'
  severity: silent
- id: dt_velma_003
  symptom: 'PET is always zero. Actual ET is zero across all four soil layers. Snow never melts even in
    summer. Model output shows perpetual snow accumulation with SWE growing indefinitely.

    '
  diagnosis: Temperature passed in Celsius instead of Kelvin; VELMA expects temperature in Kelvin. Internally
    (line 454 of run_validation.py), the model converts to Celsius via T_C = temp_K - 273.15. If temperature
    is already in Celsius (e.g., 15 C), the model computes T_C = 15 - 273.15 = -258 C. This yields s_r
  remedy: 'Add 273.15 to temperature values before passing to VELMA; convert_forcing_to_velma.py; [''Check
    temperature range in forcing: should be 250-320 K, not -20 to 40'', ''If values are in Celsius range,
    apply: temp_K = temp_C + 273.15'', ''Do NOT pre-convert to Celsius -- VELMA handles conversion internally'']'
  severity: silent
- id: dt_velma_004
  symptom: 'PET is unrealistically high (>50 mm/d). Soil layers L1-L3 are depleted within days of simulation
    start. Streamflow is dominated by surface runoff with no subsurface contribution.

    '
  diagnosis: 'Solar radiation in MJ/m2/d instead of W/m2; VELMA expects solar radiation in W/m2 for the
    Hargreaves PET equation. The conversion from MJ/m2/d to W/m2 is: divide by 0.0864. If MJ/m2/d values
    (typically 5-30) are passed as W/m2 directly, they are ~100x too low. However, if the error goes the
    other wa'
  remedy: 'Ensure solar radiation is in W/m2; if in MJ/m2/d, divide by 0.0864; convert_forcing_to_velma.py;
    [''Check srad values: typical W/m2 range is 50-400 for daily mean'', ''If values are 5-30, they are
    likely MJ/m2/d: divide by 0.0864'', ''If values are 5000-30000, they are likely kJ/m2/d: divide by
    86.4'']; V'
  severity: silent
- id: dt_velma_005
  symptom: 'Percolation from Layer 1 to Layer 2 is extremely slow. Water accumulates in the top 10 cm
    layer, causing excessive surface runoff. Hydrograph is overly flashy with no baseflow recession.

    '
  diagnosis: Hydraulic conductivity (Ksat) in mm/h instead of mm/d; HWSD and many soil databases report
    Ksat in mm/h. VELMA requires mm/d for percolation rate calculations. Using mm/h values directly makes
