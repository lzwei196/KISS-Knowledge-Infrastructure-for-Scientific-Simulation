safety:
  hazards:
    - {id: "forcing_T2D_celsius_not_kelvin", kind: "weather_file_semantic", description: "T2D supplied in Celsius rather than Kelvin makes saturation-vapor-pressure terms underflow; NaN or ~0 K skin temperature.", severity: "fatal_or_silent"}
    - {id: "forcing_RAINRATE_mm_per_hr", kind: "weather_file_semantic", description: "RAINRATE in mm/hr instead of mm/s (3600x high) instantly saturates the soil column and produces extreme runoff.", severity: "silent"}
    - {id: "forcing_Q2D_relative_humidity", kind: "weather_file_semantic", description: "Q2D supplied as relative humidity (0-100%) instead of specific humidity (kg/kg) drives latent heat >1000 W/m2 and runaway ET.", severity: "silent"}
    - {id: "forcing_SWDOWN_negative_interp", kind: "weather_file_semantic", description: "Negative SWDOWN from temporal interpolation acts as an energy sink (model does not internally clip); systematic cold bias.", severity: "silent"}
    - {id: "forcing_PSFC_hPa_not_Pa", kind: "weather_file_semantic", description: "PSFC in hPa instead of Pa gives ~100x air-density error scaling all turbulent fluxes; Bowen ratio looks normal so error hides.", severity: "silent"}
    - {id: "soil_geometry_ZSOIL_positive_sign", kind: "soil_semantic", description: "ZSOIL given positive instead of negative-downward corrupts layer ordering; soil solver array-bounds crash or inverted profiles.", severity: "fatal"}
    - {id: "vegfra_fraction_not_percent", kind: "coefficient_runtime_silent_fallback", description: "VEGFRA as 0-1 fraction instead of 0-100 percent; driver only divides by 100 when max>1, so cells silently behave as bare soil.", severity: "silent"}
    - {id: "mminlu_table_classification_mismatch", kind: "control_semantic", description: "MMINLU attribute in the setup file does not match the NoahmpTable.TBL section (USGS 27-class vs MODIS 20-class); wrong vegetation params per land cover.", severity: "silent"}
    - {id: "forcing_timestep_not_multiple", kind: "control_semantic", description: "forcing_timestep not an integer multiple of noah_timestep causes forcing-read timing drift and periodic interpolation artifacts.", severity: "degraded"}
    - {id: "soil_misclassified_all_sand", kind: "soil_semantic", description: "All cells classified Sand (ISLTYP=1, high DKSAT) so all precipitation infiltrates; zero surface runoff, baseflow index 1.0.", severity: "silent"}
    - {id: "soil_misclassified_all_clay", kind: "soil_semantic", description: "All cells classified Clay (ISLTYP=12, very low DKSAT) so water pools at the surface; >90% Hortonian surface runoff.", severity: "silent"}
    - {id: "soil_SMCMAX_too_high_no_stress", kind: "soil_semantic", description: "SMCMAX set too high for the texture keeps SMOIS above SMCREF; the BTRAN soil-moisture stress never triggers and ET runs systematically high.", severity: "silent"}
    - {id: "forcing_LDASIN_sequence_gap", kind: "weather_file_semantic", description: "A missing file in the strictly-named LDASIN sequence causes an immediate read failure mid-run.", severity: "fatal"}
    - {id: "setup_file_corrupt_dim_mismatch", kind: "control_semantic", description: "Corrupt or dimension-mismatched HRLDAS setup file (missing vars, grid mismatch with forcing) yields an immediate NetCDF/segfault with no output.", severity: "fatal"}
    - {id: "forcing_out_of_range_solver_divergence", kind: "numerical_instability", description: "Out-of-range forcing (extreme temperature, negative pressure) drives division-by-zero/overflow and SIGFPE/NaN divergence in the energy-balance iteration.", severity: "fatal"}
    - {id: "initial_condition_bad_isolated_cells", kind: "initial_condition_semantic", description: "Isolated cells with SMOIS>SMCMAX, TSK=0, or IVGTYP/ISLTYP=0 produce per-cell NaN while the driver continues on other cells.", severity: "silent"}
  validation_limits:
    - "Column 1-D model: no native lateral or river routing; gauged streamflow comparison requires an external routing model."
    - "Multi-physics has 12+ option switches and thousands of combinations; only a limited subset is tested (Niu et al. 2011, Yang et al. 2011)."
    - "BVOC flux module 'not tested'; CH4 flux module 'under development'; SBETA/FXEXP/SALP noted as not actually in use in some configurations."
    - "Soil moisture requires 3-5 years of spinup to equilibrate before evaluation."
    - "Total soil-layer thickness must not exceed 7.5 m (lower thermal BC TBOT applied at ~8.0 m)."
    - "Water-body cells (ISLTYP=14) are skipped in the land-surface calculation."
  warnings:
    - "SFCRUNOFF and UDRUNOFF are written ACCUMULATED since simulation start; incremental runoff must be computed as the difference between consecutive output timesteps."
    - "Changing the parameters of a scheme that is not the selected option has no effect (e.g. SIMGM runoff params are ignored when a Schaake scheme is active)."
    - "OPT_CRS must be Ball-Berry (1) when dynamic vegetation (DVEG) is on."
    - "REFKDT and CZIL strongly affect runoff partitioning and aerodynamic resistance respectively and are the primary calibration knobs there."
    - "Noah-MP uses the triple point 273.16 K (not 273.15) as the phase-change reference, affecting every phase-change and supercooled-water calculation."
  assumptions:
    - statement: "Each grid cell is solved as an independent 1-D soil-vegetation-atmosphere column with no lateral exchange between columns."
      scope: "all gridded applications"
      source: "Noah-MP User's Guide v0 (Niu 2011), Sec. 1.0; HRLDAS column driver (module_NoahMP_hrldas_driver)"
      status: "adopted"
    - statement: "Water and energy budgets are closed per column each timestep (mass-balance for water; surface energy balance for fluxes)."
      scope: "all runs"
      source: "BalanceWaterInit/Check and BalanceEnergyCheck modules; legacy ERROR subroutine in the User's Guide"
      status: "adopted"
    - statement: "Phase-change / freezing reference temperature is the triple point 273.16 K."
      scope: "all phase-change and supercooled-water calculations"
      source: "ConstantDefineMod.F90 (ConstFreezePoint = 273.16 K)"
      status: "adopted"
    - statement: "The physical valid range for T2D is taken as [200,340] K for validation messaging, rather than the looser 180 K floor seen in some tooling limits."
      scope: "forcing quality control"
      source: "Noah-MP SKILL/configuration docs (T2D physical range)"
      status: "tentative"
    - statement: "This dag describes the single runnable HRLDAS offline column implementation of Noah-MP v5.2.0 (online WRF/MPAS/LIS couplings are out of scope for this binding)."
      scope: "implementation identity"
      source: "NCAR/noahmp v5.2 repository; HRLDAS offline driver entry points"
      status: "adopted"
