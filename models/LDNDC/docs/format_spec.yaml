  diagnosis: HWSD global database contains water body entries with no soil properties. The VIC-to-LDNDC
    soil converter silently returns empty results. setup.xml and site.xml are never generated.; Cells
    V5659001, V6069001, V6359001, V7529001 in Harbin basin sit on HWSD mapping units classified as water.;
    ['HWSD s
  remedy: 'Nearest-neighbor soil donor: find closest cell with valid soil (0.25° search), copy parameters.
    Add ISSOIL≠0 check to soil extraction pipeline.; ; [''Identify failed cells: grep for empty soil_cache
    directories'', ''Find nearest valid neighbor at same resolution'', ''Copy neighbor soil params to
    failed c'
