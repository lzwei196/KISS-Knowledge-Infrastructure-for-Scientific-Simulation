template_version: "3.5"

identity:
  model_id: "SUMMA"
  scientific_reference_version: "SUMMA (Clark et al. 2015 WRR concept+implementation; SUMMA_FILE_MANAGER_V3.0.0 configuration era)"
  implementation:
    id: "summa-ncar"
    version: "FILE_MANAGER_V3.0.0-era build (NCAR/CH-Earth summa)"
    provenance: "Fortran 90; NCAR RAL / CH-Earth open-source SUMMA, NetCDF I/O, reuses Noah-MP land-surface parameter tables."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "GPL-3.0"
  repo_url: "https://github.com/CH-Earth/summa"

boundary:
  scope_in:
    - "Per-HRU vertical land-surface mass and energy conservation: vegetation canopy, snowpack, soil column, aquifer"
    - "Radiation transmission and wind attenuation through canopy"
    - "Snow interception, accumulation, phase change, compaction, and melt"
    - "Evapotranspiration (canopy/ground evaporation, transpiration, sublimation)"
    - "Soil water flow (Richards equation, van Genuchten-Mualem retention)"
    - "Runoff generation, soil drainage, groundwater recharge and baseflow"
    - "Systematic comparison of alternative process parameterizations via model decisions (multi-physics framework)"
  scope_out:
    - "Lateral exchange of moisture between GRUs (GRUs are hydrologically independent)"
    - "Channel/river-network routing (only sub-grid gamma time-delay or instantaneous routing internally; full routing is external, e.g. mizuRoute)"
    - "Distributed surface water flow between HRUs beyond the conceptual shared aquifer"
  spatial: "distributed-stream"
  temporal: "hourly"
  closure: "both"
  notes: "Each HRU is a 1-D vertical column solving coupled energy and mass (water) balance on a common conservation core; the conservation equations are decoupled from the numerical solver. Distributed over GRUs (typically grid cells) subdivided into HRUs, with no lateral moisture exchange between GRUs. The model's operating temporal grain is the forcing data_step, commonly 3600 s (hourly) to 10800 s (3-hourly); the implicit solver adaptively sub-steps WITHIN the data_step (varSubstep), which is a numerical detail, not a sub-hourly forcing grain. Total runoff is emitted as a flux (m/s) per HRU; discharge requires multiplying by HRU area and applying external routing."

inputs:
  forcing:
    - {category: forcing, name: "pptrate", unit: "kg m-2 s-1", source_kind: forcing, model_input_format: "forcing NetCDF (time, hru)", notes: "precipitation rate; partitioned to rain/snow by air temperature relative to tempCritRain; temperate mean ~1e-5 to 1e-4 kg/m2/s"}
    - {category: forcing, name: "airtemp", unit: "K", source_kind: forcing, model_input_format: "forcing NetCDF (time, hru)", notes: "air temperature at measurement height; controls rain/snow phase partition and melt energy"}
    - {category: forcing, name: "SWRadAtm", unit: "W m-2", source_kind: forcing, model_input_format: "forcing NetCDF (time, hru)", notes: "downward shortwave radiation at upper boundary"}
    - {category: forcing, name: "LWRadAtm", unit: "W m-2", source_kind: forcing, model_input_format: "forcing NetCDF (time, hru)", notes: "downward longwave radiation at upper boundary"}
    - {category: forcing, name: "windspd", unit: "m s-1", source_kind: forcing, model_input_format: "forcing NetCDF (time, hru)", notes: "wind speed at measurement height"}
    - {category: forcing, name: "airpres", unit: "Pa", source_kind: forcing, model_input_format: "forcing NetCDF (time, hru)", notes: "air pressure at measurement height; expected ~80000-105000 Pa, in kPa breaks saturation-vapour-pressure/energy balance"}
    - {category: forcing, name: "spechum", unit: "g g-1", source_kind: forcing, model_input_format: "forcing NetCDF (time, hru)", notes: "specific humidity (mass ratio, numerically kg/kg); expected ~0.002-0.015; sets vapour-pressure deficit for ET"}
  parameters:
    - {category: parameter, name: "k_soil (saturated hydraulic conductivity)", unit: "m s-1", source_kind: calibrated, model_input_format: "trialParams.nc / localParamInfo.txt", notes: "range ~1e-7 to 1e-3"}
    - {category: parameter, name: "theta_sat (porosity / saturated water content)", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc / SOILPARM.TBL", notes: "range ~0.30-0.55"}
    - {category: parameter, name: "theta_res (residual water content)", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc / SOILPARM.TBL", notes: "must be < theta_sat; range ~0.01-0.15"}
    - {category: parameter, name: "vGn_alpha (van Genuchten alpha)", unit: "m-1", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "matric-head sign convention: SUMMA requires NEGATIVE values (valid ~[-1.0,-0.01]); positive yields NaN"}
    - {category: parameter, name: "vGn_n (van Genuchten n shape)", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "range ~1.1-3.0"}
    - {category: parameter, name: "critSoilWilting (wilting point)", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "ET shutoff; must satisfy theta_res < critSoilWilting < critSoilTranspire < fieldCapacity < theta_sat"}
    - {category: parameter, name: "critSoilTranspire (transpiration threshold)", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "range ~0.15-0.40"}
    - {category: parameter, name: "fieldCapacity", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "theta at -33 kPa; ~0.30"}
    - {category: parameter, name: "heightCanopyTop (canopy height)", unit: "m", source_kind: dataset_lookup, model_input_format: "trialParams.nc / VEGPARM.TBL", notes: "controls radiation and roughness; ~0.1-40 m"}
    - {category: parameter, name: "rootingDepth (root zone depth)", unit: "m", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "~0.5-3.0 m"}
    - {category: parameter, name: "qSurfScale (surface runoff scaling)", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "~10-100"}
    - {category: parameter, name: "aquiferScaleFactor (aquifer response time)", unit: "m", source_kind: calibrated, model_input_format: "basinParamInfo.txt / trialParams.nc", notes: "~10-500"}
    - {category: parameter, name: "tempCritRain (rain/snow threshold)", unit: "K", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "~272-275 K"}
    - {category: parameter, name: "frozenPrecipMultip (snow undercatch correction)", unit: "-", source_kind: calibrated, model_input_format: "trialParams.nc", notes: "~0.8-1.5"}
    - {category: parameter, name: "vegTypeIndex / soilTypeIndex / slopeTypeIndex", unit: "-", source_kind: dataset_lookup, model_input_format: "attributes.nc", notes: "classification indices selecting Noah-MP VEGPARM/SOILPARM/GENPARM lookup-table defaults unless overridden by trialParams"}
    - {category: parameter, name: "HRU geometry (HRUarea, elevation, tan_slope, contourLength, mHeight, downHRUindex)", unit: "mixed (m2, m, m/m, m)", source_kind: dataset_lookup, model_input_format: "attributes.nc", notes: "local spatial attributes; downHRUindex=0 marks the outlet"}
  initial_conditions:
    - {category: initial_condition, name: "mLayerTemp (initial soil/snow layer temperature)", unit: "K", source_kind: user_provided, model_input_format: "coldState.nc (midToto)", notes: "cold-start ~ mean annual air temperature; unrealistic values motivate nrg_flux convergence failure / two-phase spinup"}
    - {category: initial_condition, name: "mLayerVolFracLiq / mLayerVolFracIce (initial layer moisture)", unit: "-", source_kind: user_provided, model_input_format: "coldState.nc (midToto)", notes: "cold-start ~field capacity 0.25-0.35; too dry causes 5+ yr spinup, above theta_sat causes runoff spikes"}
    - {category: initial_condition, name: "mLayerMatricHead (initial soil matric head)", unit: "m", source_kind: user_provided, model_input_format: "coldState.nc (midSoil)"}
    - {category: initial_condition, name: "scalarSWE / nSnow (initial snow water equivalent / snow layer count)", unit: "kg m-2 / -", source_kind: user_provided, model_input_format: "coldState.nc", notes: "typically SWE=0, nSnow=0; snow builds up naturally"}
    - {category: initial_condition, name: "canopy state (scalarCanopyLiq, scalarCanopyIce)", unit: "kg m-2", source_kind: user_provided, model_input_format: "coldState.nc"}
    - {category: initial_condition, name: "scalarAquiferStorage (initial aquifer storage)", unit: "m", source_kind: user_provided, model_input_format: "coldState.nc", notes: "high initial storage can absorb all water and yield near-zero runoff"}
    - {category: initial_condition, name: "nSoil / soil layer discretization", unit: "-", source_kind: user_provided, model_input_format: "coldState.nc", notes: "default 8 layers to ~4 m; must match model configuration exactly (else dimension-mismatch abort)"}
    - {category: initial_condition, name: "dt_init (initial time sub-step length)", unit: "s", source_kind: user_provided, model_input_format: "coldState.nc"}
  boundary_conditions:
    - {category: boundary_condition, name: "model decisions (~35 physics-option categories)", unit: "-", source_kind: user_provided, model_input_format: "decisions.txt (case-sensitive <keyword> <value>)", notes: "selects flux parameterizations and numerics: snowLayers, thCondSnow, snowIncept, compaction, f_Richards, groundwatr, hc_profile, stomResist, soilStress, canopySrad, num_method, fDerivMeth, etc. — these change the structural model, not just parameters"}
    - {category: boundary_condition, name: "bcUpprTdyn / bcUpprSoiH (upper temperature/soil-head boundary)", unit: "-", source_kind: user_provided, model_input_format: "decisions.txt", notes: "presTemp/nrg_flux/zeroFlux (energy) and presHead/liq_flux (water); presTemp diagnostic mode bypasses energy balance and yields zero ET hence zero runoff"}
    - {category: boundary_condition, name: "bcLowrTdyn / bcLowrSoiH (lower temperature/soil-head boundary)", unit: "-", source_kind: user_provided, model_input_format: "decisions.txt", notes: "presTemp/zeroFlux (energy) and presHead/bottmPsi/drainage/zeroFlux (water); constrained by groundwater choice"}
    - {category: boundary_condition, name: "simStartTime / simEndTime / data_step", unit: "datetime / s", source_kind: user_provided, model_input_format: "fileManager.txt", notes: "simulation window and forcing timestep (period-ending stamps)"}
    - {category: boundary_condition, name: "output control (variables, frequency, statistics)", unit: "-", source_kind: user_provided, model_input_format: "outputControl.txt", notes: "selects retained variables, output frequency (multiple of forcing step), and statistic (instantaneous/sum/mean/variance/min/max/mode)"}

processes:
  modules:
    - {name: "mDecisions", role: "driver", brief: "Reads and validates the ~35 model-decision categories and enforces cross-decision constraints at init (e.g. groundwatr=qTopmodl forces bcLowrSoiH=zeroFlux + hc_profile=pow_prof; spatial_gw=singleBasin forces groundwatr=bigBuckt)."}
    - {name: "derivforce", role: "driver", brief: "Derives model forcing from raw forcing NetCDF: rain/snow partition, vapour pressure, cosine solar zenith."}
    - {name: "vegPhenlgy", role: "process_solver", brief: "Vegetation phenology: exposed LAI/SAI and growing-season index."}
    - {name: "vegSWavRad", role: "process_solver", brief: "Shortwave radiation transfer through and below the canopy (two-stream / canopySrad options)."}
    - {name: "canopySnow", role: "process_solver", brief: "Canopy snow interception, unloading, and phase change; runs every timestep and is the source of cold-region convergence stiffness."}
    - {name: "vegNrgFlux", role: "process_solver", brief: "Vegetation/canopy energy balance: sensible/latent heat, longwave, surface (stomatal/aerodynamic) resistances."}
    - {name: "vegLiqFlux", role: "process_solver", brief: "Canopy liquid water flux: interception, throughfall, drainage."}
    - {name: "ssdNrgFlux", role: "process_solver", brief: "Sub-surface soil/snow-domain thermal energy flux (vertical heat conduction); drives phase change."}
    - {name: "soilLiqFlx", role: "process_solver", brief: "Richards-equation soil liquid water flux with van Genuchten-Mualem retention; only analytic derivatives implemented."}
    - {name: "snowLiqFlx", role: "process_solver", brief: "Liquid water percolation and drainage through the snowpack."}
    - {name: "groundwatr", role: "optional_module", brief: "TOPMODEL-style soil-zone baseflow / groundwater.", applicability: "groundwatr=qTopmodl"}
    - {name: "bigAquifer", role: "optional_module", brief: "Lumped 'big bucket' aquifer storage-discharge baseflow.", applicability: "groundwatr=bigBuckt"}
    - {name: "computFlux", role: "process_solver", brief: "Aggregates all process fluxes (vegetation energy/water, soil/snow energy and liquid flux, groundwater) for a trial state vector."}
    - {name: "eval8summa", role: "process_solver", brief: "Evaluates flux + residual for a trial state (computFlux + computResid + soilCmpres); the function the Newton solver minimizes. Soil compressibility is folded silently into the residual."}
    - {name: "summaSolve", role: "process_solver", brief: "Newton root-finder with line-search/trust-region refinement; builds the Jacobian and calls the LAPACK band/full solver."}
    - {name: "systemSolv", role: "process_solver", brief: "Sets up and drives the implicit (Backward-Euler/Newton) solution of the coupled state equations."}
    - {name: "varSubstep", role: "integrator", brief: "Adaptive sub-step time integration wrapping the implicit solver; updates prognostic state."}
    - {name: "opSplittin", role: "integrator", brief: "Operator-splitting controller that partitions the state vector and steps each split via varSubstep."}
    - {name: "coupled_em", role: "driver", brief: "Coupled energy+mass driver for one HRU per timestep; manages adaptive snow layering (divide/merge/densify) then invokes the operator-split solver. Snow-layer count changes the solver state-vector length each step."}
    - {name: "qTimeDelay", role: "integrator", brief: "Basin sub-grid routing via gamma-distribution time-delay histogram, producing averageRoutedRunoff (not channel routing)."}
    - {name: "REDPRM", role: "process_solver", brief: "Noah-MP vegetation/soil parameter-table read reused by SUMMA before the energy-mass solve (external upstream coupling).", applicability: "always"}
  internal_edges:
    - {from: "Inputs", to: "derivforce", kind: "consumes_input", brief: "raw forcing NetCDF derived into model forcing fields"}
    - {from: "derivforce", to: "coupled_em", kind: "invokes", brief: "derived forcing feeds the per-HRU energy-mass driver"}
    - {from: "REDPRM", to: "coupled_em", kind: "consumes_input", brief: "Noah-MP veg/soil parameter tables supply lookup defaults (external coupling)"}
    - {from: "mDecisions", to: "groundwatr", kind: "invokes", brief: "decision constraints select the active groundwater path"}
    - {from: "mDecisions", to: "bigAquifer", kind: "invokes", brief: "decision constraints select the big-bucket aquifer path"}
    - {from: "coupled_em", to: "vegPhenlgy", kind: "invokes", brief: "update exposed LAI/SAI before fluxes"}
    - {from: "coupled_em", to: "vegSWavRad", kind: "invokes", brief: "canopy shortwave radiation transfer"}
    - {from: "coupled_em", to: "canopySnow", kind: "invokes", brief: "canopy snow interception and phase change"}
    - {from: "coupled_em", to: "opSplittin", kind: "invokes", brief: "after snow-layer management, invoke the operator-split solver"}
    - {from: "opSplittin", to: "varSubstep", kind: "invokes", brief: "each state split solved by adaptive sub-stepping"}
    - {from: "varSubstep", to: "systemSolv", kind: "invokes", brief: "implicit solution of coupled equations for the sub-step"}
    - {from: "systemSolv", to: "summaSolve", kind: "invokes", brief: "Newton root-finder driving the implicit step"}
    - {from: "systemSolv", to: "eval8summa", kind: "invokes", brief: "residual/flux evaluation for trial state"}
    - {from: "summaSolve", to: "eval8summa", kind: "invokes", brief: "Newton iteration evaluates flux+residual each trial"}
    - {from: "eval8summa", to: "computFlux", kind: "invokes", brief: "compute all process fluxes for the current state"}
    - {from: "computFlux", to: "vegNrgFlux", kind: "invokes", brief: "canopy/ground energy balance"}
    - {from: "computFlux", to: "vegLiqFlux", kind: "invokes", brief: "canopy liquid water flux"}
    - {from: "computFlux", to: "ssdNrgFlux", kind: "invokes", brief: "soil/snow thermal flux"}
    - {from: "computFlux", to: "soilLiqFlx", kind: "invokes", brief: "Richards soil water flux"}
    - {from: "computFlux", to: "snowLiqFlx", kind: "invokes", brief: "snowpack liquid drainage"}
    - {from: "computFlux", to: "groundwatr", kind: "invokes", brief: "optional TOPMODEL baseflow"}
    - {from: "computFlux", to: "bigAquifer", kind: "invokes", brief: "optional big-bucket aquifer baseflow"}
    - {from: "vegNrgFlux", to: "scalarCanopyTemp", kind: "writes_state", brief: "updates canopy/canopy-air temperatures"}
    - {from: "canopySnow", to: "scalarCanopyIce", kind: "writes_state", brief: "canopy ice interception/unloading and phase change"}
    - {from: "ssdNrgFlux", to: "mLayerTemp", kind: "writes_state", brief: "updates soil/snow layer temperatures (phase change)"}
    - {from: "soilLiqFlx", to: "mLayerMatricHead", kind: "writes_state", brief: "updates soil matric head / volumetric liquid"}
    - {from: "coupled_em", to: "scalarSWE", kind: "writes_state", brief: "snow-layer divide/merge/densify update SWE and depth"}
    - {from: "groundwatr", to: "scalarAquiferStorage", kind: "writes_state", brief: "aquifer storage update and baseflow"}
    - {from: "bigAquifer", to: "scalarAquiferStorage", kind: "writes_state", brief: "lumped aquifer storage update and baseflow"}
    - {from: "soilLiqFlx", to: "scalarTotalRunoff", kind: "produces_output", brief: "surface runoff + drainage + baseflow aggregated to total runoff (m/s)"}
    - {from: "vegNrgFlux", to: "scalarTotalET", kind: "produces_output", brief: "canopy+ground evaporation/transpiration summed to total ET (kg/m2/s)"}
    - {from: "vegSWavRad", to: "Outputs", kind: "produces_output", brief: "canopy vs ground absorbed shortwave radiation"}
    - {from: "coupled_em", to: "qTimeDelay", kind: "invokes", brief: "overland gamma-distribution routing producing averageRoutedRunoff"}

states:
  variables:
    - {name: "mLayerTemp", unit: "K", role: prognostic}
    - {name: "mLayerVolFracLiq", unit: "-", role: prognostic}
    - {name: "mLayerVolFracIce", unit: "-", role: prognostic}
    - {name: "mLayerVolFracWat", unit: "-", role: diagnostic}
    - {name: "mLayerMatricHead", unit: "m", role: prognostic}
    - {name: "mLayerDepth", unit: "m", role: prognostic}
    - {name: "mLayerHeight", unit: "m", role: diagnostic}
    - {name: "iLayerHeight", unit: "m", role: diagnostic}
    - {name: "scalarCanopyIce", unit: "kg m-2", role: prognostic}
    - {name: "scalarCanopyLiq", unit: "kg m-2", role: prognostic}
    - {name: "scalarCanopyWat", unit: "kg m-2", role: diagnostic}
    - {name: "scalarCanairTemp", unit: "K", role: prognostic}
    - {name: "scalarCanopyTemp", unit: "K", role: prognostic}
    - {name: "scalarSnowAlbedo", unit: "-", role: prognostic}
    - {name: "scalarSnowDepth", unit: "m", role: prognostic}
    - {name: "scalarSWE", unit: "kg m-2", role: prognostic}
    - {name: "scalarSfcMeltPond", unit: "kg m-2", role: prognostic}
    - {name: "scalarAquiferStorage", unit: "m", role: prognostic}
    - {name: "scalarSurfaceTemp", unit: "K", role: diagnostic}
    - {name: "nSnow", unit: "-", role: prognostic}
    - {name: "scalarLAI / scalarSAI (exposed leaf/stem area index)", unit: "m2 m-2", role: diagnostic}
    - {name: "scalarGrowingSeasonIndex", unit: "-", role: diagnostic}
  provenance: "populated"

outputs:
  - var: "scalarTotalRunoff"
    validation_rank: 1
    unit: "m s-1"
    description: "Total runoff (surface runoff + soil drainage + baseflow) per HRU as a flux; discharge Q(m3/s) = scalarTotalRunoff x HRUarea(m2), no /1000."
    emitted_in: "SUMMA output NetCDF (variables selected in outputControl.txt; defined in def_output.f90)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "SUMMA has no channel routing; comparison to gauged streamflow requires external routing of HRU runoff to the outlet."
            - "Discard 1-2 yr (5+ for groundwater basins) cold-start spinup before scoring."
            - "Runoff is m/s while ET/precip are kg/m2/s; mixing the unit families biases the water balance."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Per-HRU/GRU runoff fields, not channel discharge."
      detrending_options: ["none"]
  - var: "scalarTotalET"
    validation_rank: 2
    unit: "kg m-2 s-1"
    description: "Total evapotranspiration (canopy + ground evaporation, transpiration, sublimation). Negative = evaporation (water leaving surface), positive = condensation."
    emitted_in: "SUMMA output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Sign convention: negative ET is upward (evaporative) flux."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none"]
  - var: "scalarSWE"
    validation_rank: 3
    unit: "kg m-2"
    description: "Snow water equivalent of the snowpack per HRU."
    emitted_in: "SUMMA output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Point SNOTEL-style SWE; timing of accumulation/melt onset matters as much as peak magnitude."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Gridded/remote-sensing SWE; sub-canopy SWE is sensitive to canopy-snow unloading scheme."
      detrending_options: ["none"]
  - var: "scalarSnowDepth"
    validation_rank: 4
    unit: "m"
    description: "Total snow depth per HRU."
    emitted_in: "SUMMA output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: []
      detrending_options: ["none"]
  - var: "mLayerVolFracLiq"
    validation_rank: 5
    unit: "-"
    description: "Volumetric liquid water fraction at soil layer midpoints (soil moisture profile)."
    emitted_in: "SUMMA output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Layer-specific; must match the observation's measurement depth to a model layer."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Satellite surface soil moisture compares to near-surface layers only."
      detrending_options: ["none"]
  - var: "scalarNetRadiation"
    validation_rank: 6
    unit: "W m-2"
    description: "Net radiation at the land surface (canopy + ground)."
    emitted_in: "SUMMA output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Flux-tower energy-balance comparison; sub-daily resolution required."
      detrending_options: ["none"]
  - var: "scalarLatHeatTotal"
    validation_rank: 7
    unit: "W m-2"
    description: "Total latent heat flux (turbulent moisture flux), energy-balance counterpart of total ET."
    emitted_in: "SUMMA output NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Flux-tower eddy-covariance comparison; energy-balance non-closure in observations is a known caveat."
      detrending_options: ["none"]

influence:
  edges:
    - from: "precipitation rate (pptrate)"
      to: "scalarTotalRunoff"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "always"
      citations: ["vanbeusekom2022_summa_forcing"]
    - from: "precipitation rate (pptrate)"
