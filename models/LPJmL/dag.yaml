safety:
  hazards:
    - id: "temp_kelvin_silent"
      kind: "weather_file_semantic"
      description: "Temperature supplied in Kelvin is interpreted as deg C (~300 deg C); photosynthesis and all vegetation processes fail with no error."
      severity: "silent"
    - id: "precip_kgm2s_silent"
      kind: "weather_file_semantic"
      description: "Precipitation in kg/m2/s is 86400x too small, producing extreme drought and near-zero NPP."
      severity: "silent"
    - id: "precip_monthly_in_daily_config"
      kind: "weather_file_semantic"
      description: "Monthly-total precipitation fed to a daily (nstep=365) configuration delivers ~30x too much water, triggering water-balance failure (ERROR005)."
      severity: "fatal_or_silent"
    - id: "swdown_jm2day_silent"
      kind: "weather_file_semantic"
      description: "Shortwave radiation in J/m2/day is 86400x too large, inflating GPP and exploding vegetation carbon."
      severity: "silent"
    - id: "fertilizer_unit_silent"
      kind: "control_semantic"
      description: "Fertilizer in kgN/ha instead of gN/m2 is 10x too small; fertilization has no detectable effect on yield."
      severity: "silent"
    - id: "soil_fraction_scale_silent"
      kind: "soil_semantic"
      description: "Soil texture fractions in 0-1 instead of 0-100% classify all cells as sand, giving fast drainage and low water retention."
      severity: "silent"
    - id: "co2_year_coverage_fatal"
      kind: "control_semantic"
      description: "CO2 time series that does not span the spinup-cycling years plus the transient period aborts in getco2() (ERROR015)."
      severity: "fatal"
    - id: "missing_from_restart_landuse"
      kind: "control_semantic"
      description: "A transient land-use run started without FROM_RESTART / restart file runs natural spinup instead, producing no crop output."
      severity: "silent"
    - id: "carbon_balance_violation"
      kind: "numerical_instability"
      description: "Carbon inputs/outputs failing to balance within tolerance under CHECK_BALANCE terminate the run (ERROR004)."
      severity: "fatal"
    - id: "water_balance_violation"
      kind: "numerical_instability"
      description: "Water inputs exceeding physical capacity (usually wrong precipitation units) cause negative soil moisture and abort (ERROR005)."
      severity: "fatal"
    - id: "pft_band_ordering_silent"
      kind: "parser_semantic"
      description: "Reading the wrong band of the 32-band pft_harvestc output (16 rainfed + 16 irrigated, ordered by landusemap) yields zero or wrong crop yields."
      severity: "silent"
    - id: "yield_carbon_not_converted"
      kind: "parser_semantic"
      description: "Treating harvested carbon (gC/m2) as t/ha without the /0.45*0.01 conversion makes yields ~100x off; using harvestc (residual-inclusive) instead of pft_harvestc also biases yield."
      severity: "silent"
    - id: "equilsoil_no_convergence"
      kind: "numerical_instability"
      description: "Insufficient nequilsoil calls or too-short equilsoil interval prevents soil carbon from equilibrating, producing an endless/invalid spinup."
      severity: "degraded"
  validation_limits:
    - "Global 0.5-degree gridded DGVM, not a field-scale crop model; point/plot observations require aggregation to the cell."
    - "Daily timestep cannot resolve sub-daily energy and water processes."
    - "Requires a multi-century natural-vegetation spinup to equilibrate soil carbon and vegetation; results before equilibration are invalid."
    - "National yield aggregates contain a technology trend that a weather-driven process model cannot reproduce."
    - "Plausibility envelopes: global NPP ~50-70 GtC/yr, global discharge ~35000-45000 km3/yr; wheat 2-8, maize 3-12, rice 3-10 t/ha."
  warnings:
    - "equilsoil must be set false in the transient run; leaving it true is extremely slow and destroys the soil carbon pool."
    - "For crop-yield validation use pft_harvestc (excludes residuals), not harvestc (includes residuals)."
    - "pft_harvestc has 32 bands ordered by landusemap; verify cftfrac>0 and CFT name mapping before reading yield."
    - "Nitrogen limitation is only represented when the nitrogen cycle is enabled; with_nitrogen=no removes N constraint on production."
  assumptions:
    - statement: "Each 0.5-degree cell simulates multiple stand types simultaneously, internally consistent through shared water, carbon, nitrogen and energy fluxes; cells are laterally coupled within a timestep through the river-routing discharge queue."
      scope: "spatial geometry and inter-cell coupling"
      source: "Schaphoff et al. 2018 GMD 11:1343 (model description)"
      status: "adopted"
    - statement: "Mass-balance closure is enforced for carbon, water and (when active) nitrogen via compile-time CHECK_BALANCE accounting; violations abort the run."
      scope: "conservation / closure"
      source: "LPJmL errmsg.h error codes and CHECK_BALANCE behavior in source and docs"
      status: "adopted"
    - statement: "Atmospheric pressure is treated as a globally constant 1.0e5 Pa with no elevation/pressure correction in the Farquhar photosynthesis solver."
      scope: "photosynthesis kinetics"
      source: "src/lpj/photosynthesis.c hardcoded constants"
      status: "adopted"
    - statement: "An enthalpy-based soil thermal scheme provides a soil energy balance with freeze/thaw, but there is no coupled surface-atmosphere energy closure."
      scope: "energy closure"
      source: "Schaphoff et al. 2018 GMD 11:1343 (energy balance / permafrost section); update_soil_thermal_state in source"
      status: "adopted"

