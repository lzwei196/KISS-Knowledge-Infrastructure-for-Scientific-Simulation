# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: HexWatershed
  language: c++
  implementation:
    id: hexwatershed-cpp-v1
    version: 1.0.0
    provenance: C++11; PNNL (Chang Liao) HexWatershed C++ backend, single-JSON-config CLI.
  scientific_reference_version: HexWatershed 1.0 (Liao et al. 2020, Environmental Modelling & Software
    128:104702) — hexagon/unstructured-mesh watershed delineation
inputs:
  forcing: []
  parameters:
  - name: Mesh cell elevation (dElevation_mean / dElevation_raw)
    unit: m
    category: terrain
    source_kind: dataset_lookup
    model_input_format: per-cell field in mesh JSON (resampled from a GeoTIFF DEM, EPSG:4326, elevation
      in meters)
    notes: Single most critical input. DEM must be GCS degrees with meters elevation and nodata matching
      dMissing_value_dem. dElevation_raw preserves the original; dElevation_mean is what depression filling
      mutates.
  - name: Cell geometry (vVertex, dLongitude/dLatitude_center_degree, dArea)
    unit: degrees (GCS) for coordinates; m^2 for dArea
    category: mesh_geometry
    source_kind: dataset_lookup
    model_input_format: per-cell fields in mesh JSON
    notes: Coordinates must be EPSG:4326 geographic degrees; model converts internally to 3D Cartesian.
      dArea must be m^2, not km^2.
  - name: Cell adjacency (aNeighbor, aNeighbor_distance, lCellID)
    unit: neighbor distance in m; IDs dimensionless
    category: mesh_topology
    source_kind: dataset_lookup
    model_input_format: per-cell neighbor lists in mesh JSON
    notes: aNeighbor_distance must be meters. vNeighbor_land excludes ocean/edge cells; a cell with fewer
      land neighbors than vertices is treated as a domain-edge outlet.
  - name: Preprocessed topological flowline network
    unit: '-'
    category: stream_network
    source_kind: dataset_lookup
    model_input_format: PyFlowline-preprocessed topological flowlines with cell-to-stream mapping
    notes: Used only when stream burning is enabled. Raw NHDPlus/HydroSHEDS shapefiles WITHOUT topology
      mapping are silently ignored. Must be EPSG:4326 to intersect the mesh.
  - name: Earth radius (dRadius_earth)
    unit: m
    category: numerical_constant
    source_kind: default
    model_input_format: hardcoded 6378137.0 (WGS84 equatorial radius) for haversine neighbor distances
  initial_conditions:
  - name: Raw cell elevation surface
    unit: m
    category: state_init
    source_kind: dataset_lookup
    model_input_format: dElevation_mean initialized from mesh JSON before Priority-Flood mutates it
    notes: The delineation has no time-evolving state; the initial condition is the raw elevation surface
      that depression filling overwrites in place.
  boundary_conditions:
  - name: sMesh_type
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON string (hexagon | square | latlon | mpas | dggrid | tin)
    notes: Selects the mesh JSON parser. A mismatch vs the actual JSON structure segfaults or misreads
      connectivity.
  - name: iFlag_flowline (stream burning enable)
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON int (0/1)
  - name: iFlag_stream_grid_option
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON int (1=burned-only, 2=threshold-only, 3=combined, 4=adaptive-min)
    notes: KI/wrapper documents default 2; the C++ parameter.cpp constructor default is 3 (combined).
  - name: iFlag_stream_burning_topology
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON int (0/1)
    notes: When 1 without a topology file, silently falls back to elevation-based routing.
  - name: iFlag_hillslope
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON int (0/1)
    notes: Wrapper-documented default 0; C++ parameter.cpp default 1. Controls left/right/headwater hillslope
      decomposition.
  - name: iFlag_multiple_outlet / nOutlet
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON int / long
  - name: iFlag_resample_method
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON int (1=nearest neighbor, 2=zonal mean)
  - name: iFlag_global / iFlag_vtk / iFlag_elevation_profile / iFlag_animation
    unit: '-'
    category: control_switch
    source_kind: user_provided
    model_input_format: config JSON ints toggling global-vs-regional run and optional VTK/profile/animation
      outputs
  - name: dAccumulation_threshold
    unit: ratio (<1.0) or absolute cell count (>=1.0)
    category: threshold
    source_kind: user_provided
    model_input_format: config JSON float; dual interpretation by magnitude
    notes: Controls stream-network density. Wrapper default 0.01; C++ ratio default 0.001, absolute default
      25000000.0. <1.0 = ratio of max accumulation, >=1.0 = absolute count.
  - name: dBreach_threshold
    unit: m
    category: threshold
    source_kind: user_provided
    model_input_format: config JSON float; elevation-jump limit for breaching at stream crossings
    notes: Wrapper default 0.0 (breaching disabled); C++ constructor default 5.0 m. Also scales the outlet
      deep-reduction (20x).
  - name: dMissing_value_dem
    unit: m (sentinel)
    category: control_value
    source_kind: user_provided
    model_input_format: config JSON float (default -9999.0); must equal the DEM nodata exactly
  - name: Outlet specification (lCellID_outlet, lBasinID, dLatitude/dLongitude_outlet_degree)
    unit: degrees for lat/lon; IDs dimensionless
    category: management
    source_kind: user_provided
    model_input_format: basin configuration JSON (required when iFlag_flowline=1)
    notes: lCellID_outlet must match an actual mesh cell or the watershed is silently skipped (zero output,
      exit 0).
outputs:
  primary:
  - name: dElevation_mean (depression-filled elevation)
    unit: m
    description: Per-cell elevation after Priority-Flood depression filling; the surface all downstream
      analysis uses (raw retained in dElevation_raw).
    validation_rank: 1
    emitted_in: watershed_NNNNN.json
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Compare against a reference filled/hydro-conditioned DEM, NOT raw terrain; filled cells differ
          from input by design.
        - On a non-raster mesh, comparison requires resampling the reference to mesh cells.
      detrending_options:
      - none
  - name: lCellID_downslope_dominant (flow direction)
    unit: '-'
    description: Dominant steepest-descent downslope neighbor for each land-surface topographic polygonal-mesh
      cell (single flow direction); -1 marks outlet/edge cells.
    validation_rank: 2
    emitted_in: watershed_NNNNN.json
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - event_detection
        determining_metric: csi
        caveats:
        - Mesh-cell flow direction; compare to a reference routing on the same mesh, or aggregate to network
          agreement (fraction of cells routed consistently).
      detrending_options:
      - none
  - name: dAccumulation (flow accumulation)
    unit: cells (upstream count)
    description: Number of upstream cells draining through each cell; area-unweighted. Multiply by mean
      cell area for drainage area in m^2.
    validation_rank: 3
    emitted_in: watershed_NNNNN.json
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Output is a CELL COUNT; convert to drainage area (x mean cell area) before comparing to area-based
          references.
        - Mesh-dependent; a fair comparison controls for mesh resolution.
      detrending_options:
      - none
  - name: Drainage area (derived watershed/contributing area)
    unit: m^2
    description: Contributing drainage area per outlet/watershed, derived from accumulation and actual
      cell areas (spherical geometry).
    validation_rank: 4
    emitted_in: watershed_NNNNN_characteristics.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Compare per-outlet drainage area to a published/reference basin area; sensitive to outlet cell
          placement and mesh resolution.
      detrending_options:
      - none
  - name: Stream grid / stream network (iFlag_stream, segments)
    unit: '-'
    description: Cells/segments classified as stream channels above the accumulation threshold and/or
      burned in.
    validation_rank: 5
    emitted_in: watershed_NNNNN.json / watershed_NNNNN_segment_*.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - event_detection
        determining_metric: csi
        caveats:
        - Network density depends strongly on dAccumulation_threshold; align threshold to the reference
          network's drainage density before scoring.
        - Compare against a reference vector stream network (e.g., resampled to the mesh) — overlap/hit-rate,
          not magnitude.
      detrending_options:
      - none
  - name: Strahler stream order
    unit: '-'
    description: Branching order assigned per stream segment.
    validation_rank: 6
    emitted_in: watershed_NNNNN_segment_*.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        - ranking_quality
        determining_metric: spearman
        caveats:
        - Order is integer-categorical and sensitive to stream-threshold density; compare max-order and
          order distribution rather than per-cell labels.
      detrending_options:
      - none
  - name: Watershed boundary / subbasin boundaries
    unit: '-'
    description: Cells assigned to each outlet (watershed) or stream segment (subbasin).
    validation_rank: 7
    emitted_in: watershed_NNNNN.json / watershed_NNNNN_subbasin_*.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - event_detection
        determining_metric: csi
        caveats:
        - Compare delineated boundary polygon to a reference watershed boundary (IoU / boundary overlap);
          sensitive to outlet placement.
      detrending_options:
      - none
  - name: Mean / max / min watershed slope
    unit: ratio (dimensionless rise/run)
    description: Per-cell and basin-aggregate slope (between- and within-cell), reported as unitless ratios.
    validation_rank: 8
    emitted_in: watershed_NNNNN_characteristics.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - magnitude_accuracy
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Slope is a ratio, NOT degrees or percent; convert before comparing (degrees = atan(ratio)*180/pi).
        - Inflated ~3.28x if the source DEM was in feet, or by elevation/distance unit mismatches.
      detrending_options:
      - none
  - name: Drainage density
    unit: km^-1 (km/km^2)
    description: Total stream length per unit watershed area.
    validation_rank: 9
    emitted_in: watershed_NNNNN_characteristics.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Typical physical range 0.5-10 km^-1; values ~1e6 off indicate m-vs-km or m^2-vs-km^2 unit errors.
        - Depends on the stream threshold; align extraction density to the reference.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Output elevations differ from input DEM values in valley/depression areas
  diagnosis: 'Depression filling raises cells to pour-point elevation; The Priority-Flood algorithm modifies
    dElevation_mean by filling local depressions. This is intentional — it ensures every cell has a valid
    downslope path. The original DEM is preserved in dElevation_raw.

    ; [''compset_depression.cpp'', ''hexagon.'
  remedy: Use dElevation_raw for comparison; dElevation_mean is the corrected surface; ['Compare dElevation_raw
    (original) vs dElevation_mean (filled)', 'Differences indicate depressions that were filled']; Document
    this behavior for downstream users of the elevation data
  severity: silent
- id: dt_002
  symptom: Drainage area values are unreasonably small (single-digit numbers for large watersheds)
  diagnosis: 'dAccumulation stores cell COUNT, not drainage area in m²; Flow accumulation in HexWatershed
    counts the number of upstream cells, not the upstream contributing area. A value of 100 means 100
    cells drain to this point. To get area: multiply by mean cell area (dArea).

    ; [''compset_run.cpp'', ''hexagon.dAc'
  remedy: Multiply dAccumulation by mean cell area (m²) to get drainage area; output_parser.py --compute-area;
    ['drainage_area_m2 = dAccumulation * mean_cell_area', 'drainage_area_km2 = drainage_area_m2 / 1e6'];
    Always use --compute-area flag in output_parser.py
  severity: silent
- id: dt_003
  symptom: Slope values appear extremely small (0.001-0.1) for mountainous terrain
  diagnosis: Slope is a unitless ratio (rise/run), not degrees or percent; All slope outputs are computed
    as elevation_difference / horizontal_distance, producing a dimensionless ratio. A slope of 0.1 = 10%
    grade = 5.7 degrees. Users expecting degrees will interpret 0.1 as nearly flat, when it's actually
    moderat
  remedy: 'Convert to desired units: degrees = atan(ratio) * 180/pi; percent = ratio * 100; [''import
    math'', ''slope_deg = math.degrees(math.atan(slope_ratio))'', ''slope_pct = slope_ratio * 100''];
    Label all slope outputs with ''ratio'' suffix; convert only at visualization'
  severity: silent
- id: dt_004
  symptom: Stream burning enabled but flow directions ignore known channels
  diagnosis: Raw flowline shapefiles lack cell-to-stream mapping required by HexWatershed; HexWatershed
    expects topologically ordered flowlines with cell IDs mapped to each stream segment. This preprocessing
    is done by PyFlowline. Providing raw NHDPlus or HydroSHEDS shapefiles directly will cause the stream
    burn
  remedy: Preprocess flowlines with PyFlowline before running HexWatershed; ['pip install pyflowline',
    'Use pyflowline to generate topological flowline with cell mapping', 'Provide the pyflowline output
    path in basin JSON']; Always use PyFlowline pipeline; never pass raw shapefiles directly
  severity: fatal
- id: dt_005
  symptom: Segfault or garbage topology when running the model
  diagnosis: sMesh_type in config does not match the structure of the mesh JSON; Each mesh type (hexagon,
    square, mpas, etc.) has a different JSON structure and parser. If the config says 'mpas' but the mesh
    was generated as 'hexagon', the parser will misinterpret cell connectivity, causing crashes or silent
    top
  remedy: Ensure sMesh_type matches the actual mesh JSON format; ['Check mesh JSON header for mesh type',
    'Match sMesh_type parameter to the mesh generator used']; Record mesh type during mesh generation;
    validate before execution
  severity: fatal
- id: dt_006
  symptom: All distances and areas are nonsensical (very large or very small)
  diagnosis: Mesh coordinates are in projected CRS (meters) instead of geographic degrees; HexWatershed
    converts geographic coordinates (degrees) to 3D Cartesian for distance calculations. If coordinates
    are already in meters (e.g., UTM), the model interprets them as degrees — longitude 500000 degrees
    is meaning
  remedy: 'Reproject DEM and mesh to EPSG:4326 (geographic CRS); [''gdalwarp -t_srs EPSG:4326 input_projected.tif
    output_gcs.tif'', ''Regenerate mesh from the reprojected DEM'']; Always verify CRS before mesh generation:
    gdalinfo dem.tif | grep AUTHORITY'
  severity: fatal
- id: dt_007
  symptom: Stream network is either too dense (every cell is a stream) or too sparse (no streams)
  diagnosis: 'dAccumulation_threshold has dual interpretation: ratio (<1) vs absolute (>=1); If dAccumulation_threshold
    < 1.0, it''s treated as a ratio of the maximum accumulation (0.01 = top 1%). If >= 1.0, it''s an absolute
    cell count. Setting threshold to 100 means "cells with 100+ upstream cells", while 0.001 m'
  remedy: 'Check if your intended threshold is a ratio or absolute count; [''For ratio: use 0.001 to 0.1
    (typical: 0.01)'', ''For absolute: use integer >= 1 (e.g., 100, 1000)'', ''Verify by counting stream
    cells in output'']; Document threshold interpretation in config file comments'
  severity: degraded
- id: dt_008
  symptom: Model runs successfully but produces no watershed output files
  diagnosis: 'lCellID_outlet in basin JSON does not match any cell in the mesh; The outlet cell ID must
    exactly correspond to a cell in the mesh JSON. If no cell has that ID, the watershed is silently skipped
    — no error message, no output file. This is the most common cause of ''successful run with no results''.

    ; '
  remedy: Verify outlet cell ID exists in mesh; use flowline_converter with --mesh-json; flowline_converter.py
    --mesh-json mesh.json; ['python3 -c "import json; ids={c[\'lCellID\'] for c in json.load(open(\'mesh.json\'))[\'aCells\']};
    print(42567 in ids)"', 'If False, use flowline_converter.py to find nearest
  severity: silent
- id: dt_009
  symptom: No VTK file generated for 3D visualization
  diagnosis: 'iFlag_vtk defaults to 0; must be explicitly set to 1; VTK output is not generated by default.
    Users expecting 3D visualization files will find none unless they explicitly enable the flag.

    ; [''compset_export.cpp'', ''parameter.iFlag_vtk'']'
  remedy: 'Set iFlag_vtk = 1 in configuration JSON; [''Add "iFlag_vtk": 1 to config JSON'', ''Re-run the
    model'']; Include iFlag_vtk in standard config templates'
  severity: degraded
- id: dt_010
  symptom: Subbasin output missing hillslope columns (left/right/headwater)
  diagnosis: 'iFlag_hillslope defaults to 0; hillslope analysis requires explicit flag; Hillslope decomposition
    (left, right, headwater) is computationally expensive and disabled by default. Without it, subbasin
    characteristics lack hillslope dimensions, areas, slopes, and elevation profiles.

    ; [''compset_run.cpp'''
  remedy: 'Set iFlag_hillslope = 1 in configuration JSON and re-run; [''Add "iFlag_hillslope": 1 to config
    JSON'', ''Re-run the model'']; Enable by default for detailed subbasin analysis'
  severity: degraded
- id: dt_011
  symptom: Drainage density is 10^6 times too large or watershed area unrealistically small
  diagnosis: Cell area (dArea) is in km² instead of required m²; HexWatershed expects cell area in square
    meters. If a GIS tool exports area in km², the value is 10^6 times too small. A 5km hex cell should
    have dArea ≈ 21,650,000 m², not 21.65. All area-based metrics (drainage density, watershed area) inherit
    th
  remedy: 'Multiply cell areas by 1e6 to convert km² to m²; [''Check: a 5km hex should have area ~21.65e6
    m²'', "If values are ~21.65, they''re in km² — multiply by 1e6"]; Validate cell areas before running:
    area should be >> 1000 for any reasonable mesh'
  severity: silent
- id: dt_012
  symptom: All slopes are extremely steep (>10) or extremely flat (<0.0001)
  diagnosis: Neighbor distances (aNeighbor_distance) in wrong units (km or degrees instead of meters);
    Slope = elevation_diff / distance. If distance is in km instead of m, slopes are 1000x too steep.
    If distance is in degrees instead of m, slopes are ~111,000x too steep. Both produce physically impossible
    value
  remedy: 'Ensure aNeighbor_distance values are in meters; [''Check: for a 5km mesh, neighbor distances
    should be ~5000 m'', "If values are ~5, they''re in km — multiply by 1000", "If values are ~0.045,
    they''re in degrees — convert to meters"]; Validate neighbor distances during mesh generation'
  severity: silent
- id: dt_013
  symptom: Slopes are ~3x too steep compared to reference data
  diagnosis: 'DEM elevation values are in feet instead of meters; USGS NED and some other DEMs provide
    elevation in feet. Since HexWatershed assumes meters, slopes (Δz/Δd) are inflated by 3.28x. Depression
    filling also behaves incorrectly because fill depths are measured in feet but compared as meters.

    ; [''hexago'
  remedy: 'Convert DEM from feet to meters before mesh generation; ["gdal_calc.py -A input_ft.tif --outfile=output_m.tif
    --calc=''A*0.3048''", ''Regenerate mesh with meters-based DEM'']; Always verify DEM units: check max/min
    values against known elevations'
  severity: silent
- id: dt_014
  symptom: Large holes in watershed with valid terrain data missing
  diagnosis: dMissing_value_dem does not match actual DEM nodata value; If the config sets dMissing_value_dem
    = -9999.0 but the DEM uses -3.4028235e+38 (float minimum) as nodata, no cells will be excluded. Conversely,
    if the DEM uses -9999.0 but config uses -32768, valid cells near -9999 elevation will be incorr
  remedy: Set dMissing_value_dem to match the exact DEM nodata value; ['gdalinfo dem.tif | grep NoData',
    'Set dMissing_value_dem to that exact value']; Auto-detect nodata from DEM metadata in preprocessing
  severity: fatal
- id: dt_015
  symptom: Stream burning enabled but has no visible effect on flow directions
  diagnosis: 'Flowline coordinates are in projected CRS, not matching mesh GCS coordinates; Flowlines
    in UTM (coordinates like 500000, 4000000) will not intersect mesh cells in GCS (coordinates like -76.5,
    39.2). The burning algorithm finds no cell matches and silently skips all flowline segments.

    ; [''compset_str'
  remedy: 'Reproject flowlines to EPSG:4326; [''ogr2ogr -t_srs EPSG:4326 output.shp input_utm.shp'', ''Verify:
    ogrinfo output.shp -al -so | grep AUTHORITY'']; Always check CRS of both mesh and flowlines before
    running'
  severity: fatal
- id: dt_016
  symptom: Drainage density is ~1,000,000 km/km² (physically impossible)
  diagnosis: 'Computing density from meters without converting to km; Drainage density = total_stream_length
    / watershed_area. If length is in meters and area is in m², the result is in m/m² = m⁻¹. To get the
    standard km/km² = km⁻¹, convert: (length_m/1000) / (area_m²/1e6). Forgetting both conversions gives
    value'
  remedy: 'Convert length to km and area to km² before computing density; [''density_km_per_km2 = (length_m
    / 1000) / (area_m2 / 1e6)'', ''Typical range: 0.5-10 km/km²'']; Use output_parser.py which handles
    unit conversion automatically'
  severity: silent
- id: dt_017
  symptom: Stream network is disconnected with gaps at road crossings or mesh artifacts
  diagnosis: dBreach_threshold = 0 disables the breaching algorithm; The breaching algorithm corrects
    flow at locations where artificial barriers (roads, levees, mesh artifacts) block stream connectivity.
    With threshold = 0, no corrections are applied, and streams become disconnected wherever the DEM has
    local r
  remedy: 'Set dBreach_threshold to 0.05-0.1 meters; [''Add "dBreach_threshold": 0.1 to config JSON'',
    ''Re-run the model'']; Default breach threshold to 0.1 in config templates'
  severity: degraded
- id: dt_018
  symptom: Flow directions along streams don't match expected topology
  diagnosis: iFlag_stream_burning_topology=1 set without providing topology file; When topology-based
    stream burning is enabled, the model needs a topological flowline file (sFilename_flowline_topo) from
    PyFlowline. Without it, the model silently falls back to elevation-based routing, producing different
    results
  remedy: Either provide topology file or set iFlag_stream_burning_topology=0; ['Generate topology file
    using PyFlowline', 'Or set iFlag_stream_burning_topology to 0 for elevation-based routing']; Validate
    that all referenced files exist before running
  severity: silent
