template_version: "3.5"

identity:
  model_id: "OpenFOAM"
  scientific_reference_version: "OpenFOAM-dev (OpenFOAM Foundation / CFD Direct), foamRun finite-volume incompressible turbulent flow (incompressibleFluid module, RANS k-epsilon closure)"
  implementation:
    id: "openfoam-dev-incompressiblefluid"
    version: "OpenFOAM-dev"
    provenance: "C++; OpenFOAM Foundation (Henry Weller / Chris Greenshields, CFD Direct) finite-volume toolbox; foamRun dynamically loads the incompressibleFluid solver module with a RANS turbulence closure."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL-3.0-only"
  repo_url: "https://github.com/OpenFOAM/OpenFOAM-dev"

boundary:
  scope_in:
    - "Incompressible isothermal turbulent fluid flow (steady or transient) by the finite-volume method"
    - "Pressure-velocity coupling (SIMPLE / PISO / PIMPLE) on arbitrary polyhedral finite-volume meshes"
    - "RANS / LES turbulence closure (k-epsilon, k-omega SST, Spalart-Allmaras, Smagorinsky) supplying eddy viscosity"
    - "Lab-to-reach-scale hydraulics: channel/pipe flow, cavity, dam-break, wave-tank, free-surface VoF (incompressibleVoF) when scale permits"
  scope_out:
    - "Basin-scale (>100 km) ocean / storm-surge free-surface simulation with incompressibleVoF (mass loss, standing waves, zero surge under uniform forcing — use shallowWaterFoam or a dedicated ocean model)"
    - "Native geophysical / land-surface / catchment hydrology forcing (general continuum-mechanics CFD, not an Earth-system model)"
    - "Turnkey single-application workflow — the user must compose mesh, fields, schemes, solver, and turbulence model"
  spatial: "3-D"
  temporal: "sub-hourly"
  closure: "mass-balance"
  notes: "Per-timestep continuity (mass) is enforced by the pressure-Poisson correction (continuityErrors reports sum-local/global/cumulative). The incompressible isothermal path carries no energy-balance closure; momentum closure depends on the selected turbulence model (eddy-viscosity RANS here). deltaT is bounded by the Courant condition (Co = U*dt/dx < 1), so the effective temporal grain is sub-second to seconds, well below hourly. Free-surface mass conservation under the VoF (MULES) variant is only approximate and degrades at large domains."

inputs:
  forcing:
    - category: "boundary_driver"
      name: "Inlet velocity"
      unit: "m/s (vector)"
      source_kind: "user_provided"
      model_input_format: "0/U fixedValue patch field"
      notes: "Volumetric discharge Q (m^3/s) is imposed as U = Q/A_inlet at the inlet patch; OpenFOAM consumes velocity, not discharge."
    - category: "boundary_driver"
      name: "Outlet / reference pressure"
      unit: "kinematic m^2/s^2 [0 2 -2 0 0 0 0]"
      source_kind: "user_provided"
      model_input_format: "0/p (fixedValue / totalPressure) patch field"
      notes: "Incompressible solvers operate on kinematic pressure p/rho, NOT Pa; a dynamic-pressure (Pa) field crashes at startup with a dimension mismatch."
  parameters:
    - category: "fluid_property"
      name: "nu (kinematic viscosity)"
      unit: "m^2/s [0 2 -1 0 0 0 0]"
      source_kind: "dataset_lookup"
      model_input_format: "constant/physicalProperties (viscosityModel constant)"
      notes: "Kinematic nu = mu/rho, NOT dynamic mu [Pa.s]; water 20C ~1.004e-6, air 20C ~1.516e-5, seawater 15C ~1.19e-6. Sets the Reynolds number / flow regime."
    - category: "fluid_property"
      name: "sigma (surface tension)"
      unit: "N/m = kg/s^2 [1 0 -2 0 0 0 0]"
      source_kind: "dataset_lookup"
      model_input_format: "constant/phaseProperties (dev scalar sigma)"
      applicability: "VoF free-surface runs (incompressibleVoF) only"
      notes: "Water-air at 20C = 0.072 N/m. dev incompressibleVoF expects a scalar sigma in phaseProperties (not the legacy ((air water) 0.07) syntax)."
    - category: "turbulence_coefficient"
      name: "k-epsilon closure constants (Cmu, C1, C2, sigmak, sigmaEps)"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "momentumTransport coeffDict (overridable; baked defaults Cmu=0.09, C1=1.44, C2=1.92, sigmak=1.0, sigmaEps=1.3)"
      notes: "Hardcoded constructor defaults in the kEpsilon model; overridable but undocumented in the wrapper layer."
  initial_conditions:
    - category: "field_state"
      name: "Initial velocity / pressure fields"
      unit: "m/s ; kinematic m^2/s^2"
      source_kind: "user_provided"
      model_input_format: "0/U, 0/p internalField (uniform or nonuniform list)"
      notes: "Vector fields require vector syntax 'uniform (0 0 0)'; a scalar 'uniform 0' for U is a fatal parse error."
    - category: "field_state"
      name: "Initial turbulence fields (k, epsilon, omega)"
      unit: "k m^2/s^2 ; epsilon m^2/s^3 ; omega 1/s"
      source_kind: "user_provided"
      model_input_format: "0/k, 0/epsilon, 0/omega internalField + inlet patch values"
      notes: "Must be non-zero/physical: k = 1.5*(U_ref*TI)^2 with TI 0.01-0.10; epsilon = Cmu^0.75*k^1.5/l; omega = k^0.5/(Cmu^0.25*l). Zero values make the closure equations singular."
    - category: "field_state"
      name: "Initial phase fraction alpha.water and hydrostatic p_rgh"
      unit: "alpha dimensionless 0-1 ; p_rgh kinematic m^2/s^2"
      source_kind: "user_provided"
      model_input_format: "0/alpha.water via setFields (boxToCell/cylinderToCell); 0/p_rgh per-phase hydrostatic list"
      applicability: "VoF free-surface runs only"
      notes: "alpha.water=1 is water, 0 is air; uniform-0 init gives an all-air domain. p_rgh must be initialised to per-phase hydrostatic values aligned with the free surface, else a large interface imbalance drives spurious velocity spikes."
  boundary_conditions:
    - category: "mesh_geometry"
      name: "Computational mesh (polyMesh)"
      unit: "m (SI)"
      source_kind: "user_provided"
      model_input_format: "constant/polyMesh (points/faces/owner/neighbour/boundary) from blockMesh or snappyHexMesh"
      notes: "blockMeshDict convertToMeters scales ALL vertices; a wrong value silently rescales the domain (e.g. 1000x) and every derived Re / pressure. Patch names must exactly match field-file patches."
    - category: "patch_type_selection"
      name: "Boundary-condition patch types"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "0/<field> patch entries (fixedValue, zeroGradient, inletOutlet, noSlip, slip, empty, symmetry, wedge, cyclic, fixedFluxPressure)"
      notes: "empty for 1D/2D (faces normal to ignored direction), wedge for axisymmetric, symmetryPlane only on a perfectly planar patch; cyclic requires matching face areas."
    - category: "gravity_vector"
      name: "g (gravity)"
      unit: "m/s^2 (vector)"
      source_kind: "user_provided"
      model_input_format: "constant/g"
      applicability: "buoyant / VoF runs"
      notes: "Must point downward in mesh coordinates: (0 -9.81 0) Y-up or (0 0 -9.81) Z-up; wrong sign/axis silently reverses buoyancy."
    - category: "discretisation_selection"
      name: "Discretisation schemes (fvSchemes)"
      unit: "categorical"
      source_kind: "user_provided"
      model_input_format: "system/fvSchemes (ddt/grad/div/laplacian/snGrad selectors)"
      notes: "Selects temporal order (Euler/backward/CrankNicolson), convection scheme (upwind/linearUpwind/QUICK/vanLeer) and non-orthogonal correction; controls numerical diffusion and stability. dev VoF compression set here via interfaceCompression (cAlpha removed)."
    - category: "solver_control_selection"
      name: "Linear solvers and algorithm controls (fvSolution)"
      unit: "categorical / numeric"
      source_kind: "user_provided"
      model_input_format: "system/fvSolution (GAMG for p, smoothSolver for U/k/eps; PIMPLE nOuterCorrectors/nCorrectors/nNonOrthogonalCorrectors/residualControl/relaxationFactors)"
      notes: "nOuterCorrectors=1 is PISO, >1 is PIMPLE; SIMPLE uses relaxation <1 for steady pseudo-time."
    - category: "run_control_selection"
      name: "Run controls (controlDict)"
      unit: "categorical / numeric"
      source_kind: "user_provided"
      model_input_format: "system/controlDict (startTime/endTime, deltaT, adjustTimeStep, maxCo, writeControl, writeInterval, purgeWrite)"
      notes: "deltaT and maxCo govern Courant stability; writeInterval units depend on writeControl mode; purgeWrite>0 silently deletes older time directories."

processes:
  modules:
    - name: "foamRun (solver driver)"
      role: "driver"
      brief: "Dynamically loads the solver module named in controlDict (incompressibleFluid) and runs the flexible PIMPLE time loop, calling preSolve/predictor/corrector/postSolve hooks each outer iteration."
    - name: "pimpleSingleRegionControl"
      role: "integrator"
      brief: "Outer-loop / corrector control: nOuterCorrectors, nCorrectors, nNonOrthogonalCorrectors, residualControl convergence; gates which physics (flow / models / transport) run each sub-step."
    - name: "basicFluidSolver"
      role: "driver"
      brief: "Base solver providing mesh ownership, Courant-number computation (CoNum_), continuity-error reporting, mesh topo-change/motion plumbing, and adaptive-deltaT support."
    - name: "incompressibleFluid solver"
      role: "process_solver"
      brief: "Concrete solver module for steady/transient turbulent incompressible isothermal flow; owns p, U, phi and orchestrates the momentum and pressure solves."
    - name: "momentumPredictor"
      role: "process_solver"
      brief: "Assembles the momentum equation (ddt + div(phi,U) + MRF.DDt + divDevSigma == fvModels source), relaxes and constrains it, optionally solving with the explicit -grad(p) source."
    - name: "correctPressure"
      role: "process_solver"
      brief: "Builds and solves the pressure Poisson equation (laplacian(rAtU,p) == div(phiHbyA)) over the non-orthogonal corrector loop, then reconstructs U and the conservative face flux phi (PISO; SIMPLEC consistent variant)."
    - name: "viscosityModel"
      role: "process_solver"
      brief: "Kinematic viscosity model (constant or generalised-Newtonian) supplying laminar nu to the momentum transport and turbulence model."
    - name: "momentumTransportModel"
      role: "process_solver"
      brief: "Turbulence closure family (RAS/LES/laminar) computing the eddy viscosity nut and the implicit divDevSigma stress term added to the momentum matrix."
    - name: "kEpsilon (RAS closure)"
      role: "process_solver"
      brief: "Representative RANS model: solves k and epsilon transport with constants Cmu/C1/C2/sigmak/sigmaEps, produces nut = Cmu*k^2/epsilon, and applies an epsilon lower-bound clamp capping nut at nutMaxCoeff*nu."
      applicability: "RAS k-epsilon turbulence selection"
    - name: "pressureReference"
      role: "allocator"
      brief: "Pins the pressure level (refCell/refValue) in closed / needReference domains where the pressure is otherwise undetermined."
    - name: "MRF"
      role: "optional_module"
      brief: "Multiple Reference Frame zones: add Coriolis/centrifugal DDt to the momentum equation and make fluxes relative inside rotating zones."
      applicability: "when an MRFProperties dict is present"
    - name: "fvModels"
      role: "optional_module"
      brief: "Runtime-selectable source terms injected into the momentum and pressure equations."
      applicability: "when an fvModels dict is present"
    - name: "fvConstraints"
      role: "optional_module"
      brief: "Runtime-selectable constraints/limiters applied to UEqn and U."
      applicability: "when an fvConstraints dict is present"
    - name: "fvMeshTopoChangers"
      role: "optional_module"
      brief: "Mesh motion and topology change; correctPhi and the cached face velocity Uf keep the flux conservative across mesh changes."
      applicability: "moving / topology-changing mesh cases only"
    - name: "blockMesh (mesh generation)"
      role: "allocator"
      brief: "Generates the polyMesh (points/faces/owner/neighbour/boundary) consumed by all field operators; prerequisite to any solve."
  internal_edges:
    - from: "foamRun (solver driver)"
      to: "incompressibleFluid solver"
      kind: "invokes"
      brief: "solver::New instantiates the module named in controlDict (incompressibleFluid)."
    - from: "basicFluidSolver"
      to: "incompressibleFluid solver"
      kind: "invokes"
      brief: "Base solver supplies mesh ownership, Courant-number (CoNum_) and adaptive-deltaT machinery to the concrete solver."
    - from: "pimpleSingleRegionControl"
      to: "momentumPredictor"
      kind: "invokes"
      brief: "The PIMPLE loop calls momentumPredictor when pimple.flow() is active."
    - from: "pimpleSingleRegionControl"
      to: "correctPressure"
      kind: "invokes"
      brief: "pressureCorrector() runs nCorrectors PISO inner loops."
    - from: "momentumTransportModel"
      to: "momentumPredictor"
      kind: "invokes"
      brief: "divDevSigma(U) (implicit nut diffusion) is added into the momentum matrix each outer iteration."
    - from: "viscosityModel"
      to: "momentumTransportModel"
      kind: "invokes"
      brief: "Supplies laminar nu used in the effective viscosity and bounds."
    - from: "momentumPredictor"
      to: "U"
      kind: "writes_state"
      brief: "Solves UEqn == -grad(p), updating velocity when the momentum predictor is on."
    - from: "correctPressure"
      to: "p"
      kind: "writes_state"
      brief: "Solves the pressure Poisson equation and relaxes p."
    - from: "correctPressure"
      to: "U"
      kind: "writes_state"
      brief: "Reconstructs U = HbyA - rAtU*grad(p) and corrects boundary conditions."
    - from: "correctPressure"
      to: "phi"
      kind: "writes_state"
      brief: "phi = phiHbyA - pEqn.flux(), giving the conservative face flux (made relative to mesh motion)."
    - from: "p"
      to: "momentumPredictor"
      kind: "reads_state"
      brief: "fvc::grad(p) is the explicit pressure-gradient source in the momentum solve."
    - from: "phi"
      to: "momentumPredictor"
      kind: "reads_state"
      brief: "fvm::div(phi,U) convective term uses the current face flux."
    - from: "U"
      to: "kEpsilon (RAS closure)"
      kind: "reads_state"
      brief: "Velocity gradient drives turbulence production G."
    - from: "phi"
      to: "kEpsilon (RAS closure)"
      kind: "reads_state"
      brief: "Flux advects k and epsilon (div(phi,k), div(phi,epsilon))."
    - from: "kEpsilon (RAS closure)"
      to: "k"
      kind: "writes_state"
      brief: "Solves the k transport equation each correctTransport step."
    - from: "kEpsilon (RAS closure)"
      to: "epsilon"
      kind: "writes_state"
      brief: "Solves the epsilon transport equation each correctTransport step."
    - from: "kEpsilon (RAS closure)"
      to: "nut"
      kind: "writes_state"
      brief: "nut = Cmu*k^2/epsilon, consumed by divDevSigma in the momentum equation."
    - from: "MRF"
      to: "momentumPredictor"
      kind: "invokes"
      brief: "MRF.DDt(U) adds the Coriolis/centrifugal term to the momentum equation."
    - from: "MRF"
      to: "correctPressure"
      kind: "invokes"
      brief: "makeRelative(phiHbyA) and constrainPressure apply MRF in rotating zones."
    - from: "fvModels"
      to: "momentumPredictor"
      kind: "invokes"
      brief: "fvModels().source(U) injects explicit/implicit momentum sources into UEqn."
    - from: "fvModels"
      to: "correctPressure"
      kind: "invokes"
      brief: "fvModels().sourceProxy(p) injects volume sources into the pressure equation."
    - from: "fvConstraints"
      to: "momentumPredictor"
      kind: "invokes"
      brief: "constrain(UEqn) and constrain(U) apply limiters/fixed values to the momentum solve."
    - from: "pressureReference"
      to: "correctPressure"
      kind: "invokes"
      brief: "refCell/refValue pin the pressure level via pEqn.setReference in closed domains."
    - from: "fvMeshTopoChangers"
      to: "phi"
      kind: "writes_state"
      brief: "correctPhi and the cached face velocity Uf keep the face flux conservative across mesh motion / topology change."
    - from: "blockMesh (mesh generation)"
      to: "incompressibleFluid solver"
      kind: "consumes_input"
      brief: "The fvMesh is constructed from constant/polyMesh; all field operators require it."
    - from: "Inputs"
      to: "incompressibleFluid solver"
      kind: "consumes_input"
      brief: "Initial and boundary fields (U, p, k, epsilon, nut) are read at construction; patch names must match the polyMesh boundary."
    - from: "Inputs"
      to: "pimpleSingleRegionControl"
      kind: "consumes_input"
      brief: "nOuterCorrectors/nCorrectors/nNonOrthogonalCorrectors/relaxationFactors/residualControl are read from fvSolution."
    - from: "correctPressure"
      to: "Outputs"
      kind: "produces_output"
      brief: "continuityErrors() prints sum local/global/cumulative continuity error each pressure correction."
    - from: "incompressibleFluid solver"
      to: "Outputs"
      kind: "produces_output"
      brief: "runTime.write() emits U, p, phi, k, epsilon, nut per writeInterval into time directories."

states:
  variables:
    - name: "p"
      unit: "kinematic m^2/s^2 [0 2 -2 0 0 0 0]"
      role: "prognostic"
    - name: "p_rgh"
      unit: "kinematic m^2/s^2"
      role: "prognostic"
    - name: "U"
      unit: "m/s"
      role: "prognostic"
    - name: "phi"
      unit: "m^3/s (volumetric face flux)"
      role: "diagnostic"
    - name: "alpha.water"
      unit: "dimensionless 0-1"
      role: "prognostic"
    - name: "k"
      unit: "m^2/s^2"
      role: "prognostic"
    - name: "epsilon"
      unit: "m^2/s^3"
      role: "prognostic"
    - name: "omega"
      unit: "1/s"
      role: "prognostic"
    - name: "nut"
      unit: "m^2/s"
      role: "diagnostic"
    - name: "nuTilda"
      unit: "m^2/s"
      role: "prognostic"
    - name: "CoNum"
      unit: "dimensionless"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "U"
    validation_rank: 2
    unit: "m/s"
    description: "Cell-centre velocity vector field written per write-time directory; the primary kinematic solution variable."
    emitted_in: "time directories (caseDir/<time>/U)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Probe-point velocity is sensitive to mesh resolution and turbulence-model choice near walls (y+)."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Compare against PIV/LDV fields only on the resolved (steady or phase-averaged) part of the flow."]
      detrending_options: ["none"]
  - var: "p"
    validation_rank: 3
    unit: "kinematic m^2/s^2 (multiply by rho for Pa)"
    description: "Kinematic pressure field; pressure differences across patches give head loss / pressure drop after multiplying by rho."
    emitted_in: "time directories (caseDir/<time>/p)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Output is kinematic (p/rho); convert to Pa before comparing to a manometer/transducer."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Wall pressure-coefficient comparisons are strongly turbulence-model dependent in separated flow."]
      detrending_options: ["none"]
  - var: "phi"
    validation_rank: 4
    unit: "m^3/s (volumetric face flux)"
    description: "Conservative face-area-weighted flux; integrated over an outlet patch gives the volumetric flow rate Q = sum(phi)."
    emitted_in: "time directories (caseDir/<time>/phi); flow rate via surfaceFieldValue postProcessing"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Compare patch-integrated Q (sum of phi), not raw per-face flux, against a gauged discharge."]
      detrending_options: ["none"]
  - var: "alpha.water"
    validation_rank: 1
    unit: "dimensionless 0-1"
    description: "VoF phase fraction; the iso-surface alpha=0.5 defines the free surface, from which water-level / wave elevation is derived."
    emitted_in: "time directories (caseDir/<time>/alpha.water)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "timing_accuracy", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Only meaningful when MULES mass conservation holds; at large domains alpha drifts and the derived water level is unreliable."]
      detrending_options: ["none"]
  - var: "k"
    validation_rank: 5
    unit: "m^2/s^2"
    description: "Turbulent kinetic energy field from the RANS closure; diagnostic of turbulent mixing intensity."
    emitted_in: "time directories (caseDir/<time>/k)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["RANS k is a modelled (not resolved-transient) quantity; compare only to TKE estimated under the same averaging convention."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Strongly dependent on closure-coefficient choice (see influence block)."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "kinematic viscosity nu (uncertain input)"
      to: "U"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "laminar / transitional incompressible flow"
      citations: ["parekh2020_intrusive_pc_openfoam"]
    - from: "a1 (SST shear-stress limiter coefficient)"
      to: "U"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "k-omega SST closure"
      citations: ["martini2025_sst_viv_uq"]
    - from: "kappa (von Karman constant)"
      to: "U"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "k-omega SST closure"
      citations: ["martini2025_sst_viv_uq"]
    - from: "beta*/beta2 (SST destruction/closure coefficients)"
      to: "U"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "k-omega SST closure"
      citations: ["martini2025_sst_viv_uq"]
    - from: "sigma_omega2 (SST omega-equation diffusion coefficient)"
      to: "U"
      sensitivity_grade: MEDIUM
      basis: literature_quantitative
      lever_type: parameter
      applicability: "k-omega SST closure"
      citations: ["martini2025_sst_viv_uq"]
    - from: "SST k-omega closure coefficients"
      to: "p"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "mildly separated flow, k-omega SST closure"
      citations: ["witte2017_closure_coeff_uq", "mcconkey2024_turbo_rans"]
    - from: "SST k-omega closure coefficients"
      to: "k"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "separated flow, k-omega SST / GEKO closure"
      citations: ["mcconkey2024_turbo_rans"]
    - from: "SST k-omega closure coefficients"
      to: "U"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "separated flow, k-omega SST / GEKO closure"
      citations: ["mcconkey2024_turbo_rans", "witte2017_closure_coeff_uq"]
    - from: "Reynolds-stress model-form (eddy-viscosity assumption) perturbation"
      to: "U"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: structural
      applicability: "RANS structural / model-form uncertainty"
      citations: ["heyse2015_model_form_uq_openfoam"]
    - from: "Reynolds-stress model-form (eddy-viscosity assumption) perturbation"
      to: "p"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: structural
      applicability: "RANS structural / model-form uncertainty"
      citations: ["heyse2015_model_form_uq_openfoam"]
  citation_index:
    parekh2020_intrusive_pc_openfoam:
      short_citation: "Parekh & Verstappen 2020"
      doi: "10.1007/978-3-030-50436-6_50"
      note: "Intrusive generalized polynomial chaos on OpenFOAM incompressible NS; propagates uncertain kinematic viscosity to the velocity field in plane Poiseuille flow."
    martini2025_sst_viv_uq:
      short_citation: "Martini et al. 2025"
      doi: "10.1016/j.jfluidstructs.2024.104253"
      note: "Non-intrusive polynomial chaos + Sobol indices on URANS k-omega SST (OpenFOAM) VIV; top coefficients a1, kappa, beta*/beta2, sigma_omega2."
    witte2017_closure_coeff_uq:
      short_citation: "Witte 2017"
      note: "Variance-based (Sobol) global SA of SA / SST k-omega / Wray-Agarwal closure coefficients in OpenFOAM and Fluent for mildly separated flows (pressure coefficient, lift, drag, skin friction, separation/reattachment)."
    mcconkey2024_turbo_rans:
      short_citation: "McConkey et al. 2024 (turbo-RANS)"
      doi: "10.1108/HFF-12-2023-0726"
      note: "Bayesian optimization of k-omega SST / GEKO coefficients (OpenFOAM, Fluent, STAR-CCM+); coefficient sensitivity of velocity/TKE fields and wall pressure coefficient; arXiv 2311.15840."
    heyse2015_model_form_uq_openfoam:
      short_citation: "Heyse et al. 2015"
      note: "OpenFOAM Reynolds-stress eigenspace-perturbation framework quantifying RANS structural (model-form) uncertainty on mean velocity and pressure."

safety:
  hazards:
    - id: "kinematic_pressure_dimension_mismatch"
      kind: "weather_file_semantic"
      description: "Pressure field given dynamic dims [Pa] instead of kinematic [0 2 -2 0 0 0 0]; incompressible solver crashes with 'dimensions not equal' (dt_001)."
      severity: "fatal"
    - id: "dynamic_vs_kinematic_viscosity"
      kind: "coefficient_runtime_silent_fallback"
      description: "Dynamic mu [Pa.s] supplied where kinematic nu [m^2/s] is expected; Reynolds number wrong by ~rho (≈1000x for water), converges silently wrong (dt_011)."
      severity: "silent"
    - id: "convertToMeters_domain_scale"
      kind: "soil_semantic"
      description: "Wrong convertToMeters in blockMeshDict rescales all vertices (e.g. mm-as-m → 1000x domain); Re and all derived SI quantities silently wrong (dt_002)."
      severity: "silent"
    - id: "courant_violation_divergence"
      kind: "numerical_instability"
      description: "deltaT too large for mesh/velocity gives Courant >> 1, CFL violation → rising residuals then floating-point exception / NaN (dt_004)."
      severity: "fatal"
    - id: "zero_turbulence_field_singularity"
      kind: "initial_condition_semantic"
      description: "k/epsilon/omega initialised at 0 makes the closure equations singular (division by zero); turbulent run diverges in the first few iterations (dt_006)."
      severity: "fatal"
    - id: "gravity_vector_sign_axis"
      kind: "control_semantic"
      description: "Gravity vector with wrong sign/axis relative to mesh runs without error but reverses buoyancy — silently unphysical VoF results (dt_005)."
      severity: "silent"
    - id: "patch_name_mismatch"
      kind: "control_semantic"
      description: "Field-file patch names not matching constant/polyMesh/boundary → fatal 'patch not found' at startup (dt_003)."
      severity: "fatal"
    - id: "vector_field_scalar_internalField"
      kind: "parser_semantic"
      description: "Scalar 'uniform 0' used for a volVectorField (U) → fatal parse error reading the field file (dt_012)."
      severity: "fatal"
    - id: "non_orthogonality_pressure_checkerboard"
      kind: "numerical_instability"
      description: "Mesh non-orthogonality > 70 deg without correctors → pressure oscillation / checkerboard and divergence (dt_010, dt_020)."
      severity: "fatal_or_silent"
    - id: "relaxation_too_aggressive"
      kind: "numerical_instability"
      description: "Relaxation factors too close to 1.0 (or too few outer correctors) → sawtooth residuals, SIMPLE/PIMPLE never converges (dt_013)."
      severity: "degraded"
    - id: "writeControl_writeInterval_unit_mismatch"
      kind: "control_semantic"
      description: "writeControl/writeInterval unit mismatch (timeStep vs runTime) → far too many or too few output times; disk fills or results sparse (dt_007)."
      severity: "silent"
    - id: "purgeWrite_silent_data_loss"
      kind: "control_semantic"
      description: "purgeWrite > 0 in controlDict silently deletes older time directories, losing earlier results (dt_014)."
      severity: "silent"
    - id: "yplus_out_of_wall_function_range"
      kind: "numerical_instability"
      description: "First-cell height giving y+ outside the wall-function range (30-300, or <1 for resolved walls) → inaccurate near-wall turbulence and skin friction (dt_016)."
      severity: "degraded"
    - id: "alpha_unset_all_air"
      kind: "initial_condition_semantic"
      description: "alpha.water left uniform 0 (no setFields) → VoF domain is entirely air, no free surface (dt_008)."
      severity: "silent"
    - id: "vof_sigma_wrong"
      kind: "coefficient_runtime_silent_fallback"
      description: "Surface tension sigma with wrong value/dims [1 0 -2 0 0 0 0] → over-sharp/diffuse interface, unphysical droplet fragmentation (dt_019)."
      severity: "silent"
    - id: "mulescorr_alpha_overshoot"
      kind: "numerical_instability"
      description: "MULESCorr yes lets alpha>1 (Rayleigh-Taylor) → NaN velocity; Courant computation skips NaN, adaptive deltaT collapses toward machine zero while Co reads ~maxCo (dt_022)."
      severity: "fatal"
    - id: "setFields_box_unaligned_alpha_overshoot"
      kind: "initial_condition_semantic"
      description: "setFields box not aligned to a cell face partially fills a cell; MULES compression overshoots → alpha.water Max>1 from the first step (dt_027)."
      severity: "degraded"
    - id: "prgh_hydrostatic_init_gravity_waves"
      kind: "initial_condition_semantic"
      description: "Uniform p_rgh init instead of per-phase hydrostatic creates a large interface imbalance → ~32 m/s spurious velocities and standing gravity waves that permanently cap deltaT (dt_028)."
      severity: "degraded"
    - id: "overdetermined_atmosphere_bc"
      kind: "control_semantic"
      description: "Fixing both U and p_rgh at the same (atmosphere) boundary is overdetermined for an incompressible solver → incompatible flows diverge mid-run (dt_023)."
      severity: "fatal"
    - id: "vof_alpha_inletOutlet_mass_loss"
      kind: "control_semantic"
      description: "alpha.water inletOutlet at an outflow boundary acts as zeroGradient, letting diffused alpha exit → monotonic water/mass loss; use zeroGradient/fixedValue 0 (dt_025)."
      severity: "silent"
    - id: "open_bc_hydrostatic_blowup"
      kind: "control_semantic"
      description: "Open lateral BCs via zeroGradient p_rgh on a hydrostatic water column create a ~400 kPa boundary mismatch → instant blowup; open boundaries need radiation/Orlanski conditions (dt_029)."
      severity: "fatal"
    - id: "interfaceCompression_large_domain_dt_crash"
      kind: "numerical_instability"
      description: "interfaceCompression anti-diffusion flux exceeds the physical flux at curved interface cells on large closed VoF domains → Co spikes >maxCo, deltaT grow-crash cycle; use Gauss vanLeer (dt_030)."
      severity: "degraded"
    - id: "dev_phaseProperties_required"
      kind: "control_semantic"
      description: "Legacy constant/transportProperties used with OpenFOAM-dev incompressibleVoF → 'cannot find phaseProperties' / 'sigma undefined'; dev needs per-phase physicalProperties.{water,air} + phaseProperties (dt_032)."
      severity: "fatal"
    - id: "deprecated_cAlpha_entry"
      kind: "control_semantic"
      description: "cAlpha entry in fvSolution under OpenFOAM-dev is fatal ('Deprecated and unused cAlpha'); interface compression is now selected in fvSchemes divSchemes (dt_026)."
      severity: "fatal"
  validation_limits:
    - "incompressibleVoF is structurally inappropriate for basin-scale (>100 km) ocean / storm-surge domains: MULES mass loss, standing gravity waves from closed slip-wall domains, and zero net surge under uniform (zero-gradient) barometric forcing. Use shallowWaterFoam (depth-integrated SWE) or a dedicated ocean model."
    - "Uniform domain-averaged barometric forcing has zero horizontal pressure gradient, so the inverse-barometer response produces no spatial surge variation; spatially-varying forcing is required."
    - "RANS eddy-viscosity closures (k-epsilon, k-omega SST) are structurally limited in strongly separated / anisotropic flows; predictions there depend heavily on closure-coefficient and model-form choices (see influence block)."
    - "Sub-second Courant-limited timestep makes domain integrations over very long physical durations (multi-day ocean events) impractical with the resolved-physics VoF path."
  warnings:
    - "Incompressible solvers operate on KINEMATIC pressure p/rho and kinematic viscosity nu/diffusivity; all pressure outputs must be multiplied by rho before comparison to a pressure transducer."
    - "phi is a face flux distinct from the cell-centre velocity U; flow rate is the patch integral sum(phi), not U times area unless the inlet is uniform."
    - "The kEpsilon model applies an internal epsilon lower-bound clamp (nut capped at nutMaxCoeff*nu); dissipation can be silently floored, altering the eddy viscosity near low-turbulence regions."
    - "runTimeModifiable re-reads dictionaries but does NOT re-read 0/ field boundary conditions during a run; BC changes require a restart."
  assumptions:
    - statement: "This dag describes the foamRun incompressibleFluid path (steady/transient turbulent incompressible isothermal flow with a RANS k-epsilon closure) as dissected from OpenFOAM-dev source; VoF (incompressibleVoF), compressible, multiphaseEuler and solid solver modules exist but are out of scope for this dag."
      scope: "solver module coverage"
      source: "applications/solvers/foamRun and applications/modules/incompressibleFluid (correctPressure.C, momentumPredictor.C); cavity_ghia_re100 validation case"
      status: "adopted"
    - statement: "Per-timestep closure is mass-balance only (continuity enforced via the pressure-Poisson correction); the incompressible isothermal path carries no surface energy budget, and momentum closure is the selected eddy-viscosity RANS model."
      scope: "conservation / closure"
      source: "OpenFOAM user guide (case-file-structure, models) and incompressibleFluid correctPressure continuityErrors"
      status: "adopted"
    - statement: "Geometry is treated as a 3-D (or empty-patch-reduced 2-D / wedge axisymmetric) arbitrary polyhedral finite-volume mesh, not a structured grid."
      scope: "geometry"
      source: "OpenFOAM user guide boundaries / case-file-structure (polyMesh)"
      status: "adopted"
    - statement: "OpenFOAM-dev incompressibleVoF requires the dev constant/ structure (per-phase physicalProperties.{water,air} + phaseProperties scalar sigma), not the legacy interFoam transportProperties; compression is selected in fvSchemes, cAlpha is removed."
      scope: "VoF configuration semantics"
      source: "OpenFOAM-dev incompressibleVoF behaviour (diagnostic triplets dt_026, dt_032)"
      status: "adopted"
