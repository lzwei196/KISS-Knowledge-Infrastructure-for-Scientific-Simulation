template_version: "3.5"
# VELMA dag = the REAL EPA VELMA 2.1 engine (JVelma.jar), run headless by tools/run_velma_engine.py.
# Rewritten 2026-10-07 from the engine's own files (BlueRiver_Example configuration xml, DailyResults.csv
# headers, VELMA 2.0 User Manual + 2.1 supplement in KISSPATH_HOME/engine_builds_20261006/VELMA/).
# The Python stand-in tools/run_velma.py is a SURROGATE with its own, separate contract:
# docs/surrogate_velma_4layer_dag.yaml (it was this file until 2026-10-07). Nothing in THIS file
# describes the surrogate, and nothing in that file describes VELMA.

identity:
  model_id: "VELMA"
  scientific_reference_version: "EPA VELMA 2.1 (JVelma.jar VELMA_2.1.1.0, EPA VELMA2.1-PROGRAM-MAR2022); process science per the VELMA 2.0 User Manual (McKane et al., US EPA 2014), its 2.1 supplement (MAR2022) and Abdelnour et al. 2011 (WRR, doi:10.1029/2010WR010165), 2013 (WRR, doi:10.1029/2012WR012994)"
  implementation:
    id: "epa-velma-2.1-java"
    version: "VELMA_2.1.1.0 (JVelma.jar, gov.epa.velmasimulator.VelmaSimulatorCmdLine)"
    provenance: "Official EPA release VELMA2.1-PROGRAM-MAR2022.ZIP (EPA Science Inventory deid=354355); launcher KISSPATH_HOME/engine_builds_20261006/VELMA/run_velma_headless.sh (java -Djava.awt.headless=true -cp jars/JVelma.jar gov.epa.velmasimulator.VelmaSimulatorCmdLine); build log KISSPATH_HOME/engine_builds_20261006/VELMA/BUILD_LOG.md. Official BlueRiver_Example (HJA WS10, 1969-2008) reproduced through tools/run_velma_engine.py: engine NSE 0.7954119608437563, DailyResults.csv byte-identical to the build-log run."
    run_tool: "tools/run_velma_engine.py"
    surrogate:
      id: "velma-python-4layer"
      tool: "tools/run_velma.py"
      contract: "docs/surrogate_velma_4layer_dag.yaml"
      status: "SURROGATE - not EPA VELMA; never report its output as VELMA"
  ki_class: "forward_model"
  is_family_dag: false
  language: "java"
  license: "Public domain (US EPA)"
  repo_url: "https://www.epa.gov/water-research/visualizing-ecosystem-land-management-assessments-velma-model-20"

boundary:
  scope_in:
    - "Spatially distributed daily water balance on a DEM grid (30 m cells in the BlueRiver_Example), with a 4-layer soil column in every cell"
    - "Vertical drainage and lateral downslope subsurface flow between cells; hydraulic conductivity decays exponentially with depth (surfaceKs, ksVertical/ksLateralExponentialDecayFactor)"
    - "Surface runoff and standing water; daily runoff at the outlet as a depth averaged over the delineated watershed (Runoff_All, mm/day)"
    - "Temperature-index snow model (snowFormationTemperature, snowMeltTemperature, snowMeltRate, rainOnSnowEffect)"
    - "Hamon potential evapotranspiration and actual ET limited by soil water and cover (leaf biomass, stand age)"
    - "Plant and soil carbon and nitrogen: Leaf-Stem-Root biomass and detritus pools, NPP, mortality, decomposition (Potter et al. 1993), humus, nitrification and denitrification, N fixation, plant N uptake"
    - "Transport of NO3, NH4, DON and DOC with the water to the stream"
    - "Land-use disturbances such as harvest (the WS10 example applies a 1975 clearcut through HarvestLsrDisturbanceModel)"
  scope_out:
    - "Sub-daily processes (daily time step only)"
    - "Energy-balance snow physics (the snow model is temperature-index only)"
    - "Hydraulic channel routing (no stage, velocity or backwater); the outlet output is a daily runoff depth"
    - "DEM flat-processing, flow direction and outlet delineation are done before the run (EPA JPDEM tool), not by the simulator"
    - "Building VELMA inputs (DEM, soil/cover/age maps, soil and cover parameters) for a new site: the KI has no converter for this yet (open gap); the KI runs configurations that already exist"
  spatial: "2-D distributed grid (DEM cells) with a 4-layer vertical soil column per cell"
  temporal: "daily"
  closure: "mass-balance"
  notes: "VELMA is designed as a water, carbon and nitrogen mass-balance model. Its own delineated-average outputs do not close exactly: in the official example (1969-2008) driver P 2217 mm/yr minus ET 698 minus Runoff_All 1715 leaves -196 mm/yr (-8.8 % of P) before storage change. This is engine accounting, not an input unit error; report it, do not 'fix' it."

inputs:
  forcing:
    - category: "forcing"
      name: "precipitation"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: "DefaultWeatherModel rainDriverDataFileName (and VelmaInputs input_rain): text file, one value per line, no header, exactly one line per day from forcing_start-01-01; built by tools/build_velma_weather_from_source.py"
      notes: "Applied uniformly to every cell of the delineated watershed; the snow model splits it into rain and snow. Never fill or invent days: the builder stops on a missing day, and run_velma_engine.py refuses a file with fewer rows than forcing_start..eyear or values outside 0..1000 mm/day."
    - category: "forcing"
      name: "air temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "DefaultWeatherModel airTemperatureDriverDataFileName (and VelmaInputs input_at): daily mean air temperature, one value per line, no header, one line per day from forcing_start-01-01"
      notes: "Degrees Celsius, NOT Kelvin (the Kelvin JSON of convert_forcing_to_velma.py belongs to the surrogate only). run_velma_engine.py refuses values outside -60..50."
  parameters:
    - category: "parameters"
      name: "simulation configuration (VELMA xml)"
      unit: "per key (mm, mm/day, fractions, degC, gC/m2, gN/m2)"
      source_kind: "user_provided"
      model_input_format: "<configuration>.xml (groups startups, calibration, cover, disturbance, soil, weather, cellDataWriter); read by VelmaSimulatorCmdLine; every change is passed as --kv=/group/props/key,value and the xml is never edited"
      notes: "The KI runs an existing configuration (the EPA BlueRiver_Example for HJA WS10). A VELMA 2.0 configuration needs the 2.1 humus migration (dt_velma_025), which run_velma_engine.py does by default."
    - category: "parameters"
      name: "digital elevation model (input_dem) and grid geometry (cell, ncol, nrow, outx, outy)"
      unit: "m"
      source_kind: "dataset_lookup"
      model_input_format: "flat-processed ESRI ASCII grid named by VelmaInputs input_dem; cell size `cell` (m); outlet cell outx/outy"
      notes: "Must be flat-processed (JPDEM) before the run. The outlet cell defines the delineated watershed whose average every DailyResults.csv column reports."
    - category: "parameters"
      name: "soil parameters per soil type (/soil/<name>) and soil map"
      unit: "surfaceKs mm/d; decay factors 1/mm; porosityFraction, fieldCapacity, wiltPoint m3/m3; soilColumnDepth mm; initialHumusCarbon gC/m2"
      source_kind: "calibrated"
      model_input_format: "xml /soil/<name>/<key> (surfaceKs, ksLateralExponentialDecayFactor, ksVerticalExponentialDecayFactor, porosityFraction, fieldCapacity, wiltPoint, soilColumnDepth, setSoilLayerWeights or setSoilLayerThicknesses, humusCtoN, initialHumusCarbon, humusNmaxDecay, nitrification keys); map soilParametersIndexMapFileName (ASCII grid of soil ids)"
      notes: "In VELMA 2.1 humusCtoN, initialHumusCarbon and humusNmaxDecay are SOIL keys; humusCtoN = 0 gives NaN on day 1 (run_velma_engine.py refuses it)."
    - category: "parameters"
      name: "cover parameters per cover type (/cover/<name>) with cover and age maps"
      unit: "per key (PET coefficients, gC/m2 pools, C:N ratios, day-of-year)"
      source_kind: "calibrated"
      model_input_format: "xml /cover/<name>/<key> (petParam1, petParam2, temperaturePetOff, noTranspirationPetFraction, initial biomass/detritus pools, C:N ratios, mortality and uptake keys); maps coverSpeciesIndexMapFileName and coverAgeMapFileName"
    - category: "parameters"
      name: "snow model parameters (snowFormationTemperature, snowMeltTemperature, snowMeltRate, rainOnSnowEffect)"
      unit: "degC, degC, mm/degC/d, fraction"
      source_kind: "calibrated"
      model_input_format: "xml /weather/DefaultWeatherModel/<key>"
      notes: "Below snowFormationTemperature all of the day's precipitation is snow; above snowMeltTemperature melt = snowMeltRate x (airT - snowMeltTemperature) + rainOnSnowEffect x rain (VELMA 2.0 User Manual sec. 6)."
  initial_conditions:
    - category: "initial_conditions"
      name: "start state spatial maps (spin-up end state)"
      unit: "per map (mm, m3/m3, gC/m2, gN/m2)"
      source_kind: "derived"
      model_input_format: "folder of .asc state maps given by /startups/VelmaStartups.properties/setStartStateSpatialDataLocationName (run_velma_engine.py --start-state-dir), written by an earlier run's setEndStateSpatialDataLocationName (--end-state-dir)"
      notes: "Without a start state the run starts from the xml initial values (soil water starts at porosity). Use a spin-up run that carries the site history (e.g. the 1975 WS10 clearcut) and discard the first year after any change of weather source."
  boundary_conditions:
    - category: "boundary_conditions"
      name: "simulation and forcing years (syear, eyear, forcing_start, forcing_end)"
      unit: "year"
      source_kind: "user_provided"
      model_input_format: "xml /calibration/VelmaInputs.properties/<key> or run_velma_engine.py --syear/--eyear/--forcing-start"
      notes: "Driver row 1 is forcing_start-01-01; syear must be >= forcing_start."
    - category: "boundary_conditions"
      name: "observed runoff for the engine's own Nash-Sutcliffe (input_runoff)"
      unit: "mm/d"
      source_kind: "user_provided"
      model_input_format: "one value per line from forcing_start-01-01 (run_velma_engine.py --observed-runoff); used only for NashSutcliffeCoefficients.txt"
      notes: "Read BY ROW from forcing_start; cut the file when forcing_start moves (dt_velma_028). It does not change the simulation."
    - category: "boundary_conditions"
      name: "disturbance schedule (/disturbance/<name>)"
      unit: "year / day-of-year / fractions"
      source_kind: "user_provided"
      model_input_format: "xml disturbance blocks, e.g. HarvestLsrDisturbanceModel with initializeActiveYears, initializeActiveJdays and harvest fractions"

processes:
  modules:
    - name: "VelmaSimulatorCmdLine"
      role: "driver"
      brief: "Headless command-line simulator: reads the configuration xml plus --kv overrides, initialises the grid, and steps every cell of the delineated watershed one day at a time from syear to eyear."
    - name: "DefaultWeatherModel"
      role: "process_solver"
      brief: "Gives every cell the same daily precipitation (mm) and air temperature (degC) from the two driver files."
    - name: "SnowModel"
      role: "process_solver"
      brief: "Temperature-index snow: rain/snow split at snowFormationTemperature; melt = snowMeltRate*(airT - snowMeltTemperature) + rainOnSnowEffect*rain above snowMeltTemperature; keeps the Snow Depth store (mm of water)."
    - name: "PetEtModel"
      role: "process_solver"
      brief: "Hamon PET (petParam1*petParam2*roair*esat), active above temperaturePetOff; actual ET drawn from the soil layers, limited by soil water and cover (leaf biomass, stand age; ET recovery after disturbance)."
    - name: "SoilColumnHydrology"
      role: "process_solver"
      brief: "Four soil layers per cell: infiltration, vertical drainage and lateral downslope flow with a logistic switch near field capacity and Ks decaying exponentially with depth; saturation gives surface runoff and standing water."
    - name: "DownslopeFlowRouting"
      role: "integrator"
      brief: "Moves surface and lateral subsurface water cell to cell along the DEM flow network to reaches and the outlet; reports Runoff_All (mm/day, delineated average) and ReachFlowResults.csv."
    - name: "PlantSoilCarbonNitrogen"
      role: "process_solver"
      brief: "Leaf-Stem-Root biomass and detritus C/N pools, NPP, mortality, decomposition (Potter et al. 1993), humus, nitrification and denitrification (Del Grosso), N fixation and plant N uptake; uses soil water and soil temperature."
    - name: "SoluteTransport"
      role: "process_solver"
      brief: "Carries NO3, NH4, DON and DOC with the moving water; reports surface and subsurface losses to the stream."
    - name: "DisturbanceModels"
      role: "optional_module"
      applicability: "only when the configuration has disturbance blocks"
      brief: "Scheduled land-use events, e.g. HarvestLsrDisturbanceModel (WS10: clearcut 1975, day 182) removing or moving biomass C/N."
    - name: "NashSutcliffeStatistics"
      role: "optional_module"
      applicability: "only when input_runoff is given"
      brief: "Compares Runoff_All with the observed input_runoff over nashSutcliffeStart/EndYearForRunoffStats; writes NashSutcliffeCoefficients.txt (NSE and RMSE in mm/day)."
  internal_edges:
    - from: "Inputs"
      to: "DefaultWeatherModel"
      kind: "consumes_input"
      brief: "daily precipitation (mm) and air temperature (degC) driver files"
    - from: "VelmaSimulatorCmdLine"
      to: "DefaultWeatherModel"
      kind: "invokes"
      brief: "daily weather for every cell"
    - from: "DefaultWeatherModel"
      to: "SnowModel"
      kind: "invokes"
      brief: "precipitation and air temperature split into rain, snow and melt"
    - from: "SnowModel"
      to: "snow_depth"
      kind: "writes_state"
      brief: "adds snow, removes melt"
    - from: "SnowModel"
      to: "SoilColumnHydrology"
      kind: "invokes"
      brief: "rain + melt reach the soil surface"
    - from: "VelmaSimulatorCmdLine"
      to: "PetEtModel"
      kind: "invokes"
      brief: "daily PET and ET per cell"
    - from: "Inputs"
      to: "PetEtModel"
      kind: "consumes_input"
      brief: "air temperature drives Hamon PET; cover parameters set its coefficients"
    - from: "PetEtModel"
      to: "soil_moisture[4]"
      kind: "writes_state"
      brief: "removes actual ET from the soil layers"
    - from: "SoilColumnHydrology"
      to: "soil_moisture[4]"
      kind: "writes_state"
      brief: "infiltration and vertical drainage between layers"
    - from: "SoilColumnHydrology"
      to: "standing_water"
      kind: "writes_state"
      brief: "saturation excess ponds or runs off"
    - from: "SoilColumnHydrology"
      to: "DownslopeFlowRouting"
      kind: "invokes"
      brief: "surface and lateral water leave the cell downslope"
    - from: "DownslopeFlowRouting"
      to: "soil_moisture[4]"
      kind: "writes_state"
      brief: "lateral inflow from upslope cells"
    - from: "DownslopeFlowRouting"
      to: "Outputs"
      kind: "produces_output"
      brief: "Runoff_All (mm/day) at the outlet -> Q_sim_m3s via run_velma_engine.py"
    - from: "PlantSoilCarbonNitrogen"
      to: "soil_moisture[4]"
      kind: "reads_state"
      brief: "soil water limits decomposition, nitrification, denitrification and uptake"
    - from: "PlantSoilCarbonNitrogen"
      to: "carbon_nitrogen_pools"
      kind: "writes_state"
      brief: "biomass, detritus, humus, NH4, NO3, DON, DOC pools"
    - from: "VelmaSimulatorCmdLine"
      to: "PlantSoilCarbonNitrogen"
      kind: "invokes"
      brief: "daily C/N step per cell"
    - from: "SoluteTransport"
      to: "carbon_nitrogen_pools"
      kind: "reads_state"
      brief: "dissolved NO3, NH4, DON, DOC available for transport"
    - from: "DownslopeFlowRouting"
      to: "SoluteTransport"
      kind: "invokes"
      brief: "solutes move with the routed water"
    - from: "SoluteTransport"
      to: "Outputs"
      kind: "produces_output"
      brief: "surface and subsurface NO3/NH4/DON/DOC losses in DailyResults.csv"
    - from: "DisturbanceModels"
      to: "carbon_nitrogen_pools"
      kind: "writes_state"
      brief: "harvest removes or moves biomass C/N on the scheduled day"
    - from: "NashSutcliffeStatistics"
      to: "Outputs"
      kind: "produces_output"
      brief: "NashSutcliffeCoefficients.txt from Runoff_All vs input_runoff"

states:
  variables:
    - name: "soil_moisture[4]"
      unit: "m3/m3"
      role: "prognostic"
    - name: "snow_depth"
      unit: "mm"
      role: "prognostic"
    - name: "standing_water"
      unit: "mm"
      role: "prognostic"
    - name: "carbon_nitrogen_pools"
      unit: "gC/m2, gN/m2"
      role: "prognostic"
    - name: "ground_temperature[4]"
      unit: "degC"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "Q_sim_m3s"
    validation_rank: 1
    unit: "m3/s"
    description: "Daily outlet discharge = Runoff_All(mm/day)_Delineated_Average x area / 86400 s, written by run_velma_engine.py; area = --area-km2 (pass the gauged drainage area when comparing with a gauge) or else the engine's delineated area."
    emitted_in: "<output-root>/<run_index>/velma_daily_runoff.csv (column Q_sim_m3s), from the engine's DailyResults.csv"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
          caveats:
            - "Score only after spin-up, and drop at least the first year after a change of weather source (e.g. station weather -> MSWX)."
            - "Use the same area on both sides (gauged area); the delineated area can differ (WS10: 14.58 ha delineated vs 10.2 ha gauged, dt_velma_030)."
            - "A single outlet hydrograph; interior gauges need a cell or reach output (CellDataWriter, ReachFlowResults.csv)."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Single-instant comparison only meaningful for peak/low-flow magnitude checks."
      detrending_options:
        - "none"
  - var: "mean_runoff_mm_d"
    validation_rank: 2
    unit: "mm/d"
    description: "Daily outlet runoff depth averaged over the delineated watershed (Runoff_All(mm/day)_Delineated_Average); the series the engine itself compares with input_runoff."
    emitted_in: "DailyResults.csv column Runoff_All(mm/day)_Delineated_Average; velma_daily_runoff.csv column runoff_mm_d"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Compare with observed runoff depth over the same watershed (gauge discharge / gauged area)."
      detrending_options:
        - "none"
  - var: "mean_et_mm_d"
    validation_rank: 3
    unit: "mm/d"
    description: "Daily actual evapotranspiration averaged over the delineated watershed (ET(mm/day)_Delineated_Average); PET is in PET(mm/day)_Delineated_Average."
    emitted_in: "DailyResults.csv column ET(mm/day)_Delineated_Average"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Hamon PET is temperature based; expect bias against flux-tower ET where radiation or humidity controls ET."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Watershed average; compare only with watershed-aggregated ET products."
      detrending_options:
        - "none"
  - var: "final_sw_mm[4]"
    validation_rank: 4
    unit: "m3/m3"
    description: "Soil water of layers 1-4 averaged over the delineated watershed (Soil_Moisture(mm)_Delineated_Average_Layer_1..4). The values are a volumetric FRACTION despite the '(mm)' header; mm = fraction x layer thickness (dt_velma_029). The name is kept for the validation convention."
    emitted_in: "DailyResults.csv columns Soil_Moisture(mm)_Delineated_Average_Layer_1..4 (daily; the last row is the end state)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Watershed-average layer water; only loosely comparable to point soil-moisture probes, and only as a volumetric fraction."
      detrending_options:
        - "none"
  - var: "final_swe_mm"
    validation_rank: 5
    unit: "mm"
    description: "Snow store (mm of water) averaged over the delineated watershed (Snow_Depth(mm)_Delineated_Average): the snow model adds the day's snow precipitation and removes melt (VELMA 2.0 User Manual sec. 6)."
    emitted_in: "DailyResults.csv column Snow_Depth(mm)_Delineated_Average (daily; the last row is the end state)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Temperature-index snow with weather uniform over the watershed; no elevation lapse in the DefaultWeatherModel."
      detrending_options:
        - "none"

influence:
  edges: []
  _reason: "No quantitative sensitivity analysis of EPA VELMA 2.1 has been gathered into this KI yet; parameter effects are only described in the triplets and the VELMA manuals, so no influence edges are claimed."
  citation_index: {}

safety:
  hazards:
    - id: "humus_keys_not_in_soil_block_2_1"
      kind: "numerical_instability"
      description: "A VELMA 2.0 configuration sets humusCtoN/initialHumusCarbon/humusNmaxDecay only for the cover; the 2.1 jar reads them from the soil, gets 0/0 and stops on day 1 with 'NaN TRAPPED! nitrificationAmount=NaN'."
      severity: "fatal"
      triplet_ref: "dt_velma_025"
    - id: "temperature_kelvin_not_celsius"
      kind: "weather_file_semantic"
      description: "Air temperature driver in Kelvin instead of degC: no snow, absurd PET/ET. run_velma_engine.py refuses values outside -60..50."
      severity: "silent"
      triplet_ref: "dt_velma_026"
    - id: "precip_not_mm_per_day"
      kind: "weather_file_semantic"
      description: "Precipitation left in kg/m2/s (or mm per 3 h) instead of mm/day gives near-zero (or wrong) runoff."
      severity: "silent"
      triplet_ref: "dt_velma_001"
    - id: "exit_zero_is_not_success"
      kind: "control_semantic"
      description: "java can exit 0 after a halted or incomplete run; success needs 'Simulation run completed', no FAIL!/NaN TRAPPED lines and one finite DailyResults row per day."
      severity: "silent"
      triplet_ref: "dt_velma_027"
    - id: "observed_files_read_by_row_from_forcing_start"
      kind: "control_semantic"
      description: "input_runoff and input_stream_chem are read by row from forcing_start; moving forcing_start without cutting them shifts the observed series and lowers the engine NSE."
      severity: "silent"
      triplet_ref: "dt_velma_028"
    - id: "soil_moisture_fraction_labelled_mm"
      kind: "parser_semantic"
      description: "DailyResults Soil_Moisture(mm) columns are volumetric fractions; using them as mm breaks storage and water-balance numbers."
      severity: "silent"
      triplet_ref: "dt_velma_029"
    - id: "delineated_vs_gauged_area"
      kind: "parser_semantic"
      description: "Runoff_All is a depth over the delineated watershed; converting it to m3/s with a different area than the gauge's biases discharge (WS10: 0.1458 vs 0.102 km2)."
      severity: "silent"
      triplet_ref: "dt_velma_030"
  validation_limits:
    - "Daily time step: no sub-daily flood peaks."
    - "The DefaultWeatherModel applies one precipitation and one temperature series to the whole watershed; large or steep basins need the spatial weather model, which the KI tools do not drive yet."
    - "The KI can only run configurations that already exist (DEM, soil/cover/age maps, parameter blocks); there is no converter from global soil or land-cover data to VELMA inputs yet."
    - "The parameters in the EPA BlueRiver_Example were set up by EPA for HJA WS10 with station weather; a result at WS10 tests the weather input, not transfer to a new site."
    - "Stream N and C exports (NO3, NH4, DON, DOC losses) are simulated but this KI has no validation convention or tested scoring for them yet."
  warnings:
    - "Spin up before scoring and carry the site's history (WS10: the 1975 clearcut) through --end-state-dir / --start-state-dir; drop the first year after a change of weather source."
    - "Run the 2.1 jar on a 2.0 configuration only with the humus migration (run_velma_engine.py default)."
    - "Weather driver files: mm/day and degC, one value per line, every day from forcing_start-01-01; nothing filled."
    - "The output folder <output-root>/<run_index> must not exist; the tool refuses it unless --overwrite."
    - "The engine's own delineated-average water balance does not close (official example: -8.8 % of P); report it rather than adjust inputs."
  assumptions:
