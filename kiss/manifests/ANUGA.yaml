kiss_manifest_version: 1
model: ANUGA
binary_type: Python
verified: observed
install_dir: ANUGA

acquire:
  strategy: pip
  package: anuga
  produces: anuga

python_deps: [anuga]

reference_case: >-
  python -c "import anuga; print(anuga.__name__, 'importable')"

notes: >-
  OBSERVED 2026-08-18: `kiss init ANUGA` installed anuga 3.3.10 into a clean venv
  and the KI's own preflight_check.py passed with no hand-written recipe. The
  package name was resolved from the KI directory name and confirmed by import,
  not assumed from a PyPI name match.
