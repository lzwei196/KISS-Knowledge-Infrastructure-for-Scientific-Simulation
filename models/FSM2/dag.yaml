      doi: "10.1029/2021WR030563"
      note: "FSM2 Sobol SA of canopy parameters on sub-canopy SWE; interception capacity leading control, VAI/rchz/veg-albedo second tier (~1-5% variance)."
    bonsoms2024_fsm2_ros_sensitivity:
      short_citation: "Bonsoms et al. 2024"
      doi: "10.5194/nhess-24-245-2024"
      note: "FSM2 Pyrenees rain-on-snow SA; air temperature dominant driver of snow height (~28-39% per °C), precipitation moderate-to-low."
    essery2025_fsm211_canopy:
      short_citation: "Essery et al. 2025"
      doi: "10.5194/gmd-18-3583-2025"
      note: "FSM 2.1.1 forest-canopy paper; unloading option has the largest influence on snow on the ground, radiative-scheme complexity minimal for dense canopy."

safety:
  hazards:
    - id: "weather_Ta_celsius_not_kelvin"
      kind: weather_file_semantic
      description: "Air temperature supplied in °C instead of K -> massively negative energy balance and no snow accumulation/melt."
      severity: fatal_or_silent
      triplet: "T01"
    - id: "weather_Ps_not_pascals"
      kind: weather_file_semantic
      description: "Surface pressure in hPa/kPa instead of Pa breaks the RH->specific-humidity (Qa) conversion, giving ~zero latent heat."
      severity: silent
      triplet: "T02"
    - id: "weather_RH_fraction_not_percent"
      kind: weather_file_semantic
      description: "RH given as fraction 0-1 instead of percent 0-100 -> excessively dry atmosphere, wrong evaporation."
      severity: silent
      triplet: "T03"
    - id: "weather_precip_rate_units"
      kind: weather_file_semantic
      description: "Snow/rain rate in mm/h or mm/day instead of kg m-2 s-1 inflates accumulation by 3600x or 86400x."
      severity: silent
      triplet: "T04"
    - id: "weather_Ua_units"
      kind: weather_file_semantic
      description: "Wind in km/h instead of m/s drives excessive sublimation and can yield negative SWE (Ua floored to 0.1 internally)."
      severity: silent
      triplet: "T18"
    - id: "weather_header_row_present"
      kind: weather_file_semantic
      description: "Met file has a header row; FSM2 reads the first line as year/month/day/hour integers -> EOF/parse error on first timestep."
      severity: fatal
      triplet: "T05"
    - id: "weather_empty_or_header_only"
      kind: weather_file_semantic
      description: "Empty or header-only met file -> immediate EOF and 0-byte output files."
      severity: fatal
      triplet: "T15"
    - id: "control_namelist_order_or_missing"
      kind: control_semantic
      description: "Six namelist blocks missing or out of fixed order (empty blocks still required) -> 'invalid input for namelist'."
      severity: fatal
      triplet: "T06"
    - id: "control_Npnts_veg_array_mismatch"
      kind: control_semantic
      description: "Npnts in &gridpnts not matching the number of values in each &veg array (alb0,vegh,VAI) -> array bounds error/segfault."
      severity: fatal
      triplet: "T07"
    - id: "control_lat_radians_not_degrees"
      kind: control_semantic
      description: "Latitude entered in radians instead of degrees -> wrong solar zenith and SW partitioning (SWPART=1)."
      severity: silent
      triplet: "T16"
    - id: "control_dt_forcing_interval_mismatch"
      kind: control_semantic
      description: "Model dt not matching the forcing time interval produces wrong accumulation/flux rates."
      severity: silent
    - id: "soil_clay_sand_fraction_sum"
      kind: soil_semantic
      description: "fcly+fsnd > 1 yields unphysical pedotransfer-derived soil properties."
      severity: degraded
    - id: "ic_Tsrf_above_melting_with_snow"
      kind: initial_condition_semantic
      description: "Sustained Tsrf > 273.15 K with snow present indicates excess incoming energy or an energy-balance solver problem."
      severity: warning
      triplet: "T13"
    - id: "numerical_negative_swe"
      kind: numerical_instability
      description: "Sublimation/transport removing more mass than available drives negative SWE under extreme wind/sublimation."
      severity: degraded
      triplet: "T18"
    - id: "coeff_gs1_uninitialized_dry_topsoil"
      kind: coefficient_runtime_silent_fallback
      description: "THERMAL sets surface conductance gs1 only when Vsmc(1)>epsilon; near-zero top-soil moisture leaves gs1 uninitialized for SRFEBAL."
      severity: silent
    - id: "parser_stat_column_count_varies"
      kind: parser_semantic
      description: "stat.txt Tsoil/Tveg occupy Nsoil and Ncnpy columns; the column count depends on compile-time CANMOD/Nsoil, so parsers must know them."
      severity: warning
    - id: "parser_hour_written_as_float"
      kind: parser_semantic
      description: "Output hour is written as f8.3 (float), not an integer; integer-cast parsers truncate sub-hourly time when dt<3600."
      severity: warning
  validation_limits:
    - "Point / 1-D column model: no lateral snow redistribution or blowing-snow transport (wind transport rate hardwired to 0)."
    - "Multi-point runs are independent columns with no inter-point exchange."
    - "Daily/hourly timestep on a discrete column; default dt=3600 s, must match forcing interval."
    - "NetCDF output (PROFNC=1) is restricted to single-point (Npnts=1) runs."
    - "Physics options are fixed at compile time; switching parameterizations requires recompilation."
  warnings:
    - "SWPART=0 (default) treats all incoming SW as diffuse and forces solar elevation to 0 — a silent partitioning pitfall under clear-sky/sloped sites."
    - "DENSTY=0 holds snow density fixed (no compaction), distorting the depth-SWE relationship."
    - "ENSMBL perturbed-driving re-derives rain/snow phase from an air-temperature rule, silently overriding the forcing Rf/Sf split."
    - "Canopy snow interception requires VAI>0; vegh>0 alone produces no canopy effect."
    - "Soil hydraulic properties are computed once from fcly/fsnd at startup and are not updated per timestep; a representative texture must be chosen up front."
  assumptions:
    - statement: "FSM2 is a point-scale, 1-D vertical column (snow over soil with optional 1-2 layer canopy); multi-point runs are independent columns."
      scope: "spatial geometry of the whole model"
      source: "FSM2 user guide (FSMuser.tex) grid/timing namelist section and Essery 2015 (doi:10.5194/gmd-8-3867-2015)"
      status: adopted
    - statement: "Mass-balance closure holds for snow water (cumulative Sf - Melt - subl - Roff ~= dSWE) and energy-balance closure for the surface/soil column (solved to |error| < 0.01 W m-2)."
      scope: "conservation properties"
      source: "FSM2 scientific guide (FSMsci.tex) energy-balance and conservation sections"
      status: adopted
    - statement: "Forcing RH is consumed only to derive specific humidity Qa in FSM2_DRIVE (DRIV1D=1) and does not otherwise reach the physics; range-checking RH guards that conversion."
      scope: "forcing humidity handling"
      source: "FSM2_DRIVE.F90 RH->Qa Magnus-formula conversion"
      status: adopted
    - statement: "Snow-base heat exchange couples within a single timestep: SNOW computes Gsoil from Tsnow(n)-Tsoil(1) and modifies Tsoil(1) before SOIL is solved."
      scope: "intra-timestep module ordering"
      source: "SNOW.F90 / SOIL.F90 call order in FSM2_TIMESTEP"
      status: adopted
    - statement: "The implementation is FSM2 v2.1.2 (user guide); the underlying canopy science follows the FSM 2.1.1 lineage (Essery et al. 2025)."
      scope: "version labeling"
      source: "FSM2 user guide header vs README / Essery et al. 2025 (doi:10.5194/gmd-18-3583-2025)"
      status: tentative
