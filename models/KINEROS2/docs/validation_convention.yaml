validation:
  - dag_variable: discharge
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.75, good: 0.65, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "Fetched OA papers reproduce Moriasi-style streamflow classes: satisfactory 0.50-0.65, good 0.65-0.75, very good 0.75-1.00."
        cites: [leta2023, cirilo2020]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10.0, good: 15.0, satisfactory: 25.0}
        pass_band: satisfactory
        band_note: "For monthly streamflow/runoff, the reproduced table gives PBIAS < +/-10 very good, +/-10 to +/-15 good, +/-15 to +/-25 satisfactory."
        cites: [leta2023, cirilo2020]
      - metric: r2
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.80, good: 0.70, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "The fetched table rates R2 <0.50 unsatisfactory, 0.50-0.70 satisfactory, 0.70-0.80 good, and >0.80 very good."
        cites: [leta2023]
    secondary_metrics:
      - metric: rsr
        direction: minimize
        status: supportive
        ceiling_reason: "Reproduced Moriasi-style tables commonly co-report RSR for hydrologic model evaluation, but the KINEROS2 DAG determining metric is NSE and the cached KINEROS2 benchmarks emphasize NSE/R2."
        cites: [leta2023, cirilo2020]
      - metric: peak_runoff_rate
        direction: maximize
        status: supportive
        ceiling_reason: "Goodrich et al. recommend choosing objective functions by application purpose; culvert/bridge sizing should focus on peak runoff rates, detention-structure sizing on runoff volume."
        cites: [goodrich2012]
      - metric: runoff_volume
        direction: maximize
        status: supportive
        ceiling_reason: "Goodrich et al. recommend Nash-Sutcliffe efficiency on event runoff volumes and peak runoff rates for limited-event K2 hydrology calibration."
        cites: [goodrich2012]
    validated_when: "Daily/monthly outlet discharge is validated when NSE >= 0.50, |PBIAS| <= 25%, and R2 >= 0.50 after unit harmonization and spinup removal; stronger KINEROS2 runoff applications commonly report NSE/R2 well above these minimums."
    rule:
      all_of:
        - {metric: nse, op: gte, value: 0.50}
        - {metric: pbias, op: abs_lte, value: 25.0}
        - {metric: r2, op: gte, value: 0.50}
    evidence_strength: strong
    confidence: 0.82
    notes: >-
      The DAG determining metric (nse) is retained and paired with PBIAS/R2 because the fetched hydrology
      convention papers say model performance is judged using multiple indicators. Leta 2023 reproduces
      flow/sediment ratings with "0.5 < NSE <= 0.65" satisfactory and "PBIAS < +/- 10" very good; Cirilo
      2020 likewise lists monthly NSE/PBIAS/RSR classes adapted from Moriasi et al. (2007). KINEROS2-
      specific support comes from Goodrich 2012, which says K2 calibration/validation commonly uses
      Nash-Sutcliffe statistics for peak runoff rate and runoff volume, and from Nguyen 2015 and El Harche
      2021, which report KINEROS2 discharge/runoff validation with NSE/R2 against observed data.

  - dag_variable: infiltration
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric direct-observation validation threshold for KINEROS2 infiltration time series; field practice validates its effect through runoff/discharge response."
        cites: []
    secondary_metrics:
      - metric: water_balance_closure
        direction: zero_centered
        status: supportive
        ceiling_reason: "KINEROS2/AGWA literature treats infiltration parameters, especially saturated hydraulic conductivity and the suction term, as hydrology calibration controls for runoff volume rather than as directly graded observation products."
        cites: [goodrich2012]
      - metric: runoff_response
        direction: maximize
        status: supportive
        ceiling_reason: "Goodrich et al. recommend varying multipliers on saturated hydraulic conductivity and infiltration suction term to optimize Nash-Sutcliffe efficiency for event runoff volumes."
        cites: [goodrich2012]
    validated_when: "UNRESOLVED as a direct point_time_series product: no cited numeric infiltration threshold was fetched; use discharge/runoff validation plus water-balance diagnostics."
    evidence_strength: weak
    confidence: 0.32
    notes: >-
      The DAG lists infiltration as a comparable time series, but its caveat says it is rarely directly
      observed. The fetched KINEROS2 validation paper discusses infiltration as a process whose parameters
      are calibrated against event runoff volume and peak runoff rate, not as an output with standalone NSE
      pass bands. The null band prevents the gate from auto-validating or loosening a requirement on this
      internal flux.

  - dag_variable: surface_excess
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric direct-observation validation threshold for KINEROS2 infiltration-excess surface runoff before routing."
        cites: []
    secondary_metrics:
      - metric: routed_discharge
        direction: maximize
        status: supportive
        ceiling_reason: "The fetched KINEROS2 validation literature evaluates the runoff-generating process after routing as peak runoff rate, event runoff volume, or outlet discharge."
        cites: [goodrich2012, nguyen2015, elharche2021]
      - metric: runoff_volume
        direction: maximize
        status: supportive
        ceiling_reason: "For limited observations, Goodrich et al. recommend Nash-Sutcliffe efficiency on event runoff volumes, then roughness calibration for peak runoff rates."
        cites: [goodrich2012]
    validated_when: "UNRESOLVED as an unrouted internal flux: validate through outlet discharge/runoff volume and peak response; no fetched standalone surface_excess pass band."
    evidence_strength: weak
    confidence: 0.32
    notes: >-
      The DAG caveat says surface_excess is an internal flux comparable to observations only after routing
      to outlet discharge. Cached KINEROS2 benchmark papers report outlet runoff/discharge NSE/R2; none
      provides a separate field convention for an infiltration-excess time series, so the headline band is null.

