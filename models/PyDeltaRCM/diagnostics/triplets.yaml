# ============================================================================
# PyDeltaRCM Diagnostic Triplets
# ============================================================================
# 18 diagnostic triplets covering 5 failure domains.
# Generated during PyDeltaRCM knowledge dissection.
# ============================================================================

# --- Unit Conversion (HIGHEST PRIORITY — Silent Errors) ---

- id: dt_001
  stage: s0_configuration
  failure_domain: unit_conversion
  symptom:
    description: "No delta formation after many timesteps. Sediment flux is negligible."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "C0_percent specified as fraction (0.001) instead of percentage (0.1)"
    explanation: >
      pyDeltaRCM expects sediment concentration as a volume percentage.
      C0_percent=0.1 means 0.1% by volume. If the user provides a fraction
      (e.g., 0.001 meaning 0.1%), the concentration is 100x too low.
      Internally: C0 = C0_percent / 100. So C0_percent=0.001 gives C0=0.00001,
      producing almost zero sediment input.
    affected_components: [create_boundary_conditions, Qs0, dVs]
  remedy:
    action: "Use percentage value for C0_percent (e.g., 0.1 for 0.1% concentration)"
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Check C0_percent in config — typical values are 0.01 to 1.0"
      - "If using mg/L from literature, convert: C0_percent = conc_mgL / (rho_sed * 1000) * 100"
    prevention: "validate_inputs() in generate_yaml_config checks C0_percent range"
  severity: silent
  cross_references: [dt_002]

- id: dt_002
  stage: s0_configuration
  failure_domain: unit_conversion
  symptom:
    description: "Sea level change is imperceptible or absurdly fast. Delta drowns in 1 timestep or SLR has zero effect after thousands of timesteps."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "SLR specified in mm/yr instead of m/s of model time"
    explanation: >
      pyDeltaRCM expects SLR in meters per second of model time. A value of 3 (mm/yr)
      passed directly as SLR means 3 m/s — the basin floods instantly. Conversely,
      a correctly-computed value of ~5e-12 m/s is so small that it looks like zero
      if the user expects to see mm/yr-scale changes. The conversion requires
      accounting for the intermittency factor: SLR_model = SLR_real_mmyr * If / (365.25*86400*1000).
    affected_components: [finalize_timestep, H_SL]
  remedy:
    action: "Convert SLR from mm/yr to m/s using: SLR = mmyr / 1000 / (365.25*86400) * If"
    tool_to_run: convert_parameters
    manual_steps:
      - "Check SLR value — should be O(1e-12) to O(1e-9) m/s for realistic rates"
      - "Use convert_parameters.py --slr <mm/yr> --If <factor>"
    prevention: "convert_parameters.py handles this conversion automatically"
  severity: silent
  cross_references: [dt_003]

- id: dt_003
  stage: s0_configuration
  failure_domain: unit_conversion
  symptom:
    description: "Subsidence starts immediately or never starts. Unrealistic subsidence magnitude."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "start_subsidence in years instead of seconds, or subsidence_rate in mm/yr instead of m/s"
    explanation: >
      start_subsidence expects seconds of model time. A value of 10 (years) is interpreted
      as 10 seconds — subsidence starts almost immediately. The subsidence_rate has the
      same unit trap as SLR: must be m/s of model time, not mm/yr.
    affected_components: [apply_subsidence, sigma]
  remedy:
    action: "Convert: start_subsidence = years * 365.25 * 86400. Rate same as SLR conversion."
    tool_to_run: convert_parameters
    manual_steps:
      - "start_subsidence should be O(1e5) to O(1e7) seconds for typical scenarios"
      - "subsidence_rate should be O(1e-12) to O(1e-8) m/s"
    prevention: "generate_yaml_config accepts start_subsidence_years and converts"
  severity: silent
  cross_references: [dt_002]

- id: dt_004
  stage: s0_configuration
  failure_domain: unit_conversion
  symptom:
    description: "save_dt=1 produces millions of output frames. Or save_dt=86400 appears to never save."
    error_pattern: ""
    detection_method: file_size
  diagnosis:
    root_cause: "save_dt confusion between seconds and days"
    explanation: >
      save_dt is in seconds of model time. save_dt=1 saves every second of model time,
      creating enormous output files. save_dt=86400 saves every model day (the default
      and usually reasonable). Users who think save_dt is in days will set save_dt=1
      expecting daily output but get per-second output.
    affected_components: [output_data, output_netcdf]
  remedy:
    action: "Set save_dt in seconds. For daily output: save_dt=86400. For every 10 days: save_dt=864000."
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Check output NetCDF time dimension — if it has millions of entries, save_dt is too small"
      - "Typical: save_dt = 86400 (1 day) to 864000 (10 days)"
    prevention: "generate_yaml_config accepts save_dt_days and converts to seconds"
  severity: silent
  cross_references: []

- id: dt_005
  stage: s0_configuration
  failure_domain: unit_conversion
  symptom:
    description: "Domain is tiny (few cells) or enormous (millions of cells). Model crashes with memory error or finishes in milliseconds."
    error_pattern: "MemoryError"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Length/Width in km instead of meters, or dx in cm instead of meters"
    explanation: >
      All spatial dimensions are in meters. Length=5 (km intended) creates a 5m domain —
      only a few cells. Length=5000000 (cm intended) creates a 100km domain.
      Grid cells = Length/dx × Width/dx. With Length=5000, Width=10000, dx=50: 100×200=20000 cells.
    affected_components: [create_other_variables, create_domain]
  remedy:
    action: "Ensure all dimensions in meters. Grid should be 50-500 cells per side."
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Check L = Length/dx and W = Width/dx — should be 50-500 for typical runs"
      - "If L*W > 1e6, consider increasing dx"
    prevention: "validate_inputs checks Length/Width/dx ranges"
  severity: crash
  cross_references: []

# --- Numerical Stability ---

- id: dt_006
  stage: s2_water_routing
  failure_domain: numerical_stability
  symptom:
    description: "Water surface oscillates wildly. NaN values appear in stage/depth/velocity arrays. Model may crash."
    error_pattern: "nan"
    detection_method: value_check
  diagnosis:
    root_cause: "gamma parameter > 0.1 causes numerical instability in water routing"
    explanation: >
      gamma = g * S0 * dx / u0^2. When gamma > 0.1, the water routing weights become
      too sensitive to small elevation differences, causing parcels to oscillate and
      producing unstable free surface estimates. This is the most common source of
      model instability in pyDeltaRCM.
    affected_components: [route_water, compute_free_surface, gamma]
  remedy:
    action: "Reduce gamma below 0.1 by: (1) reducing dx, (2) reducing S0, or (3) increasing u0"
    tool_to_run: convert_parameters
    manual_steps:
      - "Print gamma: g * S0 * dx / u0^2"
      - "If gamma > 0.1, try dx/2 first (doubles resolution but 4x cells)"
      - "Or reduce S0 if physically reasonable"
    prevention: "validate_config checks gamma at startup; DeltaModel warns if gamma > 0.1"
  severity: crash
  cross_references: [dt_007]

- id: dt_007
  stage: s2_water_routing
  failure_domain: numerical_stability
  symptom:
    description: "Water surface is extremely noisy. Free surface shows checkerboard pattern."
    error_pattern: ""
    detection_method: visual_inspection
  diagnosis:
    root_cause: "Np_water too low for domain size — insufficient parcel coverage"
    explanation: >
      With too few water parcels, many cells receive no parcel visits during a water
      iteration. The free surface is only updated where parcels visit, so gaps create
      a noisy, discontinuous surface. Rule of thumb: Np_water should be at least
      equal to the number of wet cells / 10.
    affected_components: [route_water, sfc_visit, sfc_sum]
  remedy:
    action: "Increase Np_water. Default 2000 works for 100x200 grids. For larger grids, scale up."
    tool_to_run: generate_yaml_config
    manual_steps:
      - "If grid is larger than default (100x200), increase Np_water proportionally"
      - "Try 5000 for 200x400 grids, 10000 for 400x800"
    prevention: "Monitor sfc_visit array — cells with 0 visits are not being updated"
  severity: silent
  cross_references: [dt_006]

# --- Configuration Errors ---

- id: dt_008
  stage: s1_initialization
  failure_domain: configuration
  symptom:
    description: "ValueError: dx must be positive and smaller than Length and Width parameters."
    error_pattern: "ValueError"
    detection_method: error_message
  diagnosis:
    root_cause: "dx is larger than Length or Width, or dx is zero/negative"
    explanation: >
      The dx parameter must be positive and smaller than both Length and Width.
      This commonly happens when dx is in a different unit than Length/Width,
      or when the domain dimensions are accidentally very small.
    affected_components: [model.__init__, dx.setter]
  remedy:
    action: "Ensure dx < Length and dx < Width and dx > 0. All must be in meters."
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Check units: Length, Width, and dx should all be in meters"
      - "dx=50 with Length=5000 gives 100 cells — typical configuration"
    prevention: "validate_config catches this before model init"
  severity: crash
  cross_references: [dt_005]

- id: dt_009
  stage: s1_initialization
  failure_domain: configuration
  symptom:
    description: "ValueError: N0_meters must be a positive number. Or inlet is only 1-2 cells wide."
    error_pattern: "ValueError"
    detection_method: error_message
  diagnosis:
    root_cause: "N0_meters too small relative to dx, giving fewer than 3 inlet cells"
    explanation: >
      The inlet channel must be at least 3 cells wide (N0 = round(N0_meters/dx) >= 3).
      If N0_meters=100 and dx=50, N0=2 cells, which is below minimum.
      The model clamps N0 to at least 3, but this may not match the intended
      physical channel width.
    affected_components: [create_boundary_conditions, N0]
  remedy:
    action: "Ensure N0_meters / dx >= 3. Either increase N0_meters or decrease dx."
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Check: N0 = round(N0_meters / dx). Should be >= 5 for good resolution."
      - "N0_meters=250 with dx=50 gives N0=5 — the default and usually adequate"
    prevention: "validate_config checks N0_meters / dx"
  severity: silent
  cross_references: [dt_008]

- id: dt_010
  stage: s1_initialization
  failure_domain: configuration
  symptom:
    description: "Warning: unused keys in YAML. Parameters have no effect on simulation."
    error_pattern: "unused"
    detection_method: warning_message
  diagnosis:
    root_cause: "YAML key name is misspelled or is a Preprocessor-only keyword"
    explanation: >
      pyDeltaRCM validates all YAML keys against default.yml. Unknown keys are
      silently ignored with a warning. Common typos: 'length' (should be 'Length'),
      'width' (should be 'Width'), 'seed' vs 'random_seed'. Preprocessor keywords
      (matrix, set, ensemble, parallel) are not valid for DeltaModel directly.
    affected_components: [import_files]
  remedy:
    action: "Check YAML key names against pyDeltaRCM/default.yml for correct spelling and capitalization"
    tool_to_run: ""
    manual_steps:
      - "Keys are case-sensitive: 'Length' not 'length'"
      - "For matrix/set/ensemble, use Preprocessor class, not DeltaModel"
    prevention: "Reference default.yml for all valid parameter names"
  severity: silent
  cross_references: []

- id: dt_011
  stage: s1_initialization
  failure_domain: configuration
  symptom:
    description: "TypeError: Input for <key> not of the right type in yaml configuration file."
    error_pattern: "TypeError"
    detection_method: error_message
  diagnosis:
    root_cause: "YAML value has wrong type (e.g., string where float expected)"
    explanation: >
      Each parameter has an expected type defined in default.yml. For example,
      Length expects float or int, but a YAML entry like 'Length: "5000"' (with quotes)
      provides a string. Also, YAML may parse bare 'true'/'false' as booleans,
      and bare numbers as int vs float.
    affected_components: [import_files]
  remedy:
    action: "Remove quotes from numeric values. Use YAML-native types."
    tool_to_run: ""
    manual_steps:
      - "Numbers: Length: 5000 (no quotes)"
      - "Booleans: save_eta_grids: true (lowercase, no quotes)"
      - "Strings: out_dir: 'my_output' (quotes OK for strings)"
    prevention: "YAML linting before running"
  severity: crash
  cross_references: [dt_010]

# --- Model Behavior ---

- id: dt_012
  stage: s3_sediment_routing
  failure_domain: model_behavior
  symptom:
    description: "Delta is all sand (sand_frac ≈ 1.0 everywhere) or all mud (sand_frac ≈ 0.0)"
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "f_bedload set to 0 or 1, making all sediment one type"
    explanation: >
      f_bedload controls the fraction of input sediment that is sand (bedload).
      f_bedload=1.0 means 100% sand, 0.0 means 100% mud. Natural deltas
      typically have f_bedload between 0.2 and 0.7. The sand fraction affects
      both the spatial pattern (sand near inlet, mud on fringes) and the
      stratigraphy.
    affected_components: [route_all_sand_parcels, route_all_mud_parcels]
  remedy:
    action: "Set f_bedload between 0.2 and 0.7 for realistic deltas. Default 0.5."
    tool_to_run: generate_yaml_config
    manual_steps:
      - "f_bedload=0.5 is the default and good for most cases"
      - "Fine-grained systems (Mississippi): f_bedload ≈ 0.2-0.3"
      - "Coarse-grained systems (fan deltas): f_bedload ≈ 0.6-0.8"
    prevention: "validate_inputs checks f_bedload range"
  severity: silent
  cross_references: []

- id: dt_013
  stage: s3_sediment_routing
  failure_domain: model_behavior
  symptom:
    description: "Delta grows extremely slowly. After 100+ timesteps, barely any land above sea level."
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: "Sediment supply too low — C0_percent, u0, or h0 too small"
    explanation: >
      Total sediment input per timestep is dVs = 0.1 * N0^2 * h0 * dx^2.
      Total sediment discharge is Qs0 = Qw0 * C0 = u0 * h0 * N0 * dx * (C0_percent/100).
      If these are very small, the delta grows slowly. Also, the timestep
      dt = dVs/Qs0, so low Qs0 means long timesteps but still only dVs per step.
    affected_components: [create_boundary_conditions, dVs, Qs0]
  remedy:
    action: "Increase C0_percent (try 0.1-0.5) or increase u0/h0"
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Check dVs and Qs0 after model init"
      - "A typical run needs 100-1000 timesteps for visible delta"
      - "Increasing C0_percent is the most direct way to speed up growth"
    prevention: "Print dVs and dt after init to verify reasonable sediment budget"
  severity: silent
  cross_references: [dt_001]

- id: dt_014
  stage: s2_water_routing
  failure_domain: model_behavior
  symptom:
    description: "Water only flows in a single narrow channel. No bifurcation or distributary formation."
    error_pattern: ""
    detection_method: visual_inspection
  diagnosis:
    root_cause: "theta_water or coeff_theta_sand too high — parcels are strongly attracted to deepest path"
    explanation: >
      The depth weighting exponent theta controls how strongly parcels are attracted
      to deeper cells. Higher theta = more channelized flow. Default theta_water=1.0
      with coeff_theta_sand=2.0 gives theta_sand=2.0. Increasing these focuses
      flow into fewer, deeper channels.
    affected_components: [route_water, run_water_iteration]
  remedy:
    action: "Reduce theta_water toward 0.5 for more diffuse flow, or increase Np_water"
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Try theta_water: 0.5 for broader flow"
      - "Also try increasing Np_water to 5000 for better coverage"
    prevention: "Start with default values, which produce multi-channel deltas"
  severity: silent
  cross_references: [dt_007]

# --- Output Issues ---

- id: dt_015
  stage: s5_output
  failure_domain: output
  symptom:
    description: "NetCDF output file is empty (0 bytes) or has no data variables."
    error_pattern: ""
    detection_method: file_size
  diagnosis:
    root_cause: "No save_*_grids flags enabled in configuration"
    explanation: >
      pyDeltaRCM creates the NetCDF file but only writes variables that have their
      corresponding save flag set to True. If all save_*_grids are False (the default),
      the NetCDF file has only coordinate dimensions but no data. The model runs
      correctly but produces no usable output.
    affected_components: [init_output_file, output_data]
  remedy:
    action: "Enable at least one save flag: save_eta_grids: true"
    tool_to_run: generate_yaml_config
    manual_steps:
      - "Add 'save_eta_grids: true' to YAML config"
      - "For full analysis also enable save_depth_grids, save_velocity_grids"
    prevention: "generate_yaml_config enables save_eta_grids by default"
  severity: silent
  cross_references: [dt_004]

- id: dt_016
  stage: s5_output
  failure_domain: output
  symptom:
    description: "RuntimeError: Cannot update model, model already finalized!"
    error_pattern: "RuntimeError"
    detection_method: error_message
  diagnosis:
    root_cause: "Calling delta.update() after delta.finalize()"
    explanation: >
      Once finalize() is called, the NetCDF file is closed and the model is
      marked as finalized. Any subsequent update() call raises RuntimeError.
      This commonly happens in loops where finalize() is accidentally inside
      the loop body.
    affected_components: [model.update, model.finalize]
  remedy:
    action: "Call finalize() only once, after all update() calls are complete"
    tool_to_run: ""
    manual_steps:
      - "Move delta.finalize() outside the for loop"
      - "Use try/finally to ensure finalize is called even on error"
    prevention: "Standard pattern: for t in range(N): delta.update(); delta.finalize()"
  severity: crash
  cross_references: []

- id: dt_017
  stage: s1_initialization
  failure_domain: output
  symptom:
    description: "OSError or PermissionError when creating output directory or NetCDF file."
    error_pattern: "OSError"
    detection_method: error_message
  diagnosis:
    root_cause: "Output directory parent doesn't exist, or permission denied, or disk full"
    explanation: >
      pyDeltaRCM creates out_dir if it doesn't exist, but the parent directory
      must exist. Also, if clobber_netcdf=False (default) and a previous
      pyDeltaRCM_output.nc exists, the new file creation may fail.
    affected_components: [init_output_infrastructure, init_output_file]
  remedy:
    action: "Ensure parent directory exists. Set clobber_netcdf: true to overwrite."
    tool_to_run: ""
    manual_steps:
      - "Create parent directory: mkdir -p /path/to/parent/"
      - "Or use clobber_netcdf: true in YAML"
      - "Check disk space: df -h"
    prevention: "validate_config checks that parent directory exists"
  severity: crash
  cross_references: []

- id: dt_018
  stage: s0_configuration
  failure_domain: configuration
  symptom:
    description: "Preprocessor matrix/set/ensemble keywords ignored when using DeltaModel directly."
    error_pattern: "Preprocessor-only keyword"
    detection_method: warning_message
  diagnosis:
    root_cause: "Advanced multi-job keywords passed to DeltaModel instead of Preprocessor"
    explanation: >
      The matrix, set, and ensemble YAML keywords are only supported by the
      Preprocessor class, not by DeltaModel directly. Using DeltaModel with
      these keywords triggers a warning and the keywords are ignored — only
      a single job runs with the fixed parameters.
    affected_components: [import_files, Preprocessor]
  remedy:
    action: "Use Preprocessor class for multi-job configurations"
    tool_to_run: ""
    manual_steps:
      - "pp = pyDeltaRCM.Preprocessor('config.yml'); pp.run_jobs()"
      - "Or from CLI: pyDeltaRCM --config config.yml"
    prevention: "Use Preprocessor for any config with matrix/set/ensemble keys"
  severity: silent
  cross_references: [dt_010]
