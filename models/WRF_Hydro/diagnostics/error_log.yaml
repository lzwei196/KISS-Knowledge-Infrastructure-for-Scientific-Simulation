  failure_domain: silent_error
  symptom:
    description: Noah-MP Schaake produces 24x less surface runoff than VIC — infxsrt=0.158mm from
      23.8mm rain while VIC gives 3.78mm
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: REFKDT=3.0 (default in MPTABLE.TBL) is too high for mountain basins. High REFKDT means
      high infiltration rate, sending all rain into soil instead of surface runoff.
    explanation: The Schaake96 runoff scheme (opt_run=1) uses REFKDT to control the balance between
      infiltration and surface runoff. REFKDT=3.0 allows very high infiltration rates, so nearly all
      precipitation enters soil layers. In mountain basins with thin soils, this is physically unrealistic.
      VIC's variable infiltration capacity produces much more surface runoff from the same rain event.
    affected_components:
    - soil_properties.nc REFKDT
    - MPTABLE.TBL
  resolution:
    action: Tune REFKDT from 3.0 to 0.5-1.0 in soil_properties.nc for mountain/semi-arid basins to
      increase surface runoff and storm peaks
    files_changed: []
    prevention: Calibrate REFKDT for each basin — default 3.0 only appropriate for flat, deep-soil basins
  severity: silent
  promoted: true
  promoted_as: dt_v018
