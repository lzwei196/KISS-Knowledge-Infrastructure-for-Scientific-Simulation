safety:
  hazards:
    - id: "rainfall_intensity_vs_depth"
      kind: "weather_file_semantic"
      description: "Rainfall authored as depth/day (mm/day) instead of intensity (mm/hr) under-drives runoff by ~24x; depth-instead-of-intensity is silently accepted. (dt_001)"
      severity: "fatal"
    - id: "raingage_interval_mismatch"
      kind: "weather_file_semantic"
      description: "[RAINGAGES] Interval not matching the [TIMESERIES] resolution yields zero/under-sampled rainfall and near-zero runoff. (dt_007)"
      severity: "silent"
    - id: "subcatchment_area_unit"
      kind: "soil_semantic"
      description: "Area in m²/km² instead of acres/hectares produces 100–1e6x mass-balance error with no error message. (dt_002)"
      severity: "fatal_or_silent"
    - id: "length_unit_mismatch"
      kind: "soil_semantic"
      description: "Elevations/pipe lengths mixing ft and m drive ~3x errors in slope, velocity and hydrograph timing. (dt_003)"
      severity: "degraded"
    - id: "slope_fraction_vs_percent"
      kind: "soil_semantic"
      description: "[SUBCATCHMENTS] Slope entered as fraction (0.005) instead of percent (0.5) gives 100x-wrong runoff timing. (dt_005)"
      severity: "silent"
    - id: "depression_storage_unit"
      kind: "soil_semantic"
      description: "S-Imperv/S-Perv in the wrong length unit (mm vs in) mis-sizes the storage consumed before runoff by ~25x. (dt_015)"
      severity: "degraded"
    - id: "infiltration_maxrate_unit"
      kind: "soil_semantic"
      description: "Horton MaxRate in mm/hr where in/hr is expected is ~25x too permeable and can zero all runoff (100% infiltration) with no error. (dt_013)"
      severity: "fatal_or_silent"
    - id: "xsection_geom1_unit"
      kind: "soil_semantic"
      description: "[XSECTIONS] Geom1 (diameter/height) in inches/mm instead of ft/m gives large conduit-capacity error. (dt_016)"
      severity: "degraded"
    - id: "evaporation_rate_unit"
      kind: "weather_file_semantic"
      description: "Evaporation in per-hour instead of per-day applies 24x evaporation loss, draining storage. (dt_017)"
      severity: "degraded"
    - id: "weir_orifice_coefficient_conversion"
      kind: "coefficient_runtime_silent_fallback"
      description: "Weir/orifice discharge coefficients embed the unit system (rect. weir ~3.33 US / ~1.84 SI); numerically converting between systems introduces a ~1.8x flow error. (dt_004)"
      severity: "degraded"
    - id: "courant_violation_dynwave"
      kind: "numerical_instability"
      description: "DYNWAVE ROUTING_STEP too large for the network geometry violates the Courant condition, producing >10% continuity error, instability, flooding or negative depths. (dt_011)"
      severity: "degraded"
    - id: "malformed_inp_error211"
      kind: "parser_semantic"
      description: "Malformed .inp (missing sections, wrong column count, tab/space issues) aborts with ERROR 211 and produces no output; the parser is strict. (dt_006)"
      severity: "fatal"
    - id: "node_name_case_mismatch"
      kind: "control_semantic"
      description: "Case-sensitive node-name mismatch between [CONDUITS]/[WEIRS]/[PUMPS] and node sections yields silent zero flow with no error. (dt_008)"
      severity: "silent"
    - id: "subcatchment_outlet_misrouting"
      kind: "control_semantic"
      description: "[SUBCATCHMENTS] Outlet pointing at the wrong node/subcatchment misroutes runoff (cascading routing is allowed, so the error is silent). (dt_009)"
      severity: "silent"
    - id: "report_start_after_start_date"
      kind: "control_semantic"
      description: "REPORT_START later than START_DATE silently drops early timesteps from the .out output. (dt_018)"
      severity: "silent"
  validation_limits:
    - "Subcatchments are lumped nonlinear-reservoir units; the model does not resolve distributed 2-D overland or in-catchment spatial flow fields."
    - "STEADY and KINWAVE routing cannot represent surcharging, backwater, pressurized or reverse flow; those regimes require DYNWAVE."
    - "Daily/seasonal evaporation is prescribed (demand-side), so the model does not close a surface energy budget."
    - "Output units are entirely determined by FLOW_UNITS; the model emits no intrinsic unit metadata to disambiguate a US- vs SI-authored network."
  warnings:
    - "Non-reentrant engine: only ONE Simulation may exist per Python process (global engine state); a second instance raises MultiSimulationError. Use multiprocessing, not threading, for parallel runs."
    - "Using sim.execute() instead of stepping (`for step in sim:`) means before/after-step callbacks and RTC logic never fire."
    - "step_advance(0) can cause an infinite loop; node.depth is read-only inside callbacks (set link target_setting instead)."
    - "Requesting an element ID absent from the output silently returns empty rather than erroring."
    - "Accept runoff and flow-routing continuity errors below 5% (ideally below 1%); report step should be a multiple of the routing step, which must satisfy the Courant condition."
  assumptions:
    - statement: "PySWMM carries no independent physics; all hydrology/hydraulics is computed by the underlying compiled EPA SWMM5 engine, and PySWMM's continuity-error properties are views into that engine's mass-balance state."
      scope: "whole model"
      source: "PySWMM overview/quickstart docs (pyswmm.github.io) and the swmm.toolkit.solver binding"
      status: "adopted"
    - statement: "The simulated domain is a lumped-subcatchment / 1-D drainage-network representation (distributed-stream), not a 2-D surface model."
      scope: "boundary geometry"
      source: "EPA SWMM5 reference manual; PySWMM element model (Subcatchments/Nodes/Links)"
      status: "adopted"
    - statement: "Mass-balance continuity is closed separately for the runoff phase and the routing phase; there is no closed surface energy budget."
      scope: "closure"
      source: "RunoffTotals / RoutingTotals (system.py) and Simulation continuity properties"
      status: "adopted"
    - statement: "Python-defined controls have priority over and execute after native [CONTROLS] rules each timestep; step_advance changes only how often Python controls are evaluated, not the engine routing timestep."
      scope: "real-time control semantics"
      source: "PySWMM quickstart real-time-control docs (pyswmm.github.io)"
      status: "adopted"
    - statement: "Weir/orifice discharge coefficients are treated as already embedding the chosen unit system and are not numerically converted between US and SI."
      scope: "control-structure parameters"
      source: "PySWMM unit guidance (SKILL critical_domain_knowledge); EPA SWMM5 hydraulics reference"
      status: "adopted"
