# Blocks are keyed by the Lohmann_Routing dag.yaml output names, per the 2026-08-14
# Step-B convention. Continuous discharge bands are hydrologic flow-performance
# criteria; the categorical event block is intentionally low-confidence because the
# fetched flood-event paper reports POD/FAR/CSI skill but not a prescriptive pass band.

