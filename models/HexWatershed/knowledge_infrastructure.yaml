# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: HexWatershed
  language: c++
  implementation:
    id: hexwatershed-cpp-v1
    version: 1.0.0
    provenance: C++11; PNNL (Chang Liao) HexWatershed C++ backend, single-JSON-config CLI.
  scientific_reference_version: HexWatershed 1.0 (Liao et al. 2020, Environmental Modelling & Software
    128:104702) — hexagon/unstructured-mesh watershed delineation
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/HexWatershed/source/repo/build/hexwatershed
    type: work_dir
pipeline:
  stages:
  - s0_configuration_skill
  - s1_mesh_generation_skill
  - s2_flowline_preparation_skill
  - s3_execution_skill
  - s4_output_analysis_skill
  - s5_validation_skill
tools:
  count: 4
  files:
  - tools/flowline_converter.py
  - tools/mesh_converter.py
  - tools/output_parser.py
  - tools/run_hexwatershed.py
inputs:
  forcing: []
  parameters:
  - name: Mesh cell elevation (dElevation_mean / dElevation_raw)
    unit: m
  - name: Cell geometry (vVertex, dLongitude/dLatitude_center_degree, dArea)
    unit: degrees (GCS) for coordinates; m^2 for dArea
  - name: Cell adjacency (aNeighbor, aNeighbor_distance, lCellID)
    unit: neighbor distance in m; IDs dimensionless
  - name: Preprocessed topological flowline network
    unit: '-'
  - name: Earth radius (dRadius_earth)
    unit: m
  initial_conditions:
  - name: Raw cell elevation surface
    unit: m
  boundary_conditions:
  - name: sMesh_type
    unit: '-'
  - name: iFlag_flowline (stream burning enable)
    unit: '-'
  - name: iFlag_stream_grid_option
    unit: '-'
  - name: iFlag_stream_burning_topology
    unit: '-'
  - name: iFlag_hillslope
    unit: '-'
  - name: iFlag_multiple_outlet / nOutlet
    unit: '-'
  - name: iFlag_resample_method
    unit: '-'
  - name: iFlag_global / iFlag_vtk / iFlag_elevation_profile / iFlag_animation
    unit: '-'
  - name: dAccumulation_threshold
    unit: ratio (<1.0) or absolute cell count (>=1.0)
  - name: dBreach_threshold
    unit: m
  - name: dMissing_value_dem
    unit: m (sentinel)
  - name: Outlet specification (lCellID_outlet, lBasinID, dLatitude/dLongitude_outlet_degree)
    unit: degrees for lat/lon; IDs dimensionless
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - dElevation_mean (depression-filled elevation)
  - lCellID_downslope_dominant (flow direction)
  - dAccumulation (flow accumulation)
  - Drainage area (derived watershed/contributing area)
  - Stream grid / stream network (iFlag_stream, segments)
  - Strahler stream order
  - Watershed boundary / subbasin boundaries
  - Mean / max / min watershed slope
  - Drainage density
  other: []
validation:
  tier: tested
  tier_justification: 'measured: 2 scorecard(s)'
summary:
  total_tools: 4
  total_stage_docs: 6
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
