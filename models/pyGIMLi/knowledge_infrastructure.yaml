package:
  name: pyGIMLi
  language: python
  implementation:
    id: pygimli
    version: 1.5.5 (git describe v1.5.5.post2-56-ge792d84b)
    provenance: Python frontend over a C++ numerical core (libgimli / pgcore); multi-method geophysical
      forward + inverse modelling library by Rücker, Günther, Wagner et al.
  scientific_reference_version: pyGIMLi generalized Gauss-Newton inversion + FEM/FVM forward framework
    (Rücker, Günther & Wagner 2017, Computers & Geosciences 109:106-123)
  binary:
    path: KISSPATH_KI_ROOT/pyGIMLi/knowledge_infrastructure/tools/run_pygimli.py
    type: Python
pipeline:
  stages:
  - s0_data_preparation
  - s1_mesh_generation
  - s2_parameter_setup
  - s3_forward_inversion
  - s4_output_analysis
  - s5_joint_inversion
tools:
  count: 4
  files:
  - tools/convert_data_to_gimli.py
  - tools/convert_parameters.py
  - tools/parse_gimli_output.py
  - tools/run_pygimli.py
inputs:
  forcing:
  - name: ERT apparent resistivity (rhoa)
    unit: Ohm·m
  - name: SRT first-arrival traveltime (t)
    unit: s
  - name: IP apparent phase (ipa)
    unit: mrad
  - name: EM apparent conductivity
    unit: S/m
  parameters:
  - name: electrode / sensor positions
    unit: m (local Cartesian)
  - name: data error estimate (relative + absolute)
    unit: fraction 0-1
  - name: FEM mesh (parameter + forward)
    unit: m
  - name: regularization strength lambda
    unit: dimensionless
  - name: zWeight (vertical smoothness anisotropy)
    unit: dimensionless
  - name: physical/petrophysical model parameters & region table
    unit: method-dependent
  initial_conditions:
  - name: starting model (m0)
    unit: method-dependent
  - name: reference model (m_ref)
    unit: method-dependent
  boundary_conditions:
  - name: geophysical method
    unit: categorical
  - name: electrode / measurement scheme
    unit: categorical
  - name: data & model transforms
    unit: categorical
  - name: singularity removal (sr)
    unit: boolean
  - name: robust data norm (robustData)
    unit: boolean
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - inverted_resistivity_model
  - inverted_velocity_model
  - inverted_conductivity_or_coleCole_model
  - forward_response
  - data_fit_chi2
  - coverage_sensitivity
  other: []
validation:
  tier: null
  tier_justification: no scored run recorded in the models DB at generation time
summary:
  total_tools: 4
  total_stage_docs: 6
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
