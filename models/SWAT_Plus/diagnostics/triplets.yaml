  verified: '2026-03-19'
- id: dt_v003
  stage: s7_simulation_config
  failure_domain: parameter_format
  symptom:
    description: pySWATPlus raises ParserError 'Expected 5 fields, saw 6' or KeyError 'name' when reading
      cal_parms.cal
    error_pattern: Expected 5 fields.*saw 6|KeyError.*'name'
    detection_method: log_match
  diagnosis:
    root_cause: cal_parms.cal has uppercase headers and multi-word units incompatible with pySWATPlus
    explanation: "pySWATPlus reads cal_parms.cal using pandas.read_csv with whitespace separator. Three\
      \ incompatibilities with SWAT+ Editor output: (1) SWAT+ Editor writes uppercase headers (NAME, OBJ_TYP)\
      \ but pySWATPlus expects\n    lowercase (name, obj_typ) — causes KeyError.\n(2) Units with spaces\
      \ like \"kg P\", \"kg N\", \"julian day\", \"deg c\" add an extra\n    field per line — causes ParserError\
      \ \"Expected 5 fields, saw 6\".\n(3) Windows carriage returns (\\r) from SWAT+ Editor on Windows\
      \ can cause\n    subtle parsing issues on Linux.\n"
    affected_components:
    - s7_simulation_config
    - s8_model_execution
    - s6_calibration
  remedy:
    action: Run fix_cal_parms_cal() from adapt_swatplus_project.py, or manually fix headers and units
    tool_to_run: adapt_swatplus_project
    manual_steps:
    - 'Lowercase the header line: NAME→name, OBJ_TYP→obj_typ, ABSMIN→absmin, ABSMAX→absmax, UNITS→units'
    - 'Replace multi-word units: ''kg P''→''kg_P'', ''kg N''→''kg_N'', ''julian day''→''julian_day'',
      ''deg c''→''deg_c'', ''m**3''→''m3'''
    - 'Remove Windows line endings: tr -d ''\r'' < cal_parms.cal > fixed.cal && mv fixed.cal cal_parms.cal'
    prevention: adapt_swatplus_project.py Step 10 auto-fixes this for all new projects
  severity: fatal
  cross_references:
  - dt_v001
  - dt_v002
  verified: '2026-03-19'
- id: dt_v004
  stage: s2_hru_definition
  failure_domain: parameter_format
  symptom:
    description: SWAT+ segfaults in mgt_operatn_ when using generated management schedules (generic_ag)
    error_pattern: SIGSEGV.*mgt_operatn_
    detection_method: log_match
  diagnosis:
    root_cause: Custom management.sch operations format incompatible with SWAT+ rev59
    explanation: 'The simplified generic_ag schedule (5 ops: till/plnt/fert/harv/skip) causes a segfault
      during the first timestep. The SWAT+ rev59 management reader expects a specific format for operation
      data fields that our simplified version doesn''t match. LREW''s lrew_ag1 has 33 operations with
      decision-table-based management. Using no_mgt for all land uses avoids the crash and is valid for
      hydrology-only runs.

      '
    affected_components:
    - s2_hru_definition
    - s8_model_execution
  remedy:
    action: Use no_mgt for all land uses in landuse.lum. For crop-specific management, use pySWATPlus
      to set up management after project generation.
    tool_to_run: generate_hru_from_global
    manual_steps:
    - Set mgt = 'no_mgt' for all land use types in landuse.lum
    - 'For crop management, use pySWATPlus: reader.run_swat(parameters=[...]) with decision-table management'
    prevention: generate_hru_from_global.py defaults to no_mgt for all land uses
  severity: fatal
  cross_references:
  - dt_v001
  verified: '2026-03-19'
- id: dt_v005
  stage: s7_simulation_config
  failure_domain: silent_error
  symptom:
    description: basin_wb_yr.txt is empty (3 header lines, no data) while hru_wb and channel output work
      fine
    error_pattern: basin_wb_yr.txt.*3 lines|basin_wb.*empty
    detection_method: file_check
  diagnosis:
    root_cause: Missing soils_lte.sol file and its reference in file.cio soils line
    explanation: 'SWAT+ requires soils_lte.sol to be listed as the third entry on the soils line in file.cio:
      ''soils  soils.sol  nutrients.sol  soils-lte.sol''. The file can be empty (0 bytes) but MUST exist
      and be referenced. Without it, SWAT+ runs successfully and produces HRU/channel/aquifer output,
      but basin-level aggregation silently produces no data. This is a silent error — no error message,
      no warning, just empty basin output.

      '
    affected_components:
    - s7_simulation_config
  remedy:
    action: Create empty soils_lte.sol and add 'soils-lte.sol' as third entry in file.cio soils line
    tool_to_run: generate_hru_from_global
    manual_steps:
    - touch soils_lte.sol (create empty file)
    - 'Update file.cio: ''soils  soils.sol  nutrients.sol  soils-lte.sol'''
    prevention: generate_hru_from_global.py Step 8 creates empty soils_lte.sol automatically
  severity: silent
  cross_references: []
  verified: '2026-03-19'
- id: dt_v006
  stage: s9_output_parsing
  failure_domain: unit_conversion
  symptom:
    description: SWAT+ channel discharge appears 200x too high when compared to VIC routing output
    error_pattern: SWAT+ discharge.*100x|ratio.*[5-9]\.
    detection_method: value_comparison
  diagnosis:
    root_cause: SWAT+ channel output flo_out is in ha-m/day, not m³/s
    explanation: 'SWAT+ channel daily output (channel_day.txt) reports flo_out in hectare-meters per day
      (ha-m/day), not cubic meters per second (m³/s). The units row in the output file shows ''ha-m''
      for flow columns. VIC routing output is in m³/s. Without conversion, SWAT+ discharge appears ~200x
      higher than VIC. Conversion: Q (m³/s) = flo_out (ha-m/day) × 10000 / 86400.

      '
    affected_components:
    - s9_output_parsing
  remedy:
    action: 'Convert SWAT+ channel flow: Q_cms = flo_out_ham * 10000 / 86400'
    tool_to_run: compare_swatplus_vic
    manual_steps:
    - Read units row (line 3) from channel output
    - 'If flo_out unit is ''ha-m'': multiply by 10000/86400 to get m³/s'
    - 'If flo_out unit is ''m^3/s'' or ''cms'': no conversion needed'
    prevention: compare_swatplus_vic.py should auto-detect units from header
  severity: silent
  cross_references:
  - cfp_004
  verified: '2026-03-19'
- id: dt_v007
  stage: s9_output_parsing
  failure_domain: parameter_format
  symptom:
    description: Channel output files (channel_day.txt, channel_yr.txt) not generated despite print.prt
      enabling them
    error_pattern: channel.*txt.*not found|No channel output
    detection_method: missing_output
  diagnosis:
    root_cause: print.prt format must exactly match SWAT+ editor output for channel output to work
    explanation: 'The generated print.prt enables channel output (y for daily/yearly) but SWAT+ may not
      produce the files if the print.prt format has subtle whitespace differences. Using the exact print.prt
      from a working SWAT+ Editor project resolves this. The soils_lte.sol file (dt_v005) also affects
      whether output files are generated.

      '
    affected_components:
    - s7_simulation_config
    - s9_output_parsing
  remedy:
    action: Copy print.prt from a working SWAT+ Editor project (e.g., LREW demo)
    tool_to_run: ''
    manual_steps:
    - Copy print.prt from a known-working SWAT+ project
    - 'Enable desired outputs: sed -i ''s/^channel .*/channel  y  n  y  n/'' print.prt'
    - Ensure soils_lte.sol exists (dt_v005)
    prevention: generate_hru_from_global.py copies print.prt from LREW template
  severity: degraded
  cross_references:
  - dt_v005
  verified: '2026-03-19'
- id: dt_v008
  stage: s1_watershed_delineation
  failure_domain: parameter_format
  symptom:
    description: SWAT+ generates thousands of subbasins (>2000) causing extremely slow execution or crash.
      With channel_threshold=100 cells on 90m DEM for 9,000 km2 basin, 2,847 subbasins generated — 12x
      slower than needed.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Stream channel threshold too low for basin scale. Default=100 accumulation cells at 90m
      DEM creates micro-watersheds. For large basins (>5000 km2), threshold=5000 cells gives proper stream
      density.
    explanation: 'The channel threshold controls the minimum contributing area required for a cell to
      be classified as a stream channel. Too low generates an unrealistically dense stream network with
      thousands of tiny subbasins. Each subbasin creates routing overhead in SWAT+. For the Chaohe basin
      (8,783 km2) at 90m DEM: threshold=100 gave 2,847 subbasins (358s runtime), threshold=5000 gave 28
      subbasins (29s runtime) — a 12x speedup with scientifically adequate channel density (1% channel
      cells, Strahler order 3). Scale threshold proportionally with basin area: ~5000 for >5000 km2, ~1000
      for <1000 km2.

      '
    affected_components:
    - generate_hru_from_global.py channel_threshold parameter
    - channels.cha
    - subbasin delineation
  remedy:
    action: Set channel_threshold=5000 for basins >5000 km2 at 90m DEM. Scale proportionally for smaller
      basins or finer DEMs.
    tool_to_run: generate_hru_from_global
    manual_steps:
    - Check current subbasin count in object.cnt
    - 'If >500 subbasins for a single basin: increase channel threshold'
    - Re-run generate_hru_from_global.py with --channel_threshold 5000
    - 'Verify: 20-50 subbasins for 5000-10000 km2 basin'
    prevention: generate_hru_from_global.py defaults to threshold=5000
  severity: degraded
  cross_references:
  - dt_008
  verified: '2026-03-19'
- id: dt_020
  stage: s10_water_quality
  failure_domain: silent_error
  symptom:
    description: SWAT+ runs to completion but nutrient output (orgn_out, no3_out, solp_out, sedp_out)
      in channel_sd_day.txt is all zeros, despite fertilizer being applied in management.sch.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Nutrient output is not enabled in print.prt. basin_nb and/or channel_sd nutrient columns
      are disabled (set to 'n').
    explanation: 'SWAT+ computes nutrient cycling internally regardless of print.prt settings, but only
      writes output to files when the corresponding line in print.prt is set to ''y''. If basin_nb=n (nutrient
      balance) and channel_sd daily=n, no nutrient data appears in output files. The channel_sd file may
      still show flo_out (discharge) if channel_sd daily=y, but the nutrient columns will be zero if the
      internal nutrient module was not triggered (e.g., no fertilizer configured, or soil nutrient pools
      are zero). Additionally, if hru_nb=n, HRU-level nutrient diagnostics are unavailable for debugging.

      '
    affected_components:
    - print.prt (basin_nb, hru_nb lines)
    - management.sch (fertilizer operations)
    - nutrients.sol (initial soil N/P pools)
  remedy:
    action: Run configure_nutrient_output.py to enable basin_nb and channel_sd nutrient output. Verify
      management.sch has fertilizer operations.
    tool_to_run: configure_nutrient_output
    manual_steps:
    - 'Open print.prt: check basin_nb daily is ''y'''
    - Check channel_sd daily is 'y' (nutrient columns are included automatically)
    - Verify management.sch has 'fert' operations with non-zero rates
    - Verify nutrients.sol has non-zero initial N/P pools
    - Re-run SWAT+ after enabling output
    prevention: Always run configure_nutrient_output.py before water quality simulations.
  severity: silent
  cross_references:
  - dt_010
- id: dt_021
  stage: s10_water_quality
  failure_domain: silent_error
  symptom:
    description: Simulated sediment yield exceeds 100 t/ha/yr, which is unreasonable for agricultural
      land without active gully erosion. Sediment output dominates nutrient transport via sediment-bound
      P.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: USLE_K (soil erodibility) or slope values are incorrect, or USLE_P (practice factor) is
      not calibrated.
    explanation: 'SWAT+ computes sediment yield using the Modified Universal Soil Loss Equation (MUSLE).
      Sediment yield is proportional to USLE_K * LS * C * P. If USLE_K is derived from wrong soil texture
      (e.g., silt loam instead of clay), sediment can be 5-10x too high. If the slope (LS factor) uses
      raw DEM slope without accounting for terracing or field smoothing, steep-slope HRUs dominate sediment
      production. USLE_P=1.0 (no erosion control) is the default — agricultural terraces in China typically
      have P=0.3-0.6. For Chinese agricultural land, typical sediment yield is 5-50 t/ha/yr; values >100
      suggest parameter error.

      '
    affected_components:
    - soils.sol (USLE_K column)
    - hru-data.hru (slope)
    - codes.bsn (erosion parameters)
  remedy:
    action: Check USLE_K values against soil texture expectations. Verify slope values are reasonable.
      Set USLE_P < 1.0 for terraced agricultural land.
    tool_to_run: validate_soil_properties
    manual_steps:
    - 'Check USLE_K in soils.sol: typical range 0.10-0.45 for agricultural soils'
    - 'Check slope in hru-data.hru: mean slope >30% is unusual for cropland'
    - Set USLE_P = 0.3-0.6 in calibration.cal for terraced HRUs
    - Consider FILTERW in filterstrip.str (5-30 m) for grass buffer strips
    prevention: Validate USLE_K against soil texture. Calibrate USLE_P for management practices.
  severity: silent
  cross_references:
  - dt_004
- id: dt_022
  stage: s10_water_quality
  failure_domain: silent_error
  symptom:
    description: Basin nutrient balance (basin_nb output) shows nutrient outputs exceeding inputs — more
      N or P leaving the basin than entering through fertilizer, atmospheric deposition, and fixation
      combined. Soil nutrient pools decline rapidly.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Initial soil nitrogen and phosphorus pools (in nutrients.sol) are set too low or zero,
      causing the model to mine soil organic matter to balance crop uptake.
    explanation: 'SWAT+ initializes soil N and P pools from nutrients.sol (or defaults from soil organic
      carbon in soils.sol). If nutrients.sol is missing or has zero values, initial pools are computed
      from soil organic carbon using default C:N ratios. For soils with very low organic carbon (<0.5%),
      this produces tiny N pools. When crops are grown with fertilizer, uptake may exceed the sum of fertilizer
      + mineralization, causing the active organic N pool to go negative or very low. This triggers excessive
      mineralization of the stable organic pool, creating an unsustainable nutrient loss. Chinese agricultural
      soils typically have 50-200 kgN/ha in the top 30cm.

      '
    affected_components:
    - nutrients.sol
    - soils.sol (SOL_CBN column)
    - basin_nb output
  remedy:
    action: Check and initialize soil nutrient pools in nutrients.sol. Verify SOL_CBN is reasonable in
      soils.sol.
    tool_to_run: ''
    manual_steps:
    - 'Check soils.sol: SOL_CBN should be 0.5-3% for agricultural soils'
    - 'Check nutrients.sol: sol_no3 should be 5-20 mgN/kg, sol_orgn should be 500-2000 mgN/kg'
    - 'If nutrients.sol is missing: SWAT+ derives pools from SOL_CBN — ensure SOL_CBN >= 0.5%'
    - Run SWAT+ for 5+ year warmup (nyskip >= 5) to stabilize nutrient pools
    prevention: Use realistic SOL_CBN values. Set warmup period >= 3 years for nutrient simulations.
  severity: silent
  cross_references:
  - dt_010
- id: dt_wq_001
  stage: s10_water_quality
  failure_domain: runtime
  symptom:
    pattern: channel_day.txt no3_out values > 1e6 kgN or NaN in solp_out
    description: QUAL2E in-stream routing produces physically impossible nutrient concentrations (>1e9
      mg/L) during flood events in Rev 59.3
  diagnosis:
    root_cause: Rev 59.3 wq_semianalyt function numerically unstable for extreme flow events
    explanation: During monsoon peak flows, the semi-analytical QUAL2E solver diverges. Small channels
      generate unrealistic NO3 from benthic NH4 nitrification, cascading downstream.
  remedy:
    steps:
    - Do NOT use channel_day.txt no3_out/orgn_out for nutrient loads
    - Use basin_ls_day.txt (sedorgn, surqno3) for HRU-level nutrient export
    - Use basin_nb_yr.txt for basin N budget (fertn, denit)
    - Keep wq_cha=0 in codes.bsn
    prevention: Use HRU-level nutrient outputs. A newer SWAT+ binary (Rev 60.5+) fixes the QUAL2E solver.
  severity: degraded
  cross_references:
  - dt_wq_002
- id: dt_wq_002
  stage: s10_water_quality
  failure_domain: runtime
  symptom:
    pattern: om_water.ini initial concentrations orgn=90 no3=70 mg/L
    description: Default om_water.ini has unrealistically high initial nutrient concentrations
  diagnosis:
    root_cause: HRU generator creates placeholder values, not physically calibrated initial conditions
    explanation: Initial concentrations create massive stored nutrient mass in 215 channels. Benthic sources
      + nitrification further amplify. Channel storage nutrient mass dominates over HRU inputs.
  remedy:
    steps:
    - Set all nutrient initial concentrations in om_water.ini to 0
    - Only keep dox (dissolved oxygen) = 7-8 mg/L and temp = 15-20
    - Let HRU nutrient outputs build up naturally during warmup period
    prevention: Always zero out nutrient initial concentrations. Use 3+ year warmup.
  severity: silent
- id: dt_wq_003
  stage: s8_model_execution
  failure_domain: runtime
  symptom:
    pattern: SIGSEGV in ch_initial_ -> proc_cha_
    description: Segmentation fault during channel initialization with post-2023 SWAT+ source
  diagnosis:
    root_cause: New source code allocates ch array for regular channels only, but project uses sd_channels
    explanation: channel_allo is commented out in proc_cha.f90. The ch array has size 0 but ch_initial
      accesses ch(1). Projects using sd_channel_control3 (all HydroCraft projects) trigger this crash.
  remedy:
    steps:
    - Use the original Rev 59.3 binary (swatplus_rev59, 5.6MB, Jul 2019)
    - Do NOT recompile from latest source without fixing proc_cha.f90
    - 'If recompiling: add ''if (allocated(ch)) then'' guard around ch_initial loop in proc_cha.f90'
    prevention: Always test newly compiled binaries before replacing working ones.
  severity: fatal
- id: dt_023
  stage: s6_parameter_calibration
  failure_domain: silent_error
  symptom:
    description: TN export exceeds 50 kgN/ha/yr — far above any observed basin
    error_pattern: basin_nb_yr.*total_n.*> 50
    detection_method: value_comparison
  diagnosis:
    root_cause: n_perc (NPERCO) in parameters.bsn exceeds valid range [0-1]
    explanation: 'NPERCO is the nitrogen percolation coefficient (dimensionless, 0-1). Values >1 are physically
      impossible but SWAT+ does not enforce the range. An out-of-range value silently inflates nitrate
      leaching at every soil layer computation step, leading to massively over-estimated N export.

      '
    affected_components:
    - parameters.bsn
    - basin_nb_yr.txt
  remedy:
    steps:
    - Open parameters.bsn and check n_perc value
    - Valid range is 0-1, default 0.2
    - If >1, set to 0.2 and re-run
    prevention: 'Add preflight check: assert 0 <= n_perc <= 1 in parameters.bsn'
  severity: silent
  cross_references:
  - dt_024
- id: dt_024
  stage: s10_water_quality
  failure_domain: silent_error
  symptom:
    description: TP output is always 0.000 in channel_sd_yr.txt despite fertilizer application
    error_pattern: channel_sd.*tp_.*0\.000
    detection_method: value_comparison
  diagnosis:
    root_cause: rtu_wq = 0 in codes.bsn when water quality output was requested
    explanation: 'codes.bsn controls which modules are active. rtu_wq must be set to 1 for nutrient routing
      in channels. When rtu_wq=0, phosphorus is computed at HRU level but never routed to channels, so
      channel TP output is zero. This is silent — no error, no warning, just zero output.

      '
    affected_components:
    - codes.bsn
    - channel_sd_yr.txt
  remedy:
    steps:
    - Set rtu_wq = 1 in codes.bsn
    - Ensure om_water.ini initial P concentrations are zeroed (see dt_wq_002)
    - Re-run with 3+ year warmup
    prevention: If TP output is needed, always verify rtu_wq=1 in codes.bsn.
  severity: silent
  cross_references:
  - dt_wq_001
  - dt_wq_002
- id: dt_025
  stage: s10_water_quality
  failure_domain: silent_error
  symptom:
    description: TP in basin_nb_yr.txt is 0 or near-zero despite P being important in the basin
    error_pattern: basin_nb_yr.*totp.*< 0\.1
    detection_method: value_comparison
  diagnosis:
    root_cause: No phosphorus fertilizer defined in management schedules
    explanation: 'If management.sch references only N fertilizer (e.g., urea, elem_n) but no P-containing
      fertilizer (e.g., DAP, MAP, 11-52-0), TP export will be near-zero because SWAT+ has no background
      P mineralization strong enough to produce realistic loads. This is silent — the model runs fine.

      '
    affected_components:
    - management.sch
    - fertilizer.frt
    - basin_nb_yr.txt
  remedy:
    steps:
    - 'Check fertilizer.frt for P content: frt_p column must be > 0 for at least one entry'
    - Add DAP or compound fertilizer (e.g., 18-46-0) to management.sch
    - 'Typical rice paddy: 40-60 kgP2O5/ha = ~17-26 kgP/ha applied'
    prevention: 'Preflight: warn if management.sch has fertilizer ops but no P in fertilizer.frt.'
  severity: silent
  cross_references:
  - dt_024
- id: dt_026
  stage: s6_parameter_calibration
  failure_domain: silent_error
  symptom:
    description: Runoff is unrealistically high or low; hydrograph shape wrong regardless of calibration
    error_pattern: cn2.*< 25|cn2.*> 98
    detection_method: value_comparison
  diagnosis:
    root_cause: CN2 values in hru-data.hru are outside physically realistic range (25-98)
    explanation: 'CN2 (curve number for moisture condition II) must be 25-98 for SCS method. Values <25
      produce almost no runoff even in storms; values >98 make every HRU behave like impervious surface.
      SWAT+ does not clamp this value and will silently produce wrong partitioning.

      '
    affected_components:
    - hru-data.hru
    - hydrology.hyd
  remedy:
    steps:
    - 'Check CN2 values: sort hru-data.hru by cn2 column'
    - 'Forest on good soil: CN2 ~ 36-70; Cropland: 67-85; Urban: 89-98'
    - If auto-generated, verify land use to CN lookup table
    prevention: 'Preflight check: assert 25 <= CN2 <= 98 for all HRUs.'
  severity: silent
  cross_references: []
- id: dt_027
  stage: s9_postprocess
  failure_domain: silent_error
  symptom:
    description: PBIAS exceeds +/- 100% when comparing simulated vs observed streamflow
    error_pattern: PBIAS.*> 100|PBIAS.*< -100
    detection_method: value_comparison
  diagnosis:
    root_cause: Model is fundamentally miscalibrated or has structural issues
    explanation: 'PBIAS > +100% means simulated flow is more than double observed (volume overestimation).
      PBIAS < -100% means simulated is less than zero relative to observed mean. Common causes: wrong
      basin area, wrong precipitation forcing, ESCO/EPCO wildly off, or missing irrigation/diversion.

      '
    affected_components:
    - calibration.cal
    - weather-sta.cli
    - basin area
  remedy:
    steps:
    - Verify basin area matches between HRU definitions and watershed delineation
    - 'Check precipitation: compare station data with basin average rainfall'
    - 'If PBIAS > +50%: increase ESCO (0.7-1.0), check for duplicate precipitation'
    - 'If PBIAS < -50%: decrease ESCO, check for missing stations or irrigation'
    - Run SWAT-CUP or iPySwat for systematic calibration
    prevention: Always check PBIAS as first metric after initial run.
  severity: degraded
  cross_references:
  - dt_028
- id: dt_028
  stage: s7_simulation_config
  failure_domain: silent_error
  symptom:
    description: Simulated total basin area does not match GIS delineation; water balance off by fixed
      ratio
    error_pattern: basin_wb_yr.*area.*mismatch
    detection_method: value_comparison
  diagnosis:
    root_cause: Sum of HRU areas in hru-data.hru does not match sub_area in watershed file
    explanation: 'If HRUs were generated from a different DEM resolution or clipped differently than the
      watershed boundary, total HRU area can differ from the watershed area used for unit-area calculations.
      This causes a systematic bias in all fluxes (precip, ET, Q) proportional to the area mismatch. The
      model gives no warning.

      '
    affected_components:
    - hru-data.hru
    - rout_unit.def
    - watershed boundary
  remedy:
    steps:
    - Sum area_ha column in hru-data.hru
    - Compare to total watershed area from GIS shapefile
    - If >5% mismatch, regenerate HRUs from correct DEM/boundary
    prevention: 'Preflight: compare sum(hru_area) vs watershed boundary area.'
  severity: silent
  cross_references:
  - dt_027
- id: dt_029
  stage: s4_forcing
  failure_domain: runtime
  symptom:
    description: SWAT+ crashes with cryptic Fortran error 'end of file' or 'input conversion error' during
      weather read
    error_pattern: STOP.*end of file|Fortran runtime error.*input
    detection_method: log_match
  diagnosis:
    root_cause: A weather station referenced in weather-sta.cli is missing its .pcp, .tmp, or other forcing
      file
    explanation: 'weather-sta.cli lists station names; SWAT+ expects corresponding files (e.g., stationname.pcp,
      stationname.tmp) in TxtInOut. If any file is missing or has fewer records than the simulation period,
      the Fortran READ hits end-of-file. The error message does not name the missing file.

      '
    affected_components:
    - weather-sta.cli
    - '*.pcp'
    - '*.tmp'
    - '*.slr'
    - '*.hmd'
    - '*.wnd'
  remedy:
    steps:
    - List all station names in weather-sta.cli
    - Verify each name.pcp, name.tmp, etc. exists in TxtInOut
    - 'Check line count: need nbyr*365 (or 366) data lines + header'
    - 'Use: wc -l *.pcp to quickly spot short files'
    prevention: 'Preflight: for each station in weather-sta.cli, assert all required files exist and have
      correct line count.'
  severity: fatal
  cross_references:
  - dt_001
- id: dt_030
  stage: s4_forcing
  failure_domain: runtime
  symptom:
    description: Simulation runs but final years produce NaN or sudden zero in all outputs
    error_pattern: NaN|0\.000.*0\.000.*repeated
    detection_method: value_comparison
  diagnosis:
    root_cause: Simulation end date extends beyond available weather data
    explanation: 'If time.sim end_yr/end_jday exceeds the period covered by .pcp/.tmp files, SWAT+ may
      read garbage values or zeros beyond the file end (depending on Fortran runtime). No explicit error
      is raised in some builds; outputs simply degrade or go to zero/NaN for the over-extended period.

      '
    affected_components:
    - time.sim
    - '*.pcp'
    - '*.tmp'
  remedy:
    steps:
    - Check time.sim start/end dates
    - Check last date in .pcp and .tmp files
    - Ensure weather data covers full simulation period + warmup
    prevention: 'Preflight: assert weather file date range >= time.sim range.'
  severity: silent
  cross_references:
  - dt_029
- id: dt_031
  stage: s9_postprocess
  failure_domain: silent_error
  symptom:
    description: Expected output file (e.g., channel_sd_yr.txt) is empty or missing
    error_pattern: channel_sd.*not found|channel_sd.*0 bytes
    detection_method: file_check
  diagnosis:
    root_cause: print.prt does not have the required output category enabled
    explanation: 'print.prt controls which SWAT+ output files are written. Each category (basin_wb, channel_sd,
      hru, etc.) must be explicitly enabled with daily/monthly/yearly flags. If a category is not listed
      or its flags are all ''n'', the output file is not written. SWAT+ gives no warning.

      '
    affected_components:
    - print.prt
  remedy:
    steps:
    - Open print.prt and check that the desired category is listed
    - Set the time step flag (daily/monthly/yearly) to 'y'
    - 'Common categories: basin_wb, channel_sd, hru, lsunit_wb'
    - 'For nutrients: add channel_sd_nr or basin_nb'
    prevention: 'Preflight: verify print.prt enables all output categories needed for validation.'
  severity: silent
  cross_references: []
- id: dt_032
  stage: s6_parameter_calibration
  failure_domain: silent_error
  symptom:
    description: Simulated baseflow is zero or near-zero; entire hydrograph is surface runoff
    error_pattern: basin_wb_yr.*latq.*0\.0.*perc.*0\.0
    detection_method: value_comparison
  diagnosis:
    root_cause: GW_DELAY too high (>500 days) or ALPHA_BF too low (<0.001) in aquifer.aqu
    explanation: 'GW_DELAY controls the lag between water leaving the soil profile and entering the shallow
      aquifer. Very high values (>500 days) mean percolation water never reaches the aquifer during a
      typical simulation. Similarly, ALPHA_BF controls the recession constant — values near zero mean
      the aquifer never releases water to streams. Both are silent.

      '
    affected_components:
    - aquifer.aqu
    - basin_wb_yr.txt
  remedy:
    steps:
    - 'Check aquifer.aqu: gw_delay should be 1-365 days (default 31)'
    - 'Check alpha_bf: typical range 0.01-0.3 (default 0.048)'
    - If both look reasonable, check that soils have percolation path (SOL_K > 0)
    - 'Verify with basin_wb_yr.txt: latq + perc should be > 0'
    prevention: 'Preflight: assert gw_delay < 500 and alpha_bf > 0.001.'
  severity: silent
  cross_references: []
- id: dt_033
  stage: s9_postprocess
  failure_domain: silent_error
  symptom:
    description: NSE is negative (often -0.5 to -10) despite seemingly correct setup
    error_pattern: NSE.*< 0
    detection_method: value_comparison
  diagnosis:
    root_cause: Model needs systematic calibration; default parameters are not appropriate for this basin
    explanation: 'Negative NSE means the model performs worse than using the observed mean as a predictor.
      Common causes: (1) wrong CN2 for land use, (2) ESCO default 0.95 wrong for climate, (3) AWC from
      HWSD not representative, (4) GW parameters at defaults. This is expected for uncalibrated runs but
      must be flagged for action.

      '
    affected_components:
    - calibration.cal
    - all parameter files
  remedy:
    steps:
    - First check for structural issues (dt_026, dt_027, dt_028, dt_029)
    - If no structural issues, run calibration with SWAT-CUP or iPySwat
    - 'Priority parameters: CN2, ESCO, AWC, GW_DELAY, ALPHA_BF, SURLAG'
    - 'Target: NSE > 0.5 (good), NSE > 0.3 (acceptable for uncalibrated)'
    prevention: Always calibrate before using for scenario analysis.
  severity: degraded
  cross_references:
  - dt_026
  - dt_027
- id: dt_034
  stage: s9_postprocess
  failure_domain: silent_error
  symptom:
    description: Sediment yield exceeds 100 t/ha/yr — unrealistic for most non-loess regions
    error_pattern: basin_ls_yr.*syld.*> 100
    detection_method: value_comparison
  diagnosis:
    root_cause: USLE_K or USLE_C factors are too high, or slope length/steepness from DEM is incorrect
    explanation: 'MUSLE sediment yield > 100 t/ha/yr is physically unrealistic for all but the most extreme
      erosion environments (e.g., Chinese Loess Plateau). Common causes: USLE_K auto-calculated too high
      for organic soils, USLE_C not updated for conservation practices, or slope_len from low-res DEM
      creates unrealistic LS factor values.

      '
    affected_components:
    - hru-data.hru
    - soils.sol
    - topography.hyd
  remedy:
    steps:
    - 'Check USLE_K in soils.sol: typical range 0.01-0.45'
    - 'Check USLE_C in management.sch: bare soil ~0.5, crops 0.01-0.2'
    - 'Check slope_len in topography.hyd: >100m may be unrealistic'
    - For regions <30 t/ha/yr expected, reduce USLE_P or adjust practices
    prevention: Compare sediment yield against regional literature values.
  severity: silent
  cross_references: []
- id: dt_035
  stage: s9_postprocess
  failure_domain: silent_error
  symptom:
    description: 'basin_wb_yr.txt water balance does not close: precip differs significantly from ET +
      Q + delta_storage'
    error_pattern: abs(precip - et - surq - latq - perc - revap) > 0.05 * precip
    detection_method: value_comparison
  diagnosis:
    root_cause: Water balance residual indicates a storage term or flux is missing or miscounted
    explanation: 'In basin_wb_yr.txt, precip should approximately equal ET + surq_gen + latq + tile +
      perc - revap +/- change in soil/aquifer storage. A residual >5% of precip after warmup suggests:
      (1) aquifer deep percolation losing water (rchrg_dp too high), (2) ponds/wetlands accumulating water
      without release, (3) irrigation importing water not counted in basin precip.

      '
    affected_components:
    - basin_wb_yr.txt
    - aquifer.aqu
    - reservoir.res
  remedy:
    steps:
    - Extract annual values from basin_wb_yr.txt
    - 'Compute: residual = precip - (et + surq_gen + latq + tile + perc - revap)'
    - 'If residual > 0: check rchrg_dp (deep aquifer recharge fraction) — reduce if >0.3'
    - 'If residual < 0: check for irrigation or reservoir inflows'
    - First year is warmup — focus on years 2+
    prevention: Always check water balance closure as first validation step.
  severity: silent
  cross_references:
  - dt_032
- id: dt_036
  stage: s10_water_quality
  failure_domain: runtime
  symptom:
    description: Channel nutrient concentrations oscillate wildly or go negative between time steps
    error_pattern: channel_sd.*orgn.*< 0|channel_sd.*no3.*oscillat
    detection_method: value_comparison
  diagnosis:
    root_cause: QUAL2E in-stream routing solver is numerically unstable at daily time step
    explanation: 'The QUAL2E solver in SWAT+ uses an analytical steady-state solution that assumes constant
      flow within a day. In flashy basins with large flow variation, this produces numerical instability:
      concentrations oscillate, go negative, or spike. This is a known SWAT+ limitation documented by
      Neitsch et al. (2011). It is worse with many short channel reaches.

      '
    affected_components:
    - channel routing
    - codes.bsn wq_cha setting
  remedy:
    steps:
    - Set wq_cha = 0 in codes.bsn to disable in-stream WQ (use HRU outputs instead)
    - Use basin_nb_yr.txt for N and P budgets at basin scale
    - 'If in-stream WQ needed: use SWAT+ Rev 60.5+ with improved solver'
    - 'Alternatively: aggregate to monthly output to smooth oscillations'
    prevention: Use HRU-level nutrient outputs. Upgrade to Rev 60.5+ for stable QUAL2E.
  severity: degraded
  cross_references:
  - dt_wq_001
- id: dt_037
  stage: s6_parameter_calibration
  failure_domain: runtime
  symptom:
    description: SWAT+ runs with default parameters; calibration.cal file is missing or empty
    error_pattern: calibration\.cal.*not found|calibration\.cal.*0 bytes
    detection_method: file_check
  diagnosis:
    root_cause: calibration.cal was not created or was accidentally deleted from TxtInOut
    explanation: 'calibration.cal contains parameter adjustment instructions (chg_typ, chg_val) that modify
      base parameter values at runtime. Without it, SWAT+ runs with raw parameter values from input files,
      which are rarely appropriate for any specific basin. The model runs without error — it simply uses
      uncalibrated defaults.

      '
    affected_components:
    - calibration.cal
    - file.cio
  remedy:
    steps:
    - 'Check if calibration.cal exists in TxtInOut: ls -la calibration.cal'
    - If missing, generate from SWAT-CUP or manually create with key parameters
    - 'Minimum calibration parameters: cn2, esco, awc, gw_delay, alpha_bf, surlag'
    - 'Format: ''chg_typ absval chg_val 0.75 ... '' (see SWAT+ documentation)'
    prevention: Always include calibration.cal in the TxtInOut setup checklist.
  severity: silent
  cross_references:
  - dt_033
- id: dt_wq_004
  stage: s9_output_parsing
  failure_domain: silent_error
  symptom:
    description: WQ verifier against a China National guokongzhan (e.g. station 2258 Bengbu Sluice) reports
      r<0.5 and large negative NSE on derived in-stream concentration, despite clean run and water balance.
      NH3-N PBIAS approaches -3000%.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Obs is in-stream CONCENTRATION (mg/L) of a single species at a gate-regulated station
      with no co-located discharge. With wq_cha=0 mandatory (Rev 59.3 QUAL2E blowup, dt_wq_001/dt_036),
      SWAT+ has no in-stream concentration state and exports only HRU LOADS (kg). Deriving conc as HRU_load/channel_flo_out
      yields ~0 mg/L in dry months (no baseflow/benthic/gate floor) so pattern correlation collapses;
      comparing TOTAL-N export to obs NH3-N adds a species mismatch.
    explanation: 'This is a domain mismatch, not calibration or a tool bug: no in-stream state variable
      exists to fit, so parameter tuning cannot create the ~0.1 mg/L floor a real sluice holds. The reliable
      KI output (loads) is fine (station 2258 TP load PBIAS +37.7%, within Moriasi +/-40%).

      '
    affected_components:
    - verifier WQ target selection
    - basin_ls_day HRU loads
  remedy:
    action: Do not derive in-stream concentration from HRU_load/flow and do not compare TOTAL-N to NH3-N.
      Remap the verifier target to LOADS (kg) via validate_water_quality.py, or use concentration paired
      with measured discharge so load = C x Q. A bare concentration series at a guokongzhan is not a valid
      target for this KI.
    steps:
    - Use annual/monthly LOAD (kg) comparison (PBIAS for loads, R for monthly)
    - 'Match species: SWAT+ exports TOTAL-N (surqno3+sedorgn), not single dissolved NH3-N'
    - Re-enabling QUAL2E for an in-stream floor needs a Rev 60.5+ binary (requires_data), not available
    prevention: See SKILL.md 'Validating WQ against CONCENTRATION observations (guokongzhan)'.
  severity: silent
  cross_references:
  - dt_wq_001
  - dt_036
- id: dt_038
  symptom:
    description: Delineated basin area is 5-15% larger than the gauge's published drainage area, and the
      snapped outlet sits km downstream of the requested lat/lon. Sim discharge is biased high in proportion
      to the extra area.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: delineate_watershed.py passed snap_dist=0.15 (DEM map units = DEGREES, ~17 km) to whitebox
      snap_pour_points, which relocates the pour point to the MAXIMUM flow-accumulation cell within that
      radius. Any outlet within 17 km of a larger channel is dragged downstream past confluences.
    explanation: 'snap_pour_points always moves DOWNSTREAM (toward higher accumulation), so an over-large
      radius can never be conservative. At Zijingguan (Juma, published 1760 km2) it snapped 8 km NE and
      delineated 1931 km2 (+10%). With snap_dist=0.01 deg at the true gauge cell: 1767.2 km2 (+0.4%).

      '
    affected_components:
    - tools/s1/delineate_watershed.py
    - basin area, all specific-discharge comparisons
  remedy:
    action: Pass snap_dist explicitly (6th CLI arg, default 0.01 deg ~1 km) and ALWAYS compare the tool's
      reported delineated_area_km2 against the gauge's published drainage area before proceeding.
    steps:
    - python tools/s1/delineate_watershed.py <dem> <lat> <lon> <out_dir> 25 0.01
    - 'Locate the true gauge cell first: find the flow-accumulation cell whose upstream area matches the
      published drainage area, and delineate from THAT lat/lon'
    - Reject the delineation if |area - published| / published > 0.05
    prevention: The tool now reports delineated_area_km2 + snapped_outlet_lat/lon in its result JSON.
  severity: silent
  cross_references:
  - dt_008
- id: dt_039
  symptom:
    description: SWAT+ runs but every HRU/subbasin behaves as if at sea level; station files (.pcp/.tmp)
      all carry elev 0.0 in their 3rd header line even in a mountain basin.
    error_pattern: ''
    detection_method: file_inspection
  diagnosis:
    root_cause: prepare_weather_files.py did `from ki_tools_common.terrain import point_elevation` inside
      a bare try/except. That symbol does not exist (the module exports get_terrain), so ImportError was
      swallowed and elev fell back to 0.0 for every station in every basin.
    explanation: 'A bare `except Exception` around an import turns a missing-symbol bug into a silent
      wrong default. Station elevation feeds the wgn record and the orographic temperature/precipitation
      lapse.

      '
    affected_components:
    - tools/s3/prepare_weather_files.py
    - weather-wgn.cli elevation, lapse rates
  remedy:
    action: Use get_terrain(lat, lon)['elevation']; warn (do not silently accept) when elev == 0.
    steps:
    - python3 -c "from ki_tools_common.terrain import get_terrain; print(get_terrain(39.32, 114.58))"
    - 'Check line 3 of each .pcp: `nbyr tstep lat lon elev`'
    prevention: Never wrap an import of a specific symbol in a broad except that falls back to a plausible
      constant.
  severity: silent
  cross_references:
  - dt_012
- id: dt_040
  symptom:
    description: 'SWAT+ cannot bind weather to objects, or reads the wrong file per variable: hru.con/rout_unit.con
      name station `sta01` while pcp.cli lists `p000001.pcp`; or weather-sta.cli exists but SWAT+ behaves
      as if there were no precipitation.'
    error_pattern: ''
    detection_method: file_inspection
  diagnosis:
    root_cause: Two contract breaks between S2 and S3. (a) prepare_weather_files.py hardcoded station
      names p%06d while generate_hru_from_global.py writes wst=staNN. (b) generate_weather_stations.py
      wrote weather-sta.cli in the WRONG column order (pcp first, wgn last, no wnd_dir/atmo_dep) using
      bare stems, and wrote `wgn.wgn` instead of the `weather-wgn.cli` that rev59's file.cio names.
    explanation: "SWAT+ matches spatial objects to weather stations BY NAME, and reads weather-sta.cli\
      \ positionally. The verified layout, from the shipped developer example run_lrew/swatplus_rev59_demo/weather-sta.cli,\
      \ is:\n    name  wgn  pcp  tmp  slr  hmd  wnd  wnd_dir  atmo_dep\nwith the pcp..wnd columns holding\
      \ FILE names including extension.\n"
    affected_components:
    - tools/s3/prepare_weather_files.py
    - tools/s3/generate_weather_stations.py
    - docs/s3_weather_preparation_skill.md (documents the wrong spec)
  remedy:
    action: Pass S2's station names into S3 (7th arg), and let generate_weather_stations reuse the names
      already declared in weather-sta.cli.
    steps:
    - names=$(python3 -c "print([l.split()[8] for l in open('TxtInOut/rout_unit.con').read().split(chr(10))[2:]
      if l.strip()])")
    - python tools/s3/prepare_weather_files.py cmfd <dir> <coords> <start> <end> <out> "$names"
    - python tools/s3/generate_weather_stations.py TxtInOut/pcp.cli <coords> <coords> TxtInOut
    - 'Verify: head -3 TxtInOut/weather-sta.cli  ->  name wgn pcp tmp slr hmd wnd wnd_dir atmo_dep'
    prevention: Diff any generated weather-sta.cli against the LREW demo before running.
  severity: fatal
  cross_references:
  - dt_002
- id: dt_041
  symptom:
    description: 'After calling configure_print_prt.py the model produces the wrong output files, or reads
      garbage flags: requested daily channel output never appears, or SWAT+ stops with a read error in
      print.prt.'
    error_pattern: print.prt
    detection_method: file_inspection
  diagnosis:
    root_cause: configure_print_prt.py regenerated print.prt from a 21-entry object list that was in the
      wrong order, omitted `channel`, basin_pw/basin_res/basin_cha/basin_sd_cha, every region_*, hyd and
      ru, invented `channel_sdmorph`, and dropped the csvout/dbout/cdfout and soilout/mgtout/hydcon/fdcout
      header blocks.
    explanation: 'SWAT+ reads print.prt SEQUENTIALLY. Object rows are identified by POSITION, not by the
      name in column 1. A missing, extra, or reordered row shifts every subsequent read, so flags land
      on the wrong objects. The canonical order (37 object rows) is in the shipped demo print.prt.

      '
    affected_components:
    - tools/s7/configure_print_prt.py
  remedy:
    action: 'Edit the existing print.prt in place: change nyskip and only the flags of the requested categories,
      preserving structure and row order. The tool now does this, with a canonical 37-row fallback.'
    steps:
    - diff <(awk '/^objects/,0{print $1}' TxtInOut/print.prt) <(awk '/^objects/,0{print $1}' KISSPATH_KI_ROOT/SWAT_Plus/run_lrew/swatplus_rev59_demo/print.prt)
    - Confirm 37 object rows and the csvout/soilout blocks are present
    prevention: 'COPY-FIRST: never regenerate a fixed-layout Fortran control file from a Python list.'
  severity: fatal
  cross_references:
  - dt_001
  - dt_005
- id: dt_042
  symptom:
    description: calibration.cal is written and SWAT+ runs, but the simulated hydrograph is bit-identical
      to the uncalibrated run for some parameters (notably alpha_bf, gw_delay, perco, cn3_swf) while others
      (cn2, esco) do take effect.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: SWAT+ matches calibration.cal rows against the names in cal_parms.cal. Rev59 spells the
      aquifer recession/delay parameters `alpha` and `delay`; the SWAT2012-era `alpha_bf`/`gw_delay` do
      not match and are silently ignored. `perco` and `cn3_swf` are not in cal_parms.cal at all (they
      are hydrology.hyd fields written at HRU generation).
    explanation: 'Same silent-ignore class as the missing count line. generate_calibration_file.py''s
      VALID_PARAMS and CALIBRATION_PRESETS both used the unmatched names, so the documented `semi_arid`
      preset silently applied only cn2 and esco.

      '
    affected_components:
    - tools/s6/generate_calibration_file.py
    - SKILL.md calibration preset table
  remedy:
    action: Use the rev59 names. The tool now aliases alpha_bf->alpha and gw_delay->delay, and DROPS (with
      a warning) any name absent from the project's own cal_parms.cal.
    steps:
    - awk 'NR>2{print $1}' TxtInOut/cal_parms.cal | grep -x alpha
    - 'Set perco / cn3_swf structurally: tools/s2/generate_hru_from_global.py --perco 0.30 --cn3_swf 0.5'
    - 'Confirm the effect: the calibrated channel_day.txt must differ from the uncalibrated one'
    prevention: Always diff a calibrated run against the uncalibrated baseline before trusting a preset.
  severity: silent
  cross_references:
  - dt_004
- id: dt_043
  symptom:
    description: CMFD forcing for a year contains more days than the calendar year (e.g. 396 days for
      2003), or annual precipitation shifts when the requested period changes. Tmax == Tmin on every day.
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'TWO independent CMFD traps. (1) ki_tools_common.load_forcing._load_cmfd globbed `*{year}*.nc`,
      which matches the year as a SUBSTRING of another stamp: `*2003*` also matches `..._202003.nc` (March
      2020). Years 2001-2012 silently absorbed a 2020 month. (2) The CMFD 01dy (daily) store carries only
      a daily MEAN temperature, so Tmax==Tmin; the 03hr store has the sub-daily samples needed for a real
      diurnal range.'
    explanation: '(1) inflated 2003 precipitation from 511.7 to 530.2 mm/yr at Zijingguan and produced
      396 daily records for a 365-day year. (2) collapses the diurnal range: Hargreaves PET (~ sqrt(Tmax-Tmin))
      goes to ~0 and the temperature-index snowmelt loses its melt/freeze cycle, silently.

      '
    affected_components:
    - ki_tools_common/load_forcing.py (_load_cmfd)
    - tools/s3/prepare_weather_files.py
    - tools/s3/validate_weather_data.py
  remedy:
    action: 'Anchor the year glob to the `_YYYYMM` stamp and force sub-daily forcing for temperature.
      Both are fixed: the loader now rejects out-of-range/duplicate dates, and validate_weather_data flags
      >95% Tmax==Tmin.'
    steps:
    - Use forcing_dir=KISSPATH_FORCING/Data_forcing_03hr_010deg
    - Assert len(dates) == 365/366 per requested year
    - 'python tools/s3/validate_weather_data.py <weather_dir>   # must report 0 silent_errors'
    - 'For many stations use load_daily_forcing_points(): it reads each monthly NetCDF once for ALL stations
      (a 6-station basin then costs what 1 station did)'
    prevention: Never trust an unanchored year glob on files stamped YYYYMM.
  severity: silent
  cross_references:
  - dt_003
  - dt_012
- id: dt_044
  symptom:
    description: SWAT+ over-predicts discharge and rchg_dp barely moves total volume. aquifer_yr.txt prints
      an absurd dep_wt (e.g. 976 m) and aquifer flo + seep EXCEEDS rchrg every year (the store drains
      its initial condition for the whole run). Raising rchg_dp 0.05 -> 0.6 changes aquifer flo only 99.84
      -> 95.36 mm/yr even though seep correctly becomes 59.91 mm/yr.
    error_pattern: ''
  diagnosis:
    root_cause: 'tools/s2/generate_hru_from_global.py write_aquifer_files() wrote FABRICATED aquifer.aqu
      defaults and MIS-NAMED two columns. Against the only ground truth on disk (demo_lrew/swatplus_rev60_demo/aquifer.aqu,
      written by SWAT+ Editor v2.1.0): gw_flo 2500.0 vs 0.05; dep_bot (called ''gw_dp'') 1000.0 m vs 10.0
      m; dep_wt (''gw_ht'') 1.0 vs 3.0; flo_min 1000.0 vs 3.0; revap_min 750.0 vs 5.0. Columns 7/8 were
      named ptl_n/ptl_p (so written 0.0) where SWAT+ expects carbon=0.5 and flo_dist=50.0. dep_bot 1000
      m x spec_yld 0.05 = a 50,000 mm aquifer, so the store never equilibrates and rchg_dp is a near-dead
      lever.'
    evidence:
    - aquifer_yr.txt dep_wt = 976 m
    - flo (99.84) + seep (5.00) > rchrg (99.93) mm/yr, every year
    - calibration.cal `flo_min` 1000 -> 3 alone cut mean simulated Q 14.83 -> 9.24 m3/s
    affected_tools:
    - tools/s2/generate_hru_from_global.py
  remedy:
    action: Take aquifer.aqu column names and default magnitudes verbatim from the shipped SWAT+ Editor
      demo. FIXED in s2.
    steps:
    - 'head -4 demo_lrew/swatplus_rev60_demo/aquifer.aqu   # ground truth'
    - Assert aquifer_yr.txt dep_wt is O(1-10 m), not O(1000 m)
    - Assert area-weighted (flo + seep + revap) <= rchrg + storage drawdown
    prevention: Never invent defaults for a model input file when a vendor-written example of that exact
      file ships with the KI. Diff against it column by column.
  severity: silent
  cross_references:
  - dt_013
  - dt_045
- id: dt_045
  symptom:
    description: A SWAT+ calibration sweep reports 'calibrated' but successive trials produce BIT-IDENTICAL
      output. Sweeping surlag, awc, canmx, delay or revap_co changes nothing, even though every one of
      those names is present in the project's own cal_parms.cal.
    error_pattern: ''
  diagnosis:
    root_cause: 'Membership in cal_parms.cal is NECESSARY BUT NOT SUFFICIENT: the rev59 binary declares
      many parameter names it never actually applies from calibration.cal. Measured at Zijingguan 2026-07-10
      by running the real binary once per parameter at an extreme value and md5-ing the 18-yr daily outlet
      series against the uncalibrated run. APPLIED: cn2, esco, epco, k, alpha, lat_ttime, flo_min. SILENT
      NO-OP: canmx, surlag, awc, delay, revap_co, slope_len, perco, dep_imp. Setting soil LYR1/LYR2 does
      NOT rescue awc. s6 previously wrote all of them, so a sweep over a no-op name explored nothing while
      reporting success.'
    evidence:
    - surlag absval 0.05 and 24.0 -> identical md5 of the daily outlet series
    - awc pctchg +80 (with LYR1=1 LYR2=2) -> identical md5
    - cn2 pctchg -30 -> md5 changes (control)
    affected_tools:
    - tools/s6/generate_calibration_file.py
  remedy:
    action: 'Route cal-ignored names to their real home file, and DROP the rest with a loud warning. FIXED
      in s6: perco/canmx/cn3_swf/harg_pet -> hydrology.hyd; awc/soil_k/dp -> soils.sol; lat_len/slope_len
      -> topography.hyd; revap_co -> aquifer.aqu; surlag/msk_co1/msk_co2/msk_x -> parameters.bsn (surlag
      lives there as `surq_lag`); only delay/dep_imp are dropped. NOTE: EVERY bsn-object name is a calibration.cal
      no-op — see dt_047.'
    steps:
    - 'To test whether a name is real: run the binary at two extreme values and md5 the outlet series'
    - Never assume a cal_parms.cal name is honoured just because it parses
    prevention: Verify a calibration knob MOVES the output before you sweep over it. A greedy search over
      a no-op parameter silently returns the baseline.
  severity: silent
  cross_references:
  - dt_042
  - dt_044
- id: dt_046
  symptom:
    description: You suspect a routing/topology error (water reaching the stream more than once) because
      the outlet volume exceeds the basin's `wateryld`. Ratio outlet/wateryld ~ 1.5-1.7.
    error_pattern: ''
  diagnosis:
    root_cause: 'outlet/wateryld is NOT a mass-balance test. SWAT+''s basin_wb `wateryld` column is surq_gen
      + latq ONLY; it EXCLUDES aquifer return flow. So outlet = wateryld + aquifer flo > wateryld for
      ANY basin with an aquifer, and the ratio trips on a perfectly mass-conserving model. The invariant
      that DOES catch a rout_unit.con hyd_typ error is: area-weighted aquifer `rchrg` must equal basin
      `perc`. If rchrg instead equals `wateryld`, rout_unit.con is sending the surface hydrograph (`tot`)
      to the aquifer, which then re-releases it as baseflow.'
    evidence:
    - 'Correct deck: wateryld 167.24 = surq_gen 74.14 + latq 93.11; outlet 264.80 = wateryld + aqu_flo
      99.84 (0.9%); rchrg 99.93 == perc 99.93'
    - 'Broken deck (aqu ... tot): rchrg == wateryld, NOT perc'
    affected_tools:
    - tools/s2/generate_hru_from_global.py
    - tools/s9/check_mass_balance.py
  remedy:
    action: rout_unit.con must be `cha <id> tot 1.00000` + `aqu <id> rhg 1.00000` (rhg = recharge hydrograph;
      rev59 accepts it). The `cha ... tot 0.70` seen in the old SWAT+ Editor v1.0.0 demo sums to 1.0 only
      because a RESERVOIR takes the other 0.30 — do not copy the 0.70 without the reservoir.
    steps:
    - Assert area_weighted(aquifer_yr.rchrg) == basin_wb.perc  (within 5%)
    - Assert outlet_mm ~= basin_wb.wateryld + area_weighted(aquifer_yr.flo)  (within 10%)
    - Do NOT assert outlet <= wateryld
    prevention: Before declaring a mass-balance violation, confirm the denominator actually contains every
      flux that reaches the outlet.
  severity: silent
  cross_references:
  - dt_044
  - dt_045
- id: dt_047
  symptom:
    description: Daily SWAT+ NSE is stuck near its r^2 ceiling and the simulated flood peak arrives exactly
      ONE DAY after the observed peak, no matter which parameters are swept. Shifting the simulated series
      back one day would raise r from 0.65 to 0.82 (do NOT do this — it is a fudge).
    error_pattern: ''
  diagnosis:
    root_cause: 'The lag lives in Muskingum CHANNEL routing, whose coefficients msk_co1/msk_co2/msk_x
      are `bsn` objects — and EVERY bsn-object name is a calibration.cal no-op in rev59 (dt_045). So the
      routing could not be calibrated at all and sat at the shipped default msk_co1/msk_co2 = 0.75/0.25.
      Only the msk_co1:msk_co2 RATIO matters: SWAT+ normalises them, so 0.1/0.1 and 10/10 give bit-identical
      output. Setting codes.bsn rte_cha=0 confirms the diagnosis by throwing the peak 2 days EARLY.'
    evidence:
    - Zijingguan 2023-08-01 flood carries 89.2% of the observed daily variance
    - 'default msk: peak 08-02, r_val 0.647, NSE_val 0.417 (== r^2 ceiling 0.418)'
    - 'msk_co1=msk_co2, msk_x 0.1: peak 08-01, r_val 0.823, NSE_val 0.669'
    - surq_lag (parameters.bsn) and hydrology.cha `mann` barely move the peak; rte_cha=0 moves it to 07-30
    affected_tools:
    - tools/s6/generate_calibration_file.py
  remedy:
    action: Calibrate msk_co1/msk_co2/msk_x STRUCTURALLY in parameters.bsn. s6 now routes them there (STRUCTURAL_BSN).
    steps:
    - If the sim peak is a day late, sweep the msk_co1:msk_co2 ratio BEFORE touching volume params
    - Never fix a timing lag by shifting the simulated series
    - 'Check NSE against its r^2 ceiling: if NSE ~= r^2, the remaining loss is PHASE, not bias/variance'
    prevention: Compute r on the uncalibrated run first. No parameter set can lift NSE above r^2, so if
      NSE is pinned at r^2, stop tuning volume and go fix the phase.
  severity: silent
  cross_references:
  - dt_045
  - dt_046
- id: dt_048
  stage: s8_run
  failure_domain: dependency_mismatch
  symptom:
    description: SWAT+ rev59 crashes ~0.8 s into a run, immediately after 'reading from wx station file',
      on a LARGE basin (>~1e6 km2). It reads all the weather files fine, then dies before the daily loop.
      Small basins built by the SAME chain run cleanly.
    error_pattern: Attempting to allocate already allocated variable 'ob'|hyd_read_connect
    detection_method: log_match
  diagnosis:
    root_cause: 'object.cnt field overflow. write_object_cnt (s2/generate_hru_from_global.py) wrote each
      column as f''{v:>12}'' with NO separator. A basin-scale ls_area/tot_area like 151683475.87 (=1.52M
      km2 in ha) is EXACTLY 12 chars, so it fills its field and TOUCHES the neighbour: ''name''+''ls_area''+''tot_area''
      merge into one whitespace-delimited token. SWAT+ reads object.cnt list-directed, so every count
      shifts two fields left -> ''obj'' (total objects) is read as 0 -> hyd_read_connect.f90:176 allocates
      ob(0)/re-derives and re-allocates -> ''already allocated ob''. Bengbu (115k km2, area 11572953.30
      = 11 chars) had a leading space and never tripped it, so it was invisible until the Yangtze mainstem
      @ Jiujiang (1.52M km2).'
    evidence:
    - object.cnt data line had 19 whitespace tokens, not 21; token[1] = 'jiujiang151683475.87151683475.87'
    - space-separating name/ls_area/tot_area (21 tokens) -> binary runs to completion, exit 0
    - channel.con has the SAME cumulative-area overflow (gis_id+area merge for >1e8 ha channels) but is
      TOLERATED (run still completes) — object.cnt is the only fatal one
    affected_tools:
    - tools/s2/generate_hru_from_global.py
  remedy:
    action: In write_object_cnt, prepend a space to EVERY field (' {v:>12}' not '{v:>12}') for both header
      and data rows, so there is always >=1 separator regardless of value width. FIXED 2026-07-11.
    manual_steps:
    - 'Quick repair of an existing broken deck: rewrite object.cnt line 3 so name and the two area values
      are space-separated (21 tokens); re-run the binary.'
    - 'Verify: awk ''NR==3{print NF}'' object.cnt must print 21.'
    prevention: Never right-justify numeric fields against each other without a guaranteed separator when
      the value can fill the field. List-directed Fortran reads need whitespace, not column alignment.
  severity: fatal
  cross_references:
  - dt_009

- id: dt_049
  stage: s10_water_quality
  failure_domain: units_and_species
  symptom:
    description: TN load parsed from basin_ls_day.txt is systematically too high, and lateral/tile
      nitrate never appears in the total. No error is raised — the number is simply wrong.
    error_pattern: sedorgn \+ surqno3 \+ sedmin
    detection_method: code_review
  diagnosis:
    root_cause: '`sedmin` in basin_ls / hru_ls output is MINERAL PHOSPHORUS (kg P/ha), not nitrogen.'
    explanation: 'SKILL.md and tools/s10/parse_nutrient_output.py both documented sedmin as
      "sediment-bound mineral N" and summed it into TN, while omitting the two genuine N terms
      lat3no3 (NO3-N in lateral runoff) and tileno3 (NO3-N in tile flow). The SWAT+ source is
      unambiguous: swatplus/src/src/output_landscape_module.f90, type output_nutcarb_gain_loss,
      declares "real :: sedmin  !kg P/ha |mineral phosphorus leaving the landscape transported in
      sediment". The file''s own unit row cannot be trusted either — rev59 prints "----" for usle,
      sedmin and tileno3. At Wangjiaba the mis-attribution inflated TN by roughly 40%.'
    evidence:
    - 'output_landscape_module.f90:160  real :: sedmin = 0.  !kg P/ha  |mineral phosphorus ...'
    - 'basin_ls_day.txt unit row prints "----" for usle / sedmin / tileno3'
    affected_tools:
    - tools/s10/parse_nutrient_output.py
    - SKILL.md (Water Quality section)
  remedy:
    action: 'TN = sedorgn + surqno3 + lat3no3 + tileno3 (kg N/ha/day);
      TP = sedorgp + surqsolp + sedmin (kg P/ha/day). FIXED 2026-08-20.'
    tool_to_run: parse_nutrient_output
    manual_steps:
    - Take species and units from output_landscape_module.f90, never from the printed unit row.
    prevention: Any *min / *orgp / *solp column in a SWAT+ landscape output is phosphorus.
  severity: silent_wrong_result
  cross_references:
  - dt_050

- id: dt_050
  stage: s10_water_quality
  failure_domain: tool_chain
  symptom:
    description: 'tools/s10/validate_water_quality.py runs to completion after
      parse_nutrient_output.py --basin_ls but compares nothing: every simulated load reads as zero /
      the paired count is 0. Exit code is 0 and no error is printed.'
    error_pattern: n_paired.*0|TN_kg.*not found
    detection_method: output_inspection
  diagnosis:
    root_cause: Column-name mismatch between the two halves of the documented S10 chain.
    explanation: 'validate_water_quality.py reads the simulated columns TN_kg / TP_kg / sed_out
      (absolute loads). parse_nutrient_output.py --basin_ls wrote only per-HECTARE columns
      (TN_kgha). csv.DictReader simply never sees TN_kg, the aggregator adds nothing, and the
      validator reports an empty comparison instead of failing. The --channel_output mode DOES
      write TN_kg, which is why the mismatch survived: only the RECOMMENDED basin_ls path was broken.'
    affected_tools:
    - tools/s10/parse_nutrient_output.py
    - tools/s10/validate_water_quality.py
  remedy:
    action: 'parse_nutrient_output.py --basin_ls now also writes TN_kg, TP_kg and sed_out
      (per-hectare value x basin_area_ha). FIXED 2026-08-20.'
    manual_steps:
    - 'Sanity check: the sim CSV from --basin_ls must contain a TN_kg column before you call
      validate_water_quality.py.'
    prevention: When two tools are chained in SKILL.md, assert the producer''s column names against
      the consumer''s reader, not against the docstring.
  severity: silent_no_comparison
  cross_references:
  - dt_049

- id: dt_051
  stage: s10_water_quality
  failure_domain: inert_configuration
  symptom:
    description: configure_fertilizer.py reports success, management.sch contains the schedule, the
      model runs — and basin_nb fertn is 0 with N export unchanged from a no-management run.
    error_pattern: fertn.*0\.000|no_mgt
    detection_method: output_inspection
  diagnosis:
    root_cause: Nothing references the schedule. tools/s2/generate_hru_from_global.py writes
      `mgt = no_mgt` for EVERY land use in landuse.lum (a deliberate dt_v004 workaround), so the
      schedule in management.sch is orphaned.
    explanation: 'configure_fertilizer.py only ever wrote management.sch; its own notes said "update
      landuse.lum to reference this schedule" but nothing did it, and the model gives no warning for
      an unreferenced schedule. Every S2-built deck therefore ran the documented WQ workflow with
      zero fertiliser applied.'
    affected_tools:
    - tools/s10/configure_fertilizer.py
    - tools/s2/generate_hru_from_global.py
  remedy:
    action: 'Pass --landuse_lum TxtInOut/landuse.lum to configure_fertilizer.py — it repoints the mgt
      column of agrl_lum/agrr_lum/agrc_lum/rice_lum at the new schedule. Added 2026-08-20. Then run
      the binary once: if it dies in mgt_operatn_, apply dt_v004 (restore no_mgt) and report that the
      N export is unfertilised.'
    manual_steps:
    - 'Verify: grep agrl_lum TxtInOut/landuse.lum — column 4 must be the schedule name, not no_mgt.'
    - 'Verify: basin_nb_yr.txt fertn > 0 after the run.'
    prevention: A configuration tool that writes a definition must also write the reference, or prove
      the reference already exists.
  severity: silent_no_op
  cross_references:
  - dt_v004

- id: dt_052
  stage: s3_weather_preparation
  failure_domain: non_china_basin
  symptom:
    description: 'Building a basin OUTSIDE China: prepare_weather_files.py exits 1 with "Forcing
      directory not found:" for source=nasa_power, and every weather station is written with
      elev = 0.0 / 100.0 m even when the basin is at 2000 m.'
    error_pattern: Forcing directory not found|has elev=0.0 m
    detection_method: log_match
  diagnosis:
    root_cause: Two China-only assumptions in the forcing path.
    explanation: '(1) prepare_weather_files.validate_inputs() demanded an EXISTING forcing directory
      for every source, but nasa_power is an online point API with no directory — process() already
      passed forcing_dir=None for it, so the source was listed as valid yet unreachable from the CLI.
      (2) ki_tools_common.terrain.get_terrain() only knew the China DEM 90 m and the China-only CMFD
      elevation grid, then silently returned the 100 m / slope 0.001 DEFAULT for the entire rest of
      the world, biasing PET, lapse rates and snow. (3) The NASA POWER loader returns numpy.datetime64
      dates while CMFD/MSWX return datetime.datetime, so prepare_weather_files crashed on d.year with
      "numpy.datetime64 object has no attribute year" — the nasa_power path had never been executed.'
    affected_tools:
    - tools/s3/prepare_weather_files.py
    - ki_tools_common/terrain.py
  remedy:
    action: 'FIXED 2026-08-20: validate_inputs skips the directory check for nasa_power (pass "-" as
      the placeholder argument); the date vector is normalised through pandas.Timestamp; and
      terrain.get_terrain gained a GLOBAL MERIT DEM 90 m fallback (KISSPATH_DATA/MERIT_DEM, 5x5 deg
      tiles named by SW corner, e.g. n20w105_dem.tif).'
    manual_steps:
    - 'Verify before trusting PET: the .pcp/.tmp header line 3 must carry a real elevation.'
    - Unset http_proxy/https_proxy — NASA POWER stalls through the local proxy.
    prevention: Any ki_tools_common lookup that "falls back to a default" is a China-only lookup until
      proven otherwise; check its source field, not just its value.
  severity: fatal_outside_china
  cross_references:
  - dt_040
  - dt_043
- id: dt_053
  stage: s3_weather_preparation
  failure_domain: weather_wiring
  symptom:
    description: 'r ~ 0 with a smooth hydrograph but TUNABLE PBIAS; sim daily std far below obs
      (e.g. 49 vs 191); sim peak an order of magnitude under obs (302 vs 3,370 m3/s) even though
      heavy rain is present in the forcing files. The run completes without any error.'
    error_pattern: 'r ~ 0|smooth hydrograph|peak far below observed with no error'
    detection_method: "awk 'NR>2{print $3}' TxtInOut/weather-sta.cli | sort -u   (all 'null', or a single file, = broken)"
  diagnosis:
    root_cause: 'weather-sta.cli wiring is null or single-station: SWAT+ SILENTLY substitutes
      GENERATED weather (weather-wgn.cli climatology — possibly a template like gatifton, US
      Georgia) instead of reading the prepared forcing files.'
    explanation: 'The deck generator writes pcp=null tmp=null on every station row BY DESIGN;
      wiring is a separate step. If s3/generate_weather_stations.py is not run after a deck
      (re)generation, or if every station points at one file, the model never reads the prepared
      forcing — it simulates weather from wgn statistics. Nothing fails: the run finishes,
      water-balance terms look plausible, and PBIAS can even be calibrated to near zero, which
      makes the defect invisible to score-chasing. Only pattern statistics (r, daily variance,
      peaks) betray it. Verified at Xixian 2026-08: 209 mm basin rain sat unread in 167 prepared
      CMFD files while the model simulated Georgia climatology.'
    affected_tools: [s3/generate_weather_stations.py, s7/validate_txtinout.py]
  remedy:
    action: 'Run s3/generate_weather_stations.py after ANY deck regeneration; it derives
      per-station lat/lon from the deck''s own rout_unit.con (authoritative wst binding).
      Then verify with s7/validate_txtinout.py — it now FAILS (exit 1) on null or
      single-station wiring while matching .pcp/.tmp files exist.'
    verification: 'KISSPATH_PYTHON_ENV/bin/python {KI}/tools/s7/validate_txtinout.py <TxtInOut>  # exit 0 AND weather-sta.cli references >1 distinct .pcp files'
    prevention: 'Never judge a SWAT+ run by PBIAS alone; a wiring-dead deck can tune PBIAS to
      -0.1% while r=0. Check r + daily std + peak ratio first.'
  severity: silent
  deposited: '2026-08-24 from the Xixian July campaign runner (run_and_score_xixian.py) —
    the fix had lived outside the KI; this entry moves the knowledge into it (must-teach-KI
    handoff item 1b).'
