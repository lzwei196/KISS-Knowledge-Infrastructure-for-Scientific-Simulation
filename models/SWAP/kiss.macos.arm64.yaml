kiss_manifest_version: 1
model: SWAP
binary_type: Mach-O
verified: observed
install_dir: SWAP/source/repo
acquire:
  strategy: build
  repo: https://github.com/SWAP-model/SWAP.git
  ref: 7587ca3a5f037a7276f1c86059632f921f710775
  produces: build/swap
python_deps: [numpy, matplotlib]
system_deps: [gfortran, meson, ninja]
agent_hint: >-
  Build exact SWAP4.2.0 and TTUTIL4.2.7 using tools/build_swap_macos.py from the
  installation workspace. The source-lock contains KI-matching repository pins
  and Git blob hashes for source files only; no example datasets are downloaded.
  SWAP-model calls its repositories unofficial convenience mirrors of WUR source.
  Upstream Meson downloads a Linux TTUTIL archive and uses -static on non-Windows;
  the helper builds genuine native TTUTIL instead and removes only the Darwin
  incompatible fully static link flag in a separate build source directory.
  Both builds run with one compiler job. Preserve generated binaries and sources.
  Upstream has no help/version dispatch. The helper applies a transparent,
  hash-guarded --version-only branch in the genuine Fortran main before any file
  I/O/model initialization. Version comes from original description.fi, not a
  wrapper or invented value. The full native executable remains the science
  runner for other arguments. Probe --version for exact SWAP 4.2.0 and exit0;
  --help remains unsupported. Never create swap.swp or reruns.dat for installation.
  This verifies installation only; DS repair85 independently passed the native installation check.
