      short_citation: "Smith et al. 2022"
      doi: "10.5194/hess-26-2519-2022"
      note: "Method of Morris global SA on RHESSys; bypass-flow, hillslope groundwater and saturation-to-groundwater coefficients dominate streamflow; interception elevates low-flow sensitivity, stomatal conductance high-flow sensitivity."
