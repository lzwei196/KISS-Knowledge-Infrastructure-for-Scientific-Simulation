package:
  name: PIHM
  language: c
  implementation:
    id: mm-pihm
    version: v1.0.0
    provenance: C (with OpenMP); Penn State PSUmodeling MM-PIHM core hydrology build, embedding SUNDIALS
      CVODE for implicit ODE integration.
  scientific_reference_version: MM-PIHM v1.0.0 — semi-discrete finite-volume coupled surface-subsurface
    watershed formulation (Qu & Duffy 2007, WRR)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/PIHM/source/repo/flux-pihm
    type: work_dir
pipeline:
  stages:
  - s3_forcing_preparation
  - s4_soil_parameterization
  - s5_configuration
  - s7_model_execution
  - s8_output_analysis
tools:
  count: 9
  files:
  - tools/config_writer.py
  - tools/forcing_converter.py
  - tools/mesh_builder.py
  - tools/output_parser.py
  - tools/pihm_metrics.py
  - tools/pihm_metrics_corrected.py
  - tools/pihm_shalehills_metrics.py
  - tools/run_pihm.py
  - tools/soil_converter.py
inputs:
  forcing:
  - name: PRCP
    unit: kg/m2/s
  - name: SFCTMP
    unit: K
  - name: RH
    unit: '% (0-100)'
  - name: SFCSPD
    unit: m/s
  - name: SOLAR
    unit: W/m2
  - name: LONGWV
    unit: W/m2
  - name: PRES
    unit: Pa
  - name: LAI
    unit: m2/m2
  parameters:
  - name: soil hydraulic + macropore properties (SILT, CLAY, OM, BD, KINF, KSATV, KSATH, MAXSMC, MINSMC,
      ALPHA, BETA, MACHF, MACVF, DMAC, QTZ; globals DINF, KMACV_RO, KMACH_RO)
    unit: '% / g/cm3 / m/s / m3/m3 / 1/m / - / m'
  - name: geology/bedrock hydraulic properties (KSATV, KSATH, MAXSMC, MINSMC, ALPHA, BETA, MACHF, MACVF,
      DMAC)
    unit: m/s / m3/m3 / 1/m / - / m
  - name: land-cover/vegetation properties (roughness, albedo, rooting depth, veg fraction)
    unit: various
  - name: river topology and hydraulics (FROM/TO/DOWN/LEFT/RIGHT, DPTH, OINT, CWID, ROUGH, CWR, KH)
    unit: m / s·m^-1/3 / m/s
  - name: TIN mesh topology (NUMELE elements NODE1-3/NABR1-3, NUMNODE nodes X/Y/ZMIN/ZMAX)
    unit: m
  - name: per-element attribute indices (SOIL, GEOL, LC, METEO, LAI)
    unit: '-'
  - name: calibration multipliers (KSATH, KSATV, KINFV, POROSITY, ALPHA, BETA, DMAC, AREAFH, AREAFV, KMACV,
      KMACH, PRCP; SFCTMP offset)
    unit: '- (multiplier); SFCTMP in K (additive)'
  initial_conditions:
  - name: per-element initial states (surface water, unsaturated storage, groundwater, snow, canopy storage,
      soil temperature)
    unit: m (K for soil temperature)
  - name: per-river initial stage
    unit: m
  boundary_conditions:
  - name: domain edge boundary conditions (TYPE 1 Dirichlet prescribed head, TYPE 2 Neumann prescribed
      flux)
    unit: m (head) / m3/s (flux)
  - name: simulation control switches (SIMULATION_MODE spinup/normal, INIT_MODE relaxation/ic, START/END,
      MODEL_STEPSIZE, LSM_STEP, MAX_SPINUP_YEAR, output interval codes)
    unit: various (s)
  - name: CVODE solver controls (ABSTOL, RELTOL, MAX_NONLIN_ITER, step controls)
    unit: m (ABSTOL) / - (RELTOL)
