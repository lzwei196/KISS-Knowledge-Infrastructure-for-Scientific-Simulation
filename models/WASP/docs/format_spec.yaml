- id: dt_wasp_011
  symptom: Reaeration rate ka calibrates to extreme values (> 5.0 1/d); DO shows rapid oscillation around
    saturation
  diagnosis: BOD loading (BOD0) set too high, forcing the optimizer to compensate with unrealistic reaeration;
