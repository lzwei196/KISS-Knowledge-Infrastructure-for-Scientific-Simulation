# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: DNDC
  language: c++
  implementation:
    id: dndc-can-960
    version: 9.6.0
    provenance: C++ (closed-source UNH/AAFC); Windows PE32 binary DNDC95.exe, no public source; field-scale
      daily biogeochemistry.
  scientific_reference_version: DNDCv.CAN 9.6.0 (Canadian branch of DNDC95, Aug-2015 UNH lineage; AAFC
    Grant & Smith)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/DNDC/dndc_run/DNDC95.exe
    type: PE32_wine
pipeline:
  stages:
  - s0_configuration_skill
  - s1_climate_preparation_skill
  - s2_soil_preparation_skill
  - s3_crop_management_skill
  - s4_execution_skill
  - s5_output_analysis_skill
tools:
  count: 5
  files:
  - tools/convert_forcing_to_dndc.py
  - tools/convert_soil_to_dndc.py
  - tools/generate_dnd_file.py
  - tools/parse_dndc_output.py
  - tools/run_dndc.py
inputs:
  forcing:
  - name: Maximum air temperature (MaxT)
    unit: deg C
  - name: Minimum air temperature (MinT)
    unit: deg C
  - name: Precipitation (Prec)
    unit: cm/day
  - name: Solar radiation
    unit: MJ/m2/day
  - name: Wind speed
    unit: m/s
  - name: Relative humidity
    unit: '% (0-100)'
  - name: Atmospheric CO2 concentration
    unit: ppm
  - name: N concentration in rainfall
    unit: mg N/L
  - name: Background atmospheric NH3
    unit: ug N/m3
  - name: N deposition
    unit: kg N/ha/yr
  parameters:
  - name: Soil layer thickness (per layer, up to 10)
    unit: m
  - name: Bulk density (per layer)
    unit: g/cm3
  - name: Surface SOC content
    unit: kgC/kg soil
  - name: Soil texture class ID
    unit: integer 1-12 (DNDC class)
  - name: Soil pH (H2O)
    unit: pH
  - name: Field capacity
    unit: WFPS fraction
  - name: Wilting point
    unit: WFPS fraction
  - name: Porosity
    unit: v/v fraction
  - name: Saturated hydraulic conductivity
    unit: m/hr
  - name: Clay fraction
    unit: 0-1
  - name: SOC pool partitioning fractions
    unit: fraction
  - name: SOC pool C/N ratios (per pool) and bulk C/N
    unit: '-'
  - name: Topsoil SOC depth and below-topsoil decrease rate
    unit: m / factor
  - name: Crop physiological coefficients (per crop type, 18+ built-in)
    unit: various
  - name: N fixation index
    unit: 0-1
  - name: Perennial winterkill parameters (CHRMX, CDRMX, cTMX, pDFMX)
    unit: various
  - name: Site latitude
    unit: deg N (-90..90)
  - name: Site longitude and elevation
    unit: deg E / m
  initial_conditions:
  - name: Initial NO3 / NH4 at surface
    unit: mg N/kg
  - name: Initial soil moisture / WFPS by layer
    unit: fraction
  - name: Initial soil temperature
    unit: deg C
  - name: Initial microbial activity index
    unit: 0-1
  - name: Initial SOC pool stocks / surface litter
    unit: fraction of total SOC / kgC/ha
  boundary_conditions:
  - name: Number of simulated years and start year
    unit: integer
  - name: Climate format type
    unit: integer 0-8
  - name: Planting / harvest dates and harvest mode
    unit: calendar date / mode 1|2
  - name: Tillage events
    unit: date, depth cm, mixing efficiency, inversion flag
  - name: Fertilization events
    unit: kg N/ha per form
  - name: Manure / organic amendment events
    unit: kgC/ha, kgN/ha
  - name: Irrigation / controlled drainage
    unit: cm / index 0-1
  - name: Grazing (perennials)
    unit: heads/ha, hours/day, biomass fractions
  - name: Tile drainage / water table configuration
    unit: flag, depth m, spacing m, drain coeff 1/day, keDrain
  - name: Execution switches
    unit: flags
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - crop_grain_yield
  - crop_N_uptake
  - N2O_emission
  - NO_emission
  - N2_emission
  - NH3_volatilization
  - CO2_soil_respiration
  - CH4_flux
  - NO3_leaching
  - SOC_stock_and_change
  - water_balance_components
  - soil_temperature_profile
  - soil_water_WFPS_and_water_table
  other: []
validation:
  tier: tested
  tier_justification: 'measured: NSE=-0.438, R=0.344'
  metrics:
    best_nse: -0.438
    best_r: 0.344
summary:
  total_tools: 5
  total_stage_docs: 6
  total_diagnostic_triplets: 22
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
