template_version: "3.5"

identity:
  model_id: "PyAEZ"
  scientific_reference_version: "FAO/IIASA Agro-Ecological Zoning (AEZ/GAEZ) framework as implemented in PyAEZ 2.2 (six-module land-evaluation pipeline)"
  implementation:
    id: "pyaez-2.2"
    version: "2.2"
    provenance: "Python; FAO/AIT Geo-informatics Center PyAEZ 2.2 (Numba-accelerated AEZ implementation), MIT-licensed."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "MIT"
  repo_url: "https://github.com/gicait/PyAEZ"

boundary:
  scope_in:
    - "Thermal climate and thermal zone classification"
    - "Length of Growing Period (LGP) via reference-crop soil water balance"
    - "Penman-Monteith reference evapotranspiration (ETo)"
    - "Temperature sums/profiles, air frost index and permafrost evaluation"
    - "Crop net-biomass and water-limited attainable yield over a 365-planting-date sweep"
    - "Successive suitability reduction: agro-climatic (fc3), soil (fc4), terrain/erosion (fc5)"
    - "Economic suitability / net-revenue break-even analysis"
  scope_out:
    - "Not a daily mechanistic crop-growth model (DSSAT/APSIM sense); uses the GAEZ biomass approach"
    - "No field-scale management simulation; outputs are suitability ratings and attainable yields"
    - "No persistent inter-timestep state evolution (static long-term-climatology zoning)"
  spatial: "2-D grid"
  temporal: "annual"
  closure: "mass-balance"
  notes: "Mass-balance closure applies only to the reference-crop soil water balance that defines LGP (precipitation vs Penman-Monteith ETo with available-water capacity Sa x rooting depth D). The biomass/yield chain is the GAEZ eco-physiological response model modulated by successive multiplicative reduction factors (fc1..fc5), not a closed mass or energy budget. Climate is supplied as 12 monthly (cubic-spline interpolated to daily) or 365 daily values; outputs are per-growing-cycle / annual classifications, so there is no surface energy-balance closure."

inputs:
  forcing:
    - category: "forcing"
      name: "minimum air temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "3-D climate array (H, W, 12) monthly or (H, W, 365) daily, time on last axis"
      notes: "Celsius required; Kelvin causes vapor-pressure overflow. Internally drives thermal regime, LGP and ETo."
    - category: "forcing"
      name: "maximum air temperature"
      unit: "degC"
      source_kind: "forcing"
      model_input_format: "3-D climate array (H, W, 12|365), time on last axis"
      notes: "Celsius required."
    - category: "forcing"
      name: "precipitation"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "3-D climate array (H, W, 12|365), time on last axis"
      notes: "Daily rate, not monthly total and not m/day; drives the LGP soil water balance."
    - category: "forcing"
      name: "shortwave downward radiation"
      unit: "W/m^2"
      source_kind: "forcing"
      model_input_format: "3-D climate array (H, W, 12|365), time on last axis"
      notes: "Internally converted to cal/cm^2/day for the GAEZ biomass routine; drives potential biomass."
    - category: "forcing"
      name: "wind speed"
      unit: "m/s at 2 m reference height"
      source_kind: "forcing"
      model_input_format: "3-D climate array (H, W, 12|365), time on last axis"
      notes: "Penman-Monteith assumes 2 m reference height; 10 m wind inflates ETo ~20%."
    - category: "forcing"
      name: "relative humidity"
      unit: "0-1 fraction"
      source_kind: "forcing"
      model_input_format: "3-D climate array (H, W, 12|365), time on last axis"
      notes: "Fraction (0-1), not percent; used directly in Penman-Monteith saturation deficit."
  parameters:
    - category: "parameters"
      name: "elevation (DEM)"
      unit: "meters"
      source_kind: "dataset_lookup"
      model_input_format: "2-D raster (H, W)"
      notes: "Affects atmospheric pressure and ETo."
    - category: "parameters"
      name: "slope"
      unit: "percent (%)"
      source_kind: "dataset_lookup"
      model_input_format: "2-D raster (H, W)"
      notes: "Percent, not degrees/radians; feeds Fournier-index terrain constraint (fc5)."
    - category: "parameters"
      name: "soil mapping unit (SMU) map"
      unit: "integer HWSD SMU codes"
      source_kind: "dataset_lookup"
      model_input_format: "2-D raster (H, W); codes must match soil-characteristics SMU IDs"
      notes: "Keys the SQ1-SQ7 soil-quality lookup for fc4."
    - category: "parameters"
      name: "available soil moisture capacity (Sa)"
      unit: "mm/m"
      source_kind: "default"
      model_input_format: "scalar or 2-D map; model default Sa=100 mm/m"
      notes: "With rooting depth D sets the LGP water-storage buffer; default strongly affects fc2."
    - category: "parameters"
      name: "rooting depth (D) for LGP water balance"
      unit: "m"
      source_kind: "default"
      model_input_format: "scalar; model default D=1.0 m"
      notes: "Sa x D = available water buffer in the LGP soil water balance."
    - category: "parameters"
      name: "soil water depletion fraction (pc)"
      unit: "0-1 fraction"
      source_kind: "default"
      model_input_format: "scalar; default 0.5"
    - category: "parameters"
      name: "crop biophysical parameters (LAI, HI, height, kc, legume flag, adaptability/photosynthesis class, cycle length, yield-loss factors, reference est_yield)"
      unit: "mixed (LAI unitless, HI 0-1, kc unitless, est_yield kg/ha, cycle days)"
      source_kind: "calibrated"
      model_input_format: "per-crop parameter table (one sheet per crop)"
      notes: "Drive the GAEZ biomass/yield response and crop-water demand; est_yield is kg/ha (model-internal)."
    - category: "parameters"
      name: "agro-climatic (fc3) reduction lookup factors"
      unit: "0-1 reduction factors"
      source_kind: "dataset_lookup"
      model_input_format: "per-crop reduction table keyed by LGP class and wetness days"
    - category: "parameters"
      name: "soil-quality (SQ1-SQ7) characteristics and reduction factors"
      unit: "0-100 ratings / 0-1 reductions"
      source_kind: "dataset_lookup"
      model_input_format: "topsoil/subsoil characteristics + rainfed/irrigated reduction tables keyed by SMU"
    - category: "parameters"
      name: "terrain reduction factors"
      unit: "0-1 reduction factors"
      source_kind: "dataset_lookup"
      model_input_format: "reduction table keyed by Fournier-index x slope class (rainfed/irrigated)"
    - category: "parameters"
      name: "economic cost / price / yield reference points"
      unit: "currency/ha, currency/ton, ton/ha"
      source_kind: "user_provided"
      model_input_format: "paired cost-yield data points and historical farm prices"
      notes: "Module VI expects yield in ton/ha (kg/ha must be divided by 1000 by the caller)."
  initial_conditions: []
  boundary_conditions:
    - category: "boundary_conditions"
      name: "study-area mask"
      unit: "binary 0/1"
      source_kind: "user_provided"
      model_input_format: "2-D raster (H, W); mask_value pixels excluded"
      notes: "Shape must match climate array (H, W); selects which pixels are computed."
    - category: "boundary_conditions"
      name: "latitude extent (lat_min, lat_max)"
      unit: "decimal degrees"
      source_kind: "user_provided"
      model_input_format: "two scalars, lat_min < lat_max; Southern hemisphere negative"
      notes: "Controls solar declination and day length for ETo and biomass."
    - category: "boundary_conditions"
      name: "water-supply mode"
      unit: "categorical (rainfed | irrigated)"
      source_kind: "user_provided"
      model_input_format: "mode selector applied throughout the suitability chain"
      notes: "Irrigated path removes the moisture limitation; irrigated yield >= rainfed yield."
    - category: "boundary_conditions"
      name: "climate temporal mode"
      unit: "categorical (monthly=12 | daily=365)"
      source_kind: "user_provided"
      model_input_format: "selector; monthly inputs are cubic-spline interpolated to daily"
      notes: "Monthly mode triggers internal cubic-spline interpolation that can overshoot negative."

processes:
  modules:
    - name: "ClimateRegime"
      role: "process_solver"
      brief: "Module I: agro-climatic indicators — thermal climate/zone classification, thermal LGP (T>0/5/10), temperature sums and profiles, frost/permafrost, and the moisture-limited LGP from the reference-crop soil water balance."
    - name: "ETOCalc"
      role: "process_solver"
      brief: "Penman-Monteith reference evapotranspiration (ETo, mm/day) from temperature, radiation, 2 m wind and RH fraction; consumed by the LGP water balance."
    - name: "LGPCalc"
      role: "process_solver"
      brief: "Reference-crop soil water balance (precipitation vs ETo with Sa x D buffer) producing Length of Growing Period and LGP equivalent/class."
    - name: "BioMassCalc"
      role: "process_solver"
      brief: "GAEZ net-biomass eco-physiological routine (terms Ac, Bc, Bo, Pm) driven by radiation and temperature with crop LAI/HI/adaptability."
    - name: "CropWatCalc"
      role: "process_solver"
      brief: "Crop water-demand / water-limited yield reduction (kc-based ET demand vs supply) producing the moisture reduction factor fc2."
    - name: "ThermalScreening"
      role: "process_solver"
      brief: "Crop cardinal-temperature screening producing the binary thermal reduction factor fc1."
    - name: "CropSimulation"
      role: "process_solver"
      brief: "Module II: per-pixel 365-planting-date sweep invoking biomass, crop-water and thermal screening to find optimal planting date and rainfed/irrigated attainable yield plus fc1, fc2."
    - name: "ClimaticConstraints"
      role: "process_solver"
      brief: "Module III: applies agro-climatic reduction factor fc3 (pest/disease, frost, workability/wetness) from LGP-keyed lookup tables to Module II yield."
    - name: "SoilConstraints"
      role: "process_solver"
      brief: "Module IV: computes SQ1-SQ7 soil qualities/ratings from topsoil/subsoil characteristics and applies soil reduction factor fc4."
    - name: "TerrainConstraints"
      role: "process_solver"
      brief: "Module V: Modified Fournier Index from precipitation and slope, applies terrain/erosion reduction factor fc5."
    - name: "EconomicSuitability"
      role: "process_solver"
      brief: "Module VI: net revenue and economic suitability classification from cost, price and terrain-adjusted yield (expects ton/ha)."
    - name: "UtilitiesCalc"
      role: "driver"
      brief: "Shared interpolation/unit helpers and georeferenced raster write-out used across modules (physics helper, not a workflow wrapper)."
  internal_edges:
    - from: "Climate"
      to: "ClimateRegime"
      kind: "consumes_input"
      brief: "Monthly/daily 3-D temperature, precip, radiation, wind, RH arrays."
    - from: "ETOCalc"
      to: "pet_daily"
      kind: "writes_state"
      brief: "Penman-Monteith ETo drives the LGP water balance."
    - from: "ClimateRegime"
      to: "ETOCalc"
      kind: "invokes"
      brief: "Module I calls the ETo solver for the reference-crop demand."
    - from: "ClimateRegime"
      to: "LGPCalc"
      kind: "invokes"
      brief: "Module I calls the soil water balance to derive LGP."
    - from: "LGPCalc"
      to: "lgp"
      kind: "writes_state"
      brief: "Length of Growing Period and equivalent/class produced for downstream modules."
    - from: "ClimateRegime"
      to: "thermal_zone"
      kind: "writes_state"
      brief: "Thermal climate/zone, thermal LGP, temperature sums/profiles, frost/permafrost."
    - from: "ClimateRegime"
      to: "CropSimulation"
      kind: "invokes"
      brief: "LGP, lgpt5, lgpt10 injected into Module II before the planting-date sweep."
    - from: "CropSimulation"
      to: "BioMassCalc"
      kind: "invokes"
      brief: "Per planting date, computes GAEZ net biomass."
    - from: "CropSimulation"
      to: "CropWatCalc"
      kind: "invokes"
      brief: "Crop water-limited reduction producing fc2."
    - from: "CropSimulation"
      to: "ThermalScreening"
      kind: "invokes"
      brief: "Cardinal-temperature screening producing fc1."
    - from: "CropSimulation"
      to: "yield_rain"
      kind: "produces_output"
      brief: "Rainfed and irrigated attainable yield after the 365-DOY sweep."
    - from: "CropSimulation"
      to: "fc1"
      kind: "writes_state"
      brief: "Thermal (fc1) and moisture (fc2) reduction factors carried forward."
    - from: "ClimateRegime"
      to: "ClimaticConstraints"
      kind: "reads_state"
      brief: "Module III reads lgp, lgp_equv, lgpt10 from Module I."
    - from: "CropSimulation"
      to: "ClimaticConstraints"
      kind: "reads_state"
      brief: "Module III takes yield_rain/yield_irr as its yield input."
    - from: "ClimaticConstraints"
      to: "clim_yield"
      kind: "produces_output"
      brief: "Agro-climatic-adjusted yield and fc3."
    - from: "ClimaticConstraints"
      to: "SoilConstraints"
      kind: "reads_state"
      brief: "Module IV reduces clim_yield by soil constraints."
    - from: "Soil"
      to: "SoilConstraints"
      kind: "consumes_input"
      brief: "SMU map plus SQ1-SQ7 characteristics/reduction tables."
    - from: "SoilConstraints"
      to: "soil_yield"
      kind: "produces_output"
      brief: "Soil-adjusted yield and fc4."
    - from: "SoilConstraints"
      to: "TerrainConstraints"
      kind: "reads_state"
      brief: "Module V reduces soil_yield by terrain constraints."
    - from: "TerrainConstraints"
      to: "fournier_index"
      kind: "writes_state"
      brief: "Modified Fournier Index from precipitation and slope drives fc5."
    - from: "TerrainConstraints"
      to: "terrain_yield"
      kind: "produces_output"
      brief: "Terrain-adjusted yield and fc5."
    - from: "TerrainConstraints"
      to: "EconomicSuitability"
      kind: "reads_state"
      brief: "Module VI consumes terrain_yield (converted kg/ha -> ton/ha)."
    - from: "EconomicSuitability"
      to: "net_revenue"
      kind: "produces_output"
      brief: "Net revenue and classified/normalized revenue from cost, price and yield."
    - from: "UtilitiesCalc"
      to: "Outputs"
      kind: "produces_output"
      brief: "Georeferenced raster write-out of 2-D result arrays."

states:
  variables:
    - name: "pet_daily"
      unit: "mm/day"
      role: "diagnostic"
    - name: "lgp"
      unit: "days"
      role: "diagnostic"
    - name: "lgp_equv"
      unit: "days"
      role: "diagnostic"
    - name: "lgpt5"
      unit: "days"
      role: "diagnostic"
    - name: "lgpt10"
      unit: "days"
      role: "diagnostic"
    - name: "thermal_zone"
      unit: "class 1-12"
      role: "diagnostic"
    - name: "fournier_index"
      unit: "unitless"
      role: "diagnostic"
    - name: "fc1"
      unit: "0-1"
      role: "diagnostic"
    - name: "fc2"
      unit: "0-1"
      role: "diagnostic"
    - name: "yield_rain"
      unit: "kg/ha"
      role: "diagnostic"
    - name: "clim_yield"
      unit: "kg/ha"
      role: "diagnostic"
    - name: "soil_yield"
      unit: "kg/ha"
      role: "diagnostic"
    - name: "terrain_yield"
      unit: "kg/ha"
      role: "diagnostic"
    - name: "net_revenue"
      unit: "currency/ha"
      role: "diagnostic"
  provenance: "structural"

outputs:
  - var: "lgp"
    validation_rank: 5
    unit: "days"
    description: "Moisture-dependent Length of Growing Period from the reference-crop soil water balance."
    emitted_in: "GeoTIFF raster (Module I)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Compare against long-term-climatology LGP products (e.g. GAEZ); LGP is a derived classification, not a measured field."]
      detrending_options: ["none"]
  - var: "thermal_zone"
    validation_rank: 6
    unit: "class 1-12"
    description: "Thermal climate / thermal zone classification."
    emitted_in: "GeoTIFF raster (Module I)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection", "spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Categorical class agreement vs a reference AEZ/GAEZ zonation."]
      detrending_options: ["none"]
  - var: "pet_daily"
    validation_rank: 4
    unit: "mm/day"
    description: "Penman-Monteith reference evapotranspiration (ETo)."
    emitted_in: "GeoTIFF raster (Module I)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["magnitude_accuracy", "spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Physically plausible ETo is ~2-8 mm/day; >15 indicates an input-unit error rather than a true field mismatch."]
      detrending_options: ["none"]
  - var: "yield_rain"
    validation_rank: 1
    unit: "kg/ha"
    description: "Rainfed maximum attainable yield (best of 365 planting dates)."
    emitted_in: "GeoTIFF raster (Module II)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Attainable (potential) yield is an upper envelope; observed farm yields sit below it, so expect positive bias vs actuals."]
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["National/regional yield aggregates carry a technology trend a climate-only attainable-yield model cannot reproduce; compare detrended trends or rankings, not inter-annual correlation."]
      detrending_options: ["none", "linear_residual", "decadal_mean"]
  - var: "yield_irr"
    validation_rank: 2
    unit: "kg/ha"
    description: "Irrigated maximum attainable yield (moisture limitation removed)."
    emitted_in: "GeoTIFF raster (Module II)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Irrigated attainable yield >= rainfed by construction; an upper-envelope quantity."]
      detrending_options: ["none"]
  - var: "terrain_yield"
    validation_rank: 3
    unit: "kg/ha"
    description: "Attainable yield after the full fc1..fc5 reduction chain (climate, agro-climatic, soil, terrain)."
    emitted_in: "GeoTIFF raster (Module V)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Closest model output to observed potential; still an attainable (not actual) yield."]
        - obs_shape: "regional_aggregate_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Aggregate to admin units before comparison; unit is kg/ha (divide by 1000 for ton/ha)."]
      detrending_options: ["none"]
  - var: "suitability_class"
    validation_rank: 7
    unit: "class"
    description: "Land suitability class derived from the constrained attainable yield / reduction factors (crop suitability rating)."
    emitted_in: "GeoTIFF raster (Modules III-V)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection", "spatial_pattern_match"]
          determining_metric: "csi"
          caveats: ["Class-agreement vs reference GAEZ suitability maps; thresholds for class boundaries are framework-defined."]
      detrending_options: ["none"]
  - var: "net_revenue"
    validation_rank: 8
    unit: "currency/ha"
    description: "Net revenue per pixel (clamped >= 0) from the economic break-even analysis."
    emitted_in: "GeoTIFF raster (Module VI)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Depends on user-supplied cost/price points; not a model-physics quantity. Module VI expects yield in ton/ha."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "temperature"
      to: "length_of_growing_period"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["fischer2021_gaezv4_model_doc", "fischer2002_global_aez_assessment"]
    - from: "precipitation"
      to: "length_of_growing_period"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "rainfed"
      citations: ["fischer2021_gaezv4_model_doc", "alvarbeltran2024_pyaez_bhutan"]
    - from: "temperature"
      to: "potential_biomass"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["fischer2021_gaezv4_model_doc", "fischer2002_global_aez_assessment"]
    - from: "solar_radiation"
      to: "potential_biomass"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["fischer2021_gaezv4_model_doc", "fischer2002_global_aez_assessment"]
    - from: "precipitation"
      to: "water_limited_yield"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "rainfed"
      citations: ["fischer2021_gaezv4_model_doc", "alvarbeltran2023_pyaez_aquacrop_nepal", "alvarbeltran2024_pyaez_bhutan"]
    - from: "CO2_concentration"
      to: "crop_yield"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "C3 vs C4 crop-type dependent"
      citations: ["alvarbeltran2023_pyaez_aquacrop_nepal"]
    - from: "temperature"
      to: "crop_yield"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["alvarbeltran2023_pyaez_aquacrop_nepal", "alvarbeltran2024_pyaez_bhutan"]
    - from: "temperature"
      to: "crop_suitability_class"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["fischer2002_global_aez_assessment", "fischer2021_gaezv4_model_doc", "agronomy2025_maize_aez_megadeltas"]
    - from: "soil_properties"
      to: "crop_suitability_class"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["fischer2021_gaezv4_model_doc", "fischer2002_global_aez_assessment"]
    - from: "terrain_slope"
      to: "crop_suitability_class"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["fischer2021_gaezv4_model_doc"]
    - from: "agro_climatic_constraints"
      to: "attainable_yield"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "structural"
      applicability: "always"
      citations: ["fischer2021_gaezv4_model_doc"]
  citation_index:
    fischer2021_gaezv4_model_doc:
      short_citation: "Fischer et al. 2021"
      doi: "10.4060/cb4744en"
      note: "GAEZ v4 model documentation — authoritative AEZ input->constraint->yield chain that PyAEZ implements."
    fischer2002_global_aez_assessment:
      short_citation: "Fischer et al. 2002"
      doi: ""
      note: "IIASA RR-02-02 seminal AEZ methodology; temperature/radiation govern potential biomass, LGP and soil/terrain matching set suitability."
    alvarbeltran2023_pyaez_aquacrop_nepal:
      short_citation: "Alvar-Beltran et al. 2023"
