    unit: dimensionless
  - name: Weertman sliding exponent (m)
    unit: dimensionless
  initial_conditions:
  - name: thickness (h)
    unit: m
  - name: velocity initial guess (u)
    unit: m/yr
  boundary_conditions:
  - name: model_type
    unit: categorical
  - name: dirichlet_ids
    unit: boundary-id list
  - name: side_wall_ids
    unit: boundary-id list
  - name: timestep (dt)
