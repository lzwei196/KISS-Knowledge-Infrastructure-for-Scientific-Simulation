# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: VELMA
  language: python
  implementation:
    id: velma-python-4layer
    version: run_velma.py velma_4layer (lumped daily reimplementation)
    provenance: Python; self-contained lumped daily 4-layer analytic water-balance engine (velma_4layer
      in run_velma.py); not the EPA Java spatial VELMA.
  scientific_reference_version: VELMA-inspired lumped daily 4-layer water-balance model (Python re-implementation;
    conceptually after EPA VELMA 2.0 soil-column hydrology, Stieglitz-family layered drainage)
inputs:
  forcing:
  - name: precipitation
    unit: mm/d
    category: forcing
    source_kind: forcing
    model_input_format: forcing JSON field prec_mm_d (basin-average daily series)
    notes: Basin-averaged daily precipitation consumed each timestep; partitioned to rain/snow by t_snow
      threshold.
  - name: air temperature
    unit: K
    category: forcing
    source_kind: forcing
    model_input_format: forcing JSON field temp_K (basin-average daily series)
    notes: Expected in Kelvin; model subtracts 273.15 internally. Non-finite values silently replaced
      with 288 K inside the loop. Passing Celsius collapses PET to 0 and forces all precip to snow.
  - name: incoming solar radiation
    unit: W/m2
    category: forcing
    source_kind: forcing
    model_input_format: forcing JSON field srad_Wm2 (basin-average daily series)
    notes: Drives PET via Rn = srad*0.0864/2.45. Expected W/m2 (~100-300 daily mean); MJ/m2/d or kJ/m2/d
      mis-units produce catastrophic PET errors. Non-finite values silently replaced with 150 W/m2.
  parameters:
  - name: layer porosity fraction (layer_porosity)
    unit: v/v fraction
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON layer_porosity[4]
    notes: Per-layer void-space fraction; layer_cap = porosity*LAYER_THICK. Must be <1.0 (percent values
      inflate capacity 100x).
  - name: layer field-capacity fraction (layer_fc_frac)
    unit: fraction of layer_cap
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON layer_fc_frac[4]
  - name: layer wilting-point fraction (layer_wp_frac)
    unit: fraction of layer_cap
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON layer_wp_frac[4]
  - name: saturated hydraulic conductivity (layer_ks_mm_d)
    unit: mm/d
    category: parameters
    source_kind: dataset_lookup
    model_input_format: params JSON layer_ks_mm_d[4]
    notes: Default from Rawls/Clapp-Hornberger texture lookup with depth scaling. mm/h instead of mm/d
      makes percolation 24x too slow.
  - name: vertical percolation rate coefficients (perc1-3)
    unit: 1/d (fraction of above-FC storage)
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON perc1, perc2, perc3
    notes: L4 percolation is hardcoded to 0.0; only three percolation coefficients are honored by the
      engine.
  - name: lateral flow coefficients (klat1-4)
    unit: 1/d
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON klat1..klat4
  - name: baseflow recession coefficient (k_base)
    unit: 1/d
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON k_base
    notes: Draws L4 down to wilting point (not field capacity); too-low values let L4 grow without bound.
  - name: fast/slow reservoir recession (k_fast, k_slow)
    unit: 1/d
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON k_fast, k_slow
  - name: PET scale factor (pet_scale)
    unit: unitless
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON pet_scale
    notes: Linear multiplier on PET; reasonable range [0.3,2.5], typical 0.8-1.5. Hargreaves PET is linearly
      sensitive to it.
  - name: degree-day melt factor (ddf)
    unit: mm/d/K
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON ddf
  - name: basin area
    unit: km2
    category: parameters
    source_kind: user_provided
    model_input_format: scalar used in mm/d->m3/s conversion (area*MM_D_KM2_TO_M3_S)
    notes: Wrong area unit (ha vs km2) directly biases discharge magnitude.
  - name: direct-runoff fraction (f_direct)
    unit: fraction
    category: parameters
    source_kind: calibrated
    model_input_format: params JSON f_direct
  initial_conditions:
  - name: per-layer soil water (sw[4])
    unit: mm
    category: initial_conditions
    source_kind: default
    model_input_format: initialized to field capacity fc.copy()
    notes: Starting far from equilibrium produces a strong first-year transient; first year (2-3 for L4)
      discarded as spin-up.
  - name: snow water equivalent (swe)
    unit: mm
    category: initial_conditions
    source_kind: default
    model_input_format: init 0.0
    notes: SWE=0 default; mid-winter start in a snow-dominated basin misses the first spring melt peak.
  - name: fast/slow routing storage (S_fast, S_slow)
    unit: mm
    category: initial_conditions
    source_kind: default
    model_input_format: init 0.0
  boundary_conditions:
  - name: snow/rain and melt temperature thresholds (t_snow, t_melt)
    unit: K
    category: boundary_conditions
    source_kind: default
    model_input_format: params JSON t_snow, t_melt (default 273.15)
  - name: routing split fraction (split)
    unit: fraction
    category: boundary_conditions
    source_kind: calibrated
    model_input_format: params JSON split (fraction of total runoff to fast reservoir)
    notes: split->1.0 starves baseflow and overestimates peaks 2-5x; calibration bound typically [0.2,0.7].
  - name: run mode (simulate vs calibrate)
    unit: switch
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: CLI mode selector; calibrate mode invokes differential_evolution against observed
      discharge
  - name: calibration window start / warmup
    unit: date / days
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: --cal-start and warmup_days (default 365)
    notes: Calibration start must exclude the spin-up year or the optimizer overfits the initial transient.
  - name: observed discharge (calibrate mode)
    unit: m3/s
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: aligned observed series Q_obs_m3s for objective/metrics
outputs:
  primary:
  - name: Q_sim_m3s
    unit: m3/s
    description: Simulated daily discharge at the basin outlet (lumped fast+slow reservoir release scaled
      by basin area).
    validation_rank: 1
    emitted_in: simulation CSV / metrics JSON (parse_output_velma)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - First year (2-3 years for deep L4) is spin-up and must be excluded (default warmup 365 d).
        - Lumped single-outlet discharge; cannot be compared to interior/distributed gauges.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-instant comparison only meaningful for peak/low-flow magnitude checks.
      detrending_options:
      - none
  - name: mean_et_mm_d
    unit: mm/d
    description: Diagnostic basin-mean actual evapotranspiration.
    validation_rank: 3
    emitted_in: metrics JSON diagnostics
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - PET is a radiation/temperature approximation, not an energy-balance closure; expect bias against
          flux-tower ET.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Basin-lumped mean; compare only to basin-aggregated ET products.
      detrending_options:
      - none
  - name: mean_runoff_mm_d
    unit: mm/d
    description: Diagnostic basin-mean total runoff (surface + lateral + baseflow before routing).
    validation_rank: 2
    emitted_in: metrics JSON diagnostics
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Pre-routing runoff depth, not the routed hydrograph.
      detrending_options:
      - none
  - name: final_swe_mm
    unit: mm
    description: End-state snow water equivalent.
    validation_rank: 5
    emitted_in: metrics JSON diagnostics
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Basin-lumped SWE; degree-day snow only, no radiation melt.
      detrending_options:
      - none
  - name: final_sw_mm[4]
    unit: mm
    description: End-state per-layer soil water storage.
    validation_rank: 4
    emitted_in: metrics JSON diagnostics
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Lumped column storage; only loosely comparable to point soil-moisture probes.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_velma_001
  symptom: 'Simulated streamflow is near zero for the entire simulation period. Annual runoff ratio is
    far below 1%. Precipitation in the forcing file has mean daily values around 0.01-0.05 instead of
    the expected 1-5 mm/d range.

    '
  diagnosis: Precipitation left in kg/m2/s (CMFD native) instead of mm/d; CMFD precipitation is in kg/m2/s,
    which equals mm/s. VELMA expects mm/d. The conversion factor is 86400 (seconds per day). Without this
    multiplication, a real 2.7 mm/d rain event enters the model as 0.000031 mm/d, producing negligible
    infi
  remedy: 'Multiply CMFD precipitation by 86400 to convert kg/m2/s to mm/d; convert_forcing_to_velma.py;
    [''Check forcing file: mean daily precip should be 1-10 mm/d for most basins'', ''If values are ~1e-5,
    apply: precip_mmd = precip_kgm2s * 86400.0'', ''Rerun convert_forcing_to_velma.py with corrected unit
    handli'
  severity: silent
- id: dt_velma_002
