schema_version: 1
model_id: SUMMA
domain: hydrology
generated_by: "self-improve session (Claude Opus 4.8) — validation-convention Step-B, general schema"
generated_at: 2026-07-09

# HONESTY SUMMARY --------------------------------------------------------------
# SUMMA (Structure for Unifying Multiple Modeling Alternatives; Clark et al. 2015)
# is a physics-based land/hydrology model. It has NO channel routing, so gauged
# streamflow comparison presumes external routing of per-HRU runoff (dag caveat).
# Grounding of numeric bands:
#   * runoff / discharge (point_time_series) = STRONG. Two peer-reviewed threshold
#     conventions fetched: Moriasi et al. 2007 (Table 4) and Moriasi et al. 2015
#     give NSE/PBIAS/RSR/R2 tiers for watershed flow. These SUPERSEDE nothing; the
#     dag determining_metric (nse) is kept as a headline.
#   * evapotranspiration (point_time_series) = MODERATE. Jimenez et al. 2019
#     (SWAT satellite-ET, HESS 23-1113) REPRODUCES the Moriasi tiers verbatim FOR
#     MONTHLY ET: "NSE > 0.50, R2 > 0.60, KGE >= 0.50 and PBIAS <= +/-25 % are the
#     required satisfactory thresholds". Reproduced-tier grounding for ET.
#   * swe (point_time_series) = WEAK. The fetched SUMMA snow papers evaluate SWE/
#     snow with KGE/NSE but report NO universal pass tier; there is no Moriasi-style
#     snow convention in the fetched set -> headline band NULL, confidence <= 0.4.
#   * soil_moisture (point_time_series) = WEAK. dag determining_metric is r; the
#     fetched calibration paper (Lopez Lopez 2017) uses r/KGE as an OBJECTIVE but
#     states no numeric r pass tier -> headline band NULL, confidence <= 0.4.
# obs_map binds discharge (nse), SWE_F/ET_corr (nse), rootzone soil moisture (r),
# and GRACE total_water_storage (r). total_water_storage is NOT a dag validation
# row, so no block is emitted for it (see notes in the runoff block). snow_depth
# is a dag row but has NO obs binding in model_obs_map (only SWE is bound) -> no
# separate block; it is covered by the swe block's notes.
# Bands are plain NUMBERS read via `direction` (see VALIDATION_CONVENTION_SCHEMA.md).

references:
  moriasi2007:
