validation:

  # ===================== RUNOFF / STREAMFLOW — gauge time series (well grounded) =====================
  - canonical_quantity: runoff
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.75, good: 0.65, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "Moriasi 2007 general streamflow tiers; CLM5-specific behavioral threshold NSE>=0.5 (Cheng 2023)"
        cites: [moriasi2007, cheng2023]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10, good: 15, satisfactory: 25}
        pass_band: satisfactory
        band_note: "Moriasi 2007 streamflow PBIAS column"
        cites: [moriasi2007]
    secondary_metrics:
      - metric: kge
        direction: maximize
        status: supportive
        ceiling_reason: "CLM5 CAMELS ensemble reports single-best monthly-streamflow KGE ~0.65-0.92 across 7 US clusters (Cheng 2023); no fixed KGE pass tier stated."
        cites: [cheng2023]
    validated_when: "NSE >= 0.50 AND |PBIAS| <= 25% (Moriasi 2007 satisfactory streamflow tier; CLM5 uses NSE>=0.5 as the behavioral cutoff, Cheng 2023)"
    evidence_strength: strong
    confidence: 0.8
    notes: >-
      Moriasi 2007 Table 4 general ratings: "Very good 0.75<NSE<=1.00 ... Satisfactory 0.50<NSE<=0.65 ...
      Unsatisfactory NSE<=0.50", streamflow "PBIAS<+-10 (very good) ... <+-25 (satisfactory)". Cheng 2023
      (CLM5 CAMELS ensemble, 464 basins): simulations "that produce error metrics that fall within
      user-defined acceptable performance metric ranges (e.g., NSE >= 0.5 ...) are considered behavioral".
      CRITICAL routing caveat: gridcell QRUNOFF is NOT routed streamflow; gauge comparison requires
      external MOSART/mizuRoute routing and basin aggregation (dag caveat). obs binding = gauge discharge
      (discharge_m3s / river_discharge_in_the_last_24_hours / daily_discharge_cms).

  # ===================== RUNOFF / STREAMFLOW — basin monthly aggregate (transferred tiers) ===========
  - canonical_quantity: runoff
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.75, good: 0.65, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "Moriasi 2007 tiers are defined on a monthly basis (this obs_shape); daily NSE tends to run lower"
        cites: [moriasi2007, cheng2023]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10, good: 15, satisfactory: 25}
        pass_band: satisfactory
        cites: [moriasi2007]
    secondary_metrics:
      - metric: kge
        direction: maximize
        status: supportive
        ceiling_reason: "Cheng 2023 reports CLM5 skill on the monthly KGE metric for basin-aggregated streamflow (~0.65-0.92 best-set)."
        cites: [cheng2023]
    validated_when: "monthly NSE >= 0.50 AND |PBIAS| <= 25% (Moriasi 2007 satisfactory; CLM5 behavioral NSE>=0.5, Cheng 2023)"
    evidence_strength: strong
    confidence: 0.75
    notes: >-
      Same Moriasi 2007 convention as the point/gauge block, applied at basin monthly aggregate (the scale
      at which Moriasi derived the tiers, and the scale Cheng 2023 uses monthly KGE). Requires basin
      water-balance closure and routing.

  # ===================== GPP — flux-tower time series (no cited NSE threshold) =====================
  - canonical_quantity: gpp
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "no cited NSE pass threshold for GPP in the fetched set; the CLM5 literature grades GPP with ILAMB relative scores + correlation/RMSE/bias, not a fixed NSE tier"
        cites: []
    secondary_metrics:
      - metric: r
        direction: maximize
        status: supportive
        ceiling_reason: "GPP is benchmarked via ILAMB's hierarchical relative scoring (annual-mean/bias/RMSE/seasonal-cycle/spatial-pattern integrated to a 0-1 score), not an absolute NSE cutoff (Lawrence 2019 sec 3.3; Collier 2018; Bonan 2020). Single-site CLM5 studies report GPP correlation/R2 as context (Costa Rica 2020)."
        cites: [clm5desc2019, ilamb2018, bonan2020, costarica2020]
    validated_when: "UNRESOLVED numerically — no cited GPP NSE threshold; field judges GPP by ILAMB relative score + correlation/RMSE/bias. Gate must NOT auto-validate or loosen on this block."
    evidence_strength: weak
    confidence: 0.35
    notes: >-
      Lawrence 2019 (CLM5 description): ILAMB "provides a hierarchical scoring system to indicate model
      fidelity ... summary scores ... reflect integrated scores across multiple metrics (RMSE, bias,
      interannual variability, spatial pattern, ...)". No numeric pass band exists for GPP -> null per the
      no-fabrication rule (confidence 0.35). Caveat: eddy-covariance GPP is a flux-partitioning estimate;
      ~100 km gridcell vs ~1 km tower footprint -> use single-point mode. obs binding = FLUXNET GPP
      (GPP_gC_m2_d). NPP (same canonical_quantity, rank 2) has NO obs binding -> not graded here.

  # ===================== EVAPOTRANSPIRATION — flux-tower LE time series (no cited NSE threshold) ======
  - canonical_quantity: evapotranspiration
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "no cited NSE pass threshold for latent-heat/ET in the fetched set; graded via ILAMB relative score + correlation/RMSE, and point calibrations report only modest LE NSE"
        cites: []
    secondary_metrics:
      - metric: r
        direction: maximize
        status: supportive
        ceiling_reason: "ET/latent heat is benchmarked by ILAMB relative scoring (Lawrence 2019 sec 3.3; Collier 2012/2018). Point-scale CLM5 calibration achieves best-scenario LE summary statistics but modest efficiencies (Denager 2023, NSE for the coupled fluxes < ~0.46 in tested scenarios); single-site R2 reported by Costa Rica 2020."
        cites: [denager2023, costarica2020, ilamb2018]
    validated_when: "UNRESOLVED numerically — no cited ET/LE NSE threshold; field judges ET by ILAMB relative score + correlation/RMSE/bias. Gate must NOT auto-validate or loosen on this block."
    evidence_strength: weak
    confidence: 0.35
    notes: >-
      obs binding = FLUXNET latent-energy flux (ET_GPP_LE_flux) mapped to the CLM latent-heat / ET output.
      Caveat: eddy-covariance energy-balance non-closure (~10-30%) and footprint-vs-gridcell mismatch.
      Denager 2023: even best multi-objective point calibration yields limited LE efficiency; no threshold
      convention -> band null. The dag EFLX_LH_TOT row (rank 4) has has_obs_binding=false in the dag, but
      model_obs_map supplies an LE flux binding, so ET is gradeable here on that basis.

  # ===================== TERRESTRIAL WATER STORAGE — GRACE anomaly (structural ceiling) ==============
  - canonical_quantity: total_water_storage
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "no cited correlation pass threshold for CLM5 vs GRACE TWS in the fetched set; TWS is assessed by ILAMB relative score and trend comparison, not a fixed r cutoff"
        cites: []
    secondary_metrics:
      - metric: bias
        direction: zero_centered
        status: structurally_limited
        ceiling_reason: "Global land models (CLM among the seven assessed) systematically UNDERESTIMATE large decadal declining and rising TWS trends relative to GRACE: 'Medians of modeled basin water storage trends greatly underestimate GRACE-derived large decreasing (<=-0.5 km3/y) and increasing (>=0.5 km3/y) trends'; models miss human-intervention (groundwater withdrawal) and some climate-driven trends. A low TWS-trend/magnitude score is therefore a documented data/structural ceiling, not a fixable KI defect (Scanlon 2018 PNAS)."
        cites: [scanlon2018]
    validated_when: "UNRESOLVED numerically — no cited r threshold for CLM5-vs-GRACE TWS; assess via ILAMB relative score and acknowledge the documented decadal-trend underestimation ceiling. Gate must NOT auto-validate or loosen on this block."
    evidence_strength: weak
    confidence: 0.3
    notes: >-
      obs binding = GRACE terrestrial water-storage anomaly (tws_anomaly_cm / terrestrial_water_storage_anomaly);
      model_obs_map determining_metric = r. TWS is NOT one of the dag validation_row vars but IS bound in
      model_obs_map, so it is graded here on that binding. Scanlon 2018 provides the structural-ceiling
      mechanism (fetched paper), justifying the structurally_limited bias entry; no numeric r/bias pass band
      is stated -> headline r null, confidence 0.3.

