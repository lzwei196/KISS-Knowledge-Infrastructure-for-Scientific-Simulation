influence:
  edges:
    - from: "vertical mixing scheme (LMD-KPP / GLS / MY2.5 / NN)"
      to: "vertical diffusivity (Akt)"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: structural
      applicability: "always (closure choice is a compile-time switch)"
      citations: ["robertson2019_roms_tidal_mixing", "robertson2017_roms_surface_wind_mixing"]
    - from: "vertical mixing scheme (LMD-KPP / GLS / MY2.5 / NN)"
      to: "current velocity (u, v)"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: structural
      citations: ["robertson2019_roms_tidal_mixing", "feng2026_roms_param_optimization"]
    - from: "vertical mixing scheme + surface wind stress"
      to: "mixed layer depth"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: structural
      citations: ["robertson2017_roms_surface_wind_mixing"]
    - from: "surface wind stress (sustr, svstr)"
      to: "mixed layer depth"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: boundary_forcing
      citations: ["robertson2017_roms_surface_wind_mixing"]
    - from: "surface wind stress (sustr, svstr)"
      to: "sea surface temperature (temp surface level)"
      sensitivity_grade: "MEDIUM"
      basis: literature_qualitative
      lever_type: boundary_forcing
      citations: ["robertson2017_roms_surface_wind_mixing"]
    - from: "bottom friction coefficient (RDRG2)"
      to: "current velocity (u, v)"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: parameter
      citations: ["feng2026_roms_param_optimization"]
    - from: "horizontal diffusion / viscosity (VISC2, TNU2)"
      to: "current velocity (u, v)"
      sensitivity_grade: "LOW"
      basis: literature_quantitative
      lever_type: parameter
      citations: ["feng2026_roms_param_optimization"]
    - from: "surface forcing (heat / momentum / freshwater)"
      to: "alongshore transport"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: boundary_forcing
      applicability: "limited-area coastal domains (California Current 4D-Var)"
      citations: ["moore2011_roms_4dvar_part3_obsimpact", "moore2011_roms_4dvar_part1"]
    - from: "surface forcing (heat / momentum / freshwater)"
      to: "cross-shore transport"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: boundary_forcing
      citations: ["moore2011_roms_4dvar_part3_obsimpact"]
    - from: "initial conditions (T, S, velocity, zeta)"
      to: "alongshore transport"
      sensitivity_grade: "HIGH"
      basis: literature_quantitative
      lever_type: boundary_forcing
      citations: ["moore2011_roms_4dvar_part3_obsimpact"]
    - from: "open boundary conditions"
      to: "current velocity (u, v)"
      sensitivity_grade: "MEDIUM"
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "limited-area / regional domains"
      citations: ["moore2011_roms_4dvar_part1", "feng2026_roms_param_optimization"]
  citation_index:
    feng2026_roms_param_optimization:
      short_citation: "Feng et al. 2026"
      doi: "10.3390/jmse14111061"
      note: "ROMS parameterization optimization in Western Guangdong Sea; vertical mixing and bottom friction (RDRG2) high sensitivity, horizontal diffusion low."
    robertson2019_roms_tidal_mixing:
      short_citation: "Robertson & Dong 2019"
      doi: "10.1186/s40562-019-0146-y"
      note: "Evaluation of seven vertical-mixing parameterizations for tidal mixing in ROMS; scheme choice strongly controls velocity and diffusivity."
    robertson2017_roms_surface_wind_mixing:
      short_citation: "Robertson & Hartlipp 2017"
      doi: "10.1186/s40562-017-0090-7"
      note: "Surface wind mixing in ROMS; wind stress and mixing-scheme choice jointly set mixed-layer depth and surface diffusivity."
    moore2011_roms_4dvar_part1:
      short_citation: "Moore et al. 2011 (Part I)"
      doi: "10.1016/j.pocean.2011.05.004"
      note: "ROMS 4D-Var system overview; initial conditions, surface forcing, and open boundaries treated as control variables."
    moore2011_roms_4dvar_part3_obsimpact:
      short_citation: "Moore et al. 2011 (Part III)"
      doi: "10.1016/j.pocean.2011.05.005"
      note: "Adjoint observation-impact in the California Current; surface forcing and initial conditions dominate transport sensitivity."

safety:
  hazards:
    - id: "precip_units_mmday_not_kgm2s"
      kind: weather_file_semantic
      description: "Precipitation supplied in mm/day instead of kg/m2/s (must divide by 86400); freshwater budget 1000x too high, salinity crashes toward 0 (dt_001)."
      severity: silent
    - id: "shortwave_sign_upward_positive"
      kind: weather_file_semantic
      description: "Shortwave radiation with upward-positive sign convention instead of positive-downward; ocean loses heat and SST crashes (dt_003)."
      severity: silent
    - id: "qair_relative_humidity_not_kgkg"
      kind: weather_file_semantic
      description: "Specific humidity Qair supplied as % relative humidity instead of kg/kg under BULK_FLUXES; latent-heat flux wrong, SST off by 10-50 degC (dt_007)."
      severity: silent
    - id: "tair_kelvin_not_celsius"
      kind: weather_file_semantic
      description: "Air temperature left in Kelvin instead of Celsius; extreme evaporation and surface heating (dt_009)."
      severity: silent
    - id: "pair_pascal_not_millibar"
      kind: weather_file_semantic
      description: "Surface pressure in Pa instead of millibar (must divide by 100); pressure forcing inert (dt_012)."
      severity: silent
    - id: "wind_speed_vs_stress_mismatch"
      kind: weather_file_semantic
      description: "Wind speed (m/s) supplied where stress (N/m2) expected, or vice versa, mismatched to BULK_FLUXES setting; surface momentum off by 1-2 orders (dt_020)."
      severity: silent
    - id: "forcing_varname_mismatch_varinfo"
      kind: parser_semantic
      description: "Forcing-file variable names do not match varinfo.yaml (e.g. u10 vs Uwind); GET_*FLD cannot find the field (dt_010)."
      severity: fatal
    - id: "bathymetry_negative_all_land"
      kind: soil_semantic
      description: "Bathymetry h negative (ETOPO1 convention) instead of positive-down; mask_rho=0 everywhere, zero ocean volume (dt_005)."
      severity: fatal
    - id: "grid_metrics_pm_pn_inverted"
      kind: soil_semantic
      description: "Grid metrics pm/pn supplied in meters instead of 1/meters; spatial derivatives inverted, instant CFL blow-up (dt_008)."
      severity: fatal
    - id: "bathymetry_rfactor_too_steep"
      kind: soil_semantic
      description: "Bathymetry r-factor |dh|/sum(h) exceeds 0.2; sigma-coordinate pressure-gradient errors produce spurious along-slope currents (dt_017)."
      severity: degraded
    - id: "theta_s_b_out_of_range"
      kind: control_semantic
      description: "THETA_S/THETA_B outside recommended range; sub-centimeter S-layers violate the vertical CFL (dt_013)."
      severity: fatal
    - id: "dt_too_large_cfl_blowup"
      kind: numerical_instability
      description: "Baroclinic DT too large for grid/depth; barotropic CFL violated, BLOWUP (NaN) within 10-100 steps (dt_002)."
      severity: fatal
    - id: "ndtfast_too_small_coupling"
      kind: numerical_instability
      description: "NDTFAST = DT/dtfast too small; poor barotropic-baroclinic coupling and degraded accuracy."
      severity: degraded
    - id: "ic_temp_kelvin_not_celsius"
      kind: initial_condition_semantic
      description: "Initial-condition temperature from a global product (HYCOM/GLORYS) left in Kelvin; wrong starting density and instability (dt_016)."
      severity: silent
    - id: "ocean_time_epoch_mismatch"
      kind: control_semantic
      description: "NetCDF time variables not in seconds since the same TIME_REF epoch; tidal/boundary forcing applied at the wrong model time, no tidal signal (dt_004)."
      severity: silent
    - id: "boundary_file_short_extrapolated"
      kind: control_semantic
      description: "Open-boundary file shorter than the simulation period; ROMS holds the last record, interior T/S drifts over weeks (dt_014)."
      severity: degraded
    - id: "bulk_fluxes_plus_precomputed_fluxes"
      kind: control_semantic
      description: "BULK_FLUXES defined while precomputed fluxes (shflux/swflux) are also supplied; surface forcing doubled, extreme SST (dt_015)."
      severity: silent
    - id: "ana_flags_override_data_silently"
      kind: control_semantic
      description: "Leftover ANA_* analytical CPP flags from an idealized case silently override supplied data forcing files (dt_019)."
      severity: silent
    - id: "tnudg_subday_reflecting_wall"
      kind: control_semantic
      description: "Boundary nudging time scale Tnudg < 1 day (units are days); acts as a hard reflecting wall, growing inward oscillations (dt_006)."
      severity: degraded
    - id: "lm_mm_mismatch_grid_dims"
      kind: control_semantic
      description: "Lm/Mm in roms.in do not equal xi_rho-2 / eta_rho-2; array-bounds error / SIGFPE at startup (dt_018)."
      severity: fatal
    - id: "ntile_product_ne_mpi_procs"
      kind: control_semantic
      description: "NtileI x NtileJ in roms.in does not equal the number of MPI processes; domain cannot be decomposed and the run aborts (MPI_ABORT) at startup (dt_011)."
      severity: fatal
    - id: "multiple_mixing_closures_defined"
      kind: control_semantic
      description: "More than one vertical-mixing closure (e.g. LMD + GLS) defined simultaneously at compile time; compile error or undefined behavior."
      severity: fatal
  validation_limits:
    - "Hydrostatic: cannot resolve non-hydrostatic processes (deep convection plumes, sharp internal hydraulic jumps)."
    - "Regional/limited-area: requires externally-supplied lateral open-boundary data; not a self-contained global model."
    - "Terrain-following S-coordinate degrades pressure-gradient accuracy over steep bathymetry (r-factor sensitivity)."
    - "Vtransform 1 and Vtransform 2 use different formulations; their parameter sets must not be interchanged."
    - "Physical validity envelope: T -2 to 35 degC, S 0-42 PSU, SSH within +-2 m; outputs outside indicate forcing/config error."
  warnings:
    - "Changing any CPP flag requires full recompilation; the active physics is fixed at build time, not at run time."
    - "ANA_* analytical functions silently take precedence over supplied data files when left defined."
    - "Vertical S-levels are indexed k=0 at the bottom (deepest) and k=N-1 at the surface; surface fields use the top level."
    - "MY2.5 closure can become numerically unstable under strong winds in shallow cases; LMD/KPP tends to overmix the near-surface."
    - "Number of MPI processes must equal NtileI x NtileJ or the run aborts at startup."
  assumptions:
    - statement: "Model is hydrostatic and Boussinesq; the vertical momentum equation is replaced by hydrostatic balance and density variations enter only the buoyancy term."
      scope: "All ROMS nonlinear forward simulations"
      source: "ROMS docs/README.md Overview; en.wikipedia.org/wiki/Regional_Ocean_Modeling_System"
      status: adopted
    - statement: "Surface energy/flux closure is internal (computed from atmospheric state) only when BULK_FLUXES is active; otherwise prescribed surface fluxes are imposed and supplying both double-counts."
      scope: "Surface boundary condition / air-sea coupling"
      source: "bulk_flux.F and set_vbc.F module behavior in ROMS source; varinfo.yaml forcing-field definitions"
      status: adopted
    - statement: "In-situ density is computed by the hardcoded Jackett & McDougall (1995) nonlinear UNESCO equation of state; density and Brunt-Vaisala frequency are diagnostic, not prognostic."
      scope: "Equation of state / pressure-gradient and mixing coupling"
      source: "rho_eos.F nonlinear EOS polynomial in ROMS source"
      status: adopted
    - statement: "Time integration is split-explicit with a fast barotropic (2D) mode and slow baroclinic (3D) mode coupled at NDTFAST = DT/dtfast; both CFL limits (barotropic dtfast < dx/sqrt(g*hmax) and baroclinic DT) must hold."
      scope: "Numerical stability / time-stepping"
      source: "step2d.F / main3d.F split-explicit kernel in ROMS source; ROMS WikiROMS time-stepping documentation"
      status: adopted
    - statement: "Default Boussinesq reference density rho0=1025 kg/m3 and specific heat Cp=3985 J/kg/degC are model constants (mod_scalars) used in the pressure gradient, buoyancy, and heat-flux-to-temperature conversion."
      scope: "Physical constants"
      source: "mod_scalars.F default scalar definitions in ROMS source"
      status: adopted

