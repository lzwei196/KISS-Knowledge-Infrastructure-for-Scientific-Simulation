template_version: "3.5"

identity:
  model_id: "PFLOTRAN"
  scientific_reference_version: "PFLOTRAN v6.0 (RICHARDS variably-saturated flow + multicomponent reactive transport; van Genuchten/Mualem characteristic curves)"
  implementation:
    id: "hydrocraft-pflotran-subsurface"
    version: "package v1.1.0 (PFLOTRAN v6.0 core, PETSc v3.18+)"
    provenance: "Fortran 2003/2008; LANL/SNL/ORNL open-source PFLOTRAN built on PETSc for MPI domain decomposition."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "LGPL"
  license_note: "Streams confirm only 'GNU LGPL' (docs_reader) with no SPDX minor version; the specific point release (e.g. LGPL-2.1) is not confirmed by any stream or a LICENSE-file check, so the unversioned SPDX id is recorded."
  repo_url: "https://bitbucket.org/pflotran/pflotran"
  docs_url: "https://documentation.pflotran.org/"

boundary:
  scope_in:
    - "Variably saturated single-phase isothermal subsurface flow (RICHARDS mode)"
    - "Single-phase non-isothermal coupled flow + heat (TH mode)"
    - "Two-phase liquid-gas multiphase multicomponent flow incl. supercritical CO2 (GENERAL mode)"
    - "Multicomponent advective-dispersive reactive transport (aqueous complexation, sorption, mineral kinetics, gas reactions)"
    - "Reaction-induced changes to porosity, permeability, tortuosity"
    - "Elastic geomechanics (poromechanical coupling, experimental)"
    - "1D vertical vadose-zone soil-moisture columns as a special case of RICHARDS mode"
  scope_out:
    - "Surface water routing (delegated to coupled land-surface / river models)"
    - "Hortonian / saturation-excess surface runoff (absent in 1D column mode; structural wet-bias source)"
    - "Atmospheric processes"
    - "Inelastic / plastic geomechanics (only elastic model implemented)"
    - "Multiple-interacting-continuum fractured media (under development)"
  spatial: "3-D"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Solves coupled nonlinear mass conservation PDEs (Richards mass balance with Darcy flux) by fully-implicit Newton-Raphson; energy conservation is additionally closed in TH/GENERAL modes. RICHARDS mode is isothermal single-phase (no energy budget). Reactive transport is formulated on total concentration of a chosen primary/basis species set with secondary species from equilibrium mass action. A per-simulation water mass-balance error < ~1% is the operational trust criterion. Default solve is 3-D finite-volume; 1-D vertical columns (NXYZ 1 1 N) are a degenerate case. Works internally in SI (m, s, Pa, m^2, kg); intrinsic permeability (m^2) and liquid pressure (Pa) are the native bases, NOT hydraulic conductivity or head. The numerical scheme is continuous-time transient (adaptive sub-second-to-multi-year Newton timesteps); the KI's operating/validation cadence is daily (FLUXNET daily SWC forcing/targets), which is the value reported in temporal above."

inputs:
  forcing:
    - category: "forcing"
      name: "Recharge / infiltration flux (top boundary)"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "FLOW_CONDITION LIQUID_FLUX NEUMANN; time-varying via FILE or RATE LIST"
      notes: "recharge = precipitation * infiltration_fraction - ET; native unit m/s. Inline unit keyword (e.g. 'mm/yr') accepted and converted; bare numbers are interpreted as m/s."
    - category: "forcing"
      name: "Root-zone evapotranspiration sink"
      unit: "m^3/s"
      source_kind: "forcing"
      model_input_format: "SOURCE_SINK with RATE SCALED_VOLUMETRIC_RATE VOLUME (distributed)"
      notes: "Applied as a distributed volumetric sink over the root zone (negative = extraction), not as a negative top Neumann BC, to avoid single-cell depletion. Sign convention: extraction MUST be negative."
    - category: "forcing"
      name: "River / lake stage (head boundary)"
      unit: "Pa"
      source_kind: "forcing"
      model_input_format: "FLOW_CONDITION LIQUID_PRESSURE DIRICHLET"
      notes: "P = rho*g*(stage - z_cell) + P_atm; time-varying river stage imposed as a pressure (Dirichlet) lateral boundary."
    - category: "forcing"
      name: "Well pumping / injection rate"
      unit: "m^3/s"
      source_kind: "forcing"
      model_input_format: "FLOW_CONDITION RATE SCALED_VOLUMETRIC_RATE + SOURCE_SINK"
  parameters:
    - category: "parameter"
      name: "Intrinsic permeability (PERM_ISO)"
      unit: "m^2"
      source_kind: "calibrated"
      model_input_format: "MATERIAL_PROPERTY PERMEABILITY"
      notes: "Native basis is intrinsic permeability in m^2 (1e-20 to 1e-8), NOT hydraulic conductivity. Highest calibration priority; controls flow magnitude. Tensor (X/Y/Z) supported."
    - category: "parameter"
      name: "Porosity"
      unit: "fraction (0-1)"
      source_kind: "calibrated"
      model_input_format: "MATERIAL_PROPERTY"
      notes: "Storage and transport-velocity control; 0.01-0.60. Must be a fraction, not percent."
    - category: "parameter"
      name: "Tortuosity"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "MATERIAL_PROPERTY"
    - category: "parameter"
      name: "Longitudinal dispersivity"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "MATERIAL_PROPERTY"
    - category: "parameter"
      name: "van Genuchten alpha"
      unit: "1/Pa"
      source_kind: "calibrated"
      model_input_format: "CHARACTERISTIC_CURVES SATURATION_FUNCTION VAN_GENUCHTEN"
      notes: "Capillary curve scale; native unit 1/Pa (1e-7 to 1e-3), NOT 1/cm. alpha_Pa = alpha_cm / 9804.139."
    - category: "parameter"
      name: "van Genuchten m"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "CHARACTERISTIC_CURVES"
      notes: "m = 1 - 1/n (Mualem constraint); 0.05-0.80; requires n > 1."
    - category: "parameter"
      name: "Liquid residual saturation"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "CHARACTERISTIC_CURVES"
      notes: "0.0-0.40; must be < porosity."
    - category: "parameter"
      name: "Molecular diffusion coefficient"
      unit: "m^2/s"
      source_kind: "default"
      model_input_format: "FLUID_PROPERTY DIFFUSION_COEFFICIENT"
      notes: "Aqueous diffusion ~1e-9 to 1e-10 m^2/s; native unit m^2/s."
    - category: "parameter"
      name: "Reaction parameters (equilibrium constants, kinetic rates, sorption isotherm/ion-exchange/surface-complexation coefficients)"
      unit: "various"
      source_kind: "calibrated"
      model_input_format: "CHEMISTRY block"
      notes: "Reactive-transport mode only. Mineral kinetics use the transition-state-affinity rate law with optional rate limiters."
  initial_conditions:
    - category: "initial_conditions"
      name: "Initial liquid pressure / water table"
      unit: "Pa"
      source_kind: "user_provided"
      model_input_format: "INITIAL_CONDITION FLOW_CONDITION LIQUID_PRESSURE HYDROSTATIC with DATUM"
      notes: "HYDROSTATIC recommended: fully saturated below the datum water table, suction per the vG curve above it. Bad ICs stall the solve at t=0."
    - category: "initial_conditions"
      name: "Initial temperature"
      unit: "C"
      source_kind: "user_provided"
      model_input_format: "INITIAL_CONDITION (TH/GENERAL)"
      notes: "Native input unit Celsius, NOT Kelvin."
    - category: "initial_conditions"
      name: "Initial species concentrations"
      unit: "mol/L"
      source_kind: "user_provided"
      model_input_format: "CONSTRAINT block (reactive transport)"
      notes: "Native unit mol/L, NOT mg/L."
  boundary_conditions:
    - category: "boundary_conditions"
      name: "Simulation mode selector"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "SIMULATION / SUBSURFACE_FLOW MODE (RICHARDS | TH | GENERAL | reactive transport | GEOMECHANICS)"
      notes: "Structural switch selecting the governing-equation set."
    - category: "boundary_conditions"
      name: "Steady-state vs transient flag"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "SUBSURFACE_FLOW STEADY_STATE option"
    - category: "boundary_conditions"
      name: "Saturation / relative-permeability function choice"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "CHARACTERISTIC_CURVES (VAN_GENUCHTEN / BROOKS_COREY; MUALEM / BURDINE)"
      notes: "Method selectors for the retention and relative-permeability laws. SMOOTH option belongs ONLY in PERMEABILITY_FUNCTION, never SATURATION_FUNCTION."
    - category: "boundary_conditions"
      name: "Region / material / strata assignment"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "REGION, STRATA, BOUNDARY_CONDITION, INITIAL_CONDITION cards"
      notes: "Case-sensitive name binding of conditions and materials to grid regions; STRATA must cover the full domain."
    - category: "boundary_conditions"
      name: "Boundary condition types"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "BOUNDARY_CONDITION referencing FLOW_CONDITION (DIRICHLET head, NEUMANN flux, SEEPAGE face, no-flow default)"

processes:
  modules:
    - name: "Factory_Subsurface"
      role: "driver"
      brief: "Parses the keyword input deck and constructs the simulation object, process-model controller (PMC) tree, realization, grid and solver wiring (factory_pflotran.F90, factory_subsurface*.F90)."
    - name: "PMC_Subsurface"
      role: "driver"
      brief: "Process-model controller hierarchy; PMCBaseRunToTime recursively advances child/peer controllers to sync times, implementing operator-split coupling of flow and transport."
    - name: "Timestepper_SNES"
      role: "integrator"
      brief: "Adaptive time-stepping loop; invokes the PETSc SNES Newton solver and cuts the timestep on nonlinear divergence (timestepper_SNES.F90)."
    - name: "Solver_PETSc"
      role: "integrator"
      brief: "Wraps PETSc SNES/KSP nonlinear and linear solvers and preconditioners; returns converged solution or divergence flag to the timestepper."
    - name: "PM_Richards"
      role: "process_solver"
      brief: "Variably-saturated single-phase Richards flow process model; assembles residual/Jacobian and mass balance over the liquid-pressure DOF (pm_richards.F90, richards.F90)."
    - name: "PM_TH"
      role: "process_solver"
      brief: "Coupled thermal-hydrologic flow process model (liquid pressure + temperature DOF, density a function of T and P)."
      applicability: "TH mode"
    - name: "PM_General"
      role: "process_solver"
      brief: "Two-phase liquid-gas multiphase-multicomponent flow with energy, incl. supercritical CO2 and Kelvin vapor-pressure lowering."
      applicability: "GENERAL mode"
    - name: "Reactive_Transport"
      role: "process_solver"
      brief: "Multicomponent advective-dispersive reactive transport; assembles species transport coupled to the flow velocity field, plus aqueous complexation, sorption and mineral kinetics."
      applicability: "reactive-transport runs"
    - name: "Characteristic_Curves"
      role: "process_solver"
      brief: "van Genuchten / Brooks-Corey saturation functions and Mualem / Burdine relative-permeability functions; supplies pc(S), kr(S) and dsat_dp to the flow models."
    - name: "Material"
      role: "allocator"
      brief: "Holds per-cell porosity, permeability tensor, tortuosity and compressibility; transforms (permeability-porosity, geomechanical, pressure-dependent effective porosity) update material state."
    - name: "Global_Aux"
      role: "allocator"
      brief: "Cell-centered shared thermodynamic state (pressure, temperature, saturation, density, mass balance, Darcy velocity) read/written by every process model — the implicit coupling hub."
    - name: "Realization_Subsurface"
      role: "allocator"
      brief: "Aggregates grid, discretization, auxvars, conditions and material into per-process-domain realization/patch containers consumed by the process models."
    - name: "Discretization"
      role: "allocator"
      brief: "Structured/unstructured grid geometry, connectivity, DOF mapping and MPI ghost exchange; provides face areas and inter-cell distances for flux assembly."
    - name: "Init_Subsurface_Flow"
      role: "driver"
      brief: "Initial- and boundary-condition assignment including hydrostatic initialization of the flow DOF (init_subsurface_flow.F90, hydrostatic.F90)."
    - name: "PM_Geomechanics_Force"
      role: "process_solver"
      brief: "Linear-elastic geomechanics; volumetric strain feeds back into porosity (and via transform, permeability) of the flow model."
      applicability: "geomechanics-coupled runs (experimental)"
  internal_edges:
    - from: "Factory_Subsurface"
      to: "PMC_Subsurface"
      kind: "invokes"
      brief: "Constructs the process-model controller tree and timesteppers from the input deck."
    - from: "PMC_Subsurface"
      to: "Timestepper_SNES"
      kind: "invokes"
      brief: "RunToTime delegates to the timestepper StepDT for each controller."
    - from: "Timestepper_SNES"
      to: "Solver_PETSc"
      kind: "invokes"
      brief: "Hands the residual/Jacobian callbacks to the PETSc SNES Newton solver."
    - from: "Solver_PETSc"
      to: "Timestepper_SNES"
      kind: "invokes"
      brief: "Returns converged solution / divergence flag driving timestep-cut logic."
    - from: "Timestepper_SNES"
      to: "PM_Richards"
      kind: "invokes"
      brief: "SNES residual/Jacobian callbacks call the flow process model's assembly routines."
    - from: "Timestepper_SNES"
      to: "PM_TH"
      kind: "invokes"
      brief: "SNES residual/Jacobian callbacks call the TH-mode flow process model's assembly routines (alternative-mode path, TH mode)."
    - from: "Timestepper_SNES"
      to: "PM_General"
      kind: "invokes"
      brief: "SNES residual/Jacobian callbacks call the GENERAL-mode (two-phase) flow process model's assembly routines (alternative-mode path, GENERAL mode)."
    - from: "PM_Richards"
      to: "Characteristic_Curves"
      kind: "invokes"
      brief: "Evaluates van Genuchten pc(S) and Mualem kr(S) per cell."
    - from: "Characteristic_Curves"
      to: "Liquid_Saturation"
      kind: "writes_state"
      brief: "Maps capillary pressure to saturation and saturation to relative permeability."
    - from: "Material"
      to: "PM_Richards"
      kind: "consumes_input"
      brief: "Effective porosity and permeability tensor supplied to flow accumulation and flux terms."
    - from: "Inputs"
      to: "PM_Richards"
      kind: "consumes_input"
      brief: "FLOW_CONDITION LIQUID_FLUX NEUMANN recharge applied as a top-boundary source."
    - from: "PM_Richards"
      to: "Liquid_Pressure"
      kind: "writes_state"
      brief: "Newton update advances the primary liquid-pressure field; saturation, density and Darcy velocity follow."
    - from: "PM_Richards"
      to: "Global_Aux"
      kind: "writes_state"
      brief: "Updates the shared global_auxvar pressure/saturation/density/Darcy-velocity hub after each Newton update."
    - from: "PM_TH"
      to: "Global_Aux"
      kind: "writes_state"
      brief: "TH-mode Newton update writes shared global_auxvar pressure/temperature/saturation/density/Darcy-velocity (alternative-mode solver sharing the coupling hub; TH mode)."
    - from: "PM_General"
      to: "Global_Aux"
      kind: "writes_state"
      brief: "GENERAL-mode (two-phase liquid-gas) Newton update writes shared global_auxvar liquid/gas pressure, saturation, density and Darcy velocity (alternative-mode solver sharing the coupling hub; GENERAL mode)."
    - from: "Init_Subsurface_Flow"
      to: "Liquid_Pressure"
      kind: "writes_state"
      brief: "Hydrostatic initialization sets the initial pressure/saturation field."
    - from: "Discretization"
      to: "PM_Richards"
      kind: "consumes_input"
      brief: "Provides grid connectivity, face areas and distances for flux assembly."
    - from: "Reactive_Transport"
      to: "Global_Aux"
      kind: "reads_state"
      brief: "Reads saturation, density and Darcy velocity as the transport flow field (implicit flow->transport coupling via shared global_auxvar)."
    - from: "Reactive_Transport"
      to: "Concentration"
      kind: "writes_state"
      brief: "Advances primary-species total concentrations and reaction rates."
    - from: "PM_Geomechanics_Force"
      to: "Material"
      kind: "writes_state"
      brief: "Volumetric strain updates porosity (and via transform, permeability), coupling mechanics back into flow."
    - from: "Global_Aux"
      to: "Material"
      kind: "reads_state"
      brief: "Pressure-dependent effective-porosity transform reads global pressure to update material storage."
    - from: "PMC_Subsurface"
      to: "Reactive_Transport"
      kind: "invokes"
      brief: "Operator-split coupling: flow controller advanced, then transport controller over the same interval via peer RunToTime."
    - from: "PM_Richards"
      to: "Outputs"
      kind: "produces_output"
      brief: "Liquid pressure/saturation snapshots and cumulative mass balance written to HDF5 / -mas.dat."
    - from: "Reactive_Transport"
      to: "Outputs"
      kind: "produces_output"
      brief: "Solute concentrations, mineral volume fractions and pH written to HDF5 / observation files."

states:
  variables:
    - name: "Liquid_Pressure"
      unit: "Pa"
      role: "prognostic"
    - name: "Liquid_Saturation"
      unit: "-"
      role: "prognostic"
    - name: "Temperature"
      unit: "C"
      role: "prognostic"
    - name: "Concentration"
      unit: "mol/L"
      role: "prognostic"
    - name: "Capillary_Pressure"
      unit: "Pa"
      role: "diagnostic"
    - name: "Relative_Permeability"
      unit: "-"
      role: "diagnostic"
    - name: "Liquid_Mobility"
      unit: "1/(Pa.s)"
      role: "diagnostic"
    - name: "Effective_Porosity"
      unit: "-"
      role: "diagnostic"
    - name: "Liquid_Density"
      unit: "kg/m^3"
      role: "diagnostic"
    - name: "Darcy_Velocity"
      unit: "m/s"
      role: "diagnostic"
    - name: "Reaction_Rate"
      unit: "mol/(m^3.s)"
      role: "diagnostic"
    - name: "Mineral_Volume_Fraction"
      unit: "-"
      role: "prognostic"
    - name: "Cumulative_Mass_Balance"
      unit: "kg"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "Liquid_Pressure"
    validation_rank: 2
    unit: "Pa"
    description: "Absolute liquid pressure, the primary solved variable; hydraulic head = (P - P_atm)/(rho*g) + z."
    emitted_in: "HDF5 (.h5) snapshots; observation (-obs-*.tec) time series"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Subtract atmospheric pressure (101325 Pa) before converting to head, else a systematic ~+10.33 m head offset appears."
            - "Compare as head (m) against well observations; model emits pressure (Pa)."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Steady-state or single-time head comparison; same P_atm subtraction caveat."]
      detrending_options: ["none"]
  - var: "Liquid_Saturation"
    validation_rank: 3
    unit: "-"
    description: "Fraction of pore space filled with liquid; volumetric water content SWC = Liquid_Saturation * porosity."
    emitted_in: "HDF5 (.h5); observation (-obs-*.tec)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Compare SWC = saturation * porosity, not saturation directly, against soil-moisture sensors."
            - "1D column SWC carries a structural wet bias where surface runoff is significant (no runoff module) and a dry bias where porosity is underestimated for organic/meadow soils; remove mean bias before judging temporal pattern in those regimes."
            - "For an NXYZ 1 1 N grid, saturation has shape (1,1,N); top sensor cell is index N-1, bottom is index 0."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Gridded saturation/water-table snapshot comparison."]
      detrending_options: ["none", "linear_residual"]
  - var: "Hydraulic_Head"
    validation_rank: 1
    unit: "m"
    description: "Derived water-table / piezometric head, (P - P_atm)/(rho*g) + z."
    emitted_in: "post-processed from HDF5 Liquid_Pressure"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats: ["Acceptable groundwater-head skill NSE>0.5 / RMSE typically <1-2 m per KI guidance."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none"]
  - var: "Darcy_Velocity"
    validation_rank: 4
    unit: "m/s"
    description: "Darcy (specific-discharge) velocity field, components X/Y/Z."
    emitted_in: "HDF5 (.h5)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Rarely directly observed; usually inferred from tracer breakthrough rather than measured."]
      detrending_options: ["none"]
  - var: "Solute_Concentration"
    validation_rank: 5
    unit: "mol/L"
    description: "Aqueous primary/secondary species concentration in reactive-transport mode."
    emitted_in: "HDF5 (.h5); observation (-obs-*.tec)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Breakthrough-curve comparison; timing (first-arrival, peak) is governed by the permeability field."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Plume-extent / concentration-field comparison."]
      detrending_options: ["none"]
  - var: "Cumulative_Mass_Balance"
    validation_rank: 6
    unit: "kg"
    description: "Cumulative inflow, outflow and storage change of the water (or solute) mass budget."
    emitted_in: "Mass balance (-mas.dat)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Primarily an internal-consistency diagnostic: water-balance error must stay < ~1% for a trustworthy run, not an observational target."]
      detrending_options: ["none"]

influence:
  _caveat: "No formal variance-based global SA (Sobol/Morris/EFAST) exists for PFLOTRAN; HIGH grades rest on inverse-estimation parameter importance (Yoon 2012) and stochastic/surrogate permeability-ensemble response (Hammond 2011, Jiang 2024). Edges grounded only in scenario/descriptive reactive-transport studies are capped at MEDIUM."
  edges:
    - from: "Intrinsic permeability / hydraulic-conductivity field"
      to: "Solute breakthrough curve (temporal moments)"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "reactive / solute transport"
      citations: ["yoon2012_pflotran_inverse_k_porosity", "hammond2014_pflotran_performance_scenarios"]
    - from: "Porosity"
      to: "Solute breakthrough curve (temporal moments)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "reactive / solute transport"
      citations: ["yoon2012_pflotran_inverse_k_porosity"]
    - from: "Surface-complexation sorption (site density / Kd)"
      to: "Aqueous U(VI) / dissolved species concentration"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "reactive transport with sorption"
      citations: ["hammond2010_pflotran_hanford_uranium", "hammond2014_pflotran_performance_scenarios"]
    - from: "River stage / boundary flow dynamics"
      to: "Aqueous U(VI) / dissolved species concentration"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "variably-saturated near-stream transport"
      citations: ["hammond2010_pflotran_hanford_uranium"]
    - from: "Hyporheic-zone permeability distribution"
      to: "Cumulative solute flux to river"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "near-stream reactive transport"
      citations: ["hammond2011_pflotran_stochastic_uranium"]
    - from: "Fine-scale permeability heterogeneity"
      to: "Cumulative solute flux to river"
      sensitivity_grade: "LOW"
