validation:
  - dag_variable: pressure
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: 0.75, satisfactory: 0.5}
        pass_band: satisfactory
        band_note: "Transferred from open-access hydrologic time-series model evaluation: Das 2019 reproduces that monthly calibration is satisfactory if NSE > 0.50 and cites good simulation for NSE greater than 0.75."
        cites: [das2019]
    secondary_metrics:
      - metric: pbias
        direction: zero_centered
        status: supportive
        ceiling_reason: "Magnitude bias is a useful hydraulic-head/pressure diagnostic after reference-datum conversion; Das 2019 quotes PBIAS +/- 25% for streamflow, but this is not a PorePy pressure-specific pass gate."
        cites: [das2019]
      - metric: relative_l2_error
        direction: minimize
        status: supportive
        ceiling_reason: "PorePy validation is mainly by benchmarks; the PorePy paper says it presents validation by benchmarks, and fractured-flow benchmarks report approximation errors relative to reference solutions."
        cites: [porepy2020, flemisch2017, berre2020]
    validated_when: "For pressure/head-like time series, NSE >= 0.5 under consistent datum and density conversion; check PBIAS and benchmark-relative errors as supportive diagnostics."
    evidence_strength: moderate
    confidence: 0.55
    notes: "No fetched PorePy field paper gives a pressure-specific NSE threshold. This block keeps the dag determining_metric and transfers an open-access hydrologic convention; field practice for PorePy itself is mostly benchmark/reference-solution verification."

  - dag_variable: pressure
    obs_shape: spatial_snapshot
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched fractured-porous-media pressure benchmark defines a CSI threshold for continuous pressure fields."
        cites: []
    secondary_metrics:
      - metric: relative_l2_error
        direction: minimize
        status: supportive
        ceiling_reason: "The fetched flow benchmark convention is comparison of pressure and fracture quantities to reference solutions, not CSI pass/fail grading."
        cites: [flemisch2017, berre2020]
    validated_when: "UNRESOLVED - use reference-solution spatial error and visual/line-sample agreement; no cited CSI band."
    evidence_strength: weak
    confidence: 0.3
    notes: "Flemisch 2017 says benchmark outputs include approximation errors in matrix and fractures with respect to a reference solution. The dag CSI metric has no fetched numeric threshold."

  - dag_variable: displacement
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched poromechanics or fractured-rock benchmark gives an NSE tier for displacement time series."
        cites: []
    secondary_metrics:
      - metric: relative_l2_error
        direction: minimize
        status: supportive
        ceiling_reason: "Hydromechanical finite-volume papers validate displacement by convergence or analytical/reference comparison rather than NSE."
        cites: [nordbotten2014, berge2020, stefansson2021]
    validated_when: "UNRESOLVED - displacement time series should agree with borehole/surface deformation at matching support, but no cited NSE band was fetched."
    evidence_strength: weak
    confidence: 0.3
    notes: "Berge 2020 reports convergence rates do not deteriorate when contact tractions are coupled to the finite-volume scheme; Stefansson 2021 reports expected first-order convergence except local traction-regime transitions. These are verification results, not a field NSE rule."

  - dag_variable: displacement
    obs_shape: point_snapshot
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: null, good: null, satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched source defines a PBIAS threshold for displacement snapshots in fractured poromechanics."
        cites: []
    secondary_metrics:
      - metric: relative_l2_error
        direction: minimize
        status: supportive
        ceiling_reason: "PorePy-related mechanics validation is by analytical/reference solutions and convergence studies, not a PBIAS tier."
        cites: [porepy2020, nordbotten2014, berge2020, stefansson2021]
    validated_when: "UNRESOLVED - compare displacement components in the same reference frame; no cited PBIAS band."
    evidence_strength: weak
    confidence: 0.3
    notes: "The PorePy paper includes poroelasticity and fracture-deformation benchmarks. That supports comparison practice but not a numeric PBIAS convention."

