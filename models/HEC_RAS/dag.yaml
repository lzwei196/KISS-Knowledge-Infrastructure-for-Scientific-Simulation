template_version: "3.3"

identity:
  model_id: "HEC-RAS"
  scientific_reference_version: "HEC-RAS Hydraulic Reference Manual v6.1/6.5 (1-D Saint-Venant + standard-step energy equation; 2-D shallow-water equations)"
  implementation:
    id: "hec-ras-6.7b5"
    version: "6.7 Beta 5"
    provenance: "USACE HEC-distributed Windows binaries (RasSteady.exe, RasUnsteady.exe, RasGeomPreprocess.exe) executed via WINE; Intel-Fortran PE64 solver core (libifcoremd.dll, libiomp5md.dll) with HDF5 I/O. Closed-source, public-domain U.S. Government software."
  ki_class: "forward_model"
  language: "fortran"
  license: "U.S. Government public-domain (USACE Terms and Conditions of Use; no SPDX identifier)"
  repo_url: "https://www.hec.usace.army.mil/software/hec-ras/"

boundary:
  scope_in:
    - "1-D steady-flow water-surface profile computations in gradually varied open-channel flow (standard-step energy equation)"
    - "1-D unsteady-flow hydrodynamics via Saint-Venant equations (continuity + momentum, implicit finite-difference box scheme)"
    - "2-D unsteady-flow hydrodynamics via shallow-water equations or diffusion-wave approximation, with sub-grid bathymetry"
    - "Combined 1-D/2-D unsteady flow modeling"
    - "Hydraulics of structures: bridges, culverts, inline and lateral weirs/spillways, gated structures, levees, pump stations"
    - "Sub/super/mixed flow regimes including hydraulic-jump location"
    - "1-D and 2-D sediment transport (quasi-unsteady and unsteady, scour and deposition)"
    - "Temperature and water-quality constituent transport (algae, dissolved oxygen, nitrogen species)"
    - "Dam-break analysis and floodplain inundation mapping"
  scope_out:
    - "Three-dimensional hydrodynamics (depth-averaged shallow-water / 1-D Saint-Venant assumptions only)"
    - "Non-hydrostatic pressure flows"
    - "Compressible / variable-density flow"
    - "Rainfall-runoff / watershed hydrology (HEC-RAS consumes inflow hydrographs; rainfall-on-grid is a boundary, not a hydrologic loss model)"
    - "Generation of discharge de novo (model consumes Q, does not produce it)"
    - "DEM-to-cross-section delineation as a primary task (geometry authoring is upstream of the solver)"
  spatial: "distributed-stream"
  temporal: "event"
  closure: "mass-balance"
  notes: "1-D Saint-Venant closes mass + momentum with Manning friction; steady 1-D closes the energy (Bernoulli) equation between sections. 2-D SWE closes mass + momentum under incompressible, uniform-density, hydrostatic-pressure assumptions with Reynolds-averaged eddy-viscosity turbulence closure. The diffusion-wave (DSW) variant simplifies momentum by dropping local-inertia and advective acceleration terms; valid only when barotropic pressure gradient and bottom friction dominate. Energy-balance closure (water temperature / latent heat) appears only in the optional water-quality module, not in the hydrodynamic core. Spatial discretization is distributed-stream (1-D cross sections along reaches, per docs_reader spatial_grain) for the 1-D steady/unsteady solvers; 2-D solver overlays a structured/unstructured computational mesh with sub-grid bathymetry on top of the same river-system schematic. The single-enum spatial tag is the 1-D backbone; 2-D is an opt-in mesh extension. Temporal grain spans steady (time-invariant per profile) through sub-hourly unsteady routing (Δt ≤ Δx/√(g·h) Courant-limited) up to multi-day flood events; the 'event' tag reflects the dominant flood-routing use case."

inputs:
  forcing:
    - category: "upstream boundary forcing"
      name: "discharge (upstream inflow hydrograph)"
      unit: "cfs (English) or m^3/s (SI)"
      source_kind: "forcing"
      model_input_format: "Steady: '.fNN'/'.rNN' Section - Flow Data; Unsteady: '.uNN' boundary time series"
      notes: "Primary forcing. Steady consumes one discharge per profile; unsteady consumes Q(t). HEC-RAS PRODUCES stage from Q — Q is conserved along the reach for steady flow and must not be treated as a model product. 1 m^3/s = 35.3147 cfs."
    - category: "downstream boundary forcing"
      name: "downstream stage or stage hydrograph"
      unit: "ft or m"
      source_kind: "forcing"
      model_input_format: "'.fNN'/'.uNN' Reach Boundaries section; type code 1 (Known WS) or 4 (Rating Curve)"
      notes: "Only when downstream BC type is Known Water Surface or Rating Curve; otherwise the downstream condition is parameter-driven (normal depth or critical depth)."
    - category: "internal forcing"
      name: "lateral inflow hydrograph"
      unit: "cfs or m^3/s"
      source_kind: "forcing"
      model_input_format: "'.uNN' lateral-inflow boundary"
      notes: "Optional; supplied at internal cross sections for unsteady runs."
    - category: "2-D surface forcing"
      name: "precipitation on grid"
      unit: "mm/hr or in/hr"
      source_kind: "forcing"
      model_input_format: "'.uNN' / HDF boundary table"
      notes: "Optional, 2-D unsteady only. Acts as a surface boundary input; HEC-RAS does NOT compute watershed hydrologic losses internally beyond simple infiltration options."
  parameters:
    - category: "geometry"
      name: "cross_section_geometry (station/elevation pairs)"
      unit: "ft or m (per project unit system)"
      source_kind: "user_provided"
      model_input_format: "'.gNN' Sta/Elev blocks per river station; preprocessed into '.gNN.hdf' hydraulic-property tables (conveyance / area-vs-elevation)"
      notes: "Irreducible substrate parameter. Required at locations where discharge, slope, shape, or roughness change; at structures; at levee ends; around junctions."
    - category: "geometry"
      name: "reach_length (LOB / channel / ROB)"
      unit: "ft or m"
      source_kind: "user_provided"
      model_input_format: "'.gNN' Type RM Length L Ch R"
      notes: "Distance between successive cross sections, separately for left-overbank, channel, right-overbank."
    - category: "geometry"
      name: "main channel bank stations"
      unit: "ft or m"
      source_kind: "user_provided"
      model_input_format: "'.gNN' bank-station designation"
    - category: "geometry"
      name: "2-D computational mesh + underlying terrain"
      unit: "m (cell size); m (elevation)"
      source_kind: "user_provided"
      model_input_format: "'.gNN.hdf' 2-D flow area"
      notes: "Sub-grid bathymetry — fine-scale terrain integrated as cell properties on a coarser computational grid."
    - category: "roughness"
      name: "manning_n (channel and overbanks)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "'.gNN' #Mann blocks per cross section"
      notes: "Identical numerical value in English and SI — NEVER convert. Conveyance K = (1.486/n)·A·R^(2/3) (English) or (1.0/n)·A·R^(2/3) (SI); the unit factor is internal to the solver. Typical channel 0.025–0.05; typical overbank 0.04–0.15; physical range 0.005–0.5."
    - category: "loss coefficient"
      name: "expansion_contraction_coefficients"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "'.gNN' per cross section"
      notes: "Default 0.1 contraction / 0.3 expansion for gradual transitions; 0.3 / 0.5 at bridges. Multiplies the |α·V^2/2g − α_prev·V_prev^2/2g| transition-loss term."
    - category: "structure parameter"
      name: "bridge / culvert / weir / gate coefficients"
      unit: "varies"
      source_kind: "user_provided"
      model_input_format: "'.gNN' hydraulic-structure blocks"
      notes: "Discharge coefficients and geometry for hydraulic structures."
    - category: "numerical parameter"
      name: "theta (implicit weighting) and friction-slope averaging method"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "'.pNN' / plan solver settings"
      notes: "Theta in [0.6, 1.0] for the implicit box scheme; friction-slope averaging method ∈ {average conveyance (default), average friction slope, geometric mean, harmonic mean}."
    - category: "numerical parameter"
      name: "eddy viscosity / turbulence closure parameters (2-D)"
      unit: "m^2/s"
      source_kind: "default"
      model_input_format: "2-D flow-area properties"
      notes: "Reynolds-averaged turbulence closure for SWE solver."
  initial_conditions:
    - category: "1-D initial state"
      name: "initial flow at upstream end of each reach (1-D unsteady)"
      unit: "cfs or m^3/s"
      source_kind: "user_provided"
      model_input_format: "'.uNN' initial conditions section; or steady backwater warm-up"
      notes: "Defines the steady backwater profile used as t=0 state for unsteady routing."
    - category: "1-D initial state"
      name: "initial water-surface profile (restart)"
      unit: "ft or m"
      source_kind: "user_provided"
      model_input_format: "restart file"
      notes: "Optional alternative to the warm-up; supplies WS at every cross section at t=0."
    - category: "2-D initial state"
      name: "initial water-surface elevation per 2-D area"
      unit: "ft or m"
      source_kind: "user_provided"
      model_input_format: "'.uNN' 2-D flow-area initial conditions"
      notes: "Or supplied implicitly by a warm-up period."
    - category: "sediment initial state"
      name: "initial bed elevation and gradation (sediment runs)"
      unit: "ft or m; fraction by mass"
      source_kind: "user_provided"
      model_input_format: "sediment input file"
      notes: "Active-layer composition initialised per cross section."
  boundary_conditions:
    - category: "BC type"
      name: "upstream BC type code"
      unit: "enum {1=Known WS, 2=Critical Depth, 3=Normal Depth (slope), 4=Rating Curve}"
      source_kind: "user_provided"
      model_input_format: "'.fNN'/'.rNN' Up Type/Slope; '.uNN' for unsteady"
      notes: "Selects how the upstream end of the domain is closed."
    - category: "BC type"
      name: "downstream BC type code"
      unit: "enum {1=Known WS, 2=Critical Depth, 3=Normal Depth (slope), 4=Rating Curve}"
      source_kind: "user_provided"
      model_input_format: "'.fNN'/'.rNN' Dn Type/Slope; '.uNN' for unsteady"
      notes: "Default Normal Depth (Type 3) uses bed slope as energy slope; induces an error band typically ≥ 5 km near the downstream boundary."
    - category: "BC value (normal depth)"
      name: "downstream_boundary_slope (when BC type = Normal Depth)"
      unit: "ft/ft = m/m (dimensionless)"
      source_kind: "user_provided"
      model_input_format: "'.fNN'/'.rNN' Dn Slope value"
      notes: "Slope is dimensionless — never scale across unit systems."
    - category: "regime selector"
      name: "flow_regime"
      unit: "enum {Subcritical, Supercritical, Mixed}"
      source_kind: "user_provided"
      model_input_format: "'.pNN'/'.rNN' run-control flag"
      notes: "Mixed allows hydraulic-jump location; subcritical solves upstream from the downstream BC, supercritical solves downstream from the upstream BC."
    - category: "unit-system selector"
      name: "unit_system"
      unit: "enum {English, SI}"
      source_kind: "user_provided"
      model_input_format: "'.prj' 'English Units' or 'SI Units' line"
      notes: "Controls the 1.486 vs 1.0 internal conveyance factor and the expected units of geometry/observed-WS inputs."
    - category: "solver selector"
      name: "2-D solver type (SWE vs DSW)"
      unit: "enum {Full SWE, Diffusion Wave}"
      source_kind: "user_provided"
      model_input_format: "'.pNN' 2-D solver setting"
      notes: "DSW is faster but valid only when barotropic pressure gradient and bottom friction dominate."
    - category: "structure operations"
      name: "gate openings, pump rules, rule-controlled structure states"
      unit: "varies (gate openings in ft or m; rule-time series)"
      source_kind: "user_provided"
      model_input_format: "'.uNN' / plan rule sets"
      notes: "Time-varying operational decisions for hydraulic structures during unsteady runs."

processes:
  modules:
    - name: "Steady-flow solver (1-D standard step)"
      role: "process_solver"
      brief: "Standard-step solution of the 1-D energy (Bernoulli) equation between adjacent cross sections; computes water-surface profile per discharge profile; supports subcritical, supercritical, and mixed regimes including hydraulic-jump location."
    - name: "Unsteady-flow solver (1-D Saint-Venant)"
      role: "process_solver"
      brief: "Implicit finite-difference (box) scheme for the 1-D continuity + momentum equations with theta-weighting; routes hydrographs with attenuation and lag, producing stage and flow time series at each cross section."
    - name: "Unsteady-flow solver (2-D shallow-water / DSW)"
      role: "process_solver"
      brief: "Finite-volume sub-grid-bathymetry discretization of the 2-D depth-averaged shallow-water equations (full SWE) or the diffusion-wave approximation (DSW); produces depth and depth-averaged velocity per cell."
      applicability: "2-D flow areas only"
    - name: "Geometry preprocessor"
      role: "driver"
      brief: "Converts surveyed cross sections into hydraulic-property tables (conveyance K vs elevation, area vs elevation, top width vs elevation, hydraulic depth vs elevation) that the steady and unsteady solvers read at runtime."
    - name: "Manning conveyance evaluation"
      role: "process_solver"
      brief: "Computes conveyance K = (φ/n)·A·R^(2/3) with φ = 1.486 (English) or 1.0 (SI); friction slope S_f = (Q/K)^2 with the user-selected reach-averaging method (average conveyance, average friction slope, geometric mean, or harmonic mean)."
    - name: "Expansion / contraction loss"
      role: "process_solver"
      brief: "Computes transition head loss ΔH = C·|α·V^2/2g − α_prev·V_prev^2/2g| using user-supplied contraction/expansion coefficients; contributes to the energy equation between cross sections."
    - name: "Bridge / culvert / gate hydraulics"
      role: "process_solver"
      brief: "Energy/momentum/Yarnell methods at bridges; orifice/weir flow at gates and inline/lateral structures; couples structure discharge to upstream/downstream stages."
      applicability: "wherever hydraulic structures are present"
    - name: "Froude-number classification"
      role: "diagnostic"
      brief: "Fr = V / sqrt(g·D) using main-channel velocity V and hydraulic depth D; identifies subcritical (Fr<1), critical (Fr=1), and supercritical (Fr>1) regimes and locates hydraulic jumps."
    - name: "Sediment transport solver"
      role: "optional_module"
      brief: "Quasi-unsteady and unsteady mobile-bed sediment transport coupled to the flow solver; updates bed elevation and gradation in the active layer."
      applicability: "sediment runs only"
    - name: "Water-quality solver"
      role: "optional_module"
      brief: "Temperature and constituent (DO, nitrogen species, algae) transport on the same computational grid as the hydrodynamic solver."
      applicability: "water-quality runs only"
  internal_edges:
    - from: "cross_section_geometry"
      to: "Geometry preprocessor"
      kind: "consumes_input"
      brief: "Station/elevation pairs are read and tabulated."
    - from: "Geometry preprocessor"
      to: "Manning conveyance evaluation"
      kind: "invokes"
      brief: "Conveyance vs elevation tables are precomputed for the solver to interpolate at runtime."
    - from: "manning_n"
      to: "Manning conveyance evaluation"
      kind: "consumes_input"
      brief: "Per-cross-section channel/overbank n enters the K = (φ/n)·A·R^(2/3) formula."
    - from: "Manning conveyance evaluation"
      to: "Steady-flow solver (1-D standard step)"
      kind: "invokes"
      brief: "Friction slope S_f = (Q/K)^2 is supplied to the energy equation between adjacent cross sections."
    - from: "Manning conveyance evaluation"
      to: "Unsteady-flow solver (1-D Saint-Venant)"
      kind: "invokes"
      brief: "Friction-slope term enters the momentum equation."
    - from: "discharge"
      to: "Steady-flow solver (1-D standard step)"
      kind: "consumes_input"
      brief: "One discharge per profile drives the standard-step solution."
    - from: "discharge"
      to: "Unsteady-flow solver (1-D Saint-Venant)"
      kind: "consumes_input"
      brief: "Upstream inflow hydrograph drives 1-D routing."
    - from: "upstream BC type code"
      to: "Steady-flow solver (1-D standard step)"
      kind: "consumes_input"
      brief: "Supercritical/mixed regimes require an upstream control."
    - from: "downstream BC type code"
      to: "Steady-flow solver (1-D standard step)"
      kind: "consumes_input"
      brief: "Subcritical/mixed regimes require a downstream control."
    - from: "expansion_contraction_coefficients"
      to: "Expansion / contraction loss"
      kind: "consumes_input"
      brief: "Coefficients scale the transition head loss."
    - from: "Expansion / contraction loss"
      to: "Steady-flow solver (1-D standard step)"
      kind: "invokes"
      brief: "Transition head loss enters the energy equation between sections."
    - from: "Bridge / culvert / gate hydraulics"
      to: "Steady-flow solver (1-D standard step)"
      kind: "invokes"
      brief: "Structure-flow methods substitute for the gradually varied flow assumption locally."
    - from: "Bridge / culvert / gate hydraulics"
      to: "Unsteady-flow solver (1-D Saint-Venant)"
      kind: "invokes"
      brief: "Internal-structure stage-discharge couples to the routing solution."
    - from: "Steady-flow solver (1-D standard step)"
      to: "water_surface_elevation"
      kind: "produces_output"
      brief: "Primary product of the 1-D steady solver."
    - from: "Steady-flow solver (1-D standard step)"
      to: "energy_grade"
      kind: "produces_output"
      brief: "Energy-grade elevation EG = WS + α·V^2/2g per section."
    - from: "Steady-flow solver (1-D standard step)"
      to: "velocity_channel"
      kind: "produces_output"
      brief: "Main-channel velocity derived from conveyance distribution."
    - from: "Unsteady-flow solver (1-D Saint-Venant)"
      to: "water_surface_elevation"
      kind: "produces_output"
      brief: "Stage time series at each cross section."
    - from: "Unsteady-flow solver (1-D Saint-Venant)"
      to: "discharge_internal"
      kind: "writes_state"
      brief: "Q(x,t) is a prognostic state variable advanced by the momentum equation."
    - from: "Unsteady-flow solver (2-D shallow-water / DSW)"
      to: "water_surface_elevation"
      kind: "produces_output"
      brief: "Cell-by-cell stage / depth on the 2-D mesh."
    - from: "Unsteady-flow solver (2-D shallow-water / DSW)"
      to: "velocity_total"
      kind: "produces_output"
      brief: "Depth-averaged (u,v) per cell face."
    - from: "water_surface_elevation"
      to: "Froude-number classification"
      kind: "reads_state"
      brief: "Hydraulic depth D is derived from WS and geometry."
    - from: "velocity_channel"
      to: "Froude-number classification"
      kind: "reads_state"
      brief: "Velocity feeds Fr = V/sqrt(gD)."
    - from: "Sediment transport solver"
      to: "bed_elevation"
      kind: "writes_state"
      brief: "Sediment runs update z_b(x,y)."

states:
  variables:
    - name: "water_surface_elevation (stage) h or WS"
      unit: "ft or m"
      role: "prognostic"
    - name: "discharge Q(x,t) (1-D unsteady)"
      unit: "cfs or m^3/s"
      role: "prognostic"
    - name: "depth-averaged velocity (u,v)(x,y,t) (2-D)"
      unit: "ft/s or m/s"
      role: "prognostic"
    - name: "water depth h(x,y,t) (2-D)"
      unit: "ft or m"
      role: "prognostic"
    - name: "bed elevation z_b(x,y) (mobile for sediment runs)"
      unit: "ft or m"
      role: "prognostic"
    - name: "sediment bed gradation / active-layer composition"
      unit: "fraction by mass"
      role: "prognostic"
    - name: "water-quality constituent concentrations"
      unit: "mg/L or deg C"
      role: "prognostic"
    - name: "gate opening / pump status / rule-controlled structure states"
      unit: "varies"
      role: "prognostic"
    - name: "energy grade elevation EG = WS + α·V^2/2g"
      unit: "ft or m"
      role: "diagnostic"
    - name: "friction slope S_f = (Q/K)^2"
      unit: "ft/ft (= m/m)"
      role: "diagnostic"
    - name: "Froude number Fr = V/sqrt(gD)"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "conveyance K"
      unit: "cfs (English) or m^3/s (SI)"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "water_surface_elevation"
    validation_rank: 2
    unit: "ft or m"
    description: "Computed water-surface (stage) profile at each cross section (1-D) or per cell (2-D). PRIMARY model product."
    emitted_in: "<prj>.pNN.tmp.hdf at /Results/.../Cross Sections/Water Surface (1-D) or /Results/.../2D Flow Areas/.../Water Surface (2-D)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Steady-flow profile compared at a single section / single profile; ensure observed WS belongs to the same profile index as the simulated discharge."
            - "Geometry, observed WS, and project unit system (.prj 'English Units' vs 'SI Units') must all share the same length unit."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "Unsteady-flow stage hydrograph at a fixed cross section."
            - "Timing-accuracy metrics target peak-stage timing for routed flood waves."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "csi"
          caveats:
            - "2-D depth/stage field at a single instant; mesh resolution must resolve the flow features being compared."
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "2-D unsteady stage / depth grid through time."
      detrending_options:
        - "none"
  - var: "energy_grade"
    validation_rank: 3
    unit: "ft or m"
    description: "Open-channel surface-water energy-grade-line elevation EG = WS + α·V^2/2g at each section."
    emitted_in: "<prj>.pNN.tmp.hdf at /Results/.../Cross Sections/Energy Grade"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Should satisfy EG ≥ WS at every cross section; EG is a structural check rather than a primary calibration target."
      detrending_options:
        - "none"
  - var: "discharge_out"
    validation_rank: 1
    unit: "cfs or m^3/s"
    description: "Open-channel surface-water discharge at each cross section / structure / 2-D cell-face. For STEADY flow this is a conserved pass-through of the input forcing, NOT a model product."
    emitted_in: "<prj>.pNN.tmp.hdf at /Results/.../Cross Sections/Flow"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
            - "timing_accuracy"
          determining_metric: "nse"
          caveats:
            - "Only meaningful for UNSTEADY runs, where Q(t) is prognostic and reflects routing attenuation and lag."
            - "For steady flow, validating Q against observed Q is CIRCULAR — discharge is the forcing input, not a model product. Validate stage instead."
      detrending_options:
        - "none"
  - var: "velocity_channel"
    validation_rank: 4
    unit: "ft/s or m/s"
    description: "Main-channel velocity (1-D)."
    emitted_in: "<prj>.pNN.tmp.hdf at /Results/.../Additional Variables/Velocity Channel"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Velocity measurements are direction-specific; ensure observation is channel-aligned."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "temporal_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "nse"
      detrending_options:
        - "none"
  - var: "velocity_total"
    validation_rank: 5
    unit: "ft/s or m/s"
    description: "Open-channel surface-water cross-section average (1-D) or cell-face (2-D) velocity."
    emitted_in: "<prj>.pNN.tmp.hdf at /Results/.../Additional Variables/Velocity Total (1-D) or per-face (2-D)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "magnitude_accuracy"
          determining_metric: "csi"
          caveats:
            - "2-D depth-averaged velocity field."
      detrending_options:
        - "none"
  - var: "flood_inundation_extent"
    validation_rank: 6
    unit: "m^2 or km^2 (area); ft or m (depth grid)"
    description: "River/floodplain surface-water inundated area / water-depth grid / water-velocity grid produced from 1-D or 2-D stage results."
    emitted_in: "RAS Mapper inundation rasters / depth grids derived from <prj>.pNN.tmp.hdf"
    observability:
      comparable_obs_shapes:
