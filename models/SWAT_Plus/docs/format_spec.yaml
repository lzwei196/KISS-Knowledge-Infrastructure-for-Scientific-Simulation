  severity: fatal
- id: dt_042
  symptom: calibration.cal is written and SWAT+ runs, but the simulated hydrograph is bit-identical to
    the uncalibrated run for some parameters (notably alpha_bf, gw_delay, perco, cn3_swf) while others
    (cn2, esco) do take effect.
  diagnosis: 'SWAT+ matches calibration.cal rows against the names in cal_parms.cal. Rev59 spells the
    aquifer recession/delay parameters `alpha` and `delay`; the SWAT2012-era `alpha_bf`/`gw_delay` do
    not match and are silently ignored. `perco` and `cn3_swf` are not in cal_parms.cal at all (they are
    hydrology.hyd fields written at HRU generation).; Same silent-ignore class as the missing count line.
    generate_calibration_file.py''s VALID_PARAMS and CALIBRATION_PRESETS both used the unmatched names,
    so the documented `semi_arid` preset silently applied only cn2 and esco.

    ; [''tools/s6/generate_calibration_file.py'', ''SKILL.md calibration preset table'']'
  remedy: 'Use the rev59 names. The tool now aliases alpha_bf->alpha and gw_delay->delay, and DROPS (with
    a warning) any name absent from the project''s own cal_parms.cal.; ["awk ''NR>2{print $1}'' TxtInOut/cal_parms.cal
    | grep -x alpha", ''Set perco / cn3_swf structurally: tools/s2/generate_hru_from_global.py --perco
    0.30 --cn3_swf 0.5'', ''Confirm the effect: the calibrated channel_day.txt must differ from the uncalibrated
    one'']; Always diff a calibrated run against the uncalibrated baseline before trusting a preset.'
  severity: silent
- id: dt_043
  symptom: CMFD forcing for a year contains more days than the calendar year (e.g. 396 days for 2003),
    or annual precipitation shifts when the requested period changes. Tmax == Tmin on every day.
  diagnosis: 'TWO independent CMFD traps. (1) ki_tools_common.load_forcing._load_cmfd globbed `*{year}*.nc`,
    which matches the year as a SUBSTRING of another stamp: `*2003*` also matches `..._202003.nc` (March
    2020). Years 2001-2012 silently absorbed a 2020 month. (2) The CMFD 01dy (daily) store carries only
    a daily MEAN temperature, so Tmax==Tmin; the 03hr store has the sub-daily samples needed for a real
    diurnal range.; (1) inflated 2003 precipitation from 511.7 to 530.2 mm/yr at Zijingguan and produced
    396 daily records for a 365-day year. (2) collapses the diurnal range: Hargreaves PET (~ sqrt(Tmax-Tmin))
    goes to ~0 and the temperature-index snowmelt loses its melt/freeze cycle, silently.

    ; [''ki_tools_common/load_forcing.py (_load_cmfd)'', ''tools/s3/prepare_weather_files.py'', ''tools/s3/validate_weather_data.py'']'
  remedy: 'Anchor the year glob to the `_YYYYMM` stamp and force sub-daily forcing for temperature. Both
    are fixed: the loader now rejects out-of-range/duplicate dates, and validate_weather_data flags >95%
    Tmax==Tmin.; [''Use forcing_dir=KISSPATH_FORCING/Data_forcing_03hr_010deg'', ''Assert
    len(dates) == 365/366 per requested year'', ''python tools/s3/validate_weather_data.py <weather_dir>   #
    must report 0 silent_errors'', ''For many stations use load_daily_forcing_points(): it reads each
    monthly NetCDF once for ALL stations (a 6-station basin then costs what 1 station did)'']; Never trust
    an unanchored year glob on files stamped YYYYMM.'
  severity: silent
- id: dt_044
  symptom: SWAT+ over-predicts discharge and rchg_dp barely moves total volume. aquifer_yr.txt prints
    an absurd dep_wt (e.g. 976 m) and aquifer flo + seep EXCEEDS rchrg every year (the store drains its
    initial condition for the whole run). Raising rchg_dp 0.05 -> 0.6 changes aquifer flo only 99.84 ->
    95.36 mm/yr even though seep correctly becomes 59.91 mm/yr.
  diagnosis: 'tools/s2/generate_hru_from_global.py write_aquifer_files() wrote FABRICATED aquifer.aqu
    defaults and MIS-NAMED two columns. Against the only ground truth on disk (demo_lrew/swatplus_rev60_demo/aquifer.aqu,
    written by SWAT+ Editor v2.1.0): gw_flo 2500.0 vs 0.05; dep_bot (called ''gw_dp'') 1000.0 m vs 10.0
    m; dep_wt (''gw_ht'') 1.0 vs 3.0; flo_min 1000.0 vs 3.0; revap_min 750.0 vs 5.0. Columns 7/8 were
    named ptl_n/ptl_p (so written 0.0) where SWAT+ expects carbon=0.5 and flo_dist=50.0. dep_bot 1000
    m x spec_yld 0.05 = a 50,000 mm aquifer, so the store never equilibrates and rchg_dp is a near-dead
    lever.; [''aquifer_yr.txt dep_wt = 976 m'', ''flo (99.84) + seep (5.00) > rchrg (99.93) mm/yr, every
    year'', ''calibration.cal `flo_min` 1000 -> 3 alone cut mean simulated Q 14.83 -> 9.24 m3/s'']; [''tools/s2/generate_hru_from_global.py'']'
  remedy: 'Take aquifer.aqu column names and default magnitudes verbatim from the shipped SWAT+ Editor
    demo. FIXED in s2.; [''head -4 demo_lrew/swatplus_rev60_demo/aquifer.aqu   # ground truth'', ''Assert
    aquifer_yr.txt dep_wt is O(1-10 m), not O(1000 m)'', ''Assert area-weighted (flo + seep + revap) <=
    rchrg + storage drawdown'']; Never invent defaults for a model input file when a vendor-written example
    of that exact file ships with the KI. Diff against it column by column.'
  severity: silent
- id: dt_045
  symptom: A SWAT+ calibration sweep reports 'calibrated' but successive trials produce BIT-IDENTICAL
    output. Sweeping surlag, awc, canmx, delay or revap_co changes nothing, even though every one of those
    names is present in the project's own cal_parms.cal.
  diagnosis: 'Membership in cal_parms.cal is NECESSARY BUT NOT SUFFICIENT: the rev59 binary declares many
    parameter names it never actually applies from calibration.cal. Measured by running the real binary
    once per parameter at an extreme value and md5-ing the 18-yr daily outlet series against the uncalibrated
    run. APPLIED: cn2, esco, epco, k, alpha, lat_ttime, flo_min. SILENT NO-OP: canmx, surlag, awc, delay,
    revap_co, slope_len, perco, dep_imp. Setting soil LYR1/LYR2 does NOT rescue awc. s6 previously wrote
    all of them, so a sweep over a no-op name explored nothing while reporting success.; [''surlag absval
    0.05 and 24.0 -> identical md5 of the daily outlet series'', ''awc pctchg +80 (with LYR1=1 LYR2=2)
    -> identical md5'', ''cn2 pctchg -30 -> md5 changes (control)'']; [''tools/s6/generate_calibration_file.py'']'
  remedy: 'Route cal-ignored names to their real home file, and DROP the rest with a loud warning. FIXED
    in s6: perco/canmx/cn3_swf/harg_pet -> hydrology.hyd; awc/soil_k/dp -> soils.sol; lat_len/slope_len
    -> topography.hyd; revap_co -> aquifer.aqu; surlag/msk_co1/msk_co2/msk_x -> parameters.bsn (surlag
    lives there as `surq_lag`); only delay/dep_imp are dropped. NOTE: EVERY bsn-object name is a calibration.cal
    no-op — see dt_047.; [''To test whether a name is real: run the binary at two extreme values and md5
    the outlet series'', ''Never assume a cal_parms.cal name is honoured just because it parses'']; Verify
    a calibration knob MOVES the output before you sweep over it. A greedy search over a no-op parameter
    silently returns the baseline.'
  severity: silent
- id: dt_046
  symptom: You suspect a routing/topology error (water reaching the stream more than once) because the
    outlet volume exceeds the basin's `wateryld`. Ratio outlet/wateryld ~ 1.5-1.7.
  diagnosis: 'outlet/wateryld is NOT a mass-balance test. SWAT+''s basin_wb `wateryld` column is surq_gen
    + latq ONLY; it EXCLUDES aquifer return flow. So outlet = wateryld + aquifer flo > wateryld for ANY
    basin with an aquifer, and the ratio trips on a perfectly mass-conserving model. The invariant that
    DOES catch a rout_unit.con hyd_typ error is: area-weighted aquifer `rchrg` must equal basin `perc`.
    If rchrg instead equals `wateryld`, rout_unit.con is sending the surface hydrograph (`tot`) to the
    aquifer, which then re-releases it as baseflow.; [''Correct deck: wateryld 167.24 = surq_gen 74.14
    + latq 93.11; outlet 264.80 = wateryld + aqu_flo 99.84 (0.9%); rchrg 99.93 == perc 99.93'', ''Broken
    deck (aqu ... tot): rchrg == wateryld, NOT perc'']; [''tools/s2/generate_hru_from_global.py'', ''tools/s9/check_mass_balance.py'']'
  remedy: rout_unit.con must be `cha <id> tot 1.00000` + `aqu <id> rhg 1.00000` (rhg = recharge hydrograph;
    rev59 accepts it). The `cha ... tot 0.70` seen in the old SWAT+ Editor v1.0.0 demo sums to 1.0 only
    because a RESERVOIR takes the other 0.30 — do not copy the 0.70 without the reservoir.; ['Assert area_weighted(aquifer_yr.rchrg)
    == basin_wb.perc  (within 5%)', 'Assert outlet_mm ~= basin_wb.wateryld + area_weighted(aquifer_yr.flo)  (within
    10%)', 'Do NOT assert outlet <= wateryld']; Before declaring a mass-balance violation, confirm the
    denominator actually contains every flux that reaches the outlet.
  severity: silent
- id: dt_047
  symptom: Daily SWAT+ NSE is stuck near its r^2 ceiling and the simulated flood peak arrives exactly
    ONE DAY after the observed peak, no matter which parameters are swept. Shifting the simulated series
    back one day would raise r a lot (do NOT do this — it is a fudge).
  diagnosis: 'The lag lives in Muskingum CHANNEL routing, whose coefficients msk_co1/msk_co2/msk_x are
    `bsn` objects — and EVERY bsn-object name is a calibration.cal no-op in rev59 (dt_045). So the routing
    could not be calibrated at all and sat at the shipped default msk_co1/msk_co2 = 0.75/0.25. Only the
    msk_co1:msk_co2 RATIO matters: SWAT+ normalises them, so 0.1/0.1 and 10/10 give bit-identical output.
    Setting codes.bsn rte_cha=0 confirms the diagnosis by throwing the peak 2 days EARLY.; [''Zijingguan
    2023-08-01 flood carries 89.2% of the observed daily variance'', ''default msk: peak 08-02 (one day
    late), NSE_val equal to its r^2 ceiling'', ''msk_co1=msk_co2, msk_x 0.1: peak 08-01 (on time), r_val
    and NSE_val both much higher'', ''surq_lag (parameters.bsn) and hydrology.cha `mann` barely move the
    peak; rte_cha=0 moves it to 07-30'']; [''tools/s6/generate_calibration_file.py'']'
  remedy: 'Calibrate msk_co1/msk_co2/msk_x STRUCTURALLY in parameters.bsn. s6 now routes them there (STRUCTURAL_BSN).;
    [''If the sim peak is a day late, sweep the msk_co1:msk_co2 ratio BEFORE touching volume params'',
    ''Never fix a timing lag by shifting the simulated series'', ''Check NSE against its r^2 ceiling:
    if NSE ~= r^2, the remaining loss is PHASE, not bias/variance'']; Compute r on the uncalibrated run
    first. No parameter set can lift NSE above r^2, so if NSE is pinned at r^2, stop tuning volume and
    go fix the phase.'
  severity: silent
- id: dt_048
  symptom: SWAT+ rev59 crashes ~0.8 s into a run, immediately after 'reading from wx station file', on
    a LARGE basin (>~1e6 km2). It reads all the weather files fine, then dies before the daily loop. Small
    basins built by the SAME chain run cleanly.
  diagnosis: 'object.cnt field overflow. write_object_cnt (s2/generate_hru_from_global.py) wrote each
    column as f''{v:>12}'' with NO separator. A basin-scale ls_area/tot_area like 151683475.87 (=1.52M
    km2 in ha) is EXACTLY 12 chars, so it fills its field and TOUCHES the neighbour: ''name''+''ls_area''+''tot_area''
    merge into one whitespace-delimited token. SWAT+ reads object.cnt list-directed, so every count shifts
    two fields left -> ''obj'' (total objects) is read as 0 -> hyd_read_connect.f90:176 allocates ob(0)/re-derives
    and re-allocates -> ''already allocated ob''. Bengbu (115k km2, area 11572953.30 = 11 chars) had a
    leading space and never tripped it, so it was invisible until the Yangtze mainstem @ Jiujiang (1.52M
    km2).; ["object.cnt data line had 19 whitespace tokens, not 21; token[1] = ''jiujiang151683475.87151683475.87''",
    ''space-separating name/ls_area/tot_area (21 tokens) -> binary runs to completion, exit 0'', ''channel.con
    has the SAME cumulative-area overflow (gis_id+area merge for >1e8 ha channels) but is TOLERATED (run
    still completes) — object.cnt is the only fatal one'']; [''tools/s2/generate_hru_from_global.py'']'
  remedy: 'In write_object_cnt, prepend a space to EVERY field ('' {v:>12}'' not ''{v:>12}'') for both
    header and data rows, so there is always >=1 separator regardless of value width. FIXED 2026-07-11.;
    [''Quick repair of an existing broken deck: rewrite object.cnt line 3 so name and the two area values
    are space-separated (21 tokens); re-run the binary.'', "Verify: awk ''NR==3{print NF}'' object.cnt
    must print 21."]; Never right-justify numeric fields against each other without a guaranteed separator
    when the value can fill the field. List-directed Fortran reads need whitespace, not column alignment.'
  severity: fatal
- id: dt_049
  symptom: TN load parsed from basin_ls_day.txt is systematically too high, and lateral/tile nitrate never
    appears in the total. No error is raised — the number is simply wrong.
  diagnosis: '`sedmin` in basin_ls / hru_ls output is MINERAL PHOSPHORUS (kg P/ha), not nitrogen.; SKILL.md
    and tools/s10/parse_nutrient_output.py both documented sedmin as "sediment-bound mineral N" and summed
    it into TN, while omitting the two genuine N terms lat3no3 (NO3-N in lateral runoff) and tileno3 (NO3-N
    in tile flow). The SWAT+ source is unambiguous: swatplus/src/src/output_landscape_module.f90, type
    output_nutcarb_gain_loss, declares "real :: sedmin  !kg P/ha |mineral phosphorus leaving the landscape
    transported in sediment". The file''s own unit row cannot be trusted either — rev59 prints "----"
    for usle, sedmin and tileno3. At Wangjiaba the mis-attribution inflated TN by roughly 40%.; [''output_landscape_module.f90:160  real
    :: sedmin = 0.  !kg P/ha  |mineral phosphorus ...'', ''basin_ls_day.txt unit row prints "----" for
    usle / sedmin / tileno3'']; [''tools/s10/parse_nutrient_output.py'', ''SKILL.md (Water Quality section)'']'
  remedy: TN = sedorgn + surqno3 + lat3no3 + tileno3 (kg N/ha/day); TP = sedorgp + surqsolp + sedmin (kg
    P/ha/day). FIXED 2026-08-20.; parse_nutrient_output; ['Take species and units from output_landscape_module.f90,
    never from the printed unit row.']; Any *min / *orgp / *solp column in a SWAT+ landscape output is
    phosphorus.
  severity: silent_wrong_result
- id: dt_050
  symptom: 'tools/s10/validate_water_quality.py runs to completion after parse_nutrient_output.py --basin_ls
    but compares nothing: every simulated load reads as zero / the paired count is 0. Exit code is 0 and
    no error is printed.'
  diagnosis: 'Column-name mismatch between the two halves of the documented S10 chain.; validate_water_quality.py
    reads the simulated columns TN_kg / TP_kg / sed_out (absolute loads). parse_nutrient_output.py --basin_ls
    wrote only per-HECTARE columns (TN_kgha). csv.DictReader simply never sees TN_kg, the aggregator adds
    nothing, and the validator reports an empty comparison instead of failing. The --channel_output mode
    DOES write TN_kg, which is why the mismatch survived: only the RECOMMENDED basin_ls path was broken.;
    [''tools/s10/parse_nutrient_output.py'', ''tools/s10/validate_water_quality.py'']'
  remedy: 'parse_nutrient_output.py --basin_ls now also writes TN_kg, TP_kg and sed_out (per-hectare value
    x basin_area_ha). FIXED 2026-08-20.; [''Sanity check: the sim CSV from --basin_ls must contain a TN_kg
    column before you call validate_water_quality.py.'']; When two tools are chained in SKILL.md, assert
    the producer''''s column names against the consumer''''s reader, not against the docstring.'
  severity: silent_no_comparison
- id: dt_051
  symptom: configure_fertilizer.py reports success, management.sch contains the schedule, the model runs
    — and basin_nb fertn is 0 with N export unchanged from a no-management run.
  diagnosis: Nothing references the schedule. tools/s2/generate_hru_from_global.py writes `mgt = no_mgt`
    for EVERY land use in landuse.lum (a deliberate dt_v004 workaround), so the schedule in management.sch
    is orphaned.; configure_fertilizer.py only ever wrote management.sch; its own notes said "update landuse.lum
    to reference this schedule" but nothing did it, and the model gives no warning for an unreferenced
    schedule. Every S2-built deck therefore ran the documented WQ workflow with zero fertiliser applied.;
    ['tools/s10/configure_fertilizer.py', 'tools/s2/generate_hru_from_global.py']
  remedy: 'Pass --landuse_lum TxtInOut/landuse.lum to configure_fertilizer.py — it repoints the mgt column
    of agrl_lum/agrr_lum/agrc_lum/rice_lum at the new schedule. Added 2026-08-20. Then run the binary
    once: if it dies in mgt_operatn_, apply dt_v004 (restore no_mgt) and report that the N export is unfertilised.;
    [''Verify: grep agrl_lum TxtInOut/landuse.lum — column 4 must be the schedule name, not no_mgt.'',
    ''Verify: basin_nb_yr.txt fertn > 0 after the run.'']; A configuration tool that writes a definition
    must also write the reference, or prove the reference already exists.'
  severity: silent_no_op
- id: dt_052
  symptom: 'Building a basin OUTSIDE China: prepare_weather_files.py exits 1 with "Forcing directory not
    found:" for source=nasa_power, and every weather station is written with elev = 0.0 / 100.0 m even
    when the basin is at 2000 m.'
  diagnosis: Two China-only assumptions in the forcing path.; (1) prepare_weather_files.validate_inputs()
    demanded an EXISTING forcing directory for every source, but nasa_power is an online point API with
    no directory — process() already passed forcing_dir=None for it, so the source was listed as valid
    yet unreachable from the CLI. (2) ki_tools_common.terrain.get_terrain() only knew the China DEM 90
    m and the China-only CMFD elevation grid, then silently returned the 100 m / slope 0.001 DEFAULT for
    the entire rest of the world, biasing PET, lapse rates and snow. (3) The NASA POWER loader returns
    numpy.datetime64 dates while CMFD/MSWX return datetime.datetime, so prepare_weather_files crashed
    on d.year with "numpy.datetime64 object has no attribute year" — the nasa_power path had never been
    executed.; ['tools/s3/prepare_weather_files.py', 'ki_tools_common/terrain.py']
  remedy: 'FIXED 2026-08-20: validate_inputs skips the directory check for nasa_power (pass "-" as the
    placeholder argument); the date vector is normalised through pandas.Timestamp; and terrain.get_terrain
    gained a GLOBAL MERIT DEM 90 m fallback (KISSPATH_DATA/MERIT_DEM, 5x5 deg tiles named by SW corner,
    e.g. n20w105_dem.tif).; [''Verify before trusting PET: the .pcp/.tmp header line 3 must carry a real
    elevation.'', ''Unset http_proxy/https_proxy — NASA POWER stalls through the local proxy.'']; Any
    ki_tools_common lookup that "falls back to a default" is a China-only lookup until proven otherwise;
    check its source field, not just its value.'
  severity: fatal_outside_china
- id: dt_053
  symptom: r ~ 0 with a smooth hydrograph but TUNABLE PBIAS; sim daily std far below obs (e.g. 49 vs 191);
    sim peak an order of magnitude under obs (302 vs 3,370 m3/s) even though heavy rain is present in
    the forcing files. The run completes without any error.
  diagnosis: 'weather-sta.cli wiring is null or single-station: SWAT+ SILENTLY substitutes GENERATED weather
    (weather-wgn.cli climatology — possibly a template like gatifton, US Georgia) instead of reading the
    prepared forcing files.; The deck generator writes pcp=null tmp=null on every station row BY DESIGN;
    wiring is a separate step. If s3/generate_weather_stations.py is not run after a deck (re)generation,
    or if every station points at one file, the model never reads the prepared forcing — it simulates
    weather from wgn statistics. Nothing fails: the run finishes, water-balance terms look plausible,
    and PBIAS can even be calibrated to near zero, which makes the defect invisible to score-chasing.
    Only pattern statistics (r, daily variance, peaks) betray it. In one real basin, 209 mm of basin rain
    sat unread in 167 prepared CMFD files while the model simulated Georgia climatology.; [''s3/generate_weather_stations.py'',
    ''s7/validate_txtinout.py'']'
  remedy: 'Run s3/generate_weather_stations.py after ANY deck regeneration; it derives per-station lat/lon
    from the deck''s own rout_unit.con (authoritative wst binding). Then verify with s7/validate_txtinout.py
    — it now FAILS (exit 1) on null or single-station wiring while matching .pcp/.tmp files exist.; KISSPATH_PYTHON_ENV/bin/python
    {KI}/tools/s7/validate_txtinout.py <TxtInOut>  # exit 0 AND weather-sta.cli references >1 distinct
    .pcp files; Never judge a SWAT+ run by PBIAS alone; a wiring-dead deck can tune PBIAS to near zero
    while r stays at 0. Check r + daily std + peak ratio first.'
  severity: silent
- id: dt_054
  symptom: Outlet hydrograph systematically WEEKS late on every event while volume is near-perfect (e.g.
    train NSE near 0 with PBIAS near 0); a lag scan keeps improving out to -20..-25 days with no sharp
    peak; calibration pins every speed lever (surlag low bound, chn_mann low bound, alpha_bf high bound)
    and the flood is still late. The run completes without any error and forcing dates verify correct.
  diagnosis: 'write_codes_bsn shipped rte_cha=1 (rev59 Muskingum) while the official SWAT+ default is
    0; with the generator''s textbook msk coefficients (0.75/0.25/0.20) rev59 Muskingum adds enormous
    storage delay on multi-channel networks.; The delay compounds along the routed chain, so small validation
    decks can still pass (e.g. a 33-channel deck with rte_cha=1) while a 61-channel main-stem deck fails
    totally — which hid the defect until a large main-stem deck was built. Volume is conserved, so PBIAS
    and water-balance checks stay green; only timing statistics betray it. Proven by a one-flag discriminator:
    pristine deck, rte_cha 1->0, one untuned run, best-lag -25 d -> +2 d.; [''s2/generate_hru_from_global.py'']'
  remedy: 'Generator now writes rte_cha=0 (fixed 2026-09-06). For EXISTING decks: set codes.bsn rte_cha
    to 0 (column 8, third line) AND delete the _calib_pristine* snapshot so the driver rebuilds it from
    the corrected deck. If Muskingum is ever genuinely wanted, validate the timing on the target network
    BEFORE any calibration and expose msk_co1/ msk_co2/msk_x as calibration levers with a liveness probe.'
  severity: silent
