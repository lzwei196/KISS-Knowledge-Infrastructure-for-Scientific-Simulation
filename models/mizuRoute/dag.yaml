template_version: "3.5"

identity:
  model_id: "mizuRoute"
  scientific_reference_version: "mizuRoute river-network routing framework (Mizukami et al. 2016, GMD 9:2223-2238; vector-based parallel lineage Mizukami et al. 2021)"
  implementation:
    id: "mizuroute-standalone"
    version: "ESCOMP mizuRoute 3.1.1 (standalone route_runoff driver)"
    provenance: "Fortran 90 (OOP abstract routing classes, OpenMP/MPI/PIO); NCAR/UW ESCOMP standalone route_runoff driver."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "Apache-2.0"
  repo_url: "https://github.com/ESCOMP/mizuRoute"

boundary:
  scope_in:
    - "Reach-based (vector) river-network routing of external runoff to streamflow"
    - "Hillslope/basin lateral delay (runoff depth to volume to reach inflow via gamma unit hydrograph)"
    - "River-channel routing reach-by-reach in upstream-to-downstream topological order"
    - "Discharge at every river segment, not only at gauge points"
    - "Optional lake/reservoir storage routing (level-pool, Hanasaki demand-based, HYPE)"
    - "Optional passive-tracer/constituent transport and direct-insert streamflow data assimilation"
  scope_out:
    - "Runoff generation (runoff is an input from an external land-surface/hydrologic model)"
    - "Land-surface water/energy balance, soil moisture, evapotranspiration"
    - "Floodplain inundation mapping (contrast CaMa-Flood)"
    - "Full 2-D Saint-Venant momentum / unsteady backwater dynamics (methods are reduced kinematic/diffusive-wave forms)"
    - "Grid-based routing (network is an explicit vector topology, not a regular grid)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Routing conserves routed-runoff volume through the network; basin-aggregated routed runoff (basRunoff) vs input runoff ratio should be ~1.0. The optional lake module closes a separate storage water balance S with inflow, outflow, precip, evap, groundwater exchange, and prescribed abstraction/injection. Configurable routing timestep (dt, typically 300-86400 s); daily is the most common operational step. Solver-internal mass-conservation guards exist (outflow capped at 99.9% of available storage+inflow per step)."

inputs:
  forcing:
    - category: "forcing"
      name: "gridded runoff (surface RUNOFF + subsurface BASEFLOW)"
      unit: "mm/s"
      source_kind: "forcing"
      model_input_format: "NetCDF runoff time series on HRU/grid; variable name, units, and timestep declared in control file"
      notes: "mizuRoute expects a runoff RATE in mm/s. Surface runoff and baseflow must be summed before routing (omitting baseflow loses roughly 30-70% of total flow). Driving land-surface models (VIC OUT_RUNOFF+OUT_BASEFLOW, WRF-Hydro SFCRNOFF+UGDRNOFF, mHM) report mm/timestep, so a divide-by-timestep conversion to mm/s is a model input-contract requirement."
  parameters:
    - category: "parameters"
      name: "river-network topology (seg_id, tosegment, seg_length, seg_slope, hru_id, hru_seg_id, hru_area, hru_lat, hru_lon)"
      unit: "mixed (m for length, m/m for slope, m2 for area)"
      source_kind: "dataset_lookup"
      model_input_format: "NetCDF; variable names configurable via control-file vname_* mappings (HydroCraft seg_id/tosegment, NHDPlus COMID/toComid, MERIT Hydro RIVID/NextDownID)"
      notes: "Defines every reach and its contributing catchment (HRU). tosegment==0 marks an outlet. Topology must be a single connected tree with valid downstream references."
    - category: "parameters"
      name: "reach hydraulic/geometry parameters (R_SLOPE, R_MAN_N, R_WIDTH, R_DEPTH bankfull, RLENGTH, R_STORAGE, SIDE_SLOPE)"
      unit: "mixed (m/m slope, s/m^(1/3) Manning n, m width/depth, m3 storage)"
      source_kind: "dataset_lookup"
      model_input_format: "RPARAM block derived from network NetCDF and parameter namelists; augmented params read only when hydGeometryOption / topoNetworkOption enabled"
      notes: "Channel width may be estimated by a Leopold-Maddock power law W=a*A^b; default temperate coefficients are wrong for arid/tropical zones. Minimum reach slope clamped (model floor min_slope=1e-6; operational guidance applies max(slope,1e-4))."
    - category: "parameters"
      name: "routing-method parameters (wave velocity velo, diffusivity diff, KWT wave-scale, gamma-UH shape/timescale)"
      unit: "velo m/s; diff m2/s; UH shape dimensionless; UH timescale s"
      source_kind: "calibrated"
      model_input_format: "parameter namelists (IRF_UH / KWT / HSLOPE) and control-file entries; defaults applied uncalibrated (velo~1.0, diff~800)"
      notes: "IRF prescribed celerity+diffusivity; KWT/MC/DW celerity derived from Manning n and channel geometry. Several solver constants are hardcoded and not user-tunable: Muskingum weighting Y=0.5; KW/DW finite-difference nodes per reach=20; MC nodes=2; KWT particle cap MAXQPAR=20."
    - category: "parameters"
      name: "lake/reservoir attributes and operation parameters (is_lake, lake_id, lake_area, lake_max_storage, lake_min_storage, d_h_d_a; Doll03/Hanasaki06/HYPE blocks)"
      unit: "mixed (m2 area, m3 storage, m/m2 height-area derivative)"
      source_kind: "dataset_lookup"
      model_input_format: "NetCDF variables added to network topology + RPARAM reservoir blocks (D03_*, H06_* monthly inflow/demand, HYP_*)"
      notes: "Read only when lake routing enabled (is_lake_sim=.True.). lake_model_type selects level-pool/Doll(1), Hanasaki(2), or HYPE(3)."
  initial_conditions:
    - category: "initial_conditions"
      name: "reach routing state restart (per-reach discharge, channel volume, wave/particle states, future-runoff queues)"
      unit: "mixed (m3/s discharge, m3 volume)"
      source_kind: "user_provided"
      model_input_format: "optional restart NetCDF (QFUTURE, QFUTURE_IRF, per-method wave/particle states, REACH_VOL)"
      notes: "Optional; initializes reach states for a continued run. Absent for a cold start."
  boundary_conditions:
    - category: "boundary_conditions"
      name: "routing method selection (route_opt / routeMethods)"
      unit: "enumerated"
      source_kind: "user_provided"
      model_input_format: "control-file route_opt selecting accumulation(0), IRF, KWT, KW-Euler, MC, DW"
      notes: "Multiple methods may be active simultaneously; each emits its own routed-discharge variable."
    - category: "boundary_conditions"
      name: "hillslope-routing switch (doesBasinRoute) and accumulation switch (doesAccumRunoff)"
      unit: "0/1"
      source_kind: "user_provided"
      model_input_format: "control-file flags"
      notes: "doesBasinRoute=1 applies the gamma-UH hillslope delay before reach routing; set 0 to avoid double-counting against a driver that already includes hillslope delay (e.g. Lohmann)."
    - category: "boundary_conditions"
      name: "simulation window and calendar (sim_start, sim_end, dt, calendar)"
      unit: "datetime; dt in seconds"
      source_kind: "user_provided"
      model_input_format: "control-file sim_start/sim_end (YYYY-MM-DD HH:MM:SS), dt, calendar (standard/noleap)"
      notes: "dt must satisfy CFL (dt < dx/c) for the conditionally stable KW-Euler and DW methods."
    - category: "boundary_conditions"
      name: "spatial remapping enable (is_remap) and remap weights"
      unit: "boolean + dimensionless weights"
      source_kind: "user_provided"
      model_input_format: "control-file is_remap + remap-weight NetCDF (area-weighted grid-to-HRU mapping)"
      notes: "Required unless runoff units align 1:1 with routing basins. Per-HRU weight sum should be ~1.0; grid and HRU-polygon CRS must match."
    - category: "boundary_conditions"
      name: "lake-simulation enable and lake model type (is_lake_sim, lake_model_type)"
      unit: "boolean + enumerated"
      source_kind: "user_provided"
      model_input_format: "control-file is_lake_sim, lake_model_type (1=level-pool/Doll, 2=Hanasaki, 3=HYPE)"
      notes: "Enabling without proper network lake flags causes lake routing to silently fail."
    - category: "boundary_conditions"
      name: "data-assimilation mode (qmodOption) and prescribed water-management fluxes"
      unit: "enumerated; flux m3/s, volume m3"
      source_kind: "user_provided"
      model_input_format: "control-file qmodOption (direct_insert) + gauge-observation input; water-management reachflux_in/reachvol_in"
      notes: "Optional. Direct-insert DA injects gauge observations into reach state before channel routing; water-management abstraction/target volume coupled into the flux structure read by every routing scheme."

processes:
  modules:
    - name: "spatial_remapping"
      role: "allocator"
      brief: "process_remap_module basin2reach: area-weighted distribution of gridded runoff (m/s) onto HRU catchments and mapping to reaches as volumetric flux (m3/s)."
      applicability: "is_remap=.True."
    - name: "basin_hillslope_UH"
      role: "process_solver"
      brief: "basinUH_module: gamma-distribution unit-hydrograph convolution (shape, timescale) delaying instantaneous lateral runoff into each reach; fills the QFUTURE future-runoff queue."
      applicability: "doesBasinRoute=1"
    - name: "accumulation"
      role: "process_solver"
      brief: "accum_runoff_module (route_opt=0): instantaneous accumulation of runoff over all upstream reaches with no channel attenuation."
      applicability: "route_opt=accumulation"
    - name: "IRF_routing"
      role: "process_solver"
      brief: "irf_route_module: network impulse-response-function routing; convolves upstream inflow with a Saint-Venant-derived unit-hydrograph kernel (prescribed celerity velo, diffusivity diff). Unconditionally stable; closest to a Lohmann unit-hydrograph routing."
      applicability: "route_opt=IRF"
    - name: "KWT_routing"
      role: "process_solver"
      brief: "kwt_route_module: Lagrangian kinematic-wave particle tracking (Manning-derived celerity); manages up to MAXQPAR=20 wave particles per reach. Unconditionally stable."
      applicability: "route_opt=KWT"
    - name: "KW_Euler_routing"
      role: "process_solver"
      brief: "kw_route_module: Eulerian kinematic-wave finite-difference over 20 internal nodes per reach (diffusive wave with diffusivity D=0). CFL-conditionally stable."
      applicability: "route_opt=KW_Euler"
    - name: "MC_routing"
      role: "process_solver"
      brief: "mc_route_module: Muskingum-Cunge storage routing with fixed weighting Y=0.5, internally computed spatial weight X, geometry-based celerity, and sub-time-stepping to keep Courant < 1."
      applicability: "route_opt=MC"
    - name: "DW_routing"
      role: "process_solver"
      brief: "dfw_route_module: diffusive-wave routing including the diffusion/backwater term; assembles an advection-diffusion system over 20 nodes per reach. CFL-conditionally stable; highest cost."
      applicability: "route_opt=DW"
    - name: "advection_diffusion_solver"
      role: "process_solver"
      brief: "advection_diffusion: solve_ade with a TDMA tridiagonal solver — the numerical engine invoked by the diffusive-wave scheme."
      applicability: "route_opt=DW"
    - name: "lake_reservoir_routing"
      role: "optional_module"
      brief: "lake_route_module: storage-balance reservoir outflow via level-pool/Doll03 (storage-discharge), Hanasaki06 (demand-based release), or HYPE (bucket/spillway); replaces channel routing on islake reaches when is_lake_sim."
      applicability: "is_lake_sim=.True."
    - name: "tracer_transport"
      role: "optional_module"
      brief: "tracer_module constituent_rch: advects a passive solute/tracer per reach alongside hydraulic routing, ordered immediately after the channel routing step within the same parallel region."
      applicability: "tracer=.True."
    - name: "data_assimilation"
      role: "optional_module"
      brief: "data_assimilation: direct-insert streamflow modification (qmodOption) injecting gauge observations into reach discharge and computing a discharge-error correction before routing."
      applicability: "qmodOption=direct_insert"
    - name: "main_route_orchestrator"
      role: "integrator"
      brief: "main_route_module: per-core orchestrator that remaps HRU runoff to reaches, applies DA and water-management, runs the basin UH, then dispatches each active channel-routing method over the OpenMP basin decomposition in topological order."
    - name: "model_setup"
      role: "driver"
      brief: "init_model_data / model_setup: reads control file and parameter namelists, processes river topology, sets nMolecule node counts, and allocates routing state."
    - name: "mpi_decomposition"
      role: "integrator"
      brief: "mpi_process: scatters reaches across MPI ranks, invokes main_route per core, and gathers routed flows back."
  internal_edges:
    - from: "Inputs"
      to: "spatial_remapping"
      kind: "consumes_input"
      brief: "HRU runoff (m/s) read from NetCDF forcing each timestep and fed to basin2reach."
    - from: "spatial_remapping"
      to: "basin_hillslope_UH"
      kind: "invokes"
      brief: "reach-mapped instantaneous runoff passed into the gamma-UH hillslope delay when doesBasinRoute=1."
    - from: "basin_hillslope_UH"
      to: "QFUTURE (basin gamma-UH future-runoff queue)"
      kind: "writes_state"
      brief: "gamma-UH convolution queues future lateral-runoff volume."
    - from: "basin_hillslope_UH"
      to: "BASIN_QR (routed local-basin runoff, prev/current)"
      kind: "writes_state"
      brief: "delivers hillslope-routed lateral inflow per reach."
    - from: "BASIN_QR (routed local-basin runoff, prev/current)"
      to: "main_route_orchestrator"
      kind: "reads_state"
      brief: "lateral inflow consumed as the source term by every channel-routing method."
    - from: "main_route_orchestrator"
      to: "accumulation"
      kind: "invokes"
      brief: "route_network dispatches upstream accumulation (route_opt=0)."
    - from: "main_route_orchestrator"
      to: "IRF_routing"
      kind: "invokes"
      brief: "polymorphic rch_route%route dispatch to IRF."
    - from: "main_route_orchestrator"
      to: "KWT_routing"
      kind: "invokes"
      brief: "dispatch to Lagrangian kinematic-wave tracking."
    - from: "main_route_orchestrator"
      to: "KW_Euler_routing"
      kind: "invokes"
      brief: "dispatch to Eulerian kinematic-wave finite difference."
    - from: "main_route_orchestrator"
      to: "MC_routing"
      kind: "invokes"
      brief: "dispatch to Muskingum-Cunge."
    - from: "main_route_orchestrator"
      to: "DW_routing"
      kind: "invokes"
      brief: "dispatch to diffusive wave."
    - from: "main_route_orchestrator"
      to: "lake_reservoir_routing"
      kind: "invokes"
      brief: "diverts islake reaches to lake_route instead of the channel scheme when is_lake_sim."
    - from: "main_route_orchestrator"
      to: "Qobs / Qerror (assimilated discharge and DA error)"
      kind: "writes_state"
      brief: "DA direct-insert injects gauge observations into reach state before routing (qmodOption)."
    - from: "DW_routing"
      to: "advection_diffusion_solver"
      kind: "invokes"
      brief: "diffusive wave assembles and calls solve_ade/TDMA per reach."
    - from: "Inputs"
      to: "main_route_orchestrator"
      kind: "consumes_input"
      brief: "upstream/downstream topology drives the topological routing order over the basin decomposition."
    - from: "Inputs"
      to: "MC_routing"
      kind: "consumes_input"
      brief: "R_SLOPE/R_MAN_N/R_WIDTH/RLENGTH feed Muskingum-Cunge celerity."
    - from: "Inputs"
      to: "KWT_routing"
      kind: "consumes_input"
      brief: "Manning n, wave-scale, and geometry feed Lagrangian kinematic-wave celerity."
    - from: "IRF_routing"
      to: "REACH_Q (per-method reach discharge)"
      kind: "writes_state"
      brief: "writes routed reach discharge [m3/s]."
    - from: "MC_routing"
      to: "REACH_VOL (channel storage, prev/current)"
      kind: "writes_state"
      brief: "updates channel storage, capped at 99.9% drainage per step."
    - from: "DW_routing"
      to: "REACH_VOL (channel storage, prev/current)"
      kind: "writes_state"
      brief: "updates channel storage from the advection-diffusion solution."
    - from: "lake_reservoir_routing"
      to: "lake_storage_S (lake/reservoir storage)"
      kind: "writes_state"
      brief: "reservoir release from Doll/Hanasaki/HYPE parameters updates lake storage and downstream outflow."
    - from: "tracer_transport"
      to: "reach_solute (tracer constituent mass/flux)"
      kind: "writes_state"
      brief: "constituent routing writes solute mass flux per reach when tracer enabled."
    - from: "REACH_Q (per-method reach discharge)"
      to: "Outputs"
      kind: "produces_output"
      brief: "routed discharge per active method written to the history NetCDF."
    - from: "QFUTURE (basin gamma-UH future-runoff queue)"
      to: "Outputs"
      kind: "produces_output"
      brief: "future-runoff queue and per-method wave/volume states written to the restart NetCDF."
    - from: "mpi_decomposition"
      to: "main_route_orchestrator"
      kind: "invokes"
      brief: "mpi_route scatters reaches to ranks and calls main_route per core."
    - from: "model_setup"
      to: "main_route_orchestrator"
      kind: "invokes"
      brief: "control/namelist/topology read sets node counts and allocates reach state before the time loop."

states:
  variables:
    - name: "REACH_Q (per-method reach discharge)"
      unit: "m3/s"
      role: "prognostic"
    - name: "REACH_VOL (channel storage, prev/current)"
      unit: "m3"
      role: "prognostic"
    - name: "A (cross-sectional flow area)"
      unit: "m2"
      role: "diagnostic"
    - name: "REACH_ELE (reach water elevation/height)"
      unit: "m"
      role: "diagnostic"
    - name: "REACH_INFLOW (total upstream inflow)"
      unit: "m3/s"
      role: "diagnostic"
    - name: "QFUTURE (basin gamma-UH future-runoff queue)"
      unit: "m3/s"
      role: "accumulator"
    - name: "QFUTURE_IRF (network-IRF future-runoff queue)"
      unit: "m3/s"
      role: "accumulator"
    - name: "BASIN_QR (routed local-basin runoff, prev/current)"
      unit: "m3/s"
      role: "prognostic"
    - name: "KWT wave particles (Lagrangian particle positions/flows)"
      unit: "m3/s"
      role: "prognostic"
    - name: "lake_storage_S (lake/reservoir storage)"
      unit: "m3"
      role: "prognostic"
    - name: "timeDelayHist (reach time-delay histogram, UH routing)"
      unit: "s"
      role: "diagnostic"
    - name: "reach_solute (tracer constituent mass/flux)"
      unit: "mg, mg/s"
      role: "prognostic"
    - name: "Qobs / Qerror (assimilated discharge and DA error)"
      unit: "m3/s"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "routed_discharge"
    validation_rank: 1
    unit: "m3/s"
    description: "Streamflow at each river segment for each active routing method (IRFroutedRunoff, KWTroutedRunoff, KWroutedRunoff, MCroutedRunoff, DWroutedRunoff); REACH_Q."
    emitted_in: "history NetCDF <fname_output>.mizuroute.h.YYYY-MM-DD-SSSSS.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Gauge must be mapped to the correct reach (seg_id); outlet reaches identified by tosegment==0."
            - "Routing only re-times/attenuates input runoff; a volume bias indicates an upstream runoff or unit-conversion problem, not a routing-parameter problem."
            - "Compare like-with-like routing method when benchmarking against unit-hydrograph routers (IRF is closest to Lohmann)."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Single-instant discharge is sensitive to timing error; prefer the time-series comparison where possible."
      detrending_options: ["none"]
  - var: "basRunoff"
    validation_rank: 2
    unit: "m3/s"
    description: "Basin/lateral routed runoff delivered to reaches after hillslope delay; also used for mass-conservation checks (basRunoff/input-runoff ratio ~1.0)."
    emitted_in: "history NetCDF (output var set selected by control file)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Primarily a diagnostic/mass-balance quantity, not a directly gauged observable."
      detrending_options: ["none"]
  - var: "REACH_VOL"
    validation_rank: 3
    unit: "m3"
    description: "Channel water storage per reach."
    emitted_in: "history / restart NetCDF"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Rarely directly observed; comparable to inferred channel-storage estimates only."
      detrending_options: ["none"]
  - var: "lake_outflow_storage"
    validation_rank: 4
    unit: "m3/s outflow; m3 storage"
    description: "Lake/reservoir outflow and storage when the lake module is enabled."
    emitted_in: "history NetCDF (when is_lake_sim)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Outflow regime depends strongly on the reservoir-operation parametrization chosen (level-pool/Hanasaki/HYPE)."
      detrending_options: ["none"]

influence:
  _caveat: "No variance-based global-sensitivity study (Sobol/Morris/EFAST) targeting mizuRoute exists; grades are inferred from LHS calibration ensembles (Cortes-Salazar et al. 2023) and model-description papers, so no edge meets the quantitative HIGH bar."
  edges:
    - from: "wave_velocity / celerity (velo)"
      to: "routed_discharge (peak timing)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "IRF; Manning-derived in KWT/MC/DW"
      citations: ["mizukami2016_mizuroute_v1", "mizukami2021_vector_routing", "cortes2023_routing_matters"]
    - from: "diffusivity (diff)"
      to: "routed_discharge (peak attenuation)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "IRF / DW"
      citations: ["mizukami2016_mizuroute_v1", "cortes2023_routing_matters"]
    - from: "Manning roughness n (R_MAN_N)"
      to: "routed_discharge (peak timing)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "KWT / MC / DW"
      citations: ["cortes2023_routing_matters", "mizukami2021_vector_routing"]
    - from: "Manning roughness n (R_MAN_N)"
      to: "routed_discharge (peak magnitude)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "dynamic-celerity schemes (KWT / MC / DW)"
      citations: ["cortes2023_routing_matters"]
    - from: "channel width scale factor"
      to: "routed_discharge (peak magnitude)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "non-IRF schemes"
      citations: ["mizukami2021_vector_routing", "cortes2023_routing_matters"]
    - from: "hillslope unit-hydrograph timescale"
      to: "routed_discharge (peak timing)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "doesBasinRoute=1"
      citations: ["mizukami2016_mizuroute_v1"]
    - from: "hillslope unit-hydrograph shape"
      to: "routed_discharge (peak magnitude)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "doesBasinRoute=1"
      citations: ["mizukami2016_mizuroute_v1"]
    - from: "routing scheme choice (route_opt)"
      to: "routed_discharge (hydrograph timing/shape)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "always"
      citations: ["cortes2023_routing_matters"]
    - from: "routing time step (dt)"
      to: "routed_discharge (timing)"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "always"
      citations: ["cortes2023_routing_matters"]
    - from: "reservoir operation parameters"
      to: "routed_discharge (downstream peak attenuation / low-flow augmentation)"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "is_lake_sim=.True."
      citations: ["hanus2022_reservoir_param", "gharari2024_mizuroute_lake"]
  citation_index:
    mizukami2016_mizuroute_v1:
      short_citation: "Mizukami et al. 2016"
      doi: "10.5194/gmd-9-2223-2016"
      note: "Foundational mizuRoute v1 paper; channel routing parameters (celerity, diffusivity) and gamma-UH hillslope timescale control streamflow timing and peak attenuation. Descriptive model-description paper, not a variance-based SA."
    cortes2023_routing_matters:
      short_citation: "Cortes-Salazar et al. 2023"
      doi: "10.5194/hess-27-3505-2023"
      note: "3500-set Latin-Hypercube ensemble across four mizuRoute schemes; Manning's n strongly controls peak-flow timing, scheme/time-step differences small. Quantitative ensemble but reports no variance-based top-quartile ranking."
    mizukami2021_vector_routing:
      short_citation: "Mizukami et al. 2021"
      doi: "10.1029/2020MS002434"
      note: "Vector-based parallel global mizuRoute; wave velocity/diffusivity and Manning n / width scale factor govern routed-discharge timing and attenuation. Descriptive application paper, not a variance-based SA."
