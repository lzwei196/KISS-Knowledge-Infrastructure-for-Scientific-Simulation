template_version: "3.5"

identity:
  model_id: "CLASSIC"
  scientific_reference_version: "CLASSIC v1.0 (Melton et al. 2020, GMD 13:2825; CLASS 3.6.2 physics + CTEM v2.0 biogeochemistry lineage)"
  implementation:
    id: "classic-v100"
    version: "v1.0.0"
    provenance: "Fortran 2008; ECCC/CCCma stand-alone offline land-surface scheme, run as a serial or MPI-parallel build over point or gridded domains."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "CC-BY-4.0"
  repo_url: "https://gitlab.com/cccma/classic"

boundary:
  scope_in:
    - "Surface exchange of energy, momentum, and water between atmosphere and land (CLASS physics)"
    - "Multi-layer soil temperature and liquid/frozen soil moisture dynamics"
    - "Snowpack accumulation, melt, density, albedo (single-layer representation)"
    - "Vegetation canopy interception, radiation cascade, and evapotranspiration"
    - "Surface ponding"
    - "Terrestrial carbon biogeochemistry: photosynthesis, autotrophic/heterotrophic respiration, allocation, phenology, tissue turnover (CTEM)"
    - "Disturbance: fire ignition/spread/emissions, land-use change, PFT competition"
    - "Wetland methane emission and soil methane uptake"
  scope_out:
    - "Lateral heat/moisture transfer between grid cells (each cell is independent outside MESH coupling)"
    - "Channel/streamflow routing of runoff (runoff is a diagnostic flux, not routed)"
    - "Atmospheric dynamics (model is forced offline by prescribed meteorology)"
    - "Species-level vegetation (represented only at plant-functional-type level)"
    - "Nitrogen cycle (under development, not in v1.0)"
  spatial: "1-D column"
  temporal: "sub-hourly"
  closure: "both"
  notes: "Each grid cell/tile is an independent 1-D vertical column (configurable ground layers; standard offline config is 20 layers to >61 m depth); gridded runs are many independent columns with no lateral exchange. CLASS physics runs at a sub-daily timestep (15 min coupled, 30 min offline); CTEM biogeochemistry runs daily. Closure is dual: surface energy budget closure is enforced by construction (unlike eddy-covariance towers with 10-30% residual), and the terrestrial carbon budget closes (NEE/NEP sums to zero at equilibrium) only when spinfast=1 — accelerated soil-carbon spin-up (spinfast>1) deliberately breaks the carbon mass balance."

inputs:
  forcing:
    - {category: "atmospheric", name: "FSS — downwelling shortwave radiation", unit: "W m-2", source_kind: "forcing", model_input_format: "per-variable netCDF-4 (time,lat,lon); non-CF time encoded as 'day as %Y%m%d.%f'"}
    - {category: "atmospheric", name: "FDL — downwelling longwave radiation", unit: "W m-2", source_kind: "forcing", model_input_format: "per-variable netCDF-4 (time,lat,lon)"}
    - {category: "atmospheric", name: "PRE — precipitation rate", unit: "kg m-2 s-1", source_kind: "forcing", model_input_format: "per-variable netCDF-4 (time,lat,lon)", notes: "Driver expects a mass flux rate, NOT an mm depth per interval; wrong units silently scale the water balance."}
    - {category: "atmospheric", name: "TA — air temperature at reference height", unit: "deg C", source_kind: "forcing", model_input_format: "per-variable netCDF-4 (time,lat,lon)", notes: "Driver expects Celsius and converts to Kelvin internally (distinct from init-file TBAR which is Kelvin)."}
    - {category: "atmospheric", name: "QA — specific humidity at reference height", unit: "kg kg-1", source_kind: "forcing", model_input_format: "per-variable netCDF-4 (time,lat,lon)"}
    - {category: "atmospheric", name: "VMOD — wind speed at reference height", unit: "m s-1", source_kind: "forcing", model_input_format: "per-variable netCDF-4 (time,lat,lon)"}
    - {category: "atmospheric", name: "PRES — surface air pressure", unit: "Pa", source_kind: "forcing", model_input_format: "per-variable netCDF-4 (time,lat,lon)"}
    - {category: "atmospheric", name: "CO2 — atmospheric CO2 concentration", unit: "ppmv", source_kind: "forcing", model_input_format: "annual netCDF time series; non-CF 'day as %Y%m%d.%f' encoding", notes: "Drives photosynthetic CO2 response; required when ctem_on."}
    - {category: "atmospheric", name: "CH4 — atmospheric CH4 concentration", unit: "ppmv", source_kind: "forcing", model_input_format: "annual netCDF time series"}
    - {category: "disturbance", name: "POPD — population density (fire ignition)", unit: "people km-2", source_kind: "forcing", model_input_format: "annual netCDF", notes: "Optional; consumed only when dofire enabled."}
    - {category: "disturbance", name: "LGHT — lightning strike density (fire ignition)", unit: "strikes km-2 yr-1", source_kind: "forcing", model_input_format: "daily netCDF", notes: "Optional; consumed only when dofire enabled."}
    - {category: "boundary_driver", name: "LUC — prescribed land-use-change PFT fractions", unit: "fraction", source_kind: "forcing", model_input_format: "annual netCDF", notes: "Optional; consumed only when lnduseon enabled."}
    - {category: "boundary_driver", name: "OBSWETF — observed wetland fraction", unit: "fraction", source_kind: "forcing", model_input_format: "daily netCDF", notes: "Optional prescribed wetland extent for CH4 emissions."}
  parameters:
    - {category: "soil", name: "SAND / CLAY / ORGM — soil texture", unit: "% (0-100)", source_kind: "dataset_lookup", model_input_format: "init netCDF (per layer); SAND flags -2=peat, -3=bedrock, -4=ice"}
    - {category: "soil", name: "SDEP — permeable/bedrock depth", unit: "m", source_kind: "dataset_lookup", model_input_format: "init netCDF"}
    - {category: "soil", name: "DRN — drainage index", unit: "-", source_kind: "dataset_lookup", model_input_format: "init netCDF (0=bog, 1=free-draining, ~0.005 typical)"}
    - {category: "soil", name: "SOCI — soil colour index (bare-soil albedo)", unit: "1-20 index", source_kind: "dataset_lookup", model_input_format: "init netCDF"}
    - {category: "soil", name: "DELZ — ground-layer thickness", unit: "m", source_kind: "default", model_input_format: "init netCDF (>=~0.10 m for explicit-scheme stability)"}
    - {category: "vegetation", name: "FCAN / ALVC / ALIC / CMAS / LNZ0 / PAMN / PAMX / ROOT — CLASS PFT canopy parameters", unit: "mixed (fraction, albedo, kg m-2, m, ln(m))", source_kind: "calibrated", model_input_format: "init netCDF (per CLASS PFT, icp1)"}
    - {category: "vegetation", name: "CTEM PFT-specific physiology (vmax, quantum efficiency, specific leaf area, stomatal-conductance, allocation, respiration coefficients)", unit: "mixed", source_kind: "calibrated", model_input_format: "template_run_parameters namelist (per CTEM PFT, icc)"}
    - {category: "geometry", name: "ZRFH / ZRFM / ZBLD — reference and blending heights", unit: "m", source_kind: "user_provided", model_input_format: "joboptions namelist", notes: "Must exceed canopy height or surface-atmosphere exchange cannot be solved."}
    - {category: "grid", name: "grclarea / FARE / GC / MID — cell area, tile fraction, land mask, mosaic id", unit: "km2 / fraction / index", source_kind: "dataset_lookup", model_input_format: "init netCDF (GC=-1 marks land)"}
  initial_conditions:
    - {category: "soil_physics", name: "TBAR — soil layer temperature", unit: "K", source_kind: "user_provided", model_input_format: "init/restart netCDF (per layer)", notes: "Init file is Kelvin, unlike Celsius forcing TA."}
    - {category: "soil_physics", name: "THLQ / THIC — liquid / frozen soil moisture", unit: "m3 m-3", source_kind: "user_provided", model_input_format: "init/restart netCDF (per layer)"}
    - {category: "snow", name: "SNO / TSNO / ALBS / RHOS / WSNO — snowpack mass, temperature, albedo, density, liquid water", unit: "kg m-2 / K / - / kg m-3 / kg m-2", source_kind: "user_provided", model_input_format: "init/restart netCDF"}
    - {category: "carbon", name: "gleafmas / bleafmas / stemmass / rootmass / litrmass / soilcmas — CTEM carbon pools", unit: "kgC m-2", source_kind: "user_provided", model_input_format: "init/restart netCDF (per icc; litter/soil per icc+bareground+LUC)", notes: "Must be pre-spun-up; pools equilibrate only after repeated forcing cycling."}
    - {category: "vegetation", name: "fcancmx — CTEM PFT fractional coverage", unit: "fraction", source_kind: "user_provided", model_input_format: "init/restart netCDF (per icc)"}
  boundary_conditions:
    - {category: "control", name: "ctem_on — enable CTEM biogeochemistry", unit: "logical", source_kind: "user_provided", model_input_format: "joboptions namelist", notes: ".false. gives physics-only run with all-zero carbon fluxes."}
    - {category: "control", name: "spinfast — soil-carbon spin-up acceleration factor", unit: "integer", source_kind: "user_provided", model_input_format: "joboptions namelist", notes: ">1 accelerates decomposition and breaks NEP=GPP-Ra-Rh; set 1 for transient/carbon-budget runs."}
    - {category: "control", name: "metLoop — number of forcing-cycle repeats for spin-up", unit: "integer", source_kind: "user_provided", model_input_format: "joboptions namelist"}
    - {category: "control", name: "dofire / PFTCompetition / lnduseon — disturbance, competition, land-use switches", unit: "logical", source_kind: "user_provided", model_input_format: "joboptions namelist"}
    - {category: "numerical", name: "ITC / ITCG / ITG — surface-temperature iteration scheme", unit: "1=bisection | 2=Newton-Raphson", source_kind: "user_provided", model_input_format: "joboptions namelist", notes: "Use 1; 2 (Newton-Raphson) diverges to NaN."}
    - {category: "physics_option", name: "IDISP / IZREF / ISLFD / IPCP / IWF / isnoalb — physics method switches", unit: "integer codes", source_kind: "user_provided", model_input_format: "joboptions namelist"}
    - {category: "domain", name: "run coordinates (lon/lat or lon/lon/lat/lat box)", unit: "degrees", source_kind: "user_provided", model_input_format: "second CLI argument", notes: "Must match init-file grid or model exits with 'No valid gridcells'."}
    - {category: "config", name: "PFT counts ican / icc / l2max", unit: "integer", source_kind: "user_provided", model_input_format: "run_parameters namelist", notes: "Must match init-file ic/icc dimensions or segfault."}
    - {category: "output_control", name: "JMOSTY / JDSTY — monthly/daily output start years", unit: "year", source_kind: "user_provided", model_input_format: "joboptions namelist"}

processes:
  modules:
    - {name: "metDisaggregation", role: "process_solver", brief: "Disaggregates input forcing to the physics timestep: step/linear interpolation, conservative random precip distribution, zenith-angle diurnal shortwave distribution, and timezone circular shift.", applicability: "always"}
    - {name: "SoilProperties", role: "process_solver", brief: "Derives soil thermal and hydraulic properties from texture (SAND/CLAY/ORGM) for the thermal-hydrology core.", applicability: "always"}
    - {name: "EnergyBudget", role: "process_solver", brief: "Surface energy balance over the four subareas (canopy-over-bare/snow, bare, snow): net radiation, sensible/latent/ground heat flux, surface temperatures; couples to CTEM photosynthesis/conductance when ctem_on.", applicability: "always"}
    - {name: "SoilThermalHydrology", role: "integrator", brief: "Land-surface integrator for soil temperature (TBAR), liquid/frozen moisture (THLQ/THIC), ponding, infiltration, and runoff/baseflow generation.", applicability: "always"}
    - {name: "SnowScheme", role: "process_solver", brief: "Single-layer snowpack mass/energy: SNO, TSNO, RHOS, ALBS, WSNO, and snow water equivalent.", applicability: "always"}
    - {name: "CanopyInterception", role: "process_solver", brief: "Canopy temperature (TCAN), canopy air (TAC/QAC), rain/snow interception (RCAN/SCAN), aerodynamic resistances and reference-height handling.", applicability: "always"}
    - {name: "Photosynthesis", role: "process_solver", brief: "CTEM leaf-level GPP, stomatal CO2 and canopy conductance, and autotrophic (maintenance) respiration; feeds the energy budget.", applicability: "ctem_on=.true."}
    - {name: "CarbonAllocationPhenology", role: "allocator", brief: "Allocates NPP to green/brown leaf, stem and root pools; tracks leaf phenological status and growth efficiency; sets prognostic LAI.", applicability: "ctem_on=.true."}
    - {name: "SoilCarbonRespiration", role: "integrator", brief: "Litter and soil carbon pools, heterotrophic respiration, and net ecosystem/biome productivity (nep/nbp).", applicability: "ctem_on=.true."}
    - {name: "Disturbance", role: "optional_module", brief: "Fire (ignition from POPD+LGHT, spread, emissions, burnt-to-bare carbon transfer) and land-use-change carbon/PFT reallocation.", applicability: "dofire or lnduseon enabled"}
    - {name: "Competition", role: "optional_module", brief: "PFT competition for space using bioclimatic state (gdd5, twarmm, tcoldm, aridity) to set vegetation composition.", applicability: "PFTCompetition enabled"}
    - {name: "PeatlandMoss", role: "optional_module", brief: "Peatland moss carbon (Cmossmas, litrmsmoss, dmoss) and wetland CH4 emission / soil CH4 uptake.", applicability: "peatland tiles (ipeatland>0)"}
  internal_edges:
    - {from: "Inputs", to: "metDisaggregation", kind: "consumes_input", brief: "Reads raw meteorological forcing netCDFs."}
    - {from: "metDisaggregation", to: "EnergyBudget", kind: "invokes", brief: "Supplies timestep-resolved shortwave/longwave/Ta/Qa/wind/pressure/precip to the energy balance."}
    - {from: "Inputs", to: "SoilProperties", kind: "consumes_input", brief: "Reads soil texture to derive hydraulic/thermal coefficients."}
    - {from: "SoilProperties", to: "SoilThermalHydrology", kind: "invokes", brief: "Provides derived soil hydraulic/thermal properties."}
    - {from: "EnergyBudget", to: "TCAN", kind: "writes_state", brief: "Updates canopy temperature."}
    - {from: "EnergyBudget", to: "SoilThermalHydrology", kind: "invokes", brief: "Passes surface fluxes/ground heat to the soil integrator."}
    - {from: "EnergyBudget", to: "CanopyInterception", kind: "invokes", brief: "Drives canopy energy/interception exchange."}
    - {from: "EnergyBudget", to: "SnowScheme", kind: "invokes", brief: "Drives snowpack energy exchange and melt."}
    - {from: "SoilThermalHydrology", to: "TBAR", kind: "writes_state", brief: "Integrates soil layer temperature."}
    - {from: "SoilThermalHydrology", to: "THLQ", kind: "writes_state", brief: "Integrates liquid soil moisture."}
    - {from: "SoilThermalHydrology", to: "THIC", kind: "writes_state", brief: "Integrates frozen soil moisture."}
    - {from: "SoilThermalHydrology", to: "Outputs", kind: "produces_output", brief: "Emits total/surface runoff and evapotranspiration fluxes."}
    - {from: "SnowScheme", to: "SNO", kind: "writes_state", brief: "Updates snow mass / SWE."}
    - {from: "SnowScheme", to: "ALBS", kind: "writes_state", brief: "Updates snow albedo."}
    - {from: "CanopyInterception", to: "RCAN", kind: "writes_state", brief: "Updates intercepted canopy water."}
    - {from: "Inputs", to: "Photosynthesis", kind: "consumes_input", brief: "Atmospheric CO2 concentration drives carboxylation."}
    - {from: "THLQ", to: "Photosynthesis", kind: "reads_state", brief: "Soil moisture limits stomatal conductance / water stress."}
    - {from: "Photosynthesis", to: "EnergyBudget", kind: "invokes", brief: "Canopy conductance and net photosynthesis feed back into the surface energy balance within the same timestep when ctem_on."}
    - {from: "Photosynthesis", to: "CarbonAllocationPhenology", kind: "invokes", brief: "Passes NPP for allocation."}
    - {from: "Photosynthesis", to: "Outputs", kind: "produces_output", brief: "Emits gpp, npp, ra."}
    - {from: "CarbonAllocationPhenology", to: "gleafmas", kind: "writes_state", brief: "Allocates carbon to green leaf."}
    - {from: "CarbonAllocationPhenology", to: "stemmass", kind: "writes_state", brief: "Allocates carbon to stem."}
    - {from: "CarbonAllocationPhenology", to: "rootmass", kind: "writes_state", brief: "Allocates carbon to root."}
    - {from: "CarbonAllocationPhenology", to: "lai", kind: "writes_state", brief: "Sets leaf area index from leaf carbon and specific leaf area."}
    - {from: "lai", to: "EnergyBudget", kind: "reads_state", brief: "Updated LAI/canopy structure feeds the next-step radiation and energy balance."}
    - {from: "CarbonAllocationPhenology", to: "SoilCarbonRespiration", kind: "invokes", brief: "Litterfall and turnover feed soil/litter pools."}
    - {from: "SoilCarbonRespiration", to: "litrmass", kind: "writes_state", brief: "Updates litter carbon."}
    - {from: "SoilCarbonRespiration", to: "soilcmas", kind: "writes_state", brief: "Updates soil carbon."}
    - {from: "SoilCarbonRespiration", to: "Outputs", kind: "produces_output", brief: "Emits rh, nep, nbp."}
    - {from: "Disturbance", to: "stemmass", kind: "writes_state", brief: "Fire/LUC moves carbon out of live pools using pre-disturbance snapshots."}
    - {from: "Disturbance", to: "soilcmas", kind: "writes_state", brief: "Transfers disturbed carbon to litter/soil and emits fire CO2."}
    - {from: "Competition", to: "fcancmx", kind: "writes_state", brief: "Updates PFT fractional coverage from competition."}
    - {from: "EnergyBudget", to: "Outputs", kind: "produces_output", brief: "Emits rss, rls, hfss, hfls."}

states:
  variables:
    - {name: "TBAR", unit: "K", role: "prognostic"}
    - {name: "THLQ", unit: "m3 m-3", role: "prognostic"}
    - {name: "THIC", unit: "m3 m-3", role: "prognostic"}
    - {name: "TCAN", unit: "K", role: "prognostic"}
    - {name: "TAC", unit: "K", role: "prognostic"}
    - {name: "QAC", unit: "kg kg-1", role: "prognostic"}
    - {name: "RCAN", unit: "kg m-2", role: "prognostic"}
    - {name: "SCAN", unit: "kg m-2", role: "prognostic"}
    - {name: "ZPND", unit: "m", role: "prognostic"}
    - {name: "TPND", unit: "K", role: "prognostic"}
    - {name: "TSFS", unit: "K", role: "prognostic"}
    - {name: "TBAS", unit: "K", role: "prognostic"}
    - {name: "maxAnnualActLyr", unit: "m", role: "prognostic"}
    - {name: "SNO", unit: "kg m-2", role: "prognostic"}
    - {name: "TSNO", unit: "K", role: "prognostic"}
    - {name: "ALBS", unit: "-", role: "prognostic"}
    - {name: "RHOS", unit: "kg m-3", role: "prognostic"}
    - {name: "WSNO", unit: "kg m-2", role: "prognostic"}
    - {name: "GRO", unit: "-", role: "prognostic"}
    - {name: "gleafmas", unit: "kgC m-2", role: "prognostic"}
    - {name: "bleafmas", unit: "kgC m-2", role: "prognostic"}
    - {name: "stemmass", unit: "kgC m-2", role: "prognostic"}
    - {name: "rootmass", unit: "kgC m-2", role: "prognostic"}
    - {name: "litrmass", unit: "kgC m-2", role: "prognostic"}
    - {name: "soilcmas", unit: "kgC m-2", role: "prognostic"}
    - {name: "fcancmx", unit: "fraction", role: "prognostic"}
    - {name: "lfstatus", unit: "-", role: "prognostic"}
    - {name: "lai", unit: "m2 m-2", role: "diagnostic"}
  provenance: "populated"

outputs:
  - var: "rss"
    validation_rank: 3
    unit: "W m-2"
    description: "Net shortwave radiation at the surface"
    emitted_in: "per-variable netCDF (rss_hh/_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Flux-tower radiation components carry instrument and footprint uncertainty."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none"]
  - var: "hfss"
    validation_rank: 4
    unit: "W m-2"
    description: "Sensible heat flux"
    emitted_in: "per-variable netCDF (hfss_hh/_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Model enforces surface energy-balance closure; eddy-covariance towers leave a 10-30% closure residual, so do not force the obs LE+H to close."]
      detrending_options: ["none"]
  - var: "hfls"
    validation_rank: 5
    unit: "W m-2"
    description: "Latent heat flux (energy equivalent of evapotranspiration)"
    emitted_in: "per-variable netCDF (hfls_hh/_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Same energy-balance-closure caveat as hfss; tower LE often the closure-residual term."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none"]
  - var: "gpp"
    validation_rank: 1
    unit: "kgC m-2 s-1 (instantaneous) or kgC m-2 month-1 (accumulated)"
    description: "Gross primary productivity"
    emitted_in: "per-variable netCDF (gpp_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Tower GPP is a partitioning product (not directly measured); unit varies with output frequency."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none"]
  - var: "nep"
    validation_rank: 6
    unit: "kgC m-2 s-1 or kgC m-2 month-1"
    description: "Net ecosystem productivity (NEP ~ GPP - Ra - Rh)"
    emitted_in: "per-variable netCDF (nep_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Sign convention and tower NEE partitioning; NEP=GPP-Ra-Rh closes only at spinfast=1."]
      detrending_options: ["none"]
  - var: "nbp"
    validation_rank: 7
    unit: "kgC m-2 s-1 or kgC m-2 yr-1"
    description: "Net biome productivity (NEP minus disturbance/land-use carbon losses)"
    emitted_in: "per-variable netCDF (nbp_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Global/regional land-sink estimates (e.g. GCB) are themselves model/inversion products; compare decadal means and trend, not inter-annual point matches."]
      detrending_options: ["decadal_mean", "linear_residual"]
  - var: "rh"
    validation_rank: 8
    unit: "kgC m-2 s-1"
    description: "Heterotrophic (soil/litter) respiration"
    emitted_in: "per-variable netCDF (rh_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Field soil-respiration (e.g. SRDB) mixes autotrophic and heterotrophic components; partitioning needed."]
      detrending_options: ["none"]
  - var: "mrro"
    validation_rank: 9
    unit: "kg m-2 s-1"
    description: "Total runoff (surface + subsurface), grid-cell diagnostic flux"
    emitted_in: "per-variable netCDF (mrro_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats: ["Runoff is an unrouted grid-cell water-balance flux; CLASSIC has no channel routing, so compare as a flux/water-budget term, not as routed streamflow."]
      detrending_options: ["none"]
  - var: "snw"
    validation_rank: 2
    unit: "kg m-2"
    description: "Snow water equivalent"
    emitted_in: "per-variable netCDF (snw_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "timing_accuracy"]
          determining_metric: "pbias"
          caveats: ["SWE is highly sensitive to forcing precipitation and sub-grid topography; single-layer snowpack."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Snow-cover-fraction bias in mountains depends on sub-grid topography parameterization."]
      detrending_options: ["none"]
  - var: "lai"
    validation_rank: 10
    unit: "m2 m-2"
    description: "Leaf area index"
    emitted_in: "per-variable netCDF (lai_d/_mo/_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "csi"
          caveats: ["Satellite LAI (e.g. MODIS) saturates at high LAI; PFT-level aggregation differs from per-pixel land cover."]
      detrending_options: ["none"]
  - var: "cSoil"
    validation_rank: 11
    unit: "kgC m-2"
    description: "Soil carbon stock"
    emitted_in: "per-variable netCDF (cSoil_yr.nc)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Observation-based SOC maps (e.g. WoSIS-derived) carry large structural uncertainty; valid only after carbon spin-up to equilibrium."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Profile depth of the obs must match the modeled soil column depth."]
      detrending_options: ["none"]

