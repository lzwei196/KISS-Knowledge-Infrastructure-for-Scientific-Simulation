kiss_manifest_version: 1
model: Elmer_Ice
binary_type: ELF
verified: unverified
install_dir: Elmer_Ice
acquire:
  strategy: build
  repo: https://github.com/ElmerCSC/elmerfem.git
  ref: 9352634829dfde24439000571d64438d8c683264
  commands: []
  produces: install/bin/ElmerSolver
python_deps:
- numpy
system_deps:
- git
- cmake
- gcc
- gfortran
notes: 'LINUX x86_64 port of the macos recipe (kiss.macos.arm64.yaml): same source
  pin and product path; binary_type/system_deps adapted. Build commands dropped (platform-specific)
  — write native ones. Not yet verified on Linux. Official annotated release-9.0 resolves
  to this commit. Headless MPI-enabled Elmer/Ice scope, including the ElmerIce shared
  solver modules. Retry52 built the FEM core but exposed bundled UMFPACK missing declarations,
  serial MPI constant gaps and host-associated loop indices in DCRComplexSolve. The
  helper now adds the actual bundled UMFPACK header/include directory and explicitly
  local loop indices'
agent_hint: BEFORE configuring, run this KI's tools/prepare_elmer_build.py with the
  cloned source directory as argument, from the installation workspace root. It checks
  exact upstream file hashes, preserves explicit compiler selections, guards absent
  GLX headers, sets MATC and elmersolver C targets to GNU17, restores missing declarations/headers
  and makes internal DCR loop indices local. Use WITH_MPI=ON and real MPI C/CXX/Fortran
  wrappers from the SAME prefix, built with the selected compiler. Set MPI_HOME and
  MPI_C_COMPILER, MPI_CXX_COMPILER, MPI_Fortran_COMPILER explicitly in CMake and keep
  that prefix on PATH. A separately validated native OpenMPI 5.0.10 installation is
  available in the task's work/elmfire-runtime/openmpi; its mpifort was compiled with
  this machine's gfortran16. Resolve its absolute path from the supplied task runtime
  preparation. Do not mix host MPICH libraries with OpenMPI wrappers. No serial MPI
  header patches or substitute MPI constants apply. Keep source and build under binaries/Elmer_Ice;
  supply an ABSOLUTE install prefix <workspace>/binaries/Elmer_Ice/install. Build
  and install the complete default target so ElmerIce modules and ElmerGrid accompany
  the actual solver. MPI builds produce ElmerSolver_mpi and upstream installs the
  ElmerSolver link; preserve both and all native libraries. Confirm bounded singleton
  startup in an empty directory. No scientific SIF files, meshes or simulation runs
  are required for installation.
