# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: BIOME_BGC
  language: c
  implementation:
    id: biome-bgc-42
    version: '4.2'
    provenance: C (ANSI C89); University of Montana NTSG / Thornton-Running base Biome-BGC release, point-scale
      pointbgc executable.
  scientific_reference_version: Biome-BGC 4.2 (NTSG/Thornton lineage; documented against UMT User's Guide
    v4.1.2, April 2002)
inputs:
  forcing:
  - name: Tmax
    unit: deg C
    category: meteorology
    source_kind: forcing
    model_input_format: daily met file column 3 (space-separated, 365-day years)
    notes: Celsius required; Kelvin silently corrupts respiration and phenology
  - name: Tmin
    unit: deg C
    category: meteorology
    source_kind: forcing
    model_input_format: daily met file column 4
  - name: Tday
    unit: deg C
    category: meteorology
    source_kind: forcing
    model_input_format: daily met file column 5
    notes: Daytime mean = Tmin + 0.45*(Tmax-Tmin); read but discarded by the model (metarr_init.c %*lf)
      yet must be present for column alignment
  - name: prcp
    unit: cm/day
    category: meteorology
    source_kind: forcing
    model_input_format: daily met file column 6
    notes: Model expects cm NOT mm; mm input silently inflates GPP/NPP ~10x
  - name: VPD
    unit: Pa
    category: meteorology
    source_kind: forcing
    model_input_format: daily met file column 7
    notes: Daylight average; Pa NOT kPa (typical 200-4000 Pa); kPa leaves stomata always open
  - name: srad
    unit: W/m2
    category: meteorology
    source_kind: forcing
    model_input_format: daily met file column 8
    notes: Daylight average shortwave flux density
  - name: daylen
    unit: s
    category: meteorology
    source_kind: forcing
    model_input_format: daily met file column 9
    notes: Daylength sunrise-to-sunset; must be computed from latitude and day-of-year; daylen=0 yields
      PAR=0 and GPP=0
  - name: atmospheric CO2
    unit: ppm
    category: atmosphere
    source_kind: forcing
    model_input_format: constant in CO2_CONTROL block or annual co2.txt file
    notes: ppm NOT mole-fraction or ppb; 280 pre-industrial for spinup, 370+ or time-varying for normal
      run
  - name: atmospheric N deposition (wet+dry)
    unit: kgN/m2/yr
    category: nitrogen
    source_kind: forcing
    model_input_format: constant or ramped (RAMP_NDEP) or annual file
    notes: Pre-industrial (~0.0001) required for spinup or SOC never equilibrates
  parameters:
  - name: latitude
    unit: degrees
    category: site
    source_kind: user_provided
    model_input_format: .ini SITE block (negative for S hemisphere)
  - name: elevation
    unit: m
    category: site
    source_kind: user_provided
    model_input_format: .ini SITE block
  - name: effective soil depth (rooting zone)
    unit: m
    category: site
    source_kind: user_provided
    model_input_format: .ini SITE block
    notes: Meters NOT cm; wrong scale causes instant soil drydown and runaway transpiration
  - name: sand/silt/clay fractions
    unit: '%'
    category: soil
    source_kind: dataset_lookup
    model_input_format: .ini SITE block
    notes: Must sum to 100 exactly; otherwise segfault in soil water capacity calc
  - name: shortwave albedo
    unit: DIM
    category: site
    source_kind: user_provided
    model_input_format: .ini SITE block
  - name: N fixation (symbiotic+asymbiotic)
    unit: kgN/m2/yr
    category: nitrogen
    source_kind: user_provided
    model_input_format: .ini SITE block
  - name: specific leaf area (SLA)
    unit: m2/kgC
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered (epc_init.c)
    notes: Per-PFT; high SLA overestimates GPP vs FLUXNET
  - name: leaf, leaf-litter, fine-root, live-wood, dead-wood C:N ratios
    unit: kgC/kgN
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
    notes: leaf-litter C:N must be >= live-leaf C:N
  - name: fraction of leaf N in Rubisco (FLNR)
    unit: DIM
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
  - name: max stomatal / cuticular / boundary-layer conductance
    unit: m/s
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
    notes: Boundary-layer and cuticular conductance assumed constant; boundary-layer defined at constant
      1 m/s windspeed
  - name: canopy light extinction coefficient (Beer's law)
    unit: DIM
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
  - name: canopy water interception coefficient
    unit: 1/LAI/d
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
  - name: allocation ratios (froot:leaf, stem:leaf, livewood:totalwood, croot:stem, current-growth proportion)
    unit: ratio
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
    notes: Transposed ratios route all C to wood with no leaf growth
  - name: annual leaf+fine-root / livewood / whole-plant / fire mortality fractions
    unit: 1/yr
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
  - name: litter & deadwood labile/cellulose/lignin proportions
    unit: DIM
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
    notes: Must sum to 1.0
  - name: leaf water potential and VPD conductance-reduction start/complete thresholds
    unit: MPa, Pa
    category: ecophysiology
    source_kind: calibrated
    model_input_format: .epc line-ordered
  initial_conditions:
  - name: initial soil water
    unit: proportion of saturation
    category: water
    source_kind: user_provided
    model_input_format: .ini W_STATE block
  - name: initial snowpack water
    unit: kg/m2
    category: water
    source_kind: user_provided
    model_input_format: .ini W_STATE block
  - name: initial leaf / stem / coarse-woody-debris / 4 litter / 4 soil carbon pools
    unit: kgC/m2
    category: carbon
    source_kind: user_provided
    model_input_format: .ini C_STATE block
    notes: Non-equilibrated states produce misleading NEE for hundreds of years; spinup endpoint normally
      seeds these
  - name: initial litter labile N and soil mineral N
    unit: kgN/m2
    category: nitrogen
    source_kind: user_provided
    model_input_format: .ini N_STATE block
  - name: restart endpoint
    unit: '-'
    category: state
    source_kind: derived
    model_input_format: .endpoint binary restart file written by spinup
    notes: Must be read by the exact same compiled binary that wrote it (struct layout); cross-version
      transfer corrupts state
  boundary_conditions:
  - name: run mode
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: CLI flag -s spinup / -n normal / -g spin-and-go
    notes: Selects MODE_SPINUP vs MODE_MODEL loop in bgc()
  - name: simulation time frame (start year, n years)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: .ini TIME_DEFINE block
  - name: CO2_CONTROL flag
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: .ini CO2_CONTROL block (constant vs annual-file mode)
  - name: N-deposition control (RAMP_NDEP)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: .ini RAMP_NDEP block (constant/ramped/file)
  - name: phenology control flag (model-driven vs user onday/offday)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: .epc phenology flags
  - name: climate-change offsets (CLIM_CHANGE)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: .ini CLIM_CHANGE block (additive T offset, multiplicative prcp/VPD/srad scaling)
  - name: output variable selection (daily/annual indices)
    unit: '-'
    category: control
    source_kind: user_provided
    model_input_format: .ini DAILY_OUTPUT / ANNUAL_OUTPUT blocks (output codes into NMAP map)
outputs:
  primary:
  - name: daily_gpp
    unit: kgC/m2/d
    description: Gross primary production (sunlit + shaded canopy photosynthesis)
    validation_rank: 1
    emitted_in: .dayout (binary, optional .dayout.ascii); annual summary as ann NPP/NPB text
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare against eddy-covariance / FLUXNET tower GPP at the simulated point; SLA and FLNR mis-set
          can bias magnitude with little timing error
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Only valid when run per-cell over natural-vegetation cells; satellite GPP (MODIS) underestimates
          relative to BIOME-BGC tropical defaults unless EBF tropical params used
      detrending_options:
      - none
  - name: daily_npp
    unit: kgC/m2/d
    description: Terrestrial ecosystem net primary production = GPP - maintenance - growth respiration
    validation_rank: 2
    emitted_in: .dayout; annual ann NPP (gC/m2/yr) in text summary
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Annual NPP comparable to biometric inventory or MODIS NPP at the site
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - When paired with a regional/national aggregate, compare detrended trend; aggregate may carry
          land-use signal the point model does not represent
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: daily_nee
    unit: kgC/m2/d
    description: Net ecosystem exchange = NEP - fire losses (negative = sink)
    validation_rank: 4
    emitted_in: .dayout; annual NBP in text summary
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance NEE; NEE realism requires completed spinup (cold-start NEE dominated by initial-condition
          artifacts persisting hundreds of years); CO2 mismatch between spinup and run drives a spurious
          source for 50+ yr
      detrending_options:
      - none
  - name: daily_nep
    unit: kgC/m2/d
    description: Net ecosystem production = NPP - heterotrophic respiration
    validation_rank: 5
    emitted_in: .dayout
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Same spinup-dependence as NEE
      detrending_options:
      - none
  - name: daily_hr
    unit: kgC/m2/d
    description: Soil and litter heterotrophic (decomposition) respiration
    validation_rank: 6
    emitted_in: .dayout
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Partition of measured soil respiration into heterotrophic vs autotrophic is observationally
          uncertain
      detrending_options:
      - none
  - name: proj_lai
    unit: m2/m2
    description: Vegetation canopy projected leaf area index
    validation_rank: 7
    emitted_in: .dayout (binary index 509); annual max LAI in text summary
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - MODIS LAI at the site; timing of green-up/senescence tests phenology, magnitude tests SLA/allocation
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Peak-season satellite LAI map when run per-cell
      detrending_options:
      - none
  - name: vegc
    unit: kgC/m2
    description: Total vegetation carbon stock
    validation_rank: 8
    emitted_in: .annout (annual index 636)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Biomass inventory at the stand; equilibrium value depends on completed spinup
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Biomass-carbon map when run per-cell
      detrending_options:
      - none
  - name: soilc
    unit: kgC/m2
    description: Soil organic carbon stock (4 CENTURY-style SOM pools)
    validation_rank: 9
    emitted_in: .annout (annual index 638)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Measured SOC stock; only meaningful after multi-century spinup to steady state
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - SOC map (e.g. HWSD) when run per-cell
      detrending_options:
      - none
  - name: soilw
    unit: kgH2O/m2
    description: Single-bucket soil water content
    validation_rank: 10
    emitted_in: .dayout (binary index 20)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Single-bucket Clapp-Hornberger soil water is structurally different from multi-layer schemes;
          use for internal carbon control rather than as authoritative hydrology (magnitude is not directly
          comparable to a multi-layer scheme's column storage)
      detrending_options:
      - none
  - name: net_nmin
    unit: kgN/m2/d
    description: Soil daily net nitrogen mineralization
    validation_rank: 11
    emitted_in: .dayout
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - In-situ net mineralization assays are sparse and method-dependent
      detrending_options:
      - none
  - name: ET
    unit: kgH2O/m2/d
    description: 'Evapotranspiration (Penman-Monteith): transpiration + canopy + bare-soil evaporation'
    validation_rank: 3
    emitted_in: .dayout / annual ann ET text summary
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Diagnostic-only when coupled to a hydrology model that owns the water balance; never add to
          discharge (double-counts basin ET)
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: make fails with 'implicit declaration of function' warnings treated as errors
  diagnosis: C99/C11 strict mode flags conflict with ANSI C89 code; BIOME-BGC 4.2 is written in ANSI C89
    style with implicit function declarations. Modern GCC with -Werror or -std=c11 rejects these.; ['compilation']
  remedy: Add -std=gnu89 or -Wno-implicit-function-declaration to CFLAGS in makefile; ['Edit src/makefile,
    find CFLAGS line', 'Add -std=gnu89 -Wno-implicit-function-declaration', 'Run make clean && make'];
    Use the pre-compiled binary at model/biome-bgc/bgc-src/bgc
  severity: fatal
- id: dt_002
  symptom: Model runs but immediately exits with no output files created
  diagnosis: File path in .ini points to nonexistent .epc, .met, or restart file; BIOME-BGC reads file
    paths from the .ini and opens them immediately. A wrong path causes immediate exit. Paths are relative
    to the working directory, not the .ini file location.; ['s1_site_definition']
  remedy: 'Verify all file paths in .ini are correct relative to the working directory; Check: met file
    (MET_INPUT), epc file (EPC_FILE), restart files (RESTART); [''cd to the intended working directory'',
    ''Verify met file exists: ls <met_path>'', ''Verify epc file exists: ls <epc_path>'', ''If reading
    restart, veri'
  severity: fatal
- id: dt_003
  symptom: Segmentation fault on startup
  diagnosis: Soil texture sand+silt+clay does not sum to 100, or negative value in .ini causes bad memory
    allocation; BIOME-BGC computes soil water holding capacity from texture percentages. Invalid values
    lead to negative array sizes or division by zero.; ['s1_site_definition']
  remedy: 'Validate sand+silt+clay = 100 exactly in the SITE section of .ini; generate_site_ini; [''Check
    SITE section: sand + silt + clay must equal 100.0'', ''Check soil depth > 0'', ''Use generate_site_ini.py
    which validates automatically'']; Always generate .ini with the validated tool, never edit manually'
  severity: fatal
- id: dt_004
  symptom: Model reads, runs to completion, but all fluxes are wrong magnitude or sign
  diagnosis: INI file has extra blank line or missing keyword, shifting all subsequent parameters by one
    line; BIOME-BGC parses .ini by keyword scanning then sequential scan_value() calls. An extra or missing
    line after a keyword causes every parameter in that section to be read from the wrong line. The model
    wi
  remedy: Regenerate .ini with generate_site_ini.py; never hand-edit; generate_site_ini; ['Compare your
    .ini with the template line by line', 'Count that each section keyword is followed by the exact number
    of value lines', 'Remove any extra blank lines within sections']; ALWAYS use generate_site_ini.py.
    NEVE
  severity: silent
- id: dt_005
  symptom: Very high or very low GPP but model completes normally
  diagnosis: CO2 value in .ini has wrong units -- fraction instead of ppm, or ppm*1e6; BIOME-BGC CO2_CONTROL
    expects ppm (e.g., 380.0). A value of 0.000380 (fraction) gives near-zero photosynthesis. A value
    of 380000 gives massive GPP.; ['s4_co2_concentration']
  remedy: Verify CO2 value is in ppm, typically 280-600 for historical; ['Check CO2_CONTROL section in
    .ini', 'The ppm line should read ~280 (pre-industrial) to ~420 (2024)', 'NOT 0.000380 (mole fraction)
    or 380000 (ppb)']; generate_site_ini.py validates CO2 range [100, 1500] ppm
  severity: silent
- id: dt_006
  symptom: Extremely high transpiration, soil dries instantly in first days
  diagnosis: Soil depth in .ini is in cm instead of m (100x too shallow); BIOME-BGC SITE section expects
    soil depth in meters. A value of 100 (meaning 100 cm = 1 m) is interpreted as 100 meters. A value
    of 1.0 (meaning 1 cm) gives essentially no water storage.; ['s1_site_definition']
  remedy: Verify soil depth is in meters (typically 0.5-3.0 m); ['Check SITE section soil depth line',
    'Value should be 0.5-3.0 for most ecosystems', 'NOT 50-300 (that would be cm misinterpreted as m)'];
    generate_site_ini.py validates soil_depth range (0, 10] meters
  severity: silent
- id: dt_007
  symptom: GPP and NPP approximately 10x higher than expected for the biome
  diagnosis: Precipitation provided in mm/day instead of cm/day; BIOME-BGC expects precipitation in CM
    per day. CMFD/MSWX and VIC provide mm. Forgetting to divide by 10 gives 10x too much water, inflating
    GPP/NPP. The model runs without any error.; ['s3_meteorological_forcing']
  remedy: 'Divide precipitation by 10 when converting from mm to cm; convert_forcing_to_bgc; [''In the
    met file, column 6 (prcp) must be in cm'', ''Check: typical daily values should be 0.0-3.0 cm (0-30
    mm)'', ''If values are 0-30+, they are likely still in mm'']; Use convert_forcing_to_bgc.py which
    applies mm_to_cm'
  severity: silent
- id: dt_008
  symptom: Stomata always fully open, transpiration unrealistically high (>10 mm/day)
  diagnosis: VPD provided in kPa instead of Pa (1000x too low); BIOME-BGC expects VPD in Pascals. Typical
    daytime VPD is 500-3000 Pa. If provided in kPa (0.5-3.0), the model sees extremely low atmospheric
    demand and keeps stomata wide open.; ['s3_meteorological_forcing']
  remedy: 'Multiply VPD by 1000 to convert kPa to Pa; convert_forcing_to_bgc; [''In the met file, column
    7 (VPD) must be in Pa'', ''Typical values: 200-4000 Pa'', ''If values are 0.2-4.0, they are in kPa
    and must be multiplied by 1000'']; Use convert_forcing_to_bgc.py which computes VPD in Pa from temperature
    and hu'
  severity: silent
- id: dt_009
  symptom: No photosynthesis (GPP=0 every day) but LAI grows normally from initial conditions
  diagnosis: Day length column is 0, missing, or extremely small; BIOME-BGC uses day length (seconds)
    to partition day/night processes. If dayl=0, all shortwave is assigned to zero-length day, PAR=0,
    and photosynthesis cannot occur. LAI may still grow from storage pools.; ['s3_meteorological_forcing']
  remedy: 'Compute day length from latitude and day-of-year using astronomical formula; convert_forcing_to_bgc;
    [''Day length is NOT available from CMFD/MSWX -- it must be computed'', ''Use bgc_utils.compute_daylength(lat,
    yday)'', ''Typical values: 28000-60000 seconds (8-17 hours)'']; convert_forcing_to_bgc.py alwa'
  severity: silent
- id: dt_010
  symptom: 'Temperature-dependent processes all wrong: phenology timing off, respiration too high or low'
  diagnosis: Temperature in Kelvin instead of Celsius; BIOME-BGC expects Celsius. CMFD provides Kelvin.
    If Kelvin is passed directly, Tmax~300 K is interpreted as 300 C, causing extremely high respiration
    and wrong phenology.; ['s3_meteorological_forcing']
  remedy: Subtract 273.15 from all temperature fields; convert_forcing_to_bgc; ['Met file columns 3-5
    (Tmax, Tmin, Tday) must be in Celsius', 'If values are >100, they are likely Kelvin', 'Subtract 273.15
    from each']; convert_forcing_to_bgc.py auto-detects Kelvin (>100) and converts
  severity: silent
- id: dt_011
  symptom: Met file parsing error or model reads wrong number of days
  diagnosis: Wrong number of header lines specified in .ini, or file has tabs/inconsistent whitespace;
    BIOME-BGC skips N header lines (set in MET_INPUT section), then reads 9 columns per day using fscanf.
    Wrong header count or mixed delimiters cause parse failure.; ['s1_site_definition', 's3_meteorological_forci
  remedy: Verify header_lines count in .ini matches actual met file headers; ['Count header lines in met
    file (lines before data starts)', 'Set that count in the MET_INPUT section of .ini', 'Default is 4
    for MTCLIM format', 'Ensure data is space-separated (not tab-only)']; generate_site_ini.py sets header_lin
  severity: fatal
- id: dt_012
  symptom: Spinup never converges -- SOC keeps increasing after 6000 model years
  diagnosis: N deposition set to modern (high) value instead of pre-industrial for spinup; Pre-industrial
    N deposition was ~0.0001-0.0002 kgN/m2/yr. Modern values (0.001-0.01) provide excess N that continuously
    fertilizes the ecosystem, preventing C pool equilibrium.; ['s5_spinup']
  remedy: Use pre-industrial N deposition (0.0001-0.0002 kgN/m2/yr) for spinup; ['Set ndep to 0.0001 in
    spinup .ini SITE section', 'Use modern values only for the normal run', 'Consider ramped N deposition
    (RAMP_NDEP section)']; generate_site_ini.py defaults to 0.0001 kgN/m2/yr
  severity: degraded
- id: dt_013
  symptom: Spinup converges but soil mineral N pool goes negative
  diagnosis: N immobilization exceeds total N input over centuries; High C:N ratio litter (woody debris)
    requires N immobilization from soil mineral pool during decomposition. If N fixation + N deposition
    cannot keep up, sminn goes negative.; ['s5_spinup']
  remedy: Increase N fixation parameter or decrease litter C:N ratios; ['Increase nfix from 0.0004 to
    0.0008 kgN/m2/yr in SITE section', 'Or reduce deadwood_cn in .epc (e.g., from 729 to 500)', 'This
    is common for high-latitude/boreal forests']; Monitor sminn in annual output during test runs
  severity: degraded
- id: dt_014
  symptom: NEE strongly positive (source) for first 50+ years of normal run after spinup
  diagnosis: Spinup used different CO2 than normal run start year, causing C pool adjustment; If spinup
