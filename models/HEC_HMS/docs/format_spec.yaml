# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: HEC-HMS
  language: python
  implementation:
    id: hec-hms-python-equiv
    version: HydroCraft Python equivalent of HEC-HMS 4.x lumped methods
    provenance: Python; HydroCraft reimplementation of the public-domain SCS-CN / SCS-UH / Muskingum /
      Linear-Reservoir algorithms, producing equivalent results for lumped/semi-distributed basins.
  scientific_reference_version: HEC-HMS public-domain rainfall-runoff method set (USACE HEC; SCS Curve
    Number loss, SCS dimensionless Unit Hydrograph transform, Muskingum channel routing, Linear Reservoir
    baseflow)
inputs:
  forcing:
  - name: precipitation
    unit: mm/day (daily); mm/hr at sub-daily step; mm in event mode
    category: forcing
    source_kind: forcing
    model_input_format: per-timestep precipitation time series at the subbasin
    notes: At a sub-daily timestep the per-step depth must equal the daily depth divided by steps-per-day;
      missing days should be flagged (NaN/interpolated), not zero-filled, to avoid artificial dry spells.
  - name: temperature
    unit: degC
    category: forcing
    source_kind: forcing
    model_input_format: per-timestep air-temperature time series
    notes: Consumed only when snowmelt or temperature-based PET is active. Must be Celsius; Kelvin-valued
      inputs produce astronomically high PET.
  - name: potential_evapotranspiration
    unit: mm/day (Priestley-Taylor) or mm/month (Monthly Average)
    category: forcing
    source_kind: forcing
    model_input_format: per-timestep (or per-month) PET time series
    notes: Units are method-dependent and must match the selected ET method.
  - name: solar_radiation
    unit: MJ/m^2/day
    category: forcing
    source_kind: forcing
    model_input_format: per-timestep radiation time series
    notes: Used by Priestley-Taylor PET when active.
  parameters:
  - name: Curve Number (CN)
    unit: dimensionless
    category: parameter
    source_kind: dataset_lookup
    model_input_format: scalar per subbasin (derived from hydrologic soil group + land cover)
    notes: Controls total runoff volume; valid range 30-100. Sets maximum retention S = 25400/CN - 254
      (mm).
  - name: Hydrologic Soil Group (A/B/C/D)
    unit: categorical
    category: parameter
    source_kind: dataset_lookup
    model_input_format: soil class per subbasin
    notes: Infiltration class (A = high infiltration, D = low); feeds CN derivation.
  - name: initial abstraction ratio (lambda_ia)
    unit: dimensionless
    category: parameter
    source_kind: calibrated
    model_input_format: scalar (Ia = lambda_ia * S)
    notes: Range 0.05-0.20; 0.20 classic SCS, 0.05 per Woodward et al. 2003. Higher values raise the rainfall
      threshold below which runoff is zero.
  - name: time of concentration (Tc)
    unit: hr
    category: parameter
    source_kind: calibrated
    model_input_format: scalar per subbasin (e.g., from Kirpich)
    notes: Drives the unit-hydrograph time-to-peak Tp = 0.6*Tc + D/2.
  - name: Muskingum K
    unit: hr
    category: parameter
    source_kind: calibrated
    model_input_format: scalar per reach
    notes: Routing travel-time / delay; K > 0 required.
  - name: Muskingum X
    unit: dimensionless
    category: parameter
    source_kind: calibrated
    model_input_format: scalar per reach
    notes: Routing attenuation weight; valid range 0.0-0.5 (typically 0-0.3). X > 0.5 yields negative
      routing coefficients and negative flows.
  - name: Muskingum Steps
    unit: count
    category: parameter
    source_kind: calibrated
    model_input_format: integer per reach
    notes: Number of routing subreaches.
  - name: baseflow recession constant (k_base)
    unit: dimensionless
    category: parameter
    source_kind: calibrated
    model_input_format: scalar (0 < k < 1)
    notes: Linear-reservoir recession ratio; range 0.5-0.99, near 1.0 = slow recession. It is a dimensionless
      ratio, NOT a rate constant or conductivity.
  - name: recharge_fraction
    unit: dimensionless
    category: parameter
    source_kind: calibrated
    model_input_format: scalar
    notes: Fraction of loss diverted to the groundwater/baseflow store (calibration parameter); range
      0.01-0.20.
  - name: basin area
    unit: km^2
    category: parameter
    source_kind: dataset_lookup
    model_input_format: scalar per subbasin (from DEM + shapefile)
    notes: Used in runoff-depth-to-discharge conversion; must be km^2.
  - name: basin slope / longest-flow-path length
    unit: '% or m/m ; m or km'
    category: parameter
    source_kind: dataset_lookup
    model_input_format: scalars per subbasin (terrain-derived)
    notes: Used to estimate Tc / lag.
  initial_conditions:
  - name: initial baseflow (q_base_init)
    unit: m^3/s
    category: initial_condition
    source_kind: user_provided
    model_input_format: scalar
    notes: Range 0-1000; seeds the linear-reservoir baseflow store. Requires ~1 year spinup to equilibrate.
  - name: initial soil-moisture / retention state
    unit: mm
    category: initial_condition
    source_kind: default
    model_input_format: implied by CN-derived retention S at simulation start
    notes: Needs spinup (~1 year); discard the first year of output.
  boundary_conditions:
  - name: loss method selection (SCS Curve Number)
    unit: categorical
    category: boundary_condition
    source_kind: user_provided
    model_input_format: method switch
    notes: This implementation realizes the SCS-CN loss method only.
  - name: transform method selection (SCS Unit Hydrograph)
    unit: categorical
    category: boundary_condition
    source_kind: user_provided
    model_input_format: method switch
    notes: This implementation realizes the SCS dimensionless UH transform only.
  - name: routing method selection (Muskingum)
    unit: categorical
    category: boundary_condition
    source_kind: user_provided
    model_input_format: method switch
    notes: This implementation realizes Muskingum hydrologic routing only.
  - name: baseflow method selection (Linear Reservoir)
    unit: categorical
    category: boundary_condition
    source_kind: user_provided
    model_input_format: method switch
    notes: This implementation realizes the Linear-Reservoir baseflow store only.
  - name: computational interval D
    unit: hr
    category: boundary_condition
    source_kind: user_provided
    model_input_format: control timestep
    notes: Should satisfy D <= Tp/5 so the discrete unit hydrograph resolves the peak.
  - name: simulation period (start/end)
    unit: date
    category: boundary_condition
    source_kind: user_provided
    model_input_format: control start/end
    notes: Must lie within forcing-data coverage.
outputs:
  primary:
  - name: discharge
    unit: m^3/s
    description: Simulated routed streamflow at the basin (or subbasin) outlet.
    validation_rank: 1
    emitted_in: simulation output time series (parse_hms_output)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Discard ~1 year of spinup before scoring; baseflow and retention states need to equilibrate.
        - Peak timing depends on calibrated lag/Tp; magnitude depends on CN and lambda_ia.
      detrending_options:
      - none
  - name: runoff_depth
    unit: mm
    description: Direct-runoff water depth (excess-rainfall) per timestep from SCS-CN in the subbasin
      runoff path.
    validation_rank: 2
    emitted_in: simulation output time series (parse_hms_output)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Excess-rainfall depth is rarely observed directly; usually inferred.
      detrending_options:
      - none
  - name: loss
    unit: mm
    description: Soil-water infiltration/retention loss per timestep (loss = P - Q).
    validation_rank: 3
    emitted_in: simulation output time series (parse_hms_output)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Not directly observable; diagnostic of the loss-method partition.
      detrending_options:
      - none
  - name: subbasin_outflow
    unit: m^3/s
    description: Per-subbasin outflow (direct runoff + baseflow) available for downstream routing or coupling.
    validation_rank: 4
    emitted_in: simulation output time series (parse_hms_output)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Comparable to gauged inflow at internal junctions when such gauges exist.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_101
  symptom: Simulated discharge is 24x too high. Massive flood every day regardless of season.
  diagnosis: 'Precipitation in mm/day passed to hourly timestep without dividing by 24; CMFD provides
    daily precipitation in mm/day. If the model runs at hourly timestep, each hour receives the full daily
    amount instead of 1/24th. Total precipitation becomes 24x too large, producing unrealistic runoff.

    ; [''conver'
  remedy: 'Divide daily precipitation by number of timesteps per day when using sub-daily interval; convert_forcing_to_hms;
    [''Check if model timestep matches forcing timestep'', ''If forcing is daily and model is hourly:
    P_hr = P_day / 24'', ''Verify total annual precipitation is 400-2000 mm for most basins'']; con'
  severity: silent
- id: dt_102
  symptom: PET is extremely high (>100 mm/day). No snow accumulation even in winter. Unrealistic water
    balance.
  diagnosis: 'Temperature in Kelvin instead of Celsius for PET calculation; CMFD temperature is in Kelvin
    (typically 260-310 K). Hargreaves or Priestley-Taylor PET formulas expect Celsius. Passing 293 K as
    293°C yields astronomical PET values, draining all soil moisture and producing zero runoff.

    ; [''convert_forc'
  remedy: Subtract 273.15 from CMFD temperature before PET calculation; convert_forcing_to_hms; ['Check
    temperature range in forcing CSV — should be -30 to +45°C', 'If values > 200, they are in Kelvin —
    subtract 273.15']; convert_forcing_to_hms checks for T > 100 and auto-converts
  severity: silent
- id: dt_108
  symptom: Discharge is 10^6 too large or too small. Clearly wrong magnitude.
  diagnosis: 'Basin area in m² instead of km² (or vice versa) in runoff-to-discharge conversion; Converting
    runoff depth (mm) to discharge (m³/s) requires: Q = runoff_mm * area_km2 * 1000 / 86400. If area is
    accidentally in m² (e.g., from shapefile area calculation), the result is 10^6 too large.

    ; [''run_hec_hms'''
  remedy: 'Verify basin area units. Shapefile .area returns m² — divide by 1e6 for km²; parse_hms_output;
    [''Check basin area: Bengbu should be ~121,330 km²'', ''If using geopandas: area_km2 = gdf.to_crs(epsg=6933).area.sum()
    / 1e6'']; run_hec_hms prints basin area and checks against expected range'
  severity: silent
- id: dt_110
  symptom: PET values unrealistically high or low. Seasonal cycle absent.
  diagnosis: 'Radiation in W/m² not converted to MJ/m²/day for Priestley-Taylor PET; CMFD shortwave radiation
    is in W/m². Priestley-Taylor PET expects net radiation in MJ/m²/day. Conversion: MJ/m²/day = W/m²
    × 0.0864. Omitting this conversion gives PET ~12x too large (since 1 MJ ≈ 11.6 W·day).

    ; [''convert_forcing'
  remedy: 'Multiply W/m² by 0.0864 to get MJ/m²/day before PET calculation; convert_forcing_to_hms; [''Check
    radiation values — W/m² range: 0-400; MJ/m²/day range: 0-35'']; convert_forcing_to_hms applies conversion
    automatically'
  severity: silent
- id: dt_114
  symptom: Simulated discharge looks reasonable in shape but magnitude is wrong by factor of ~1000/86400
  diagnosis: Runoff mm to m³/s conversion missing the 1000 or 86400 factor; The correct conversion is
    Q(m³/s) = runoff(mm) × area(km²) × 1000 / 86400. The 1000 converts mm·km² to m³ (1 mm on 1 km² = 1000
    m³). The 86400 converts per-day to per-second. Missing either factor gives wrong magnitude with correct
    tempo
  remedy: 'Use Q = runoff_mm * area_km2 * 1000 / 86400 exactly; parse_hms_output; [''For Bengbu (121,330
    km²): 1 mm/day runoff ≈ 1404 m³/s'', ''Mean annual runoff ~200-300 mm → mean Q ~300-500 m³/s'']; parse_hms_output
    validates discharge magnitude against expected range'
  severity: silent
- id: dt_118
  symptom: ET is ~30x too high or too low. Monthly PET values used as daily.
  diagnosis: Monthly average PET (mm/month) used directly as daily PET (mm/day); HEC-HMS Monthly Average
    ET expects values in mm/month. If these are divided by days-in-month to get daily values but then
    the model internally divides again, ET is ~30x too low. Conversely, if daily PET is passed as monthly,
    ET is 3
  remedy: 'Verify PET units match the method. Monthly Average expects mm/month. Priestley-Taylor expects
    mm/day.; convert_forcing_to_hms; [''Monthly PET range: 30-200 mm/month; Daily PET range: 1-8 mm/day''];
    validate_outputs checks PET range against expected daily/monthly bounds'
  severity: silent
- id: dt_103
  symptom: Zero runoff regardless of rainfall amount. Hydrograph is flat at baseflow.
  diagnosis: 'Curve Number is 0, NaN, or below 30 due to failed soil group lookup; SCS Curve Number valid
    range is 30-100. If the HWSD soil group lookup returns no data (ocean, missing tile, or wrong CRS),
    CN defaults to 0 or NaN. With CN=0, S=infinity, and Q=0 for any realistic rainfall.

    ; [''convert_soil_to_hms'''
  remedy: 'Validate CN is in [30, 100]. If NaN or 0, check HWSD spatial overlap with basin.; convert_soil_to_hms;
    [''Check soil group distribution: A/B/C/D should sum to 100% within basin'', ''If all NaN: verify
    basin shapefile CRS matches HWSD CRS (both should be EPSG:4326)'']; convert_soil_to_hms validates
    CN ra'
  severity: silent
- id: dt_104
  symptom: Simulated runoff volume is significantly less than observed. Model systematically underestimates
    peaks.
  diagnosis: Initial abstraction ratio Ia/S = 0.2 (classic) used instead of 0.05 (recommended); The classic
    SCS method uses Ia = 0.2*S, meaning 20% of maximum retention must be satisfied before runoff begins.
    USDA research (Woodward et al. 2003) found that Ia = 0.05*S better fits most observed data. Using
    0.2 in
  remedy: Set Ia_ratio = 0.05 for humid/semi-humid basins. Keep 0.2 only for arid regions.; run_hec_hms;
    ['Compare simulated vs observed annual runoff volume', 'If PBIAS < -20%, try reducing Ia_ratio from
    0.2 to 0.05']; calibrate_hms.py includes Ia_ratio in calibration parameter space
  severity: medium
- id: dt_111
  symptom: Green-Ampt model produces no infiltration or instant saturation.
  diagnosis: 'Suction head or hydraulic conductivity values unrealistic for soil type; Green-Ampt wetting
    front suction head ranges from 5 cm (sand) to 32 cm (clay). Saturated hydraulic conductivity ranges
    from 0.03 cm/hr (clay) to 11.8 cm/hr (sand). Values outside these ranges indicate wrong soil classification '
  remedy: 'Cross-reference soil properties with USDA soil texture triangle; convert_soil_to_hms; [''Check
    Ksat: sand 11.8 cm/hr, loam 1.3 cm/hr, clay 0.03 cm/hr'', ''Check suction: sand 5 cm, loam 9 cm, clay
    32 cm'']; convert_soil_to_hms validates against USDA lookup tables'
  severity: silent
- id: dt_105
  symptom: Unit hydrograph peak is clipped or poorly resolved. Peak discharge significantly underestimated.
  diagnosis: 'Computational interval D is too large relative to time-to-peak Tp; SCS UH requires D <=
    0.29*Tp for adequate peak resolution. If D > Tp/3, the discrete convolution misses the true peak,
    and the routed hydrograph is flattened and delayed.

    ; [''run_hec_hms'']'
  remedy: Set D <= Tp/5. For Tp=24hr, use D <= 4.8hr (e.g., D=1hr or D=3hr); run_hec_hms; ['Check Tp value
    and compare to model timestep', 'If timestep > Tp/3, reduce timestep or increase Tp']; run_hec_hms
    warns if D > 0.29*Tp
  severity: medium
- id: dt_106
  symptom: Negative discharge values in routed flow. Oscillating hydrograph.
  diagnosis: 'Muskingum X > 0.5 or routing timestep violates Courant condition; Muskingum routing coefficients
    C1, C2, C3 must all be non-negative for stable routing. This requires 2*K*X <= dt <= 2*K*(1-X). If
    X > 0.5, C1 can become negative. If dt > 2*K*(1-X), C3 becomes negative, causing oscillations.

    ; [''run_h'
  remedy: Constrain X to [0, 0.5]. Verify dt satisfies 2KX <= dt <= 2K(1-X).; run_hec_hms; ['Print C1,
    C2, C3 — all must be >= 0', 'If any negative, adjust K, X, or dt']; run_hec_hms checks Courant condition
    and warns
  severity: error
- id: dt_113
  symptom: Very small storms produce exactly zero runoff. Only large storms generate flow.
  diagnosis: 'SCS-CN initial abstraction Ia is larger than most daily precipitation events; With CN=65
    and Ia_ratio=0.2: S = 25400/65 - 254 = 136.8 mm; Ia = 0.2*136.8 = 27.4 mm. Any rain < 27.4 mm/day
    produces zero runoff. In areas with many small rain events, this eliminates most of the runoff volume.

    ; [''run_he'
  remedy: Use Ia_ratio=0.05 to reduce the threshold. Or increase CN if soil/land cover warrants.; run_hec_hms;
    ['Calculate Ia = Ia_ratio * (25400/CN - 254)', 'Compare Ia to median daily precipitation', 'If Ia
    > median P, most days produce zero runoff — reduce Ia_ratio or increase CN']; run_hec_hms logs Ia
    thr
  severity: medium
- id: dt_109
  symptom: Time series shifted by one day. Peaks occur a day early or late compared to observations.
  diagnosis: 'DSS midnight convention: 2400 = end of day, not start of next day; HEC-DSS uses 2400 to
    denote the end of a day (equivalent to 0000 of the next day). When converting DSS time series to pandas
    timestamps, 2400 must be mapped to 00:00 of the following day. Incorrect handling shifts the entire
    series b'
  remedy: 'When reading DSS: replace 2400 with 0000 and add 1 day to date; convert_forcing_to_hms; [''Compare
    forcing timestamps with an independent source'', ''Check if peaks are consistently offset by 1 day''];
    Python tools use pandas datetime which avoids DSS convention issues'
  severity: medium
- id: dt_112
  symptom: HEC-HMS run fails with 'No meteorologic model found' or 'Basin model not linked'.
  diagnosis: 'Basin model, meteorologic model, and control specs not properly linked in .run file; HEC-HMS
    requires a .run file that explicitly links: (1) a basin model name matching the .basin file, (2) a
    meteorologic model name matching the .met file, and (3) a control specification name matching the
    .control f'
  remedy: Verify that names in .run file exactly match names in .basin, .met, and .control files; run_hec_hms;
    ['Open .run file — check Basin Model, Met Model, Control names', 'Open corresponding files — verify
    the names match exactly (case-sensitive)']; Python tools bypass native file format by computing dir
  severity: error
- id: dt_115
  symptom: 'Model crashes or produces empty output. Error: ''No data for specified period''.'
  diagnosis: 'Simulation period extends beyond available forcing data; If the control specification requests
    1980-1990 but forcing data only covers 1985-1990, the model either crashes or produces NaN for the
    missing period. This is common when CMFD files are partially downloaded.

    ; [''run_hec_hms'', ''convert_forcin'
  remedy: 'Verify forcing data covers the entire simulation period; convert_forcing_to_hms; [''List available
    forcing files: ls *_{yyyy}.nc'', ''Verify continuous coverage from start_date to end_date'']; convert_forcing_to_hms
    validates date range coverage'
  severity: error
- id: dt_116
  symptom: Peak arrives much too early or too late compared to observations.
  diagnosis: Lag time (Tp) unrealistic for basin size; SCS lag time depends on basin slope, length, and
    CN. For large basins like Bengbu (121,330 km²), Tp should be on the order of days, not hours. For
    small urban catchments, Tp is typically 0.5-6 hours. Using a small-basin lag time on a large basin
    compresses t
  remedy: 'Estimate Tp from basin characteristics: Tp = L^0.8 * (S+1)^0.7 / (1140 * Y^0.5) [SCS method];
    run_hec_hms; [''L = hydraulic length (longest flow path) in feet'', ''S = (1000/CN) - 10 [inches]'',
    ''Y = average basin slope in %'']; run_hec_hms validates Tp against basin area heuristic'
  severity: medium
- id: dt_117
  symptom: Dry spells much longer than expected. Simulated baseflow recession unrealistically fast.
  diagnosis: Missing precipitation days filled with zero instead of NaN or interpolated; When CMFD NetCDF
    files have missing days (corrupt files, gaps), filling with zero precipitation creates artificial
    dry spells. This is indistinguishable from real dry periods but can severely underestimate total runoff
    volum
  remedy: Flag missing days as NaN. Interpolate short gaps (<3 days). Report long gaps.; convert_forcing_to_hms;
    ['Count consecutive zero-precipitation days — > 30 days is suspicious', 'Cross-reference with nearby
    stations or alternative forcing datasets']; convert_forcing_to_hms logs gap statistics and warns
  severity: medium
- id: dt_107
  symptom: Baseflow is constant or decays instantly. No seasonal baseflow pattern.
  diagnosis: Recession constant confused with hydraulic conductivity or decay rate; HEC-HMS linear reservoir
    baseflow uses a dimensionless recession constant k (0 < k < 1). k=0.95 means 95% of baseflow persists
    to the next timestep (slow recession). k=0.5 means rapid decay. This is NOT a rate (1/time) or conduct
  remedy: 'Set recession constant as dimensionless ratio 0.5-0.99. Start with 0.95 for large basins.;
    run_hec_hms; [''Check baseflow recession: plot log(Q_base) vs time — should be linear'', ''Estimate
    k from observed recession: k = Q(t+1)/Q(t) during dry periods'']; run_hec_hms validates k is in [0.01,
    0.999]'
  severity: silent
