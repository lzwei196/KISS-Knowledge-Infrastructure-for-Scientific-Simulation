  severity: fatal
- id: dt_014
  symptom: Only part of the domain is solved. Some regions have zero velocity. Solution looks incomplete.
  diagnosis: 'Mesh contains disconnected regions — separate mesh components not linked; If the domain
    outline produces multiple disconnected polygons or the mesher creates isolated element groups, the
