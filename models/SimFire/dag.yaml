template_version: "3.5"

identity:
  model_id: "SimFire"
  scientific_reference_version: "Rothermel surface fire spread model (USDA Forest Service RMRS-GTR-371; Anderson FBFM-13 fuel models)"
  implementation:
    id: "simfire"
    version: "2.0.1"
    provenance: "Python; MITRE Fireline open-source 2-D cellular wildfire simulator implementing the Rothermel surface fire spread equation over a pixel grid."
  ki_class: "forward_model"
  is_family_dag: false
  language: "python"
  license: "Apache-2.0"
  repo_url: "https://github.com/mitrefireline/simfire"

boundary:
  scope_in:
    - "Surface wildfire spread over a 2-D gridded landscape via the Rothermel rate-of-spread equation"
    - "Per-pixel fuel (FBFM-13), elevation/slope, prescribed wind, and fuel-moisture forcing of spread"
    - "Fire-fighting mitigation via control lines (fireline / scratchline / wetline) that attenuate or block spread"
    - "Reinforcement-learning environment exposing fire_map state and accepting agent mitigation actions"
  scope_out:
    - "Crown / canopy fire physics (surface fire only)"
    - "Atmospheric or weather forecasting; wind is prescribed (simple / perlin / cfd), not dynamically coupled"
    - "Fire-atmosphere feedback, spotting, and ember transport"
    - "Calibrated/validated physical fire prediction (it is a cellular Rothermel approximation, no formal validation suite)"
  spatial: "2-D grid"
  temporal: "discrete time stepping (minutes-per-step set by update_rate)"
  closure: "none"
  notes: "No conserved physical quantity is balanced. State evolves by a cellular-automaton ignition rule: each burning pixel accumulates burn_amounts (= Rothermel rate of spread x update_rate) until it exceeds pixel_scale, then ignites 4- or 8-connected neighbors; burning pixels are pruned to BURNED after max_fire_duration steps. Internal computation uses US-customary units (ft, lb/ft2, ft/min, BTU/lb) per the Rothermel paper convention, while operational LandFire inputs are metric, creating documented unit-conversion coupling."

inputs:
  forcing:
    - category: "atmospheric"
      name: "wind speed"
      unit: "mph (config); converted internally to ft/min via mph_to_ftpm"
      source_kind: "forcing"
      model_input_format: "wind.simple.speed / wind.perlin.speed.range_* (mph) or wind.cfd.speed (m/s); per-pixel U grid in ft/min internally"
      notes: "Authored in mph in YAML and converted by mph_to_ftpm; a pre-converted ft/min value is multiplied by ~88 again (catastrophic over-spread). m/s authored as mph under-spreads by ~2.24x. CFD path takes m/s."
    - category: "atmospheric"
      name: "wind direction"
      unit: "degrees clockwise from North (TO-direction convention)"
      source_kind: "forcing"
      model_input_format: "wind.simple.direction / wind.perlin.direction.range_* (degrees); per-pixel U_dir grid"
      notes: "TO-direction: 90 means wind blows toward East, the OPPOSITE of meteorological 'from' convention. rothermel.py uses radians(90 - U_dir); fire spreads toward U_dir."
    - category: "environment"
      name: "dead fuel moisture"
      unit: "fraction"
      source_kind: "forcing"
      model_input_format: "environment.moisture (scalar fraction, M_f)"
      notes: "Fraction not percent (0.03 = 3%). If M_f >= fuel moisture of extinction M_x, the moisture damping eta_M floors to ~0 and fire silently never spreads."
  parameters:
    - category: "fuel_bed"
      name: "oven-dry fuel load (w_0)"
      unit: "lb/ft2"
      source_kind: "dataset_lookup"
      model_input_format: "per-pixel Fuel(w_0) from FBFM-13 preset (1-13) or procedural function; range 0.034-0.321"
      notes: "FBFM-13 presets already in lb/ft2; only custom fuels risk kg/m2 confusion (x0.2048)."
    - category: "fuel_bed"
      name: "fuel bed depth (delta)"
      unit: "ft"
      source_kind: "dataset_lookup"
      model_input_format: "per-pixel Fuel(delta) from FBFM-13 preset; range 0.2-6.0"
    - category: "fuel_bed"
      name: "dead fuel moisture of extinction (M_x)"
      unit: "fraction"
      source_kind: "dataset_lookup"
      model_input_format: "per-pixel Fuel(M_x) from FBFM-13 preset; range 0.12-0.40"
    - category: "fuel_bed"
      name: "surface-area-to-volume ratio (sigma)"
      unit: "ft2/ft3"
      source_kind: "dataset_lookup"
      model_input_format: "per-pixel Fuel(sigma) from FBFM-13 preset; range 1145-3500"
    - category: "fuel_particle"
      name: "low heat content (h)"
      unit: "BTU/lb"
      source_kind: "default"
      model_input_format: "FuelParticle.h constant = 8000 (hardcoded, not exposed in config)"
    - category: "fuel_particle"
      name: "total mineral content (S_T)"
      unit: "fraction"
      source_kind: "default"
      model_input_format: "FuelParticle.S_T constant = 0.0555"
    - category: "fuel_particle"
      name: "effective mineral content (S_e)"
      unit: "fraction"
      source_kind: "default"
      model_input_format: "FuelParticle.S_e constant = 0.01"
    - category: "fuel_particle"
      name: "oven-dry particle density (rho_p)"
      unit: "lb/ft3"
      source_kind: "default"
      model_input_format: "FuelParticle.p_p constant = 32"
    - category: "topography"
      name: "elevation"
      unit: "ft"
      source_kind: "dataset_lookup"
      model_input_format: "per-pixel TopographyLayer elevation grid (operational LandFire 30 m, functional Perlin/Gaussian/flat, or historical); slope magnitude and aspect derived via np.gradient(elevation, pixel_scale)"
      notes: "Internal slope uses feet; custom DEM in meters makes the slope factor ~10.8x too small (x3.28084 to convert)."
    - category: "control_line_attenuation"
      name: "RoS attenuation magnitudes"
      unit: "ft/min subtracted from RoS"
      source_kind: "default"
      model_input_format: "RoSAttenuation FIRELINE=980 / SCRATCHLINE=490 / WETLINE=245 (hardcoded enums; applied when ros_attenuation=true)"
  initial_conditions:
    - category: "fire"
      name: "ignition position"
      unit: "pixels (row, col)"
      source_kind: "user_provided"
      model_input_format: "fire.fire_initial_position (static / random / historical); seeds the initial BURNING pixel(s) in fire_map"
  boundary_conditions:
    - category: "grid_geometry"
      name: "screen_size"
      unit: "pixels"
      source_kind: "user_provided"
      model_input_format: "area.screen_size [height, width]"
    - category: "grid_geometry"
      name: "pixel_scale"
      unit: "ft/pixel"
      source_kind: "user_provided"
      model_input_format: "area.pixel_scale (feet per pixel)"
      notes: "Couples to ignition timing, not only resolution: a pixel ignites when burn_amounts > pixel_scale, so pixel_scale silently sets spread timing. Should equal resolution_meters x 3.28084."
    - category: "time_control"
      name: "update_rate"
      unit: "min/step"
      source_kind: "user_provided"
      model_input_format: "simulation.update_rate (minutes per step)"
      notes: "RoS is multiplied by update_rate before accruing into burn_amounts, so temporal discretization directly scales effective spread."
    - category: "time_control"
      name: "runtime"
      unit: "time string ('Xd Xh Xm')"
      source_kind: "user_provided"
      model_input_format: "simulation.runtime parsed via str_to_minutes; total_updates = round(minutes / update_rate)"
    - category: "spread_topology"
      name: "diagonal_spread"
      unit: "bool"
      source_kind: "user_provided"
      model_input_format: "fire.diagonal_spread (true = 8-connected, false = 4-connected)"
      notes: "False halves effective spread and yields a cross/diamond shape instead of an ellipse."
    - category: "sprite_lifetime"
      name: "max_fire_duration"
      unit: "frames (update steps)"
      source_kind: "user_provided"
      model_input_format: "fire.max_fire_duration; sprite pruned to BURNED once duration >= this"
      notes: "Too low (1-2) prunes sprites before they ignite neighbors and the fire dies out."
    - category: "mitigation_mode"
      name: "ros_attenuation"
      unit: "bool"
      source_kind: "user_provided"
      model_input_format: "mitigation.ros_attenuation (true subtracts RoSAttenuation, false zeroes RoS at control lines)"
    - category: "fuel_terrain_mode"
      name: "terrain/fuel layer mode"
      unit: "enum"
      source_kind: "structural"
      model_input_format: "operational (LandFire FBFM-13 + elevation, 30 m) / functional (procedural) / historical (BurnMD); historical cannot mix with operational or functional"
    - category: "operational_extent"
      name: "operational geolocation and extent"
      unit: "lat/lon decimal degrees; height/width meters; resolution 30 m; year"
      source_kind: "user_provided"
      model_input_format: "operational.latitude/longitude/height/width/resolution/year; height/width in METERS, resolution must be 30"

processes:
  modules:
    - name: "Rothermel"
      role: "process_solver"
      brief: "Vectorized Rothermel surface fire spread equation: R = (I_R x xi x (1 + phi_w + phi_s)) / (rho_b x epsilon x Q_ig) in ft/min, from fuel (w_0, delta, M_x, sigma), particle constants (h, S_T, S_e, rho_p), moisture M_f, wind U/U_dir, and slope. Negative RoS and headwind-along-travel are clamped to 0 ('a fire cannot put itself out')."
    - name: "FuelLayer"
      role: "allocator"
      brief: "Provides per-pixel Fuel(w_0, delta, M_x, sigma) from FBFM-13 integer codes (presets / FuelModelToFuel) in operational mode or procedural functions in functional mode."
    - name: "TopographyLayer"
      role: "allocator"
      brief: "Provides per-pixel elevation (ft); operational (LandFire), functional (Perlin/Gaussian/flat), or historical."
    - name: "SlopeComputation"
      role: "process_solver"
      brief: "Precomputes slope magnitude and aspect from elevation via np.gradient(elevation, pixel_scale); feeds the Rothermel slope factor phi_s (note: phi_s uses slope^2, a model-specific approximation rather than tan(slope)^2)."
    - name: "WindField"
      role: "allocator"
      brief: "Produces uniform or per-pixel wind speed (ft/min) and direction; simple (constant), perlin (Simplex-noise spatial), or cfd (Navier-Stokes solver)."
    - name: "RothermelFireManager"
      role: "driver"
      brief: "Per-step spatial spread engine: gathers unburned 4-/8-connected neighbors of each burning sprite, calls the Rothermel solver, scales RoS by update_rate, accumulates burn_amounts, ignites pixels crossing the pixel_scale threshold, and prunes expired sprites."
    - name: "FireManager"
      role: "integrator"
      brief: "Base state manager: maintains sprites and durations, prunes sprites (duration >= max_fire_duration -> BURNED), filters new neighbor locations, and applies control-line attenuation to RoS."
    - name: "ConstantSpreadFireManager"
      role: "optional_module"
      brief: "Non-physical alternative manager spreading at a fixed rate in all directions; used for testing/baselines instead of Rothermel."
      applicability: "baseline/test mode only (not the Rothermel physics path)"
    - name: "MitigationManager"
      role: "optional_module"
      brief: "Places control-line BurnStatus values (FIRELINE / SCRATCHLINE / WETLINE) and agent positions onto fire_map; these are later read back by FireManager to attenuate or block RoS."
      applicability: "when mitigation lines or RL agent actions are applied"
    - name: "FireSpreadGraph"
      role: "optional_module"
      brief: "Directed graph recording which burning pixel ignited which neighbor; built incrementally for spread-graph visualization."
      applicability: "when spread-graph output requested"
  internal_edges:
    - from: "Inputs"
      to: "FuelLayer"
      kind: "consumes_input"
      brief: "FBFM-13 codes / procedural settings resolved to per-pixel Fuel parameters."
    - from: "Inputs"
      to: "TopographyLayer"
      kind: "consumes_input"
      brief: "Elevation grid loaded from operational/functional/historical source."
    - from: "TopographyLayer"
      to: "SlopeComputation"
      kind: "invokes"
      brief: "Elevation gradient scaled by pixel_scale yields slope magnitude/aspect."
    - from: "SlopeComputation"
      to: "slope_mag"
      kind: "writes_state"
      brief: "Precomputed slope magnitude stored at init."
    - from: "SlopeComputation"
      to: "slope_dir"
      kind: "writes_state"
      brief: "Precomputed slope aspect stored at init."
    - from: "FuelLayer"
      to: "Rothermel"
      kind: "invokes"
      brief: "Per-pixel fuel parameters feed reaction intensity and propagating flux."
    - from: "slope_mag"
      to: "Rothermel"
      kind: "reads_state"
      brief: "Slope magnitude/aspect feed the slope factor phi_s."
    - from: "WindField"
      to: "Rothermel"
      kind: "invokes"
      brief: "Wind speed/direction feed the wind factor phi_w."
    - from: "Inputs"
      to: "Rothermel"
      kind: "consumes_input"
      brief: "Fuel-particle constants (h=8000, S_T=0.0555, S_e=0.01, rho_p=32) and moisture M_f broadcast into every Rothermel call."
    - from: "RothermelFireManager"
      to: "Rothermel"
      kind: "invokes"
      brief: "Each step passes per-neighbor fuel/wind/slope to the Rothermel solver."
    - from: "Rothermel"
      to: "rate_of_spread"
      kind: "writes_state"
      brief: "Returns R (ft/min) per pixel; subsequently scaled by update_rate."
    - from: "MitigationManager"
      to: "fire_map"
      kind: "writes_state"
      brief: "Writes FIRELINE / SCRATCHLINE / WETLINE statuses into fire_map."
    - from: "fire_map"
      to: "FireManager"
      kind: "reads_state"
      brief: "Control-line statuses read back to subtract RoSAttenuation (or zero RoS) at those pixels; also used for neighbor filtering."
    - from: "rate_of_spread"
      to: "burn_amounts"
      kind: "writes_state"
      brief: "burn_amounts += (attenuated RoS x update_rate) each step."
    - from: "burn_amounts"
      to: "fire_map"
      kind: "writes_state"
      brief: "Pixels with burn_amounts > pixel_scale transition UNBURNED -> BURNING."
    - from: "FireManager"
      to: "fire_map"
      kind: "writes_state"
      brief: "Sprites with duration >= max_fire_duration mark their pixel BURNED."
    - from: "RothermelFireManager"
      to: "FireSpreadGraph"
      kind: "invokes"
      brief: "Newly ignited coordinates added as graph edges from the parent burning pixel."
    - from: "RothermelFireManager"
      to: "elapsed_time"
      kind: "writes_state"
      brief: "elapsed_time += update_rate each step; checked against runtime for termination."
    - from: "fire_map"
      to: "Outputs"
      kind: "produces_output"
      brief: "Final fire_map (BurnStatus grid) returned by FireSimulation.run; consumed for burn area, perimeter, spread-rate, and accuracy metrics."

states:
  variables:
    - name: "fire_map"
      unit: "BurnStatus enum (0 UNBURNED, 1 BURNING, 2 BURNED, 3 FIRELINE, 4 SCRATCHLINE, 5 WETLINE)"
      role: "prognostic"
    - name: "burn_amounts"
      unit: "ft"
      role: "accumulator"
    - name: "rate_of_spread"
      unit: "ft/min"
      role: "diagnostic"
    - name: "slope_mag"
      unit: "ft/ft (gradient magnitude)"
      role: "diagnostic"
    - name: "slope_dir"
      unit: "radians (aspect)"
      role: "diagnostic"
    - name: "U"
      unit: "ft/min"
      role: "diagnostic"
    - name: "U_dir"
      unit: "degrees CW from North"
      role: "diagnostic"
    - name: "elapsed_time"
      unit: "minutes"
      role: "accumulator"
    - name: "elapsed_steps"
      unit: "count"
      role: "accumulator"
    - name: "durations"
      unit: "update steps (per sprite)"
      role: "accumulator"
    - name: "sprites"
      unit: "list of active burning-pixel sprites"
      role: "prognostic"
    - name: "fs_graph"
      unit: "directed fire-spread graph"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "fire_map"
    validation_rank: 3
    unit: "BurnStatus enum grid (0-5), shape (H, W)"
    description: "Per-pixel burn/control-line status at end of run; the final fire footprint (burned vs unburned) and placed control lines."
    emitted_in: "in-memory FireSimulation.fire_map; persisted as .npy / .h5 / .jsonl when save_data=true"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families:
            - "spatial_pattern_match"
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Compare the binarized burned/unburned mask against an observed fire perimeter; the model's native validation metrics are Sorensen coefficient, Cohen's kappa, commission error and omission error."
            - "Compared maps must share grid size and georeferencing; size mismatch is a hard failure."
        - obs_shape: "categorical_event"
          comparison_mode: "categorical_event_comparison"
          metric_families:
            - "event_detection"
          determining_metric: "csi"
          caveats:
            - "Per-pixel burned/not-burned hit/miss classification against an observed perimeter; sensitive to ignition placement and pixel_scale."
      detrending_options:
        - "none"
  - var: "burned_area"
    validation_rank: 1
    unit: "acres / ha (derived as burned_pixels x pixel_scale^2, /43560 for acres)"
    description: "Total area burned at end of run, derived from the burned-pixel count and pixel_scale."
    emitted_in: "derived from fire_map (burned-pixel count x pixel_scale^2)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Area is acutely sensitive to a correct pixel_scale (feet) and the ft2->acres conversion; an unmatched pixel_scale biases area by 2-10x."
      detrending_options:
        - "none"
  - var: "fire_perimeter_length"
    validation_rank: 2
    unit: "ft / miles (edge-pixel count x pixel_scale)"
    description: "Length of the fire perimeter at end of run, derived from boundary pixels of the burned region."
    emitted_in: "derived from fire_map (edge-pixel count x pixel_scale)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Perimeter length depends on grid resolution; coarse pixel_scale discretizes the boundary and biases length."
      detrending_options:
        - "none"
  - var: "rate_of_spread"
    validation_rank: 4
    unit: "ft/min (convert to m/s /196.85 or chains/hr /1.1)"
    description: "Fire rate of spread over time; the core Rothermel output, per-pixel and as a time series of head-fire spread."
    emitted_in: "in-memory RothermelFireManager.rate_of_spread (derived time series)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families:
            - "magnitude_accuracy"
            - "temporal_pattern_match"
          determining_metric: "nse"
          caveats:
            - "Defensible only where an observed or reference head-fire spread-rate series exists; SimFire has no calibrated/validated ROS dataset of its own."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families:
            - "magnitude_accuracy"
          determining_metric: "pbias"
          caveats:
            - "Compare a representative head-fire ROS against a measured spread rate; sensitive to wind/moisture unit conventions."
      detrending_options:
        - "none"

influence:
  edges:
    - from: "wind speed"
      to: "rate_of_spread"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "boundary_forcing"
      applicability: "Rothermel core; fuel-model dependent"
      citations:
        - "liu2015_rothermel_hdmr"
        - "jimenez2008_rothermel_uncertainty"
        - "kc2021_gsa_firespread_methods"
        - "ervilha2017_rothermel_pce"
    - from: "dead fuel moisture"
      to: "rate_of_spread"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "boundary_forcing"
      applicability: "Rothermel core; consistently top-ranked with wind"
      citations:
        - "jimenez2008_rothermel_uncertainty"
        - "kc2021_gsa_firespread_methods"
        - "liu2015_rothermel_hdmr"
    - from: "fuel bed depth (delta)"
      to: "rate_of_spread"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "fuel-model dependent (up to ~40% of variance in light logging slash)"
      citations:
        - "liu2015_rothermel_hdmr"
    - from: "live fuel moisture"
      to: "rate_of_spread"
      sensitivity_grade: "HIGH"
      basis: "cross_family_model_literature"
      lever_type: "boundary_forcing"
      applicability: "fuel models with high live-fuel fraction"
      citations:
        - "jolly2007_livefuelmoisture_sensitivity"
    - from: "oven-dry fuel load (w_0)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "Rothermel core; below wind/depth/dead-moisture in rankings"
      citations:
        - "liu2015_rothermel_hdmr"
        - "ervilha2017_rothermel_pce"
    - from: "low heat content (h)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "large in all fuel models per HDMR but secondary to wind and fuel depth"
      citations:
        - "liu2015_rothermel_hdmr"
    - from: "surface-area-to-volume ratio (sigma)"
      to: "rate_of_spread"
      sensitivity_grade: "MEDIUM"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "fuel-model dependent"
      citations:
        - "liu2015_rothermel_hdmr"
        - "ervilha2017_rothermel_pce"
    - from: "slope"
      to: "rate_of_spread"
      sensitivity_grade: "LOW"
      basis: "cross_family_model_literature"
      lever_type: "parameter"
      applicability: "lower-order contributor than wind and fuel moisture"
      citations:
        - "jimenez2008_rothermel_uncertainty"
        - "liu2015_rothermel_hdmr"
  citation_index:
    liu2015_rothermel_hdmr:
      short_citation: "Liu, Hussaini & Okten 2015"
      doi: "10.1139/cjfr-2015-0148"
      note: "Variance-based global sensitivity (ANOVA-HDMR / Sobol) of the Rothermel model; wind speed and fuel depth up to ~85% of ROS variance in light logging slash; rankings strongly fuel-model dependent."
    jimenez2008_rothermel_uncertainty:
      short_citation: "Jimenez, Hussaini & Goodrick 2008"
      doi: "10.1071/WF07070"
      note: "Polynomial-chaos parametric UQ of Rothermel ROS; wind and dead fuel moisture established as dominant drivers of ROS variance."
    ervilha2017_rothermel_pce:
      short_citation: "Ervilha, Pereira & Pereira 2017"
      doi: "10.1016/j.apm.2016.06.026"
      note: "Polynomial-chaos parametric UQ of Rothermel ROS propagating wind, fuel moisture and fuel-bed parameter uncertainty (DOI inferred from publisher article id)."
    jolly2007_livefuelmoisture_sensitivity:
      short_citation: "Jolly 2007"
      doi: "10.1071/WF06077"
      note: "Sensitivity of Rothermel fuel models to live fuel moisture across all 53 standard models; 10% live-moisture change can alter behaviour by an order of magnitude in some fuel models."
    kc2021_gsa_firespread_methods:
      short_citation: "U.K.C., Aryal, Garg et al. 2021"
      doi: "10.1016/j.envsoft.2021.105110"
      note: "Comparison of Morris/Sobol/FAST/PAWN GSA on empirical fire spread models including Rothermel; dead fuel moisture and wind speed strongly influence ROS."

safety:
  hazards:
    - id: "wind_speed_ftpm_double_conversion"
      kind: "weather_file_semantic"
      description: "wind speed authored in ft/min (or m/s mislabeled as mph) instead of mph; mph_to_ftpm reapplies internally, giving ~88x over-strong wind and catastrophic spread (or ~2.24x under-spread for m/s)."
      severity: "silent"
    - id: "wind_direction_to_vs_from_convention"
      kind: "weather_file_semantic"
      description: "wind direction is a TO-direction (bearing the wind blows toward); supplying a meteorological 'from' bearing makes the head fire spread in the opposite direction."
      severity: "silent"
    - id: "moisture_percent_vs_fraction"
      kind: "weather_file_semantic"
      description: "fuel moisture M_f authored as percent (3) instead of fraction (0.03); moisture damping eta_M floors to ~0 and the fire silently never spreads."
      severity: "silent"
    - id: "moisture_at_or_above_extinction"
      kind: "weather_file_semantic"
      description: "M_f >= moisture of extinction M_x for all fuels; eta_M ~0, fire ignites but never spreads (masquerades as a fatal data error)."
      severity: "silent"
    - id: "fuel_load_kgm2_vs_lbft2"
      kind: "soil_semantic"
      description: "custom fuel load w_0 supplied in kg/m2 instead of lb/ft2 (~4.88x too high), inflating reaction intensity and causing catastrophic spread."
      severity: "silent"
    - id: "elevation_meters_vs_feet"
      kind: "soil_semantic"
      description: "custom DEM elevation in meters while pixel_scale is feet; slope gradient ~3.28x too small, slope factor phi_s ~10.8x too small, terrain effectively ignored."
      severity: "degraded"
    - id: "pixel_scale_resolution_mismatch"
      kind: "control_semantic"
      description: "area.pixel_scale does not equal the data resolution (resolution_m x 3.28084); because ignition triggers at burn_amounts > pixel_scale, both spread timing and burned-area scaling are wrong by 2-10x."
      severity: "silent"
    - id: "nonburnable_fuel_codes"
      kind: "soil_semantic"
      description: "bounding box over urban/water/agriculture/NoData fuel codes (0, 91-99) with w_0=0; fire cannot spread past the ignition pixel."
      severity: "silent"
    - id: "max_fire_duration_too_low"
      kind: "control_semantic"
      description: "max_fire_duration of 1-2 frames prunes sprites to BURNED before burn_amounts cross pixel_scale; the fire dies out prematurely."
      severity: "degraded"
    - id: "update_rate_too_coarse"
      kind: "control_semantic"
      description: "large update_rate scales RoS x update_rate per step, coarsening time resolution so the fire jumps; couples temporal discretization to physical spread."
      severity: "degraded"
  validation_limits:
    - "Not calibrated or formally validated against field fire behavior; a cellular Rothermel approximation, not a predictive operational fire model."
    - "Surface fire only; no crown fire, spotting, ember transport, or fire-atmosphere feedback."
    - "Only the 13 standard Anderson FBFM-13 fuel models are mapped; FBFM-40 fuel codes are unsupported."
    - "Wind is prescribed (simple/perlin/cfd), not dynamically coupled to the fire."
    - "Slope factor phi_s uses slope-along-travel squared rather than tan(slope)^2; may diverge from canonical Rothermel on steep terrain."
    - "Operational terrain/fuel data require 30 m (LandFire native) resolution; other resolutions error or are resampled."
  warnings:
    - "Negative rate of spread and headwind-along-travel components are clamped to 0 ('a fire cannot put itself out'); downhill / headwind cells floor rather than reduce spread."
    - "diagonal_spread=false restricts spread to 4-connected neighbors, halving effective spread and producing a cross/diamond footprint instead of an ellipse."
    - "Historical (BurnMD) layers cannot be mixed with operational or functional topography/fuel layers."
    - "RoS attenuation magnitudes (FIRELINE 980 / SCRATCHLINE 490 / WETLINE 245 ft/min) are undocumented magic constants; ros_attenuation=false instead zeroes RoS at control lines (hard stop)."
  assumptions:
    - statement: "The simulation conserves no physical quantity; spread is governed by a cellular-automaton ignition threshold (burn_amounts > pixel_scale), not a mass or energy balance."
      scope: "whole-model closure"
      source: "simfire RothermelFireManager (game/managers/fire.py) ignition-threshold logic; SimFire documentation 'Running the Simulation'"
      status: "adopted"
    - statement: "Internal computation is in US-customary units per the Rothermel paper convention (ft, lb/ft2, ft/min, BTU/lb); metric operational (LandFire) inputs are converted at load, and unconverted metric custom inputs are a primary silent-failure source."
      scope: "unit system / input handling"
      source: "Rothermel surface fire spread model (RMRS-GTR-371); simfire world/rothermel.py and utils/config.py mph_to_ftpm / elevation conversion"
      status: "adopted"
    - statement: "Wind direction follows a TO-direction convention (bearing the wind blows toward), implemented as radians(90 - U_dir) in the spread kernel, opposite to the meteorological 'from' convention."
      scope: "wind direction semantics"
      source: "simfire world/rothermel.py wind-direction handling and SimFire wind-setup documentation"
      status: "adopted"
    - statement: "The slope factor phi_s scales with slope-along-travel squared, a model-specific approximation that differs from the canonical tan(slope)^2 form."
      scope: "slope factor in the rate-of-spread kernel"
      source: "simfire world/rothermel.py slope-factor implementation (in-code comment)"
      status: "tentative"
