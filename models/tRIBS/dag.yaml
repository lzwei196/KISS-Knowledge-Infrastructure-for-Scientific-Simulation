safety:
  hazards:
    - id: "rainfall_rate_unit_silent"
      kind: "weather_file_semantic"
      description: "Rainfall must be mm/hr; ERA5 mm/day (24x) or CMFD m/s (3.6e6x) silently scale the entire hydrograph with no error raised."
      severity: "silent"
    - id: "temperature_kelvin_silent"
      kind: "weather_file_semantic"
      description: "Air temperature must be degC; Kelvin (~293) is read as 293 degC, producing enormous ET and preventing snow formation."
      severity: "silent"
    - id: "relative_humidity_percent_silent"
      kind: "weather_file_semantic"
      description: "RH must be a fraction (0-1); percent (e.g. 65 = 6500%) is not clamped, driving ET far above precipitation and draining soil moisture within hours."
      severity: "silent"
    - id: "pressure_pa_vs_mb_degraded"
      kind: "weather_file_semantic"
      description: "Atmospheric pressure must be mb (hPa); Pa (101325 vs 1013.25) corrupts the psychrometric constant and biases Penman-Monteith ET."
      severity: "degraded"
    - id: "vapor_pressure_kpa_degraded"
      kind: "weather_file_semantic"
      description: "Vapor pressure must be mb; kPa is 10x too small, giving wrong dew point and VPD."
      severity: "degraded"
    - id: "metstep_minutes_vs_hours_silent"
      kind: "control_semantic"
      description: "METSTEP is in hours; supplying minutes (e.g. 60) makes the model read every 60th hourly record, producing 60-hour gaps and interpolation artifacts."
      severity: "silent"
    - id: "soil_depth_m_vs_mm_silent"
      kind: "soil_semantic"
      description: "Soil/bedrock depths are in mm; meters (e.g. DEPTHTOBEDROCK=2 read as 2 mm) yield an impossibly thin column that saturates from timestep 1 with runoff ratio >0.9."
      severity: "silent"
    - id: "ks_ms_vs_mmhr_silent"
      kind: "soil_semantic"
      description: "Ks must be mm/hr; m/s (~1e-6 mm/hr) gives near-zero infiltration, 100% surface runoff, and no baseflow."
      severity: "silent"
    - id: "porosity_percent_vs_fraction_silent"
      kind: "soil_semantic"
      description: "ThetaS must be a fraction (0-1); percent (e.g. 43 = 4300%) distorts moisture accounting and can drive MuNew<0 and crashes."
      severity: "fatal_or_silent"
    - id: "psib_unit_runoff_partition"
      kind: "soil_semantic"
      description: "Air-entry pressure PsiB is in mm not cm; wrong units shift the runoff partitioning."
      severity: "degraded"
    - id: "mesh_coords_latlon_vs_utm_silent"
      kind: "soil_semantic"
      description: "Mesh coordinates must be UTM meters; lat/lon degrees collapse the domain to ~0.001 km^2, so the model runs but produces garbage."
      severity: "silent"
    - id: "elevation_feet_vs_meters_degraded"
      kind: "soil_semantic"
      description: "Elevation must be meters MSL; feet give ~3x too-low slopes, biasing routing and soil-moisture redistribution."
      severity: "degraded"
    - id: "swe_init_m_vs_mm_silent"
      kind: "initial_condition_semantic"
      description: "Initial SWE is in mm internally; meters give a snowpack 1000x too small that melts instantly."
      severity: "silent"
    - id: "optmeshinput_mismatch_fatal"
      kind: "control_semantic"
      description: "OPTMESHINPUT must match the available mesh files (e.g. option 8 expects .nodes/.edges/.tri/.z); a mismatch causes a 'Cannot open file' crash or segfault at startup."
      severity: "fatal"
    - id: "station_sdf_wrong_basin_silent"
      kind: "weather_file_semantic"
      description: "An .sdf station-descriptor file pointing to the wrong .mdf paths or another basin causes tRIBS to silently use incorrect forcing."
      severity: "silent"
    - id: "sim_dates_outside_forcing_degraded"
      kind: "control_semantic"
      description: "STARTDATE/ENDDATE extending beyond the forcing period leads to silent zeros or extrapolation rather than a clear error."
      severity: "degraded"
    - id: "nan_forcing_propagation_fatal"
      kind: "numerical_instability"
      description: "NaN in forcing data propagates through ET, soil moisture, and routing into all outputs and may crash mid-simulation."
      severity: "fatal"
    - id: "unsat_solver_or_routing_hang"
      kind: "numerical_instability"
      description: "Extreme soil parameters can fail the Newton/LambertW unsaturated-zone solver, and a mesh with no outlet or circular flow paths causes an infinite routing loop (hang after Part 8)."
      severity: "fatal"
    - id: "water_balance_nonclosure_drift"
      kind: "numerical_instability"
      description: "Mismatched output vs internal computation timestep, or very large/small timesteps, produce numerical drift so P-ET-Q-dStorage exceeds 1% of P."
      severity: "degraded"
  validation_limits:
    - "Physically-based but requires basin-specific calibration of soil hydraulic (K0n, f, ar) and routing (ne, hillslope/stream velocity) parameters; uncalibrated routing velocities yield wrong hydrograph timing (NSE<0.3)."
    - "Mesh size is RAM-bounded (~500 bytes per node, 50+ doubles/node); very large basins require coarsening or the MPI-parallel tRIBSpar build."
    - "Snow and groundwater are optional modules (OPTSNOW/OPTGROUNDWATER); when disabled, those processes are simply absent rather than approximated."
  warnings:
    - "Loop order is load-bearing: tIntercept runs before tEvapoTrans (interception sets effective precipitation before ET), and when OPTSNOW=1 the snow energy balance substitutes for the normal precipitation/ET path and feeds melt back as effective rainfall."
    - "Priestley-Taylor alpha is hardcoded at 1.26 (semi-humid/humid calibration) and is not exposed as a calibration parameter; arid-region ET may be biased under OPTEVAP=3."
    - "Expected validation envelope: water balance closes within ~1% of precipitation; ET in the regional range ~300-1200 mm/yr; soil moisture stays within 0-to-porosity bounds; discharge non-negative."
  assumptions:
    - statement: "Each TIN node's hydrologic computations are valid over its associated Voronoi polygon, which is the control volume for mass conservation; flow is routed node-to-node along triangle edges by a finite-difference approach."
      scope: "Spatial discretization and mass-balance closure across the whole model."
      source: "tRIBS Model Design documentation (https://tribshms.readthedocs.io/en/latest/man/Model%20Design.html, section 1.2 Computational Mesh)."
      status: "adopted"
    - statement: "The TIN mesh architecture (triangle/edge/node objects) is inherited from the CHILD landscape-evolution model framework."
      scope: "Mesh data structures and connectivity."
      source: "tRIBS Model Design documentation, section 1.1 Model File Structure."
      status: "adopted"
    - statement: "Priestley-Taylor evapotranspiration uses a fixed alpha of 1.26 representative of semi-humid/humid conditions."
      scope: "ET under OPTEVAP=3 (Priestley-Taylor option)."
      source: "tEvapoTrans module behavior in tRIBS source (Priestley-Taylor routine)."
      status: "adopted"
    - statement: "Snow water equivalent is accounted in mm internally even though pixel/spatial outputs report SWE in cm."
      scope: "Snow state initialization and output interpretation when OPTSNOW=1."
      source: "tSnowPack module behavior and tRIBS Output documentation."
      status: "tentative"
