inputs:
  forcing:
  - name: daily meteorology (Tmin, Tmax, wind run, solar radiation, relative humidity, rainfall; optional
      E-pan, PAR)
    unit: Tmin/Tmax degC; wind km/day; SRAD MJ/m^2/day; RH %; rainfall mm; E-pan cm/day; PAR mol quanta/m^2/day
  - name: breakpoint (sub-daily) rainfall intensity
    unit: inches (precipitation depth per breakpoint)
  - name: ambient CO2 concentration
    unit: ppm
  parameters:
  - name: site geometry (latitude, longitude, elevation, slope, aspect, area)
    unit: lat/lon RADIANS; elevation m; slope fraction 0-1; aspect deg from north; area m^2
  - name: soil horizon physical properties (bulk density, particle density, sand/silt/clay, porosity)
    unit: g/cm^3; %; fraction
  - name: Brooks-Corey hydraulic parameters (bubbling pressure, pore-size index lambda, Ksat, residual/saturated
      water content, field-capacity points, lateral Ksat)
    unit: bubbling pressure cm H2O; Ksat cm/hr; water contents cm^3/cm^3
  - name: macropore / micropore properties (total macroporosity, radius, width, crack/aggregate geometry,
      dead-end fraction, microporosity by texture)
    unit: fraction; cm
  - name: soil heat / thermal parameters (method flag, thermal conductivity)
    unit: dimensionless flag; W/m/K
  - name: DSSAT cultivar / ecotype / species coefficients
    unit: crop-specific genetic coefficients
  - name: pesticide chemical properties (Freundlich adsorption constant, dissociation/pKa, degradation
      rates) and soil chemistry parameters (pH, CEC)
    unit: adsorption constant, rate constants, pH, cmol/kg
  initial_conditions:
  - name: initial soil water tension/content and soil temperature per horizon
    unit: cm tension or cm^3/cm^3; degC
  - name: initial nitrogen pools (NO3, NH4, urea, fast/slow organic N) per horizon
    unit: ug/g or kg/ha
  - name: initial soil chemistry (pH, CEC, organic carbon) per horizon
    unit: pH; cmol/kg; %
  - name: initial surface residue / organic-matter pool state
    unit: kg/ha
  - name: initial snow water / depth state
    unit: cm
  boundary_conditions:
  - name: simulation period (start/end dates)
    unit: DD MM YYYY DD MM YYYY
  - name: bottom boundary condition (1=free drainage, 2=water table, 3=constant flux/lysimeter)
    unit: integer switch
  - name: tile drainage configuration (drain flag, drain depth/spacing geometry, lateral Ksat threshold)
    unit: geometry in cm; lateral Ksat cm/hr
  - name: management events (planting date/density/row spacing, fertilizer N/P rate and timing, manure,
      tillage, irrigation mode, residue, harvest)
    unit: dates; kg/ha; counts
  - name: crop / cultivar selection and planting plant-reference
    unit: crop id + cultivar id
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - soil_water_storage
  - tile_drainage
  - evapotranspiration
  - no3_leaching
  - soil_nitrate
  - crop_yield
  - soil_temperature
  - snow_depth
  - pesticide_loss
  other: []
validation:
