# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: DayCent
  language: fortran
  implementation:
    id: ddcentevi-rev491
    version: DDcentEVI revision 491 (trunk, 2023-07-10)
    provenance: Fortran 77 + C; CSU/NREL precompiled statically-linked Linux ELF binary (DDcentEVI_rev491)
      plus DDlist100_rev491 post-processor; no source distributed in public release.
  scientific_reference_version: DayCent (Daily Century) ecosystem/biogeochemistry model, DDcentEVI lineage
    with methanogenesis; CSU/NREL User Manual & Scientific Basis (May 2018, full_05.02.108)
inputs:
  forcing:
  - name: precipitation
    unit: cm/day
    category: meteorology
    source_kind: forcing
    model_input_format: .wth column 7
    notes: DayCent weather precipitation is in cm/day (NOT mm/day); feeding mm/day silently inflates the
      water balance ~10x. (.100 monthly PRECIP is cm/month.)
  - name: maximum air temperature
    unit: degC
    category: meteorology
    source_kind: forcing
    model_input_format: .wth column 5
  - name: minimum air temperature
    unit: degC
    category: meteorology
    source_kind: forcing
    model_input_format: .wth column 6
  - name: solar radiation
    unit: langley/day
    category: meteorology
    source_kind: forcing
    model_input_format: .wth column 8 (optional)
    notes: Read only when usexdrivers/usexdrvrs is enabled in sitepar.in (DDcentEVI infers from column
      count). When present, PET uses Penman (1948); otherwise the model computes its own radiation and
      PET from air temperature (Linacre 1977). 1 langley = 41.84 kJ/m2.
  - name: relative humidity
    unit: '%'
    category: meteorology
    source_kind: forcing
    model_input_format: .wth column 9 (optional)
    notes: Optional extra driver; read only when extra-driver weather option is active. Wind speed (mph)
      is a further optional driver.
  parameters:
  - name: fixed decomposition parameters
    unit: various
    category: fixed_decomposition
    source_kind: default
    model_input_format: fix.100 (Century-100 ASCII)
    notes: Biome-common fixed parameters governing organic-matter decomposition; must match rev 491; not
      normally adjusted between runs.
  - name: site climate / soil texture / initial SOM parameters
    unit: various
    category: site
    source_kind: dataset_lookup
    model_input_format: <site>.100 (Century-100 ASCII fixed-format)
    notes: Monthly PRECIP (cm/month), TMN2M/TMX2M (degC); sitlat/sitlng (decimal deg, +N/+E); sand/silt/clay
      (fraction 0-1); bulkd (g/cm3); nlayer/nlaypg, drain, basef, stormf, ph; epnfa/epnfs atmospheric
      N inputs; initial SOM pool sizes som1ci/som2ci/som3ci, strucc, metabc.
  - name: soil hydraulic / texture profile by layer
    unit: various
    category: soil_profile
    source_kind: dataset_lookup
    model_input_format: soils.in (13 columns per layer, rev 491)
    notes: 'Per-layer: top/bottom depth (cm), bulk density (g/cm3), field capacity (vol/vol), wilting
      point (vol/vol), evap coefficient, root fraction (sums to ~1.0), sand fraction, clay fraction, organic-matter
      MASS fraction (0-1, not percent), delta_min (~WP*0.9), saturated K (cm/s), pH. rev 491 requires
      13 columns (delta_min added vs rev 470); depth structure must match ADEP/EDEPTH in fix.100.'
  - name: DayCent-specific site parameters
    unit: various
    category: site_physical
    source_kind: user_provided
    model_input_format: sitepar.in (key/value)
    notes: Elevation, slope/aspect, albedo, snow flag, water-table, cloud cover, temperature coefficients,
      nitrification controls (maxNitAmt), monthly solar-radiation surface transmission, usexdrvrs flag.
      Retired in DayCentEVI variants that infer the weather option from column count.
  - name: crop / grass parameter library
    unit: various
    category: crop
    source_kind: dataset_lookup
    model_input_format: crop.100
    notes: Crop/grass options (e.g. CORN, SOYB, GRASS) referenced by CROP events.
  - name: tree / forest parameter library
    unit: various
    category: forest
    source_kind: dataset_lookup
    model_input_format: tree.100
    notes: TREE submodel parameters; zero-byte in the public WoosterExampleLinux distribution so forest
      runs are non-functional without a tree.100 obtained from CSU/NREL.
  - name: management event parameter libraries
    unit: various
    category: event_libraries
    source_kind: dataset_lookup
    model_input_format: cult.100 / fert.100 / fire.100 / graz.100 / harv.100 / irri.100 / omad.100 / trem.100
    notes: Option libraries referenced by the corresponding scheduled CULT/FERT/FIRE/GRAZ/HARV/IRRI/OMAD/tree-removal
      events.
  initial_conditions:
  - name: initial SOM pool sizes
    unit: gC/m2
    category: soil_carbon
    source_kind: user_provided
    model_input_format: <site>.100 (som1ci/som2ci/som3ci, strucc, metabc) or extended from a prior .bin
    notes: Passive/slow pools take centuries to equilibrate; an equilibrium (ACEQ) spin-up is run first.
      Initial values left at a desert template give wrong equilibrium SOM for a humid site.
  - name: prior-state binary archive
    unit: Century binary
    category: state_handoff
    source_kind: user_provided
    model_input_format: <root>.bin via -e (extend full state) or -i (initial conditions only, resets counters)
    notes: '3-stage protocol: equilibrium (-N eq) -> base history (-e eq -N base) -> treatment (-e base
      -N treat). All stages must share the same <site>.100 or SOM jumps discontinuously.'
  boundary_conditions:
  - name: timed management & disturbance schedule
    unit: events
    category: management
    source_kind: user_provided
    model_input_format: <schedule>.sch / .evt (year-in-sequence, day-of-year, event, argument)
    notes: CROP, FERT, HARV, GRAZ, FRST, LAST, SENM, FIRE, TREE, IRRI, OMAD, CULT, ACEQ. ACEQ triggers
      adaptive-equilibrium termination of the spin-up; LAST ends the growing season; the 'F' weather option
      (with the .wth filename) is the only valid weather option for the initial block.
  - name: weather-driver option (usexdrivers)
    unit: flag
    category: control_switch
    source_kind: user_provided
    model_input_format: sitepar.in usexdrvrs (0/1)
    notes: Selects the 7-column air-temperature PET path (Linacre 1977) vs the extra-driver Penman (1948)
      path; structural switch over which optional .wth columns are read.
  - name: output channel toggles
    unit: flags
    category: output_control
    source_kind: user_provided
    model_input_format: outfiles.in (28 channels, 0/1 + filename)
    notes: Selects which .out/.csv files are written; presets no_outfiles.in (equilibrium), few_outfiles.in,
      full outfiles.in. Controls observability of model output, not the physics.
  - name: optional climate/management scaling
    unit: multipliers
    category: scenario_scaling
    source_kind: user_provided
    model_input_format: nscale.dat / omadscale.dat / phscale.dat / tmaxscale.dat / tminscale.dat / precscale.dat
    notes: Optional scenario-adjustment multipliers applied to N inputs, organic amendments, pH, and climate
      drivers.
outputs:
  primary:
  - name: n2o_emission
    unit: gN/m2/day (model nflux.out reports g N ha-1 d-1)
    description: Soil N2O flux, sum of nitrification and denitrification pathways; the USDA/EPA/IPCC reference
      output for cropland N2O inventory.
    validation_rank: 4
    emitted_in: nflux.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - N2O is pulse-dominated after fertilization/rain; daily timing and chamber-flux upscaling drive
          large scatter; default parameters are known to underestimate mean daily N2O strongly until calibrated.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/regional N2O inventory aggregates carry management/technology signal beyond the weather-driven
          model.
      detrending_options:
      - none
      - linear_residual
  - name: no_emission
    unit: gN/m2/day (nflux.out g N ha-1 d-1)
    description: Soil nitric-oxide (NO/NOx) flux from nitrification/denitrification.
    validation_rank: 5
    emitted_in: nflux.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Pulse-dominated; sparse field observation.
      detrending_options:
      - none
  - name: ch4_flux
    unit: gC/m2/day
    description: CH4 oxidation (upland) and methanogenesis/CH4 production (flooded/rice, DDcentEVI), including
      plant- and bubble-mediated emission components.
    validation_rank: 6
    emitted_in: methane.out / summary.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Upland CH4 oxidation flux is small; oxidation assumes atmospheric diffusion is the only CH4
          source; large signal only for paddy/wetland systems.
      detrending_options:
      - none
  - name: co2_heterotrophic
    unit: gC/m2/day
    description: Soil heterotrophic (decomposition) CO2 respiration.
    validation_rank: 7
    emitted_in: summary.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Heterotrophic component only; partitioning Rh from total soil respiration in observations is
          uncertain.
      detrending_options:
      - none
  - name: cprodc (daily net C production, GPP proxy)
    unit: gC/m2/day
    description: Daily net C production reported in summary.out; the closest DayCent variable to daily
      GPP for cropland/grassland (an approximation, not true gross primary productivity).
    validation_rank: 1
    emitted_in: summary.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - cprodc is a net-production proxy, not gross GPP; the .lis agcprd+bgcprd pathway is annualised
          and not a daily GPP substitute.
      detrending_options:
      - none
  - name: nee
    unit: gC/m2/day
    description: 'Net ecosystem exchange of CO2 (DayCent sign: positive = uptake).'
    validation_rank: 8
    emitted_in: summary.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - DayCent sign convention is opposite to the FLUXNET convention; sign must be flipped before metric
          computation.
      detrending_options:
      - none
  - name: reco
    unit: gC/m2/day
    description: Ecosystem respiration (autotrophic + heterotrophic).
    validation_rank: 9
    emitted_in: summary.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats: []
      detrending_options:
      - none
  - name: aboveground_biomass (aglivc)
    unit: gC/m2
    description: Aboveground live carbon.
    validation_rank: 10
    emitted_in: bio.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: pbias
        caveats:
        - Reported as carbon; observed biomass usually dry matter (multiply by ~1/0.45).
      detrending_options:
      - none
  - name: crop_yield (cgrain)
    unit: gC/m2
    description: Economic grain/tuber yield carbon at harvest.
    validation_rank: 11
    emitted_in: harvest.csv
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Convert grain C to dry-matter yield (kg DM/ha ~ cgrain x10/0.45 at 45% C).
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/regional yield aggregates carry a technology trend a weather-driven model cannot reproduce;
          compare detrended.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: soil_organic_carbon (somsc)
    unit: gC/m2
    description: Total soil organic-matter carbon (top 20 cm); the headline state variable and primary
      validation target.
    validation_rank: 2
    emitted_in: <root>.lis (via DDlist100) / soilc.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: pbias
        caveats:
        - Slow/passive pools take centuries to equilibrate; a converged ACEQ spin-up is required before
          treatment comparison; equilibrated somsc ~5,000-15,000 gC/m2 for a temperate humid site.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Match measured 0-20 cm SOC stock at a single sampling date.
      detrending_options:
      - none
  - name: soil_moisture_layers
    unit: m3/m3
    description: Per-layer volumetric soil water content.
    validation_rank: 12
    emitted_in: vswc.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Match the model layer to the sensor depth.
      detrending_options:
      - none
  - name: soil_temperature_layers
    unit: degC
    description: Per-layer average soil temperature.
    validation_rank: 13
    emitted_in: soiltavg.out
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Match the model layer to the sensor depth.
      detrending_options:
      - none
  - name: evapotranspiration / water_balance
    unit: cm/day
    description: Daily actual ET (evaporation + transpiration) plus runoff, drainage, and other water-balance
      components.
    validation_rank: 3
    emitted_in: watrbal.out / summary.out (aetdly)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - ET is a demand-side estimate (Linacre or Penman PET path), not an energy-balance LE; convert
          cm/day vs mm/day before comparison.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: 1
  symptom: Soil moisture saturated every day; runoff in summary.out > 100 cm/yr.
  diagnosis: Precipitation in the .wth file is in mm/day instead of cm/day.
  remedy: Re-run convert_forcing_to_daycent.py — its validate_outputs() checks annual precip is 5–500
    cm/yr. Manually verify column 7 of the .wth file is in cm/day, not mm/day.
  severity: silent
- id: 2
  symptom: All daily Tmin and Tmax appear ~270 in summary.out.
  diagnosis: Temperature columns 5/6 of the .wth file are in Kelvin (CMFD raw).
  remedy: Subtract 273.15 from columns 5 and 6. The converter does this automatically when mean(T) > 150.
  severity: silent
- id: 3
  symptom: DayCent runs but Tmin > Tmax in stdout summary.
  diagnosis: Columns 5 and 6 in the .wth file are swapped (Tmax in col 5, Tmin in col 6).
  remedy: 'Check the load_daily_forcing dict keys: ''tmin'' must go to col 5, ''tmax'' to col 6. The converter
    validates mean(Tmin) < mean(Tmax).'
  severity: silent
- id: 4
  symptom: DayCent stops with 'unable to read line N of weather file'.
  diagnosis: A .wth row has wrong number of columns or non-numeric content.
  remedy: 'Run `awk ''{print NF}'' wooster.wth | sort -u` — every row should have 7 fields. Check for
    stray header lines or comma decimal separators (locale issue: run with LC_ALL=C).'
  severity: fatal
- id: 5
  symptom: DayCent crashes during initialisation with 'cannot find <site>.100'.
  diagnosis: The schedule file's third line names a site .100 file that is not in the run directory or
    library path.
  remedy: Either copy <site>.100 into the run directory or run with `-l /path/to/100/lib`. Check the third
    line of the .sch file matches your filename exactly (case-sensitive).
  severity: fatal
- id: 6
  symptom: soils.in column 3 (bulk density) values are 1230, 1300, 1340.
  diagnosis: Bulk density was written in kg/m³ instead of g/cm³.
  remedy: Divide by 1000. convert_soil_to_daycent.py auto-detects values > 100 and converts.
  severity: silent
- id: 7
  symptom: DayCent runs but ANPP is 0 every year.
  diagnosis: soils.in root-fraction column (col 7) sums to 0, so no roots can extract water.
  remedy: Check sum(col 7) ~ 1.0. The convert_soil_to_daycent.py validator warns when out of [0.95, 1.05].
  severity: fatal
- id: 8
  symptom: Wilting point > field capacity in soils.in.
  diagnosis: Column 4 (FC) and column 5 (WP) are swapped or ROSETTA returned absurd values for a sandy
    soil.
  remedy: Validator raises 'FC <= WP' before the file is used. Re-check the ROSETTA inputs (sand+clay
    should be ≤ 1).
  severity: silent
- id: 9
  symptom: ACEQ run reaches the maximum block count without convergence.
  diagnosis: Climate cycle in the .wth file is too short or has unrepresentative trend; SOM cannot stabilise.
  remedy: Provide a 30+ year detrended climate cycle. Increase the +N value on the ACEQ line in the schedule.
    Re-check soils.in for unrealistic Ksat or root distribution.
  severity: degraded
- id: 10
  symptom: Equilibrium produces SOM C of 1500 g/m² in a temperate humid site.
  diagnosis: Initial SOM pools in <site>.100 (som1ci, som2ci, som3ci) were not adjusted from a desert
    template.
  remedy: Use 100_Files/site_template_rev491.100 as the base and edit only what you need. Check that strucc,
    metabc, som1c, som2c, som3c are non-zero and sum to a plausible total.
  severity: silent
- id: 11
  symptom: Treatment run fails immediately with 'cannot read binary file base'.
  diagnosis: Base history was not run before treatment, or `-e base` does not match the actual filename
    produced by the previous step.
  remedy: Check that base.bin exists in the run directory and is non-empty. Run `ls -la *.bin` between
    steps. The run_daycent.py wrapper enforces the correct order.
  severity: fatal
- id: 12
  symptom: Treatment harvest.csv is empty.
  diagnosis: outfiles.in still has `harvest.csv` set to 0, OR there are no HARV events in the schedule.
  remedy: Set the harvest.csv toggle to 1 in outfiles.in before the treatment run. Verify the .sch file
    has HARV lines for the period you care about.
  severity: silent
- id: 13
  symptom: Treatment run uses the wrong climate years.
  diagnosis: The .sch file's `Weather choice` line points to a .wth file that does not span the treatment
    period; DayCent silently recycles the available years.
  remedy: Make sure the .wth file covers Schedule Start..Schedule End. The wrapper run_daycent.py does
    not check this — verify manually.
  severity: silent
- id: 14
  symptom: DDlist100 produces a .lis file with fewer columns than requested.
  diagnosis: One or more variable names in the var-list file are misspelled; DDlist100 silently drops
    unknown names.
  remedy: 'Compare your varlist against the canonical names in DayCent_Manual_full_02.06.2024.pdf (search
    for ''List of Output Variables''). Common typos: aglivec instead of aglivc, somc instead of somsc.'
  severity: silent
- id: 15
  symptom: parse_daycent_output.py says 'too few lines for .lis format'.
  diagnosis: DDlist100 was given the wrong bin root (e.g. 'eq' instead of 'cb_nt') and produced an almost-empty
    .lis.
  remedy: Check that the bin_root passed to DDlist100 corresponds to the .bin file you actually want to
    extract. Run `file *.bin` to see what you have.
  severity: degraded
- id: 16
  symptom: metrics.json shows pearson_r ~ 0 with very large RMSE.
  diagnosis: 'Time matching mismatch: observed series uses calendar year but the simulated ''time'' column
    is decimal year, so nearest-year matching is picking the wrong rows.'
  remedy: Check both 'time' columns in head -2 of the .lis and the obs CSV. parse_daycent_output.py uses
    ±1 year tolerance — narrow this if your obs are mid-year.
  severity: silent
- id: 17
  symptom: DDlist100 segfaults or 'cannot open binary file'.
  diagnosis: Trying to extract from a .bin produced by a different revision of DDcentEVI; binary format
    is not stable across revisions.
  remedy: Use the matching DDlist100 version (rev 491 binary needs DDlist100_rev491). The two ship together
    in Linux_Version_491/.
  severity: fatal
- id: 18
  symptom: Annual precipitation in summary.out is exactly 1/10 of expected.
  diagnosis: Converter divided cm/day inputs by 10 a second time. The auto-detect heuristic flagged a
    unit conversion that wasn't needed.
  remedy: 'Bypass the heuristic: pre-divide your inputs to cm/day yourself, or use a forcing source whose
    units are unambiguous (NASA POWER returns mm/day reliably).'
  severity: silent
- id: 19
  symptom: DDcentEVI reports 'Negative pool detected, simulation aborted'.
  diagnosis: A SOM or N pool went negative due to a parameter inconsistency — usually epnfa/epnfs (atmospheric
    N inputs) too low, or fix.100 mismatched with site.100.
  remedy: Verify fix.100 is the rev 491 version (in 100_Files/). Increase epnfa to 0.05–0.10 g N/m²/yr
    if your site is N-limited.
  severity: fatal
- id: 20
  symptom: Crop yield (cgrain) is reasonable but cumulative SOC drops faster than expected.
  diagnosis: OMAD (organic amendment) lines in the schedule reference an event name not present in omad.100,
    so the model adds zero amendment but does not warn.
  remedy: grep the OMAD event name from the schedule against omad.100 — every OMAD line must reference
    an omad.100 entry by name.
  severity: silent
- id: 21
  symptom: convert_forcing_to_daycent.py --source nasa_power fails with curl exit 35, SSL_ERROR_SYSCALL,
    or requests.exceptions.SSLError on power.larc.nasa.gov.
  diagnosis: The host firewall or proxy blocks outbound TLS to power.larc.nasa.gov. NASA POWER is unreachable
    from this environment even though other hosts (google.com) respond. This is an environmental constraint,
    not a KI bug, and cannot be fixed by retrying.
  remedy: Do not retry. Switch to --source fluxnet for FLUXNET tower tasks (works offline from the site's
    FULLSET_DD.csv) or --source cmfd for Chinese sites. NASA POWER is not a viable fallback on this host.
  severity: fatal
- id: 22
  symptom: convert_forcing_to_daycent.py --source mswx fails with FileNotFoundError inside KISSPATH_ROOT/.../Data_forcing_03hr_010deg/P/P_YYYY.nc.
  diagnosis: MSWX default path was mis-set to the CMFD root, and MSWX is not actually deployed on this
    host. --source mswx pointed at CMFD files and inherited the CMFD layout expectations.
  remedy: If MSWX is truly needed, set --forcing-dir /path/to/mswx explicitly. For most tasks, use --source
    fluxnet (FLUXNET CSV) or --source cmfd (if the site is inside China).
  severity: fatal
- id: 23
  symptom: convert_forcing_to_daycent.py --source cmfd fails or returns empty arrays for a non-China latitude/longitude
    (e.g. DE-Tha 50.96N 13.57E, Wooster 40.78N 81.93W).
  diagnosis: CMFD covers the China domain only (~70E-140E, ~15N-55N). Querying it outside this window
    either returns no grid cell or raises FileNotFoundError on per-year NetCDFs. validate_inputs now hard-refuses
    CMFD for lon outside 70-140E.
  remedy: Use --source fluxnet with the tower's FULLSET_DD.csv for FLUXNET sites, or --source nasa_power
    for global coverage (only if the host can reach power.larc.nasa.gov — see triplet 21).
  severity: fatal
- id: 24
  symptom: Task asks for DayCent at a forest flux site (e.g. DE-Tha Norway spruce); tree.100 in WoosterExampleLinux
    is 0 bytes and no forest .sch template exists.
  diagnosis: The public WoosterExampleLinux bundle ships an empty tree.100 — the TREE submodel cannot
    run without a populated parameter library, and CSU NREL distributes tree.100 separately.
  remedy: Either obtain a populated tree.100 from CSU NREL and supply a forest .sch, or substitute a grassland
    (GRASS/GRAS1) parameterisation and explicitly flag this as a coarse surrogate in the run report. Do
    not fabricate tree parameters.
  severity: fatal
- id: 25
  symptom: User asked for 'daily GPP' but few_outvars.txt lists agcprd/bgcprd/cgrain/somsc — none labeled
    GPP.
  diagnosis: DayCent reports daily net C production as `cprodc` in summary.out (when few_outfiles.in is
    used). The .lis pathway via DDlist100 does not give a ready daily GPP variable; agcprd+bgcprd in the
    .lis is annualised for most configurations.
  remedy: For daily GPP validation, parse summary.out's cprodc column directly instead of running DDlist100.
    The SKILL.md 'Mapping DayCent outputs to FLUXNET variables' table lists the canonical mappings.
  severity: degraded
- id: 26
  symptom: DayCent crashes with 'swclimit[1] is negative. Check soils.in' during first timestep.
  diagnosis: convert_soil_to_daycent.py wrote 12 columns but DayCent rev 491 expects 13 columns. The missing
    column 11 (delta_min, minimum volumetric water content) causes DayCent to read Ksat into the delta_min
    slot and pH into the Ksat slot, producing negative swclimit.
  remedy: 'Fixed in convert_soil_to_daycent.py (2026-04-22): added delta_min column (= WP × 0.9) between
    OM and Ksat. Verify soils.in has exactly 13 tab-separated columns per row. Cross-check against WoosterExampleLinux/soils.in.'
  severity: fatal
- id: 27
  symptom: Soil organic matter in soils.in is 0.86 or 1.45 instead of 0.0086 or 0.0145. DayCent runs without
    error but SOM decomposition is wildly overestimated.
  diagnosis: HWSD returns OC as percent (e.g., 0.86% = 0.86). The old threshold (> 1.5) missed typical
    values 0.5-1.5 which were written directly as OM fraction instead of being divided by 100. A value
    of 0.86 in the fraction column means 86% organic matter (peat), not 0.86% OC.
  remedy: 'Fixed in convert_soil_to_daycent.py (2026-04-22): lowered the OM threshold from > 1.5 to >
    0.2. Any OM value > 0.2 is now treated as percent and divided by 100. Typical mineral soil OM fraction
    should be 0.005-0.05.'
  severity: silent
