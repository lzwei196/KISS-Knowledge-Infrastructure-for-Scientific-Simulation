# DHSVM Diagnostic Triplets
# Each entry: symptom → diagnosis → remedy
# Failure domains: unit_conversion, parameter_format, path_resolution,
#                  runtime, dependency_mismatch, silent_error

- id: dt_001
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Streamflow is 1000x too high; basin floods immediately"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Precipitation fed in mm/timestep instead of m/timestep"
    explanation: >
      DHSVM expects precipitation in meters per timestep. Global datasets
      like CMFD provide mm/hr or mm/3hr. If you skip the /1000 conversion,
      a 0.5 mm rain event becomes 0.5 m (500 mm), flooding the basin.
    affected_components: [MakeLocalMetData, MassEnergyBalance, RouteSubSurface]
  remedy:
    action: "Divide precipitation by 1000 in forcing converter"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Check precip values in forcing files: should be < 0.05 m/step"
      - "Rerun convert_forcing.py with correct --source-format"
    prevention: "Always verify precip range < 0.1 m/step after conversion"
  severity: silent
  cross_references: [dt_005]

- id: dt_002
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "No snow accumulation even in winter at high elevations"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Temperature in Kelvin instead of Celsius"
    explanation: >
      DHSVM expects Celsius. If Kelvin values (~273) are used, all
      temperatures are far above freezing. The rain/snow threshold
      (typically -0.45 to 0.46 C) is never triggered for snow.
    affected_components: [MakeLocalMetData, SnowPackEnergyBalance]
  remedy:
    action: "Subtract 273.15 from temperature"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Verify temperature range: should be -40 to +40 C typically"
      - "Check source dataset documentation for units"
    prevention: "Add temperature range check in forcing converter"
  severity: silent
  cross_references: []

- id: dt_003
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Evapotranspiration is unrealistically high; soil dries immediately"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Relative humidity as fraction (0-1) instead of percent (0-100)"
    explanation: >
      DHSVM expects RH as 0-100%. If fraction values are used, RH appears
      near zero. The vapor pressure deficit becomes enormous, driving
      extreme evapotranspiration.
    affected_components: [MakeLocalMetData, EvapoTranspiration, CanopyResistance]
  remedy:
    action: "Multiply RH by 100"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Check RH values: should be 0-100"
      - "If all values are < 1.1, they are fractions"
    prevention: "Auto-detect: if max(RH) < 1.5, multiply by 100"
  severity: silent
  cross_references: []

- id: dt_004
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Turbulent heat fluxes are wrong; ET and snow melt rates incorrect"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Wind speed in km/hr instead of m/s"
    explanation: >
      DHSVM expects m/s. Wind in km/hr is 3.6x too high, amplifying
      turbulent exchange coefficients. This increases both sensible and
      latent heat fluxes.
    affected_components: [MakeLocalMetData, SurfaceEnergyBalance]
  remedy:
    action: "Divide wind speed by 3.6"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Verify wind range: typically 0-15 m/s"
      - "Values > 30 likely in km/hr"
    prevention: "Check source data documentation"
  severity: silent
  cross_references: []

- id: dt_005
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Shortwave radiation unrealistically low or high"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Shortwave radiation in MJ/m2/day instead of W/m2"
    explanation: >
      DHSVM expects instantaneous W/m2. MJ/m2/day values (typically 0-30)
      are far too low when treated as W/m2. Correct conversion requires
      dividing by 86400 and multiplying by 1e6.
    affected_components: [RadiationBalance, MassEnergyBalance]
  remedy:
    action: "Convert MJ/m2/day to W/m2: multiply by 1e6/86400 = 11.574"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Check SW range: peak should be 800-1200 W/m2 at noon"
      - "Should be 0 at night"
    prevention: "Verify diurnal cycle in shortwave after conversion"
  severity: silent
  cross_references: []

- id: dt_006
  stage: s3_soil_parameters
  failure_domain: unit_conversion
  symptom:
    description: "Unrealistically deep water table; basin never saturates"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Soil depth specified in cm instead of m"
    explanation: >
      DHSVM expects soil depth in meters. If cm values (e.g., 150) are
      used directly, the soil column is 150 m deep instead of 1.5 m,
      providing enormous storage that never fills.
    affected_components: [InitTables, UnsaturatedFlow, RouteSubSurface]
  remedy:
    action: "Divide soil depth by 100"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Check total soil depth: typically 0.5 - 5.0 m"
      - "Values > 10 are likely in cm"
    prevention: "Tool auto-warns when depth > 10"
  severity: silent
  cross_references: [dt_008]

- id: dt_007
  stage: s3_soil_parameters
  failure_domain: unit_conversion
  symptom:
    description: "Soil drains instantaneously; water table drops to bottom"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Hydraulic conductivity in mm/hr instead of m/s"
    explanation: >
      DHSVM expects Ksat in m/s. If mm/hr values (typically 1-100) are
      used, conductivity is 3.6e6 times too high. The soil behaves like
      a sieve.
    affected_components: [UnsaturatedFlow, RouteSubSurface]
  remedy:
    action: "Divide Ksat by 3,600,000 to convert mm/hr to m/s"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Verify Ksat range: typically 1e-7 to 1e-4 m/s"
      - "Values > 0.01 are likely in wrong units"
    prevention: "Tool validates Ksat range in output"
  severity: silent
  cross_references: []

- id: dt_008
  stage: s3_soil_parameters
  failure_domain: unit_conversion
  symptom:
    description: "Model crashes with porosity error or extreme soil moisture"
    error_pattern: "porosity|Assertion"
    detection_method: log_match
  diagnosis:
    root_cause: "Porosity specified as percent (e.g., 45) instead of fraction (0.45)"
    explanation: >
      DHSVM expects porosity as a fraction 0-1. Values > 1 may cause
      assertion failures or nonsensical soil moisture calculations.
    affected_components: [InitTables, MassEnergyBalance]
  remedy:
    action: "Divide porosity by 100"
    tool_to_run: convert_soil_params.py
    manual_steps:
      - "Check porosity values in config: should be 0.3-0.7"
    prevention: "Tool validates porosity < 1.0"
  severity: fatal
  cross_references: [dt_006]

- id: dt_009
  stage: s1_terrain
  failure_domain: unit_conversion
  symptom:
    description: "Lapse rate corrections wrong; snow at wrong elevations"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "DEM elevation in feet instead of meters"
    explanation: >
      DHSVM uses elevation for lapse rate corrections. If DEM is in feet,
      temperature lapse is applied to wrong elevation differences. A 1000 ft
      range (305 m) gets treated as 1000 m, tripling the lapse correction.
    affected_components: [InitTerrainMaps, MakeLocalMetData]
  remedy:
    action: "Multiply DEM by 0.3048 to convert feet to meters"
    manual_steps:
      - "Check DEM range against known basin elevations"
      - "Mountain basins: 500-4000 m typical"
    prevention: "Verify DEM unit before binary conversion"
  severity: silent
  cross_references: [dt_011]

- id: dt_010
  stage: s1_terrain
  failure_domain: unit_conversion
  symptom:
    description: "Radiation balance incorrect; shadows/aspect effects wrong"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Slope angle in degrees instead of radians"
    explanation: >
      DHSVM's radiation routines expect slope in radians. A 30-degree
      slope (0.524 rad) treated as 30 radians produces nonsensical
      trigonometric results in solar geometry calculations.
    affected_components: [CalcSolar, RadiationBalance]
  remedy:
    action: "Multiply slope by pi/180"
    manual_steps:
      - "Slope values should be 0-1.5 radians (0-85 degrees)"
      - "Values > 2 are likely in degrees"
    prevention: "Check slope range after DEM processing"
  severity: silent
  cross_references: []

- id: dt_011
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: "Temperature varies too much/little with elevation"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Temperature lapse rate in C/km instead of C/m"
    explanation: >
      DHSVM expects lapse rate in C/m (e.g., -0.0065). If C/km (-6.5) is
      used, the correction is 1000x too large. A 100 m elevation difference
      gets 650 C of correction instead of 0.65 C.
    affected_components: [MakeLocalMetData, Constants]
  remedy:
    action: "Divide lapse rate by 1000"
    manual_steps:
      - "Standard atmospheric: -0.0065 C/m"
      - "If value is -6.5, it is in C/km"
    prevention: "Config generator validates range"
  severity: silent
  cross_references: [dt_009]

- id: dt_012
  stage: s2_met_forcing
  failure_domain: path_resolution
  symptom:
    description: "DHSVM exits with 'unable to open meteorological data file'"
    error_pattern: "unable to open|cannot open"
    detection_method: log_match
  diagnosis:
    root_cause: "Met file name decimal places don't match GRID_DECIMAL"
    explanation: >
      DHSVM constructs met file names as data_<lat>_<lon> using exactly
      GRID_DECIMAL decimal places. If GRID_DECIMAL=5 but files have 3
      decimals, the filename won't match. Even trailing zeros matter.
    affected_components: [InitMetSources, InitNewStep]
  remedy:
    action: "Regenerate forcing files with correct GRID_DECIMAL"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Check GRID_DECIMAL in config file"
      - "List forcing files: ls forcing/data_*"
      - "Count decimal places in filenames"
    prevention: "Match GRID_DECIMAL to forcing file precision"
  severity: fatal
  cross_references: []

- id: dt_013
  stage: s1_terrain
  failure_domain: parameter_format
  symptom:
    description: "Pixel values shifted; striping in output maps"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Binary map file size doesn't match grid dimensions"
    explanation: >
      DHSVM reads binary files as nrows*ncols values of fixed type.
      If the file has extra or missing bytes, all subsequent pixel
      positions shift. The model may still run but produce garbage.
    affected_components: [InitTerrainMaps, all spatial operations]
  remedy:
    action: "Verify file size = nrows * ncols * 4 bytes"
    manual_steps:
      - "Check: ls -l dem.bin"
      - "Expected: nrows * ncols * 4 bytes"
      - "Regenerate from source if wrong"
    prevention: "Always verify binary file sizes before running"
  severity: silent
  cross_references: [dt_017]

- id: dt_014
  stage: s3_soil_parameters
  failure_domain: parameter_format
  symptom:
    description: "Soil moisture redistribution incorrect between layers"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Soil layer depths not monotonically increasing"
    explanation: >
      DHSVM expects layer depths from surface downward. If depths are
      not sorted (e.g., 0.5, 0.3, 1.5), the inter-layer flow
      calculations use wrong thicknesses.
    affected_components: [UnsaturatedFlow, MassEnergyBalance]
  remedy:
    action: "Sort layer depths in ascending order"
    manual_steps:
      - "Check Depth of Layer line in config"
      - "Values must increase: e.g., 0.1 0.6 1.5"
    prevention: "Config generator sorts automatically"
  severity: degraded
  cross_references: [dt_006]

- id: dt_015
  stage: s7_execution
  failure_domain: runtime
  symptom:
    description: "NaN values in output; model may produce garbage or crash"
    error_pattern: "NaN|nan|inf"
    detection_method: log_match
  diagnosis:
    root_cause: "Vegetation height less than Reference Height in [CONSTANTS]"
    explanation: >
      DHSVM uses a logarithmic wind profile adjustment that includes
      log(ref_height / veg_height). If veg_height < ref_height, the
      argument is > 1, producing positive log. But if veg_height
      approaches zero, the log goes to infinity/NaN.
    affected_components: [MakeLocalMetData, MassEnergyBalance]
  remedy:
    action: "Set Reference Height below minimum vegetation height"
    manual_steps:
      - "Check Reference Height in [CONSTANTS]"
      - "Check all vegetation heights in [VEGETATION]"
      - "Reference Height should be < minimum veg height"
    prevention: "Config generator validates height constraints"
  severity: fatal
  cross_references: []

- id: dt_016
  stage: s2_met_forcing
  failure_domain: dependency_mismatch
  symptom:
    description: "Dates misaligned; wrong forcing data read for each timestep"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Forcing file uses ISO dates (YYYY-MM-DD) instead of MM/DD/YYYY-HH"
    explanation: >
      DHSVM's date parser expects MM/DD/YYYY-HH format. If ISO format
      is used, dates are parsed incorrectly. For example, 2020-01-15
      might be interpreted as month 2020, causing failure or wrong
      data association.
    affected_components: [InitMetSources, InitNewStep]
  remedy:
    action: "Reformat dates to MM/DD/YYYY-HH"
    tool_to_run: convert_forcing.py
    manual_steps:
      - "Check first line of a forcing file"
      - "Format must be: 01/15/2020-00"
    prevention: "Forcing converter always writes DHSVM format"
  severity: silent
  cross_references: []

- id: dt_017
  stage: s7_execution
  failure_domain: runtime
  symptom:
    description: "Segmentation fault on startup"
    error_pattern: "Segmentation fault|SIGSEGV"
    detection_method: log_match
  diagnosis:
    root_cause: "DEM and mask binary files have different dimensions than config"
    explanation: >
      If Number of Rows/Columns in config don't match the binary file
      sizes, DHSVM reads past the end of the file array, causing a
      segfault.
    affected_components: [InitTerrainMaps]
  remedy:
    action: "Match config dimensions to binary file sizes"
    manual_steps:
      - "Check file size: stat dem.bin"
      - "Expected: Number of Rows * Number of Columns * 4"
      - "Correct config or regenerate binaries"
    prevention: "run_dhsvm.py checks file sizes before execution"
  severity: fatal
  cross_references: [dt_013]

- id: dt_018
  stage: s7_execution
  failure_domain: silent_error
  symptom:
    description: "Forcing data repeats or has gaps; output shows periodic artifacts"
    error_pattern: "no error message"
    detection_method: value_comparison
  diagnosis:
    root_cause: "Timestep in config doesn't match forcing file timestep"
    explanation: >
      If DHSVM config says Time Step = 3 (hours) but forcing files
      have 6-hour intervals, DHSVM reads every other line expecting
      3-hour data, skipping half the records or re-reading lines.
    affected_components: [InitNewStep, MakeLocalMetData]
  remedy:
    action: "Match config timestep to forcing file interval"
    manual_steps:
      - "Check Time Step in [TIME] section"
      - "Check time spacing in forcing files"
      - "Resample if needed"
    prevention: "Forcing converter stamps target timestep in filenames"
  severity: degraded
  cross_references: [dt_016]
