template_version: "3.5"

identity:
  model_id: "SWAT+"
  scientific_reference_version: "SWAT+ Rev 59.3 (operational HydroCraft binary; watershed water/sediment/nutrient process spec inherited from SWAT 2012 with object-based restructuring per Bieger et al. 2017)"
  implementation:
    id: "swat-plus-rev593"
    version: "Rev 59.3"
    provenance: "Fortran 90; USDA-ARS / Texas A&M AgriLife operational SWAT+ Rev 59.3 binary; sd_channel-stable pre-2023 build."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "LGPL-2.1"
  repo_url: "https://github.com/swat-model/swatplus"

boundary:
  scope_in:
    - "Watershed-scale rainfall-runoff partitioning at HRU resolution"
    - "Multilayer soil water dynamics with percolation, lateral flow, tile drainage, saturation excess"
    - "Snow accumulation and temperature-index snowmelt"
    - "Potential and actual evapotranspiration with vegetation/soil compensation"
    - "Lumped 1-D aquifer storage with delayed recharge and linear baseflow recession (or optional 2-D MODFLOW-style gwflow grid)"
    - "Channel routing of water, sediment, and nutrients with channel morphology evolution"
    - "Reservoir, pond, and wetland (including paddy) water and constituent balances"
    - "EPIC-style heat-unit plant growth with water/temperature/N/P/aeration/salt stress"
    - "Decision-table management (planting, fertilization, irrigation, tillage, harvest, grazing, burning)"
    - "Soil nitrogen cycling across 5 pools (NO3, NH4, active/stable organic N, fresh organic N) with mineralization, nitrification, denitrification, volatilization, leaching"
    - "Soil phosphorus cycling across labile/active/stable mineral and organic pools with sediment-bound and soluble export"
    - "MUSLE sediment yield modulated by USLE C/P factors and BMP structural practices"
    - "Optional in-stream water quality (QUAL2E nutrient kinetics) and pesticide/pathogen/salt/constituent transport"
  scope_out:
    - "Hydraulic structures other than reservoirs/ponds/wetlands"
    - "Sub-daily channel hydraulics outside the optional Green-Ampt and unit-hydrograph adjustments"
    - "External channel routing engines (no native coupling to Lohmann or CaMa-Flood; SWAT+ routes internally)"
    - "Process-based hillslope erosion (MUSLE is a peak-flow-driven empirical estimator)"
    - "Full 3-D groundwater flow (gwflow module is 2-D quasi-horizontal)"
  spatial: "distributed-stream"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Mass-balance closure applies to water and to N/P/sediment in the supported cycling modules. The QUAL2E channel-water-quality solver (wq_cha=1) is numerically unstable in Rev 59.3 at extreme flows and is recommended OFF; HRU- and basin-level mass balances remain closed in that configuration. No surface energy-balance closure: PET is computed as a demand-side flux via Priestley-Taylor / Penman-Monteith / Hargreaves rather than from a closed surface energy budget."

inputs:
  forcing:
    - category: "atmospheric"
      name: "precipitation"
      unit: "mm/day"
      source_kind: "forcing"
      model_input_format: "Daily station time series, one .pcp file per station; missing values flagged -99.0"
    - category: "atmospheric"
      name: "maximum air temperature"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "Daily station time series in .tmp"
      notes: "SWAT+ does not validate Tmax >= Tmin or Celsius range; Kelvin (~300) is silently consumed as Celsius."
    - category: "atmospheric"
      name: "minimum air temperature"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "Daily station time series in .tmp"
    - category: "atmospheric"
      name: "solar radiation"
      unit: "MJ/m2/day"
      source_kind: "forcing"
      model_input_format: "Daily station time series in .slr"
      notes: "Unit is MJ/m2/day, NOT W/m2; W/m2 inputs are silently consumed and inflate PET ~12x."
    - category: "atmospheric"
      name: "relative humidity"
      unit: "fraction (0-1)"
      source_kind: "forcing"
      model_input_format: "Daily station time series in .hmd"
      notes: "Fraction, not percent; percent values are silently consumed."
    - category: "atmospheric"
      name: "wind speed"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "Daily station time series in .wnd"
    - category: "atmospheric"
      name: "atmospheric CO2 concentration"
      unit: "ppm"
      source_kind: "forcing"
      model_input_format: "Annual basin-scale series (co2.bsn) or constant via bsn_prm%co2 default 400"
    - category: "atmospheric"
      name: "atmospheric nitrogen deposition"
      unit: "kgN/ha/yr (wet+dry)"
      source_kind: "forcing"
      model_input_format: "Optional atmo.cli station series"

  parameters:
    - category: "soil"
      name: "soil hydraulic profile (SOL_BD, SOL_AWC, SOL_K, SOL_CBN, CLAY/SILT/SAND, ROCK, SOL_ALB, USLE_K, SOL_EC, SOL_CAL, SOL_PH)"
      unit: "mixed (g/cm3, mm/mm, mm/hr, %, ...)"
      source_kind: "dataset_lookup"
      model_input_format: "Multi-layer soils.sol records; profile line + N layer lines in increasing-depth order"
      notes: "Pedotransfer chain (Saxton & Rawls 2006 for AWC and Ksat; Williams 1995 for USLE_K) is typical upstream; nly mismatch silently corrupts subsequent profiles."
    - category: "soil-structural"
      name: "structural hydrology defaults per HRU (esco, epco, perco, cn3_swf, lat_ttime, canmx)"
      unit: "mixed"
      source_kind: "calibrated"
      model_input_format: "hydrology.hyd"
      notes: "perco and cn3_swf live in hydrology.hyd, not in cal_parms.cal — runtime calibration.cal cannot adjust them; changing them requires regenerating the HRU layer."
    - category: "basin-scalar"
      name: "basin scalar coefficients (surlag, cn_froz, cmn, cdn, sdnco, nperco, pperco, phoskd, psp, rsdco, tlaps, plaps, evlai, nfixmx, uhalpha, prf, n_updis, p_updis)"
      unit: "mixed"
      source_kind: "default"
      model_input_format: "parameters.bsn with hard-coded fallbacks in basin_module.f90"
      notes: "Many defaults are baked into source (e.g., surlag=4.0, sdnco=1.30 which effectively disables denitrification unless reset, prf=484 legacy ft-unit constant, igen=5 undocumented RNG seed)."
    - category: "channel"
      name: "channel hydraulic and morphological parameters (chw, chd, chs, chl, chn, chk, bank cohesion, floodplain geometry)"
      unit: "m, m/m, dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "channel-hyd.cha, channel-lte.cha, hyd-sed-lte.cha"
    - category: "aquifer"
      name: "lumped aquifer parameters (alpha_bf, gw_delay, revap_co, rchrg_dp, flo_min, gw_spyld)"
      unit: "mixed (1/day, days, fraction, mm)"
      source_kind: "calibrated"
      model_input_format: "aquifer.aqu and initial.aqu"
    - category: "gwflow-grid"
      name: "distributed aquifer grid parameters (K, specific yield, streambed thickness and Ksat, drain perimeter K)"
      unit: "m/day, dimensionless"
      source_kind: "calibrated"
      model_input_format: "gwflow.* input files"
      notes: "Only consulted when bsn_cc%gwflow=1; otherwise replaced by lumped aqu_1d module."
    - category: "plant"
      name: "plant species/cultivar coefficients (bio_e, hvsti, blai, dlai, t_base, t_opt, gsi, vpdfr, frgrw1/2, laimx1/2, alai_min, bio_leaf, mat_yrs)"
      unit: "mixed"
      source_kind: "dataset_lookup"
      model_input_format: "plants.plt"
    - category: "landuse"
      name: "land-use coefficient table including CN2 lookup by hydrologic soil group"
      unit: "dimensionless"
      source_kind: "dataset_lookup"
      model_input_format: "cntable.lum and landuse.lum (links each HRU LU code to management, CN2, urban params, tile drains)"
    - category: "erosion"
      name: "USLE practice and cover factors (USLE_P, USLE_C via plant cover, slope length)"
      unit: "dimensionless / m"
      source_kind: "dataset_lookup"
      model_input_format: "hru-data.hru and plants.plt"

  initial_conditions:
    - category: "soil-water"
      name: "initial soil water content per layer"
      unit: "mm"
      source_kind: "default"
      model_input_format: "Initialized to field capacity unless overridden; basin_sw_init in time_control"
    - category: "soil-nutrient"
      name: "initial soil N (NO3, NH4, organic) and P pools per layer"
      unit: "kg/ha"
      source_kind: "user_provided"
      model_input_format: "nutrients.sol (optional); else initialized from SOL_CBN via mineralization defaults"
      notes: "Zero or under-initialized pools force the model to mine soil organic matter to balance crop uptake (silent negative nutrient balance)."
    - category: "aquifer-storage"
      name: "initial aquifer storage and water-table depth"
      unit: "mm, m"
      source_kind: "user_provided"
      model_input_format: "initial.aqu"
    - category: "channel-constituents"
      name: "initial channel water organic/mineral constituent concentrations"
      unit: "mg/L"
      source_kind: "user_provided"
      model_input_format: "om_water.ini"
      notes: "Bundled defaults (orgn=90, no3=70 mg/L) are placeholder values; they create massive stored channel mass that dominates HRU loads unless zeroed."
    - category: "plant-residue"
      name: "initial surface residue and plant biomass / heat-unit accumulators"
      unit: "kg/ha, heat units"
      source_kind: "default"
      model_input_format: "plant_all_init, structure_init at startup; nyskip warmup years recommended (2-3, 5 for arid)"
    - category: "snow"
      name: "initial snow water equivalent per HRU"
      unit: "mm H2O"
      source_kind: "default"
      model_input_format: "Initialized to zero unless snow.sno provides override"

  boundary_conditions:
    - category: "method-switch"
      name: "PET method selector"
      unit: "enum (0=Priestley-Taylor, 1=Penman-Monteith, 2=Hargreaves)"
      source_kind: "user_provided"
      model_input_format: "basin code (bsn_cc%pet)"
    - category: "method-switch"
      name: "surface runoff method selector"
      unit: "enum (0=SCS Curve Number, 1=Green-Ampt)"
      source_kind: "user_provided"
      model_input_format: "basin code (bsn_cc%cn)"
    - category: "method-switch"
      name: "channel routing method selector"
      unit: "enum (0=variable storage, 1=Muskingum)"
      source_kind: "user_provided"
      model_input_format: "basin code (bsn_cc%rte)"
    - category: "method-switch"
      name: "carbon cycle selector"
      unit: "enum (0=static, 1=CENTURY/Zhang2, 2=Kemanian)"
      source_kind: "user_provided"
      model_input_format: "basin code (bsn_cc%cswat)"
      notes: "Switches between three mutually-exclusive residue/N mineralization chains sharing soil carbon pools."
    - category: "method-switch"
      name: "in-stream water quality toggle"
      unit: "enum (0=off, 1=QUAL2E)"
      source_kind: "user_provided"
      model_input_format: "basin code (bsn_cc%wq_cha)"
      notes: "Rev 59.3 QUAL2E solver is numerically unstable for flashy/extreme flows; recommended OFF (use HRU-level loads)."
    - category: "method-switch"
      name: "groundwater module selector"
      unit: "enum (0=lumped aquifer, 1=gwflow 2-D grid)"
      source_kind: "user_provided"
      model_input_format: "basin code (bsn_cc%gwflow)"
    - category: "management"
      name: "land-use management schedule (plant, fert, irrigate, tillage, harvest, kill, graze, burn)"
      unit: "operations indexed by date or heat-unit fraction"
      source_kind: "user_provided"
      model_input_format: "management.sch driven by landuse.lum links; decision tables in lum.dtl for condition-triggered actions"
    - category: "management"
      name: "fertilizer application schedule and product"
      unit: "kg N/ha, kg P/ha"
      source_kind: "user_provided"
      model_input_format: "management.sch operations referencing fertilizer.frt entries (elem_n, elem_p, 28-0-0, beef_fr, dairy_fr, poultry)"
    - category: "management"
      name: "irrigation source, amount, and trigger"
      unit: "mm, source object id"
      source_kind: "user_provided"
      model_input_format: "irr.ops / decision tables; can withdraw from channel, reservoir, aquifer, or external source via wallo"
    - category: "watershed-topology"
      name: "spatial connectivity (HRU -> LSU -> channel -> aquifer -> reservoir chain)"
      unit: "object id graph"
      source_kind: "user_provided"
      model_input_format: "hru.con, chandeg.con, aquifer.con, reservoir.con, recall.con + rout_unit.con"
    - category: "watershed-topology"
      name: "weather station to spatial object mapping"
      unit: "station id per HRU/channel"
      source_kind: "user_provided"
      model_input_format: "weather-sta.cli (nearest-station assignment by centroid)"
    - category: "watershed-topology"
      name: "weather generator monthly statistics per station"
      unit: "12 monthly rows of climate statistics"
      source_kind: "user_provided"
      model_input_format: "wgn.wgn (read at initialization even when daily data are complete)"
    - category: "simulation-control"
      name: "simulation calendar (start/end day, year)"
      unit: "Julian day, year"
      source_kind: "user_provided"
      model_input_format: "time.sim"
    - category: "calibration"
      name: "runtime parameter overrides"
      unit: "cal_parm name + chg_typ (absval | abschg | pctchg) + value + spatial condition"
      source_kind: "calibrated"
      model_input_format: "calibration.cal"
      notes: "Misspelled parameter names are silently ignored; absval on cn2/awc destroys spatial heterogeneity; structural defaults in hydrology.hyd cannot be overridden here."

processes:
  modules:
    - name: "Climate"
      role: "driver"
      brief: "Reads/generates daily weather (precip, tmax/tmin/tave, solrad, rh, wnd) per station and applies elevation lapse adjustments to each HRU and channel; falls back to the weather generator on missing data."
    - name: "Snow"
      role: "process_solver"
      brief: "Temperature-index snowpack (sq_snom): accumulates as snow when tave <= falltmp; melts via seasonal sinusoidal degree-day factor scaled by fractional snow cover; updates hru%sno_mm and effective precipitation."
    - name: "SurfaceRunoff"
      role: "process_solver"
      brief: "Daily surface runoff via SCS Curve Number (soil-water-dependent retention) by default (sq_volq -> sq_dailycn); optional Green-Ampt sub-daily partitioning. Produces surfq, daily cnday, peak rate qp_cms."
    - name: "SoilWater"
      role: "integrator"
      brief: "Multilayer storage-routing soil water balance (swr_percmain + swr_substor + swr_latsed + swr_satexcess + swr_drains): percolation, lateral subsurface flow, tile drainage, saturation excess; updates per-layer storage and lateral/tile/perc fluxes."
    - name: "Evapotranspiration"
      role: "process_solver"
      brief: "Potential ET via Priestley-Taylor / Penman-Monteith / Hargreaves (et_pot) and actual ET partitioned into canopy, soil and plant components (et_act); ep_max bounds plant transpiration."
    - name: "PlantGrowth"
      role: "process_solver"
      brief: "EPIC-style heat-unit phenology, LAI, biomass and root growth (pl_grow + pl_community + pl_biomass_gro); applies water/temperature/N/P/aeration/salt stress factors to potential growth."
    - name: "NutrientCycling"
      role: "process_solver"
      brief: "Soil N (5 pools) and P (6 pools) mineralization, volatilization, nitrification, denitrification, leaching, plant uptake (nut_* and cbn_* routines); three switchable carbon chains via cswat selector (static, CENTURY/Zhang2, Kemanian)."
    - name: "Erosion"
      role: "process_solver"
      brief: "Per-HRU MUSLE sediment yield modulated by USLE C/P/LS and optional rill/splash terms; reduced by BMP filter strip, grass waterway, buffer, and fixed-BMP routines (smp_*)."
    - name: "ManagementOperations"
      role: "driver"
      brief: "Decision-table-driven plant / harvest / fert / till / irrigation / graze / burn actions executed per HRU per day (mgt_operatn + actions + dtbl_lum); mutates plant, soil and water-allocation state."
    - name: "Wetlands"
      role: "process_solver"
      brief: "Surface water body per HRU when surf_stor > 0 (wetland_control + wet_irrp): seepage to soil, paddy continuous irrigation when depth < irr_hmin, weir outflow; replaces standard surfq partition with pond dynamics."
    - name: "Aquifer1D"
      role: "integrator"
      brief: "Lumped per-aquifer storage (aqu_1d_control) with delayed recharge (delay_e currently bypassed in source), linear baseflow recession via alpha_e, water-table depth from specific yield; feeds baseflow to linked channel."
      applicability: "always unless bsn_cc%gwflow=1, in which case Groundwater2D supersedes it"
    - name: "Groundwater2D"
      role: "optional_module"
      brief: "Spatially-distributed MODFLOW-style 2-D gwflow grid (gwflow_simulate + gwflow_rech/gwet/gwsw/satx/tile/canl/resv/wetl/ppag/ppex/chem): replaces the lumped Aquifer1D with a physically-based head-and-flux solver."
      applicability: "bsn_cc%gwflow=1 (optional)"
    - name: "ChannelRouting"
      role: "integrator"
      brief: "Per-degraded-channel routing (sd_channel_control3): Muskingum or variable storage flow, peak rate, channel water quality (ch_watqual4), MUSLE-routed sediment (sd_channel_sediment3), and bank erosion / downcutting / floodplain morphology."
    - name: "ChannelWaterQuality"
      role: "optional_module"
      brief: "QUAL2E in-stream nutrient kinetics (ch_watqual4) using stream temperature wtemp = 5 + 0.75*tave; controls N/P/algae/CBOD/DO dynamics in channels."
      applicability: "bsn_cc%wq_cha=1; numerically unstable for extreme flows in Rev 59.3"
    - name: "ReservoirAndRecall"
      role: "integrator"
      brief: "Reservoir/pond water and constituent balance with weir/scenario decision tables (res_control + res_hydro/sediment/nutrient/pesticide); recall objects inject monitored time series; routing-unit ru_control aggregates HRU hydrographs into subbasin output."
    - name: "WaterAllocation"
      role: "allocator"
      brief: "Decision-driven inter-object water transfers (wallo_control): demand, withdrawal, unmet, treatment, conveyance via tower/pipe/canal; invoked from the command loop and from inside channel routing depending on source type."
    - name: "ObjectCommandLoop"
      role: "driver"
      brief: "Per-day topologically-ordered traversal of the ob(icmd) chain (command.f90): assembles incoming hydrographs (hin/hin_sur/hin_lat/hin_til/hin_aqu) from upstream objects and dispatches the per-object solver matching ob%typ."

  internal_edges:
    - from: "Climate"
      to: "Snow"
      kind: "produces_output"
      brief: "tave / tmax and precipitation drive snow accumulation versus rain partitioning and the seasonal degree-day melt rate."
    - from: "Climate"
      to: "SurfaceRunoff"
      kind: "produces_output"
      brief: "Daily/subdaily precipitation and temperature drive CN-retention or Green-Ampt infiltration partitioning."
    - from: "Climate"
      to: "Evapotranspiration"
      kind: "produces_output"
      brief: "tave, solrad, RH, wind, vpd drive PET formulation regardless of method selector."
    - from: "Climate"
      to: "ChannelWaterQuality"
      kind: "produces_output"
      brief: "wtemp = 5 + 0.75*tave is injected into channel water quality kinetics (no input control)."
    - from: "Snow"
      to: "SoilWater"
      kind: "writes_state"
      brief: "Snowmelt is added to effective precipitation, which infiltrates after surface runoff is removed (inflpcp = precip_eff - surfq)."
    - from: "SurfaceRunoff"
      to: "SoilWater"
      kind: "writes_state"
      brief: "surfq is subtracted from effective precipitation to compute infiltration entering the soil layers."
    - from: "Evapotranspiration"
      to: "SoilWater"
      kind: "writes_state"
      brief: "Actual soil evaporation (es_day) and plant transpiration (ep_day) remove water from soil layers."
    - from: "SoilWater"
      to: "Aquifer1D"
      kind: "produces_output"
      brief: "Deep-percolation flux becomes aquifer recharge (rchrg = hin%flo / (10*area_ha))."
    - from: "SoilWater"
      to: "Groundwater2D"
      kind: "produces_output"
      brief: "When gwflow is active, gwflow_rech consumes soil-bottom percolation and gwflow_soil/satx feed water back into the soil column."
    - from: "SoilWater"
      to: "PlantGrowth"
      kind: "produces_output"
      brief: "Soil moisture status drives water and aeration stress factors (strsw, strsa) modulating biomass accumulation."
    - from: "SoilWater"
      to: "NutrientCycling"
      kind: "consumes_input"
      brief: "Soil moisture drives mineralization and denitrification rates; percolation and lateral/tile flows transport NO3 and soluble P via nut_nlch and nut_solp."
    - from: "PlantGrowth"
      to: "Evapotranspiration"
      kind: "reads_state"
      brief: "LAI, canopy height and root depth modify ep_max and Penman-Monteith aerodynamic/canopy resistances."
    - from: "NutrientCycling"
      to: "PlantGrowth"
      kind: "produces_output"
      brief: "Mineral N and P availability drive uptake and stress factors strsn and strsp."
    - from: "PlantGrowth"
      to: "NutrientCycling"
      kind: "writes_state"
      brief: "Plant uptake removes mineral N/P from soil layers; residue at harvest enters the surface residue pool consumed by the carbon chain."
    - from: "PlantGrowth"
      to: "Erosion"
      kind: "produces_output"
      brief: "Canopy cover and surface residue from the plant community modulate the USLE C-factor used in MUSLE sediment yield."
    - from: "ManagementOperations"
      to: "PlantGrowth"
      kind: "writes_state"
      brief: "Plant / harvest / kill operations create or zero plant communities; pl_fert and grazing operations mutate pcom and surface residue pools."
    - from: "ManagementOperations"
      to: "SoilWater"
      kind: "writes_state"
      brief: "Irrigation operations add water to top layers and to the subdaily precip series."
    - from: "ManagementOperations"
      to: "NutrientCycling"
      kind: "writes_state"
      brief: "Fertilizer and grazing operations write to soil mineral N/P pools and to the surface residue/manure pool consumed by cbn_* and nut_* routines."
    - from: "Erosion"
      to: "ChannelRouting"
      kind: "produces_output"
      brief: "HRU sediment yield is packed into the outgoing hydrograph and routed downstream by the channel solver."
    - from: "SurfaceRunoff"
      to: "ObjectCommandLoop"
      kind: "produces_output"
      brief: "surfq, latq, qtile populate ob(icmd)%hd(3/4/5) hydrograph components consumed by downstream routing."
    - from: "Aquifer1D"
      to: "ChannelRouting"
      kind: "produces_output"
      brief: "Baseflow ob(icmd)%hd(1) from the lumped aquifer feeds the linked sd_ch via aq_ch routing fractions."
    - from: "Groundwater2D"
      to: "ChannelRouting"
      kind: "produces_output"
      brief: "gwflow_gwsw and gwflow_satx export gw-sw exchange and saturation excess to the receiving channel."
    - from: "Wetlands"
      to: "SoilWater"
      kind: "writes_state"
      brief: "Wetland seepage becomes infiltrating precipitation in the linked HRU, replacing the standard precip-runoff partition when a water body is present."
    - from: "ChannelRouting"
      to: "ChannelWaterQuality"
      kind: "writes_state"
      brief: "Routed flow, sediment, and constituent loads feed QUAL2E in-stream kinetics when wq_cha=1."
    - from: "ChannelRouting"
      to: "ReservoirAndRecall"
      kind: "produces_output"
      brief: "Channel outflow feeds downstream reservoirs and recall objects via the command-loop receiver list."
    - from: "WaterAllocation"
      to: "ChannelRouting"
      kind: "writes_state"
      brief: "Allocates withdrawals from channel water (ch_src), mutating routed flow before downstream routing continues."
    - from: "WaterAllocation"
      to: "ReservoirAndRecall"
      kind: "writes_state"
      brief: "Inter-object transfers move water between source objects (reservoirs, aquifers, recall) and demand HRUs."
    - from: "WaterAllocation"
      to: "ManagementOperations"
      kind: "writes_state"
      brief: "Allocated water delivered to irrigation demands is consumed by management irrigation operations."
    - from: "ObjectCommandLoop"
      to: "ChannelRouting"
      kind: "invokes"
      brief: "Dispatches the channel solver with isdch = ob%num and the assembled incoming hydrograph."
    - from: "ObjectCommandLoop"
      to: "PlantGrowth"
      kind: "invokes"
      brief: "Calls hru_control for each HRU object, which internally invokes pl_grow and pl_community."
    - from: "ObjectCommandLoop"
      to: "Aquifer1D"
      kind: "invokes"
      brief: "Dispatches aqu_1d_control for each aquifer object in the topological sweep."
    - from: "ObjectCommandLoop"
      to: "ReservoirAndRecall"
      kind: "invokes"
      brief: "Dispatches res_control / recall_nut / ru_control for reservoir, recall, and routing-unit objects."

states:
  variables:
    - name: "soil layer water storage (soil%phys(ly)%st)"
      unit: "mm H2O"
      role: "prognostic"
    - name: "total soil profile water (soil%sw, soil%sw_300)"
      unit: "mm H2O"
      role: "diagnostic"
    - name: "soil layer temperature (soil%phys(ly)%tmp)"
      unit: "deg C"
      role: "prognostic"
    - name: "snow water equivalent per HRU (hru%sno_mm)"
      unit: "mm H2O"
      role: "prognostic"
    - name: "canopy interception storage"
