template_version: "3.5"

identity:
  model_id: "RZWQM2"
  scientific_reference_version: "RZWQM2 (Root Zone Water Quality Model 2; model science core v2.x, e.g. 2.70) with embedded DSSAT 4.0 CERES/CROPGRO crop modules and RZ-SHAW heat/snow coupling"
  implementation:
    id: "rzwqm2-main-ryzen"
    version: "RZWQM2 (USDA-ARS release 4.2 lineage; Linux x86-64 binary main_ryzen)"
    provenance: "Fortran; USDA-ARS RZWQM2 compiled binary (Windows RZWQMrelease.exe / Linux main_ryzen) with embedded DSSAT crop modules."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "Public-Domain-US-Government (USDA-ARS)"
  repo_url: "https://www.ars.usda.gov/research/software/download/?softwareid=412&modecode=30-12-30-25"

boundary:
  scope_in:
    - "1-D soil water balance: infiltration (Green-Ampt), profile redistribution (Richards equation)"
    - "Surface runoff and macropore / preferential flow with solute transport"
    - "Tile drainage and water-table fluctuation (pseudo 2-D lateral drainage)"
    - "Evapotranspiration and surface energy balance (Shuttleworth-Wallace / extended Penman-Monteith)"
    - "Soil heat transport, snow accumulation/melt and soil freezing (RZ-SHAW)"
    - "Organic matter and carbon/nitrogen cycling with microbial activity (mineralization, nitrification, denitrification)"
    - "Phosphorus pools and transport (present in the binary, sparsely documented)"
    - "Pesticide fate and transport (equilibrium/Freundlich adsorption, degradation, runoff and leaching)"
    - "Sediment/erosion loss and associated chemical transfer to runoff (GLEAMS-based)"
    - "Soil chemistry / chemical-equilibrium speciation"
    - "Crop growth, development and yield (via embedded DSSAT CERES/CROPGRO modules)"
    - "Effect of agricultural management (fertilizer rate/timing, tillage, rotation, irrigation, residue, controlled drainage) on the above"
  scope_out:
    - "Fully 3-D / multi-column spatially distributed flow (model is 1-D with only pseudo 2-D drainage)"
    - "Stream/channel routing and watershed-scale surface hydrodynamics"
    - "Regional groundwater flow (bottom boundary is prescribed, not regionally solved)"
  spatial: "1-D column"
  temporal: "daily"
  closure: "both"
  notes: "Daily overall time step with sub-daily breakpoint resolution for infiltration and chemical movement. Coupled mass balance (water, C, N, P, pesticide) over the 1-D root-zone profile plus a surface energy / soil-heat balance (de Vries conduction; diurnal energy balance only when the RZ-SHAW snow/freezing path is active). Lateral tile drainage is a pseudo 2-D add-on, not a closed multi-dimensional flow solution."

inputs:
  forcing:
    - category: "weather"
      name: "daily meteorology (Tmin, Tmax, wind run, solar radiation, relative humidity, rainfall; optional E-pan, PAR)"
      unit: "Tmin/Tmax degC; wind km/day; SRAD MJ/m^2/day; RH %; rainfall mm; E-pan cm/day; PAR mol quanta/m^2/day"
      source_kind: "forcing"
      model_input_format: ".met (36-line header then one 10-column row per day)"
      notes: "No missing-value handler: every day must carry a complete numeric row. Setting E-pan and PAR columns to 0 triggers the model's internal Penman-Monteith/Shuttleworth-Wallace ET estimation; supplying non-zero values overrides it. Wind is a daily run (km/day), solar radiation is MJ/m^2/day. When the PAR column is 0/absent, the model internally derives PAR as 0.48 × shortwave (SRAD) in the meteorology reader (hmet); this is the model's built-in PAR estimate, not a host-tool conversion."
    - category: "weather"
      name: "breakpoint (sub-daily) rainfall intensity"
      unit: "inches (precipitation depth per breakpoint)"
      source_kind: "forcing"
      model_input_format: ".brk (20-line header, per-event control line, breakpoint time/depth pairs)"
      notes: "Drives the sub-daily infiltration intensity that the Green-Ampt/macropore routine consumes. The binary expects breakpoint precipitation in INCHES (not mm); mm supplied without /25.4 inflates infiltration ~25x."
    - category: "atmosphere"
      name: "ambient CO2 concentration"
      unit: "ppm"
      source_kind: "forcing"
      model_input_format: "grid general-property line in RZWQM.dat"
      notes: "Atmospheric driver to the crop assimilation routines; specified as a site property rather than a per-day column."
  parameters:
    - category: "site"
      name: "site geometry (latitude, longitude, elevation, slope, aspect, area)"
      unit: "lat/lon RADIANS; elevation m; slope fraction 0-1; aspect deg from north; area m^2"
      source_kind: "user_provided"
      model_input_format: "RZWQM.dat grid general-property line"
      notes: "Latitude and longitude MUST be in radians; |lat|>pi/2 indicates a degrees error that silently corrupts solar geometry and PET."
    - category: "soil"
      name: "soil horizon physical properties (bulk density, particle density, sand/silt/clay, porosity)"
      unit: "g/cm^3; %; fraction"
      source_kind: "calibrated"
      model_input_format: "RZWQM.dat soil physical section (per horizon, max 20 horizons / 3000 cm)"
    - category: "soil"
      name: "Brooks-Corey hydraulic parameters (bubbling pressure, pore-size index lambda, Ksat, residual/saturated water content, field-capacity points, lateral Ksat)"
      unit: "bubbling pressure cm H2O; Ksat cm/hr; water contents cm^3/cm^3"
      source_kind: "calibrated"
      model_input_format: "RZWQM.dat soil hydraulic section (per horizon)"
      notes: "Dominant water-flux controls; sensitivity order Ksat > effective porosity (ws-wr) > macroporosity > bubbling pressure > pore-size index."
    - category: "soil"
      name: "macropore / micropore properties (total macroporosity, radius, width, crack/aggregate geometry, dead-end fraction, microporosity by texture)"
      unit: "fraction; cm"
      source_kind: "calibrated"
      model_input_format: "RZWQM.dat macropore and micropore sections"
    - category: "soil"
      name: "soil heat / thermal parameters (method flag, thermal conductivity)"
      unit: "dimensionless flag; W/m/K"
      source_kind: "calibrated"
      model_input_format: "RZWQM.dat heat-model section"
    - category: "crop"
      name: "DSSAT cultivar / ecotype / species coefficients"
      unit: "crop-specific genetic coefficients"
      source_kind: "dataset_lookup"
      model_input_format: ".CUL / .ECO / .SPE DSSAT databases (linked via .RZX)"
      notes: "Cultivar coefficients are fixed-width and crop-specific (maize, wheat, soybean differ in parameter count); they parameterize the embedded DSSAT crop modules."
    - category: "chemistry"
      name: "pesticide chemical properties (Freundlich adsorption constant, dissociation/pKa, degradation rates) and soil chemistry parameters (pH, CEC)"
      unit: "adsorption constant, rate constants, pH, cmol/kg"
      source_kind: "calibrated"
      model_input_format: "RZWQM.dat pesticide/chemistry sections and RZINIT.dat chemistry section"
  initial_conditions:
    - category: "soil_water"
      name: "initial soil water tension/content and soil temperature per horizon"
      unit: "cm tension or cm^3/cm^3; degC"
      source_kind: "user_provided"
      model_input_format: "RZINIT.dat water section"
      notes: "A 1-3 year warm-up is recommended to equilibrate the profile before the analysis period."
    - category: "nutrient"
      name: "initial nitrogen pools (NO3, NH4, urea, fast/slow organic N) per horizon"
      unit: "ug/g or kg/ha"
      source_kind: "user_provided"
      model_input_format: "RZINIT.dat nutrient section"
    - category: "chemistry"
      name: "initial soil chemistry (pH, CEC, organic carbon) per horizon"
      unit: "pH; cmol/kg; %"
      source_kind: "user_provided"
      model_input_format: "RZINIT.dat chemistry section"
    - category: "residue"
      name: "initial surface residue / organic-matter pool state"
      unit: "kg/ha"
      source_kind: "user_provided"
      model_input_format: "RZINIT.dat / management residue settings"
    - category: "snow"
      name: "initial snow water / depth state"
      unit: "cm"
      source_kind: "user_provided"
      model_input_format: ".sno"
  boundary_conditions:
    - category: "control"
      name: "simulation period (start/end dates)"
      unit: "DD MM YYYY DD MM YYYY"
      source_kind: "user_provided"
      model_input_format: "ipnames.dat line 8"
      notes: "Dates must fall within the .met record range."
    - category: "hydrology_option"
      name: "bottom boundary condition (1=free drainage, 2=water table, 3=constant flux/lysimeter)"
      unit: "integer switch"
      source_kind: "user_provided"
      model_input_format: "RZWQM.dat infiltration parameter line"
      notes: "Tile drainage requires the constant-flux option (BC=3) together with perched-water-table and lateral-Ksat settings; otherwise drainage is zero."
    - category: "drainage_geometry"
      name: "tile drainage configuration (drain flag, drain depth/spacing geometry, lateral Ksat threshold)"
      unit: "geometry in cm; lateral Ksat cm/hr"
      source_kind: "user_provided"
      model_input_format: "RZWQM.dat infiltration/drainage section"
    - category: "management"
      name: "management events (planting date/density/row spacing, fertilizer N/P rate and timing, manure, tillage, irrigation mode, residue, harvest)"
      unit: "dates; kg/ha; counts"
      source_kind: "user_provided"
      model_input_format: "RZWQM.dat management sections and plgen.dat"
      notes: "Fertilizer timing uses event codes (e.g., 1=preplant, 3=postemergence); irrigation is set as irrigated vs rainfed mode."
    - category: "crop_selection"
      name: "crop / cultivar selection and planting plant-reference"
      unit: "crop id + cultivar id"
      source_kind: "user_provided"
      model_input_format: "RZWQM.dat crop line and planting schedule; .RZX DSSAT link"
      notes: "Selects which embedded DSSAT crop module (CERES maize/wheat, CROPGRO soybean, etc.) runs; an incomplete/empty cultivar id makes DSSAT fall back to its first .CUL entry."

processes:
  modules:
    - name: "Management"
      role: "driver"
      brief: "Rule/event-based application of fertilizer (rate and timing), manure, tillage, crop rotation, irrigation, residue and controlled-drainage actions that perturb soil and nutrient state."
    - name: "Infiltration_GreenAmpt"
      role: "process_solver"
      brief: "Sub-daily Green-Ampt infiltration from breakpoint rainfall, partitioning rainfall into infiltration, surface runoff and ponding; surface-layer macropore cylinder radius internally clamped."
    - name: "SoilWater_Richards"
      role: "process_solver"
      brief: "1-D Richards-equation redistribution of soil water on the half-way-rule finite-difference node grid; sets soil water content/tension by node."
    - name: "Macropore_PreferentialFlow"
      role: "process_solver"
      brief: "Matrix/micropore/macropore flow split (root and worm channels) routing water and dissolved/adsorbed solute preferentially to depth."
    - name: "Drainage_WaterTable"
      role: "process_solver"
      brief: "Pseudo 2-D lateral tile-drainage flux and water-table fluctuation under the constant-flux bottom boundary."
    - name: "ET_ShuttleworthWallace"
      role: "process_solver"
      brief: "Potential ET via Shuttleworth-Wallace (extended Penman-Monteith) with surface evaporation from the upper-boundary water flux; partitions into soil evaporation and transpiration demand."
    - name: "SoilHeat_RZSHAW"
      role: "process_solver"
      brief: "SHAW-derived soil heat conduction, snow accumulation/melt and soil-freezing routines (goshaw/heat/freeze/snow); produces soil temperature and frozen-state that feed N cycling and crop modules."
      applicability: "snow/over-winter/frozen-soil conditions (RZ-SHAW path)"
    - name: "Nutrient_OMNI"
      role: "process_solver"
      brief: "Carbon/nitrogen cycling with two residue pools, three soil organic-matter (humus) pools and three microbial pools; governs mineralization, immobilization, nitrification, denitrification and urea hydrolysis."
    - name: "Phosphorus_Cycle"
      role: "process_solver"
      brief: "Organic and labile phosphorus pools, fertilizer-P availability, and P leaching via matrix and macropore transport."
      applicability: "when P accounting is active"
    - name: "SoilChemistry_Equilibrium"
      role: "process_solver"
      brief: "Equilibrium soil chemistry / carbonate speciation (activity coefficients, pH effects) controlling solute reactions; low-salinity neutral solutions assume activity coefficient = 1."
    - name: "Pesticide_FateTransport"
      role: "optional_module"
      brief: "Pesticide equilibrium/Freundlich adsorption, degradation, dissociation (weak acids), runoff transfer and subsurface leaching."
    - name: "Erosion_GLEAMS"
      role: "optional_module"
      brief: "GLEAMS-based sediment/erosion loss and associated chemical transfer to runoff water."
    - name: "Crop_DSSAT"
      role: "process_solver"
      brief: "Embedded DSSAT CERES (cereals/maize) and CROPGRO (legumes) crop modules (plus quick-turf/quick-tree options) computing phenology, biomass, yield, and root water/N uptake from RZWQM2 soil state."
    - name: "RootWaterUptake"
      role: "allocator"
      brief: "Distributes crop transpiration demand and N uptake across soil nodes against available soil water and nitrogen."
    - name: "MassBalance"
      role: "integrator"
      brief: "Per-step water, nitrogen, carbon, phosphorus and pesticide balance accounting that closes the profile budgets and aggregates daily output."
  internal_edges:
    - from: "Management"
      to: "Nutrient_OMNI"
      kind: "writes_state"
      brief: "Fertilizer/manure/tillage events change nitrogen and organic-matter pools and reaction rates."
    - from: "Management"
      to: "Crop_DSSAT"
      kind: "invokes"
      brief: "Planting/harvest events start and terminate the crop growth cycle."
    - from: "Infiltration_GreenAmpt"
      to: "SoilWater_Richards"
      kind: "writes_state"
      brief: "Infiltrated water enters the profile as the upper flux boundary for Richards redistribution."
    - from: "Infiltration_GreenAmpt"
      to: "Macropore_PreferentialFlow"
      kind: "writes_state"
      brief: "Excess/intense infiltration is partitioned into macropore flow."
    - from: "Macropore_PreferentialFlow"
      to: "Nutrient_OMNI"
      kind: "writes_state"
      brief: "Preferential flow transports dissolved nitrate/solute to depth, depleting upper-layer pools."
    - from: "SoilWater_Richards"
      to: "Drainage_WaterTable"
      kind: "produces_output"
      brief: "Profile water state and the constant-flux bottom boundary set the lateral tile-drainage flux."
    - from: "SoilWater_Richards"
      to: "RootWaterUptake"
      kind: "reads_state"
      brief: "Available soil water by node limits transpiration extraction."
    - from: "ET_ShuttleworthWallace"
      to: "SoilWater_Richards"
      kind: "writes_state"
      brief: "Soil evaporation and transpiration demand remove water from surface and root-zone nodes."
    - from: "SoilHeat_RZSHAW"
      to: "SoilWater_Richards"
      kind: "writes_state"
      brief: "Soil freezing/snow state modifies infiltration and soil-water dynamics in winter."
    - from: "SoilHeat_RZSHAW"
      to: "Nutrient_OMNI"
      kind: "reads_state"
      brief: "Soil temperature drives temperature-dependent N transformation (Arrhenius nitrification/denitrification) rates."
    - from: "SoilChemistry_Equilibrium"
      to: "Pesticide_FateTransport"
      kind: "reads_state"
      brief: "Soil pH / chemical-equilibrium speciation (activity coefficients) controls weak-acid pesticide dissociation and Freundlich adsorption."
    - from: "Nutrient_OMNI"
      to: "Crop_DSSAT"
      kind: "produces_output"
      brief: "Mineral N (NO3/NH4) produced by C/N cycling supplies crop nitrogen uptake."
    - from: "Crop_DSSAT"
      to: "Nutrient_OMNI"
      kind: "writes_state"
      brief: "Crop residue and root turnover feed the residue/organic-matter pools."
    - from: "Crop_DSSAT"
      to: "RootWaterUptake"
      kind: "invokes"
      brief: "Crop demand drives the root water- and nitrogen-uptake allocation."
    - from: "SoilWater_Richards"
      to: "Pesticide_FateTransport"
      kind: "produces_output"
      brief: "Water fluxes (leaching, runoff) transport dissolved/adsorbed pesticide."
    - from: "Macropore_PreferentialFlow"
      to: "Phosphorus_Cycle"
      kind: "writes_state"
      brief: "Macropore and matrix flow carry labile/fertilizer P to drainage and leaching loss."
    - from: "Crop_DSSAT"
      to: "Outputs"
      kind: "produces_output"
      brief: "Crop development, biomass and yield are written to the daily output."
    - from: "Drainage_WaterTable"
      to: "MassBalance"
      kind: "produces_output"
      brief: "Tile-drainage and seepage fluxes enter the water and solute balance accounting."
    - from: "Nutrient_OMNI"
      to: "MassBalance"
      kind: "produces_output"
      brief: "Nitrate leaching and N pool changes enter the nitrogen balance accounting."

states:
  variables:
    - name: "soil_water_content_tension"
      unit: "cm^3/cm^3 or cm tension"
      role: "prognostic"
    - name: "soil_temperature"
      unit: "degC"
      role: "prognostic"
    - name: "soil_nitrate (soilno3)"
      unit: "kg N/ha"
      role: "prognostic"
    - name: "mineral_ammonium_urea_pools"
      unit: "kg N/ha"
      role: "prognostic"
    - name: "organic_N / humus pools (fast/intermediate/slow) + microbial pools"
      unit: "kg N/ha; kg C/ha"
      role: "prognostic"
    - name: "soil_organic_carbon pools (humusc1/c2/c3)"
      unit: "kg C/ha"
      role: "prognostic"
    - name: "phosphorus pools (organic humusp, labile clabp, fertilizer-P)"
      unit: "kg P/ha"
      role: "prognostic"
    - name: "water_table_depth"
      unit: "cm"
      role: "prognostic"
    - name: "snow_water_equivalent / frozen-soil state"
      unit: "cm; fraction frozen"
      role: "prognostic"
    - name: "crop biomass / LAI / phenological stage (DSSAT)"
      unit: "kg/ha; m^2/m^2; stage index"
      role: "prognostic"
    - name: "rooting depth / root distribution"
      unit: "cm"
      role: "prognostic"
    - name: "surface residue mass"
      unit: "kg/ha"
      role: "prognostic"
    - name: "pesticide concentration (matrix and macropore)"
      unit: "mass/volume"
      role: "prognostic"
    - name: "tile_drainage / runoff / deep_seepage fluxes"
      unit: "cm/day"
      role: "diagnostic"
    - name: "evapotranspiration (actual and potential)"
      unit: "mm/day"
      role: "diagnostic"
    - name: "nitrate leaching / tile-drain N loss"
      unit: "kg N/ha"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "soil_water_storage"
    validation_rank: 3
    unit: "cm (profile) or cm^3/cm^3 (volumetric by layer)"
    description: "Total and layer-resolved soil water content in the root-zone profile."
    emitted_in: ".ana (profile total); Layer.plt (depth-resolved by node)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats: ["Layer.plt node depths derive from the half-way-rule discretization and may not align with sensor/horizon depths; depth matching required before comparison."]
      detrending_options: ["none"]
  - var: "tile_drainage"
    validation_rank: 4
    unit: "cm (.ana column; multiply by 10 for mm)"
    description: "Lateral tile-drainage water flux leaving the profile."
    emitted_in: ".ana (column index 10)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Reported in cm; convert to mm (x10) before comparison with mm-based drain-flow observations."]
      detrending_options: ["none"]
  - var: "evapotranspiration"
    validation_rank: 2
    unit: "mm/day (or cm)"
    description: "Actual and potential evapotranspiration from the surface energy/water balance."
    emitted_in: ".ana"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Non-zero E-pan/PAR forcing columns override the internal ET estimate; comparison only meaningful when internal ET is active."]
      detrending_options: ["none"]
  - var: "no3_leaching"
    validation_rank: 5
    unit: "kg N/ha"
    description: "Nitrate-N in subsurface soil-profile leachate below the root zone and in tile-drainage water."
    emitted_in: ".ana"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Strongly dependent on calibrated N-transformation and humus-pool parameters; uncalibrated runs are not predictive."]
      detrending_options: ["none"]
  - var: "soil_nitrate"
    validation_rank: 6
    unit: "kg N/ha (or ug/g by layer)"
    description: "Soil nitrate-N content / concentration in the profile."
    emitted_in: ".ana (profile); Layer.plt (depth-resolved N species)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Depth-resolved sampling must be matched to discretization nodes."]
      detrending_options: ["none"]
  - var: "crop_yield"
    validation_rank: 1
    unit: "kg/ha"
    description: "Crop grain yield from the embedded DSSAT crop module."
    emitted_in: ".ana (grain yield column); MANAGE.OUT; PLANTSUM.OUT (may be missing)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["Single-season point yield; field-measured yield is the appropriate target."]
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "ranking_quality"]
          determining_metric: "pbias"
          caveats: ["Multi-season field yields; inter-annual ranking is meaningful at a calibrated point."]
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["trend_match", "magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: ["National/regional yield aggregates carry a technology trend a point process model cannot reproduce; detrend before comparing."]
      detrending_options: ["none", "linear_residual", "decadal_mean"]
  - var: "soil_temperature"
    validation_rank: 7
    unit: "degC"
    description: "Soil temperature profile by depth."
    emitted_in: ".ana (column 4); Layer.plt (depth-resolved)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Layer.plt node depths must be matched to sensor depths."]
      detrending_options: ["none"]
  - var: "snow_depth"
    validation_rank: 8
    unit: "cm"
    description: "Snow depth / snow water state (RZ-SHAW)."
    emitted_in: ".ana (column index 91)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Only meaningful when the RZ-SHAW snow/freezing path is active."]
      detrending_options: ["none"]
  - var: "pesticide_loss"
    validation_rank: 9
    unit: "mass and concentration units (runoff and leachate)"
    description: "Pesticide mass loss and concentration in surface runoff water and subsurface leachate."
    emitted_in: ".ana / chemistry output files"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Weak-acid pesticide predictions are highly sensitive to Freundlich constant, soil pH and dissociation coefficient; treat as semi-quantitative without calibration."]
      detrending_options: ["none"]

influence:
  edges:
    - from: "saturated_hydraulic_conductivity (Ksat, by layer)"
      to: "tile_drainage"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["nolan2011_rzwqm2_inverse_pest", "xi2017_rzwqm2_surrogate_opt", "sun2016_rzwqm2_glue"]
    - from: "saturated_hydraulic_conductivity (Ksat, by layer)"
      to: "soil_water_storage"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      citations: ["sun2016_rzwqm2_glue", "esmaeili2014_rzwqm_global_sa"]
