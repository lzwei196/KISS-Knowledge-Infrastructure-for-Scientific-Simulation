    unit: kinematic m^2/s^2 [0 2 -2 0 0 0 0]
  parameters:
  - name: nu (kinematic viscosity)
    unit: m^2/s [0 2 -1 0 0 0 0]
  - name: sigma (surface tension)
    unit: N/m = kg/s^2 [1 0 -2 0 0 0 0]
  - name: k-epsilon closure constants (Cmu, C1, C2, sigmak, sigmaEps)
    unit: dimensionless
  initial_conditions:
  - name: Initial velocity / pressure fields
    unit: m/s ; kinematic m^2/s^2
  - name: Initial turbulence fields (k, epsilon, omega)
    unit: k m^2/s^2 ; epsilon m^2/s^3 ; omega 1/s
  - name: Initial phase fraction alpha.water and hydrostatic p_rgh
    unit: alpha dimensionless 0-1 ; p_rgh kinematic m^2/s^2
  boundary_conditions:
  - name: Computational mesh (polyMesh)
    unit: m (SI)
  - name: Boundary-condition patch types
    unit: categorical
  - name: g (gravity)
    unit: m/s^2 (vector)
  - name: Discretisation schemes (fvSchemes)
    unit: categorical
  - name: Linear solvers and algorithm controls (fvSolution)
    unit: categorical / numeric
  - name: Run controls (controlDict)
