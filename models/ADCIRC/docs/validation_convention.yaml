# Grounding policy:
# - Blocks are keyed by dag_variable, not canonical_quantity, per the 2026-08-14 campaign instruction.
# - Water-level and current numeric gates come from the fetched hydrodynamic guidance table:
#   "statistical guidelines to establish calibration standards" for coastal/estuarine models.
# - Spatial inundation CSI gates come from fetched flood-model evaluation literature; Bennett 2013
#   defines CSI as hits/(hits+misses+false alarms), and Grimley 2025 reports that well-validated
#   flood-extent models achieve CSI values of 0.7-0.8.
# - Atmospheric pressure and wind outputs are ADCIRC forcing echoes in the DAG. Fetched ADCIRC
#   papers validate those forcings qualitatively or against external buoy/station products, but no
#   fetched paper gives a numeric spatial-CSI pass band; those blocks are intentionally low-confidence.

