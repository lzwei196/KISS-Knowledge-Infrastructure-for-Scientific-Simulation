# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: ADCIRC
  language: fortran
  implementation:
    id: adcirc-v562
    version: v56.2.1
    provenance: Fortran 2008 finite-element coastal-circulation code (serial adcirc / parallel padcirc)
      from the Luettich/Westerink ADCIRC distribution realizing the GWCE formulation; optional padcswan
      SWAN coupling.
  scientific_reference_version: ADCIRC v56.2.1 (Luettich/Westerink GWCE finite-element formulation)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/ADCIRC/source/repo/build/adcirc
    type: work_dir
pipeline:
  stages:
  - s1_mesh_preparation
  - s2_parameter_configuration
  - s3_nodal_attributes
  - s4_meteorological_forcing
  - s5_boundary_conditions
  - s6_execution
  - s7_output_analysis
tools:
  count: 4
  files:
  - tools/convert_bathymetry_to_fort14.py
  - tools/convert_forcing_to_adcirc.py
  - tools/parse_adcirc_output.py
  - tools/run_adcirc.py
inputs:
  forcing:
  - name: Meteorological forcing (wind + atmospheric pressure)
    unit: wind m/s; pressure mb (hPa) in OWI input, m H2O internally
  parameters:
  - name: Bathymetric depth DP
    unit: m, POSITIVE below geoid (NEGATIVE above)
  - name: Manning's n at sea floor
    unit: s/m^(1/3) (typical 0.02-0.12)
  - name: Mesh geometry and connectivity
    unit: degrees (ICS=2) or meters (ICS=1)
  - name: GWCE/numerical/friction control parameters
    unit: mixed (DTDP s; G m/s^2; TAU0 dimensionless; ESLM m^2/s)
  initial_conditions:
  - name: Hot-start restart state
    unit: Fortran unformatted binary
  boundary_conditions:
  - name: Tidal harmonic open-boundary forcing
    unit: amplitude m; phase deg; period s
  - name: Non-periodic elevation boundary condition
    unit: time s vs elevation m
  - name: Non-periodic normal-flux boundary condition (e.g. river discharge)
    unit: time s vs normal flux m^2/s
  - name: Self-attraction and earth-load tide forcing
    unit: SAL amplitude / phase per node
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - water_surface_elevation_stations
  - water_surface_elevation_all_nodes
  - depth_averaged_velocity_stations
  - depth_averaged_velocity_all_nodes
  - max_water_surface_elevation
  - max_velocity
  - atmospheric_pressure_all_nodes
  - wind_velocity_all_nodes
  - min_atmospheric_pressure
  - max_wind_velocity
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=1.000, KGE=0.988, R=1.000, 2 scorecard(s)'
  metrics:
    best_nse: 0.9995
    best_kge: 0.988
    best_r: 0.9998
summary:
  total_tools: 4
  total_stage_docs: 7
  total_diagnostic_triplets: 20
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
