safety:
  hazards:
    - id: precip_conversion_silent_scale
      kind: weather_file_semantic
      description: "precipitation_coversion factor mismatched to input units silently rescales precip (86.4x / 86400x), giving 100-1000x discharge error or near-zero runoff; no error raised. Note CWatM's code key is the misspelling 'coversion'."
      severity: silent
    - id: temperature_kelvin_flag_mismatch
      kind: weather_file_semantic
      description: "TemperatureInKelvin flag inconsistent with input units makes snow partitioning/melt/ET catastrophically wrong (Celsius-as-Kelvin -> all snow; double-converted Kelvin -> extreme melt); silent. Check: T>200 means Kelvin."
      severity: silent
    - id: ksat_units_wrong
      kind: soil_semantic
      description: "Saturated conductivity not converted to cm/day (SoilGrids mm/hr needs x2.4, m/s needs x8.64e6) -> instant drainage or waterlogging; silent."
      severity: silent
    - id: vangenuchten_alpha_units
      kind: soil_semantic
      description: "van Genuchten alpha in 1/m instead of 1/cm is 100x too large, soil appears far sandier; wrong retention curve; silent."
      severity: silent
    - id: penman_monteith_input_units
      kind: weather_file_semantic
      description: "Penman-Monteith pressure in hPa (not Pa) makes psychrometric constant 100x wrong, or radiation in MJ/m2/day (not W/m2) ~11.6x wrong -> ET grossly wrong; silent."
      severity: silent
    - id: ldd_coding_convention
      kind: control_semantic
      description: "ArcGIS D8 power-of-2 LDD used instead of PCRaster 1-9 (5=pit) convention disconnects the drainage network, driving outlet discharge to near zero."
      severity: fatal_or_silent
    - id: channel_gradient_zero
      kind: numerical_instability
      description: "Zero channel gradient causes division by zero in the kinematic-wave solver; chanGrad must be enforced >= 0.0001."
      severity: fatal
    - id: nan_forcing_propagation
      kind: numerical_instability
      description: "A single NaN in forcing or soil parameters propagates through all calculations to NaN discharge everywhere; the model does not guard missing values."
      severity: silent
    - id: insufficient_spinup
      kind: initial_condition_semantic
      description: "Spinup shorter than 3-5 years leaves groundwater/soil storage unequilibrated, inflating early-year discharge before it stabilizes."
      severity: degraded
    - id: forcing_grid_mismatch
      kind: control_semantic
      description: "Meteorological forcing grid in a different CRS/shape than the model grid produces an array-shape mismatch; forcing must share CRS (WGS84) and be same-or-coarser resolution."
      severity: fatal
  validation_limits:
    - "Daily I/O timestep cannot resolve sub-daily flood peaks (routing substeps internally but reports daily)."
    - "No explicit glacier model: high-altitude ice melt is emulated by summer snow melt in elevation zones unless OGGM-coupled."
    - "Single linear-reservoir groundwater cannot represent confined-aquifer or lateral groundwater flow unless MODFLOW 6 coupling is enabled."
    - "Out of scope: detailed water-quality chemistry and sediment transport."
    - "Key parameters (Arno b, recession coefficient, interflow factor, snowmelt factor) are calibration targets; uncalibrated runs are structurally biased and daily NSE is structurally lower than monthly."
  warnings:
    - "groundwater_modflow silently substitutes for the linear-reservoir groundwater when modflow coupling is True (and not in calibration), changing which state (groundwater_storage_available vs storGroundwater) feeds TWS."
    - "crop_correct (ET scaling) miscalibration produces systematic PBIAS (>30%) in discharge magnitude; calibrate it before soildepth_factor."
    - "arnoBeta_add and recessionCoeff_factor jointly control hydrograph peak sharpness and recession-limb slope; sharp peaks -> decrease arno / increase recession."
    - "crop_correct and arnoBeta_add are compensating (equifinality): different combinations yield similar discharge but different internal water balance."
    - "Exclude the spinup period from all metrics and filter near-zero negative discharge arising from routing numerics."
  assumptions:
    - statement: "Rain/snow partition uses a fixed ~1 C air-temperature threshold."
      scope: "snow_frost module"
      source: "CWatM hydrological-processes documentation (82_processes)"
      status: adopted
    - statement: "Soil processes (transpiration, evaporation, infiltration) are set to zero when the frost index exceeds its critical threshold; the source carries a continuous Molnau-Bissell index while the docs state a 56 C-day threshold."
      scope: "snow_frost / soil coupling"
      source: "CWatM processes docs and snow_frost module behavior"
      status: adopted
    - statement: "Prognostic stores are carried internally in metres of water depth (and a continuous frost index); the published docs report the same quantities in mm and C-days. State units follow the model-internal source values."
      scope: "states block"
      source: "CWatM source module variables (soil, groundwater, snow_frost) vs processes docs"
      status: adopted
    - statement: "Grid-cell fluxes/states are the fraction-weighted sum over six land-cover classes; the cell is treated as a mosaic of independent column processes, not laterally interacting sub-units."
      scope: "landcoverType allocation"
      source: "CWatM land-cover-differentiation documentation"
      status: adopted
    - statement: "Water mass balance closes (DeltaS = P - ET - Q_out + Q_in to within ~1% over multi-year periods); there is no closed surface energy budget - PET is a demand-side flux."
      scope: "whole-model closure"
      source: "CWatM model description (Burek 2020) and water-balance documentation"
      status: adopted
