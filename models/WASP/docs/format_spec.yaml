    If mg/L v
  remedy: 'Multiply mg/L chlorophyll-a values by 1000 to convert to ug/L; convert_forcing_to_wasp; [''Check
    ResultMeasure/MeasureUnitCode for Chl-a records'', "If unit is ''mg/L'' or ''mg/l'', multiply by 1000
