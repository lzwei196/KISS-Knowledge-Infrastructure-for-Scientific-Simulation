model:
  name: QUINCY (QUantifying Interactions between terrestrial Nutrient CYcles)
  domain: biosphere
  binary_path: ''
  language: unknown
inputs:
  forcing:
  - name: VP
    unit: VPD_F
    format: ''
    source: skill_md
  - name: PRECIP
    unit: P_F
    format: ''
    source: skill_md
  - name: Precipitation
    unit: ''
    format: ''
    source: skill_md
  - name: Temperature
    unit: K
    format: ''
    source: skill_md
  - name: rh
    unit: Rh,base
    format: ''
    source: skill_md
outputs:
  primary:
  - name: CO2
    unit: CO2_F_MDS
    format: ''
    source: skill_md
  - name: Temperature
    unit: K
    format: ''
    source: skill_md
  - name: lai
    unit: LAImax
    format: ''
    source: skill_md
  - name: npp
    canonical_id: npp
    unit: gC/m2/day
  - name: biomass
    canonical_id: biomass
    unit: kgC/m2
  - name: leaf_area_index
    canonical_id: leaf_area_index
    unit: m2/m2
  - name: soil_carbon
    canonical_id: soil_carbon
    unit: kgC/m2
