    before model execution.

    '
  severity: critical
- id: dt_quincy_020
  symptom: 'CO2 concentration in forcing data is ~0.0004 instead of ~400 ppm. GPP is extremely low because
    the Farquhar model computes near-zero carboxylation at such low CO2.

    '
  diagnosis: 'CO2 was provided as a mole fraction (e.g., 0.000415 mol/mol) instead of ppm (415). QUINCY
    expects CO2 in ppm. The Farquhar model uses CO2 in the Ci calculation (Ci = g1/(g1+1) * Ca), and with
    Ca ~ 0.0004 ppm, the intercellular CO2 is essentially zero, making Wc (Rubisco-limited rate) negligible.

    '
  remedy: 'Ensure CO2 is in ppm (parts per million). FLUXNET2015 CO2_F_MDS is already in ppm. If CO2 data
    is a mole fraction, multiply by 1e6. If >50% of CO2 data is missing, apply the linear trend fallback:
    CO2 = 360 + 2.1 * (year - 1996).

    '
  severity: major
- id: dt_quincy_021
  symptom: 'Daylength calculation produces wrong values, and the seasonal cycle of GPP is shifted or has
    wrong amplitude. Winter GPP is too high at high latitudes.

    '
  diagnosis: 'Site latitude was entered in the wrong hemisphere sign (positive instead of negative for
