# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: LPJ-GUESS
  language: C++
  implementation:
    id: lpj-guess-4.1.1
    version: 4.1.1 research release (Zenodo 10.5281/zenodo.8065737)
    provenance: C++ engine built 2026-10-06 from the official release (cmake Release, g++ 13.3, NetCDF
      linked) at KISSPATH_HOME/engine_builds_20261006/LPJ_GUESS/build/guess; driven by tools/run_lpjguess_engine.py.
      The Python light-use-efficiency stand-in (tools/run_lpjguess.py) is a SURROGATE and is NOT described
      by this dag; its old contract is kept apart in docs/surrogate_lpjguess_lue_dag.yaml.
  scientific_reference_version: LPJ-GUESS 4.1.1 (Smith et al. 2001, 2014; Sitch et al. 2003) — real engine
inputs:
  forcing:
  - name: temp
    unit: K
    category: forcing
    source_kind: forcing
    model_input_format: CF NetCDF, standard_name air_temperature, daily mean
    notes: Rejected unless units == 'K'.
  - name: prec
    unit: kg m-2 s-1
    category: forcing
    source_kind: forcing
    model_input_format: CF NetCDF, standard_name precipitation_flux, daily mean
    notes: mm/day / 86400.
  - name: insol
    unit: W m-2
    category: forcing
    source_kind: forcing
    model_input_format: CF NetCDF, standard_name surface_downwelling_shortwave_flux_in_air, 24-h mean
    notes: Not net radiation, not MJ.
  - name: min_temp
    unit: K
    category: forcing
    source_kind: forcing
    model_input_format: CF NetCDF air_temperature, daily minimum
    notes: Needed for BVOC/GWGEN; supplied anyway.
  - name: max_temp
    unit: K
    category: forcing
    source_kind: forcing
    model_input_format: CF NetCDF air_temperature, daily maximum
    notes: ''
  - name: relhum
    unit: '1'
    category: forcing
    source_kind: forcing
    model_input_format: CF NetCDF relative_humidity as a 0-1 fraction
    notes: Derived from specific humidity, pressure, temperature.
  - name: wind
    unit: m s-1
    category: forcing
    source_kind: forcing
    model_input_format: CF NetCDF wind_speed
    notes: 10 m wind from the loader.
  - name: co2
    unit: ppm
    category: forcing
    source_kind: forcing
    model_input_format: text '<year> <ppm>' per consecutive year (file_co2)
    notes: Built by build_lpjguess_co2_file.py (Law Dome + NOAA Mauna Loa).
  parameters:
  - name: soil code
    unit: categorical
    category: parameters
    source_kind: dataset_lookup
    model_input_format: LPJ soil class (soils_lpj.dat, 0.5-degree map) of the cell holding the site; run
      tool writes an exact site line
    notes: Sets texture-based water holding and thermal properties.
  - name: PFT parameters
    unit: mixed
    category: parameters
    source_kind: user_provided
    model_input_format: pft blocks in global.ins (shipped values, Smith et al. 2014)
    notes: Not calibrated by the KI.
  initial_conditions: []
  boundary_conditions:
  - name: vegmode
    unit: categorical
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: '''cohort'' (individual-based) or ''population'' (area-averaged) vegetation mode'
    notes: global.ins default 'cohort'.
  - name: npatch
    unit: count
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: number of replicate patches (>=25 for cohort-mode robustness)
  - name: nyear_spinup
    unit: years
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: spinup length for soil C equilibration (>=500 temperate, 1000+ boreal/peatland)
  - name: PFT selection
    unit: categorical
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: climatically appropriate PFTs enabled with bioclimatic filtering (T_min, T_max,
      GDD)
  - name: firemodel
    unit: categorical
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: GLOBFIRM (KI default) | NOFIRE | BLAZE (needs SimfireInput.bin)
outputs:
  primary:
  - name: GPP
    unit: umol/m2/s
    description: Gross Primary Production (terrestrial vegetation carbon assimilation flux).
    validation_rank: 1
    emitted_in: mgpp.out (kgC m-2 month-1; GPP minus leaf respiration); converted to umol/m2/s by parse_lpjguess_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Eddy-covariance GPP is a partitioning-derived flux, not a direct measurement.
        - Internal flux may be gC/m2/day; convert to umol/m2/s (1 gC/m2/day = 0.9636 umol/m2/s) before
          comparison.
        - Engine GPP excludes leaf dark respiration (commonoutput.cpp 'GPP-LeafResp'); expect it a few
          percent below partitioned tower GPP (dt_lpjguess_025).
      detrending_options:
      - none
  - name: Ra
    unit: umol/m2/s
    description: Autotrophic respiration (terrestrial vegetation carbon respiration flux).
    validation_rank: 3
    emitted_in: mra.out; converted to umol/m2/s by parse_lpjguess_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Ra is not directly observable by eddy covariance; comparable only against partitioned/modelled
          estimates.
      detrending_options:
      - none
  - name: Rh
    unit: umol/m2/s
    description: Heterotrophic respiration (soil/litter decomposition).
    validation_rank: 4
    emitted_in: mrh.out; converted to umol/m2/s by parse_lpjguess_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Comparable against soil-respiration chambers or partitioned Rh, not against net tower flux directly.
      detrending_options:
      - none
  - name: Reco
    unit: umol/m2/s
    description: Ecosystem respiration (Ra + Rh).
    validation_rank: 5
    emitted_in: mra.out + mrh.out; converted to umol/m2/s by parse_lpjguess_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Tower Reco is a nighttime-extrapolated/partitioned quantity carrying partitioning uncertainty.
      detrending_options:
      - none
  - name: NEE
    unit: umol/m2/s
    description: Net Ecosystem Exchange (Reco - GPP); positive = net source, negative = net sink.
    validation_rank: 6
    emitted_in: mnee.out (= mrh - mnpp; fire C excluded); converted to umol/m2/s by parse_lpjguess_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - NEE is the most directly observed eddy-covariance flux; sign convention (positive=source) must
          match obs.
        - NEE is a small residual of large GPP and Reco; magnitude errors are amplified.
      detrending_options:
      - none
  - name: NPP
    unit: umol/m2/s
    description: Net Primary Production (terrestrial vegetation carbon production flux; GPP - Ra).
    validation_rank: 2
    emitted_in: mnpp.out (= mgpp - mra); converted to umol/m2/s by parse_lpjguess_engine_output.py
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - NPP not directly observed by towers; comparable against biometric/inventory NPP at coarser cadence.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Regional/inventory NPP carries non-model (management/disturbance) signal; compare trends, not
          inter-annual r.
      detrending_options:
      - none
      - decadal_mean
      - linear_residual
  secondary: []
known_issues:
- id: dt_lpjguess_001
  symptom: SURROGATE ONLY (tools/run_lpjguess.py LUE stand-in, NOT the LPJ-GUESS engine; the real engine
    wants K and kg m-2 s-1, see dt_lpjguess_023) -- GPP and respiration unrealistically high (~300 degC
    regime). Temperature-dependent scalars saturated. Parabolic temperature response returns zero but
    Q10 resp
  diagnosis: Air temperature forcing supplied in Kelvin instead of degrees Celsius. CMFD and MSWX provide
    temperature in K, but LPJ-GUESS expects deg C.
  remedy: Subtract 273.15 from all temperature values before passing to LPJ-GUESS. Validate that TA values
    fall within -50 to +55 deg C range.
- id: dt_lpjguess_002
  symptom: SURROGATE ONLY (tools/run_lpjguess.py LUE stand-in, NOT the LPJ-GUESS engine; the real engine
    wants K and kg m-2 s-1, see dt_lpjguess_023) -- Precipitation effectively zero. Vegetation dies from
    permanent drought. Water balance shows no input despite using CMFD data.
  diagnosis: Precipitation left in kg/m2/s (CMFD native unit) instead of converted to mm/day. A typical
    value of 1.15e-5 kg/m2/s (1 mm/day) is interpreted as near-zero mm/day.
  remedy: Multiply CMFD precipitation by 86400 to convert from kg/m2/s to mm/day. For MSWX (mm/3hr), sum
    8 timesteps per day. Validate daily P is in the 0-300 mm/day range.
- id: dt_lpjguess_003
  symptom: SURROGATE ONLY (tools/run_lpjguess.py LUE stand-in, NOT the LPJ-GUESS engine; the real engine
    wants K and kg m-2 s-1, see dt_lpjguess_023) -- VPD scalar (f_VPD) always near 1.0 — no moisture stress
    on GPP. Transpiration unrealistically high for arid sites.
  diagnosis: VPD supplied in kPa instead of hPa. LPJ-GUESS VPD parameters (VPD_0=10 hPa, VPD_1=35 hPa)
    expect hPa. A value of 1.5 kPa (= 15 hPa) appears as 1.5 hPa, far below the VPD_0 threshold.
  remedy: Multiply VPD by 10 to convert from kPa to hPa. FLUXNET provides hPa natively. If source data
    is in Pa, divide by 100. Validate that typical daytime VPD is 5-40 hPa.
- id: dt_lpjguess_004
  symptom: 'SURROGATE-era entry (for the REAL engine parse_lpjguess_engine_output.py converts kgC m-2
    month-1 to gC m-2 d-1 and umol m-2 s-1 with 1e6/12.011/86400 = 0.9636, not 0.9649) -- GPP output in
    gC/m2/day does not match eddy-covariance tower observations reported in umol CO2/m2/s. Values appear
    off by a '
  diagnosis: Failure to apply the gC-to-umol flux unit conversion. LPJ-GUESS internal GPP is in gC/m2/day
    but FLUXNET observations are in umol CO2/m2/s. The conversion factor is 1e6 / 12.011 / 86400.
  remedy: Convert GPP from gC/m2/day to umol/m2/s by multiplying by 1e6 / (12.011 * 86400) = 0.9649. Alternatively,
    convert observations to gC/m2/day by dividing by 0.9649.
- id: dt_lpjguess_005
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Model refuses to
    start or silently produces wrong PFT configuration. Instruction file (.ins) parameters appear to be
    ignored.
  diagnosis: LPJ-GUESS instruction file (.ins) uses a strict keyword-value format. Missing quotes around
    string values, wrong section nesting (param block not closed with a closing brace), or trailing whitespace
    after values causes silent parse failure.
  remedy: 'Validate the .ins file structure: ensure all string values are double-quoted, every opening
    brace has a matching closing brace, and PFT definitions follow the ''pft "PFT_NAME" { ... }'' pattern.
    Use a reference .ins from the LPJ-GUESS distribution as template.'
- id: dt_lpjguess_006
  symptom: REAL ENGINE, general (demo/cru input) -- with -input cf the gridlist holds array INDICES x
    y, not lon lat (dt_lpjguess_024) -- Model reports zero gridcells or crashes immediately. Gridlist
    file appears to exist but no sites are processed.
  diagnosis: 'Gridlist file has wrong format. LPJ-GUESS expects a whitespace-delimited text file with
    columns: longitude latitude [description]. Common errors include comma-separated values, header rows,
    lat/lon in reversed order, or coordinates outside -180 to 180 / -90 to 90 range.'
  remedy: Reformat gridlist as space-separated longitude latitude per line with no header. Verify longitude
    precedes latitude. Remove any header lines or trailing blank lines.
- id: dt_lpjguess_007
  symptom: REAL ENGINE -- the CSV sentence in the remedy is for the SURROGATE only; for the engine build
    CF NetCDF with build_lpjguess_cf_forcing.py (dt_lpjguess_023, dt_lpjguess_024) -- Forcing data read
    error. Model cannot find or parse daily meteorological driver files. Errors referencing 'getclimate'
    or in
  diagnosis: 'Driver data NetCDF or binary files have dimension ordering or variable naming that does
    not match the LPJ-GUESS CF input specification. Common issues: time dimension not named ''time'',
    spatial dimensions not matching gridlist, or missing calendar attribute.'
  remedy: Ensure driver NetCDF files follow CF conventions with dimensions (time, lat, lon) or (time,
    land). Variable names must match the instruction file input specification. Use convert_forcing_to_lpjguess.py
    to produce correctly formatted forcing CSV with SW_IN, TA, VPD, P columns.
- id: dt_lpjguess_008
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Tropical simulation
    dominated by boreal/temperate PFTs. Vegetation composition unrealistic for the climate zone.
  diagnosis: All PFTs enabled in the instruction file without bioclimatic filtering. LPJ-GUESS PFTs have
    bioclimatic limits (T_min, T_max, GDD requirements) but if the instruction file includes boreal PFTs
    for a tropical gridcell, competition dynamics can produce unrealistic assemblages during spinup.
  remedy: Enable only climatically appropriate PFTs for the study region. For tropical sites, disable
    boreal needle-leaved PFTs (BNE, BINE, BNS). For boreal sites, disable tropical broadleaved PFTs (TrBE,
    TrIBE, TrBR). Consult the bioclimatic limit table in the LPJ-GUESS documentation.
- id: dt_lpjguess_009
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Model runs in population
    mode but user expects individual-based (cohort) dynamics. Vegetation structure lacks age-class diversity.
    No gap dynamics or light competition.
  diagnosis: Instruction file sets 'ifbgestab 0' and 'ifsme 0' or uses 'vegmode "population"' instead
    of 'vegmode "cohort"'. Population mode uses area-averaged representation without individual-level
    competition.
  remedy: Set vegmode to 'cohort' in the instruction file and enable stochastic establishment (ifbgestab
    1) and stochastic mortality (ifsme 1) for individual-based dynamics with gap model behavior. Use npatch
    >= 25 for statistical robustness.
- id: dt_lpjguess_010
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Simulation completes
    but vegetation carbon pools are still drifting. Soil carbon has not reached equilibrium. NEE has a
    persistent non-zero trend during the 'stable' reference period.
  diagnosis: Spinup length (nyear_spinup) too short for soil carbon pools to equilibrate. Slow soil organic
    matter pools (century-scale turnover) require 500-1000+ years of spinup, especially in boreal/permafrost
    systems.
  remedy: Increase nyear_spinup to at least 500 years for temperate systems and 1000+ years for boreal/peatland
    systems. Monitor the trend in total ecosystem carbon (vegetation + soil + litter) over the last 100
    spinup years — drift should be less than 1 gC/m2/yr.
- id: dt_lpjguess_011
  symptom: SURROGATE ONLY (tools/run_lpjguess.py LUE stand-in, NOT the LPJ-GUESS engine, which has no
    such parameter) -- GPP systematically 2-3x higher than FLUXNET observations across all sites. Temperature
    and VPD responses appear correct but absolute magnitude is wrong.
  diagnosis: LUE_max (maximum light use efficiency) parameter set too high. Default range is 1.0-3.0 gC/MJ
    PAR. A value at the upper end (3.0) overestimates GPP for most ecosystems. Temperate forests typically
    require 1.2-2.0 gC/MJ.
  remedy: 'Calibrate LUE_max against site-level FLUXNET GPP observations. Typical calibrated values: ENF
    1.0-1.5, DBF 1.2-2.0, grassland 0.8-1.5 gC/MJ PAR. Use differential evolution optimization against
    the validation period.'
- id: dt_lpjguess_012
  symptom: SURROGATE ONLY (tools/run_lpjguess.py LUE stand-in, NOT the LPJ-GUESS engine, which has no
    such parameter) -- GPP peaks at wrong time of year. Summer GPP too low relative to spring/autumn.
    Temperature response curve appears shifted.
  diagnosis: T_opt (optimal photosynthesis temperature) parameter mismatched for the PFT or climate zone.
    Default T_opt=20 degC is appropriate for temperate broadleaf but too low for tropical (T_opt=28-30)
    and too high for boreal (T_opt=15-18) ecosystems.
  remedy: 'Adjust T_opt to match the PFT''s thermal niche: boreal conifers 10-18 degC, temperate deciduous
    18-25 degC, tropical evergreen 25-32 degC. Also verify T_min and T_max bracket the observed growing-season
    temperature range.'
- id: dt_lpjguess_013
  symptom: SURROGATE ONLY (tools/run_lpjguess.py LUE stand-in, NOT the LPJ-GUESS engine, which has no
    such parameter) -- Heterotrophic respiration (Rh) far too high in winter or too low in summer. Soil
    respiration seasonal cycle has wrong amplitude.
  diagnosis: Rh_Q10 parameter (Q10 for decomposition) inappropriate for the soil environment. Default
    Rh_Q10=2.0 may be too high for warm soils (amplifying summer Rh) or too low for cold soils (underestimating
    temperature sensitivity).
  remedy: 'Adjust Rh_Q10 based on soil temperature regime: use 1.5-2.0 for tropical soils, 2.0-2.5 for
    temperate, and 2.5-3.5 for boreal/permafrost soils. Also check Rh_base (default 2.0 umol/m2/s) and
    Rh_Tref (default 15 degC) for consistency.'
- id: dt_lpjguess_014
  symptom: SURROGATE ONLY (tools/run_lpjguess.py LUE stand-in; the REAL engine writes mnee = mrh - mnpp
    itself, dt_lpjguess_034) -- NEE does not equal Reco - GPP. Carbon budget fails to close. Small but
    persistent residual accumulates over multi-year simulations.
  diagnosis: Numerical precision loss in the daily carbon balance computation. When GPP and Reco are both
    large (~10-20 umol/m2/s) but NEE is small (~0.5 umol/m2/s), floating-point subtraction loses significant
    digits. Also check that Ra + Rh = Reco is enforced consistently.
  remedy: 'Compute NEE directly from (Ra + Rh) - GPP in a single expression rather than from separately
    stored Reco. Verify the sign convention: NEE = Reco - GPP (positive = source, negative = sink). Tolerance
    for carbon balance closure should be < 0.01 gC/m2/day.'
- id: dt_lpjguess_015
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Vegetation dynamics
    produce unrealistic monoculture after long simulation. A single PFT dominates 100% of patches despite
    diverse initial conditions.
  diagnosis: Competitive exclusion in cohort mode without adequate disturbance. If stochastic disturbance
    (fire, windthrow) is disabled or its return interval is too long, the most competitive PFT outcompetes
    all others over centuries. The disturbance regime parameter (distinterval) controls gap creation frequen
  remedy: Enable stochastic disturbance by setting 'ifdisturb 1' in the instruction file. Set distinterval
    to ecologically appropriate values (50-200 years for temperate forests, 80-400 years for boreal).
    Increase npatch to 50-100 for better sampling of stochastic dynamics.
- id: dt_lpjguess_016
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Spinup never converges.
    Soil organic carbon continues increasing after 1000 model years. Annual NEE oscillates without stabilizing.
  diagnosis: Nitrogen deposition set to modern (elevated) values during spinup instead of pre-industrial
    levels. Modern N deposition (1-10 kgN/ha/yr) continuously fertilizes the ecosystem, preventing C pool
    equilibrium. Pre-industrial N deposition was 0.1-0.5 kgN/ha/yr.
  remedy: Use pre-industrial N deposition rates (0.1-0.5 kgN/ha/yr) for the spinup phase. Switch to transient
    N deposition only for the historical simulation period. Monitor total ecosystem carbon trend — convergence
    criterion is drift < 0.5 gC/m2/yr over the last 100 spinup years.
- id: dt_lpjguess_017
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Strong NEE source
    (positive) for the first 30-50 years of the transient run after spinup completes. Ecosystem appears
    to lose carbon despite stable climate.
  diagnosis: CO2 concentration mismatch between spinup (pre-industrial ~280 ppm) and transient run start
    (modern ~370 ppm). The abrupt CO2 jump stimulates GPP, increasing N demand beyond supply, which causes
    N limitation-induced carbon pool adjustment and temporary net carbon loss.
  remedy: Run a transition period with gradually increasing CO2 from pre-industrial to the transient start
    year, or use the transient CO2 trajectory from 1850 onward. Discard the first 50 years of transient
    output as equilibration if an abrupt CO2 jump is unavoidable.
- id: dt_lpjguess_018
  symptom: REAL ENGINE, general LPJ-GUESS knowledge (not reproduced on this server) -- Output files contain
    only annual values but user needs monthly or daily resolution. Monthly carbon flux seasonality cannot
    be analyzed.
  diagnosis: Instruction file output section specifies only annual output tables (e.g., 'file_cmass',
    'file_anpp') without enabling monthly output files (e.g., 'file_mnpp', 'file_mgpp'). LPJ-GUESS distinguishes
    annual and monthly outputs by filename prefix convention.
  remedy: 'Add monthly output file declarations in the instruction file output section: ''file_mnpp'',
    ''file_mgpp'', ''file_mra'', ''file_mrh'', ''file_mnee'', ''file_mlai''. For daily output (if supported
    by the version), add the corresponding daily file declarations. Verify output directory has write
    permissions.'
- id: dt_lpjguess_019
  symptom: guess -input cf exits with signal 11 (rc 139 / -11) after about 1 s; guess.log is empty (2
    bytes) and no .out file is written. Happens as soon as the .ins sets searchradius_soil.
  diagnosis: 'Engine bug in 4.1.1: CFInput::CFInput() (modules/cfinput.cpp line 346) builds a throw-away
    local `SoilInput soilinput;` whose constructor registers searchradius_soil against that temporary
    object. Setting the parameter in the .ins writes to freed stack memory.'
  remedy: 'Never set searchradius_soil with -input cf (run_lpjguess_engine.py refuses it, exit 2). Give
    the soil map an exact line for the site instead: the cf mode copies soils_lpj.dat and appends ''<lon>
    <lat> <code>'' using the code of the 0.5-degree cell holding the site. Do not patch the engine build.'
  severity: fatal
- id: dt_lpjguess_020
  symptom: guess exits 99 within 0.1 s; guess.log ends 'Coordinate at 13.565200, 50.962400 could not be
    found in the soil map, and no search radius specified.'
  diagnosis: SoilInput::find_closest_point looks up the EXACT grid-cell lon/lat (taken from the NetCDF
    lat/lon variables) in the soil-code file. The shipped soils_lpj.dat only has 0.5-degree cell centres
    (x.25/x.75), so a tower coordinate never matches, and the search radius cannot be used (see dt_lpjguess_019).
  remedy: 'Use run_lpjguess_engine.py cf: it writes run/soils_site.dat = shipped map + one line for the
    site with the code of the cell (floor(2x)/2+0.25) that holds it, and reports the cell and code in
    its JSON (''soil'': {...}).'
  severity: fatal
- id: dt_lpjguess_021
  symptom: guess -input cf stops with 'Not enough data to build spinup, at least 30 years needed' (exit
    99).
  diagnosis: CFInput::load_spinup_data builds the spin-up climate from the FIRST 30 full years of the
    NetCDF files (CFInput::NYEAR_SPINUP_DATA = 30). A FLUXNET tower's own met record (FULLSET or ERAI,
    1989-2014 = 26 yr) is too short.
  remedy: Build >= 30 years of daily forcing with build_lpjguess_cf_forcing.py (it refuses shorter periods,
    exit 2). NASA POWER 1984-2014 (31 yr) works globally; CMFD 1979+ in China; MSWX 1980+ globally (MSWX
    1979 has a faulty time axis).
  severity: fatal
- id: dt_lpjguess_022
  symptom: 'guess exits 99 with ''GlobalCO2File::load_file: could not open CO2 file'', ''... line N -
    bad year specified'', or ''Tried to get CO2 value after last year in file''.'
  diagnosis: The 4.1.1 release ships no CO2 file (global_cf.ins points at c:/co2/co2_1901_2018.txt). The
    reader needs one '<year> <ppm>' line per consecutive year and must reach the last forcing year; years
    before the first line get the first value.
  remedy: 'Build it from real records with build_lpjguess_co2_file.py (Law Dome spline before 1959 + NOAA
    Mauna Loa annual means). Stored copy: models/LPJ_GUESS/inputs/co2/co2_1901_2014.txt (296.2 ppm in
    1901, 398.81 in 2014). Extend --end_year when forcing goes past 2014.'
  severity: fatal
- id: dt_lpjguess_023
