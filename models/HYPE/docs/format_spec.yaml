# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: HYPE
  language: fortran
  implementation:
    id: hype-5350
    version: 5.35.0
    provenance: Fortran 90; SMHI HYPE 5.35.0 source (PROGRAM HYSS in main.f90, MODELMODULE.model in model_hype.f90).
  scientific_reference_version: HYPE 5.35.0 (SMHI HYdrological Predictions for the Environment; conceptual
    semi-distributed water + N/P/OC/sediment model). SMHI versions the line continuously (5-10 releases/year);
    this dag pins the 5.35.0 numerics.
inputs:
  forcing:
  - name: Pobs (precipitation)
    unit: mm/time step
    category: forcing
    source_kind: forcing
    model_input_format: Pobs.txt — TAB-separated, header row of subbasin/forcing IDs, daily rows keyed
      by date
    notes: Mandatory every timestep; no missing/negative values; must cover the full bdate-edate range
      (no interpolation/fill). Header must be line 1 (no !! comment rows).
  - name: Tobs (air temperature)
    unit: degree Celsius
    category: forcing
    source_kind: forcing
    model_input_format: Tobs.txt — TAB-separated, per forcing/subbasin ID, daily
    notes: Mandatory every timestep; assumed valid at the subbasin's mean elevation unless lapse-rate
      adjusted.
  - name: TMINobs / TMAXobs (daily min/max temperature)
    unit: degree Celsius
    category: forcing
    source_kind: forcing
    model_input_format: TMINobs.txt / TMAXobs.txt
    notes: Required by radiation-based PET models (3-5).
  - name: SWobs (shortwave radiation)
    unit: MJ/m^2/day
    category: forcing
    source_kind: forcing
    model_input_format: SWobs.txt
    notes: Required by PET models 3-5 (Hargreaves-Samani, Priestley-Taylor, Penman-Monteith).
  - name: RHobs (relative humidity)
    unit: fraction
    category: forcing
    source_kind: forcing
    model_input_format: RHobs.txt
    notes: Required by PET model 5 (FAO Penman-Monteith).
  - name: Uobs (wind speed)
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: Uobs.txt
    notes: Required by PET model 5 (FAO Penman-Monteith).
  parameters:
  - name: lp (potential-evap reduction limit)
    unit: fraction
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt general parameter (single value)
    notes: Default 0.8; limits PET draw as soil moisture declines toward field capacity.
  - name: cevp (PET coefficient)
    unit: mm/degC/day
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt land-use-dependent (one value per land-use ID)
  - name: cevpam / cevpph (PET seasonal amplitude / phase)
    unit: '- / days'
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt general parameters
    notes: Impose a seasonal cycle on potential evapotranspiration.
  - name: ttmp (snow threshold temperature)
    unit: degree Celsius
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt land-use-dependent
  - name: cmlt (degree-day snowmelt factor)
    unit: mm/degC/day
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt land-use-dependent
  - name: wcwp / wcfc / wcep (wilting point / field capacity / effective porosity)
    unit: fraction of soil
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt soil-type-dependent (optionally per layer wc*1-3)
    notes: Must satisfy wcwp < wcfc and pore-volume sum (wcwp+wcfc+wcep) < 1; define soil-water retention
      and runoff thresholds.
  - name: rrcs1 / rrcs2 / rrcs3 (upper/lower/deep recession coefficients)
    unit: 1/day
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt (rrcs1/rrcs2 soil-type-dependent; rrcs3 general)
  - name: srrcs (surface-runoff recession coefficient)
    unit: 1/day
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt land-use-dependent
  - name: rivvel (river velocity) / damp (river attenuation)
    unit: m/s / -
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt general parameters
    notes: Set channel translation time (transtime = rivlen/(rivvel*86400)) and attenuation.
  - name: Lake rating / depth parameters (gratk, gratefk, gldepi, gldepol)
    unit: mixed
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt general lake parameters; per-lake overrides in LakeData.txt (rate, exp,
      w0ref, regvol)
    notes: General rating-curve fallback; per-lake/dam rate-exp-w0ref-regvol come from LakeData.txt/DamData.txt
      dataset lookup.
  - name: Nutrient pool / transformation parameters (fastn0, humusn0, denitrlu, denitwr, denitwl, minerfn,
      sedon, sedpp, soilcoh, soilerod)
    unit: mixed (kg/km2, kg/m2/day, 1/day)
    category: parameter
    source_kind: calibrated
    model_input_format: par.txt (genpar/landpar/soilpar grouping) plus CropData.txt management
    notes: Active only when N/P substances are enabled in info.txt.
  - name: GeoData subbasin physiography (AREA, RIVLEN, latitude, elevation, slope, lake_depth, SLC fractions)
    unit: m^2, m, degrees, m, %, m, fraction
    category: parameter
    source_kind: dataset_lookup
    model_input_format: GeoData.txt — TAB-separated, time-invariant per subbasin
    notes: AREA in m^2 (discharge scales linearly with area); SLC fractions per subbasin must sum to 1.0;
      slope_mean mandatory for nutrient modelling.
  - name: GeoClass SLC definitions (land use, soil, crop, vegtype, special code, tiledepth, streamdepth,
      numlayers, soildepth 1-3)
    unit: '-'
    category: parameter
    source_kind: dataset_lookup
    model_input_format: GeoClass.txt / ClassData.txt
    notes: numlayers 1-3 with exactly that many soildepth columns; special code marks lake/water classes.
  initial_conditions:
  - name: Initial soil water
    unit: mm
    category: initial_condition
    source_kind: default
    model_input_format: Computed at start as wp+fc (optionally to saturation wp+fc+ep) per layer/class,
      or restored from state_save file
  - name: Initial lake water stage
    unit: m
    category: initial_condition
    source_kind: default
    model_input_format: Outlet-lake stage initialized at threshold; ilake at gldepi/illdepth, or restored
      from state_save
  - name: Initial nutrient / organic pools (fast and humus N/P, organic C)
    unit: kg/km2
    category: initial_condition
    source_kind: default
    model_input_format: Initialized from fastn0/humusn0/fastp0/humusp0 parameters; require multi-year
      warmup (3-5 yr) to stabilize
  - name: Model state restore
    unit: '-'
    category: initial_condition
    source_kind: user_provided
    model_input_format: state_save / reset_state_save files; data-assimilation ensemble state (ensastates.bin/ensfstates.bin/ensxstates.bin)
  boundary_conditions:
  - name: PET model selection (petmodel 0-5)
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: info.txt modeloption petmodel
    notes: 0 temperature-index default; 1-2 temperature-only (Jensen-Haise/McGuiness, Hargreaves); 3 Hargreaves-Samani;
      4 Priestley-Taylor; 5 FAO Penman-Monteith. Models 3-5 require additional radiation / humidity /
      wind forcing.
  - name: Snowmelt model selection (snowmeltmodel)
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: info.txt modeloption snowmeltmodel
    notes: Degree-day vs degree-day-with-radiation index.
  - name: Substance activation (substance N P ...)
    unit: '-'
    category: boundary_condition
    source_kind: user_provided
    model_input_format: info.txt 'substance' directive enabling N/P/OC/SS/T1/T2 transport
  - name: Simulation period and warmup (bdate, cdate, edate)
    unit: date
    category: boundary_condition
    source_kind: user_provided
    model_input_format: info.txt; warmup spans bdate..cdate before criteria/output start
  - name: MAINDOWN routing topology
    unit: '-'
    category: boundary_condition
    source_kind: dataset_lookup
    model_input_format: GeoData.txt MAINDOWN column; subbasins ordered downstream, outlet MAINDOWN=0
    notes: Must be acyclic with a single outlet; cycles cause an infinite routing loop.
  - name: Upstream subbasin inflow
    unit: m^3/s
    category: boundary_condition
    source_kind: derived
    model_input_format: Internal — each subbasin receives upstream main-river flow in downstream row order
  - name: Atmospheric deposition and external sources
    unit: mixed
    category: boundary_condition
    source_kind: dataset_lookup
    model_input_format: AtmdepData.txt, PointSourceData.txt, NonPointSourceData.txt, AquiferData.txt
    notes: Wet/dry N/P deposition and anthropogenic loads for water-quality simulation.
  - name: Lake/dam regulation configuration
    unit: mixed
    category: boundary_condition
    source_kind: dataset_lookup
    model_input_format: LakeData.txt / DamData.txt — rating curves, regvol, production flows, minflow,
      seasonal inflows
outputs:
  primary:
  - name: cout
    unit: m^3/s
    description: Simulated outflow (discharge) from the outlet lake / subbasin, positive flow only.
    validation_rank: 1
    emitted_in: timeCOUT.txt / subbasin output files
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Gauged-subbasin discharge; compare at the gauge's SUBID outlet over the matching period after
          warmup.
        - Lumped (1-subbasin) setups of large basins lack subbasin-to-subbasin routing attenuation and
          over-predict peaks.
      detrending_options:
      - none
  - name: snow
    unit: mm
    description: Snow water equivalent, subbasin land-area average.
    validation_rank: 3
    emitted_in: timeSNOW.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        determining_metric: nse
        caveats:
        - SWE is an areal subbasin average; point snow-course/SNOTEL comparison is approximate.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Use mapSNOW periodic averages against gridded SWE products at subbasin aggregation.
      detrending_options:
      - none
  - name: evap
    unit: mm/day
    description: Actual evapotranspiration from subbasin soil water and land surface.
    validation_rank: 2
    emitted_in: timeEVAP.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Conceptual ET (no surface energy closure); flux-tower comparison is indicative, not energy-budget-closed.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Compare subbasin-aggregated ET against gridded ET products (e.g. monthly means).
      detrending_options:
      - none
  - name: soim
    unit: mm
    description: Computed soil moisture (root zone and full profile).
    validation_rank: 4
    emitted_in: timeSOIM.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Conceptual mm storage; compare anomaly/pattern rather than absolute volumetric content.
      detrending_options:
      - none
      - linear_residual
  - name: gwat
    unit: m
    description: Groundwater table level (negative downward from surface).
    validation_rank: 5
    emitted_in: timeGWAT.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Relative/conceptual water-table depth; compare temporal dynamics, not absolute datum.
      detrending_options:
      - none
  - name: wcom
    unit: m
    description: Water level of the outlet lake at end of timestep, in the user reference system (via
      w0ref).
    validation_rank: 6
    emitted_in: timeWCOM.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Regulated-lake constant-area-with-depth assumption can bias the simulated stage range (mitigated
          via wamp).
      detrending_options:
      - none
  - name: c1TN
    unit: ug/L
    description: Modelled total nitrogen concentration in surface-water main outflow.
    validation_rank: 7
    emitted_in: timeC1TN.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Requires N substances enabled and multi-year nutrient warmup; lumped 1-subbasin setups give
          unrealistic dissolved concentrations.
        - Concentration (ug/L), not areal load; convert before comparing to load-based observations (kg/ha/yr).
      detrending_options:
      - none
  - name: c1TP
    unit: ug/L
    description: Modelled total phosphorus concentration in surface-water main outflow.
    validation_rank: 8
    emitted_in: timeC1TP.txt
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Requires P substances enabled and nutrient warmup; concentration not areal load.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_b01
  symptom: 'gfortran linker error: undefined reference to _NETCDF symbols'
  diagnosis: 'NetCDF library not installed but build attempted with libs=netcdff flag; HYPE can optionally
    compile with NetCDF output support, but the default HydroCraft setup uses text-based output (timeCOUT.txt,
    etc.). The build flag libs=netcdff triggers NetCDF linking unnecessarily.

    ; [''makefile'', ''build.sh'']'
  remedy: 'Build without NetCDF: make comp=gfortran (no libs flag needed); ; [''cd model/hype/hype_5_35_0_src/'',
    ''make comp=gfortran'']; Never add libs=netcdff unless NetCDF output is explicitly required'
  severity: fatal
- id: dt_b02
  symptom: Type mismatch in argument at (1) during compilation
  diagnosis: 'gfortran version too old (<5.0) or compilation flags too strict (-std=f2018); HYPE 5.35.0
    Fortran 90 code uses some implicit type conversions that strict standards reject. gfortran >= 5.0
    with the default -std=gnu flag handles these correctly.

    ; [''gfortran'', ''makefile'']'
  remedy: 'Use gfortran >= 5.0 with -std=gnu flag (default in makefile); ; [''gfortran --version  # must
    be >= 5.0'']; Check gfortran version before build'
  severity: fatal
- id: dt_r01
  symptom: HYPE fails to open info.txt — reports 'Cannot open file'
  diagnosis: 'Fortran string concatenation: trim(dir)//filename. If dir=''mydir'' (no slash), result is
    ''mydirinfo.txt'' instead of ''mydir/info.txt''.

    ; HYPE''s Fortran code does not check or append a trailing separator to the directory argument. This
    is a fundamental Fortran string handling pattern that affects all p'
  remedy: 'Always pass directory path with trailing slash: hype ./ not hype .; run_hype; ["Ensure argument
    ends with ''/''"]; run_hype.py auto-appends slash. Never call binary directly without it.'
  severity: fatal
- id: dt_r02
  symptom: HYPE reports too few values in parameter file for a parameter
  diagnosis: par.txt has fewer values than max land-use or soil type ID in GeoClass.txt; If GeoClass.txt
    has land-use IDs 1, 2, 3, then each land-use-dependent parameter in par.txt MUST have exactly 3 values.
    The count is based on the highest ID, not the number of unique IDs — so if IDs are 1, 3, 5, you need
    5 v
  remedy: 'Count max landuse/soil IDs in GeoClass.txt, provide exactly that many values; setup_parameters;
    ["grep -v ''^!!'' GeoClass.txt | awk ''{print $2}'' | sort -n | tail -1  # max landuse", "grep -v
    ''^!!'' GeoClass.txt | awk ''{print $3}'' | sort -n | tail -1  # max soil"]; setup_parameters.py auto-counts
    from '
  severity: fatal
- id: dt_r03
  symptom: HYPE error about soil layers in GeoClass.txt
  diagnosis: 'numlayers column is 0, negative, or >3; or soildepth columns don''t match; Column 11 (numlayers)
    must be 1, 2, or 3. After column 11, exactly that many soildepth values must follow. Extra or missing
    columns shift all subsequent parsing silently.

    ; [''GeoClass.txt'']'
  remedy: Ensure numlayers is 1-3 and exactly that many soildepth values follow; generate_geoclass; ['Verify
    column count = 11 + numlayers for each SLC row']; generate_geoclass.py validates column count automatically
  severity: fatal
- id: dt_r04
  symptom: HYPE fatal error about date mismatch when reading forcing
  diagnosis: 'Forcing file dates do not cover entire bdate-edate range in info.txt; HYPE reads forcing
    sequentially by date. If Pobs.txt starts later than bdate or ends before edate, HYPE stops with a
    date mismatch error. There is no interpolation or fill for missing dates.

    ; [''Pobs.txt'', ''Tobs.txt'', ''info.txt'']'
  remedy: 'Ensure Pobs.txt/Tobs.txt cover entire bdate-edate range with no gaps; convert_forcing_to_hype;
    [''head -2 forcingdir/Pobs.txt  # check first date'', ''tail -1 forcingdir/Pobs.txt  # check last
    date'', ''Compare with bdate/edate in info.txt'']; convert_forcing_to_hype.py aligns dates automatically'
  severity: fatal
- id: dt_r05
  symptom: HYPE crashes or produces wrong routing due to MAINDOWN cycle
  diagnosis: 'Subbasin MAINDOWN references create a circular loop; If subbasin 1→2→3→1, HYPE enters infinite
    routing loop. Outlet subbasin must have MAINDOWN=0 to terminate the chain.

    ; [''GeoData.txt'']'
  remedy: Run validate_topology.py to find and break cycles; validate_topology; ['python validate_topology.py
    --geodata modelfiles/GeoData.txt']; Always validate topology before running HYPE
  severity: fatal
- id: dt_r06
  symptom: HYPE exits with STOP 1 but no error in logdir
  diagnosis: 'Log file created in infodir (working directory), not logdir; Early-stage errors (before
    logdir is parsed from info.txt) write to the current working directory, not the configured logdir.

    ; [''hyss_*.log'']'
  remedy: Look for hyss_*.log in the info directory (HYPE's first argument); ; ['ls *.log in the directory
    passed to hype binary']; run_hype.py checks both locations for log files
  severity: fatal
- id: dt_u01
  symptom: Extreme runoff values or unrealistic flooding. Discharge 8x too high.
  diagnosis: Precipitation averaged instead of summed when converting 3-hourly to daily; CMFD/MSWX provide
    3-hourly precipitation (mm per 3hr step). For daily total, you must SUM all 8 timesteps. If you AVERAGE
    instead, daily precipitation is 8x too low. Conversely, if you multiply the mean by 24 instead of
    8, p
  remedy: 'SUM 8 timesteps per day for precipitation. Verify: annual P ~ 400-1600 mm for most basins.;
    convert_forcing_to_hype; [''Check annual precipitation total against climatology'']; convert_forcing_to_hype.py
    uses sum, not mean, for precipitation'
  severity: silent
- id: dt_u02
  symptom: Temperature offset causes snow everywhere year-round, or no snow at all
  diagnosis: 'CMFD temperature in Kelvin not converted to Celsius; CMFD stores temperature as Kelvin (e.g.,
    293.15 K = 20°C). HYPE expects Celsius. Without subtracting 273.15, all temperatures appear ~273°C
    too high, causing PET to explode and snow to never form.

    ; [''Tobs.txt'', ''convert_forcing_to_hype.py'']'
  remedy: 'Subtract 273.15 from CMFD temperature. MSWX is already in °C.; convert_forcing_to_hype; [''head
    -3 forcingdir/Tobs.txt  # should show reasonable °C values (-30 to 45)'']; convert_forcing_to_hype.py
    auto-detects K vs °C from value range'
  severity: silent
- id: dt_u03
  symptom: All precipitation in Pobs.txt is zero despite CMFD files containing data
  diagnosis: 'CMFD stores precipitation as kg/m²/s (equivalent to mm/s). Values are ~1e-5 magnitude. Without
    multiplying by 10800 (seconds per 3hr step), the values are so small they round to zero in the daily
    sum.

    ; This was the #1 error found during Bengbu validation. The model ran without any error, but produc'
  remedy: Multiply CMFD precipitation by 10800 to convert kg/m²/s → mm/3hr, then SUM 8 steps for daily.;
    convert_forcing_to_hype; ['python -c "import xarray; ds=xarray.open_dataset(\'prec_file.nc\'); print(ds[\'prec\'].values.mean())"',
    "If mean is ~1e-5, it's kg/m²/s — multiply by 10800", "If mean is ~0.1-2.
  severity: silent
- id: dt_s01
  symptom: Water balance is wrong but model runs successfully with exit code 0
  diagnosis: 'SLC fractions in GeoData.txt do not sum to 1.0 for one or more subbasins; If SLC fractions
    sum to 0.8, then 20% of precipitation is lost silently. HYPE produces NO warning about this. The error
    is proportional to the deviation from 1.0 and affects all water balance components.

    ; [''GeoData.txt'', ''com'
  remedy: 'Validate: for each subbasin row, sum(SLC_1..SLC_N) must equal 1.0 within 0.001; validate_geodata;
    [''python validate_geodata.py --geodata modelfiles/GeoData.txt'']; Always run validate_geodata.py
    before HYPE execution'
  severity: silent
- id: dt_s02
  symptom: Simulated discharge is systematically 1000x too high or too low
  diagnosis: 'AREA in GeoData.txt is in km² instead of m²; HYPE expects AREA in square meters. 150 km²
    = 1.5E8 m². If entered as 150 (meaning km²), HYPE treats it as 150 m² — a tiny plot, not a basin.
    Discharge scales linearly with area, so the error is exactly 1,000,000x.

    ; [''GeoData.txt'', ''generate_geodata.py'']'
  remedy: 'AREA must be in m². Typical subbasin: 1E7 to 1E10 m². If values are 10-10000, they''re probably
    km².; generate_geodata; ["grep -v ''^!!'' GeoData.txt | awk ''{print $3}''  # should see scientific
    notation like 1.5E8"]; generate_geodata.py outputs in m² and validates magnitude'
  severity: silent
- id: dt_s03
  symptom: All simulated discharge is zero despite valid forcing
  diagnosis: 'Soil field capacity (wcfc) >= effective porosity (wcep), so no water can percolate; HYPE''s
    soil routine requires wcwp < wcfc < wcep. If wcfc >= wcep, the soil is always at ''capacity'' and
    no additional water enters, effectively blocking all infiltration. Discharge remains zero.

    ; [''par.txt'']'
  remedy: 'Ensure wcwp < wcfc < wcep for all soil types; setup_parameters; ["grep -E ''wcwp|wcfc|wcep''
    par.txt", ''For each soil type column: wcwp < wcfc < wcep must hold'']; setup_parameters.py validates
    ordering before writing par.txt'
  severity: silent
- id: dt_s04
  symptom: Lake regulation has no effect on downstream discharge
  diagnosis: 'Water SLC class not marked as special=2 in GeoClass.txt; The ''special'' column (column
    8) must be 2 for lake/water SLC classes. Without this flag, water areas are treated as normal land
    with soil processes, not as open water bodies with lake regulation.

    ; [''GeoClass.txt'']'
  remedy: 'Set special=2 for water/lake classes in GeoClass.txt column 8; generate_geoclass; [''Check
    column 8 for water class rows: must be 2, not 0'']; generate_geoclass.py auto-sets special=2 for water
    land-use classes'
  severity: silent
- id: dt_s05
  symptom: Discharge at outlet shows no contribution from upstream subbasins
  diagnosis: 'ForcKey.txt SUBID column does not match GeoData.txt SUBID values; ForcKey.txt maps each
    SUBID to a forcing station. If SUBIDs don''t match GeoData.txt, HYPE cannot find forcing for some
    subbasins. Those subbasins run with zero precipitation and contribute no discharge.

    ; [''ForcKey.txt'', ''GeoData.txt'''
  remedy: Verify all SUBIDs in ForcKey.txt exist in GeoData.txt and vice versa; convert_forcing_to_hype;
    ["diff <(awk 'NR>1{print $1}' ForcKey.txt | sort) <(awk 'NR>1{print $1}' GeoData.txt | sort)"]; convert_forcing_to_hype.py
    reads SUBIDs from GeoData.txt directly
  severity: silent
- id: dt_s06
  symptom: Routing produces no delay, hydrograph is unrealistically peaky
  diagnosis: 'RIVLEN in GeoData.txt is 0 or very small for all subbasins; RIVLEN is the main river length
    within a subbasin (meters). With RIVLEN=0, water arrives at the outlet instantaneously. For a 150
    km² subbasin, typical RIVLEN is 5,000-50,000 m.

    ; [''GeoData.txt'']'
  remedy: 'Set RIVLEN to main river length in meters. Estimate: sqrt(AREA_km2) * 1.5 * 1000 for meandering.;
    generate_geodata; ["grep -v ''^!!'' GeoData.txt | awk ''{print $7}''  # RIVLEN column"]; generate_geodata.py
    estimates RIVLEN from subbasin area if not provided'
  severity: silent
- id: dt_s07
  symptom: All precipitation is zero in Pobs.txt but no error from HYPE
  diagnosis: 'Tab separators replaced by spaces during file generation; HYPE''s Fortran parser expects
    TAB-separated columns. If spaces are used instead, the parser may read incorrect column values or
    fail to split columns entirely, resulting in all-zero or all-missing values.

    ; [''Pobs.txt'', ''Tobs.txt'', ''ForcKey.t'
  remedy: 'Use explicit \t when writing forcing files. Verify with: cat -A Pobs.txt | head; convert_forcing_to_hype;
    [''cat -A forcingdir/Pobs.txt | head -3  # should see ^I (tab) between columns'']; convert_forcing_to_hype.py
    uses sep=''\t'' in pandas to_csv'
  severity: silent
- id: dt_s08
  symptom: Zero discharge despite valid precipitation — GeoClass streamdepth=0
  diagnosis: 'GeoClass.txt streamdepth column (col 10) is 0. When streamdepth=0, HYPE''s calculate_soil_runoff
    returns immediately without computing runoff.

    ; This is an undocumented default behavior. The streamdepth parameter controls tile drainage depth.
    When set to 0, HYPE interprets it as ''no soil runoff calcu'
  remedy: 'Set streamdepth > 0 for all non-water SLC classes. Typical range: 0.5-2.0 m.; generate_geoclass;
    ["awk ''NR>1{print $10}'' GeoClass.txt  # column 10 should be >0 for land classes"]; generate_geoclass.py
    defaults streamdepth to 1.0 m for land classes'
  severity: silent
- id: dt_s09
  symptom: Nutrient concentrations are all zero despite substance flag in info.txt
  diagnosis: 'info.txt has ''substance N P'' but par.txt lacks nutrient-specific parameters; When N/P
    simulation is enabled, HYPE requires additional parameters in par.txt (denitr, denitrw, maxprod, etc.).
    Without these, nutrient processes are effectively disabled but the model still runs.

    ; [''par.txt'', ''info.txt'']'
  remedy: When simulating N/P, add all required nutrient parameters to par.txt; setup_parameters; ['Check
    HYPE documentation for substance-specific parameters']; setup_parameters.py adds nutrient params when
    substance flag is detected
  severity: silent
- id: dt_s10
  symptom: Subbasin areas sum to much more or less than total basin area
  diagnosis: 'Overlapping or gapped subbasin polygons from DEM delineation; If subbasin polygons overlap,
    water is double-counted. If gaps exist, water is lost. Both produce wrong total discharge without
    any warning.

    ; [''subbasin shapefile'', ''delineate_subbasins.py'']'
  remedy: 'Check: sum(subbasin areas) should match total basin area within 5%; validate_topology; [''ogr2ogr
    info on subbasin shapefile, sum areas vs basin boundary area'']; delineate_subbasins.py uses non-overlapping
    watershed delineation'
  severity: silent
- id: dt_c01
  symptom: VIC and HYPE discharge differ by factor 2-5x at same outlet location
  diagnosis: 'Different forcing aggregation, drainage areas, or PET methods; VIC uses sub-daily energy
    balance while HYPE uses daily temperature-based PET. Different temporal resolution of forcing changes
    infiltration/runoff partitioning. Also verify both models use exactly the same basin area.

    ; [''VIC output'', '''
  remedy: Verify both models use same basin area and same forcing time period. Compare annual P and ET.;
    compare_vic_hype; ['python compare_vic_hype.py --vic <vic_dir> --hype <hype_dir>']; Always run compare_vic_hype.py
