    beven1992_glue_topmodel:
      short_citation: "Beven & Binley 1992"
      doi: "10.1002/hyp.3360060305"
      note: "Foundational GLUE paper using TOPMODEL Monte Carlo experiments; identified m and ln(T0) as the most influential parameters controlling discharge."
    freer1996_glue_topmodel_ringelbach:
      short_citation: "Freer, Beven & Ambroise 1996"
      doi: "10.1029/95WR03723"
      note: "GLUE applied to TOPMODEL on the Ringelbach catchment; m and ln(T0) control discharge magnitudes/recession, SRmax controls ET and low-flow."
    blazkova2002_topmodel_watertable:
      short_citation: "Blazkova et al. 2002"
      doi: "10.1029/2001WR000912"
      note: "GLUE test of distributed water-table predictions; m strongly controls simulated water-table depth and saturated-area extent, T0 trades off with m."
    xu2011_dem_topmodel_uncertainty:
      short_citation: "Xu et al. 2011"
      doi: "10.1016/j.jhydrol.2010.10.043"
      note: "DEM resolution shifts the ln(a/tanB) distribution mean, propagating to calibrated m, T0, peak flow, baseflow recession, and saturated-area extent."
    franchini1996_topmodel_sensitivity:
      short_citation: "Franchini et al. 1996"
      doi: "10.1016/0022-1694(95)02872-6"
      note: "Local OAT sensitivity analysis ranking m and ln(T0) as dominant controls on streamflow; SRmax/SRinit secondary; ChVel controls hydrograph timing; td secondary."

safety:
  hazards:
    - id: "precip_unit_mmday_to_mhr"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in mm/day instead of m/hr causes ~24,000x discharge over-estimate (no fatal error; silent mass-balance violation in the forcing)."
      severity: "silent"
    - id: "precip_unit_mday_to_mhr"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in m/day instead of m/hr causes ~24x discharge over-estimate."
      severity: "silent"
    - id: "precip_unit_mmhr_to_mhr"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in mm/hr instead of m/hr causes ~1,000x discharge over-estimate."
      severity: "silent"
    - id: "pe_absent_or_zero"
      kind: "weather_file_semantic"
      description: "PE column zero or absent zeroes the ET sink, sending all rainfall to runoff (PBIAS >> 50%)."
      severity: "silent"
    - id: "pe_unit_mmday_to_mhr"
      kind: "weather_file_semantic"
      description: "PE supplied in mm/day instead of m/hr produces excessive ET and a strongly negative water-balance residual."
      severity: "silent"
    - id: "pe_temperature_kelvin_in_hargreaves"
      kind: "weather_file_semantic"
      description: "Temperature input to an external Hargreaves PET pre-processor left in Kelvin (not Celsius) produces unrealistically high PET propagated into pe."
      severity: "silent"
    - id: "nstep_mismatch_segfault"
      kind: "parser_semantic"
      description: "nstep in the inputs.dat header does not match the actual number of rain/pe/qobs data lines; the C reader walks past the buffer and segfaults."
      severity: "fatal"
    - id: "twi_area_fraction_not_normalized"
      kind: "soil_semantic"
      description: "TWI class area fractions in subcat.dat do not sum to ~1.0; the C reader hard-fails calc_time_delay_histogram only on the histogram sum, but a bad TWI fraction sum silently produces water-balance error and degenerate contributing-area (0 or 1)."
      severity: "degraded"
    - id: "twi_classes_not_ordered_high_to_low"
      kind: "soil_semantic"
      description: "TWI classes (lnaotb) must be ordered HIGH to LOW in subcat.dat; the source explicitly does not check ordering and silently produces a wrong saturated-area pattern if reversed."
      severity: "silent"
    - id: "szm_zero_division"
      kind: "numerical_instability"
      description: "szm = 0 produces division by zero in qb = szq*exp(-sbar/szm), yielding NaN/Inf that propagate through subsequent updates."
      severity: "fatal_or_silent"
    - id: "sr0_exceeds_srmax"
      kind: "initial_condition_semantic"
      description: "sr0 > srmax violates the initial-state constraint and corrupts the root-zone deficit accounting from the first step."
      severity: "degraded"
    - id: "q0_zero_init_water_balance"
      kind: "initial_condition_semantic"
      description: "Q0 = 0 makes init_water_balance compute sbar = -szm*log(0/szq) = -inf, which silently propagates as NaN through all subsequent state updates."
      severity: "silent"
    - id: "qobs_unit_m3s_vs_mhr"
      kind: "parser_semantic"
      description: "Observed Q supplied in m^3/s instead of m/hr makes the internal NSE / KGE comparison meaningless because the model writes simulated Q in per-step depth (m/hr at dt=1)."
      severity: "silent"
    - id: "channel_distance_unit_km_to_m"
      kind: "soil_semantic"
      description: "Channel distance dist_from_outlet supplied in km instead of metres distorts the time-delay histogram by 1000x, killing or amplifying routing attenuation."
      severity: "silent"
    - id: "chv_too_high_vs_channel_length"
      kind: "control_semantic"
      description: "Channel velocity chv set unrealistically high relative to dist_from_outlet collapses the routing delay to 0-1 timesteps and removes hydrograph attenuation."
      severity: "silent"
    - id: "stand_alone_zero_no_output_in_standalone_use"
      kind: "control_semantic"
      description: "stand_alone flag set to 0 in topmod.run when intended to run standalone yields a mock 720-step framework path with no input file and no real output."
      severity: "fatal"
    - id: "dt_not_one_index_drift"
      kind: "numerical_instability"
      description: "dt != 1.0 in inputs.dat header causes Update() to advance current_time_step by dt and index rain[]/pe[] at non-unit strides, eventually reading past the buffer (SIGSEGV) and producing wrong fluxes meanwhile."
      severity: "fatal_or_silent"
    - id: "expinf_nonconvergence_exit_minus_nine"
      kind: "numerical_instability"
      description: "When infex=1, expinf's Newton-Raphson hits its 20-iteration cap on non-convergence and calls exit(-9); no graceful return, no warning."
      severity: "fatal"
    - id: "t0_supplied_as_linear_not_log"
      kind: "coefficient_runtime_silent_fallback"
      description: "params.dat field 2 is the natural log of T0, not T0 itself. Supplying linear T0 (e.g., from a soil-property dataset) silently mis-scales szq = exp(t0 + log(dt) - tl) and the entire baseflow magnitude."
      severity: "silent"
    - id: "stand_alone_mode_switch_mid_run"
      kind: "control_semantic"
      description: "Switching between stand_alone=TRUE and stand_alone=FALSE mid-run corrupts the Q[] routing array because shift_Q() in framework mode is incompatible with the monotonically growing current_time_step index used in standalone mode."
      severity: "silent"
  validation_limits:
    - "Best suited to shallow, relatively homogeneous soils with moderate topography."
    - "Recommended DEM grid resolution <= 50 m to resolve the topographic-wetness index."
    - "Typical timestep range 1-24 h; the NOAA-OWP C binary is structurally only safe at dt = 1.0 h."
    - "Not appropriate where deep regional groundwater, strong soil heterogeneity, or snow / frozen-ground processes dominate."
    - "Not appropriate for long dry periods (the model assumes a humid climate with a near-surface water table)."
    - "Lumped per subcatchment: cannot resolve internal spatial pattern of discharge, only the TWI-class distribution."
    - "TWI similarity assumption breaks down on very flat or very steep terrain."
  warnings:
    - "No snowmelt, no glacier, no frozen-ground physics; pair with an external snow pre-processor in cold or mountainous catchments."
    - "No internal PET calculation; PE must be supplied as a forcing in m/hr."
    - "Most sensitive parameters are szm (m) and t0 (ln T0); calibration is generally required."
    - "m and ln(T0) are strongly correlated in calibration (equifinality); identifiability requires multiple-objective or auxiliary observations (e.g., water-table depth) to break the trade-off."
    - "Channel routing is constant-celerity (chv); no dynamic-wave physics or backwater effects."
    - "Internal NSE diagnostic in results() is computed against the Qobs column of inputs.dat; if Qobs is absent or in wrong units, the reported NSE is meaningless."
  assumptions:
    - statement: "The hydraulic gradient of the water table is approximated by the local surface slope (succession-of-steady-states)."
      scope: "subsurface lateral flow and TWI similarity"
      source: "Beven & Kirkby (1979) Hydrol. Sci. Bull. 24(1):43-69; Beven et al. (1995) chapter in Singh ed. Computer Models of Watershed Hydrology"
      status: "adopted"
    - statement: "Saturated hydraulic conductivity (transmissivity) decreases exponentially with depth, controlled by parameter szm (m)."
      scope: "subsurface flow / baseflow"
      source: "topmodel.c init_water_balance and qb = szq*exp(-sbar/szm); Beven et al. (1995)"
      status: "adopted"
    - statement: "Cells with equal ln(a/tanB) respond identically (hydrologic similarity); the model is semi-distributed via TWI classes rather than fully gridded."
      scope: "spatial representation"
      source: "Beven & Kirkby (1979); CSDMS TOPMODEL model entry"
      status: "adopted"
    - statement: "Precipitation and PET are spatially uniform over the (sub)catchment within a timestep."
      scope: "atmospheric forcing"
      source: "inputs.dat structure (single rain/PE per timestep); dynatop user manual (waternumbers)"
      status: "adopted"
    - statement: "Channel routing is by constant celerity (chv main channel, rv internal); no dynamic-wave or backwater representation."
      scope: "channel network"
      source: "convert_dist_to_histords and calc_time_delay_histogram in topmodel.c"
      status: "adopted"
    - statement: "Mass-balance closure applies to water (P = Q + ET + dS) at the catchment scale; the model has no surface energy-balance closure (PE is an externally-supplied forcing and AET is a demand-side reduction)."
      scope: "conservation laws"
      source: "water_balance() diagnostic in topmodel.c (bal = sbar + sump - sumae - sumq + sumrz - sumuz)"
      status: "adopted"
    - statement: "params.dat field 2 (t0) is the natural log of saturated surface transmissivity ln(T0), not linear T0."
      scope: "parameter ingestion"
      source: "topmodel.h parameter comment and topmodel.c init_water_balance (szq = exp(t0 + log(dt) - tl))"
      status: "adopted"
    - statement: "hyd.out column order is 'it, Qobs[it], Q[it]' (observed before simulated), as written by results() in topmodel.c around line 1189."
      scope: "output parsing"
      source: "topmodel.c results() function; corrects a prior documentation transposition"
      status: "adopted"
    - statement: "The C binary is structurally safe only at dt = 1.0 h because Update() uses dt as an integer array index into rain[]/pe[]; sub-hourly or daily inputs.dat headers silently mis-index forcing arrays."
      scope: "timestep semantics"
      source: "Update() in bmi_topmodel.c and topmod() indexing on current_time_step"
      status: "adopted"
