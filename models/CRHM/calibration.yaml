# -----------------------------------------------------------------------------
# INJECTION MODE = runner.
# This case's validated recipe (model-dir run_and_score.py) REGENERATES the
# whole .prj deck from a template on every run — there is no stable parameter
# file a generic applicator could edit, no staged hru_config/modules/
# derived_params pipeline exists for this basin (the deck was authored as a
# template), and several calibrated levers are per-HRU elevation TRIPLETS that
# must move together. tools/calib_run.py therefore injects the model's own
# way: it rewrites the parameter value rows of a byte-pinned COPY of the
# validated best deck (dore_oe2100_p145.prj, sha256 fb520544c09cb72d…),
# validates every written value against the deck's own declared `<lo to hi>`
# window (CRHM hard-errors rather than clamps), and reads every value BACK out
# of the generated .prj — the artifact the CRHM binary parses — before the
# model is allowed to run.
#
# `address` below is therefore OPTIONAL DOCUMENTATION of where each value
# lands (a text_token into the generated basin.prj).
# -----------------------------------------------------------------------------
injection:
  mode: runner

# The dag declares basinflow_s / point_time_series with metric_families
# [magnitude_accuracy, temporal_pattern_match, timing_accuracy] and
# determining_metric NSE. calib_run.py emits nse / kge / pbias / rmse / r; it
# does NOT compute a timing-family day-bias metric, so the kit keeps the two
# families it can score.
targets:
  - var: basinflow_s
    weight: 1.0

# =============================================================================
# PARAMETER POOL
#
# SEEDED FROM dag.yaml influence.edges. Every HIGH/MEDIUM edge that terminates
# on basinflow_s (or on a flux/state that feeds it) is represented by the deck
# lever that actually moves it, and each parameter carries that edge's
# citations verbatim:
#
#   HIGH  air_temperature -> basinflow_s / SWE / soil_moist  (he2023, fang2007)
#         => obs_elev + lapse_rate (CRHM lapses T from obs_elev to each
#            hru_elev — this IS the temperature lever in a .prj), and the
#            phase-partition thresholds tmax_allrain / tmax_allsnow /
#            snow_rain_determination
#   HIGH  precipitation   -> basinflow_s / SWE / soil_moist  (he2023, fang2007)
#         => ClimChng_precip (the in-.prj multiplicative precip knob),
#            precip_elev_adj (orographic gradient)
#   MEDIUM wind_speed     -> SWE / Subl                      (pomeroy2007, fang2010)
#         => pbsm fetch (measured INERT at this site — see header — retained
#            UNPRUNED for the Morris screen)
#   HIGH  wetland_storage_capacity (Sdmax) -> basinflow_s    (fang2010, he2023)
#         => Sdmax
#   MEDIUM fall_soil_moisture (fallstat)   -> snowmeltD      (fang2007, fang2010)
#         => crack fallstat (+ crack Major, the same module's melt threshold)
#   MEDIUM frozen_soil_infiltration_choice -> basinflow_s    (pomeroy2007, fang2010)
#         => the crack-module levers above parameterise the chain's chosen arm
#   MEDIUM vegetation_cover -> hru_actet                     (fang2007, pomeroy2007)
#         => evap F_Qg (Granger ground-heat-flux fraction; the deck has no
#            free canopy/LAI lever)
#
# Residual params with NO literature edge are NOT pruned — literature is the
# PRIOR, not a pruning oracle. Albedo_snow (the ebsm melt-energy lever,
# measured as one of the two STRONGEST controls at this site), the soil/
# groundwater store group and the six Netroute routing constants are the
# levers the KI's own validated-basin library documents as controlling volume
# partition and recession shape (SKILL.md "groundwater-baseflow lesson",
# "Blue River lesson"), retained at low/medium confidence for the kit's
# Morris screen to confirm-or-demote on THIS site (~2 s per probe).
#
# ERROR MODE THIS POOL MUST BE ABLE TO CLOSE. At the default vector the FULL
# hydrograph is well-shaped (r 0.845, NSE 0.709) with a moderate volume
# deficit (PBIAS -6.5%, worse in the holdout years at -7.4%): the residual is
# part VOLUME, part freshet SHAPE. The pool therefore spans (a) the volume
# levers (ClimChng_precip, precip_elev_adj, evap_F_Qg, soil_moist_max,
# soil_gw_K, gw_max, gw_K — the gw group is LIVE here, see header), (b) the
# freshet timing/energy levers (obs_elev, lapse_rate, tmax_allrain,
# tmax_allsnow, snow_rain_determination, Albedo_snow, crack levers) and
# (c) the recession/attenuation levers (Kstorage, Lag, run/ssr/gwKstorage,
# gwLag, rechr/lower_ssr_K). Commissioning shows real headroom: Lag alone at
# its lower bound lifts FULL NSE 0.7086 -> 0.7382.
#
# RANGES. Each `range` is the LITERATURE / KI-documented CALIBRATION band,
# kept strictly INSIDE the deck's own declared `<lo to hi>` window (recorded
# per-parameter as `model_declared_range`, transcribed from the pinned deck,
# which CRHM validates by HARD-ERROR, never by clamping). For profile-tied
# parameters the SCALED per-HRU values also stay inside the window at both
# bounds (e.g. pbsm_fetch lo=1300 keeps the Forest HRU at 325, above the
# model's 300 m floor). Every bound was verified LIVE to apply EXACTLY in the
# generated .prj with a finite NSE — no bound clamps.
#
# DEFAULTS are the validated real_case optimum, so a staged round that freezes
# a parameter holds it at the validated value and the calibrator starts from a
# known-good point.
# =============================================================================
parameters:

  # ---------------------------------------------------------------------------
  # A. FORCING TRANSLATION — temperature, precipitation and phase partition.
  #    dag HIGH edges air_temperature -> basinflow_s / SWE / soil_moist and
  #    precipitation -> basinflow_s / SWE / soil_moist.
  # ---------------------------------------------------------------------------
  - name: obs_elev
    description: >
      Elevation assigned to the forcing station. CRHM lapses air temperature
      from obs_elev to each hru_elev, so this is the master FRESHET-TIMING
      knob for a discharge-scored run: HRUs below obs_elev are warmed and melt
      earlier. SKILL.md's Ghost / Kaslo / Kuskanax lessons make this the
      single highest-leverage parameter in the KI, and the validated Dore grid
      swept exactly {1950, 2100, 2250} and settled at 2100.
    type: continuous
    units: "m"
    default: 2100.0
    range: [1430.0, 2600.0]
    hard_bounds: [0.0, 100000.0]
    model_declared_range: [0, 100000]
    transform: identity
    scope: global                     # one forcing station; written to all rows
    tie: null
    activation: always
    confidence: high
    cite: >
      dag.yaml influence edge air_temperature -> basinflow_s, sensitivity_grade
      HIGH, basis literature_quantitative, citations
      [he2023_prairie_classification_sensitivity (He et al. 2023,
      doi 10.5194/hess-27-3525-2023 — streamflow sensitivity -6 to -31% per
      degree C), fang2007_prairie_drought_sensitivity (Fang & Pomeroy 2007,
      doi 10.1002/hyp.6796)]. RANGE: the KI's documented obs_elev envelope for
      a 3-HRU mountain basin — from the Valley HRU (1430 m) to ~300 m above
      the Alpine HRU (2294 m), where SKILL.md's "raise obs_elev to roughly the
      ALPINE-HRU elevation, over-shooting loses NSE fast" rule places the
      optimum. Model-declared <0 to 100000>, so no clamping. Measured
      single-bound effect: NSE 0.368 (lo) / 0.538 (hi) vs 0.709 default.
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^obs obs_elev <[^>]*>\\n(\\S+)"

  - name: lapse_rate
    description: >
      Environmental temperature lapse rate used to translate the forcing
      temperature from obs_elev to each HRU. Together with obs_elev it sets
      per-HRU melt energy — the second arm of the dag's HIGH air_temperature
      edge.
    type: continuous
    units: "degC/100m"
    default: 0.75
    range: [0.40, 0.98]
    hard_bounds: [0.0, 2.0]
    model_declared_range: [0, 2]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "uniform_all_hru"
    activation: always
    confidence: high
    cite: >
      dag.yaml influence edge air_temperature -> basinflow_s / SWE (HIGH,
      he2023_prairie_classification_sensitivity,
      fang2007_prairie_drought_sensitivity). RANGE: the physical lapse-rate
      envelope — saturated adiabatic (~0.4 degC/100 m) to dry adiabatic
      (~0.98 degC/100 m) — around the KI's documented default 0.75 degC/100 m
      (Fang et al. 2013, doi 10.5194/hess-17-1635-2013, as recorded in
      SKILL.md's s4 parameter table). Model-declared <0 to 2>, no clamping.
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^obs lapse_rate <[^>]*>\\n(\\S+)"

  - name: ClimChng_precip
    description: >
      Multiplicative precipitation correction applied INSIDE CRHM
      (ClassObs.cpp), the documented master VOLUME/PBIAS knob. Corrects NASA
      POWER's orographic precipitation deficit at this windward Cariboo basin
      without rewriting the .obs. The validated grid swept {1.30, 1.45, 1.60}
      and settled at 1.45 (PBIAS -6.5%).
    type: continuous
    units: "-"
    default: 1.45
    range: [1.0, 2.0]
    hard_bounds: [0.0, 10.0]
    model_declared_range: [0.0, 10]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "uniform_all_hru"
    activation: always
    confidence: high
    cite: >
      dag.yaml influence edge precipitation -> basinflow_s, sensitivity_grade
      HIGH, basis literature_quantitative, citations
      [he2023_prairie_classification_sensitivity (precipitation elasticity of
      streamflow 2.3-5.4), fang2007_prairie_drought_sensitivity]. RANGE: from
      uncorrected NASA POWER (1.0) to a 2x up-scale — brackets the validated
      grid {1.3, 1.45, 1.6} whose PBIAS crosses zero between 1.45 (-6.5%) and
      1.6 (+6.6%), and spans the heavy orographic up-scales the KI's wet
      windward basins document (Canoe/Kuskanax class). Model-declared
      <0 to 10>, no clamping. Measured: NSE 0.497 (lo) / 0.322 (hi).
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^obs ClimChng_precip <[^>]*>\\n(\\S+)"

  - name: precip_elev_adj
    description: >
      Orographic precipitation adjustment per metre of elevation difference
      between obs_elev and each HRU — the spatial arm of the dag's HIGH
      precipitation edge (ClimChng_precip moves the basin-wide level,
      precip_elev_adj tilts it with elevation). Calibrated as the ALPINE-HRU
      value; Forest moves at 0.6x and the Valley HRU stays at 0.0, preserving
      the validated deck's 0.0005 / 0.0003 / 0.0 profile shape.
    type: continuous
    units: "1/m"
    default: 0.0005
    range: [0.0, 0.002]
    hard_bounds: [-1.0, 1.0]
    model_declared_range: [-1, 1]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "orographic_profile"        # applied as [1.0, 0.6, 0.0] x this value
    activation: always
    confidence: medium
    cite: >
      dag.yaml influence edge precipitation -> basinflow_s / SWE (HIGH,
      he2023_prairie_classification_sensitivity,
      fang2007_prairie_drought_sensitivity). RANGE: from no orographic
      gradient (0.0) to four times the deck's validated alpine value — the
      same conservative envelope the KI documents for its Belly River profile
      ("0.0005 alpine, 0 valley"). Far inside the model-declared <-1 to 1>,
      no clamping.
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^obs precip_elev_adj <[^>]*>\\n(\\S+)"

  - name: tmax_allrain
    description: >
      Air temperature at or above which ALL precipitation falls as rain. With
      tmax_allsnow it defines CRHM's linear rain/snow mixing band — in a nival
      basin the phase split is the first control on how much of P becomes
      snowpack and therefore on freshet volume and timing.
    type: continuous
    units: "degC"
    default: 2.0
    range: [0.5, 6.0]
    hard_bounds: [-10.0, 10.0]
    model_declared_range: [-10, 10]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "uniform_all_hru"
    activation: "snow_rain_determination == 0 (air-temperature threshold)"
    confidence: medium
    cite: >
      dag.yaml influence edges air_temperature -> SWE and precipitation -> SWE
      (both HIGH, he2023_prairie_classification_sensitivity,
      fang2007_prairie_drought_sensitivity); the all-rain threshold band
      0.5-6 degC spans the hydrological-model phase-threshold literature the
      CRHM obs module encodes (all-rain typically 2-4 degC above the all-snow
      threshold). Constrained tmax_allsnow <= tmax_allrain (see
      `constraints`). Model-declared <-10 to 10>, no clamping. Measured:
      NSE 0.707 (lo) / 0.525 (hi).
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^obs tmax_allrain <[^>]*>\\n(\\S+)"

  - name: tmax_allsnow
    description: >
      Air temperature at or below which ALL precipitation falls as snow — the
      lower edge of the rain/snow mixing band and, measured at this site, one
      of the strongest single levers (moving it to -2 shifts daily basinflow
      by up to 38 m3/s).
    type: continuous
    units: "degC"
    default: 0.0
    range: [-3.0, 2.0]
    hard_bounds: [-10.0, 10.0]
    model_declared_range: [-10, 10]
    transform: identity
    scope: per-HRU
    zone_key: hru_id
    tie: "uniform_all_hru"
    activation: "snow_rain_determination == 0 (air-temperature threshold)"
    confidence: medium
    cite: >
      Same dag HIGH edges as tmax_allrain. RANGE: -3..+2 degC around the CRHM
      default of 0 degC covers the observed all-snow threshold spread across
      cold-region basins; the upper bound equals the tmax_allrain default so
      the ordering constraint stays satisfiable at the corner. Model-declared
      <-10 to 10>, no clamping.
    address:
      kind: text_token
      file: "basin.prj"
      pattern: "^obs tmax_allsnow <[^>]*>\\n(\\S+)"

  - name: snow_rain_determination
    description: >
      Rain/snow phase partition method: 0 = air-temperature threshold (the
