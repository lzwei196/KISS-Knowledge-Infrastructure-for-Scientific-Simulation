template_version: "3.5"

identity:
  model_id: "MARRMoT"
  scientific_reference_version: "MARRMoT v2.1.x (47 conceptual rainfall-runoff structures; object-oriented state-space reformulation, GMD 15:6359, 2022; numerics trace to v1.2 GMD 12:2463, 2019)"
  implementation:
    id: "marrmot-octave-v212"
    version: "2.1.2"
    provenance: "MATLAB/Octave; wknoben/Trotter MARRMoT toolbox driven from Python via an oct2py/BMI bridge."
  ki_class: "forward_model"
  is_family_dag: true
  language: "matlab"
  license: "GPL-3.0-only"
  repo_url: "https://github.com/wknoben/MARRMoT"

boundary:
  scope_in:
    - "Lumped conceptual rainfall-runoff simulation at catchment scale"
    - "47 selectable conceptual model structures (GR4J, HYMOD, Sacramento, HBV, VIC, TOPMODEL, etc.)"
    - "Continuous state-space (ODE) integration of catchment storages"
    - "Generation of streamflow, actual evapotranspiration, internal stores and fluxes"
    - "Unit-hydrograph routing of generated runoff to catchment outlet"
    - "Built-in calibration and objective-function evaluation (KGE, NSE, RMSE, log-NSE)"
  scope_out:
    - "Potential evapotranspiration (PET): must be supplied externally; the model never derives PET from radiation"
    - "Spatial discretization of inputs or catchment response (models are lumped, single-unit)"
    - "Distributed / gridded stream routing"
    - "Adaptive time stepping (fixed time step only)"
    - "Internal unit checking or unit conversion of forcing (no validation; wrong units silently propagate)"
    - "Exact reproduction of original published model implementations (implicit-Euler + equation smoothing diverge from originals)"
  spatial: "0-D point"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Lumped catchment treated as a single 0-D unit (one to eight storages). Water mass-balance is closed by construction; development testing reports closure residuals of order 1E-12 mm, but at runtime the residual is computed and printed, NOT enforced, so solver non-convergence can leak water silently. Fixed time step: daily (delta_t=1 in days) is the validated path; sub-daily is possible but requires delta_t and all unit-hydrograph time bases to be rescaled consistently. No surface energy-balance closure (PET is an external input)."

inputs:
  forcing:
    - category: "forcing"
      name: "Precipitation"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: "input_climate column 1 of the [P, Ep, T] climate array (mm per time step)"
      notes: "Consumed each timestep. Model performs no unit check; common source units (mm/3h, kg/m2/s, m/d) silently produce wrong runoff if not pre-converted to mm/d."
    - category: "forcing"
      name: "Potential evapotranspiration (Ep)"
      unit: "mm/d"
      source_kind: "forcing"
      model_input_format: "input_climate column 2 of the [P, Ep, T] climate array (mm per time step)"
      notes: "Must be pre-computed externally (Hargreaves / Penman-Monteith). The model does NOT derive Ep from radiation; passing net radiation as Ep causes Ea>P and store drainage."
    - category: "forcing"
      name: "Temperature"
      unit: "deg C"
      source_kind: "forcing"
      model_input_format: "input_climate column 3 of the [P, Ep, T] climate array (mean daily deg C)"
      notes: "Required by snow-capable structures for rain/snow partitioning; optional otherwise. Kelvin or Fahrenheit values silently break snow partitioning and degree-day melt."
  parameters:
    - category: "parameter"
      name: "theta (model parameter vector)"
      unit: "mixed"
      source_kind: "calibrated"
      model_input_format: "numeric vector of length model.numParams (1 to ~23 depending on structure); bounds defined per structure in the parRanges property"
      notes: "Structure-specific. Standardized literature-based parameter ranges are provided across all 47 structures to make cross-structure calibration and sensitivity comparable."
    - category: "parameter"
      name: "Maximum soil/production store capacity (Smax; e.g. GR4J x1, HYMOD Cmax)"
      unit: "mm"
      source_kind: "calibrated"
      model_input_format: "element of theta; typical range ~[1, 2000] mm"
      notes: "First-order control on runoff partitioning. Values in m or cm (not mm) silently mis-fill the store."
    - category: "parameter"
      name: "Soil-moisture distribution / saturation-variability shape (e.g. HYMOD b/Bexp)"
      unit: "-"
      source_kind: "calibrated"
      model_input_format: "element of theta; HYMOD range ~[0, 10]"
      notes: "Controls saturation-excess runoff generation."
    - category: "parameter"
      name: "Reservoir rate constants / residence times (e.g. HYMOD kf, ks; GR4J x3 routing-store capacity)"
      unit: "1/d or mm"
      source_kind: "calibrated"
      model_input_format: "elements of theta"
      notes: "Set the timing and split of fast vs slow flow / baseflow."
    - category: "parameter"
      name: "Unit-hydrograph time base (e.g. GR4J x4, HBV maxbas)"
      unit: "d"
      source_kind: "calibrated"
      model_input_format: "element of theta used by init() to build the routing kernel"
      notes: "Must be rescaled if delta_t changes (maxbas_new = maxbas/delta_t), or the hydrograph peak timing shifts."
  initial_conditions:
    - category: "initial_condition"
      name: "S0 (initial storage vector)"
      unit: "mm"
      source_kind: "user_provided"
      model_input_format: "numeric vector of length exactly model.numStores; defaults to zeros (dry start)"
      notes: "Length must equal numStores: too few elements is a fatal index error, too many is silently ignored. First-year results are unreliable; a spin-up of >=1 year is recommended."
  boundary_conditions:
    - category: "boundary_condition"
      name: "Model structure selection (m_01..m_47)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "choice of the concrete MARRMoT_model child class (e.g. m_07_gr4j_4p_2s, m_29 HYMOD) instantiated for the run"
      notes: "Determines numStores, numParams, flux composition and routing — a first-order structural lever."
    - category: "boundary_condition"
      name: "delta_t (time step)"
      unit: "d"
      source_kind: "user_provided"
      model_input_format: "scalar in DAYS (1 for daily forcing); fluxes are scaled by delta_t in run()"
      notes: "Must match forcing time step in days. Setting it to 24 (hours) scales all fluxes 24x."
    - category: "boundary_condition"
      name: "Solver options (resnorm_tolerance, resnorm_maxiter)"
      unit: "mm / count"
      source_kind: "default"
      model_input_format: "solver_opts struct; hardcoded defaults resnorm_tolerance=0.1 mm, resnorm_maxiter=6"
      notes: "Increase resnorm_maxiter (12+) and/or tighten tolerance for stiff parameter combinations."
    - category: "boundary_condition"
      name: "Calibration objective function selection"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "objective-function handle (of_NSE, of_KGE, of_log_NSE, RMSE, inverse variants) passed to calibrate()"
      notes: "Used only in the optional calibration path, not in a plain forward run."

processes:
  modules:
    - name: "MARRMoT_model (superclass driver)"
      role: "driver"
      brief: "Abstract handle-class base that all 47 structures inherit: validates inputs, runs the per-timestep loop in run(), scales fluxes by delta_t, assembles get_output structs, and orchestrates the optional calibration."
    - name: "init_/init (allocator)"
      role: "allocator"
      brief: "Pre-run setup: allocates stores/fluxes/solver_data arrays, sets store_min=0 and store_max=inf, then calls the structure-specific init() to set store_max from theta and build the unit hydrographs."
    - name: "model_fun (per-structure governing equations)"
      role: "process_solver"
      brief: "The mechanistic heart, unique per structure: given store vector S, computes all fluxes (via the flux library) and dS/dt for each store. Defines the state-space ODE system."
    - name: "ODE_approx_IE (implicit-Euler residual)"
      role: "integrator"
      brief: "Forms the implicit-Euler residual err = (S - Sold)/delta_t - model_fun(S), the nonlinear system rooted each timestep."
    - name: "solve_stores"
      role: "process_solver"
      brief: "Per-timestep ODE solve: tries Newton-Raphson, falls back to fsolve then lsqnonlin when the store-scaled resnorm exceeds tolerance, and keeps the best of the three."
    - name: "rerunSolver (restart strategy)"
      role: "process_solver"
      brief: "Re-seeds a stuck fsolve/lsqnonlin from previous stores, store min/max bounds (+/-2e4), then randomized perturbations, up to resnorm_maxiter times."
    - name: "NewtonRaphson (primary root finder)"
      role: "process_solver"
      brief: "Globally-convergent Newton-Raphson with backtracking line search and numeric Jacobian (eps^(1/3) finite difference); Octave and MATLAB variants selected by the isOctave flag."
    - name: "Flux function library"
      role: "process_solver"
      brief: "111 reusable single-process flux functions (saturation, baseflow, evaporation, percolation, recharge, interception, infiltration, snowfall) composed by each model_fun."
    - name: "Flux smoothing"
      role: "process_solver"
      brief: "Logistic smoothers for storage and temperature thresholds (defaults r=0.01, e=5) that replace hard if/else switches with differentiable transitions so the implicit solver's Jacobian stays well-behaved."
    - name: "Snow/rain partitioning"
      role: "optional_module"
      applicability: "snow-capable structures only (e.g. m_06 alpine, m_12 alpine2, m_37 HBV-96, m_43 GSM-SOCONT; exact membership varies)"
      brief: "Temperature-threshold partitioning of precipitation into snow vs rain and degree-day melt, present only in snow-capable structures."
    - name: "Unit hydrograph routing"
      role: "integrator"
      brief: "8 routing kernels (half/full triangle, gamma, uniform, delay) built from time-base parameters; route() emits the current outflow and the still-to-flow buffer carries water on-route."
    - name: "step (per-structure routing advance)"
      role: "integrator"
      brief: "End-of-timestep hook that advances each structure's unit-hydrograph still-to-flow buffers with the fluxes just computed."
    - name: "check_waterbalance"
      role: "integrator"
      brief: "Mass-balance closure: sum(P) minus all signed FluxGroup outflows, minus delta-storage (with StoreSigns), minus water still on-route; returns the residual (informational, not enforced)."
    - name: "get_output / get_streamflow"
      role: "driver"
      brief: "Output assembler that maps the fluxes/stores matrices into named structs and FluxGroup-aggregated outputs (Q, Ea, Exchange); get_streamflow returns only summed FluxGroups.Q."
    - name: "Calibration (CMA-ES + objective functions)"
      role: "optional_module"
      brief: "Optional parameter estimation: an optimiser (my_cmaes) searches theta to optimize an objective function (of_NSE/of_KGE/log-NSE/inverse variants) evaluated via get_streamflow. Not part of a forward run."
  internal_edges:
    - from: "Inputs"
      to: "model_fun (per-structure governing equations)"
      kind: "consumes_input"
      brief: "model_fun reads input_climate(t,:) for current-step P, Ep, T"
    - from: "MARRMoT_model (superclass driver)"
      to: "init_/init (allocator)"
      kind: "invokes"
      brief: "run() calls init_() to allocate arrays and run the structure-specific init()"
    - from: "init_/init (allocator)"
      to: "Unit hydrograph routing"
      kind: "invokes"
      brief: "init() builds the UH kernels from time-base parameters (x4 / maxbas)"
    - from: "init_/init (allocator)"
      to: "store_max"
      kind: "writes_state"
      brief: "init() sets store_max from theta (e.g. [x1,x3]) overriding the inf default"
    - from: "MARRMoT_model (superclass driver)"
      to: "solve_stores"
      kind: "invokes"
      brief: "each timestep run() calls solve_stores(Sold) to find the new store vector"
    - from: "solve_stores"
      to: "ODE_approx_IE (implicit-Euler residual)"
      kind: "invokes"
      brief: "the solver roots the implicit-Euler residual function"
    - from: "ODE_approx_IE (implicit-Euler residual)"
      to: "model_fun (per-structure governing equations)"
      kind: "invokes"
      brief: "the residual evaluates model_fun(S) to get dS/dt"
    - from: "ODE_approx_IE (implicit-Euler residual)"
      to: "stores"
      kind: "reads_state"
      brief: "reads Sold = stores(t-1,:) (or S0 at t=1) to form the Euler residual"
    - from: "solve_stores"
      to: "NewtonRaphson (primary root finder)"
      kind: "invokes"
      brief: "primary solve uses NewtonRaphson (Octave/MATLAB variant by isOctave)"
    - from: "solve_stores"
      to: "rerunSolver (restart strategy)"
      kind: "invokes"
      brief: "falls back to fsolve/lsqnonlin via rerunSolver when NR resnorm is too high"
    - from: "model_fun (per-structure governing equations)"
      to: "Flux function library"
      kind: "invokes"
      brief: "model_fun calls flux functions (saturation, evap, percolation, baseflow, recharge)"
    - from: "Flux function library"
      to: "Flux smoothing"
      kind: "invokes"
      brief: "flux functions apply logistic smoothing (default r=0.01, e=5)"
    - from: "Flux function library"
      to: "Snow/rain partitioning"
      kind: "invokes"
      brief: "snow-capable structures route precipitation through temperature-threshold partitioning"
    - from: "model_fun (per-structure governing equations)"
      to: "Unit hydrograph routing"
      kind: "invokes"
      brief: "model_fun calls route(flux, uh) to produce routed quick/slow outflows"
    - from: "solve_stores"
      to: "stores"
      kind: "writes_state"
      brief: "run() writes stores(t,:) = Sold + dS'*delta_t each timestep"
    - from: "MARRMoT_model (superclass driver)"
      to: "step (per-structure routing advance)"
      kind: "invokes"
      brief: "run() calls the structure step() at the end of each timestep"
    - from: "step (per-structure routing advance)"
      to: "uhs"
      kind: "writes_state"
      brief: "step() advances the still-to-flow routing buffers"
    - from: "get_output / get_streamflow"
      to: "stores"
      kind: "reads_state"
      brief: "assembles storeInternal and FluxGroup-summed outputs from the stores/fluxes matrices"
    - from: "get_output / get_streamflow"
      to: "check_waterbalance"
      kind: "invokes"
      brief: "when nargout>=4, get_output computes the water-balance residual"
    - from: "check_waterbalance"
      to: "uhs"
      kind: "reads_state"
      brief: "reads the still-to-flow row of each UH (on-route water) to close the balance"
    - from: "get_output / get_streamflow"
      to: "Outputs"
      kind: "produces_output"
      brief: "summed FluxGroups.Q is simulated streamflow (mm/d); Ea, stores, fluxes, and waterBalance are emitted alongside"
    - from: "Calibration (CMA-ES + objective functions)"
      to: "get_output / get_streamflow"
      kind: "invokes"
      brief: "the calibration fitness function runs get_streamflow(theta) per iteration and scores it with the chosen objective"

states:
  variables:
    - name: "stores (S)"
      unit: "mm"
      role: "prognostic"
    - name: "uhs (unit-hydrograph still-to-flow buffers)"
      unit: "mm"
      role: "prognostic"
    - name: "fluxes"
      unit: "mm/d"
      role: "diagnostic"
    - name: "store_max"
      unit: "mm"
      role: "diagnostic"
    - name: "StoreSigns (per-store sign; -1 = deficit store)"
      unit: "-"
      role: "diagnostic"
    - name: "solver_data (resnorm, solver id, iter per timestep)"
      unit: "-"
      role: "diagnostic"
    - name: "waterBalance (closure residual)"
      unit: "mm"
      role: "accumulator"
  provenance: "populated"

outputs:
  - var: "Q"
    validation_rank: 1
    unit: "mm/d"
    description: "Total simulated streamflow at the catchment outlet (sum of fluxes in FluxGroups.Q, after unit-hydrograph routing)."
    emitted_in: "fluxOutput.Q (get_output / get_streamflow)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Observed discharge in m3/s must be converted to mm/d using the gauged upstream catchment area (Q_mm = Q_m3s * 86400 / (A_km2 * 1e6) * 1000) before comparison."
            - "Exclude the spin-up period (>=1 year) from metrics; first-year results depend on S0."
            - "Catchment area used for the conversion must match the gauged upstream area, not the total basin."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Single-instant streamflow comparison is weak for a continuous water-balance model; prefer the time-series form."
      detrending_options: ["none"]
  - var: "Ea"
    validation_rank: 2
    unit: "mm/d"
    description: "Actual evapotranspiration aggregated from the model's evaporation fluxes."
    emitted_in: "fluxOutput.Ea (get_output)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Conceptual Ea is bounded by the externally supplied Ep; agreement with flux-tower / remote-sensing ET is indirect."
        - obs_shape: "spatial_time_series"
          comparison_mode: "aggregate_trend_comparison"
          metric_families: ["magnitude_accuracy", "trend_match"]
          determining_metric: "pbias"
          caveats:
            - "Model is lumped (0-D); gridded ET products must be spatially averaged to the catchment before comparison, losing spatial pattern."
      detrending_options: ["none", "linear_residual"]
  - var: "S"
    validation_rank: 3
    unit: "mm"
    description: "Storage time series per model store (e.g. soil moisture, fast reservoir, slow/baseflow reservoir, snow store); number of stores varies by structure (1 to 8)."
    emitted_in: "storeInternal (get_output)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Conceptual stores are not directly measurable; comparison against e.g. soil-moisture or SWE observations is qualitative and requires unit/scale assumptions about which store maps to the observation."
      detrending_options: ["none"]
  - var: "waterBalance"
    validation_rank: 4
    unit: "mm"
    description: "Scalar water-balance closure residual over the run; should be near zero (<1 mm). Computed and printed but NOT enforced by the model."
    emitted_in: "waterBalance (check_waterbalance)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "This is an internal diagnostic, not a physical observable; it is compared against the expectation |residual| < 1 mm rather than against field data."
      detrending_options: ["none"]

influence:
  edges:
    - from: "Maximum soil/production store capacity (Smax; GR4J x1, HYMOD Cmax)"
      to: "Q"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "always (storage-capacity parameter present in every structure)"
      citations: ["gharari2019_six_methods_three_models", "wang2015_hymod_glue"]
    - from: "Soil-moisture variability shape (HYMOD Bexp / beta)"
      to: "Q"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "HYMOD (m_29) and saturation-excess structures"
      citations: ["wang2015_hymod_glue", "gharari2019_six_methods_three_models"]
    - from: "Routing-store capacity / quick-flow residence time (GR4J x3, HYMOD Kq)"
      to: "Q"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "GR4J (m_07), HYMOD (m_29)"
      citations: ["gharari2019_six_methods_three_models", "wang2015_hymod_glue"]
    - from: "Groundwater exchange coefficient (GR4J x2)"
      to: "Q"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "GR4J (m_07); strongest for low-flow target"
      citations: ["gharari2019_six_methods_three_models"]
    - from: "Unit-hydrograph time base (GR4J x4)"
      to: "Q"
      sensitivity_grade: "MEDIUM"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "GR4J (m_07); strongest for high-flow / peak timing"
      citations: ["gharari2019_six_methods_three_models"]
    - from: "Slow-flow / baseflow residence time (HYMOD Ks)"
      to: "Q"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "HYMOD (m_29)"
      citations: ["wang2015_hymod_glue"]
    - from: "Flow-partition factor (HYMOD Alpha)"
      to: "Q"
      sensitivity_grade: "LOW"
      basis: "literature_quantitative"
      lever_type: "parameter"
      applicability: "HYMOD (m_29)"
      citations: ["wang2015_hymod_glue"]
    - from: "Model structure choice (selection among the 47 MARRMoT structures)"
      to: "Q"
      sensitivity_grade: "HIGH"
      basis: "literature_quantitative"
      lever_type: "structural"
      applicability: "framework-level intercomparison"
      citations: ["knoben2020_structure_uncertainty"]
    - from: "Precipitation forcing (P)"
      to: "Q"
      sensitivity_grade: "HIGH"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["knoben2019_marrmot_v12", "trotter2022_marrmot_v21"]
    - from: "Potential evapotranspiration forcing (Ep)"
      to: "Q"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "boundary_forcing"
      applicability: "always"
      citations: ["knoben2019_marrmot_v12", "trotter2022_marrmot_v21"]
  citation_index:
    gharari2019_six_methods_three_models:
      short_citation: "Gharari et al. 2019"
      doi: "10.3390/w11051062"
      note: "Six global SA methods (Sobol, eFAST, Morris, LH-OAT, RSA, PAWN) on GR4J, HYMOD, HBV; production/storage and routing parameters dominate streamflow sensitivity."
    wang2015_hymod_glue:
      short_citation: "Wang et al. 2015"
      doi: "10.5194/piahs-368-180-2015"
      note: "GLUE sensitivity/identifiability of HYMOD (MARRMoT m_29): Cmax, Bexp, Kq well-identified and dominant; Ks and Alpha weakly sensitive."
    knoben2020_structure_uncertainty:
      short_citation: "Knoben et al. 2020"
      doi: "10.1029/2019WR025975"
      note: "36 MARRMoT structures over 559 CAMELS catchments; model-structure choice strongly controls streamflow skill (first-order sensitivity)."
    knoben2019_marrmot_v12:
      short_citation: "Knoben et al. 2019"
      doi: "10.5194/gmd-12-2463-2019"
      note: "Foundational MARRMoT v1.2 framework paper; standardized forcing (P, PET, T) and parameter ranges."
    trotter2022_marrmot_v21:
      short_citation: "Trotter et al. 2022"
      doi: "10.5194/gmd-15-6359-2022"
      note: "Object-oriented MARRMoT v2.1 (47 structures); standardized inputs/outputs."

safety:
  hazards:
    - id: "precip_subdaily_not_summed"
      kind: "weather_file_semantic"
      description: "Sub-daily precipitation (e.g. mm/3h) treated as mm/d without summing produces streamflow 3-8x too high and runoff ratio >1."
      severity: "silent"
    - id: "precip_rate_units_not_scaled"
      kind: "weather_file_semantic"
      description: "Precipitation in kg/m2/s (x86400) or m/d (x1000) not converted to mm/d drives P and Q to near zero."
      severity: "silent"
    - id: "pet_radiation_passed_as_ep"
      kind: "weather_file_semantic"
      description: "Net radiation (W/m2) or monthly PET (mm/month) passed as Ep instead of mm/d PET makes Ea exceed P and drains the stores."
      severity: "silent"
    - id: "temperature_kelvin_or_fahrenheit"
      kind: "weather_file_semantic"
      description: "Temperature in Kelvin or Fahrenheit (not deg C) breaks rain/snow partitioning and degree-day melt in snow-capable structures."
      severity: "silent"
    - id: "climate_column_order_swap"
      kind: "weather_file_semantic"
      description: "Climate array supplied as [P, T, Ep] instead of [P, Ep, T] silently swaps temperature and PET so Ea tracks the temperature signal."
      severity: "silent"
    - id: "storage_param_wrong_length_unit"
      kind: "soil_semantic"
      description: "Storage parameters (Smax, x1, x3) in m or cm rather than mm cause stores to fill/drain unrealistically."
      severity: "silent"
    - id: "s0_length_mismatch"
      kind: "initial_condition_semantic"
      description: "Initial storage vector S0 with too few elements is a fatal index error; too many elements is silently truncated/ignored."
      severity: "fatal_or_silent"
    - id: "stiff_ode_solver_nonconvergence"
      kind: "numerical_instability"
      description: "Extreme parameter combinations make Newton-Raphson fail; fsolve/lsqnonlin fallbacks may still leave a water-balance error >10 mm."
      severity: "degraded"
    - id: "waterbalance_not_enforced"
      kind: "numerical_instability"
      description: "The water-balance residual is computed and printed but never enforced, so solver non-convergence accumulates silently and biases metrics."
      severity: "silent"
    - id: "delta_t_units_hours"
      kind: "control_semantic"
      description: "delta_t set to 24 (hours) instead of 1 (day) for daily forcing scales all fluxes by 24 (fluxes are multiplied by delta_t in run())."
      severity: "degraded"
    - id: "uh_timebase_not_rescaled"
      kind: "control_semantic"
      description: "Unit-hydrograph time-base parameter (x4, maxbas) not rescaled when delta_t changes compresses/stretches the hydrograph and shifts peak timing."
      severity: "degraded"
    - id: "fluxgroup_sign_error"
      kind: "parser_semantic"
      description: "FluxGroups indices are signed (negative = inflow/exchange); a wrong sign in a structure file silently corrupts both the aggregated streamflow and the water-balance closure."
      severity: "silent"
    - id: "input_setter_silent_reset"
      kind: "control_semantic"
      description: "Setting theta, delta_t, S0, input_climate, or solver_opts silently triggers reset(), wiping any prior simulation without warning."
      severity: "silent"
  validation_limits:
    - "Lumped, point-scale (0-D): no spatial variability within the catchment and no native distributed routing."
    - "Daily fixed time step cannot resolve sub-daily runoff processes; sub-daily use requires consistent rescaling of delta_t and all UH time bases."
    - "Non-snow structures are structurally inapplicable in snow-dominated catchments (the dominant runoff mechanism is omitted)."
    - "Structural-assumption mismatch: e.g. TOPMODEL (m_14) assumes a water table connected to the stream, invalid in deep-aquifer systems."
    - "Over-parameterised structures (up to ~23 parameters) with short calibration records suffer equifinality; do not use more parameters than years of calibration data."
    - "MARRMoT structures neither guarantee nor reproduce the exact behaviour of the original published models (implicit Euler + equation smoothing + lumping diverge from the originals)."
  warnings:
    - "First simulation year is unreliable because of the S0 dry start; exclude >=1 year of spin-up from any metric."
    - "The Octave solver path (optim package, isOctave branch) and the MATLAB path (optimoptions/fsolve/lsqnonlin) can give different fallback-solver behaviour for the same stiff problem."
    - "Always inspect the printed waterBalance; a residual >1 mm signals numerical problems even though the run completes."
  assumptions:
    - statement: "PET is an external input; the model never computes potential evapotranspiration internally."
      scope: "all 47 structures"
      source: "MARRMoT GMD v1.2 (10.5194/gmd-12-2463-2019) and v2.1 (10.5194/gmd-15-6359-2022) input specifications"
      status: "adopted"
    - statement: "The catchment is represented as a single lumped 0-D unit with one to eight conceptual storages and no internal spatial discretization."
      scope: "boundary geometry"
      source: "MARRMoT GMD v1.2 / v2.1 scope statements"
      status: "adopted"
    - statement: "Water mass-balance is closed by construction (development residuals ~1E-12 mm) but enforcement is left to the user; the printed residual is diagnostic only."
      scope: "closure"
      source: "check_waterbalance behaviour in MARRMoT_model and GMD v1.2 verification section"
      status: "adopted"
    - statement: "Daily (delta_t=1 in days) is treated as the validated temporal path; sub-daily operation is permitted but requires consistent rescaling of delta_t and unit-hydrograph time bases."
      scope: "temporal resolution"
      source: "MARRMoT_model run() flux scaling and GMD fixed-time-step description"
      status: "tentative"
    - statement: "This dag is a family-level description of the 47-structure framework; per-structure store, flux, and parameter names (sampled from GR4J m_07 and HYMOD m_29) are illustrative, not exhaustive."
      scope: "framework scope"
      source: "MARRMoT_model superclass + concrete model files (m_07_gr4j_4p_2s, m_29 HYMOD)"
      status: "adopted"
