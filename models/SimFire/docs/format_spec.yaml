- id: dt_011
  symptom: Fire spreads in cross/diamond pattern instead of realistic ellipse shape.
  diagnosis: diagonal_spread set to false, limiting fire to 4-connected neighbors.; With diagonal_spread=false,
    fire can only spread to 4 adjacent pixels (N,S,E,W). This produces diamond-shaped fire patterns instead
