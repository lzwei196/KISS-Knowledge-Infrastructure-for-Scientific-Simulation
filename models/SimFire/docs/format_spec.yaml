    and calls .json() on the re
  remedy: 'Install the LFPS v2 shim before building Config.; convert_landfire_to_simfire; [''from convert_landfire_to_simfire
    import install_lfps2_shim'', "install_lfps2_shim(email=''you@example.org'')   # BEFORE Config(...)",
    "Then use simfire''s operational path unchanged", "The shim also finds the AOI under the '
  severity: fatal
- id: dt_021
  symptom: Simulated fire spreads 2-3x too fast even though the wind speed in the YAML matches the observed
