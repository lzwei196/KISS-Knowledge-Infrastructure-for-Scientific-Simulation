# Alpine3D Diagnostic Triplets
# Format: symptom → diagnosis → remedy
# 18 entries covering unit conversion traps and configuration errors

- id: dt_001
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Model crashes immediately or snow surface temperature approaches absolute zero.
      Error log may show "T_CRAZY_MIN" filter triggered or segfault in energy balance.
    error_pattern: "crazy temperature|T_CRAZY_MIN|segfault"
    detection_method: log_match
  diagnosis:
    root_cause: >
      Air temperature (TA) provided in Celsius instead of Kelvin. Alpine3D expects all
      temperatures in SMET files to be in Kelvin. A value of 20 (°C) is interpreted as
      20 K (-253°C), far below the T_CRAZY_MIN threshold (default 210 K).
    explanation: >
      MeteoIO reads raw values from SMET fields and passes them directly to SNOWPACK.
      The min_max filter on TA (default range 240–320 K) will flag Celsius values as
      nodata, leaving gaps that crash the interpolation or energy balance.
    affected_components:
      - convert_forcing_to_smet.py
      - io.ini [Filters] section
  remedy:
    action: "Add 273.15 to all temperature values before writing SMET files"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Open the SMET file and check TA values: they should be 230–320 range"
      - "If values are -40 to +40, they are in Celsius — add 273.15"
      - "Also check TSS, TSG fields if present"
    prevention: >
      In convert_forcing_to_smet.py, validate that mean(TA) > 200 before writing.
      Add assertion: assert ta_values.mean() > 200, "TA appears to be in Celsius"
  severity: silent
  cross_references: [dt_009]

- id: dt_002
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Entire domain shows 100% relative humidity. Snowfall occurs every timestep even
      when observations show clear sky. SWE accumulates unrealistically fast.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Relative humidity (RH) provided as percentage (0–100) instead of fraction (0–1).
      The RH min_max filter clips values to max=1.0, so all values above 1 become 1.0
      (saturated atmosphere).
    explanation: >
      With RH=1.0 everywhere, the dewpoint equals air temperature. The precipitation
      phase algorithm sees constant saturation and generates precipitation at every
      timestep where temperature is below the rain/snow threshold.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Divide RH values by 100 if they are in percent range"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check SMET file: RH values should be 0.0–1.0"
      - "If values are 30–100, divide by 100"
    prevention: >
      Add check: if rh_values.max() > 1.5, assume percent and divide by 100.
  severity: silent
  cross_references: []

- id: dt_003
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Wind speeds appear extremely high (>50 m/s regularly). Turbulent fluxes are
      unrealistically large. Snow erosion is excessive. The VW min_max filter may
      flag many values as nodata.
    error_pattern: "wind.*nodata|VW.*filter"
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Wind speed (VW) provided in km/h instead of m/s. A typical wind of 20 km/h
      is interpreted as 20 m/s (72 km/h, near-gale force).
    explanation: >
      The VW filter range (default 0.2–50 m/s) will pass most km/h values but the
      physics will compute vastly excessive sensible heat flux and snow erosion.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Divide wind speed by 3.6 to convert km/h to m/s"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check VW values: typical mountain values are 0–15 m/s"
      - "If values are frequently >20, they may be in km/h"
    prevention: >
      Validate: assert vw_values.quantile(0.99) < 30, "VW may be in km/h"
  severity: silent
  cross_references: []

- id: dt_004
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Wind direction values cluster near 0–6.28 instead of 0–360. Liston wind
      interpolation produces incorrect terrain-adjusted wind fields. Wind patterns
      show no correlation with topography.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Wind direction (DW) provided in radians instead of degrees. Alpine3D expects
      meteorological convention: 0=N, 90=E, 180=S, 270=W.
    explanation: >
      All DW values in radians (0–2π ≈ 0–6.28) fall in the 0–6.28° range, meaning
      the model sees nearly all wind coming from the North. The Liston wind
      interpolation algorithm adjusts for terrain, but with wrong input directions
      the corrections are meaningless.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Convert radians to degrees: DW_deg = DW_rad * 180 / π"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check DW values: should span 0–360"
      - "If max(DW) < 7, values are likely in radians"
    prevention: >
      Add check: if dw_values.max() < 10, assume radians and convert.
  severity: silent
  cross_references: []

- id: dt_005
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Precipitation is 1000x too high. SWE reaches tens of meters in the first week.
      Lake and river flooding. Model may crash from excessive snow layers.
    error_pattern: "too many elements|memory"
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Precipitation (PSUM) provided in meters instead of mm (kg/m²). 1 mm of rain
      input as 0.001 is correct, but 1 mm input as 1.0 m gives 1000x excess.
    explanation: >
      SMET PSUM field is in kg/m² which equals mm water equivalent. Some reanalysis
      datasets (e.g., ERA5) provide precipitation in meters. The factor-1000 error
      causes extreme snow accumulation.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Multiply by 1000 if precipitation is in meters (m → mm)"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check PSUM values: hourly values should typically be 0–10 mm"
      - "If values are 0–0.01, they are likely in meters"
    prevention: >
      Validate: warn if max(PSUM) < 0.1 over a month (likely in meters).
  severity: silent
  cross_references: []

- id: dt_006
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Atmospheric pressure ~1000 Pa instead of ~100000 Pa. The STD_PRESS spatial
      interpolation produces incorrect barometric corrections. Turbulent flux
      calculations are affected.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Pressure (P) provided in hPa (mbar) instead of Pa. Sea-level pressure is
      ~1013 hPa = 101300 Pa.
    explanation: >
      With P=1013 Pa (instead of 101300), the air density computed by the model is
      ~100x too low, causing sensible and latent heat fluxes to be underestimated.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Multiply pressure by 100 to convert hPa to Pa"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check P values: should be 50000–110000 Pa"
      - "If values are 500–1100, they are in hPa"
    prevention: >
      Add check: if p_values.mean() < 2000, assume hPa and multiply by 100.
  severity: silent
  cross_references: []

- id: dt_007
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Shortwave radiation values are tiny (0–30 instead of 0–1000). Snow never melts
      in spring. Energy balance shows near-zero solar input.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Incoming shortwave radiation (ISWR) in MJ/m²/day instead of W/m². Typical
      summer daily total is ~25 MJ/m²/day = ~290 W/m² average.
    explanation: >
      With ISWR=25 W/m² (instead of 290), the energy balance receives only 8.6%
      of the actual solar forcing. Snow melt is severely underestimated.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Convert MJ/m²/day to W/m²: multiply by 1e6/86400 = 11.574"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check ISWR values: peak summer values should be 800–1200 W/m²"
      - "If peak values are 20–35, they are in MJ/m²/day"
    prevention: >
      Validate: assert iswr_values.max() > 100, "ISWR appears to be in MJ/m²/day"
  severity: silent
  cross_references: [dt_008]

- id: dt_008
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Longwave radiation values are tiny (5–30 instead of 150–400). The ILWR
      generator kicks in constantly, overriding measurements. Surface temperature
      drops unrealistically at night.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Incoming longwave radiation (ILWR) in MJ/m²/day instead of W/m². Typical
      value is ~300 W/m² = ~26 MJ/m²/day.
    explanation: >
      With ILWR=26 W/m² instead of 300, the atmosphere appears almost transparent
      to longwave radiation. The ALLSKY_LW generator may replace these values if
      configured, masking the error for ILWR but not for stations with measurements.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Convert MJ/m²/day to W/m²: multiply by 1e6/86400 = 11.574"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check ILWR values: should be 150–400 W/m²"
      - "If values are 10–35, they are in MJ/m²/day"
    prevention: >
      Validate: assert ilwr_values.mean() > 100, "ILWR appears to be in MJ/m²/day"
  severity: silent
  cross_references: [dt_007]

- id: dt_009
  stage: s2_met_forcing
  failure_domain: unit_conversion
  symptom:
    description: >
      Initial snow height (HS) is 100x too large. Model initializes with 100+ m of snow.
      Or HS is always near zero despite known snowpack.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Snow height (HS) provided in cm instead of meters. A 1 m snowpack entered as
      100 (cm) becomes 100 m in the model.
    explanation: >
      HS in SMET is in meters. This field is used both for validation and, when
      ENFORCE_MEASURED_SNOW_HEIGHTS=TRUE, to force the snow depth, making errors
      catastrophic.
    affected_components:
      - convert_forcing_to_smet.py
  remedy:
    action: "Divide HS values by 100 to convert cm to m"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "Check HS values: typical values are 0–5 m"
      - "If values are 0–500, they are in cm"
    prevention: >
      Validate: assert hs_values.max() < 20, "HS appears to be in cm"
  severity: silent
  cross_references: [dt_001]

- id: dt_010
  stage: s3_initial_conditions
  failure_domain: unit_conversion
  symptom:
    description: >
      Soil layers are absurdly thick (50–100 m) or paper thin (0.001 m when expecting
      0.5 m). Snow layers have wrong thickness. Total column height is unrealistic.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Layer_Thick in .sno file is in wrong units. Alpine3D expects meters.
      Common errors: cm (÷100), mm (÷1000), or feet (×0.3048).
    explanation: >
      Each layer's thickness (hl field) in the .sno file must be in meters. The sum
      of all layer thicknesses must equal the total column height. Wrong thickness
      causes element count explosion or impossibly thin elements that trigger the
      MINIMUM_L_ELEMENT check.
    affected_components:
      - generate_sno_files.py
  remedy:
    action: "Ensure all Layer_Thick values are in meters"
    tool_to_run: generate_sno_files
    manual_steps:
      - "Check .sno file: Layer_Thick for soil should be 0.1–2.0 m"
      - "Sum of thicknesses should equal total column height"
    prevention: >
      Assert: 0.01 < layer_thick < 10.0 for each layer.
  severity: silent
  cross_references: [dt_011]

- id: dt_011
  stage: s3_initial_conditions
  failure_domain: unit_conversion
  symptom:
    description: >
      Grain radius values in .sno file are 1000x too small or too large. Metamorphism
      model produces unrealistic grain growth. Albedo parameterization gives wrong values.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Grain radius (rg) in .sno file must be in mm. Providing µm (÷1000) or m (×1000)
      produces unrealistic snow microstructure.
    explanation: >
      Typical fresh snow grain radius is 0.1–0.3 mm, old snow 0.5–2.0 mm. Values in
      µm (100–300) are 1000x too large in mm scale, causing the albedo model to
      predict extremely low albedo (dark snow).
    affected_components:
      - generate_sno_files.py
  remedy:
    action: "Ensure rg is in mm. Convert µm: ÷1000. Convert m: ×1000"
    tool_to_run: generate_sno_files
    manual_steps:
      - "Check rg values: should be 0.1–5.0 mm for snow"
      - "If values are 100–5000, they are in µm"
    prevention: >
      Assert: 0.05 < rg < 10.0 for each layer.
  severity: silent
  cross_references: [dt_010]

- id: dt_012
  stage: s3_initial_conditions
  failure_domain: unit_conversion
  symptom:
    description: >
      Soil density is 1000x too low (1.8 instead of 1800 kg/m³). Soil thermal
      conductivity is wrong. Soil heat capacity is wrong. Ground temperature
      evolution is unrealistic.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      Soil density (Rho_S) in .sno file provided in g/cm³ instead of kg/m³.
      Typical mineral soil density: 1.5–2.7 g/cm³ = 1500–2700 kg/m³.
    explanation: >
      With density 1.8 kg/m³ (instead of 1800), the soil has essentially no thermal
      mass and heats/cools instantly with air temperature. Permafrost simulations
      will show no permafrost. Soil temperature has no seasonal lag.
    affected_components:
      - generate_sno_files.py
  remedy:
    action: "Multiply soil density by 1000 to convert g/cm³ to kg/m³"
    tool_to_run: generate_sno_files
    manual_steps:
      - "Check Rho_S values: should be 1000–2700 kg/m³"
      - "If values are 1.0–2.7, they are in g/cm³"
    prevention: >
      Assert: rho_s > 500 for soil layers.
  severity: silent
  cross_references: []

- id: dt_013
  stage: s0_configuration
  failure_domain: unit_conversion
  symptom:
    description: >
      Geothermal heat flux is 1000x too high. Soil bottom boundary melts snow from
      below. Basal melt is dominant even in winter.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      GEO_HEAT parameter in [Snowpack] section provided in mW/m² instead of W/m².
      Typical geothermal heat flux: 50–100 mW/m² = 0.05–0.1 W/m².
    explanation: >
      With GEO_HEAT=60 (mW/m² entered as W/m²), the basal heat flux is 1000x the
      actual value, causing rapid melting from below.
    affected_components:
      - io.ini [Snowpack] section
  remedy:
    action: "Divide by 1000: GEO_HEAT = 0.06 (not 60)"
    tool_to_run: null
    manual_steps:
      - "Check GEO_HEAT value: should be 0.01–0.15 W/m²"
      - "If value is 10–150, it's in mW/m²"
    prevention: >
      Validate in run_alpine3d.py: warn if GEO_HEAT > 1.0
  severity: silent
  cross_references: []

- id: dt_014
  stage: s0_configuration
  failure_domain: unit_conversion
  symptom:
    description: >
      Turbulent exchange is extremely high. Sensible and latent heat fluxes dominate
      the energy balance. Snow sublimation is unrealistically high.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      ROUGHNESS_LENGTH in [Snowpack] section provided in mm instead of meters.
      Typical snow roughness: 0.1–5 mm = 0.0001–0.005 m.
    explanation: >
      With ROUGHNESS_LENGTH=2.0 (mm entered as m), the surface roughness is 1000x
      too large. The Monin-Obukhov turbulent flux parameterization scales with
      ln(z/z0), so excessive roughness dramatically increases exchange coefficients.
    affected_components:
      - io.ini [Snowpack] section
  remedy:
    action: "Divide by 1000: ROUGHNESS_LENGTH = 0.002 (not 2.0)"
    tool_to_run: null
    manual_steps:
      - "Check ROUGHNESS_LENGTH: should be 0.0001–0.01 m"
      - "If value is 0.1–10, it may be in mm or cm"
    prevention: >
      Validate in run_alpine3d.py: warn if ROUGHNESS_LENGTH > 0.05
  severity: silent
  cross_references: []

- id: dt_015
  stage: s0_configuration
  failure_domain: parameter_format
  symptom:
    description: >
      Precipitation is either doubled or halved compared to observations. SWE
      diverges from station data proportionally to simulation length.
    error_pattern: ""
    detection_method: statistical
  diagnosis:
    root_cause: >
      Mismatch between CALCULATION_STEP_LENGTH (minutes) and PSUM::ARG1::PERIOD
      (seconds). If the accumulation period is shorter than the timestep, precipitation
      is undercounted. If longer, it may be double-counted.
    explanation: >
      The ACCUMULATE resampler sums precipitation over the specified period. If
      CALCULATION_STEP_LENGTH=15 min, then PSUM::ARG1::PERIOD should be 900 s.
      Setting PERIOD=1800 with a 15-min timestep means each timestep gets 30 min
      of accumulated precip, doubling the input.
    affected_components:
      - io.ini [Interpolations1D] and [Snowpack] sections
  remedy:
    action: >
      Ensure PSUM::ARG1::PERIOD (seconds) = CALCULATION_STEP_LENGTH (minutes) × 60.
      Example: 15 min timestep → PERIOD = 900
    tool_to_run: null
    manual_steps:
      - "Check CALCULATION_STEP_LENGTH in [Snowpack] (in minutes)"
      - "Check PSUM::ARG1::PERIOD in [Interpolations1D] (in seconds)"
      - "Verify: PERIOD = STEP × 60"
    prevention: >
      Validate in run_alpine3d.py: assert period == step_length * 60
  severity: degraded
  cross_references: []

- id: dt_016
  stage: s0_configuration
  failure_domain: parameter_format
  symptom:
    description: >
      Alpine3D runs but produces incorrect spatial patterns. Each grid cell behaves
      as if it were an independent point simulation. Terrain radiation and spatial
      interpolation are not working properly.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      ALPINE3D = FALSE in [SnowpackAdvanced] section. This flag must be TRUE when
      running Alpine3D (it defaults to FALSE for standalone SNOWPACK).
    explanation: >
      When ALPINE3D=FALSE, SNOWPACK operates in point mode even though Alpine3D
      is calling it. The distributed forcing and terrain effects are not properly
      communicated to the snow model. Results will be physically incorrect.
    affected_components:
      - io.ini [SnowpackAdvanced] section
  remedy:
    action: "Set ALPINE3D = TRUE in [SnowpackAdvanced]"
    tool_to_run: null
    manual_steps:
      - "Open io.ini"
      - "Find [SnowpackAdvanced] section"
      - "Set ALPINE3D = TRUE"
    prevention: >
      run_alpine3d.py validates this automatically before execution.
  severity: silent
  cross_references: []

- id: dt_017
  stage: s1_domain_setup
  failure_domain: parameter_format
  symptom:
    description: >
      Segmentation fault at startup. No meaningful error message. Crash occurs during
      grid initialization before any timestep is computed.
    error_pattern: "segfault|Segmentation fault|SIGSEGV"
    detection_method: log_match
  diagnosis:
    root_cause: >
      DEM and land-use grids have different dimensions (ncols, nrows) or different
      spatial extent (xllcorner, yllcorner, cellsize). Alpine3D reads both grids
      and indexes them by row/column, so a mismatch causes out-of-bounds access.
    explanation: >
      Both the DEM (.dem) and land-use (.lus) files must be ARC ASCII grids with
      identical headers. Even a 1-cell difference causes undefined behavior.
    affected_components:
      - DEM and land-use grid files
  remedy:
    action: "Ensure DEM and land-use grids have identical ARC headers"
    tool_to_run: null
    manual_steps:
      - "Compare headers of .dem and .lus files"
      - "ncols, nrows, xllcorner, yllcorner, cellsize must be identical"
      - "Regenerate land-use grid from DEM extent if needed"
    prevention: >
      run_alpine3d.py compares grid headers before execution.
  severity: fatal
  cross_references: [dt_018]

- id: dt_018
  stage: s1_domain_setup
  failure_domain: parameter_format
  symptom:
    description: >
      Spatial interpolation produces garbage values. Temperature lapse rate
      corrections are wrong. Stations appear to be at wrong elevations. No crash
      but results are physically meaningless.
    error_pattern: ""
    detection_method: value_comparison
  diagnosis:
    root_cause: >
      COORDSYS in io.ini does not match the actual coordinate system of the DEM.
      For example, DEM is in UTM but COORDSYS=CH1903, or DEM is in WGS84 but
      COORDSYS=UTM.
    explanation: >
      MeteoIO uses COORDSYS to convert between station coordinates and grid coordinates.
      If the coordinate system is wrong, stations are placed at incorrect grid cells
      and elevations, making all spatial interpolation incorrect.
    affected_components:
      - io.ini [Input] COORDSYS
      - DEM file coordinate system
  remedy:
    action: "Verify COORDSYS matches the DEM's actual coordinate system"
    tool_to_run: null
    manual_steps:
      - "Check DEM xllcorner/yllcorner values"
      - "If values are ~46/~9 (lat/lon), use COORDSYS=WGS84 or LATLON"
      - "If values are ~600000/~200000, likely CH1903"
      - "If values are ~500000/~5000000, likely UTM"
    prevention: >
      run_alpine3d.py checks coordinate ranges against COORDSYS.
  severity: silent
  cross_references: [dt_017]

- id: dt_019
  stage: s2_meteorological_forcing
  failure_domain: coordinate_system
  symptom:
    description: >
      MeteoIO refuses the SMET file at startup with "Inconsistent geographic
      coordinates ... Latitude/longitude and xllcorner/yllcorner don't match
      for given coordinate (UTM zone should probably be NNT instead of NNN)".
    error_pattern: "Inconsistent geographic coordinates|UTM zone should probably be"
    detection_method: log_match
  diagnosis:
    root_cause: >
      COORDPARAM uses N/S hemisphere notation (e.g. "12N") instead of MGRS
      latitude band letters (e.g. "12T" for 40-48 N, "12S" for 32-40 N).
      MeteoIO expects MGRS-style band letters; "N" is rejected for sites in
      band T.
    explanation: >
      MeteoIO's Coords class interprets the second character of COORDPARAM
      as an MGRS band letter, not as a hemisphere flag. Common mistake when
      converting CH1903 examples (which need no zone) to UTM.
    affected_components:
      - io.ini [INPUT]/[OUTPUT] COORDPARAM
      - SMET station header epsg vs lat/lon mismatch
  remedy:
    action: "Use MGRS band letter, e.g. 12T for 40-48 N, 11T for Idaho/Utah, 10T for WA/OR"
    tool_to_run: null
    manual_steps:
      - "Identify latitude band: <32 R, 32-40 S, 40-48 T, 48-56 U"
      - "Set COORDPARAM=<zone><band> in BOTH [INPUT] and [OUTPUT]"
      - "Confirm SMET 'easting'/'northing' match lat/lon under same EPSG"
    prevention: >
      build_site.py computes band automatically from latitude.
  severity: blocking

- id: dt_020
  stage: s2_meteorological_forcing
  failure_domain: precipitation_bias
  symptom:
    description: >
      Sim SWE is plausible-looking (right timing, r ~ 0.7) but PBIAS is
      strongly negative (around -70%) — the model produces only a fraction
      of the snow water observed at the SNOTEL pillow. Annual sum of
      "observed" precip is often less than the pillow's peak SWE for that
      year, which is physically impossible without correction.
    error_pattern: null
    detection_method: metric_inspection
  diagnosis:
    root_cause: >
      Gauge undercatch on solid precipitation. NRCS SNOTEL precipitation
      gauges underreport snowfall by 20-60% in wind. Without correction,
      the model receives less water than actually fell.
    explanation: >
      Hellmann-shielded gauge catch ratio for snow is approximately
      exp(-0.056 * VW) where VW is wind speed. At VW=2 m/s correction is
      ~+12%; at VW=5 m/s it is ~+33%.
    affected_components:
      - io.ini [FILTERS] PSUM filter chain
  remedy:
    action: "Enable PSUM::filter::undercatch_wmo with type=Hellmannsh"
    tool_to_run: null
    manual_steps:
      - "Append to io.ini [FILTERS]: PSUM::filterN = undercatch_wmo"
      - "                            PSUM::argN::type = Hellmannsh"
      - "Ensure VW field exists in SMET (use cosine seasonal cycle if no obs)"
    prevention: >
      Stillberg's reference io.ini already enables this; do not drop it
      when adapting to new sites.
  severity: silent

- id: dt_021
  stage: s2_meteorological_forcing
  failure_domain: data_quality
  symptom:
    description: >
      Run aborts mid-simulation with "Not enough input meteo data on
      YYYY-MM-DDTHH:MM:SS" and a backtrace through MeteoObj::getMeteo.
      Common in single-station setups when the upstream gauge has a NaN day.
    error_pattern: "Not enough input meteo data"
    detection_method: log_match
  diagnosis:
    root_cause: >
      With only one station, MeteoIO's spatial interpolation has no fallback
      data to fill nodata at any time step. Even a single NaN TA value in
      the SMET causes failure once the model reaches that timestamp.
    explanation: >
      The interpolators require at least one valid value across the station
      set. A SMET row with TA=-999 and no other station means no value
      exists for the algorithm.
  remedy:
    action: "Linearly interpolate short TA gaps (limit ~7 days) before writing SMET"
    tool_to_run: convert_forcing_to_smet
    manual_steps:
      - "df['TA'] = df['TA'].interpolate(limit=7, limit_direction='both')"
      - "For PSUM accumulator gaps: ffill().bfill() then diff()"
      - "Drop sites where the longest NaN run exceeds ~30 days (sensor dead)"
    prevention: >
      build_site.py performs limit=7 day TA interpolation and prints the
      number of filled NaN values; sites with 1000+ NaN are clearly
      unusable (Brooklyn Lake WY 367 had a 1136-day run of NaN).
  severity: blocking

- id: dt_022
  stage: s2_meteorological_forcing
  failure_domain: radiation_fabrication
  symptom:
    description: >
      Sim SWE is collapsed near zero across all winters even though TA and
      PSUM look reasonable. ILWR in output time series is implausibly low
      or constant; ISWR pattern doesn't match solar position.
    error_pattern: null
    detection_method: metric_inspection
  diagnosis:
    root_cause: >
      ILWR/ISWR were synthesized by an upstream Python step and provided in
      the SMET, replacing what MeteoIO's own generators would have produced.
      Common upstream mistakes: clear-sky-only ILWR (too low), latitude/DOY
      ISWR (no cloud effect), constant RH (breaks Unsworth ILWR closure).
    explanation: >
      MeteoIO ships robust radiation generators (CLEARSKY_SW, ALLSKY_LW
      Unsworth, CLEARSKY_LW Dilley) that use solar position + TA + RH to
      produce physically consistent values. Replacing them with hand-rolled
      formulas typically lowers the surface energy budget enough to delay
      melt and suppress accumulation.
  remedy:
    action: "Do NOT supply ISWR/ILWR in the SMET; let MeteoIO generators fill them"
    tool_to_run: null
    manual_steps:
      - "Remove ISWR and ILWR columns from SMET 'fields ='"
      - "Add to io.ini [GENERATORS]:"
      - "  ISWR::generator1 = CLEARSKY_SW"
      - "  ILWR::generator1 = ALLSKY_LW"
      - "  ILWR::arg1::type = Unsworth"
      - "  ILWR::generator2 = CLEARSKY_LW"
      - "  ILWR::arg2::type = Dilley"
    prevention: >
      build_site.py omits ISWR/ILWR from the SMET fields by design.
  severity: silent

- id: dt_023
  stage: s2_meteorological_forcing
  failure_domain: precipitation_bias
  symptom:
    description: >
      At a deep MARITIME snow site (e.g. Paradise WA, Mt Rainier) the
      simulated SWE has decent timing (r ~ 0.6) but two compounding errors:
      (1) accumulation reaches only ~40% of the observed pillow, and
      (2) the pack peaks in Jan-Mar and melts out months early, so the
      Apr-Jun sim/obs SWE ratio collapses to <0.10. Net SWE PBIAS approaches
      -77%. dt_020's undercatch_wmo filter alone does NOT fix it.
    error_pattern: null
    detection_method: metric_inspection
  diagnosis:
    root_cause: >
      Two independent maritime failure modes stack. First, the SNOTEL gauge
      undercatch is far larger than the wind-only undercatch_wmo correction
      can recover (gauge ~1660 mm/yr cannot build a 2.3 m SWE pillow; true
      precip incl. orographic enhancement is ~3000+ mm/yr). Second, the
      single-station forcing fabricates a +/-6 K diurnal TA cycle and uses a
      high ROUGHNESS_LENGTH (0.01 m); together these drive excessive
      turbulent melt energy, so a warm maritime pack ablates far too fast.
    explanation: >
      Continental sites tolerate the defaults because the pack is cold and
      melt is radiation-limited. Maritime packs are near-isothermal and
      turbulent-flux-limited, so roughness and the synthetic diurnal
      amplitude dominate the melt rate.
    affected_components:
      - SMET PSUM magnitude (gauge undercatch)
      - SMET TA diurnal disaggregation amplitude
      - io.ini [SNOWPACK] ROUGHNESS_LENGTH
      - io.ini [Interpolations2D] PSUM_PH snow threshold
  remedy:
    action: "Maritime mode: multiplicative precip correction + suppress turbulent melt"
    tool_to_run: convert_forcing_to_smet.py --precip-undercatch-factor 1.9
    manual_steps:
      - "Multiply PSUM by ~1.9 (convert_forcing_to_smet.py --precip-undercatch-factor),"
      - "  OR set precip_factor in build_site.py SITES[...] for SNOTEL disaggregation."
      - "Damp synthetic diurnal TA amplitude from 6 K to ~2.5 K (diurnal_amp)."
      - "Lower ROUGHNESS_LENGTH from 0.01 to ~0.003 m to cut turbulent melt."
      - "Raise PSUM_PH snow threshold from 274.35 to ~275.35 K so more wet"
      - "  precip is treated as snow."
    prevention: >
      build_site.py now carries per-site maritime overrides (precip_factor,
      diurnal_amp, roughness, snow_thresh_K) on Paradise_WA. Continental
      sites keep factor=1.0 / amp=6 / roughness=0.01 defaults.
  severity: silent
  cross_references: [dt_020, dt_014]

- id: dt_024
  stage: s2_meteorological_forcing
  failure_domain: precipitation_bias
  symptom:
    description: >
      Simulated SWE has GOOD timing (r 0.7-0.85) but is systematically
      40-60% too low at EVERY SNOTEL site, continental and maritime alike,
      and NSE stalls around 0.31-0.39 no matter what is tuned. The forcing
      SMET's annual PSUM total is roughly HALF the site's known annual
      precipitation, and often less than the observed peak SWE.
    error_pattern: null
    detection_method: metric_inspection
  diagnosis:
    root_cause: >
      The NRCS SNOTEL daily export column "Precipitation Accumulation (in)
      Start of Day Values" is the DAILY INCREMENT in inches, NOT a water-year
      cumulative, despite its name. Applying .diff().clip(lower=0) to it (as
      t3_runs/build_site.py build_snotel_forcing did) keeps only the
      day-over-day INCREASES of an already-incremental series and silently
      discards ~44% of the precipitation.
    explanation: >
      Verified at SNOTEL 590 over 2005-10..2015-09: raw column sums to
      1069 mm/yr vs 604 mm/yr after differencing; the largest single value in
      ten years is 2.10 in (a water-year cumulative would exceed 40 in); only
      70% of day-to-day steps are non-negative. Same ratio at 828 (1106 vs
      669), 637 (1200 vs 718) and 679 Paradise (3832 vs 1740). Because the
      loss is a near-constant fraction, TIMING survives (r stays high) and
      only the magnitude collapses -- which is why the deficit was repeatedly
      misdiagnosed as gauge undercatch, orographic enhancement or pillow
      over-read, and "corrected" with a multiplicative factor (dt_023's x1.9
      is close to the reciprocal of the Paradise loss, 3832/1740 = 2.2).
    affected_components:
      - SNOTEL daily CSV precipitation column interpretation
      - SMET PSUM magnitude
      - any precip_factor tuned to compensate for it
  remedy:
    action: "Use the SNOTEL precipitation column AS IS (daily increment); convert in -> mm"
    tool_to_run: "convert_forcing_to_smet.py --precip-unit in --daily-disaggregate"
    manual_steps:
      - "Do NOT .diff() the 'Precipitation Accumulation ... Start of Day Values' column."
      - "Pass it straight through as the daily total, declaring --precip-unit in."
      - "Sanity check: annual PSUM should EXCEED observed peak SWE, typically"
      - "  peak_SWE / annual_P ~ 0.6-0.9 at a continental SNOTEL site."
      - "Re-derive any precip_factor AFTER fixing this; a factor >1.5 on SNOTEL"
      - "  forcing is now a red flag that the differencing bug is still present."
    prevention: >
      convert_forcing_to_smet.py accepts --precip-unit in and carries the
      daily->hourly disaggregation, so the SNOTEL recipe no longer needs the
      out-of-KI driver. SKILL.md's "READ FIRST" section documents the column
      semantics with the per-site evidence table.
  severity: silent
  cross_references: [dt_005, dt_020, dt_023]

- id: dt_025
  stage: s3_initial_conditions
  failure_domain: parameter_format
  symptom:
    description: >
      Alpine3D aborts at startup unable to read an initial snow cover, or
      starts but the snowpack never accumulates / behaves degenerately, even
      though .sno files exist in SNOWPATH.
    error_pattern: "(snowCoverExists|Cannot read snow cover|Invalid.*sno|nSoilLayerData)"
    detection_method: runtime_error
  diagnosis:
    root_cause: >
      Three independent .sno format contracts are easy to break, and
      generate_sno_files.py violated all three before 2026-08-09:
      (1) FILE NAME -- Alpine3D looks for <ix>_<iy>_<EXPERIMENT>.sno (ix =
      column, iy = row from the BOTTOM) or <EXPERIMENT>_<landuse_code>.sno
      (SnowpackInterface.cc ~L1258-1260). Nothing else is found.
      (2) LAYER COLUMNS are parsed POSITIONALLY (SmetIO.cc ~L417-457) and
      must be the 18 numeric fields "... rg rb dd sp mk mass_hoar ne CDot
      metamo". Omitting `ne` shifts every later column one position left, so
      CDot is read as the element count and the layer initialises with ne=0.
      (3) HEADER KEYS are looked up literally: SoilAlbedo (not SoilAlb) and
      CanopyLeafAreaIndex (not CanopyLAI).
    explanation: >
      Additionally, layers are read BOTTOM -> TOP, so a surface-first
      thickness list puts the thin skin layer at the base of the soil column,
      and projected DEM metres must go in easting/northing/epsg rather than
      the latitude/longitude header keys.
    affected_components:
      - input/snowfiles/*.sno file names
      - .sno fields line and layer column order
      - .sno header key spelling
  remedy:
    action: "Regenerate .sno with the corrected tool and the run's EXPERIMENT name"
    tool_to_run: "generate_sno_files.py --naming landuse --experiment <EXPERIMENT> --landuse-code <code> --epsg <epsg>"
    manual_steps:
      - "Confirm [Output]::EXPERIMENT in io.ini, then check that a matching"
      - "  <EXPERIMENT>_<luscode>.sno or <ix>_<iy>_<EXPERIMENT>.sno exists."
      - "Count tokens on the fields line: 19 including timestamp."
      - "Confirm the ne column exists and is 1, not absent."
      - "Confirm header keys SoilAlbedo / CanopyLeafAreaIndex."
      - "Confirm the FIRST [DATA] row is the DEEPEST (thickest, warmest) layer."
    prevention: >
      generate_sno_files.py emits all of the above correctly and exposes
      --experiment / --naming / --landuse-code / --epsg. SKILL.md's "SNO
      (Initial Snow/Soil Profile)" section and Critical Domain Knowledge
      item 7 now state the conventions explicitly.
  severity: fatal
  cross_references: [dt_010, dt_011, dt_016]
