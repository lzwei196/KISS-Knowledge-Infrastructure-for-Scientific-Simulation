    value interac
  remedy: 'Reduce IWU to 50 or lower for initial runs; increase WM minimum; [''Set IWU=50 for a moderate
    initialization'', ''Check WM grid minimum: gdalinfo -stats wm.tif'', ''If WM minimum < 10, increase
    WM scalar'']; Use state files from a spin-up run instead of IWU for warm starts'
  severity: warning
