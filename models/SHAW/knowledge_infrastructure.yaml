# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: SHAW
  language: fortran
  implementation:
    id: shaw-303
    version: v3.03
    provenance: Fortran 77; SHAW v3.03 (Gerald N. Flerchinger, USDA-ARS Northwest Watershed Research Center)
      compiled to the shaw303 binary.
  scientific_reference_version: SHAW v3.03 (Flerchinger 2017 Technical Documentation NWRC 2017-1; Flerchinger
    & Saxton 1989 theory)
  binary:
    path: KISSPATH_BINARIES/shaw/shaw
    type: ELF
pipeline:
  stages:
  - s1_site_setup
  - s2_weather_prep
  - s3_plant_config
  - s4_initial_conditions
  - s5_snow_residue_config
  - s6_execution
  - s7_vic_coupling
tools:
  count: 13
  files:
  - s1_site_setup/tools/create_site_file.py
  - s2_weather_prep/tools/convert_forcing_to_shaw.py
  - s3_plant_config/tools/create_plant_file.py
  - s4_initial_conditions/tools/set_initial_conditions.py
  - s5_snow_residue_config/tools/configure_residue.py
  - s5_snow_residue_config/tools/configure_snow_params.py
  - s6_execution/tools/parse_shaw_output.py
  - s6_execution/tools/plot_shaw_profiles.py
  - s6_execution/tools/run_shaw.py
  - s6_execution/tools/shaw_frost_analysis.py
  - s6_execution/tools/validate_shaw_inputs.py
  - s7_vic_coupling/tools/vic_to_shaw_soil.py
  - tools/s1_site_setup/setup_shaw_from_template.py
inputs:
  forcing:
  - name: air_temperature
    unit: degC
  - name: wind_speed
    unit: m/s (IFLAGSI=1)
  - name: relative_humidity
    unit: percent
  - name: dewpoint_temperature
    unit: degC
  - name: precipitation
    unit: mm (IFLAGSI=1)
  - name: solar_radiation
    unit: W/m2
  - name: new_snow_density
    unit: g/cm3
  parameters:
  - name: soil_texture (sand/silt/clay/OM)
    unit: percent
  - name: saturated_hydraulic_conductivity (SATCON)
    unit: cm/hr
  - name: bulk_density
    unit: kg/m3
  - name: soil_node_depth (ZS)
    unit: m
  - name: air_entry_potential (BCAP / psi_e)
    unit: m (negative)
  - name: quartz_fraction (QUARTZ)
    unit: fraction 0-1
  - name: pore_size_distribution_index (BPAR / Campbell b)
    unit: dimensionless
  - name: site geometry (lat/lon/slope/aspect/elevation)
    unit: deg / m
  - name: residue thermal/vapor coefficient (RESTKB)
    unit: dimensionless
  - name: canopy/vegetation parameters (LAI, canopy height, stomatal-resistance coefficients, rooting
      depth)
    unit: various
  - name: snow parameters
    unit: various
  - name: solute transport parameters (ASALT/DISPER per species)
    unit: various
  initial_conditions:
  - name: soil_moisture_profile
    unit: volumetric fraction or matric potential
  - name: soil_temperature_profile
    unit: degC
  - name: initial_snow_depth_and_density
    unit: m / kg/m3
  boundary_conditions:
  - name: MTSTEP (weather timestep selector)
    unit: code 0/1/2
  - name: IFLAGSI (unit system selector)
    unit: code 0/1
  - name: MCANFLG (plant canopy flag)
    unit: code 0-3
  - name: NSALT (number of solute species)
    unit: count 0-10
  - name: IWRC (water retention curve selector)
    unit: code 1-3
  - name: ITMPBC (lower temperature boundary method)
    unit: code
  - name: JSTART / JEND (simulation start/end Julian day)
    unit: DOY
  - name: HRNOON (solar noon hour)
    unit: decimal hour
  - name: HEIGHT (measurement reference height)
    unit: m
  - name: NS (number of soil nodes)
    unit: count up to 50
  - name: TOLER (Newton-Raphson convergence tolerance)
    unit: dimensionless
  - name: PONDMX (max ponding depth)
    unit: cm
  - name: NRCHANG (changing-residue file flag)
    unit: code 0/1
  - name: MWATRXT (external soil source/sink flag)
    unit: code 0/1
  - name: LVLOUT output-level selectors
    unit: codes
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - soil_temperature_profile
  - total_water_content_profile
  - liquid_water_content_profile
  - matric_potential_profile
  - frost_thaw_snow_depth
  - surface_energy_balance
  - water_balance_summary
  - vertical_water_flux
  - snow_layer_temperature
  - canopy_air_and_leaf_temperature
  - solute_concentration_profile
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.949, KGE=0.891, R=0.982, 4 scorecard(s)'
  metrics:
    best_nse: 0.9486
    best_kge: 0.891
    best_r: 0.9816
summary:
  total_tools: 13
  total_stage_docs: 7
  total_diagnostic_triplets: 33
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
