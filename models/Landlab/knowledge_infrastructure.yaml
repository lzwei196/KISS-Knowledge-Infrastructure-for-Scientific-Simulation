# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: Landlab
  language: python
  implementation:
    id: landlab
    version: 2.10.1
    provenance: Python with Cython kernels; CSDMS / CU Boulder, U. Washington, Tulane (Landlab Development
      Team); composable process components on a shared model grid.
  scientific_reference_version: Landlab 2.x component-based Earth-surface-dynamics framework (Hobley et
    al. 2017 ESurf 5:21-46; Barnhart et al. 2020 Landlab v2.0 ESurf 8:379-397)
  binary:
    path: KISSPATH_KI_ROOT/Landlab/source/repo/src/landlab/__init__.py
    type: Python
pipeline:
  stages:
  - s1_grid_setup
  - s2_input_preparation
  - s3_soil_parameters
  - s4_component_assembly
  - s5_execution_output
tools:
  count: 8
  files:
  - tools/convert_dem_to_grid.py
  - tools/convert_soil_params.py
  - tools/dissect_atchafalaya_ssc_q_surrogate.py
  - tools/dissect_loess_plateau_sediment_yield.py
  - tools/dissect_loess_plateau_slope_area.py
  - tools/dissect_space_ssc_q_rating.py
  - tools/parse_landlab_output.py
  - tools/run_landlab.py
inputs:
  forcing:
  - name: initial topography / DEM (topographic__elevation)
    unit: m
  - name: rainfall / runoff (water__unit_flux_in)
    unit: m/s
  parameters:
  - name: K_sp (stream-power erodibility)
    unit: length^(1-2*m_sp) / time (e.g. 1/yr at m_sp=0.5, n_sp=1.0)
  - name: m_sp (drainage-area exponent)
    unit: dimensionless
  - name: n_sp (slope exponent)
    unit: dimensionless
  - name: linear_diffusivity (D)
    unit: m^2/yr (when dt in yr)
  - name: v_s (effective settling velocity)
    unit: m/yr (landscape-evolution timescale)
  - name: K_sed / K_br (SPACE alluvium / bedrock erodibility)
    unit: length^(1-2*m) / time
  - name: H_star (alluvial cover decay depth)
    unit: m
  - name: soil_production_maximum_rate (P0)
    unit: m/yr
  - name: soil_production_decay_depth (H*)
    unit: m
  - name: mannings_n (overland-flow roughness)
    unit: s/m^(1/3)
  initial_conditions:
  - name: soil__depth (initial regolith thickness)
    unit: m
  - name: bedrock__elevation
    unit: m
  boundary_conditions:
  - name: grid type and geometry
    unit: n/a
  - name: timestep dt
    unit: yr (landscape evolution) | s (overland flow)
  - name: boundary-node status (status_at_node)
    unit: n/a (NodeStatus code)
  - name: uplift_rate (tectonic forcing)
    unit: m/yr
  - name: runoff_rate (steady-state discharge scaling)
    unit: m/yr (or m/s)
  - name: flow-routing / depression-handling method
    unit: n/a
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - topographic__elevation
  - concavity (theta)
  - steepness (ks)
  - relief
  - sediment_yield
  - sediment__outflux (SPACE Qs)
  - soil__depth
  - surface_water__discharge (steady-state)
  other: []
validation:
  tier: analytic
  tier_justification: 'measured: NSE=0.542, KGE=0.565, R=0.999, 2 scorecard(s)'
  metrics:
    best_nse: 0.542
    best_kge: 0.565
    best_r: 0.9994
summary:
  total_tools: 8
  total_stage_docs: 5
  total_diagnostic_triplets: 22
  generated: '2026-08-15'
