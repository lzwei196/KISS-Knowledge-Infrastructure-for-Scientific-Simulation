schema_version: 1
model_id: SFINCS
domain: hazard
generated_by: "self-improve session (Claude Opus 4.8, 1M) — validation-convention Step-B, in-cache literature"
generated_at: 2026-07-09

# Grounded ONLY in locally-cached OA full texts. Two gradeable blocks (the only quantities with an
# obs binding in the dag / obs_map): flood_extent (spatial_snapshot, CSI) and water_level
# (point_time_series at his-points). SFINCS depth (hmax) and instantaneous/surface-elevation vars
# (zsmax, zs) carry NO obs binding in the dag, so no gradeable block is emitted for them; the
# high-water-mark depth convention is noted inside the flood_extent / water_level blocks instead.
#
# Headline metrics for water_level follow the field's ABSOLUTE-performance convention for coastal/
# fluvial gauge series — RMSE + peak-magnitude bias (fmars2022, garcia2022, wing2021) — rather than
# the dag determining_metric NSE, which the compound-flood literature co-reports but which is inflated
# by the dominant tidal/diurnal signal at coastal gauges; NSE is retained as a supportive secondary
# (this supersession is stated in notes, mirroring the GLM-AED temperature case). Flood-extent CSI
# tiers come from two multi-site flood-model benchmarks (wing2018 collective validation; wing2021
# continental validation). Bands are plain numbers read via `direction` (see the schema doc).

