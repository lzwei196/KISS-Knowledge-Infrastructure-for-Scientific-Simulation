# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: FloPy
  language: python
  implementation:
    id: flopy
    version: 3.11.0
    provenance: Python; U.S. Geological Survey FloPy model-builder/pre-post-processor (Bakker, Post, Hughes
      et al.) that writes MODFLOW input files, invokes the external compiled MODFLOW binary, and parses
      its binary/text output.
  scientific_reference_version: MODFLOW-family finite-difference groundwater flow/transport (MODFLOW 6,
    MODFLOW-2005/NWT/USG, MT3D/SEAWAT) as built and post-processed by FloPy
  binary:
    path: KISSPATH_HOME/.local/share/flopy/bin/mf6
    type: work_dir
pipeline:
  stages:
  - s1_grid_discretization
  - s2_aquifer_properties
  - s3_forcing_boundaries
  - s4_model_assembly
  - s5_execution
  - s6_output_analysis
  - s7_calibration
tools:
  count: 5
  files:
  - tools/build_grid_from_dem.py
  - tools/convert_forcing_to_modflow.py
  - tools/convert_soil_to_aquifer.py
  - tools/parse_modflow_output.py
  - tools/run_modflow.py
inputs:
  forcing:
  - name: recharge
    unit: m/day (model L/T)
  - name: evapotranspiration
    unit: m/day (model L/T)
  - name: well pumping / injection
    unit: m3/day (model L^3/T)
  parameters:
  - name: horizontal hydraulic conductivity (K / hk)
    unit: m/day (model L/T)
  - name: vertical hydraulic conductivity / anisotropy (K33 / vka)
    unit: m/day (model L/T)
  - name: specific storage (Ss / ss)
    unit: 1/m
  - name: specific yield (Sy / sy)
    unit: dimensionless (0-1)
  - name: riverbed / streambed conductance
    unit: m2/day
  - name: layer type (laytyp / convertible flag)
    unit: dimensionless code
  initial_conditions:
  - name: starting heads (strt)
    unit: m
  - name: active-cell domain (ibound / idomain)
    unit: integer flag
  - name: initial concentration (transport)
    unit: mass/L^3
  boundary_conditions:
  - name: constant-head boundary (CHD)
    unit: m ASL
  - name: river / general-head / drain boundary (RIV/GHB/DRN)
    unit: stage & rbot in m ASL
  - name: spatial & temporal discretization (DIS/TDIS)
    unit: m (cell sizes), model time units (perlen)
  - name: unit-system codes (LENUNI / ITMUNI)
    unit: code
  - name: solver configuration (IMS / PCG / NWT / SMS)
    unit: dimensionless
  - name: output control (OC)
    unit: schedule
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - hydraulic head
  - drawdown
  - cell-by-cell flow budget
  - specific discharge
  - solute concentration
  - volumetric water-balance discrepancy
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.644, KGE=0.838, R=0.921, 2 scorecard(s)'
  metrics:
    best_nse: 0.6437
    best_kge: 0.8377
    best_r: 0.9213
summary:
  total_tools: 5
  total_stage_docs: 7
  total_diagnostic_triplets: 21
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
