        unit: m
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "Goldberg 2013 discusses centimeter-to-meter surface-elevation measurement accuracy, but not a validation threshold."
        cites: []
    secondary_metrics:
      - metric: trend_match
        direction: maximize
        status: supportive
        ceiling_reason: "Time-dependent adjoint experiments show surface time information can matter, but the assumed centimeter-scale accuracy is explicitly below typical satellite/airborne accuracy."
        cites: [goldberg2013_adjoint]
    validated_when: "UNRESOLVED - evaluate against altimetry surface-elevation-change time series, but leave automatic pass bands disabled."
    evidence_strength: weak
