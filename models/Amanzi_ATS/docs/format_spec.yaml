# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: Amanzi_ATS
  language: c++
  implementation:
    id: amanzi-ats
    version: Amanzi v1.7-dev (git f8b03562e, master); ATS docs 1.6 lineage
    provenance: C++; DOE Amanzi/ATS multi-physics framework (LANL/LBNL/PNNL/ORNL) built on Trilinos, with
      XML (Teuchos ParameterList) input.
  scientific_reference_version: Amanzi/ATS integrated surface-subsurface thermal hydrology framework (Amanzi
    multi-process core + ATS ecohydrology PKs; Painter/Coon formulation, WRR 2016)
inputs:
  forcing:
  - name: Precipitation / recharge mass flux
    unit: kg/m^2/s (internal); inputs commonly mm/hr, mm/yr, cm/yr
    category: forcing
    source_kind: forcing
    model_input_format: boundary_conditions inward_mass_flux (XML ParameterList)
    notes: Surface water input; unit conversion to kg/m^2/s required (see hazards).
  - name: Atmospheric temperature
    unit: K (internal); input °C or K
    category: forcing
    source_kind: forcing
    model_input_format: boundary/initial condition for energy equation; Surface Energy Balance PK forcing
      (ATS)
    notes: Active only when energy / surface-energy-balance PKs are enabled.
  - name: Meteorological surface forcing (radiation, humidity, wind, snow/rain partition)
    unit: PK-specific (W/m^2, -, m/s, kg/m^2/s)
    category: forcing
    source_kind: forcing
    model_input_format: independent variables consumed by Surface Energy Balance / snow / canopy evaluators
      (ATS)
    notes: Drives evapotranspiration, snowpack and surface energy balance; specific variable set is PK-dependent.
  parameters:
  - name: Intrinsic permeability k
    unit: m^2
    category: parameters
    source_kind: dataset_lookup
    model_input_format: materials block (tensor); derived from soil texture/K_sat
    notes: NOT hydraulic conductivity; typical 1e-16–1e-9 m^2. Highest-sensitivity flow parameter.
  - name: van Genuchten alpha
    unit: 1/Pa (internal; literature commonly 1/cm)
    category: parameters
    source_kind: dataset_lookup
    model_input_format: materials cap_pressure (WRM) block
    notes: Typical 1e-6–1e-2 1/Pa.
  - name: van Genuchten n
    unit: dimensionless (>1)
    category: parameters
    source_kind: dataset_lookup
    model_input_format: materials cap_pressure (WRM) block
    notes: Typical 1.1–3.0; high n (>2.5) gives stiff retention curves.
  - name: van Genuchten m
    unit: dimensionless
    category: parameters
    source_kind: derived
    model_input_format: derived internally from n; m=1-1/n under Mualem (n=1/(1-m)), m=1-2/n under Burdine
    notes: Wrapper-supplied n reconciles only under the Mualem rel-perm branch (default).
  - name: Mualem rel-perm pore-connectivity exponent l
    unit: dimensionless
    category: parameters
    source_kind: default
    model_input_format: materials WRM block
    notes: Defaults to 0.5 when 'van Genuchten l' not supplied.
  - name: Porosity
    unit: dimensionless (0–1)
    category: parameters
    source_kind: dataset_lookup
    model_input_format: materials mechanical_properties block
    notes: Typical 0.01–0.6.
  - name: Residual saturation S_r
    unit: dimensionless
    category: parameters
    source_kind: dataset_lookup
    model_input_format: materials cap_pressure (WRM) block
    notes: S_r = theta_r/theta_s; must be <1.0 (typical 0.05–0.35).
  - name: Specific storage
    unit: 1/m
    category: parameters
    source_kind: calibrated
    model_input_format: materials mechanical_properties block
    notes: Typical ~1e-5 1/m.
  - name: Longitudinal/transverse dispersivity
    unit: m
    category: parameters
    source_kind: calibrated
    model_input_format: transport block
    notes: Typical 0.1–100 m.
  - name: Sorption distribution coefficient Kd
    unit: m^3/kg (internal; literature mL/g)
    category: parameters
    source_kind: calibrated
    model_input_format: chemistry block
    notes: Typical 0.001–1.0 m^3/kg; high transport sensitivity.
  - name: Gravity vector
    unit: m/s^2 (3-vector)
    category: parameters
    source_kind: default
    model_input_format: global block (typically 0,0,-9.81)
    notes: Wrong sign/magnitude inverts the hydrostatic gradient.
  initial_conditions:
  - name: Initial pressure
    unit: Pa
    category: initial_conditions
    source_kind: user_provided
    model_input_format: 'initial_conditions: linear_pressure (hydrostatic, gradient rho*g) or uniform'
  - name: Initial solute concentration
    unit: mol/L
    category: initial_conditions
    source_kind: user_provided
    model_input_format: initial_conditions (transport)
  - name: Initial temperature
    unit: K
    category: initial_conditions
    source_kind: user_provided
    model_input_format: initial_conditions (energy)
  boundary_conditions:
  - name: Prescribed pressure / water-table boundary
    unit: Pa (internal; input m head)
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: boundary_conditions uniform_pressure
    notes: Head must be converted to pressure (P = P_atm + rho*g*h).
  - name: Recharge rate
    unit: mm/yr (converted to kg/m^2/s)
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: boundary_conditions inward_mass_flux
    notes: Typical 0–500 mm/yr.
  - name: Flow model selection
    unit: '-'
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: 'process_kernels flow_model: richards | saturated | constant'
  - name: Transport algorithm selection
    unit: '-'
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: 'process_kernels transport: explicit first-order | explicit second-order'
  - name: Chemistry engine selection
    unit: '-'
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: 'process_kernels chemistry engine: amanzi | pflotran | crunchflow | none'
  - name: Relative-permeability / WRM model selection
    unit: '-'
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: 'materials WRM: van Genuchten (Mualem default) | Brooks-Corey'
  - name: Execution / timestepping controls
    unit: s (times); dimensionless (factors)
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: 'execution_control: start, end, init_dt, max_dt, increase_factor, reduction_factor,
      mode (steady/transient)'
  - name: Mesh and regions
    unit: m
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: 'mesh: internal box (nx/ny/nz, mstk/simple) or Exodus II (.exo); regions: box/plane/point/labeled_set'
    notes: Exodus labeled_set integer IDs must match XML region definitions or BCs silently default to
      no-flow.
outputs:
  primary:
  - name: pressure
    unit: Pa
    description: Liquid pressure field (subsurface, and ponded pressure for surface domains); primary
      flow unknown.
    validation_rank: 2
    emitted_in: HDF5+XDMF visualization ({base}_data.h5/.xmf) and observation time-series (.out)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare as hydraulic head (m) after P->h conversion when obs are piezometric heads.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Emitted as an HDF5/XDMF visualization field; requires gridded/remote-sensed obs co-registered
          to the mesh.
      detrending_options:
      - none
  - name: hydraulic_head
    unit: m
    description: Derived hydraulic head / water-table position from pressure (h = (P - P_atm)/(rho*g)
      + z).
    validation_rank: 1
    emitted_in: observation time-series (.out)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: r
        caveats:
        - Water-table depth obs (well hydrographs) are the natural target.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - none
      - linear_residual
  - name: saturation_liquid
    unit: dimensionless (0–1)
    description: Subsurface liquid saturation field derived from pressure via the retention curve.
    validation_rank: 3
    emitted_in: HDF5+XDMF visualization
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare against volumetric soil-moisture obs after theta = S*porosity conversion.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Requires gridded/remote-sensed moisture co-registered to the mesh.
      detrending_options:
      - none
  - name: darcy_velocity
    unit: m/s
    description: Subsurface Darcy flux field; also integrated to volumetric flux / discharge at observation
      regions.
    validation_rank: 4
    emitted_in: HDF5+XDMF visualization and observation time-series (.out, volumetric_flux)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Streamflow/discharge hydrographs (integrated surface-subsurface runs) are the natural target;
          NSE/KGE apply.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Emitted as an HDF5/XDMF visualization field; requires gridded/remote-sensed obs co-registered
          to the mesh.
      detrending_options:
      - none
  - name: total_component_concentration
    unit: mol/L
    description: Per-solute aqueous concentration in subsurface water (reactive transport primary unknown).
    validation_rank: 5
    emitted_in: HDF5+XDMF visualization and observation time-series (.out, aqueous_conc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Breakthrough-curve timing is the key signal; convert mg/L obs to mol/L before comparison.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Emitted as an HDF5/XDMF visualization field; requires gridded/remote-sensed obs co-registered
          to the mesh.
      detrending_options:
      - none
  - name: temperature
    unit: K
    description: Subsurface/surface temperature field (energy PK); drives ice phase in permafrost runs.
    validation_rank: 6
    emitted_in: HDF5+XDMF visualization and observation time-series (.out)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Soil/ground-temperature sensor series at depth; freeze-thaw timing matters for permafrost.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Emitted as an HDF5/XDMF visualization field; requires distributed land-surface / ground-temperature
          retrievals co-registered to the mesh.
      detrending_options:
      - none
  - name: saturation_ice
    unit: dimensionless
    description: Ice saturation field for permafrost / frozen-soil flow.
    validation_rank: 7
    emitted_in: HDF5+XDMF visualization
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Active-layer thickness / freeze-thaw front timing are the practical observables.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Emitted as an HDF5/XDMF visualization field; requires active-layer / freeze-thaw extent maps
          co-registered to the mesh.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Water drains unrealistically fast. Water table drops to domain bottom instantly. Saturation
    goes to residual everywhere in first timestep.
  diagnosis: Hydraulic conductivity K (m/s) used directly as intrinsic permeability k (m²) — 7 orders
    of magnitude too high; Amanzi uses intrinsic permeability k [m²], not hydraulic conductivity K [m/s].
    The conversion is k = K × μ/(ρ×g) ≈ K × 1.02e-7. For sandy loam with K = 1.23e-5 m/s, k should be
    1.25e-12 m²
  remedy: Convert K to k using k = K × μ/(ρ×g); convert_soil_to_amanzi; ['Check permeability value in
    XML — should be 1e-16 to 1e-9 m² for geological materials', 'If permeability > 1e-6, it is likely
    K (m/s), not k (m²)', 'Multiply by 1.02e-7 to convert']; convert_soil_to_amanzi.py always converts
    from K to k
  severity: silent
- id: dt_002
  symptom: Pressure values are essentially zero. Water table is at or below domain bottom. No flow occurs.
  diagnosis: Hydraulic head (m) used where pressure (Pa) is expected; Amanzi boundary and initial conditions
    use pressure in Pascals, not hydraulic head in meters. A water table at 10 m elevation requires P
    = 101325 + 998.2 × 9.81 × 10 ≈ 199,240 Pa. Entering '10' as pressure gives 10 Pa ≈ 0.001 m head, effective
  remedy: 'Convert head to pressure: P = P_atm + ρ×g×h; convert_forcing_to_amanzi; [''Check pressure values
    in XML — atmospheric is 101325 Pa'', ''If values are 0-100, they are likely head in meters, not pressure
    in Pa'', ''Convert using P = 101325 + 9806.65 × h'']; convert_forcing_to_amanzi.py includes head_m_to_pr'
  severity: silent
- id: dt_003
  symptom: Contaminant transport is orders of magnitude slower or faster than expected. Breakthrough time
    is wrong.
  diagnosis: 'Concentration in mg/L used where mol/L is expected, or vice versa; Amanzi default concentration
    unit is mol/L (molar). Using mg/L values directly introduces an error of molecular_weight/1000. For
    uranium (MW=238): 1 mg/L = 4.2e-6 mol/L. Using 1.0 (mg/L) as 1.0 mol/L gives 238,000× too much.

    ; [''init'
  remedy: 'Convert mg/L to mol/L: C_mol = C_mg / (MW × 1000); None; [''Check concentration unit in <model_description><units><conc_unit>'',
    ''Verify initial and boundary concentrations match the declared unit'']; Always declare conc_unit
    explicitly in model_description'
  severity: silent
- id: dt_004
  symptom: Soil drains instantly with no capillary retention. Saturation jumps from 1.0 to residual with
    no transition zone.
  diagnosis: 'van Genuchten α in 1/cm used directly where 1/Pa is expected; Literature reports van Genuchten
    α in 1/cm. Amanzi uses α in 1/Pa internally. For sandy loam, α = 0.075 1/cm. The conversion is: α_Pa
    = α_cm / (ρ×g×100) = 0.075 / 980665 ≈ 7.65e-8 1/Pa. Using 0.075 directly as 1/Pa gives α about 1 million'
  remedy: 'Convert α: α_Pa = α_cm / 980665; convert_soil_to_amanzi; [''Check α value in XML — should be
    1e-6 to 1e-2 for 1/Pa'', ''If α > 0.01, it is likely in 1/cm'', ''Divide by 980665 to convert to 1/Pa''];
    convert_soil_to_amanzi.py converts α from 1/cm to 1/Pa'
  severity: silent
- id: dt_005
  symptom: Boundary conditions not applied. Zero flux at boundaries where recharge or pressure was specified.
    Simulation runs but results are wrong.
  diagnosis: Exodus mesh label IDs do not match XML region definitions; When using external Exodus II
    meshes, regions reference labeled sets by integer ID. If the XML specifies label="30000" but the mesh
    has sideset 3000 (missing a zero), the BC is silently not applied. No error is generated — the boundary
    defau
  remedy: Verify Exodus label IDs match XML using ncdump or SEACAS tools; None; ["Run 'ncdump -h mesh.exo
    | grep ss_names' to list sideset IDs", 'Compare with label values in XML <region_file> elements',
    'Ensure entity type (cell/face/node) matches']; Always verify mesh labels before running
  severity: silent
- id: dt_006
  symptom: Simulation runs for 31 million times too long or too short. Total simulation time in log does
    not match expected.
  diagnosis: Time values in years used where seconds are expected, or vice versa; Amanzi internally uses
    seconds. The <time_unit> in model_description sets the display unit, but execution_control values
    must be consistent with it. Entering '10' meaning 10 years when the unit is seconds gives a 10-second
    simulati
  remedy: Ensure all time values are in the declared time_unit; None; ['Check <time_unit> in model_description',
    'Verify execution_control start/end values match', '1 year = 3.156e7 seconds']; convert_forcing_to_amanzi.py
    always outputs in seconds
  severity: silent
- id: dt_007
  symptom: Results differ slightly between runs with different MPI process counts. Pressure values at
    observation points change by 0.1-1%.
  diagnosis: Different mesh partitioning across MPI ranks changes solver convergence path; Mesh domain
    decomposition depends on the number of MPI processes. Different decompositions lead to slightly different
    solver convergence paths due to communication ordering and preconditioning. This is normal for iterative
  remedy: Always document and use the same MPI rank count for reproducible runs; None; ['Record np value
    used for each simulation', 'For comparison studies, use identical np']; run_amanzi.py logs the command
    including np
  severity: degraded
- id: dt_008
  symptom: Water flows upward. Pressure increases with elevation. Water table rises above recharge surface.
  diagnosis: Gravity vector has wrong sign or magnitude; Amanzi expects gravity as a 3D vector, typically
    (0, 0, -9.81) for downward. A positive Z component (0, 0, +9.81) causes upward gravitational acceleration.
    The linear_pressure gradient for hydrostatic should be (0, 0, -ρg) = (0, 0, -9806.65). A positive
    gr
  remedy: 'Ensure gravity Z component is negative: (0, 0, -9.81); None; [''Check gravity vector in XML
    — Z must be negative'', ''Check linear_pressure gradient — Z should be -9806.65 Pa/m'']; Template
    XML should have correct gravity'
  severity: silent
- id: dt_009
  symptom: 'Fatal error at startup: dimension mismatch. ''Mesh dimension does not match input specification.'''
  diagnosis: 'XML specifies 2D but mesh is 3D, or vice versa; Amanzi is inherently 3D. 2D simulations
    use a 3D mesh with ny=1. If the XML dimension tag says 2 but the mesh is fully 3D, or the dimension
    says 3 but the mesh is a 2D surface mesh, a fatal dimension mismatch error occurs.

    ; [''mesh_block'']'
  remedy: Set dimension=3 in XML and use ny=1 for 2D problems; None; ['Set <dimension>3</dimension> in
    mesh block', 'For 2D, use number_of_cells ny=1 with domain width 1.0 m']; Always use dimension=3 and
    control dimensionality via cell counts
  severity: fatal
- id: dt_010
  symptom: 'Fatal error: ''Cannot open mesh file''. Simulation aborts immediately.'
  diagnosis: Exodus mesh file path in XML is wrong (relative vs absolute path issue); Amanzi resolves
    mesh file paths relative to the working directory where the binary is executed, NOT relative to the
    XML file location. If the XML says <file>meshes/domain.exo</file> but you run from a different directory,
    the f
  remedy: Use absolute path or ensure working directory is correct; run_amanzi; ['Check mesh file path
    in XML', 'Run from the directory containing the mesh file, or use absolute paths']; run_amanzi.py
    checks mesh file existence before execution
  severity: fatal
- id: dt_011
  symptom: Recharge is 100× too high. Domain becomes fully saturated immediately. Ponding on surface.
  diagnosis: 'Recharge in cm/yr not fully converted to kg/m²/s (missed the ÷100 for cm→m); The full conversion
    from cm/yr to kg/m²/s is: R × ρ / (100 × 3.156e7). If only ÷3.156e7 is applied (missing ÷100), the
    recharge is 100× too high. 300 cm/yr = 3000 mm/yr ≈ 9.49e-5 kg/m²/s. Without ÷100: 9.49e-3 kg/m²/s
    (equi'
  remedy: Verify conversion includes cm→m factor (÷100); convert_forcing_to_amanzi; ['Check recharge_kg_m2_s
    in output — should be O(1e-8) for typical climates', '300 mm/yr = 9.49e-6 kg/m²/s']; convert_forcing_to_amanzi.py
    uses validated cm_yr_to_kg_m2_s()
  severity: silent
- id: dt_012
  symptom: Contaminant plume does not move. Retardation factor is 1000× too high. Contaminant stuck at
    source.
  diagnosis: 'Sorption Kd in mL/g used directly where m³/kg is expected; Amanzi uses Kd in m³/kg. Literature
    typically reports Kd in mL/g. The conversion is Kd [m³/kg] = Kd [mL/g] × 0.001. A Kd of 10 mL/g entered
    as 10 m³/kg is 1000× too large.

    ; [''chemistry_block'', ''sorption'']'
  remedy: 'Multiply Kd by 0.001 to convert mL/g → m³/kg; convert_soil_to_amanzi; [''Check Kd units in
    XML — should be m³/kg'', ''Common values: 0.001-1.0 m³/kg for most contaminants'']; convert_soil_to_amanzi.py
    includes kd_ml_g_to_m3_kg()'
  severity: silent
- id: dt_013
  symptom: 'NaN detected in residual. Simulation crashes after a few timesteps. ''Nonlinear solver failed:
    NaN in residual.'''
  diagnosis: Extreme permeability values or boundary condition magnitudes cause numerical overflow; Very
    high permeability (>1e-6 m²) or very large pressure gradients can cause numerical overflow in the
    flow solver. This typically manifests as NaN in the first few timesteps. The most common cause is
    using K (m/s
  remedy: Check all parameter values for unit conversion errors; None; ['Check permeability values — should
    be 1e-16 to 1e-9 m²', 'Check pressure BCs — should be O(1e5) Pa', 'Reduce init_dt to 0.1 s and retry'];
    run_amanzi.py preflight checks parameter ranges
  severity: fatal
- id: dt_014
  symptom: Simulation progress extremely slow. Timestep stuck at minimum. Thousands of nonlinear iterations
    per step.
  diagnosis: Stiff van Genuchten parameters (high n, sharp retention curve) cause solver non-convergence;
    Very high van Genuchten n (>2.5) creates a sharp saturation front that is difficult for nonlinear
    solvers. The solver repeatedly fails and cuts the timestep, effectively stalling. This is especially
    problema
  remedy: 'Reduce vG n slightly, increase preconditioning, or use Anderson acceleration; None; [''Try
    reducing n by 10-20% for initial testing'', ''Increase hypre_cycle_applications to 10'', ''Use smaller
    init_dt (1-10 s)'', ''Consider switching to Brooks-Corey for very sandy soils'']; convert_soil_to_amanzi.py
    warns '
  severity: degraded
- id: dt_015
  symptom: Negative effective saturation. Solver produces nonsensical pressures. May crash or produce
    NaN.
  diagnosis: 'Residual saturation S_r ≥ 1.0 or θ_r > θ_s; The effective saturation S_e = (S - S_r) / (1
    - S_r) becomes negative or undefined if S_r ≥ 1. This can happen if θ_r (residual water content) is
    accidentally used as S_r without dividing by porosity, and θ_r > θ_s due to data error.

    ; [''cap_pressure_block'
  remedy: 'Ensure S_r = θ_r / θ_s and S_r < 1.0; convert_soil_to_amanzi; [''Check sr value in cap_pressure
    block — must be < 1.0'', ''Typical range: 0.05 - 0.35'']; convert_soil_to_amanzi.py computes S_r =
    θ_r / θ_s'
  severity: silent
- id: dt_016
  symptom: Fatal XML parse error at startup. 'Required parameter list not found' or 'Missing required
    element'.
  diagnosis: A required XML block (mesh, regions, materials, etc.) is missing from the input file; Amanzi
    requires specific XML blocks to be present. Missing the <mesh> block, <regions> block, or <materials>
    block causes an immediate fatal error. This often happens when copying templates and forgetting to
    fill i
  remedy: 'Add the missing XML block; run_amanzi; [''Read the error message to identify which block is
    missing'', ''Add the block to the XML file'', ''Required blocks: mesh, regions, materials, initial_conditions,
    process_kernels'']; run_amanzi.py preflight checks for all required blocks'
  severity: fatal
- id: dt_017
  symptom: No recharge enters the domain. Water table drops steadily. System behaves as if sealed at the
    top.
  diagnosis: Recharge boundary condition missing or assigned to wrong region. Default is zero-flux (no-flow).;
    If no boundary condition is specified for a face, Amanzi applies the natural (zero-flux) boundary
