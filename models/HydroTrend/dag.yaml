  citation_index:
    syvitski2007_bqart_dominance:
      short_citation: "Syvitski & Milliman 2007"
      doi: "10.1086/509246"
      note: "BQART relation calibrated on 488 rivers (explains 96% of between-river sediment-load variance); variance partition geology ~65% / climate ~14% / anthropogenic ~16%. Strongest sensitivity-ranking source for the BQART module."
    kettner2008_hydrotrend_v3:
      short_citation: "Kettner & Syvitski 2008"
      doi: "10.1016/j.cageo.2008.02.008"
