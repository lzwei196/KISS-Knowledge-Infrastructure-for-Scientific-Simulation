# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: RZWQM2
  language: fortran
  implementation:
    id: rzwqm2-main-ryzen
    version: RZWQM2 (USDA-ARS release 4.2 lineage; Linux x86-64 binary main_ryzen)
    provenance: Fortran; USDA-ARS RZWQM2 compiled binary (Windows RZWQMrelease.exe / Linux main_ryzen)
      with embedded DSSAT crop modules.
  scientific_reference_version: RZWQM2 (Root Zone Water Quality Model 2; model science core v2.x, e.g.
    2.70) with embedded DSSAT 4.0 CERES/CROPGRO crop modules and RZ-SHAW heat/snow coupling
inputs:
  forcing:
  - name: daily meteorology (Tmin, Tmax, wind run, solar radiation, relative humidity, rainfall; optional
      E-pan, PAR)
    unit: Tmin/Tmax degC; wind km/day; SRAD MJ/m^2/day; RH %; rainfall mm; E-pan cm/day; PAR mol quanta/m^2/day
    category: weather
    source_kind: forcing
    model_input_format: .met (36-line header then one 10-column row per day)
    notes: 'No missing-value handler: every day must carry a complete numeric row. Setting E-pan and PAR
      columns to 0 triggers the model''s internal Penman-Monteith/Shuttleworth-Wallace ET estimation;
      supplying non-zero values overrides it. Wind is a daily run (km/day), solar radiation is MJ/m^2/day.
      When the PAR column is 0/absent, the model internally derives PAR as 0.48 × shortwave (SRAD) in
      the meteorology reader (hmet); this is the model''s built-in PAR estimate, not a host-tool conversion.'
  - name: breakpoint (sub-daily) rainfall intensity
    unit: inches (precipitation depth per breakpoint)
    category: weather
    source_kind: forcing
    model_input_format: .brk (20-line header, per-event control line, breakpoint time/depth pairs)
    notes: Drives the sub-daily infiltration intensity that the Green-Ampt/macropore routine consumes.
      The binary expects breakpoint precipitation in INCHES (not mm); mm supplied without /25.4 inflates
      infiltration ~25x.
  - name: ambient CO2 concentration
    unit: ppm
    category: atmosphere
    source_kind: forcing
    model_input_format: grid general-property line in RZWQM.dat
    notes: Atmospheric driver to the crop assimilation routines; specified as a site property rather than
      a per-day column.
  parameters:
  - name: site geometry (latitude, longitude, elevation, slope, aspect, area)
    unit: lat/lon RADIANS; elevation m; slope fraction 0-1; aspect deg from north; area m^2
    category: site
    source_kind: user_provided
    model_input_format: RZWQM.dat grid general-property line
    notes: Latitude and longitude MUST be in radians; |lat|>pi/2 indicates a degrees error that silently
      corrupts solar geometry and PET.
  - name: soil horizon physical properties (bulk density, particle density, sand/silt/clay, porosity)
    unit: g/cm^3; %; fraction
    category: soil
    source_kind: calibrated
    model_input_format: RZWQM.dat soil physical section (per horizon, max 20 horizons / 3000 cm)
  - name: Brooks-Corey hydraulic parameters (bubbling pressure, pore-size index lambda, Ksat, residual/saturated
      water content, field-capacity points, lateral Ksat)
    unit: bubbling pressure cm H2O; Ksat cm/hr; water contents cm^3/cm^3
    category: soil
    source_kind: calibrated
    model_input_format: RZWQM.dat soil hydraulic section (per horizon)
    notes: Dominant water-flux controls; sensitivity order Ksat > effective porosity (ws-wr) > macroporosity
      > bubbling pressure > pore-size index.
  - name: macropore / micropore properties (total macroporosity, radius, width, crack/aggregate geometry,
      dead-end fraction, microporosity by texture)
    unit: fraction; cm
    category: soil
    source_kind: calibrated
    model_input_format: RZWQM.dat macropore and micropore sections
  - name: soil heat / thermal parameters (method flag, thermal conductivity)
    unit: dimensionless flag; W/m/K
    category: soil
    source_kind: calibrated
    model_input_format: RZWQM.dat heat-model section
  - name: DSSAT cultivar / ecotype / species coefficients
    unit: crop-specific genetic coefficients
    category: crop
    source_kind: dataset_lookup
    model_input_format: .CUL / .ECO / .SPE DSSAT databases (linked via .RZX)
    notes: Cultivar coefficients are fixed-width and crop-specific (maize, wheat, soybean differ in parameter
      count); they parameterize the embedded DSSAT crop modules.
  - name: pesticide chemical properties (Freundlich adsorption constant, dissociation/pKa, degradation
      rates) and soil chemistry parameters (pH, CEC)
    unit: adsorption constant, rate constants, pH, cmol/kg
    category: chemistry
    source_kind: calibrated
    model_input_format: RZWQM.dat pesticide/chemistry sections and RZINIT.dat chemistry section
  initial_conditions:
  - name: initial soil water tension/content and soil temperature per horizon
    unit: cm tension or cm^3/cm^3; degC
    category: soil_water
    source_kind: user_provided
    model_input_format: RZINIT.dat water section
    notes: A 1-3 year warm-up is recommended to equilibrate the profile before the analysis period.
  - name: initial nitrogen pools (NO3, NH4, urea, fast/slow organic N) per horizon
    unit: ug/g or kg/ha
    category: nutrient
    source_kind: user_provided
    model_input_format: RZINIT.dat nutrient section
  - name: initial soil chemistry (pH, CEC, organic carbon) per horizon
    unit: pH; cmol/kg; %
    category: chemistry
    source_kind: user_provided
    model_input_format: RZINIT.dat chemistry section
  - name: initial surface residue / organic-matter pool state
    unit: kg/ha
    category: residue
    source_kind: user_provided
    model_input_format: RZINIT.dat / management residue settings
  - name: initial snow water / depth state
    unit: cm
    category: snow
    source_kind: user_provided
    model_input_format: .sno
  boundary_conditions:
  - name: simulation period (start/end dates)
    unit: DD MM YYYY DD MM YYYY
    category: control
    source_kind: user_provided
    model_input_format: ipnames.dat line 8
    notes: Dates must fall within the .met record range.
  - name: bottom boundary condition (1=free drainage, 2=water table, 3=constant flux/lysimeter)
    unit: integer switch
    category: hydrology_option
    source_kind: user_provided
    model_input_format: RZWQM.dat infiltration parameter line
    notes: Tile drainage requires the constant-flux option (BC=3) together with perched-water-table and
      lateral-Ksat settings; otherwise drainage is zero.
  - name: tile drainage configuration (drain flag, drain depth/spacing geometry, lateral Ksat threshold)
    unit: geometry in cm; lateral Ksat cm/hr
    category: drainage_geometry
    source_kind: user_provided
    model_input_format: RZWQM.dat infiltration/drainage section
  - name: management events (planting date/density/row spacing, fertilizer N/P rate and timing, manure,
      tillage, irrigation mode, residue, harvest)
    unit: dates; kg/ha; counts
    category: management
    source_kind: user_provided
    model_input_format: RZWQM.dat management sections and plgen.dat
    notes: Fertilizer timing uses event codes (e.g., 1=preplant, 3=postemergence); irrigation is set as
      irrigated vs rainfed mode.
  - name: crop / cultivar selection and planting plant-reference
    unit: crop id + cultivar id
    category: crop_selection
    source_kind: user_provided
    model_input_format: RZWQM.dat crop line and planting schedule; .RZX DSSAT link
    notes: Selects which embedded DSSAT crop module (CERES maize/wheat, CROPGRO soybean, etc.) runs; an
      incomplete/empty cultivar id makes DSSAT fall back to its first .CUL entry.
outputs:
  primary:
  - name: soil_water_storage
    unit: cm (profile) or cm^3/cm^3 (volumetric by layer)
    description: Total and layer-resolved soil water content in the root-zone profile.
    validation_rank: 3
    emitted_in: .ana (profile total); Layer.plt (depth-resolved by node)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: r
        caveats:
        - Layer.plt node depths derive from the half-way-rule discretization and may not align with sensor/horizon
          depths; depth matching required before comparison.
      detrending_options:
      - none
  - name: tile_drainage
    unit: cm (.ana column; multiply by 10 for mm)
    description: Lateral tile-drainage water flux leaving the profile.
    validation_rank: 4
    emitted_in: .ana (column index 10)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Reported in cm; convert to mm (x10) before comparison with mm-based drain-flow observations.
      detrending_options:
      - none
  - name: evapotranspiration
    unit: mm/day (or cm)
    description: Actual and potential evapotranspiration from the surface energy/water balance.
    validation_rank: 2
    emitted_in: .ana
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Non-zero E-pan/PAR forcing columns override the internal ET estimate; comparison only meaningful
          when internal ET is active.
      detrending_options:
      - none
  - name: no3_leaching
    unit: kg N/ha
    description: Nitrate-N in subsurface soil-profile leachate below the root zone and in tile-drainage
      water.
    validation_rank: 5
    emitted_in: .ana
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Strongly dependent on calibrated N-transformation and humus-pool parameters; uncalibrated runs
          are not predictive.
      detrending_options:
      - none
  - name: soil_nitrate
    unit: kg N/ha (or ug/g by layer)
    description: Soil nitrate-N content / concentration in the profile.
    validation_rank: 6
    emitted_in: .ana (profile); Layer.plt (depth-resolved N species)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Depth-resolved sampling must be matched to discretization nodes.
      detrending_options:
      - none
  - name: crop_yield
    unit: kg/ha
    description: Crop grain yield from the embedded DSSAT crop module.
    validation_rank: 1
    emitted_in: .ana (grain yield column); MANAGE.OUT; PLANTSUM.OUT (may be missing)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-season point yield; field-measured yield is the appropriate target.
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - ranking_quality
        determining_metric: pbias
        caveats:
        - Multi-season field yields; inter-annual ranking is meaningful at a calibrated point.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - National/regional yield aggregates carry a technology trend a point process model cannot reproduce;
          detrend before comparing.
      detrending_options:
      - none
      - linear_residual
      - decadal_mean
  - name: soil_temperature
    unit: degC
    description: Soil temperature profile by depth.
    validation_rank: 7
    emitted_in: .ana (column 4); Layer.plt (depth-resolved)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Layer.plt node depths must be matched to sensor depths.
      detrending_options:
      - none
  - name: snow_depth
    unit: cm
    description: Snow depth / snow water state (RZ-SHAW).
    validation_rank: 8
    emitted_in: .ana (column index 91)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Only meaningful when the RZ-SHAW snow/freezing path is active.
      detrending_options:
      - none
  - name: pesticide_loss
    unit: mass and concentration units (runoff and leachate)
    description: Pesticide mass loss and concentration in surface runoff water and subsurface leachate.
    validation_rank: 9
    emitted_in: .ana / chemistry output files
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Weak-acid pesticide predictions are highly sensitive to Freundlich constant, soil pH and dissociation
          coefficient; treat as semi-quantitative without calibration.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: 'RZWQM2 crashes immediately on startup, or creates empty files named like "C:\RZWQM2\projects\..."
    in the working directory instead of reading the intended input files.

    ; [''Model exits within seconds of launch'', ''Empty files with Windows-style path names appear in
    the scenario directory'', ''Fortran ru'
  diagnosis: 'ipnames.dat contains Windows paths (C:\...) but the model is running on Linux. The Fortran
    OPEN statement interprets backslash-containing strings as literal filenames rather than directory
    separators, creating files with those names instead of navigating to the intended paths.

    ; RZWQM2 reads the fir'
  remedy: 'Run the update_ipnames_paths tool. Replace all Windows paths with relative Linux paths (./file.dat).

    ; update_ipnames_paths; head -8 ipnames.dat should show ./cntrl.dat, ./rzwqm.dat, ./rzinit.dat, ./plgen.dat,
    and relative paths to .met, .brk, .ana, and chemistry files.

    ; C:\RZWQM2\projects\534\cntr'
  severity: fatal
- id: dt_002
  symptom: 'Segfault during DSSAT crop model initialization. The model reads initial values successfully
    but crashes when the plant growth module starts.

    ; ["Stdout shows ''INITIAL VALUES READ IN'' followed by crash", ''forrtl: severe (174): SIGSEGV, segmentation
    fault occurred'', ''Model dies during crop growth ini'
  diagnosis: '.RZX files (MZDSSAT.RZX, SBDSSAT.RZX, WHDSSAT.RZX) contain Windows paths for the DSSAT database
    directory (C:\RZWQM2\DATABASES\DSSAT\) and the project directory. The DSSAT module cannot locate its
    cultivar, species, and ecotype files.

    ; Line 68 of each .RZX file specifies the DSSAT database director'
  remedy: 'Run the update_rzx_paths tool. Replace line 68 with relative "DSSAT/" and line 69 with "./"
    in all .RZX files.

    ; update_rzx_paths; Check line 68 of each .RZX file shows "DSSAT/" and line 69 shows "./". Verify
    the DSSAT/ directory exists and contains the required database files.

    ; C:\RZWQM2\DATABASES'
  severity: fatal
- id: dt_003
  symptom: 'Model runs but produces unrealistic evapotranspiration, plant growth, or soil temperature
    values. No error message is generated by the model.

    ; [''ET values are negative or implausibly high'', ''Plant growth curve shows anomalous jumps or stalls'',
    ''Soil temperature does not follow expected seasonal pat'
  diagnosis: 'Source weather data has Tmin > Tmax for some days. This is a common data quality issue with
    station data, especially around midnight observation times or sensor malfunctions.

    ; RZWQM2 does not validate that Tmin <= Tmax. When Tmin exceeds Tmax, the Penman-Monteith ET calculation
    receives incorrect v'
  remedy: 'Run the met_quality_check tool. It identifies all days where Tmin > Tmax and swaps the values.

    ; met_quality_check; After running the tool, verify no rows in the .met file have column 3 (Tmin)
    greater than column 4 (Tmax). The tool reports the number of swapped rows.

    ; 15  2015   5.2   3.1  120.0  1'
  severity: degraded
- id: dt_004
  symptom: 'Model runs to completion but greatly overestimates soil moisture and drainage. Precipitation
    appears approximately 25x too high in the simulation results.

    ; [''Simulated drainage is ~25x observed drainage'', ''Soil is perpetually saturated'', ''Surface
    runoff is much higher than expected'', ''Model complet'
  diagnosis: 'The .brk file uses INCHES as its precipitation unit, but the .met file uses mm. If the breakpoint
    generator does not divide by 25.4 when creating the .brk file, precipitation values in mm are applied
    as if they were inches.

    ; RZWQM2 reads .brk precipitation as inches (its internal unit for breakpoin'
  remedy: 'Regenerate the .brk file using the create_breakpoint_file tool, which divides mm values by
    25.4 automatically.

    ; create_breakpoint_file; Spot-check a few .brk events: the cumulative precipitation value should
    be approximately 1/25.4 of the corresponding mm value in the .met file. For example, a 25.4'
  severity: silent
- id: dt_005
  symptom: 'Model reports "things went wrong when adjusting the calibration input" or crashes with a segfault
    during soil property reading.

    ; ["Error message: ''things went wrong when adjusting the calibration input''", ''Segfault during
    early initialization (before met data reading)'', "Model crashes after ''Readin'
  diagnosis: 'The number of horizons declared in the soil depth section of RZWQM.dat does not match the
    number of entries in the hydraulic, physical, micropore, or macropore property sections.

    ; RZWQM.dat has multiple sections that must all have the same number of horizon entries. The soil
    physical section declar'
  remedy: 'Regenerate all soil sections using the write_soil_properties tool with a consistent horizon
    count. This tool writes all sections atomically, ensuring the same number of horizons throughout.

    ; write_soil_properties; Verify the hydraulic section has exactly 3 lines per horizon. Count entries
    in physic'
  severity: fatal
- id: dt_006
  symptom: 'Fortran runtime error "forrtl: severe (174): SIGSEGV, segmentation fault occurred" immediately
    after the model prints "INITIAL VALUES READ IN".

    ; ["Stdout shows ''INITIAL VALUES READ IN'' as the last message before crash", ''forrtl: severe (174):
    SIGSEGV, segmentation fault occurred'', ''Crash occurs at '
  diagnosis: 'Multiple possible causes, all related to the DSSAT crop model initialization: (1) RZX paths
    are wrong (see dt_002), (2) DSSAT .CUL/.SPE/.ECO files are missing from the DSSAT/ directory, (3)
    the crop cultivar ID specified in plgen.dat does not match any entry in the corresponding .CUL file.

    ; The DSS'
  remedy: 'Investigate in order: (1) Check all .RZX paths with update_rzx_paths tool, (2) verify the DSSAT/
    directory contains all 29 crop model files listed in the RZX, (3) verify the cultivar ID in plgen.dat
    matches an entry in the corresponding .CUL file.

    ; update_rzx_paths; After fixing paths, verify: (a) '
  severity: fatal
- id: dt_007
  symptom: 'Segfault after partial initialization. If run under strace, the process shows repeated switching
    between 64-bit and x32 modes.

    ; [''Segfault early in execution, sometimes after partial output'', ''strace shows x32/64-bit mode
    switching'', ''Running on ARM Mac via Docker with Rosetta translation'', ''Binary'
  diagnosis: 'The Linux binary (main_ryzen) was compiled for x86-64-v3 (AVX2 instruction set). Running
    on ARM Mac via Docker/Rosetta cannot emulate AVX2 instructions. Rosetta translates basic x86-64 but
    fails on advanced SIMD extensions.

    ; The Fortran compiler used to build main_ryzen on ComputeCanada targeted th'
  remedy: 'Use native x86-64 hardware with AVX2 support. Options: (1) x86 Linux machine with a modern
    Intel/AMD CPU, (2) cloud VM such as AWS c5/c6i instances, (3) Windows executable (RZWQMrelease.exe)
    via Wine on x86 hardware.

    ; None; On the target machine, check AVX2 support: grep avx2 /proc/cpuinfo should r'
  severity: fatal
- id: dt_008
  symptom: 'Model produces biased soil moisture or evapotranspiration values. No error message is generated.
    Results look plausible but systematically deviate from observations.

    ; [''Soil moisture consistently too high or too low'', ''ET bias that does not respond to calibration'',
    ''Hydraulic parameters seem wrong '
  diagnosis: 'The soil_texture_setter() function has a known edge case: the "silty clay loam" key in default_setter
    has a trailing space ("silty clay loam "). If the texture is computed as "silty clay loam" (no trailing
    space), the dictionary lookup fails silently and incorrect default parameters are used.

    ; When'
  remedy: 'Verify the texture class string matches exactly what soil_default_setter() expects. Use the
    soil_texture_classification tool which strips whitespace and normalizes the string.

    ; soil_texture_classification; Print the texture class returned by the tool and compare with the expected
    keys in soil_defau'
  severity: silent
- id: dt_009
  symptom: 'Wildly incorrect solar radiation calculations, wrong day length, incorrect evapotranspiration.
    The model runs without any error.

    ; [''ET is drastically wrong (too high in winter, too low in summer, or vice versa)'', ''Day length
    calculations do not match the site latitude'', ''Solar radiation partitionin'
  diagnosis: 'RZWQM.dat grid general properties expect latitude and longitude in RADIANS. Users commonly
    enter values in degrees. At 45 degrees latitude, entering 45.0 instead of 0.785 gives completely wrong
    solar geometry.

    ; The solar declination and day length calculations use lat/lon directly in trigonometric '
  remedy: 'Convert degrees to radians before writing to RZWQM.dat: lat_rad = lat_deg * pi / 180, lon_rad
    = lon_deg * pi / 180.

    ; write_site_properties; Verify latitude is between -1.57 and 1.57 (plus/minus pi/2) and longitude
    is between -3.14 and 3.14 (plus/minus pi). Any value outside this range indicates deg'
  severity: silent
- id: dt_010
  symptom: 'Tile drainage values appear approximately 10x too low compared to field observations. All
    other outputs look reasonable.

    ; [''Simulated tile drainage is ~10x lower than observed'', ''Other water balance components (ET,
    runoff) are plausible'', ''Bias is systematic and exactly ~10x, not random'']; [''Parsed'
  diagnosis: 'The .ana output file reports tile drainage in centimeters. To compare with observations
    (typically in mm), values must be multiplied by 10. Manual parsing may miss this conversion.

    ; RZWQM2 internally tracks many water balance variables in cm. The .ana file column for tile drainage
    (column 10) is wr'
  remedy: 'Use the parse_ana_output tool which applies the *10 conversion for tile_drainage automatically.
    If parsing manually, multiply column 10 values by 10 to convert from cm to mm.

    ; parse_ana_output; Compare a few parsed drainage values against known events. Values should be in
    mm. A 2 cm drainage event '
  severity: silent
- id: dt_011
  symptom: 'The nlayer_gen function returns False. The error message states "The numerical layering scheme
    generated TOO MANY layers".

    ; [''nlayer_gen returns False'', "Error message: ''The numerical layering scheme generated TOO MANY
    layers''", ''Node count exceeds MAXNOD (300)'']; [''RZWQM.dat (node discretization s'
  diagnosis: 'Soil horizons are either too close together (very thin layers) or the total soil depth exceeds
    3000 cm. The half-way rule algorithm cannot fit node boundaries to horizon boundaries within the maximum
    node count.

    ; The nlayer_gen algorithm places computational nodes using a half-way rule: each node b'
  remedy: 'Adjust horizon depths: (1) merge very thin horizons (<5 cm) into adjacent horizons, (2) reduce
    maximum soil depth to <=3000 cm, (3) the generate_nodes tool will automatically adjust depths slightly
    if possible to satisfy the constraint.

    ; generate_nodes; After adjustment, run generate_nodes and veri'
  severity: fatal
- id: dt_012
  symptom: 'Running ./main_ryzen returns "No such file or directory" even though the file exists and has
    executable permissions.

    ; [''bash: ./main_ryzen: No such file or directory'', ''ls -la shows the file exists with -rwxr-xr-x
    permissions'', ''file main_ryzen confirms it is an ELF 64-bit executable'', ''The error i'
  diagnosis: 'The binary has a hardcoded ELF interpreter path from ComputeCanada: /cvmfs/soft.computecanada.ca/.../ld-linux-x86-64.so.2
    which does not exist on non-ComputeCanada Linux systems. The kernel cannot find the dynamic linker
    to start the process.

    ; Every dynamically linked ELF binary has an "interpreter'
  remedy: 'Use patchelf to replace the interpreter path: patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2
    main_ryzen This creates a patched binary (or modifies in place) that uses the standard system dynamic
    linker.

    ; None; After patching, verify with: readelf -l main_ryzen | grep interpreter Should show'
  severity: fatal
- id: dt_013
  symptom: 'FileNotFoundError or "No such file or directory" for files that clearly exist in the scenario
    directory. Commonly affects RZWQM.dat/rzwqm.dat, RZINIT.dat/rzinit.dat, IPNAMES.DAT/ipnames.dat, and
    LAYER.PLT/Layer.plt.

    ; ["FileNotFoundError: [Errno 2] No such file or directory: ''...RZWQM.dat''", ''File e'
  diagnosis: 'RZWQM2 was developed on Windows (case-insensitive filesystem). The codebase has mixed case
    conventions: template files use lowercase (rzwqm.dat, rzinit.dat) but the RZWQM class and some tools
    reference uppercase (RZWQM.dat, RZINIT.dat). On Linux (case-sensitive), these are different files.

    ; The For'
  remedy: 'The RZWQM class constructor uses _resolve_case() to try both cases and pick whichever exists
    on disk. The update_ipnames_paths tool detects actual filenames before writing to ipnames.dat. When
