# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: PRMS
  language: fortran
  implementation:
    id: prms-hpc-510
    version: 5.1.0 (2020-05-01)
    provenance: Fortran 90 process modules + C MMF framework; USGS PRMS 5.1.0 from github.com/nhm-usgs/prms.
  scientific_reference_version: PRMS-IV (Markstrom et al. 2015, USGS TM 6-B7), as implemented in USGS
    Fortran PRMS 5.1.0
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/PRMS/source/repo/prms/prms_hpc
    type: work_dir
pipeline:
  stages:
  - s0_basin_configuration
  - s1_forcing_preparation
  - s2_parameter_preparation
  - s3_control_file_generation
  - s4_model_execution
  - s5_output_analysis
  - s6_calibration
  - s7_troubleshooting
tools:
  count: 5
  files:
  - tools/convert_forcing_to_prms.py
  - tools/convert_params_to_prms.py
  - tools/generate_control_file.py
  - tools/parse_prms_output.py
  - tools/run_prms.py
inputs:
  forcing:
  - name: tmax
    unit: degrees Fahrenheit
  - name: tmin
    unit: degrees Fahrenheit
  - name: precip
    unit: inches/day
  - name: solar radiation
    unit: Langleys/day
  - name: humidity
    unit: percent (0-100)
  - name: wind speed
    unit: m/s
  - name: pan evaporation
    unit: inches/day
  - name: observed runoff
    unit: cfs (runoff_units=0)
  parameters:
  - name: hru_area
    unit: acres
  - name: hru_elev
    unit: feet or meters (per elev_units)
  - name: hru_lat
    unit: degrees
  - name: cov_type / covden_sum / covden_win
    unit: categorical / fraction
  - name: hru_percent_imperv
    unit: fraction
  - name: soil_type
    unit: categorical (1=sand,2=loam,3=clay)
  - name: soil_moist_max
    unit: inches
  - name: soil_rechr_max
    unit: inches
  - name: smidx_coef / smidx_exp
    unit: fraction / (1/inch)
  - name: carea_max
    unit: fraction
  - name: slowcoef_lin / slowcoef_sq / fastcoef_lin
    unit: fraction/day
  - name: soil2gw_max
    unit: inches
  - name: pref_flow_den
    unit: fraction
  - name: ssr2gw_rate
    unit: fraction/day
  - name: gwflow_coef
    unit: fraction/day
  - name: tmax_allsnow / tmax_allrain
    unit: degrees Fahrenheit
  - name: jh_coef / jh_coef_hru
    unit: 1/degF / degF
  - name: dday_intcp / dday_slope / radmax
    unit: various
  - name: rad_trncf / cecn_coef / freeh2o_cap
    unit: fraction / cal·cm-2·degC-1·day-1 / fraction
  - name: snarea_curve
    unit: fraction (ndeplval = 11 values)
  initial_conditions:
  - name: soil_moist_init_frac
    unit: fraction of soil_moist_max
  - name: soil_rechr_init_frac
    unit: fraction of soil_rechr_max
  - name: ssstor_init
    unit: inches
  - name: gwstor_init
    unit: inches
  boundary_conditions:
  - name: start_time / end_time
    unit: array of 6 long integers [year, month, day, hour, min, sec]
  - name: temp_module / precip_module / solrad_module / et_module / srunoff_module / strmflow_module /
      transp_module
    unit: module selector
  - name: elev_units / temp_units / precip_units / runoff_units
    unit: unit-system switch
  - name: initial_deltat
    unit: hours
  - name: prms_warmup
    unit: years
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - basin_cfs
  - basin_stflow_out
  - seg_outflow
  - basin_actet
  - basin_pweqv
  - basin_soil_moist
  - basin_ppt
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=1.000, KGE=1.000, R=1.000, 2 scorecard(s)'
  metrics:
    best_nse: 1.0
    best_kge: 0.99998
    best_r: 1.0
summary:
  total_tools: 5
  total_stage_docs: 8
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
