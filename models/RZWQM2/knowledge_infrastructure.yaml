# ============================================================================
# Knowledge Infrastructure — RZWQM2
# Root Zone Water Quality Model 2 (USDA-ARS)
# ============================================================================
# Built using the Knowledge Dissection Toolkit v1.0
# Source code: /Users/leo/Desktop/RZWQM2/data_prep_tools/rzwqm_file.py
# ============================================================================

package:
  name: "rzwqm2-knowledge-infrastructure"
  version: "2.0.0"
  description: "Knowledge infrastructure for autonomous operation of RZWQM2 with global data sources and VIC-routing coupling"
  target_model: "RZWQM2 (Root Zone Water Quality Model 2, USDA-ARS)"
  domain: "agricultural water quality, soil physics, crop growth"
  authors:
    - "Leo (Practitioner)"
    - "Claude (Knowledge Dissection)"
  license: "CC-BY-4.0"

# --- Pipeline definition ---
pipeline:
  stages:
    - id: "s0_global_data"
      name: "Global Data Acquisition"
      description: "Retrieve soil, forcing, crop, and elevation data from pluggable global sources (VIC global params, SoilGrids API, CMFD, ERA5, DSSAT databases)."
      order: 0
      depends_on: []
      skill_document: "docs/s0_global_data_skill.md"
      tools:
        - "site_csv_validator"
        - "soil_source_adapter"
        - "forcing_source_adapter"
        - "crop_selector"
        - "elevation_source_adapter"
      milestones:
        - id: "m0_sites_validated"
          description: "Input CSV of sites validated with all required columns and valid ranges"
          verification: "site_csv_validator returns SUCCESS with total_sites > 0"
        - id: "m0_data_retrieved"
          description: "Soil, forcing, and crop data retrieved for all sites"
          verification: "Each adapter returns normalized output with no missing required fields"

    - id: "s0_vic_coupling"
      name: "VIC-RZWQM2 Parameter Coupling"
      description: "Convert VIC soil parameters and forcing data to RZWQM2 format. Bridge between VIC-routing (HydroCraft) and RZWQM2 parameter spaces."
      order: 0
      depends_on: []
      skill_document: "docs/s0_vic_coupling_skill.md"
      tools:
        - "vic_soil_converter"
        - "vic_forcing_converter"
      milestones:
        - id: "m0_vic_soil_converted"
          description: "VIC soil parameters converted to RZWQM2 format with correct unit conversions"
          verification: "ksat in cm/hr (not mm/day), ws between 0.1-0.8, depths in cm"
        - id: "m0_vic_forcing_converted"
          description: "VIC forcing converted to RZWQM2 daily CSV with correct units"
          verification: "Output CSV has 9 columns, Tmin < Tmax, radiation in MJ/m2/day"

    - id: "s0_management_data"
      name: "Management Data Acquisition"
      description: "Retrieve crop management data from global geospatial datasets: dominant crop (CROPGRIDS), planting/harvest dates (Global Crop Calendar + China Phenology), fertilizer rates (NPKGRIDS), irrigation type (SPAM 2020)."
      order: 0
      depends_on: []
      skill_document: "docs/s0_management_data_skill.md"
      tools:
        - "crop_area_lookup"
        - "crop_calendar_lookup"
        - "fertilizer_rate_lookup"
        - "irrigation_type_lookup"
      milestones:
        - id: "m0_crop_identified"
          description: "Dominant crop identified for each site"
          verification: "crop_area_lookup returns non-null dominant_crop or user-specified crop is validated"
        - id: "m0_calendar_retrieved"
          description: "Planting and harvest DOY retrieved for each site"
          verification: "crop_calendar_lookup returns planting_doy in [1,366] and harvest_doy in [1,366]"
        - id: "m0_fertilizer_retrieved"
          description: "NPK fertilizer rates retrieved for each site"
          verification: "fertilizer_rate_lookup returns n_rate >= 0"
        - id: "m0_irrigation_determined"
          description: "Irrigation type determined for each site"
          verification: "irrigation_type_lookup returns is_irrigated boolean"

    - id: "s1_site_config"
      name: "Site/Grid Configuration"
      description: "Set geographic and site-specific properties: lat, lon, elevation, slope, area, ambient CO2, rainfall zone."
      order: 1
      depends_on: []
      skill_document: "docs/s1_site_config_skill.md"
      tools:
        - "write_site_properties"
      milestones:
        - id: "m1_site_set"
          description: "Grid general properties written to RZWQM.dat"
          verification: "Parse grid_general_property section of RZWQM.dat and verify lat/lon/elevation are non-zero"

    - id: "s2_met_prep"
      name: "Meteorological Data Preparation"
      description: "Prepare daily .met file with 10 columns: Julian day, year, Tmin, Tmax, wind, radiation, E-pan, RH, PAR, rain. Generate 36-line header."
      order: 2
      depends_on: []
      skill_document: "docs/s2_met_prep_skill.md"
      tools:
        - "generate_met_file"
        - "met_quality_check"
      milestones:
        - id: "m2_met_created"
          description: ".met file exists with correct header and data rows matching simulation period"
          verification: "Check .met has 36 header lines + one data line per day"
        - id: "m2_met_qc"
          description: "Met data passes QC: Tmin <= Tmax, 0 <= RH <= 100"
          verification: "Run met_quality_check tool"

    - id: "s3_brk_generation"
      name: "Breakpoint Rainfall Generation"
      description: "Convert daily precipitation from .met to breakpoint rainfall format (.brk). Each rain event gets a control line + breakpoint pairs."
      order: 3
      depends_on: ["s2_met_prep"]
      skill_document: "docs/s3_brk_generation_skill.md"
      tools:
        - "create_breakpoint_file"
      milestones:
        - id: "m3_brk_created"
          description: ".brk file exists with events for all rainy days"
          verification: "Check .brk file exists and has precipitation events"

    - id: "s4_soil_setup"
      name: "Soil Properties Configuration"
      description: "Set soil horizon depths, physical properties (texture, bulk density), hydraulic properties (Brooks-Corey parameters), micropore/macropore properties, infiltration parameters, and heat model parameters in RZWQM.dat."
      order: 4
      depends_on: ["s1_site_config"]
      skill_document: "docs/s4_soil_setup_skill.md"
      tools:
        - "soil_texture_classification"
        - "pedotransfer_hydraulic"
        - "write_soil_properties"
      milestones:
        - id: "m4_horizons_set"
          description: "Soil horizon depths written to RZWQM.dat"
          verification: "Parse soil physical depth section and verify horizon count > 0"
        - id: "m4_hydraulic_set"
          description: "Hydraulic properties (Ksat, bubbling pressure, pore size dist) written for each horizon"
          verification: "Parse hydraulic section and verify each horizon has 3 lines"

    - id: "s5_node_discretization"
      name: "Numerical Node Discretization"
      description: "Generate computational nodes from soil horizon boundaries using the nlayer_gen algorithm. Follows a half-way rule for numerical stability."
      order: 5
      depends_on: ["s4_soil_setup"]
      skill_document: "docs/s5_node_discretization_skill.md"
      tools:
        - "generate_nodes"
      milestones:
        - id: "m5_nodes_set"
          description: "Node depths written to RZWQM.dat with proper discretization"
          verification: "Parse node section and verify node boundaries align with horizon depths"

    - id: "s6_initial_conditions"
      name: "Initial Conditions Setup"
      description: "Set initial soil water content/tension, temperature, chemistry (pH, CEC, OC), and nutrient pools in RZINIT.dat."
      order: 6
      depends_on: ["s4_soil_setup"]
      skill_document: "docs/s6_initial_conditions_skill.md"
      tools:
        - "write_initial_conditions"
      milestones:
        - id: "m6_init_water"
          description: "Initial water tension and temperature set for each horizon"
          verification: "Parse RZINIT.dat water section"
        - id: "m6_init_chem"
          description: "Initial chemistry and nutrients set for each horizon"
          verification: "Parse RZINIT.dat chemistry and nutrient sections"

    - id: "s6_5_management_write"
      name: "Management Events Configuration"
      description: "Write crop management events (planting dates, fertilizer applications, harvest parameters, irrigation setup) to RZWQM.dat using data acquired from global geospatial datasets (CROPGRIDS, NPKGRIDS, Crop Calendar, SPAM 2020, China Phenology)."
      order: 6.5
      depends_on: ["s0_management_data", "s4_soil_setup"]
      skill_document: "docs/s0_management_data_skill.md"
      tools:
        - "write_management_events"
      milestones:
        - id: "m6_5_planting_written"
          description: "Planting events written to RZWQM.dat for all simulation years"
          verification: "Parse plant management section and verify num_plantings > 0"
        - id: "m6_5_fertilizer_written"
          description: "Fertilizer applications written to RZWQM.dat"
          verification: "Parse fertilizer section and verify num_applications >= 0"
        - id: "m6_5_irrigation_written"
          description: "Irrigation configuration written to RZWQM.dat"
          verification: "Parse irrigation section for correct mode (rainfed/irrigated)"

    - id: "s7_scenario_assembly"
      name: "Scenario Assembly"
      description: "Create scenario directory from template, configure ipnames.dat (paths to all input files + simulation dates), set cntrl.dat flags, and configure DSSAT crop model (.RZX paths)."
      order: 7
      depends_on: ["s2_met_prep", "s3_brk_generation", "s4_soil_setup", "s5_node_discretization", "s6_initial_conditions", "s6_5_management_write"]
      skill_document: "docs/s7_scenario_assembly_skill.md"
      tools:
        - "initialize_scenario"
        - "update_ipnames_paths"
        - "update_rzx_paths"
        - "update_crop_selection"
        - "update_cultivar"
      milestones:
        - id: "m7_scenario_dir"
          description: "Scenario directory exists with all required files"
          verification: "Check for ipnames.dat, cntrl.dat, rzwqm.dat, rzinit.dat, plgen.dat"
        - id: "m7_ipnames_valid"
          description: "All paths in ipnames.dat point to existing files"
          verification: "Read each path from ipnames.dat and verify file exists"

    - id: "s8_execution"
      name: "Model Execution"
      description: "Run RZWQM2 binary from the scenario directory. On Windows: RZWQMrelease.exe. On Linux: main_ryzen (needs patchelf for interpreter). Binary reads ipnames.dat from CWD."
      order: 8
      depends_on: ["s7_scenario_assembly"]
      skill_document: "docs/s8_execution_skill.md"
      tools:
        - "run_rzwqm2"
      milestones:
        - id: "m8_started"
          description: "RZWQM2 binary starts and begins reading input files"
          verification: "Check stdout for 'Reading...' messages"
        - id: "m8_completed"
          description: ".ana output file is created with simulation results"
          verification: "Check .ana file exists and has data rows"

    - id: "s9_result_parsing"
      name: "Result Parsing and Evaluation"
      description: "Parse .ana daily output file and Layer.plt profile output. Extract specific variables (tile drainage, snow depth, soil temperature) and compare with observations."
      order: 9
      depends_on: ["s8_execution"]
      skill_document: "docs/s9_result_parsing_skill.md"
      tools:
        - "parse_ana_output"
        - "parse_layer_output"
      milestones:
        - id: "m9_parsed"
          description: "Simulation variables extracted as datetime-indexed dictionaries"
          verification: "Check parsed data covers simulation period"

    - id: "s10_mass_generation"
      name: "Mass Project Generation"
      description: "Generate multiple RZWQM2 scenarios from a CSV of sites. Orchestrates the full pipeline (S0-S7) for each site with pluggable data sources and optional VIC coupling."
      order: 10
      depends_on: ["s0_global_data"]
      skill_document: "docs/s10_mass_generation_skill.md"
      tools:
        - "mass_project_generator"
      milestones:
        - id: "m10_scenarios_generated"
          description: "All scenario directories created with complete input files"
          verification: "Each site_id directory contains ipnames.dat, cntrl.dat, rzwqm.dat, rzinit.dat, plgen.dat"

    - id: "s10_calibration"
      name: "Model Calibration"
      description: "Automated calibration of RZWQM2 soil and drainage parameters. Uses LHS/Sobol sampling for initial exploration, then agent-guided 10-run batches. Calibrates 6 parameters: Ksat, ws, fc33, lateral_ksat, drain_spacing, field_sat."
      order: 11
      depends_on: ["s8_execution", "s9_result_parsing"]
      tools:
        - "modify_soil_params"
        - "parse_rzwqm2_output"
        - "rzwqm2_calibrate"
      milestones:
        - id: "m10c_baseline"
          description: "Baseline simulation completed with default parameters and metrics computed"
          verification: "parse_rzwqm2_output returns valid metrics for uncalibrated run"
        - id: "m10c_converged"
          description: "Calibration converged or max batches reached with best parameter set identified"
          verification: "Best NSE > baseline NSE and parameter set is physically reasonable"

# --- Layer 1: Validated Tools ---
tools:
  - id: "write_site_properties"
    name: "Write Site Properties"
    description: "Write geographic/site properties (lat, lon, elevation, slope, area, ambient CO2) to the grid general property section of RZWQM.dat"
    stage: "s1_site_config"
    script_path: "tools/s1_site_config/write_site_properties.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root directory"
        required: true
        example: "/Users/leo/Desktop/RZWQM2/projects/"
      - name: "station_id"
        type: "string"
        description: "Station/scenario identifier"
        required: true
        example: "534"
      - name: "lat"
        type: "number"
        description: "Latitude in radians"
        required: true
        example: "0.7854"
      - name: "lon"
        type: "number"
        description: "Longitude in radians"
        required: true
        example: "-1.3963"
      - name: "elevation"
        type: "number"
        description: "Elevation in meters"
        required: true
        example: "300"
      - name: "slope"
        type: "number"
        description: "Slope as fraction"
        required: true
        example: "0.02"
    outputs:
      - name: "rzwqm_dat"
        type: "file"
        description: "Modified RZWQM.dat with updated site properties"
        path_pattern: "{project_path}/{station_id}/RZWQM.dat"
    preconditions:
      - "RZWQM.dat exists in the scenario directory"
      - "Latitude and longitude are in RADIANS (not degrees)"
    postconditions:
      - "Grid general property section of RZWQM.dat contains updated values"

  - id: "generate_met_file"
    name: "Generate Meteorological File"
    description: "Create RZWQM2 .met file with 36-line header and daily data (Julian day, year, Tmin, Tmax, wind, radiation, E-pan, RH, PAR, rain)"
    stage: "s2_met_prep"
    script_path: "tools/s2_met_prep/generate_met_file.py"
    language: "python"
    inputs:
      - name: "input_csv"
        type: "file"
        description: "CSV with daily weather data (date, tmin, tmax, wind, rad, rh, precip)"
        required: true
        example: "weather_data.csv"
      - name: "output_met_path"
        type: "file"
        description: "Output .met file path"
        required: true
        example: "Meteorology/station.met"
      - name: "start_date"
        type: "string"
        description: "Simulation start date (YYYY-MM-DD)"
        required: true
        example: "2011-01-01"
      - name: "end_date"
        type: "string"
        description: "Simulation end date (YYYY-MM-DD)"
        required: true
        example: "2021-12-31"
    outputs:
      - name: "met_file"
        type: "file"
        description: "RZWQM2-format .met file"
        path_pattern: "{output_met_path}"
    preconditions:
      - "Input CSV has columns for date, tmin, tmax, wind, radiation, RH, precipitation"
      - "Units: Tmin/Tmax in C, wind in km/day, radiation in MJ/m2/day, RH in %, rain in mm"
    postconditions:
      - ".met file has exactly 36 header lines"
      - "Data rows match the number of days in the simulation period"

  - id: "met_quality_check"
    name: "Meteorological Data Quality Check"
    description: "Validate .met file: swap Tmin/Tmax if inverted, cap RH at 100%"
    stage: "s2_met_prep"
    script_path: "tools/s2_met_prep/met_quality_check.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station identifier"
        required: true
    outputs:
      - name: "corrected_met"
        type: "file"
        description: "Corrected .met file (in-place)"
        path_pattern: "{project_path}/Meteorology/{station_id}.met"
    preconditions:
      - ".met file exists"
    postconditions:
      - "All rows have Tmin <= Tmax"
      - "All rows have 0 <= RH <= 100"

  - id: "create_breakpoint_file"
    name: "Create Breakpoint Rainfall File"
    description: "Generate .brk file from daily precipitation in .met. Each rain day gets 2 breakpoints: 0 at time 0 and total precip at estimated duration."
    stage: "s3_brk_generation"
    script_path: "tools/s3_brk_generation/create_breakpoint_file.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station identifier"
        required: true
    outputs:
      - name: "brk_file"
        type: "file"
        description: "Breakpoint rainfall file"
        path_pattern: "{project_path}/Meteorology/{station_id}.brk"
    preconditions:
      - ".met file exists with precipitation data in column 10"
    postconditions:
      - ".brk file has header, calendar code, and events for rainy days"
      - "Precipitation values in .brk are in INCHES (converted from mm by dividing by 25.4)"

  - id: "soil_texture_classification"
    name: "Soil Texture Classification"
    description: "Classify soil texture using the USDA texture triangle from sand/silt/clay percentages"
    stage: "s4_soil_setup"
    script_path: "tools/s4_soil_setup/soil_texture_classification.py"
    language: "python"
    inputs:
      - name: "sand"
        type: "number"
        description: "Sand percentage (0-100)"
        required: true
      - name: "clay"
        type: "number"
        description: "Clay percentage (0-100)"
        required: true
    outputs:
      - name: "texture_class"
        type: "value"
        description: "USDA texture class string"
        path_pattern: ""
    preconditions:
      - "sand + clay <= 100"
      - "Both values >= 0"
    postconditions:
      - "Returns one of: sand, loamy sand, sandy loam, loam, silt loam, silt, sandy clay loam, clay loam, silty clay loam, sandy clay, silty clay, clay"

  - id: "pedotransfer_hydraulic"
    name: "Pedotransfer Functions for Hydraulic Properties"
    description: "Estimate Brooks-Corey hydraulic parameters from soil texture or measured water retention data. Estimates: pore size distribution, bubbling pressure, Ksat, field capacity, wilting point."
    stage: "s4_soil_setup"
    script_path: "tools/s4_soil_setup/pedotransfer_hydraulic.py"
    language: "python"
    inputs:
      - name: "texture_class"
        type: "string"
        description: "USDA texture class from soil_texture_classification"
        required: true
      - name: "fc33_measured"
        type: "number"
        description: "Measured field capacity at 33 kPa (optional)"
        required: false
      - name: "fc1500_measured"
        type: "number"
        description: "Measured wilting point at 1500 kPa (optional)"
        required: false
      - name: "ksat_measured"
        type: "number"
        description: "Measured saturated hydraulic conductivity cm/hr (optional)"
        required: false
      - name: "ws_measured"
        type: "number"
        description: "Measured saturated water content (optional)"
        required: false
    outputs:
      - name: "hydraulic_params"
        type: "value"
        description: "Dict with: pore_size_dist, bubbling_pressure, ksat, ws, wr, fc33, fc10, fc15, eps(N2), C2"
        path_pattern: ""
    preconditions:
      - "texture_class is a valid USDA texture"
    postconditions:
      - "All hydraulic parameters are physically reasonable (positive Ksat, 0 < wr < ws < 1)"

  - id: "write_soil_properties"
    name: "Write Complete Soil Properties to RZWQM.dat"
    description: "Write all soil properties to RZWQM.dat: horizon depths, physical properties, hydraulic properties, heat model, micropore, macropore, and infiltration parameters."
    stage: "s4_soil_setup"
    script_path: "tools/s4_soil_setup/write_soil_properties.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station identifier"
        required: true
      - name: "soil_config"
        type: "config"
        description: "Dict with soil properties per horizon"
        required: true
    outputs:
      - name: "rzwqm_dat"
        type: "file"
        description: "Modified RZWQM.dat"
        path_pattern: "{project_path}/{station_id}/RZWQM.dat"
    preconditions:
      - "RZWQM.dat exists"
      - "soil_config has entries for all horizons"
    postconditions:
      - "All soil sections updated: physical, hydraulic, heat, micropore, macropore, infiltration"

  - id: "generate_nodes"
    name: "Generate Computational Nodes"
    description: "Generate numerical discretization nodes from soil horizon depths using the nlayer_gen algorithm (RZWQM's built-in half-way rule)."
    stage: "s5_node_discretization"
    script_path: "tools/s5_node_discretization/generate_nodes.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station identifier"
        required: true
      - name: "horizon_depths"
        type: "config"
        description: "List of horizon depths in cm"
        required: true
        example: "[15, 30, 60, 100, 200]"
    outputs:
      - name: "rzwqm_dat"
        type: "file"
        description: "Modified RZWQM.dat with node discretization"
        path_pattern: "{project_path}/{station_id}/RZWQM.dat"
    preconditions:
      - "Horizon depths are in ascending order"
      - "Last horizon depth <= 3000 cm"
    postconditions:
      - "Node boundaries align with horizon boundaries"
      - "Node count <= 300 (MAXNOD)"

  - id: "write_initial_conditions"
    name: "Write Initial Conditions to RZINIT.dat"
    description: "Write initial soil water content/tension, temperature, chemistry (pH, CEC, organic carbon), and nutrient pools to RZINIT.dat."
    stage: "s6_initial_conditions"
    script_path: "tools/s6_initial_conditions/write_initial_conditions.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station identifier"
        required: true
      - name: "num_horizons"
        type: "number"
        description: "Number of soil horizons"
        required: true
    outputs:
      - name: "rzinit_dat"
        type: "file"
        description: "Modified RZINIT.dat"
        path_pattern: "{project_path}/{station_id}/RZINIT.dat"
    preconditions:
      - "RZINIT.dat exists"
      - "Horizon count matches RZWQM.dat"
    postconditions:
      - "Water, chemistry, and nutrient sections have entries for each horizon"

  - id: "initialize_scenario"
    name: "Initialize Scenario from Template"
    description: "Create a new scenario directory by copying a template scenario, updating ipnames.dat paths and simulation dates."
    stage: "s7_scenario_assembly"
    script_path: "tools/s7_scenario_assembly/initialize_scenario.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "template_name"
        type: "string"
        description: "Name of the template scenario to copy"
        required: true
        example: "New Scenario"
      - name: "new_name"
        type: "string"
        description: "Name of the new scenario"
        required: true
      - name: "start_date"
        type: "string"
        description: "Simulation start date (DD MM YYYY)"
        required: true
      - name: "end_date"
        type: "string"
        description: "Simulation end date (DD MM YYYY)"
        required: true
      - name: "copy_snow"
        type: "string"
        description: "Whether to copy .sno file (true/false)"
        required: false
        example: "true"
    outputs:
      - name: "scenario_dir"
        type: "directory"
        description: "New scenario directory"
        path_pattern: "{project_path}/{new_name}/"
    preconditions:
      - "Template scenario directory exists"
      - "Template has valid ipnames.dat, cntrl.dat, rzwqm.dat, rzinit.dat"
    postconditions:
      - "New directory exists with all template files"
      - "ipnames.dat updated with new paths and simulation dates"

  - id: "update_ipnames_paths"
    name: "Update ipnames.dat Paths"
    description: "Update all file paths in ipnames.dat to point to correct locations. Used when moving scenarios between directories or platforms."
    stage: "s7_scenario_assembly"
    script_path: "tools/s7_scenario_assembly/update_ipnames_paths.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station/scenario identifier"
        required: true
      - name: "new_root"
        type: "string"
        description: "New root directory for all paths"
        required: true
    outputs:
      - name: "ipnames_dat"
        type: "file"
        description: "Updated ipnames.dat"
        path_pattern: "{project_path}/{station_id}/ipnames.dat"
    preconditions:
      - "ipnames.dat exists"
    postconditions:
      - "All 8 file paths in ipnames.dat are valid and point to existing files"

  - id: "update_rzx_paths"
    name: "Update RZX Database Paths"
    description: "Update DSSAT database path and project path in all .RZX files within a scenario directory. Fixes Windows paths for Linux execution."
    stage: "s7_scenario_assembly"
    script_path: "tools/s7_scenario_assembly/update_rzx_paths.py"
    language: "python"
    inputs:
      - name: "scenario_dir"
        type: "directory"
        description: "Scenario directory containing .RZX files"
        required: true
      - name: "dssat_db_path"
        type: "string"
        description: "New DSSAT database directory path"
        required: true
        example: "DSSAT/"
      - name: "project_path"
        type: "string"
        description: "New project directory path"
        required: true
        example: "./"
    outputs:
      - name: "rzx_files"
        type: "file"
        description: "Modified .RZX files with updated paths"
        path_pattern: "{scenario_dir}/*.RZX"
    preconditions:
      - "At least one .RZX file exists in the scenario directory"
      - "DSSAT database directory exists at the specified path"
    postconditions:
      - "All .RZX files have updated database and project paths"

  - id: "update_crop_selection"
    name: "Update Crop Cultivar Selection"
    description: "Updates crop cultivar ID in both rzwqm.dat and RZCropSel.rzq. Defaults to IB1068 (maize), 990002 (soybean), 990003 (wheat) if cultivar_id not provided."
    stage: "s7_scenario_assembly"
    script_path: "tools/s7_scenario_assembly/update_crop_selection.py"
    language: "python"
    inputs:
      - name: "scenario_dir"
        type: "directory"
        description: "Scenario directory containing rzwqm.dat and RZCropSel.rzq"
        required: true
      - name: "crop_code"
        type: "string"
        description: "DSSAT crop code: 7000 (maize), 7001 (soybean), 7002 (wheat)"
        required: true
        example: "7000"
      - name: "crop_name"
        type: "string"
        description: "Crop name matching the crop code"
        required: true
        example: "maize"
      - name: "cultivar_id"
        type: "string"
        description: "DSSAT cultivar ID to set (optional, uses crop-specific default)"
        required: false
        example: "IB1068"
      - name: "cultivar_desc"
        type: "string"
        description: "Cultivar description text (optional)"
        required: false
    outputs:
      - name: "rzwqm_dat"
        type: "file"
        description: "Updated rzwqm.dat with new cultivar ID"
        path_pattern: "{scenario_dir}/rzwqm.dat"
      - name: "rzcropsel_rzq"
        type: "file"
        description: "Updated RZCropSel.rzq with new cultivar ID"
        path_pattern: "{scenario_dir}/RZCropSel.rzq"
    preconditions:
      - "rzwqm.dat and RZCropSel.rzq exist in the scenario directory"
    postconditions:
      - "Cultivar ID is consistent across rzwqm.dat and RZCropSel.rzq"
    diagnostic_triplets: ["dt_021"]

  - id: "update_cultivar"
    name: "Update DSSAT Cultivar Parameters from China Library"
    description: "Overwrites DSSAT .CUL file(s) with Chinese cultivar params. Crop-aware: maize 6+2 params, wheat 7 params, soybean 15 params. Updates BOTH root and DSSAT/ CUL files. Auto-selects cultivar by latitude. If a requested cultivar_id falls in a numbering gap (e.g. CN0005–CN0010 don't exist), snaps to the numerically closest existing ID and prints a [WARNING] to stderr — see dt_027."
    stage: "s7_scenario_assembly"
    script_path: "tools/s7_scenario_assembly/update_cultivar.py"
    language: "python"
    inputs:
      - name: "scenario_dir"
        type: "directory"
        description: "Scenario directory containing .CUL files"
        required: true
      - name: "crop"
        type: "string"
        description: "Crop type: maize, wheat, or soybean"
        required: true
        example: "wheat"
      - name: "lat"
        type: "float"
        description: "Latitude for auto-selecting cultivar from China library (optional)"
        required: false
        example: 33.0
      - name: "cultivar_id"
        type: "string"
        description: "Specific cultivar ID to use (optional, overrides lat-based selection)"
        required: false
    outputs:
      - name: "cul_files"
        type: "file"
        description: "Updated .CUL files in root and DSSAT/ directories"
        path_pattern: "{scenario_dir}/*.CUL"
    preconditions:
      - "At least one .CUL file exists in the scenario directory"
    postconditions:
      - "CUL files in both root and DSSAT/ contain the selected Chinese cultivar parameters"
      - "Parameter count matches crop type (maize 6+2, wheat 7, soybean 15)"
    diagnostic_triplets: ["dt_022", "dt_023", "dt_024", "dt_025", "dt_026", "dt_027"]

  - id: "run_rzwqm2"
    name: "Run RZWQM2 Model"
    description: "Execute RZWQM2 binary from the scenario directory. On Windows: RZWQMrelease.exe. On Linux/Docker: main_ryzen (with patchelf). Binary reads ipnames.dat from CWD."
    stage: "s8_execution"
    script_path: "tools/s8_execution/run_rzwqm2.py"
    language: "python"
    inputs:
      - name: "scenario_dir"
        type: "directory"
        description: "Scenario directory containing ipnames.dat"
        required: true
      - name: "binary_path"
        type: "file"
        description: "Path to RZWQM2 executable"
        required: true
      - name: "platform"
        type: "string"
        description: "Execution platform: windows, linux, docker"
        required: true
        example: "docker"
    outputs:
      - name: "ana_file"
        type: "file"
        description: "Daily output file (.ana)"
        path_pattern: "Analysis/{station_id}.ana"
    preconditions:
      - "ipnames.dat exists in scenario directory"
      - "All input files referenced by ipnames.dat exist"
      - "Binary is executable and platform-compatible"
    postconditions:
      - ".ana file created in Analysis directory"
      - "Binary exits without segfault"

  - id: "parse_ana_output"
    name: "Parse .ana Output File"
    description: "Parse RZWQM2 daily output (.ana) file to extract specific variables as datetime-indexed dictionaries. Supports: tile_drainage (col 10, mm), snow (col 91)."
    stage: "s9_result_parsing"
    script_path: "tools/s9_result_parsing/parse_ana_output.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station identifier"
        required: true
      - name: "variable"
        type: "string"
        description: "Variable to extract: snow, tile_drainage"
        required: true
    outputs:
      - name: "timeseries"
        type: "value"
        description: "Dict of {datetime: value}"
        path_pattern: ""
    preconditions:
      - ".ana file exists"
      - "Data starts at line 24 (after 23 header lines)"
    postconditions:
      - "Returned dict has entries for each simulation day"
      - "Tile drainage values are in mm (multiplied by 10 from cm)"

  - id: "parse_layer_output"
    name: "Parse Layer.plt Output File"
    description: "Parse RZWQM2 profile output (Layer.plt) to extract depth-resolved variables like soil temperature by node."
    stage: "s9_result_parsing"
    script_path: "tools/s9_result_parsing/parse_layer_output.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station identifier"
        required: true
      - name: "column_num"
        type: "number"
        description: "Column index for desired variable (e.g., 4 for soil temperature)"
        required: true
    outputs:
      - name: "depth_timeseries"
        type: "value"
        description: "Dict of {depth: [values]} for each node depth"
        path_pattern: ""
    preconditions:
      - "Layer.plt file exists in scenario directory"
    postconditions:
      - "Returned dict has entries for discretization node depths"

  # --- S0: Global Data Acquisition Tools ---
  - id: "site_csv_validator"
    name: "Validate Sites CSV"
    description: "Validate input CSV of sites for mass project generation. Checks required columns, coordinate ranges, date formats, and crop names."
    stage: "s0_global_data"
    script_path: "tools/s0_global_data/site_csv_validator.py"
    language: "python"
    inputs:
      - name: "sites_csv"
        type: "file"
        description: "Path to CSV with columns: site_id, lat, lon, start_date, end_date, crop_name"
        required: true
    outputs:
      - name: "validation_result"
        type: "value"
        description: "JSON with validated sites list and summary"
    preconditions:
      - "CSV file exists and is readable"
    postconditions:
      - "All required columns present and valid"

  - id: "soil_source_adapter"
    name: "Pluggable Soil Data Retrieval"
    description: "Retrieve soil properties from multiple global sources (VIC global params, SoilGrids API, gSSURGO, Canadian shapefiles, HWSD) and return normalized JSON."
    stage: "s0_global_data"
    script_path: "tools/s0_global_data/soil_source_adapter.py"
    language: "python"
    inputs:
      - name: "lat"
        type: "number"
        description: "Latitude in decimal degrees"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude in decimal degrees"
        required: true
      - name: "source"
        type: "string"
        description: "Source: vic_global, soilgrids, gssurgo, canada_shapefile, hwsd"
        required: true
    outputs:
      - name: "soil_data"
        type: "value"
        description: "Normalized JSON with horizons array (depth, sand, clay, ksat, ws, fc33, fc15, texture_class)"
    preconditions:
      - "Source data available (file path or API)"
    postconditions:
      - "All horizons have ksat, ws, and texture_class filled"

  - id: "forcing_source_adapter"
    name: "Pluggable Forcing Data Retrieval"
    description: "Retrieve meteorological forcing from CMFD, VIC files, ERA5 API, or user CSV and produce RZWQM2-format daily CSV."
    stage: "s0_global_data"
    script_path: "tools/s0_global_data/forcing_source_adapter.py"
    language: "python"
    inputs:
      - name: "lat"
        type: "number"
        description: "Latitude in decimal degrees"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude in decimal degrees"
        required: true
      - name: "source"
        type: "string"
        description: "Source: cmfd, vic_forcing, era5_api, csv"
        required: true
    outputs:
      - name: "forcing_csv"
        type: "file"
        description: "Daily CSV: date,tmin,tmax,wind,radiation,epan,rh,par,rain"
    preconditions:
      - "Source data available"
    postconditions:
      - "Output CSV has one row per day covering the requested period"

  - id: "crop_selector"
    name: "DSSAT Crop Selector"
    description: "Map crop common names to DSSAT file prefixes and return cultivar/ecotype/species file paths. Supports 41 crops and VIC vegetation class mapping."
    stage: "s0_global_data"
    script_path: "tools/s0_global_data/crop_selector.py"
    language: "python"
    inputs:
      - name: "crop_name"
        type: "string"
        description: "Common crop name (e.g., maize, wheat, soybean)"
        required: true
    outputs:
      - name: "crop_info"
        type: "value"
        description: "JSON with dssat_prefix, cultivar_file, ecotype_file, species_file paths"
    preconditions:
      - "DSSAT database directory exists"
    postconditions:
      - "dssat_prefix is non-empty and maps to existing files"

  - id: "elevation_source_adapter"
    name: "Elevation Retrieval"
    description: "Retrieve elevation for a lat/lon point from CMFD NetCDF, SRTM API, or manual value."
    stage: "s0_global_data"
    script_path: "tools/s0_global_data/elevation_source_adapter.py"
    language: "python"
    inputs:
      - name: "lat"
        type: "number"
        description: "Latitude in decimal degrees"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude in decimal degrees"
        required: true
      - name: "source"
        type: "string"
        description: "Source: cmfd_elev, srtm_api, manual, flat"
        required: true
    outputs:
      - name: "elevation"
        type: "value"
        description: "Elevation in meters"
    preconditions:
      - "Source data or API available"
    postconditions:
      - "Elevation in [-500, 9000] m range"

  # --- S0: VIC Coupling Tools ---
  - id: "vic_soil_converter"
    name: "VIC-to-RZWQM2 Soil Converter"
    description: "Convert VIC 53-column soil parameters to RZWQM2 soil config JSON. Applies unit conversions: ksat mm/day->cm/hr, expt->pore_size_dist, bulk_density->ws."
    stage: "s0_vic_coupling"
    script_path: "tools/s0_vic_coupling/vic_soil_converter.py"
    language: "python"
    inputs:
      - name: "vic_soil_file"
        type: "file"
        description: "Path to VIC soil parameter file (global_soil_param_new.txt or SOIL_PARAM_COMPLETE.txt)"
        required: true
      - name: "lat"
        type: "number"
        description: "Latitude (finds nearest grid cell)"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude (finds nearest grid cell)"
        required: true
    outputs:
      - name: "rzwqm2_soil"
        type: "value"
        description: "JSON with RZWQM2 horizon array including converted hydraulic parameters"
    preconditions:
      - "VIC soil parameter file exists with 53+ columns"
    postconditions:
      - "ksat in cm/hr, ws in [0.1, 0.8], depths in cm"

  - id: "vic_forcing_converter"
    name: "VIC-to-RZWQM2 Forcing Converter"
    description: "Convert VIC forcing files to RZWQM2 daily meteorological CSV. Applies: K->C, W/m2->MJ/m2/day, m/s->km/day, specific humidity->RH%."
    stage: "s0_vic_coupling"
    script_path: "tools/s0_vic_coupling/vic_forcing_converter.py"
    language: "python"
    inputs:
      - name: "vic_forcing_dir"
        type: "directory"
        description: "Directory with VIC forcing files"
        required: true
      - name: "lat"
        type: "number"
        description: "Latitude"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude"
        required: true
    outputs:
      - name: "rzwqm2_csv"
        type: "file"
        description: "Daily CSV in RZWQM2 format: date,tmin,tmax,wind,radiation,epan,rh,par,rain"
    preconditions:
      - "VIC forcing directory contains text or NetCDF files"
    postconditions:
      - "Output has Tmin<Tmax, wind in km/day, radiation in MJ/m2/day"

  # --- S0: Management Data Acquisition Tools ---
  - id: "crop_area_lookup"
    name: "Dominant Crop Lookup (CROPGRIDS)"
    description: "Sample CROPGRIDS v1.08 at a lat/lon to find the dominant crop by harvested area. Scans DSSAT-mapped crops only."
    stage: "s0_management_data"
    script_path: "tools/s0_management_data/crop_area_lookup.py"
    language: "python"
    inputs:
      - name: "lat"
        type: "number"
        description: "Latitude in decimal degrees"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude in decimal degrees"
        required: true
      - name: "cropgrids_zip_path"
        type: "file"
        description: "Path to CROPGRIDSv1.08_NC_maps.zip"
        required: false
        example: "/home/server/Crop_model_dataset/22491997/CROPGRIDSv1.08_NC_maps.zip"
    outputs:
      - name: "dominant_crop"
        type: "value"
        description: "JSON with dominant_crop name and top_crops list"
    preconditions:
      - "CROPGRIDS zip file exists"
    postconditions:
      - "Returns crop name or null if no crops at pixel"

  - id: "crop_calendar_lookup"
    name: "Crop Calendar Lookup (Sacks + China Phenology)"
    description: "Look up planting/harvest DOY from the Global Crop Calendar (0.5 deg) with optional China Phenology (1km) override."
    stage: "s0_management_data"
    script_path: "tools/s0_management_data/crop_calendar_lookup.py"
    language: "python"
    inputs:
      - name: "lat"
        type: "number"
        description: "Latitude in decimal degrees"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude in decimal degrees"
        required: true
      - name: "crop_name"
        type: "string"
        description: "Crop name (will be harmonized)"
        required: true
      - name: "year"
        type: "number"
        description: "Year for China phenology (default 2019)"
        required: false
    outputs:
      - name: "calendar"
        type: "value"
        description: "JSON with planting_doy, harvest_doy, season_length_days, source"
    preconditions:
      - "Crop calendar NetCDF files exist"
    postconditions:
      - "planting_doy in [1,366], harvest_doy in [1,366]"

  - id: "fertilizer_rate_lookup"
    name: "Fertilizer Rate Lookup (NPKGRIDS)"
    description: "Look up N/P2O5/K2O application rates from NPKGRIDS v1.08 and split into RZWQM2 fertilizer application events."
    stage: "s0_management_data"
    script_path: "tools/s0_management_data/fertilizer_rate_lookup.py"
    language: "python"
    inputs:
      - name: "lat"
        type: "number"
        description: "Latitude in decimal degrees"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude in decimal degrees"
        required: true
      - name: "crop_name"
        type: "string"
        description: "Crop name (will be harmonized)"
        required: true
      - name: "split_strategy"
        type: "string"
        description: "N split: single, two_split (default), three_split"
        required: false
    outputs:
      - name: "fertilizer"
        type: "value"
        description: "JSON with rates and applications list ready for write_management_events"
    preconditions:
      - "NPKGRIDS zip file exists"
    postconditions:
      - "n_rate_kg_ha >= 0, applications list populated"

  - id: "irrigation_type_lookup"
    name: "Irrigation Type Lookup (SPAM 2020)"
    description: "Determine irrigated vs rainfed status from SPAM 2020 harvested area data. Optionally extract yield target."
    stage: "s0_management_data"
    script_path: "tools/s0_management_data/irrigation_type_lookup.py"
    language: "python"
    inputs:
      - name: "lat"
        type: "number"
        description: "Latitude in decimal degrees"
        required: true
      - name: "lon"
        type: "number"
        description: "Longitude in decimal degrees"
        required: true
      - name: "crop_name"
        type: "string"
        description: "Crop name (will be harmonized)"
        required: true
    outputs:
      - name: "irrigation"
        type: "value"
        description: "JSON with is_irrigated bool, irrigated_fraction, yield_kg_ha"
    preconditions:
      - "SPAM CSV zip files exist"
    postconditions:
      - "is_irrigated is boolean, irrigated_fraction in [0,1]"

  # --- S6.5: Management Write Tools ---
  - id: "write_management_events"
    name: "Write Management Events to RZWQM.dat"
    description: "Write planting, fertilizer, harvest, and irrigation management events to RZWQM.dat by locating section delimiters and replacing data lines."
    stage: "s6_5_management_write"
    script_path: "tools/s6_management_write/write_management_events.py"
    language: "python"
    inputs:
      - name: "project_path"
        type: "directory"
        description: "RZWQM2 project root directory"
        required: true
      - name: "station_id"
        type: "string"
        description: "Station/scenario identifier"
        required: true
      - name: "management_config"
        type: "config"
        description: "JSON with planting, fertilizer, irrigation sub-dicts"
        required: true
      - name: "simulation_years"
        type: "config"
        description: "List of years to generate planting events for"
        required: true
    outputs:
      - name: "rzwqm_dat"
        type: "file"
        description: "Modified RZWQM.dat with updated management sections"
        path_pattern: "{project_path}/{station_id}/RZWQM.dat"
    preconditions:
      - "RZWQM.dat exists in the scenario directory"
      - "management_config has at least one of: planting, fertilizer, irrigation"
    postconditions:
      - "Management sections in RZWQM.dat contain correct number of events"
      - "All dates are valid calendar dates"

  # --- S10: Mass Generation Tools ---
  - id: "mass_project_generator"
    name: "Mass RZWQM2 Project Generator"
    description: "Generate N complete RZWQM2 scenarios from a CSV of sites. Orchestrates S0-S7 pipeline for each site with pluggable soil/forcing sources and optional VIC coupling."
    stage: "s10_mass_generation"
    script_path: "tools/s10_mass_generation/mass_project_generator.py"
    language: "python"
    inputs:
      - name: "sites_csv"
        type: "file"
        description: "Validated CSV of sites (from site_csv_validator)"
        required: true
      - name: "project_path"
        type: "directory"
        description: "Root path for RZWQM2 project output"
        required: true
      - name: "template_scenario"
        type: "string"
        description: "Name of template scenario to clone"
        required: true
      - name: "vic_coupling_mode"
        type: "string"
        description: "VIC coupling: none, soil_only, forcing_only, full"
        required: false
        example: "none"
    outputs:
      - name: "summary"
        type: "value"
        description: "JSON with total/succeeded/failed counts and per-site results"
    preconditions:
      - "Template scenario directory exists"
      - "Sites CSV has been validated"
    postconditions:
      - "Each successful site has a scenario directory with all input files"

  # --- S10: Calibration Tools ---
  - id: "modify_soil_params"
    name: "Modify Soil/Drain Parameters in RZWQM.dat"
    description: "Modify Ksat, ws, fc33, lateral_ksat, drain_spacing, field_sat in rzwqm.dat. Accepts 3 multipliers (applied to existing values) and 3 absolute values. Includes backup/restore."
    stage: "s10_calibration"
    script_path: "tools/s10_calibration/modify_soil_params.py"
    language: "python"
    inputs:
      - name: "scenario_dir"
        type: "directory"
        description: "Scenario directory containing rzwqm.dat"
        required: true
      - name: "ksat_mult"
        type: "number"
        description: "Multiplier for saturated hydraulic conductivity"
        required: true
        example: 1.5
      - name: "ws_mult"
        type: "number"
        description: "Multiplier for saturated water content (porosity)"
        required: true
        example: 1.0
      - name: "fc33_mult"
        type: "number"
        description: "Multiplier for field capacity at 33 kPa"
        required: true
        example: 0.9
      - name: "lateral_ksat"
        type: "number"
        description: "Absolute lateral Ksat value (cm/hr)"
        required: true
        example: 2.0
      - name: "drain_spacing"
        type: "number"
        description: "Absolute tile drain spacing (cm)"
        required: true
        example: 2000.0
      - name: "field_sat"
        type: "number"
        description: "Absolute field saturation fraction (0-1) for constant-flux BC"
        required: true
        example: 0.85
    outputs:
      - name: "rzwqm_dat"
        type: "file"
        description: "Modified rzwqm.dat with updated soil/drain parameters"
        path_pattern: "{scenario_dir}/rzwqm.dat"
    preconditions:
      - "rzwqm.dat exists in the scenario directory"
      - "Backup of original rzwqm.dat is created before modification"
    postconditions:
      - "Ksat, ws, fc33 multiplied by respective multipliers"
      - "lateral_ksat, drain_spacing, field_sat set to absolute values"

  - id: "parse_rzwqm2_output"
    name: "Parse RZWQM2 Output and Compute Metrics"
    description: "Extract yield, soil moisture, ET from .ana files. Compute RMSE, NSE, PBIAS against observations."
    stage: "s10_calibration"
    script_path: "tools/s10_calibration/parse_rzwqm2_output.py"
    language: "python"
    inputs:
      - name: "scenario_dir"
        type: "directory"
        description: "Scenario directory with .ana output"
        required: true
      - name: "obs_file"
        type: "file"
        description: "Observed data file for comparison (optional)"
        required: false
      - name: "variable"
        type: "string"
        description: "Variable to extract: yield, soil_moisture, tile_drainage, ET"
        required: true
    outputs:
      - name: "metrics"
        type: "value"
        description: "JSON with simulated values and performance metrics (RMSE, NSE, PBIAS)"
    preconditions:
      - ".ana file exists in Analysis/ subdirectory"
    postconditions:
      - "Returned metrics contain simulated time series"
      - "If obs_file provided, RMSE/NSE/PBIAS are computed"

  - id: "rzwqm2_calibrate"
    name: "RZWQM2 Automated Calibration Runner"
    description: "Main calibration runner. LHS/Sobol sampling for initial exploration, then 10-run agent-guided batches. Calibrates 6 parameters (Ksat, ws, fc33, lateral_ksat, drain_spacing, field_sat) with convergence checking."
    stage: "s10_calibration"
    script_path: "tools/s10_calibration/rzwqm2_calibrate.py"
    language: "python"
    inputs:
      - name: "scenario_dir"
        type: "directory"
        description: "Base scenario directory to calibrate"
        required: true
      - name: "obs_file"
        type: "file"
        description: "Observed data file for objective function"
        required: true
      - name: "param_ranges"
        type: "config"
        description: "JSON with min/max for each of the 6 calibration parameters"
        required: true
      - name: "n_batches"
        type: "number"
        description: "Number of 10-run calibration batches"
        required: false
        example: 5
      - name: "sampling_method"
        type: "string"
        description: "Sampling method: lhs or sobol"
        required: false
        example: "lhs"
    outputs:
      - name: "calibration_result"
        type: "value"
        description: "JSON with best parameters, objective function value, convergence history"
    preconditions:
      - "Scenario directory has valid rzwqm.dat and can run successfully"
      - "Observed data file exists and covers simulation period"
    postconditions:
      - "Best parameter set identified with objective function metrics"
      - "Convergence history available for diagnosis"

