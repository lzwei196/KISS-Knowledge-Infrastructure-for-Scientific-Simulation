      doi: "10.1590/2318-0331.272220210148"
      note: "HEC-RAS 2-D dam-break GSA varying floodplain n from 0.026 to 0.150. Found ~54% change in peak discharge 25 km downstream and ~16 min delay in arrival time; inundated area expands with higher roughness."
    kechida2024_hecras_dem_manning:
      short_citation: "Kechida et al. 2024"
      doi: "10.1007/s40808-023-01821-3"
      note: "Joint sensitivity of HEC-RAS WSE to Manning n and DEM resolution on the Moudjar River, Algeria. Manning n is dominant control; finer DEM combined with calibrated n minimises WSE error."

safety:
  hazards:
    - id: "discharge_unit_cfs_cms_mismatch"
      kind: "control_semantic"
      description: "Discharge supplied in m^3/s into an English (cfs) project under-states forcing by ~35× (1 m^3/s = 35.3147 cfs); resulting WS profile is drastically too low."
      severity: "fatal_or_silent"
    - id: "elevation_unit_ft_m_mismatch"
      kind: "control_semantic"
      description: "Geometry or observed WS in metres while project unit system is English (ft), or vice versa; introduces ~3.28× factor or constant offset between computed and observed stage."
      severity: "fatal_or_silent"
    - id: "manning_n_converted_between_unit_systems"
      kind: "coefficient_runtime_silent_fallback"
      description: "Manning n is dimensionless and identical in English and SI; converting n (e.g., dividing/multiplying by 1.486) corrupts roughness because the 1.486 vs 1.0 conveyance factor is internal to the solver."
      severity: "silent"
    - id: "slope_scaled_across_unit_systems"
      kind: "control_semantic"
      description: "Energy / friction slope is dimensionless (ft/ft = m/m); scaling it during a unit conversion destabilises normal-depth boundary calculations."
      severity: "silent"
    - id: "manning_n_out_of_physical_range"
      kind: "coefficient_runtime_silent_fallback"
      description: "Manning n outside the physical range 0.005 ≤ n ≤ 0.5 produces non-physical conveyance / WS; channel typically 0.025–0.05, overbank 0.04–0.15."
      severity: "degraded"
    - id: "wrong_profile_index_for_observed_ws"
      kind: "parser_semantic"
      description: "Validating observed WS against the wrong profile index (e.g., comparing PF2 simulated values against PF1 observations) yields inflated RMSE on a known-good run."
      severity: "silent"
    - id: "validating_discharge_for_steady_flow"
      kind: "control_semantic"
      description: "For steady flow, discharge is the conserved pass-through of the input forcing — not a model product. Validating computed Q against observed Q is circular and a domain error."
      severity: "silent"
    - id: "non_monotonic_rating_curve"
      kind: "numerical_instability"
      description: "Stage should rise monotonically with discharge at a fixed cross section under steady flow. Reversals indicate ineffective-flow toggling, geometry/boundary problem, or a regime change at the section."
      severity: "warning"
    - id: "courant_violation_unsteady"
      kind: "numerical_instability"
      description: "Unsteady solver requires Δt ≤ Δx / sqrt(g·h) (Courant condition); violation produces oscillatory or divergent stage / flow time series."
      severity: "degraded"
    - id: "downstream_normal_depth_backwater_band"
      kind: "control_semantic"
      description: "Normal-depth downstream BC (type 3) uses bed slope as energy slope; results within ~5 km upstream of the downstream BC carry a systematic error band that should not be treated as a calibration miss."
      severity: "degraded"
    - id: "incompatible_flow_regime_selection"
      kind: "control_semantic"
      description: "Subcritical regime selected on a steep reach (or supercritical on a mild one) collapses the standard-step solution; mixed regime is required to locate hydraulic jumps."
      severity: "fatal_or_silent"
    - id: "energy_grade_below_water_surface"
      kind: "numerical_instability"
      description: "EG = WS + α·V^2/2g must hold at every cross section; EG < WS indicates a solver inconsistency."
      severity: "warning"
  validation_limits:
    - "Three-dimensional flow features (e.g., secondary currents, vertical stratification) cannot be represented — depth-averaged shallow-water / 1-D Saint-Venant only."
    - "Non-hydrostatic pressure flows and compressible / variable-density flow are out of scope."
    - "1-D Saint-Venant assumes small bed slope, channel-aligned flow, and gradually varied conditions; reaches with large bed slopes or strongly curved geometry violate these assumptions."
    - "Cross sections must be representative and closely spaced wherever discharge, slope, shape, or roughness change, at structures, at levee ends, and around junctions; sparse cross sections degrade profile accuracy."
    - "The 2-D mesh must resolve the flow features of interest; sub-grid bathymetry helps but does not remove the need for adequate cell resolution at hydraulic controls (constrictions, structures, levee crests)."
    - "Diffusion-wave (DSW) approximation is valid only where barotropic pressure gradient and bottom friction dominate over local-inertia and advective acceleration; rapidly varying flows require full SWE."
    - "HEC-RAS is a hydraulics model, NOT a rainfall-runoff model — precipitation, temperature, radiation, and watershed hydrologic losses are out of scope (precipitation-on-grid is a boundary input, not a hydrologic loss process)."
    - "Steady-flow profile validation should target stage (water-surface elevation), not discharge — discharge is the forcing, not a product."
  warnings:
    - "Channel and floodplain Manning n exhibit strong equifinality in calibration against inundation data alone; multiple n combinations reproduce the same inundation extent (Pappenberger et al. 2005)."
    - "Friction-slope reach-averaging method selection (average conveyance default vs. average friction slope vs. geometric/harmonic mean) affects steady-flow profile accuracy and is regime/profile-dependent."
    - "Fully implicit time weighting (theta = 1) is recommended for stability in 1-D unsteady runs."
    - "DSW is faster than full SWE but less general; switching to DSW silently degrades accuracy where advection / local inertia matter."
  assumptions:
    - statement: "1-D Saint-Venant closure assumes hydrostatic pressure, channel-aligned flow, small bed slope, and gradually varied conditions; resistance is represented through Manning n via S_f = (Q/K)^2."
      scope: "all 1-D solvers (steady and unsteady)"
      source: "HEC-RAS Hydraulic Reference Manual v6.1 — Theoretical Basis, 1-D Unsteady Flow Hydrodynamics; 1-D Steady Flow Water Surface Profiles / Friction Loss Evaluation"
      status: "adopted"
    - statement: "2-D unsteady flow uses the shallow-water equations with incompressible, uniform-density, hydrostatic-pressure assumptions and Reynolds-averaged eddy-viscosity turbulence closure; vertical length scale is assumed much smaller than horizontal."
      scope: "2-D solver (full SWE option)"
      source: "HEC-RAS Hydraulic Reference Manual v6.1 — 2-D Unsteady Flow Hydrodynamics, Foundational Equations"
      status: "adopted"
    - statement: "The diffusion-wave approximation (DSW) drops local-inertia and advective acceleration terms from the 2-D momentum equation; it is valid only where barotropic pressure gradient and bottom friction dominate."
      scope: "2-D solver (DSW option)"
      source: "HEC-RAS Hydraulic Reference Manual v6.1 — 2-D Unsteady Flow Hydrodynamics, Diffusion Wave Approximation"
      status: "adopted"
    - statement: "Manning n is dimensionless and identical in English and SI; the 1.486 vs 1.0 conveyance unit factor is internal to the solver and must not be applied externally."
      scope: "all solvers"
      source: "HEC-RAS Hydraulic Reference Manual v6.1 — Friction Loss Evaluation (Manning's equation and conveyance K)"
      status: "adopted"
    - statement: "For steady flow, discharge is the upstream forcing and is conserved along the reach; the model product is stage (water-surface elevation). Stage-vs-stage comparison is the scientifically defensible validation target."
      scope: "1-D steady-flow validation"
      source: "HEC-RAS Hydraulic Reference Manual v6.1 — 1-D Steady Flow Water Surface Profiles (energy-equation formulation)"
      status: "adopted"
    - statement: "Mass conservation closes water and (for sediment runs) bed mass / sediment fractions; energy-balance closure is not maintained by the hydrodynamic core (energy-grade-line is a diagnostic derived from stage + velocity head)."
      scope: "all hydrodynamic solvers"
      source: "HEC-RAS Hydraulic Reference Manual v6.1 — Theoretical Basis chapter"
      status: "adopted"

