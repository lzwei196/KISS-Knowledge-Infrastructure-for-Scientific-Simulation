- id: EPIC_018
  failure_domain: management_schedule
  severity: critical
  silent: true
  symptom: 'ACY shows FTN = fertilizer only in simulation year 1 (full rate applied),

    partial rate in year 2 (remaining quota), then FTN = 0 from year 3 onward —

    even though explicit scheduled fert ops appear in the .OPC for every rotation year.

    '
  diagnosis: 'OPV6 = 0 in the plant operation row causes EPIC to use a default

    max-N-per-crop limit (~200 kg/ha from CROPCOM). This limit is a

    CUMULATIVE LIFETIME cap across the full simulation, not an annual cap.

    Year 1 fert (e.g., 193 kg/ha) consumes nearly all of the 200 kg quota;

    year 2 gets only the 7 kg remainder; years 3+ get nothing.

    OUT prints "MAX N FERT/CROP = 200. kg/ha" confirming the active limit.

    '
  remedy: 'Set OPV6 in the plant row to >= NBYR * annual_fert_rate.

    Example: 11-year run at 193 kg/ha/yr requires OPV6 >= 2123; use 3000

    for safety. In build_opc_file.py or edit_opc.py, pass v6=<value> to

    the plant op. Also set OPC line 2 to "   1 500" (NROT=1) for an

    annual monocrop so there is no duplicate-simulation artifact.

    '
  discovered_during: zhengzhou_corn_2010_2020
  tags:
  - fertilization
  - OPV6
  - rotation
  - annual_cycling
- id: EPIC_019
  failure_domain: management_schedule
  severity: major
  silent: true
  symptom: 'IRGA = 0 mm/yr in .ACY for ALL simulation years even though IRR = 2

    (auto-irrigation) is set in EPICCONT.DAT, or even though explicit

    scheduled irrigation ops (EQIP=502 FLOODIRR) appear in the .OPC.

    WS (annual water stress) is also 0.000 for all years.

    '
  diagnosis: "Two independent root causes, both produce IRGA=0:\n\n(1) AUTO-IRRIGATION (IRR=2): fires\
    \ only when the daily water-stress\n    index WS_daily > PARM[67] (AIWS threshold). In monsoon-dominated\n\
    \    climates (East Asia, South Asia, W. Africa wet season), summer\n    precipitation fully meets\
    \ peak ET demand, so WS_daily = 0 on\n    every day of the growing season. No matter how low you set\
    \ AIWS\n    (tested 6.0, 0.85, 0.0001), the trigger condition is never met\n    and IRGA stays 0.\
    \ This is CORRECT model behaviour — the site is\n    genuinely not water-stressed. ACY WS=0.000 is\
    \ the diagnostic.\n\n(2) SCHEDULED IRRIGATION OPS (EQIP=502/501/500): operations appear\n    in the\
    \ .OUT run log (\"FLOODIRR 8 502\") but apply RR=0 mm and\n    VIRR=0.00 to the field regardless of\
    \ the V1/V2 amount and APPC\n    flag in the .OPC. Root cause in EPIC 1102 binary is not confirmed,\n\
    \    but observed consistently across multiple scheduled-op tests.\n\n(3) TOOL BUG — configure_irrigation.py:\
    \ the tool writes the IRR flag\n    using I5 (5-char) chunk indexing, placing it at character positions\n\
    \    35-39 of EPICCONT line 2. The actual EPICCONT template uses 4-char\n    fields; the true IRR\
    \ position is character 33 (chunk index 8 in a\n    4-char scheme). The tool therefore writes to the\
    \ wrong field and\n    leaves the real IRR flag unchanged.\n"
  remedy: "(1) For monsoon sites where WS=0: irrigation cannot meaningfully\n    improve simulated yield\
    \ through the irrigation pathway. The\n    yield gap vs. observed is driven by crop parameter miscalibration\n\
    \    (PHU, harvest index, radiation use efficiency for local cultivars),\n    not water stress. Do\
    \ NOT attempt to force irrigation via lower AIWS\n    thresholds or scheduled ops — neither will fire\
    \ at a water-surplus site.\n    Report IRGA=0 and WS=0 as correct physics, then focus on PHU\n   \
    \ calibration or switching to a locally calibrated .CRP file.\n\n(2) For sites that SHOULD be water-stressed:\
    \ check ACY WS column first.\n    WS > 0 means auto-irrigation CAN fire; check PARM[67] (default 6.0\n\
    \    is very high — try 0.85-1.5). If using scheduled ops, verify\n    the out file shows the op executing\
    \ with nonzero RR; if RR=0 is\n    printed, the EPIC 1102 binary may not honour V1/V2 for that\n \
    \   equipment code — try equip code 382 (GATEPIPE IRRI) instead of 502.\n\n(3) configure_irrigation.py:\
    \ read the template EPICCONT manually,\n    locate the IRR field at character position 33 (0-indexed:\
    \ chars 32-33),\n    and set it directly via string slicing rather than calling the tool.\n"
  discovered_during: zhengzhou_corn_2010_2020
  tags:
  - irrigation
  - IRGA
  - IRR
  - water_stress
  - monsoon
  - configure_irrigation
  - EPICCONT
- id: EPIC_020
  failure_domain: domain_mismatch
  severity: info
  silent: false
  symptom: 'Verifier requests basin-routed river discharge (m3/s, daily) such as

    GloFAS or GRDC at a gauge draining thousands of km2, but EPIC''s only

    hydrologic flux output is .ANN Q = point-scale SURFACE RUNOFF ONLY

    (mm/yr). All metrics return null because no temporal/scale overlap

    can be constructed.

    '
  diagnosis: 'Wrong-variable + wrong-scale. EPIC 1102 is a 0-D point field-scale

    agro-ecosystem model (single homogeneous HLU <=100 ha). dag.yaml

    scope_out excludes "Channel routing across heterogeneous areas" and

    "Spatially distributed / gridded simulation". No EPIC output and no KI

    tool maps point surface runoff to basin-routed m3/s discharge.

    '
  remedy: 'SKIP (no retry). Switching cultivar/forcing/parameters cannot make a

    point crop-field model emit routed river discharge. The only valid

    hydrologic obs for EPIC is point_time_series surface-runoff (mm), and

    do NOT close P-ET-Q on .ANN Q (it excludes percolation/lateral flow).

    Route basin m3/s discharge obs to a routing-capable KI such as

    EF5/HYPE/GR4J/airGR.

    '
  discovered_during: verifier_glofas_huai
  tags:
  - domain
  - wrong_variable
  - scale
  - skip
  - discharge
  - routing
- id: EPIC_021
  failure_domain: management_schedule
  severity: major
  silent: true
  symptom: 'HUSC printed on the harvest line of the .OUT run log is outside the

    dag''s 0.9-1.2 band (observed 1.10 and 1.45 for spring maize at

    Changchun, Jilin), so the dag caveat marks the yields as suspect --

    even though the run completes cleanly and the .ACY looks plausible.

    '
  diagnosis: 'OPV1 of the PLANT operation is the crop''s PHU (Potential Heat Units)

    that defines maturity; HUSC = accumulated HU / PHU. build_opc_file.py

    hard-coded OPV1 = 1550 -- the value inherited from the shipped umstead

    (North Carolina) example -- at EVERY site and for every crop. Where the

    local season accumulates a different heat-unit total, the crop reaches

    maturity well before (HUSC > 1.2) or after (HUSC < 0.9) the scheduled

    harvest date. Changchun Jilin (plant 05-04, harvest 09-13, TBS=8 degC)

    accumulates ~1750-1900 degC-days, i.e. 13-23% more than 1550.

    '
  remedy: "Derive PHU from the run's OWN forcing, which is standard EPIC/SWAT\npractice, and pass it to\
    \ build_opc_file.build(..., phu=<value>):\n\n  from build_opc_file import compute_phu, crop_base_temp\n\
    \  phu = compute_phu(f\"{ws}/STN01.DLY\", plant_mmdd, harvest_mmdd,\n                    crop_base_temp(\"\
    CORN\"))\n\ncompute_phu() sums max(0, Tmean - TBS) from planting to harvest and\naverages over the\
    \ years in the .DLY (TBS comes from CROPCOM.DAT col 4:\nCORN 8, SOYB 10, WWHT 0). ORDER MATTERS: build\
    \ the forcing BEFORE the\n.OPC so the .DLY exists. At Jilin this moved HUSC 1.10/1.45 -> 1.00/1.18,\n\
    inside the dag band.\n"
  discovered_during: gdhy_jilin_maize_1995_2016
  tags:
  - PHU
  - OPV1
  - HUSC
  - maturity
  - heat_units
  - umstead_legacy
- id: EPIC_022
  failure_domain: management_schedule
  severity: info
  silent: true
  symptom: 'Simulated yield is systematically HIGH against area-average gridded /

    census yield products (GDHY, SPAM, FAOSTAT), with .ACY PPOP = 10.000

    in every run regardless of site.

    '
  diagnosis: 'OPV5 of the PLANT operation is the plant population (plants/m2).

    build_opc_file.py hard-codes v5 = 10.0, again inherited from the

    umstead example. 10 plants/m2 = 100,000 plants/ha sits at the very top

    of the realistic range (typical rainfed maize 6.0-7.5 plants/m2), so

    EPIC simulates a denser -- hence higher-yielding -- stand than the

    average field the obs product aggregates over. This compounds with the

    structural gap between a well-managed point field simulation and an

    area-average census yield.

    '
  remedy: 'NOT a metric-tuning knob: only change PPOP when a data source or the

    site agronomy justifies it, and record the source. There is no gridded

    plant-density product in the curated dataset index, so the current KI

    keeps 10.0 as the documented default. When a site''s density is known,

    pass it through build_opc_file (OPV5) and say so in the run notes.

    Do NOT adjust PPOP to move PBIAS.

    '
  discovered_during: gdhy_jilin_maize_1995_2016
  tags:
  - PPOP
  - OPV5
  - plant_density
  - magnitude
  - umstead_legacy
- id: EPIC_023
  failure_domain: forcing
  severity: critical
  silent: true
  symptom: "EPIC completes cleanly but heat-unit accumulation, HUSC at harvest and\nPET are all wrong.\
    \ Inspecting <stn>.DLY shows the TMX and TMN columns\nholding IDENTICAL values on every row (zero\
    \ diurnal range), e.g.\n  1995   1   1  6.34 -9.45 -9.45  0.00 ...\ncompute_phu() then returns a PHU\
    \ derived from a mean-only temperature\nseries and the crop never matures on schedule.\n"
  diagnosis: 'The CMFD V2.0 archive ships two stores. Data_forcing_01dy_010deg (daily)

    contains a daily MEAN temperature only, so ki_tools_common.load_forcing

    returns temp_max_c == temp_min_c == temp_mean_c. Data_forcing_03hr_010deg

    (3-hourly) is the only store from which a true daily TMX/TMN can be

    aggregated. Pointing $CMFD_PATH (or CMFD_DEFAULT_DIR in

    convert_forcing_to_epic.py) at the daily store is ~40x faster

    (~3 s/year vs ~2-6 min/year), which makes it a tempting shortcut — and

    it produces no error at all, only wrong physics.

    Verified 2026-07-28 at 44.25N 125.25E, 1995: daily store gave

    TMX=TMN=mean; 3-hourly store gave TMX -15.3..32.3, TMN -21.3..23.5 degC.

    '
  remedy: 'Always point CMFD forcing at Data_forcing_03hr_010deg. The hc_ssd copy

    (KISSPATH_FORCING/Data_forcing_03hr_010deg) is the fast one;

    KISSPATH_DATA/forcing/Data_forcing_03hr_010deg is the

    fallback when hc_ssd is not mounted. convert_forcing_to_epic.py now

    (a) resolves CMFD_DEFAULT_DIR from that candidate list and (b) RAISES if

    >90% of days have |TMX - TMN| < 0.01 degC, so the daily store can no

    longer silently corrupt a run. Budget ~2-6 min/simulated year for the

    3-hourly extraction and launch multi-decade setups detached; the per-year

    JSON memo under <workspace>/.forcing_cache makes that resumable.

    '
  discovered_during: gdhy_jilin_maize_1995_2016
  tags:
  - forcing
  - CMFD
  - TMX
  - TMN
  - diurnal_range
  - silent
  - PHU
- id: EPIC_024
  failure_domain: silent_error
  severity: critical
  silent: true
  symptom: "EPIC runs cleanly for the whole rotation, but HUSC on the harvest line\nof the .OUT climbs\
    \ year on year and settles ABOVE the dag's required\n0.9-1.2 band, e.g. at Changchun Jilin maize 1995-2016:\n\
    \  1995 HUSC= 1.00   1996 1.14   1997 1.27   1998 1.31 ... 2007 1.38\nYields are inflated (sim 8.5\
    \ t/ha dry vs GDHY 6.1 t/ha, PBIAS +65%) and\nthe harvest always fires on the scheduled calendar date\
    \ rather than at\nmaturity. The tell is the monthly HUI block in the .OUT: the January\nvalue is 0.00\
    \ in year 1 but 0.11, 0.21, 0.29 ... in later years,\nstabilising near 0.30 instead of returning to\
    \ zero every winter.\n"
  diagnosis: 'The KILL operation (equip 451) in the .OPC was written with crop_id = 0

    instead of the crop''s CROPCOM code. EPIC then has no crop to kill, the

    standing crop is never terminated, and its heat-unit index is never

    reset. The residual HUI carries across the rotation boundary and is

    added to the next season''s accumulation, so HUSC at harvest reads

    1 + residual. Because the crop is already past HUI = 1 well before the

    scheduled harvest date, it keeps standing (and accumulating biomass /

    re-partitioning to grain) instead of being harvested at maturity.

    The shipped templates/umstead.OPC kill row carries crop_id = 2 (CORN) —

    the generated file had dropped it. Entirely silent: no error, no

    warning, correct-looking .ACY.

    '
  remedy: "The kill row's crop_id MUST equal the crop being killed:\n  ops.append(_op_line(harvest_yr,\
    \ km, kd, 451, 0, crop_code, 0))\nFixed in tools/build_opc_file.py (it previously hard-coded 0). Verify\n\
    after every run:\n  grep \" HUI \" <run>.OUT | head          # January column must be 0.00\n  grep\
    \ \"CSP2WD\" <run>.OUT                # HUSC at harvest 0.9-1.2\nWith the fix at Changchun the January\
    \ HUI returns to 0.00 in every year,\nHUSC at harvest becomes 1.00-1.07, harvest migrates to the true\
    \ maturity\ndate (Sep 13-28 rather than always Sep 13), and dry yield falls from\n8.52 to ~6.9 t/ha.\
    \ Also note this makes compute_phu()'s output verifiable:\nwith the carry-over present, HUSC over-shoot\
    \ looks like a PHU error and\ninvites a wrong \"raise the PHU\" fix.\n"
  discovered_during: gdhy_jilin_maize_1995_2016
  tags:
