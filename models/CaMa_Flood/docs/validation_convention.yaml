    needed_for: [flood_extent, depth]
  - ref: "A high-accuracy map of global terrain elevations (MERIT DEM; Geophys. Res. Lett., fetch_failed) — would quantify the DEM/datum ceiling on absolute WSE and depth"
    doi: 10.1002/2017gl072874
