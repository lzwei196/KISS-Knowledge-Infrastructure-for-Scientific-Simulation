safety:
  hazards:
    - id: "velocity_unit_ms_vs_myr"
      kind: "weather_file_semantic"
      description: "Velocity supplied in m/s instead of ISSM's internal m/yr (off ~3.15e7) gives near-zero flow that still converges."
      severity: "silent"
    - id: "temperature_celsius_to_paterson"
      kind: "weather_file_semantic"
      description: "Temperature in Celsius passed to paterson() yields extreme/NaN rheology_B (ice impossibly stiff or instantly collapsing)."
      severity: "silent"
    - id: "thickness_km_vs_m"
      kind: "soil_semantic"
      description: "Ice thickness loaded in km instead of m (off 1000x) yields paper-thin ice with near-zero driving stress."
      severity: "silent"
    - id: "coords_degrees_vs_projected_m"
      kind: "soil_semantic"
      description: "Domain coordinates in degrees (lat/lon) instead of projected meters produce a microscopic mesh and nonsensical physics."
      severity: "silent"
    - id: "friction_on_floating_ice"
      kind: "control_semantic"
      description: "Non-zero friction coefficient on floating ice (ocean_levelset<0 not zeroed) applies artificial basal drag and unrealistically slows shelves."
      severity: "silent"
    - id: "fluidity_A_used_as_hardness_B"
      kind: "coefficient_runtime_silent_fallback"
      description: "Glen's fluidity A used directly as rheology_B (needs B=A^(-1/n)) gives near-zero viscosity and wrong velocities."
      severity: "silent"
    - id: "smb_units_kgm2_vs_m_ice_eq"
      kind: "weather_file_semantic"
      description: "SMB in mm w.e./yr or kg/m^2/yr instead of m/yr ice equivalent (needs /917) makes the ice grow or shrink ~1000x too fast."
      severity: "silent"
    - id: "geothermal_mWm2_vs_Wm2"
      kind: "weather_file_semantic"
      description: "Geothermal flux in mW/m^2 instead of W/m^2 (off 1000x) causes excessive basal melt and a corrupted thermal field."
      severity: "silent"
    - id: "pressure_kPa_MPa_vs_Pa"
      kind: "initial_condition_semantic"
      description: "Initial pressure in kPa/MPa/bar instead of Pa produces nonsensical stress fields and possible divergence."
      severity: "silent"
    - id: "mesh_resolution_km_vs_m"
      kind: "control_semantic"
      description: "Mesh resolution specified in km instead of m (triangle/bamg take meters) yields millions of elements or a single element."
      severity: "silent"
    - id: "levelset_sign_inverted"
      kind: "soil_semantic"
      description: "Inverted mask levelset sign (ISSM convention: negative=inside; ocean_levelset<0 floating) inverts the velocity pattern and applies friction over ocean."
      severity: "silent"
    - id: "zero_vs_nan_free_bc_nodes"
      kind: "control_semantic"
      description: "Using 0 instead of NaN for free BC nodes (spcvx/spcvy/spctemperature) Dirichlet-constrains them to zero, creating artificial frozen interiors/ice divides."
      severity: "silent"
    - id: "geometry_surface_base_thickness_inconsistent"
      kind: "soil_semantic"
      description: "surface != base + thickness (fields from mismatched datasets/resolutions) yields non-physical surface and solver instability."
      severity: "silent"
    - id: "wrong_water_density_grounding_line"
      kind: "soil_semantic"
      description: "Using freshwater rho_water=1000 instead of seawater 1023 for marine ice sheets shifts the grounding line landward via the flotation criterion."
      severity: "silent"
    - id: "degenerate_zero_area_triangles"
      kind: "numerical_instability"
      description: "Degenerate/zero-area elements (coincident points, sharp notches, coarse resolution) produce a singular matrix and crash at assembly."
      severity: "fatal"
    - id: "disconnected_mesh_regions"
      kind: "numerical_instability"
      description: "Disconnected mesh regions / self-intersecting outline leave part of the domain unsolved (zero velocity in isolated groups)."
      severity: "fatal"
    - id: "timestep_violates_cfl"
      kind: "numerical_instability"
      description: "Time step too large for the CFL condition (dt < dx/max(vel)) makes transient thickness oscillate or explode to NaN."
      severity: "degraded"
    - id: "missing_initial_velocity_transient"
      kind: "initial_condition_semantic"
      description: "Missing/zero initial velocity for a transient solve gives zero flux divergence then an abrupt first-step jump; seed from a prior Stressbalance solve."
      severity: "degraded"
    - id: "wrong_flow_equation_for_regime"
      kind: "control_semantic"
      description: "Wrong flow approximation for the dynamical regime (e.g. SSA on slow grounded interior) neglects vertical shear and gives wrong velocity magnitudes."
      severity: "degraded"
  validation_limits:
    - "Stress balance assumes Stokes flow (acceleration negligible) and a gravity-only body force; Coriolis is neglected."
    - "HO (Blatter-Pattyn) neglects bridging effects and horizontal gradients of vertical velocity; SSA (MacAyeal) neglects vertical shear, so each approximation is only valid in its intended dynamical regime."
    - "Ice is treated as a purely viscous incompressible non-Newtonian material (Glen's flow law, n typically 3); no elastic/brittle rheology outside the optional damage module."
    - "Ice-front migration / level-set calving and full-Stokes contact-mechanics grounding-line migration are partially under construction; transient.islevelset not fully implemented."
    - "Atmospheric (SMB, surface temperature) and ocean/basal-melt forcings are prescribed external boundary inputs, not internally generated; ISSM does not close a surface energy budget with the atmosphere."
  warnings:
    - "Thermal: for regional models a Dirichlet condition must be set on the inflow boundary throughout the ice column to avoid advection of noise."
    - "solve(md,'Thermal') computes only a single time step; the thermal time step should satisfy the CFL condition."
    - "Advection-dominated thermal and mass-transport equations require numerical stabilization (artificial diffusion or SUPG) to avoid spurious oscillations."
    - "stressbalance_core is re-run only every sb_coupling_frequency steps (staggered coupling); velocity is held constant while geometry/thermal evolve in between, which can lag fast dynamic changes."
  assumptions:
    - statement: "ISSM is solved on an unstructured finite-element mesh over a projected (meter) domain; it is point/element-resolved 2-D or 3-D FEM, not a gridded basin model."
      scope: "spatial discretization of all solutions"
      source: "ISSM documentation (model-class and capabilities pages, github.com/ISSMteam/ISSM)"
      status: "adopted"
    - statement: "The internal time unit is years and all rates are per-year (seconds-per-year = 31536000, i.e. a 365-day year); inputs must be converted to per-year before assignment."
      scope: "all transient rates and timestepping"
      source: "constants.py (constants.yts) and ISSM internal conventions"
      status: "adopted"
    - statement: "Closure is mass-balance (depth-integrated thickness equation) plus momentum (Stokes flow) and internal energy balance; there is no closed surface energy budget with the atmosphere because SMB and surface temperature are prescribed forcings."
      scope: "conservation closure"
      source: "ISSM mass-transport / stress-balance / thermal capability documentation"
      status: "adopted"
    - statement: "rheology_B uses the hardness B convention (Pa s^(1/n)); the often-quoted Pa s^(1/3) units are the n=3 specialization."
      scope: "Glen's flow-law ice hardness parameter"
      source: "ISSM materials class and stress-balance documentation"
      status: "adopted"
    - statement: "Mask levelsets follow the negative=inside convention (ocean_levelset<0 floating, ice_levelset<0 ice present) and free BC nodes are flagged with NaN, not 0."
      scope: "grounded/floating partition and Dirichlet BC specification"
      source: "ISSM mask/boundary-condition documentation and SetMarineIceSheetBC/SetIceShelfBC helpers"
      status: "adopted"
