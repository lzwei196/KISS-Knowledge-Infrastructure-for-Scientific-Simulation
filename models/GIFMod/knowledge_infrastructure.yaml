validation:
  tier: synthetic
  tier_justification: >
    GIFMod is a GUI-only Qt5 application with no CLI mode. The model cannot be
    built on this server due to missing Qt5 development libraries. Validation
    is limited to pipeline tool testing with synthetic data.
  benchmark: pipeline_test
  metrics: {}

