package:
  name: AquaCrop
  language: python
  implementation:
    id: aquacrop-ospy
    version: 3.0.12
    provenance: Python; AquaCrop-OSPy (Foster et al. 2017) wraps FAO AquaCrop 7.1 numerics in a pure-Python
      in-memory engine.
  scientific_reference_version: FAO AquaCrop 7.1 (Reference Manual lineage; Chapter 3 algorithmic spec)
  binary:
    path: KISSPATH_KI_ROOT/AquaCrop/run_and_score.py
    type: Python
pipeline:
  stages:
  - s10_water_productivity_skill
  - s1_crop_selection_skill
  - s2_soil_profile_skill
  - s3_weather_prep_skill
  - s4_initial_conditions_skill
  - s5_irrigation_skill
  - s6_field_management_skill
  - s7_model_assembly_skill
  - s8_execution_skill
  - s9_output_analysis_skill
tools:
  count: 20
  files:
  - tools/s10_water_productivity/compare_irrigation_scenarios.py
  - tools/s10_water_productivity/compute_water_productivity.py
  - tools/s1_crop_selection/select_crop.py
  - tools/s1_crop_selection/validate_crop_params.py
  - tools/s2_soil_profile/create_soil_profile.py
  - tools/s2_soil_profile/validate_soil_hydraulics.py
  - tools/s3_weather_prep/compute_eto_penman_monteith.py
  - tools/s3_weather_prep/prepare_weather_df.py
  - tools/s3_weather_prep/validate_weather_df.py
  - tools/s4_initial_conditions/create_initial_water_content.py
  - tools/s5_irrigation/create_irrigation_management.py
  - tools/s5_irrigation/optimize_deficit_irrigation.py
  - tools/s6_field_management/apply_cama_flood.py
  - tools/s6_field_management/create_field_management.py
  - tools/s7_model_assembly/assemble_model.py
  - tools/s7_model_assembly/validate_model_config.py
  - tools/s8_execution/run_aquacrop.py
  - tools/s9_output_analysis/compare_sim_obs.py
  - tools/s9_output_analysis/extract_results.py
  - tools/s9_output_analysis/validate_national_yield_series.py
inputs:
  forcing:
  - name: Daily minimum air temperature (MinTemp)
    unit: deg C
  - name: Daily maximum air temperature (MaxTemp)
    unit: deg C
  - name: Daily precipitation
    unit: mm/day
  - name: Reference evapotranspiration (ET0)
    unit: mm/day
  - name: Atmospheric CO2 concentration
    unit: ppm
  parameters:
  - name: Tbase (GDD base temperature)
    unit: deg C
  - name: Tupp (GDD upper threshold)
    unit: deg C
  - name: WP* (normalized water productivity)
    unit: g/m^2
  - name: HI0 (reference harvest index)
    unit: fraction
  - name: CCx (maximum canopy cover)
    unit: fraction
  - name: CGC (canopy growth coefficient)
    unit: 1/day or 1/GDD
  - name: CDC (canopy decline coefficient)
    unit: 1/day or 1/GDD
  - name: Kc,Tr (basal crop transpiration coefficient at full canopy)
    unit: '-'
  - name: Stress-response thresholds (p_up1..p_up4 for canopy expansion, stomatal closure, senescence,
      harvest index)
    unit: '-'
  - name: Zr,max / Zr,min (maximum and minimum effective rooting depth)
    unit: m
  - name: Plant population density (PlantPop)
    unit: plants/ha
  - name: Pollination temperature thresholds (heat / cold)
    unit: deg C
  - name: Layer wilting-point water content (thWP)
    unit: m^3/m^3
  - name: Layer field-capacity water content (thFC)
    unit: m^3/m^3
  - name: Layer saturation water content (thS)
    unit: m^3/m^3
  - name: Saturated hydraulic conductivity (Ksat)
    unit: mm/day
  - name: SCS Curve Number (CN)
    unit: '-'
  - name: Readily Evaporable Water (REW)
    unit: mm
  initial_conditions:
  - name: Initial soil water content per layer
    unit: m^3/m^3 or % TAW or proportion of FC/WP/SAT
  - name: Initial canopy cover at germination (CCo)
    unit: fraction
  - name: Effective rooting depth at planting (Zn)
    unit: m
  boundary_conditions:
  - name: Simulation start / end dates
    unit: date
  - name: Off-season flag
    unit: boolean
  - name: Planting date
    unit: MM/DD
  - name: Irrigation method
    unit: enum {Rainfed, SMT, Interval, Schedule, Net, Constant}
  - name: Irrigation system efficiency / wetted surface fraction
    unit: '% / %'
  - name: Field management options (mulches, bunds, curve-number adjustment, runoff inhibition)
    unit: mixed
  - name: Groundwater table depth (optional)
    unit: m
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - DryYield
  - FreshYield
  - biomass
  - canopy_cover
  - Tr
  - Es
  - ET_actual
  - Wr
  - th_per_compartment
  - Runoff
  - DeepPerc
  - z_root
  - harvest_index
  - harvest_index_adj
  - gdd_cum
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.489, KGE=0.400, R=0.849, 5 scorecard(s)'
  metrics:
    best_nse: 0.489
    best_kge: 0.4002
    best_r: 0.849
summary:
  total_tools: 20
