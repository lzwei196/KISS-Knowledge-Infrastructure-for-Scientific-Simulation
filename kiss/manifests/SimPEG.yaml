kiss_manifest_version: 1
model: SimPEG
binary_type: Python
verified: observed
install_dir: SimPEG

acquire:
  strategy: pip
  package: simpeg
  produces: simpeg

python_deps: [simpeg]

reference_case: >-
  python -c "import simpeg; print(simpeg.__name__, 'importable')"

notes: >-
  OBSERVED 2026-08-18: `kiss init SimPEG` installed simpeg 0.25.2 into a clean venv
  and the KI's own preflight_check.py passed with no hand-written recipe. The
  package name was resolved from the KI directory name and confirmed by import,
  not assumed from a PyPI name match.
