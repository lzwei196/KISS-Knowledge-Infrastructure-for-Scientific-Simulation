template_version: "3.5"

identity:
  model_id: "TRIGRS"
  scientific_reference_version: "TRIGRS 2.0 (USGS Open-File Report 2008-1159) infiltration + infinite-slope theory, as realized by the v2.1.00c serial code"
  implementation:
    id: "trigrs-2100c"
    version: "2.1.00c (build 02 Feb 2022)"
    provenance: "Fortran 90/95; USGS serial TRIGRS (trg) by Baum, Savage & Godt; companion TopoIndex (tpx) preprocessor and optional MPI-parallel build (prg)."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "Public-Domain"
  repo_url: "https://www.usgs.gov/software/trigrs"

boundary:
  scope_in:
    - "Transient rainfall infiltration via 1-D vertical analytical flow, one independent soil column per grid cell"
    - "Saturated/tension-saturated infiltration (Iverson 2000 linearized Richards solution, with finite- and infinite-depth basal-boundary variants)"
    - "Unsaturated infiltration above the water table (Srivastava & Yeh 1991 with Gardner exponential retention)"
    - "Transient pore-pressure head profile at multiple depths within each cell"
    - "Water-table rise and pressure diffusion below the table"
    - "Factor of safety via infinite-slope (Taylor 1948) stability at each depth, minimum reported per cell"
    - "Optional D8 runoff routing of excess rainfall to downslope cells"
  scope_out:
    - "Multidimensional (2-D/3-D) or lateral inter-cell subsurface flow (strictly 1-D vertical per cell)"
    - "Heterogeneous/anisotropic layering within a cell (homogeneous isotropic per zone)"
    - "Non-infinite-slope failure mechanisms (deep-seated, rotational, non-planar failures)"
    - "Evapotranspiration and long-term alternating wet/dry cycles"
    - "Stream-flow estimation from runoff (routing is instantaneous, no subsurface contribution)"
    - "DEM pit-filling / flow-direction preprocessing (must be done in GIS beforehand)"
    - "Post-failure forecasting (soil thickness/properties are not updated when Fs<1)"
  spatial: "distributed-stream"
  temporal: "event"
  closure: "mass-balance"
  notes: "Mass-balance closure is between rainfall, infiltration, and runoff and is only enforced when the optional D8 runoff-routing scheme is active, redistributing excess water (where rainfall > infiltrability Ks) to downslope cells. Without runoff routing each cell is an independent water budget. There is no energy-balance closure: ET is absent. Spatial structure is a regular ESRI/GRASS ASCII grid of independent 1-D columns; inter-cell coupling exists only through the optional runoff routing."

inputs:
  forcing:
    - category: "forcing"
      name: "rainfall_intensity"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "scalar per rainfall period (cri) and/or per-period intensity grids; step-function constant intensity over nper periods"
      notes: "Strict m/s; supplied as nper constant-intensity periods. A negative scalar signals that a spatially-variable grid is read. May exceed infiltrability Ks, generating runoff."
    - category: "forcing"
      name: "steady_background_infiltration_rate"
      unit: "m/s"
      source_kind: "forcing"
      model_input_format: "scalar (rizero) or grid (negative scalar = read grid)"
      notes: "Pre-storm steady seepage rate setting the initial pressure-head baseline; should be < Ks. Internally normalized to the background flux ratio rikzero = rizero/Ks, whose sign affects the beta line and upward-seepage path."
  parameters:
    - category: "parameter"
      name: "cohesion"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol c)"
      notes: "Pa, NOT kPa. Typical 0-50000 Pa; physical bound 0-100000."
    - category: "parameter"
      name: "friction_angle"
      unit: "degrees"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol phi)"
      notes: "Typical 15-45 degrees."
    - category: "parameter"
      name: "total_unit_weight_of_soil"
      unit: "N/m^3"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol uws)"
      notes: "N/m^3, NOT kN/m^3. Typical 14000-25000 (18000-22000 common)."
    - category: "parameter"
      name: "saturated_hydraulic_conductivity"
      unit: "m/s"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol Ks)"
      notes: "m/s, NOT cm/hr. Typical 1e-8 (clay) to 1e-3 (gravel)."
    - category: "parameter"
      name: "saturated_hydraulic_diffusivity"
      unit: "m^2/s"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol D0/dif); D0 = Ks/Ss"
      notes: "Typical 1e-6 to 1e-2."
    - category: "parameter"
      name: "saturated_volumetric_water_content"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol theta_s/ths)"
      notes: "Typical 0.2-0.7; must exceed theta_r."
    - category: "parameter"
      name: "residual_volumetric_water_content"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol theta_r/thr)"
      notes: "Must satisfy theta_s > theta_r > 0."
    - category: "parameter"
      name: "gardner_alpha"
      unit: "1/m"
      source_kind: "calibrated"
      model_input_format: "per property-zone scalar (symbol alpha)"
      notes: "Soil-water characteristic fitting parameter (Gardner 1958). Positive selects the unsaturated model; negative treats the zone as tension-saturated (saturated model). Typical magnitude 0.1-100."
    - category: "parameter"
      name: "unit_weight_of_water"
      unit: "N/m^3"
      source_kind: "default"
      model_input_format: "scalar (symbol uww)"
      notes: "Typically 9800 N/m^3."
    - category: "parameter"
      name: "property_zone_assignment"
      unit: "integer zone ID"
      source_kind: "dataset_lookup"
      model_input_format: "integer zones grid (zones.asc); each zone carries one uniform parameter set"
  initial_conditions:
    - category: "initial_condition"
      name: "initial_water_table_depth"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "scalar or grid (negative scalar = read depthwt grid; symbol depth/d)"
      notes: "Depth to the steady-state water table. Results are very sensitive to this; poorly estimated values render results hypothetical."
  boundary_conditions:
    - category: "boundary_condition"
      name: "DEM_elevation"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "ESRI/GRASS ASCII grid (dem.asc); must be hydrologically corrected (pits removed) in GIS beforehand"
    - category: "boundary_condition"
      name: "slope_angle"
      unit: "degrees"
      source_kind: "user_provided"
      model_input_format: "ESRI ASCII grid (slope.asc); read in degrees, converted internally to radians"
      notes: "Degrees, NOT radians or percent. Not recommended above 60 degrees (1-D infiltration assumption breaks down)."
    - category: "boundary_condition"
      name: "flow_direction"
      unit: "integer D8 code (1-8)"
      source_kind: "user_provided"
      model_input_format: "D8 direction grid (directions.asc) plus TopoIndex routing arrays (nxt, indx, dsc, wf) for optional runoff routing"
    - category: "boundary_condition"
      name: "maximum_soil_depth"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "scalar or grid (zmax; negative scalar = read grid)"
      notes: "Depth to the basal boundary / base of potential slide; with the finite-depth model this is the impermeable basal boundary."
    - category: "boundary_condition"
      name: "basal_boundary_depth_model"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "mmax sign switch: positive = finite-depth (impermeable basal boundary at zmax); negative = infinite-depth Iverson solution (internally reset to 20 series terms)"
      notes: "Structural switch selecting the infiltration basal-boundary form. Negative mmax for shallow soils on bedrock prevents non-physical infinite drainage."
    - category: "boundary_condition"
      name: "flow_direction_beta_option"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "flowdir code: 'gener' (general, eq. 3A), 'slope' (slope-parallel, beta=cos^2 delta), or 'hydro' (hydrostatic, beta=1)"
      notes: "Selects the beta-line cap on steady pressure head."
    - category: "boundary_condition"
      name: "computation_depth_range"
      unit: "m / integer"
      source_kind: "user_provided"
      model_input_format: "zmin (shallowest depth, ~0.01-0.1), czmax (max depth), nzs (number of vertical increments)"
      notes: "zmin=0 produces surface artifacts; set zmin>0."
    - category: "boundary_condition"
      name: "storm_timing"
      unit: "seconds"
      source_kind: "user_provided"
      model_input_format: "total duration t and cumulative period boundaries capt (capt(1)=0, capt(nper+1)=t); nper rainfall periods"
      notes: "Seconds, NOT hours."
    - category: "boundary_condition"
      name: "minimum_slope_threshold"
      unit: "degrees"
      source_kind: "user_provided"
      model_input_format: "slomin scalar (also slomax); cells below slomin skip pore-pressure/Fs computation and are assigned Fs=11"
    - category: "boundary_condition"
      name: "background_flux_option"
      unit: "n/a"
      source_kind: "user_provided"
      model_input_format: "bkgrof logical switch (.true./.false.)"
      notes: "When off, multi-period runs can drive pore pressure below steady-state during dry periods."
    - category: "boundary_condition"
      name: "series_solution_controls"
      unit: "integer"
      source_kind: "user_provided"
      model_input_format: "nmax (max roots/terms in infinite-series solution), tx (output time-step multiplier)"

processes:
  modules:
    - name: "Driver"
      role: "driver"
      brief: "program trigrs: parses init file, allocates grids, sequences input read -> steady -> runoff -> pressure/FoS solver -> output; selects the solver branch from the unsat0/mmax/multistep flags; derives specific gravity gs from uws/uww/ths for unsaturated runs."
    - name: "Initialization_Parser"
      role: "driver"
      brief: "trini: parses the line-ordered tr_in.txt into per-zone properties (c, phi, uws, Ks, D0, theta_s, theta_r, alpha), output flags and file names; sets defaults (igcapf, unsat selection)."
    - name: "Grid_IO"
      role: "driver"
      brief: "ESRI/GRASS ASCII grid readers/writers and grid-size scanner; map between 2-D GIS grids and 1-D length-imax cell arrays."
    - name: "Steady_Infiltration"
      role: "process_solver"
      brief: "steady: validates/adjusts the steady background infiltration rate and computes excess steady infiltration (sumex) handed to runoff routing."
    - name: "Runoff_Routing"
      role: "process_solver"
      brief: "rnoff: optional D8 runoff routing using TopoIndex order; redistributes excess infiltration and rewrites the per-cell per-period transient flux ratio rik before any pressure solver runs."
      applicability: "when runoff routing enabled and TopoIndex routing arrays present"
    - name: "Saturated_InfiniteDepth_Solver"
      role: "process_solver"
      brief: "ivestp/iverson: Iverson (2000) linearized-diffusion transient pressure head and infinite-slope factor of safety for saturated infinite-depth columns; core single-step solver capping pressure head at the Iverson beta line."
      applicability: "alpha<=0 (saturated) and infinite-depth (mmax<0)"
    - name: "Saturated_FiniteDepth_Solver"
      role: "process_solver"
      brief: "savage: finite-depth diffusion solution (Savage et al.) for saturated infiltration with an impermeable basal boundary, single-step."
      applicability: "alpha<=0 (saturated) and finite-depth (mmax>0)"
    - name: "Saturated_Multistep_Integrator"
      role: "integrator"
      brief: "satinf/satfin: time-marching wrappers calling the saturated single-step solvers over multiple output timesteps for infinite-/finite-depth cases."
      applicability: "saturated multistep runs (tx>1 / multiple output times)"
    - name: "Unsaturated_Infiltration_Solver"
      role: "process_solver"
      brief: "unsinf/unsfin: unsaturated-over-saturated infiltration chaining the surface flux boundary, the unsaturated profile and the water-table load response for a rising water table."
      applicability: "alpha>0 with theta_s>theta_r>0 (unsaturated model)"
    - name: "Unsaturated_Profile_Solver"
      role: "process_solver"
      brief: "unsth: analytic normalized-transmissivity solution (Srivastava & Yeh 1991 with Gardner alpha) for hydraulic conductivity, pressure head and volumetric water content in the unsaturated zone."
      applicability: "unsaturated model"
    - name: "Surface_Basal_Flux"
      role: "process_solver"
      brief: "flux: computes the infiltration/basal flux boundary condition feeding the unsaturated solvers."
      applicability: "unsaturated model"
    - name: "WaterTable_Load_Response"
      role: "process_solver"
      brief: "pstpi/pstpf: diffusion model of the pressure-head response to the load of a rising water table (infinite/finite depth)."
    - name: "Numerical_Kernels"
      role: "process_solver"
      brief: "derfc/calerf (complementary error function), dsimps (Simpson integration), dzero_brac (zero bracketing), smallt (early-time series) supporting the analytical solvers."
    - name: "Output_Writers"
      role: "driver"
      brief: "svijz/svxmdv/svlist plus grid saves: emit FoS/depth/pressure/water-table grids and per-cell z-p-fs list / ijz / xmdv files according to the flag value."
    - name: "TopoIndex"
      role: "optional_module"
      brief: "tpindx (separate binary tpx): preprocessor computing grid size and D8 runoff routing order (nxt/indx/dsc/wf) consumed by Runoff_Routing."
      applicability: "preprocessing step before the main run; required for runoff routing"
  internal_edges:
    - from: "Inputs"
      to: "Initialization_Parser"
      kind: "consumes_input"
      brief: "trini reads the line-ordered tr_in.txt into per-zone property arrays, flags and file names."
    - from: "Inputs"
      to: "Grid_IO"
      kind: "consumes_input"
      brief: "Grid_IO reads slope, zone, water-table depth, slip-base depth, background-infiltration and DEM grids into 1-D cell arrays."
    - from: "Initialization_Parser"
      to: "Driver"
      kind: "invokes"
      brief: "parsed zone properties and flags returned to the driver to select the solver branch."
    - from: "Driver"
      to: "Steady_Infiltration"
      kind: "invokes"
      brief: "calls steady() to validate/adjust background infiltration and compute excess (sumex)."
    - from: "Steady_Infiltration"
      to: "Runoff_Routing"
      kind: "invokes"
      brief: "excess steady infiltration (sumex) passed to runoff routing."
    - from: "TopoIndex"
      to: "Runoff_Routing"
      kind: "consumes_input"
      brief: "rnoff uses the D8 receptor/order/weight arrays produced by TopoIndex."
    - from: "Runoff_Routing"
      to: "transient_flux_ratio"
      kind: "writes_state"
      brief: "runoff redistribution rewrites the per-cell per-period transient infiltration ratio used by all pressure solvers."
    - from: "Driver"
      to: "Saturated_InfiniteDepth_Solver"
      kind: "invokes"
      brief: "saturated infinite-depth path (alpha<=0, mmax<0)."
    - from: "Driver"
      to: "Saturated_FiniteDepth_Solver"
      kind: "invokes"
      brief: "saturated finite-depth path (alpha<=0, mmax>0)."
    - from: "Driver"
      to: "Saturated_Multistep_Integrator"
      kind: "invokes"
      brief: "multistep saturated paths over multiple output times."
    - from: "Saturated_Multistep_Integrator"
      to: "Saturated_InfiniteDepth_Solver"
      kind: "invokes"
      brief: "satinf calls the single-step ivestp solver across successive output timesteps for the infinite-depth saturated case."
    - from: "Saturated_Multistep_Integrator"
      to: "WaterTable_Load_Response"
      kind: "invokes"
      brief: "satfin calls pstpf for the finite-depth water-table load response across successive output timesteps."
    - from: "Driver"
      to: "Unsaturated_Infiltration_Solver"
      kind: "invokes"
      brief: "unsaturated path when alpha>0 and theta_s>theta_r>0."
    - from: "Unsaturated_Infiltration_Solver"
      to: "Surface_Basal_Flux"
      kind: "invokes"
      brief: "unsaturated solver calls flux for the surface/basal flux boundary."
    - from: "Unsaturated_Infiltration_Solver"
      to: "Unsaturated_Profile_Solver"
      kind: "invokes"
      brief: "unsaturated solver calls unsth for the K/pressure/water-content profile."
    - from: "Unsaturated_Infiltration_Solver"
      to: "WaterTable_Load_Response"
      kind: "invokes"
      brief: "unsaturated solver calls pstpi/pstpf for the rising-water-table load response."
    - from: "Saturated_InfiniteDepth_Solver"
      to: "Numerical_Kernels"
      kind: "invokes"
      brief: "ivestp calls derfc/calerf (complementary error function) for the Iverson diffusion series."
    - from: "Saturated_FiniteDepth_Solver"
      to: "Numerical_Kernels"
      kind: "invokes"
      brief: "savage calls derfc for the finite-depth error-function series."
    - from: "Unsaturated_Profile_Solver"
      to: "Numerical_Kernels"
      kind: "invokes"
      brief: "unsth calls dsimps (Simpson integration) and smallt (early-time series) for the normalized-transmissivity profile."
    - from: "transient_flux_ratio"
      to: "Saturated_InfiniteDepth_Solver"
      kind: "reads_state"
      brief: "the solver reads transient and background flux ratios to build the transient pressure component and beta."
    - from: "Saturated_InfiniteDepth_Solver"
      to: "pressure_head"
      kind: "writes_state"
      brief: "computes the pressure-head profile, capped by the Iverson beta line."
    - from: "Unsaturated_Profile_Solver"
      to: "soil_water_content"
      kind: "writes_state"
      brief: "fills volumetric water content, hydraulic conductivity and normalized transmissivity profiles."
    - from: "WaterTable_Load_Response"
      to: "water_table_depth"
      kind: "writes_state"
      brief: "adds the pressure-head response to the rising water-table load."
    - from: "pressure_head"
      to: "Saturated_InfiniteDepth_Solver"
      kind: "reads_state"
      brief: "the stability evaluation in ivestp reads the current pressure-head profile to compute factor of safety at each depth."
    - from: "Saturated_InfiniteDepth_Solver"
      to: "factor_of_safety"
      kind: "writes_state"
      brief: "reduces the profile to the minimum factor of safety and its depth/pressure per cell per output time."
    - from: "factor_of_safety"
      to: "Output_Writers"
      kind: "reads_state"
      brief: "minimum-FoS, depth-of-min-FoS and pressure-at-min-FoS fields read for grid output."
    - from: "Output_Writers"
      to: "Outputs"
      kind: "produces_output"
      brief: "writes TRfs_min / TRz_at_fs_min / TRp_at_fs_min / TRwater_* grids, per-cell z-p-fs lists, non-convergence flag grids and TrigrsLog.txt."

states:
  variables:
    - name: "pressure_head"
      unit: "m"
      role: "prognostic"
    - name: "transient_pressure_component"
      unit: "m"
      role: "prognostic"
    - name: "steady_pressure_component"
      unit: "m"
      role: "diagnostic"
    - name: "transient_flux_ratio"
      unit: "dimensionless"
      role: "prognostic"
    - name: "water_table_depth"
      unit: "m"
      role: "prognostic"
    - name: "infiltration_rate"
      unit: "m/s"
      role: "prognostic"
    - name: "soil_water_content"
      unit: "dimensionless"
      role: "prognostic"
    - name: "hydraulic_conductivity_profile"
      unit: "m/s"
      role: "diagnostic"
    - name: "beta_line_cap"
      unit: "m"
      role: "diagnostic"
    - name: "factor_of_safety"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "minimum_factor_of_safety"
      unit: "dimensionless"
      role: "accumulator"
    - name: "depth_of_minimum_FS"
      unit: "m"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "minimum_factor_of_safety"
    validation_rank: 1
    unit: "dimensionless"
    description: "Minimum computed factor of safety in the soil column across all computation depths at each cell for a given elapsed time; Fs<1 predicts failure, Fs=1 limiting equilibrium, Fs>=1 stable. Clamped to a maximum of 10; cells below slomin assigned 11."
    emitted_in: "TRfs_min_<suffix>_<step>.asc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "categorical_event_comparison"
          metric_families: ["event_detection", "spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Fs is most defensibly compared as a binary stable/unstable classification (Fs<1) against a landslide inventory rather than as a continuous field."
            - "The 10/11 clamps and the flat-cell Fs->infinity artifact must be masked before scoring."
            - "Susceptibility skill depends heavily on the initial water-table depth and shear-strength calibration; mismatch may reflect input uncertainty, not model error."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "At an instrumented/back-analyzed slope, the depth and timing of minimum Fs can be compared, but the infinite-slope Fs is not directly measurable and is typically validated indirectly via observed failure occurrence."
      detrending_options: ["none"]
  - var: "depth_of_minimum_FS"
    validation_rank: 2
    unit: "m"
    description: "Depth at which the minimum factor of safety occurs at each cell; interpreted as the depth of landslide initiation where Fs first drops below 1."
    emitted_in: "TRz_at_fs_min_<suffix>_<step>.asc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Comparable to observed/back-analyzed rupture-surface depths at well-characterized sites; bounded above by zmax."
      detrending_options: ["none"]
  - var: "pressure_head_at_min_FS"
    validation_rank: 3
    unit: "m"
    description: "Groundwater pressure head at the depth of minimum factor of safety; the transient pore-pressure response that drives the Fs reduction."
    emitted_in: "TRp_at_fs_min_<suffix>_<step>.asc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "r"
          caveats:
            - "Compared against piezometer / tensiometer pressure-head or pore-pressure time series at an instrumented column; only valid where the 1-D vertical-flow assumption holds (before lateral flow responds)."
            - "Pressure head is capped at Z*beta (eq. 3A), so saturated peaks are bounded."
      detrending_options: ["none"]
  - var: "water_table_depth"
    validation_rank: 4
    unit: "m"
    description: "Computed depth (or elevation, per the watertable output option) of the transient water table below the surface."
    emitted_in: "TRwater_depth_<suffix>_<step>.asc / TRwater_eleva_<suffix>_<step>.asc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "r"
          caveats:
            - "Compared against monitoring-well water-table records at an instrumented site; 1-D vertical assumption limits validity once lateral flow contributes."
      detrending_options: ["none"]
  - var: "actual_infiltration_rate"
    validation_rank: 5
    unit: "m/s"
    description: "Actual infiltration rate into the soil column, partitioned from rainfall with the excess (where rainfall>Ks) becoming runoff."
    emitted_in: "TRinfilratPer<period>_<suffix>.asc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Comparable to plot/column infiltration measurements; bounded above by Ks."
      detrending_options: ["none"]
  - var: "surface_runoff"
    validation_rank: 6
    unit: "m/s"
    description: "Rainfall in excess of infiltration capacity, instantaneously routed downslope (when runoff routing enabled)."
    emitted_in: "TRrunoffPer<period>_<suffix>.asc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Routing is instantaneous and cannot estimate stream flow; comparison is to a runoff-depth/rate field, not a hydrograph."
      detrending_options: ["none"]

influence:
  edges:
    - from: "cohesion (c')"
      to: "minimum_factor_of_safety"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
      lever_type: "parameter"
      applicability: "always"
      citations: ["montoya2023_trigrs_sensitivity", "listo2021_trigrs_serradomar", "osorio2022_trigrs_reliability", "devugt2024_trigrs_ensembles"]
    - from: "friction_angle (phi)"
      to: "minimum_factor_of_safety"
      sensitivity_grade: "MEDIUM"
      basis: "literature_qualitative"
