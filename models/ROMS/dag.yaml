template_version: "3.5"

identity:
  model_id: "ROMS"
  scientific_reference_version: "ROMS free-surface, hydrostatic, Boussinesq primitive-equation kernel (Rutgers ROMS, Nonlinear forward model; develop branch ~roms-4.2 lineage)"
  implementation:
    id: "roms-nlm"
    version: "4.x (KI label v4.1; upstream latest tag roms-4.2)"
    provenance: "Fortran 90; Rutgers ROMS Group nonlinear forward model (NLM) from github.com/myroms/roms, C-preprocessor (CPP) compile-time physics selection."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "MIT"
  repo_url: "https://github.com/myroms/roms"

boundary:
  scope_in:
    - "Free-surface, hydrostatic, Boussinesq primitive-equation ocean circulation over variable bathymetry"
    - "3D momentum (u, v) and free-surface (zeta) on a split-explicit barotropic/baroclinic mode split"
    - "Active tracer transport (potential temperature, salinity) with selectable vertical mixing closure"
    - "Regional/coastal/estuarine domains on an orthogonal-curvilinear Arakawa C-grid, terrain-following S-coordinate vertical"
    - "Optional coupled submodels: biology (Fennel/NEMURO/EcoSim), sediment transport, sea-ice, bottom boundary layer, wave-effects-on-currents"
  scope_out:
    - "Non-hydrostatic dynamics (model is hydrostatic)"
    - "Global free-surface-resolving circulation (model is regional/limited-area, requires lateral boundary data)"
    - "Compressible / non-Boussinesq density effects"
  spatial: "3-D"
  temporal: "sub-hourly"
  closure: "both"
  notes: "Volume/mass-balance closure on the free surface and tracer (T, S) transport under the Boussinesq approximation; surface energy budget is closed internally only when BULK_FLUXES is active (air-sea fluxes computed from atmospheric state), otherwise prescribed surface fluxes are imposed. Hydrostatic balance replaces the vertical momentum equation. Time stepping is split-explicit: a fast barotropic (2D) mode on dtfast sub-steps and a slow baroclinic (3D) mode on the DT step, coupled at ratio NDTFAST = DT/dtfast; baroclinic DT is typically minutes but barotropic dtfast is sub-minute, so the model resolves sub-hourly dynamics."

inputs:
  forcing:
    - {category: atmospheric, name: "Uwind", unit: "m/s", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid (FRCNAME)", notes: "10 m wind E-component; supplied as atmospheric STATE when BULK_FLUXES active"}
    - {category: atmospheric, name: "Vwind", unit: "m/s", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid (FRCNAME)", notes: "10 m wind N-component"}
    - {category: atmospheric, name: "Tair", unit: "degC", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid", notes: "air temperature; Celsius, not Kelvin (BULK_FLUXES)"}
    - {category: atmospheric, name: "Pair", unit: "mb (hPa)", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid", notes: "surface pressure in millibar, not Pa"}
    - {category: atmospheric, name: "Qair", unit: "kg/kg", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid", notes: "specific humidity (0.001-0.020), not % relative humidity (BULK_FLUXES)"}
    - {category: atmospheric, name: "rain", unit: "kg/m2/s", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid", notes: "precipitation; mm/day must be divided by 86400"}
    - {category: atmospheric, name: "swrad", unit: "W/m2", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid", notes: "shortwave radiation, positive downward into ocean; SOLAR_SOURCE controls subsurface penetration"}
    - {category: atmospheric, name: "lwrad", unit: "W/m2", source_kind: forcing, model_input_format: "NetCDF field on RHO-grid", notes: "net longwave (positive=warming) or downwelling-only when LONGWAVE_OUT active"}
    - {category: surface_flux, name: "sustr", unit: "N/m2 (Pa)", source_kind: forcing, model_input_format: "NetCDF on U-points", notes: "surface U-momentum stress; supplied directly only when BULK_FLUXES is NOT defined (else double-counting)"}
    - {category: surface_flux, name: "svstr", unit: "N/m2 (Pa)", source_kind: forcing, model_input_format: "NetCDF on V-points", notes: "surface V-momentum stress; non-bulk path only"}
    - {category: surface_flux, name: "shflux", unit: "W/m2", source_kind: forcing, model_input_format: "NetCDF on RHO-grid", notes: "net surface heat flux; prescribed when BULK_FLUXES NOT defined"}
    - {category: surface_flux, name: "swflux / EminusP", unit: "m/s (or kg/m2/s)", source_kind: forcing, model_input_format: "NetCDF on RHO-grid", notes: "net freshwater flux evaporation minus precipitation; non-bulk path"}
    - {category: lateral_boundary, name: "open boundary T/S/u/v/zeta", unit: "per-variable", source_kind: forcing, model_input_format: "NetCDF BRYNAME with _west/_east/_south/_north suffixes", notes: "time-varying open-boundary data; must cover full simulation period (daily min, 6-hourly preferred), else last record is extrapolated"}
    - {category: tidal, name: "tidal elevation/velocity constituents", unit: "m, m/s", source_kind: forcing, model_input_format: "NetCDF tidal-forcing file (SSH_TIDES/UV_TIDES)", notes: "harmonic constituents added at open boundaries; forcing time must match TIME_REF epoch"}
    - {category: point_source, name: "river_transport / river_temp / river_salt", unit: "m3/s, degC, PSU", source_kind: forcing, model_input_format: "NetCDF river point-source file (river_Xposition/Eposition/direction/Vshape)", notes: "runoff point sources injected at named grid cells"}
  parameters:
    - {category: grid, name: "h", unit: "m (positive down)", source_kind: dataset_lookup, model_input_format: "NetCDF grid file (GRDNAME)", notes: "bathymetry; must be positive in water; smooth so r-factor |dh|/sum(h) < 0.2"}
    - {category: grid, name: "pm, pn", unit: "1/m", source_kind: dataset_lookup, model_input_format: "NetCDF grid file", notes: "inverse curvilinear metrics 1/dx, 1/dy"}
    - {category: grid, name: "f", unit: "1/s", source_kind: dataset_lookup, model_input_format: "NetCDF grid file", notes: "Coriolis parameter 2*omega*sin(lat)"}
    - {category: grid, name: "lon_rho/lat_rho, angle, mask_rho", unit: "deg, rad, 0/1", source_kind: dataset_lookup, model_input_format: "NetCDF grid file", notes: "coordinates, grid rotation angle, land/sea mask"}
    - {category: vertical_coordinate, name: "THETA_S", unit: "dimensionless", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "surface S-coordinate stretching (0.1-10); recommended 3-7"}
    - {category: vertical_coordinate, name: "THETA_B", unit: "dimensionless", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "bottom S-coordinate stretching (0-4); recommended 0-2"}
    - {category: vertical_coordinate, name: "TCLINE", unit: "m", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "critical depth for stretching (5-200 m)"}
    - {category: mixing, name: "VISC2", unit: "m2/s", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "horizontal momentum viscosity (1-100)"}
    - {category: mixing, name: "TNU2", unit: "m2/s", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "horizontal tracer diffusivity (0-50)"}
    - {category: mixing, name: "AKV_BAK, AKT_BAK", unit: "m2/s", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "background vertical viscosity/diffusivity (1e-6-1e-4)"}
    - {category: drag, name: "RDRG2", unit: "dimensionless", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "quadratic bottom drag coefficient (0-0.01); small changes can destabilize"}
    - {category: drag, name: "Zob", unit: "m", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "bottom roughness length (0.001-0.05)"}
    - {category: nudging, name: "Tnudg", unit: "days", source_kind: calibrated, model_input_format: "roms.in keyword", notes: "boundary/interior nudging time scale (recommended 3-30, typically 10 for T/S)"}
    - {category: physical_constant, name: "RHO0", unit: "kg/m3", source_kind: default, model_input_format: "roms.in keyword (default mod_scalars rho0=1025.0)", notes: "Boussinesq reference seawater density; appears in pressure gradient and gorho0=g/rho0 buoyancy"}
    - {category: physical_constant, name: "Cp", unit: "J/kg/degC", source_kind: default, model_input_format: "hardcoded mod_scalars (3985.0)", notes: "specific heat of seawater converting surface heat flux to temperature flux; not a roms.in input"}
    - {category: physical_constant, name: "EOS polynomial coefficients", unit: "dimensionless", source_kind: default, model_input_format: "hardcoded rho_eos.F", notes: "Jackett & McDougall (1995) nonlinear UNESCO density fit; defines ROMS density, not user-configurable"}
    - {category: varinfo, name: "variable-name mapping", unit: "n/a", source_kind: user_provided, model_input_format: "varinfo.yaml (VARNAME)", notes: "maps internal ROMS names to NetCDF variable names; mismatch causes GET_*FLD read failure"}
  initial_conditions:
    - {category: state, name: "zeta", unit: "m", source_kind: dataset_lookup, model_input_format: "NetCDF initial/restart file (ININAME)", notes: "free-surface elevation at start"}
    - {category: state, name: "ubar, vbar", unit: "m/s", source_kind: dataset_lookup, model_input_format: "NetCDF ININAME", notes: "barotropic 2D velocity at start"}
    - {category: state, name: "u, v", unit: "m/s", source_kind: dataset_lookup, model_input_format: "NetCDF ININAME", notes: "3D baroclinic velocity at start"}
    - {category: state, name: "temp", unit: "degC", source_kind: dataset_lookup, model_input_format: "NetCDF ININAME", notes: "initial potential temperature in Celsius, not Kelvin (HYCOM/GLORYS conversion)"}
    - {category: state, name: "salt", unit: "PSU", source_kind: dataset_lookup, model_input_format: "NetCDF ININAME", notes: "initial salinity"}
    - {category: time, name: "ocean_time", unit: "seconds since TIME_REF", source_kind: user_provided, model_input_format: "NetCDF ININAME / roms.in TIME_REF", notes: "initialization epoch; all NetCDF time variables must reference the same TIME_REF (YYYYMMDD.dd)"}
  boundary_conditions:
    - {category: domain, name: "Lm, Mm, N", unit: "count", source_kind: user_provided, model_input_format: "roms.in keyword", notes: "interior XI/ETA points and vertical levels; Lm=xi_rho-2, Mm=eta_rho-2"}
    - {category: time_stepping, name: "DT", unit: "s", source_kind: user_provided, model_input_format: "roms.in keyword", notes: "baroclinic time step; too large violates CFL -> BLOWUP"}
    - {category: time_stepping, name: "NDTFAST", unit: "count", source_kind: user_provided, model_input_format: "roms.in keyword", notes: "barotropic sub-steps per DT (typically 20-60)"}
    - {category: time_stepping, name: "NTIMES, TIME_REF", unit: "count, YYYYMMDD.dd", source_kind: user_provided, model_input_format: "roms.in keyword", notes: "run length and reference epoch"}
    - {category: vertical_coordinate, name: "Vtransform, Vstretching", unit: "code (1/2; 1-5)", source_kind: user_provided, model_input_format: "roms.in keyword", notes: "S-coordinate transform/stretching family; Vtransform 1 and 2 parameter sets must not be mixed"}
    - {category: lateral_bc, name: "LBC(...) per-variable per-edge", unit: "code", source_kind: user_provided, model_input_format: "roms.in keyword (edge order West South East North)", notes: "Per/Clo/Gra/Rad/RadNud/Cla/Fla open-boundary condition type per variable per edge"}
    - {category: physics_switch, name: "CPP physics flags", unit: "compile-time", source_kind: user_provided, model_input_format: "application header .h", notes: "compile-time selection: SOLVE3D, SALINITY, UV_ADV/UV_COR, DJ_GRADPS, one mixing closure (LMD_MIXING|GLS_MIXING|MY25_MIXING), BULK_FLUXES, SSH_TIDES/UV_TIDES, optional BIOLOGY/SEDIMENT/WEC/NESTING/WET_DRY; changing a flag requires recompilation"}
    - {category: physics_switch, name: "ANA_* analytical flags", unit: "compile-time", source_kind: user_provided, model_input_format: "application header .h", notes: "analytical forcing/grid/initial functions; silently override supplied data files when left defined"}
    - {category: parallel, name: "NtileI, NtileJ", unit: "count", source_kind: user_provided, model_input_format: "roms.in keyword", notes: "MPI tiling; product must equal number of MPI processes"}
    - {category: io, name: "NRST/NHIS/NAVG/NSTA, Hout(...)", unit: "steps / flags", source_kind: user_provided, model_input_format: "roms.in keyword", notes: "output intervals and per-variable output flags"}

processes:
  modules:
    - {name: "main3d", role: "driver", brief: "Top-level nonlinear baroclinic time-stepping kernel; orders all process solvers and the barotropic/baroclinic split each timestep."}
    - {name: "step2d", role: "integrator", brief: "Fast-mode barotropic engine: free-surface zeta and depth-averaged ubar/vbar via LF-AM3 or FB AB3-AM4 predictor-corrector over nfast sub-steps."}
    - {name: "step3d_uv", role: "integrator", brief: "Slow-mode 3D momentum update for u, v coupled to the barotropic mode, applying vertical viscosity Akv implicitly."}
    - {name: "step3d_t", role: "integrator", brief: "Tracer advection-diffusion: advances temp, salt (and passive tracers) with horizontal/vertical advection and Akt vertical diffusion."}
    - {name: "rhs3d", role: "process_solver", brief: "Assembles the 3D momentum right-hand-side: advection, Coriolis, horizontal viscosity, and vertical integral of the pressure gradient."}
    - {name: "prsgrd", role: "process_solver", brief: "Baroclinic pressure-gradient force from density (Shchepetkin-McWilliams density-Jacobian / spline schemes; DJ_GRADPS)."}
    - {name: "rho_eos", role: "process_solver", brief: "Nonlinear Jackett-McDougall (1995) in-situ density from T, S, depth; also Brunt-Vaisala frequency bvf."}
    - {name: "set_depth", role: "allocator", brief: "Recomputes terrain-following S-coordinate depths z_r, z_w and layer thicknesses Hz from the updated free surface zeta."}
    - {name: "set_massflux", role: "process_solver", brief: "Computes horizontal mass fluxes Hz*u/n, Hz*v/m used by advection and the omega diagnosis."}
    - {name: "omega", role: "process_solver", brief: "Diagnoses S-coordinate vertical velocity W (and true vertical velocity w) from horizontal mass divergence."}
    - {name: "hmixing", role: "process_solver", brief: "Computes 3D horizontal viscosity/diffusivity coefficients when 3D-coefficient (e.g. Smagorinsky) options are active."}
    - {name: "lmd_vmix (KPP)", role: "optional_module", brief: "Large-McWilliams-Doney K-profile boundary-layer + interior mixing producing Akv/Akt.", applicability: "LMD_MIXING"}
    - {name: "gls_mixing", role: "optional_module", brief: "Generic Length Scale two-equation (k-epsilon/k-omega/gen) closure producing Akv/Akt and tke/gls state.", applicability: "GLS_MIXING"}
    - {name: "my25_mixing", role: "optional_module", brief: "Mellor-Yamada Level 2.5 closure producing Akv/Akt.", applicability: "MY25_MIXING"}
    - {name: "set_vbc", role: "process_solver", brief: "Sets surface momentum/tracer flux boundary conditions (bulk_flux bulk formulae when BULK_FLUXES, else prescribed forcing) feeding the forces module."}
    - {name: "bblm", role: "process_solver", brief: "Bottom boundary layer model producing bottom stress bustr/bvstr."}
    - {name: "set_tides", role: "optional_module", brief: "Adds harmonic tidal elevation/velocity forcing and equilibrium tide-generating body force at open boundaries.", applicability: "SSH_TIDES/UV_TIDES"}
    - {name: "diag", role: "process_solver", brief: "Computes volume-averaged kinetic/potential/total energy, volume, and Courant numbers each step; BLOWUP instability monitor."}
    - {name: "biology", role: "optional_module", brief: "Biogeochemistry source/sink (Fennel/NEMURO/EcoSim) mutating tracer concentrations.", applicability: "BIOLOGY"}
    - {name: "sediment", role: "optional_module", brief: "Suspended-load and bed-load sediment transport with BBL closures.", applicability: "SEDIMENT"}
    - {name: "nesting", role: "driver", brief: "Composite/refinement contact-zone exchange and two-way coupling between nested grids.", applicability: "NESTING"}
  internal_edges:
    - {from: "Inputs", to: "set_vbc", kind: consumes_input, brief: "Atmospheric/boundary forcing is read and time-interpolated, then surface fluxes are formed."}
    - {from: "Inputs", to: "bblm", kind: consumes_input, brief: "Bottom roughness/drag parameters feed the bottom boundary layer stress computation."}
    - {from: "temp", to: "rho_eos", kind: reads_state, brief: "EOS reads temperature and salinity tracer fields."}
    - {from: "salt", to: "rho_eos", kind: reads_state, brief: "EOS reads salinity tracer field."}
    - {from: "rho_eos", to: "rho", kind: writes_state, brief: "EOS writes in-situ density anomaly from T, S, depth."}
    - {from: "rho_eos", to: "bvf", kind: writes_state, brief: "Writes Brunt-Vaisala frequency bvf = -gorho0*d(rho)/dz."}
    - {from: "rho", to: "prsgrd", kind: reads_state, brief: "Pressure-gradient solver reads density to build the baroclinic PGF."}
    - {from: "prsgrd", to: "rhs3d", kind: invokes, brief: "rhs3d calls prsgrd for the pressure-gradient term of the momentum RHS."}
    - {from: "rhs3d", to: "ru", kind: writes_state, brief: "Accumulates the 3D momentum right-hand-side (advection, Coriolis, mixing, PGF) into ru."}
    - {from: "rhs3d", to: "rv", kind: writes_state, brief: "Accumulates the 3D momentum right-hand-side into rv."}
    - {from: "set_massflux", to: "W", kind: writes_state, brief: "Horizontal mass fluxes feed the omega vertical-velocity diagnosis."}
    - {from: "step2d", to: "zeta", kind: writes_state, brief: "Barotropic engine updates free-surface elevation across nfast sub-steps."}
    - {from: "step2d", to: "ubar", kind: writes_state, brief: "Updates depth-averaged barotropic momentum ubar, vbar."}
    - {from: "zeta", to: "set_depth", kind: reads_state, brief: "S-coordinate depths/thicknesses recomputed from the new time-filtered free surface."}
    - {from: "set_depth", to: "Hz", kind: writes_state, brief: "Writes S-coordinate layer thickness Hz and z_r, z_w depths."}
    - {from: "Hz", to: "step3d_uv", kind: reads_state, brief: "3D momentum update needs refreshed layer thicknesses."}
    - {from: "ru", to: "step3d_uv", kind: reads_state, brief: "step3d_uv integrates the accumulated momentum RHS into u, v."}
    - {from: "step3d_uv", to: "u", kind: writes_state, brief: "Updates 3D baroclinic velocity coupled to the barotropic mode."}
    - {from: "lmd_vmix (KPP)", to: "Akv", kind: writes_state, brief: "Active vertical-mixing closure writes vertical viscosity Akv."}
    - {from: "lmd_vmix (KPP)", to: "Akt", kind: writes_state, brief: "Active vertical-mixing closure writes per-tracer vertical diffusivity Akt."}
    - {from: "Akv", to: "step3d_uv", kind: reads_state, brief: "Implicit vertical viscosity applied to momentum."}
    - {from: "Akt", to: "step3d_t", kind: reads_state, brief: "Tracer update uses vertical diffusivity."}
    - {from: "step3d_t", to: "temp", kind: writes_state, brief: "Advances temperature tracer one slow time step."}
    - {from: "step3d_t", to: "salt", kind: writes_state, brief: "Advances salinity tracer one slow time step."}
    - {from: "set_vbc", to: "step3d_uv", kind: consumes_input, brief: "Surface stress enters 3D momentum as the top boundary condition."}
    - {from: "bblm", to: "step3d_uv", kind: consumes_input, brief: "Bottom stress enters 3D momentum as the bottom boundary condition."}
    - {from: "set_tides", to: "zeta", kind: writes_state, brief: "Adds tidal elevation/velocity forcing at open boundaries."}
    - {from: "omega", to: "W", kind: writes_state, brief: "Diagnoses S-coordinate vertical velocity from mass divergence."}
    - {from: "biology", to: "temp", kind: writes_state, brief: "Optional biogeochemistry source/sink modifies tracer concentrations (passive/bio tracers; T shown as representative)."}
    - {from: "sediment", to: "salt", kind: writes_state, brief: "Optional sediment transport modifies suspended-sediment tracers (S shown as representative tracer slot)."}
    - {from: "nesting", to: "temp", kind: writes_state, brief: "Two-way nesting overwrites coarse-grid state with refined averages in contact zones (T shown as representative)."}
    - {from: "diag", to: "Outputs", kind: produces_output, brief: "Reports avg KE/PE/total energy, volume, and Courant number; detects blow-up."}
    - {from: "step3d_t", to: "Outputs", kind: produces_output, brief: "History/average NetCDF writers emit the updated state (zeta, u, v, temp, salt, rho)."}

states:
  variables:
    - {name: "zeta", unit: "m", role: prognostic}
    - {name: "ubar", unit: "m/s", role: prognostic}
    - {name: "vbar", unit: "m/s", role: prognostic}
    - {name: "u", unit: "m/s", role: prognostic}
    - {name: "v", unit: "m/s", role: prognostic}
    - {name: "temp", unit: "degC", role: prognostic}
    - {name: "salt", unit: "PSU", role: prognostic}
    - {name: "rho", unit: "kg/m3", role: diagnostic}
    - {name: "W", unit: "m3/s", role: diagnostic}
    - {name: "w", unit: "m/s", role: diagnostic}
    - {name: "Akv", unit: "m2/s", role: diagnostic}
    - {name: "Akt", unit: "m2/s", role: diagnostic}
    - {name: "bvf", unit: "1/s2", role: diagnostic}
    - {name: "Hz", unit: "m", role: diagnostic}
    - {name: "z_r, z_w", unit: "m", role: diagnostic}
    - {name: "tke, gls", unit: "m2/s2, m3/s2", role: prognostic}
    - {name: "ru", unit: "m4/s2", role: accumulator}
    - {name: "rv", unit: "m4/s2", role: accumulator}
    - {name: "rubar, rvbar, rzeta", unit: "barotropic RHS", role: accumulator}
  provenance: "populated"

outputs:
  - var: "zeta"
    validation_rank: 1
    unit: "m"
    description: "Free-surface elevation (sea surface height); barotropic prognostic state"
    emitted_in: "roms_his.nc / roms_avg.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy, timing_accuracy]
          determining_metric: "nse"
          caveats: ["Tide-gauge SSH: separate tidal (harmonic amplitude/phase, e.g. M2) from subtidal residual; timing_accuracy applies to tidal phase."]
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: [spatial_pattern_match, magnitude_accuracy]
          determining_metric: "csi"
          caveats: ["Altimetric SSH anomaly needs a consistent mean-sea-surface reference before comparison."]
      detrending_options: [none, linear_residual]
  - var: "temp"
    validation_rank: 2
    unit: "degC"
    description: "Potential temperature tracer (3D); surface level used as SST"
    emitted_in: "roms_his.nc / roms_avg.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "nse"
          caveats: ["CTD/ARGO upper-200 m profile RMSE target < 1 degC; vertical interpolation from S-levels to obs depths required."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: [spatial_pattern_match, magnitude_accuracy]
          determining_metric: "csi"
          caveats: ["Satellite SST is a skin/surface field; compare against the surface S-level (k=N-1); bias target < 0.5 degC, spatial r > 0.9."]
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: [magnitude_accuracy]
          determining_metric: "pbias"
          caveats: ["Single-cast comparison; sensitive to sampling time within the diurnal/tidal cycle."]
      detrending_options: [none, linear_residual]
  - var: "salt"
    validation_rank: 3
    unit: "PSU"
    description: "Ocean salinity tracer (3D)"
    emitted_in: "roms_his.nc / roms_avg.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "nse"
          caveats: ["CTD/ARGO salinity RMSE target < 0.2 PSU; surface salinity strongly tied to freshwater-flux and river forcing accuracy."]
      detrending_options: [none]
  - var: "u"
    validation_rank: 4
    unit: "m/s"
    description: "Ocean 3D baroclinic velocity XI-component (eastward after rotation)"
    emitted_in: "roms_his.nc / roms_avg.nc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: [temporal_pattern_match, magnitude_accuracy]
          determining_metric: "nse"
