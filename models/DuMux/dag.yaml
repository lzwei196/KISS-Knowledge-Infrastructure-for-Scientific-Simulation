template_version: "3.5"

identity:
  model_id: "DuMux"
  scientific_reference_version: "DuMux 3.10 (DUNE-based finite-volume porous-media flow/transport library; Koch et al. 2021, DuMux 3)"
  implementation:
    id: "dumux-3.10"
    version: "3.10"
    provenance: "C++ (header-only DUNE module); DuMux project (github.com/dumux/dumux) wrapping DUNE core numerics. Executables are user/example problems compiled against the headers."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL-3.0-or-later"
  repo_url: "https://github.com/dumux/dumux"

boundary:
  scope_in:
    - "Darcy-scale flow and transport in porous media (single-phase saturated, variably-saturated Richards, multi-phase immiscible, multi-component compositional)"
    - "Passive/reactive tracer advection-diffusion driven by the flow solution"
    - "Pressure / saturation / composition fields on a structured or unstructured finite-volume grid"
    - "Optional non-isothermal heat transport coupled to flow"
    - "Optional multi-domain coupling (free-flow / porous medium, embedded wells/fractures)"
  scope_out:
    - "Conceptual storage-discharge or lumped hydrologic relationships (this is a mechanistic PDE solver, not a conceptual model)"
    - "Turnkey domain application / pre-built basin model (DuMux is a research library; the runnable entity is a user-compiled problem)"
    - "Land-surface, vegetation, or atmospheric process representation beyond boundary forcing"
  spatial: "distributed-stream"
  temporal: "sub-hourly"
  closure: "mass-balance"
  notes: "Time integration is an implicit (backward) Euler time loop with adaptive Newton-driven timestepping; the enum bucket sub-hourly reflects that the adaptive step ranges from sub-second to large, not a fixed grain. All time parameters are SI seconds (DtInitial typically ~1% of TEnd); the documented HydroCraft groundwater case can be run steady-state or transient. Closure is per-phase / per-component mass conservation discretized by finite volume (cell-centered TPFA/MPFA or vertex-centered box/CVFE). Momentum is given by the multiphase extended Darcy law v_alpha = -(kr_alpha/mu_alpha) K (grad p_alpha - rho_alpha g), not a solved momentum equation, in the porous-medium models. Constitutive closure (capillary pressure pc = p_n - p_w, relative permeability kr(Sw)) reduces unknowns to the chosen primary variables. Spatial extents in meters; pressures absolute (Pa). Non-isothermal closure (energy balance) applies only when a non-isothermal model (e.g. OnePNI) is active; free-flow / poromechanics closures apply only in those optional model families. The HydroCraft groundwater use case documented in the KI is a single-phase (1p) steady-state or transient Darcy application."

inputs:
  forcing:
    - category: "forcing"
      name: "Recharge / top boundary flux"
      unit: "kg/(m2*s)"
      source_kind: "user_provided"
      model_input_format: "Neumann boundary condition returned by the Problem class (per scvf), in kg/(m2*s)"
      notes: "Sign convention: positive = outward (leaving domain); recharge/inflow must be NEGATIVE. Mass flux, not a volumetric mm/day rate (R[kg/m2/s] = R[mm/day]/86400)."
  parameters:
    - category: "spatial_parameter"
      name: "Intrinsic permeability K"
      unit: "m2"
      source_kind: "dataset_lookup"
      model_input_format: "SpatialParams.permeabilityAtPos() returning a scalar or tensor K [m2]; or DGF element/node data; or Eclipse PERMX/PERMY keywords"
      notes: "Intrinsic permeability in m2, NOT hydraulic conductivity K_h [m/s] or darcy. Typical aquifer range 1e-15 to 1e-8 m2. Must be > 0."
    - category: "spatial_parameter"
      name: "Porosity phi"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "SpatialParams.porosityAtPos() returning a fraction; or DGF/Eclipse PORO"
      notes: "Pore volume fraction in [0,1]; must be > 0 (zero porosity yields NaN / solver crash). Typical 0.01-0.60."
    - category: "spatial_parameter"
      name: "van Genuchten alpha (capillary pressure scale)"
      unit: "1/Pa"
      source_kind: "dataset_lookup"
      model_input_format: "Fluid-matrix-interaction (VanGenuchten/BrooksCorey) parameter consumed by material/fluidmatrixinteractions"
      notes: "In 1/Pa, NOT 1/cm H2O (alpha_Pa = alpha_cm/98.0665). Applies to variably-saturated / multi-phase models, not 1p saturated flow."
    - category: "spatial_parameter"
      name: "van Genuchten n (pore-geometry index)"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "Fluid-matrix-interaction shape parameter"
      notes: "Must be > 1 for a well-defined capillary law (n<=1 makes pc(Sw) undefined / NaN)."
    - category: "spatial_parameter"
      name: "Residual water saturation Swr"
      unit: "-"
      source_kind: "dataset_lookup"
      model_input_format: "Fluid-matrix-interaction regularization parameter"
    - category: "spatial_parameter"
      name: "Dispersivity"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "Tracer/transport spatial parameter"
      notes: "Used by tracer/compositional transport, not by the flow-only models."
    - category: "spatial_parameter"
      name: "Molecular diffusion coefficient"
      unit: "m2/s"
      source_kind: "default"
      model_input_format: "Fluid-system / FicksLaw diffusion coefficient"
      notes: "Consumed by compositional and tracer transport (FicksLaw)."
    - category: "numerical_parameter"
      name: "Newton convergence/control parameters (MaxRelativeShift, TargetSteps, MaxSteps, MaxTimeStepDivisions)"
      unit: "-"
      source_kind: "default"
      model_input_format: "[Newton] group of the parameter tree (in-code defaults: MaxRelativeShift 1e-8, ResidualReduction 1e-5, TargetSteps 10, MaxSteps 18, MaxTimeStepDivisions 10)"
      notes: "By default convergence is judged on relative shift only (EnableResidualCriterion false); residual may not be small even when Newton reports converged."
  initial_conditions:
    - category: "initial_condition"
      name: "Initial primary-variable solution"
      unit: "model-dependent (Pa for pressure, - for saturation)"
      source_kind: "user_provided"
      model_input_format: "Problem.initial() per DOF; or restart via Dumux::loadSolution() from a prior VTK solution"
      notes: "Restart requires the EXACT same grid (same cells, same ordering); changing resolution silently corrupts the restart. Should be consistent (e.g. hydrostatic) with the Dirichlet BCs to avoid first-step Newton failure."
  boundary_conditions:
    - category: "boundary_condition"
      name: "Dirichlet boundary (fixed pressure / head)"
      unit: "Pa (absolute)"
      source_kind: "user_provided"
      model_input_format: "Problem.dirichletAtPos() returning absolute pressure; p = 101325 + rho*g*(head - elevation)"
      notes: "Absolute pressure, NOT gauge; surface p ~ 101325 Pa. Gauge use shifts head ~10.3 m."
    - category: "boundary_condition"
      name: "Boundary-type assignment (Dirichlet vs Neumann per segment)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Problem.boundaryTypesAtPos() classifying each boundary segment"
    - category: "boundary_condition"
      name: "Source / sink terms (e.g. pumping wells)"
      unit: "kg/(m3*s)"
      source_kind: "user_provided"
      model_input_format: "Problem.source()/sourceAtPos() per control volume; required (with transient mode) for pumping wells"
    - category: "boundary_condition"
      name: "Gravity switch (Problem.EnableGravity)"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "Problem.EnableGravity bool read by the Darcy flux; gravity acts in -z (last coordinate)"
      notes: "Structural switch: set false for plan-view 2D, true for vertical cross-sections. Read without an in-code default at the TPFA Darcy site; an unset value relies on a property-level default and can silently drop the gravity term."
    - category: "boundary_condition"
      name: "Grid domain definition (extent, cells, refinement, grid file)"
      unit: "m / count"
      source_kind: "user_provided"
      model_input_format: "[Grid] group (LowerLeft/UpperRight in meters, Cells, Refinement) consumed by Dumux::GridManager; or DGF / Gmsh MSH v2 / Eclipse GRDECL / VTK grid file"
      notes: "Coordinates in meters. Gmsh meshes must be MSH version 2."
    - category: "boundary_condition"
      name: "Time-loop control (TEnd, DtInitial, MaxTimeStepSize)"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "[TimeLoop] group consumed by common/TimeLoop"
      notes: "All in seconds (1 day = 86400 s, 1 year = 31536000 s). DtInitial ~1% of TEnd is a safe start; a large initial dt causes Newton failure."

processes:
  modules:
    - name: "Problem_SpatialParams"
      role: "driver"
      brief: "User-facing FVProblem: boundary/initial conditions, source terms, gravity flag, and SpatialParams supplying intrinsic permeability K [m2], porosity [-] and fluid-matrix-interaction (pc-Sw, kr-Sw) laws."
    - name: "Discretization"
      role: "driver"
      brief: "Finite-volume grid geometry (Box/CCTpfa/CCMpfa/CVFE): builds sub-control-volumes (scv) and faces (scvf), local views, and sets DOF locations (cell- vs vertex-centered)."
    - name: "MaterialFluidMatrixInteraction"
      role: "process_solver"
      brief: "Constitutive relations: van Genuchten / Brooks-Corey pc(Sw), relative permeability kr(Sw) with regularization; fluid systems / components give density, viscosity, EOS, diffusion coefficients."
    - name: "DarcysLaw"
      role: "process_solver"
      brief: "Advective Darcy flux across each scvf from transmissibility tij and potential gradient (grad p + rho*g*z); upwinds mobility kr/mu; basis of recharge/groundwater flow."
    - name: "FicksLaw_FouriersLaw"
      role: "process_solver"
      brief: "Diffusive (Fickian molecular diffusion) and conductive (Fourier heat) fluxes for compositional and non-isothermal models."
      applicability: "compositional / tracer / non-isothermal models only"
    - name: "VolumeVariables"
      role: "process_solver"
      brief: "Per-scv secondary variables computed from primary unknowns: saturations, capillary pressure, densities, mobilities, porosity, water content."
    - name: "LocalResidual"
      role: "integrator"
      brief: "Assembles per-element mass-balance residual = d(storage)/dt + div(flux) - source for the chosen porous-medium model (1p/Richards/2p/2p2c/tracer)."
    - name: "FVAssembler"
      role: "allocator"
      brief: "Loops elements, evaluates LocalResidual, builds the global Jacobian by numeric differentiation (BaseEpsilon 1e-10, scaled by primary-variable magnitude) and the residual vector with the correct sparsity pattern."
    - name: "NewtonSolver"
      role: "process_solver"
      brief: "Newton-Raphson loop: shift (1e-8) / optional residual (1e-5) convergence criteria, MaxSteps 18, TargetSteps 10 feeding adaptive dt. RichardsNewtonSolver adds a 20%/iteration saturation-change clamp for the first 5 iterations."
    - name: "IstlLinearSolver"
      role: "process_solver"
      brief: "Inner linear solve of the Jacobian system via dune-istl (AMG/ILU-preconditioned Krylov, e.g. BiCGSTAB), ResidualReduction 1e-6, returning the Newton update du."
    - name: "TimeLoop"
      role: "integrator"
      brief: "Implicit (backward) Euler time stepping: TEnd, DtInitial, MaxTimeStepSize; grows/shrinks dt from Newton TargetSteps and bisects dt up to MaxTimeStepDivisions (10) on Newton failure."
    - name: "CouplingManager"
      role: "optional_module"
      brief: "Multi-domain coupling: exchanges solution state between subdomains (free-flow / porous medium, embedded wells/fractures, facet) and contributes off-diagonal Jacobian blocks."
      applicability: "multidomain multi-physics problems only"
    - name: "VtkOutputModule"
      role: "optional_module"
      brief: "Writes .vtu snapshots + .pvd time series of volume variables (pressure, saturation, theta, pc, porosity, optional Darcy velocity) at Float32 (default) or Float64 precision."
  internal_edges:
    - from: "Discretization"
      to: "DarcysLaw"
      kind: "consumes_input"
      brief: "Darcy flux uses scv/scvf geometry and TPFA transmissibility from the grid geometry."
    - from: "Problem_SpatialParams"
      to: "VolumeVariables"
      kind: "consumes_input"
      brief: "VolumeVariables read porosity, permeability and pc-Sw / kr-Sw laws from SpatialParams."
    - from: "MaterialFluidMatrixInteraction"
      to: "VolumeVariables"
      kind: "invokes"
      brief: "VolumeVariables call pc(Sw), kr(Sw), density/viscosity to compute secondary quantities."
    - from: "VolumeVariables"
      to: "DarcysLaw"
      kind: "reads_state"
      brief: "Flux upwinds mobility = kr/mu and density from inside/outside VolumeVariables."
    - from: "DarcysLaw"
      to: "LocalResidual"
      kind: "produces_output"
      brief: "Darcy advective flux enters the divergence (flux) term of the mass-balance residual."
    - from: "FicksLaw_FouriersLaw"
      to: "LocalResidual"
      kind: "produces_output"
      brief: "Diffusive/conductive fluxes enter the residual for compositional and non-isothermal models."
    - from: "VolumeVariables"
      to: "LocalResidual"
      kind: "reads_state"
      brief: "Storage term d(phi*rho*S)/dt computed from VolumeVariables."
    - from: "LocalResidual"
      to: "FVAssembler"
      kind: "produces_output"
      brief: "Per-element residual + numeric-difference Jacobian contributions assembled globally."
    - from: "FVAssembler"
      to: "NewtonSolver"
      kind: "produces_output"
      brief: "Assembler supplies the global residual and Jacobian to each Newton iteration."
    - from: "NewtonSolver"
      to: "IstlLinearSolver"
      kind: "invokes"
      brief: "Newton solves J*du = -r via the ISTL linear backend each iteration."
    - from: "IstlLinearSolver"
      to: "NewtonSolver"
      kind: "produces_output"
      brief: "Linear update du is returned and applied to the solution vector."
    - from: "MaterialFluidMatrixInteraction"
      to: "NewtonSolver"
      kind: "reads_state"
      brief: "RichardsNewtonSolver reads pc(Sw)/sw(pc) to clamp the pressure update (20%/iter, first 5 iters)."
    - from: "NewtonSolver"
      to: "TimeLoop"
      kind: "produces_output"
      brief: "Iteration count vs TargetSteps drives adaptive dt; convergence failure triggers dt bisection (MaxTimeStepDivisions)."
    - from: "TimeLoop"
      to: "FVAssembler"
      kind: "invokes"
      brief: "TimeLoop advances time and provides dt for the storage (time-derivative) term."
    - from: "NewtonSolver"
      to: "VolumeVariables"
      kind: "writes_state"
      brief: "Converged primary-variable solution updates the grid variables / VolumeVariables."
    - from: "VolumeVariables"
      to: "VtkOutputModule"
      kind: "produces_output"
      brief: "IOFields register saturation/pressure/pc/theta/porosity (and optional velocity) as VTK output fields."
    - from: "VtkOutputModule"
      to: "TimeLoop"
      kind: "consumes_input"
      brief: "VTK writer invoked at output time points driven by the time loop, emitting .vtu + .pvd."
    - from: "CouplingManager"
      to: "LocalResidual"
      kind: "writes_state"
      brief: "Coupling manager injects another subdomain's solution into a subdomain local residual."
    - from: "CouplingManager"
      to: "FVAssembler"
      kind: "produces_output"
      brief: "Supplies coupling Jacobian sparsity and off-diagonal blocks for monolithic multi-domain assembly."
    - from: "Inputs"
      to: "Discretization"
      kind: "consumes_input"
      brief: "Grid domain definition ([Grid] / DGF / Gmsh) is read by the GridManager to build the FV mesh."
    - from: "Problem_SpatialParams"
      to: "DarcysLaw"
      kind: "consumes_input"
      brief: "Gravity term rho*g is added to the Darcy potential only when Problem.EnableGravity is set; gravity acts in -z."

states:
  variables:
    - name: "pressure (p / p_w)"
      unit: "Pa"
      role: "prognostic"
    - name: "saturation (S_n / S_w)"
      unit: "-"
      role: "prognostic"
    - name: "component mole/mass fraction (x_alpha^kappa)"
      unit: "-"
      role: "prognostic"
    - name: "temperature (T)"
      unit: "K"
      role: "prognostic"
    - name: "tracer mole/mass fraction (x_tracer)"
      unit: "-"
      role: "prognostic"
    - name: "capillary pressure (pc)"
      unit: "Pa"
      role: "diagnostic"
    - name: "relative permeability (kr)"
      unit: "-"
      role: "diagnostic"
    - name: "mobility (kr/mu)"
      unit: "1/(Pa*s)"
      role: "diagnostic"
    - name: "density (rho)"
      unit: "kg/m3"
      role: "diagnostic"
    - name: "water content (theta)"
      unit: "-"
      role: "diagnostic"
    - name: "pressure head (h)"
      unit: "m"
      role: "diagnostic"
    - name: "transmissibility cache (tij)"
      unit: "m3"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "pressure"
    validation_rank: 1
    unit: "Pa"
    description: "Subsurface porous-medium phase / fluid pressure field (primary variable). Hydraulic head h = (p - 101325)/(rho*g) + z is derived from it for comparison with groundwater well data."
    emitted_in: "VTK (.vtu per step, .pvd time-series index)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Compare at observation-well locations after converting to head; pressure is absolute (Pa), well data are head (m)."
            - "Steady-state single-snapshot heads; sign of the lateral gradient must match the simulated flow direction."
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Transient runs only; requires recharge/BC forcing time series consistent with the observed period."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Compare against an interpolated/observed head map; uniform-K assumption limits agreement where heterogeneity dominates."
      detrending_options: ["none"]
  - var: "velocity"
    validation_rank: 2
    unit: "m/s"
    description: "Subsurface porous-medium Darcy / advective velocity field (only emitted when Vtk.AddVelocity = true)."
    emitted_in: "VTK (.vtu) when AddVelocity enabled"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Direct velocity observations are rare; usually inferred from tracer travel time or gradient-derived baseflow."
            - "Physical range ~1e-9 to 1e-4 m/s; values >1e-2 m/s indicate a permeability unit error."
      detrending_options: ["none"]
  - var: "saturation"
    validation_rank: 3
    unit: "-"
    description: "Subsurface porous-medium phase saturation field (S_w, S_n) for variably-saturated and multi-phase models."
    emitted_in: "VTK (.vtu / .pvd)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Applies to Richards / 2p models; compare against moisture-probe or wetting-front-arrival data."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Plume/front geometry comparison (e.g. CO2 or NAPL extent) is sensitive to permeability heterogeneity and capillary parameters."
      detrending_options: ["none"]
  - var: "tracer concentration / mass fraction"
    validation_rank: 4
    unit: "mol/m3 (concentration) or - (mass/mole fraction)"
    description: "Subsurface porous-medium tracer / component concentration transported by the advection-diffusion equation using the flow velocity field."
    emitted_in: "VTK (.vtu / .pvd)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Breakthrough-curve comparison; arrival timing is dispersivity- and velocity-sensitive."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Plume-extent comparison at a fixed time."
      detrending_options: ["none"]
  - var: "baseflow (derived flux)"
    validation_rank: 5
    unit: "m3/s"
    description: "Groundwater discharge to a stream/boundary, computed from the simulated head gradient across a boundary face (post-processed)."
    emitted_in: "post-processed from VTK flux fields (not a native VTK field)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Requires a transient coupled run; baseflow is a derived integral over a boundary, not a primary output."
      detrending_options: ["none"]

influence:
  edges:
    - from: "intrinsic permeability K"
      to: "saturation (plume migration / extent)"
      sensitivity_grade: HIGH
      basis: cross_family_model_literature
      lever_type: parameter
      applicability: "multi-phase (CO2/NAPL) flow; permeability heterogeneity"
      citations: ["flemisch2024_fluidflower_benchmark", "ferno2024_forecast_uncertainty"]
    - from: "intrinsic permeability K"
      to: "tracer concentration / mass fraction (dissolution / mixing)"
      sensitivity_grade: HIGH
      basis: cross_family_model_literature
      lever_type: parameter
      applicability: "compositional / dissolution-trapping problems"
      citations: ["ferno2024_forecast_uncertainty"]
    - from: "porosity phi"
      to: "saturation (plume migration / extent)"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: parameter
      applicability: "multi-phase flow; secondary to permeability"
      citations: ["flemisch2024_fluidflower_benchmark", "ferno2024_forecast_uncertainty"]
    - from: "porosity phi"
      to: "tracer concentration / mass fraction (dissolution)"
      sensitivity_grade: MEDIUM
      basis: cross_family_model_literature
      lever_type: parameter
      citations: ["ferno2024_forecast_uncertainty"]
    - from: "injection / source rate"
      to: "pressure"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: boundary_forcing
      applicability: "injection / pumping problems"
      citations: ["flemisch2024_fluidflower_benchmark"]
    - from: "van Genuchten n (pore-geometry index)"
      to: "saturation (trapping / migration)"
      sensitivity_grade: HIGH
      basis: cross_family_model_literature
      lever_type: parameter
      applicability: "variably-saturated / multi-phase models with van Genuchten closure"
      citations: ["vangenuchten2019_co2_param", "koch2021_dumux3"]
    - from: "residual wetting saturation Swr"
      to: "saturation (trapping / migration)"
      sensitivity_grade: LOW
      basis: cross_family_model_literature
      lever_type: parameter
      citations: ["vangenuchten2019_co2_param"]
    - from: "capillary entry pressure"
      to: "saturation (plume migration / pooling)"
      sensitivity_grade: MEDIUM
      basis: literature_qualitative
      lever_type: parameter
      applicability: "layered / facies-contrast multi-phase geometries"
      citations: ["flemisch2024_fluidflower_benchmark"]
  _caveat: "No formal variance-based (Sobol/Morris/EFAST) SA exists for DuMux itself; HIGH/MEDIUM grades are inferred from multi-code FluidFlower benchmark forecast-spread attribution (DuMux among nine codes) and one cross-family van Genuchten CO2 parameter study (Tariq et al. 2019) using the same constitutive laws."
  citation_index:
    flemisch2024_fluidflower_benchmark:
      short_citation: "Flemisch et al. 2024"
      doi: "10.1007/s11242-023-02008-1"
      note: "FluidFlower international benchmark (nine groups, several using DuMux); largest CO2 forecast spread attributed to permeability heterogeneity, secondary to capillary-entry pressure and residual saturations."
    ferno2024_forecast_uncertainty:
      short_citation: "Ferno et al. 2024"
      doi: "10.1016/j.ijggc.2024.104162"
      note: "FluidFlower forecast-vs-experiment uncertainty; discrepancies dominated by permeability/petrophysical uncertainty, with porosity and capillary parameters controlling dissolution and timing."
    vangenuchten2019_co2_param:
      short_citation: "Tariq et al. 2019"
      doi: "10.1016/j.ijggc.2019.03.011"
      note: "Sensitivity of van Genuchten capillary-pressure / relative-permeability parameters (same constitutive laws as DuMux) on CO2 storage; pore-geometry index ranks above residual saturations."
    koch2021_dumux3:
      short_citation: "Koch et al. 2021"
      doi: "10.1016/j.camwa.2020.02.012"
      note: "DuMux 3 reference paper; documents the van Genuchten / Brooks-Corey constitutive laws and parameter set but does not itself rank sensitivities."

safety:
  hazards:
    - id: "permeability_Kh_used_as_intrinsic_K"
      kind: "soil_semantic"
      description: "Hydraulic conductivity K_h [m/s] supplied where intrinsic permeability K [m2] is expected (off by ~1e7); K[m2] = K_h[m/s] * mu/(rho*g) ~ K_h * 1.0214e-7."
      severity: "critical"
    - id: "recharge_mmday_used_as_mass_flux"
      kind: "weather_file_semantic"
      description: "Recharge given in mm/day used directly as the kg/(m2*s) Neumann flux (off by 86400x); R[kg/m2/s] = R[mm/day]/86400."
      severity: "silent"
    - id: "neumann_recharge_sign_inverted"
      kind: "control_semantic"
      description: "Neumann flux sign positive (outflow); recharge/inflow must be negative, otherwise recharge acts as extraction and the water table drops."
      severity: "silent"
    - id: "vangenuchten_alpha_per_cm_used_as_per_Pa"
      kind: "soil_semantic"
      description: "van Genuchten alpha in 1/cm H2O used where 1/Pa is required (off ~100x); alpha_Pa = alpha_cm/98.0665. Yields a wrong capillary-pressure / retention curve."
      severity: "silent"
    - id: "gauge_pressure_used_as_absolute"
      kind: "initial_condition_semantic"
      description: "Gauge pressure (p=0 at surface) used where DuMux expects absolute pressure (~101325 Pa at surface); shifts head ~10.3 m and can reverse flow direction."
      severity: "silent"
    - id: "grid_coordinates_not_meters"
      kind: "soil_semantic"
      description: "Grid coordinates supplied in km or cm instead of meters; domain becomes 1000x too small/large."
      severity: "silent"
    - id: "time_parameters_not_seconds"
      kind: "control_semantic"
      description: "TEnd/Dt specified in days or years instead of SI seconds; simulation completes near-instantly (1 year = 31536000 s)."
      severity: "silent"
    - id: "gravity_enabled_in_plan_view_2d"
      kind: "control_semantic"
      description: "EnableGravity left true in a plan-view 2D model; DuMux applies gravity in the last (-z) coordinate, producing a spurious hydrostatic gradient in the horizontal plane."
      severity: "silent"
    - id: "zero_porosity_or_vgn_le_1_nan"
      kind: "numerical_instability"
      description: "Zero/near-zero porosity, non-positive permeability, or van Genuchten n<=1 produces NaN in the pressure field; capillary law undefined for n<=1."
      severity: "fatal_or_silent"
    - id: "newton_shift_only_convergence"
      kind: "numerical_instability"
      description: "Default Newton convergence uses relative shift only (EnableResidualCriterion false); the residual may remain large even when the solver reports convergence."
      severity: "silent"
    - id: "adaptive_dt_collapse"
      kind: "numerical_instability"
      description: "Persistent Newton failure drives adaptive dt to microseconds via repeated bisection; the run appears to progress but never reaches TEnd."
      severity: "degraded"
    - id: "linear_solver_divergence_high_K_contrast"
      kind: "numerical_instability"
      description: "Extreme adjacent permeability contrast (cond > 1e10) or poor mesh ill-conditions the linear system; ISTL/AMG diverges or fails setup."
      severity: "fatal"
    - id: "restart_grid_mismatch"
      kind: "initial_condition_semantic"
      description: "Restart from a saved solution onto a grid with different cells/ordering silently corrupts the restart; restart requires the exact same grid."
      severity: "silent"
    - id: "cell_ordering_permeability_mismatch"
      kind: "soil_semantic"
      description: "External per-cell permeability ordering not matching grid traversal (row-major for YaspGrid) silently mis-assigns K to cells."
      severity: "silent"
  validation_limits:
    - "Documented HydroCraft groundwater cases use uniform K (e.g. GLHYMPS median); real heterogeneity reduces accuracy."
    - "Steady-state only for the documented 1p groundwater cases; pumping wells require transient mode with source/sink terms."
    - "TPFA loses consistency on non-K-orthogonal grids (neglects the orthogonal flux component, harmonic transmissibility averaging); MPFA or box scheme needed for strongly anisotropic / non-orthogonal grids."
    - "Daily-or-coarser recharge forcing and uniform-K 1p steady state cannot resolve terrain-, stratigraphy-, or pumping-dominated head fields."
    - "Newton/linear solvers diverge under physically unreasonable permeability or pressure boundary conditions."
  warnings:
    - "Velocity is not written to VTK unless Vtk.AddVelocity = true; default output lacks the Darcy velocity field."
    - "Default VTK precision is Float32; head/pressure differencing for accuracy needs Vtk.Precision = Float64."
    - "Problem.EnableGravity is read without an in-code default at the TPFA Darcy flux site; an unset value relies on a property-level default and can silently drop the gravity term in recharge problems."
    - "RichardsNewtonSolver clamps the wetting-phase pressure update so saturation changes <=20% per iteration for the first 5 Newton iterations; this Richards-specific behavior is not a generic Newton feature."
    - "Adaptive time stepping can mask instability by chopping dt; monitor dt in the run log."
  assumptions:
    - statement: "DuMux models close per-phase / per-component mass balance with momentum given by the multiphase extended Darcy law, not a solved momentum equation, in the porous-medium model family."
      scope: "porousmediumflow models (1p / Richards / 2p / 2p2c / tracer)"
      source: "Koch et al. 2021 (DOI:10.1016/j.camwa.2020.02.012) and DuMux doxygen 'Cell-centered TPFA discretization' / model pages"
      status: "adopted"
    - statement: "All time inputs are SI seconds, spatial extents meters, and pressures absolute Pa; these unit conventions are model-intrinsic and not auto-detected."
      scope: "inputs (time-loop, grid, pressure boundary)"
      source: "DuMux doxygen 'input-and-output-formats' parameter conventions (https://dumux.org/docs/doxygen/master/input-and-output-formats.html); SI-second/meter/absolute-Pa conventions are model-intrinsic to the DuMux parameter tree."
      status: "adopted"
    - statement: "Energy-balance (non-isothermal) and free-flow / poromechanics closures apply only when the corresponding optional model family is active; the default groundwater use case is isothermal single-phase mass balance."
      scope: "boundary.closure"
      source: "DuMux doxygen master index (model families) and porousmediumflow model pages"
      status: "adopted"

