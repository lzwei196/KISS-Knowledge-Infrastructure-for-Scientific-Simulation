  recorded_by: server
  run_context:
    basin: ''
    model: ''
    run_name: ''
  stage: s9_output
  failure_domain: output_format
  symptom:
    description: Multi-layer ParFlow mask.pfb output shows active=1 only in layer 0 (bottom), layers 1-4 show active=0, even
      though all layers are computed
    error_pattern: ''
    detection_method: log_match
  diagnosis:
    root_cause: With variable dz (dzScale nzList) and Box geometry, ParFlow mask output is stored only at the base layer.
      The simulation IS computing all layers (pressure and saturation evolve), but the mask PFB file does not reflect multi-layer
      activity in the expected way.
    explanation: ''
    affected_components: []
  resolution:
    action: 'When analyzing multi-layer PFB output, do NOT use mask to filter per-layer data. Instead check for fill values
      (-3.4e38) to identify inactive cells: valid = data > -1e30'
    files_changed: []
    prevention: ''
  severity: warning
  promoted: false
  promoted_as: ''
