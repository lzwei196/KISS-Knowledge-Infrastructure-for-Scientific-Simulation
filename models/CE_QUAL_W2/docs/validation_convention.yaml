        direction: maximize
        status: supportive
        ceiling_reason: "Fetched CE-QUAL-W2 DO studies rely on profile/seasonal comparison where full statistics are limited."
        cites: [basso2021, hanjaniamin2023]
    validated_when: "UNRESOLVED - compare the layer-matched DO profile/cast, but keep the numeric validation gate undecidable."
    evidence_strength: weak
    confidence: 0.3
    notes: "Low confidence by design: DO benchmark examples exist, but the fetched set does not establish a reusable snapshot band."

  - dag_variable: water surface elevation
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.8, good: 0.7, satisfactory: 0.5}
        pass_band: satisfactory
        band_note: "Moriasi 2015 flow PEC: satisfactory daily/monthly/annual watershed flow has NSE >0.50; Basso 2021 applies NSE to CE-QUAL-W2 water level and reports validation NSE 0.98."
        cites: [moriasi2015, basso2021]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 5.0, good: 10.0, satisfactory: 15.0}
        pass_band: satisfactory
        band_note: "Moriasi 2015 flow PEC uses PBIAS < +/-15% as satisfactory; Basso 2021 reports CE-QUAL-W2 water-level validation PBIAS 0.17."
        cites: [moriasi2015, basso2021]
    secondary_metrics:
      - metric: r2
        direction: maximize
        status: supportive
        ceiling_reason: "Moriasi 2015 recommends R2 with slope/intercept; Basso 2021 reports CE-QUAL-W2 water-level validation R2 0.99."
        cites: [moriasi2015, basso2021]
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "Hanjaniamin 2023 reports water-surface-elevation RMSE 0.63 m after CE-QUAL-W2 calibration, but no general RMSE tier is defined."
        cites: [hanjaniamin2023]
    validated_when: "Water surface elevation is validated when NSE >= 0.5 and |PBIAS| <= 15%, with R2/plots used as supporting checks."
    evidence_strength: strong
    confidence: 0.8
    notes: "Basso 2021 says a 15 cm water-level difference was acceptable and that Moriasi 2015 confirmed very good model efficiency; Moriasi bands are transferred from flow/water-balance conventions."

  - dag_variable: outflow discharge
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.8, good: 0.7, satisfactory: 0.5}
        pass_band: satisfactory
        band_note: "Moriasi 2015 flow PEC: satisfactory watershed-scale flow has NSE >0.50."
        cites: [moriasi2015]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 5.0, good: 10.0, satisfactory: 15.0}
        pass_band: satisfactory
        band_note: "Moriasi 2015 flow PEC: satisfactory flow has PBIAS < +/-15%."
        cites: [moriasi2015]
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "Al Murib 2018 reports CE-QUAL-W2 flow and water-level RMSE/AME examples, but the field convention for discharge pass/fail is the normalized Moriasi flow criteria."
        cites: [almurib2018, moriasi2015]
    validated_when: "Outflow discharge is validated as a flow series when NSE >= 0.5 and |PBIAS| <= 15%."
    evidence_strength: moderate
    confidence: 0.7
    notes: "Because W2 outflow may be prescribed or operator-constrained, this block is best read as a water-balance closure check rather than independent hydrodynamic skill."

  - dag_variable: chlorophyll-a / algal biomass
    obs_shape: point_time_series
    headline_metrics:
      - metric: abs_normalized_mean_error
        direction: minimize
        unit: percent
        bands: {very_good: null, good: null, satisfactory: 13.0}
        pass_band: satisfactory
        band_note: "Bowen 2018 selected acceptable CE-QUAL-W2 algal-growth runs using absolute normalized mean error <13%."
        cites: [bowen2018]
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: null, good: null, satisfactory: 0.46}
        pass_band: satisfactory
        band_note: "Bowen 2018 selected acceptable runs using Nash-Sutcliffe model efficiency >46% for chlorophyll-a."
        cites: [bowen2018]
    secondary_metrics:
      - metric: pbias
        direction: zero_centered
        status: supportive
        ceiling_reason: "The DAG determining metric is pbias; fetched CE-QUAL-W2 chlorophyll calibration papers instead emphasize normalized mean error, NSE, CDF error, and exceedance probability."
        cites: [bowen2018, basso2021]
      - metric: r2
        direction: maximize
        status: supportive
        ceiling_reason: "Benicio 2024 reports that chlorophyll-a R2 values vary widely across CE-QUAL-W2 studies, including low values, so R2 alone is not a pass criterion here."
        cites: [benicio2024]
    validated_when: "Chlorophyll-a/algal biomass is validated when abs normalized mean error <= 13% and NSE >= 0.46, with bloom-threshold/exceedance checks used when available."
    evidence_strength: moderate
    confidence: 0.65
    notes: "This is the one fetched paper with explicit CE-QUAL-W2 chlorophyll performance criteria; broader community tiers were not found in the capped search/cache pass."

  - dag_variable: ice thickness
    obs_shape: point_time_series
    headline_metrics:
