agent_hint: 'On Windows, deploy the official prebuilt WSL/SLF package; do not spend
  time rebuilding its MeteoIO and Snowpack dependency stack. The exact package is
  `https://gitlabext.wsl.ch/api/v4/projects/11/packages/generic/alpine3d/3.2.0/Alpine3d-3.2.0-x86_64.exe`
  with SHA-256 `300c211c79aee15e8d823308c202e09745125e3ff619a52ef82586fdfa7dd13e`.
  This file is an NSIS installer containing the real model and DLLs; it is not itself
  the Alpine3D model executable, and must never be copied or renamed to satisfy `produces`.
  Avoid executing it because its embedded manifest asks for administrator access.
  Extract it entirely inside the setup workspace. Bootstrap full 7-Zip without installing
  it: download official `https://www.7-zip.org/a/7zr.exe` (SHA-256 `ad4c82fadcbdf93c03b4fc440f300509c7d60c5c2f4d183e35d9d70d6957037d`)
  and `https://www.7-zip.org/a/7z2603-x64.exe` (SHA-256 `0859c524b8a63551848f0c246abddcb1d0b7b656b0fbfe879f8d85e61a9e6edd`).
  Use 7zr to extract the full 7-Zip package into a workspace tools directory, then
  use that extracted `7z.exe` plus its adjacent `7z.dll` to extract the Alpine3D NSIS
  package. Every `produces` path below is relative to the install prefix `binaries/Alpine3D/`,
  not the setup-workspace root. Extract the package root directly into `binaries/Alpine3D/source/repo/Source/alpine3d/`,
  preserving its complete `bin`, `doc`, `include`, and licence tree. The final model
  must be exactly `source/repo/Source/alpine3d/bin/alpine3d.exe`, with `libalpine3d.dll`,
  `libsnowpack.dll`, `libmeteoio.dll`, `libgcc_s_seh-1.dll`, `libstdc++-6.dll`, and
  `libwinpthread-1.dll` adjacent. Probe that exact executable with `--help`; valid
  output begins with its Alpine3D 3.20, Libsnowpack 3.60 and MeteoIO 2.90 versions
  and includes `Usage:`. Do not use Python, a wrapper, a launcher, the installer executable,
  or another KI''s binary as the reported artifact. Scientific forcing and project
  data are user inputs and are not required for installation.'
