safety:
  hazards:
    - id: "met_no_missing_value_handler"
      kind: "weather_file_semantic"
      description: ".met has no missing-value handler; any NA/NaN/-9999/blank in a daily row corrupts or crashes the Fortran parser."
      severity: "fatal"
    - id: "met_tmin_gt_tmax"
      kind: "weather_file_semantic"
      description: "Days with Tmin > Tmax are not validated and silently corrupt Penman-Monteith ET and the soil heat balance."
      severity: "silent"
    - id: "brk_inches_vs_mm"
      kind: "weather_file_semantic"
      description: "Breakpoint precipitation is expected in inches; mm supplied without /25.4 inflates infiltration ~25x, saturating the profile with no error."
      severity: "silent"
    - id: "met_epan_par_override_ET"
      kind: "control_semantic"
      description: "Non-zero E-pan (col 7) or PAR (col 9) override the model's internal ET; rough external estimates cause false crop water stress and near-zero yield."
      severity: "silent"
    - id: "latlon_degrees_not_radians"
      kind: "control_semantic"
      description: "Site latitude/longitude must be in radians; degrees produce meaningless solar geometry, day length and ET with no error (|lat| must be <= pi/2)."
      severity: "silent"
    - id: "horizon_count_mismatch"
      kind: "soil_semantic"
      description: "Horizon count must match across RZWQM.dat physical/hydraulic/micropore/macropore sections and RZINIT.dat; a mismatch makes Fortran READ run past the section boundary and crash/corrupt state."
      severity: "fatal"
    - id: "texture_fraction_invalid"
      kind: "soil_semantic"
      description: "Sand+clay must be <=100 and non-negative or texture classification raises a fatal error."
      severity: "fatal"
    - id: "node_count_exceeds_maxnod"
      kind: "soil_semantic"
      description: "Soil horizons thinner than ~5 cm or total depth >3000 cm make the half-way-rule node generator exceed MAXNOD (300 nodes) and fail."
      severity: "fatal"
    - id: "tile_drainage_unit_cm"
      kind: "parser_semantic"
      description: ".ana tile-drainage column is in cm while observations are typically mm; omitting the x10 conversion silently biases drainage ~10x low."
      severity: "silent"
    - id: "tile_drainage_requirements_incomplete"
      kind: "control_semantic"
      description: "Tile drainage needs the drain flag plus perched water table, bottom BC=3 (constant flux), lateral Ksat > 1.0 and drain geometry; enabling the flag alone yields zero drainage."
      severity: "silent"
    - id: "plantsum_missing"
      kind: "parser_semantic"
      description: "The DSSAT-RZWQM2 interface can fail to write PLANTSUM.OUT after a successful maize run (especially with date-triggered harvest); yield should be read from the .ana grain-yield column instead."
      severity: "silent"
    - id: "empty_cultivar_default_fallback"
      kind: "coefficient_runtime_silent_fallback"
      description: "An incomplete/empty cultivar id makes the embedded DSSAT module fall back to the first .CUL entry (often a region-inappropriate variety), giving wildly wrong yield/phenology."
      severity: "fatal_or_silent"
  validation_limits:
    - "Requires site-specific calibration of soil hydraulic, DSSAT cultivar, nutrient and pesticide parameters before predictive use."
    - "1-D point/field-scale model with only pseudo 2-D drainage; not applicable to channel/watershed surface routing or fully distributed flow."
    - "Daily overall time step (sub-hourly only for infiltration/chemical movement) limits representation of fast sub-daily hydrologic events."
    - "Over-winter / frozen-soil and snow processes require the RZ-SHAW routines to be active to be applicable."
    - "Weak-acid pesticide predictions are sensitive to the Freundlich adsorption constant, soil pH and dissociation coefficient and should be treated as semi-quantitative."
  warnings:
    - "A 1-3 year warm-up is recommended to equilibrate initial soil water, temperature and nutrient pools before the analysis period."
    - "Calibrate the water balance (soil hydraulic properties) before crop and nutrient parameters; hydraulic mis-specification propagates into N and yield errors."
    - "Tile drainage being off when expected is usually a configuration issue (missing constant-flux BC or lateral Ksat), not a model failure."
  assumptions:
    - statement: "The model is a 1-D vertical soil column with only pseudo 2-D lateral tile drainage; no multi-dimensional flow."
      scope: "spatial geometry / flow dimensionality"
      source: "WRP-LLC and USDA-ARS RZWQM model description; Ma et al. (2012) Trans. ASABE 55(4):1425-1446"
      status: "adopted"
    - statement: "Mass balance closes for water, C, N, P and pesticide over the profile; a full diurnal surface energy balance is realized only when the RZ-SHAW snow/heat/freezing path is active."
      scope: "conservation / closure"
      source: "RZWQM2 process documentation; RZ-SHAW over-winter coupling reference"
      status: "adopted"
    - statement: "Low-salinity neutral soil solutions are assigned activity coefficients of 1 in the soil-chemistry equilibrium calculations."
      scope: "soil chemistry closure"
      source: "RZWQM pesticide/soil-chemistry module documentation (Wauchope-style testing, PubMed 15025236)"
      status: "adopted"
    - statement: "Crop growth, water and N uptake are computed by the embedded DSSAT CERES/CROPGRO modules coupled to RZWQM2 soil water, temperature and nitrate state rather than by an independent RZWQM2 crop model."
      scope: "crop module coupling"
      source: "RZWQM2-DSSAT integration (Ma et al. 2012); dssatdrv crop-module driver in the compiled binary"
      status: "adopted"

medium_evidence:
  - var: "no3_leaching"
    source: "dag.yaml"
    quote: "Tile drainage and water-table fluctuation (pseudo 2-D lateral drainage)"
    note: "scope_in declares the tile-drainage medium; the output is nitrate-N loss through root-zone leachate and tile-drainage water."
  - var: "pesticide_loss"
    source: "dag.yaml"
    quote: "Pesticide equilibrium/Freundlich adsorption, degradation, dissociation (weak acids), runoff transfer and subsurface leaching."
    note: "processes declare pesticide transfer in surface runoff and subsurface leaching, so the output description names runoff water and subsurface leachate."
