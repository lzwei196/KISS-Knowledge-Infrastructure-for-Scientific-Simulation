safety:
  hazards:
    - id: "soil_Dz_units_diverge"
      kind: "soil_semantic"
      description: "Soil layer thickness Dz in meters/cm instead of mm collapses sub-mm layers and diverges the Richards solver within the first time steps."
      severity: "fatal"
    - id: "vwc_ordering_violation"
      kind: "soil_semantic"
      description: "Van Genuchten residual >= saturated water content (vwc_r >= vwc_s) leaves the retention curve undefined; immediate soil crash."
      severity: "fatal"
    - id: "van_genuchten_n_below_one"
      kind: "soil_semantic"
      description: "Van Genuchten n <= 1.0 makes m = 1 - 1/n non-positive, causing a floating-point exception in pedotransfer."
      severity: "fatal"
    - id: "inpts_tab_separator_parse_fail"
      kind: "parser_semantic"
      description: "geotop.inpts requires TAB separators between key, '=', and value (dt_009); tabs replaced by spaces cause the get_all_input keyword parser to fail on the first keyword."
      severity: "fatal"
    - id: "ksat_units_silent_infiltration"
      kind: "soil_semantic"
      description: "Hydraulic conductivity in cm/day instead of m/s (8.64e6x) silently produces instant drainage or permanent saturation."
      severity: "silent"
    - id: "vg_alpha_units_retention"
      kind: "soil_semantic"
      description: "Van Genuchten alpha in 1/cm instead of 1/mm (10x) silently distorts the soil retention curve."
      severity: "silent"
    - id: "precip_rate_vs_per_step"
      kind: "weather_file_semantic"
      description: "Precipitation supplied as a rate (mm/hr, m/s, mm/day) instead of mm accumulated per model time step scales total precipitation by ~1000x."
      severity: "silent"
    - id: "relhum_fraction_vs_percent"
      kind: "weather_file_semantic"
      description: "Relative humidity as fraction (0-1) instead of percent (0-100) is read as ~0.x% humidity, collapsing ET and inflating sensible heat."
      severity: "silent"
    - id: "date_format_misparse"
      kind: "weather_file_semantic"
      description: "Forcing dates in MM/DD/YYYY instead of European DD/MM/YYYY silently shift seasonal patterns in time."
      severity: "silent"
    - id: "nodata_not_minus_9999"
      kind: "weather_file_semantic"
      description: "Missing values encoded as NaN/-999/blank instead of exactly -9999 are read as literal values (often 0), producing flat forcing curves."
      severity: "silent"
    - id: "accumulated_radiation_not_deaccumulated"
      kind: "weather_file_semantic"
      description: "Accumulated radiation (J/m2, e.g. ERA5) not converted to instantaneous W/m2 yields shortwave >2000 W/m2 or zero."
      severity: "silent"
    - id: "vegheight_units_bare_ground"
      kind: "coefficient_runtime_silent_fallback"
      description: "VegHeight in meters instead of mm treats a tall canopy as effectively bare ground, removing interception and altering turbulence."
      severity: "silent"
    - id: "missing_horizon_overpredicts_solar"
      kind: "control_semantic"
      description: "With FlagSkyViewFactor=1 but the horizon file missing, horizon angles silently default to 0, over-predicting direct-beam radiation."
      severity: "silent"
    - id: "lwin_cloudtrans_double_param"
      kind: "control_semantic"
      description: "Supplying both LWin and CloudTrans (neither -9999) under LWinParameterization>0 double-parameterizes longwave, degrading energy-balance closure."
      severity: "degraded"
    - id: "slope_aspect_units_distributed"
      kind: "soil_semantic"
      description: "Slope map in percent (not degrees) or aspect map in radians (not degrees from N) distorts runoff response and radiation/shadow geometry in distributed mode."
      severity: "degraded"
    - id: "topo_grid_mismatch"
      kind: "control_semantic"
      description: "ESRI ASCII input maps with mismatched ncols/nrows/cellsize/origin cause out-of-bounds indexing (segfault) on startup in distributed mode."
      severity: "fatal"
    - id: "energy_water_nonconvergence_collapse"
      kind: "numerical_instability"
      description: "Extreme forcing (e.g. Kelvin instead of Celsius) drives energy-balance non-convergence; the adaptive solver hangs or shrinks Mean_Time_Step far below the nominal step."
      severity: "fatal_or_silent"
  validation_limits:
    - "Designed and validated for mountain catchments and permafrost / seasonally-frozen soils at high altitude and latitude; uncalibrated outside that regime."
    - "v3.0 is declared not fully stable when run with the full 3D water and energy budget; use with caution for fully-coupled distributed simulations."
    - "v3.0 lacks the MeteoIO forcing-integration library present in v2.1.1."
    - "Sub-hourly default step (900 s); coarser vertical/temporal discretization injects >1 degC ground-temperature error and is structurally inadequate for permafrost."
  warnings:
    - "Mean_Time_Step persistently below the configured nominal step signals the adaptive solver struggling with non-physical parameters or forcing."
    - "Energy solve must precede the water solve each sub-step; soil ice content feeds back into hydraulic conductivity within the step, so thermal and water states are not independently interpretable."
    - "Blowing-snow redistribution couples neighbouring pixels' snow state, so single-pixel SWE in distributed mode is not a closed column budget when BlowingSnow=1."
    - "Cumulative basin mass-balance error should stay small (~<1 mm); a growing error indicates Richards-solver trouble."
  assumptions:
    - statement: "Point mode (PointSim=1) is a 1-D vertical soil column with topography set directly in geotop.inpts; distributed mode (PointSim=0) is the full 3D planar+vertical grid."
      scope: "model geometry"
      source: "Endrizzi et al. 2014 (GMD 7, 2831-2857) and GEOtop user manual Ch. 3"
      status: "adopted"
    - statement: "The model closes a coupled mass (water/snow/glacier/channel) and energy (radiative+turbulent+heat-diffusion) budget, with explicit non-linear water-energy coupling during soil phase change."
      scope: "conservation / closure"
      source: "Endrizzi et al. 2014 abstract; geotopmodel.github.io key features"
      status: "adopted"
    - statement: "Default air- and dew-point lapse rates (6.5 and 2.5 C/km) are applied silently in meteo distribution when no LapseRateFile is supplied."
      scope: "forcing distribution"
      source: "GEOtop source constants.h GTConst defaults and meteodistr module behavior"
      status: "adopted"
    - statement: "Backward Euler (fully implicit) is the heat-equation time-integration scheme; the Crank-Nicholson option is not user-exposed."
      scope: "numerical method"
      source: "GEOtop source constants.h (KNe=0) and energy.balance module"
      status: "adopted"
