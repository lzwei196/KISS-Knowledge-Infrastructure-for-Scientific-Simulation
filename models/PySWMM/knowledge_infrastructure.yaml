# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: PySWMM
  language: python
  implementation:
    id: pyswmm
    version: 2.1.0
    provenance: Python; PySWMM (OpenWaterAnalytics / Bryant E. McDonnell) binds the compiled EPA SWMM5
      C engine through swmm.toolkit.solver.
  scientific_reference_version: EPA SWMM5 (Storm Water Management Model 5.1.14–5.2.4) via the OpenWaterAnalytics
    swmm-toolkit
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/PySWMM/venv/bin/python
    type: work_dir
pipeline:
  stages:
  - s0_configuration
  - s2_soil_infiltration
  - s4_meteorological_forcing
  - s6_model_execution
  - s7_output_parsing
tools:
  count: 4
  files:
  - tools/convert_forcing_to_inp.py
  - tools/convert_soil_to_inp.py
  - tools/parse_swmm_output.py
  - tools/run_pyswmm.py
inputs:
  forcing:
  - name: Rainfall intensity
    unit: in/hr (US) | mm/hr (SI)
  - name: Evaporation rate
    unit: in/day (US) | mm/day (SI)
  parameters:
  - name: Subcatchment area
    unit: acres (US) | hectares (SI)
  - name: Percent impervious
    unit: '%'
  - name: Characteristic width
    unit: ft (US) | m (SI)
  - name: Subcatchment slope
    unit: percent
  - name: Surface roughness (Manning n, impervious / pervious)
    unit: dimensionless
  - name: Depression storage (impervious / pervious)
    unit: in (US) | mm (SI)
  - name: Impervious runoff routing fraction (PctZero)
    unit: '%'
  - name: Infiltration parameters
    unit: Horton MaxRate/MinRate in/hr or mm/hr, Decay hr⁻¹, DryTime d; Green-Ampt Suction/Conductivity/InitDef;
      SCS CN
  - name: Conduit Manning's n
    unit: dimensionless
  - name: Conduit geometry (length, offsets, cross-section)
    unit: ft / m (length, Geom1-4); dimensionless shape
  - name: Control-structure discharge coefficients
    unit: dimensionless (embeds unit system; rectangular weir ~3.33 US / ~1.84 SI)
  - name: LID layer parameters
    unit: various (layer thickness, porosity, field capacity, conductivity, drain coefficient/exponent,
      etc.)
  initial_conditions:
  - name: Initial node depth
    unit: ft (US) | m (SI)
  - name: Initial link flow
    unit: flow units (CFS/CMS …)
  - name: Hotstart state
    unit: binary
  boundary_conditions:
  - name: Flow units
    unit: enum
  - name: Infiltration method
    unit: enum
  - name: Flow routing method
    unit: enum
  - name: Routing / reporting time steps
    unit: s (routing) / report step
  - name: Outfall boundary condition
    unit: ft / m or stage type
  - name: External / dry-weather inflows
    unit: flow units
  - name: Real-time control logic
    unit: rules / target_setting 0–1
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - runoff_rate
  - infiltration_loss
  - node_invert_depth
  - node_total_inflow
  - node_flooding
  - link_flow_rate
  - link_flow_depth
  - total_outflow
  - runoff_error
  - flow_routing_error
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=1.000, R=1.000, 2 scorecard(s)'
  metrics:
    best_nse: 1.0
    best_r: 1.0
summary:
  total_tools: 4
  total_stage_docs: 5
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
