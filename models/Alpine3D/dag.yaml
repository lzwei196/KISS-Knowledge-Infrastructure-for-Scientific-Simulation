    keenan2023_alpine3d_winddrift:
      short_citation: "Keenan et al. 2023"
      doi: "10.5194/gmd-16-3203-2023"
      note: "WindNinja-coupled drift module: wind redistribution alters accumulation ~23% of annual; saltation fetch-length parameter strongly controls accumulation variability."

safety:
  hazards:
    - {id: "weather_TA_celsius_not_kelvin", kind: "weather_file_semantic", description: "TA/TSS/TSG authored in Celsius are read as ~near-0 K, below the T_CRAZY_MIN / min_max (240-320 K) filter, flagged nodata causing crash or absolute-zero surface temperature.", severity: "silent", triplet_id: "dt_001"}
    - {id: "weather_RH_percent_not_fraction", kind: "weather_file_semantic", description: "RH supplied as percent (0-100) is clipped to 1.0, producing permanent saturation and snowfall every timestep.", severity: "silent", triplet_id: "dt_002"}
    - {id: "weather_VW_kmh_not_ms", kind: "weather_file_semantic", description: "Wind speed in km/h read as m/s inflates turbulent fluxes and snow erosion ~3.6x.", severity: "silent", triplet_id: "dt_003"}
    - {id: "weather_DW_radians_not_degrees", kind: "weather_file_semantic", description: "Wind direction in radians (0-6.28) makes wind appear almost always from North, defeating LISTON_WIND interpolation.", severity: "silent", triplet_id: "dt_004"}
    - {id: "weather_PSUM_meters_not_mm", kind: "weather_file_semantic", description: "Precipitation in meters (e.g. ERA5) read as mm gives 1000x precip, tens of metres SWE and element-count crash.", severity: "fatal_or_silent", triplet_id: "dt_005"}
    - {id: "weather_P_hPa_not_Pa", kind: "weather_file_semantic", description: "Pressure in hPa/mbar read as Pa makes air density ~100x too low, underestimating heat fluxes.", severity: "silent", triplet_id: "dt_006"}
    - {id: "weather_ISWR_MJ_not_W", kind: "weather_file_semantic", description: "Shortwave in MJ/m2/day read as W/m2 delivers ~9% of solar forcing; snow never melts in spring.", severity: "silent", triplet_id: "dt_007"}
    - {id: "weather_ILWR_MJ_not_W", kind: "weather_file_semantic", description: "Longwave in MJ/m2/day read as W/m2 makes the atmosphere LW-transparent; unrealistic nighttime cooling.", severity: "silent", triplet_id: "dt_008"}
    - {id: "weather_synthesized_ISWR_ILWR_in_smet", kind: "weather_file_semantic", description: "Upstream-synthesized ISWR/ILWR placed in SMET replaces MeteoIO's physically consistent generators; clear-sky-only ILWR is too low, lowering the surface energy budget and collapsing SWE.", severity: "silent", triplet_id: "dt_022"}
    - {id: "soil_HS_cm_not_m", kind: "soil_semantic", description: "Snow height in cm read as m gives 100x snow height, catastrophic under ENFORCE_MEASURED_SNOW_HEIGHTS=TRUE.", severity: "silent", triplet_id: "dt_009"}
    - {id: "soil_layer_thick_not_meters", kind: "soil_semantic", description: ".sno Layer_Thick not in meters causes finite-element count explosion or trips the MINIMUM_L_ELEMENT check.", severity: "fatal_or_silent", triplet_id: "dt_010"}
    - {id: "soil_grain_radius_not_mm", kind: "soil_semantic", description: ".sno grain radius rg not in mm (e.g. um) yields dark-snow albedo and wrong metamorphism.", severity: "silent", triplet_id: "dt_011"}
    - {id: "soil_density_gcm3_not_kgm3", kind: "soil_semantic", description: ".sno soil density Rho_S in g/cm3 read as kg/m3 leaves soil with no thermal mass — no permafrost, no seasonal lag.", severity: "silent", triplet_id: "dt_012"}
    - {id: "soil_volume_fractions_not_unity", kind: "soil_semantic", description: ".sno volume fractions (Vol_Frac_I+W+V+S) not summing to 1.0 break per-layer mass conservation.", severity: "silent"}
    - {id: "ic_geo_heat_mWm2_not_Wm2", kind: "initial_condition_semantic", description: "GEO_HEAT in mW/m2 read as W/m2 gives 1000x basal flux; snow melts from below even in winter.", severity: "silent", triplet_id: "dt_013"}
    - {id: "control_alpine3d_flag_false", kind: "control_semantic", description: "ALPINE3D=FALSE in [SnowpackAdvanced] runs SNOWPACK in point mode per cell, ignoring distributed forcing and terrain radiation.", severity: "silent", triplet_id: "dt_016"}
    - {id: "control_roughness_length_mm_not_m", kind: "control_semantic", description: "ROUGHNESS_LENGTH in mm read as m is 1000x too large, inflating Monin-Obukhov exchange and turbulent flux/sublimation.", severity: "silent", triplet_id: "dt_014"}
    - {id: "control_psum_accumulation_mismatch", kind: "control_semantic", description: "PSUM accumulation period not equal to step length x 60 makes the ACCUMULATE resampler double- or under-count precipitation.", severity: "degraded", triplet_id: "dt_015"}
    - {id: "control_coordsys_mismatch", kind: "control_semantic", description: "COORDSYS not matching the DEM CRS (or COORDPARAM using N/S notation instead of an MGRS band letter) places stations at wrong cells/elevations or makes MeteoIO reject the SMET.", severity: "fatal_or_silent", triplets: ["dt_018", "dt_019"]}
    - {id: "grid_dem_landuse_header_mismatch", kind: "soil_semantic", description: "DEM and land-use ARC ASCII grids with different headers (ncols/nrows/corners/cellsize) cause out-of-bounds access and a segfault at grid initialization.", severity: "fatal", triplet_id: "dt_017"}
    - {id: "meteo_single_station_nan_gap", kind: "weather_file_semantic", description: "With a single station, any NaN forcing value has no spatial-interpolation fallback and aborts the run mid-simulation ('Not enough input meteo data').", severity: "fatal", triplet_id: "dt_021"}
  validation_limits:
    - "Core 1-D no-lateral-flux assumption: no lateral subsurface/overland coupling between columns; explicitly noted by the developers as 'too strong' an assumption in steep, laterally connected terrain."
    - "Produces runoff generation only; no native channel/streamflow routing — gauged-streamflow comparison requires an external routing model (e.g. PREVAH)."
    - "Water bodies are excluded from the SNOWPACK computation."
    - "Maritime / energy-limited snowpacks (high cloud, frequent melt) are harder than continental sites, partly because longwave generators and undercatch corrections are tuned for those regimes."
    - "Hourly outer cadence (dt_main=3600 s) limits resolution of sub-hourly surface-energy-balance transients regardless of the inner sub-step length."
  warnings:
    - "On exposed glacier pixels (SW_MODE=BOTH) the per-pixel albedo is overridden to a fixed glacier (0.3) / blue-ice (0.6) value and, when TA exceeds 5 degC, the atmospheric-stability scheme is forced stable — overriding the configured radiation/stability for those cells."
    - "Sub-threshold precipitation is held in an internal store grid and only released when enough mass forms a finite-element layer, so precipitation is conserved over the accumulation window, not strictly per timestep."
    - "Snow surface height can optionally be fed back into the DEM used for meteo interpolation (ADD_HS_TO_DEM_FOR_METEO), coupling snow state into forcing interpolation; off by default and easy to overlook."
    - "Solid-precipitation gauge undercatch (NRCS SNOTEL underreporting 20-60% in wind) produces strongly negative SWE bias unless an undercatch correction (e.g. undercatch_wmo Hellmannsh) is enabled."
    - "The Data Assimilation module exists in source but is inert (the compute call is commented out in the current driver loop)."
  assumptions:
    - statement: "Each pixel is an independent 1-D vertical snow/soil/canopy column; inter-column coupling occurs only via wind redistribution and radiative terrain exchange."
      scope: "model geometry"
      source: "Alpine3D model_principles documentation (https://alpine3d.slf.ch/doc-release/html/model_principles.html)"
      status: "adopted"
    - statement: "Mass and energy are closed per column per accumulation window (water, snow, soil); there is no closed lateral mass/energy budget across the domain."
      scope: "conservation closure"
      source: "Alpine3D model_principles documentation and SNOWPACK column physics"
      status: "adopted"
    - statement: "The outer model cadence is fixed at dt_main = 3600 s; CALCULATION_STEP_LENGTH sets only the SNOWPACK inner sub-step count and the per-sub-step PSUM division."
      scope: "temporal discretization"
      source: "Alpine3D AlpineMain.h (dt_main) and SnowpackInterfaceWorker sub-stepping"
      status: "adopted"
    - statement: "ALPINE3D=TRUE is treated as mandatory for valid distributed results; the dag describes the distributed-mode binding only."
      scope: "operating mode"
      source: "Alpine3D SnowpackAdvanced configuration and SnowpackInterface distributed-mode behavior"
      status: "adopted"
