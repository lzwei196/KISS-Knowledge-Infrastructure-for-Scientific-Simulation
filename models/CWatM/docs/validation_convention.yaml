validation:

  # ===================== DISCHARGE / point time series (well grounded) =====================
  - canonical_quantity: discharge
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.75, good: 0.70, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "Moriasi monthly tiers; daily NSE structurally lower than monthly (dag caveat) so relax for daily gauges."
        cites: [arnold2012, panarctic2020, bouregreg2011]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10, good: 15, satisfactory: 25}
        pass_band: satisfactory
        band_note: "Streamflow PBIAS tiers; Pan-Arctic study applies |PBIAS|<=25% as the monthly-discharge satisfactory bound."
        cites: [panarctic2020, bouregreg2011]
    secondary_metrics:
      - metric: kge
        direction: maximize
        status: supportive
        ceiling_reason: >-
          KGE' (modified Kling-Gupta) is CWatM's PRIMARY calibration/evaluation objective (Burek et al.
          2020). Its uncalibrated global run reports 243/1366 GRDC stations at KGE>=0.5. Knoben et al.
          2019 warns the mean-flow benchmark for KGE is KGE=1-sqrt(2)~=-0.41 (NOT 0), so a KGE 0.5
          marker is a reporting bin, not a Moriasi-equivalent formal tier — kept supportive, not headline.
        cites: [burek2020, knoben2019]
      - metric: r
        direction: maximize
        status: supportive
        ceiling_reason: "In CWatM's 1366-station global evaluation, R ranked better than KGE or NSE (858 stations R>=0.5 vs 243 KGE, 108 NSE); correlation over-credits timing without penalising bias, so it is co-reported, not decisive."
        cites: [burek2020]
    validated_when: "NSE >= 0.50 (Moriasi monthly satisfactory; relax for daily) AND |PBIAS| <= 25% (streamflow satisfactory). KGE'/R co-reported (CWatM primary objective is KGE')."
    evidence_strength: strong
    confidence: 0.8
    notes: >-
      Well grounded. Arnold et al. 2012: "Moriasi et al. (2007) proposed that NSE values should exceed
      0.5 ... judged satisfactory ... 'very good' meant NSE (and r2) >0.75". Pan-Arctic 2020: "Moriasi
      et al. (2015) ... NSE >= 0.70 and PBIAS < +-10 [good] ... NSE > 0.55 and +-10 <= PBIAS <= +-15
      [satisfactory]" and applies "NSE monthly is > 0.5 and PBIAS is within +-25%". Bouregreg 2011
      reproduces Moriasi 'very good': "0 to 0.5 for RSR, 0.75 to 1 for NSE and -10 to 10 for PBIAS".
      cwatmbench2025 is CWatM's own multi-basin (Atlantic Canada) evaluation vs VIC. Exclude spinup;
      filter near-zero negative routing discharge; verify gauge->grid upstream-area mapping on coarse
      grids. NOTE: dag also declares evapotranspiration and SWE/snow, but model_obs_map has NO ET or
      snow obs binding (has_obs_binding: false) so no gradeable convention is emitted for them here.

  # ===================== DISCHARGE / regional-aggregate time series (transferred band) =====================
  - canonical_quantity: discharge
    obs_shape: regional_aggregate_time_series
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10, good: 15, satisfactory: 25}
        pass_band: satisfactory
        band_note: "Basin-aggregate / long-term-mean discharge magnitude when point gauges are unavailable."
        cites: [panarctic2020, bouregreg2011]
    secondary_metrics:
      - metric: nse
        direction: maximize
        status: supportive
        ceiling_reason: "Aggregate/long-term-mean comparison targets water-balance magnitude (PBIAS); temporal efficiency is co-reported where a monthly aggregate series exists."
        cites: [panarctic2020]
    validated_when: "|PBIAS| <= 25% on the basin-aggregate or long-term-mean discharge (Pan-Arctic satisfactory bound)."
    evidence_strength: moderate
    confidence: 0.6
    notes: >-
      Same PBIAS streamflow tiers as the point block, applied to basin-aggregate / long-term-mean flow
      per Pan-Arctic 2020 ("for long-term mean discharge ... PBIAS within +-25%"). Used when point
      gauges are unavailable; NSE not the headline at aggregate scale.

  # ===================== TOTAL WATER STORAGE / GRACE spatial time series (thin literature) =====================
  - canonical_quantity: tws
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a numeric model-vs-GRACE TWS-anomaly correlation threshold; field compares seasonal anomaly patterns qualitatively. Band null -> gate cannot auto-validate here."
        cites: []
    secondary_metrics:
      - metric: pbias
        direction: zero_centered
        status: structurally_limited
        ceiling_reason: >-
          Scanlon et al. 2018 (PNAS): across 186 river basins "Medians of modeled basin water storage
          trends greatly underestimate GRACE-derived large decreasing ... and increasing ... trends"
          (summed model trends -450 to -12 km3/yr vs GRACE +71 to +82 km3/yr). Decadal TWS trend/
          amplitude magnitude is therefore a documented STRUCTURAL/data ceiling for global hydrological
          models -> a low trend-magnitude score is acquire_data/data-ceiling, NOT fix_ki.
        cites: [scanlon2018]
    validated_when: "UNRESOLVED numerically — seasonal TWS-anomaly correlation (r) is the reportable skill but has no cited numeric tier; decadal trend magnitude is structurally underestimated (Scanlon 2018). Treat as data-gap until a model-vs-GRACE r/NSE benchmark is fetched."
    evidence_strength: weak
    confidence: 0.35
    notes: >-
      model_obs_map binds total_water_storage to GRACE tws_anomaly_cm / lwe_thickness_cm (r). Compare
      ANOMALIES not absolute storage; GRACE is a coarse (~3 degree/mascon) anomaly with resolution
      mismatch (gracemascon2016). No fetched paper sets an r threshold, so the band is null and MUST NOT
      loosen the gate. Scanlon 2018 grounds a real structural ceiling on trend magnitude only.

  # ===================== GROUNDWATER STORAGE / point time series (thin literature) =====================
  - canonical_quantity: storage
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched paper gives a groundwater-level/storage NSE tier for a global linear-reservoir GW store; band null -> not auto-validatable."
        cites: []
      - metric: r
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "model_obs_map determining_metric for storGroundwater is r (water-table fluctuation match); no cited numeric threshold in the fetched set."
        cites: []
    secondary_metrics:
      - metric: r
        direction: maximize
        status: supportive
        ceiling_reason: >-
          CWatM groundwater is a lumped linear-reservoir store; absolute water-table depth is resolution-
          sensitive so water-table FLUCTUATION correlation reproduces better than absolute storage (dag
          caveat, Guillaumot 2022 — not fetched, hence supportive not structurally_limited). gwreview2021
          documents that global groundwater modelling still lacks standardised head-validation benchmarks
          and is data-limited, so no numeric tier is available to cite.
        cites: [gwreview2021]
    validated_when: "UNRESOLVED numerically — compare water-table fluctuations (r) not absolute storage; no cited NSE/r threshold for a global linear-reservoir groundwater store. Data-gap until a head-validation benchmark is fetched."
    evidence_strength: weak
    confidence: 0.3
    notes: >-
      storGroundwater bound to groundwater_level_m. Absolute lumped storage is not directly comparable to
      point water-table depth; fluctuation correlation is the honest target but has no fetched numeric
      band. Null bands MUST NOT loosen the gate. The MODFLOW-coupled CWatM variant (deferred, fetch
      failed) is the route to a resolved head benchmark.

