safety:
  hazards:
    - id: "permeability_darcy_vs_m2"
      kind: "soil_semantic"
      description: "Permeability entered in Darcy instead of m^2 (~1e12 factor); domain drains instantly with unrealistic Darcy velocities (dt_001)."
      severity: "fatal_or_silent"
    - id: "hydraulic_conductivity_vs_permeability"
      kind: "soil_semantic"
      description: "Hydraulic conductivity K (m/s) supplied where intrinsic permeability k (m^2) is expected (~86400x or larger); flow far too fast. PFLOTRAN never uses K (dt_004)."
      severity: "silent"
    - id: "recharge_flux_units"
      kind: "weather_file_semantic"
      description: "Recharge entered in mm/yr or mm/day instead of m/s (~3e10 factor); domain floods to full saturation on the first timestep (dt_002)."
      severity: "fatal_or_silent"
    - id: "pressure_atm_vs_pa"
      kind: "control_semantic"
      description: "Pressure boundary entered in atm/bar instead of Pa (1e5 factor low); flat heads, no flow despite an expected gradient (dt_003)."
      severity: "silent"
    - id: "porosity_percent_vs_fraction"
      kind: "soil_semantic"
      description: "Porosity entered as percent (>1.0) rather than a fraction; produces negative saturation and an immediate solver crash (dt_005)."
      severity: "fatal"
    - id: "vg_alpha_per_cm_vs_per_pa"
      kind: "soil_semantic"
      description: "van Genuchten alpha entered in 1/cm instead of 1/Pa (~9804x); no capillary retention, step-function saturation profile, instant drainage (dt_006)."
      severity: "silent"
    - id: "diffusion_coeff_units"
      kind: "soil_semantic"
      description: "Diffusion coefficient in cm^2/s instead of m^2/s (1e4 factor); solute plume spreads ~100x too fast (dt_007)."
      severity: "silent"
    - id: "temperature_kelvin_vs_celsius"
      kind: "control_semantic"
      description: "Temperature entered in Kelvin instead of Celsius (offset 273.15); wrong density/buoyancy, water treated as supercritical (dt_008)."
      severity: "silent"
    - id: "concentration_mgL_vs_molL"
      kind: "control_semantic"
      description: "CONSTRAINT aqueous concentrations in mg/L instead of mol/L; reaction rates orders of magnitude off (dt_009)."
      severity: "silent"
    - id: "time_missing_unit_keyword"
      kind: "control_semantic"
      description: "Time values lack a unit keyword; 'FINAL_TIME 10.d0' is read as 10 s, not 10 y, so the run ends almost immediately (dt_010)."
      severity: "fatal_or_silent"
    - id: "smooth_in_saturation_function"
      kind: "control_semantic"
      description: "SMOOTH placed in SATURATION_FUNCTION (VAN_GENUCHTEN) rather than PERMEABILITY_FUNCTION (MUALEM_VG_LIQ); fatal 'SF Smoothing not supported' at startup (dt_019)."
      severity: "fatal"
    - id: "region_material_name_mismatch"
      kind: "control_semantic"
      description: "Case-sensitive REGION / MATERIAL / CHARACTERISTIC_CURVES name not found by a referencing card; 'region/material not found' at startup (dt_011/dt_012)."
      severity: "fatal"
    - id: "input_deck_block_nesting"
      kind: "parser_semantic"
      description: "Input-deck block nesting error — missing END or '/', mismatched delimiters, or missing SUBSURFACE...END_SUBSURFACE wrapper; the strict Fortran keyword parser fails with 'ERROR: reading input file' (often no line number) at startup (dt_013)."
      severity: "fatal"
    - id: "strata_incomplete_coverage"
      kind: "soil_semantic"
      description: "STRATA does not cover all cells; uncovered cells get defaults, yielding physically meaningless results or a crash (dt_018)."
      severity: "degraded"
    - id: "newton_divergence_fnorm_nan"
      kind: "numerical_instability"
      description: "SNES_DIVERGED_FNORM_NAN / Newton divergence from bad units, inconsistent IC/BC, too-large initial timestep, or sharp permeability contrast (dt_014)."
      severity: "fatal"
    - id: "vadose_column_residual_saturation_singularity"
      kind: "numerical_instability"
      description: "1D vadose column reaching near-residual saturation during a dry spell makes vG dP/dS -> infinity and the Newton Jacobian near-singular; SNES_DIVERGED_MAX_IT crash. SMOOTH smooths only kr, not the saturation singularity (dt_020)."
      severity: "fatal"
    - id: "et_sink_sign_or_units"
      kind: "control_semantic"
      description: "ET SOURCE_SINK must be a NEGATIVE rate for extraction; a positive value injects water, and SCALED_VOLUMETRIC_RATE VOLUME units mismatched to the cell cross-section cause a 'rate too large' crash (dt_021)."
      severity: "fatal_or_silent"
    - id: "atmospheric_pressure_not_subtracted"
      kind: "parser_semantic"
      description: "Converting output pressure (Pa) to head without subtracting P_atm leaves a systematic ~+10.33 m head offset (dt_017)."
      severity: "silent"
    - id: "saturation_array_shape_not_flattened"
      kind: "parser_semantic"
      description: "For an NXYZ 1 1 N grid, Liquid_Saturation has shape (1,1,N); indexing without flattening returns a sub-array (constant SWC or TypeError). Cell order is bottom (0) to top (N-1) (dt_022)."
      severity: "silent"
  validation_limits:
    - "1D vertical Richards columns have no surface-runoff module: all precipitation is applied as top-boundary infiltration, giving a structural +30-60% wet bias at subtropical-monsoon forest sites where Hortonian/saturation-excess runoff is significant. Prefer alpine/semi-arid/temperate sites for 1D columns."
    - "Daily-or-coarser forcing in a 1D column cannot resolve sub-daily infiltration/runoff partitioning during convective events."
    - "Only an elastic geomechanical model is implemented; inelastic/plastic deformation is out of scope."
    - "Multiple-interacting-continuum (fractured-media) support is under development and not a validated production capability."
    - "HDF5 output uses 32-bit integers, effectively capping problem size at a few billion degrees of freedom."
  warnings:
    - "PFLOTRAN solves intrinsic permeability (m^2) and liquid pressure (Pa) natively — never hydraulic conductivity or head; nearly every high-severity hazard above is a units confusion against these native bases."
    - "Water mass-balance error must remain < ~1% for a run to be trustworthy; a growing balance error signals an ill-posed BC/IC or solver problem even when the simulation completes."
    - "Repeated timestep cuts usually indicate strong nonlinearity (sharp permeability contrast, near-residual saturation, or bad units) rather than a too-large max timestep alone."
    - "vG residual saturation must be < porosity and vG n > 1 (m = 1 - 1/n); violating these constraints produces unphysical retention curves."
  assumptions:
    - statement: "RICHARDS mode is single-phase, variably saturated and isothermal; there is no surface energy budget in this mode (energy closure appears only in TH/GENERAL)."
      scope: "RICHARDS-mode flow simulations (the primary subsurface-recharge use case)"
      source: "PFLOTRAN Theory Guide RICHARDS and TH mode pages (documentation.pflotran.org)"
      status: "adopted"
    - statement: "The native solved variable is absolute liquid pressure in Pa and the native conductivity basis is intrinsic permeability in m^2; head and hydraulic conductivity are post-processed/derived, not inputs."
      scope: "all flow modes"
      source: "PFLOTRAN Theory Guide (Darcy flux q=-(k*kr/mu) grad(P-rho g z)) and convention notes in PFLOTRAN docs"
      status: "adopted"
    - statement: "Capillary pressure maps to saturation via the van Genuchten saturation function and saturation maps to relative permeability via the Mualem function (m = 1 - 1/n)."
      scope: "variably-saturated flow with VAN_GENUCHTEN / MUALEM_VG_LIQ characteristic curves"
      source: "CHARACTERISTIC_CURVES module and Carsel & Parrish (1988) parameterization referenced in PFLOTRAN docs"
      status: "adopted"
    - statement: "Flow-to-transport coupling is operator-split (sequential) and communicates through the shared cell-centered global_auxvar saturation/density/Darcy-velocity state rather than an explicit per-equation contract."
      scope: "reactive-transport runs coupled to a flow mode"
      source: "PMC controller tree behavior and global_aux state-sharing in PFLOTRAN source (pmc_base, global_aux, reactive_transport)"
      status: "adopted"
    - statement: "Reactive transport is formulated on the total concentration of a chosen independent set of primary/basis species, with secondary species from equilibrium mass action and minerals via the transition-state-affinity rate law."
      scope: "reactive-transport mode"
      source: "PFLOTRAN Theory Guide reactive-transport mode page (documentation.pflotran.org)"
      status: "adopted"
