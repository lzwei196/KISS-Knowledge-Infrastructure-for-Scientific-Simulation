    '
- id: dt_022
  failure_domain: silent_error
  stage: s7_output_analysis
  symptom: 'TypeError when calling float() on the extracted Liquid_Saturation value;

    or simulated SWC appears constant / always equals the first cell value.

    Traceback: "TypeError: only size-1 arrays can be converted to Python scalars"

    or "only one element tensors can be converted to Python scalars".

    '
  symptom_alt: TypeError.*float.*sat|only size-1 arrays
  detection: 'Print the shape: import h5py; f = h5py.File(''run.h5'',''r'');

    print(list(f.keys())[1:3]);

    k = next(k for k in f.keys() if k.startswith(''Time:''));

    print(f[k][''Liquid_Saturation''].shape)

    → Expected: (1, 1, 40) for NXYZ 1 1 40, NOT (40,)

    '
  diagnosis: 'For a NXYZ 1 1 N structured grid, PFLOTRAN writes Liquid_Saturation

    with shape (1, 1, N) — one value per z-cell, with singleton x and y

    dimensions. Calling float(sat[-1]) on a shape (1,1,40) array returns

    the last (1,1,1) sub-array, not a scalar. The cell order is bottom-to-top

    (cell 0 = bottom, cell N-1 = top), so the top cell is index [-1] AFTER

    flattening to 1D.

    '
  affected_components:
  - HDF5 output extraction
  - Liquid_Saturation array shape
  remedy:
    manual: "Always flatten before indexing:\n  sat = np.array(grp[\"Liquid_Saturation\"], dtype=float).flatten()\n\
      \  top_sat = float(sat[-1])   # top cell (highest z)\n  bot_sat = float(sat[0])    # bottom cell\
      \ (lowest z)\n\nThe z-ordering: cell index 0 = z_min (column bottom),\n                 cell index\
      \ N-1 = z_max (column top, where sensor is)\n"
    code: "with h5py.File(h5_file, \"r\") as f:\n    for key in sorted(f.keys()):\n        if not key.startswith(\"\
      Time:\"): continue\n        day = float(key.replace(\"Time:\",\"\").replace(\"d\",\"\").strip())\n\
      \        sat = np.array(f[key][\"Liquid_Saturation\"], dtype=float).flatten()\n        top_swc =\
      \ float(sat[-1]) * phi   # top cell SWC\n"
  prevention: 'Always use .flatten() on any PFLOTRAN array before indexing.

    Never assume scalar output from h5py even for 1D columns.

    '
- id: dt_023
  failure_domain: silent_error
  stage: s2_material_properties
  symptom: 'Van Genuchten alpha appears correctly patched on first run, but on

    subsequent runs (with cached materials.json) the simulated SWC is

    completely wrong — either too dry or too wet compared to first run.

    Symptom: same script, same site, different results run-to-run.

    '
  symptom_alt: Inconsistent results across runs with cached materials
  detection: "Print the alpha value from materials.json across two runs:\n  python3 -c \"import json;\
    \ d=json.load(open('materials.json'));\n  print([m['vg_alpha_Pa'] for m in d['materials']])\"\nIf\
    \ different each run → repeated application of ×100 patch.\n"
  diagnosis: 'The convert_soil_to_pflotran.py tool returns alpha in 1/Pa but with

    a systematic factor-of-100 error (divides by 9804 instead of 98.04

    for 1/cm → 1/Pa conversion). A post-processing patch applies ×100

    to correct this. If the patched materials.json is re-read and the

    patch is applied again, alpha becomes 100× too large again (then 100×

    too small on next run, etc.). This creates run-to-run inconsistency

    that is very hard to detect.

    '
  affected_components:
  - materials.json (cached soil properties)
  - convert_soil_to_pflotran.py output
  remedy:
    manual: "Apply the ×100 patch EXACTLY ONCE and record it in materials.json:\n  with open(mat_json)\
      \ as f:\n      data = json.load(f)\n  if not data.get(\"alpha_unit_patch_v1\"):   # idempotency\
      \ guard\n      for mat in data[\"materials\"]:\n          mat[\"vg_alpha_Pa\"] *= 100.0\n      data[\"\
      alpha_unit_patch_v1\"] = True     # set flag\n      with open(mat_json, \"w\") as f:\n         \
      \ json.dump(data, f, indent=2)\nOn subsequent loads, the flag prevents re-application.\n"
    code: "# Idempotent alpha patch (run after every call to convert_soil_to_pflotran.py)\nwith open(mat_json)\
      \ as f:\n    data = json.load(f)\nif not data.get(\"alpha_unit_patch_v1\"):\n    for mat in data[\"\
      materials\"]:\n        mat[\"vg_alpha_Pa\"] *= 100.0\n    data[\"alpha_unit_patch_v1\"] = True\n\
      \    with open(mat_json, \"w\") as f:\n        json.dump(data, f, indent=2)\n"
  prevention: 'Always write alpha_unit_patch_v1: true to materials.json after applying

    the alpha correction. Check for this flag before applying correction.

    Treat this as a one-time migration flag, not a per-run computation.

    '
- id: dt_024
  failure_domain: silent_error
  stage: s2_material_properties
  symptom: 'Simulated SWC at alpine meadow or high-altitude grassland sites is

    systematically 25–40% BELOW observed throughout the entire simulation.

    PBIAS = -25% to -50%. The seasonal dynamics (R ≈ 0.7–0.8) look correct

    but the absolute level is far too low. HWSD maps the site as "Loam".

    '
  symptom_alt: PBIAS < -25% at alpine/plateau grassland site
  detection: 'Compute: phi_est = SWC_p95_obs / 0.95

    If phi_est >> 0.43 (HWSD Loam default), porosity is underestimated.

    Also check elevation: sites > 2500 m with meadow/grassland cover

    typically have organic-rich O-horizon soils not captured by HWSD texture.

    '
  diagnosis: 'HWSD classifies many Tibetan Plateau, Qinghai, and high-altitude

    meadow soils as "Loam" (phi=0.43, Sr=0.078). In reality these soils

    are Histosols or organosols with very high organic matter content,

    giving porosity phi=0.55–0.65. Using phi=0.43 underestimates water

    storage capacity and produces systematic dry bias regardless of how

    ET or root-zone depth is tuned.

    Validated case: CN-HaM (Haibei, Qinghai, 3216 m), HWSD phi=0.43

    gave PBIAS=-29%; correcting to phi=0.60 gave NSE=0.47, PBIAS=+0.1%.

    '
  affected_components:
  - MATERIAL_PROPERTY.POROSITY
  - convert_soil_to_pflotran.py output for alpine sites
  remedy:
    manual: "1. Estimate corrected porosity from FLUXNET SWC observations:\n     phi_est = np.percentile(swc_obs_pct,\
      \ 95) / 0.95\n2. Or use lookup by elevation + biome:\n     < 2500 m: use HWSD phi (often OK)\n \
      \    2500–3500 m, meadow: phi = 0.55–0.60\n     > 3500 m, meadow/bog: phi = 0.60–0.70\n3. Override\
      \ materials.json after HWSD lookup:\n     top[\"porosity\"] = 0.60  # do NOT re-save to materials.json\n\
      \     # Use only in deck generation, keep materials.json as HWSD\n"
    code: "import numpy as np\n# Estimate phi from p95 of observed SWC (assumes S_max ≈ 0.95 at p95)\n\
      phi_est = np.percentile(swc_obs_pct_array, 95) / 0.95 / 100.0\nprint(f\"HWSD phi={phi_hwsd:.3f},\
      \ obs-estimated phi={phi_est:.3f}\")\nif phi_est > phi_hwsd * 1.1:  # >10% underestimate → override\n\
      \    print(f\"WARNING: Using phi={phi_est:.3f} override for organic soil\")\n"
  prevention: 'For any site above 2500 m with grassland/meadow vegetation:

    (a) Compute phi_est from FLUXNET SWC p95 before running

    (b) If phi_est > 0.50, override HWSD phi with estimated value

    (c) Document the override in the run log

    '
- id: dt_025
  failure_domain: runtime
  stage: s7_output_analysis
  symptom: 'Python script hangs indefinitely at import or h5py.File() call when

    both h5py and netCDF4 are imported in the same process. OR:

    h5py reads corrupt/partial data silently.

    Occurs only when both libraries are imported; h5py alone works fine.

    '
  symptom_alt: Script hangs at h5py.File|netCDF4 import before h5py
  detection: 'Test: python3 -c "import netCDF4; import h5py; print(''OK'')"

    vs   python3 -c "import h5py; import netCDF4; print(''OK'')"

    If the second hangs and the first does not → import order conflict.

    '
  diagnosis: 'netCDF4 and h5py both link to the HDF5 C library. If h5py initializes

    HDF5 global state first, netCDF4''s subsequent H5open() call may conflict.

    The safe order is: netCDF4 first (it initializes HDF5 in a compatible

    state), h5py second (it finds HDF5 already initialized and joins it).

    '
  affected_components:
  - Python import order in analysis scripts
  remedy:
    manual: "Always import netCDF4 before h5py at the top of the module:\n  import netCDF4   # FIRST —\
      \ initializes HDF5 in compatible state\n  import h5py      # SECOND — joins existing HDF5 state\n\
      Or keep them in separate subprocesses if both are needed independently.\n"
    code: '# Top of any script using both:

      import netCDF4   # must come before h5py

      import h5py

      import numpy as np

      '
  prevention: 'Add this ordering rule to all PFLOTRAN analysis script templates.

    Alternatively, use subprocess isolation: run h5py extraction in a

    clean subprocess and netCDF4 extraction in another.

    '
- id: dt_026
  failure_domain: silent_error
  stage: s7_output_analysis
  symptom: '1D vadose column simulated SWC is 30–60% above observed (PBIAS > +30%)

    at subtropical monsoon forest sites regardless of root-zone depth choice.

    Increasing root-zone depth from 0.5m to 2.0m only reduces bias from

    +55% to +58% — no combination of root-zone depth eliminates the bias.

    Site characteristics: P mean 2–4 mm/d, ET 1–2 mm/d, wet-season P ≈ 5–10 mm/d,

    regular heavy convective rain events.

    '
  symptom_alt: PBIAS > +30% at subtropical/tropical monsoon forest, all root-zone depths
  detection: 'Compute monthly P-ET balance AND max monthly P. If max monthly P > 3×

    mean ET AND site is subtropical/tropical monsoon → surface runoff bias.

    '
  diagnosis: 'PFLOTRAN 1D Richards column applies ALL precipitation as a Neumann

    top-boundary infiltration flux. Real subtropical forest soils generate

    significant surface runoff during high-intensity convective events

    (Hortonian overland flow when P-intensity > K_sat, or saturation

    excess when topsoil saturates). Without a runoff routing module, the

    model over-accumulates water in the column, inflating simulated SWC.

    The wet bias is structural, not a parameter issue.

    Validated case: CN-Qia (Qianyanzhou, Jiangxi, 26.7°N) — all root-zone

    depths 0.5–2.0m gave PBIAS +54–59%. CN-Din (Dinghushan) gave PBIAS +22%.

    '
  affected_components:
  - Top boundary condition (LIQUID_FLUX NEUMANN)
  - Missing surface runoff module
  remedy:
    manual: "Options (in order of preference):\n1. SITE SELECTION: avoid subtropical monsoon forest sites\
      \ (P>2 mm/d,\n   heavy convective regime) for 1D Richards validation.\n   PREFER: alpine meadow\
      \ (CN-HaM type), semi-arid, or temperate\n   sites where P >> ET rarely exceeds K_sat.\n2. RUNOFF\
      \ FRACTION: scale precipitation input by (1 - runoff_fraction):\n     infiltration_m_s = P_mm /\
      \ (1000*86400) * (1 - f_ro)\n     where f_ro ≈ 0.20–0.35 for subtropical forest (Hewlett & Hibbert)\n\
      \   This is a lumped approximation, not physics.\n3. DOCUMENT AND EXCLUDE: accept the site as unsuitable\
      \ for 1D\n   Richards validation and note the structural limitation explicitly.\n4. FOR RELATIVE\
      \ SIGNALS ONLY: if only seasonal trends matter (not\n   absolute values), divide out the mean bias\
      \ and report correlation\n   and RMSE only.\n"
    code: "# Quick site suitability check before running\nimport numpy as np\np_mean = np.mean(p_vals)\n\
      p_max_monthly = max(np.mean([p for p,d in zip(p_vals,dates) if d.month==m])\n                  \
      \  for m in range(1,13))\net_mean = np.mean(et_vals)\nif p_max_monthly > 3.0 * et_mean and p_mean\
      \ > 2.0:\n    print(\"WARNING: Subtropical monsoon regime detected.\")\n    print(\"1D Richards\
      \ will show +30-60% SWC wet bias (structural limit).\")\n    print(\"Prefer alpine meadow or semi-arid\
      \ sites for this workflow.\")\n"
  prevention: 'Before running any new FLUXNET site, compute: max monthly P / mean ET.

    If > 3.0 AND annual P mean > 2 mm/d → flag as monsoon-regime site.

    Prefer sites where this ratio < 2.0 (e.g., alpine, temperate, semi-arid).

    Validated suitable sites: CN-HaM (alpine meadow, NSE=0.47).

    '
- id: dt_027
  failure_domain: silent_error
  stage: s3_forcing_boundary
  symptom: '1D vadose column validated against a WINTER / cold-season soil-moisture

    window shows strong ANTI-correlation with the obs (r < 0): simulated SWC

    RISES on the days the column gets precip while the observed root-zone

    moisture slowly DECLINES (or is flat). Forcing T_mean is well below 0 C

    across the scoring window. Symptom seen on SMAP L4 sm_rootzone at CN-HaM

    (37.6N,101.3E, 3216 m): the only obs available was 2019-01-01..01-19,

    a deep-winter window (T -11..-16.6 C). Applying the 4.3 mm of January

    precip as LIQUID infiltration gave r=-0.83, NSE=-856, PBIAS=-11%.

    '
  symptom_alt: r < 0 at cold/winter 1D-column window with T_mean < 0 C; sim SWC rises while obs falls
  detection: 'Check T_mean over the scoring window. If most days are < 0 C, precip is

    snow, NOT liquid recharge. Verify the forcing net infiltration is ~0 on

    sub-zero days; if it is non-zero, the deck is injecting phantom winter water.

    '
  diagnosis: 'PFLOTRAN RICHARDS mode is ISOTHERMAL and has NO soil-freezing or snowpack

    physics (it cannot hold frozen pore water or accumulate a snowpack). When

    forcing precip is fed straight to the LIQUID_FLUX NEUMANN top BC, sub-zero

    precip that should fall as snow (no infiltration into frozen ground) is

    applied as liquid recharge, producing a spurious cold-season SWC rise that

    anti-correlates with the real (frozen, slowly-draining) obs.

    '
  affected_components:
  - Top boundary condition (LIQUID_FLUX NEUMANN)
  - Forcing preprocessing (precip phase partition)
  - Missing snow / soil-freeze module
  remedy:
    manual: "1. SNOW GATING (degree-day): partition precip by T_mean before building\n   the top-BC LIST.\
      \ Sub-zero precip accumulates as snowpack; melt + rain\n   infiltrate only when T_mean >= 0:\n \
      \    if t < 0:  snowpack += p_mm;  infil_mm = 0.0\n     else:      melt = min(snowpack, 2.0*t);\
      \ snowpack -= melt\n                infil_mm = p_mm + melt\n   At CN-HaM this zeroed all January\
      \ infiltration and flipped r from\n   -0.83 to +0.84, PBIAS -11% -> +0.8%, NSE -856 -> -4.1.\n2.\
      \ INITIAL CONDITION: wire the hydrostatic DATUM so the top cell STARTS\n   at observed wetness,\
      \ removing the cold-start transient. For top SWC\n   target s*phi, solve the vG curve for capillary\
      \ head and place the\n   datum head below the top cell:\n     Pc = ((Se**(-1/m))-1)**(1/n)/alpha\
      \ ; head=Pc/9804 ; datum=z_top-head\n   (CN-HaM: top SWC 0.27, phi 0.60 -> datum 0.645 m.)\n3. METRIC\
      \ FAMILY: a deep-winter obs window is near-constant (CN-HaM SMAP\n   obs std = 0.107% VWC over 19\
      \ days). NSE/raw temporal_pattern_match is\n   STRUCTURALLY INVALID on a near-zero-variance obs\
      \ — a 0.24% RMSE /\n   0.8% PBIAS / r=0.84 fit still scores NSE<0. Report magnitude_accuracy\n \
      \  (PBIAS) as the meaningful metric; cite r for direction; flag NSE as\n   denominator-collapsed,\
      \ do NOT chase it by overfitting a <0.4% signal.\n"
    code: "# Degree-day snow gating in the forcing loop\nsnowpack = 0.0\nfor date, p_mm, t in zip(dates,\
      \ precip, tmean):\n    if t < 0.0:\n        snowpack += p_mm; infil_mm = 0.0\n    else:\n      \
      \  melt = min(snowpack, 2.0*max(0.0, t)); snowpack -= melt\n        infil_mm = p_mm + melt\n   \
      \ net_inf_ms = infil_mm / (1000.0*86400.0)\n"
  prevention: 'For ANY cold-season / high-altitude 1D-column validation, gate precip by

    temperature (snow model) BEFORE writing the top-BC LIST — RICHARDS has no

    freeze physics. And before scoring, check obs variance over the window:

    if std(obs) is a tiny fraction of the mean (near-constant winter signal),

    score with magnitude_accuracy (PBIAS), not NSE. Validated: SMAP CN-HaM

    2019 (Jan window) r=0.84, PBIAS=+0.8% after snow gating + IC datum.

    '
