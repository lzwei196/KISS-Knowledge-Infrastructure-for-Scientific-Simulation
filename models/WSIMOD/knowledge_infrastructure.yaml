# knowledge_infrastructure.yaml — the KI's manifest, PROJECTED from dag.yaml,
# the KI contents and the models DB (generate_ki_manifest.py, 2026-08-15).

package:
  name: WSIMOD
  language: python
  implementation:
    id: wsimod
    version: 0.8.1
    provenance: Python; WSIMOD package (Barnaby Dobson / Imperial College London), node-arc VQIP message-passing
      framework integrating CityWat urban and CatchWat rural processes.
  scientific_reference_version: WSIMOD (Water Systems Integrated Modelling framework), node-arc message-passing
    integrated water-cycle model per Dobson et al. 2024 GMD (CityWat urban + CatchWat rural lineage)
  binary:
    path: KISSPATH_KI_ROOT/WSIMOD/run_and_score.py
    type: Python
pipeline:
  stages:
  - s0_configuration_skill
  - s2_data_preparation_skill
  - s4_parameters_skill
  - s5_execution_skill
  - s6_output_analysis_skill
tools:
  count: 4
  files:
  - tools/convert_forcing_data.py
  - tools/convert_parameters.py
  - tools/parse_wsimod_output.py
  - tools/run_wsimod.py
inputs:
  forcing:
  - name: precipitation
    unit: m/timestep
  - name: potential evapotranspiration (ET0)
    unit: m/timestep
  - name: temperature
    unit: degC
  - name: atmospheric deposition
    unit: kg/timestep (N load)
  - name: prescribed catchment inflow (flow + pollutant timeseries)
    unit: m3/d or ML/d (flow); kg/timestep or mg/L (quality)
  parameters:
  - name: surface area
    unit: m2
  - name: soil depth
    unit: m
  - name: field_capacity / wilting_point
    unit: fraction
  - name: tank / storage capacity
    unit: ML (or m3)
  - name: sewer capacity
    unit: m3/d
  - name: residence / pipe routing time
    unit: days
  - name: per-capita demand
    unit: ML/person/d
  - name: treatment throughput capacity
    unit: ML/d
  - name: leakage rate
    unit: fraction
  - name: pollutant decay / transformation coefficients
    unit: per day
  - name: surface pollutant_load / nutrient export coefficients
    unit: kg/timestep (or kg/km2 for nutrient export)
  - name: reservoir / environmental-flow thresholds
    unit: ML/d (or volume)
  initial_conditions:
  - name: initial tank storage volume
    unit: ML or m3
  - name: initial soil moisture
    unit: m (or fraction of capacity)
  - name: initial VQIP pollutant pools
    unit: kg (additive) / mg/L,degC,pH (non-additive)
  boundary_conditions:
  - name: node-arc graph topology
    unit: dimensionless
  - name: orchestration sequence
    unit: dimensionless
  - name: population / land-use fractions
    unit: persons; fraction
  - name: pollutant set definition (additive vs non-additive)
    unit: dimensionless
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - flows
  - river flow / discharge
  - pollutant concentration / mass
  - storage / tank levels
  - land surface states (soil moisture, runoff, percolation)
  - CSO spill / flood volume
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=0.986, KGE=0.961, R=0.995'
  metrics:
    best_nse: 0.9855
    best_kge: 0.9607
    best_r: 0.9948
summary:
  total_tools: 4
  total_stage_docs: 5
  total_diagnostic_triplets: 18
  generated: '2026-08-15'
  generated_by: generate_ki_manifest.py (projection; regenerate any time)
