  remedy: Set thermocline width w to 1-3 m for most lakes; constrain to w < 0.2 * z_max; convert_parameters_to_wasp;
    ['Check thermo_width in parameter file; should be 0.5-5 m for most lakes', 'For shallow lakes (z_max
