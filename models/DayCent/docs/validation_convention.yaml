        band_note: "Clivot 2019 reports SOC RRMSE 5.3%, measurement CV 4.3%, and other top SOC model RRMSE values 6.5%-10%."
        cites: [clivot2019]
    secondary_metrics:
      - metric: pbias
        direction: zero_centered
        status: supportive
        ceiling_reason: "Dag metric retained as supportive: Oliveira 2017 reports absence of significant bias in DayCent soil C stocks, and Wang 2023 reports evaluation bias -0.73 t C ha-1."
        cites: [oliveira2017, wang2023cute]
      - metric: nse
        direction: maximize
        status: supportive
        ceiling_reason: "Wang 2023 reports independent evaluation NSE 0.87 for DayCent SOC after auto-calibration."
        cites: [wang2023cute]
    validated_when: "RRMSE <= 10% for SOC time-series dynamics; PBIAS should be checked but no percent-bias tier supersedes the fetched RRMSE convention."
    evidence_strength: strong
    confidence: 0.85
    notes: "SOC literature uses RRMSE/RMSE relative to measurement variability more explicitly than PBIAS; this supersedes the dag determining_metric for automated grading."

