# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: SFINCS
  language: fortran
  implementation:
    id: sfincs-v232
    version: v2.3.2 (mt_Faber lineage)
    provenance: Fortran reduced-physics flood solver shipped by Deltares; realizes the SFINCS local-inertial/SSWE
      spec (Leijnse et al. 2021) with subgrid per van Ormondt et al. 2025.
  scientific_reference_version: SFINCS reduced-physics solver (Leijnse et al. 2021; local-inertial / SSWE),
    subgrid per van Ormondt et al. 2025
inputs:
  forcing:
  - name: precipitation
    unit: mm/hr
    category: forcing
    source_kind: forcing
    model_input_format: ASCII precipfile (time_seconds precip_mmhr); netprecipfile NetCDF path unreliable
    notes: Instantaneous rate in mm/hr; drives pluvial flooding. Time-interpolated each step by the meteo
      module into prcp.
  - name: river discharge boundary
    unit: m3/s
    category: forcing
    source_kind: forcing
    model_input_format: sfincs.src (source points) + sfincs.dis (discharge time series)
    notes: Injected as point/source discharge qsrc; the CaMa-Flood->SFINCS fluvial coupling path.
  - name: water level boundary
    unit: m
    category: forcing
    source_kind: forcing
    model_input_format: sfincs.bnd (boundary points) + sfincs.bzs (water-level time series)
    notes: Coastal/downstream water-level BC; vertical datum must match the DEM datum.
  - name: wind speed and direction
    unit: m/s, degrees
    category: forcing
    source_kind: forcing
    model_input_format: spiderweb / amu-amv wind fields (dtwnd update interval, default 1800 s)
    notes: Optional; produces wind stress (tauwu/tauwv) for surge/setup. Not active in default pluvial/fluvial
      runs.
  - name: atmospheric pressure
    unit: Pa
    category: forcing
    source_kind: forcing
    model_input_format: atmospheric pressure forcing field / spwfile composite
    notes: Optional; barometric forcing for surge runs.
  parameters:
  - name: bed level (topography/bathymetry)
    unit: m (vertical datum must match boundary conditions)
    category: parameter
    source_kind: dataset_lookup
    model_input_format: sfincs.dep (binary float32 row-major), sourced from a DEM raster (GeoTIFF)
    notes: Terrain elevation, positive upward; defines conveyance with subgrid tables.
  - name: active cell mask
    unit: category code
    category: parameter
    source_kind: user_provided
    model_input_format: 'sfincs.msk (binary uint8): 0=inactive, 1=active(computed), 2=outflow boundary,
      3=water-level BC'
    notes: SKILL.md convention adopted (1=active). Interior cells must be 1; mask=3 on interior makes
      SFINCS prescribe water level and compute zero flood depth.
  - name: active-cell index map
    unit: cell indices
    category: parameter
    source_kind: derived
    model_input_format: 'sfincs.ind (binary int32: [n_active][1-based flat indices])'
    notes: Maps active cells to grid / subgrid; header int32 must equal n_active.
  - name: Manning's n roughness
    unit: s/m^(1/3) (dimensionless n, ~0.015-0.20)
    category: parameter
    source_kind: calibrated
    model_input_format: sfincs.man (binary float32 row-major) or uniform manning; manning_land 0.04 /
      manning_sea 0.02 split at rgh_lev_land
    notes: Primary calibration parameter. Precomputed once into gn2=g*n^2 at init (compute_fluxes reads
      gn2); editing manning after init is inert. In subgrid mode roughness is embedded in the subgrid
      tables instead.
  - name: subgrid tables
    unit: derived (volume-depth, conveyance, roughness)
    category: parameter
    source_kind: derived
    model_input_format: sfincs.sbg / sbgfile (NetCDF; h73table, subgrid_z_volmax)
    notes: Optional but dominant control on coarse-grid accuracy; continuity maps storage volume to water
      level via these tables.
  - name: infiltration parameters
    unit: mm/hr (qinf); method-specific (CN, Green-Ampt, Horton)
    category: parameter
    source_kind: dataset_lookup
    model_input_format: qinf constant or qinffile; scsfile/sfacinf (CN); ksfile/sigmafile/psifile (Green-Ampt);
      f0file/fcfile/kdfile (Horton)
    notes: Optional infiltration sink subtracted from precipitation in the continuity balance.
  - name: grid definition
    unit: m / EPSG
    category: parameter
    source_kind: user_provided
    model_input_format: 'sfincs.inp keywords: x0,y0,dx,dy,mmax,nmax,rotation,epsg'
    notes: EPSG must be a projected (UTM) CRS; geographic 4326 with metric dx/dy is fatal.
  initial_conditions:
  - name: initial water level
    unit: m
    category: initial_condition
    source_kind: user_provided
    model_input_format: zsini uniform (default 0.0) or inifile (binary spatially varying)
    notes: Sets zs at simulation start.
  - name: restart state
    unit: mixed
    category: initial_condition
    source_kind: user_provided
    model_input_format: rstfile containing zs, qx, qy, umean, vmean
    notes: Optional warm-start from a prior run.
  boundary_conditions:
  - name: momentum advection toggle
    unit: 0/1
    category: boundary_condition
    source_kind: user_provided
    model_input_format: advection keyword (0=LIE local-inertial, 1=SSWE with advection)
    notes: Structural switch selecting the reduced-physics regime; default 0.
  - name: minimum flow depth threshold (huthresh)
    unit: m
    category: boundary_condition
    source_kind: default
    model_input_format: huthresh keyword in sfincs.inp
    notes: 'Wetting/drying threshold; cells below huthresh treated dry, controlling flood-extent edges
      and wet/dry stability. Default split across streams: docs default 0.05 m (range 0.001-0.1); binary
      symbol __sfincs_data_MOD_huthresh default 0.01 m. Unresolved across docs vs binary streams - use
      SFINCS-manual 0.05 m unless byte-confirmed otherwise.'
  - name: momentum time-integration / smoothing weight (theta)
    unit: dimensionless
    category: boundary_condition
    source_kind: default
    model_input_format: theta keyword in sfincs.inp
    notes: 'Momentum time-integration / numerical-smoothing weight affecting stability. Default split
      across streams: source binary symbol __sfincs_data_MOD_theta default 0.9; docs default 1.0. Unresolved
      across docs vs binary streams.'
  - name: simulation time window
    unit: s / datetime
    category: boundary_condition
    source_kind: user_provided
    model_input_format: tref / tstart / tstop
    notes: Reference, start and stop times; forcing times are relative to tref.
  - name: computational timestep control
    unit: s / dimensionless
    category: boundary_condition
    source_kind: user_provided
    model_input_format: alpha Courant limiter (default 0.5; binary alfa default 0.75) constraining dt
      <= alpha*dx/sqrt(g*h_max)
    notes: Adaptive CFL-limited timestep; violation produces NaN crash.
  - name: output format and intervals
    unit: s
    category: boundary_condition
    source_kind: user_provided
    model_input_format: outputformat=net (NetCDF); dtout/dtmapout, dthisout, dtmaxout
    notes: outputformat must be 'net' for NetCDF map/his output; otherwise binary.
  - name: hydraulic structures
    unit: geometry / m
    category: boundary_condition
    source_kind: user_provided
    model_input_format: thin dams (.thd), weirs, drainage (.drn)
    notes: Optional; override fluxes between cells inside the momentum step.
outputs:
  primary:
  - name: hmax
    unit: m
    description: Maximum water depth above bed over the simulation; the correct flood-depth variable (cf.
      zsmax which is surface elevation).
    validation_rank: 5
    emitted_in: sfincs_map.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - event_detection
        determining_metric: csi
        caveats:
        - Compare against observed/benchmark flood-extent or depth maps; flood/no-flood detection uses
          CSI/hit-rate. Datum and grid alignment must match.
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - High-water marks at surveyed points; SFINCS local-domain depth vs surveyed peak depth.
      detrending_options:
      - none
  - name: zsmax
    unit: m
    description: Maximum water surface elevation (bed + depth) over the simulation; not flood depth.
    validation_rank: 2
    emitted_in: sfincs_map.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Compare against surveyed high-water-mark surface elevations on a shared vertical datum; not
          a flood-depth proxy.
      detrending_options:
      - none
  - name: zs
    unit: m
    description: Instantaneous water surface elevation at each map-output interval.
    validation_rank: 3
    emitted_in: sfincs_map.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Event-scale; map snapshots at dtmapout. Requires matching grid and datum.
      detrending_options:
      - none
  - name: point_zs / point_h
    unit: m
    description: Water surface elevation / water depth at observation (his) points.
    validation_rank: 4
    emitted_in: sfincs_his.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Compare against stage/depth gauges within the domain; timing of peak (t_zsmax) admits DOY/lag
          bias. Requires shared datum for zs.
      detrending_options:
      - none
  - name: flood extent (derived from hmax > threshold)
    unit: category / area
    description: Flood-water wet/dry extent classification derived from hmax exceeding a depth threshold.
    validation_rank: 1
    emitted_in: sfincs_map.nc
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: categorical_event_comparison
        metric_families:
        - event_detection
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Against satellite/observed inundation masks (e.g. SAR-derived) using CSI / hit-rate / false-alarm;
          sensitive to chosen depth threshold.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Flood depths 10-100x too high; entire domain floods unrealistically
  diagnosis: 'Precipitation in mm/3hr not converted to mm/hr. SFINCS expects mm/hr.; CMFD and MSWX forcing
    data are accumulated over 3-hour windows (mm/3hr). SFINCS precipitation input expects instantaneous
    rates in mm/hr. If mm/3hr values are passed directly, precipitation is 3x too high. For example, 30
    mm/3hr '
  remedy: 'Divide CMFD/MSWX precipitation by 3.0 before writing to sfincs.precip; prepare_sfincs_rainfall;
    [''Check precipitation values in sfincs.precip: ncdump -h sfincs.precip'', ''Verify units attribute
    says mm/hr'', ''Check max value is reasonable (< 100 mm/hr for extreme events)'']; prepare_sfincs_rainfall.py '
  severity: silent
- id: dt_002
  symptom: No flooding despite heavy rain event
  diagnosis: Precipitation in m/s instead of mm/hr (factor of 3.6e6 too small); Some climate model outputs
    provide precipitation in kg/m2/s (= m/s water equivalent). SFINCS expects mm/hr. 1 m/s = 3,600,000
    mm/hr. If not converted, values are effectively zero (e.g., 0.000003 m/s = 0.0108 mm/hr instead of
    10.8 mm/
  remedy: 'Convert from m/s to mm/hr: multiply by 3600 * 1000; prepare_sfincs_rainfall; [''Check forcing
    data units in source NetCDF metadata'', ''Verify precipitation maximum is > 1 mm/hr during storm events''];
    Always check units attribute in source data before conversion'
  severity: silent
- id: dt_003
  symptom: CaMa-Flood discharge BC produces wrong flood extent; river flow too small
  diagnosis: 'Discharge in mm/day (VIC native units) not converted to m3/s; VIC outputs runoff in mm/day
    per grid cell. To convert to discharge for SFINCS: Q_m3s = runoff_mm_day * cell_area_m2 / (1000 *
    86400). CaMa-Flood outflw is already in m3/s, so no conversion needed for CaMa output. But if using
    VIC runoff '
  remedy: 'Use CaMa-Flood outflw (already m3/s) for SFINCS discharge BC. If using VIC directly, convert:
    Q = runoff_mm * area_m2 / (1000 * 86400); cama_to_sfincs_boundary; [''Check CaMa outflw values are
    in m3/s (typical river: 10-10000 m3/s)'', ''If values are < 1 for a large river, units are wrong''];
    cama_to_sf'
  severity: silent
- id: dt_004
  symptom: Coastal water levels systematically offset by 20-40m from expected
  diagnosis: 'Vertical datum mismatch: DEM uses EGM96 geoid but tide model uses MSL/chart datum; Copernicus
    GLO-30 and China DEM 90m use EGM96 geoid heights. Tidal models (FES2014) and many water level records
    use local MSL or chart datum. The difference between EGM96 geoid and WGS84 ellipsoid can be 20-40m
    depen'
  remedy: 'Verify both DEM and water level BC use the same vertical datum. Apply geoid correction if needed.;
    ; [''Check DEM vertical datum: gdalinfo dem.tif | grep VERT'', ''Check water level BC reference: usually
    MSL or chart datum'', ''If different, apply geoid correction using EGM96 grid'', ''CaMa-Flood sfcelv
    us'
  severity: silent
- id: dt_005
  symptom: SFINCS crashes immediately with grid error or produces garbage output
  diagnosis: 'CRS mismatch: sfincs.inp uses geographic (degrees) but dx/dy are in meters; SFINCS dx/dy
    are in the CRS unit. If EPSG is geographic (e.g., 4326), dx=100 means 100 degrees, not 100 meters.
    The grid must use a projected CRS (e.g., UTM) for metric dx/dy values. setup_sfincs_domain.py auto-detects
    UTM.

    '
  remedy: Use a projected CRS (UTM). setup_sfincs_domain.py auto-detects the correct UTM zone.; setup_sfincs_domain;
    ['Check epsg in sfincs.inp — must be a projected CRS (e.g., 326xx for UTM north)', 'Verify dx/dy are
    in meters, not degrees']; Always use setup_sfincs_domain.py which auto-selects UTM
  severity: fatal
- id: dt_006
  symptom: Flood map displaced from actual terrain; flooding in wrong locations
  diagnosis: 'x0/y0 origin does not match DEM origin after reprojection; When reprojecting DEM to SFINCS
    grid, the origin (x0, y0) must be consistent between the grid definition and the dep/msk files. If
    the DEM is clipped or reprojected separately, the origin may shift.

    ; [''build_sfincs_topobathy'', ''setup_sfincs'
  remedy: Ensure build_sfincs_topobathy uses the exact same x0, y0, dx, dy from grid_info.json; build_sfincs_topobathy;
    ['Compare x0/y0 in sfincs.inp with the transform origin in sfincs.dep', 'Overlay flood map on DEM
    to check alignment']; Both tools read from grid_info.json — single source of truth
  severity: silent
- id: dt_007
  symptom: Water flows uphill at domain boundary; water accumulates at edges
  diagnosis: 'Mask file boundary cells set to 3 (active) instead of 2 (outflow); SFINCS mask values: 0=inactive,
    1=boundary inflow, 2=outflow, 3=active interior. If edge cells are set to 3, water cannot leave the
    domain and accumulates unrealistically at boundaries. Edge cells should be 2 (outflow) to allow drain'
  remedy: Set edge cells of active domain to mask=2 (outflow); build_sfincs_topobathy; ['Read sfincs.msk
    as numpy array', 'Check that domain edge active cells have value 2, not 3']; build_sfincs_topobathy.py
    auto-detects edge cells and sets to 2
  severity: silent
- id: dt_008
  symptom: Checkerboard pattern in flood depth; alternating wet/dry cells
  diagnosis: Subgrid resolution too fine relative to computational grid (ratio > 30x); The subgrid lookup
    tables approximate volume-depth relationships within each computational cell. If the subgrid resolution
    is too fine (e.g., 1m subgrid on 200m computational grid = 200x ratio), the tables become noisy and
    pro
  remedy: Reduce subgrid ratio to 5-20x. E.g., for dx=100m, use 5-20m subgrid.; ; ['Check subgrid_ratio
    in grid_info.json', 'If > 20, coarsen the subgrid or refine the computational grid']; setup_sfincs_domain.py
    caps subgrid ratio at 20x
  severity: degraded
- id: dt_009
  symptom: Model crashes with NaN or Inf after N timesteps
  diagnosis: 'dt too large for dx (CFL violation: dt > dx/sqrt(g*h)); The Courant-Friedrichs-Lewy condition
    for shallow water equations: dt <= dx / sqrt(g * h_max). For dx=100m and h_max=10m: dt_max = 100 /
    sqrt(9.81*10) = 10.1s. Exceeding this causes numerical instability and NaN propagation.

    ; [''generate_sfincs'
  remedy: Reduce dt. Use dt <= 0.75 * dx / sqrt(9.81 * h_max_expected); generate_sfincs_inp; ['Calculate
    dt_max = dx / sqrt(9.81 * 10) for 10m max depth assumption', 'Set dt to 75% of dt_max in sfincs.inp',
    'For very shallow flows (h<1m), dt can be larger']; generate_sfincs_inp.py auto-computes CFL-stable
    dt
  severity: fatal
- id: dt_010
  symptom: Very slow convergence; oscillating water levels; simulation takes 100x expected
  diagnosis: Advection enabled with alpha too low for steep terrain; The momentum damping coefficient
    alpha (default 0.75) controls numerical stability. With advection=1 on steep terrain, alpha < 0.5
    can cause oscillations. Also, dt may be auto-reduced by the solver when instability is detected, drastically
    incr
  remedy: Set advection=0 (usually not needed for flood inundation). If needed, increase alpha to 0.75-0.95.;
    generate_sfincs_inp; ['Check if advection=1 in sfincs.inp', 'If runtime is excessive, disable advection
    first', 'If advection is needed, increase alpha toward 0.9']; generate_sfincs_inp.py sets advect
  severity: degraded
- id: dt_011
  symptom: Runtime 10-100x longer than expected; grid seems too fine for domain
  diagnosis: 'Grid resolution too fine for domain size. Computational cost scales as (1/dx)^3.; SFINCS
    cost is proportional to n_cells * n_timesteps. Halving dx quadruples cells and halves dt (CFL), giving
    8x cost. For a 50km x 50km domain: dx=100m: 250,000 cells, dt~10s -> manageable dx=10m: 25,000,000
    cells, dt'
  remedy: Increase dx. Use subgrid for fine-resolution effects. For domains > 10km, use dx >= 50m.; setup_sfincs_domain;
    ['Check total_cells in grid_info.json', 'If > 2,000,000, consider coarsening or reducing domain extent',
    'Use subgrid tables (sfincs.sbg) for fine-resolution bathymetry']; setup_sfincs_doma
  severity: degraded
- id: dt_012
  symptom: Water level BC has no effect; boundary appears dry
  diagnosis: 'Boundary point locations (sfincs.bnd) not aligned to active mask cells; SFINCS matches bnd
    point coordinates to the nearest grid cell. If the nearest cell has mask=0 (inactive), the BC is ignored
    silently. The point must fall on a cell with mask=1 (boundary) or mask=3 (active).

    ; [''cama_to_sfincs_bo'
  remedy: 'Verify bnd point coordinates fall on active mask cells (mask > 0); ; [''Read sfincs.bnd coordinates'',
    ''Convert to grid indices: i = (x - x0) / dx, j = (y - y0) / dy'', ''Check mask value at those indices:
    must be > 0'', ''If mask=0, move point to nearest active cell'']; cama_to_sfincs_boundary.py should
    v'
  severity: silent
- id: dt_013
  symptom: Discharge source creates artificial pond at a single point; no downstream flow
  diagnosis: 'Source point placed on high ground (ridge), not in channel. No drainage path.; SFINCS adds
    water at discharge source points (sfincs.src). If the point is on a topographic high, water pools
    locally instead of flowing downstream. The source point must be placed in the river channel (topographic
    low).

    '
  remedy: Place discharge source at a topographic low (river channel). Check DEM elevation at source point.;
    ; ['Read source point coordinates from sfincs.src', 'Look up elevation at those coordinates in sfincs.dep',
    'Verify it is a local minimum (channel), not a ridge or hillslope', 'If wrong, move to neares
  severity: degraded
- id: dt_014
  symptom: Double flood volume — both precipitation and VIC runoff applied in SFINCS domain
  diagnosis: 'Same precipitation applied in both VIC (which generates runoff) and SFINCS (which generates
    its own runoff from rainfall); When SFINCS receives gridded precipitation AND VIC surface runoff as
    discharge sources, the rainfall is counted twice: once by VIC (producing runoff that enters SFINCS
    via CaMa-'
  remedy: 'Choose ONE approach: (a) SFINCS with rainfall + CaMa river BC only, or (b) SFINCS with VIC
    runoff sources, no rainfall; ; [''If using netprecipfile in sfincs.inp, use CaMa discharge as river
    BC only'', ''Do NOT add VIC surface runoff as SFINCS discharge source at the same time'', ''If using
    VIC runoff di'
  severity: silent
- id: dt_015
  symptom: CaMa-Flood boundary flows in wrong direction; flooding appears on wrong side
  diagnosis: Stage BC (water level) used where discharge BC was intended, or sign convention mismatch;
    CaMa-Flood outflw can be positive (downstream) or negative (backwater effect). If negative discharge
    is used as SFINCS inflow, water is removed instead of added. Also, using water level BC (sfcelv) at
    a river e
  remedy: 'Use discharge BC (sfincs.src + sfincs.dis) for river inflow. Use water level BC (sfincs.bnd
    + sfincs.bzs) for coastal/downstream boundaries.; cama_to_sfincs_boundary; [''For upstream river entry:
    use bc_type=discharge'', ''For downstream coastal boundary: use bc_type=waterlevel'', ''Verify discharge
    valu'
  severity: silent
- id: dt_016
  symptom: Artificial step changes in water level at SFINCS boundary every 24 hours
  diagnosis: CaMa-Flood output at daily step, SFINCS needs sub-hourly; linear interpolation causes visible
    ramps; CaMa-Flood typically outputs daily mean discharge/water level. SFINCS operates at seconds-to-minutes
    timesteps. Linear interpolation between daily values creates 24-hour ramps that do not represent a
  remedy: Use sub-daily CaMa-Flood output if available. Otherwise, acknowledge temporal smoothing.; ;
    ['Check CaMa-Flood output time interval (daily vs 3-hourly)', 'If daily, consider running CaMa-Flood
    with smaller DTIN/DTOUT', 'For flash flood applications, daily BC is insufficient']; Note temporal
    resoluti
  severity: degraded
- id: dt_017
  symptom: SFINCS exits immediately with 'Cannot open file' error
  diagnosis: 'SFINCS reads from CWD only; binary executed from wrong directory; SFINCS has NO command-line
    arguments. It reads sfincs.inp from the current working directory. If the binary is called from a
    different directory than where sfincs.inp resides, it will fail to find any input files.

    ; [''run_sfincs'', ''s7'
  remedy: 'cd to the directory containing sfincs.inp before running the binary; run_sfincs; [''Verify
    sfincs.inp is in the current working directory'', ''All file references in sfincs.inp must be relative
    to this directory'', ''run_sfincs.py handles this automatically via cwd parameter'']; run_sfincs.py
    always sets '
  severity: fatal
- id: dt_018
  symptom: Output file empty or missing after successful run
  diagnosis: 'outputformat not set in sfincs.inp; default may be binary when NetCDF expected; If outputformat
    is not specified in sfincs.inp, SFINCS may default to binary output instead of NetCDF. The post-processing
    tools expect NetCDF (sfincs_map.nc). Binary output files have different names and format.

    ; [''gen'
  remedy: Add 'outputformat = net' to sfincs.inp; generate_sfincs_inp; ["Check sfincs.inp for 'outputformat'
    line", "If missing, add 'outputformat = net'", 'Re-run SFINCS']; generate_sfincs_inp.py always includes
    outputformat = net
  severity: degraded
- id: dt_019
  symptom: Model runs to completion but output is all zeros
  diagnosis: Mask file has no active cells (all values 0), or all cells set to inactive; If sfincs.msk
    contains only zeros, SFINCS has no cells to compute. The model may still run without error but produce
    empty output. This can happen if the shapefile used for masking has wrong CRS or doesn't overlap with
    the c
  remedy: 'Check sfincs.msk has active cells (values > 0). Verify shapefile CRS matches grid CRS.; build_sfincs_topobathy;
    ["Read msk file: np.fromfile(''sfincs.msk'', dtype=np.uint8)", ''Count active cells: np.sum(msk >
    0)'', ''If 0, check shapefile CRS vs grid EPSG'']; build_sfincs_topobathy.py checks active cell '
  severity: silent
- id: dt_020
  symptom: Water flows too fast; CFL instability with reasonable dt
  diagnosis: 'Manning''s n too low (< 0.01). Reduces friction, increases flow velocity.; Manning''s n
    controls flow resistance. Values below 0.01 are physically unrealistic for any surface and can cause
    CFL violations even with small dt. Minimum realistic values: 0.02 (smooth water), 0.025 (concrete).

    ; [''build_sfi'
  remedy: Set minimum Manning's n to 0.02. Check LULC-to-Manning lookup table.; build_sfincs_roughness;
    ['Check manning value in sfincs.inp or min value in sfincs.man', 'If < 0.02, increase to at least
    0.02']; build_sfincs_roughness.py enforces minimum n=0.015
  severity: fatal
- id: dt_v001
  symptom: 'SFINCS reads sfincs.ind and reports ''Number of active z points: 1'' despite thousands of
    active cells in mask'
  diagnosis: 'sfincs.ind written as full 2D grid of sequential int32 indices instead of the required binary
    format: [n_active int32] [flat_indices int32 1-based]; SFINCS v2.3.2 expects the index file (sfincs.ind)
    in a specific binary format: the first int32 is the count of active points, followed by that many
    int'
  remedy: 'Write sfincs.ind as: header (n_active as int32) + body (1-based flat indices of active cells
    as int32 array); build_sfincs_topobathy; [''Read sfincs.msk, find active cells (mask > 0)'', ''Compute
    flat 1-based indices: idx = row * mmax + col + 1'', ''Write binary: np.array([n_active], dtype=np.int32).tofi'
