  - dag_variable: "crop_yield (cgrain)"
    obs_shape: point_time_series
    headline_metrics:
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 10.0, good: 20.0, satisfactory: 20.0}
        pass_band: satisfactory
        band_note: "Transferred from DayCent county-yield benchmark language: most counties within +/-20% and many within +/-10% of NASS yields."
        cites: [zhang2020]
    secondary_metrics:
      - metric: nse
        direction: maximize
        status: supportive
        ceiling_reason: "Laub 2024 reports maize grain yield EF increased from 0.36 to 0.50 across all sites after calibration."
        cites: [laub2024]
      - metric: nrmse
        direction: minimize
        status: supportive
        ceiling_reason: "Palosuo 2011 uses CV(RMSE) and Willmott index of agreement for crop-yield model comparison; the best crop-model CV(RMSE) was 0.18."
        cites: [palosuo2011]
    validated_when: "|PBIAS| <= 20% for yield magnitude, with positive EF/NSE or comparable temporal skill as supporting evidence."
    evidence_strength: moderate
    confidence: 0.65
    notes: "DayCent point studies use EF/RMSE more than PBIAS; the 20% band is transferred from DayCent regional yield benchmarking, so confidence is moderate."

  - dag_variable: "crop_yield (cgrain)"
    obs_shape: regional_aggregate_time_series
