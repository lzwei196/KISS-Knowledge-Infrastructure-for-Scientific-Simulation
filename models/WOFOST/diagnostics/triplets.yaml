- id: dt_019
  stage: s3_weather_prep
  failure_domain: protocol_gap
  symptom:
    description: 'FileNotFoundError for tools/extract_cmfd_weather.py, or ImportError: cannot import name
      load_cmfd_daily_all from ki_tools_common.netcdf_utils.'
    error_pattern: extract_cmfd_weather|load_cmfd_daily_all
    detection_method: log_match
  diagnosis:
    root_cause: SKILL.md named a tool file and a library function that never existed in this KI / in
      ki_tools_common.
    explanation: 'Both names were removed from SKILL.md on 2026-10-03. The real entry points are tools/s3_weather_prep/build_pcse_weather_from_source.py
      and ki_tools_common.load_forcing.load_daily_forcing (which the tool calls).

      '
    affected_components:
    - SKILL.md
  remedy:
    action: Use build_pcse_weather_from_source with --source cmfd (and --forcing_dir).
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - 'CMFD 3-hourly store on this server: KISSPATH_DATA/forcing/Data_forcing_03hr_010deg
      (about 50 s per point-year).'
    - 'Checked 2026-10-03: (36.5, 116.5) 2015 = 365 days, 617 mm rain, mean 15.7 degC.'
    prevention: List tools/ before trusting a tool name in a document.
  severity: fatal
  cross_references:
  - dt_018
  verified: '2026-10-03'
- id: dt_020
  stage: s3_weather_prep
  failure_domain: unit_conversion
  symptom:
    description: 'Rain reaching the model is 10x too low (dry soil, low rainfed yield) after following
      the old coupling text "RAIN = sum(PREC_3h) / 10.0  # mm -> cm" for a CSV weather file.'
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'docs/model_couplings.yaml carried coupling C1 "VIC Weather -> PCSE Weather Provider".
      It wrote a forcing shortcut down as a model coupling, and its formula divided rain by 10 for
      the CSV, against the CSV rule (the RAIN column is mm/day; the provider divides by 10 itself, dt_016).'
    explanation: 'C1 was removed on 2026-10-03. Couplings on RESULTS stay (C2 HWSD soil, C3 WOFOST-DSSAT
      ensemble, C4 WOFOST LAI to VIC vegetation). Weather is an input built from the data source, not
      a coupling.

      '
    affected_components:
    - docs/model_couplings.yaml
    - CSVWeatherDataProvider
  remedy:
    action: Keep RAIN in mm/day in the CSV. Build the file with build_pcse_weather_from_source.
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - 'Check: the yearly sum of the RAIN column equals the site''s rain in mm (see <output>.summary.json).'
    prevention: The unit table in workflow/workflow.md and docs/s3_weather_prep_skill.md gives CSV units
      only.
  severity: silent
  cross_references:
  - dt_016
  - dt_004
  verified: '2026-10-03'
- id: dt_021
  stage: s3_weather_prep
  failure_domain: protocol_gap
  symptom:
    description: 'An agent prepares VIC forcing files first (a model that is not being run) because
      the documents listed the VIC tool first; or preflight_check.py fails on a missing tools/s3_weather_prep/convert_vic_to_pcse_weather.py.'
    error_pattern: convert_vic_to_pcse_weather.py.*(missing|not found)
    detection_method: log_match
  diagnosis:
    root_cause: 'SKILL.md, workflow/workflow.md and docs/s3_weather_prep_skill.md listed the VIC tool
      first, had a "VIC Unit" column and an "Option D / Step 3: from VIC forcing"; preflight_check.py
      and knowledge_infrastructure.yaml required the VIC tool file. The Step 2 example header in the
      stage document was also in the style pcse cannot load.'
    explanation: 'All of these were changed on 2026-10-03: the documents and lists name build_pcse_weather_from_source,
      the unit tables give the shared loader''s units, and the example header is the loadable one.

      '
    affected_components:
    - SKILL.md
    - workflow/workflow.md
    - docs/s3_weather_prep_skill.md
    - preflight_check.py
  remedy:
    action: Follow docs/s3_weather_prep_skill.md Step 3 (build_pcse_weather_from_source). If a copy of
      a document still tells you to use VIC forcing for WOFOST weather, it is out of date.
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - Run preflight_check.py; it now requires build_pcse_weather_from_source.py.
    prevention: The KI has no tool that reads another model's input files.
  severity: silent
  cross_references:
  - dt_017
  verified: '2026-10-03'
- id: dt_022
  stage: s6_execution
  failure_domain: silent_error
  symptom:
    description: 'Several points give exactly the same yield, or a point keeps old weather after its
      CSV was rebuilt. No error.'
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'pcse CSVWeatherDataProvider keeps a pickle cache keyed on the CSV file''s BASENAME only
      and reuses it when the cache is newer than the CSV. Weather files with the same name in different
      folders (weather_pcse.csv per cell) can all load the first cell''s weather.'
    explanation: 'Seen in tools/calib_run.py development: all 15 cells returned one yield. The real-case
      runner escaped only because it rebuilt each CSV just before use.

      '
    affected_components:
    - CSVWeatherDataProvider
    - run_wofost_simulation
  remedy:
    action: Give every point its own weather file name, e.g. weather_pcse_<lat>_<lon>.csv.
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - 'Pass --output weather_pcse_<lat>_<lon>.csv (both run scripts do).'
    - 'When in doubt load with CSVWeatherDataProvider(path, force_reload=True).'
    prevention: Never reuse a weather file name for two points.
  severity: silent
  cross_references:
  - dt_018
  verified: '2026-10-03'
- id: dt_023
  stage: s3_weather_prep
  failure_domain: data_quality
  symptom:
    description: 'build_pcse_weather_from_source exits with code 2 and "REFUSED, nothing written".'
    error_pattern: REFUSED, nothing written
    detection_method: log_match
  diagnosis:
    root_cause: 'The source cannot give a complete daily record for the point and period: a missing
      or non-finite value, a time axis that is not one row per day, a period not fully covered (NASA
      POWER daily starts 1981 and answers HTTP 422 before that; CMFD is China only), or an impossible
      value (negative rain / radiation / wind, humidity or pressure <= 0, TMIN > TMAX).'
    explanation: 'The tool makes no values up. A gap filled by hand hides a source problem and moves
      the yield without a trace. Known limit: the shared NASA POWER loader itself turns a missing rain
      value into 0 and a missing Tmin/Tmax into Tmean before the tool sees them; the tool cannot catch
      those.

      '
    affected_components:
    - s3_weather_prep
  remedy:
    action: Read the message (it names the variable and the first bad day), then pick another source
      or period. Do not patch the file by hand.
    tool_to_run: build_pcse_weather_from_source
    manual_steps:
    - 'Outside China: --source mswx (local) or nasa_power. Before 1981: mswx (from 1979) or cmfd.'
    - 'nasa_power needs the network; a fetch error is also reported as REFUSED. Retry once, then say
      the source did not answer.'
    prevention: Check <output>.summary.json after every build.
  severity: fatal
  cross_references:
  - dt_017
  verified: '2026-10-03'
