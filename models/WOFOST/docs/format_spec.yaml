  severity: silent
- id: dt_009_csv_rain_mm_not_cm
  symptom: WOFOST yields are low / crop is chronically water-stressed when weather came through a CSVWeatherDataProvider
    CSV, even though SKILL.md says RAIN is cm/day. No error is raised.
  diagnosis: The CSV RAIN column was authored in cm. PCSE 6.0 CSVWeatherDataProvider divides the RAIN
    column by 10 to get the model's internal cm/day, so a cm-authored column is delivered 10x too low
    (100x if mm was first divided to cm per the old docs). Distinct from dt_004, which concerns a directly-built
    WeatherDataContainer.
  remedy: Author the CSVWeatherDataProvider RAIN column in mm/day (provider handles /10 -> cm). Likewise
    IRRAD in kJ (x1000 -> J), VAP in kPa (x10 -> hPa). Build the file with build_pcse_weather_from_source
    (RAIN = loader precip_mm) and trust create_csv_weather_file.py's docstring as ground truth.
- id: dt_010_hwsd_adapter_missing
  symptom: convert_hwsd_to_pcse_soil.py logs HWSD adapter failed (No module named skills, Using default
    texture) and every location returns the SAME texture (sand=40, clay=25), regardless of lat/lon.
  diagnosis: get_texture_from_hwsd imported skills.dssat_crop_run.hwsd_soil_adapter, which does NOT exist
    anywhere on the KDT 5.0 server (tools were removed from data_ki/skills). The import always raised
    ImportError and the except-branch silently returned a generic loam, so HWSD was never actually read.
  remedy: Use ki_tools_common.soil_utils.lookup_hwsd(lat, lon, hwsd_raster=...) instead — it does the
    rasterio MU_GLOBAL lookup -> HWSD_DATA.csv topsoil texture and returns sand/silt/clay/oc/bulk_density.
    Already patched in canonical tool 2026-06-08.
- id: dt_011_pp_mode_needs_soil
  symptom: 'Running SIMULATION_MODE=PP raises pcse.exceptions.ParameterError: Value for parameter SMFCF
    missing.'
  diagnosis: SKILL.md / run_wofost_simulation.py assumed PP (Potential Production) needs no soil and loaded
    soildata={} for PP. In PCSE 6.0 Wofost72_PP STILL requires the soil-hydraulic params (SMFCF, SM0,
    K0, RDMSOL...) at construction even though water is not limiting.
  remedy: Load the soil JSON for ALL modes (PP, WLP_FD, WLP_CWB). Pass a soil params file to run_wofost_simulation.py
    even for PP. Already patched in canonical tool 2026-06-08.
- id: dt_faostat_obs_shape
  symptom: WOFOST-vs-FAOSTAT-national run reports raw NSE/r/KGE as the headline and the pre-retry gate
    rejects the comparison as REJECT_WRONG_METRIC, OR the run loops retrying cultivar/forcing swaps trying
    to lift a structurally-negative raw NSE.
  diagnosis: A point or few-point WOFOST sim compared to a FAOSTAT NATIONAL yield series is the obs_shape
    regional_aggregate_time_series (dag.yaml outputs.TWSO.observability). The ONLY valid metric_families
    are [trend_match, magnitude_accuracy]. Raw inter-annual NSE/r/KGE are temporal_pattern_match metrics,
    INVALID here -- the national aggregate is spatially smoothed, partly irrigated, and rides a multi-decade
    technology trend a fixed-parameter weather-driven model cannot reproduce, so raw NSE/KGE are structurally
    very negative and raw r is low regardless of model quality. Swapping cultivar/forcing/parameters cannot
    rescue a structurally invalid measurement.
  remedy: Run tools/s8_yield_analysis/validate_against_faostat.py SIM_CSV CROP COUNTRY OUT_JSON [UNITS].
    It classifies obs_shape=regional_aggregate_time_series and reports magnitude_accuracy (pbias, decadal_mean_pbias,
    mean_abs_pct_err) plus trend_match (detrended r, first-difference r, trend-slope ratio) as the verdict,
    with raw NSE/r/KGE relegated to invalid_for_obs_shape. Report obs_shape in the run JSON so the gate
    uses the right family.
- id: dt_v007
  symptom: 'HISTORICAL bug (tool fixed 2026-09-12), but old-formula soil files can still exist: WLP/WLP_CWB
    runs were more water-stressed than they should be: low LAI, low transpiration, depressed yield, and
    simulated soil moisture (0.07-0.11) that could not be matched to any observed SM product. No error
    was raised; validate_soil_params.py passed. These signs are NOT specific to this bug (dry weather,
    a shallow RDMSOL, a wrong WAV or cultivar give the same picture), and the file date does NOT decide
    it: some copies of the stage-2 doc taught the old formula until 2026-10-16, so a soil file written
    by hand from those notes can be new and still wrong. Decide by the values (see remedy).'
  diagnosis: 'FIXED 2026-09-12. Before the fix, convert_hwsd_to_pcse_soil.py computed SMW/SMFCF/SM0/K0
    with a private formula (pedotransfer_wosten(), now renamed _legacy_linear_ptf() and NOT called) that
    was labelled ''Wosten et al. (1999)'' but was three ad-hoc linear forms; WP and FC came out ~0.4-0.6x
    published values. What the code does now: process() takes wilting_point / field_capacity / saturation
    / ksat_cm_hr from ki_tools_common.soil_utils.saxton_rawls (the hydraulics that lookup_hwsd returns
    for the HWSD route; a direct saxton_rawls call for the manual-texture route) and writes them as SMW
    / SMFCF / SM0 and K0 = ksat_cm_hr x 24 (cm/day). That shared function is a Rawls, Brakensiek & Saxton
    (1982) texture-class table, not the continuous Saxton & Rawls (2006) equations, and its om argument
    is not used. validate_soil_params.py still checks only ordering and fixed ranges, not values against
    texture class.'
  remedy: 'Check the soil JSON itself, whatever its date, and replace it ONLY on positive evidence of
    the old formula. (1) A .provenance.json sidecar whose ptf names ki_tools_common.soil_utils.saxton_rawls
    means the fixed tool made it: keep it. (2) Otherwise take the site texture (sand/clay/silt/OC %, bulk
    density) and call matches_legacy_formula(soil, sand, clay, silt, oc, bd) in tools/s2_soil_params/convert_hwsd_to_pcse_soil.py.
    It checks BOTH old formulas (the old tool, _legacy_linear_ptf, rounded 4/2 decimals, and the old Step-2
    doc formula, _legacy_doc_ptf, rounded 3/1 decimals; both kept, not called). If it returns legacy_tool
    or legacy_doc, it is an old-formula file: rebuild it with the tool and rerun water-limited (WLP/WLP_CWB)
    runs and anything derived from SMW/SMFCF (e.g. irrigation triggers) that used it. PP runs do not use
    the soil water balance. (3) If it returns None and the values do not match the current tool either,
    do NOT overwrite the file: it may hold measured or calibrated hydraulics. Keep it, find out where
    its values came from, and look at the other causes listed in the symptom. Still open and separate:
    a continuous Saxton-Rawls 2006 upgrade of the shared function and a texture-class range check in validate_soil_params.py.
    Consistency check: tests/test_dt_v007_status.py.'
  severity: critical
- id: dt_017
  symptom: 'A PCSE weather CSV made from VIC forcing files will not load (ValueError: malformed node or
    string), or it loads after a hand fix and holds the wrong variable in a column. An old note or script
    calls tools/s3_weather_prep/convert_vic_to_pcse_weather.py, which is no longer in the KI.'
  diagnosis: 'The KI used to make WOFOST weather out of another model''s input (VIC forcing files + the
    VIC basin_grid.nc). That tool read the columns as PREC TMAX TMIN WIND SW LW VP PRESS, which is not
    the column order of this server''s VIC forcing files, and it wrote a header with unquoted text and
    trailing comments ("Country = VIC_grid_cell", "Longitude = -93.5; decimal degrees"), DAY as YYYY-MM-DD
    and SNOWDEPTH -999. pcse 6.0.12 runs ast.literal_eval on each header value and stops on the first
    unquoted word (checked with a file in that header style).; Owner rule 2026-10-02: a model KI builds
    its input straight from the data source with its own tool; it must not turn another model''s input
    files into its own. The tool was moved to models/WOFOST/_removed_vic_input_tools_20261002/ on 2026-10-03.
    It is not to be restored.

    ; [''s3_weather_prep'', ''CSVWeatherDataProvider'']'
  remedy: Build the weather file from the data source with build_pcse_weather_from_source (--source cmfd|mswx|nasa_power).
    Do not read VIC forcing files for WOFOST.; build_pcse_weather_from_source; ['python tools/s3_weather_prep/build_pcse_weather_from_source.py
    --source <cmfd|mswx|nasa_power> --lat <lat> --lon <lon> --elev <m> --start_year <y0> --end_year <y1>
    [--forcing_dir <dir>] --output weather_pcse_<lat>_<lon>.csv', 'Read <output>.summary.json and check
    annual rain and mean temperature for the site.', 'Load it with CSVWeatherDataProvider (run_wofost_simulation
    does this).']; Weather for WOFOST comes only from build_pcse_weather_from_source (products) or create_csv_weather_file
    (your own station table). Both write the file through write_pcse_csv.
  severity: fatal
- id: dt_018
  symptom: An agent following the stage documents finds no tool that takes CMFD / MSWX / NASA POWER to
    a PCSE weather file, and writes its own script around load_daily_forcing (own VAP formula, own CSV
