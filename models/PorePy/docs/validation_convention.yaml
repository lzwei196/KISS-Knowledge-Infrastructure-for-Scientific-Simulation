        pass_band: satisfactory
        band_note: "Das 2019 reproduces the streamflow criterion PBIAS +/- 25%; use only when Darcy/interface flux is aggregated to the same sign and support as observed flow."
        cites: [das2019]
    secondary_metrics:
      - metric: relative_l2_error
        direction: minimize
        status: supportive
        ceiling_reason: "Fractured-flow benchmark papers judge flux/pressure solutions against fine-grid reference solutions and approximation errors."
        cites: [flemisch2017, berre2020]
    validated_when: "NSE >= 0.5 and |PBIAS| <= 25% for comparable flow-rate time series; otherwise defer to reference-solution error because PorePy flux validation is benchmark-based."
    evidence_strength: moderate
    confidence: 0.55
    notes: "This is a transferred hydrologic convention, not a PorePy-specific field flux threshold. Keep both time-pattern and magnitude diagnostics because the dag lists temporal and magnitude metric families."

