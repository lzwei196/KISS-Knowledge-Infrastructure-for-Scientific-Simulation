safety:
  hazards:
    - id: "domain_size_unit_meters"
      kind: "control_semantic"
      description: "domainSize authored in km or cm instead of meters produces a million-fracture explosion or a microscopic domain (segfault/out-of-memory) (dt_001)."
      severity: "silent"
    - id: "permeability_vs_conductivity"
      kind: "coefficient_runtime_silent_fallback"
      description: "Hydraulic conductivity K (m/s) used directly as intrinsic permeability k (m^2) overestimates velocity by ~7 orders of magnitude; correct conversion k=K*mu/(rho*g)~K*9.1e-8 for water at 20C (dt_002)."
      severity: "silent"
    - id: "pressure_unit_pascals"
      kind: "control_semantic"
      description: "Graph-flow pressure boundary conditions entered in MPa or psi instead of Pa shift velocities by 3-6 orders of magnitude (dt_003)."
      severity: "silent"
    - id: "aperture_unit_meters"
      kind: "coefficient_runtime_silent_fallback"
      description: "Aperture in micrometers without conversion to meters; cubic law k=b^2/12 amplifies the error quadratically into near-zero permeability and flow (dt_005)."
      severity: "silent"
    - id: "matrix_diffusivity_unit"
      kind: "coefficient_runtime_silent_fallback"
      description: "TDRW matrix diffusivity in cm^2/s instead of m^2/s is off by 1e4, producing extreme matrix retardation (dt_012)."
      severity: "silent"
    - id: "mesh_h_vs_min_radius"
      kind: "numerical_instability"
      description: "Mesh resolution h larger than the smallest fracture radius yields degenerate/zero-area LaGriT elements and a meshing crash; require h < 0.5*min_radius (dt_004)."
      severity: "fatal"
    - id: "degenerate_coplanar_mesh"
      kind: "numerical_instability"
      description: "Nearly coplanar or very close fractures, or an intersection short relative to h, produce degenerate LaGriT triangles and mesh merge/missing-edge failures (common at high p32 or large h); reduce h, increase min_radius, prune problematic fractures, or use graph mode (dt_013)."
      severity: "fatal"
    - id: "no_percolating_path"
      kind: "control_semantic"
      description: "No connected fracture path between inlet and outlet faces (low p32, small fractures, wrong boundary faces, or largest-cluster pruning) gives zero velocity and no particle arrivals (dt_006)."
      severity: "fatal"
    - id: "boundary_face_convention_mismatch"
      kind: "control_semantic"
      description: "Three boundary-face conventions coexist (positional list, graph-flow string names, 1-based DFNTrans index); mixing them releases flow at the wrong face and corrupts the breakthrough curve (dt_007)."
      severity: "degraded"
    - id: "fisher_kappa_too_low"
      kind: "coefficient_runtime_silent_fallback"
      description: "Fisher kappa set too low gives near-random orientations and overestimates network connectivity despite clustered field data (dt_008)."
      severity: "silent"
    - id: "zero_aperture_cells"
      kind: "numerical_instability"
      description: "Zero-aperture fractures produce zero-volume Voronoi cells, causing division-by-zero (NaN/inf) in the flow solver; enforce a minimum aperture (dt_014)."
      severity: "silent"
    - id: "p32_target_unreachable"
      kind: "control_semantic"
      description: "p32 target unreachable for the domain size / max_radius drives >99% rejection and effectively non-terminating generation (dt_011)."
      severity: "degraded"
    - id: "subthreshold_edge_drop"
      kind: "numerical_instability"
      description: "Graph-flow edges with pressure drop <= 1e-16 Pa are silently removed from the directed flow graph before transport, dropping near-stagnant connections."
      severity: "silent"
    - id: "flux_weighted_release_bias"
      kind: "control_semantic"
      description: "Flux-weighted particle initialization biases breakthrough toward fast flow paths (correct for flux-averaged C, not resident concentration); init_nf gives unbiased per-fracture sampling (dt_016)."
      severity: "silent"
    - id: "per_family_array_mismatch"
      kind: "parser_semantic"
      description: "Per-family array lengths not matching nFamEll/nFamRect in the legacy input format make DFNGen read wrong values or crash (dt_015)."
      severity: "degraded"
  validation_limits:
    - "Graph mode assumes 1-D flow along intersection segments with complete mixing at intersections and no matrix diffusion (except via the TDRW extension); it systematically differs ~30% from full-physics and is intended for sensitivity/UQ/screening, not detailed spatial prediction."
    - "dfnTrans solves only advective transport; dispersion, sorption, and matrix diffusion are not native solved processes and must be added by post-processing or the TDRW extension."
    - "Steady-state flow only; no transient hydrologic timestepping of a state vector."
    - "Matrix (rock-block) flow is not represented; the model resolves the fracture continuum only."
    - "Particle tracking requires locally mass-conserving (control-volume/finite-volume) flow solutions; Galerkin finite-element flow solutions are unsuitable."
  warnings:
    - "graph-flow default phi=1 makes edge velocity equal Darcy flux; if not overridden it directly scales all particle travel times."
    - "seed==0 substitutes a clock-based seed at runtime, so identical inputs yield a different network and divergent travel-time distributions across runs; cross-run validation requires seed>0."
    - "Graph mode and full-physics mode give systematically different breakthrough and effective-permeability results (~30%) and should not be cross-compared directly."
    - "PFLOTRAN recommended over FEHM when the network exceeds O(1000) fractures."
    - "full_mesh.uge cell volumes are not correct as emitted and must be converted (convert_uge) before use in PFLOTRAN flow."
  assumptions:
    - statement: "The principal carried state is steady-state spatial structure (network geometry + flow field); time enters only as particle travel time, so the model is treated as event/steady-state rather than transient."
      scope: "temporal representation of the whole workflow"
      source: "dfnWorks dfnTrans documentation (dfnworks.lanl.gov/dfntrans.html) and Hyman et al. 2015 framework paper"
      status: "adopted"
    - statement: "Mass-balance closure is on water flux; particle tracking relies on locally mass-conserving control-volume flow, and there is no surface energy budget."
      scope: "closure"
      source: "dfnWorks dfnFlow/dfnTrans documentation (locally mass-conserving control-volume flow solutions)"
      status: "adopted"
    - statement: "The HydroCraft-exercised binding is the graph-mode flow/transport path (self-contained, no external LaGriT/PFLOTRAN); full-physics modules are present but external and not in-repo for numerics."
      scope: "which implementation branch this dag primarily describes"
      source: "pydfnworks dfnGraph package (graph_flow.py, graph_transport.py) in the dfnWorks source repo"
      status: "tentative"
    - statement: "Solute is a non-reactive conservative tracer represented as indivisible passive particles that do not interact with one another or the fracture network."
      scope: "transport process semantics"
      source: "dfnWorks dfnTrans documentation (dfnworks.lanl.gov/dfntrans.html)"
      status: "adopted"

