        - "Discard output files from spinup months"
        - "Or: save RESTART at end of spinup, use for real run"
      prevention: "Always include spinup period; expect 237 mm/d artifact on day 1"
    severity: "degraded"
    cross_references: ["dt_019"]
    verified: "2026-03-20"

  - id: dt_v015
    stage: "s1_domain"
    failure_domain: "silent_error"
    symptom:
      description: "WRF-Hydro produces near-zero discharge and negative correlation with VIC for small mountainous basins at 0.25°"
      error_pattern: "r < 0|NSE < 0|Q_ratio < 0.3"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "0.25° resolution too coarse for basins < 10,000 km² — orographic precipitation and terrain runoff smoothed out"
      explanation: >
        At 0.25° (~28km), small basins like Chaohe (8,783 km²) have only ~11 LSM cells.
        Mountainous terrain is averaged, orographic precipitation enhancement is lost,
        and the basin's hydrological response is diluted. Bengbu (121,330 km², flat) works
        well at 0.25° (r=0.84) because the landscape scale matches the grid.
        Tested: Chaohe 0.25° gives r=-0.10, Q=6 m³/s vs VIC 27 m³/s (literature 31-47).
      affected_components: ["s1_domain"]
    remedy:
      action: "Use dx_deg=0.1 or finer for basins < 10,000 km²"
      tool_to_run: "run_wrfhydro_full_pipeline"
      manual_steps:
        - "For basins < 10,000 km²: --dx_deg 0.1 (CMFD native resolution)"
        - "For basins < 1,000 km²: --dx_deg 0.05 or --dx_m 1000"
        - "Rule of thumb: need >= 100 LSM cells for meaningful results"
      prevention: "Pipeline auto-warns when basin has < 50 LSM cells"
    severity: "silent"
    cross_references: []
    verified: "2026-03-20"

  - id: dt_v016
    stage: "s4_fulldom"
    failure_domain: "silent_error"
    symptom:
      description: "Zero or very few channel cells when stream_threshold exceeds max FLOWACC for small/coarse basins"
      error_pattern: "Channel cells: 0|no channel|CHRTOUT empty"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "Fixed stream_threshold doesn't scale with basin size or routing grid resolution"
      explanation: >
        At coarse routing grids (e.g., 0.25° with AGGFACTRT=4 → 7km routing cells),
        small basins have very few routing cells (Chaohe: 170). Max FLOWACC=86, so
        threshold=100 produces zero channels. Even threshold=20 gives only 29 cells
        with max order 2. Without channels, surface runoff can't reach the outlet,
        and discharge is dominated by the GW bucket model.
      affected_components: ["s4_fulldom", "s10_execution"]
    remedy:
      action: "Use flow-based threshold (USGS method) or scale-aware area threshold"
      tool_to_run: "build_fulldom_hires"
      manual_steps:
        - "USGS method: threshold where accumulated_runoff >= 0.028 m³/s (1 cfs)"
        - "Scale-aware: threshold = max(5, basin_routing_cells * 0.03)"
        - "Verify: need stream order >= 3-4 for basins > 1000 km²"
      prevention: "build_fulldom_hires.py should auto-compute threshold from basin area"
    severity: "silent"
    cross_references: ["dt_v015"]
    verified: "2026-03-20"

  - id: dt_v017
    stage: "s10_execution"
    failure_domain: "silent_error"
    symptom:
      description: "WRF-Hydro discharge inversely correlated with VIC — highest Q in winter, lowest in summer"
      error_pattern: "r < 0|winter Q > summer Q"
      detection_method: "value_comparison"
    diagnosis:
      root_cause: "GW bucket model dominates when channel network is too sparse"
      explanation: >
        With few channel cells, surface runoff (infxsrt) has nowhere to go. Streamflow
        is dominated by the GW bucket (Coeff=1, Expon=3, Zmax=50mm). In summer, high ET
        depletes soil moisture → less GW recharge → less Q. In winter, low ET → more GW
        → more Q. This inverts the monsoon seasonal cycle. The fix is either more channels
        or different GW parameters.
      affected_components: ["s6_groundwater", "s10_execution"]
    remedy:
      action: "Fix channel network first (dt_v016). If still inverted, tune GW: Coeff=5-10, Expon=1.5-2"
      tool_to_run: ""
      manual_steps:
        - "First: fix stream_threshold to get proper channel network"
        - "If still inverted: increase GWBUCKPARM Coeff from 1.0 to 5-10"
        - "Decrease Expon from 3.0 to 1.5-2.0 (flatter release curve)"
        - "Increase Zmax from 50 to 200-500 mm (more storage capacity)"
      prevention: "Monitor seasonal Q cycle in first-year output before running multi-year"
    severity: "silent"
    cross_references: ["dt_v016"]
    verified: "2026-03-20"

  - id: dt_v018
    stage: "s9_namelists"
    failure_domain: "silent_error"
