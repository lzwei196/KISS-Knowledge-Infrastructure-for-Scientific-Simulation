  remedy: 'Initialize kd = 0.1 and ka = 0.5 (ka/kd ratio ~ 5); add guard for |ka - kd| < 0.01; run_wasp;
    [''Ensure ka > kd by at least 0.05 in initial parameter guess'', "Add regularization: if |ka - kd|
