        description: "Basin grid NetCDF for cell coordinates"
        required: true
        example: ""
    outputs:
      - name: "gridded_yield_csv"
        type: "file"
        description: "CSV with lat, lon, twso_kgha, tagp_kgha, lai_max"
        path_pattern: "outputs/{run}/wofost/gridded_yield.csv"
    preconditions:
      - "All cell simulations completed"
    postconditions:
      - "One row per grid cell; TWSO > 0 for most cells"

  - id: "compare_wofost_dssat"
    name: "Compare WOFOST vs DSSAT Yields"
    description: "Compare WOFOST and DSSAT gridded yield outputs for multi-model ensemble analysis"
    stage: "s8_yield_analysis"
    script_path: "tools/s8_yield_analysis/compare_wofost_dssat.py"
