validation:
  - dag_variable: QRUNOFF
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.80, good: 0.70, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "Watershed-scale flow table: 'NSE > 0.50' is satisfactory."
        cites: [moriasi2015, arnold2012]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 5.0, good: 10.0, satisfactory: 15.0}
        pass_band: satisfactory
        band_note: "Watershed-scale flow table: 'PBIAS <= +/-15%' is satisfactory."
        cites: [moriasi2015]
    secondary_metrics:
      - metric: r2
        direction: maximize
        status: supportive
        ceiling_reason: "Moriasi 2015 recommends R2 with NSE and PBIAS for daily, monthly, and annual flow, but it is not the DAG determining metric."
        cites: [moriasi2015]
    validated_when: "Routed QRUNOFF is validated against gauge streamflow when NSE >= 0.50 and |PBIAS| <= 15%."
    evidence_strength: strong
    confidence: 0.85
    notes: "ELM QRUNOFF is runoff per land column; the DAG caveat still applies: compare to gauges only after routing. Moriasi 2015 says flow includes streamflow, surface runoff, base flow, and tile flow; Arnold 2012 says NSE and R2 are widely reported and reproduces the Moriasi satisfactory NSE convention."

  - dag_variable: QRUNOFF
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched ELM/land-surface paper gives a numeric CSI pass band for gridded runoff."
        cites: []
    secondary_metrics:
      - metric: ilamb_score
        direction: maximize
        status: supportive
        ceiling_reason: "ILAMB evaluates runoff with bias, RMSE, spatial distribution, interannual variability, and seasonal-cycle scores; Collier 2018 explicitly says aggregate scores are not a determinant of good or bad models."
        cites: [collier2018, bisht2018]
    validated_when: "UNRESOLVED - use gridded runoff maps diagnostically; no cited CSI threshold was fetched."
    evidence_strength: weak
    confidence: 0.35
    notes: "Kumar 2012 lists CSI, ETS, POD, FAR, NSE, bias, RMSE, and correlation as supported land-surface verification metrics, but gives no numeric CSI band. Bisht 2018 reports ELM-VSFM surface-runoff ILAMB scores around 0.50-0.52, but ILAMB scores are relative diagnostics, not pass/fail thresholds."

  - dag_variable: QDRAI
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {very_good: 0.80, good: 0.70, satisfactory: 0.50}
        pass_band: satisfactory
        band_note: "Transferred from Moriasi watershed-scale flow criteria; footnote includes base flow and tile flow."
        cites: [moriasi2015]
      - metric: pbias
        direction: zero_centered
        unit: percent
        bands: {very_good: 5.0, good: 10.0, satisfactory: 15.0}
        pass_band: satisfactory
        band_note: "Transferred from Moriasi watershed-scale flow PBIAS criteria."
        cites: [moriasi2015]
    secondary_metrics: []
    validated_when: "QDRAI is validated only where a defensible drainage/baseflow observation or separation target exists: NSE >= 0.50 and |PBIAS| <= 15%."
    evidence_strength: moderate
    confidence: 0.65
    notes: "Direct drainage observations are rare; this is a transferred hydrologic-flow convention, not a QDRAI-specific field threshold."

  - dag_variable: H2OSOI
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched soil-moisture model-validation paper gives an NSE threshold."
        cites: []
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "Reichle 2010 says soil-moisture applications commonly use RMSE and r, but that the paper's purpose is not to define a numerical measurement requirement."
        cites: [reichle2010]
      - metric: r
        direction: maximize
        status: supportive
        ceiling_reason: "Reichle 2010 emphasizes r as phasing/coherence and RMSE as closeness; no universal pass threshold is supplied."
        cites: [reichle2010]
    validated_when: "UNRESOLVED - match model and probe layer depths; no cited NSE pass band was fetched."
    evidence_strength: weak
    confidence: 0.30
    notes: "Reichle 2010 explicitly frames RMSE and correlation for soil-moisture requirements but says it is not defining a numerical value. LVT supports RMSE, bias, correlation, and NSE for land-surface states."

  - dag_variable: H2OSOI
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched land-surface or soil-moisture paper gives a numeric CSI pass band for gridded soil moisture."
        cites: []
    secondary_metrics:
      - metric: ubrmse
        direction: minimize
        status: supportive
        ceiling_reason: "Reichle 2010 discusses unbiased RMSE for soil-moisture anomalies and metric interpretation; it does not provide a universal pass value."
        cites: [reichle2010]
    validated_when: "UNRESOLVED - compare shallow model layer to satellite/top-layer retrievals, but do not auto-validate on CSI without a cited band."
    evidence_strength: weak
    confidence: 0.30
    notes: "Kumar 2012 lists CSI as a supported verification score, while Reichle 2010 warns that sensible soil-moisture targets are application dependent."

  - dag_variable: EFLX_LH_TOT
    obs_shape: point_time_series
    headline_metrics:
      - metric: nse
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: 0.734}
        pass_band: satisfactory
        band_note: "Tramontana 2016 reports latent-heat MEF = 0.734-0.739 for FLUXNET machine-learning benchmarks; MEF is used here as the NSE-family target."
        cites: [tramontana2016]
    secondary_metrics:
      - metric: rmse
        direction: minimize
        status: supportive
        ceiling_reason: "Tramontana 2016 reports LE RMSE in energy-flux units; ELM's W/m2 point comparisons need consistent temporal aggregation before using RMSE."
        cites: [tramontana2016]
      - metric: ilamb_score
        direction: maximize
        status: supportive
        ceiling_reason: "Bisht 2018 reports ELM latent-heat ILAMB scores against FLUXNET and GBAF, but Collier 2018 cautions ILAMB aggregate scores are not pass/fail."
        cites: [bisht2018, collier2018]
    validated_when: "Latent heat point series should reach FLUXNET empirical benchmark skill: NSE/MEF >= 0.734."
    evidence_strength: moderate
    confidence: 0.60
    notes: "Tramontana 2016 table A1 reports LE MEF 0.739 for remote-sensing inputs and 0.734 with meteorological inputs; this is a benchmark target, not a tiered universal convention."

  - dag_variable: EFLX_LH_TOT
    obs_shape: spatial_time_series
    headline_metrics:
      - metric: csi
        direction: maximize
        unit: dimensionless
        bands: {satisfactory: null}
        pass_band: satisfactory
        band_note: "No fetched land-surface energy-flux benchmark gives a CSI pass band."
        cites: []
    secondary_metrics:
      - metric: ilamb_score
        direction: maximize
        status: supportive
        ceiling_reason: "ILAMB reports bias, RMSE, spatial pattern, and aggregate scores for latent heat; aggregate scores are diagnostic rather than pass/fail."
        cites: [collier2018, bisht2018]
    validated_when: "UNRESOLVED - use ILAMB-style spatial diagnostics, but no numeric CSI gate is literature-grounded."
    evidence_strength: weak
    confidence: 0.35
    notes: "Bisht 2018 reports LH bias/RMSE/ILAMB score against FLUXNET and GBAF; no CSI threshold is reported."

  - dag_variable: FSH
