# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: WRF_Hydro
  language: fortran
  implementation:
    id: wrf-hydro-standalone-520
    version: 5.2.0
    provenance: Fortran 90, MPI-parallel; NCAR WRF-Hydro/NDHMS standalone (offline) binary wrf_hydro.exe
      run via mpirun, no WRF atmospheric coupling.
  scientific_reference_version: WRF-Hydro v5.2.0 standalone/offline (Noah-MP LSM + gridded overland/subsurface/channel
    routing + conceptual groundwater bucket; NCAR NDHMS architecture)
inputs:
  forcing:
  - name: RAINRATE (liquid precipitation rate)
    unit: mm/s (kg/m^2/s)
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF per-timestep on LSM grid (YYYYMMDDHH.LDASIN_DOMAIN1)
    notes: Hourly (FORCING_TIMESTEP=3600); dominant driver of streamflow/flood response.
  - name: T2D (2-m air temperature)
    unit: K
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF
    notes: Typical range 230-330 K.
  - name: PSFC (surface pressure)
    unit: Pa
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF
    notes: Typical range 50000-110000 Pa.
  - name: SWDOWN (incoming shortwave radiation)
    unit: W/m^2
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF
    notes: Physically capped at the ~1361 W/m^2 solar constant.
  - name: LWDOWN (incoming longwave radiation)
    unit: W/m^2
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF
  - name: Q2D (specific humidity)
    unit: kg/kg
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF
  - name: U2D (near-surface wind, u-component)
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF
  - name: V2D (near-surface wind, v-component)
    unit: m/s
    category: forcing
    source_kind: forcing
    model_input_format: LDASIN NetCDF
  parameters:
  - name: REFKDT
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: soil_properties.nc (per cell)
    notes: 'Infiltration vs surface-runoff partition; #1 calibration parameter. Default 3.0; reduce to
      0.3-1.0 for thin-soil mountain/semi-arid basins.'
  - name: Soil hydraulic properties (SMCMAX, SMCREF, SMCWLT, DKSAT/SATDK, BEXP, SLOPE)
    unit: various (m^3/m^3, m/s, -)
    category: parameter
    source_kind: dataset_lookup
    model_input_format: soil_properties.nc, SOILPARM.TBL
    notes: SMCMAX (max soil moisture) strongly influences flood generation.
  - name: NEXP (transmissivity depth-decay exponent)
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: subsurface routing parameter
    notes: Power-law exponent (default 1.0) for Ksat decay with depth in subsurface transmissivity T=(Ksat*D/n)(1-z/D)^n.
  - name: LKSATFAC (saturated conductivity multiplier)
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: hydro2dtbl.nc / routing params
  - name: OV_ROUGH / OVROUGHRTFAC (overland Manning roughness and scale factor)
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: HYDRO.TBL (by USGS land class); OVROUGHRTFAC in Fulldom_hires.nc / hydro.namelist
    notes: Default factor 1.0, range 0.1-10; controls overland flow speed and peak delay.
  - name: RETDEPRTFAC (surface retention depth factor)
    unit: '-'
    category: parameter
    source_kind: calibrated
    model_input_format: Fulldom_hires.nc / hydro.namelist
  - name: Channel geometry/roughness by Strahler order (Bw, ChSSlp, MannN, HLINK)
    unit: m, -, s/m^(1/3)
    category: parameter
    source_kind: dataset_lookup
    model_input_format: CHANPARM.TBL (gridded channel_option=3); Route_Link.nc (reach-based channel_option=1/2)
    notes: MannN channel roughness controls hydrograph peak timing and attenuation; default ~0.02-0.09
      by order.
  - name: GW bucket parameters (Coeff C, Expon E, Zmax, Zinit)
    unit: 'C: m^3/s, E: -, Zmax/Zinit: mm'
    category: parameter
    source_kind: calibrated
    model_input_format: GWBUCKPARM.nc (per GW basin)
    notes: Exponential law Q=C(exp(E*z/Zmax)-1). Default Zmax 50 mm is too shallow for deep-aquifer basins
      (raise to 200-500); recommended Coeff ~0.04.
  - name: Lake level-pool parameters (WeirC/L/E, OrificeC/A/E, LkArea, LkMxE)
    unit: various
    category: parameter
    source_kind: dataset_lookup
    model_input_format: LAKEPARM.nc
    notes: Weir Qw=Cw*L*h^(3/2), orifice Qo=Co*Oa*sqrt(2gh); constant surface area assumed.
  - name: stream_threshold (flow-accumulation channel-definition threshold)
    unit: cells or cfs
    category: parameter
    source_kind: user_provided
    model_input_format: drives CHANNELGRID / STREAMORDER in Fulldom_hires.nc
    notes: Defines channel network density; must scale with basin size and routing resolution.
  initial_conditions:
  - name: Soil moisture (SMOIS / SOIL_M), 4 Noah layers
    unit: m^3/m^3
    category: initial_condition
    source_kind: user_provided
    model_input_format: wrfinput_d01.nc / RESTART
    notes: Cold-start at field capacity over-generates ~237 mm/d day-1 runoff; discard 6-12 month spinup
      or reuse a RESTART.
  - name: Soil temperature (TSLB / SOILTEMP/TMN), 4 layers
    unit: K
    category: initial_condition
    source_kind: user_provided
    model_input_format: wrfinput_d01.nc
    notes: Must be non-zero (use 280-290 K); 0 K propagates NaN through the soil energy balance.
  - name: Snow water equivalent (SNEQV)
    unit: kg/m^2 (mm)
    category: initial_condition
    source_kind: user_provided
    model_input_format: wrfinput_d01.nc / RESTART
    notes: Cold start needs a full winter to accumulate.
  - name: GW bucket storage (z_gwsubbas, init = Zinit)
    unit: mm
    category: initial_condition
    source_kind: user_provided
    model_input_format: GWBUCKPARM.nc Zinit
    notes: Conceptual reservoir depth; needs months to equilibrate from cold start.
  boundary_conditions:
  - name: RUNOFF_OPTION (runoff-generation scheme selector)
    unit: enum 1-5
    category: boundary_condition
    source_kind: user_provided
    model_input_format: namelist.hrldas
    notes: 1=SIMGM TOPMODEL, 2=SIMTOP, 3=Schaake96 infiltration-excess (default/only globally crash-safe),
      4=BATS, 5=Xinanjiang/VIC (needs MMF_RUNOFF_FILE).
  - name: channel_option (channel routing method selector)
    unit: enum 1/2/3
    category: boundary_condition
    source_kind: user_provided
    model_input_format: hydro.namelist
    notes: 3=gridded diffusive wave (default); 1=Muskingum, 2=Muskingum-Cunge (require UDMP_OPT=1 + Route_Link.nc
      + spatialweights.nc).
  - name: GWBASESWCRT (groundwater scheme selector)
    unit: enum 0/1/2/4
    category: boundary_condition
    source_kind: user_provided
    model_input_format: hydro.namelist
    notes: 1=exponential bucket (default), 2=pass-through, 4=area-dependent exponential (needs UDMP_OPT=1);
      0 disables bucket and breaks water balance.
  - name: Routing activation switches (OVRTSWCRT, SUBRTSWCRT, CHANRTSWCRT, rt_option)
    unit: enum
    category: boundary_condition
    source_kind: user_provided
    model_input_format: hydro.namelist
    notes: rt_option=1 (D8 steepest descent) is the only active overland scheme; rt_option=2 (CASC2D)
      is inactive in v5.2.0.
  - name: lake_option (lake/reservoir routing selector)
    unit: enum 0/1/2
    category: boundary_condition
    source_kind: user_provided
    model_input_format: hydro.namelist
    notes: 0=disabled, 1=level pool, 2=pass-through.
  - name: UDMP_OPT (user-defined mapping toggle)
    unit: enum 0/1
    category: boundary_condition
    source_kind: user_provided
    model_input_format: hydro.namelist
    notes: Required (=1) for reach-based routing, area-dependent bucket, and compound channel.
  - name: Grid/timestep coupling (DXRT, DTRT_CH, DTRT_TER, AGGFACTRT)
    unit: m, s, s, ratio
    category: boundary_condition
    source_kind: user_provided
    model_input_format: hydro.namelist
    notes: AGGFACTRT = Fulldom_x / wrfinput_x; DTRT must satisfy CFL DTRT_CH < DXRT/V_max.
  - name: Run control (KHOUR, OUTPUT_TIMESTEP, RESTART_FREQUENCY_HOURS, CHRTOUT_DOMAIN, MMINLU)
    unit: various
    category: boundary_condition
    source_kind: user_provided
    model_input_format: namelist.hrldas / hydro.namelist
    notes: MMINLU must be 'USGS'; CHRTOUT_DOMAIN=1 required to emit channel discharge.
outputs:
  primary:
  - name: streamflow
    unit: m^3/s
    description: Routed channel discharge at each channel cell/reach; the correct and only source for
      basin outlet discharge (outlet = highest cumulative streamflow / Strahler order).
    validation_rank: 1
    emitted_in: CHRTOUT_DOMAIN1
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Compare at the gauge-matched channel feature, not basin-averaged LDASOUT runoff.
        - Discard cold-start spinup (6-12 months) before scoring; day-1 produces a ~237 mm/d artifact.
        - Sparse channel networks let the GW bucket dominate, which can invert the seasonal cycle (winter>summer).
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Single-instant peak-discharge comparison is sensitive to routing-timestep and CFL settings.
      detrending_options:
      - none
  - name: SOIL_M
    unit: m^3/m^3
    description: Volumetric soil moisture, 4 Noah layers (0-10, 10-40, 40-100, 100-200 cm).
    validation_rank: 3
    emitted_in: LDASOUT_DOMAIN1
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Layer depths must be matched to the observation depth; surface satellite retrievals correspond
          to the top layer only.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Compare on the LSM grid; retrieval footprint and grid resolution must be reconciled.
      detrending_options:
      - none
  - name: SNEQV
    unit: kg/m^2
    description: Snow water equivalent (Noah-MP snowpack state).
    validation_rank: 4
    emitted_in: LDASOUT_DOMAIN1
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - timing_accuracy
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Cold start needs a full winter to accumulate; early-season SWE is unreliable.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Compare against snow-cover/SWE products on the LSM grid.
      detrending_options:
      - none
  - name: ACCET
    unit: mm
    description: Accumulated evapotranspiration (transpiration + soil evaporation + canopy evaporation);
      instantaneous latent-heat flux LH also available (ET = LH/2.5e6 in mm/s).
    validation_rank: 5
    emitted_in: LDASOUT_DOMAIN1
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Accumulator must be differenced to a flux for comparison against flux-tower or remote-sensing
          ET.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        determining_metric: csi
        caveats:
        - Compare against gridded ET products (e.g. remote-sensing ET) on the LSM grid.
      detrending_options:
      - none
  - name: z_gwsubbas
    unit: mm
    description: Water depth in each conceptual groundwater bucket (not a physical water table); GWOUT
      also emits recharge (qin), baseflow (qout), and loss (qloss).
    validation_rank: 2
    emitted_in: GWOUT_DOMAIN1
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: r
        caveats:
        - Conceptual storage, not a measurable water table; at best compared qualitatively against baseflow
          recession behaviour.
        - Default Zmax 50 mm fills within days on large basins, producing pass-through with no recession
          dynamics.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: WRF-Hydro crashes at startup during routing initialization with 'Apparent error in network
    topology'. The error occurs when reading the Fulldom_hires.nc FLOWDIRECTION grid.
  diagnosis: 'Boundary cells in Fulldom_hires.nc have non-zero FLOWDIRECTION values pointing outside the
    grid domain.; WhiteboxTools D8 pointer assigns flow directions to all cells including boundary cells.
    When these boundary cells have flow directions pointing outside the grid (e.g., a cell on the eastern
    edge '
  remedy: Set FLOWDIRECTION=0 for all boundary cells in Fulldom_hires.nc; build_fulldom_hires; ['Open
    Fulldom_hires.nc with netCDF4 in write mode', "fdir = ds['FLOWDIRECTION'][:]; fdir[0,:]=0; fdir[-1,:]=0;
    fdir[:,0]=0; fdir[:,-1]=0", "ds['FLOWDIRECTION'][:] = fdir; ds.close()"]; build_fulldom_hires.py automa
  severity: fatal
- id: dt_002
  symptom: WRF-Hydro crashes at startup with 'Unable to get x resolution in LAND spatial metadata file'.
    The error occurs when reading GEOGRID_LDASOUT_Spatial_Metadata.nc.
  diagnosis: The x and/or y coordinate variables in GEOGRID_LDASOUT_Spatial_Metadata.nc are missing the
    'resolution' attribute.; WRF-Hydro reads the grid spacing from the 'resolution' attribute of the x
    and y coordinate variables in the spatial metadata file. Standard netCDF conventions do not require
    this attri
  remedy: 'Add ''resolution'' attribute to x and y coordinate variables in both files; ; [''import netCDF4
    as nc'', "ds = nc.Dataset(''GEOGRID_LDASOUT_Spatial_Metadata.nc'', ''a'')", "ds[''x''].resolution
    = float(dx)  # e.g., 1000.0", "ds[''y''].resolution = float(dx)", ''ds.close()'', ''Repeat for Fulldom_hires.nc
    with dxrt'
  severity: fatal
- id: dt_003
  symptom: WRF-Hydro crashes at startup with 'Unable to find x coordinate in FullDom file'. Occurs when
    reading Fulldom_hires.nc.
  diagnosis: Fulldom_hires.nc is missing the x and/or y coordinate variables entirely, or the variables
    exist but lack the 'resolution' attribute that WRF-Hydro uses to locate them.; WRF-Hydro searches
    for 1D coordinate variables named 'x' and 'y' in Fulldom_hires.nc. These must be 1D arrays with dimension
    sizes
  remedy: 'Ensure Fulldom_hires.nc has 1D x(x) and y(y) coordinate variables with ''resolution'' attribute;
    build_fulldom_hires; [''Rebuild Fulldom_hires.nc using build_fulldom_hires.py which creates x/y variables'',
    ''Or manually add: x(x) = projected x-coordinates of cell centres, y(y) = projected y-coordinates'','
  severity: fatal
- id: dt_005
  symptom: WRF-Hydro runs past the available forcing period and reports 'no forcing data found' or exits
    with missing input. Occurs when KHOUR extends beyond the last LDASIN file.
  diagnosis: The simulation end date in namelist.hrldas (KHOUR) extends beyond the last available LDASIN_DOMAIN1
    file in the FORCING/ directory.; LDASIN files follow the naming convention YYYYMMDDHH.LDASIN_DOMAIN1.
    WRF-Hydro reads them sequentially at each FORCING_TIMESTEP. If the simulation tries to read a time
  remedy: 'Ensure LDASIN files cover the full simulation period including hour 0 of end_date+1, or reduce
    KHOUR to match available forcing; ; [''Count LDASIN files: ls FORCING/*.LDASIN_DOMAIN1 | wc -l'',
    ''Compare with expected: (end_date - start_date + 1) * 24'', ''If fewer files than expected, reduce
    end_date or '
  severity: fatal
- id: dt_004
  symptom: WRF-Hydro crashes when writing CHRTOUT_GRID output files with 'Unable to place x floating point
    attributes' in the error log.
  diagnosis: The LCC projection produces x/y coordinate values larger than what NetCDF-4 single-precision
    float can represent precisely, causing attribute write failure.; When the projection origin is far
    from the basin (e.g., stand_lon is very different from basin longitude), the projected coordinates
    can excee
  remedy: 'Set CHRTOUT_GRID = 0 in hydro.namelist, or centre the projection closer to the basin; ; [''Edit
    hydro.namelist: set CHRTOUT_GRID = 0'', ''Or: re-run define_lambert_domain.py with --stand_lon closer
    to the basin centre'']; define_lambert_domain.py defaults stand_lon to basin centre longitude, minimising '
  severity: fatal
- id: dt_006
  symptom: WRF-Hydro compilation fails with 'undefined reference to nf90_open', 'undefined reference to
    nf90_create', and similar NetCDF Fortran binding errors.
  diagnosis: NETCDF_LIB environment variable points to /usr/lib/ instead of /usr/lib/x86_64-linux-gnu/
    where libnetcdff.so actually resides on Ubuntu/Debian.; WRF-Hydro's configure script uses NETCDF_LIB
    to find the NetCDF Fortran library (libnetcdff.so). On Ubuntu/Debian systems, multiarch places libraries
    in /
  remedy: 'Set NETCDF_LIB=/usr/lib/x86_64-linux-gnu/ before compiling; ; [''export NETCDF_LIB=/usr/lib/x86_64-linux-gnu/'',
    ''Verify: ls $NETCDF_LIB/libnetcdff.so (should exist)'', ''Re-run configure and compile'']; Document
    the correct NETCDF_LIB path in installation instructions'
  severity: fatal
- id: dt_007
  symptom: Basin boundary appears slightly shifted (~0.1-0.3%) relative to expected position. Forcing
    data and domain grid have subtle spatial misalignment. No error messages.
  diagnosis: LCC projection was built using WGS84 ellipsoid (semi-major 6378137 m) instead of the WRF
    sphere (R=6370000 m).; WRF-Hydro internally uses a perfect sphere with radius 6370000 m for all Lambert
    Conformal projections. If domain construction tools use the standard WGS84 ellipsoid (which pyproj
    defaults
  remedy: 'Always use +R=6370000 in PROJ.4 strings, never +ellps=WGS84; define_lambert_domain; ["Verify:
    proj4 string in domain_def.json contains ''+R=6370000''", "If it contains ''+ellps=WGS84'' or ''+datum=WGS84'',
    regenerate domain"]; define_lambert_domain.py hardcodes WRF_EARTH_RADIUS = 6370000.0 and uses +R=
    in'
  severity: silent
- id: dt_008
  symptom: WRF-Hydro runs but all cells behave as water. No runoff, no ET, no soil processes. LANDMASK
    appears to be all zeros despite land cells being present in the DEM.
  diagnosis: MMINLU global attribute in geo_em.d01.nc is not set to 'USGS'. WRF-Hydro uses MMINLU to select
    the land use classification scheme. If it is anything other than 'USGS' (e.g., 'MODIFIED_IGBP_MODIS_NOAH'),
    the ISWATER, ISICE, ISURBAN indices do not match the LU_INDEX values, causing misclassification.;
  remedy: 'Ensure MMINLU = ''USGS'' in geo_em.d01.nc; build_geo_em; [''ncdump -h geo_em.d01.nc | grep
    MMINLU'', "If not ''USGS'': ds = nc.Dataset(''geo_em.d01.nc'', ''a''); ds.MMINLU = ''USGS''; ds.close()",
    ''Also verify: ISWATER=16, ISICE=24, ISURBAN=1'']; build_geo_em.py hardcodes MMINLU=''USGS'' and the
    UMD->USGS crosswal'
  severity: silent
- id: dt_009
  symptom: NaN values appear in soil temperature output (TSLB). Model may continue running but soil energy
    balance is corrupted. Affects high-elevation or edge cells.
  diagnosis: SOILTEMP variable in geo_em.d01.nc contains 0 K values for some land cells. These propagate
    as NaN when used as denominator or in exponential functions during soil temperature initialization.;
    SOILTEMP represents annual mean deep soil temperature in Kelvin. A value of 0 K is physically impossible
    an
  remedy: 'Replace SOILTEMP=0K with a reasonable default (e.g., 280-290 K) for all land cells; ; ["ds
    = nc.Dataset(''geo_em.d01.nc'', ''a'')", "st = ds[''SOILTEMP''][0]; lm = ds[''LANDMASK''][0]", ''bad
    = (st < 200) & (lm > 0.5)'', ''st[bad] = 280.0  # reasonable default'', "ds[''SOILTEMP''][0] = st;
    ds.close()"]; build_geo'
  severity: silent
- id: dt_010
  symptom: Channel routing produces physically impossible flow patterns. Water flows uphill or in wrong
    directions. Discharge at outlet is near zero or negative. No error messages from WRF-Hydro.
  diagnosis: 'D8 flow direction encoding from WhiteboxTools was not converted to ArcGIS/WRF-Hydro encoding.
    The two systems assign different numeric codes to the same compass directions.; WhiteboxTools D8:
    1=E, 2=NE, 4=N, 8=NW, 16=W, 32=SW, 64=S, 128=SE. WRF-Hydro (ArcGIS): 1=E, 2=SE, 4=S, 8=SW, 16=W, 32=NW,
    64=N'
  remedy: 'Apply the WBT-to-ArcGIS conversion table when building Fulldom_hires.nc; build_fulldom_hires;
    [''Use the WBT_TO_ARCGIS lookup table: {0:0, 1:1, 2:128, 4:64, 8:32, 16:16, 32:8, 64:4, 128:2}'',
    ''Apply: fdir_arc[fdir_wbt == wbt_val] = arc_val for each entry'']; build_fulldom_hires.py automatically
    applies'
  severity: silent
- id: dt_011
  symptom: Precipitation is ~10,800x too high. Runoff immediately saturates, soil moisture maxes out on
    first timestep. River discharge is orders of magnitude too large. Model may crash with numerical overflow.
  diagnosis: RAINRATE in LDASIN files is in mm/3hr instead of mm/s. The VIC forcing precipitation column
    (mm per 3-hour period) was written directly to LDASIN without dividing by 10800 seconds.; WRF-Hydro
    expects RAINRATE in mm/s (= kg/m^2/s). VIC forcing provides precipitation as accumulated amount per
    3-hour i
  remedy: 'Divide VIC precipitation by source_timestep_seconds (10800 for 3-hourly) to get mm/s; convert_forcing_to_ldasin;
    [''Verify: RAINRATE in first LDASIN file should be < 0.01 mm/s for normal conditions'', ''If RAINRATE
    > 0.1 mm/s everywhere, the division was likely missing'', ''Fix: RAINRATE = precip_mm3hr /'
  severity: silent
- id: dt_012
  symptom: Evapotranspiration is wildly wrong (too high or too low). Soil moisture evolution is unrealistic.
    Sensible/latent heat partitioning is wrong. No error messages.
  diagnosis: 'Vapor pressure (kPa) from VIC forcing was passed directly as Q2D (specific humidity, kg/kg)
    in LDASIN files without conversion.; VIC forcing column 5 is vapor pressure in kPa (typical values:
    0.5-3.0 kPa). WRF-Hydro expects Q2D as specific humidity in kg/kg (typical values: 0.002-0.020). The
    convers'
  remedy: 'Convert VP (kPa) to specific humidity (kg/kg) using the formula: q = 0.622 * e / (p - 0.378
    * e); convert_forcing_to_ldasin; [''Verify: Q2D in first LDASIN file should be 0.001-0.025 kg/kg'',
    ''If Q2D > 0.1, vapor pressure was not converted'', ''Fix: e_Pa = vp_kPa * 1000; q = 0.622 * e_Pa
    / (psfc_Pa - 0.'
  severity: silent
- id: dt_013
  symptom: WRF-Hydro crashes during routing with segmentation fault or CFL-related numerical instability.
    May produce NaN in streamflow before crashing.
  diagnosis: DTRT_CH and/or DTRT_TER (routing timestep in seconds) are too large relative to the routing
    grid spacing DXRT, violating the CFL condition.; The diffusive wave routing scheme requires that the
    Courant number C = v * dt / dx < 1, where v is the wave velocity, dt is the routing timestep, and
    dx is the
