validation:
  tier: "analytic"
  tier_justification: "Compared simulated crop yields against USDA NASS county-average yield statistics for NC. Corn PBIAS=-7.3%, Soybean PBIAS=+19.3%, both within published ranges."
  benchmark: "USDA NASS county-average yields NC (2000-2005), corn 6.5-13.0 t/ha, soybean 2.0-4.5 t/ha"
  metrics:
    corn_yield_mean_tha: 8.81
    corn_pbias_pct: -7.3
    soy_yield_mean_tha: 3.82
    soy_pbias_pct: 19.3
    peak_lai: 5.28
    corn_in_nass_range: true
    soy_in_nass_range: true

