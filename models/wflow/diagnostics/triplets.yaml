    - 'Check version: julia -e ''using Pkg; println(Pkg.status("Wflow"))'''
    - 'v1.0+: use CSDMS standard names (generate_wflow_toml.py default)'
    - 'pre-v1.0: use generate_wflow_toml.py --legacy'
    prevention: Pin Wflow.jl version in Project.toml. Always use generate_wflow_toml.py.
