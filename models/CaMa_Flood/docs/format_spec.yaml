# format_spec.yaml — Machine-readable model format specification
# Used by debug_framework.py Level 1 (input validation) and Level 3 (output validation)
# Part of KDT Knowledge Infrastructure Tier B documentation
#
# Aligns with UNIVERSAL_BOUNDS and DOMAIN_CHECKS in debug_framework.py:
#   - Input ranges map to Level 1 check_value_range() calls
#   - Output ranges map to Level 3 DOMAIN_CHECKS["hydrology"]
#   - known_issues map to diagnostic triplets (triplets.yaml)

model:
  name: "CaMa-Flood v4.20"
  domain: "routing"
  binary: "MAIN_cmf"
  binary_path: "/mnt/disk1/Hydrocraft_server/model/cmf_v420_pkg/src/MAIN_cmf"
  language: "Fortran 90"
  working_directory: "output directory (run script cd's to RDIR)"
  dependencies: "NetCDF-Fortran"
  notes: "River routing and floodplain model — accepts gridded runoff, produces discharge and flood inundation"

# =========================================================================
# INPUTS
# =========================================================================
inputs:

  forcing:
    - name: "runoff"
      file: "{basin}_runoff_1d_YYYY.nc"
      variable: "Runoff"
      unit: "mm/day"
      valid_range: [0.0, 500.0]
      format: "NetCDF; dimensions (time, lat, lon)"
      missing_value: null
      notes: >
        CaMa-Flood converts mm/day to m3/s internally using ctmare.bin
        (catchment area). Do NOT convert to m3/s before input (dt_cama_009).
        Latitude must be in DESCENDING order (north to south, dt_cama_007).

  parameters:
    critical:
      - name: "PMANRIV"
        file: "input_cmf.nam (&NPARAM)"
        description: "Manning roughness for river channel"
        valid_range: [0.01, 1.0]
        default: 0.03
        unit: "s/m^(1/3)"
        sensitivity: "very high — primary calibration parameter"
        bug_history: >
          Default 0.03 is for natural rivers at global scale. Bengbu calibrated
          at 0.30 (10x higher) due to channel complexity at 15min resolution.

      - name: "PMANFLD"
        file: "input_cmf.nam (&NPARAM)"
        description: "Manning roughness for floodplain"
        valid_range: [0.05, 0.30]
        default: 0.10
        unit: "s/m^(1/3)"

      - name: "CDIMINFO"
        file: "input_cmf.nam (&NDIMTIME)"
        description: "Path to dimension info file — MUST be absolute"
        bug_history: "Relative paths break when run script cd's to output directory (dt_cama_001)"

      - name: "CINPMAT"
        file: "input_cmf.nam (&NFORCE)"
        description: "Input matrix mapping source grid to CaMa grid"
        bug_history: >
          WESTIN/EASTIN/NORTHIN/SOUTHIN in inpmat generation MUST match
          the VIC grid extent, NOT the CaMa domain extent (dt_cama_002).

      - name: "latitude_order"
        file: "runoff NetCDF"
        description: "Latitude dimension ordering in input runoff"
        valid_range: "descending (north to south)"
        bug_history: "Ascending lat causes every CaMa cell to map to wrong VIC cells (dt_cama_007)"

    channel_parameters:
      - name: "WC (width coefficient)"
        default: 2.50
        description: "W = WC * Q^WP"
      - name: "WP (width power)"
        default: 0.60
      - name: "WMIN (minimum width)"
        default: 5.0
        unit: "m"
      - name: "HC (depth coefficient)"
        default: 0.10
        description: "H = HC * Q^HP"
      - name: "HP (depth power)"
        default: 0.50
      - name: "HMIN (minimum depth)"
        default: 1.0
        unit: "m"
      - name: "Manning_river"
        default: 0.03
      - name: "Manning_floodplain"
        default: 0.10

  files:
    required:
      - name: "input_cmf.nam"
        description: "Fortran namelist configuration file"
        format: "Fortran namelist with sections: &NRUNVER, &NDIMTIME, &NPARAM, &NSIMTIME, &NMAP, &NFORCE, &NOUTPUT"
        notes: "ALL file paths must be absolute (dt_cama_001)"

      - name: "diminfo_{basin}_025deg.txt"
        description: "Dimension info file linking VIC grid to CaMa grid"
        notes: "Generated by inpmat tools; must use VIC grid extent"

      - name: "inpmat_{basin}_025deg.bin"
        description: "Input matrix binary (VIC -> CaMa spatial mapping)"

      - name: "nextxy.bin"
        description: "Flow direction (downstream cell indices)"
      - name: "ctmare.bin"
        description: "Catchment area per cell (m2)"
      - name: "elevtn.bin"
        description: "Elevation (m)"
      - name: "nxtdst.bin"
        description: "Distance to downstream cell (m)"
      - name: "rivlen.bin"
        description: "River channel length (m)"
      - name: "fldhgt.bin"
        description: "Floodplain height profile (m)"
      - name: "rivwth_gwdlr.bin"
        description: "River channel width (m)"
      - name: "rivhgt.bin"
        description: "River channel depth (m)"
      - name: "rivman.bin"
        description: "Manning n spatial field"
      - name: "outclm.bin"
        description: "Climatological mean discharge for channel parameter derivation"
        notes: "MUST be generated from glb_15min (global), not regional directory (dt_cama_004)"

# =========================================================================
# OUTPUTS
# =========================================================================
outputs:

  primary:
    - name: "discharge"
      file: "o_outflw{YYYY}.nc"
      variable: "outflw"
      unit: "m3/s"
      valid_range: [0, null]
      notes: "Primary validation variable. Extract at gauge lat/lon."

    - name: "river_depth"
      file: "o_rivdph{YYYY}.nc"
      variable: "rivdph"
      unit: "m"
      valid_range: [0, 50.0]

    - name: "water_surface_elevation"
      file: "o_sfcelv{YYYY}.nc"
      variable: "sfcelv"
      unit: "m ASL"

    - name: "floodplain_depth"
      file: "o_flddph{YYYY}.nc"
      variable: "flddph"
      unit: "m"
      valid_range: [0, 20.0]
      notes: "Floodplain inundation depth — key for flood mapping"

    - name: "floodplain_fraction"
      file: "o_fldfrc{YYYY}.nc"
      variable: "fldfrc"
      unit: "fraction"
      valid_range: [0, 1.0]

    - name: "river_storage"
      file: "o_rivsto{YYYY}.nc"
      variable: "rivsto"
      unit: "m3"

# =========================================================================
# KNOWN ISSUES (maps to diagnostics/triplets.yaml)
# =========================================================================
known_issues:
  - id: "absolute_paths_mandatory"
    triplet: "dt_cama_001"
    description: "Relative paths in namelist fail when run script cd's to output directory"
    affected_output: "STOP 10 (immediate exit)"
    detection: "STOP 10 in log"
    fix: "Use absolute paths for ALL file references in namelist"

  - id: "inpmat_grid_mismatch"
    triplet: "dt_cama_002"
    description: "Inpmat WESTIN/EASTIN uses CaMa domain extent instead of VIC grid extent"
    affected_output: "Near-zero discharge everywhere"
    detection: "outflw ~ 0 despite non-zero input runoff"
    fix: "Regenerate inpmat using VIC grid extent from basin_grid.nc"

  - id: "calc_rivwth_wrong_diminfo"
    triplet: "dt_cama_003"
    description: "calc_rivwth run with global diminfo instead of regional diminfo"
    affected_output: "Wrong channel widths"
    fix: "Run calc_rivwth in regional directory with regional diminfo"

  - id: "calc_outclm_wrong_dir"
    triplet: "dt_cama_004"
    description: "calc_outclm must run from glb_15min (needs full global network)"
    affected_output: "Zero or incorrect outclm.bin"
    fix: "Always run calc_outclm from map/glb_15min/, copy result to regional dir"

  - id: "reused_map_files"
    triplet: "dt_cama_005"
    description: "Map files from another basin reused without regeneration"
    affected_output: "Wrong river network"
    fix: "Always regenerate maps for each new basin"

  - id: "lat_order_ascending"
    triplet: "dt_cama_007"
    description: "Runoff NetCDF latitude in ascending order instead of descending"
    affected_output: "CaMa cells map to wrong VIC cells"
    fix: "Ensure latitude is north-to-south (descending) in runoff NetCDF"

  - id: "unit_mismatch_m3s"
    triplet: "dt_cama_009"
    description: "Runoff provided in m3/s instead of mm/day"
    affected_output: "Discharge off by orders of magnitude"
    fix: "Keep runoff in mm/day — CaMa converts internally using ctmare.bin"

  - id: "spinup_empty_storage"
    description: "First-year results unreliable due to empty initial river storage"
    fix: "Run 1-2 spin-up iterations of the first year using restart logic"

# =========================================================================
# EXPECTED RANGES (Huai River reference)
# =========================================================================
expected_ranges:
  bengbu_huai_river:
    basin_area_km2: 121330
    period: "2000-2005 (2 spin-up years on 2000)"
    resolution: "15min CaMa, 0.25deg VIC"
    manning_n: "PMANRIV=0.30, PMANFLD=0.10"

    hydrology:
      nse_daily: 0.598
      peak_discharge_m3s: 6900
      notes: "2003 flood event"

# =========================================================================
# CALIBRATION REFERENCE
# =========================================================================
calibration_reference:
  primary_parameter: "PMANRIV"
  recommended_sequence:
    - "PMANRIV (0.01-1.0; default 0.03; Bengbu calibrated 0.30)"
    - "PMANFLD (0.05-0.30; default 0.10)"
    - "PCADP (CFL coefficient; default 0.7)"

  target_metrics:
    - "NSE > 0.5"
    - "Peak timing within 1-2 days"
    - "Volume ratio 0.7-1.3"

  notes: >
    PMANRIV is the only calibration lever for routing timing and magnitude.
    Higher values slow flow, increasing peak attenuation and lag time.
    At 15min resolution, values 5-10x higher than textbook are typical.

# =========================================================================
# UNIT CONVERSION TABLE
# =========================================================================
unit_conversions:
  - variable: "runoff_input"
    source: "VIC (mm/day, OUT_RUNOFF + OUT_BASEFLOW)"
    target: "CaMa-Flood NetCDF (mm/day)"
    operation: "none (same unit)"
    trap_if_wrong: "If m3/s provided, discharge is ~1e6 too high for large basins"

  - variable: "runoff_input"
    source: "wflow (mm/timestep)"
    target: "CaMa-Flood NetCDF (mm/day)"
    operation: "Use UNROUTED runoff to avoid double-routing"
    trap_if_wrong: "Using routed q_river causes double-counting of routing"
