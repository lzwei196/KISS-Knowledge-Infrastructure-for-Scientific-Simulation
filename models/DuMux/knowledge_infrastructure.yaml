package:
  name: DuMux
  language: c++
  implementation:
    id: dumux-3.10
    version: '3.10'
    provenance: C++ (header-only DUNE module); DuMux project (github.com/dumux/dumux) wrapping DUNE core
      numerics. Executables are user/example problems compiled against the headers.
  scientific_reference_version: DuMux 3.10 (DUNE-based finite-volume porous-media flow/transport library;
    Koch et al. 2021, DuMux 3)
  binary:
    path: KISSPATH_INTERNAL_NOT_SHIPPED/auto_dissect/_work/DuMux/dumux_real_run/example_1ptracer
    type: work_dir
pipeline:
  stages:
  - s1_grid_domain_setup
  - s2_forcing_recharge
  - s3_soil_parameters
  - s4_build_execution
  - s5_output_parsing
tools:
  count: 4
  files:
  - tools/convert_forcing_to_dumux.py
  - tools/convert_soil_to_dumux.py
  - tools/parse_dumux_output.py
  - tools/run_dumux.py
inputs:
  forcing:
  - name: Recharge / top boundary flux
    unit: kg/(m2*s)
  parameters:
  - name: Intrinsic permeability K
    unit: m2
  - name: Porosity phi
    unit: '-'
  - name: van Genuchten alpha (capillary pressure scale)
    unit: 1/Pa
  - name: van Genuchten n (pore-geometry index)
    unit: '-'
  - name: Residual water saturation Swr
    unit: '-'
  - name: Dispersivity
    unit: m
  - name: Molecular diffusion coefficient
    unit: m2/s
  - name: Newton convergence/control parameters (MaxRelativeShift, TargetSteps, MaxSteps, MaxTimeStepDivisions)
    unit: '-'
  initial_conditions:
  - name: Initial primary-variable solution
    unit: model-dependent (Pa for pressure, - for saturation)
  boundary_conditions:
  - name: Dirichlet boundary (fixed pressure / head)
    unit: Pa (absolute)
  - name: Boundary-type assignment (Dirichlet vs Neumann per segment)
    unit: '-'
  - name: Source / sink terms (e.g. pumping wells)
    unit: kg/(m3*s)
  - name: Gravity switch (Problem.EnableGravity)
    unit: '-'
  - name: Grid domain definition (extent, cells, refinement, grid file)
    unit: m / count
  - name: Time-loop control (TEnd, DtInitial, MaxTimeStepSize)
    unit: s
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - pressure
  - velocity
  - saturation
  - tracer concentration / mass fraction
  - baseflow (derived flux)
  other: []
validation:
  tier: tested
  tier_justification: 'measured: NSE=1.000, KGE=0.997, R=1.000, 2 scorecard(s)'
  metrics:
    best_nse: 0.999978
    best_kge: 0.996549
    best_r: 0.999997
summary:
  total_tools: 4
  total_stage_docs: 5
  total_diagnostic_triplets: 22
  generated: '2026-08-15'
