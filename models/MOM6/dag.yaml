      short_citation: "Reichl & Hallberg 2018"
      doi: "10.1016/j.ocemod.2018.10.004"
      note: "ePBL surface-mixing scheme; MLD set by TKE/wind-energy budget (mstar). Source page returned HTTP 403; no quantitative sensitivity index retrievable."
