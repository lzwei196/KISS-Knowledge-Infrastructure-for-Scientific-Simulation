# Grounded in the fetched TRIGRS / shallow-landslide validation set and one locally cached
# open hydrology threshold paper. Numeric bands are used only where a fetched text gave a
# threshold or a benchmark target. Null bands mark outputs for which no direct convention was
# found under the campaign search cap.

