# Grounded ONLY in locally-fetched/cached OA full texts.
# What is actually gradeable (has a real obs binding in model_obs_map): runoff/streamflow (gauge
# discharge), GPP (FLUXNET flux), evapotranspiration (FLUXNET latent-energy flux), and terrestrial
# water storage (GRACE TWS anomaly). Only RUNOFF/streamflow has a cited NUMERIC pass convention:
# Moriasi et al. 2007 NSE/PBIAS tiers, independently corroborated for CLM5 by Cheng et al. 2023
# (s41597), whose CLM5 CAMELS ensemble uses NSE>=0.5 as the "behavioral" streamflow threshold and
# reports monthly-streamflow KGE ~0.65-0.92. GPP, ET and TWS are validated in the CLM5 literature via
# ILAMB *relative* scoring + correlation/RMSE/bias, NOT a fixed NSE/r pass threshold -> those headline
# bands are null (confidence <= 0.4) per the no-fabrication rule. TWS additionally carries a documented
# structural ceiling (global models systematically underestimate large decadal TWS trends vs GRACE;
# Scanlon 2018). Soil moisture, soil temperature, snow depth, soil/veg carbon and NEE appear in the dag
# but have NO obs binding in model_obs_map -> no gradeable block emitted (noted in relevant blocks).
# Bands are plain numbers read via `direction` (see VALIDATION_CONVENTION_SCHEMA.md).

