# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: Pywr
  language: python
  implementation:
    id: pywr-1.30
    version: 1.30.0
    provenance: Python (Cython core); Pywr (Arnott / Tomlinson / University of Manchester) solves a per-timestep
      network-allocation LP via GLPK.
  scientific_reference_version: Pywr 1.30.0 (generalised network resource-allocation simulator; Tomlinson
    et al. 2020 EMS 104635 formulation)
inputs:
  forcing:
  - name: catchment inflow
    unit: m3/s
    category: forcing
    source_kind: forcing
    model_input_format: time-varying flow at a Catchment node, supplied by a DataFrameParameter reading
      a daily CSV timeseries (datetime index + flow column)
    notes: Primary exogenous driver of the network. Must cover the full simulation period at the model
      timestep; out-of-range dates raise a date/keys error. Inflow is supplied as flow per timestep and
      treated as volume-per-timestep within the LP.
  - name: irrigation demand
    unit: m3/s
    category: forcing
    source_kind: forcing
    model_input_format: demand at an Output node, set by a Parameter (constant, monthly profile, or dataframe)
    notes: Optional. Time-varying water demand requested at a demand sink.
  - name: municipal/industrial demand
    unit: m3/s
    category: forcing
    source_kind: forcing
    model_input_format: demand at an Output node, set by a Parameter
    notes: Optional time-varying demand.
  - name: reservoir-surface precipitation
    unit: mm/day
    category: forcing
    source_kind: forcing
    model_input_format: time-varying Parameter / CSV timeseries
    notes: Optional direct rainfall onto the reservoir surface.
  parameters:
  - name: max_volume (reservoir capacity)
    unit: m3
    category: parameters
    source_kind: user_provided
    model_input_format: Storage node max_volume field
    notes: Maximum reservoir storage volume; bounds the storage state. Typical major-dam capacities exceed
      1e8 m3.
  - name: min_volume / dead storage
    unit: m3
    category: parameters
    source_kind: user_provided
    model_input_format: Storage node min_volume field
    notes: Lower bound on storage; dead storage typically 10-20% of max_volume.
  - name: node_cost (priority penalty)
    unit: dimensionless
    category: parameters
    source_kind: calibrated
    model_input_format: cost field on each node / cost Parameter
    notes: 'Sets allocation priority in the LP objective: more negative cost attracts water (higher priority),
      positive cost repels it. Encodes demand ranking (environmental > municipal > irrigation > industrial)
      and spill penalty.'
  - name: max_flow / min_flow (node capacity, MRF)
    unit: m3/s
    category: parameters
    source_kind: user_provided
    model_input_format: max_flow/min_flow fields on non-storage nodes; mrf on RiverGauge
    notes: Capacity and minimum-flow constraints bounding the LP feasible region; min_flow encodes minimum
      residual / environmental flow (typically 10-30% of mean annual flow).
  - name: control curve
    unit: fraction of max_volume
    category: parameters
    source_kind: user_provided
    model_input_format: ControlCurveParameter (monthly target storage fractions, 0-1)
    notes: Monthly target storage levels; selects the storage node's cost band (above-curve vs below-curve)
      to produce smooth intermediate regulation. Absent it, the reservoir fills to max or empties to min.
  - name: demand profile
    unit: m3/s
    category: parameters
    source_kind: user_provided
    model_input_format: MonthlyProfileParameter or DataFrameParameter
    notes: Temporal shape of demand at a demand node.
  initial_conditions:
  - name: initial_volume
    unit: m3 (or fraction)
    category: initial_conditions
    source_kind: user_provided
    model_input_format: Storage node initial_volume / initial_frac field
    notes: Required starting storage volume; the only state carried into the first timestep.
  boundary_conditions:
  - name: simulation period
    unit: date / timestep in days
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: timestepper.start / end / timestep
    notes: Defines the daily integration window; must align with the inflow timeseries date range.
  - name: spill / overflow path
    unit: n/a
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: Link from the storage node to a high-cost spill Output node
    notes: 'Mandatory feasibility safeguard: a slack/spill route the LP can use when inflow exceeds demand
      plus available capacity. Absence causes InfeasibleError.'
  - name: network topology
    unit: n/a
    category: boundary_conditions
    source_kind: user_provided
    model_input_format: JSON nodes[] and edges[] (directional connections; node 'name'+'type' required,
      edge endpoints must reference existing node names)
    notes: The user-defined graph IS the spatial discretization; topology determines what is allocated
      where.
  - name: solver selection
    unit: dimensionless
    category: boundary_conditions
    source_kind: default
    model_input_format: solver.name field
    notes: GLPK is the only solver supported in this implementation (solver.name='glpk').
outputs:
  primary:
  - name: storage_volume
    unit: m3
    description: Daily reservoir water storage volume per storage node, carried across timesteps with
      continuity.
    validation_rank: 3
    emitted_in: NumpyArrayStorageRecorder (e.g. storage timeseries CSV via CSVRecorder)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Comparison valid only against observed reservoir storage/elevation at the modeled dam; storage
          trajectory is governed entirely by user-set operating rules and inflow, so disagreement reflects
          rule/inflow error not internal physics.
      detrending_options:
      - none
  - name: release_discharge
    unit: m3/s
    description: Total regulated release plus spill leaving a storage node toward downstream.
    validation_rank: 1
    emitted_in: NumpyArrayNodeRecorder
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Compare against gauged downstream/regulated discharge; LP enforces non-negative flow, so negative
          recorded release indicates an extraction sign error.
      detrending_options:
      - none
  - name: spill_discharge
    unit: m3/s
    description: Uncontrolled water overflow when the reservoir is at capacity.
    validation_rank: 2
    emitted_in: NumpyArrayNodeRecorder (spill link)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Event-like; spill occurs only when storage hits max_volume. Capacity-scale errors (e.g. unit
          mismatch) produce spurious continuous spilling.
      detrending_options:
      - none
  - name: demand_deficit
    unit: m3/s
    description: Unmet water demand at each demand node (requested minus delivered).
    validation_rank: 4
    emitted_in: NumpyArrayNodeDeficitRecorder / TotalDeficitNodeRecorder
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Deficit is a model-internal allocation outcome; observational counterparts (shortage records)
          are scarce and depend on declared demand. Deficit is intermittent/event-like in character.
      detrending_options:
      - none
  - name: supply_reliability
    unit: fraction
    description: Fraction of timesteps where a priority water demand is fully met.
    validation_rank: 5
    emitted_in: DeficitFrequencyNodeRecorder (derived)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Scalar reliability summary over the simulation period; meaningful only relative to a stated
          demand and rule set.
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_pywr_001
  symptom: Pywr raises an error during model creation or run about missing GLPK solver. Error may mention
    'No solver found' or 'glpk' not available.
  diagnosis: GLPK (GNU Linear Programming Kit) is not installed or not accessible. Pywr requires GLPK
    as its LP solver backend.; Pywr uses linear programming to optimally allocate water at each timestep.
    The GLPK solver is the default and most common backend. Without it, Pywr cannot solve the allocation
    problem.
  remedy: 'Install GLPK system library.; verify_pywr_installation; [''Ubuntu/Debian: sudo apt-get install
    libglpk-dev glpk-utils'', ''conda: conda install -c conda-forge glpk'', ''macOS: brew install glpk'',
    ''Verify: python -c "from pywr.model import Model; m = Model(); print(\''OK\'')"'']; Include GLPK
    in system requi'
  severity: fatal
- id: dt_pywr_002
  symptom: Pywr raises KeyError, TypeError, or 'unknown node type' when loading model JSON. Model.load()
    fails during parsing.
  diagnosis: 'Model JSON has invalid structure: misspelled node type, missing required field, or wrong
    parameter format. Pywr node types are case-sensitive (e.g., ''storage'' not ''Storage'').; Pywr JSON
    models have strict schema requirements. Node types must be lowercase (input, output, link, storage,
    catchment). Pa'
  remedy: 'Fix JSON structure. Use assemble_pywr_model.py which generates correct schema.; assemble_pywr_model;
    [''Node types must be lowercase: input, output, link, storage, catchment'', "Every node must have
    ''name'' and ''type'' fields", ''Parameter types: constant, monthlyprofile, dataframe, controlcurve'',
    ''Use a'
  severity: fatal
- id: dt_pywr_003
  symptom: Pywr raises error about an edge connecting to a node that does not exist. Error mentions 'Node
    not found' or 'KeyError' with a node name.
  diagnosis: 'An edge in the ''edges'' array references a node name that is not defined in the ''nodes''
    array. Typically a typo or inconsistent naming between node and edge definitions.; Pywr edges are
    defined as [source_name, target_name] where both names must match existing node names exactly (case-sensitive).
    If '
  remedy: 'Ensure all edge endpoints exist in the nodes array.; assemble_pywr_model; [''List all unique
    names in edges: set(name for edge in edges for name in edge)'', "List all node names: set(n[''name'']
    for n in nodes)", ''Find difference: edge_names - node_names = orphan references'', ''Fix by adding
    missing node'
  severity: fatal
- id: dt_pywr_004
  symptom: Pywr raises FileNotFoundError or 'No such file' when loading a dataframe parameter that references
    a CSV file via 'url' field.
  diagnosis: The 'url' field in a dataframe parameter uses a relative path that is resolved relative to
    the model JSON file location, not the current working directory.; Pywr resolves dataframe 'url' paths
    relative to the JSON model file's directory. If the model JSON is at /outputs/model.json and the url
    is 'in
  remedy: Use absolute paths in dataframe url fields.; assemble_pywr_model; ["Convert all 'url' fields
    to absolute paths", 'Or ensure CSV files are in the same directory as model.json', 'Or use os.path.abspath()
    when generating model JSON']; assemble_pywr_model.py always writes absolute paths for url fields.
  severity: fatal
- id: dt_pywr_005
  symptom: Pywr model runs but reservoir never fills. Storage stays at initial or decreases monotonically.
    Inflow CSV has all zeros or near-zero values.
  diagnosis: 'Wrong upstream cells selected in convert_vic_to_inflow.py. Either (a) VIC flux files not
    found for the coordinates, (b) wrong coordinate format in filenames, or (c) all cells are downstream
    of the dam.; convert_vic_to_inflow.py searches for VIC flux files matching the pattern prefix_LAT_LON.txt.
    If '
  remedy: 'Check VIC flux filename format and upstream cell count.; convert_vic_to_inflow; [''ls VIC result
    directory to see actual filename format'', ''Check cells_found in tool output: should be >> 0'', ''If
    cells_missing == cells_total: filename format mismatch'', ''Try --flux_prefix to override auto-detected
    pref'
  severity: silent
- id: dt_pywr_006
  symptom: Storage volume oscillates between min_volume and max_volume every few timesteps. Release is
    either 0 or maximum. Behavior looks unrealistic.
  diagnosis: Control curve parameters are not properly connected to storage node costs. Without a ControlCurveParameter
    linking storage level to costs, the LP solver just fills and empties the reservoir without smooth
    regulation.; Pywr uses cost-based optimization. A storage node with constant cost=-500 will alw
  remedy: Implement ControlCurveParameter linking storage to release cost.; create_operating_rules; ['Define
    a ControlCurveParameter referencing the storage node', 'Set above_curve_cost > 0 (prefer releasing
    when above target)', 'Set below_curve_cost < 0 (prefer storing when below target)', 'The monthly contr
  severity: degraded
- id: dt_pywr_007
  symptom: Pywr raises error about unknown parameter type during model load. Error mentions the parameter
    name and 'type' field.
  diagnosis: 'Parameter ''type'' field uses wrong case or spelling. Pywr parameter types are case-sensitive
    and specific: ''monthlyprofile'' (not ''MonthlyProfile''), ''constant'' (not ''Constant'').; Common
    Pywr parameter types: - constant: single scalar value - monthlyprofile: 12 monthly values - dailyprofile:
    366 daily '
  remedy: Fix parameter type to lowercase Pywr convention.; ; ["Change 'MonthlyProfile' to 'monthlyprofile'",
    "Change 'Constant' to 'constant'", "Change 'DataFrame' to 'dataframe'", 'Check Pywr docs for exact
    type strings']; Use create_operating_rules.py and create_demand_nodes.py which output correct types.
  severity: fatal
- id: dt_pywr_008
  symptom: Release timeseries contains negative values. This is physically impossible (water cannot flow
    upstream into a reservoir through the release works).
  diagnosis: Sign convention error in Pywr results extraction. Pywr itself cannot produce negative flows,
    but the recording or extraction code may negate values incorrectly.; Pywr's LP solver enforces non-negative
    flows on all links. If negative values appear in the output CSV, it means the extraction code (run_
  remedy: 'Verify recorder setup and extraction logic.; run_pywr; ["Check that recorders are type ''numpyarraynode''
    (not ''numpyarraylink'')", ''Verify flow = recorder.data() returns positive values'', ''If negative:
    data might be costs, not flows — use correct recorder'']; run_pywr.py auto-detects flow recorders.
    If'
  severity: silent
- id: dt_pywr_009
  symptom: Pywr raises InfeasibleError during model.run(). The LP solver cannot find a feasible solution
    that satisfies all constraints at some timestep.
  diagnosis: Demands exceed available supply (inflow + storage) at some timestep, and there is no slack
    variable or spill path to absorb the deficit.; Pywr formulates water allocation as a LP at each timestep.
    If total demand (sum of all Output node max_flow values) exceeds total supply (inflow + storage release
  remedy: 'Reduce demands or add slack/spill paths.; create_demand_nodes; [''Option 1: Reduce demand max_flow
    values (especially environmental flow)'', ''Option 2: Lower min_volume to allow deeper drawdown'',
    "Option 3: Add a ''deficit'' Output node with very high cost (penalty)", ''Option 4: Check inflow
    data — if a'
  severity: fatal
- id: dt_pywr_010
  symptom: Pywr raises error about 'values' array length mismatch for monthlyprofile parameter. Expected
    12 values but got a different number.
  diagnosis: The 'values' array in a monthlyprofile parameter does not have exactly 12 elements (one per
    month, Jan=index 0 through Dec=index 11).; Pywr's monthlyprofile parameter requires exactly 12 values,
    one for each calendar month. Index 0 = January, index 11 = December. Providing 11 or 13 values causes
    a p
  remedy: 'Ensure values array has exactly 12 elements.; create_operating_rules; [''Check: len(values)
    == 12'', ''Index mapping: values[0]=Jan, values[1]=Feb, ..., values[11]=Dec'', ''If generating from
    flood_months list, remember months are 1-indexed but array is 0-indexed'']; create_operating_rules.py
    always gener'
  severity: fatal
- id: dt_pywr_011
  symptom: After injecting Pywr releases into CaMa-Flood runoff NetCDF, some cells have negative runoff
    values. CaMa-Flood may produce NaN discharge or crash.
  diagnosis: 'The injection replaces VIC runoff with Pywr release, but the unit conversion (m3/s to mm/day)
    is wrong, or the cell area used for conversion is incorrect.; inject_releases_to_cama.py converts
    Pywr release (m3/s) to CaMa runoff (mm/day) using: Q_mm = Q_m3s * 86400 / cell_area_m2 * 1000. If
    cell_area_'
  remedy: 'Verify cell area and unit conversion.; inject_releases_to_cama; [''Check cell_area in output
    JSON: should be ~600-800 km2 for 0.25 deg at mid-latitudes'', ''Verify: regulated_mean_mm should be
    comparable to original_mean_mm'', ''If regulated_mean_mm >> original_mean_mm: cell area is too small
    (probably i'
  severity: silent
- id: dt_pywr_012
  symptom: run_pywr.py produces empty CSV files. Storage or release timeseries have 0 rows. The model
    ran but no data was recorded.
  diagnosis: Recorders are defined in the JSON but their data() method returns empty arrays because the
    recorder was not properly attached to a node, or the node name in the recorder does not match any
    model node.; Pywr recorders must reference valid node names via the 'node' field. NumpyArrayNodeRecorder
    record
  remedy: 'Verify recorder node references match actual model nodes.; assemble_pywr_model; ["Check each
    recorder''s ''node'' field against the nodes array", "For storage: use ''numpyarraystoragerecorder'',
    not ''numpyarraynode''", ''Print model.recorders after loading to verify they are populated'']; assemble_pywr_mode'
  severity: degraded
- id: dt_pywr_013
  symptom: Pywr model runs but produces truncated results or errors about missing data at certain dates.
    The inflow CSV does not cover the full simulation period.
  diagnosis: The timestepper start/end dates in the model JSON do not match the date range in the inflow
    CSV. Pywr requests data for dates that are outside the CSV range.; Pywr's timestepper defines the
    simulation period. Dataframe parameters (inflow) are indexed by date. If the timestepper requests
    a date not i
  remedy: 'Align model dates with inflow CSV date range.; assemble_pywr_model; [''Check inflow CSV: head
    -1 and tail -1 to see date range'', ''Set --start_date to match or be after first CSV date'', ''Set
    --end_date to match or be before last CSV date'', ''Account for VIC spinup: if VIC runs 1980-1990,
    data starts 19'
  severity: degraded
- id: dt_pywr_014
  symptom: Reservoir fills instantly and spills every day, or never fills despite large inflow. Storage
    volume scale is wrong by factor of 1e6.
  diagnosis: 'GRanD CAP_MCM is in million cubic meters (MCM). If used directly as max_volume in Pywr (which
