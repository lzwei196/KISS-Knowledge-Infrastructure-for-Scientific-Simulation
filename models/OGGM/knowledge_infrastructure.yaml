package:
  name: OGGM
  language: python
  implementation:
    id: oggm-py
    version: 1.6.3
    provenance: Python; Open Global Glacier Model (University of Innsbruck), conda/pip oggm package wrapping
      flowline ice dynamics + temperature-index mass balance.
  scientific_reference_version: OGGM 1.6.x flowline glacier framework (Maussion et al. 2019 model description,
    elevation-band flowlines + MonthlyTIModel standard)
  binary:
    path: KISSPATH_KI_ROOT/OGGM/run_and_score.py
    type: Python
pipeline:
  stages:
  - s1_glacier_inventory_skill
  - s2_preprocessing_skill
  - s3_climate_input_skill
  - s4_calibration_skill
  - s5_simulation_skill
  - s6_vic_coupling_skill
tools:
  count: 18
  files:
  - tools/s1_glacier_inventory/download_rgi_region.py
  - tools/s1_glacier_inventory/find_glaciers_in_basin.py
  - tools/s1_glacier_inventory/validate_glacier_selection.py
  - tools/s2_preprocessing/configure_oggm.py
  - tools/s2_preprocessing/init_glacier_directories.py
  - tools/s2_preprocessing/validate_preprocessing.py
  - tools/s3_climate_input/process_climate_baseline.py
  - tools/s3_climate_input/process_cmip6_projections.py
  - tools/s3_climate_input/process_custom_climate.py
  - tools/s4_calibration/calibrate_mass_balance.py
  - tools/s4_calibration/validate_calibration.py
  - tools/s5_simulation/compile_glacier_output.py
  - tools/s5_simulation/run_glacier_projections.py
  - tools/s5_simulation/run_glacier_simulation.py
  - tools/s5_simulation/validate_wgms_reference_mb.py
  - tools/s6_vic_coupling/glacier_contribution_analysis.py
  - tools/s6_vic_coupling/oggm_to_vic_runoff.py
  - tools/s6_vic_coupling/plot_glacier_hydro.py
inputs:
  forcing:
  - name: air temperature
    unit: degC
  - name: precipitation
    unit: kg m^-2 month^-1 (mm w.e./month)
  parameters:
  - name: melt_f (degree-day / temperature-sensitivity melt factor; legacy mu_star)
    unit: kg m^-2 day^-1 degC^-1
  - name: prcp_fac (precipitation correction factor)
    unit: dimensionless
  - name: temp_bias (temperature bias adjustment)
    unit: degC
  - name: T_Melt (melt threshold temperature)
    unit: degC
  - name: Glen creep parameter A (f_d = 2A/(n+2), n=3)
    unit: s^-1 Pa^-3
  - name: f_s (basal sliding parameter)
    unit: s^-1 Pa^-3 m^2
  - name: glacier outlines (RGI)
    unit: polygon / km^2
  - name: digital elevation model (DEM)
    unit: m
  initial_conditions:
  - name: spun-up glacier geometry
    unit: m (ice thickness), m^2/m^3 (area/volume)
  - name: inverted bed topography and initial ice thickness
    unit: m
  boundary_conditions:
  - name: geodetic mass-balance reference (Hugonnet et al. 2021)
    unit: kg m^-2 yr^-1 (mm w.e./yr)
  - name: Farinotti 2019 consensus ice thickness
    unit: m / km^3
  - name: CMIP6/ISIMIP3b GCM + SSP scenario selection
    unit: category
  - name: ice-dynamics solver type (model_type)
    unit: category
  - name: flowline construction method
    unit: category
io_detail: 'full I/O contract incl. units/observability: docs/format_spec.yaml'
outputs:
  observable:
  - volume
  - area
  - length
  - specific_mass_balance
  - calving
  - melt_on_glacier
  - melt_off_glacier
  - liq_prcp_on_glacier
  - snowfall_on_glacier
  - refreezing
  other: []
validation:
  tier: validated
  tier_justification: 'measured: NSE=1.000, KGE=1.000, R=1.000, 3 scorecard(s)'
  metrics:
    best_nse: 0.9999999999618125
    best_kge: 0.9999996797584476
    best_r: 1.0
summary:
