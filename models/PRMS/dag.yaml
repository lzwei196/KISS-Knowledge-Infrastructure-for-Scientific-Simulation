safety:
  hazards:
    - id: "precip_units_mm_vs_inches"
      kind: "weather_file_semantic"
      description: "Precipitation supplied in mm/day with precip_units=0 (inches expected) is 25.4x too large, causing runoff ratio >1 and catastrophic flooding."
      severity: "silent"
    - id: "temp_units_celsius_vs_fahrenheit"
      kind: "weather_file_semantic"
      description: "Temperature supplied in Celsius with temp_units=0 (Fahrenheit expected) leaves values below tmax_allsnow=32F, so all precipitation is classified as rain and the snowpack never accumulates."
      severity: "silent"
    - id: "elevation_meters_vs_feet"
      kind: "weather_file_semantic"
      description: "Elevation in meters with elev_units=0 (feet expected) makes elevation differences ~3.28x smaller, under-applying lapse-rate corrections and flattening the HRU temperature field."
      severity: "silent"
    - id: "hru_area_km2_vs_acres"
      kind: "soil_semantic"
      description: "hru_area in km2 instead of acres makes the basin ~247x too small, corrupting all depth-to-volume water-balance conversions."
      severity: "silent"
    - id: "soil_moist_max_mm_vs_inches"
      kind: "soil_semantic"
      description: "soil_moist_max in mm instead of inches is 25.4x too large, so the soil never saturates, Dunnian/surface runoff never occurs, and peaks are underestimated."
      severity: "silent"
    - id: "observed_runoff_cms_vs_cfs"
      kind: "parser_semantic"
      description: "Observed streamflow in m3/s with runoff_units=0 (cfs expected) is ~35.3x too small, silently corrupting NSE/PBIAS against simulated flow."
      severity: "silent"
    - id: "start_end_time_wrong_typecode"
      kind: "control_semantic"
      description: "start_time/end_time not declared as type-code-1 longs are misinterpreted and PRMS silently falls back to a default 2000-10-01 to 2001-09-30 simulation period."
      severity: "silent"
    - id: "missing_snarea_curve"
      kind: "control_semantic"
      description: "Missing snarea_curve (11-value snow-depletion curve) causes a fatal error during the snowcomp declare phase."
      severity: "fatal"
    - id: "data_file_undeclared_variable"
      kind: "control_semantic"
      description: "A data-file variable not used by the selected modules (e.g., station forcing left in when switching to climate_hru) triggers a fatal 'Variable not declared' error."
      severity: "fatal"
    - id: "nhru_param_cbh_mismatch"
      kind: "control_semantic"
      description: "nhru in the parameter file not matching the CBH column count causes Fortran READ to read the wrong number of values, producing array-bounds errors or segfaults at initialization."
      severity: "fatal"
    - id: "cbh_header_malformed"
      kind: "parser_semantic"
      description: "Malformed CBH header (missing nhru count, wrong delimiter, or blank/comment lines before data) causes a fatal early-EOF/IOSTAT crash; PRMS reads data columns positionally, not by name."
      severity: "fatal"
    - id: "jh_coef_too_high_arid"
      kind: "coefficient_runtime_silent_fallback"
      description: "Jensen-Haise jh_coef too high for an arid basin drives actual ET above precipitation, breaking the water balance and driving storage negative."
      severity: "silent"
    - id: "gwflow_coef_too_high"
      kind: "coefficient_runtime_silent_fallback"
      description: "gwflow_coef too high produces too-fast baseflow recession, with flow dropping to zero between storms."
      severity: "degraded"
  validation_limits:
    - "Daily timestep cannot resolve sub-daily runoff or routing dynamics; Muskingum-Mann travel-time K is bounded 0.01-24.0 hours for stability."
    - "Groundwater is a conceptual linear reservoir, not physically-based 3-D saturated flow (use GSFLOW/MODFLOW coupling where that matters)."
    - "Snow simulation is poorly constrained without observed SWE."
  warnings:
    - "PRMS can run to completion yet produce physically wrong results if units are mismatched, parameters are out of physical range, or the wrong process module is selected for the available forcing; always check water-balance closure (|ppt - actet - stflow|/ppt < 0.1) against observed data."
    - "smidx_coef too small or soil_moist_max too large silently eliminates surface runoff, sending all flow to baseflow/interflow."
    - "Compensating errors (e.g., high soil_moist_max offsetting high gwflow_coef) can mask calibration problems; inspect individual flow components, not just total streamflow."
    - "Use a water-year (Oct 1 - Sep 30) start with at least one warmup year to avoid no-antecedent-snowpack artifacts."
  assumptions:
    - statement: "PRMS operates internally in US customary units (inches, feet, acres, degrees Fahrenheit, Langleys, cfs); forcings and parameters must be presented in those units (or the matching *_units switch set), since conversions are applied silently by basin.f90 constants."
      scope: "all inputs and the internal water/energy budget"
      source: "PRMS-IV User Manual (Markstrom et al. 2015, USGS TM 6-B7) and basin.f90 unit constants (INCH2MM, FEET2METERS, CFS2CMS_CONV)"
      status: "adopted"
    - statement: "Groundwater discharge is modeled as a conceptual linear reservoir (gwflow_coef-driven baseflow), not a physically-based saturated-flow solution."
      scope: "groundwater / baseflow generation"
      source: "PRMS-IV User Manual (Markstrom et al. 2015, USGS TM 6-B7); gwflow module"
      status: "adopted"
    - statement: "The model is a daily, distributed-parameter water-budget simulator on HRUs; snowpack uses an energy-balance formulation but the overall model does not close a surface energy budget."
      scope: "spatiotemporal geometry and closure"
      source: "PRMS-IV User Manual (Markstrom et al. 2015, USGS TM 6-B7); snowcomp and basin_sum module behavior"
      status: "adopted"
    - statement: "The default potential-ET method is Jensen-Haise (potet_jh); alternative PET, temperature/precipitation distribution, solar-radiation, surface-runoff, and streamflow-routing methods are user-selected via control-file module switches and change which parameters and forcings are active."
      scope: "process-method selection"
      source: "PRMS control-file module enums and call_modules dispatch; PRMS-IV User Manual (Markstrom et al. 2015)"
      status: "adopted"
