template_version: "3.5"

identity:
  model_id: "GEOtop"
  scientific_reference_version: "GEOtop 2.0 (Endrizzi et al. 2014, GMD 7, 2831-2857)"
  implementation:
    id: "geotop-3.0"
    version: "3.0 (revised December 2024)"
    provenance: "C++; GEOtop community model (geotopmodel.github.io), GPLv3 source-built distributed energy-water balance solver."
  ki_class: "forward_model"
  is_family_dag: false
  language: "c++"
  license: "GPL-3.0-only"
  repo_url: "https://github.com/geotopmodel/geotop"

boundary:
  scope_in:
    - "Coupled surface energy balance (net radiation partitioned into H, LE, ground heat flux)"
    - "Variably-saturated subsurface water flow via 3D Richards equation (1D column in point mode)"
    - "Soil temperature including freeze/thaw and permafrost"
    - "Multi-layer snowpack mass and energy balance (accumulation, melt, compaction, albedo aging)"
    - "Glacier accumulation/ablation mass balance"
    - "Two-layer canopy + ground vegetation energy and water partitioning (interception, transpiration)"
    - "Terrain-resolved radiation (sky view factor, cast shadows, horizon obstruction)"
    - "Blowing-snow redistribution across pixels (PBSM)"
    - "Channel-network discharge at basin outlet"
  scope_out:
    - "DEM / slope / aspect / sky-view-factor preparation (external GIS step)"
    - "Land-cover / LSAI classification (external)"
    - "MeteoIO-library forcing integration (absent in v3.0, present in v2.1.1)"
    - "Detailed grassland vegetation dynamics (handled by separate 1D extension GEOtop_DV)"
  spatial: "distributed-stream"
  temporal: "sub-hourly"
  closure: "both"
  notes: "Couples a mass-balance water budget (Richards equation, snow/glacier SWE, channel routing) with a surface energy budget (radiative + turbulent fluxes, soil/snow heat diffusion). Non-linear water-energy coupling is explicit during soil phase change: the energy balance is solved before the water balance each sub-step so that soil temperature and ice content are current, and soil ice content reduces hydraulic conductivity via frozen-soil impedance. In point mode the 3D Richards solver collapses to a 1D vertical column with prescribed point topography; in distributed mode the full planar+vertical 3D grid is used."

inputs:
  forcing:
    - {category: forcing, name: "AirT", unit: "Celsius", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column, DD/MM/YYYY hh:mm dates, -9999 nodata", notes: "Required. Kelvin input drives energy-balance non-convergence / hanging."}
    - {category: forcing, name: "Iprec", unit: "mm per time step", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Accumulated depth per model time step, NOT a rate; wrong rate units scale total precipitation by ~1000x."}
    - {category: forcing, name: "RelHum", unit: "% (0-100)", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Required. Fraction (0-1) is read as 0.x% (near-zero ET)."}
    - {category: forcing, name: "WindSp", unit: "m/s", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column"}
    - {category: forcing, name: "WindDir", unit: "degrees (0-360)", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Recommended; drives terrain wind redistribution and blowing snow."}
    - {category: forcing, name: "Swglobal", unit: "W/m2", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Instantaneous incoming shortwave; accumulated J/m2 (e.g. ERA5) must be deaccumulated."}
    - {category: forcing, name: "LWin", unit: "W/m2", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Optional incoming longwave; if absent, parameterized from cloudiness (Konzelmann/Angstrom)."}
    - {category: forcing, name: "CloudTrans", unit: "0-1 or -9999", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Optional cloud transmissivity; supplying both LWin and CloudTrans double-parameterizes longwave."}
    - {category: forcing, name: "DewT", unit: "Celsius", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Optional dew-point temperature."}
    - {category: forcing, name: "AirPress", unit: "mbar", source_kind: forcing, model_input_format: "meteoXXXX.txt CSV column", notes: "Optional air pressure."}
  parameters:
    - {category: soil, name: "Dz", unit: "mm", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV, one row per layer top-to-bottom", notes: "Soil layer thickness (range ~10-500 mm); m or cm input collapses sub-mm layers and diverges the Richards solver."}
    - {category: soil, name: "Kh", unit: "m/s", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Lateral saturated hydraulic conductivity (1E-7 to 1E-3 m/s)."}
    - {category: soil, name: "Kv", unit: "m/s", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Vertical (normal) saturated hydraulic conductivity (1E-7 to 1E-3 m/s)."}
    - {category: soil, name: "vwc_r", unit: "m3/m3", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Residual water content; must satisfy vwc_r < vwc_w < vwc_fc < vwc_s."}
    - {category: soil, name: "vwc_w", unit: "m3/m3", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Wilting point."}
    - {category: soil, name: "vwc_fc", unit: "m3/m3", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Field capacity."}
    - {category: soil, name: "vwc_s", unit: "m3/m3", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Saturated water content."}
    - {category: soil, name: "alpha", unit: "1/mm", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Van Genuchten alpha (0.0001-0.01 1/mm); 1/cm input distorts the retention curve by 10x."}
    - {category: soil, name: "n", unit: "-", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Van Genuchten n (1.1-3.0); n<=1.0 makes m=1-1/n non-positive (FPE)."}
    - {category: soil, name: "stor", unit: "1/m", source_kind: dataset_lookup, model_input_format: "soilXXXX.txt CSV column", notes: "Specific storativity (~5E-7)."}
    - {category: vegetation, name: "VegHeight", unit: "mm", source_kind: calibrated, model_input_format: "geotop.inpts keyword", notes: "Canopy height (meadow 300-600, shrub 1000-3000, forest 5000-30000 mm); m input treated as mm (effectively bare ground)."}
    - {category: vegetation, name: "LSAI", unit: "m2/m2", source_kind: calibrated, model_input_format: "geotop.inpts keyword", notes: "Leaf+stem area index (0.5-8.0); below LSAIthres (~0.1) canopy is treated as absent."}
    - {category: vegetation, name: "MinStomatalRes", unit: "s/m", source_kind: calibrated, model_input_format: "geotop.inpts keyword", notes: "Minimum stomatal resistance controlling transpiration demand."}
    - {category: terrain, name: "dem.txt", unit: "m (elevation)", source_kind: dataset_lookup, model_input_format: "ESRI ASCII Grid (distributed mode)", notes: "Distributed mode only; all maps must share ncols/nrows/cellsize/origin/NODATA."}
    - {category: terrain, name: "slope.txt", unit: "degrees (0-90)", source_kind: dataset_lookup, model_input_format: "ESRI ASCII Grid (distributed mode)", notes: "Percent instead of degrees distorts runoff response."}
    - {category: terrain, name: "aspect.txt", unit: "degrees from N clockwise (0-360)", source_kind: dataset_lookup, model_input_format: "ESRI ASCII Grid (distributed mode)", notes: "Radians instead of degrees flattens/reverses radiation pattern."}
    - {category: terrain, name: "sky.txt", unit: "sky view factor (0-1)", source_kind: dataset_lookup, model_input_format: "ESRI ASCII Grid (distributed mode)"}
    - {category: terrain, name: "curvature.txt", unit: "plan/profile curvature", source_kind: dataset_lookup, model_input_format: "ESRI ASCII Grid (distributed mode)"}
    - {category: terrain, name: "horizonXXXX.txt", unit: "azimuth (deg), horizon height (deg)", source_kind: dataset_lookup, model_input_format: "CSV per met station, azimuths 0-360", notes: "Required when FlagSkyViewFactor=1; missing file silently sets horizon angles to 0, over-predicting direct beam."}
    - {category: lapse_rate, name: "LapseRateTair", unit: "C/km", source_kind: default, model_input_format: "geotop.inpts keyword or LapseRateFile", notes: "Hardcoded default 6.5 C/km applied silently in meteo_distr when no LapseRateFile supplied."}
    - {category: lapse_rate, name: "LapseRateTdew", unit: "C/km", source_kind: default, model_input_format: "geotop.inpts keyword or LapseRateFile", notes: "Hardcoded default 2.5 C/km dew-point lapse-rate fallback."}
  initial_conditions:
    - {category: soil, name: "InitWaterTableDepth", unit: "mm", source_kind: user_provided, model_input_format: "geotop.inpts keyword", notes: "Sets initial soil moisture profile (range 100-5000 mm); high calibration priority."}
    - {category: soil, name: "initial soil temperature", unit: "Celsius", source_kind: user_provided, model_input_format: "geotop.inpts / soil profile (Manual Ch. 18.2.3)", notes: "Initial soil/rock temperature profile."}
    - {category: snow, name: "snow initial state", unit: "depth mm / SWE", source_kind: user_provided, model_input_format: "geotop.inpts (Manual Ch. 18.2.1)", notes: "Initial snowpack state; defaults to no snow."}
    - {category: glacier, name: "glacier initial conditions", unit: "mass / depth", source_kind: user_provided, model_input_format: "geotop.inpts (Manual Ch. 18.2.2)", notes: "Active only when glacier layers enabled."}
  boundary_conditions:
    - {category: control, name: "PointSim", unit: "switch (0/1)", source_kind: user_provided, model_input_format: "geotop.inpts keyword", notes: "1 = point/1D column; 0 = distributed/3D catchment. Selects whether DEM/maps are required."}
    - {category: control, name: "InitDate / EndDate", unit: "DD/MM/YYYY", source_kind: user_provided, model_input_format: "geotop.inpts keyword", notes: "Simulation period; European day-first dates."}
    - {category: control, name: "TimeStep", unit: "s", source_kind: user_provided, model_input_format: "geotop.inpts keyword", notes: "Nominal step (default 900 s); solver sub-steps adaptively below this on non-convergence."}
    - {category: control, name: "FlagSkyViewFactor", unit: "switch (0/1)", source_kind: user_provided, model_input_format: "geotop.inpts keyword", notes: "Enables horizon-obstruction shading; requires horizon files."}
    - {category: control, name: "BlowingSnow", unit: "switch (0/1)", source_kind: user_provided, model_input_format: "geotop.inpts keyword", notes: "Enables PBSM blowing-snow redistribution (optional module)."}
    - {category: control, name: "LWinParameterization", unit: "code", source_kind: user_provided, model_input_format: "geotop.inpts keyword", notes: "Selects incoming-longwave parameterization when LWin not measured."}
    - {category: water_bc, name: "bottom/lateral water balance BC", unit: "head / flux", source_kind: user_provided, model_input_format: "geotop.inpts (Manual Ch. 18.1.2)", notes: "Subsurface bottom and lateral boundary specification for the Richards solver."}
    - {category: energy_bc, name: "energy balance BC", unit: "flux", source_kind: user_provided, model_input_format: "geotop.inpts (Manual Ch. 18.1.1)", notes: "Surface/bottom energy-balance boundary specification."}

processes:
  modules:
    - {name: "input/get_all_input", role: "driver", brief: "Parses geotop.inpts keyword tables, reads DEM/land-cover/soil/meteo, allocates the coupled state containers consumed by the time loop."}
    - {name: "time_loop", role: "integrator", brief: "Top-level adaptive sub-stepping loop: halves the time step on non-convergence and orders meteo -> energy -> water -> output each step."}
    - {name: "meteodistr", role: "process_solver", brief: "Spatially distributes station meteo to the grid via lapse rates and MicroMet-style wind/precip/RH terrain corrections; overwrites the meteo grids consumed by energy and water balance."}
    - {name: "radiation", role: "process_solver", brief: "Solar geometry, atmospheric transmissivity, beam/diffuse split, cast-shadow and sky-view-factor handling for complex terrain."}
    - {name: "clouds", role: "process_solver", brief: "Estimates cloud transmissivity and incoming-longwave parameterization (Konzelmann/Angstrom) when not measured."}
    - {name: "turbulence", role: "process_solver", brief: "Monin-Obukhov surface-layer fluxes: aerodynamic resistances and stability functions producing sensible (H) and latent (LE) heat."}
    - {name: "vegetation", role: "process_solver", brief: "Two-layer canopy energy/water: canopy temperature, shortwave/longwave partitioning, rain/snow interception, transpiration and root uptake."}
    - {name: "energy.balance", role: "integrator", brief: "Coupled column heat equation for soil+snow+glacier+canopy; Backward-Euler diffusion with Newton iteration solved jointly over ground and vegetation temperature."}
    - {name: "snow", role: "process_solver", brief: "Snowpack: new-snow density, compaction, layer combination/merging/splitting, albedo aging, internal-energy partition."}
    - {name: "blowingsnow/PBSM", role: "optional_module", brief: "Prairie Blowing Snow Model: saltation + suspended transport and sublimation, redistributing SWE across neighbouring pixels.", applicability: "BlowingSnow=1"}
    - {name: "glacier", role: "optional_module", brief: "Accumulation/ablation mass balance for glacier layers.", applicability: "max_glac_layers>0"}
    - {name: "water.balance", role: "integrator", brief: "3D Richards equation via Newton + BiCGSTAB linear solve; coupled subsurface, surface (supflow) and channel routing with Courant sub-stepping."}
    - {name: "pedo.funct", role: "process_solver", brief: "Van Genuchten/Mualem pedotransfer: psi<->theta, dtheta/dpsi, hydraulic conductivity with frozen-soil impedance and freezing-point depression."}
    - {name: "channels", role: "process_solver", brief: "Channel-network enumeration and routing of surface/subsurface discharge to the basin outlet (weir model)."}
    - {name: "output", role: "driver", brief: "Aggregates point/basin/profile/map variables over plot intervals, computes basin mass-balance error, writes output-tabs/maps."}
    - {name: "recovering", role: "optional_module", brief: "Checkpoint/restart of full prognostic state (soil psi/ice/temp, snow & glacier layers, canopy water/temp).", applicability: "RecoverSim or ContinuousRecovery set"}
  internal_edges:
    - {from: "Inputs", to: "input/get_all_input", kind: "consumes_input", brief: "geotop.inpts, soil/meteo/DEM files parsed into state containers."}
    - {from: "input/get_all_input", to: "time_loop", kind: "invokes", brief: "Populated state hands off to the top-level sub-stepping loop."}
    - {from: "time_loop", to: "meteodistr", kind: "invokes", brief: "Distributes station meteo to the grid at the start of each sub-step."}
    - {from: "time_loop", to: "energy.balance", kind: "invokes", brief: "Energy solve called first each sub-step before the water solve."}
    - {from: "time_loop", to: "water.balance", kind: "invokes", brief: "Water solve gated on energy convergence (en==0) so soil T and ice content are current."}
    - {from: "time_loop", to: "output", kind: "invokes", brief: "Flushes point/basin/profile/map files per plot interval."}
    - {from: "meteodistr", to: "energy.balance", kind: "produces_output", brief: "Distributed Tair/RH/wind/SW/LW grids feed surface energy fluxes."}
    - {from: "meteodistr", to: "water.balance", kind: "produces_output", brief: "Net precipitation drives the infiltration boundary."}
    - {from: "radiation", to: "energy.balance", kind: "invokes", brief: "Beam/diffuse SW and sky-view supply incoming shortwave to surface EB."}
    - {from: "clouds", to: "radiation", kind: "invokes", brief: "Cloud transmissivity modulates incoming SW/LW."}
    - {from: "turbulence", to: "energy.balance", kind: "invokes", brief: "Monin-Obukhov resistances produce H and LE."}
    - {from: "vegetation", to: "energy.balance", kind: "writes_state", brief: "Canopy temperature and intercepted water/snow couple into the joint Newton solve."}
    - {from: "energy.balance", to: "soil_temperature", kind: "writes_state", brief: "Updates soil/snow/glacier layer temperatures each sub-step."}
    - {from: "energy.balance", to: "soil_ice_content", kind: "writes_state", brief: "Phase change updates soil ice content (freezing)."}
    - {from: "energy.balance", to: "glacier_mass", kind: "writes_state", brief: "Surface energy balance drives glacier-layer accumulation/ablation when glacier layers are active."}
    - {from: "soil_ice_content", to: "water.balance", kind: "reads_state", brief: "Frozen-soil impedance reduces hydraulic conductivity (implicit energy->water feedback)."}
    - {from: "energy.balance", to: "water.balance", kind: "invokes", brief: "time_loop gates water.balance on energy convergence so T and ice are current."}
    - {from: "pedo.funct", to: "water.balance", kind: "invokes", brief: "theta_from_psi / k_from_psi / dtheta_dpsi evaluate Van Genuchten retention and conductivity."}
    - {from: "pedo.funct", to: "energy.balance", kind: "invokes", brief: "theta and freezing-point depression feed heat-capacity / latent terms."}
    - {from: "water.balance", to: "soil_matric_potential", kind: "writes_state", brief: "Richards Newton+BiCGSTAB updates soil pressure head (psi)."}
    - {from: "water.balance", to: "channels", kind: "produces_output", brief: "Surface/subsurface drainage routed into channel storage."}
    - {from: "snow", to: "energy.balance", kind: "writes_state", brief: "Layer combination/merging restructures the snow discretization the heat solver sees."}
    - {from: "energy.balance", to: "snowpack", kind: "writes_state", brief: "Melt/refreeze updates snow layer liquid/ice/temperature."}
    - {from: "snow", to: "radiation", kind: "produces_output", brief: "Age-dependent snow albedo feeds shortwave absorption."}
    - {from: "blowingsnow/PBSM", to: "snowpack", kind: "writes_state", brief: "windtrans_snow redistributes SWE and sublimates, mutating neighbouring pixels' snow."}
    - {from: "blowingsnow/PBSM", to: "meteodistr", kind: "reads_state", brief: "Uses the distributed wind field and fetch for saltation/suspension."}
    - {from: "energy.balance", to: "output", kind: "produces_output", brief: "Accumulates Rn, H, LE, Ts means into output vectors."}
    - {from: "water.balance", to: "output", kind: "produces_output", brief: "Water-table depth, soil-moisture profiles, discharge, basin mass-balance error written."}
    - {from: "output", to: "Outputs", kind: "produces_output", brief: "Flushes point/basin/profile/map files per plot interval."}
    - {from: "recovering", to: "time_loop", kind: "writes_state", brief: "Restores/saves full prognostic state for restart."}

states:
  variables:
    - {name: "soil_matric_potential", unit: "mm", role: "prognostic"}
    - {name: "soil_temperature", unit: "Celsius", role: "prognostic"}
    - {name: "soil_ice_content", unit: "m3/m3", role: "prognostic"}
    - {name: "soil_liquid_water_content", unit: "m3/m3", role: "diagnostic"}
    - {name: "snowpack", unit: "depth mm / ice kg/m2 / liquid kg/m2 / temperature C", role: "prognostic"}
    - {name: "snow_age", unit: "- (non-dimensional)", role: "prognostic"}
    - {name: "glacier_mass", unit: "ice mass kg/m2", role: "prognostic"}
    - {name: "canopy_temperature", unit: "Celsius", role: "prognostic"}
    - {name: "canopy_intercepted_water", unit: "mm", role: "prognostic"}
    - {name: "canopy_intercepted_snow", unit: "mm", role: "prognostic"}
    - {name: "surface_ponding_head", unit: "mm", role: "prognostic"}
    - {name: "channel_storage", unit: "m3", role: "prognostic"}
    - {name: "snow_melt_sublimation_accumulators", unit: "mm / kg/m2", role: "accumulator"}
  provenance: "populated"

outputs:
  - var: "discharge"
    validation_rank: 1
    unit: "m3/s"
    description: "Catchment discharge at the basin outlet from the channel network."
    emitted_in: "output-tabs/discharge*.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Requires a calibrated channel network; routing skill is conditional on saturated hydraulic conductivity calibration."]
      detrending_options: ["none"]
  - var: "SWE"
    validation_rank: 3
    unit: "kg/m2 (mm w.e.)"
    description: "Snow water equivalent of the multi-layer snowpack."
    emitted_in: "output-tabs/point*.txt, snowIce*.txt; spatial SWE maps"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["SWE accuracy is dominated by precipitation and air-temperature forcing accuracy via rain/snow partitioning."]
        - obs_shape: "spatial_time_series"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats: ["Distributed mode only; blowing-snow redistribution couples neighbouring pixels."]
      detrending_options: ["none"]
  - var: "snowDepth"
    validation_rank: 4
    unit: "mm"
    description: "Snowpack depth."
    emitted_in: "output-tabs/snowDepth*.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["GEOtop systematically overestimates snow density from late winter, biasing late-season snow depth."]
      detrending_options: ["none"]
  - var: "soilTz"
    validation_rank: 5
    unit: "Celsius"
    description: "Soil temperature profile by layer (including freeze/thaw)."
    emitted_in: "output-tabs/soilTz*.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Mean annual ground temperature is strongly sensitive to ground albedo and to vertical/temporal discretization (<20 mm upper layer, <=1 h step)."]
      detrending_options: ["none"]
  - var: "thetaliq"
    validation_rank: 6
    unit: "m3/m3"
    description: "Liquid volumetric soil water content profile by layer."
    emitted_in: "output-tabs/thetaliq*.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Governed primarily by saturated hydraulic conductivity and Van Genuchten retention parameters."]
      detrending_options: ["none"]
  - var: "thetaice"
    validation_rank: 7
    unit: "m3/m3"
    description: "Soil ice content profile by layer (permafrost/seasonal freezing)."
    emitted_in: "output-tabs/thetaice*.txt"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "timing_accuracy"]
          determining_metric: "nse"
          caveats: ["Thaw-depth / active-layer timing is the typical comparison target for permafrost validation."]
      detrending_options: ["none"]
  - var: "LE"
    validation_rank: 2
    unit: "W/m2"
    description: "Latent heat flux (surface evapotranspiration energy)."
    emitted_in: "output-tabs/point*.txt, basin*.txt; spatial flux maps"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Eddy-covariance comparison; constrained by soil-water availability (Ks, retention)."]
      detrending_options: ["none"]
  - var: "H"
    validation_rank: 8
    unit: "W/m2"
    description: "Sensible heat flux."
    emitted_in: "output-tabs/point*.txt, basin*.txt; spatial flux maps"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: ["Eddy-covariance comparison; responds to energy-balance partitioning once LE is constrained."]
      detrending_options: ["none"]
  - var: "Tsurface"
    validation_rank: 9
    unit: "Celsius"
    description: "Land surface temperature."
    emitted_in: "output-tabs/point*.txt, basin*.txt; spatial maps"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats: []
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
