- id: dt_w025
  stage: s9_coupling
  failure_domain: dependency_mismatch
  symptom:
    description: wflow + CaMa-Flood produces discharge 2x too high with correct timing
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: "Double-counting routing \u2014 wflow already routes internally, CaMa-Flood\
      \ re-routes"
    explanation: 'wflow performs internal river routing (kinematic wave or local inertial).
      If routed discharge (q_river) is passed to CaMa-Flood, the flow is routed TWICE,
      producing systematically higher discharge with artificially delayed peaks. The
      correct approach is to extract UNROUTED runoff components (overland flow + subsurface
      lateral flow) from wflow output.

      '
    affected_components:
    - wflow_to_cama.py
    - wflow output variable selection
  remedy:
    action: Use unrouted runoff (not q_river) as CaMa-Flood input
    tool_to_run: wflow_to_cama
    manual_steps:
    - Use 'runoff' variable instead of 'q_river' in wflow_to_cama.py
    - Or run wflow without routing (land-only mode) and let CaMa-Flood handle all
      routing
    prevention: wflow_to_cama.py warns if q_river is used. Always use unrouted runoff.
  severity: silent
  cross_references:
  - dt_w020
- id: dt_w026
  stage: s3_parameters
  failure_domain: dependency_mismatch
  symptom:
    description: Cross-model parameter transfer produces wrong results (e.g., VIC
      Ksat to wflow KsatVer)
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: 'Unit mismatch: VIC Ksat is mm/s, wflow KsatVer is mm/day, MODFLOW
      K is m/day'
    explanation: 'Hydraulic conductivity units differ across models: - VIC: mm/s (multiply
      by 86400 for mm/day) - wflow: mm/day - MODFLOW: m/day (divide by 1000 for mm/day)
      - ParFlow: m/hr Using VIC Ksat (mm/s) directly as wflow KsatVer (mm/day) makes
      the soil 86400x too permeable. This is the #1 cross-model silent error.

      '
    affected_components:
    - KsatVer in staticmaps.nc
    - Cross-model parameter transfer
  remedy:
    action: Always apply unit conversion when transferring Ksat between models
    tool_to_run: ''
    manual_steps:
    - 'VIC -> wflow: multiply Ksat by 86400 (mm/s -> mm/day)'
    - 'MODFLOW -> wflow: multiply K by 1000 (m/day -> mm/day)'
    - Check resulting KsatVer is in range 10-10000 mm/day
    prevention: Use adjust_parameters.py which validates parameter ranges.
  severity: silent
  cross_references:
  - dt_w005
- id: dt_w027
  stage: s1_hydromt
  failure_domain: runtime
  symptom:
    description: wflow crashes with 'One or more cycles detected in flow graph'
    error_pattern: cycles detected in flow graph
    detection_method: error_message
  diagnosis:
    root_cause: LDD has cycles from THREE interacting causes (all must be fixed)
    explanation: "Three problems interact to create LDD cycles. Fixing only one leaves\
      \ the others:\nCAUSE 1 \u2014 Naive D8 creates cycles on coarse grids: Flat\
      \ areas at 0.25\xB0 produce ties where cell A\u2192B and B\u2192A. Fix: use\
      \ WhiteboxTools breach_depressions + d8_pointer.\nCAUSE 2 \u2014 DEM masking\
      \ creates artificial barriers: Setting cells outside the basin to -9999/nodata\
      \ makes WhiteboxTools route INTO the nodata area, producing wrong flow directions.\
      \ Fix: sample the FULL DEM for ALL cells (including outside basin), fill remaining\
      \ gaps with nearest-neighbor interpolation (NOT basin mean \u2014 that creates\
      \ flats).\nCAUSE 3 \u2014 wflow's coordinate transformation breaks boundary\
      \ cells: wflow reads the NetCDF (y,x) array, transposes to Julia (x,y) column-major,\
      \ and reverses y to ascending via read_standardized(). Its flowgraph() uses\
      \ searchsortedfirst() to find neighbor nodes. If a cell's LDD target is outside\
      \ the active domain in this TRANSFORMED space, searchsortedfirst returns a WRONG\
      \ node \u2014 creating phantom cycles even though the LDD looks correct in numpy\
      \ space. Fix: check boundary conditions in BOTH numpy-space (for the raw array)\
      \ AND wflow-space (for the transposed+reversed array).\nSource: wflow/src/utils.jl\
      \ (PCR_DIR constant), wflow/src/io.jl (read_standardized, read_y_axis sorts\
      \ to ascending, reverse_data!). Discovered 2026-04-10 revalidation.\n"
    affected_components:
    - staticmaps.nc wflow_ldd
    - run_hydromt_build.py LDD generation
    - wflow/src/routing/routing_process.jl flowgraph()
  remedy:
    action: Use the fixed run_hydromt_build.py which handles all three causes
    tool_to_run: run_hydromt_build.py
    manual_steps:
    - 1. Sample FULL DEM (all cells, not just basin mask)
    - '2. Run WhiteboxTools: breach_depressions then d8_pointer'
    - 3. Convert WBT encoding to PCRaster LDD (wbt_to_ldd map)
    - 4. Mark boundary cells as pits in BOTH numpy-space AND wflow-space
    - '5. wflow-space check: for each cell, compute (x=col, y=ny-1-row if y_desc)
      and verify target (x+dx, y+dy) is active'
    - '6. Verify: the Brooks-Corey ''c'' variable must have a layer dimension (layer,
      y, x)'
    prevention: The S1 tool run_hydromt_build.py handles all this automatically since
      2026-04-10
  severity: fatal
  verified: 2026-04-10 (Bengbu + Xixian)
  cross_references:
  - dt_w014
- id: dt_w031
  stage: s10_reservoir
  failure_domain: unit_conversion
  symptom:
    description: Reservoir overflows immediately, releasing all inflow uncontrolled
    error_pattern: ''
    detection_method: value_comparison
  diagnosis:
    root_cause: Reservoir maxstorage is in MCM instead of m^3 -- 1e6 too small
    explanation: 'GRanD reports capacity in MCM (million cubic meters). wflow maxstorage
      expects m^3. If MCM values are used directly, the reservoir appears 1e6 too
      small. Storage immediately exceeds maxstorage, and all inflow is released as
      overflow. The model runs without error but reservoir has no regulatory effect.
      lookup_dams.py converts automatically.

      '
    affected_components:
    - ResMaxVolume in staticmaps.nc
    - GRanD CAP_MCM unit
  remedy:
    action: Multiply GRanD CAP_MCM by 1e6 to get m^3
    tool_to_run: lookup_dams
    manual_steps:
    - 'Check: python -c "import xarray; ds=xarray.open_dataset(''staticmaps.nc'');
      print(ds.ResMaxVolume.max())"'
    - If max is < 1e6, values are likely still in MCM
    - 'Expected range: 1e7 to 1e11 m^3 for large reservoirs'
    prevention: Always use lookup_dams.py which converts MCM to m^3 automatically.
  severity: silent
  cross_references:
  - dt_w001
  - dt_w026
- id: dt_w028
  stage: s2_forcing
