# ============================================================================
# Knowledge Infrastructure: SFINCS v2.x (Super-Fast INundation of CoastS)
# ============================================================================

package:
  name: "hydrocraft-sfincs"
  version: "1.0.0"
  description: "2D shallow water flood inundation modeling with subgrid resolution"
  target_model: "SFINCS v2.x"
  domain: "flood inundation (coastal, fluvial, pluvial, compound)"
  authors:
    - "Jianyun Zhang Research Group, Hohai University"
  license: "GPL-3.0"

pipeline:
  stages:
    - id: s1_domain
      name: "Domain Setup"
      description: "Define SFINCS computational grid from basin shapefile or bounding box. Auto-detect UTM zone. Compute resolution and CFL-stable timestep."
      order: 1
      depends_on: []
      skill_document: "docs/s1_domain_skill.md"
      tools: [setup_sfincs_domain]
      milestones:
        - id: m1_grid_defined
          description: "grid_info.json created with valid mmax, nmax, dx, dy, epsg"
          verification: "Check grid_info.json: mmax > 0, nmax > 0, epsg is UTM"

    - id: s2_topobathy
      name: "Topography & Bathymetry"
      description: "Resample DEM to SFINCS grid. Generate sfincs.dep, sfincs.msk, sfincs.ind."
      order: 2
      depends_on: [s1_domain]
      skill_document: "docs/s2_topobathy_skill.md"
      tools: [build_sfincs_topobathy]
      milestones:
        - id: m2_dep_created
          description: "sfincs.dep, sfincs.msk, sfincs.ind exist with non-zero size"
          verification: "Check active_cells > 0 in topobathy_summary.json"

    - id: s3_roughness
      name: "Roughness"
      description: "Generate Manning's n from AVHRR land cover or uniform value."
      order: 3
      depends_on: [s1_domain]
      skill_document: "docs/s3_roughness_skill.md"
      tools: [build_sfincs_roughness]
      milestones:
        - id: m3_man_created
          description: "sfincs.man created (or uniform manning set)"
          verification: "Check manning_mean in roughness_summary.json is 0.02-0.15"

    - id: s4_forcing
      name: "Forcing & Boundary Conditions"
      description: "Convert CMFD/MSWX to SFINCS rainfall. Convert CaMa-Flood output to boundary conditions."
      order: 4
      depends_on: [s1_domain]
      skill_document: "docs/s4_forcing_skill.md"
      tools: [prepare_sfincs_rainfall, cama_to_sfincs_boundary]
      milestones:
        - id: m4_forcing_ready
          description: "sfincs.precip and/or sfincs.src+sfincs.dis created"
          verification: "Check rainfall_summary.json units=mm/hr; boundary_summary.json has valid stats"

    - id: s5_structures
      name: "Hydraulic Structures"
      description: "Optional: add thin dams (levees), weirs, drainage structures."
      order: 5
      depends_on: [s2_topobathy]
      skill_document: "docs/s5_structures_skill.md"
      tools: []
      milestones:
        - id: m5_structures_optional
          description: "sfincs.thd, sfincs.weir, sfincs.drn created if needed"
          verification: "Files exist (optional stage)"

    - id: s6_config
      name: "Configuration"
      description: "Generate sfincs.inp with CFL-stable timestep and all file references."
      order: 6
      depends_on: [s2_topobathy, s3_roughness, s4_forcing]
      skill_document: "docs/s6_config_skill.md"
      tools: [generate_sfincs_inp]
      milestones:
        - id: m6_inp_created
          description: "sfincs.inp created with valid parameters"
          verification: "sfincs.inp contains mmax, nmax, tstart, tstop, dt, outputformat=net"

    - id: s7_execution
      name: "Execution"
      description: "Run SFINCS binary with preflight checks, log monitoring, output validation."
      order: 7
      depends_on: [s6_config]
      skill_document: "docs/s7_execution_skill.md"
      tools: [run_sfincs]
      milestones:
        - id: m7_run_complete
          description: "SFINCS completed with exit code 0, sfincs_map.nc produced"
          verification: "run_summary.json: exit_code=0, sfincs_map.nc exists"

    - id: s8_postprocess
      name: "Post-Processing"
      description: "Extract flood depth/extent maps, compute statistics, generate visualizations."
      order: 8
      depends_on: [s7_execution]
      skill_document: "docs/s8_postprocess_skill.md"
      tools: [extract_sfincs_results, plot_sfincs_flood_map]
      milestones:
        - id: m8_results_extracted
          description: "Flood stats computed, GeoTIFF and flood map generated"
          verification: "flood_stats.json exists with flooded_area_km2 > 0"

tools:
  - id: setup_sfincs_domain
    name: "Setup SFINCS Domain"
    description: "Define SFINCS computational grid from shapefile or bounding box with auto-UTM"
    stage: s1_domain
    script_path: "tools/s1_domain/setup_sfincs_domain.py"
    language: python
    inputs:
      - name: shp_path
        type: file
        description: "Basin boundary shapefile"
        required: false
        example: "data/shp/chaohe_shp/chaohe.shp"
      - name: bbox
        type: string
        description: "Bounding box xmin,ymin,xmax,ymax (WGS84)"
        required: false
        example: "116.0,40.0,117.5,41.5"
      - name: resolution
        type: number
        description: "Grid resolution in meters"
        required: false
        example: "100"
      - name: output_dir
        type: directory
        description: "Output directory"
        required: true
        example: "outputs/sfincs_test/"
    outputs:
      - name: grid_info
        type: file
        description: "Grid metadata JSON"
        path_pattern: "{output_dir}/grid_info.json"
    preconditions:
      - "Shapefile or bbox must be provided"
    postconditions:
      - "grid_info.json has mmax > 0, nmax > 0"

  - id: build_sfincs_topobathy
    name: "Build SFINCS Topography"
    description: "Resample DEM to SFINCS grid, generate dep/msk/ind files"
    stage: s2_topobathy
    script_path: "tools/s2_topobathy/build_sfincs_topobathy.py"
    language: python
    inputs:
      - name: grid_info
        type: file
        description: "Grid info from s1_domain"
        required: true
        example: "outputs/sfincs_test/grid_info.json"
      - name: shp_path
        type: file
        description: "Basin shapefile for masking"
        required: false
        example: "data/shp/chaohe_shp/chaohe.shp"
      - name: output_dir
        type: directory
        description: "Output directory"
        required: true
        example: "outputs/sfincs_test/"
    outputs:
      - name: dep_file
        type: file
        description: "Bed level file"
        path_pattern: "{output_dir}/sfincs.dep"
      - name: msk_file
        type: file
        description: "Mask file"
        path_pattern: "{output_dir}/sfincs.msk"
      - name: ind_file
        type: file
        description: "Index file"
        path_pattern: "{output_dir}/sfincs.ind"
    preconditions:
      - "grid_info.json exists from s1_domain"
      - "DEM available (China DEM or Copernicus GLO-30)"
    postconditions:
      - "sfincs.dep, sfincs.msk, sfincs.ind exist with correct size (nmax*mmax elements)"
      - "Active cells > 0"

  - id: build_sfincs_roughness
    name: "Build SFINCS Roughness"
    description: "Generate Manning's n from AVHRR land cover"
    stage: s3_roughness
    script_path: "tools/s3_roughness/build_sfincs_roughness.py"
    language: python
    inputs:
      - name: grid_info
        type: file
        description: "Grid info from s1_domain"
        required: true
      - name: uniform_n
        type: number
        description: "Uniform Manning's n (optional, overrides LULC)"
        required: false
        example: "0.04"
      - name: output_dir
        type: directory
        description: "Output directory"
        required: true
    outputs:
      - name: man_file
        type: file
        description: "Manning's n file"
        path_pattern: "{output_dir}/sfincs.man"
    preconditions:
      - "grid_info.json exists"
    postconditions:
      - "sfincs.man exists, Manning's n values 0.015-1.0"

  - id: prepare_sfincs_rainfall
    name: "Prepare SFINCS Rainfall"
    description: "Convert CMFD/MSWX precipitation to SFINCS NetCDF format (mm/hr)"
    stage: s4_forcing
    script_path: "tools/s4_forcing/prepare_sfincs_rainfall.py"
    language: python
    inputs:
      - name: forcing_dir
        type: directory
        description: "Forcing data directory"
        required: true
      - name: grid_info
        type: file
        description: "Grid info from s1_domain"
        required: true
      - name: start_date
        type: string
        description: "Start date YYYY-MM-DD"
        required: true
      - name: end_date
        type: string
        description: "End date YYYY-MM-DD"
        required: true
      - name: source
        type: string
        description: "Forcing source: cmfd, mswx, vic_ascii"
        required: false
        example: "cmfd"
    outputs:
      - name: precip_file
        type: file
        description: "NetCDF precipitation in mm/hr"
        path_pattern: "{output_dir}/sfincs.precip"
    preconditions:
      - "Forcing files exist in forcing_dir"
    postconditions:
      - "sfincs.precip has units mm/hr, max < 200 mm/hr"

  - id: cama_to_sfincs_boundary
    name: "CaMa-Flood to SFINCS Boundary"
    description: "Convert CaMa-Flood discharge/water level to SFINCS boundary conditions"
    stage: s4_forcing
    script_path: "tools/s4_forcing/cama_to_sfincs_boundary.py"
    language: python
    inputs:
      - name: cama_out_dir
        type: directory
        description: "CaMa-Flood output directory"
        required: true
      - name: grid_info
        type: file
        description: "Grid info from s1_domain"
        required: true
      - name: bc_type
        type: string
        description: "waterlevel or discharge"
        required: false
        example: "discharge"
      - name: start_date
        type: string
        description: "Start date"
        required: true
      - name: end_date
        type: string
        description: "End date"
        required: true
    outputs:
      - name: bc_files
        type: file
        description: "sfincs.src+sfincs.dis or sfincs.bnd+sfincs.bzs"
        path_pattern: "{output_dir}/sfincs.src"
    preconditions:
      - "CaMa-Flood output exists with outflw or sfcelv NetCDF files"
    postconditions:
      - "Boundary files created with valid time series"

  - id: generate_sfincs_inp
    name: "Generate SFINCS Config"
    description: "Generate sfincs.inp with CFL-stable timestep and all parameters"
    stage: s6_config
    script_path: "tools/s6_config/generate_sfincs_inp.py"
    language: python
    inputs:
      - name: grid_info
        type: file
        description: "Grid info from s1_domain"
        required: true
      - name: start_date
        type: string
        description: "Start date"
        required: true
      - name: end_date
        type: string
        description: "End date"
        required: true
      - name: output_dir
        type: directory
        description: "Output directory (run directory)"
        required: true
    outputs:
      - name: inp_file
        type: file
        description: "SFINCS configuration file"
        path_pattern: "{output_dir}/sfincs.inp"
    preconditions:
      - "grid_info.json exists, dep/msk/ind files ready"
    postconditions:
      - "sfincs.inp contains mmax, nmax, tstart, tstop, dt, outputformat=net"

  - id: run_sfincs
    name: "Run SFINCS"
    description: "Execute SFINCS with preflight validation and output checking"
    stage: s7_execution
    script_path: "tools/s7_execution/run_sfincs.py"
    language: python
    inputs:
      - name: run_dir
        type: directory
        description: "Directory with sfincs.inp and all input files"
        required: true
      - name: sfincs_binary
        type: file
        description: "Path to SFINCS executable"
        required: false
        example: "model/sfincs/bin/sfincs"
    outputs:
      - name: map_nc
        type: file
        description: "Gridded flood output"
        path_pattern: "{run_dir}/sfincs_map.nc"
    preconditions:
      - "sfincs.inp and all referenced files exist in run_dir"
      - "SFINCS binary is executable"
    postconditions:
      - "exit code 0, sfincs_map.nc exists with non-zero size"

  - id: extract_sfincs_results
    name: "Extract SFINCS Results"
    description: "Parse sfincs_map.nc, compute flood statistics, export GeoTIFF"
    stage: s8_postprocess
    script_path: "tools/s8_postprocess/extract_sfincs_results.py"
    language: python
    inputs:
      - name: map_nc
        type: file
        description: "Path to sfincs_map.nc"
        required: true
      - name: grid_info
        type: file
        description: "Grid info for GeoTIFF export"
        required: false
      - name: output_dir
        type: directory
        description: "Output directory"
        required: true
    outputs:
      - name: flood_stats
        type: file
        description: "Flood statistics JSON"
        path_pattern: "{output_dir}/flood_stats.json"
      - name: flood_tif
        type: file
        description: "Max flood depth GeoTIFF"
        path_pattern: "{output_dir}/flood_max_depth.tif"
    preconditions:
      - "sfincs_map.nc exists from SFINCS run"
    postconditions:
      - "flood_stats.json has valid statistics"

  - id: plot_sfincs_flood_map
    name: "Plot SFINCS Flood Map"
    description: "Generate publication-quality flood depth map"
    stage: s8_postprocess
    script_path: "tools/s8_postprocess/plot_sfincs_flood_map.py"
    language: python
    inputs:
      - name: flood_depth
        type: file
        description: "flood_max_depth.tif or .npy"
        required: true
      - name: grid_info
        type: file
        description: "Grid info for extent"
        required: false
      - name: output
        type: file
        description: "Output PNG path"
        required: true
    outputs:
      - name: flood_map
        type: file
        description: "Flood map image"
        path_pattern: "{output}"
    preconditions:
      - "flood_max_depth file exists"
    postconditions:
      - "PNG file created > 1KB"

