- id: dt_rav_001
  severity: silent
  failure_domain: unit_conversion
  stage: s3
  symptom:
    description: Model runs successfully but simulated discharge is 8x too high
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Precipitation input in mm/3hr instead of mm/d. Raven treats all values as daily totals.
    explanation: 'CMFD/MSWX forcing is 3-hourly. If the tool sums 8 timesteps to get daily totals,

      Raven gets correct mm/d. If raw 3-hourly values are passed directly, Raven

      interprets each 3-hourly value as a full day''s precipitation, giving 8x overestimate.

      '
    affected_components:
    - convert_forcing_to_rvt.py
    - .rvt file
  remedy:
    action: Ensure precipitation is aggregated to daily (sum of 8 timesteps) before writing .rvt
    tool_to_run: convert_forcing_to_rvt.py
    manual_steps:
    - 'Check .rvt PRECIP values: daily precip > 200mm is suspicious'
    - Verify mean annual precip is 200-3000 mm/yr, not 1600-24000
    prevention: convert_forcing_to_rvt.py has bounds checking (max 500 mm/d)
- id: dt_rav_002
  severity: silent
  failure_domain: unit_conversion
  stage: s3
  symptom:
    description: Temperature-dependent processes (snowmelt, PET) produce wrong results. No error message.
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Temperature in Kelvin instead of Celsius. Raven expects degC.
    explanation: 'CMFD raw temperature is in Kelvin. ki_tools_common.load_forcing converts to Celsius;

      a hand-made reader of the raw CMFD NetCDF that skips this hands 273-310 K to Raven as

      273-310 degC, producing absurd PET and no snowmelt.

      '
    affected_components:
    - convert_forcing_to_rvt.py
    - .rvt file
  remedy:
    action: Subtract 273.15 from all temperature variables
    tool_to_run: convert_forcing_to_rvt.py
    manual_steps:
    - 'Check .rvt TEMP values: should be -40 to +50 degC'
    - If values are 230-320, they are still in Kelvin
    prevention: Bounds checking in convert_forcing_to_rvt.py catches T > 60 degC
- id: dt_rav_003
  severity: silent
  failure_domain: unit_conversion
  stage: s3
  symptom:
    description: PET computed by Raven is unrealistically high or low
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Shortwave radiation in W/m2 instead of MJ/m2/d
    explanation: 'Raven expects SW_RADIA in MJ/m2/d. CMFD/MSWX provides instantaneous W/m2.

      Conversion factor: mean_W_m2 * 0.0864 = MJ/m2/d. If raw W/m2 values (0-400)

      are provided, Raven interprets them as MJ/m2/d (physically impossible — solar

      constant is ~118 MJ/m2/d), producing extreme PET.

      '
    affected_components:
    - convert_forcing_to_rvt.py
  remedy:
    action: Multiply mean daily shortwave (W/m2) by 0.0864 to get MJ/m2/d
    tool_to_run: convert_forcing_to_rvt.py
    manual_steps:
    - 'Check SW_RADIA values: should be 0-40 MJ/m2/d'
    - Values > 50 indicate W/m2 was not converted
    prevention: Bounds checking in convert_forcing_to_rvt.py
- id: dt_rav_004
  severity: silent
  failure_domain: unit_conversion
  stage: s3
  symptom:
    description: Penman-Monteith PET computation fails or gives wrong values
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Air pressure in Pa instead of kPa
    explanation: 'Raven expects AIR_PRES in kPa. CMFD and the shared loader (pres_pa) give Pa.

      convert_forcing_to_rvt.py divides by 1000; without it 101325 Pa would be

      interpreted as 101325 kPa (1000x too high), breaking vapor pressure calculations.

      '
    affected_components:
    - convert_forcing_to_rvt.py
  remedy:
    action: Divide pressure by 1000 (Pa -> kPa)
    manual_steps:
    - 'Check AIR_PRES: should be 60-110 kPa, not 60000-110000'
    prevention: Bounds checking catches values outside 30-110 kPa
- id: dt_rav_005
  severity: silent
  failure_domain: unit_conversion
  stage: s3
  symptom:
    description: Raven reports zero precipitation despite forcing data being present
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Forcing data timestep does not match :TimeStep in .rvi
    explanation: 'If .rvi has :TimeStep 1.0 (daily) but .rvt provides 3-hourly data with

      interval=0.125, Raven may only read every 8th value. Conversely, if .rvt

      says interval=1.0 but data is actually 3-hourly, Raven reads all values

      as consecutive days, spreading 1 day''s data over 8 days.

      '
    affected_components:
    - .rvi file
    - .rvt file
  remedy:
    action: Ensure :TimeStep in .rvi matches the data interval in .rvt :Data block
    manual_steps:
    - Verify .rvt data interval (4th value in header line after :Data)
    - 'Typical: interval=1.0 for daily, interval=0.125 for 3-hourly'
    prevention: validate_raven_inputs.py checks timestep consistency
- id: dt_rav_006
  severity: fatal
  failure_domain: parameter_format
  stage: s1
  symptom:
    description: 'Raven crashes with ''Error: HRU area sum does not equal basin area'''
    error_pattern: HRU area.*does not equal
    detection_method: log_match
  diagnosis:
    root_cause: Sum of HRU areas in .rvh does not match SubBasin area
    explanation: 'Raven checks that the total area of all HRUs assigned to a subbasin

      matches the subbasin''s expected area. Floating-point rounding during

      HRU construction can cause tiny mismatches that trigger this error.

      '
    affected_components:
    - build_rvh_from_shapefile.py
    - .rvh file
  remedy:
    action: Rescale HRU areas to sum exactly to basin area
    tool_to_run: build_rvh_from_shapefile.py
    manual_steps:
    - Calculate sum of HRU AREA values in .rvh
    - Adjust largest HRU to absorb the rounding difference
    prevention: build_rvh_from_shapefile.py rescales automatically (1% tolerance)
- id: dt_rav_007
  severity: fatal
  failure_domain: parameter_format
  stage: s2
  symptom:
    description: Raven crashes with 'Soil profile not found' error
    error_pattern: Soil profile.*not found
    detection_method: log_match
  diagnosis:
    root_cause: Soil profile name in .rvh does not match any profile in .rvp
    explanation: 'The SOIL_PROFILE column in .rvh HRU table must exactly match a

      :SoilProfile name in .rvp. Case-sensitive. Common mismatch:

      .rvh uses ''DEFAULT_PROF'' but .rvp defines ''Default_Prof''.

      '
    affected_components:
    - .rvh file
    - .rvp file
  remedy:
    action: Ensure soil profile names match exactly between .rvh and .rvp
    tool_to_run: validate_raven_inputs.py
    prevention: validate_raven_inputs.py cross-checks all class names
- id: dt_rav_008
  severity: fatal
  failure_domain: parameter_format
  stage: s2
  symptom:
    description: Raven crashes with 'Land use class not found' error
    error_pattern: Land use class.*not found|Vegetation class.*not found
    detection_method: log_match
  diagnosis:
    root_cause: Land use or vegetation class in .rvh not defined in .rvp
    explanation: 'Every LAND_USE_CLASS and VEG_CLASS value in the .rvh HRU table must have

      a corresponding entry in :LandUseClasses and :VegetationClasses blocks

      in the .rvp file. If build_rvh and build_rvp use different naming conventions,

      this error occurs.

      '
    affected_components:
    - build_rvh_from_shapefile.py
    - build_rvp_parameters.py
  remedy:
    action: Regenerate .rvp from .rvh to ensure class names match
    tool_to_run: build_rvp_parameters.py --rvh_file <path>
    prevention: Always generate .rvp AFTER .rvh, using --rvh_file flag
- id: dt_rav_009
  severity: fatal
  failure_domain: parameter_format
  stage: s3
  symptom:
    description: Raven crashes with 'Bad data in time series' or 'Insufficient data'
    error_pattern: Bad data|Insufficient data|cannot read
    detection_method: log_match
  diagnosis:
    root_cause: Mismatch between declared data count and actual data lines in .rvt
    explanation: 'The .rvt :Data header declares the number of data points (e.g., ''365'' for 1 year

      daily). If the actual number of data lines differs, Raven either reads past end

      of data (corrupt values) or runs out of data mid-simulation.

      '
    affected_components:
    - convert_forcing_to_rvt.py
    - .rvt file
  remedy:
    action: Verify data count in .rvt header matches actual number of data lines
    manual_steps:
    - Count lines between ':Data' header and ':EndData'
    - Compare with the count value in the header line
    prevention: convert_forcing_to_rvt.py computes count from actual data length
- id: dt_rav_010
  severity: silent
  failure_domain: silent_error
  stage: s3
  symptom:
    description: Model runs but produces zero or near-zero discharge
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Forcing variable not provided — Raven fills with zeros silently
    explanation: 'If a required forcing variable (e.g., PRECIP) is missing from .rvt,

      Raven does NOT crash. It fills the missing variable with zeros.

      Zero precipitation = zero runoff = zero discharge. No warning is issued.

      This is the most dangerous silent failure mode.

      '
    affected_components:
    - .rvt file
  remedy:
    action: Verify all required forcing variables are present in .rvt
    tool_to_run: validate_raven_inputs.py
    manual_steps:
    - 'Check .rvt has at minimum: :Data PRECIP, :Data TEMP_MIN, :Data TEMP_MAX'
    - If using PET_PENMAN_MONTEITH, also need WIND_VEL, REL_HUMIDITY, SW_RADIA
    prevention: validate_raven_inputs.py checks forcing vs PET method requirements
- id: dt_rav_011
  severity: silent
  failure_domain: silent_error
  stage: s7
  symptom:
    description: Diagnostics.csv shows NSE = -9999.000 or NASH_SUTCLIFFE not computed
    error_pattern: '-9999'
    detection_method: value_comparison
  diagnosis:
    root_cause: No observation data provided for the gauged subbasin
    explanation: 'Raven computes performance diagnostics (NSE, KGE, etc.) only when observed

      data is provided in the .rvt file for the gauged subbasin. If no observed

      data is present, diagnostics are reported as -9999 — not as an error.

      '
    affected_components:
    - .rvt file
  remedy:
    action: Add observed discharge data to .rvt for the gauged subbasin
    manual_steps:
    - Add :ObservationData HYDROGRAPH 1 block to .rvt (subbasin ID = 1)
    - Ensure observed data covers the simulation period
    - Raven's missing data marker is -1.2345
    prevention: Warn user when no observed data is provided
- id: dt_rav_012
  severity: silent
  failure_domain: silent_error
  stage: s0
  symptom:
    description: Snow-dominated basin produces no snowmelt peaks despite snowfall
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Selected template has no snow process (e.g., GR4J, HYMOD, SAC-SMA)
    explanation: 'GR4J, HYMOD, and basic SAC-SMA do not include snow balance processes.

      In snow-dominated basins, all winter precipitation is treated as rain,

      producing runoff in winter instead of spring snowmelt peaks. The model

      runs fine — the physics is just wrong for the basin.

      '
    affected_components:
    - select_model_template.py
    - .rvi file
  remedy:
    action: Use a snow-capable template (HBV-EC, HMETS, UBC, MOHYSE, HYPR)
    tool_to_run: select_model_template.py --recommend --climate cold
    prevention: select_model_template.py warns if snow_capable=False for cold/alpine basins
- id: dt_rav_013
  severity: fatal
  failure_domain: dependency_mismatch
  stage: s4
  symptom:
    description: Raven crashes with 'Incompatible algorithm' or 'State variable not found'
    error_pattern: Incompatible|State variable.*not found
    detection_method: log_match
  diagnosis:
    root_cause: Mixing process algorithms from different model families
    explanation: 'Some algorithms expect specific state variables. For example, GR4J

      infiltration (INF_GR4J) expects GR4J-specific soil stores. Using it with

      HBV baseflow (BASE_LINEAR) may fail because the expected state variable

      routing does not match. Emulation templates are safe; custom builds risk this.

      '
    affected_components:
    - .rvi file
  remedy:
    action: Use a complete emulation template or verify algorithm compatibility
    tool_to_run: select_model_template.py
    manual_steps:
    - Use predefined templates (gr4j, hbv_ec, hmets, etc.) as starting point
    - If customizing, verify all algorithms reference existing state variables
    prevention: select_model_template.py generates compatible algorithm sets
- id: dt_rav_014
  severity: degraded
  failure_domain: dependency_mismatch
  stage: s4
  symptom:
    description: PET is zero or unrealistic despite correct forcing
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: PET method requires forcing variables not provided
    explanation: 'PET_PENMAN_MONTEITH requires WIND_VEL, REL_HUMIDITY, and SW_RADIA.

      If only PRECIP + TEMP_MIN + TEMP_MAX are provided, Raven falls back

      to internal generators that may produce inaccurate results. It does

      NOT error — it silently uses generated values which may be poor.

      '
    affected_components:
    - .rvi file
    - .rvt file
  remedy:
    action: Match PET method to available forcing or provide full forcing
    manual_steps:
    - 'For minimal forcing (P+T): use PET_OUDIN or PET_HARGREAVES_1985'
    - 'For full forcing (7 vars): use PET_PENMAN_MONTEITH'
    prevention: validate_raven_inputs.py checks PET method vs available forcing
- id: dt_rav_015
  severity: degraded
  failure_domain: calibration
  stage: s9
  symptom:
    description: DDS calibration does not improve after many iterations
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Wrong template for basin or parameter ranges too narrow
    explanation: 'If the selected model structure is fundamentally wrong for the basin

      (e.g., no snow process for a snow basin), no amount of parameter tuning

      will produce good results. Also, if parameter ranges are too narrow,

      DDS cannot explore the parameter space effectively.

      '
    affected_components:
    - calibrate_raven_dds.py
  remedy:
    action: Try a different model template or widen parameter ranges
    manual_steps:
    - Run ensemble comparison first (run_ensemble_comparison.py) to find best template
    - Then calibrate only the best-performing template
    - Widen parameter ranges if DDS hits bounds repeatedly
    prevention: Always run ensemble first, calibrate second
- id: dt_rav_016
  severity: degraded
  failure_domain: calibration
  stage: s9
  symptom:
    description: Calibrated model overfits — good calibration NSE but poor validation
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Too many parameters calibrated relative to data length
    explanation: 'Models with many parameters (SAC-SMA: 16, HBV: 21) can overfit short

      calibration periods. Rule of thumb: need at least 3 years of daily data

      per calibrated parameter. GR4J (4 params) is most resistant to overfitting.

      '
    affected_components:
    - calibrate_raven_dds.py
  remedy:
    action: Use fewer parameters or longer calibration period
    manual_steps:
    - Split data into calibration (70%) and validation (30%)
    - Report both calibration and validation metrics
    - For short records (<10 years), prefer GR4J or HYMOD (fewer params)
- id: dt_rav_017
  severity: fatal
  failure_domain: runtime
  stage: s6
  symptom:
    description: Raven reports 'Mass balance error exceeds tolerance'
    error_pattern: Mass balance.*error|water balance
    detection_method: log_match
  diagnosis:
    root_cause: Timestep too large for the process algorithms, or numerical instability
    explanation: 'Some process algorithms (especially routing) can become numerically unstable

      at large timesteps. Diffusive wave routing with daily timestep on small

      basins may produce mass balance violations.

      '
    affected_components:
    - .rvi file
  remedy:
    action: Reduce timestep or use simpler routing
    manual_steps:
    - Change :TimeStep from 1.0 to 0.25 (6-hourly)
    - Or change :Routing to ROUTE_NONE and :CatchmentRoute to ROUTE_DUMP
- id: dt_rav_018
  severity: fatal
  failure_domain: runtime
  stage: s6
  symptom:
    description: Raven crashes with segmentation fault
    error_pattern: Segmentation fault|SIGSEGV
    detection_method: log_match
  diagnosis:
    root_cause: Stack overflow from too many HRUs or very long simulation period
    explanation: 'Raven allocates arrays proportional to (n_HRUs * n_timesteps * n_state_variables).

      Very large domains (>10,000 HRUs) or very long periods (>50 years daily) can

      exceed the default stack size.

      '
    affected_components:
    - Raven binary
  remedy:
    action: Reduce HRU count or increase stack size
    manual_steps:
    - Aggregate HRUs (use lumped strategy instead of fine-grained)
    - 'Or increase stack: ulimit -s unlimited before running'
    - Or recompile Raven with -Wl,-z,stacksize=268435456
- id: dt_rav_019
  severity: silent
  failure_domain: coupling
  stage: s10
  symptom:
    description: Raven and VIC disagree strongly despite same forcing and basin
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Expected — different model structures produce different results
    explanation: 'Raven and VIC use fundamentally different physics. A 20-50% difference in

      mean discharge is EXPECTED with uncalibrated parameters. This is NOT an error

      — it quantifies structural uncertainty. Only flag as an issue if:

      (1) correlation r < 0.3 (timing completely wrong), or

      (2) volume ratio outside 0.3-3.0 (order of magnitude wrong).

      '
    affected_components:
    - raven_vic_comparison.py
  remedy:
    action: Accept differences as structural uncertainty unless extreme
    manual_steps:
    - 'Check correlation (timing): r > 0.5 is acceptable'
    - 'Check volume ratio: 0.5-2.0 is acceptable for uncalibrated'
    - Calibrate both models, then compare
- id: dt_rav_020
  severity: silent
  failure_domain: coupling
  stage: s10
  symptom:
    description: Raven discharge has different timing than VIC (peaks early/late)
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Different routing and runoff generation mechanisms
    explanation: 'VIC uses variable infiltration curve + Lohmann routing (unit hydrograph).

      Raven emulations (HBV, GR4J) use their own infiltration + optional routing.

      Different runoff generation = different peak timing. Routing adds further

      lag. Compare with observed data to determine which is more realistic.

      '
    affected_components:
    - .rvi process selection
    - VIC configuration
  remedy:
    action: Use observed data as reference rather than comparing models to each other
    manual_steps:
    - Plot Raven, VIC, and observed on same graph
    - Cross-correlate to find lag
- id: dt_rav_021
  severity: fatal
  failure_domain: compilation
  stage: installation
  symptom:
    description: Compilation fails with undefined reference to netcdf functions
    error_pattern: undefined reference to.*nc_|netcdf
    detection_method: log_match
  diagnosis:
    root_cause: NetCDF option enabled but library not linked
    explanation: 'If Makefile has CXXFLAGS += -Dnetcdf uncommented but LDLIBS does not

      point to the correct NetCDF library path, compilation succeeds but

      linking fails.

      '
    affected_components:
    - Makefile
  remedy:
    action: Either disable NetCDF (comment out -Dnetcdf) or set correct library path
    manual_steps:
    - 'For basic Raven (no NetCDF I/O): leave -Dnetcdf commented out in Makefile'
    - 'For NetCDF support: LDLIBS += -L/usr/lib/x86_64-linux-gnu -lnetcdf'
- id: dt_rav_022
  severity: fatal
  failure_domain: runtime
  stage: s6
  symptom:
    description: 'Raven.exe: Permission denied'
    error_pattern: Permission denied
    detection_method: log_match
  diagnosis:
    root_cause: Binary not marked as executable after compilation
    explanation: 'After compiling with make or g++, the output binary may not have

      execute permission depending on umask settings.

      '
    affected_components:
    - Raven.exe
  remedy:
    action: chmod +x Raven.exe
    manual_steps:
    - chmod +x KISSPATH_BINARIES/raven/Raven.exe
- id: dt_rav_023
  severity: degraded
  failure_domain: silent_error
  stage: s5
  symptom:
    description: First 1-2 years of simulation show unrealistic discharge spikes or dips
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Cold start spinup artifact — initial soil moisture too high or too low
    explanation: 'Default initial conditions (zero or arbitrary soil moisture) take 1-2 years

      to equilibrate. During spinup, discharge may be unrealistically high (if initial

      soil is over-saturated) or low (if initially dry). This is normal and expected.

      '
    affected_components:
    - generate_rvc_initial.py
    - .rvc file
  remedy:
    action: Discard first 1-2 years as spinup, or use solution.rvc from previous run
    manual_steps:
    - Set simulation start 2 years before analysis period
    - Or copy solution.rvc from a completed run as the new .rvc
    prevention: generate_rvc_initial.py uses climate-aware defaults to reduce spinup
- id: dt_rav_024
  severity: silent
  failure_domain: silent_error
  stage: s8
  symptom:
    description: Ensemble models produce identical results despite different templates
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: All ensemble members share the same .rvp — template-specific parameters not applied
    explanation: 'If the ensemble runner copies the same .rvp to all run directories without

      regenerating template-specific parameters, all models effectively use the same

      parameters. The .rvi differs (process algorithms) but parameters are identical,

      which may or may not produce identical output depending on the algorithm.

      '
    affected_components:
    - run_ensemble_comparison.py
  remedy:
    action: Regenerate .rvp for each template using build_rvp_parameters.py
    tool_to_run: run_ensemble_comparison.py (already does this internally)
    prevention: run_ensemble_comparison.py generates template-specific .rvp for each member
- id: dt_rav_025
  severity: silent
  failure_domain: silent_error
  stage: s3
  symptom:
    description: Raven fills missing forcing with its internal generators — results differ from expectations
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: Raven silently generates missing forcing variables using internal functions
    explanation: 'Raven has 40+ ''forcing function generators'' that can estimate missing

      variables from those provided. For example, TEMP_AVE from TEMP_MIN+TEMP_MAX,

      or SW_RADIA from latitude+day_of_year. These are approximations and may

      differ significantly from actual measurements. Raven does NOT warn when

      using generators — it simply uses them when data is missing.

      '
    affected_components:
    - .rvt file
  remedy:
    action: Provide as many forcing variables as available to minimize reliance on generators
    manual_steps:
    - 'Include at minimum: PRECIP, TEMP_MIN, TEMP_MAX'
    - 'Preferably also: TEMP_AVE, SW_RADIA, WIND_VEL'
    - Check ForcingFunctions.csv to see what Raven generated internally
- id: dt_rav_028
  severity: fatal
  failure_domain: parameter_format
  stage: s0
  symptom:
    description: Raven v4.1 rejects GR4J_X1-X4 as GlobalParameter — 'Unrecognized/invalid global parameter
      name'
    error_pattern: 'CGlobalParams::SetGlobalProperty: Unrecognized/invalid global parameter name (GR4J_X1)'
    detection_method: error_file
  diagnosis:
    root_cause: select_model_template.py and build_rvp_parameters.py place GR4J parameters as :GlobalParameter
      commands. But Raven v4.1 requires GR4J_X2/X3 as soil parameters (SoilParameterList), GR4J_X4 as
      a land-use parameter (LandUseParameterList), and GR4J_X1 is encoded implicitly via soil_thickness
      * porosity = X1/1000.
    explanation: 'This affects all model templates in the generic tools. Each Raven emulation has

      specific requirements for WHERE parameters must be defined (global vs soil vs land-use

      vs vegetation). The Raven User Manual documents this per-template, but the generic tools

      treat all parameters as global. The working Chaohe test used hand-crafted templates that

      correctly placed parameters per Raven source code requirements.

      '
    affected_components:
    - select_model_template.py
    - build_rvp_parameters.py
  remedy:
    action: Use hand-crafted .rvi/.rvp templates per model (as in run_ensemble_v2.py). Generic tools need
      major refactoring to properly route parameters.
    manual_steps:
    - 'GR4J: X1 via soil_thickness*porosity*1000, X2/X3 as SoilParameterList, X4 as LandUseParameterList'
    - 'HBV: soil params in SoilParameterList, melt/refreeze in LandUseParameterList'
    - 'HYMOD: BASEFLOW_COEFF per soil class, PDM_B as LandUseParameterList'
- id: dt_rav_029
  severity: fatal
  failure_domain: dependency_mismatch
  stage: s2
  symptom:
    description: MOHYSE crashes with 'required soil property HBV_BETA not included' — hidden dependency
    error_pattern: required soil property HBV_BETA
    detection_method: log_match
  diagnosis:
    root_cause: INF_HBV infiltration algorithm (used internally by MOHYSE) requires HBV_BETA as a soil
      parameter. MOHYSE also requires MOHYSE_PET_COEFF (global) and AET_COEFF (land use) — none documented
      in the emulation template.
    affected_components:
    - select_model_template.py
    - build_rvp_parameters.py
  remedy:
    action: Add HBV_BETA to SoilParameterList, MOHYSE_PET_COEFF to GlobalParameter, AET_COEFF to LandUseParameterList
- id: dt_rav_030
  severity: fatal
  failure_domain: parameter_format
  stage: s6
  symptom:
    description: Raven exits with 'Cannot find or read .rvc file' even for cold start
    error_pattern: Cannot find or read .rvc
    detection_method: log_match
  diagnosis:
    root_cause: Raven v4.1 requires a .rvc file to exist even if empty. Unlike VIC which runs without
      IC, Raven insists on finding the file path specified in the .rvi.
    affected_components:
    - generate_rvc_initial.py
  remedy:
    action: 'Create a minimal .rvc file with just a comment: ''# Empty initial conditions — cold start'''
- id: dt_rav_031
  severity: fatal
  failure_domain: parameter_format
  stage: s2
  symptom:
    description: build_rvp_parameters.py generates wrong class names from comma-separated .rvh — trailing
      commas
    error_pattern: WETLAND,
    detection_method: value_comparison
  diagnosis:
    root_cause: parse_rvh_classes() uses line.split() (whitespace) on comma-separated HRU lines, producing
      tokens like 'WETLAND,' with trailing commas. Class names don't match between .rvh and .rvp.
    affected_components:
    - build_rvp_parameters.py
  remedy:
    action: Detect comma in line and use split(',') + strip() for CSV format
- id: dt_rav_032
  severity: fatal
  failure_domain: parameter_format
  stage: s2
  symptom:
    description: build_rvp_parameters.py reads AQUIFER_PROFILE as TERRAIN_CLASS — wrong column index
    error_pattern: '[NONE]'
    detection_method: value_comparison
  diagnosis:
    root_cause: 'Parser reads column [9] as terrain class, but 13-column .rvh format has AQUIFER_PROFILE
      at [9], TERRAIN_CLASS at [10]. Order: ID(0) AREA(1) ELEV(2) LAT(3) LON(4) BASIN(5) LU(6) VEG(7)
      SOIL(8) AQUIFER(9) TERRAIN(10) SLOPE(11) ASPECT(12)'
    affected_components:
    - build_rvp_parameters.py
  remedy:
    action: Changed to read parts[10] for terrain class
- id: dt_rav_033
  severity: fatal
  failure_domain: parameter_format
  stage: s0
  symptom:
    description: Raven v4.1 rejects :SWCanopyCorrect and :ExchangeFlow2 — unrecognized commands from generic
      template
    error_pattern: Unrecognized|unrecognized
    detection_method: log_match
  diagnosis:
    root_cause: select_model_template.py generates .rvi with commands that exist in Raven documentation
      but are not compiled into v4.1 binary (:SWCanopyCorrect, :ExchangeFlow2). The Raven source code
      has conditional compilation flags.
    affected_components:
    - select_model_template.py
  remedy:
    action: Use hand-crafted per-model templates validated against Raven v4.1 binary. Generic template
      generation needs version-awareness.
- id: dt_rav_034
  severity: major
  failure_domain: output_convention
  stage: s7
  symptom:
    description: External NSE/KGE differ from Raven's own Diagnostics.csv, and the paired obs column in
      Hydrographs.csv sits one row BELOW the raw gauge value for the same calendar date — a silent one-timestep
      lag in every externally scored metric
    error_pattern: '[NONE]'
    detection_method: value_comparison
  diagnosis:
    root_cause: 'Hydrographs.csv is PERIOD-ENDING (RavenUsersManual v4.1, ''Output files'': ''reports
      period-ending time-averaged flows for the preceding time step ... the initial flow conditions at
      the start of the first time step are included''), while :ObservationData input has been period-STARTING
      since v2.7. So the row stamped date d holds the flow of calendar day d-1, and row 0 is only the
      initial condition. Joining a calendar-dated gauge series on Raven''s raw date label pairs sim(day
      d) with obs(day d-1). Verified at Tangnaihai: raw gauge 2011-12-31=277 appears in the Hydrographs
      row stamped 2012-01-01.'
    affected_components:
    - parse_raven_output.py
    - any run script with its own read_hydrograph helper
  remedy:
    action: 'Use parse_raven_output.load_discharge_series() (or parse_hydrographs(date_convention=''period_ending'')),
      which shifts the stamp back one timestep and drops the initial-condition row. Proof of correctness:
      after the shift, Raven''s own ''(observed)'' column equals the raw gauge file on identical calendar
      dates (3286 days, max abs diff 0.0). At Tangnaihai/UBC the fix moved held-out NSE 0.6222 -> 0.6253
      and made the external number reproduce Raven''s internal pairing. NEVER hand-roll a Hydrographs
      reader in a run script.'
- id: dt_rav_035
  severity: major
  failure_domain: water_balance
  stage: s7
  symptom:
    description: validate_water_balance reports a huge closure FAIL (e.g. residual 76.7% of P, dS numerically
      equal to cumulative ET) on a run whose native 'MB Error [mm]' column closes to machine zero
    error_pattern: residual_pct|FAIL
    detection_method: value_comparison
  diagnosis:
    root_cause: 'WatershedStorage.csv ''Total [mm]'' is not physical storage: it also contains the ''Cum.
      Losses to Atmosphere'' ACCUMULATOR (6744.8 of 6828.6 mm after 12 alpine years at Tangnaihai). Taking
      dS = delta(Total) therefore double-counts ET and produces a bogus residual. The checker fault is
      post-processing, not a model or unit error.'
    affected_components:
    - parse_raven_output.py
    - run-script water-balance helpers
  remedy:
    action: 'Use parse_raven_output.compute_water_balance(): P/ET/Q from Cum. Inputs / Cum. Losses to
      Atmosphere / Cum. Outflow, and dS from the PHYSICAL stores only (exclude every ''Cum.*'', ''Total'',
      ''MB Error'' and the period-ending rainfall/snowfall rate columns). At Tangnaihai this turned FAIL/76.7%
      into PASS/0.0% (P 8877.1, ET 6744.8, Q 2213.5, dS -81.2 mm) and it cross-checks against Raven''s
      own MB Error (-1.8e-12 mm). Always report raven_mb_error_mm alongside: if THAT is large the fault
      really is in the model/config.'
- id: dt_rav_036
  severity: major
  failure_domain: experiment_design
  stage: s8
  symptom:
    description: Multi-emulation study reports 'best of N emulations' held-out NSE, but the winner was
      chosen using that same held-out window (or Raven's full-obs-period Diagnostics.csv, which spans
      it)
    error_pattern: '[NONE]'
    detection_method: value_comparison
  diagnosis:
    root_cause: Model-structure choice is a tuning decision. Raven's Diagnostics.csv NASH_SUTCLIFFE is
      computed over the entire :ObservationData record, so ranking on it — or on the validation-window
      score — leaks the held-out period into selection and makes the reported number optimistically biased
      rather than a clean out-of-sample estimate.
    affected_components:
    - run_ensemble_comparison.py
    - multi-emulation run scripts
  remedy:
    action: Rank on the CALIBRATION-window score (parse_raven_output.select_best_member(members, cal_key='cal');
      run_ensemble_comparison now sets stats['rank_basis']='calibration_window_nse' when members carry
      cal scores) and report the held-out score OF THE CAL-SELECTED MEMBER. At Tangnaihai both rules pick
      ubc (cal NSE 0.728, next gr4j 0.619), so the held-out 0.625 is a genuine out-of-sample number; state
      the selection rule in the record either way.
- id: dt_rav_037
  severity: fatal
  failure_domain: output_parsing
  stage: s6
  symptom:
    description: run_raven.py returns diagnostics:{} and every DDS iteration reports the same objective,
      so 'calibrated' output is byte-identical to the defaults
    error_pattern: '[NONE]'
    detection_method: value_comparison
  diagnosis:
    root_cause: 'Two independent bugs in the same reader. (1) FILENAME: Raven prefixes output with :RunName,
      so a multi-emulation study writes <RunName>_Diagnostics.csv (tangnaihai_ubc_Diagnostics.csv); the
      tool only looked for Diagnostics.csv and <basin>_Diagnostics.csv. (2) PARSE: Diagnostics.csv is
      COLUMN-oriented (header ''observed_data_series,filename,DIAG_NASH_SUTCLIFFE,...'' + one data row
      per series), but the tool parsed it row-wise as name,value — parts[1] is the .rvt FILENAME, so float()
      always failed and the dict came back empty. calibrate_raven_dds.py had a private copy of the same
      broken parse, so its objective silently scored the -999 sentinel on every trial.'
    affected_components:
    - run_raven.py
    - calibrate_raven_dds.py
  remedy:
    action: run_raven.find_diagnostics_file() globs *Diagnostics.csv as a fallback; extract_diagnostics()
      reads the header row and maps header->value, exposing both DIAG_NASH_SUTCLIFFE and bare NASH_SUTCLIFFE.
      calibrate_raven_dds.py now IMPORTS extract_diagnostics instead of keeping its own copy — one reader
      for the KI.
- id: dt_rav_038
  severity: fatal
  failure_domain: calibration
  stage: s9
  symptom:
    description: 'DDS runs to completion and reports a best parameter set, but the hydrograph is unchanged:
      some templates (ubc, mohyse, hypr) had no calibration set at all, and sac_sma/hymod/hmets sets named
      parameters that build_rvp_parameters.py never writes'
    error_pattern: No calibration parameters defined for template
    detection_method: value_comparison
  diagnosis:
    root_cause: CALIBRATION_PARAMS was written from the literature parameter names (SAC_UZTWM, HYMOD_CMAX,
      ...) rather than from the .rvp this KI actually generates (SAC_PERC_ALPHA, POROSITY, PDM_B, ...).
      update_rvp_parameter() cannot write a name that is absent from the .rvp, so those DDS dimensions
      were no-ops — indistinguishable from a converged calibration.
    affected_components:
    - calibrate_raven_dds.py
  remedy:
    action: Added ubc/mohyse/hypr sets and corrected sac_sma/hymod to the emitted names; added UNIVERSAL_PARAMS
      (PET_CORRECTION, MELT_FACTOR, DD_MELT_TEMP, RAINSNOW_TEMP) to every template; and added resolve_calibration_set(),
      which intersects the set with rvp_parameter_names() and REPORTS the dropped names as skipped_parameters_absent_from_rvp.
      A template with no writable parameter now errors instead of pretending to calibrate.
- id: dt_rav_039
  severity: fatal
  failure_domain: process_selection
  stage: s0
  symptom:
    description: Every emulation calibrates to a large negative NSE in a cold, high-elevation basin; simulated
      runoff has a hard floor far above the observed mean no matter what parameters DDS picks
    error_pattern: '[NONE]'
    detection_method: value_comparison
  diagnosis:
    root_cause: 'Appendix F prescribes temperature-index PET (PET_OUDIN / PET_HAMON / PET_MOHYSE) for
      most emulations. With no radiation term these collapse at high elevation: at Tangnaihai (mean HRU
      elevation 4128 m) they gave 59-299 mm/yr PET versus 726 mm/yr from PET_PRIESTLEY_TAYLOR on identical
      CMFD forcing, leaving a ~440 mm/yr floor under simulated runoff against ~170 mm/yr observed — an
      empty feasible set, so the failure looks like bad calibration but is a process-selection fault.'
    affected_components:
    - select_model_template.py
  remedy:
    action: select_model_template.py --pet_method auto (the DEFAULT) substitutes PET_PRIESTLEY_TAYLOR
      for any TEMPERATURE_INDEX_PET reference, records the substitution in the JSON 'pet' block and in
      a comment in the .rvi, and --pet_method template restores Appendix F verbatim. Requires radiation/humidity/wind
      in the .rvt (convert_forcing_to_rvt.py --include_full_forcing).
- id: dt_rav_040
  severity: fatal
  failure_domain: forcing_distribution
  stage: s0
  symptom:
    description: 'An elevation-band .rvh built by s1 makes no difference to the result: snow accumulation,
      melt timing and the seasonal hydrograph are identical to a single lumped HRU, and cold-region emulations
      (HBV-EC, HMETS) calibrate to large negative NSE in an alpine basin'
    error_pattern: '[NONE]'
    detection_method: value_comparison
  diagnosis:
    root_cause: Raven defaults orocorr_temp / orocorr_precip / orocorr_PET to OROCORR_NONE (ParseInput.cpp:260-262)
      and select_model_template.py never emitted an :OroTempCorrect or :OroPrecipCorrect directive. With
      no directive CModel::CorrectTemp is a no-op, so EVERY HRU is forced with the gauge's own temperature
      and precipitation regardless of its ELEVATION attribute. At Tangnaihai five bands spanning 3217-5776
      m (2559 m of relief, gauge reference 4128 m) all saw one identical series, removing the accumulation/melt
      gradient that drives a snow-fed hydrograph. The elevation-band HRU strategy was silently inert —
      the run succeeds, nothing warns.
    affected_components:
    - select_model_template.py
    - build_rvh_from_shapefile.py
  remedy:
    action: 'select_model_template.py --orographic auto (the DEFAULT) reads the HRU elevations from the
      staged .rvh and, when relief >= 100 m, emits '':OroTempCorrect OROCORR_SIMPLELAPSE'' and '':OroPrecipCorrect
      OROCORR_SIMPLELAPSE''. Raven then declares ADIABATIC_LAPSE and PRECIP_LAPSE required, so build_rvp_parameters.py
      emits them automatically (it queries the binary via :CreateRVPTemplate) and calibrate_raven_dds.py
      calibrates them via SHARED_PARAMS. Use --orographic none to force the old lumped-forcing behaviour.
      NOTE: :OroPETCorrect does NOT accept OROCORR_SIMPLELAPSE (ParseInput.cpp case 18 takes only HBV/PRMS/UBCWM/NONE)
      — emitting it aborts the parse; leave PET correction at its default.'
- id: dt_rav_041
  severity: major
  failure_domain: forcing
  stage: s0
  symptom:
    description: Raven_errors.txt says 'SW_RADIA data supplied at gauge <name> but will not be used due
      to choice of forcing generation algorithm'; a radiation-based PET over-evaporates and the calibrator
      has to push PET_CORRECTION to its lower bound to compensate
    error_pattern: will not be used due to choice of forcing generation algorithm
    detection_method: log_parse
  diagnosis:
    root_cause: 'Raven''s default is SW_RAD_DEFAULT with CLOUDCOV_NONE: it computes CLEAR-SKY shortwave
      from latitude and date and applies no cloud attenuation, discarding any :Data SHORTWAVE present
      in the .rvt. Once s0 substitutes a radiation-based PET (dt_rav_039), potential evaporation is therefore
      driven by clear-sky radiation on every single day including overcast monsoon days. The run succeeds
      and the warning is easy to miss.'
    affected_components:
    - select_model_template.py
  remedy:
    action: resolve_sw_radiation() in select_model_template.py emits ':SWRadiationMethod SW_RAD_DATA'
      whenever the resolved PET method consumes radiation AND the .rvt carries :Data SHORTWAVE. Raven
      then uses the supplied (CMFD/MSWX) shortwave and sets cloud correction to NONE itself (ParseInput.cpp:3696).
      The decision is reported in the s0 JSON 'sw_radiation' block.
- id: dt_rav_043
  severity: major
  failure_domain: calibration
  stage: s9
  symptom:
    description: In a snow-dominated basin the calibrated hydrograph has the wrong seasonal shape (melt
      too early/late, spring peak wrong magnitude) even though DDS reports a converged best objective;
      the reported skipped_parameters_absent_from_rvp list contains MELT_FACTOR and/or DD_MELT_TEMP
    error_pattern: '[NONE]'
    detection_method: value_comparison
  diagnosis:
    root_cause: The shared degree-day melt parameters (MELT_FACTOR, DD_MELT_TEMP) only exist for templates
      that use POTMELT_DEGREE_DAY. UBC (POTMELT_UBCWM), HMETS (POTMELT_HMETS) and HBV-EC (POTMELT_HBV)
      each expose a DIFFERENT melt parameterisation — RAIN_MELT_MULT/CONV_MELT_MULT/COND_MELT_MULT/CC_DECAY_COEFF,
      MIN_MELT_FACTOR/MAX_MELT_FACTOR/DD_AGGRADATION/REFREEZE_FACTOR, MELT_FACTOR/MIN_MELT_FACTOR/REFREEZE_FACTOR/HBV_MELT_FOR_CORR.
      Those were absent from CALIBRATION_PARAMS, so the DOMINANT process in a cold basin was left entirely
      at its default while DDS tuned soil parameters around it.
    affected_components:
    - calibrate_raven_dds.py
  remedy:
    action: 'Each template''s own melt controls were added to CALIBRATION_PARAMS. Widening the search
      space REQUIRES widening the DDS budget with it (Tolson & Shoemaker 2007): measured for ubc at Tangnaihai
      with 16 free parameters, 250 iterations gave cal NSE 0.730 / held-out 0.548 / PBIAS +16.5% (DDS
      buys hydrograph shape with volume bias) while 1000 iterations gave cal NSE 0.762 / held-out 0.627
      / PBIAS +1.1%. If a wider parameter set generalises WORSE, raise --n_iterations before removing
      parameters.'
- id: dt_rav_044
  severity: fatal
  failure_domain: ki_integrity
  stage: all
  symptom:
    description: 'diagnostics/triplets.yaml documents a defect as fixed, and a prior run''s result.json
      reports the metric that fix produced, but the tool no longer contains the fix: s0 rejects --pet_method,
      s9 rejects --seed/--cal_start/--cal_end and errors with ''No calibration parameters defined for
      template: ubc'', and ''from parse_raven_output import load_discharge_series'' raises ImportError'
    error_pattern: 'unrecognized arguments: --pet_method|--cal_start|cannot import name ''load_discharge_series'''
    detection_method: exception
  diagnosis:
    root_cause: 'The KNOWLEDGE (triplets, notes, result.json) and the CODE are promoted through different
      paths. A review/rollback reverted the canonical tools to a pre-fix snapshot while leaving triplets.yaml
      and the recorded metrics in place, so the KI advertised a capability it no longer had. Encountered
      2026-07-27: dt_rav_034 through dt_rav_039 were all documented as fixed, all were absent from the
      tools, and the canonical tree was byte-identical to .kdt_snapshots/pre_test_Raven_20260726T164044Z.'
    affected_components:
    - select_model_template.py
    - calibrate_raven_dds.py
    - parse_raven_output.py
    - run_raven.py
  remedy:
    action: 'FIRST ACTION on this KI: verify the code matches the claims. Run `diff -r .kdt_snapshots/<latest>/tools
      <ki>/tools` and, for each triplet whose remedy names a CLI flag or function, check it is actually
      there — e.g. `grep -c ''add_argument("--cal_start'' tools/s9_calibration/calibrate_raven_dds.py`
      and `python -c "import sys;sys.path.insert(0,''tools/s7_output'');import parse_raven_output as p;p.load_discharge_series"`.
      Do NOT trust a triplet''s ''fixed'' state or a prior result.json metric as evidence that the tool
      can reproduce it.'
- id: dt_rav_046
  severity: major
  failure_domain: ki_integrity
  stage: s3
  symptom:
    description: 'The Raven forcing .rvt could only be made as a basin mean by first running the VIC
      forcing pipeline: convert_forcing_to_rvt.py without --lat/--lon read VIC 7-column ASCII forcing
      files from --forcing_dir, with the cells from --grid_nc (VIC basin_grid.nc) or guessed from VIC
      file names. A call with --grid_nc or a VIC forcing folder now fails.'
    error_pattern: 'unrecognized arguments: --grid_nc|give where to read the forcing, exactly one of'
    detection_method: error_message
  diagnosis:
    root_cause: 'The tool was first written on top of another model''s input files (VIC). Owner rule
      2026-10-02: a model KI builds its input straight from the data source with its own tool; no tool
      turns VIC input files into Raven input. The VIC ASCII reader (read_vic_forcing_file), --grid_nc,
      the file-name cell guessing, --forcing_prefix and --timestep_hours were REMOVED on 2026-10-03,
      together with the old triplets dt_rav_026 (VIC column order) and dt_rav_027 (VIC grid y/x), which
      only described that route.'
    affected_components:
    - convert_forcing_to_rvt.py
  remedy:
    action: 'Build the forcing directly: convert_forcing_to_rvt.py --forcing_source cmfd|mswx|nasa_power
      (required) with ONE of --lat --lon (one point), --points_csv (lat,lon rows) or --basin_shp (basin
      polygon, mean over every source cell centre inside it). The tool reads only through ki_tools_common.load_forcing.
      Do NOT restore the VIC route; comparing Raven RESULTS with VIC (tools/s10_coupling/raven_vic_comparison.py)
      is a different thing and stays.'
    tool_to_run: convert_forcing_to_rvt.py
    verification: 'Tangnaihai 2010, --basin_shp, cmfd: 1206 cells, 718.8 mm, equal to the raw 3-hourly
      store summed over the same cells (718.77 mm).'
- id: dt_rav_047
  severity: silent
  failure_domain: unit_conversion
  stage: s3
  symptom:
    description: 'When no VIC file was found the old tool fell to two hand-made NetCDF readers (read_cmfd_netcdf_for_cell,
      read_mswx_netcdf_for_cell). They either crashed with "NetCDF: HDF error", or returned precipitation
      near zero, or silently read the wrong year.'
    error_pattern: 'NetCDF: HDF error'
    detection_method: value_comparison
  diagnosis:
    root_cause: 'Three faults in the hand-made readers: (1) xr.open_dataset(path) with no engine fails
      on this server when xarray is loaded first (two HDF5 copies in python_env; the one loaded first
      wins); (2) CMFD precipitation was taken "as mm/3hr" although the store holds kg m-2 s-1 (a rate;
      the x10800 per 3-hour step was missing, a factor 10800 too small); (3) the top-level glob *{var}*{year}{month}*
      can match another year in the flat yearly layout.'
    affected_components:
    - convert_forcing_to_rvt.py
  remedy:
    action: 'Both readers were REMOVED (2026-10-03). The only reader is ki_tools_common.load_forcing (load_daily_forcing
      / load_daily_forcing_points), which opens with h5netcdf then the default engine, converts the
      CMFD rate to mm in the day and matches the year exactly. Never write a NetCDF forcing reader inside
      this KI.'
    tool_to_run: convert_forcing_to_rvt.py
- id: dt_rav_048
  severity: major
  failure_domain: silent_error
  stage: s3
  symptom:
    description: 'A lumped Raven model of a large basin is forced with ONE grid cell (--lat --lon at
      the outlet or centre). The volume bias is then hidden in the calibrated parameters; at Tangnaihai
      (121,972 km2) the CMFD cells inside the basin range from 363 to 1216 mm in 2010.'
    error_pattern: null
    detection_method: value_comparison
  diagnosis:
    root_cause: 'The only direct route of the old tool was one point (read_point_forcing). One cell
      for a 122,000 km2 basin is a sample of one; the basin mean existed only through VIC files.'
    affected_components:
    - convert_forcing_to_rvt.py
  remedy:
    action: 'Use --basin_shp <polygon>: the tool takes every source grid-cell centre inside the polygon
      (it says how many), reads them in one shared pass per year with load_daily_forcing_points and
      writes the cos(latitude)-weighted daily mean. It refuses a polygon with no cell centre inside
      or not fully on the source grid. --points_csv gives the plain mean of chosen points. Keep --lat/--lon
      for a basin inside one or two cells.'
    tool_to_run: convert_forcing_to_rvt.py
    verification: 'The summary JSON (<basin>_forcing_summary.json) gives n_points and mean_annual_precip_mm;
      check both.'
- id: dt_rav_049
  severity: fatal
  failure_domain: ki_integrity
  stage: s3
  symptom:
    description: 'models/Raven/run_and_score.py fails at s3: the tool rejects --points_csv, --gauge_elev,
      --obs_subbasin_id, --obs_start_date, --obs_end_date, and the module has no write_obs_rvt. Also:
      the main .rvt carried ":RedirectToFile <basin>_obs.rvt" but no tool wrote that file, and the gauge
      :Elevation was a made-up 500.0 m.'
    error_pattern: 'unrecognized arguments: --points_csv|has no attribute .write_obs_rvt'
    detection_method: error_message
  diagnosis:
    root_cause: 'An earlier improvement of the s3 tool (multi-point mean, gauge elevation, observation
      .rvt) was used by a real case but never promoted to the canonical KI (see dt_rav_044). With orographic
      corrections on (dt_rav_040) a gauge at 500 m for HRUs near 4000 m shifts every band''s temperature
      by about 20 degC.'
    affected_components:
