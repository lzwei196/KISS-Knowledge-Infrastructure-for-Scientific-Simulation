    '
  severity: minor
- id: dt_quincy_017
  symptom: 'The parameter converter (convert_parameters_to_quincy.py) raises a ValidationError or KeyError
    when reading the PFT parameter JSON file.

    '
  diagnosis: 'The PFT parameter JSON file is missing required keys or uses non-standard key names. QUINCY
    requires specific parameter names: vcmax25, jmax_vcmax_ratio, alpha_j, theta_j, ea_vcmax, ea_jmax,
    n_leaf_ref, vcmax_n_slope, g1_bb, r_maint_leaf, r_maint_stem, r_maint_root, r_growth_frac, rh_base,
    rh_q10, r'
  remedy: 'Use the exact parameter names from the QUINCY parameter reference table. Run convert_parameters_to_quincy.py
