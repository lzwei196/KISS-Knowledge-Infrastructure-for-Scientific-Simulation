# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: FATES
  language: fortran
  implementation:
    id: fates-ctsm
    version: ''
    _reason: No concrete FATES/CTSM tag surfaced in the streams; the runnable version is tied to the host
      CTSM/CLM checkout the component is compiled into.
    provenance: Fortran 2003+; FATES compiled as a component of the CTSM/CLM (or E3SM/ELM) host land model;
      runs only inside the host, not standalone.
  scientific_reference_version: FATES (Functionally Assembled Terrestrial Ecosystem Simulator), NGEE-Tropics/DOE;
    size- and age-structured cohort demographic DGVM of the ED/PPA lineage (Moorcroft, Hurtt & Pacala
    2001; Fisher et al. 2015), JSON-parameter-file era (post-2023)
inputs:
  forcing:
  - name: TBOT (air temperature)
    unit: K
    category: meteorology
    source_kind: forcing
    model_input_format: host DATM stream; FATES does not read forcing directly
    notes: Kelvin, not degC; values of 20-30 interpreted as ~-250 degC and kill all plant processes (dt_005).
  - name: PRECTmms (precipitation)
    unit: mm/s
    category: meteorology
    source_kind: forcing
    model_input_format: host DATM stream
    notes: mm/s, not mm/day; passing mm/day delivers 86,400x too much water (dt_006).
  - name: FSDS (downwelling shortwave radiation)
    unit: W/m2
    category: meteorology
    source_kind: forcing
    model_input_format: host DATM stream
    notes: W/m2, not MJ/m2/day (dt_007).
  - name: FLDS (downwelling longwave radiation)
    unit: W/m2
    category: meteorology
    source_kind: forcing
    model_input_format: host DATM stream
  - name: QBOT (specific humidity)
    unit: kg/kg
    category: meteorology
    source_kind: forcing
    model_input_format: host DATM stream
    notes: Specific humidity, not relative humidity or g/kg.
  - name: WIND (scalar wind speed)
    unit: m/s
    category: meteorology
    source_kind: forcing
    model_input_format: host DATM stream
  - name: PSRF (surface pressure)
    unit: Pa
    category: meteorology
    source_kind: forcing
    model_input_format: host DATM stream
    notes: Pa, not hPa/mbar.
  - name: CO2 concentration
    unit: ppmv
    category: atmospheric_composition
    source_kind: forcing
    model_input_format: co2_ppmv namelist / host stream (annual or fixed)
    notes: ppmv, not mol/mol; 0.0004 mol/mol must be 400 ppmv or CO2 fertilization is absent (dt_012).
  parameters:
  - name: fates_leaf_vcmax25top (max carboxylation rate at 25C)
    unit: umol/m2/s
    category: photosynthesis
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_leaf_slatop (specific leaf area at canopy top)
    unit: m2/gC
    category: leaf_trait
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_allom_d2h1 / d2h2 (DBH-to-height coefficients)
    unit: '-'
    category: allometry
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_allom_d2bl1 (DBH-to-leaf-biomass coefficient)
    unit: kgC
    category: allometry
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_wood_density
    unit: g/cm3
    category: allometry
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_turnover_leaf (leaf longevity)
    unit: yr
    category: turnover
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_mort_scalar_cstarvation (carbon-starvation mortality scalar)
    unit: '-'
    category: mortality
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_mort_bmort (background mortality rate)
    unit: 1/yr
    category: mortality
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_mort_scalar_hydrfailure (hydraulic-failure mortality scalar)
    unit: '-'
    category: mortality
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
    notes: Only active when plant hydraulics is enabled.
  - name: fates_fire_nignitions (lightning ignition density)
    unit: 1/km2/day
    category: fire
    source_kind: calibrated
    model_input_format: FATES JSON parameter file
    notes: Only active when SPITFIRE is enabled.
  - name: fates_phen_drought_threshold (drought phenology threshold)
    unit: MPa
    category: phenology
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
  - name: fates_recruit_seed_supplement (external seed-rain supplement)
    unit: '-'
    category: recruitment
    source_kind: calibrated
    model_input_format: FATES JSON parameter file (per PFT)
    notes: Must be > 0 to recruit from bare ground.
  - name: soil texture (clay / sand / organic fraction per layer)
    unit: '%'
    category: substrate
    source_kind: dataset_lookup
    model_input_format: host surface dataset (NetCDF); clay+sand+silt sum to 100% per layer
  - name: PFT fractional coverage
    unit: fraction
    category: land_cover
    source_kind: dataset_lookup
    model_input_format: host surface dataset; fractions sum to 1.0
  initial_conditions:
  - name: initial vegetation structure (bare ground or inventory cohorts)
    unit: DBH cm, density stems/m2
    category: vegetation_state
    source_kind: user_provided
    model_input_format: cold start (bare ground) or inventory initialization file
    notes: Bare-ground default needs 50-100 yr spinup; inventory DBH must be in cm (dt_008), heights in
      m (dt_009).
  - name: restart state (all prognostic cohort/patch pools)
    unit: varies
    category: restart_state
    source_kind: user_provided
    model_input_format: NetCDF restart file (*.clm2.r.*.nc)
    notes: Restart files are not backward-compatible across major FATES versions; upgrading requires a
      fresh cold start (dt_018).
  boundary_conditions:
  - name: use_fates
    unit: logical
    category: control_switch
    source_kind: user_provided
    model_input_format: host namelist; .true. when a FATES compset is used
  - name: fates_spitfire_mode (fire module selector, 0-4)
    unit: code
    category: control_switch
    source_kind: user_provided
    model_input_format: host namelist; default 0 (fire OFF)
    notes: Default 0 yields zero fire disturbance regardless of weather (dt_016).
  - name: use_fates_planthydro (plant hydraulics toggle)
    unit: logical
    category: control_switch
    source_kind: user_provided
    model_input_format: host namelist; default .false.
    notes: Experimental; may be unreliable or crash (dt_017).
  - name: fates_parteh_mode (allocation hypothesis selector)
    unit: code
    category: control_switch
    source_kind: user_provided
    model_input_format: host namelist; default 1 (carbon-only)
  - name: use_fates_sp (satellite-phenology / prescribed-vegetation mode)
    unit: logical
    category: control_switch
    source_kind: user_provided
    model_input_format: host namelist; default .false. (full ED demography active)
  - name: compset selection
    unit: label
    category: configuration
    source_kind: user_provided
    model_input_format: host CIME compset (e.g. I2000Clm51Fates); determines which features are active
    notes: Default compsets have fire, logging, hydraulics and CNP OFF.
  - name: land-use transitions (LUH2)
    unit: fraction/yr
    category: external_driver
    source_kind: user_provided
    model_input_format: host land-use stream; consumed by FatesLandUseChangeMod
  - name: logging / timber-harvest rates
    unit: fraction/yr
    category: external_driver
    source_kind: user_provided
    model_input_format: host stream; consumed by EDLoggingMortalityMod
outputs:
  primary:
  - name: FATES_VEGC
    unit: kgC/m2
    description: Total live vegetation carbon (sum of leaf, fineroot, sapwood, structural and storage
      pools), area-normalized.
    validation_rank: 3
    emitted_in: host history stream (*.clm2.h0.*.nc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Already kgC/m2; do NOT re-multiply by FATES_NPLANT (dt_001).
        - Requires adequate spinup or inventory init, else near-zero.
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Gridded biomass products carry their own allometric assumptions.
      detrending_options:
      - none
  - name: FATES_GPP
    unit: kgC/m2/s
    description: Vegetation gross primary production.
    validation_rank: 1
    emitted_in: host history stream (*.clm2.h0.*.nc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - kgC/m2/s; x1000 x86400 -> gC/m2/day before comparing to flux-tower GPP (dt_004).
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats: []
      detrending_options:
      - none
  - name: FATES_NPP
    unit: kgC/m2/s
    description: Vegetation net primary production (GPP minus autotrophic respiration).
    validation_rank: 2
    emitted_in: host history stream (*.clm2.h0.*.nc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - kgC/m2/s unit conversion as for GPP.
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats: []
      detrending_options:
      - decadal_mean
      - linear_residual
  - name: FATES_LAI
    unit: m2/m2
    description: Vegetation leaf area index.
    validation_rank: 4
    emitted_in: host history stream (*.clm2.h0.*.nc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        - timing_accuracy
        determining_metric: nse
        caveats:
        - Phenology timing (leaf-on/off DOY) is a primary evaluation target.
      - obs_shape: spatial_time_series
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats: []
      detrending_options:
      - none
  - name: FATES_NPLANT
    unit: stems/m2
    description: Cohort plant number density (demographic state).
    validation_rank: 5
    emitted_in: host history stream (*.clm2.h0.*.nc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_snapshot
        comparison_mode: scalar_comparison
        metric_families:
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - stems/m2; x10000 -> stems/ha for forest-inventory comparison (dt_002).
      detrending_options:
      - none
  - name: FATES_MORTALITY
    unit: stems/m2/yr
    description: Total vegetation cohort mortality rate.
    validation_rank: 6
    emitted_in: host history stream (*.clm2.h0.*.nc)
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Density units as for FATES_NPLANT (dt_002).
      detrending_options:
      - none
  - name: FATES_DISTURBANCE_RATE_FIRE
    unit: fraction/yr
    description: Fire disturbance rate (area fraction disturbed by fire per year).
    validation_rank: 7
    emitted_in: host history stream (*.clm2.h0.*.nc)
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Identically zero unless fates_spitfire_mode>0 (dt_016).
      detrending_options:
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Biomass values are orders of magnitude too large or too small when comparing FATES output to
    literature
  diagnosis: FATES tracks organ masses as kgC per individual plant, but output variables like FATES_VEGC
    are already area-normalized (kgC/m²). Confusion arises when users multiply already-normalized output
    by stem density again, or when comparing per-individual internal variables to per-area published values.;
    I
  remedy: 'Use FATES_VEGC directly as kgC/m². Do not re-multiply by FATES_NPLANT.; parse_fates_output;
    [''Check FATES_VEGC range — typical tropical forest: 10-25 kgC/m²'', ''If values are ~0.001-0.01,
    you may be looking at per-individual values'', ''If values are >1000, you likely multiplied by stems/ha
    (10000x err'
  severity: silent
- id: dt_002
  symptom: Stem density appears unrealistically high (millions of stems) or unrealistically low (fraction
    of a stem)
  diagnosis: Confusion between stems/m² (FATES internal) and stems/ha (forestry convention). FATES uses
    stems/m², where 0.05 stems/m² = 500 stems/ha.; FATES_NPLANT output is in stems/m². Forestry literature
    reports stems/ha. The conversion factor is 10,000 (1 ha = 10,000 m²). A typical tropical forest has
    400-60
  remedy: Multiply FATES_NPLANT by 10,000 to get stems/ha for comparison with field data; parse_fates_output;
    ['Check FATES_NPLANT range — should be 0.01-0.1 stems/m² for forests', 'Multiply by 10,000 for stems/ha
    comparison']; parse_fates_output warns if NPLANT > 5 stems/m²
  severity: silent
- id: dt_003
  symptom: Patch-level calculations produce values that are exactly 10,000x too large or too small
  diagnosis: "The FATES notional patch area is 10,000 m² (1 ha). Calculations that assume 1 m² patch area\
    \ produce 10,000x errors.; In EDTypesMod.F90, the notional patch area is defined as:\n  area = 10000.0_r8\
    \  ! m²\n  area_inv = 1.0e-4_r8\nAll patch-level densities and fluxes are normalized to this 1-ha\
    \ area.\n; ['E"
  remedy: Remember that FATES patch area = 10,000 m² = 1 ha for all density calculations; None; ['When
    computing total values, use area = 10,000 m²', 'When converting to per-ha, values are already per-ha']
  severity: silent
- id: dt_004
  symptom: GPP values are 1000x too small or 86400x too small when compared to published daily values
  diagnosis: FATES outputs GPP in kgC/m²/s. Most published GPP data is in gC/m²/day. The full conversion
    requires multiplying by 1000 (kg→g) AND 86400 (s→day).; FATES_GPP is in kgC/m²/s. A typical tropical
    forest GPP of ~10 gC/m²/day appears as ~1.16e-7 kgC/m²/s in FATES output. Missing either the ×1000
    (kg→g) o
  remedy: 'Apply full conversion: FATES_GPP × 1000 × 86400 = gC/m²/day; parse_fates_output; [''FATES_GPP
    (kgC/m²/s) × 1000 = gC/m²/s'', ''gC/m²/s × 86400 = gC/m²/day'', ''Tropical forest GPP should be ~5-15
    gC/m²/day'', ''If you get 0.005-0.015, you forgot ×1000'', ''If you get ~500-1500, you applied an
    extra factor''];'
  severity: silent
- id: dt_005
  symptom: FATES produces near-zero GPP or crashes with temperature-related errors
  diagnosis: Air temperature provided in °C instead of Kelvin. Values of 20-30 are interpreted as 20-30
    K (-253 to -243°C), which kills all plant processes.; CLM/DATM expects temperature in Kelvin (K).
    A temperature of 25°C must be entered as 298.15 K. If °C values are passed directly, FATES sees near-absolute-z
  remedy: 'Add 273.15 to all temperature values before passing to DATM; None; [''Check temperature range
    in forcing file: should be 220-320 K'', ''If values are -40 to 50, they are in °C — add 273.15''];
    Check TBOT variable range before case submission'
  severity: silent
- id: dt_006
  symptom: Unrealistic water balance — either extreme flooding or extreme drought in simulation
  diagnosis: 'Precipitation provided in mm/day instead of mm/s. DATM expects mm/s. A value of 10 mm/day
    entered as 10 mm/s = 864,000 mm/day = 864 m/day of rain.; CLM/DATM expects precipitation as PRECTmms
    in mm/s. Conversion: mm/day ÷ 86400 = mm/s. A typical rainfall of 5 mm/day = 5.79e-5 mm/s. If mm/day
    values a'
  remedy: 'Divide precipitation by 86400 to convert mm/day to mm/s; None; [''Check PRECTmms range: should
    be 0 to ~0.05 mm/s for most climates'', ''If max > 1.0, values are likely in mm/day or mm/hr'', ''mm/day
    ÷ 86400 = mm/s'', ''mm/hr ÷ 3600 = mm/s'']; Validate max precip before submission: >0.1 mm/s is extremely
    ra'
  severity: silent
- id: dt_007
  symptom: Plant growth unrealistically slow (radiation in MJ/m²/day) or photosynthesis saturated (radiation
    too high)
  diagnosis: 'Shortwave radiation in MJ/m²/day instead of W/m². DATM expects W/m². Values of 15-25 MJ/m²/day
    should be 175-290 W/m².; CLM/DATM expects FSDS in W/m² (instantaneous). Conversion: MJ/m²/day × 1e6
    / 86400 = W/m². If MJ values are used directly, FATES receives ~86,400x too little radiation.

    ; [''DATM'', '
  remedy: 'Convert MJ/m²/day to W/m²: multiply by 1,000,000 / 86,400 = 11.574; None; [''Check FSDS range:
    should be 0 to ~1200 W/m² (peak noon)'', ''If max < 50, values are likely in MJ/m²/day'', ''MJ/m²/day
    × 11.574 = W/m² (mean daily)'']; Flag FSDS max < 100 or > 1400 as suspicious'
  severity: silent
- id: dt_008
  symptom: Allometric calculations produce trees with unrealistic dimensions (too tall, too short, or
    impossible crown areas)
  diagnosis: 'DBH provided in mm or m instead of cm. FATES allometry uses DBH in cm. A 30 cm tree entered
    as 30 mm (3 cm) or 0.3 m (30 cm units confusion).; All FATES allometric equations use DBH in centimeters
    (cm). FatesAllometryMod.F90 functions: h_allom(dbh_cm), bagw_allom(dbh_cm), etc. Inventory data often
    u'
  remedy: 'Ensure all DBH values are in centimeters before passing to FATES; convert_fates_params; [''Check
    DBH range: typical trees 1-200 cm'', ''If values are 10-2000, they may be in mm (÷10)'', ''If values
    are 0.01-2.0, they may be in m (×100)'']; Validate fates_allom_dbh_maxheight range in parameter file'
  severity: silent
- id: dt_009
  symptom: Tree heights in FATES output do not match field observations by a factor of 100 or 0.3048
  diagnosis: 'Height parameters or inventory data in cm or feet instead of meters.; FATES height is in
    meters (m). Common errors: - Field data in cm: divide by 100 - Field data in feet: multiply by 0.3048
    - Allometric height parameters are PFT-specific in the JSON file

    ; [''FatesAllometryMod'', ''FatesInventoryInitM'
  remedy: 'Convert heights to meters: cm÷100, ft×0.3048; None; [''Check fates_allom_d2h1 parameter units'',
    ''Verify max height makes sense: tropical trees up to 50-60 m'']'
  severity: silent
- id: dt_010
  symptom: Crown area fractions exceed 1.0 or are near zero when they should not be
  diagnosis: 'Confusion between crown area in m² (per individual) and canopy area fraction (m²/m², 0-1).
    FATES_CANOPY_AREA is already a fraction.; FATES outputs FATES_CANOPY_AREA as a fraction (0 to 1, can
    exceed 1 with understory). Individual crown areas are in m². The crown area allometry (carea_allom)
    returns '
  remedy: Use FATES_CANOPY_AREA directly as fraction. For per-tree crown area, use carea_allom.; parse_fates_output;
    ['FATES_CANOPY_AREA should be 0-1 for single canopy layer', 'Values >1 indicate multi-layer canopy
    (not an error)']
  severity: silent
- id: dt_011
  symptom: Soil moisture stress is permanently on or permanently off regardless of precipitation
  diagnosis: Soil volumetric water content provided as percentage (0-100) instead of fraction (0-1). CLM
    soil moisture is in m³/m³ (fraction).; CLM soil layers store volumetric water content as m³/m³ (0
    to porosity). If percentage values (0-100) are used, CLM interprets them as volumetric fractions,
    meaning soil
  remedy: Divide soil water percentage by 100 to get m³/m³ fraction; convert_surface_data; ['Soil water
    should be 0.0 to ~0.5 m³/m²', 'If values are 10-50, they are percentages — divide by 100']
  severity: silent
- id: dt_012
  symptom: CO₂ fertilization effect is absent or vegetation grows as if in pre-industrial conditions
  diagnosis: 'CO₂ concentration specified in mol/mol instead of ppmv. A value of 0.0004 mol/mol should
    be 400 ppmv.; CLM expects co2_ppmv in parts per million by volume (ppmv). 400 ppmv = 0.0004 mol/mol
    = 0.04%. If mol/mol is used, FATES sees effectively zero CO₂ concentration.

    ; [''user_nl_clm'', ''FatesPlantRespPh'
  remedy: 'Use ppmv directly: co2_ppmv = 400.0 (not 0.0004); None; [''Check co2_ppmv value in user_nl_clm'',
    ''Should be 280-420 for modern/historical simulations'']'
  severity: silent
- id: dt_013
  symptom: FATES crashes with parameter file read error or 'no such variable' messages
  diagnosis: Using legacy CDL/netCDF parameter file format instead of modern JSON format. FATES switched
    to JSON parameters around 2023.; Older FATES documentation and tutorials reference .cdl or .nc parameter
    files. Modern FATES exclusively uses JSON. The tools/modify_fates_paramfile.py script only works with
    J
  remedy: 'Use fates_params_default.json from the parameter_files/ directory; convert_fates_params; [''Check
    parameter file extension: must be .json'', ''Use tools/cdl_to_xml.py if you have legacy CDL files'',
    ''Start fresh from fates_params_default.json for new simulations'']'
  severity: degraded
- id: dt_014
  symptom: Parameter modification affects the wrong PFT — results correct for one vegetation type but
    wrong for the target
  diagnosis: Off-by-one error between Fortran 1-based PFT indices and JSON 0-based array indices. PFT
    1 in Fortran documentation maps to index 0 in JSON.; FATES Fortran code uses 1-based PFT indices (PFT
    1 = tropical broadleaf evergreen). JSON arrays are 0-based (index 0 = first PFT). When FATES documentation
    sa
  remedy: 'Subtract 1 from Fortran PFT number to get JSON index: Fortran PFT N = JSON index N-1; convert_fates_params;
    [''PFT 1 (Fortran) = index 0 (JSON) = broadleaf_evergreen_tropical'', ''PFT 2 (Fortran) = index 1
    (JSON) = needleleaf_evergreen_extratropical'', ''Use --operation query to verify which PFT each ind'
  severity: silent
- id: dt_015
  symptom: PARTEH allocation produces unrealistic organ masses or growth rates
  diagnosis: 'PARTEH mass units are kg (not gC or tC). The module explicitly declares mass_unit = ''kg''
    and mass_rate_unit = ''kg/day''.; PRTGenericMod.F90 defines: mass_unit = ''kg'', mass_rate_unit =
    ''kg/day''. Minimum allowed value: 1.0e-15 kg. If parameters are entered in gC, masses are 1000x too
    small. If in tC, m'
  remedy: 'Ensure all PARTEH mass parameters are in kg (kgC for carbon); convert_fates_params; [''Leaf
    biomass: typical range 0.01-5 kgC per individual'', ''If values are 10-5000, they may be in gC (÷1000)'',
    ''If values are 0.00001-0.005, they may be in tC (×1000)'']'
  severity: silent
- id: dt_016
  symptom: Zero fire disturbance and zero fire mortality despite flammable vegetation and dry conditions
  diagnosis: "SPITFIRE fire model is disabled by default (fates_spitfire_mode = 0). Must be explicitly\
    \ enabled.; FATES defaults to no fire simulation. The fire module is controlled by fates_spitfire_mode\
    \ in user_nl_clm:\n  0 = no fire (default)\n  1 = scalar lightning (uses fates_fire_nignitions)\n\
    \  2 = use lightnin"
