validation:
- obs_shape: point_time_series
  headline_metrics:
  - metric: nrmse
    direction: minimize
    unit: percent
    bands:
      good: 52.0
      satisfactory: null
    pass_band: good
    band_note: nRMSE is normalized by the standard deviation of the OBSERVED fluctuation signal (Guillaumot
      Eq. 3), i.e. an RSR-like temporal-fit measure; band = the looser of the two benchmark values (52
      % Seewinkel, 41 % Bhima) that the authors call "good". No stricter/looser tier is stated, so no
      satisfactory band is asserted.
    cites:
    - guillaumot2022
  secondary_metrics:
  - metric: r
    direction: maximize
    status: supportive
    ceiling_reason: Correlation is the dag determining_metric (temporal_pattern_match) but the fetched
      MODFLOW-6 benchmark grades the water-table time signal with nRMSE, not r; no numeric r threshold
      is reported, so r is retained as supportive only.
    cites:
    - guillaumot2022
  - metric: rmse
    direction: minimize
    status: supportive
    ceiling_reason: 'Absolute WTD RMSE is site/scale dependent, not a transferable band: Guillaumot report
      1.0 m (Seewinkel) and 5.0 m (Bhima) for MODFLOW 6, and cite regional-model RMSEs of 3.8 m (Soltani,
      ~28000 Danish head stations) and 6.3 m (Jing) as the ambient field range; kept as magnitude context
      only.'
    cites:
    - guillaumot2022
  validated_when: nRMSE (RMSE / SD of observed water-table fluctuations) <= 52 % ('good criterion on water
    table fluctuations', Guillaumot 2022); r co-reported but not numerically bounded
  evidence_strength: moderate
  confidence: 0.5
  notes: 'One MODFLOW-6 benchmark (Guillaumot 2022): "Both models successfully reproduce water table fluctuations
    averaged across all monitoring boreholes ... The nRMSE reaches 52 % and 41 % for the Seewinkel and
    Bhima models" and "the associated good criterion on water table fluctuations (nRMSE) make us confident
    that the model simulates rainfall partitioning". This SUPERSEDES the dag determining_metric (r) for
    head time series, mirroring the GLM-AED temperature precedent (field uses the RMSE-family measure).
    Moderate (single benchmark, achieved-value-as-band); confidence 0.5 => the gate may contextualize
    but must not loosen. Reinecke 2019 documents head reliability degrades in mountainous/dry cells ("high
    variance in simulated head due to numerical instabilities ... limiting the reliability") — a regional
    caveat on any head comparison. A second peer-reviewed MODFLOW-6 head benchmark would raise this to
    strong.'
