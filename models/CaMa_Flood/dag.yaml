  citation_index:
    yamazaki2011_camaflood_floodplain:
      short_citation: "Yamazaki et al. 2011"
      doi: "10.1029/2010WR009726"
      note: "Foundational CaMa-Flood floodplain parameterization; one-at-a-time (OAT) sensitivity (Figs 13-14) of bank height, channel width, and Manning roughness on discharge and inundation (qualitative magnitudes, not a variance-based index)."
    yamazaki2013_local_inertial:
      short_citation: "Yamazaki et al. 2013"
      doi: "10.1002/wrcr.20552"
      note: "Introduces the local-inertial flow equation, making velocity/discharge/water level directly dependent on Manning roughness and water-surface slope."
    mateo2017_resolution_connectivity:
      short_citation: "Mateo et al. 2017"
      doi: "10.5194/hess-21-5143-2017"
      note: "Finer resolution improves flood inundation/level/discharge only when multiple-downstream flow connectivity (bifurcation) is represented (2011 Thailand flood)."
    zhou2021_ffa_uncertainty:
      short_citation: "Zhou et al. 2021"
      doi: "10.5194/nhess-21-1071-2021"
      note: "Variance decomposition of CaMa-Flood flood-frequency uncertainty: runoff-input deviation contributes >80% of total uncertainty in flooded water depth and inundation area (variance-based, supports HIGH)."
    jiang2024_conus_resolution:
      short_citation: "Jiang et al. 2024"
      doi: "10.1016/j.envsoft.2024.106268"
      note: "CONUS multi-resolution comparison; channel parameters carry large uncertainty, resolution improves peak flow/timing mainly for small-medium watersheds."

safety:
  hazards:
    - id: "runoff_units_m3s_double_conversion"
      kind: "weather_file_semantic"
      description: "Runoff supplied in m3/s instead of the expected mm/day; the model multiplies by catchment area internally, applying a second ~1e8 conversion and producing discharge orders of magnitude too high."
      severity: "silent"
    - id: "runoff_latitude_ordering_mismatch"
      kind: "weather_file_semantic"
      description: "Runoff grid latitude not in descending (North-to-South) order while the input matrix assumes N-to-S, so every river-network cell maps to the wrong source cell, giving near-zero discharge."
      severity: "silent"
    - id: "empty_initial_storage_spinup"
      kind: "initial_condition_semantic"
      description: "Cold start with empty river/floodplain storage makes the first simulated year's discharge and inundation unreliable until storage fills; spin-up required."
      severity: "degraded"
    - id: "uniform_manning_field"
      kind: "coefficient_runtime_silent_fallback"
      description: "When a spatially-uniform Manning's n field is supplied for rivman.bin (CRIVMAN), channel roughness is not spatially distributed and the scalar PMANRIV default (0.03) effectively governs the whole domain."
      severity: "degraded"
    - id: "dslope_clamp_floodplain"
      kind: "numerical_instability"
      description: "Undocumented water-surface-slope limiter (+/-0.005) applied to floodplain and bifurcation flow as a stability/efficiency hack in place of a weir equation; can bias overbank flux under steep gradients."
      severity: "silent"
    - id: "adaptive_dt_global_shrink"
      kind: "numerical_instability"
      description: "Adaptive sub-step DT is min-reduced over ALL river cells, so a single deep/short-distance cell shrinks the time step for the entire domain (runtime cost / potential CFL-driven slowdown), and DT must be a multiple of 60 s or the model stops with STOP 9."
      severity: "degraded"
  validation_limits:
    - "Macro-scale routing on coarse (15-arcmin) unit-catchments; not a substitute for local high-resolution flood modeling (delegated downstream)."
    - "Does not generate runoff; skill is bounded by the quality of the external runoff forcing, which dominates inundation uncertainty (>80%)."
    - "Channel width/depth are empirical power laws of climatological mean discharge, not surveyed cross-sections; absolute stage/depth carry geometry uncertainty."
    - "Gauge-to-cell allocation on coarse global maps is often ambiguous; point validation requires careful drainage-area matching."
  warnings:
    - "Flood-stage (FLDSTG) solver mutates the prognostic river and floodplain storage in place despite being treated as diagnostic in the docs; FLDSTG -> OUTFLW -> STONXT -> FLDSTG ordering within each sub-step is a tight, easy-to-break dependency."
    - "The storage-limited outflow rescaling (D2RATE) couples neighboring cells under reverse flow; non-local behavior to be aware of when interpreting per-cell discharge."
    - "When groundwater delay is off, sub-surface runoff passes straight through (return flow set equal to sub-surface runoff); the config check warns but does not stop."
    - "Dam operation must run before bifurcation to preserve the water budget; this ordering is enforced in code since v4.12."
  assumptions:
    - statement: "Water storage (river + floodplain) is the only prognostic state; water level, flooded area, and inundation depth are diagnosed from storage via sub-grid floodplain topography."
      scope: "all CaMa-Flood configurations"
      source: "CaMa-Flood model formulation, global-hydrodynamics.github.io and Yamazaki et al. 2011 (10.1029/2010WR009726)"
      status: "adopted"
    - statement: "River discharge and velocity are computed by the local-inertial (simplified shallow-water) equation with Manning friction; this is a momentum, not full-energy, closure."
      scope: "default solver (LADPSTP local-inertial; not LKINE kinematic-wave)"
      source: "Yamazaki et al. 2013 local-inertial flow equation (10.1002/wrcr.20552); cmf_calc_outflw_mod"
      status: "adopted"
    - statement: "Runoff forcing is interpreted as mm/day and converted to volumetric flux internally using per-cell catchment area via the input matrix; it must not be pre-converted to m3/s."
      scope: "forcing ingestion (CMF_CTRL_FORCING)"
      source: "CaMa-Flood input forcing convention; cmf_ctrl_forcing_mod"
      status: "adopted"
    - statement: "River channel width and bank-height/depth are empirical power-law functions of climatological mean discharge, not surveyed geometry."
      scope: "channel-geometry parameterization"
      source: "CaMa-Flood Guideline (parameters) and Yamazaki et al. 2011"
      status: "adopted"
    - statement: "Default model spatial discretization here is the 15-arcmin unit-catchment river network cut from the global MERIT-Hydro-based map; finer maps (6/5/3/1-arcmin) and ~90 m downscaling are supported but not the default binding."
      scope: "spatial grain of THIS implementation"
      source: "CaMa-Flood map data documentation, global-hydrodynamics.github.io"
      status: "adopted"
