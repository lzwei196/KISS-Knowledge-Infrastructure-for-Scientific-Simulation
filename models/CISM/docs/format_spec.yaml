# format_spec.yaml — projected from dag.yaml + diagnostics/triplets.yaml
# (format_spec generator, dag-driven + codex-reviewed 2026-08-15)

model:
  name: CISM
  language: fortran
  implementation:
    id: cism-driver-v21
    version: '2.1'
    provenance: Fortran 90/95; CESM Land Ice Working Group cism_driver executable (Glide SIA + Glissade
      higher-order dycores), netCDF/CF I/O.
  scientific_reference_version: CISM 2.1 (Lipscomb et al. 2019, GMD; documentation dated 2018-06-17)
inputs:
  forcing:
  - name: acab (surface mass balance)
    unit: m/yr ice equivalent
    category: climate
    source_kind: forcing
    model_input_format: netCDF (CF), 2-D field on scalar grid (y1,x1)
    notes: Accumulation minus ablation; must be m/yr ICE equivalent, not mm/yr and not water equivalent.
      Can be supplied externally or generated by the internal PDD scheme.
  - name: artm (annual mean surface air temperature)
    unit: deg C
    category: climate
    source_kind: forcing
    model_input_format: netCDF (CF), 2-D field on scalar grid (y1,x1)
    notes: Degrees Celsius, NOT Kelvin. Sets the upper thermal boundary condition; with temperature=0
      it overwrites the column each step.
  - name: Glint climate fields (temp, prcp, arng)
    unit: deg C; m water/yr; deg C
    category: climate
    source_kind: forcing
    model_input_format: global lat-lon climate fields via the Glint interface
    notes: Daily-mean 2 m air temperature, precipitation, and air-temperature half-range that drive the
      internal PDD mass-balance schemes; downscaled to the ice grid by Glint.
  parameters:
  - name: default_flwa (Glen flow-law rate factor A)
    unit: Pa^-n s^-1
    category: rheology
    source_kind: calibrated
    model_input_format: '[parameters] default_flwa in .config'
    notes: Ice softness; sane range 1e-18..1e-15, default 1e-16. Used when flow_law=0 (constant); with
      flow_law=2 (Paterson-Budd) A is temperature-dependent.
  - name: flow_enhancement_factor
    unit: dimensionless
    category: rheology
    source_kind: calibrated
    model_input_format: '[parameters] flow_enhancement_factor in .config'
    notes: Multiplier on flwa; range 0.5..5.0, default 1.0.
  - name: beta (basal traction coefficient)
    unit: Pa yr/m
    category: basal
    source_kind: calibrated
    model_input_format: netCDF 2-D field on staggered velocity grid (y0,x0)
    notes: Higher-order bed-stress coefficient (tau_b = beta * u_b). Required when which_ho_babc=5 (beta
      from input).
  - name: btrac_const (uniform basal friction)
    unit: Pa yr/m
    category: basal
    source_kind: calibrated
    model_input_format: '[parameters] btrac_const in .config'
    notes: Spatially uniform basal friction; range 0..1e6, default 0.0.
  - name: tauf / mintauf (basal yield stress)
    unit: Pa
    category: basal
    source_kind: calibrated
    model_input_format: netCDF / [parameters], used with which_ho_babc=15
    notes: Higher-order basal yield stress for plastic (Coulomb / pseudo-plastic) sliding.
  - name: geothermal / bheatflx (basal geothermal heat flux)
    unit: W/m^2
    category: thermal
    source_kind: dataset_lookup
    model_input_format: '[parameters] geothermal (scalar) or netCDF 2-D bheatflx field'
    notes: 'CISM sign convention: NEGATIVE = upward heat flux into the ice base. Default -42e-3 W/m^2;
      range -100e-3..-20e-3.'
  - name: ice_limit (minimum ice thickness for dynamics)
    unit: m
    category: numerics
    source_kind: default
    model_input_format: '[parameters] ice_limit in .config'
    notes: Cells thinner than this are treated as ice-free; range 0.1..100, default 1.0.
  - name: lapse_rate (atmospheric temperature lapse rate)
    unit: deg C / m
    category: thermal
    source_kind: calibrated
    model_input_format: '[GLINT climate] / [parameters] in .config'
    notes: Vertical lapse rate used to reference surface air temperature to elevation for the PDD scheme.
  initial_conditions:
  - name: thk (initial ice thickness)
    unit: m
    category: geometry
    source_kind: user_provided
    model_input_format: netCDF 2-D field on scalar grid (y1,x1); must be >= 0
  - name: topg (bedrock topography)
    unit: m
    category: geometry
    source_kind: user_provided
    model_input_format: netCDF 2-D field on scalar grid (y1,x1)
    notes: Negative = below sea level. Sign convention error produces false floating ice (dt_012).
  - name: usurf (initial upper surface elevation)
    unit: m
    category: geometry
    source_kind: user_provided
    model_input_format: netCDF 2-D field on scalar grid (y1,x1)
  - name: temp (initial 3-D ice temperature)
    unit: deg C
    category: thermal
    source_kind: user_provided
    model_input_format: netCDF 3-D field on sigma levels (level,y1,x1)
  - name: relx (relaxed bedrock topography)
    unit: m
    category: geometry
    source_kind: user_provided
    model_input_format: netCDF 2-D field; reference bed for isostatic adjustment
  - name: uvel/vvel (restart velocity fields)
    unit: m/yr
    category: dynamics
    source_kind: user_provided
    model_input_format: netCDF 3-D fields on staggered grid (level,y0,x0); restart only
  boundary_conditions:
  - name: dycore
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[options] dycore (0=Glide SIA, 2=Glissade HO)'
    notes: Selects the dynamical core. Hard-coupled to the evolution option (Glissade requires evolution=3
      or 4; dt_007).
  - name: which_ho_approx
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[ho_options] which_ho_approx (-1=local SIA, 1=SSA, 2=BP, 3=L1L2, 4=DIVA)'
    notes: Higher-order momentum approximation, Glissade only.
  - name: which_ho_babc (basal boundary condition)
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[ho_options] which_ho_babc (4=no-slip, 5=beta from input, 15=till yield stress)'
  - name: which_ho_sparse (linear solver)
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[ho_options] which_ho_sparse (1=SLAP, 3=Glissade PCG, 4=Trilinos)'
    notes: Value 4 requires a Trilinos-linked build, else runtime failure (dt_005).
  - name: which_ho_nonlinear (nonlinear iteration)
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[ho_options] which_ho_nonlinear (0=Picard, 1=JFNK)'
  - name: temperature (thermal mode)
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[options] temperature (0=hold to artm, 1=prognostic, 2=hold initial, 3=enthalpy)'
  - name: flow_law
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[options] flow_law (0=constant flwa, 2=Paterson-Budd temperature-dependent)'
  - name: evolution (thickness scheme)
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[options] evolution (0=pseudo-diffusion, 3=incremental remapping, 4=FO upwind)'
  - name: marine_margin (calving scheme)
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[options] marine_margin (0=none, 3=threshold calving)'
  - name: isostasy
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[options] isostasy (0=off, 1=on)'
  - name: basal_water
    unit: enum
    category: control_switch
    source_kind: user_provided
    model_input_format: '[options] basal_water (0=off, 1=local balance)'
  - name: grid geometry (ewn, nsn, upn, dew, dns)
    unit: count; m
    category: grid
    source_kind: user_provided
    model_input_format: '[grid] section in .config; dew/dns in METERS'
    notes: Grid spacing in km instead of m shrinks the domain 1000x and corrupts velocities (dt_006).
  - name: time control (tstart, tend, dt, ntem)
    unit: yr; yr; yr; count
    category: time
    source_kind: user_provided
    model_input_format: '[time] section in .config'
    notes: 'dt is CFL-limited: dt < dew^2/(2*D_max) for diffusive stability (dt_004).'
  - name: kinbcmask (velocity Dirichlet mask)
    unit: 0/1
    category: boundary_mask
    source_kind: user_provided
    model_input_format: netCDF 2-D mask on staggered grid (y0,x0)
    notes: Marks cells where uvel/vvel are held as Dirichlet boundary conditions; zero velocity is imposed
      where mask=1 if uvel/vvel absent.
  - name: eus (eustatic sea level)
    unit: m
    category: climate
    source_kind: user_provided
    model_input_format: scalar global sea-level forcing (optional)
outputs:
  primary:
  - name: thk
    unit: m
    description: Ice thickness on the scalar grid
    validation_rank: 3
    emitted_in: '[CF output] netCDF'
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Observed ice thickness (e.g. radar-derived) is sparse and along-track; resample to the model
          grid before comparison.
      - obs_shape: spatial_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        - magnitude_accuracy
        determining_metric: nse
        caveats:
        - Thickness-change rates evolve on glaciological timescales; multi-decadal records are needed
          to see signal.
      detrending_options:
      - none
  - name: usurf
    unit: m
    description: Upper ice-surface elevation
    validation_rank: 5
    emitted_in: '[CF output] netCDF'
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Comparable to altimetry-derived surface DEMs; geoid/reference-ellipsoid conventions must align.
      - obs_shape: spatial_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Surface-elevation change rate (dh/dt) is the observable signal; instantaneous offsets reflect
          initialization, not skill.
      detrending_options:
      - none
      - linear_residual
  - name: velnorm
    unit: m/yr
    description: Horizontal ice-velocity magnitude
    validation_rank: 1
    emitted_in: '[CF output] netCDF'
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Comparable to InSAR/feature-tracking surface velocity mosaics; output is already scyr-scaled
          to m/yr (restart raw arrays are m/s).
      detrending_options:
      - none
  - name: uvel
    unit: m/yr
    description: x-component of ice velocity on sigma levels
    validation_rank: 2
    emitted_in: '[CF output] netCDF'
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Surface (level=0) component comparable to remote-sensing velocity; sign/orientation must match
          the projection.
      detrending_options:
      - none
  - name: temp
    unit: deg C
    description: Internal 3-D ice temperature on sigma levels
    validation_rank: 4
    emitted_in: '[CF output] netCDF'
    observability:
      comparable_obs_shapes:
      - obs_shape: point_time_series
        comparison_mode: time_series_comparison
        metric_families:
        - magnitude_accuracy
        - temporal_pattern_match
        determining_metric: nse
        caveats:
        - Comparable to borehole temperature profiles at discrete points; vertical interpolation onto
          sigma levels required.
      detrending_options:
      - none
  - name: bmlt
    unit: m/yr
    description: Basal ice melt rate (total / grounded ice / floating ice)
    validation_rank: 6
    emitted_in: '[CF output] netCDF'
    observability:
      comparable_obs_shapes:
      - obs_shape: spatial_snapshot
        comparison_mode: spatial_field_comparison
        metric_families:
        - spatial_pattern_match
        - magnitude_accuracy
        determining_metric: csi
        caveats:
        - Sub-shelf melt observations are sparse and indirect; output is m/yr (m/s SI internally, dt_008).
      detrending_options:
      - none
  - name: ivol
    unit: km^3
    description: Total ice volume (internally m^3)
    validation_rank: 7
    emitted_in: '[CF output] netCDF scalar time series'
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Volume change (mass balance / SLR contribution) is the meaningful signal; absolute volume depends
          on initialization.
      detrending_options:
      - decadal_mean
      - first_difference
      - none
  - name: imass / imass_above_flotation
    unit: kg
    description: Total ice mass and mass above flotation (sea-level-relevant mass)
    validation_rank: 8
    emitted_in: '[CF output] netCDF scalar time series'
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Mass-change rate comparable to gravimetry (GRACE) basin totals; mass above flotation maps to
          sea-level contribution.
      detrending_options:
      - decadal_mean
      - first_difference
      - none
  - name: iarea / iareag / iareaf
    unit: km^2
    description: Total / grounded / floating ice area (internally m^2)
    validation_rank: 9
    emitted_in: '[CF output] netCDF scalar time series'
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Ice extent / grounding-line position comparable to remote-sensing masks.
      detrending_options:
      - decadal_mean
      - first_difference
      - none
  - name: calving_flux / gl_flux
    unit: kg/s; kg/m/s
    description: Ice calving mass flux and grounding-line ice flux
    validation_rank: 10
    emitted_in: '[CF output] netCDF'
    observability:
      comparable_obs_shapes:
      - obs_shape: regional_aggregate_time_series
        comparison_mode: aggregate_trend_comparison
        metric_families:
        - trend_match
        - magnitude_accuracy
        determining_metric: pbias
        caveats:
        - Flux-gate estimates are basin-integrated and uncertain; compare integrated discharge (a rate/trend),
          not per-cell flux.
      detrending_options:
      - decadal_mean
      - first_difference
      - none
  secondary: []
known_issues:
- id: dt_001
  symptom: Ice sheet grows unbounded; ice volume increases monotonically without reaching steady state
  diagnosis: Surface mass balance (acab) provided in mm/yr instead of m/yr; CISM expects acab in meters
    per year. If mm/yr values (e.g., 300 mm/yr = 0.3 m/yr) are passed directly, the accumulation is 1000x
    too high, causing unbounded ice growth.; ['convert_forcing_to_cism', 'generate_input_nc']
  remedy: Divide acab values by 1000 to convert mm/yr to m/yr; convert_forcing_to_cism; ['Check max(abs(acab))
    in input.nc; should be < 50 m/yr for Earth ice sheets', 'If > 100, likely in mm/yr -- divide by 1000'];
    validate_output() in generate_input_nc checks acab magnitude
  severity: silent
- id: dt_002
  symptom: Ice exists but has zero velocity; no dynamics despite thick ice
  diagnosis: 'default_flwa set too small (e.g., 1e-25) or missing; The flow rate factor (flwa) controls
    ice softness. Values below ~1e-20 Pa^-n s^-1 make ice effectively rigid. Typical values: 1e-16 to
    1e-17 for temperate ice.; [''generate_cism_config'']'
  remedy: 'Set default_flwa to 1.0e-16 Pa^-n s^-1 (or 5.7e-18 for cold ice); generate_cism_config; [''Check
    [parameters] default_flwa in .config file'', ''Typical range: 1e-18 (cold) to 1e-15 (warm/streaming)''];
    validate_params() checks flwa range'
  severity: silent
- id: dt_003
  symptom: Basal temperature has wrong sign or magnitude; ice is too cold/warm at base
  diagnosis: 'Geothermal heat flux provided as positive instead of negative; CISM convention: negative
    geothermal = upward heat flux. Positive values would cool the base. Global GHF datasets typically
    use positive = upward (opposite convention).; [''convert_forcing_to_cism'', ''generate_cism_config'']'
  remedy: 'Negate geothermal heat flux: geothermal = -abs(value); generate_cism_config; [''Check [parameters]
    geothermal in .config'', ''Should be negative (e.g., -42.0e-3 W/m^2)'', ''Also convert mW/m^2 to W/m^2
    by dividing by 1000'']; generate_cism_config auto-negates positive values'
  severity: silent
- id: dt_004
  symptom: Temperature field blows up; NaN values appear in temp or enthalpy
  diagnosis: Timestep (dt) too large for grid spacing, violating CFL condition; The SIA diffusion equation
    requires dt < dew^2 / (2*D_max) where D_max is the maximum ice diffusivity. Thin ice on steep slopes
    can make D_max very large.; ['generate_cism_config', 'run_cism']
  remedy: 'Reduce dt by factor of 2-10; for 2km grid use dt <= 1.0 yr; generate_cism_config; [''Halve
    dt and re-run'', ''If still unstable, halve again'', ''For diagnostic grid spacing 2000m, try dt=0.1''];
    CFL check in preflight: dt < dew^2 / (2e6)'
  severity: fatal
- id: dt_005
  symptom: CISM crashes at startup with Trilinos-related error when using dycore=2
  diagnosis: which_ho_sparse=4 (Trilinos solver) but CISM built without Trilinos; The Trilinos solver
    (option 4) requires CISM compiled with CISM_USE_TRILINOS=ON. Without it, the Glissade PCG solver (option
    3) should be used.; ['generate_cism_config', 'run_cism']
  remedy: Set which_ho_sparse = 3 in [ho_options] for Glissade's built-in PCG solver; generate_cism_config;
    ['Change which_ho_sparse = 3 in .config', 'Or rebuild CISM with Trilinos if parallel solver needed'];
    Default to which_ho_sparse=3 in config generator
  severity: fatal
- id: dt_006
  symptom: Ice velocities are orders of magnitude wrong; features are at wrong scale
  diagnosis: Grid spacing (dew, dns) provided in kilometers instead of meters; CISM expects dew and dns
    in meters. If km values are used (e.g., 5 instead of 5000), the domain is 1000x smaller than intended,
    producing wildly wrong velocity magnitudes.; ['generate_input_nc', 'generate_cism_config']
  remedy: 'Multiply dew and dns by 1000 to convert km to meters; generate_cism_config; [''Check dew and
    dns in [grid] section'', ''Typical values: 500 to 50000 meters'', ''If < 100, likely in km -- multiply
    by 1000'']; validate_inputs() warns if dew < 10'
  severity: silent
- id: dt_007
  symptom: Ice sheet is unrealistically thin with Glissade dycore
  diagnosis: evolution=0 (pseudo-diffusion) used with dycore=2 (Glissade); Pseudo-diffusion thickness
    evolution (option 0) is only compatible with the Glide SIA dycore. Glissade requires evolution=3 (incremental
    remapping) or 4 (FO upwind).; ['generate_cism_config']
  remedy: Set evolution = 3 (incremental remapping) when dycore=2; generate_cism_config; ['Change evolution
    = 3 in [options] section', 'Or use evolution = 4 for first-order upwind']; generate_cism_config auto-corrects
    this combination
  severity: silent
- id: dt_008
  symptom: Excessive basal melt rate; ice base melts unrealistically fast
  diagnosis: Basal melt rate (bmlt) in m/s (SI) instead of m/yr as expected by CISM output; Internal CISM
    uses SI (m/s) but output applies factor scyr=31536000 to convert to m/yr. If custom bmlt forcing is
    in m/s, it will be ~3e7x too large when interpreted as m/yr.; ['convert_forcing_to_cism']
  remedy: 'Multiply m/s basal melt by scyr=31536000 to get m/yr, or divide m/yr by scyr for internal use;
    convert_forcing_to_cism; [''Check bmlt values in input: should be 0.001-10 m/yr typically'', ''If
    > 1000, likely in m/s -- multiply by 31536000'']; validate_output checks bmlt range'
  severity: silent
- id: dt_009
  symptom: Output NetCDF file exists but contains zero time steps
  diagnosis: Output frequency in [CF output] exceeds total number of timesteps; If frequency=10000 but
    total steps = (tend-tstart)/dt = 5000, no output is ever written. CISM only writes when step_count
    mod frequency == 0.; ['generate_cism_config']
  remedy: Set frequency <= (tend - tstart) / dt; generate_cism_config; ['Calculate total_steps = (tend
    - tstart) / dt', 'Set frequency to total_steps / desired_outputs', 'Use frequency = 1 for debugging'];
    validate_params() checks frequency vs total steps
  severity: silent
- id: dt_010
  symptom: Higher-order solver fails to converge; Picard/JFNK iterations exhaust maxiter
  diagnosis: JFNK (which_ho_nonlinear=1) struggles without good preconditioner; JFNK can be faster than
    Picard for well-conditioned problems but is less robust. For initial runs or ill-conditioned problems,
    Picard (option 0) is more reliable.; ['generate_cism_config', 'run_cism']
  remedy: Set which_ho_nonlinear = 0 (Picard iteration) as first attempt; generate_cism_config; ['Change
    which_ho_nonlinear = 0', 'Increase glissade_maxiter to 500', 'Reduce dt', 'Try which_ho_precond =
    2 (SIA-based)']; Default to Picard in config generator
  severity: fatal
- id: dt_011
  symptom: Temperature field is uniform at surface temperature everywhere; no thermal evolution
  diagnosis: temperature=0 in [options] sets ice temp to surface artm every timestep; Option 0 forces
    the entire ice column to the surface air temperature, overriding any thermal evolution. Use temperature=1
    for prognostic thermodynamics.; ['generate_cism_config']
  remedy: Set temperature = 1 in [options] for prognostic temperature evolution; generate_cism_config;
    ['Change temperature = 1 in [options]', 'temperature=2 holds initial temperature constant', 'temperature=3
    uses enthalpy formulation']; Document default temperature=1 recommendation
  severity: silent
- id: dt_012
  symptom: Ice is floating where it should be grounded; marine margin artifacts
  diagnosis: 'Bed topography (topg) has wrong sign convention for areas below sea level; CISM convention:
    topg < 0 = below sea level, topg > 0 = above sea level. If this is reversed, the model thinks land
    areas are submarine and applies marine margin/floating ice physics.; [''generate_input_nc'']'
  remedy: 'Check topg sign: negative values should correspond to ocean floor below sea level; generate_input_nc;
    [''Plot topg field and verify coastal/ocean areas are negative'', ''If reversed, negate entire topg
    field'']; Sanity check topg statistics in validate_output()'
  severity: silent
- id: dt_013
  symptom: Parsed velocities are ~3e7x smaller than expected when comparing to observations
  diagnosis: Reading raw Fortran arrays (m/s SI) instead of NetCDF output (m/yr with scyr factor); Internal
    CISM stores velocity in m/s. NetCDF I/O applies factor=scyr (31536000) to output m/yr. If reading
    restart files or internal arrays directly, values are in m/s.; ['parse_cism_output']
  remedy: Use NetCDF output (already in m/yr) not restart files for analysis; parse_cism_output; ['If
    m/s values needed, divide m/yr by 31536000', 'If m/yr values from restart, multiply m/s by 31536000'];
    parse_cism_output reads from standard NetCDF output
  severity: silent
- id: dt_014
  symptom: Config section parameters have no effect; model uses defaults instead of specified values
  diagnosis: Section name misspelled or wrong case; CISM silently ignores unknown sections; CISM config
    parser reads sections by exact name match. A typo (e.g., [Grid] vs [grid], [HO_options] vs [ho_options])
    means the entire section is silently skipped.; ['generate_cism_config']
  remedy: 'Check exact section names: [grid], [time], [options], [ho_options], [parameters], [CF default],
    [CF input], [CF output]; generate_cism_config; [''Verify section names match CISM source code exactly'',
    "Note: ''CF default'', ''CF input'', ''CF output'' have spaces", ''Note: lowercase for grid, time,
    options, '
  severity: silent
- id: dt_015
  symptom: No calving occurs; ice extends over open ocean with no mass loss
  diagnosis: marine_margin=0 (do nothing at marine margins); With marine_margin=0, CISM does not apply
    any calving criterion. Ice at marine margins simply thins but is never removed. Set marine_margin=3
    for threshold-based calving.; ['generate_cism_config']
  remedy: Set marine_margin = 3 in [options] for threshold calving; generate_cism_config; ['Add marine_margin
