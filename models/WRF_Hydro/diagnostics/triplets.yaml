    diagnosis:
      root_cause: "Cold-start initializes soil moisture at field capacity and temperature uniformly. First rainfall events generate extreme runoff until soil state equilibrates (6-12 months)."
      explanation: >
        In cold-start mode, SMOIS=REFSMC and TSLB from TSK/TMN interpolation do not match
        climatological soil state. First 1-6 months produce unrealistic runoff (237 mm/d Bengbu).
        Standard solution: discard first 6-12 months as spinup. Unlike dt_019 (frozen soil crash),
