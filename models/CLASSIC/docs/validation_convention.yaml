schema_version: 1
model_id: CLASSIC
domain: hydrology
generated_by: "Step-B fleet agent; literature-grounded validation convention"
generated_at: 2026-08-14

# One block per declared CLASSIC DAG output name and observation shape. Numeric
# bands are cited only where a fetched full text reports criteria or benchmark
# skill. Continuous spatial fields retain the DAG csi metric but use null bands
# where the fetched land-model literature does not define a CSI convention.

