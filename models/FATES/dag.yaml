safety:
  hazards:
    - id: "weather_TBOT_degC_not_K"
      kind: "weather_file_semantic"
      description: "Air temperature passed in degC instead of K is read as ~-250 degC, killing all plant processes (near-zero GPP)."
      severity: "silent"
    - id: "weather_precip_mmday_not_mms"
      kind: "weather_file_semantic"
      description: "Precipitation in mm/day instead of mm/s delivers 86,400x too much water, wrecking the water balance."
      severity: "silent"
    - id: "weather_FSDS_MJ_not_W"
      kind: "weather_file_semantic"
      description: "Shortwave in MJ/m2/day instead of W/m2 gives ~86,400x too little radiation, stalling growth."
      severity: "silent"
    - id: "weather_CO2_molmol_not_ppmv"
      kind: "weather_file_semantic"
      description: "CO2 in mol/mol instead of ppmv makes FATES see ~zero CO2 and lose the fertilization effect."
      severity: "silent"
    - id: "soil_water_percent_not_fraction"
      kind: "soil_semantic"
      description: "Soil volumetric water given as percent (0-100) instead of fraction (0-1) causes ~40x oversaturation and stuck moisture stress."
      severity: "silent"
    - id: "param_PARTEH_mass_not_kg"
      kind: "coefficient_runtime_silent_fallback"
      description: "PARTEH mass parameters must be kg; gC is 1000x too small, tC 1000x too large, producing unrealistic organ masses."
      severity: "silent"
    - id: "param_PFT_index_offbyone"
      kind: "coefficient_runtime_silent_fallback"
      description: "Fortran 1-based vs JSON 0-based PFT indexing (Fortran PFT N = JSON index N-1); a misindex silently edits the wrong PFT."
      severity: "silent"
    - id: "init_DBH_not_cm"
      kind: "initial_condition_semantic"
      description: "Inventory DBH in mm or m instead of cm makes allometry produce impossible tree dimensions."
      severity: "silent"
    - id: "init_height_not_m"
      kind: "initial_condition_semantic"
      description: "Heights in cm or feet instead of m mismatch field observations by 100x or 0.3048x."
      severity: "silent"
    - id: "output_VEGC_double_scaled"
      kind: "parser_semantic"
      description: "FATES_VEGC is already area-normalized (kgC/m2); re-multiplying by FATES_NPLANT double-counts the area scaling (~10000x biomass error)."
      severity: "silent"
    - id: "output_NPLANT_m2_vs_ha"
      kind: "parser_semantic"
      description: "FATES_NPLANT is stems/m2, not stems/ha; missing the x10,000 mis-scales density vs forestry data."
      severity: "silent"
    - id: "output_patch_area_1ha"
      kind: "parser_semantic"
      description: "Notional patch area is 10,000 m2 (1 ha); assuming 1 m2 yields exactly 10,000x errors in density/flux calculations."
      severity: "silent"
    - id: "output_GPP_unit_conversion"
      kind: "parser_semantic"
      description: "FATES_GPP is kgC/m2/s; missing x1000 and/or x86400 gives systematically wrong daily GPP."
      severity: "silent"
    - id: "output_canopy_area_fraction"
      kind: "parser_semantic"
      description: "Per-individual crown area (m2) confused with FATES_CANOPY_AREA fraction; values >1 indicate multi-layer canopy, not an error."
      severity: "silent"
    - id: "param_file_legacy_CDL"
      kind: "parser_semantic"
      description: "Modern FATES (post-2023) reads JSON parameter files only; a legacy CDL/netCDF parameter file crashes the read."
      severity: "degraded"
    - id: "config_spitfire_off_default"
      kind: "control_semantic"
      description: "SPITFIRE is disabled by default (fates_spitfire_mode=0), so fire disturbance and fire mortality are zero even under flammable, dry conditions."
      severity: "degraded"
    - id: "planthydro_experimental_crash"
      kind: "numerical_instability"
      description: "Experimental plant hydraulics (use_fates_planthydro) can crash or produce unrealistic water potentials on extreme climates/parameters."
      severity: "fatal_or_silent"
    - id: "restart_version_incompatible"
      kind: "parser_semantic"
      description: "Restart files are not backward-compatible across major FATES versions; dimension/variable mismatch crashes on restart."
      severity: "fatal"
  validation_limits:
    - "Runs only as a component inside a host land model (CTSM/CLM, E3SM/ELM, CESM); not a standalone executable."
    - "Bare-ground cold start produces all-zero vegetation output until vegetation establishes; needs 50-100 yr spinup or inventory initialization."
    - "Recruitment from bare ground requires fates_recruit_seed_supplement > 0."
    - "Default compsets have fire, logging, plant hydraulics and CNP nutrient limitation OFF; cannot produce those processes without explicitly enabling them."
    - "Plant hydraulics is experimental and may be unreliable or crash."
    - "Site-level demographic representation (notional 1 ha) with no horizontal/lateral transport between grid cells."
  warnings:
    - "Zero fire output with default fates_spitfire_mode=0 is expected, not a bug (dt_016)."
    - "All-zero or near-zero pools early in a cold-start run reflect missing spinup, not model failure."
    - "FATES_VEGC and FATES_CANOPY_AREA are already area-normalized history outputs; only internal cohort pools are per-individual."
    - "Experimental plant hydraulics can crash on extreme forcing; disable unless specifically required (dt_017)."
  assumptions:
    - statement: "FATES is a site/point-scale, size- and age-structured demographic model with a notional 10,000 m2 (1 ha) patch area and no horizontal transport between cells."
      scope: "spatial geometry of all density and flux outputs"
      source: "FATES technical documentation (ED/PPA cohort-patch-site hierarchy)"
      status: "adopted"
    - statement: "FATES closes a carbon mass balance (and inorganic N/P in CNP mode); the water and surface-energy budgets are closed by the host land model, not FATES."
      scope: "conservation/closure semantics"
      source: "FATES-host (CTSM/CLM) coupling description: host provides soil physics and energy balance, FATES computes vegetation carbon"
      status: "adopted"
    - statement: "Atmospheric forcing is supplied by the host data atmosphere (DATM) in CLM/DATM unit conventions (K, mm/s, W/m2, kg/kg, Pa, ppmv); FATES does not read forcing files directly."
      scope: "input forcing units and provenance"
      source: "FATES-host DATM coupling and CLM forcing conventions"
      status: "adopted"
    - statement: "The post-2023 JSON parameter file is the canonical parameter input; the legacy CDL/netCDF parameter format is deprecated."
      scope: "parameter-file format"
      source: "FATES parameter-file modernization (JSON replaced CDL/netCDF ~2023)"
      status: "adopted"
    - statement: "Modules, internal edges and state variables are reconstructed from FATES interface metadata (history-variable lists, parameter dimensions, namelist switches) plus FATES domain knowledge, not verified against the Fortran source."
      scope: "processes and states blocks"
      source: "FATES history/parameter interface metadata (Fortran source not available in this dissection)"
      status: "tentative"
