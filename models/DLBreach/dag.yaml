template_version: "3.5"

identity:
  model_id: "DLBreach"
  scientific_reference_version: "DLBreach 2016.4 (Wu 2013 J. Hydraulic Eng. + Wu 2016 Clarkson Technical Report; simplified physically-based dam/levee breach model)"
  implementation:
    id: "dlbreach-fortran-2016.4"
    version: "2016.4"
    provenance: "Fortran; Clarkson University (W. Wu) standalone DLBreach binary, the implementation the KI mandates and validates against."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: ""
  repo_url: "https://webspace.clarkson.edu/~wwu/DLBreach.html"

boundary:
  scope_in:
    - "Earthen embankment (dam/levee) breach by overtopping"
    - "Earthen embankment breach by internal erosion (piping)"
    - "Breach outflow hydrograph from a 0-D reservoir draining through the breach"
    - "Breach geometry evolution (bottom width/elevation, top width, side slope, flow area)"
    - "Homogeneous, cohesive, cohesionless, and composite/zoned (clay-core) embankments"
    - "Headcut migration for cohesive overtopping failure"
    - "Side-slope mass-wasting (planar slope-stability) of the breach"
    - "Reservoir water-level drawdown coupled to elevation-area-volume storage"
    - "Coastal/two-way breaching with wave and wind overtopping forcing (coastal extension)"
  scope_out:
    - "Downstream river routing / flood inundation (supplied by an external routing model)"
    - "Reservoir inflow generation (inflow hydrograph supplied externally)"
    - "Full 2-D/3-D hydrodynamic erosion fields (simplified cross-sectional representation)"
  spatial: "0-D point"
  temporal: "event"
  closure: "mass-balance"
  notes: "Mass-balance closure couples reservoir water storage (elevation-area-volume curve) to breach + spillway outflow, and a non-equilibrium total-load sediment mass balance to breach-geometry evolution. Breach hydraulics use weir/orifice/Keulegan relations and Manning roughness rather than a closed momentum/energy budget; there is no surface-energy closure. The reservoir is lumped (0-D storage), not spatially routed."

inputs:
  forcing:
    - category: "forcing"
      name: "inflow_hydrograph"
      unit: "m3/s (discharge), time in hours"
      source_kind: "forcing"
      model_input_format: "Upstream_Reservoir_Inflow card: time(hours)-discharge(m3/s) pairs"
      notes: "Time column is in HOURS, whereas Time_Step/Simulation_Period are in SECONDS — mixed-unit convention that silently corrupts breach timing if confused."
    - category: "forcing"
      name: "upstream_water_level_time_series"
      unit: "m above embankment base, time in hours"
      source_kind: "forcing"
      model_input_format: "Upstream_WSL_Time_Series / Downstream_WSL_Time_Series card"
      notes: "Optional time-varying head/tailwater; levels are relative to embankment base, not geo-referenced elevation."
    - category: "forcing"
      name: "wave_and_wind_forcing"
      unit: "wave height (m), period (s), wind speed (m/s)"
      source_kind: "forcing"
      model_input_format: "wave/wind cards (coastal applications)"
      notes: "Only used in the coastal dike/barrier extension; drives wave-overtopping and wind setup/setdown contributions to breach hydraulics."
  parameters:
    - category: "geometry"
      name: "Embankment_Height"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Embankment geometry cards"
      notes: "Crest-to-base height (1-300 m valid), NOT geo-reference elevation."
    - category: "geometry"
      name: "Embankment_Crest_Width"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Embankment geometry cards"
    - category: "geometry"
      name: "Embankment_Upstream_Slope"
      unit: "V/H ratio"
      source_kind: "user_provided"
      model_input_format: "Embankment geometry cards"
      notes: "V/H convention (vertical/horizontal); 1V:3H = 0.333. Authoring as H/V silently produces impossible geometry."
    - category: "geometry"
      name: "Embankment_Downstream_Slope"
      unit: "V/H ratio"
      source_kind: "user_provided"
      model_input_format: "Embankment geometry cards"
    - category: "geometry"
      name: "Embankment_Length"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Embankment geometry cards"
      notes: "Base length = maximum possible breach bottom width; caps lateral breach growth."
    - category: "sediment"
      name: "Sediment_Diameter_d50"
      unit: "m"
      source_kind: "calibrated"
      model_input_format: "sediment cards"
      notes: "Non-cohesive ~0.001 m; cohesive ~0.00003 m (representative floc diameter). Default 0.001 m."
    - category: "sediment"
      name: "Sediment_Specific_Gravity"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "sediment cards"
      notes: "Default 2.65 (quartz)."
    - category: "sediment"
      name: "Sediment_Porosity"
      unit: "fraction"
      source_kind: "default"
      model_input_format: "sediment cards"
      notes: "0.30-0.45; default 0.35. Enter as decimal fraction, not percent."
    - category: "sediment"
      name: "Sediment_Cohesion"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "sediment cards"
      notes: "Used for slope-stability mass-wasting, not erosion rate."
    - category: "sediment"
      name: "Sediment_Internal_Friction"
      unit: "tan(phi)"
      source_kind: "calibrated"
      model_input_format: "sediment cards"
      notes: "tan of friction angle, not degrees in the standalone card format. Governs side-slope stability."
    - category: "sediment"
      name: "Cohesive_Soil_Erosion_kd"
      unit: "cm3/N-s"
      source_kind: "calibrated"
      model_input_format: "sediment cards"
      notes: "Cohesive erodibility; the single most sensitive parameter for cohesive embankments. Range 2.5-30; default 10.0."
    - category: "sediment"
      name: "Cohesive_Soil_Erosion_Tauc"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "sediment cards"
      notes: "Critical shear stress for erosion initiation; range 0.01-10, default 0.15."
    - category: "sediment"
      name: "Noncohesive_Sed_Adaptation_Lamda"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "sediment cards"
      notes: "Non-equilibrium total-load adaptation length factor; field ~6.0, lab ~3.0."
    - category: "sediment"
      name: "Headcut_Ct"
      unit: "m^(-1/6) s^(-2/3)"
      source_kind: "calibrated"
      model_input_format: "sediment cards"
      notes: "Headcut erosion coefficient for cohesive overtopping (Overtopping_Mode=2); range 0.0025-0.0049."
    - category: "roughness"
      name: "Breach_Manning_n"
      unit: "s/m^(1/3)"
      source_kind: "calibrated"
      model_input_format: "roughness card"
      notes: "0.010-0.060; default 0.025. Cohesive ~0.016; non-cohesive n = An*d50^(1/6)."
    - category: "coefficients"
      name: "Breach_Weir_Coefficient"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "coefficient card"
      notes: "Broad-crested weir discharge coefficient for overtopping breach flow."
    - category: "coefficients"
      name: "Piping_Coefficient"
      unit: "dimensionless"
      source_kind: "default"
      model_input_format: "coefficient card"
      notes: "Orifice efficiency factor for piping mode; default ~0.5."
    - category: "reservoir"
      name: "Reservoir_Elevation_Area_Volume"
      unit: "m, m2, m3"
      source_kind: "dataset_lookup"
      model_input_format: "Upstream_Reservoir multiline card (5 methods: tabulated V-z, tabulated As-z, or power-law forms)"
      notes: "Power-law exponent m~2 (range 1-3). Elevations above embankment base. MUST be SI (m3, m2); MCM/km2 makes the reservoir ~1e6x too small."
  initial_conditions:
    - category: "initial_conditions"
      name: "Initial_Up&Downstream_WSL"
      unit: "m above embankment base"
      source_kind: "user_provided"
      model_input_format: "Initial_Up&Downstream_WSL card"
      notes: "Upstream level must exceed crest for overtopping to initiate; relative to base, not absolute elevation."
    - category: "initial_conditions"
      name: "Initial_Overtopping_Breach"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Initial_Overtopping_Breach card"
      notes: "Pilot breach depth (0.2-0.4 m from crest) and bottom width (1-5 m); used when Breach_Mode=1."
    - category: "initial_conditions"
      name: "Initial_Piping_Breach"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "Initial_Piping_Breach card"
      notes: "Initial pipe depth-below-crest and pipe width (~0.2 m); pipe elevation must lie below upstream WSL or no head drives flow. Used when Breach_Mode=2."
  boundary_conditions:
    - category: "control"
      name: "Breach_Mode"
      unit: "integer flag"
      source_kind: "user_provided"
      model_input_format: "1=overtopping, 2=internal erosion (piping)"
      notes: "Selects the failure mechanism."
    - category: "control"
      name: "Overtopping_Mode"
      unit: "integer flag"
      source_kind: "user_provided"
      model_input_format: "1=surface erosion, 2=headcut, 3=composite/zoned"
      notes: "Mutually exclusive overtopping erosion mechanisms; only used when Breach_Mode=1."
    - category: "control"
      name: "Headcut_Formula"
      unit: "integer flag"
      source_kind: "user_provided"
      model_input_format: "1=erodibility index, 2=Ct formula (default), 3=C2 formula"
    - category: "control"
      name: "Breach_Location"
      unit: "integer flag"
      source_kind: "user_provided"
      model_input_format: "1=one-sided, 2=two-sided (central)"
      notes: "Switches side-flow breach geometry (symmetric vs one-sided)."
    - category: "control"
      name: "Breach_Side_Slope_Constant"
      unit: "V/H ratio"
      source_kind: "user_provided"
      model_input_format: "optional constant breach side-slope override"
    - category: "control"
      name: "Time_Step"
      unit: "seconds"
      source_kind: "user_provided"
      model_input_format: "Time_Step card (SECONDS)"
      notes: "Field 1-5 s, lab 0.1-1 s, very large dams start 0.1 s. Too large -> explicit-scheme instability."
    - category: "control"
      name: "Simulation_Period"
      unit: "seconds"
      source_kind: "user_provided"
      model_input_format: "Simulation_Period card: start_sec, end_sec (SECONDS)"
      notes: "Dam 21600-172800 s (6-48 h). Authoring hours-as-seconds truncates output to 1-2 lines."
    - category: "control"
      name: "Downstream_Channel_Flow_Out"
      unit: "width (m), slope, Manning n"
      source_kind: "user_provided"
      model_input_format: "Downstream_Channel_Flow_Out card"
      notes: "Required for non-empty output; omission yields an empty output file."

processes:
  modules:
    - name: "ReservoirWaterBalance"
      role: "integrator"
      brief: "Lumped reservoir mass balance: routes storage through the elevation-area-volume curve, tracking upstream water-level drawdown as inflow enters and breach + spillway outflow leaves."
    - name: "BreachHydraulics"
      role: "process_solver"
      brief: "Computes breach (and spillway/gate) discharge from head and breach geometry. Overtopping uses two stages — broad-crested weir flow (stage 1) then Keulegan-type inlet flow (stage 2); Manning roughness sets the flow resistance."
    - name: "PipingOrificeFlow"
      role: "process_solver"
      applicability: "Breach_Mode=2 (internal erosion / piping)"
      brief: "Orifice flow through an initially square piping conduit prior to roof collapse, after which flow transitions to the overtopping-style breach hydraulics."
    - name: "WaveWindOvertopping"
      role: "optional_module"
      applicability: "coastal dike/barrier extension"
      brief: "Adds phase-averaged wave-overtopping discharge, wave setup, and wind setup/setdown to the hydraulic forcing for coastal breaching."
    - name: "SedimentTransportNoncohesive"
      role: "process_solver"
      applicability: "cohesionless material"
      brief: "Non-equilibrium total-load sediment transport with adaptation length, converting hydraulic transport capacity into breach erosion rate for cohesionless embankments."
    - name: "ErosionCohesive"
      role: "process_solver"
      applicability: "cohesive material"
      brief: "Excess-shear cohesive erosion governed by erodibility kd and critical shear stress Tauc, driven by the breach bed shear stress."
    - name: "HeadcutErosion"
      role: "process_solver"
      applicability: "Breach_Mode=1, Overtopping_Mode=2 (cohesive headcut)"
      brief: "Migrates a vertical headcut upstream via a plunge-pool / energy-based formula (Ct, C2, or erodibility-index forms; Temple 1992 / SITES lineage)."
    - name: "BreachGeometryEvolution"
      role: "integrator"
      brief: "Integrates breach deepening (toward the minimum bottom elevation limit) and widening from the erosion rates; couples vertical erosion to lateral growth and updates bottom width, top width, and flow area, capped at embankment length."
    - name: "SlopeStability"
      role: "process_solver"
      brief: "Planar slope-stability analysis of the breach side slopes using cohesion and internal friction; triggers mass-wasting collapse that widens the breach and updates the side slope."
    - name: "TimeIntegrator"
      role: "driver"
      brief: "Explicit (forward-Euler) time-marching loop advancing all process modules from start to end of the simulation period, with early termination once the breach is complete."
  internal_edges:
    - from: "Inputs"
      to: "ReservoirWaterBalance"
      kind: "consumes_input"
      brief: "Inflow hydrograph (interpolated to the current time) drives reservoir storage change."
    - from: "ReservoirWaterBalance"
      to: "reservoir_water_level"
      kind: "writes_state"
      brief: "Updates upstream water-surface level from net storage change via the area-elevation curve."
    - from: "reservoir_water_level"
      to: "BreachHydraulics"
      kind: "reads_state"
      brief: "Head over the breach = upstream WSL minus breach bottom elevation."
    - from: "breach_bottom_width"
      to: "BreachHydraulics"
      kind: "reads_state"
      brief: "Breach bottom width sets the base of the flow cross-section."
    - from: "breach_bottom_elevation"
      to: "BreachHydraulics"
      kind: "reads_state"
      brief: "Breach bottom elevation fixes the invert and the head over the breach."
    - from: "breach_side_slope"
      to: "BreachHydraulics"
      kind: "reads_state"
      brief: "Breach side slope completes the trapezoidal flow cross-section."
    - from: "BreachHydraulics"
      to: "breach_discharge"
      kind: "writes_state"
      brief: "Computes instantaneous breach (and spillway) discharge."
    - from: "PipingOrificeFlow"
      to: "breach_discharge"
      kind: "writes_state"
      brief: "Piping-mode orifice discharge prior to conduit-roof collapse."
    - from: "WaveWindOvertopping"
      to: "BreachHydraulics"
      kind: "invokes"
      brief: "Adds wave/wind overtopping contributions to the coastal breach hydraulics."
    - from: "BreachHydraulics"
      to: "SedimentTransportNoncohesive"
      kind: "invokes"
      brief: "Breach bed shear / transport capacity drives non-cohesive erosion."
    - from: "BreachHydraulics"
      to: "ErosionCohesive"
      kind: "invokes"
      brief: "Breach bed shear stress drives cohesive excess-shear erosion."
    - from: "BreachHydraulics"
      to: "HeadcutErosion"
      kind: "invokes"
      brief: "Overtopping discharge drives headcut migration for cohesive overtopping."
    - from: "SedimentTransportNoncohesive"
      to: "BreachGeometryEvolution"
      kind: "invokes"
      brief: "Non-cohesive erosion rate feeds breach deepening/widening."
    - from: "ErosionCohesive"
      to: "BreachGeometryEvolution"
      kind: "invokes"
      brief: "Cohesive erosion rate feeds breach deepening/widening."
    - from: "HeadcutErosion"
      to: "headcut_position"
      kind: "writes_state"
      brief: "Headcut migration advances the breach vertical face upstream."
    - from: "HeadcutErosion"
      to: "breach_bottom_elevation"
      kind: "writes_state"
      brief: "Headcut passage lowers the breach invert behind the migrating face."
    - from: "BreachGeometryEvolution"
      to: "breach_bottom_width"
      kind: "writes_state"
      brief: "Updates breach bottom width from lateral erosion, capped at embankment length."
    - from: "BreachGeometryEvolution"
      to: "breach_bottom_elevation"
      kind: "writes_state"
      brief: "Updates breach bottom elevation from vertical erosion toward the minimum bottom limit."
    - from: "BreachGeometryEvolution"
      to: "breach_top_width"
      kind: "writes_state"
      brief: "Updates breach top width derived from bottom width and side slope."
    - from: "BreachGeometryEvolution"
      to: "breach_flow_area"
      kind: "writes_state"
      brief: "Updates breach flow cross-sectional area from the evolved geometry."
    - from: "BreachGeometryEvolution"
      to: "SlopeStability"
      kind: "invokes"
      brief: "Deepened/steepened breach geometry is checked for side-slope failure."
    - from: "SlopeStability"
      to: "breach_side_slope"
      kind: "writes_state"
      brief: "Mass-wasting collapse updates the breach side slope and widens the breach."
    - from: "breach_discharge"
      to: "ReservoirWaterBalance"
      kind: "reads_state"
      brief: "Breach + spillway outflow closes the reservoir mass balance (dV/dt = Qin - Qout)."
    - from: "TimeIntegrator"
      to: "BreachHydraulics"
      kind: "invokes"
      brief: "Time loop advances breach hydraulics each step."
    - from: "TimeIntegrator"
      to: "BreachGeometryEvolution"
      kind: "invokes"
      brief: "Time loop advances erosion/geometry integration each step."
    - from: "TimeIntegrator"
      to: "ReservoirWaterBalance"
      kind: "invokes"
      brief: "Time loop advances reservoir routing each step."
    - from: "breach_discharge"
      to: "Outputs"
      kind: "produces_output"
      brief: "Breach discharge written to the output hydrograph."
    - from: "breach_bottom_width"
      to: "Outputs"
      kind: "produces_output"
      brief: "Breach bottom width time series written to output."
    - from: "breach_bottom_elevation"
      to: "Outputs"
      kind: "produces_output"
      brief: "Breach bottom elevation time series written to output."
    - from: "breach_top_width"
      to: "Outputs"
      kind: "produces_output"
      brief: "Breach top width time series written to output."

states:
  variables:
    - name: "breach_bottom_elevation"
      unit: "m above base"
      role: "prognostic"
    - name: "breach_bottom_width"
      unit: "m"
      role: "prognostic"
    - name: "breach_top_width"
      unit: "m"
      role: "diagnostic"
    - name: "breach_side_slope"
      unit: "V/H"
      role: "prognostic"
    - name: "breach_flow_area"
      unit: "m2"
      role: "diagnostic"
    - name: "headcut_position"
      unit: "m"
      role: "prognostic"
    - name: "reservoir_water_level"
      unit: "m above base"
      role: "prognostic"
    - name: "downstream_water_level"
      unit: "m above base"
      role: "diagnostic"
    - name: "breach_discharge"
      unit: "m3/s"
      role: "diagnostic"
    - name: "spillway_gate_discharge"
      unit: "m3/s"
      role: "diagnostic"
    - name: "bed_shear_stress"
      unit: "Pa"
      role: "diagnostic"
    - name: "erosion_rate"
      unit: "m/s"
      role: "diagnostic"
    - name: "cumulative_breach_volume"
      unit: "m3"
      role: "accumulator"
    - name: "sediment_discharge"
      unit: "m3/s"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "breach_discharge"
    validation_rank: 1
    unit: "m3/s"
    description: "Breach water outflow hydrograph (discharge through the breach over time); the primary validation target."
    emitted_in: "casename.out (column 2)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Observed breach hydrographs (esp. historical-dam-failure reconstructions) are sparse and uncertain; magnitude + timing of peak often the only robust comparables."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Many cases only report peak breach discharge as a single scalar (e.g., Banqiao ~78,800 m3/s); compare peak magnitude, not the full series."
      detrending_options: ["none"]
  - var: "breach_bottom_width"
    validation_rank: 4
    unit: "m"
    description: "Earthen embankment soil-breach bottom width; grows as erosion progresses, capped at embankment length."
    emitted_in: "casename.out (column 7)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Final breach width is the most commonly observed value; intermediate widths rarely measured."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats: []
      detrending_options: ["none"]
  - var: "breach_top_width"
    validation_rank: 5
    unit: "m"
    description: "Earthen embankment soil-breach top width derived from bottom width and side slope."
    emitted_in: "casename.out (column 8)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Field-surveyed final breach width often reported as top width; check which width an observation reports."
      detrending_options: ["none"]
  - var: "breach_bottom_elevation"
    validation_rank: 6
    unit: "m above base"
    description: "Earthen embankment breach-bed elevation; decreases from crest toward base as the breach erodes downward."
    emitted_in: "casename.out (column 6)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Final breach invert elevation occasionally surveyed; the time history is rarely observed."
      detrending_options: ["none"]
  - var: "reservoir_water_level"
    validation_rank: 3
    unit: "m above base"
    description: "Upstream reservoir water-surface level over time; drawn down as the reservoir drains through the breach."
    emitted_in: "casename.out (column 4)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Reservoir-stage records during a breach event are rare; when available, compare drawdown rate and timing."
      detrending_options: ["none"]
  - var: "cumulative_breach_volume"
    validation_rank: 7
    unit: "m3"
    description: "Cumulative water volume released through the breach plus spillway."
    emitted_in: "casename.out (column 11)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Total released volume is bounded by reservoir storage; useful as a mass-balance sanity check more than an independent obs comparison."
      detrending_options: ["none"]
  - var: "time_to_peak_discharge"
    validation_rank: 2
    unit: "hours"
    description: "Breach water-discharge characteristic time — elapsed time from breach initiation to peak water discharge through the breach."
    emitted_in: "casename.out (derived from column 1 at peak of column 2)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["timing_accuracy"]
          determining_metric: "day_bias"
          caveats:
            - "Reported as a single characteristic time for most historical cases; compare against observed time-to-peak / failure time."
      detrending_options: ["none"]

influence:
  edges:
    - from: "soil_erodibility_coefficient (lambda / kd)"
      to: "breach_discharge"
      sensitivity_grade: HIGH
      basis: literature_quantitative
      lever_type: parameter
      applicability: "always"
