- id: dt_019
  symptom: Parsed output dates are wrong. Time series alignment with observations fails.
  diagnosis: Output date parsing assumes MM/DD instead of DD/MM; GEOtop outputs dates in DD/MM/YYYY format.
    Pandas default parse assumes MM/DD. For ambiguous dates (e.g., 05/03/2009), the wrong month is assigned.;
    ['parse_output']
  remedy: 'Use dayfirst=True when parsing dates with pandas; parse_output.py; ["Use pd.to_datetime(dates,
