template_version: "3.5"

identity:
  model_id: "MODFLOW6"
  scientific_reference_version: "MODFLOW 6 Groundwater Flow (GWF) Model — USGS TM 6-A55 (Langevin et al. 2017) on the TM 6-A57 framework (Hughes et al. 2017); GWT transport per TM 6-A61 (Langevin et al. 2022)"
  implementation:
    id: "mf6-661"
    version: "6.6.1"
    provenance: "Fortran; USGS-distributed mf6 command-line executable, control-volume finite-difference groundwater flow/transport solver."
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "CC0-1.0"
  repo_url: "https://github.com/MODFLOW-USGS/modflow6"

boundary:
  scope_in:
    - "3-D saturated groundwater flow (hydraulic head) over confined and unconfined/water-table aquifers"
    - "Newton-Raphson formulation for drying/rewetting of water-table cells"
    - "Transient and steady-state flow with specific-storage / specific-yield storage"
    - "Advection-dispersion solute transport (GWT): advection, mechanical dispersion + molecular diffusion, linear/Freundlich/Langmuir sorption, first/zero-order decay, mobile/immobile dual-domain transfer"
    - "1-D open-channel streamflow routing (SFR) with stream-aquifer exchange via Manning's equation"
    - "Standard and advanced stress boundaries (CHD, WEL, DRN, RIV, GHB, RCH, EVT, MAW, LAK, UZF)"
    - "Variable-density/viscosity coupling (BUY/VSC) and interbed compaction/subsidence (CSUB)"
  scope_out:
    - "Unit conversion — the model performs none; the user must supply consistent length/time units (wrong units give silently wrong results, no error)"
    - "Steady-state solute transport — GWT has no steady-state option; steady concentration is approximated by long transient runs"
    - "Particle-tracking / method-of-characteristics transport — GWT uses finite-difference schemes only (UPSTREAM/CENTRAL/TVD)"
    - "Unsaturated-zone physics by default (only via optional UZF package)"
  spatial: "3-D"
  temporal: "daily"
  closure: "mass-balance"
  notes: "Control-volume finite-difference (CVFD) discretization on structured (DIS), layered-unstructured (DISV), or general-unstructured (DISU) grids; a cell may connect to any number of neighbors. GWF closes a cell-by-cell volumetric water budget per time step (percent discrepancy reported in the listing file); GWT closes a fully-implicit solute mass balance. TIME_UNITS is user-defined (seconds/minutes/hours/days/years); 'daily' reflects the typical operational convention, not a hardcoded step. No surface energy-balance closure; GWE thermal transport exists in the framework but is out of scope for this GWF/GWT/SFR binding."

inputs:
  forcing:
    - category: "forcing"
      name: "Areal recharge (RCH RATE)"
      unit: "m/day"
      source_kind: "forcing"
      model_input_format: "RCH package; array-based applied to highest active cell per column, or list-based per cellid"
      notes: "A RATE in LENGTH/TIME, NOT a volume. Primary inflow driving head/water-table elevation. List-based cellid with layer>0 silently injects recharge into a deep layer and leaves the water table unresponsive."
    - category: "forcing"
      name: "Evapotranspiration demand (EVT)"
      unit: "m/day"
      source_kind: "forcing"
      model_input_format: "EVT package (surface elevation, max rate, extinction depth)"
      notes: "Optional head-dependent sink representing ET withdrawal from the saturated zone."
  parameters:
    - category: "parameters"
      name: "Hydraulic conductivity tensor (K11/K22/K33)"
      unit: "m/day"
      source_kind: "calibrated"
      model_input_format: "NPF package; K (horizontal), K33 (vertical), optional angle1/2/3 rotation"
      notes: "Material-dependent (gravel 100-1000 to clay 1e-4..0.01 m/day); K33/K typically ~0.1 for layered sediments. NPF stores a pristine copy (k11input) so TVK/VSC can recompute working K each step."
    - category: "parameters"
      name: "Cell type (ICELLTYPE)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "NPF package; 0=confined (full thickness), 1=convertible (saturated thickness varies with head)"
    - category: "parameters"
      name: "Specific storage (Ss)"
      unit: "1/m"
      source_kind: "calibrated"
      model_input_format: "STO package"
      notes: "Confined transient storage term."
    - category: "parameters"
      name: "Specific yield (Sy)"
      unit: "dimensionless"
      source_kind: "calibrated"
      model_input_format: "STO package"
      notes: "Water-table drainable porosity, 0.01-0.35 for natural materials (>0.5 physically impossible)."
    - category: "parameters"
      name: "Grid geometry (TOP/BOTM, DELR/DELC)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "DIS/DISV/DISU package; TOP (2-D), BOTM (3-D), DELR/DELC cell spacing"
      notes: "BOTM must be monotonically decreasing; zero-thickness layers (TOP==BOTM) produce NaN heads."
    - category: "parameters"
      name: "Active-domain mask (IDOMAIN)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "DIS package; 1=active, 0=inactive, -1=vertical pass-through"
    - category: "parameters"
      name: "GWT dispersivity (ALH/ATH1/ATV) and diffusion"
      unit: "m (dispersivity); m2/s (diffusion)"
      source_kind: "calibrated"
      model_input_format: "DSP package; ALH longitudinal (~L/10), ATH1 transverse (~ALH/10), ATV vertical (~ALH/100), diffc"
      applicability: "GWT transport only"
    - category: "parameters"
      name: "GWT mobile-storage / sorption / decay (porosity, bulk_density, distcoef, decay)"
      unit: "porosity [-]; rho_b kg/L; Kd L/kg; lambda 1/day"
      source_kind: "calibrated"
      model_input_format: "MST package"
      applicability: "GWT transport only"
    - category: "parameters"
      name: "SFR reach geometry and roughness (rlen, rwid, rgrd, rtp, rbth, rhk, man)"
      unit: "m (length/width/thickness); dimensionless (gradient); m/day (rhk); s/m^(1/3) (Manning n)"
      source_kind: "user_provided"
      model_input_format: "SFR package per-reach connection data"
      applicability: "SFR streamflow routing only"
      notes: "rgrd must be > 0; rtp - rbth must lie above the cell BOTM."
  initial_conditions:
    - category: "initial_conditions"
      name: "Starting hydraulic head (STRT)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "IC package"
      notes: "Must be >= BOTM and within layer bounds, else cells start dry and may never rewet. Also seeds NPF saturated-thickness initialization (THICKSTRT), not only the head vector."
    - category: "initial_conditions"
      name: "Initial solute concentration"
      unit: "mg/L"
      source_kind: "user_provided"
      model_input_format: "IC package (GWT), typically 0"
      applicability: "GWT transport only"
  boundary_conditions:
    - category: "boundary_conditions"
      name: "Constant head (CHD)"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "CHD package; (cellid, head) — acts as infinite source/sink"
    - category: "boundary_conditions"
      name: "Well pumping/injection (WEL)"
      unit: "m3/day"
      source_kind: "user_provided"
      model_input_format: "WEL package; volumetric rate, negative=pumping, positive=injection"
    - category: "boundary_conditions"
      name: "Drain (DRN)"
      unit: "elevation m; conductance m2/day"
      source_kind: "user_provided"
      model_input_format: "DRN package; (cellid, elevation, conductance) — removes water when head > elevation"
    - category: "boundary_conditions"
      name: "River (RIV)"
      unit: "stage m; conductance m2/day; rbot m"
      source_kind: "user_provided"
      model_input_format: "RIV package; (cellid, stage, conductance, rbot) — rbot must be > cell BOTM and < stage"
    - category: "boundary_conditions"
      name: "General head boundary (GHB)"
      unit: "head m; conductance m2/day"
      source_kind: "user_provided"
      model_input_format: "GHB package; head-dependent flux boundary"
    - category: "boundary_conditions"
      name: "Temporal discretization (TDIS)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "TDIS package; TIME_UNITS, NPER stress periods, PERLEN, NSTP, TSMULT"
      notes: "Per-period boundary conditions held constant; steady-state vs transient set per period via the STO iss flag."
    - category: "boundary_conditions"
      name: "Solver configuration (IMS complexity preset)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "IMS package; COMPLEXITY SIMPLE/MODERATE/COMPLEX selecting linear method (CG vs BICGSTAB), under-relaxation, backtracking, DVCLOSE/RCLOSE"
      notes: "Structural switch. SIMPLE/CG fails on the asymmetric matrix produced by Newton or convertible layers; GWT must use BICGSTAB. Default SIMPLE preset: DVCLOSE=1e-3, MXITER=25, no under-relaxation."
    - category: "boundary_conditions"
      name: "Newton-Raphson formulation switch (NEWTON UNDER_RELAXATION)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "GWF model NEWTON option"
      notes: "Structural switch enabling stable drying/rewetting of unconfined cells; requires MODERATE/COMPLEX solver."
    - category: "boundary_conditions"
      name: "Output control (OC) save/print settings"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "OC package; HEAD/BUDGET SAVE/PRINT directives"
      notes: "Required to write .hds/.cbc spatial output; without it mf6 runs but emits no spatial output."
    - category: "boundary_conditions"
      name: "Advection scheme (ADV)"
      unit: "dimensionless"
      source_kind: "user_provided"
      model_input_format: "ADV package; UPSTREAM (stable), CENTRAL, or TVD (accurate)"
      applicability: "GWT transport only"

processes:
  modules:
    - name: "mf6core (driver / time loop)"
      role: "driver"
      brief: "Top controller: Mf6Initialize -> per-stress-period PrepareTimestep -> DoTimestep -> Finalize. Sequences define/allocate, read-period, model formulate/fill/converge, and output across all models, exchanges, and solution groups."
    - name: "NumericalSolution (IMS)"
      role: "integrator"
      brief: "Iterative Model Solution: assembles AMAT/RHS from all packages, runs outer Picard/Newton iterations to DVCLOSE, applies under-relaxation (simple/Cooley/delta-bar-delta) and backtracking, calls the linear solver (CG or BICGSTAB / PETSc) each inner iteration."
    - name: "GwfModel (GWF6)"
      role: "driver"
      brief: "Groundwater-flow model container; owns DIS/IC/NPF/STO/OC/OBS and optional BUY/VSC/CSUB/HFB/MVR/GNC; orchestrates package df/ar/rp/ad/cf/fc/cq/bd/ot and the volumetric budget. Owns the shared iss steady-state flag read by STO."
    - name: "NPF (Node Property Flow)"
      role: "process_solver"
      brief: "Core Darcy-flow process: computes intercell conductances from the K tensor and saturated thickness (harmonic/log/arithmetic averaging, optional XT3D), fills the symmetric flow matrix, handles Newton saturation smoothing, rewetting, and specific discharge."
    - name: "STO (Storage)"
      role: "process_solver"
      brief: "Transient storage: adds specific-storage (confined) and specific-yield (water-table) storage-change terms to the matrix/RHS; honors the steady-state iss flag and emits STO-SS / STO-SY budget terms."
    - name: "IC (Initial Conditions)"
      role: "allocator"
      brief: "Reads STRT starting heads that seed the head vector and NPF saturated-thickness initialization (incl. THICKSTRT)."
    - name: "DIS / DISV / DISU (Discretization)"
      role: "allocator"
      brief: "Builds the spatial grid: cell geometry (top/bot/area, delr/delc), IA/JA connectivity, IDOMAIN active flags; defines the node ordering used by every package."
    - name: "XT3D"
      role: "process_solver"
      brief: "Optional ghost-node-free full-tensor anisotropy / unstructured-grid flow formulation; replaces the standard NPF conductance scheme with a multi-point flux approximation."
      applicability: "when XT3D option enabled"
    - name: "BUY / VSC (Buoyancy / Viscosity)"
      role: "optional_module"
      brief: "Density- and viscosity-dependent flow: rescale NPF conductances and add buoyancy terms, coupling solute/temperature-driven density to the head solution."
      applicability: "variable-density/viscosity runs only"
    - name: "CSUB (Subsidence / Compaction)"
      role: "optional_module"
      brief: "Computes elastic/inelastic interbed compaction and aquifer storage from head changes; adds storage-change terms and produces subsidence output."
      applicability: "subsidence runs only"
    - name: "Boundary packages (CHD/WEL/DRN/RIV/GHB/RCH/EVT)"
      role: "process_solver"
      brief: "Standard stress packages adding head-dependent or specified fluxes to the matrix/RHS; CHD sets constant heads; each emits its own budget term."
    - name: "Advanced packages (MAW/SFR/LAK/UZF)"
      role: "process_solver"
      brief: "Multi-aquifer wells, streamflow routing, lakes, and unsaturated-zone flow — internally iterated conduit/surface-water states coupled to the aquifer and to MVR."
      applicability: "when the corresponding advanced package is active"
    - name: "MVR / GNC / HFB"
      role: "optional_module"
      brief: "Water Mover transfers flow between provider/receiver packages; Ghost-Node Correction adds off-diagonal matrix terms for grid nonalignment; Horizontal Flow Barrier reduces conductance across faults."
      applicability: "when the corresponding option is active"
    - name: "GWT transport (ADV/DSP/MST/SSM)"
      role: "process_solver"
      brief: "Solute transport model: ADV advection (UPSTREAM/CENTRAL/TVD), DSP hydrodynamic dispersion, MST mobile storage/sorption/decay, SSM source-sink mixing from GWF stress packages; solved fully implicitly on the same grid as GWF."
      applicability: "GWT transport runs only"
    - name: "OC / OBS / Budget"
      role: "integrator"
      brief: "Output Control governs HEAD/BUDGET save/print; OBS records continuous observations; Budget assembles and prints the volumetric mass balance and percent discrepancy."
  internal_edges:
    - from: "mf6core (driver / time loop)"
      to: "NumericalSolution (IMS)"
      kind: "invokes"
      brief: "Driver calls the outer-iteration solve once per timestep per solution group."
    - from: "NumericalSolution (IMS)"
      to: "GwfModel (GWF6)"
      kind: "invokes"
      brief: "Solution calls model formulate/fill and convergence-check routines each outer iteration."
    - from: "IC (Initial Conditions)"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "STRT starting heads initialize the dependent-variable head vector."
    - from: "IC (Initial Conditions)"
      to: "NPF (Node Property Flow)"
      kind: "invokes"
      brief: "NPF reads IC STRT to set initial saturated thickness / THICKSTRT."
    - from: "DIS / DISV / DISU (Discretization)"
      to: "NPF (Node Property Flow)"
      kind: "invokes"
      brief: "DIS supplies cell top/bot/area and IA/JA connectivity used to compute conductances."
    - from: "NPF (Node Property Flow)"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "NPF fills intercell conductances into the symmetric flow matrix that solves for head."
    - from: "NPF (Node Property Flow)"
      to: "cell_saturation"
      kind: "writes_state"
      brief: "Saturated thickness/saturation recomputed from current head via quadratic smoothing under Newton."
    - from: "hydraulic_head"
      to: "NPF (Node Property Flow)"
      kind: "reads_state"
      brief: "NPF reads the current head iterate to recompute saturated thickness and conductances."
    - from: "STO (Storage)"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "STO adds specific-storage and specific-yield storage-change terms to the matrix/RHS; skipped when iss=1 (steady)."
    - from: "Boundary packages (CHD/WEL/DRN/RIV/GHB/RCH/EVT)"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "Stress packages add fluxes / constant-head constraints to the linear system."
    - from: "Boundary packages (CHD/WEL/DRN/RIV/GHB/RCH/EVT)"
      to: "Inputs"
      kind: "consumes_input"
      brief: "Stress packages read RCH/CHD/WEL/DRN/RIV/GHB/EVT input data per stress period."
    - from: "BUY / VSC (Buoyancy / Viscosity)"
      to: "NPF (Node Property Flow)"
      kind: "writes_state"
      brief: "Viscosity rescales NPF working K from the stored pristine k11input each step; buoyancy adds density-driven terms to NPF's formulation (undocumented K mutation)."
    - from: "XT3D"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "XT3D replaces the standard NPF conductance fill with a multi-point flux approximation in the flow matrix."
    - from: "MVR / GNC / HFB"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "GNC adds off-diagonal matrix entries; HFB reduces saturated conductance across faces; both alter the assembled flow system."
    - from: "MVR / GNC / HFB"
      to: "Advanced packages (MAW/SFR/LAK/UZF)"
      kind: "invokes"
      brief: "Water Mover transfers available flow between provider/receiver packages (WEL/DRN/SFR/LAK/MAW/UZF)."
    - from: "Advanced packages (MAW/SFR/LAK/UZF)"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "Advanced packages couple their internal surface/conduit states to the aquifer matrix."
    - from: "Advanced packages (MAW/SFR/LAK/UZF)"
      to: "stream_stage_and_flow"
      kind: "writes_state"
      brief: "SFR computes stream stage from Manning's equation and routes flow downstream through connected reaches."
    - from: "CSUB (Subsidence / Compaction)"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "Subsidence adds head-dependent storage/compaction terms to the matrix and budget."
    - from: "NumericalSolution (IMS)"
      to: "hydraulic_head"
      kind: "writes_state"
      brief: "Linear/Newton solve updates the head vector; previous-timestep head retained for the storage term."
    - from: "GwfModel (GWF6)"
      to: "STO (Storage)"
      kind: "reads_state"
      brief: "Shared steady-state flag (iss, owned by the GWF model) controls whether STO contributes storage terms in a given period."
    - from: "DIS / DISV / DISU (Discretization)"
      to: "NumericalSolution (IMS)"
      kind: "invokes"
      brief: "IDOMAIN/ibound active/inactive/constant-head flags determine which equations are assembled and solved."
    - from: "GWT transport (ADV/DSP/MST/SSM)"
      to: "solute_concentration"
      kind: "writes_state"
      brief: "Advection-dispersion-reaction operators fill the transport matrix that solves for concentration; SSM injects GWF stress-package concentrations."
    - from: "hydraulic_head"
      to: "GWT transport (ADV/DSP/MST/SSM)"
      kind: "reads_state"
      brief: "GWT consumes the GWF flow field (intercell flows) to advect solute."
    - from: "NPF (Node Property Flow)"
      to: "Outputs"
      kind: "produces_output"
      brief: "npf_cq computes intercell flows (FLOW-JA-FACE) and specific discharge (DATA-SPDIS) from converged heads."
    - from: "STO (Storage)"
      to: "Outputs"
      kind: "produces_output"
      brief: "STO-SS and STO-SY rates fed to the cell-by-cell budget."
    - from: "Boundary packages (CHD/WEL/DRN/RIV/GHB/RCH/EVT)"
      to: "Outputs"
      kind: "produces_output"
      brief: "Each package contributes a labeled cell-by-cell budget term."
    - from: "OC / OBS / Budget"
      to: "Outputs"
      kind: "produces_output"
      brief: "OC writes HEAD (.hds) and cell-by-cell budget (.cbc); OBS writes continuous observations; Budget writes the volumetric summary and percent discrepancy to the listing file."

states:
  variables:
    - name: "hydraulic_head"
      unit: "m"
      role: "prognostic"
    - name: "solute_concentration"
      unit: "mg/L"
      role: "prognostic"
    - name: "stream_stage_and_flow"
      unit: "m (stage); m3/day (flow)"
      role: "prognostic"
    - name: "cell_saturation"
      unit: "dimensionless"
      role: "diagnostic"
    - name: "intercell_flow (FLOW-JA-FACE)"
      unit: "m3/day"
      role: "diagnostic"
    - name: "specific_discharge (qx,qy,qz)"
      unit: "m/day"
      role: "diagnostic"
    - name: "storage_change (STO-SS / STO-SY)"
      unit: "m3/day"
      role: "diagnostic"
    - name: "previous-timestep head (xold)"
      unit: "m"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "hydraulic_head"
    validation_rank: 1
    unit: "m"
    description: "Hydraulic head per active cell; water table is the head in the topmost active non-dry cell per column."
    emitted_in: ".hds (binary head file)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats:
            - "Compare at observation-well screen depth/layer, not the column top."
            - "Dry cells carry HDRY=1e30; mask heads>0.9e30 before any comparison."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Steady-state or single-period head; verify the cell did not go dry."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match", "magnitude_accuracy"]
          determining_metric: "csi"
          caveats:
            - "Interpolated water-table surface; mask HDRY before contouring."
      detrending_options: ["none", "linear_residual"]
  - var: "water_table_elevation"
    validation_rank: 2
    unit: "m"
    description: "Head in the topmost active non-dry cell per column; the simulated water-table surface."
    emitted_in: "derived from .hds (flopy get_water_table; nodata 1e30)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "r"
          caveats:
            - "Depth-to-water observations must be referenced to the same datum as TOP."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats: []
      detrending_options: ["none", "linear_residual"]
  - var: "cell_budget_flux_terms"
    validation_rank: 3
    unit: "m3/day"
    description: "Cell-by-cell flow terms (STO-SS, STO-SY, FLOW-JA-FACE, CHD, RCH, DRN, RIV, WEL) with sign convention positive=inflow, negative=outflow."
    emitted_in: ".cbc (binary cell-by-cell budget file)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "DRN/RIV baseflow is negative (outflow); negate before comparing to stream-gauge baseflow."
        - obs_shape: "regional_aggregate_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Sum the relevant budget term over the comparison domain (basin/zone)."
      detrending_options: ["none"]
  - var: "solute_concentration"
    validation_rank: 4
    unit: "mg/L"
    description: "GWT solute concentration per cell from advection-dispersion-reaction."
    emitted_in: ".ucn (binary concentration file)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy", "timing_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Breakthrough timing is sensitive to advection scheme (numerical dispersion in UPSTREAM)."
        - obs_shape: "spatial_snapshot"
          comparison_mode: "spatial_field_comparison"
          metric_families: ["spatial_pattern_match"]
          determining_metric: "csi"
          caveats:
            - "Plume extent depends on scale-dependent dispersivity (ALH)."
      detrending_options: ["none"]
  - var: "stream_stage"
    validation_rank: 5
    unit: "m"
    description: "SFR stream stage per reach per timestep from Manning's equation."
    emitted_in: ".sfr.stg (binary)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["temporal_pattern_match", "magnitude_accuracy"]
          determining_metric: "nse"
          caveats:
            - "Dry reaches carry DNODATA=-1e30; filter before statistics."
      detrending_options: ["none"]
  - var: "stream_aquifer_exchange"
    validation_rank: 6
    unit: "m3/day"
    description: "SFR stream-aquifer exchange (gaining/losing) and reach inflow/outflow."
    emitted_in: ".sfr.cbc"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          determining_metric: "nse"
          caveats:
            - "Compare against gauge-derived baseflow/seepage estimates, mind sign convention."
      detrending_options: ["none"]
  - var: "volumetric_budget_discrepancy"
    validation_rank: 7
    unit: "percent"
    description: "Listing-file volumetric budget summary; PERCENT DISCREPANCY is the primary convergence/balance diagnostic."
    emitted_in: ".lst (gwf.lst / mfsim.lst)"
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          determining_metric: "pbias"
          caveats:
            - "Internal self-consistency diagnostic, not an observation; |discrepancy| > 1% indicates unreliable results."
      detrending_options: ["none"]

